ebben, en ootmoedig te wandelen met uw God?","9":"De stem van de HEERE roept tot de stad (want Uw Naam ziet het wezen[1]): Hoor de roede, en wie haar besteld heeft!","10":"Zijn er niet nog, in het huis van elke goddeloze, schatten van goddeloosheid en een schaarse efa[2], die te verfoeien is?","11":"Zou ik rein zijn, met een goddeloze weegschaal en met een zak met bedrieglijke gewichten?","12":"Omdat haar rijke lieden vol zijn van geweld, en haar inwoners leugen spreken, en hun tong bedrieglijk is in hun mond,","13":"zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.","14":"U zult eten, maar niet verzadigd worden, en uw neergedrukte honger zal in uw midden blijven; en u zult aangrijpen, maar niet wegbrengen, en wat u zult wegbrengen, zal Ik aan het zwaard overgeven.","15":"U zult zaaien, maar niet maaien; u zult olijven treden, maar u met olie niet zalven, en most, maar geen wijn drinken.","16":"Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen."},"SV":{"1":"Hoort nu, wat de HEERE zegt: Maak u op, twist met de bergen, en laat de heuvelen uw stem horen.","2":"Hoort, gij bergen! den twist des HEEREN, mitsgaders gij sterke fondamenten der aarde! want de HEERE heeft een twist met Zijn volk, en Hij zal Zich met Israël in recht begeven.","3":"O Mijn volk! wat heb Ik u gedaan, en waarmede heb Ik u vermoeid? Betuig tegen Mij.","4":"Immers heb Ik u uit Egypteland opgevoerd, en u uit het diensthuis verlost; en Ik heb voor uw aangezicht henen gezonden Mozes, Aäron en Mirjam.","5":"Mijn volk! gedenk toch wat Balak, de koning van Moab, beraadslaagde, en wat hem Bileam, de zoon van Beor, antwoordde; *en* *wat* *geschied* *is* van Sittim af tot Gilgal toe, opdat gij de gerechtigheden des HEEREN kent.","6":"Waarmede zal ik den HEERE tegenkomen, *en* mij bukken voor den hogen God? Zal ik Hem tegenkomen met brandofferen, met eenjarige kalveren?","7":"Zou de HEERE een welgevallen hebben aan duizenden van rammen, aan tien duizenden van oliebeken? Zal ik mijn eerstgeborene geven *voor* mijn overtreding, de vrucht mijns buiks *voor* de zonde mijner ziel?","8":"Hij heeft u bekend gemaakt, o mens! wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoediglijk te wandelen met uw God?","9":"De stem des HEEREN roept tot de stad (want Uw Naam ziet het wezen): Hoort de roede, en wie ze besteld heeft!","10":"Zijn er *niet* nog, *in* eens ieders goddelozen huis, schatten der goddeloosheid en een schaarse efa, dat te verfoeien is?","11":"Zou ik rein zijn, met een goddeloze weegschaal en met een zak van bedriegelijke weegstenen?","12":"Dewijl haar rijke lieden vol zijn van geweld, en haar inwoners leugen spreken, en haar tong bedriegelijk is in haar mond;","13":"Zo zal Ik *u* ook krenken, u slaande, *en* verwoestende om uw zonden.","14":"Gij zult eten, maar niet verzadigd worden, en uw nederdrukking zal in het midden van u zijn; en gij zult aangrijpen, maar niet wegbrengen, en wat gij zult wegbrengen, zal Ik aan het zwaard overgeven.","15":"Gij zult zaaien, maar niet maaien; gij zult olijven treden, maar u met olie niet zalven, en most, maar geen wijn drinken.","16":"Want de inzettingen van Omri worden onderhouden, en het ganse werk van het huis van Achab; en gij wandelt in derzelver raadslagen; opdat Ik u stelle tot verwoesting, en haar inwoners tot aanfluiting; alzo zult gij de smaadheid Mijns volks dragen."},"KJV":{"1":"Hear ye now what the LORD saith; Arise, contend thou before the mountains, and let the hills hear thy voice.","2":"Hear ye, O mountains, the LORD'S controversy, and ye strong foundations of the earth: for the LORD hath a controversy with his people, and he will plead with Israel.","3":"O my people, what have I done unto thee? and wherein have I wearied thee? testify","4":"For I brought thee up out of the land of Egypt, and redeemed thee out of the house of servants; and I sent before thee Moses, Aaron, and Miriam.","5":"O my people, remember now what Balak king of Moab consulted, and what Balaam the son of Beor answered him from Shittim unto Gilgal; that ye may know the righteousness of the LORD.","6":"Wherewith shall I come before the LORD, *and* bow myself before the high God? shall I come before him with burnt offerings, with calves of a year old?","7":"Will the LORD be pleased with thousands of rams, *or* with ten thousands of rivers of oil? shall I give my firstborn *for* my transgression, the fruit of my body *for* the sin of my soul?","8":"He hath shewed thee, O man, what *is* good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","9":"The LORD'S voice crieth unto the city, and *the man of* wisdom shall see thy name: hear ye the rod, and who hath appointed","10":"Are there yet the treasures of wickedness in the house of the wicked, and the scant measure *that is* abominable?","11":"Shall I count *them* pure with the wicked balances, and with the bag of deceitful weights?","12":"For the rich men thereof are full of violence, and the inhabitants thereof have spoken lies, and their tongue *is* deceitful in their mouth.","13":"Therefore also will I make *thee* sick in smiting thee, in making *thee* desolate because of thy sins.","14":"Thou shalt eat, but not be satisfied; and thy casting down *shall be* in the midst of thee; and thou shalt take hold, but shalt not deliver; and *that* which thou deliverest will I give up to the sword.","15":"Thou shalt sow, but thou shalt not reap; thou shalt tread the olives, but thou shalt not anoint thee with oil; and sweet wine, but shalt not drink wine.","16":"For the statutes of Omri are kept, and all the works of the house of Ahab, and ye walk in their counsels; that I should make thee a desolation, and the inhabitants thereof an hissing: therefore ye shall bear the reproach of my people."}},"tsk":{"1":[{"kopje":"u","refs":["Micha 1:2","1 Sam 15:16","Jer 13:15","Amos 3:1","Hebr 3:7","Hebr 3:8"]},{"kopje":"Maak u op","refs":["Micha 6:1","Micha 6:2","Micha 6:3-5","Micha 6:6","Micha 6:7","Micha 6:8"]},{"kopje":"twist","refs":["Deut 4:26","Deut 32:1","Ps 50:1","Ps 50:4","Jes 1:2","Jer 22:29","Ezech 36:1","Ezech 36:8","Luk 19:40"]},{"kopje":"voor","refs":["Micha 1:4","Jes 2:12-14"]},{"kopje":"laat","refs":["Ezech 37:4"]}],"2":[{"kopje":"fundamenten","refs":["Deut 32:22","2 Sam 22:8","2 Sam 22:16","Ps 104:5","Spr 8:29","Jer 31:37"]},{"kopje":"een twist","refs":["Jes 1:18","Jes 5:3","Jes 43:26","Jer 2:9","Jer 2:29-35","Jer 25:31","Ezech 20:35","Ezech 20:36","Hos 4:1","Hos 12:3"]}],"3":[{"kopje":"O Mijn volk","refs":["Micha 6:5","Ps 50:7","Ps 81:9","Ps 81:14"]},{"kopje":"wat","refs":["Jer 2:5","Jer 2:31"]},{"kopje":"waarmee","refs":["Jes 43:22","Jes 43:23"]},{"kopje":"getuig","refs":["Ps 51:6","Rom 3:4","Rom 3:5","Rom 3:19"]}],"4":[{"kopje":"heb Ik opgevoerd","refs":["Ex 12:51","Ex 14:30","Ex 14:31","Ex 20:2","Deut 4:20","Deut 4:34","Deut 5:6","Deut 9:26","Neh 9:9-11","Ps 78:51-53","Ps 106:7-10","Ps 136:10","Ps 136:11","Jes 63:9-12","Jer 32:21","Ezech 20:5-9","Amos 2:10","Hand 7:36"]},{"kopje":"verlost","refs":["Deut 7:8","Deut 15:15","Deut 24:18","2 Sam 7:23"]},{"kopje":"Mozes","refs":["Ex 15:20","Ex 15:21","Num 12:1"]}],"5":[{"kopje":"gedenk","refs":["Deut 8:2","Deut 8:18","Deut 9:7","Deut 16:3","Ps 103:1","Ps 103:2","Ps 111:4","Ef 2:11"]},{"kopje":"Balak","refs":["Num 22:1","Num 25:18","Num 31:16","Deut 23:4","Deut 23:5","Joz 24:9","Joz 24:10","Openb 2:14"]},{"kopje":"Bileam","refs":["Num 31:8","2 Petr 2:15","Judas 1:11"]},{"kopje":"Sittim","refs":["Num 22:41","Num 23:13","Num 23:14","Num 23:27","Num 25:1","Num 33:49","Joz 4:19","Joz 5:9","Joz 5:10","Joz 10:42","Joz 10:43"]},{"kopje":"kent","refs":["Richt 5:11","Ps 36:11","Ps 71:15","Ps 71:16","Ps 71:19","Ps 143:11","Rom 3:25","Rom 3:26","1 Joh 1:9"]}],"6":[{"kopje":"Wa wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> thee out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> and I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and Miriam.","5":"O my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> now what <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">consulted,</span> and what <span class=\"wl wl-kjv\" data-code=\"H1109\">Balaam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1160\">Beor</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him from <span class=\"wl wl-kjv\" data-code=\"H7851\">Shittim</span> unto <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal;</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> of the LORD.","6":"Wherewith shall I come <span class=\"wl wl-kjv\" data-code=\"H6923\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3721\">bow</span> myself before the <span class=\"wl wl-kjv\" data-code=\"H4791\">high</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span> shall I come <span class=\"wl wl-kjv\" data-code=\"H6923\">before</span> him with burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> with <span class=\"wl wl-kjv\" data-code=\"H5695\">calves</span> of a <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> old?","7":"Will the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H7521\">pleased</span> with <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> or with ten <span class=\"wl wl-kjv\" data-code=\"H7233\">thousands</span> of <span class=\"wl wl-kjv\" data-code=\"H5158\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil?</span> shall I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> my <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> for my <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression,</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of my <span class=\"wl wl-kjv\" data-code=\"H990\">body</span> for the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of my soul?","8":"He hath <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> what is <span class=\"wl wl-kjv\" data-code=\"H2896\">good;</span> and what doth the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">require</span> of thee, but to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">justly,</span> and to <span class=\"wl wl-kjv\" data-code=\"H160\">love</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6800\">humbly</span> with thy God?","9":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">crieth</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the man of <span class=\"wl wl-kjv\" data-code=\"H8454\">wisdom</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H4294\">rod,</span> and who hath appointed","10":"Are <span class=\"wl wl-kjv\" data-code=\"H786\">there</span> yet the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7332\">scant</span> <span class=\"wl wl-kjv\" data-code=\"H374\">measure</span> that is abominable?","11":"Shall I count them <span class=\"wl wl-kjv\" data-code=\"H2135\">pure</span> with the <span class=\"wl wl-kjv\" data-code=\"H7562\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H3976\">balances,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H3599\">bag</span> of <span class=\"wl wl-kjv\" data-code=\"H4820\">deceitful</span> weights?","12":"For the rich <span class=\"wl wl-kjv\" data-code=\"H6223\">men</span> thereof are <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H2555\">violence,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> thereof have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">lies,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> is <span class=\"wl wl-kjv\" data-code=\"H7423\">deceitful</span> in their mouth.","13":"Therefore also will I make thee <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> in <span class=\"wl wl-kjv\" data-code=\"H5221\">smiting</span> thee, in making thee <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> because of thy sins.","14":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> but not be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied;</span> and thy casting <span class=\"wl wl-kjv\" data-code=\"H3445\">down</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee; and thou shalt take <span class=\"wl wl-kjv\" data-code=\"H5253\">hold,</span> but shalt not <span class=\"wl wl-kjv\" data-code=\"H6403\">deliver;</span> and that which thou <span class=\"wl wl-kjv\" data-code=\"H6403\">deliverest</span> will I give <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> to the sword.","15":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H2232\">sow,</span> but thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7114\">reap;</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H1869\">tread</span> the <span class=\"wl wl-kjv\" data-code=\"H2132\">olives,</span> but thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5480\">anoint</span> thee with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil;</span> and sweet <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> but shalt not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> wine.","16":"For the <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> of <span class=\"wl wl-kjv\" data-code=\"H6018\">Omri</span> are <span class=\"wl wl-kjv\" data-code=\"H8104\">kept,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in their <span class=\"wl wl-kjv\" data-code=\"H4156\">counsels;</span> that I should <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> thereof an <span class=\"wl wl-kjv\" data-code=\"H8322\">hissing:</span> therefore ye shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of my people."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"met de bergen,","tekst":"Sommigen nemen dit, als tegen de bergen, verstaande door de bergen de groten, en door de heuvelen den gemenen man; maar het schijnt dat met hier zoveel is alsof de Heere zeide: Neem de bergen als te hulp, tot getuigen. Of, doe het, voor, bij, in tegenwoordigheid, enz., want God gebiedt den profeet in het volgende, de bergen aan te spreken, tot overtuiging en beschaming der mensen; verg. Deu 4:26 , en Deu 32:1 ; idem Mic 1:2 met de aantekening."}],"2":[{"catchword":"sterke fondamenten der aarde","tekst":"Dat is, gij vastgefondeerde aarde; of, gij gronden, wortelen, afsnijdingen [gelijk Jon 2:6 ] der bergen, rotsen en klippen, die als ene vastigheid of sterkte des aardrijks zijt."},{"catchword":"twist met Zijn volk,","tekst":"Of, pleit, rechtzaak. Verg. Isa 1:18 , en Isa 5:3-4 , en Isa 43:26 , met de aantekening."}],"3":[{"catchword":"wat heb Ik u gedaan,","tekst":"Verg. Jer 2:5 , Jer 2:31 ."},{"catchword":"vermoeid","tekst":"Of, moede gemaakt, ben Ik u moeilijk, lastig geweest? alsof de Heere zeide: Gij zijt immers in uwe conscientiën overtuigd, dat Ik u nooit kwaad, maar integendeel alles goeds heb gedaan; wat reden hebt gij dan dat gij u zo afkerig en wrevelig tegen mij gedraagt?"}],"4":[{"catchword":"diensthuis verlost;","tekst":"Hebr. huis der dienstknechten, of slaven, gelijk dikwijls. Zie Exo 20:2 ."},{"catchword":"henen gezonden Mozes, Aäron","tekst":"Om u in het geestelijke en lichamelijke te geleiden en te helpen. Zie Isa 63:11-12 ."},{"catchword":"Mirjam","tekst":"Die ook ene profetes was. Zie Exo 15:20 ; Num 12:2 ."}],"5":[{"catchword":"beraadslaagde,","tekst":"Hoe hij met alle middelen mijn vloek over u zocht te brengen, en hoe Ik dien in zulk een heerlijken zegen veranderde. Zie Num 22:5 , en Num 23:7 , en Num 24:1 , Num 24:14 ; Deu 23:4-5 ; Jos 24:9-10 ; Rev 2:14 ."},{"catchword":"Sittim","tekst":"Waar gij zo schandelijk hoereerdet met den Baäl-Peor, Num 25 ."},{"catchword":"Gilgal","tekst":"Waar Ik, volgens mijne beloften, u, niettegenstaande uw veelvoudige ondankbaarheid, droogvoets door de Jordaan geleid en in het beloofde land gebracht hebbende, mijn verbond als opnieuw met u bevestigd heb door de besnijdenis. Zie Jos 3 en Jos 5:2 ."},{"catchword":"gerechtigheden des HEEREN kent","tekst":"Dat is, de rechtvaardige daden, die de Heere voor u gedaan heeft tegen uwe vijanden, verlenende u die heerlijke overwinningen, van de koningen der Midianieten, idem Sihon en Og. Zie Num 31:7-8 ; Deu 2:33 , en Deu 3:3 . Sommigen verstaan door de gerechtigheden des Heeren zijn grote getrouwheid in het houden zijner beloften, of zijn oneindige barmhartigheid. Verg. Jdg 5:11 ; 1Sa 12:7 ; Dan 9:16 , met de aantekening."}],"6":[{"catchword":"Waarmede zal ik den HEERE","tekst":"Hier wordt het volk ingevoerd, als antwoordende op de voorgaande woorden van den profeet, en vragende wat zij dan zouden moeten doen, dat God behagen mocht."},{"catchword":"tegenkomen,","tekst":"Dat is, bejegenen, tegemoet gaan. Alzo wordt het Hebr. woord genoemn, Deu 23:4 ; Neh 13:2 , enz.; of voorkomen, dat is, zijn toorn en straf ontgaan."},{"catchword":"hogen God?","tekst":"Hebr. den God der hoogheid."},{"catchword":"eenjarige kalveren?","tekst":"Hebr. zonen, of kinderen van een jaar."}],"7":[{"catchword":"Zou de HEERE een welgevallen hebben aan duizenden van rammen,","tekst":"Dit kan men nemen als het antwoord van den profeet op de voorgaande vraag van het volk, waarop hij met deze manier van vragen wel uitdrukkelijk ontkent dat het met het uiterlijk offeren zou te doen zijn, al deden zij dat nog zoveel."},{"catchword":"Zal ik mijn eerstgeborene geven voor mijn overtreding,","tekst":"Tegenbewijs des volks, alsof zij zeiden: Is het met beesten te offeren niet te doen, zullen wij dan mensen, ja onze eerstgeboren zonen, offeren? Zouden wij daarmede den vrede met God kunnene maken? Gelijk zij gewoon waren hunne kinderen, op zijn heidens, den afgoden te offeren; zie Lev 18:21 ; 2Ki 23:10 ; Jer 7:31 , en Jer 19:5-6 ; Eze 16:20-21 , en Eze 23:39 met de aantekening. Aldus drukt de profeet zeer levendig uit met hoedanige gedachten zij zwanger gingen, en waarin zij [als huichelaars] den waren godsdienst en bekering stelden."}],"8":[{"catchword":"Hij heeft","tekst":"Namelijk den Heere."},{"catchword":"bekend gemaakt, o mens","tekst":"Door zijn woord; zodat gij gene ontwetendheid kunt voorwenden, en evenwel doet gij regelrecht daartegen, [gelijk hun in het volgende verweten wordt] en dan wilt gij u nog wijsmaken dat God met uw offeren moet tevreden zijn, alsof er dan niets aan schortte en niets anders van u te eisen zij."},{"catchword":"recht te doen,","tekst":"Of, gericht. Zie Gen 18:19 ; 1Ki 10:9 ; Jer 4:2 met de aantekening. Deze eis Gods was zo klaar en overvloedig in zijn Woord uitgedrukt, dat zij, het tegendeel doende [gelijk zij deden] zonder alle onschuld waren."},{"catchword":"ootmoediglijk te wandelen","tekst":"Hebr. ootmoedig zijn wandelen, of zich verootmoedigen [met wandelen, of wandelende. Zie van zulke samenvoeging van twee woorden Psa 45:5 ."},{"catchword":"met uw God?","tekst":"Zie Gen 5:22 ."}],"9":[{"catchword":"stem des HEEREN roept","tekst":"Alsof de profeet zeide: Dat gij nu geheel anders doet dan gij wel weet dat God van u eist, en dat gij daarmede zijne straffen verdient en veroorzaakt, zulks wordt dagelijks door zijne profeten, en nu door mij, gepredikt en openlijk aangezegd."},{"catchword":"stad","tekst":"Jeruzalem: sommigen duiden het op Samaria uit vs.16, of op beide deze hoofdsteden."},{"catchword":"Naam ziet","tekst":"Dat is, Gij zelf, o Heere, [vol van heerlijkheid en majesteit] weet alles. Zie Deu 28:58 ."},{"catchword":"het wezen)","tekst":"Of, water is, dat is alle ding; of wat er omgaat, hoe het er gesteld is. Anders: ziet naar de wijsheid [die in de ware bekering bestaat]. Anders: de wijsheid [dat is een wijs man] zal uwen naam zien; dat is, zal merken dat Gij het zijt, dat het uwe woorden en werken zijn, en zich daarnaar regelen. Zie van het Hebr. woord Job 5:12 ."},{"catchword":"roede,","tekst":"Dat is, de profetie van Gods roede, dat is, straffen en plagen. Zie Job 9:34 ; Isa 10:5 ; Lam 3:1 met de aantekening."},{"catchword":"wie ze besteld heeft","tekst":"Dat is, dien die deze roede, of dat [kwaad] verordineerd, plaats en tijd bestemd heeft. Of, vragenderwijze: Wie heeft ze besteld? Te weten, anders dan God. Zie gelijke woorden van het zwaard des Heeren, Jer 47:7 , en verg. Isa 30:32 met de aantekening."}],"10":[{"catchword":"Zijn er niet nog,","tekst":"Of, [heeft niet] nog een ieder een goddeloos huis? [of] een huis eens goddelozen? [en] schatten der goddeloosheid? of, [met sommigen] aldus: Zijn er niet nog, in het huis der goddelozen, schatten der goddeloosheid? maar het schijnt dat de profeet ziet op de algemeenheid der boosheid, dat een ieder doorgaans met onrechtvaardigheid omging. Verg. Mic 7:2-3 , enz. Doch het Hebr. woord, [zoals het hier in den Hebr. tekst staat] kan ook genomen worden voor is, of zijn. Zie dergelijke 2Sa 14:19 , in de aantekening, waaruit deze verscheidenheid ontstaat."},{"catchword":"goddelozen huis,","tekst":"Na zoveel goddelijke waarschuwingen en kastijdingen, is het nog evenwel overal vol van goddeloosheid en onrecht."},{"catchword":"goddeloosheid","tekst":"Die met goddeloosheid, schenderij en onrecht verkregen zijn."},{"catchword":"schaarse","tekst":"Of, scherp, dat is, wat te klein is. Hebr. ene efa der magerheid."},{"catchword":"efa,","tekst":"Zie Exo 16:36 , en Deu 25:15-16 ; Eze 45:10-11 , enz."},{"catchword":"te verfoeien is?","tekst":"Of, verfoeid wordt, behoort verfoeid te worden."}],"11":[{"catchword":"Zou ik rein zijn,","tekst":"Dat is, /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
