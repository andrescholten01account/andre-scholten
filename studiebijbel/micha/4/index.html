remia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen.","2":"En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.","3":"En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het *ene* volk zal tegen het *andere* volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.","4":"Maar zij zullen zitten, ieder onder zijn wijnstok en onder zijn vijgenboom, en er zal niemand zijn die hen verschrikt; want de mond van de HEERE van de heerscharen[1] heeft *het* gesproken.","5":"Want alle volken zullen wandelen, ieder in de naam van zijn god; maar wij zullen wandelen in de Naam van de HEERE, onze God, eeuwig en altijd.","6":"Op die dag, spreekt de HEERE, zal Ik haar die kreupel was verzamelen, en haar die verdreven was bijeenbrengen, en haar die Ik geplaagd had.","7":"En Ik zal haar die kreupel was maken tot een overblijfsel, en haar die ver weg verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op de berg Sion, van nu af aan tot in eeuwigheid.","8":"En u, Schaapstoren, u Ofel van de dochter van Sion! Tot u zal komen, ja, daar zal komen de vorige heerschappij, het koninkrijk van de dochters van Jeruzalem.","9":"Nu, waarom zou u zo luid roepen? Is er geen koning onder u? Is uw Raadgever vergaan, dat smart u heeft aangegrepen, als van een barende vrouw?","10":"Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, *maar* daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.","11":"Nu zijn wel veel heidenvolken tegen u verzameld, die zeggen: Laat ze ontheiligd worden, en laat ons oog zich verlustigen aan Sion.","12":"Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.","13":"Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.","14":"Nu, verzamel u met benden, dochter van de bende, hij heeft een belegering tegen ons gelegd; zij zullen de rechter van Israël met de roede op het kinnebak slaan."},"SV":{"1":"Maar in het laatste der dagen zal het geschieden, dat de berg van het huis des HEEREN zal vastgesteld zijn op den top der bergen; en hij zal verheven zijn boven de heuvelen, en de volken zullen tot hem toevloeien.","2":"En vele heidenen zullen henengaan, en zeggen: Komt en laat ons opgaan tot den berg des HEEREN, en ten huize van den God Jakobs, opdat Hij ons lere van Zijn wegen, en wij in Zijn paden wandelen; want uit Sion zal de wet uitgaan, en des HEEREN woord uit Jeruzalem.","3":"En Hij zal onder grote volken richten, en machtige heidenen straffen, tot verre toe; en zij zullen hun zwaarden slaan tot spaden, en hun spiesen tot sikkelen; het *ene* volk zal tegen het *andere* volk geen zwaard opheffen, en zij zullen den krijg niet meer leren.","4":"Maar zij zullen zitten, een ieder onder zijn wijnstok, en onder zijn vijgeboom, en er zal niemand zijn, die ze verschrikke; want de mond des HEEREN der heirscharen heeft *het* gesproken.","5":"Want alle volken zullen wandelen, elk in den naam zijns gods; maar wij zullen wandelen in den Naam des HEEREN, onzes Gods, eeuwiglijk en altoos.","6":"Te dien dage, spreekt de HEERE, zal Ik haar, die hinkende was, verzamelen, en haar, die verdreven was, vergaderen, en die Ik geplaagd had.","7":"En Ik zal haar, die hinkende was, maken tot een overblijfsel, en haar die verre henen verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op den berg Sions, van nu aan tot in eeuwigheid.","8":"En gij Schaapstoren, gij Ofel der dochter Sions! tot u zal komen, ja, daar zal komen de vorige heerschappij, het koninkrijk der dochteren van Jeruzalem.","9":"Nu, waarom zoudt gij zo groot geschrei maken? Is er geen koning onder u? Is uw Raadgever vergaan, dat u smart, als van een barende *vrouw*, heeft aangegrepen?","10":"Lijd smart en arbeid om voort te brengen, o dochter Sions! als een barende *vrouw*; want nu zult gij *wel* uit de stad henen uitgaan, en op het veld wonen, en tot in Babel komen, *maar* aldaar zult gij gered worden; aldaar zal u de HEERE verlossen uit de hand uwer vijanden.","11":"Nu zijn wel vele heidenen tegen u verzameld, die daar zeggen: Laat ze ontheiligd worden, en laat ons oog schouwen aan Sion.","12":"Maar zij weten de gedachten des HEEREN niet, en verstaan Zijn raadslag niet; dat Hij hen vergaderd heeft als garven tot den dorsvloer.","13":"Maak u op en dors, o dochter Sions! Want Ik zal uw hoorn ijzer maken, en uw klauwen koper maken, en gij zult vele volken verpletteren; en Ik zal hunlieder gewin den HEERE verbannen, en hun vermogen den Heere der ganse aarde.","14":"Nu, rot u met benden, gij dochter der bende, hij zal een belegering tegen ons stellen; zij zullen den rechter Israëls met de roede op het kinnebakken slaan."},"KJV":{"1":"But in the last days it shall come to pass, *that* the mountain of the house of the LORD shall be established in the top of the mountains, and it shall be exalted above the hills; and people shall flow","2":"And many nations shall come, and say, Come, and let us go up to the mountain of the LORD, and to the house of the God of Jacob; and he will teach us of his ways, and we will walk in his paths: for the law shall go forth of Zion, and the word of the LORD from Jerusalem.","3":"And he shall judge among many people, and rebuke strong nations afar off; and they shall beat their swords into plowshares, and their spears into pruninghooks: nation shall not lift up a sword against nation, neither shall they learn war","4":"But they shall sit every man under his vine and under his fig tree; and none shall make *them* afraid: for the mouth of the LORD of hosts hath spoken","5":"For all people will walk every one in the name of his god, and we will walk in the name of the LORD our God for ever and ever.","6":"In that day, saith the LORD, will I assemble her that halteth, and I will gather her that is driven out, and her that I have afflicted;","7":"And I will make her that halted a remnant, and her that was cast far off a strong nation: and the LORD shall reign over them in mount Zion from henceforth, even for ever.","8":"And thou, O tower of the flock, the strong hold of the daughter of Zion, unto thee shall it come, even the first dominion; the kingdom shall come to the daughter of Jerusalem.","9":"Now why dost thou cry out aloud? *is there* no king in thee? is thy counsellor perished? for pangs have taken thee as a woman in travail.","10":"Be in pain, and labour to bring forth, O daughter of Zion, like a woman in travail: for now shalt thou go forth out of the city, and thou shalt dwell in the field, and thou shalt go *even* to Babylon; there shalt thou be delivered; there the LORD shall redeem thee from the hand of thine enemies.","11":"Now also many nations are gathered against thee, that say, Let her be defiled, and let our eye look upon Zion.","12":"But they know not the thoughts of the LORD, neither understand they his counsel: for he shall gather them as the sheaves into the floor.","13":"Arise and thresh, O daughter of Zion: for I will make thine horn iron, and I will make thy hoofs brass: and thou shalt beat in pieces many people: and I will consecrate their gain unto the LORD, and their substance unto the Lord of the whole earth.","14":"Now gather thyself in troops, O daughter of troops: he hath laid siege against us: they shall smite the judge of Israel with a rod upon the cheek."}},"tsk":{"1":[{"kopje":"in het laatste","refs":["Gen 49:1","Jes 2:1-3","Jer 48:47","Ezech 38:16","Dan 2:28","Dan 10:14","Hos 3:5","Hand 2:17","Hebr 1:2","2 Petr 3:3"]},{"kopje":"de berg","refs":["Micha 3:12","Ps 68:16","Ps 68:17","Jes 11:9","Jes 66:20","Ezech 17:22-24","Ezech 40:2","Ezech 43:12","Dan 2:35","Dan 2:44","Dan 7:14","Dan 7:18","Dan 7:22","Dan 7:27","Zach 8:3","Openb 11:15","Openb 20:4","Openb 21:1-8"]},{"kopje":"en de volken","refs":["Gen 49:10","Ps 22:28","Ps 68:30-33","Ps 72:7-11","Ps 72:16-19","Ps 86:9","Ps 110:3","Jes 11:10","Jes 27:13","Jes 43:6","Jes 49:6","Jes 49:19-23","Jes 54:2","Jes 60:3-14","Jes 66:18-23","Jer 3:17","Jer 16:19","Zef 3:9","Zef 3:10","Zach 2:11","Zach 14:16-21","Mal 1:11","Rom 11:25","Rom 11:26","Openb 15:4"]}],"2":[{"kopje":"en zeggen","refs":["Jes 2:3","Jer 31:6","Jer 50:4","Jer 50:5","Zach 8:20-23"]},{"kopje":"en wij","refs":["Deut 6:1","Ps 25:8","Ps 25:9","Ps 25:12","Jes 54:13","Matt 11:25-30","Joh 6:45","Joh 7:17","Hand 10:32","Hand 10:33","Hand 13:42","Jak 1:19-25"]},{  class=\"wl wl-kjv\" data-code=\"H2595\">spears</span> into <span class=\"wl wl-kjv\" data-code=\"H4211\">pruninghooks:</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> shall not lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> against <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> neither shall they <span class=\"wl wl-kjv\" data-code=\"H3925\">learn</span> war","4":"But they shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> under his <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> and under his fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree;</span> and none shall make them <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid:</span> for the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> hath spoken","5":"For all <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> will <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of his <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and ever.","6":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> will I <span class=\"wl wl-kjv\" data-code=\"H622\">assemble</span> her that <span class=\"wl wl-kjv\" data-code=\"H6760\">halteth,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> her that is driven <span class=\"wl wl-kjv\" data-code=\"H5080\">out,</span> and her that I have afflicted;","7":"And I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> her that <span class=\"wl wl-kjv\" data-code=\"H6760\">halted</span> a <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant,</span> and her that was cast far <span class=\"wl wl-kjv\" data-code=\"H1972\">off</span> a <span class=\"wl wl-kjv\" data-code=\"H6099\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over them in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> from henceforth, even <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.","8":"And thou, O <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of the <span class=\"wl wl-kjv\" data-code=\"H5739\">flock,</span> the strong <span class=\"wl wl-kjv\" data-code=\"H6076\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> unto thee shall it <span class=\"wl wl-kjv\" data-code=\"H857\">come,</span> even the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H4475\">dominion;</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of Jerusalem.","9":"Now why dost thou <span class=\"wl wl-kjv\" data-code=\"H7321\">cry</span> out <span class=\"wl wl-kjv\" data-code=\"H7452\">aloud?</span> is there no <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in thee? is thy <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellor</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perished?</span> for <span class=\"wl wl-kjv\" data-code=\"H2427\">pangs</span> have <span class=\"wl wl-kjv\" data-code=\"H2388\">taken</span> thee as a woman in travail.","10":"Be in <span class=\"wl wl-kjv\" data-code=\"H2342\">pain,</span> and labour to bring <span class=\"wl wl-kjv\" data-code=\"H1518\">forth,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> like a woman in <span class=\"wl wl-kjv\" data-code=\"H3205\">travail:</span> for now shalt thou go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7151\">city,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> even to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon;</span> there shalt thou be <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered;</span> there the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> thee from the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of thine enemies.","11":"Now also <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> are <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> against thee, that <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Let her be <span class=\"wl wl-kjv\" data-code=\"H2610\">defiled,</span> and let our <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> <span class=\"wl wl-kjv\" data-code=\"H2372\">look</span> upon Zion.","12":"But they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not the <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> neither <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> they his <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel:</span> for he shall <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> them as the <span class=\"wl wl-kjv\" data-code=\"H5995\">sheaves</span> into the floor.","13":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> and <span class=\"wl wl-kjv\" data-code=\"H1758\">thresh,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thine <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H6541\">hoofs</span> <span class=\"wl wl-kjv\" data-code=\"H5154\">brass:</span> and thou shalt beat in <span class=\"wl wl-kjv\" data-code=\"H1854\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2763\">consecrate</span> their <span class=\"wl wl-kjv\" data-code=\"H1215\">gain</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and their <span class=\"wl wl-kjv\" data-code=\"H2428\">substance</span> unto the <span class=\"wl wl-kjv\" data-code=\"H113\">Lord</span> of the whole earth.","14":"Now <span class=\"wl wl-kjv\" data-code=\"H1413\">gather</span> thyself in <span class=\"wl wl-kjv\" data-code=\"H1416\">troops,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H1416\">troops:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> <span class=\"wl wl-kjv\" data-code=\"H4692\">siege</span> against us: they shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with a <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> upon the cheek."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"laatste der dagen zal het geschieden,","tekst":"In de tijd van het Nieuwe Testament, of de komst van de beloofde Messias, onze Heere Jezus Christus; zie Isa 2:2-5 ; alwaar deze profetie bijkans met dezelfde woorden is verhaald. Zie de aantekening aldaar."},{"catchword":"top der bergen;","tekst":"Hebr. hoofd."}],"3":[{"catchword":"grote volken richten,","tekst":"Of, velen."},{"catchword":"straffen,","tekst":"Of, bestraffen."},{"catchword":"tot verre toe;","tekst":"Tot aan de einden van de aarde. Zie Psa 2:8 , met de aantekening."},{"catchword":"ene volk zal tegen het andere volk geen zwaard opheffen,","tekst":"Hebr. volk tegen volk zullen geen zwaard opheffen."}],"4":[{"catchword":"Maar zij zullen zitten,","tekst":"Door deze verbloemde manieren van spreken [genomen uit 1Ki 4:25 ] , wordt afgebeeld het geestelijk vertrouwen en de vrede van de conscientiën, die de kerk van Christus heeft door het geloof in Hem; waarvan de staat van Salomo's rijk een voorbeeld was; verg. Psa 72:7 , enz; Zec 3:10 ."},{"catchword":"er zal niemand zijn, die ze verschrikke;","tekst":"Verg. Lev 26:5-6 ; Isa 11:6 , enz."},{"catchword":"gesproken","tekst":"Daarom zal het zekerlijk volbracht worden."}],"5":[{"catchword":"alle volken zullen wandelen,","tekst":"Andere volken, die zich tot Christus' gehoorzaamheid niet begeven."},{"catchword":"gods;","tekst":"Dat is, van de afgod; verg. Jon 1:5 ."},{"catchword":"wij zullen wandelen","tekst":"Die van Christus' kerk zijn, in Hem geloven en Hem volgen."},{"catchword":"Naam des HEEREN, onzes Gods,","tekst":"Dat is, godsdienst, dienst, aanroeping, geloof, vertrouwen, enz.; zie 1Ki 8:16 ; 2Ki 2:24 ."},{"catchword":"eeuwiglijk en altoos","tekst":"Dit is, in dit en het toekomende leven."}],"6":[{"catchword":"die hinkende was,","tekst":"Die lange tijd in kruis en lijden zal hebben gezeten. Zie Psa 35:15 ; Jer 20:10 ; Zep 3:19 , met de aantekening. De Hebr. woorden, hinkende, verdrevene, staan in het vrouwelijke geslacht. Versta, de dochter van Zion, uit vs.8, dat is, het overblijfsel van de Joodse kerk."},{"catchword":"geplaagd had","tekst":"Hebr. kwaad gedaan; dat is, hard behandeld, geplaagd had."}],"7":[{"catchword":"maken tot een","tekst":"Hebr. stellen."},{"catchword":"overblijfsel,","tekst":"Zodat er nog van de Joden, of Israël, een deel geloven en behouden zullen worden door de Messias. Zie Rom 11:5 ."},{"catchword":"machtig volk;","tekst":"Door de beroeping en toevoeging van de heidenen; gelijk vs.1,2."},{"catchword":"Koning over hen zijn op den berg Sions,","tekst":"Of, over henlieden regeren."},{"catchword":"nu aan tot in eeuwigheid","tekst":"Dat is, van de tijd af, dat de Heere dit genadewerk verricht; dat is, aan zijn koninkrijk zal geen einde zijn, gelijk Luk 1:33 , alzo Jer 9:6 ."}],"8":[{"catchword":"Schaapstoren,","tekst":"Hebr. Migdal eder , dat sommigen houden voor de plaats, vermeld Gen 35:21 ; waaromtrent de patriarch Jakob zich neersloeg, dichtbij, of binnen Jeruzalem gelegen. Anderen verstaan een toren, die getimmerd was op de Schaapspoort, waarvan Neh 3:1 , Neh 3:32 ; zie aldaar, en versta door deze en de volgende plaats, Jeruzalem, en voort Gods kerk, Christus' schaapstal."},{"catchword":"Ofel der dochter Sions","tekst":"Dat is, heuvel; zie 2Ch 27:3 , en 2Ch 33:14 ; Neh 3:26-27 . Het kan zijn dat de kerk van God, of het geestelijk Jeruzalem, de benaming van deze beide plaatsen heeft, vanwege de sterkte en vastigheid van de schaapstal van Christus en de verheffing of uitsteking van de kerk in de wereld. Zie Mat 5:14 , Mat 5:16 ."},{"catchword":"de vorige heerschappij,","tekst":"Het koninkrijk van Christus, het koninkrijk der hemelen, de kerk, welker Koning Christus is afgebeeld door het voorgaande koninkrijk van David, en bijzonder door het bloeiende en vrederijke koninkrijk van Salomo. Verg. vs.4 met de aantekening."},{"catchword":"dochteren van Jeruzalem","tekst":"Dat is, van het volk, van de inwoners van Jeruzalem, dat is van de kerk."}],"9":[{"catchword":"gij","tekst":"Gij hinkende dochter van Zion."},{"catchword":"zo groot geschrei maken?","tekst":"Hebr. schreien schreiende, of [met] geschrei schreien; dat is, zulk een getier van kermen en klagen maken, vanwege het lijden dat u eerst zal overkomen."},{"catchword":"Koning onder u?","tekst":"Alsof God zeide: Het zal wel niet anders schijnen dan of gij geen koning noch raadgever had, wanneer gij in de Babylonische gevangenschap zult moeten doorgaan; maar Hij is daarom niet verloren, Hij zal zich op zijn tijd opoenbaren en zijn rijk onder u herstellen."},{"catchword":"Raadgever vergaan,","tekst":"Verg. Isa 9:5 op het woord Raad."}],"10":[{"catchword":"om voort te brengen, o dochter Sions","tekst":"Gelijk een vrouw, die in arbeid is om een vrucht ter wereld te brengen; gij hebt er reden toe, het moet vooreerst zo zijn, maar de uitkomst zal blijde zijn; verg. Isa 26:17-19 ."},{"catchword":"nu zult gij wel uit de stad henen uitgaan,","tekst":"Dat is, al haast. Zie Hos 10:3 . Alzo onder Mic 5:3 , en Mic 7:10 ."},{"catchword":"veld wonen,","tekst":"Buiten uw land gaan dolen en verstrooid worden."},{"catchword":"HEERE verlossen","tekst":"Tot een bewijs dat uw koning behouden is, en tot een voorbeeld van de geestelijke verlossing en oprichting van het koninkrijk van Christus, die de ware losser en rantsoeneerder van zijn volk is. Zie. Gen 48:16 ; Job 19:25 ; Isa 59:20 ."},{"catchword":"hand uwer vijanden","tekst":"Hebr. palm."}],"11":[{"catchword":"u verzameld,","tekst":"O Zion, of dochter van Zion."},{"catchword":"ontheiligd worden,","tekst":"Door bloedvergieten, schenden, plunderen en allerlei verwoesten. Zie Num 35:33 ; Psa 106:38 , en verg. Eze 7:21 met de aantekening."},{"catchword":"schouwen aan Sion","tekst":"Te weten onze wens of lust, in hun ongeluk of verderf. Verg. Psa 22:18 ."}],"12":[{"catchword":"zij weten de gedachten des HEEREN niet,","tekst":"De heidenen, Jeruzalems vijanden."},{"catchword":"garven tot den dorsvloer","tekst":"Wanneer Hij de vijanden zal gebruikt hebben omn zijn volk door hen te tuchtigen en te verootmoedigen dat Hij dan een schrikkelijk oordeel over die vijanden zal uitvoeren. Verg. Isa 21:10 , en Jer 51:33 ; Joe 3:13-14 met de aantekening aldaar."}],"13":[{"catchword":"Maak u op en dors, o dochter Sions","tekst":"Om uw verdrukkers en vijanden te vertreden en te vernielen, door de kracht van uw Hoofd en Koning Jezus Christus. Verg. Isa 41:15-16 ."},{"catchword":"hoorn","tekst":"Dat is, uw macht onverwinnelijk maken. Zie Deu 33:17 ."},{"catchword":"maken,","tekst":"Hebr. stellen, alzo in het volgende."},{"catchword":"gewin den HEERE verbannen,","tekst":"Dit zit op het gebruik van het verbannen ener natie, als wanneer het volk vernield werd en hun goed de Heere toebehoorde. Zie Deu 2:34 ; Jos 6:17-19 , en verg. verder Zec 14:20 ."}],"14":[{"catchword":"Nu","tekst":"Alsof de Heere zeide: Maar dewijl het voor deze tijd, om uw zonden wil, alzo moet gaan, gelijk vs.10,11 gezegd is, zo zal het al vergeefs zijn, wat gij daartegen met al uw gewoel zoudt mogen voornemen, want gij moet toch naar Babel. Het is een aanspraak tot de inwoners van Jerzualem, met wie de profeet in de volgende woorden zich samenvoegt door het woord ons. Doch sommigen houden het voor een spotachtige aanspraak aan de Babyloniërs, alsof God zeide: Doet vrij uw best, gij krijgers van Babel [gelijk gij dan ook voorzeker doen zult], evenwel zult gij daardoor mijn genadewerk, dat Ik voorheb [waarvan in het volgende hoofdstuk], niet kunnen beletten. anders: nu zult gij met benden samengehoopt, samengepakt worden, te weten, door de belegering, gelijk volgt. Dit vers hechten sommigen aan het volgende hoofdstuk als het eerste vers daarvan."},{"catchword":"rot u met benden,","tekst":"Dat is, doe uw best, met al uw krijgsmacht."},{"catchword":"dochter der bende,","tekst":"Dat is, gij krijgers, die gij meent in de krijg zo ervaren en met krijgdsvolk zo voorzien te zijn dat gij geen vijand hebt te vrezen; of gij die gewoon zijt met benden en troepen uit te lopen om, als struikrovers en straatschenders, de reizende lieden te beroven, gelijk Micha 2:8. Zie van het Hebr. woord, betekenende een bende, of troep van soldaten, enz. 2Sa 3:22 ; Jer 18:22 , en verg. Israëls voorbeeld, Hos 4:2 , en Hos 6:9 , en Hos 7:1 . aangaande de manier van spreken, dochter der bende, verg. Job 5:7 , en Zec 4:14 ."},{"catchword":"hij zal een belegering tegen ons stellen;","tekst":"De vijand, de koning van Babel. Dit zijn woorden van de profeet alsof hij zeide: Dit zal ons voorzeker overkomen, gij doet er tegen wat gij wilt of moogt."},{"catchword":"rechter Israëls met de roede op het kinnebakken slaan","tekst":"Dat is, de regenten, of gouverneurs openbare schande en smaadheid aandoen. Zie 1Ki 22:24 ; Job 16:10 ; Psa 3:8 ; Lam 3:30 met de aantekening. Dit was een teken dat hun aardse koninkrijk een einde zou nemen; waartegen in het volgende de belofte gedaan wordt van een nieuwe hemelse Koning, de Messias."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But in the latter days [in the time of the new Testament or of the coming of the promised Messia, our lord Jesus Christ. See Isa. 2.2, 3, 5. where this prophecie is recorded almost in the very same words. See the annotate. There] it shall come to pass&Atilde;&copy;, that the mountain of the house of the Lord shall be settled upon the top [Heb. Head] of the mountains; and he shall be exalted above the hills: and the nations shall flow unto him."}],"2":[{"catchword":null,"tekst":"And many heathens shall go and say; come and let us go up the mountain of the LORD, and to the house of the God of Jacob; that he may teach us of his wayes, and we may walk in his pathes: for the law shall go forth out of Zion, and the word of the LORD out of Jerusalem."}],"3":[{"catchword":null,"tekst":"And he shall judge among great [Or, many] nations, ad punish [or rebuke] mighty heathens, afar off: [even unto the ends of the earth. See Psa 2:8 with the annotate.] and they shall smite their swords into spades and their spear into sickes; the (one) Nation shall lift up no sword against the other, [Heb. Nation against nation shall lift up no sword] and they shall teach no war more."}],"4":[{"catchword":null,"tekst":"But they shall sit, every one under his vine, and under his fig-tree, and there shall be none to make them afraid: [compare Lev. 36.5, 6. Isa. 11] for the mouth of the LORd of hosts hath spoken (it) [therefore it shall surely come to pass]"}],"5":[{"catchword":null,"tekst":"For all nations shall walk [meaning all other nations, that do not submit to obedience of Christ] each in the name of his God; [i.e. Idol . Comp. Jon. 15.] but we will walk [we that are of Christ&acirc;&euro;&trade;s church, that believe and follow him] in the name of the Lord our God, [i.e. in his religion, worship, faith, confidence, &c. see 1 Kings 8 on verse 16. 2 Kings 2 on verse verse 24] for ever and ever: [that is, both in this life and in that to come.]"}],"6":[{"catchword":null,"tekst":"In that day saith the LORD, will I assemble her, that was halting, and gather that was banished: [i.e. that for a long time was a grievously afflicted. See Psalms and jer. 20.10. Zeph. 2.10. with the annotate. The Heb. Words halting, banished, are put in the feminine: understand the daughter of Zion, by verse 8 that is to say, the remnant of the Jewish church] and whom I had plagued [Heb. Done ill to. i.e. ill entreated, grievously afflicted and plagued.]"}],"7":[{"catchword":null,"tekst":"And I will make [Heb. Set or put] her that was battling for a remnant, [insomuch that a part yet of the Jews and Israelites, shall believe in and be saved by the Messia. See Rom. 11.5] and her that was cast away afar off, for a mighty people: [viz. by the calling and coming of the Gentiles, as above verse 1,2] and the LORd shall be king [or reign] over them upon mount Zion, from henceforth into eternity. [i.e. from that time, that the LORD shall execute this work of Grace, there shall be no end of his Kingdom: as Luk 1:33 and so Isa. 9.6.]"}],"8":[{"catchword":null,"tekst":"And thou sheep-tower [Heb. Migdal-eder, which some take to be the place mention Gen. 35.21. whereabout Jacobs his tents, close by, or within Jerusalem: others understand it of a tower built upon the sheepes-gate, spoken of Neh. 3.1, 31. see there and understand by this and the next mentioned place Jerusalem it self and consequently the church of God, Christs sheep-fold] thou Ophel [i.e. hill, or Hillock. See 2Chro. 27.3. and 33.14. Neh. 3.26, 27. it may be, that the church of God hath both these names given her, in regard of the strength and firmness of the sheep-fold of Christ, and the publick eminence of his church in the world] of the daughter of Zion, unto thee shall come; yea, there shall come, the former Dominion, the Kingdom of the daughter of Jerusalem. [i.e. of the people, or inhabitants of Jerusalem, that is of the church, which is the kingdom of Christ, the kingdom of heaven where Christ is king, typified by the kingdom past of David, and especially by that flouring and peaceable kingdom of Solom, compare above verse 4 with the annotate.]"}],"9":[{"catchword":null,"tekst":"Now wherefore shouldst thou [viz. thou halting daughter of Zion] make so great a cry, [Heb. Crying cry, or cry (with) cry, i.e. make such a nooise and complaint, keep such a stir and lamenting for the sufferings to come yet] is there no king among thee? [as if God should say; it shall seem so indeed, as if ye had neither king nor councellour left, when ye shall be carried away into the Babylonian captivity; but your King is lost, therefore he shall in due time come forth again, and reestablish his kingdom among you] is thy councellour perished, [comp. Isa. 9.5. on the word councellour] that pain, as of a travailing woman, hath seized on thee?"}],"10":[{"catchword":null,"tekst":"Endure pain and labour to bring forth, o daughter Zion as a (woman) in travail: [i.e. be content to undergo these pangs and sufferings, there is reason for it, it must first be so, before it can be otherwise; the issue will be sweet and comfortable. Compare Isa. 26. verse 17, 18, 19.] for now [that is, here long, shortly, see Hos. 10 on verse 3 and below chap. 5.4 and chap. 7.10.] thou shalt indeed go forth out of the city and dwell in the field, [i.e. go straying and wandering, forth out of thy land, and be scattered abroad] and come even into Babel, (but) there thou shalt be rescued, there the LORD shall redeem thee [in token that thy king is false still, and to typifie or shadow forth the spiritual redemption and setting up of the kingdom of Christ, the true and only redeemer of his people. See Gen. 48.16. Job 19:25. Isa. 59.20.] out of the hand [Heb. Palme] of thine enemies."}],"11":[{"catchword":null,"tekst":"Now indeed there are many heathens assembled against thee, [O Zion, or daughter of Zion] that say let her be prophaned [by bloodshed abusing, plundering and all manner of Desolation] and let our eyes look on Zion, [i.e. take pleasure and delight, in seeing their ruin and destruction. Compare Psalms 22 on verse 18.]"}],"12":[{"catchword":null,"tekst":"but they do not know the thoughts of the LORD, [they viz. the heathen, Jerusalem Enemies] and understand not his councell; that he gathered them as sheaves for the threshing floor. [after that he shall have made use of the enemies, for the chastening and humbling of his people by them, then shall he execute a terrible judgement upon those enemies. Compare Isa. 21 on verse 10. and jer. 51.33. Joel 3.13, 14. with the annotate.]"}],"13":[{"catchword":null,"tekst":"Get thee up and thresh, o daughter of Zion; [temple and crush them thy feet now, (those thine oppressour and Enemies) and that through, the power of thy own head and king Christ. Compare Isa. 41 verse 15.16] for I will make thy horn iron, [Heb. Put, or set and so in the sequel: that is, I will make thy power invinsible. See Deut. 33 on verse 17.] and thy hopfs brasse and thou shalt beat in shivers many nations; and I will banne their gain the LORD, and their substance to the LORD of all the earth; [this hath respect to the utter destruction or banning of a nation in that sort, that the people being destroyed, all their goods were consecrated to the LORD. See Deut. 2 on verse 34. Jos. 6.17, 18, 19 and compare further, Zach. 14.20.]"}],"14":[{"catchword":null,"tekst":"(4:14) Now troop together, [i.e. do your best and utmost gather and make all the forces and power you are able: as if the LORD should say, seeing, that for this time, it must needs happen so by reason of your sins as was said verse 10.11 it shall be altogether in vain, whatsoever you shall enterprise against it, strive and stir never so much to the contrary, you must away to Babel. The speech addresseth it self to the inhabitants of Jerusalem, with whom the prophet sorts himself in the sequel, by the word us. Yet some do hold this to be the speech of God deriding the Babylonians; as if he should have said: even do thy best, thou warring Babel (as doubtless thou will do) yet shalt thou not not be thereby to hinder, or retard the work of God which I intend for my people whereof in the next chapter. Other. Now shalt thou be heaped (or packt) together with troops to wit, by the siege as followeth, some do make this verse the beginning of the next chapter] thou daughter of the trop, [i.e. thou warlike nation as thou thinkst thyself to be for experience in war, and readiness of forces and provisions and therefore daring all and fearing none: or thou that art wont to make execusions with thy troops and companies, to set upon and strip the travelers and passengers as so many high-way thieves and robbers: as above chap. 2.8. see of the Hebr. W // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
