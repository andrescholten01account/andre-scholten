eeft ze van hoerenloon vergaderd, en zij zullen tot hoerenloon terugkeren.","8":"Hierom zal ik misbaar bedrijven en huilen; ik zal beroofd en naakt gaan; ik zal misbaar maken als de draken, en treuren als de jonge struisen.","9":"Want haar plagen zijn dodelijk; want zij zijn gekomen tot aan Juda; hij is geraakt tot aan de poort van mijn volk, tot aan Jeruzalem.","10":"Verkondigt het niet te Gath, weent zo jammerlijk niet; wentel u in het stof, in het huis van Afra.","11":"Ga door, u inwoonster van Safir! Met blote schaamte; de inwoonster van Zaanan gaat niet uit; rouwklaagt is *te* Beth-haezel; hij zal zijn stand van u nemen.","12":"Want de inwoonster van Maroth is ziek om het goede; want een kwaad is van de HEERE neergedaald, tot aan de poort van Jeruzalem.","13":"Span de snelle dieren aan de wagen, u inwoners van Lachis! (Deze is van de dochter van Sion het beginsel van de zonde) want in u zijn Israëls overtredingen gevonden.","14":"Daarom geef geschenken aan Morescheth-gaths; de huizen van Achzib zullen de koningen van Israël tot een leugen zijn.","15":"Ik zal u nog een erfgenaam toebrengen, u inwoonster van Maresa! Hij zal komen tot aan Adullam, *tot aan* de heerlijkheid van Israël.","16":"Maak u kaal en scheer u, om uw troetelkinderen; verwijd uw kaalheid, als de arend, omdat zij gevankelijk van u zijn weggevoerd."},"SV":{"1":"Het woord des HEEREN, dat geschied is tot Micha, den Morastiet, in de dagen van Jotham, Achaz *en* Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.","2":"Hoort, gij volken altemaal! merk op, gij aarde, mitsgaders derzelver volheid! de Heere HEERE nu zal tot een getuige zijn tegen ulieden, de Heere uit den tempel Zijner heiligheid.","3":"Want ziet, de HEERE gaat uit van Zijn plaats, en Hij zal nederdalen en treden op de hoogten der aarde.","4":"En de bergen zullen onder Hem versmelten, en de dalen gekloofd worden, gelijk was voor het vuur, gelijk wateren, die uitgestort worden in de laagte.","5":"Dit alles, om de overtreding van Jakob, en om de zonden van het huis Israëls; wie is *het* *begin* *van* de overtreding van Jakob? Is het niet Samaria? En wie *van* de hoogten van Juda? Is het niet Jeruzalem?","6":"Daarom zal Ik Samaria stellen tot een steenhoop des velds, tot plantingen eens wijngaards; en Ik zal haar stenen in de vallei storten, en haar fondamenten ontdekken.","7":"En al haar gesneden beelden zullen vermorzeld worden, en al haar hoerenbeloningen zullen met vuur verbrand worden, en al haar afgoden zal Ik stellen tot een woestheid; want zij heeft ze van hoerenloon vergaderd, en zij zullen tot hoerenloon wederkeren.","8":"Hierom zal ik misbaar bedrijven en huilen; ik zal beroofd en naakt gaan; ik zal misbaar maken als de draken, en treuren als de jonge struisen.","9":"Want haar plagen zijn dodelijk; want zij zijn gekomen tot aan Juda; hij is geraakt tot aan de poort mijns volks, tot aan Jeruzalem.","10":"Verkondigt *het* niet te Gath, weent zo jammerlijk niet; wentelt u in het stof in het huis van Afra.","11":"Ga door, gij inwoneres van Safir! met blote schaamte; de inwoneres van Zaanan gaat niet uit; rouwklage is *te* Beth-haezel; hij zal zijn stand van ulieden nemen.","12":"Want de inwoneres van Maroth is krank om des goeds wil; want een kwaad is van den HEERE afgedaald, tot aan de poort van Jeruzalem.","13":"Span de snelle dieren aan den wagen, gij inwoners van Lachis! ( deze is der dochter Sions het beginsel der zonde) want in u zijn Israëls overtredingen gevonden.","14":"Daarom geef geschenken aan Morescheth-gaths; de huizen van Achzib zullen den koningen van Israël tot een leugen zijn.","15":"Ik zal u nog een erfgenaam toebrengen, gij inwoneres van Maresa! Hij zal komen tot aan Adullam, *tot* *aan* de heerlijkheid Israëls.","16":"Maak u kaal en scheer u, om uw troetelkinderen; verwijd uw kaalheid, als de arend, omdat zij gevankelijk van u zijn weggevoerd."},"KJV":{"1":"The word of the LORD that came to Micah the Morasthite in the days of Jotham, Ahaz, *and* Hezekiah, kings of Judah, which he saw concerning Samaria and Jerusalem.","2":"Hear, all ye people; hearken, O earth, and all that therein is: and let the Lord GOD be witness against you, the Lord from his holy temple.","3":"For, behold, the LORD cometh forth out of his place, and will come down, and tread upon the high places of the earth.","4":"And the mountains shall be molten under him, and the valleys shall be cleft, as wax before the fire, *and* as the waters *that are* poured down a steep place.","5":"For the transgression of Jacob *is* all this, and for the sins of the house of Israel. What *is* the transgression of Jacob? *is it* not Samaria? and what *are* the high places of Judah? *are they* not Jerusalem?","6":"Therefore I will make Samaria as an heap of the field, *and* as plantings of a vineyard: and I will pour down the stones thereof into the valley, and I will discover the foundations","7":"And all the graven images thereof shall be beaten to pieces, and all the hires thereof shall be burned with the fire, and all the idols thereof will I lay desolate: for she gathered *it* of the hire of an harlot, and they shall return to the hire of an harlot.","8":"Therefore I will wail and howl, I will go stripped and naked: I will make a wailing like the dragons, and mourning as the owls.","9":"For her wound *is* incurable; for it is come unto Judah; he is come unto the gate of my people, *even* to Jerusalem.","10":"Declare ye *it* not at Gath, weep ye not at all: in the house of Aphrah roll thyself in the dust.","11":"Pass ye away, thou inhabitant of Saphir, having thy shame naked: the inhabitant of Zaanan came not forth in the mourning of Bethezel; he shall receive of you his standing.","12":"For the inhabitant of Maroth waited carefully for good: but evil came down from the LORD unto the gate of Jerusalem.","13":"O thou inhabitant of Lachish, bind the chariot to the swift beast: she *is* the beginning of the sin to the daughter of Zion: for the transgressions of Israel were found","14":"Therefore shalt thou give presents to Moreshethgath: the houses of Achzib *shall be* a lie to the kings of Israel.","15":"Yet will I bring an heir unto thee, O inhabitant of Mareshah: he shall come unto Adullam the glory of Israel.","16":"Make thee bald, and poll thee for thy delicate children; enlarge thy baldness as the eagle; for they are gone into captivity"}},"tsk":{"1":[{"kopje":"Micha","refs":["Micha 1:14","Micha 1:15","Jer 26:18"]},{"kopje":"Jotham","refs":["2 Kron 27:1","2 Kron 32:33","Jes 1:1","Hos 1:1"]},{"kopje":"dat","refs":["Amos 1:1","Hab 1:1"]},{"kopje":"over","refs":["Micha 1:5","Hos 4:15","Hos 5:5-14","Hos 6:10","Hos 6:11","Hos 8:14","Hos 12:2","Hos 12:3","Amos 2:4-8","Amos 3:1","Amos 3:2","Amos 6:1"]}],"2":[{"kopje":"Merk op","refs":["Micha 6:1","Micha 6:2","Deut 32:1","Ps 49:2","Ps 49:3","Ps 50:1","Jes 1:2","Jer 22:29","Mark 7:14-16","Openb 2:7","Openb 2:11","Openb 2:17","Openb 2:29","Openb 3:6","Openb 3:13","Openb 3:22"]},{"kopje":"van die volheid","refs":["Ps 24:1","Ps 50:12"]},{"kopje":"zal","refs":["Ps 50:7","Jer 29:23","Mal 2:14","Mal 3:5"]},{"kopje":"de Heere uit","refs":["Ps 11:4","Ps 28:2","Jona 2:7","Hab 2:20"]}],"3":[{"kopje":"gaat uit","refs":["Jes 26:21","Jes 64:1","Jes 64:2","Ezech 3:12","Hos 5:14","Hos 5:15"]},{"kopje":"plaats","refs":["Ps 115:3"]},{"kopje":"en treden","refs":["Job 40:7","Jes 2:10-19","Jes 25:10","Jes 63:3","Jes 63:4","Amos 4:13"]},{"kopje":"de hoogten","refs":["Deut 32:13","Deut 33:29","Hab 3:19"]}],"4":[{"kopje":"de bergen","refs":["Richt 5:4","Ps 97:5","Jes 64:1-3","Amos 9:5","Nahum 1:5","Hab 3:6","Hab 3:10","2 Petr 3:10-12","Openb 20:11"]},{"kopje":"de dalen","refs":["Zach 14:4"]},{"kopje":"zoals was voor het vuur","refs":["Ps 68:3"]}],"5":[{"kopje":"de overtreding van Jakob","refs":["2 Kon 17:7-23","2 Kron 36:14-16","Jes 50:1","Jes 50:2","Jes 59:1-15","Jer 2:17","Jer 2:19","Jer 4:18","Jer 5:25","Jer 6:19","Klaagl 5:16","1 Tess 2:15","1 Tess 2:16"]},{"kopje":"is het","refs":["1 Kon an> with the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6091\">idols</span> thereof will I <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate:</span> for she <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> it of the <span class=\"wl wl-kjv\" data-code=\"H868\">hire</span> of an <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to the <span class=\"wl wl-kjv\" data-code=\"H868\">hire</span> of an harlot.","8":"Therefore I will <span class=\"wl wl-kjv\" data-code=\"H5594\">wail</span> and <span class=\"wl wl-kjv\" data-code=\"H3213\">howl,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H7758\">stripped</span> and <span class=\"wl wl-kjv\" data-code=\"H6174\">naked:</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H4553\">wailing</span> like the <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons,</span> and <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> as the <span class=\"wl wl-kjv\" data-code=\"H1323\">owls.</span>","9":"For her <span class=\"wl wl-kjv\" data-code=\"H4347\">wound</span> is <span class=\"wl wl-kjv\" data-code=\"H605\">incurable;</span> for it is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> he is <span class=\"wl wl-kjv\" data-code=\"H5060\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even to Jerusalem.","10":"<span class=\"wl wl-kjv\" data-code=\"H5046\">Declare</span> ye it not at <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> ye not at <span class=\"wl wl-kjv\" data-code=\"H1058\">all:</span> in the house of <span class=\"wl wl-kjv\" data-code=\"H1036\">Aphrah</span> <span class=\"wl wl-kjv\" data-code=\"H6428\">roll</span> thyself in the dust.","11":"Pass ye <span class=\"wl wl-kjv\" data-code=\"H5674\">away,</span> thou <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H8208\">Saphir,</span> having thy <span class=\"wl wl-kjv\" data-code=\"H1322\">shame</span> <span class=\"wl wl-kjv\" data-code=\"H6181\">naked:</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H6630\">Zaanan</span> came not <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> in the <span class=\"wl wl-kjv\" data-code=\"H4553\">mourning</span> of <span class=\"wl wl-kjv\" data-code=\"H1018\">Bethezel;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> of you his standing.","12":"For the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H4796\">Maroth</span> waited <span class=\"wl wl-kjv\" data-code=\"H2342\">carefully</span> for <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> but <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of Jerusalem.","13":"O thou <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> <span class=\"wl wl-kjv\" data-code=\"H7573\">bind</span> the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot</span> to the swift <span class=\"wl wl-kjv\" data-code=\"H7409\">beast:</span> she is the <span class=\"wl wl-kjv\" data-code=\"H7225\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> to the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> for the <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were found","14":"Therefore shalt thou <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H7964\">presents</span> to <span class=\"wl wl-kjv\" data-code=\"H4182\">Moreshethgath:</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of <span class=\"wl wl-kjv\" data-code=\"H392\">Achzib</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H391\">lie</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of Israel.","15":"Yet will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> an <span class=\"wl wl-kjv\" data-code=\"H3423\">heir</span> unto thee, O <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitant</span> of <span class=\"wl wl-kjv\" data-code=\"H4762\">Mareshah:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto <span class=\"wl wl-kjv\" data-code=\"H5725\">Adullam</span> the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of Israel.","16":"Make thee <span class=\"wl wl-kjv\" data-code=\"H7139\">bald,</span> and <span class=\"wl wl-kjv\" data-code=\"H1494\">poll</span> thee for thy <span class=\"wl wl-kjv\" data-code=\"H8588\">delicate</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children;</span> <span class=\"wl wl-kjv\" data-code=\"H7337\">enlarge</span> thy <span class=\"wl wl-kjv\" data-code=\"H7144\">baldness</span> as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle;</span> for they are gone into captivity"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Micha","tekst":"Die onderscheiden moet worden van die anderen Micha, de zoon van Jimia, die geprofeteerd heeft ten tijde van Achab en Josafat; 1Ki 22:8 , enz.; 2Ch 18:7 , enz."},{"catchword":"Morastiet","tekst":"Zie Jer 26:18 , alwaar deze profeet en zijn profetie uitdrukkelijk gedacht wordt; zie ook onder vs.14,15."},{"catchword":"Jotham, Achaz en Jehizkia,","tekst":"Ten tijde van deze koningen heeft Jesaja ook geprofeteerd, Isa 1:1 . Zie van de regering van deze koningen 2Ki 15 . tot en met 2Ki 21 en 2Ch 27 tot en met 2Ch 33 ."},{"catchword":"gezien heeft","tekst":"Dat is, welk woord hem van God door gezichten is geopenbaard. Zie Eze 13:3 ; Amo 1:1 , enz."},{"catchword":"over Samaria en Jeruzalem","tekst":"Dat is, het koninkrijk Israël, of van de tien stammen, en het koninkrijk van Juda. Samaria was de koninklijke hoofdstad van Israël, gelijk Jeruzalem van Juda."}],"2":[{"catchword":"gij volken altemaal","tekst":"Hebr. volken, die, of zij alle, gelijk elders; een figuurlijke verdagvaarding van alle volken en creaturen, om te verschijnen en te helpen in het oordeel van God, dat Hij over zijn volk wilde uitspreken. Verg. Deu 32:1 ; Psa 50:1 ; Isa 1:2 ; Jer 6:18-19 ; Amo 3:9 . Verg. ook onder Mic 6:1-2 . Sommigen verstaan door de volken al de stammen van Gods volk, en door de aarde het land Kanaän."},{"catchword":"aarde","tekst":"Anders, land."},{"catchword":"volheid","tekst":"Gelijk Psa 24:1 ."},{"catchword":"zal tot een getuige zijn","tekst":"Of, zij ten getuige,"},{"catchword":"tegen","tekst":"Of, onder; ziende op de volken in welker tegenwoordigheid God als tegen zijn volk wilde getuigen."},{"catchword":"ulieden","tekst":"Gij van Samaria en Jeruzalem, om u in volle gericht van uw boosheid en de rechtvaardigheid van zijn straffen te overtuigen. Verg. Psa 50:7 met de aantekening."},{"catchword":"tempel zijner heiligheid","tekst":"Dat is, zijn heilige tempel, of zijn heilig paleis; zullende [om zo te spreken] afkomen uit de hemel, [waar Hij met zijn heerlijkheid woont] of uit de tempel van Jeruzalem, [waar Hij met zijn genadige tegenwoordigheid woont] niet om genade te bewijzen, maar om recht te houden. Zie Psa 11:4 ; Jon 2:4 , Jon 2:7 met de aantekening."}],"3":[{"catchword":"gaat uit van zijn plaats","tekst":"Zie Isa 26:21 met de aantekening."},{"catchword":"treden op de hoogten der aarde","tekst":"Zie Amo 4:13 ."}],"4":[{"catchword":"versmelten, en de dalen gekloofd worden","tekst":"Als de tegenwoordigheid en de toorn van dezen Rechter niet kunnende verdragen; figuurlijk gesproken, gelijk Psa 97:5 ."},{"catchword":"vuur","tekst":"Versta, smelt."},{"catchword":"wateren, die uitgestort worden","tekst":"Versta, gespleten worden, dat is die in kleine druppelen verdeeld worden en zich als verliezen, wanneer zij van de hoogte omlaag gestort worden. Verg. 2Sa 14:14 ."},{"catchword":"laagte","tekst":"Hebr. afgang, nederdaling."}],"5":[{"catchword":"Dit alles","tekst":"Dat in het voorgaande gezegd is, zal alles geschieden."},{"catchword":"wie is","tekst":"Dat is, wie zijn de voornaamste auteurs en stichters van de boosheid en afgoderij in Israël? Het zijn voorzeker die van Samaria."},{"catchword":"het begin van","tekst":"Verg. onder vs.13."},{"catchword":"de overtreding van Jakob","tekst":"Of, afval; dat is, wie zijn de auteurs en stichters van de afgodische hoogten en die het volk daartoe verleiden en met hun kwaad voorbeeld voorgaan in Juda? [zie Lev 26:30 ; Eze 20:29 .] Het zijn gewisselijk die van Jeruzalem."}],"6":[{"catchword":"steenhoop des velds","tekst":"Of, aardhoop; dat is, de stad, die nu zo prachtig en sierlijk gebouwd is, zal Ik maken tot een aardhoop, een veld dat omgewroet, omgearbeid en overhoop geworpen is, om een wijngaard daarin te planten. Verg. Mic 3:12 ."},{"catchword":"stenen","tekst":"Hun muren en gebouwen."},{"catchword":"vallei","tekst":"Dewijl Samaria op een berg gelegen was."},{"catchword":"ontdekken","tekst":"De stad omkeren, dat de fundamenten ontbloot worden en niets op zijn plaats blijft. Zie Eze 13:14 met de aantekening."}],"7":[{"catchword":"hoerenbeloningen zullen met vuur verbrand worden","tekst":"Het Hebr. woord wordt voor hoerenloon gebruikt, maar staat hier in het getal van velen. Versta hierdoor alle rijkdom en overvloed, die haar God wel gegeven had, maar zij hielden ze voor giften van hun boelen, dat is, van de Baäls of afgoden, en een beloning van hun hoererij, dat is afgoderij, waarvan zij dan weder geschenken en presenten vereerden aan de afgoden, om dezelve en hun tempels op te pronken. Zie hiervan Hos 2:4 , Hos 2:7 , Hos 2:8 , Hos 2:11 , en Hos 9:1 . Buiten dat waren zij zo snood dat zij, in plaats van hoerenloon te ontvangen, zelfs hoerenloon gaven om nieuwe afgoden en afgodische verbonden te verkijgen. Zie Eze 16:31 , Eze 16:34 , Eze 16:41 ."},{"catchword":"haar afgoden zal Ik stellen tot een woestheid","tekst":"Zie 2Sa 5:21 ."},{"catchword":"tot hoerenloon wederkeren","tekst":"Dat is, als hoerenloon verdwijnen; gelijk wij zeggen: zo gewonnen, zo geronnen. Of, men kan het duiden op de Assyriërs, die het weder zouden roven en buiten, als een gift en beloning van hunlieder afgoden, of hun hoeren daarvan lonen. Verg. Joe 3:3 ."}],"8":[{"catchword":"Hierom zal ik misbaar bedrijven en huilen","tekst":"Woorden van de profeet, gelijk Isa 21:3 , en Isa 22:4 ; Jer 4:19 , en Jer 9:1 , enz. om het volk te bewegen tot nadenken en bekering."},{"catchword":"beroofd en naakt gaan","tekst":"Of, berooid,[verg. Job 12:17 ], en naakt. Verg. Isa 20:2 met de aantekening."},{"catchword":"draken","tekst":"Zie Job 30:29 , en verg. Psa 102:7 met de aantekening."}],"9":[{"catchword":"zijn dodelijk","tekst":"Hebr. is. Alzo ook in de volgende woorden. Dat is, elkeen hare [Samaria] plagen, zij zijn alle ongeneeslijk, wanhopend."},{"catchword":"Juda","tekst":"Tot een teken dat de tien stammen al verwoest waren, en dat de vijand voorts doordrong in Juda. Verg. Isa 8:7 , Isa 8:8 , 2Ki 18:13 ."},{"catchword":"hij is geraakt tot aan de poort","tekst":"De vijand; of het, te weten kwaad, uit vs.12."},{"catchword":"mijns volks","tekst":"Hieruit leiden sommigen af dat deze profeet uit Juda geweest is, waarmede het verhaal overeenkomt, Jer 26:19 , en boven vs.1."}],"10":[{"catchword":"Gath","tekst":"Opdat de Filistijnen daarover niet juichen. Zie 2Sa 1:20 , met de aantekening."},{"catchword":"zo jammerlijk niet","tekst":"Hebr. wenende weent niet."},{"catchword":"wentelt u in het stof","tekst":"Of, besprengt u met stof, tot een teken van rouw. Verg. Jer 6:26 ; Eze 27:30 met de aantekening."},{"catchword":"in het huis van Afra","tekst":"Of, over het huis Afra, om deszelfs wil. Men leest wel van Ofra in Manasse en een ander in Benjamin. Zie Jdg 6:11 , maar Afra of Beth-Afra wordt nergens dan hier vermeld, alzo ook de volgende plaatsen Safir, Zaänan, Beth-Ezel, Maroth. Waaruit sommigen afleiden dat het verzonnen namen zijn, door welke de profeet enige bijzondere goede plaatsen heeft willen te verstaan geven, ziende op de betekenis van de woorden. Of immers dat hij gezien heeft op de betekenis van de namen van deze plaatsen, gelijk ook onder vs.14, 15. Beth-Afra is zoveel als huis des stofs, of stofhuis, stoffig huis, alsof de profeet wilde zeggen: Wentel u in het stof, [om of over die plaats] die in het stof zal nedergelegd of verwoest worden. Safir is schoon, fraai. Zaänan waar veel vee is, of [gelijk anderen] daar veel uitgang is; Beth haezel , het huis dat nabij, ter zijde, of afgezonderd, bewaard, gespaard is; Maroth bittere [plaatsen], of, bitterheden, waardoor men dorre magere plaatsen kan verstaan. Al deze plaatsen voorzegt de profeet de nakende ellenden. Sommige gissen dat Afra Efraïm beduidde; Safir Samaria,, Zaänan Zion, Beth haezel Beth el ; Maroth Ramoth in Gilead, enz."}],"11":[{"catchword":"Ga door","tekst":"Hebr. gaat ulieden door, gaat over, in gevangenschap het land henen uit. Aangaande het overtollig bijvoegsel ulieden, zie Amo 7:12 ."},{"catchword":"blote schaamte","tekst":"Hebr. ontbloot [aan] de schaamte. Zie Isa 47:2-3 ; Jer 13:22 met de aantekening aldaar."},{"catchword":"uit","tekst":"Met hun vee, om dat naar gewoonte te weiden, gelijk sommigen dit nemen. Of, zal niet kunnen uitgaan, als door de vijand benauwd, of voor hem bevreesd zijnde. Sommigen voegen het bij het volgende aldus: Is niet uitgegaan ter rouwklage van Beth haezel , als hun naburen niet kunnende beklagen of troosten, omdat ze zelf in het lijden zijn."},{"catchword":"zal zijn stand van ulieden nemen","tekst":"Dat is, God zal zijn bijstand of residentie, verblijf van ulieden wegnemen. Of hij, te weten de vijand, zal door uw ondergang gesterkt worden. Anders, [dat] zijn stand van ulieden zal ontvangen, te weten Beth haezel ; dat is, naardat het de voorgemelde schone vette plaatsen gaat, daarnaar zullen de magere naburen ook moeten varen; want als die verwoest worden, zo moeten deze die van hen de leeftocht ontvangen gebrek lijden, waarvan wijders in het volgende."}],"12":[{"catchword":"goeds wil","tekst":"Dat de ingezetenen verloren hebben, door de verwoesting van de vette aangrenzende streken, zelfs tot Jeruzalem toe. Of, dat de vijand die van Maroth zelf benomen heeft."},{"catchword":"kwaad is van den HEERE afgedaald","tekst":"De straf, te weten de verderving van het land door de Assyriërs."}],"13":[{"catchword":"Span de snelle dieren aan den wagen","tekst":"Hebr. bind of span, [het Hebr. woord wordt alleenlijk hier alzo gevonden] de wagen aan, of met het snelle dier, of kemel, of paard, postpaard. loper, of muilezel. Zie 1Ki 4:28 . De profeet wil zeggen: haast u vrij om te vluchten voor de aankomst van de Assyriërs, die u zullen komen belegeren, het zal u niet helpen. Zie 2Ki 18:14 , 2Ki 18:17 en 2Ki 19:8 ."},{"catchword":"Lachis","tekst":"Zie 2Ki 14:19 ."},{"catchword":"beginsel der zonde","tekst":"Hieruit nemen sommigen af dat deze stad de eerste geweest is in Juda, die de afgoderij van Israël of van de tien stammen heeft nagevolgd, en met haar voorbeeld Jeruzalem, en alzo voorts de andere, verdorven. Anderen duiden het op de afval van Davids huis, waarin zij de tien stammen gelijk zou geworden zij, omdat zij hun eigen koning Amazia [die voor de samenzweerders daar binnen gevlucht was] heeft laten ombrengen. Beide kan onder deze woorden wel begrepen zijn, alzo, dat zij eerst afgodisch met de tien stammen geworden zijnde, ook voorts hun eigen koning ontrouw is geworden, en hem, de koning van Israël en de samenzweerders ten gevalle, verraderlijk heeft laten vermoorden, dewijl de koning Israëls tegen Amazia krijg voerde, en vermoedelijk deze moord [naar de wijze van het verdorven Israël] gesticht had. Zie 2Ki 14:15 , 2Ki 14:19 ."},{"catchword":"Israëls overtredingen gevonden","tekst":"Dat is, van de tien stammen. Zie de voorgaande aantekening aldaar."}],"14":[{"catchword":"geschenken","tekst":"Alzo wordt het Hebr. woord [dat van] zenden [zijn oorsprong heeft] ook gebruikt 1Ki 9:16 ."},{"catchword":"Morescheth","tekst":"Zie Jer 26:18 . Anders, aan de bezitting; dat is omtrek van Gath."},{"catchword":"Gaths","tekst":"Een koninklijke stad van de Filistijnen, [gelijk boven vs.10], welker vriendschap en hulp zij zouden zoeken door geschenken, maar tevergeefs, wil de profeet zeggen. Daar was ook een stad Marescha, toebehorende aan Juda, die bij Achzib gesteld wordt, Jos 15:44 ; ook worden Gath en Marescha bij elkander gevoegd, 2Ch 11:9 . Zie aldaar."},{"catchword":"Achzib","tekst":"Zie van Achzib in Juda, Jos 15:44 , en van een ander in de stam Aser, [gelegen aan de Middellandse zee, naar sommige kaarten] Jdg 1:31 . Het kan zijn dat hier door de huizen van Achzib verstaan worden de soldaten, die de koningen van Israël nu en dan gehuurd mogen hebben van de overgebleven Kanaänieten, of dat zij met de ingezetenen van die streken een verbond mogen hebben gemaakt, en nu met hen hadden, om hen bij te staan tegen de Assyriër, doch al tevergeefs. De profeet noemt de stad Achzib alleen om de overeenkomst van de woorden Achzib en Achzab, dat is, leugen, of een leugenaar; gelijk in het volgende Marescha, en erfgenaam. Anderen verstaan, door de koningen van Israël de koningen van Juda, die over Israël of van de tien stammen overblijfsel zouden regeren, maar van de Babyloniërs uitgeroeid worden."},{"catchword":"leugen zijn","tekst":"Dat is, zullen hun faillieren, bedriegen."}],"15":[{"catchword":"erfgenaam toebrengen","tekst":"Of, erfelijke bezitter. Versta, de vijand. De profeet ziet op de betekenis van het woord Marescha en Moreschet, die hij [om enerlei betekenis van] erfenis schijnt voor een te nemen."},{"catchword":"Maresa","tekst":"Zie Jos 15:44 ; 2Ch 11:8 , en 2Ch 14:9 ; idem Jer 26:18 ; ook 2 Mach.12:35."},{"catchword":"Hij zal komen tot aan Adullam","tekst":"De nieuwe bezitter of erfgenaam, de vijand, zal doordringen tot in Juda, waar Adullam gelegen was, eertijds een koninklijke stad. Zie Jos 12:15 , en Jos 15:35 ; Neh 11:30 ."},{"catchword":"tot aan","tekst":"Dit is hier ingevoegd uit vergelijking van boven vs.9, 12."},{"catchword":"heerlijkheid Israëls","tekst":"Te weten Jeruzalem, dat de heerlijkheid van gans Israël was. Omdat deze woorden duister zijn, worden zij verscheidenlijk bij de uitleggers genomen. Anders, hij [de vijand] zal komen tot aan Adullum, de heerlijkheid van Israël; dat is, welke stad heerlijk en vermaard is in Israël, diep in het land, waar de spelonk Adullam, Davids toevlucht, nabij gelegen was."}],"16":[{"catchword":"u","tekst":"Gij inwoners van Marescha en de andere vorengemelde plaatsen. Sommigen duiden het op Jeruzalem of Zion, en de wegvoering naar Babel."},{"catchword":"kaal en scheer u","tekst":"Tot teken van grote rouw. Zie Jer 16:6 ."},{"catchword":"troetelkinderen","tekst":"Hebr. kinderen, of zoner van uw wellusten, of vermakingen; dat is, uw lieve kinderen."},{"catchword":"verwijd uw kaalheid","tekst":"Dat is, maak u zeer kaal, wijd en breed; zo kaal gelijk de arend wordt wanneer hij aan het ververen is en al zijn pluimen en veren verliest."},{"catchword":"gevankelijk van u zijn weggevoerd","tekst":"Te weten uw troetelkinderen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The word of the Lord which came to Micha [Not him that prophesied in the time of Ahab and Josaphat, who was the son of Limla 1 Kings 22.8, & 2 Chron. 18.17. &c. but] the Moraschite, [see Jer. 26 on verse 18 where expresse mention is made of this prophet and his prophecie. See also below verse 14, 15.] in the dayes of Jotham, Achaz and Jehizkia, Kings of Juda: [in whose days Isaiah also prophesied. Isa. 1.1. Of the raign these Kings, see 2 Kings from chap. 15 to 21. and 21 2 Chron. 22.33.] which he saw [i.e. which word was revealed to him of God by visions. See Ezek. 13 verse 3 and Amos 1 verse 1, &c.] Over [or, upon] Samaria and Jerusalem. [i.e. both the kingdom of Israel or ten tribes, and the kingdom of juda, samaria being the Royal Metroplis of Israel, as Jerusalem was of Juda.]"}],"2":[{"catchword":null,"tekst":"Hear, ye Nationa altogether; [Heb. Nations those, or they all. A figurative summoning of all people and creatures, for to make their appearance, and to assist in Gods court of judgement, pronouncing sentence upon his people. Comp. deut. 32.1. Psa 50:1. Isa. 1.2. jer. 6.18, 19. Amos 3.9. Compare also below chap. 6.1, 22. some BY THE Nations understand all the tribes of Gods people, and by the earth following, the land of Canaan] mark thou earth [or land] together with the fullness thereof: [as Psa 24:1,] now the Lord LORD shall be a witness [or, be a witness] against you: [or, among as having a regard to the nations in whose presence God would testifie thus against his people; meaning those Samaria and Jerusalem, whom he would convince of their wickednesse, and the righteousness of his judement, as in an open court of Judicature. Compare Psa 50:7. with the annotate] the Lord out of the temple of his holinesse. [i.e his holy temple, or, his holy palace: intending to come down, as it were, out of heaven (where his glory inhabiteth) or out of the temple of Jerusalem (where he dwelleth with his gracious presence) not for to shew grace and favour now, but to keep judgement: see Psalms 11 on verse 4. Jon. 2.7. with the annotate.]"}],"3":[{"catchword":null,"tekst":"For behold, the LORD goeth forth out of his place] [see Isa. 26.21. with the annotate.] and he shall come down, and tread upon the heights of the earth. [see Amos 4. on verse 13.]"}],"4":[{"catchword":null,"tekst":"And the mountains shall melt down under him, [as being able to undergo the presence and wrath of this Judge; figuratively spoken: as Psa 95:5.] and the valleys shall be clest, as wax before the fire, [viz. doth melt] as waters [understand are split as it were, being dasht into small drop, that they are in a manner, when they are poured out from a high place. Comp. 2 Sam. 14.14.] which are poured out into the low (ground) [Heb. Descent, going down.]"}],"5":[{"catchword":null,"tekst":"All this [viz. that is said before, it shall all come to pass&Atilde;&copy;] for the transgression of Jacob, and for the sins of the house of Israel: who is (the beginning) [compare below verse 13.] of the transgression [revolt, falling off] of Jacob? Is it not Samaria? [i.e. who are the principal authours and founders of the wickedness and Idolatry in Israel? Surely they are those of Samaria] and who (of) the high places of Juda? Is it not Jerusalem? [i.e. who are the authours and founders of the idolatrous high places, and those that seduce the people in Juda by their evil example? (see Lev. 26 on verse 30. Ezek. 20.29.) surely they are those of Jerusalem.]"}],"6":[{"catchword":null,"tekst":"Therefore will I put Samaria to (be) a stone [Or, earth] heap of the field, planting of the vineyard: [i.e. the city, which, now is built so magnificently and stately, shall be reduced into a heap of earth, cast up in the field; or become like a field, that is digged up and turned upside down: and as a place which is delved and turned turned up for the plant of a vineyard in it. Compare below chap. 3.12.] and I will precipitate her stones [the stones of their walls and buildings] into the valley; [Samaria having been seated upon a mountain] and uncover her foundation; [i.e. quite subvert and overthrow t // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
