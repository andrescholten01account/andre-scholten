-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.","2":"En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.","3":"En denkt u dit, o mens, die hen oordeelt die zulke dingen doen, en dat zelf ook doet, dat u het oordeel van God zult ontvluchten?","4":"Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?","5":"Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.","6":"Die ieder zal vergelden naar zijn werken:","7":"Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;","8":"Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, *zal* verbolgenheid en toorn *vergolden worden*;","9":"Verdrukking en benauwdheid over elke ziel van de mens die het kwade doet, eerst van de Jood, en ook van de Griek;","10":"Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.","11":"Want er is geen aanneming van het persoon bij God.","12":"Want zovelen als er zonder wet gezondigd hebben, zullen ook zonder wet verloren gaan; en zovelen als er onder de wet gezondigd hebben, zullen door de wet geoordeeld worden;","13":"(Want de hoorders van de wet zijn niet rechtvaardig voor God, maar de daders van de wet zullen gerechtvaardigd worden;","14":"Want wanneer de heidenen, die de wet niet hebben, van nature de dingen doen die van de wet zijn, dan zijn dezen, die de wet niet hebben, zichzelf een wet;","15":"Als mensen die het werk van de wet laten zien, geschreven in hun harten, terwijl hun geweten mede getuigt, en de gedachten elkaar onderling beschuldigen, of ook wel ontschuldigen).","16":"Op de dag waarop God de verborgen dingen van de mensen zal oordelen door Jezus Christus, naar mijn Evangelie.","17":"Zie, u wordt een Jood genoemd en rust op de wet, en roemt in God,","18":"En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet;","19":"En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,","20":"Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt.","21":"Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?","22":"Die zegt dat men geen overspel zal doen, doet u overspel? Die van de afgoden een afkeer hebt, plundert u het heilige?","23":"Die op de wet roemt, oneert u God door de overtreding van de wet?","24":"Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.","25":"Want de besnijdenis is wel nuttig, als u de wet doet; maar als u een overtreder van de wet bent, dan is uw besnijdenis voorhuid geworden.","26":"Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?","27":"En zal de voorhuid, die uit de natuur is, als zij de wet volbrengt, u niet oordelen, u die door de letter en besnijdenis een overtreder van de wet bent?","28":"Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;","29":"Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God."},"SV":{"1":"Daarom zijt gij niet te verontschuldigen, o mens, wie gij zijt, die *anderen* oordeelt; want waarin gij een ander oordeelt, veroordeelt gij uzelven; want gij, die *anderen* oordeelt, doet dezelfde dingen.","2":"En wij weten, dat het oordeel Gods naar waarheid is, over degenen, die zulke dingen doen.","3":"En denkt gij dit, o mens, die oordeelt dengenen, die zulke dingen doen, en dezelve doet, dat gij het oordeel Gods zult ontvlieden?","4":"Of veracht gij den rijkdom Zijner goedertierenheid, en verdraagzaamheid, en lankmoedigheid, niet wetende, dat de goedertierenheid Gods u tot bekering leidt?","5":"Maar naar uw hardigheid, en onbekeerlijk hart, vergadert gij uzelven toorn als een schat, in den dag des toorns, en der openbaring van het rechtvaardig oordeel Gods.","6":"Welke een iegelijk vergelden zal naar zijn werken;","7":"Dengenen wel, die met volharding in goeddoen, heerlijkheid, en eer, en onverderfelijkheid zoeken, het eeuwige leven;","8":"Maar dengenen, die twistgierig zijn, en die der waarheid ongehoorzaam, doch der ongerechtigheid gehoorzaam zijn, *zal* verbolgenheid en toorn *vergolden* *worden*;","9":"Verdrukking en benauwdheid over alle ziel des mensen, die het kwade werkt, eerst van den Jood, en *ook* van den Griek;","10":"Maar heerlijkheid, en eer, en vrede een iegelijk, die het goede werkt, eerst den Jood, en *ook* den Griek.","11":"Want er is geen aanneming des persoons bij God.","12":"Want zovelen, als er zonder wet gezondigd hebben, zullen ook zonder wet verloren gaan; en zovelen, als er onder de wet gezondigd hebben, zullen door de wet geoordeeld worden;","13":"( Want de hoorders der wet zijn niet rechtvaardig voor God, maar de daders der wet zullen gerechtvaardigd worden;","14":"Want wanneer de heidenen, die de wet niet hebben, van nature de dingen doen, die der wet zijn, deze, de wet niet hebbende, zijn zichzelven een wet;","15":"*Als* die betonen het werk der wet geschreven in hun harten, hun geweten medegetuigende, en de gedachten onder elkander *hen* beschuldigende, of ook ontschuldigende).","16":"In den dag wanneer God de verborgene dingen der mensen zal oordelen door Jezus Christus, naar mijn Evangelie.","17":"Zie, gij wordt een Jood genaamd en rust op de wet; en roemt op God,","18":"En gij weet *Zijn* wil, en beproeft de dingen, die *daarvan* verschillen, zijnde onderwezen uit de wet;","19":"En gij betrouwt uzelven te zijn een leidsman der blinden, een licht dergenen, die in duisternis zijn;","20":"Een onderrichter der onwijzen, *en* een leermeester der onwetenden, hebbende de gedaante der kennis en der waarheid in de wet.","21":"Die dan een anderen leert, leert gij uzelven niet? Die predikt, dat men niet stelen zal, steelt gij?","22":"Die zegt, dat men geen overspel doen zal, doet gij overspel? Die van de afgoden een gruwel hebt, berooft gij het heilige?","23":"Die op de wet roemt, onteert gij God door de overtreding der wet?","24":"Want de Naam van God wordt om uwentwil gelasterd onder de heidenen, gelijk geschreven is.","25":"Want de besnijdenis is wel nut, indien gij de wet doet; maar indien gij een overtreder der wet zijt, zo is uw besnijdenis voorhuid geworden.","26":"Indien dan de voorhuid de rechten der wet bewaart, zal niet zijn voorhuid tot een besnijdenis gerekend worden?","27":"En zal de voorhuid, die uit de natuur is, als zij de wet volbrengt, u *niet* oordelen, die door de letter en besnijdenis een overtreder der wet zijt?","28":"Want die is niet een Jood, die het in het openbaar is; noch die is de besnijdenis, die het in het openbaar in het vlees is;","29":"Maar die is een Jood, die het in het verborgen is, en de besnijdenis des harten, in den geest, niet *in* *de* letter, *is* *de* *besnijdenis*; wiens lof niet is uit de mensen, maar uit God."},"KJV":{"1":"Therefore thou art inexcusable, O man, whosoever thou art that judgest: for wherein thou judgest another, thou condemnest thyself; for thou that judgest doest the same things.","2":"But we are sure that the judgment of God is according to truth against them which commit such things.","3":"And thinkest thou this, O man, that judgest them which do such things, and doest the same, that thou shalt escape the judgment of God?","4":"Or despisest thou the riches of his goodness and forbearance and longsuffering; not knowing that the goodness of God leadeth thee to repentance?","5":"But after thy hardness and impenitent heart treasurest up unto thyself wrath against the day of wrath and revelation of the righteous judgment of God;","6":"Who will render to every man according to his deeds:","7":"To them who by patient continuance in well doing seek for glory and honour and immortality, eternal life:","8":"But unto them that are contentious, and do not obey the truth, but obey unrighteousness, indignation and wrath,","9":"Tribulation and anguish, upon every soul of man that doeth evil, of the Jew first, and also of the Gentile;","10":"But glory, honour, and peace, to every man that worketh good, to the Jew first, and also to the Gentile:","11":"For there is no respect of persons with God.","12":"For as many as have sinned without law shall also perish without law: and as many as have sinned in the law shall be judged by the law;","13":"(For not the hearers of the law *are* just before God, but the doers of the law shall be justified.","14":"For when the Gentiles, which have not the law, do by nature the things contained in the law, these, having not the law, are a law unto themselves:","15":"Which shew the work of the law written in their hearts, their conscience also bearing witness, and *their* thoughts the mean while accusing or else excusing one another;)","16":"In the day when God shall judge the secrets of men by Jesus Christ according to my gospel.","17":"Behold, thou art called a Jew, and restest in the law, and makest thy boast of God,","18":"And knowest *his* will, and approvest the things that are more excellent, being instructed out of the law;","19":"And art confident that thou thyself art a guide of the blind, a light of them which are in darkness,","20":"An instructor of the foolish, a teacher of babes, which hast the form of knowledge and of the truth in the law.","21":"Thou therefore which teachest another, teachest thou not thyself? thou that preachest a man should not steal, dost thou steal?","22":"Thou that sayest a man should not commit adultery, dost thou commit adultery? thou that abhorrest idols, dost thou commit sacrilege?","23":"Thou that makest thy boast of the law, through breaking the law dishonourest thou God?","24":"For the name of God is blasphemed among the Gentiles through you, as it is written.","25":"For circumcision verily profiteth, if thou keep the law: but if thou be a breaker of the law, thy circumcision is made uncircumcision.","26":"Therefore if the uncircumcision keep the righteousness of the law, shall not his uncircumcision be counted for circumcision?","27":"And shall not uncircumcision which is by nature, if it fulfil the law, judge thee, who by the letter and circumcision dost transgress the law?","28":"For he is not a Jew, which is one outwardly; neither *is that* circumcision, which is outward in the flesh:","29":"But he *is* a Jew, which is one inwardly; and circumcision *is that* of the heart, in the spirit, *and* not in the letter; whose praise *is* not of men, but of God."}},"tsk":{"1":[{"kopje":"Daarom","refs":["Rom 1:18-20"]},{"kopje":"o mens","refs":["Rom 2:3","Rom 9:20","1 Kor 7:16","Jak 2:20"]},{"kopje":"wie u ook bent","refs":["Rom 2:26","Rom 2:27","2 Sam 12:5-7","Ps 50:16-20","Matt 7:1-5","Matt 23:29-31","Luk 6:37","Luk 19:22","Joh 8:7-9","Jak 4:11"]},{"kopje":"want u, die anderen oordeelt","refs":["Rom 2:3","Rom 2:21-23"]}],"2":[{"kopje":"oordeel","refs":["Rom 2:5","Rom 3:4","Rom 3:5","Rom 9:14","Gen 18:25","Job 34:17-19","Job 34:23","Ps 9:5","Ps 9:8","Ps 9:9","Ps 11:5-7","Ps 36:6","Ps 36:7","Ps 96:13","Ps 98:9","Ps 145:17","Jes 45:19","Jes 45:21","Jer 12:1","Ezech 18:25","Ezech 18:29","Dan 4:37","Zef 3:5","Hand 17:31","2 Tess 1:5-10","Openb 15:3","Openb 15:4","Openb 16:5","Openb 19:2"]}],"3":[{"kopje":"denkt u","refs":["2 Sam 10:3","Job 35:2","Ps 50:21","Matt 26:53"]},{"kopje":"o mens","refs":["Rom 2:1","Dan 10:19","Luk 12:14","Luk 22:58","Luk 22:60"]},{"kopje":"dat u zult ontvluchten","refs":["Rom 1:32","Ps 56:8","Spr 11:21","Spr 16:5","Ezech 17:15","Ezech 17:18","Matt 23:33","1 Tess 5:3","Hebr 2:3","Hebr 12:25"]}],"4":[{"kopje":"veracht u","refs":["Rom 6:1","Rom 6:15","Ps 10:11","Pred 8:11","Jer 7:10","Ezech 12:22","Ezech 12:23","Matt 24:48","Matt 24:49","2 Petr 3:3"]},{"kopje":"rijkdom","refs":["Rom 9:23","Rom 10:12","Rom 11:33","Ps 86:5","Ps 104:24","Ef 1:7","Ef 1:18","Ef 2:4","Ef 2:7","Ef 3:8","Ef 3:16","Fil 4:19","Kol 1:27","Kol 2:2","1 Tim 6:17","Tit 3:4-6"]},{"kopje":"verdraagzaamheid","refs":["Rom 3:25","Rom 9:22","Ex 34:6","Num 14:18","Ps 78:38","Ps 86:15","Jes 30:18","Jes 63:7-10","Jona 4:2","1 Tim 1:16","1 Petr 3:20"]},{"kopje":"goedertierenheid","refs":["Job 33:27-30","Ps 130:3","Ps 130:4","Jes 30:18","Jer 3:12","Jer 3:13","Jer 3:22","Jer 3:23","Ezech 16:63","Hos 3:5","Luk 15:17-19","Luk 19:5-8","2 Petr 3:9","2 Petr 3:15","Openb 3:20"]}],"5":[{"kopje":"Maar naar","refs":["Rom 11:25","Ex 8: "2":[{"catchword":"wij weten","tekst":"Dat is, het is kennelijk, zelfs naar het algemeen gevoelen van alle mensen."},{"catchword":"naar waarheid","tekst":"Dat is, oprecht, niet naar den uitwendigen schijn, maar naar dat de zaak inderdaad is."}],"3":[{"catchword":"dezelve doet","tekst":"Namelijk al is het dat gij die bedekt doet, of zo onbeschaamd niet als andere."}],"4":[{"catchword":"den rijkdom Zijner","tekst":"Dat is, de grootheid en menigvuldigheid. Hier wederlegt hij degenen, die meenden dat hun zaken bij God niet kwalijk stonden, omdat God goeddeed en zegende naar de wereld, gelijk Hij de Romeinen in dien tijd bijzonder deed."},{"catchword":"goedertierenheid,","tekst":"Dit is ene eigenschap Gods, waardoor Hij zegent en weldoet, ook zelfs degenen die kwaad zijn; Mat 5:45 ."},{"catchword":"verdraagzaamheid,","tekst":"Namelijk waardoor Hij de zonden der mensen met oogluiking overziet voor een tijd, of zij zich nog zouden bekeren; Luk 3:7-8 ."},{"catchword":"lankmoedigheid,","tekst":"Namelijk waardoor Hij de straf, die zij verdienen, uitstelt totdat de maat derzelve vervuld is; Rom 9:22 ."},{"catchword":"tot bekering leidt?","tekst":"Dat is, tijd en redenen geeft om te bekeren."}],"5":[{"catchword":"hardigheid, en onbekeerlijk hart,","tekst":"Dat is, verharding in uwe zonden."},{"catchword":"vergadert gij uzelven toorn","tekst":"Dat is, verwekt meer en meer den toorn en de straf Gods als een schat, waar men dagelijks altijd meer toedoet."},{"catchword":"in den dag des toorns,","tekst":"Dat is tegen den uitersten dag, wanneer God de zonden der mensen, zelfs die bedekt zijn, voor een ieder zal openbaar maken en straffen, vs.16; 2Th 1:7 ; Rev 20:12-13 ."}],"6":[{"catchword":"vergelden zal naar zijn werken;","tekst":"Hij spreekt hier van de vergeldingen naar de beloften en dreigementen der wet, die den heidenen ook uit de natuur bekend waren, vs.15; want van de rechtvaardigmaking uit het geloof begint hij eerst te spreken Rom 3:21 . Hoewel dit ook wel toegepast kan worden op de vergelding naar de beloften en dreigementen des Evangelies, gelijk 2Co 5:10 het alzo in het algemeen gezegd wordt; overmits ook de goede werken als vruchten des geloofs, uit genade, om Christus' wil zullen vergolden worden."}],"7":[{"catchword":"volharding","tekst":"Het Griekse woord betekent ook geduldigheid; maar wordt hier bekwamelijker voor volharding of volstandigheid genomen, gelijk Mat 10:22 ; Luk 8:15 ."},{"catchword":"in goeddoen,","tekst":"Grieks des goeden werks."},{"catchword":"onverderfelijkheid zoeken,","tekst":"Dat is, de zalige onsterflijkheid."}],"8":[{"catchword":"die twistgierig zijn,","tekst":"Grieks uit twisting; dat is twistig of twistgierig; gelijk uit het geloof, Rom 3:26 ; dat is, gelovigen, en uit de besnijdenis, Rom 4:12 ; dat is besnedenen."},{"catchword":"der waarheid ongehoorzaam,","tekst":"Namelijk die hun van God door de natuur bekend is gemaakt; Rom 1:19 ."},{"catchword":"toorn vergolden worden ;","tekst":"Namelijk van God, die rechtvaardig over de zonde tot straf is onstoken."}],"9":[{"catchword":"Verdrukking en benauwdheid","tekst":"Dat is, helse pijnen en smarten, die door Gods rechtvaardigen toorn hun zullen toegezonden worden."}],"10":[{"catchword":"heerlijkheid,","tekst":"Dat is, de eeuwige zaligheid, die zij in hun leven gezocht hebben, zal hun gegeven worden, vs.7, 27."}],"11":[{"catchword":"des persoons bij God","tekst":"Grieks des aangezichts. Van deze wijze van spreken, zie breder de aantekening Mat 22:16 , en Act 10:34 ."}],"12":[{"catchword":"zonder wet gezondigd hebben,","tekst":"Dat is, de heidenen, die de geschreven wet van Mozes niet hadden."},{"catchword":"zonder wet verloren gaan;","tekst":"Dat is, veroordeeld worden uit de getuigenis van hun eigen conscientie, vs.15."},{"catchword":"onder de wet gezondigd hebben,","tekst":"Dat is, de Joden, aan welke de wet door Mozes was gegeven. Grieks in de wet."},{"catchword":"door de wet geoordeeld worden;","tekst":"Dat is, zullen naar de dreigementen van de wet geoordeeld, dat is, veroordeeld worden."}],"13":[{"catchword":"de hoorders der wet","tekst":"Dat is, die de wet alleen weten en daarvan roemen."},{"catchword":"zijn niet rechtvaardig voor God,","tekst":"Dat is, worden niet in Gods oordeel voor rechtvaardigen erkend, noch voor zulken verklaard; Psa 143:2 ; Mat 12:37 ; Rom 8:33 ."},{"catchword":"de daders der wet","tekst":"Dat is, volbrengers der wet; Gal 3:10 ; Jam 2:10 ."},{"catchword":"gerechtvaardigd worden;","tekst":"Namelijk door de wet, of naar de beloften der wet; Rom 10:5 . Doch alzo niemand de wet volkomen onderhoudt, vanwege de verdorvenheid, die in den mens is, Rom 8:3 ; Gal 3:10 , zo wordt niemand uit de wet of door zijne werken gerechtvaardigd, maar alleen door de gerechtigheid van Christus, door het geloof ons toegerekend; Rom 3:20-22 ."}],"14":[{"catchword":"de wet niet hebben,","tekst":"Namelijk de geschreven wet."},{"catchword":"de dingen doen,","tekst":"Dat is, enige dingen voorschrijven en volgen, die God in Zijne wet heeft bevolen."},{"catchword":"zijn zichzelven een wet;","tekst":"Namelijk in het gebieden of verbieden van hetgeen Gods wet gebiedt of verbiedt, of ook in enige delen van hun leven."}],"15":[{"catchword":"betonen","tekst":"Namelijk door hunne wetten, en ook somwijlen door een uitwendige onderhouding van dezelve."},{"catchword":"het werk der wet","tekst":"Dat is, een deel van den inhoud der wet Gods."},{"catchword":"beschuldigende,","tekst":"Namelijk wanneer zij tegen hun gemoed het kwaad doen."},{"catchword":"ontschuldigende).","tekst":"Namelijk wanneer zij volgens hunne conscientie het goed doen."}],"16":[{"catchword":"In den dag","tekst":"Die woorden moeten gevoegd worden met het 12e vs., doch kunnen ook volgen op vs.15, zo men het overzet tegen dien dag, want alsdan zullen de getuigenissen van de conscientiën der mensen, ook over hun verborgen zonden, dienen om het oordeel van Christus voor de gehele wereld te billijken, ook zelfs voor degenen, wien het Evangelie nooit is gepredikt; Rev 20:12 ."},{"catchword":"naar mijn evangelie","tekst":"Namelijk hetwelk betuigt dat Christus hierna een rechter zal zijn over alle mensen, ook over degenen, wien het Evangelie niet is gepredikt, vs.12."}],"17":[{"catchword":"gij wordt","tekst":"Van hier voorts handelt hij bijzonder tegen de Joden, die op hun geslacht, op de kennis van Gods wet, op de besnijdenis en andere uiterlijke voordelen roemden en zich verlieten, en hij bewijst, dat zij daardoor niet meer rechtvaardig zullen zijn voor God dan de heidenen door de wet der natuur."},{"catchword":"een Jood genaamd","tekst":"Grieks een Jood toegenaamd; namelijk vanwege uwe afkomst uit Israël en Juda, uit welken de Messias moest voortkomen, Rev 2:9 ; waarom de Joden ook gaarne naar hem genoemd werden."},{"catchword":"en rust op de wet;","tekst":"Dat is, verlaat u op de wet, die u door Mozes is gegeven, als de tafelen van het verbond Gods."},{"catchword":"roemt op God,","tekst":"Dat is, beroemt u, dat God uw God is, en dat gij Zijn volk zijt; Joh 8:33 , Joh 8:41 ."}],"18":[{"catchword":"die daarvan verschillen,","tekst":"Of, die uitmunten, uitnemend zijn. Want het Griekse woord betekent beide; Mat 12:12 ; Phi 1:10 ."},{"catchword":"zijnde onderwezen uit de wet;","tekst":"Grieks gecatechiseerd; dat is, van jongs op, en naarstig van mond tot mond onderwezen; Act 18:25 ; 1Co 14:19 ."}],"20":[{"catchword":"der onwetenden,","tekst":"Grieks der onmondige kinderen; dat is, die van kleine wetenschap zijn, gelijk kinderen; Mat 11:25 ; 1Co 13:11 ."},{"catchword":"de gedaante der kennis","tekst":"Grieks morphosin; dat is, een gezette wijze of gestalte van kennis; of een schijn, en niet een waarachtig wezen van kennis. Zie 2Ti 3:5 ."}],"21":[{"catchword":"leert gij uzelven niet?","tekst":"Namelijk gehoorzamen en doen hetgeen gij een ander leert, gelijk blijkt uit het volgende."},{"catchword":"steelt gij?","tekst":"Dat is, strekt gij het goed van een ander door behendige wegen en kwade trekken tot u? gelijk de Joden hiervan altijd zeer berucht zijn geweest en nog zijn; Mat 23:14 ."}],"22":[{"catchword":"berooft gij het heilige?","tekst":"Of, bedrijft gij kerkroof? namelijk met God Zijne eer te nemen; of Hem te onthouden in Zijn tempel wat Hij aan zich wil geheiligd of opgeofferd hebben. Zie hiervan Mal 1:6 ."}],"24":[{"catchword":"om uwentwil gelasterd","tekst":"Dat is, om uwer en uwer voorvaderen zonden wil."}],"25":[{"catchword":"indien gij de wet doet;","tekst":"Hij spreekt de Joden aan, die hunne rechtvaardigheid zochten in de onderhouding der ceremoniën; dezulke moeten de gehele wet onderhouden, of de besnijdenis kan hun niet helpen; Gal 5:3 . Hoewel het ook in het algemeen verstaan kan worden, dat de uiterlijke godsdiensten niet helpen ter zaligheid, als zij niet vergezelschapt zijn met een recht godzalig leven; Isa 1:11-12 , enz.; Jer 6:20 , enz."},{"catchword":"voorhuid geworden","tekst":"Dat is, zo zijt gij, hoewel gij besneden zijt, in enerlei staat met een ongelovigen onbesnedene."}],"26":[{"catchword":"de voorhuid","tekst":"Dat is, degenen, die onbesneden zijn."},{"catchword":"rechten der wet bewaart,","tekst":"Of, rechtvaardigmakingen; dat is, hetgeen de wet tot rechtvaardigmaking vereist."},{"catchword":"zijn voorhuid","tekst":"Dat is, de stand van den onbesneden mens."},{"catchword":"tot een besnijdenis gerekend worden?","tekst":"Dat is, alzo gehouden worden alsof hij besneden ware, gelijk in Abraham te zien is eer hij besneden was, die nochtans niet door de wet, maar door het geloof is gerechtvaardigd, Rom 4:10 , waarmede hij de besnijdenis niet ten enenmale verwerpt, als zij nog niet afgedaan was,maar hij handelt hier met de Joden, die de leer der Farizeën volgden en hunne gerechtigheid stelden in de onderhouding van den uiterlijken godsdienst. Anders was de besnijdenis in zichzelve een teken en zegel van de rechtvaardigmaking des geloofs, Rom 4:11 , en is met de andere ceremoniën en schaduwen door Christus vervuld en afgedaan; Col 2:17 ."}],"27":[{"catchword":"de voorhuid,","tekst":"Dat is, de mens, die van nature zonder besnijdenis is."},{"catchword":"als zij de wet volbrengt","tekst":"Dat is, indien hij de wet volbrengt. Niet dat er iemand is, die de wet in alles heeft volbracht, Rom 3:9 ; maar dit zegt hij om de Joden te overtuigen, dat zowel zij als de heidenen hunne rechtvaardigheid buiten zichzelven in Christus, die alleen de wet volbracht heeft, moeten zoeken; Act 13:38-39 , enz."},{"catchword":"u niet oordelen,","tekst":"Namelijk met zijn exempel, gelijk Mat 12:41-42 ."},{"catchword":"de letter en besnijdenis","tekst":"Dat is, de uitwendige en letterlijke besnijdenis; of die alleen naar de uitwendige letter van het gebod geschiedt; 2Co 3:6-7 ."}],"28":[{"catchword":"is niet een Jood,","tekst":"Dat is, een rechte of waarachtige Jood, die erfgenaam is van de beloften des verbonds, den vaderen gedaan."},{"catchword":"in het openbaar is;","tekst":"Dat is, van afkomst uit Abraham door Juda, en die uitwendige belijdenis van het Jodendom doet."},{"catchword":"de besnijdenis,","tekst":"Dat is, de rechte of ware besnijdenis, die God in Zijn woord voornamelijk eist, en hem ter zaligheid aangenaam is."}],"29":[{"catchword":"een Jood,","tekst":"Dat is, een rechte en ware Jood, gelijk voren."},{"catchword":"de besnijdenis des harten,","tekst":"Dat is, de ware bekering en vernieuwing des harten; Col 2:11 ."},{"catchword":"in den geest,","tekst":"Dat is, in het hart en gemoed; of door den Heiligen Geest, die alleen de harten besnijdt. Hetwelk met het volgende woord letter overeenkomt."},{"catchword":"in de letter,","tekst":"Daardoor verstaat Paulus de uitwendige geboden der wet alleen; gelijk door den geest de inwendige werking des Heiligen Geestes in de predikatie des heiligen Evangelies. Zie 2Co 3:6 ."},{"catchword":"wiens lof","tekst":"Namelijk lof van den Jood, niet waar hij door roemt, maar waarmede hij terecht geroemd en geprezen wordt."},{"catchword":"niet is uit de mensen,","tekst":"Dat is, zijn oorsprong niet heeft uit des mensen krachten of werken."},{"catchword":"maar uit God","tekst":"Namelijk die zulks in hem door zijnen Geest gewrocht heeft; Rom 9:16 ; 1Co 3:7 , en 2Co 4:6 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"There fore [Namely, seeing thou knowest Gods O man, whosoever thou art judges (others)[that is, reprehends, rebukes, or else punishes. Hereby the Apostle understand such among the Heathens, who were Judges among them, or those that held a stricter life, as some Philosophers did, and thereby seemed to condemn the doings of others: whereas not withstanding they were inwardly full of hatred, envy, pride, etc. and in secret committed the same sins, when they could hide from men, as also the Pharisees (did) amongst condemn thy self: for thou that judges (others) dost the same. [namely, inwardly or secretly.]"}],"2":[{"catchword":null,"tekst":"And we know [That is, it is evident, even according to the common opinion of all men] that the judgment of God is according to truth, [that is, upright, not according to the outward show, but according as the thing is indeed] upon them that do such things."}],"3":[{"catchword":null,"tekst":"And thinkest thou O man who judges them that do such things, and dost the same [Namely, albeit that thou dost them secretly, or not as imputently as others] that thou shall escape the judgment of God?"}],"4":[{"catchword":null,"tekst":"Or despisest thou the riches [That is, the greatness and multiplicity. Here he confutes those that thought their matters stood not ill with God, because God did them good, and blessed them as the world, as he did the Romans in an especial manner at that time] of his goodness [this is a property of God, whereby he blessed and doth good, yea even to them that are evil, Mat 5:45.] and forbearance, [namely, whereby he with connivance overlooks the sins of men for a time, (to see) whether they will yet repent, Luk 3:7,8, etc.] and long suffering, [whereby he defers the punishment which they deserve until the measure of the same is fulfilled, Rom. 9.ver.22.] not knowing that the goodness of God leadeth thee to repentance. [that is, gives thee time and reason to repent.]"}],"5":[{"catchword":null,"tekst":"But after thy hardness [That is, being hardened in thy sins] and impenitent heart, gatherest thou to thy self wrath as a treasure, [ that is, provokes more and more the wrath and judgement of God, as a treasure to which men always daily add more and more] in the day of wrath, and of the revelation of the righteous judgment of God: [that is, against the last day, when God shall make manifest before every one, and punish the sins of men, even those that are secret, v.16. 2 Thes. 1.7. Rev. 20 v12, 13.]"}],"6":[{"catchword":null,"tekst":"Who shall recompense every one according to his works: [He speaketh here of recompensing according to the promises and threatening of the Law, which were known to the Gentiles also by nature, v. 15, for of justification by faith he begins first to speak, Rom. 3.21. However this may well be applied also to recompensing according to the promises and threatening of the gospel, as 2 Cor. 5.10. it is so said in general: for as much as good works as fruits of faith, of grace, for Christ&acirc;&euro;&trade;s sake shall also be rewarded.]"}],"7":[{"catchword":null,"tekst":"To them indeed, who by perseverance, [The Greek word signifies also patience, but is here more fitly taken for perseverance or constancy, as Mat. 10.22. Luk 8:15.] in doing good [gr. Of a good work] seek glory and honour and incorruption, [that is, a blessed immortality] eternal life."}],"8":[{"catchword":null,"tekst":"But to them who are contentious, [Gr. Contention, i.e. contentious or desirous of contention, as of faith, Rom. 3.26. i.e. circumcised] and who are disobedient to the truth, namely , which by God is made known to them by nature, Rom, 1 ver. 19.] but are obedient to unrighteousness, and indignation and wrath [namely, of God, who is justly incensed to judgement by reason of sin] (shall be recompensed.)"}],"9":[{"catchword":null,"tekst":"Tribulations and distress [That is, hellish pains and torments, which by Gods righteous wrath shall be sent unto them] upon every soul of man which worketh good, first to the Jews and (also) to the Greek."}],"10":[{"catchword":null,"tekst":"But glory, and honour and peace [That is, eternal salvation which they have sought in their life, shall be given to them, ver.7.] to every one that worketh good, first to the Jews and (also) to the Greeks."}],"11":[{"catchword":null,"tekst":"For there is no accepting of the person with God. [Gr. Of the face, of the see more at large, the annotations on Mat. 22.16. and Acts 10. 34.]"}],"12":[{"catchword":null,"tekst":"For as many as have sinned without Law [That is, the Gentiles, who had not the written Law of Moses.] shall also perish without Law: [That is, be condemned by the testimony of their own conscience ver.15.] and as many as have sinned under the Law [that is, the Jews, to whom the Law was given by Moses, Gr. In the Law] shall be judged by the Law. [That is, shall be judged , i.e. condemned according to the threatening of the Law.]"}],"13":[{"catchword":null,"tekst":"For the hearers of the Law [That is, who only know the Law, and boast thereof] are not righteous before God [that is, are not acknowledged for righteous in Gods judgment, declared to be such Psa 143:2. Mat. 12.37. Rom. 8.33.] but the doers of the Law [that is, the fulfillers of the Law, Gal 3.10. Jam. 2.10. ] shall be justified [namely, by the Law, or according to the promises of the Law, Rom. 10.5. But seeing no man perfectly keeps the Law by reason of the corruption that is in man, Rom. 8.3. Gal. 3.10. there no man is justified by the Law, or through his own works, but only by the righteousness of Christ imputed unto us by faith, Rom.3 ver. 21.22.23.]"}],"14":[{"catchword":null,"tekst":"For when the Gentiles who have not the Law, [Namely, the written Law] by nature doe the things, which God hath commanded in his Law] which are of the Law, these not having the Law, are a Law to themselves. [Namely, in commanding or forbidding of that which Gods Law commands or forbids; or else in some parts of their lives.]"}],"15":[{"catchword":null,"tekst":"(As) who show [Namely, by their Laws, and also sometimes by an outward observation of the same] the work of the Law [that is, a part of the contents of the Law of God] written in their hearts, their conscience witnessing together, and the thoughts one another accusing (them) [namely, when they do evil against their judgement] or else excusing. [Namely, when according to their conscience they do good."}],"16":[{"catchword":null,"tekst":"In the day [These words must be joined with the 12 verse, yet may also follow the 15 verse, if it be translated against that day, for then the testimonies of mens consciences, even concerning their secret sins shall serve to justify Christs judgment before the whole world, yea even before to those to whom the Gospel was never preached, Revel. 20.12.] when God shall the hidden things of men, even over to those to whom the Gospel was not preached ver.12.]"}],"17":[{"catchword":null,"tekst":"Behold, thou art called [From henceforward he deals especially against the Jews, who boasted of and relied upon their pedigree, the knowledge of Gods Law, circumcision, and other outward advantages; and he proved that they shall thereby be no more righteous before God, then the Gentiles by the Law of nature] a Jew [Gr. Surnamed a Jew. Namely, by reason of your descent from Israel and Judah, from who the Messiah was proceed, whereof also the Jews were willing to be named after him, Revel.2.9.] and rests on the Law, [that is, puttest thy trust in the Law, which was given you by Moses as the Tables of Gods, Covenant] and boasts in God. [that is, boast yourselves that God is your God, and that ye are his people, John 8.ver.33.41.]"}],"18":[{"catchword":null,"tekst":"And thou knowest (his) will and provest the the things which differ (from it) [Or which are excellent, choice, For the Greek word signified both, Mat 12:12. Php 1:10.] being instructed, out of the Law, [Gr. catechized, i.e. from thy youth up, and diligently from mouth to mouth instructed Act 18:25. 1 Cor.14.19.]"}],"19":[{"catchword":null,"tekst":"And thou art confident, that thou thy self art a guide of the blind, a light of those that are in darkness."}],"20":[{"catchword":null,"tekst":"An instructor of the unwise, (and) a teacher of the ignorant, [Gr. Of infants or children i.e. those that are of small knowledge like children. Mat. 11.25. 1 Cor. 13.11.] having the form of knowledge [Gr. Morphosin, i.e. a set manner or form of knowledge: or a show and not a true being of knowledge. See 2 Tim. 3. ver. 5.] and of the truth in the Law."}],"21":[{"catchword":null,"tekst":"Thou therefore that teachest another, teachest not thy self? [Namely, to obey and doe that which teachest another, as appears from what follows] thou that preacheth that men shall not steal, stealeth thou? [that is, dost thou draw another&acirc;&euro;&trade;s goods to thy selves by legerdemain, and naughty practices, as the Jews have always been very infamous for this and still are, Matth. 23.14.]"}],"22":[{"catchword":null,"tekst":"Thou that says that men shall not commit adultery, dost thou commiteth adultery? Thou that abominates Idols, dost thou not rob the Holy place? [Or, dost thou commit sacrilege? Namely, by taking a way Gods honour, or by withholding from him in his Temple, that which he will have consecrated or offered up unto him. See hereof Mat 1.6. etc.]"}],"23":[{"catchword":null,"tekst":"Thou that boastest of the Law, dishonourest thou God by the transgression of the Law."}],"24":[{"catchword":null,"tekst":"For the name of God is blasphemed because of you, [That is, because of your, and your forefathers] among the Gentiles, as it is written;"}],"25":[{"catchword":null,"tekst":"For circumcision is profitably indeed, if thou dost the Law: [He speaketh to the Jews who sought their righteousness in the observation of circumcision, and other ceremonies. They that are such must keep the whole Law, or circumcision cannot avail them, Gal 5:3. Although it may also be understood in general that outward worshipping avail not a salvation, if they not be accompanied with a true godly life. Isa.1.ver.11.12. etc. Jer 6:20.etc.] but if thou art a transgressor of the Law, thy circumcision has become uncircumcision. [that is, thou art, though thou are circumcised, in the same condition with an unbelieving uncircumcised person.]"}],"26":[{"catchword":null,"tekst":"If therefore the uncircumcision [That is, those that are uncircumcised] keep the rights of the Law [or justifications i.e. that which the Law requires to justification] shall not his uncircumcision [that is, the seal of an uncircumcised person] be reckoned for a circumcision?[that is, be so accounted as he were circumcised as may be seen in Abraham before he was circumcised, who not withstanding was justified, not by the Law but by faith Rom 4:10.11. whereby he doth not at once rejects circumcision, while it was not yet abolished, but he deals here with the Jews who followed the doctrine of the Pharisees, and placed their righteousness in the observation of the outward worship of God. Otherwise circumcision in it self was a sign and a seal of the justification of faith, Rom 4:11. and is together with the other ceremonies and shadows fulfilled and done away by Christ: Col.2.17.]"}],"27":[{"catchword":null,"tekst":"And shall (not) the uncircumcision which is by nature, [That is, the man which by nature is without circumcision] if it fulfill the Law, [that is, if he fulfill the Law: not that there is any man, who hath fulfilled the Law in all things, Rom. 2.9. but this he saith to convince the Jews, that they as well as the Gentiles, must seek their righteousness out of themselves in Christ, who only hath fulfilled the Law, Acts13.v.38.39, etc] judge thee, [ namely, by his example, as Mat.12 41.42.] who by the letter and circumcision [that is, the outward and literal circumcision: or which is done only according to the outward letter of command, 2 Cor.3.v6,7.] art Transgressor of the Law?"}],"28":[{"catchword":null,"tekst":"For he is not a Jew [That is, a right or true Jew, which is heir of promise of the Covenant made to the fathers] who is so open: [that is, descendent from Abraham by Judah, and who makes an outward profession of Judaism] neither is that circumcision [that is, the right or true circumcision which God in his word principally requires, and is acceptable to him unto salvation] which is so openly in the flesh."}],"29":[{"catchword":null,"tekst":"But he is a Jew [That is, a right and a true Jew, as before] which is so in secret, and the circumcision of the heart [that is, true conversion and renovation of the heart, Colk2.v.11.] in the spirit, [that is, in heart and mind: or by the holy Ghost, who only circumciseth the hearts, which best agrees with the following word letter] not (in the) letter [thereby Paul understands the outward commands of the Law only: as by the spirit the inward operation of the Holy Ghost in the preaching of the Gospel. See 2 Cor. 3.6.] (is the circumcision) whose praise [namely, which Jews praise, whereby he boasteth , but whereby he is rightly praised or commended] is not of men, [that is, hath not its original from mans abilities or works] but of God. [namely, who hath wrought this in him by his spirit, Rom. 9.16. 1 Cor.3.7. and 2 Cor. 4.6.]"}]}}};

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;

document.addEventListener('click', e => {

    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
