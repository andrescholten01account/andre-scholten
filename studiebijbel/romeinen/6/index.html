 leven;","9":"Terwijl wij weten dat Christus, opgewekt uit de doden, niet meer sterft; de dood heerst niet meer over Hem.","10":"Want dat Hij gestorven is, dat is Hij voor de zonde eenmaal gestorven; en dat Hij leeft, dat leeft Hij voor God.","11":"Zo ook u, houd het ervoor dat u zelf wel dood bent voor de zonde, maar voor God levend bent in Christus Jezus, onze Heere.","12":"Laat dan de zonde niet heersen in uw sterfelijk lichaam, om haar te gehoorzamen in de begeerten daarvan.","13":"En stel uw leden niet tot wapens van de ongerechtigheid ter beschikking aan de zonde; maar stel uzelf ter beschikking aan God, als mensen die uit de doden levend geworden zijn, en stel uw leden tot wapens van de gerechtigheid ter beschikking aan God.","14":"Want de zonde zal over u niet heersen; want u bent niet onder de wet, maar onder de genade.","15":"Wat dan? Zullen wij zondigen, omdat wij niet onder de wet zijn, maar onder de genade? Dat zij verre.","16":"Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?","17":"Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;","18":"En vrijgemaakt van de zonde, bent u dienstknechten van de gerechtigheid geworden.","19":"Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging.","20":"Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid.","21":"Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.","22":"Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.","23":"Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere."},"SV":{"1":"Wat zullen wij dan zeggen? Zullen wij in de zonde blijven, opdat de genade te meerder worde?","2":"Dat zij verre. Wij, die der zonde gestorven zijn, hoe zullen wij nog in dezelve leven?","3":"Of weet gij niet, dat zovelen als wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn?","4":"Wij zijn dan met Hem begraven, door den doop in den dood, opdat, gelijkerwijs Christus uit de doden opgewekt is tot de heerlijkheid des Vaders, alzo ook wij in nieuwigheid des levens wandelen zouden.","5":"Want indien wij met Hem een plant geworden zijn in de gelijkmaking Zijns doods, zo zullen wij het ook zijn *in* *de* *gelijkmaking* *Zijner* opstanding;","6":"Dit wetende, dat onze oude mens met *Hem* gekruisigd is, opdat het lichaam der zonde te niet gedaan worde, opdat wij niet meer de zonde dienen.","7":"Want die gestorven is, die is gerechtvaardigd van de zonde.","8":"Indien wij nu met Christus gestorven zijn, zo geloven wij, dat wij ook met Hem zullen leven;","9":"Wetende, dat Christus, opgewekt zijnde uit de doden, niet meer sterft; de dood heerst niet meer over Hem.","10":"Want dat Hij gestorven is, dat is Hij der zonde eenmaal gestorven; en dat Hij leeft, dat leeft Hij Gode.","11":"Alzo ook gijlieden, houdt het daarvoor dat gij wel der zonde dood zijt, maar Gode levende zijt in Christus Jezus, onzen Heere.","12":"Dat dan de zonde niet heerse in uw sterfelijk lichaam, om haar te gehoorzamen in de begeerlijkheden deszelven *lichaams*.","13":"En stelt uwe leden niet der zonde tot wapenen der ongerechtigheid; maar stelt uzelven Gode, als uit de doden levende *geworden* zijnde, en *stelt* uw leden Gode tot wapenen der gerechtigheid.","14":"Want de zonde zal over u niet heersen; want gij zijt niet onder de wet, maar onder de genade.","15":"Wat dan? Zullen wij zondigen, omdat wij niet zijn onder de wet, maar onder de genade? Dat zij verre.","16":"Weet gij niet, dat wien gij uzelven stelt tot dienstknechten ter gehoorzaamheid, gij dienstknechten zijt desgenen, dien gij gehoorzaamt, of der zonde tot den dood, of der gehoorzaamheid tot gerechtigheid?","17":"Maar Gode zij dank, dat gij *wel* dienstknechten der zonde waart, maar *dat* gij *nu* van harte gehoorzaam geworden zijt aan het voorbeeld der leer, tot hetwelk gij overgegeven zijt;","18":"En vrijgemaakt zijnde van de zonde, zijt gemaakt dienstknechten der gerechtigheid.","19":"Ik spreek op menselijke wijze, om der zwakheid uws vleses wil; want gelijk gij uw leden gesteld hebt, *om* dienstbaar *te* *zijn* der onreinigheid en der ongerechtigheid, tot ongerechtigheid, alzo stelt nu uw leden, *om* dienstbaar *te* *zijn* der gerechtigheid, tot heiligmaking.","20":"Want toen gij dienstknechten waart der zonde, zo waart gij vrij van de gerechtigheid.","21":"Wat vrucht dan hadt gij toen van die dingen, waarover gij u nu schaamt? Want het einde derzelve is de dood.","22":"Maar nu, van de zonde vrijgemaakt zijnde, en Gode dienstbaar gemaakt zijnde, hebt gij uw vrucht tot heiligmaking, en het einde het eeuwige leven.","23":"Want de bezoldiging der zonde is de dood, maar de genadegift Gods is het eeuwige leven, door Jezus Christus, onzen Heere."},"KJV":{"1":"What shall we say then? Shall we continue in sin, that grace may abound?","2":"God forbid. How shall we, that are dead to sin, live any longer therein?","3":"Know ye not, that so many of us as were baptized into Jesus Christ were baptized into his death?","4":"Therefore we are buried with him by baptism into death: that like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life.","5":"For if we have been planted together in the likeness of his death, we shall be also *in the likeness* of *his* resurrection:","6":"Knowing this, that our old man is crucified with *him*, that the body of sin might be destroyed, that henceforth we should not serve sin.","7":"For he that is dead is freed from sin.","8":"Now if we be dead with Christ, we believe that we shall also live with him:","9":"Knowing that Christ being raised from the dead dieth no more; death hath no more dominion over him.","10":"For in that he died, he died unto sin once: but in that he liveth, he liveth unto God.","11":"Likewise reckon ye also yourselves to be dead indeed unto sin, but alive unto God through Jesus Christ our Lord.","12":"Let not sin therefore reign in your mortal body, that ye should obey it in the lusts thereof.","13":"Neither yield ye your members *as* instruments of unrighteousness unto sin: but yield yourselves unto God, as those that are alive from the dead, and your members *as* instruments of righteousness unto God.","14":"For sin shall not have dominion over you: for ye are not under the law, but under grace.","15":"What then? shall we sin, because we are not under the law, but under grace? God forbid.","16":"Know ye not, that to whom ye yield yourselves servants to obey, his servants ye are to whom ye obey; whether of sin unto death, or of obedience unto righteousness?","17":"But God be thanked, that ye were the servants of sin, but ye have obeyed from the heart that form of doctrine which was delivered you.","18":"Being then made free from sin, ye became the servants of righteousness.","19":"I speak after the manner of men because of the infirmity of your flesh: for as ye have yielded your members servants to uncleanness and to iniquity unto iniquity; even so now yield your members servants to righteousness unto holiness.","20":"For when ye were the servants of sin, ye were free from righteousness.","21":"What fruit had ye then in those things whereof ye are now ashamed? for the end of those things *is* death.","22":"But now being made free from sin, and become servants to God, ye have your fruit unto holiness, and the end everlasting life.","23":"For the wages of sin *is* death; but the gift of God *is* eternal life through Jesus Christ our Lord."}},"tsk":{"1":[{"kopje":"Wat","refs":["Rom 3:5"]},{"kopje":"Zullen","refs":["Rom 6:15","Rom 2:4","Rom 3:5-8","Rom 3:31","Rom 5:20","Rom 5:21","Gal 5:13","1 Petr 2:16","2 Petr 2:18","2 Petr 2:19","Judas 1:4"]}],"2":[{"kopje":"Dat zij verre","refs":["Rom 3:1","Rom 4:25"]},{"kopje":"hoe","refs":["Gen 39:9","Ps 119:104","1 Joh 3:9"]},{"kopje":"gestorven","refs":["Rom 6:5-11","Rom 5:11","Rom 7:4","Gal 2:19","Gal 6:14","Kol 3:3","1 Petr 2:24"]},{"kopje":"leven","refs":["2 Kor 5:14-17","1 Petr 1:14","1 Petr 4:1-3"]}],"3":[{"kopje":"weet","refs":["Rom 6:16","Rom 7:1","1 Kor 3:16","1 Kor 5:6","1 Kor 6:2","1 Kor 6:3","1 Kor 6:9","1 Kor 6:15","1 Kor 6:16","1 Kor 6:19","1 Kor 9:13","1 Kor 9:24","2 Kor 13:5","Jak 4:4"]},{"kopje":"gedoopt zijn","refs":["Matt 28:19","1 Kor 12:13","Gal 3:27","1 Petr 3:21"]},{"kopje":"zijn","refs":["Rom 6:4","Rom 6:5","Rom 6:8","1 Kor 15:29","Gal 2:20","Gal 2:21"]}],"4":[{"kopje":"Wij zijn","refs":["Rom 6:3","Kol 2:12","Kol 2:13","Kol 3:1-3","1 Petr 3:21"]},{"kopje":"opdat","refs":["Rom 6:9","Rom 8:11","1 Kor 6:14","2 Kor 13:4","Ef 1:19","Ef 1:20","Ef 2:5","Ef 2:6"]},{"kopje":"door de","refs":["Matt 28:2","Matt 28:3","Joh 2:11","Joh 2:19","Joh 2:20","Joh 11:40","Kol 1:11"]},{"kopje":"zo ook","refs":["Rom 6:19","Rom 7:6","Rom 12:1","Rom 12:2","Rom 13:13","Rom 13:14","2 Kor 5:17","Gal 6:15","Gal 6:16","Ef 4:17","Ef 4:22-24","Ef 5:8","Fil 3:17","Fil 3:18","Kol 1:9-12","Kol 2:11","Kol 2:12","Kol 3:10","Kol 4:1","1 Petr 4:1","1 Petr 4:2","2 Petr 1:4-9","1 Joh 2:6"]}],"5":[{"kopje":"Want","refs":["Rom 6:8-12","Ef 2:5","Ef 2:6","Fil 3:10","Fil 3:11"]},{"kopje":"één geworden","refs":["Ps 92:14","Jes 5:2","Jer 2:21","Matt 15:13","Joh 12:24","Joh 15:1-8"]}],"6":[{"kopje":"dat onze","refs":["Gal 2:20","Gal 5:24","Gal 6:14","Ef 4:22","Kol 3:5","Kol 3:9","Kol 3:10"]},{"kopje":"dat het","refs":["Rom 7:24","Rom 8:3","Rom 8:13","Kol 2:11","Kol 2:12"]},{"kopje":"opdat wij niet meer","refs":["Rom 6 wl-kjv\" data-code=\"G1658\">free</span> from righteousness.","21":"<span class=\"wl wl-kjv\" data-code=\"G5101\">What</span> <span class=\"wl wl-kjv\" data-code=\"G2590\">fruit</span> had <span class=\"wl wl-kjv\" data-code=\"G2192\">ye</span> <span class=\"wl wl-kjv\" data-code=\"G5119\">then</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">in</span> those things <span class=\"wl wl-kjv\" data-code=\"G3739\">whereof</span> ye <span class=\"wl wl-kjv\" data-code=\"G1870\">are</span> <span class=\"wl wl-kjv\" data-code=\"G3568\">now</span> <span class=\"wl wl-kjv\" data-code=\"G1870\">ashamed?</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G5056\">end</span> of those <span class=\"wl wl-kjv\" data-code=\"G1565\">things</span> is death.","22":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G3570\">now</span> being made <span class=\"wl wl-kjv\" data-code=\"G1659\">free</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G266\">sin,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> become <span class=\"wl wl-kjv\" data-code=\"G1402\">servants</span> to <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> ye <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G2590\">fruit</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G38\">holiness,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G5056\">end</span> <span class=\"wl wl-kjv\" data-code=\"G166\">everlasting</span> life.","23":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> the <span class=\"wl wl-kjv\" data-code=\"G3800\">wages</span> of <span class=\"wl wl-kjv\" data-code=\"G266\">sin</span> is <span class=\"wl wl-kjv\" data-code=\"G2288\">death;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> the <span class=\"wl wl-kjv\" data-code=\"G5486\">gift</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> is <span class=\"wl wl-kjv\" data-code=\"G166\">eternal</span> <span class=\"wl wl-kjv\" data-code=\"G2222\">life</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">through</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> Lord."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zullen wij dan zeggen?","tekst":"Deze tegenwerping rijst uit hetgeen Paulus in de Rom 5:20-21 had gezegd."},{"catchword":"in de zonde blijven,","tekst":"Dat is, onder de heerschappij der verdorvenheid, die in ons nog overig is, Rom 7:14 . Of, in allerlei zonde, die in de wereld de overhand heeft."},{"catchword":"te meerder worde?","tekst":"Namelijk gelijk in Rom 5:20-21 schijnt betuigd te zijn; hetwelk aldaar verklaard is."}],"2":[{"catchword":"Dat zij verre","tekst":"De apostel verwerpt met deze woorden zulk gevolg, als het antwoord onwaardig, en bewijst het tegendeel, dat wij in de zonde niet moeten blijven."},{"catchword":"die der zonde gestorven zijn,","tekst":"Dat is, wij die van de heersende macht der inwonende zonde door Christus' Geest verlost zijn, vs.6,7; want der zonde sterven betekent in de Schrift des Nieuwen Testaments de zonde in ons geen leven laten hebben, dat is, niet leven onder de macht en heerschappij der zonde."},{"catchword":"in dezelve leven","tekst":"Dat is, de zonde haar leven en kracht laten, en in ons de overhand laten hebben."}],"3":[{"catchword":"in Christus Jezus gedoopt zijn","tekst":"Namelijk om te betuigen onze gemeenschap, die wij met Christus hebben door het geloof."},{"catchword":"in Zijn dood gedoopt zijn","tekst":"Dat is, door de doop verzekerd worden dat wij gemeenschap hebben aan Zijnen dood, waardoor niet alleen onze zonden voor God verzoend zijn, maar ook de Heilige Geest is verworven, door wiens werking de verdorvenheid, die in ons is, haar leven of heersende kracht is benomen, hetwelk is de eerste trap onzer wedergeboorte; Tit 3:5-6 . De apostel schijnt hier te zien op de wijze van dopen, in de warme Oosterse landen veel gebruikelijk, waar de mensen geheel in het water ingedoopt werden, een weinig tijds onder het water bleven, en daarna uit het water oprezen; en aan te wijzen, dat deze indoping en blijven in het water ene afbeelding is van Christus' dood en begrafenis, en het oprijzen uit het water van Zijne verrijzenis. Hetwelk ook op onze wijze van dopen door besprenging wel kan gepast worden."}],"4":[{"catchword":"met Hem begraven,","tekst":"Dit is de tweede trap onzer wedergeboorte, die ons door den doop wordt verzegeld, namelijk de toeneming en volharding in de doding der zonde in ons, gelijk de begrafenis ene volharding was van den dood van Christus, vs.6."},{"catchword":"tot de heerlijkheid des Vaders,","tekst":"Grieks dia; welk woord meest betekent door; dat is door de heerlijkheid des Vaders; doch wordt ook somwijlen voor tot genomen, hetwelk hier best past. Zie 2Pe 1:3 ."},{"catchword":"alzo ook wij","tekst":"Dit is de derde trap onzer wedergeboorte, die wij door de kracht der opstanding van Christus ontvangen, en ons door den doop wordt betekend en verzegeld; namelijk dat wij kracht ontvangen hebben om voortaan in nieuwheid des levens, dat is in heiligheid en reinigheid te wandelen; Eph 5:26-27 ."}],"5":[{"catchword":"een plant geworden zijn","tekst":"Of, tezamen geplant zijn; ene gelijkenis, genomen van een ent, die in een jeugdigen boom ingegrift wordt, welke tot eene plant wordt met den boom en het sap des levens en der vruchtbaarheid uit hem trekt. Alzo, wil hij zeggen, die met Christus, als de stam, door het geloof zijn verenigd [waarvan de doop ook een teken is, Gal 3:27 ] , die verkrijgen door den Geest van Christus de kracht niet alleen om de zonden te doden en allengskens te begraven, maar ook om in nieuwheid des levens meer en meer op te staan en ter ere Gods heiliglijk te leven; Joh 15:1 ."}],"6":[{"catchword":"onze oude mens","tekst":"Alzo noemt hij de aangeboren blindheid en verdorvenheid des mensen, die wij van den eersten mens erven, die hij elders ook vlees noemt, gesteld tegen den nieuwen mens, die bestaat in kennis, heiligheid en rechtvaardigheid; Eph 4:22 ; Col 3:9 ."},{"catchword":"met Hem gekruisigd is,","tekst":"Dewijl Christus onze zonden aan het kruis op zich geladen heeft, niet alleen om die te verzoenen, maar ook om dezelve te niet te doen, gelijk volgt. Zie ook Heb 9:14 , Heb 9:26 , Heb 9:28 ."},{"catchword":"het lichaam der zonde","tekst":"Dat is, de gehele massa of samenvoeging van deze verdorvenheid, welke is als een onzuiver lichaam, dat vele onzuivere leden heeft; Col 2:11 , en Col 3:5 ."},{"catchword":"te niet gedaan worde,","tekst":"Dit lichaam der zonde is wel van Christus geheel teniet gedaan, zoveel Zijne verdiensten aangaat, en is ook door Zijnen Geest in de wedergeborenen de kracht van heersen benomen, vs.12, 14, maar moet allengskens meer en meer in ons vernietigd worden door denzelfden Geest, met nadere toeëigening van den dood van Christus, gelijk Paulus daartoe de wedergeborenen vermaant, Rom 8:13 , en Rom 12:2 ; Eph 4:22 ; Col 3:9 , totdat dezelve in ons namaals geheel zal vernietgigd worden; Heb 4:10 ."},{"catchword":"niet meer de zonde dienen","tekst":"Namelijk gelijk wij deden vóór onze wedergeboorte. Zie van dezen dienst der zonde nader verklaring vs.16-19."}],"7":[{"catchword":"die gestorven is,","tekst":"Dit is ene rede, genomen van de gelijkenis van een dood mens, die de werken van levenden niet meer doet en aan gene diensten meer is verbonden, waaraan hij in zijn leven verbonden was."},{"catchword":"gerechtvaardigd van de zonde","tekst":"Dat is, van hare macht vrijgemaakt of verlost. Want hier wordt eigenlijk niet gesproken van de vergeving der zonden, gelijk in de vijf voorgaande hoofdstukken, maar van de vernietiging van de macht der zonde; ene gelijkenis, genomen van een mens, die van den rechter gerechtvaardigd of vrijgesproken zijnde, ook meteen van de banden verlost en vrijgelaten wordt."}],"8":[{"catchword":"met Christus gestorven zijn,","tekst":"Zie de aantekeningen vs.3,4."},{"catchword":"met Hem zullen leven;","tekst":"Namelijk in dit leven een geestelijk leven, en hiernamaals het eeuwige leven. Zie Rom 8:10-11 ; Eph 2:5 ; Col 2:13 , en Col 3:1-4 ."}],"9":[{"catchword":"heerst niet meer over Hem","tekst":"Dat is, heeft gene macht meer over Hem."}],"10":[{"catchword":"der zonde","tekst":"Namelijk tot verzoening en vernietiging derzelve."},{"catchword":"eenmaal gestorven;","tekst":"Want door eene offerande heeft hij in eeuwigheid volmaakt die geheiligd worden; Heb 10:14 ."},{"catchword":"Gode","tekst":"Dat is, bij God en ter heerlijkheid Gods, tot Zijne rechterhand gezet zijnde."}],"11":[{"catchword":"der zonde dood zijt,","tekst":"Dat is, der zonde gestorven zijt. Zie de aantekeningen vs.2."},{"catchword":"Gode levende zijt","tekst":"Dat is, de kracht hebt ontvangen door den Geest van Christus om voor God en ter ere Gods te leven en de zonde meer en meer te doden. Daaruit vloeit dan de vermaning in de volgende verzen. Zie ook Rom 8:1 , enz."}],"12":[{"catchword":"dan de","tekst":"Dat is, dewijl gij wedergeboren zijt en verlost van de macht der zonde."},{"catchword":"zonde niet","tekst":"Dat is, de overblijfselen der verdorvenheid, die in ons tot onze oefening en vernedering overig zijn."},{"catchword":"heerse in uw","tekst":"Dat is de overhand hebbe, namelijk over de kracht en bewegingen des Geestes in u. Zie Rom 8:13-14 ; Gal 5:16-18 ."},{"catchword":"sterfelijk lichaam,","tekst":"Dit wordt gezegd, niet omdat de kwade begeerlijkheden alleen in het lichaam zijn, of haar oorsprong alleen uit het lichaam en niet uit de ziel hebben; want dat strijdt tegen hetgeen Christus zegt Mat 15:18-19 , en Paulus, Gal 5:19-20 ; maar omdat deze kwade begeerlijkheden zich in het lichaam meest openbaren en door het lichaam uitgevoerd worden."},{"catchword":"te gehoorzamen","tekst":"Dat is, te volgen of te doen, waar de zonde ons door verscheidene begeerlijkheden toe verlokt Jam 1:14 ."}],"13":[{"catchword":"der zonde","tekst":"Dat is, tot dienst van de zonde, die in u nog is."},{"catchword":"wapenen der ongerechtigheid;","tekst":"Dat is, instrumenten, uitvoerders der ongerechtigheid, gelijk een soldaat met zijne wapenen uitvoert hetgeen hem zijn overste gebiedt."},{"catchword":"Gode,","tekst":"Dat is, ten dienste Gods."},{"catchword":"uit de doden","tekst":"Dat is, als uit den dood en de macht der zonde verlost en met het leven der gerechtigheid door Christus begaafd."},{"catchword":"uw leden","tekst":"Namelijk als die instrumenten zijn der ziel, om uit te voeren hetgeen zij wil of begeert."}],"14":[{"catchword":"de zonde","tekst":"In vs.12 was dit ene vermaning, doch hier is het ene belofte, dat de zonde in ons niet zal heersen, zo wij maar daartegen behoorlijk strijden; waarvan de reden in de navolgende woorden wordt gegeven."},{"catchword":"onder de wet,","tekst":"Namelijk die wel beveelt wat wij doen moeten, maar geeft de macht niet om te doen wat zij beveelt; verschrikt ons wel door hare dreigementen, maar verkwikt en verwakkert ons niet om de zonde te overwinnen, doordien wij daardoor meer en meer van de zonde worden overtuigd; Rom 7 , en 2Co 3 ."},{"catchword":"maar onder de genade","tekst":"Namelijk Jezus Christus, die ons niet alleen van de schuld, maar ook van de macht der zonde heeft verlost, en ons door Zijnen Geest de kracht geeft om de zonde met hare begeerten tegen te staan, en te overwinnen. Zie Rom 8:1-3 , Rom 8:13 ; 2Ti 1:7 ; 1Jo 5:4 ."}],"15":[{"catchword":"Wat dan?","tekst":"Deze tegenwerping rijst daaruit, dat iemand deze woorden, niet zijn onder de wet, kwalijk had kunnen duiden; namelijk alsof hij dat verstaan had van de gehoorzaamheid der wet, of van den regel der gerechtigheid, die in de wet begrepen is, en het woord genade, van ene toelating of vrijheid van leven zo het elk belieft; hetwelk de apostel in het einde van dit vs. verwerpt en in de navolgende verzen krachtig wederlegt."}],"16":[{"catchword":"ter gehoorzaamheid,","tekst":"Dat is, om dien te gehoorzamen en uzelven te onderwerpen."},{"catchword":"der zonde tot den dood,","tekst":"Dat is, der heersende zonde, gelijk voren."},{"catchword":"der gehoorzaamheid","tekst":"Namelijk die gij God voor uwe verlossing schuldig zijt."},{"catchword":"tot gerechtigheid?","tekst":"Namelijk om gerechtigheid te oefenen."}],"17":[{"catchword":"waart,","tekst":"Namelijk eer gij in Christus hebt geloofd."},{"catchword":"aan het voorbeeld der leer,","tekst":"Namelijk des Evangelies, die ene leer is der godzaligheid en gerechtigheid, en gelijk een voorbeeld, dat zodanigen nadruk ook laat in degenen, die haar aannemen, alzo dat zij door de kracht van Gods Geest zichzelven tot navolging derzelver leer ook overgeven."}],"18":[{"catchword":"van de zonde,","tekst":"Dat is, van de slavernij der zonde."}],"19":[{"catchword":"menselijke wijze,","tekst":"Dat is, bij gelijkenis van zaken, die onder de mensen bekend zijn."},{"catchword":"om der zwakheid uws vleses wil;","tekst":"Dat is, opdat gij vanwege de zwakheid uws verstands in geestelijke zaken hetzelve te beter moogt begrijpen, Joh 3:12 ."},{"catchword":"der onreinigheid","tekst":"Dat is, der vleselijke lusten."},{"catchword":"der ongerechtigheid,","tekst":"Dat is, der begeerlijkheden, die strekken tot onderdrukking uws naasten."},{"catchword":"tot ongerechtigheid,","tekst":"Dat is, tot volvoering van zulke kwade lusten en begeerlijkheden."},{"catchword":"tot heiligmaking","tekst":"Namelijk van uwen handel en wandel voor God en de mensen, gelijk vs.22."}],"20":[{"catchword":"vrij van de gerechtigheid","tekst":"Grieks vrij der gerechtigheid; dat is, ontbloot van alle ware gerechtigheid; of der gerechtigheid niet onderworpen, gelijk een vrij mens, die onder niemand staat."}],"21":[{"catchword":"nu","tekst":"Namelijk nadat gij tot kennis zijt gekomen."},{"catchword":"schaamt?","tekst":"Dat is, leedwezen hebt en schaamte, over de schandelijkheden, waar gij tevoren behagen in had."},{"catchword":"is de dood","tekst":"Namelijk tenzij wij daarvan gerechtvaardigd en geheiligd geweest waren door het bloed en den Geest van Christus; 1Co 6:11 ."}],"22":[{"catchword":"van de zonde vrijgemaakt zijnde,","tekst":"Dat is, van de slavernij der zonde, gelijk voren."},{"catchword":"Gode dienstbaar gemaakt zijnde,","tekst":"Dat is, bekwaam en gewillig om God te dienen."},{"catchword":"tot heiligmaking,","tekst":"Namelijk in dit leven, gelijk vs.19. Zie 1Th 4:3 ."}],"23":[{"catchword":"de bezoldiging der zonde","tekst":"Grieks bezoldingen; ene gelijkenis, genomen van de krijgslieden, die ten einde van hun dienst hunne betaling of soldij krijgen."},{"catchword":"de dood,","tekst":"Namelijk niet alleen de tijdelijke, maar ook de eeuwige, gelijk uit het navolgende lid blijkt."},{"catchword":"de genadegift Gods","tekst":"Namelijk die wij door Christus verkrijgen in onze heiligmaking, waarvan hij hier spreekt."},{"catchword":"is het eeuwige leven,","tekst":"Dat is, heeft tot een einde het eeuwige leven, gelijk gesproken wordt vs.22; niet dat dezelve zulks verdient [want dan zou het niet zijn ene genadegift], maar omdat Christus ons zulks verdiend heeft, en uit genade zal schenken, gelijk de volgende woorden, door Jezus Christus onzen Heere, bewijzen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"What we say therefore? [This objection ariseth from that which Paul had said in the two last verses of the former chapter] shall we continue in sin [that is, under the dominion of corruption, which is yet remaining in us, chap. 7. ver.14. etc. Or in all manner of sin which hath the upperhand in the world] that grace may be more? [namely, as seems to be testified in the two former verses: which is there expounded.]"}],"2":[{"catchword":null,"tekst":"For it be. [The Apostle by these words rejects any such consequences, as unworthy an answer, and proves the contrary that we must not continue in sin] we who are dead in sin, [that is, we who by the Spirit of Christ are delivered from the raging power of indwelling sin, ver.6.7. For to die to sin in the sin Scripture of the new Testament signifies, to let sin have no life in us: i.e. not to live under the power and dominion of sin,] how shall we still live in the same? [that is, leave sin its life and power, and let it have the upper hand in us.]"}],"3":[{"catchword":null,"tekst":"Or know we not that as many of us as we are baptized unto Jesus Christ, [Namely, to testify our communion that we have with Christ by faith] we are baptized unto his death. [that is, are assured by baptism that we have communion in his death, whereby not only our sins are expiated before God, but also the Holy Spirit is procured, by whose working the corruption that is in us hath its life or reigning power taken away, which is the first degree of our regeneration, Tit.3.5.6. the Apostle seems here to allude to the manner of baptizing, much used in warm Eastern Countries, where men were wholly dipped into the water, and remained a little while under water, and afterwards rose out of the water : and to show that this dipping into, and remaining in the water is representationof Christs death and burial; and the rising up out of the water, of his resurrection. Which also may well be applied to our manner of baptizing by sprinkling.]"}],"4":[{"catchword":null,"tekst":"We are therefore buried with him [This is the second degree of our regeneration, which is sealed unto us by baptism, namely the increasing and persevering in the killing of sin in us; as burial was a continuance of Christs death, ver, 6.] by baptism unto death, that in like manner as Christ was raised from the dead unto the glory of the Father, [Gr. Dia, which word most commonly signifies by, i.e. by the glo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  for (const n of nummers) {

    rij.className = 'vers'; rij.id = 'v' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

}

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
