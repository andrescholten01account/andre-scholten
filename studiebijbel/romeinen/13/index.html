n wie u belasting schuldig bent; tol, aan wie u tol schuldig bent; ontzag, aan wie u ontzag schuldig bent; eer, aan wie u eer schuldig bent.","8":"Wees niemand iets schuldig, dan elkaar lief te hebben; want hij die de ander liefheeft, heeft de wet vervuld.","9":"Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.","10":"De liefde doet de naaste geen kwaad. Dus is de liefde de vervulling van de wet.","11":"En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.","12":"De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen.","13":"Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie;","14":"Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten."},"SV":{"1":"Alle ziel zij den machten, over *haar* gesteld, onderworpen; want er is geen macht dan van God, en de machten, die er zijn, die zijn van God geordineerd.","2":"Alzo dat die zich tegen de macht stelt, de ordinantie van God wederstaat; en die ze wederstaan, zullen over zichzelven een oordeel halen.","3":"Want de oversten zijn niet *tot* een vreze den goeden werken, maar den kwaden. Wilt gij nu de macht niet vrezen, doe het goede, en gij zult lof van haar hebben;","4":"Want zij is Gods dienares, u ten goede. Maar indien gij kwaad doet, zo vrees ; want zij draagt het zwaard niet te vergeefs; want zij is Gods dienares, een wreekster tot straf dengene, die kwaad doet.","5":"Daarom is het nodig onderworpen te zijn, niet alleen om der straffe, maar ook om des gewetens wil.","6":"Want daarom betaalt gij ook schattingen; want zij zijn dienaars van God, in ditzelve geduriglijk bezig zijnde.","7":"Zo geeft dan een iegelijk, wat gij schuldig zijt; schatting, dien gij de schatting, tol, dien gij den tol, vreze, dien gij de vreze, eer, dien gij de eer *schuldig* *zijt*.","8":"Zijt niemand iets schuldig, dan elkander lief te hebben; want die den ander liefheeft, die heeft de wet vervuld.","9":"Want dit: Gij zult geen overspel doen, gij zult niet doden, gij zult niet stelen, gij zult geen valse getuigenis geven, gij zult niet begeren; en zo er enig ander gebod is, wordt in dit woord als in een hoofdsom begrepen, *namelijk* in dit: Gij zult uw naaste liefhebben gelijk uzelven.","10":"De liefde doet den naaste geen kwaad. Zo is dan de liefde de vervulling der wet.","11":"En dit *zeg* *ik* *te* *meer*, dewijl wij de gelegenheid des tijds weten, dat het de ure is, dat wij nu uit den slaap opwaken; want de zaligheid is ons nu nader, dan toen wij *eerst* geloofd hebben.","12":"De nacht is voorbijgegaan, en de dag is nabij gekomen. Laat ons dan afleggen de werken der duisternis, en aandoen de wapenen des lichts.","13":"Laat ons, als in den dag, eerlijk wandelen; niet in brasserijen en dronkenschappen, niet in slaapkameren en ontuchtigheden, niet in twist en nijdigheid;","14":"Maar doet aan den Heere Jezus Christus, en verzorgt het vlees niet tot begeerlijkheden."},"KJV":{"1":"Let every soul be subject unto the higher powers. For there is no power but of God: the powers that be are ordained of God.","2":"Whosoever therefore resisteth the power, resisteth the ordinance of God: and they that resist shall receive to themselves damnation.","3":"For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:","4":"For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to *execute* wrath upon him that doeth evil.","5":"Wherefore *ye* must needs be subject, not only for wrath, but also for conscience sake.","6":"For for this cause pay ye tribute also: for they are God's ministers, attending continually upon this very thing.","7":"Render therefore to all their dues: tribute to whom tribute *is due*; custom to whom custom; fear to whom fear; honour to whom honour.","8":"Owe no man any thing, but to love one another: for he that loveth another hath fulfilled the law.","9":"For this, Thou shalt not commit adultery, Thou shalt not kill, Thou shalt not steal, Thou shalt not bear false witness, Thou shalt not covet; and if *there be* any other commandment, it is briefly comprehended in this saying, namely, Thou shalt love thy neighbour as thyself.","10":"Love worketh no ill to his neighbour: therefore love *is* the fulfilling of the law.","11":"And that, knowing the time, that now *it is* high time to awake out of sleep: for now *is* our salvation nearer than when we believed.","12":"The night is far spent, the day is at hand: let us therefore cast off the works of darkness, and let us put on the armour of light.","13":"Let us walk honestly, as in the day; not in rioting and drunkenness, not in chambering and wantonness, not in strife and envying.","14":"But put ye on the Lord Jesus Christ, and make not provision for the flesh, to *fulfil* the lusts"}},"tsk":{"1":[{"kopje":"Ieder mens","refs":["Deut 17:12","Ef 5:21","Tit 3:1","1 Petr 2:13-17","2 Petr 2:10","2 Petr 2:11","Judas 1:8"]},{"kopje":"er is","refs":["1 Sam 2:8","1 Kron 28:4","1 Kron 28:5","Ps 62:12","Spr 8:15","Spr 8:16","Jer 27:5-8","Dan 2:21","Dan 4:32","Dan 5:18-23","Matt 6:13","Joh 19:11","Openb 1:5","Openb 17:14","Openb 19:16"]}],"2":[{"kopje":"macht","refs":["Jer 23:8-17","Jer 44:14-17","Tit 3:1"]},{"kopje":"instelling","refs":["Jes 58:2","1 Petr 2:13"]},{"kopje":"oordeel halen","refs":["Rom 13:5","Matt 23:14","Mark 12:40","Luk 20:47","Jak 3:1"]} k de kerkedienaren."},{"catchword":"den machten,","tekst":"Dat is, den overheden, die van God over andere met macht en autoriteit gesteld zijn."},{"catchword":"over haar gesteld","tekst":"Grieks, over hebbende, op uitnemende; dat is, overste macht hebbende; waardoor verstaan worden niet alleen de hoge overheden, maar ook allen, die onder hen in enig ambt van regering gesteld zijn; 1Ti 2:2 ; 1Pe 2:13-14 ."},{"catchword":"onderworpen;","tekst":"Dat is, moeten hun niet alleen gehoorzaam zijn, maar ook behoorlijk erkennen en eer bewijzen."},{"catchword":"geen macht","tekst":"Dat is geen overheid met macht bekleed."},{"catchword":"dan van God,","tekst":"Namelijk die niet alleen het ambt der overheid heeft ingesteld, maar die ook de personen [hoewel meest door het middel van mensen] daartoe verkiest en stelt; Pro 8:15 ; Dan 4:32 ."},{"catchword":"die er zijn,","tekst":"Namelijk hetzij hoge of lage, hetzij opperste of onder anderen gesteld; 1Pe 2:13-14 ."},{"catchword":"geordineerd","tekst":"Dat is, ingesteld onder het menselijk geslacht, om hetzelve in Gods plaats met orde te regeren; hoewel sommigen hunne macht dikwijls misbruiken, hetwelk God toelaat om de zonden des volks te straffen; Job 34:30 ."}],"2":[{"catchword":"tegen de macht stelt,","tekst":"Namelijk niet alleen met opstand, gelijk Absalom, maar ook met ongehoorzaamheid in zaken, die tegen Gods Woord niet strijden."},{"catchword":"een oordeel","tekst":"Dat is, ene straf, zo van God als van de overheden."},{"catchword":"halen","tekst":"Grieks, ontvangen."}],"3":[{"catchword":"de oversten","tekst":"Dat is, de overheden over ons gesteld."},{"catchword":"tot een vreze","tekst":"Namelijk van te zullen straffen."},{"catchword":"den goeden werken,","tekst":"Dat is, als gij weldoet en hunne bevelen gehoorzaam zijt."},{"catchword":"den kwaden","tekst":"Namelijk, werken, dat is, als gij kwaaddoet en hunne bevelen overtreedt."},{"catchword":"Wilt gij nu de macht niet vrezen,","tekst":"Dat is, wilt gij vrij zijn van de vrees om van hen gestraft te worden."},{"catchword":"lof van haar hebben;","tekst":"Dat is, van hen geprezen worden en met vergelding vereerd. Want het ambt der overheid is, niet alleen het kwaad te straffen, maar ook het goed te belonen; door welke twee zaken als door zenuwen het lichaam van den staat samengebonden en bijeengehouden wordt."}],"4":[{"catchword":"Gods dienares,","tekst":"Dat is, van God gesteld, om als een instrument Gods u te dienen."},{"catchword":"u ten goede","tekst":"Dat is, om door dezelve alle goeds u toe te brengen en voor uw welvaren te zorgen. Zie de aantekeningen 1Ti 2:2 ."},{"catchword":"kwaad doet,","tekst":"Dat is, de goede wetten der overheden overtreedt."},{"catchword":"zo vrees;","tekst":"Namelijk van hen daarover gestraft te zullen worden."},{"catchword":"draagt het zwaard niet tevergeefs;","tekst":"Dat is, heeft de macht ontvangen om de kwaaddoeners zelfs ook met den dood te straffen, Gen 9:6 ; en laat niet zonder oorzaak het zwaard voor zich dragen, of draagt het aan zijne zijde, om te kennen te geven dat hij zulke macht heeft en die tegen de boosdoeners ook zal uitvoeren."},{"catchword":"een wreekster","tekst":"Namelijk van Gods wege, dien de wraak toekomt; Rom 12:19 ."},{"catchword":"tot straf dengene,","tekst":"Grieks, toorn. Zie dergelijke Mat 3:7 ; Luk 21:23 ; Rom 2:8 ."}],"5":[{"catchword":"nodig onderworpen te zijn,","tekst":"Namelijk om rechte onderdanen, en voornamelijk rechte Christenen te zijn."},{"catchword":"om der straffe,","tekst":"Dat is, uit vrees van straf. Grieks, toorn."},{"catchword":"om des gewetens wil","tekst":"Dat is, omdat wij weten, dat God zulks verordineerd en bevolen heeft, en dat overzulks niemand met een goede en geruste conscientie kan zijn, die dat niet doet."}],"6":[{"catchword":"daarom","tekst":"Dat is, het blijkt dat gij den overheden onderworpen zijt en behoort te zijn, omdat gij schatting betaalt; zie Mat 22:21 ."},{"catchword":"betaalt gij ook","tekst":"Namelijk aan de overheden, of die van hen st":"Dat is, zijnen naaste."},{"catchword":"de wet","tekst":"Dat is, de geboden van de tweede tafel der wet, gelijk in vs.9 verklaard wordt."},{"catchword":"vervuld","tekst":"Dat is, gedaan en onderhouden hetgeen niet alleen in een of twee geboden, maar in al de geboden tezamen geëist wordt, ten aanzien van al de delen zelve; hoewel niemand ten aanzien van de trappen der volmaaktheid in dit leven hetzelve kan volbrengen, alzo onze liefde hier nog onvolmaakt is; 1Ki 8:46 ; Psa 19:13 ; Pro 20:9 ; Jam 3:2 ; 1Jo 1:8 ."}],"9":[{"catchword":"Gij zult geen overspel doen,","tekst":"De apostel houdt de orde van de geboden niet, gelijk zij in de tien geboden voorgesteld worden, omdat daaraan niet zoveel is gelegen, als maar al de geboden wel onderhouden worden."},{"catchword":"in dit woord als in een hoofdsom begrepen,","tekst":"Dat is, in dit ene gebod."}],"10":[{"catchword":"De liefde doet den naaste geen kwaad","tekst":"Hij beschrijft hier den aard der liefde, gelijk ook 1Co 13 ."},{"catchword":"de vervulling der wet","tekst":"Zie vs.8, en 1Ti 1:5 ."}],"11":[{"catchword":"dewijl wij de gelegenheid des tijds weten,","tekst":"Dat is, alzo wij nu niet meer ongelovig zijn, gelijk wij in voortijden waren, zijnde in den duisteren nacht der onwetendheid, Eph 4:18 ; Col 1:13 ; 1Jo 2:8 , maar alzo Christus de Zon der gerechtigheid, Mal 4:2 , en het licht der wereld, Joh 8:12 , ons nu verschenen is."},{"catchword":"den slaap opwaken;","tekst":"Namelijk der zonden; Eph 5:14 ; 1Th 5:6 ."},{"catchword":"de zaligheid","tekst":"Of, onze zaligheid is nu nader; dit is, de prijs onzer hemelse roeping in Christus Jezus, waar wij naar lopen en jagen, 1Co 9:24-25 ; Phi 3:14 , welke is het einde onzes geloofs; 1Pe 1:9 ."},{"catchword":"is ons nu nader,","tekst":"Dat is, wij zijn nu voor onzen Christelijken loop dezelve nader bijgekomen, om dezelve haast te grijpen, Phi 3:12 ; 1Ti 6:12 ; en daarom moeten wij niet verflauwen om dezen Christelijken loop te voleindigen, 2Ti 4:7 , alzo het grote schande en schade zou zijn, dat wij, zo nabij gekomen zijnde, door verflauwen of afwijken dezelve niet zouden verkrijgen. Want hoe nader iemand aan den prijs komt, hoe sterker hij behoort te lopen."},{"catchword":"toen wij eerst geloofd hebben","tekst":"Dat is, toen wij eerst tot het geloof in Christus geroepen en bekeerd zijn."}],"12":[{"catchword":"nacht is","tekst":"Namelijk der onwetendheid; 1Th 5:5 ."},{"catchword":"voorbijgegaan,","tekst":"Het Griekse woord betekent dat dezelve ten merendeel voorbijgegaan is. Want al de duisternis is nog uit onze harten niet volkomen weggedaan; 1Co 13:9-10 ."},{"catchword":"de dag","tekst":"Namelijk der zaligmakende kennis, vs.13; 1Th 5:5 ."},{"catchword":"is nabij gekomen","tekst":"Dat is, wij zijn tot het zaligmakende licht der kennis van Christus gekomen, doch niet volkomen, zolang wij in dit leven zijn, maar hebben zulk een licht, gelijk er is als de dag begint aan te breken en te lichten."},{"catchword":"afleggen","tekst":"Namelijk gelijk de mensen, als het dag is geworden, de nachtklederen en dekens verwerpen, en met dezelve gene gemeenschap meer hebben; Eph 4:22 ."},{"catchword":"de werken der duisternis,","tekst":"Dat is, de zonden, die degenen, die nog in de duisternis der onwetendheid zijn, gewoon zijn te doen, en voornamelijk die lelijke zonden, welke ook de mensen zich schamen openbaar in het licht te doen, maar die zij des nachts in duisternis bedrijven; Job 24:15-16 ; Joh 3:20-21 ; 1Th 5:7 . Waarvan enige in het vs.13 verhaald worden."},{"catchword":"aandoen","tekst":"Of, aantrekken; gelijk degenen doen, die, uit den slaap opstaande, hunne klederen aantrekken of hunne naaktheid te bedekken en eerbaar in den dag te wandelen."},{"catchword":"de wapenen","tekst":"Dit woord betekent al hetgeen waarmede het lichaam bedekt wordt tegen alle kwetsingen; en worden daardoor alhier verstaan allerlei Christelijke deugden, met welke onze ziel niet alleen bekleed en versierd wordt, maar ook als gewapend tegen de kwetsingen en verzoekingen des duivels en des vleesches. Zie Rom 6:13 ; 2Co 6:7 ; Eph 6:11-12 , enz.; 1Th 5:8 ."},{"catchword":"des lichts","tekst":"Dat is, die voortkomen van het licht der ware kennis Gods en tot Zijne eer voor de mensen lichten, en die betamen dengenen, die tot dit licht geroepen zijn en in het licht eerbaar willen wandelen."}],"13":[{"catchword":"als in den dag,","tekst":"Dat is, gelijk betaamt dengenen, wien door de genade Gods het licht der zaligmakende kennis verschenen is."},{"catchword":"eerlijk","tekst":"Dat is, niet alleen godzalig voor God, maar ook eerbaar voor de mensen."},{"catchword":"wandelen;","tekst":"Dat is, ons leven aanstellen, en onder de mensen verkeren."},{"catchword":"brasserijen","tekst":"Waardoor verstaan worden, niet eerlijke en matige maaltijden, Gen 21:8 ; Joh 2:1 , maar gulzige en ontuchtige, in welke allerlei overdadigheid, dartelheid, danserij en lichtvaardigheid gepleegd wordt."},{"catchword":"dronkenschappen,","tekst":"Of, onmatig zuipen van wijn of sterken drank; Isa 5:22 ."},{"catchword":"in slaapkameren","tekst":"Dat is, overspelen, of hoererijen, die in de slaapkamers gemeenlijk gepleegd worden."},{"catchword":"ontuchtigheden,","tekst":"Dat is, geile en onkuische dartelheden."}],"14":[{"catchword":"doet aan","tekst":"Of, trekt aan; namelijk als uw kleed en wapen."},{"catchword":"den Heere Jezus Christus,","tekst":"Namelijk aannemende door het geloof Zijne gerechtigheid, en al Zijne deugden navolgende, daarmede uwe ziel bekledende en versierende; Gal 3:27 ."},{"catchword":"verzorgt","tekst":"Grieks, maakt geen voorzorg des vleesches."},{"catchword":"het vlees niet","tekst":"Dat is, het lichaam, waarmede niet wordt verboden dat men het lichaam zou mogen verzorgen met een eerlijk kleed, spijs, drank, medicijnen en andere dingen tot onderhoud van hetzelve nodig; want dat wordt ook geprezen; Eph 5:29 ; 1Ti 5:8 , 1Ti 5:23 , maar om het in zijn kwade lusten te voldoen; 1Co 9:27 ."},{"catchword":"begeerlijkheden","tekst":"Namelijk die strekken tot onmatigheid, hovaardij, gulzigheid, onkuischheid, om het daarin te voeden en zijn eis te geven; 1Jo 2:16 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"LET every soul [That is, every men, of what linage, state, calling, or age so ever he be, and consequently the minutes of the Church also] be subject [that is, must not be only obedient to them, but also duly acknowledge and honor them] to the powers [that is, the Magistrates, which are by Fod set over others, with power and authority] set over (them) [Gr. Having or excellent, i.e. having supreme power: whereby are understood not only the highest Magistrates, but also that are set in any office of government under them. 1 Tim 2.2. 1 Pet. 2.13,14.] For there is no power [that is, no Magistrate clothed with power] but of God: [namely, who hath not only instituted the office of Magistracy, but who also chooses and appointeth the persons thereunto, although for the most part by the means of men, Prov. 8.15. Dan. 4.32.] and the powers that are [namely, be they high or low, be they ordained of God. [that is, instituted amongst mankind, to rule them with order in Gods stead: although some of them abuse their power, which God permitted to punish the sins of the people, Job. 34.30.]"}],"2":[{"catchword":null,"tekst":"So that he that opposeth the power, [Not only by rebellion as Absalom, but also by obedience in thing: which are not contrary to Gods word] resisteth the ordinance of God, and they that resist it, shall bring [Gr. Receive] a judgement [that is, a punishment, as well from God as from the Magistrate] upon themselves."}],"3":[{"catchword":null,"tekst":"For Rulers [That is, the Magistrates set over us] are not (for) a fear [namely, that they will punish] to good works [that is, when thou dost well and art obedient to their commands] but to evil, and transgressed their commands] Now wilt thou not fear the power? [that is, wilt thou be free from fear of being punished by them] Do good and thou shalt have praise of them. [that is, be praised by them, and honored with recompense. For the offences of the magistracy is not only to punish evil, but also to reward that which is good, by which two things, as by sinews, the body politick is bound and kept together.]"}],"4":[{"catchword":null,"tekst":"For it is Gods [That is, appointed by God, to serve thee as Gods instrument] for good to thee: [that is, to bring all good to thee by the same, and to take care for thy welfare. See the annot. On 1 Tim. 2.2.] but if thou doth evil, [that is, transgressed the good Law of the Magistrates] then fear: [namely, that thou shalt be punished by them for it] For it beareth not the sword [that is, hath received the power to punish evil doers even with death itself, Gen. 9.6. and causeth not the sword to be born before him without cause, and wears it by his side to give to understand that he hath such power, and will also execute the same against the evil doers] in vain. For it is Gods Minister, a revenge [namely, in Gods name to whom vengeance belongeth, Rom. 12.19.] for punishment [Gr. Wrath. See the like Mat. 3.7. Luk 21:23. Rom. 2.8.] to him that doth evil."}],"5":[{"catchword":null,"tekst":"Therefore it is necessary [Namely, to be true subjects, and especially true Christians] to be subjects, not only for punishment. [that is, for fear of punishment. Gr. Wrath] but also for conscience sake. [that is, because we know that God hath ordained and commanded this, and that this cause no man can have a good and conscience, which doth it not.]"}],"6":[{"catchword":null,"tekst":"For therefore [That is, it appears that ye are and ought to be subject to Magistrates, because we pay tribute. See Mat. 22.21.] also ye pay [namely, to the Magistrates, or those that are appointed by them for this purpose] tributes [whereby are understood all burdens which era imposed on the subjects] for [this is a reason to prove it to be equal that we should be obedient to Magistrates, and pay tribute] that are ministers of God, [Gr. Lettourgoi. Which word we here see to be used, not only of the Ecclesiastical Ministries, as Act 13:2. but also of politick and civil administrations. See also Rom. 15. 27. Heb. 1. 14.] being continually busied [Gr. Persevering to this same thing i.e. continually abiding labour, difficulty, trouble and care in this service. See of this word Act 1:14.] in this same thing. [namely, to serve God in governing of the people.]"}],"7":[{"catchword":null,"tekst":"Give therefore [Gr. Render or, recompense every one to their dues] to every one [namely, Magistrates, although it may also be taken in general] that which ye owe: tribute [it is properly that which is laid upon personal or real estate] to whom ye (owe) tribute: custom [it is that which is laid upon merchandise, or upon goods and wares that are imported exported] to who ye (owe) costume: fear to whom ye (owe) fear: [namely, to the Magistrates and their offices, whom they make use to punish evil doers] honour, to whom ye (owe) honor, [namely, to Magistrates, whether they be high or low, 1 Pet. 2.17.]"}],"8":[{"catchword":null,"tekst":"Be not ought indebted to any man, [That is, pay every one that whereunto ye are engaged into him, whether is money, service or anything else; which when it is not done, the engagement and debt remained] but to love one another. [for that engagement can never be done away, or paid off, but remains always fresh, which must continually be paid] For he that loveth another, [that is, his neighbor] he hath fulfilled [that is, done and observed that , not only which was required of one or two commandments, but in all commandments together, in respect of all the parts of them: although in regard of the degrees of perfection, no man can fulfill the same in this life, seeing our love is still imperfect here, 1 Kings 8.46. Ps. 19.13. Pro. 20.9. Jam. 3.2.1. Job. 1.8.] the Law [that is, the commandments of the second Table of the Law, as is declared in the following verse.]"}],"9":[{"catchword":null,"tekst":"For this, thou shalt not commit adultery , [The Apostle keeps not the order of the commandments, as they are propounded in the ten commandments, because that matters not so much, so that all the commandments be but well kept] thou shalt not kill, thou shalt not steal, thou shalt not bear false witness, thou shalt not covet, and if there be any other commandment, it is comprehended as in a capital sum, in this word, [that is, in this one commandment] (namely) in this, thou shalt love thy neighbour as thy self."}],"10":[{"catchword":null,"tekst":"Love [Here he describes the nature of love, as also 1 Cor. 13] doth not ill to his neighbor, Therefore is love the fulfilling of the Law. [See v. 8. and 1 Tim. 1.5.]"}],"11":[{"catchword":null,"tekst":"And this (I say the rather) seeing we know the opportunity of time, [that is, seeing we are now more unbelieving, as we were in former times, being in the dark night of ignorance, Eph. 4.18. Col. 1.13. 1Jn 2:8. but seeing Christ the son of righteousness, Mal. 4.2. and the light of the world, Joh 8:12. hath now appeared to us] that it is the hour that we now awake out of sleep: [namely, of sin, Eph. 5.14. 1 The. 5.6.] for salvation [or our salvation is now nearer i.e. the price of our heavenly calling in Christ Jesus, which we run and pursue after, 1 Cor. 9. v24,25. Phi. 3.14. is now nearer to us [that is, we are now by our Christian course come nearer to the same, shortly to lay hold of it, Phi. 3.12. 1 Tim. 6.12. and therefore we must not faint before we have finished this Christian race, 2 Tim. 4.7. Seeing it would be great shame and loss, that being come so nigh through fainting or turning away we should not obtain the same, For by how much nearer any one cometh to the prize, so much that the faster he ought to run] then when we (first) believed. [that is, when we were first called and converted to the faith of Christ.]"}],"12":[{"catchword":null,"tekst":"The night [Nam. Of ignorance, 1 The. 5.5.] is passed away, [the Greek word signifies that the most part hereof is passed. For all darkness is not yet perfectly done away out of our heart, 1 Cor. 13.9.10.] and the day [namely, of saving knowledge. V. 13. 1 Thes. 5.5] is come nigh, of Christ, yet not perfect as long as we are in this life, but have such a light as there is when the day begins to break and wax light] Let us therefore put off [namely, as men when it becomes day cast away cloathsand coverings, and have no more to do with them, Eph. 4.22.] the works of darkness, [that is, sins, which they are yet in ignorance are wont to commit, and especially those ugly sins which men are even ashamed to do publicly in the light, but which they commit by night in darkness, Job. 24.15,16. Jo. 3.20.21. 1 Thes. 5.7. whereof some are rehearsed in the following verse] and upon on [or draw on, as they do who arising from sleep draw on their cloths to cover their nakedness, and to walk honestly in the day] the arms [this word signifies all that wherewith the is covered against all wounding: & here are understood by all manner of Christian virtues, wherewith our soul are not only clad & adorned, but also as it were armed against the wounds & temptations of the devil, and the flesh See Ro. 6.3. 2 Cor. 6.7. Eph. 6.11,12. etc. 1 Th. 5.8.] of light. [that is, which proceeds from the true knowledge of God, and to his glory gives light before men, and which becomes those who are called to this light, and will walk honestly in the light.]"}],"13":[{"catchword":null,"tekst":"Let us walk [That is, order our lives and converse amongst them] decently [that is, not only our piously before God, but also fairly and honestly before men] as in the day: [that is, as becometh those, to whom by the grace of God the light of saving the knowledge hath appeared] not in rioting [whereby are understood not honorable and moderate feasts, Gen. 21.8. Job. 2.1. but gluttonous and immoderate, in which all manners of excess, wantonness, dancing and immodest practiced] and drunkenness, [or immoderate swallowing of wine or strong drink, Isa. 5.22.] not in bed-chambers [that is, adultery and fornications, which are commonly practiced in bed-chambers] and immodesties, [that is, lascivious unchaste wantonness] not in strife and envying."}],"14":[{"catchword":null,"tekst":"But put on [ Or draw on, as your garment or armour] the Lord Jesus Christ, [namely, by faith receiving his righteousness, and imitating all his virtues, cloathing and adorning your soul therewithal, Gal. 3.27.] and take not care [Gr. Make no provision of the flesh] for the flesh [that is, the body, whereby it is not forbidden that men might provide the body of a decent garment, meat, drink, physic and other things necessary for sustentation of the same: for that is even commended, Eph. 5.29. 1 Tim. 5.8,23. but not satisfy the same in its sinful lusts 1 Cor. 9.27.] unto lusts. [namely, which tend to intemperance, pride, gluttony, unchaste ness, therein to feed it, and to give it its desire, 1Jn 2:16.]"}]}}};

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
