-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En ik beveel u Febe aan, onze zuster, die een dienares is van de Gemeente die te Kenchreen is;","2":"opdat u haar ontvangt in de Heere, zoals het de heiligen betaamt, en haar bijstaat in welke zaak zij u ook nodig zou hebben; want zij is een voorstandster geweest van velen, ook van mijzelf.","3":"Groet Priscilla en Aquila, mijn medewerkers in Christus Jezus;","4":"die voor mijn leven hun hals gesteld hebben; hun dank ik niet alleen, maar ook alle Gemeenten van de heidenen.","5":"*Groet* ook de Gemeente in hun huis. Groet Epenetus, mijn beminde, die de eersteling is van Achaje voor Christus.","6":"Groet Maria, die veel voor ons gearbeid heeft.","7":"Groet Andronikus en Junias, mijn verwanten, en mijn medegevangenen, die vermaard zijn onder de apostelen, die ook vóór mij in Christus geweest zijn.","8":"Groet Amplias, mijn beminde in de Heere.","9":"Groet Urbanus, onze medearbeider in Christus, en Stachys, mijn beminde.","10":"Groet Apelles, die beproefd is in Christus. Groet hen, die van het *huisgezin* van Aristobulus *zijn*.","11":"Groet Herodion, die van mijn verwantschap is. Groet hen, die van *het* *huisgezin* van Narcissus *zijn*, degenen *namelijk*, die in de Heere zijn.","12":"Groet Tryfena en Tryfosa, *vrouwen* die in de Heere arbeiden. Groet Persis, de beminde *zuster*, die veel gearbeid heeft in de Heere.","13":"Groet Rufus, de uitverkorene in de Heere, en zijn moeder, die ook de mijne is.","14":"Groet Asynkritus, Flegon, Hermas, Patrobas, Hermes, en de broeders die bij hen zijn.","15":"Groet Filologus en Julia, Nereus en zijn zuster, en Olympas, en al de heiligen die bij hen zijn.","16":"Groet elkaar met een heilige kus. De Gemeenten van Christus groeten u.","17":"En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.","18":"Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.","19":"Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.","20":"En de God van de vrede zal de satan spoedig onder uw voeten verpletteren. De genade van onze Heere Jezus Christus zij met u. Amen.","21":"U groeten Timotheüs, mijn medearbeider, en Lucius, en Jason, en Socipater, mijn bloedverwanten.","22":"Ik, Tertius, die de brief geschreven heb, groet u in de Heere.","23":"U groet Gajus, de huiswaard van mij en van de hele Gemeente. U groet Erastus, de rentmeester van de stad, en de broeder Quartus.","24":"De genade van onze Heere Jezus Christus zij met u allen. Amen.","25":"Hem nu, Die machtig is u te bevestigen, naar mijn Evangelie en de prediking van Jezus Christus, naar de openbaring van het geheimenis dat sinds mensenheugenis verzwegen is geweest;","26":"maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;","27":"Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. *De brief* aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is."},"SV":{"1":"En ik beveel u Febe, onze zuster, die een dienares is der Gemeente, die te Kenchreen is;","2":"Opdat gij haar ontvangt in den Heere, gelijk het den heiligen betaamt, en haar bijstaat, in wat zaak zij u zou mogen van doen hebben; want zij is een voorstandster geweest van velen, ook van mijzelven.","3":"Groet Priscilla en Aquila, mijn medewerkers in Christus Jezus;","4":"Die voor mijn leven hun hals gesteld hebben; denwelken niet alleen ik danke, maar ook al de Gemeenten der heidenen.","5":"*Groet* ook de Gemeente in hun huis. Groet Epenetus, mijn beminde, die de eersteling is van Achaje in Christus.","6":"Groet Maria, die veel voor ons gearbeid heeft.","7":"Groet Andronikus en Junias, mijn magen, en mijn medegevangenen, welke vermaard zijn onder de apostelen, die ook voor mij in Christus geweest zijn.","8":"Groet Amplias, mijn beminde in den Heere.","9":"Groet Urbanus, onzen medearbeider in Christus, en Stachys, mijn beminde.","10":"Groet Apelles, die beproefd is in Christus. Groet hen, die van het *huisgezin* van Aristobulus *zijn*.","11":"Groet Herodion, die van mijn maagschap is. Groet hen, die van *het* *huisgezin* van Narcissus *zijn*, degenen *namelijk*, die in den Heere zijn.","12":"Groet Tryfena en Tryfosa, *vrouwen* die in den Heere arbeiden. Groet Persis, de beminde *zuster*, die veel gearbeid heeft in den Heere.","13":"Groet Rufus, den uitverkorene in den Heere, en zijn moeder en de mijne.","14":"Groet Asynkritus, Flegon, Hermas, Patrobas, Hermes, en de broeders, die met hen zijn.","15":"Groet Filologus en Julia, Nereus en zijn zuster, en Olympas, en al de heiligen, die met henlieden zijn.","16":"Groet elkander met een heiligen kus. De Gemeenten van Christus groeten ulieden.","17":"En ik bid u, broeders, neemt acht op degenen, die tweedracht en ergernissen aanrichten tegen de leer, die gij *van* *ons* geleerd hebt; en wijkt af van dezelve.","18":"Want dezulken dienen onzen Heere Jezus Christus niet, maar hun buik; en verleiden door schoonspreken en prijzen de harten der eenvoudigen.","19":"Want uw gehoorzaamheid is tot *kennis* *van* allen gekomen. Ik verblijde mij dan uwenthalve; en ik wil, dat gij wijs zijt in het goede, doch onnozel in het kwade.","20":"En de God des vredes zal den satan haast onder uw voeten verpletteren. De genade van onzen Heere Jezus Christus zij met ulieden. Amen.","21":"U groeten, Timotheüs, mijn medearbeider, en Lucius, en Jason, en Socipater, mijn bloedverwanten.","22":"Ik, Tertius, die den brief geschreven heb, groet u in den Heere.","23":"U groet Gajus, de huiswaard van mij en van de gehele Gemeente. U groet Erastus, de rentmeester der stad, en de broeder Quartus.","24":"De genade van onzen Heere Jezus Christus zij met u allen. Amen.","25":"Hem nu, Die machtig is u te bevestigen, naar mijn Evangelie en de prediking van Jezus Christus, naar de openbaring der verborgenheid, die *van* de tijden der eeuwen verzwegen is geweest;","26":"Maar nu geopenbaard is, en door de profetische Schriften, naar het bevel des eeuwigen Gods, tot gehoorzaamheid des geloofs, onder al de heidenen bekend is gemaakt;","27":"Den *zelven* alleen wijzen God *zij* door Jezus Christus de heerlijkheid in der eeuwigheid. Amen. *De brief* aan de Romeinen is geschreven van Korinthe, en gezonden door Febe, de dienares der gemeente die te Kenchreen is."},"KJV":{"1":"I commend unto you Phebe our sister, which is a servant of the church which is at Cenchrea:","2":"That ye receive her in the Lord, as becometh saints, and that ye assist her in whatsoever business she hath need of you: for she hath been a succourer of many, and of myself also.","3":"Greet Priscilla and Aquila my helpers in Christ Jesus:","4":"Who have for my life laid down their own necks: unto whom not only I give thanks, but also all the churches of the Gentiles.","5":"Likewise *greet* the church that is in their house. Salute my wellbeloved Epaenetus, who is the firstfruits of Achaia unto Christ.","6":"Greet Mary, who bestowed much labour on us.","7":"Salute Andronicus and Junia, my kinsmen, and my fellowprisoners, who are of note among the apostles, who also were in Christ before me.","8":"Greet Amplias my beloved in the Lord.","9":"Salute Urbane, our helper in Christ, and Stachys my beloved.","10":"Salute Apelles approved in Christ. Salute them which are of Aristobulus'","11":"Salute Herodion my kinsman. Greet them that be of the *household* of Narcissus, which are in the Lord.","12":"Salute Tryphena and Tryphosa, who labour in the Lord. Salute the beloved Persis, which laboured much in the Lord.","13":"Salute Rufus chosen in the Lord, and his mother and mine.","14":"Salute Asyncritus, Phlegon, Hermas, Patrobas, Hermes, and the brethren which are with them.","15":"Salute Philologus, and Julia, Nereus, and his sister, and Olympas, and all the saints which are with them.","16":"Salute one another with an holy kiss. The churches of Christ salute you.","17":"Now I beseech you, brethren, mark them which cause divisions and offences contrary to the doctrine which ye have learned; and avoid them.","18":"For they that are such serve not our Lord Jesus Christ, but their own belly; and by good words and fair speeches deceive the hearts of the simple.","19":"For your obedience is come abroad unto all *men*. I am glad therefore on your behalf: but yet I would have you wise unto that which is good, and simple concerning evil.","20":"And the God of peace shall bruise Satan under your feet shortly. The grace of our Lord Jesus Christ *be* with you. Amen.","21":"Timotheus my workfellow, and Lucius, and Jason, and Sosipater, my kinsmen, salute you.","22":"I Tertius, who wrote *this* epistle, salute you in the Lord.","23":"Gaius mine host, and of the whole church, saluteth you. Erastus the chamberlain of the city saluteth you, and Quartus a brother.","24":"The grace of our Lord Jesus Christ *be* with you all. Amen.","25":"Now to him that is of power to stablish you according to my gospel, and the preaching of Jesus Christ, according to the revelation of the mystery, which was kept secret since the world began,","26":"But now is made manifest, and by the scriptures of the prophets, according to the commandment of the everlasting God, made known to all nations for the obedience of faith:","27":"To God only wise, *be* glory through Jesus Christ for ever. Amen."}},"tsk":{"1":[{"kopje":"beveel u aan","refs":["2 Kor 3:1"]},{"kopje":"onze","refs":["Matt 12:50","Mark 10:30","1 Tim 5:2","Jak 2:15","1 Petr 1:22","1 Petr 1:23"]},{"kopje":"een dienares","refs":["Luk 8:3","1 Tim 5:9","1 Tim 5:10"]},{"kopje":"Kenchreen","refs":["Hand 18:18"]}],"2":[{"kopje":"ontvangt","refs":["Rom 15:7","Matt 10:40-42","Matt 25:40","Fil 2:29","Kol 4:10","Filem 1:12","Filem 1:17","2 Joh 1:10","3 Joh 1:5-10"]},{"kopje":"zoals","refs":["Ef 5:3","Fil 1:27","1 Tim 2:10","Tit 2:3"]},{"kopje":"want","refs":["Rom 16:3","Rom 16:4","Rom 16:6","Rom 16:9","Rom 16:23","Hand 9:36","Hand 9:39","Hand 9:41","Fil 4:14-19","2 Tim 1:18"]}],"3":[{"kopje":"Priscilla","refs":["Hand 18:2-17","Hand 18:26","1 Kor 16:19","2 Tim 4:19"]},{"kopje":"mijn","refs":["Rom 16:9","1 Kor 16:16"]}],"4":[{"kopje":"hebben","refs":["Rom 5:7","Joh 15:13","Fil 2:30","1 Joh 3:16"]},{"kopje":"gesteld","refs":["Joz 10:24","2 Sam 22:41","Micha 2:3"]},{"kopje":"ook","refs":["Hand 15:41","Hand 16:5","1 Kor 7:17","1 Kor 16:1","1 Tess 2:14","Openb 1:4"]}],"5":[{"kopje":"de Gemeente","refs":["Matt 18:20","1 Kor 16:19","Kol 4:15","Filem 1:2"]},{"kopje":"mijn","refs":["Rom 16:8","Rom 16:12","3 Joh 1:1"]},{"kopje":"die","refs":["Rom 11:16","1 Kor 16:15","Jak 1:18","Openb 14:4"]},{"kopje":"Achaje","refs":["Rom 15:26","Hand 18:12","H <span class=\"wl wl-kjv\" data-code=\"G4172\">city</span> <span class=\"wl wl-kjv\" data-code=\"G782\">saluteth</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2890\">Quartus</span> a brother.","24":"The <span class=\"wl wl-kjv\" data-code=\"G5485\">grace</span> of <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> be <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">you</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all.</span> Amen.","25":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Now</span> to him that is of <span class=\"wl wl-kjv\" data-code=\"G1410\">power</span> to <span class=\"wl wl-kjv\" data-code=\"G4741\">stablish</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">according</span> to <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G2098\">gospel,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G2782\">preaching</span> of <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ,</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"G602\">revelation</span> of the <span class=\"wl wl-kjv\" data-code=\"G3466\">mystery,</span> which was kept <span class=\"wl wl-kjv\" data-code=\"G4601\">secret</span> since the world <span class=\"wl wl-kjv\" data-code=\"G5550\">began,</span>","26":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G3568\">now</span> is made <span class=\"wl wl-kjv\" data-code=\"G5319\">manifest,</span> <span class=\"wl wl-kjv\" data-code=\"G5037\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G1124\">scriptures</span> of the <span class=\"wl wl-kjv\" data-code=\"G4397\">prophets,</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"G2003\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"G166\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> made <span class=\"wl wl-kjv\" data-code=\"G1107\">known</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1484\">nations</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G5218\">obedience</span> of faith:","27":"To <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G3441\">only</span> <span class=\"wl wl-kjv\" data-code=\"G4680\">wise,</span> be <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">through</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> <span class=\"wl wl-kjv\" data-code=\"G165\">ever.</span> Amen."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"beveel u Febe,","tekst":"Dat is, recommandeer."},{"catchword":"zuster,","tekst":"Namelijk in Christus."},{"catchword":"een dienares is der Gemeente,","tekst":"Namelijk niet in den dienst van prediken; want die wordt aan de vrouwen verboden, 1Co 14:34 , en 1Ti 2:12 , maar òf een diakones, die de kranken verzorgde, 1Ti 5:9-10 , òf, hetwelk waarschijnlijker is, die de gemeente diende in het ontvangen en herbergen van de verjaagde Christenen, en ook van de apostelen en leraars, gelijk blijkt uit vs.2."},{"catchword":"Kenchreën is;","tekst":"Eene haven van Corinthe; zie van deze plaats Act 18:18 ."}],"2":[{"catchword":"ontvangt","tekst":"Dat is, herbergt en vriendelijk bejegent."},{"catchword":"in den Heere,","tekst":"Dat is, om des Heeren wil, of in des Heeren naam."},{"catchword":"gelijk het den heiligen betaamt,","tekst":"Dat is, gelijk haar, die een heilige en godzalige vrouw is, en ook ulieden, die vrome Christenen zijt, betaamt. Grieks, waardiglijk den heiligen."},{"catchword":"bijstaat,","tekst":"Namelijk met raad en daad, om haar hare zaken te helpen verrichten, die zij te Rome te doen heeft."},{"catchword":"een voorstandster geweest van velen,","tekst":"Of, herbergster; namelijk die vele verjaagde Christenen in haar huis heeft ontvangen. Zie 1Ti 5:10 . Het schijnt dan dat zij een welgestelde vrouw geweest is."}],"3":[{"catchword":"Priscilla","tekst":"De huisvrouw van Aquila, die een zeer kloeke en godzalige vrouw was."},{"catchword":"Aquila,","tekst":"De man van Priscilla, een tentenmaker uit Pontus. Zie van beiden Act 18:2 , enz.; 1Co 16:19 ; 2Ti 4:19 . Deze waren tevoren uit Rome verdreven door het gebod van den keizer Claudius, en waren te Corinthe, toen Paulus daar kwam, Act 18:2 ; en alzo hier blijkt dat zij nu wederom te Rome waren, zo schijnt wel dat de apostel tweemaal te Corinthe is geweest, want deze zendbrief is uit Corinthe geschreven."},{"catchword":"medewerkers in Christus Jezus;","tekst":"Namelijk in het verbreiden der Evangelische leer, waarin zij naar hunne gelegenheid en beroeping het beste deden."}],"4":[{"catchword":"leven","tekst":"Grieks, ziel. Zie Mat 2:20 ."},{"catchword":"hun hals gesteld hebben;","tekst":"Grieks, hun hals onder gesteld heeft; dat is, hun leven gewaagd hebben. Dit is geschied, òf in den oploop te Corinthe tegen Paulus, Act 18:12 , òf in den oploop te Efeze, Act 19:23 , alwaar zij toen met Paulus waren; Act 18:18 ."},{"catchword":"al de Gemeenten der heidenen","tekst":"Overmits dezelve daardoor verkregen hebben die weldaad, dat ik nog in het leven ben gebleven om dezelve te leren en te versterken."}],"5":[{"catchword":"de Gemeente in hun huis","tekst":"Dat is, de gelovigen, die òf tot hun huisgezin behoorden, òf die in hun huis vergaderden. Zie Col 4:15 ; Phm 1:2 ."},{"catchword":"beminde,","tekst":"Namelijk om zijn bijzondere godzaligheid."},{"catchword":"de eersteling is","tekst":"Dat is, die een van de eersten is, die ik door mijne predikatie tot het geloof gebracht heb. Zie Rom 11:16 ; 1Co 15:20 , en 1Co 16:15 ."},{"catchword":"van Acháje in Christus","tekst":"Dat is, van al de gelovigen, diein Achaje zijn."}],"6":[{"catchword":"ons","tekst":"Dat is, voor de gelovigen, en voornamelijk voor de leraars."},{"catchword":"gearbeid heeft","tekst":"Namelijk met hen te herbergen, en andere diensten te doen."}],"7":[{"catchword":"mijn magen,","tekst":"Dat is, Joden van mijne maagschap."},{"catchword":"medegevangenen,","tekst":"Dat is, die ook mede, gelijk als ik, om des Evangelies wil gevangen zijn geweest; Col 4:10 ; Phm 1:23 ."},{"catchword":"de apostelen,","tekst":"Dat is, onder degenen, die het Evangelie hier en daar prediken. Want dit woord wordt niet alleen den twaalf apostelen bijzonder toegeschreven, maar ook somwijlen anderen leraars; zie 2Co 8:23 . Of, wel bekend, bij de apostelen."},{"catchword":"voor mij","tekst":"Dat is, eer ik bekeerd ben geweest."},{"catchword":"in Christus geweest zijn","tekst":"Dat is, tot den Christelijken godsdienst zijn bekeerd geweest."}],"8":[{"catchword":"in den Heere","tekst":"Dat is, omdat hij ook in den Heere gelooft."}],"10":[{"catchword":"beproefd is in Christus","tekst":"Dat is, die door vele gevaren en zwarigheden geoefend zijnde, oprecht is bevonden."},{"catchword":"Aristobúlus","tekst":"Het schijnt dat deze Aristobulus nog zelf geen Christen was, omdat de Apostel hem niet doet groeten; doch het blijkt evenwel dat hij een bescheiden man is geweest, die de Christenen in zijn huisgezin duldde."}],"11":[{"catchword":"die van mijn maagschap is","tekst":"Zie vs.7."},{"catchword":"die in den Heere zijn","tekst":"Dat is, die Christenen zijn. Want die nog heidenen waren in dat huisgezin, die groet hij niet."}],"12":[{"catchword":"die in den Heere arbeiden","tekst":"Zie vs.5."}],"13":[{"catchword":"den uitverkorene in den Heere,","tekst":"Dat is, die een uitgelezen en bijzonder man is."},{"catchword":"zijn moeder","tekst":"Namelijk naar de natuur."},{"catchword":"de mijne","tekst":"Namelijk naar de liefde en toegenegenheid. Zie 1Ti 5:2 ."}],"16":[{"catchword":"met een heiligen kus","tekst":"Dat is, met een kus van vrede en broederschap, met welken de gelovigen, naar het gebruik van die landen en tijden, elkander plachten te groeten. En wordt heilig genaamd, omdat zij niet uit vleselijke maar geestelijke liefde en zonder geveinsdheid gegeven worden; Gen 29:11 ."}],"17":[{"catchword":"degenen,","tekst":"Hij verstaat door dezulken zo andere ketters als degenen, die, den Christelijken godsdienst aangenomen hebbende, leerden dat de ceremoniën der wet nog noodzakelijk moesten onderhouden worden ter zaligheid. Zie Gal 1:7 ; Phi 3:2 ; 1Ti 4:1 ; 2Ti 3:1 , enz.; Tit 3:10 ."}],"18":[{"catchword":"Want dezulken","tekst":"Hij beschrijft hen, opdat zij mogen bekend en te beter gemeden worden."},{"catchword":"dienen onzen Heere Jezus Christus niet,","tekst":"Namelijk hoewel zij zich voor dienaars des Heeren uitgeven."},{"catchword":"hun buik;","tekst":"Dat is, leren om vuil gewins wil, en om hunnen buik te verzadigen; 1Ti 6:5 ; Tit 1:11 ."},{"catchword":"der eenvoudigen","tekst":"Grieks, dergenen, die niet kwaad zijn."}],"19":[{"catchword":"uw gehoorzaamheid","tekst":"Namelijk welke gij betoont in het aannemen der leer van het Evangelie, die hij geloof noemt; Rom 1:8 . Zie 1Th 1:8 ."}],"20":[{"catchword":"de God des vredes","tekst":"Zie Rom 15:33 ."},{"catchword":"den satan","tekst":"Namelijk die door zijne middelen u zoekt te verleiden."},{"catchword":"haast","tekst":"Hetwelk hier wel begint, maar in het einde van deze wereld, hetwelk aanstaande is, Rev 22:12 , volkomen zal geschieden."},{"catchword":"onder uw voeten verpletteren","tekst":"Dat is, doen, dat gij hem door Christus volkomen zult overwinnen. De apostel schijnt hier te zien op de eerste belofte des Evangelies; Gen 3:15 . Zie ook Rev 12:11 ."},{"catchword":"De genade van onzen Heere Jezus Christus zij met ulieden","tekst":"Dezen wens gebruikt de apostel in al zijne zendbrieven. Zie 2Th 3:17 ."}],"22":[{"catchword":"die den brief geschreven heb,","tekst":"Namelijk uit den mond van Paulus."}],"23":[{"catchword":"Gajus,","tekst":"Zie van hem Act 20:4 ; 1Co 1:14 ."},{"catchword":"huiswaard van mij","tekst":"Dat is, die in zijn huis den apostel herbergde en andere gelovigen, die daar niet woonachtig waren. Zie vs.1."},{"catchword":"de rentmeester","tekst":"Of, bezorger, ontvanger. Zie Luk 16:1 ."},{"catchword":"der stad,","tekst":"Dat is, van Corinthe, vanwaar de apostel dezen brief geschreven heeft."}],"24":[{"catchword":"De genade van onzen Heere Jezus Christus","tekst":"Zie vs.20. De apostel herhaalt dezen wens wederom, om te tonen hoe nodig dezelve is, en dat deze brief uit grote toegenegenheid van hem is geschreven."}],"25":[{"catchword":"mijn Evangelie","tekst":"Dat is, dat door mij gepredikt is. Zie Rom 2:16 ."},{"catchword":"en de prediking van Jezus Christus,","tekst":"Dat is, hetwelk is de prediking, namelijk òf die de Heere Christus zelf gepredikt heeft; Heb 1:1-2 , òf wiens inhoud is de Heere Christus; 1Co 2:2 ."},{"catchword":"der verborgenheid,","tekst":"Dat is, van de leer des Evangelies van Christus nu in het vlees gekomen zijnde, welke vóór dezen alzo niet is bekend geweest, en in welke leer zodanig ene wijsheid Gods geopenbaard wordt, die door gener creaturen verstand kon doorgrond worden; 1Pe 1:12 ."},{"catchword":"van de tijden der eeuwen","tekst":"Grieks, eeuwige tijden; of van de tijden der wereld; dat is, nadat de wereld geschapen is geweest."},{"catchword":"verzwegen is geweest;","tekst":"Dit is te verstaan, niet alzo, dat men in het Oude Testament van de Evangelische leer niet zou hebben geweten; want in vs.26 wordt verklaard, dat de openbaring dezer leer ook geschied is door de profetische schriften; maar ten aanzien van die klare openbaring en verkondiging nu in het Nieuwe Testament geschied, alzo Christus toen nog niet was gekomen; en de heidenen daarvan ganselijk niet wisten; Psa 147:20 ; Eph 2:12 ."}],"26":[{"catchword":"nu geopenbaard is,","tekst":"Namelijk in de tijden des Nieuwen Testaments."},{"catchword":"de profetische Schriften,","tekst":"Namelijk in welke de Messias beloofd en beschreven wordt, met al zijne omstandigheden en weldaden; Act 26:22 ; Rom 1:2 , en Rom 3:21 ; 1Pe 1:10 , wanneer dezelve worden vergeleken met hetgeen in het Nieuwe Testament wordt beschreven in Christus vervuld te zijn."},{"catchword":"naar het bevel","tekst":"Of, ordonnantie Gods, die goedgevonden heeft alzo der mensen zaligheid teweeg te brengen, en die niet is gehouden daarvan iemand rekenschap te geven."},{"catchword":"bekend is gemaakt;","tekst":"Namelijk daar het tevoren onder hen verzwegen was, vs.25."}],"27":[{"catchword":"Den zelven","tekst":"Of, den eeuwigen wijzen God, of, den alleen wijzen God, door Jezus Christus, wien zij de heerlijkheid in der eeuwigheid."},{"catchword":"een geroepen","tekst":"Van den van Paulus en hetgeen volgt, zie de aantekeningen Act 13:9 ; Rom 1:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"AND I commend [That is, recommend] unto you Phoebe our sister [namely, in Christ] who is a Minisiress [namely, not in the Ministry of preaching, for this is forbidden in women, 1 Cor. 14.34. and 1 Tim. 2.12. but either a Deaconess who took care of the sick, 1 Tim. 5.9,10. or which is more probable, which served the Church in receiving and habouring our Christians that were driven out of their Country, and also of the Apostles and teachers, as appears from the following verse] of the Church which is of Cenchrea. [A haven of Corinth. See of this place Acts. 18.18.]"}],"2":[{"catchword":null,"tekst":"That ye receive her [That is, lodge and use her kindly] in the Lord, [that is, for the Lords sake, or in the Lords name] as it becometh the Saints: [that is, as it becometh her who is holy and godly woman, and you also are good Christians. Gr. Worthily of the Saints] and assist her [namely, with counsel and deed, to help her to dispatch her business which she hath to do in Rome] in whatsoever matter she may have need of you. For she hath been an assistance [Or. Habourer. Namely, who hath received many Christians that were driven away, into her house. See 1 Tim. 5.10. It seems therefore that she was a woman of quality] of many, yea of my self."}],"3":[{"catchword":null,"tekst":"Salute Priscilla [The wife of Aquila, who was very wise and godly woman] and Aquila [the husband of Priscilla a Tent-maker of Pontus. See of them both Act 2:10 etc. 1 Cor. 16.19. 2 Tim. 4.19. These were before driven out of Rome, by the command of Claudius Ceasar, and were at Corinth when Paul came thither, Act 18:2. and seeing it appears here that they were now at Rome again, therefore it seems that the Apostle was twice at Corinth] my co-workers [namely, in spreading abroad the doctrine of the Gospel, wherein according to their opportunity and calling they did their best] in Christ Jesus."}],"4":[{"catchword":null,"tekst":"Who for my life [Gr. Soul, Mat. 2.20.] have put their own neck, [Gr. Have put under their own neck, i.e. have hazarded their lives. This was done either in the uproar at Corinth against Paul, Act 18:12 or in the uproar at Ephesus, Act 18:23. where they were then with Paul, Act 18:18.] to whom not only I give thanks, but also all the Churches of the Gentiles. [forasmuch as they have thereby obtained that benefit, that I remain yet alive to teach and confirm the same.]"}],"5":[{"catchword":null,"tekst":"(Salute) also the Church, [That is, the faithful, which either belonged to their (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
