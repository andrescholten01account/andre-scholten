-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Weet u niet, broeders! (want ik spreek tot hen die de wet kennen) dat de wet heerst over de mens, zo lang als hij leeft?","2":"Want een vrouw die onder de man staat, is aan de levende man verbonden door de wet; maar als de man gestorven is, dan is zij vrijgemaakt van de wet van de man.","3":"Daarom dan, als zij bij een andere man gaat wonen terwijl de man leeft, zal zij een overspeelster genoemd worden; maar als de man gestorven is, dan is zij vrij van de wet, zodat zij geen overspeelster is als zij bij een andere man gaat wonen.","4":"Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, *namelijk* aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.","5":"Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood.","6":"Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet *in* de oudheid van de letter.","7":"Wat zullen wij dan zeggen? Is de wet zonde? Volstrekt niet. Ja, ik kende de zonde niet dan door de wet; want ik had ook de begeerte niet gekend *als zonde*, als de wet niet zei: U zult niet begeren.","8":"Maar de zonde nam de gelegenheid door het gebod en heeft in mij alle begeerte bewerkt; want zonder de wet is de zonde dood.","9":"En zonder de wet leefde ik eertijds; maar toen het gebod kwam, werd de zonde weer levend, en ik stierf.","10":"En het gebod, dat tot leven bedoeld was, dat bleek voor mij tot de dood te leiden.","11":"Want de zonde nam de gelegenheid door het gebod, heeft mij verleid, en heeft mij daardoor gedood.","12":"Zo is dan de wet heilig, en het gebod is heilig, en rechtvaardig, en goed.","13":"Is dan het goede voor mij de dood geworden? Volstrekt niet. Maar de zonde *is mij de dood geworden*; opdat zij openbaar zou worden als zonde, doordat zij door het goede de dood in mij bewerkte; opdat de zonde bovenmate zou blijken te zondigen door het gebod.","14":"Want wij weten dat de wet geestelijk is, maar ik ben vleselijk, verkocht onder de zonde.","15":"Want wat ik doe, dat begrijp ik niet; want wat ik wil, dat doe ik niet, maar wat ik haat, dat doe ik.","16":"En als ik doe wat ik niet wil, dan stem ik ermee in dat de wet goed is.","17":"Ik dan doe dat nu niet meer, maar de zonde die in mij woont.","18":"Want ik weet dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is *wel* aanwezig bij mij, maar het goede te doen, dat vind ik niet.","19":"Want het goede dat ik wil, doe ik niet, maar het kwade dat ik niet wil, dat doe ik.","20":"Als ik dan doe wat ik niet wil, dan doe ik dat nu niet meer zelf, maar de zonde die in mij woont.","21":"Zo vind ik dan deze wet *in mij*; als ik het goede wil doen, dat het kwade mij aankleeft.","22":"Want ik verheug mij in de wet van God, naar de innerlijke mens;","23":"Maar ik zie een andere wet in mijn leden, die strijdt tegen de wet van mijn gemoed, en mij gevangen neemt onder de wet van de zonde, die in mijn leden is.","24":"Ik, ellendig mens, wie zal mij verlossen uit het lichaam van deze dood?","25":"Ik dank God, door Jezus Christus, onze Heere.","26":"Zo dan, ik zelf dien wel met het gemoed de wet van God, maar met het vlees de wet van de zonde."},"SV":{"1":"Weet gij niet, broeders! ( want ik spreek tot degenen, die de wet verstaan) dat de wet heerst over den mens, zo langen tijd als hij leeft?","2":"Want een vrouw, die onder den man staat, is aan den levenden man verbonden door de wet; maar indien de man gestorven is, zo is zij vrijgemaakt van de wet des mans.","3":"Daarom dan, indien zij eens anderen mans wordt, terwijl de man leeft, zo zal zij een overspeelster genaamd worden; maar indien de man gestorven is, zo is zij vrij van de wet, alzo dat zij geen overspeelster is, als zij eens anderen mans wordt.","4":"Zo dan, mijn broeders, gij zijt ook der wet gedood door het lichaam van Christus, opdat gij zoudt worden eens Anderen, *namelijk* Desgenen, Die van de doden opgewekt is, opdat wij Gode vruchten dragen zouden.","5":"Want toen wij in het vlees waren, wrochten de bewegingen der zonden, die door de wet zijn, in onze leden, om den dood vruchten te dragen.","6":"Maar nu zijn wij vrijgemaakt van de wet, overmits wij dien gestorven zijn, onder welken wij gehouden waren; alzo dat wij dienen in nieuwigheid des geestes, en niet *in* de oudheid der letter.","7":"Wat zullen wij dan zeggen? Is de wet zonde? Dat zij verre. Ja, ik kende de zonde niet dan door de wet; want ook had ik de begeerlijkheid niet geweten *zonde* *te* *zijn*, indien de wet niet zeide: Gij zult niet begeren.","8":"Maar de zonde, oorzaak genomen hebbende door het gebod, heeft in mij alle begeerlijkheid gewrocht; want zonder de wet is de zonde dood.","9":"En zonder de wet, zo leefde ik eertijds; maar als het gebod gekomen is, zo is de zonde weder levend geworden, doch ik ben gestorven.","10":"En het gebod, dat ten leven was, hetzelve is mij ten dood bevonden.","11":"Want de zonde, oorzaak genomen hebbende door het gebod, heeft mij verleid, en door hetzelve gedood.","12":"Alzo is dan de wet heilig, en het gebod is heilig, en rechtvaardig, en goed.","13":"Is dan het goede mij de dood geworden? Dat zij verre. Maar de zonde *is* *mij* *de* *dood* *geworden*; opdat zij zou openbaar worden zonde *te* *zijn*; werkende mij door het goede den dood; opdat de zonde boven mate wierd zondigende door het gebod.","14":"Want wij weten, dat de wet geestelijk is, maar ik ben vleselijk, verkocht onder de zonde.","15":"Want hetgeen ik doe, dat ken ik niet; want hetgeen ik wil, dat doe ik niet, maar hetgeen ik haat, dat doe ik.","16":"En indien ik hetgene doe, dat ik niet wil, zo stem ik de wet toe, dat zij goed is.","17":"Ik dan doe datzelve nu niet meer, maar de zonde, die in mij woont.","18":"Want ik weet, dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is *wel* bij mij, maar het goede te doen, dat vind ik niet.","19":"Want het goede dat ik wil, doe ik niet, maar het kwade, dat ik niet wil, dat doe ik.","20":"Indien ik hetgene doe, dat ik niet wil, zo doe ik nu hetzelve niet meer, maar de zonde, die in mij woont.","21":"Zo vind ik dan deze wet *in* *mij*; als ik het goede wil doen, dat het kwade mij bijligt.","22":"Want ik heb een vermaak in de wet Gods, naar den inwendigen mens;","23":"Maar ik zie een andere wet in mijn leden, welke strijdt tegen de wet mijns gemoeds, en mij gevangen neemt onder de wet der zonde, die in mijn leden is.","24":"Ik ellendig mens, wie zal mij verlossen uit het lichaam dezes doods?","25":"Ik dank God, door Jezus Christus, onzen Heere.","26":"Zo dan, ik zelf dien wel met het gemoed de wet Gods, maar met het vlees de wet der zonde."},"KJV":{"1":"Know ye not, brethren, (for I speak to them that know the law,) how that the law hath dominion over a man as long as he liveth?","2":"For the woman which hath an husband is bound by the law to *her* husband so long as he liveth; but if the husband be dead, she is loosed from the law of *her* husband.","3":"So then if, while *her* husband liveth, she be married to another man, she shall be called an adulteress: but if her husband be dead, she is free from that law; so that she is no adulteress, though she be married to another man.","4":"Wherefore, my brethren, ye also are become dead to the law by the body of Christ; that ye should be married to another, *even* to him who is raised from the dead, that we should bring forth fruit unto God.","5":"For when we were in the flesh, the motions of sins, which were by the law, did work in our members to bring forth fruit unto death.","6":"But now we are delivered from the law, that being dead wherein we were held; that we should serve in newness of spirit, and not *in* the oldness of the letter.","7":"What shall we say then? *Is* the law sin? God forbid. Nay, I had not known sin, but by the law: for I had not known lust, except the law had said, Thou shalt not covet.","8":"But sin, taking occasion by the commandment, wrought in me all manner of concupiscence. For without the law sin *was* dead.","9":"For I was alive without the law once: but when the commandment came, sin revived, and I died.","10":"And the commandment, which *was ordained* to life, I found *to be* unto death.","11":"For sin, taking occasion by the commandment, deceived me, and by it slew","12":"Wherefore the law *is* holy, and the commandment holy, and just, and good.","13":"Was then that which is good made death unto me? God forbid. But sin, that it might appear sin, working death in me by that which is good; that sin by the commandment might become exceeding sinful.","14":"For we know that the law is spiritual: but I am carnal, sold under sin.","15":"For that which I do I allow not: for what I would, that do I not; but what I hate, that do I.","16":"If then I do that which I would not, I consent unto the law that *it is* good.","17":"Now then it is no more I that do it, but sin that dwelleth in me.","18":"For I know that in me (that is, in my flesh,) dwelleth no good thing: for to will is present with me; but *how* to perform that which is good I find not.","19":"For the good that I would I do not: but the evil which I would not, that I do.","20":"Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me.","21":"I find then a law, that, when I would do good, evil is present with me.","22":"For I delight in the law of God after the inward man:","23":"But I see another law in my members, warring against the law of my mind, and bringing me into captivity to the law of sin which is in my members.","24":"O wretched man that I am! who shall deliver me from the body of this death?","25":"I thank God through Jesus Christ our Lord. So then with the mind I myself serve the law of God; but with the flesh the law of sin.","26":"I thank God through Jesus Christ our Lord. So then with the mind I myself serve the law of God; but with the flesh the law of sin."}},"tsk":{"1":[{"kopje":"Weet","refs":["Rom 6:3"]},{"kopje":"broeders","refs":["Rom 9:3","Rom 10:1"]},{"kopje":"hen die","refs":["Rom 2:17","Rom 2:18","Ezra 7:25","Spr 6:23","1 Kor 9:8","Gal 4:21"]},{"kopje":"de wet","refs":["Rom 7:6","Rom 6:14"]}],"2":[{"kopje":"een vrouw","refs":["Gen 2:23","Gen 2:24","Num 30:7","Num 30:8","1 Kor 7:4","1 Kor 7:39"]}],"3":[{"kopje":"Daarom dan","refs":["Ex 20:14","Lev 20:10","Num 5:13-31","Deut 22:22-24","Matt 5:32","Mark 10:6-12","Joh 8:3-5"]},{"kopje":"terwijl","refs":["Ruth 2:13","1 Sam 25:39-42","1 Tim 5:11-14"]}],"4":[{"kopje":"u bent ook","refs":["Rom 7:6","Rom 6:14","Rom 8:2","Gal 2:19","Gal 2:20","Gal 3:13","Gal 5:18","Ef 2:15","Kol 2:14","Kol 2:20"]},{"kopje":"het lichaam","refs":["Matt 26:26","Joh 6:51","1 Kor 10:16","Hebr 10:10","1 Petr 2:24"]},{"kopje":"opdat u","refs":["Ps 45:11-16","Jes 54:5","Jes 62: ">it,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G266\">sin</span> that <span class=\"wl wl-kjv\" data-code=\"G3611\">dwelleth</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> me.","21":"I <span class=\"wl wl-kjv\" data-code=\"G2147\">find</span> <span class=\"wl wl-kjv\" data-code=\"G686\">then</span> a <span class=\"wl wl-kjv\" data-code=\"G3551\">law,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that,</span> when <span class=\"wl wl-kjv\" data-code=\"G1698\">I</span> <span class=\"wl wl-kjv\" data-code=\"G2309\">would</span> <span class=\"wl wl-kjv\" data-code=\"G4160\">do</span> <span class=\"wl wl-kjv\" data-code=\"G2570\">good,</span> <span class=\"wl wl-kjv\" data-code=\"G2556\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"G3873\">present</span> with me.","22":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> I <span class=\"wl wl-kjv\" data-code=\"G4913\">delight</span> in the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">after</span> the <span class=\"wl wl-kjv\" data-code=\"G2080\">inward</span> man:","23":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> I <span class=\"wl wl-kjv\" data-code=\"G991\">see</span> <span class=\"wl wl-kjv\" data-code=\"G2087\">another</span> <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G3196\">members,</span> warring <span class=\"wl wl-kjv\" data-code=\"G497\">against</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G3563\">mind,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G163\">bringing</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">me</span> into <span class=\"wl wl-kjv\" data-code=\"G163\">captivity</span> to the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of <span class=\"wl wl-kjv\" data-code=\"G266\">sin</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> <span class=\"wl wl-kjv\" data-code=\"G5607\">is</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> members.","24":"O <span class=\"wl wl-kjv\" data-code=\"G5005\">wretched</span> <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> that I <span class=\"wl wl-kjv\" data-code=\"G1473\">am!</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">who</span> shall <span class=\"wl wl-kjv\" data-code=\"G4506\">deliver</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">me</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G4983\">body</span> of <span class=\"wl wl-kjv\" data-code=\"G5127\">this</span> death?","25":"I <span class=\"wl wl-kjv\" data-code=\"G2168\">thank</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">through</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord.</span> So <span class=\"wl wl-kjv\" data-code=\"G686\">then</span> with the <span class=\"wl wl-kjv\" data-code=\"G3563\">mind</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G846\">myself</span> <span class=\"wl wl-kjv\" data-code=\"G3303\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> with the <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of sin.","26":"I <span class=\"wl wl-kjv\" data-code=\"G2168\">thank</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">through</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord.</span> So <span class=\"wl wl-kjv\" data-code=\"G686\">then</span> with the <span class=\"wl wl-kjv\" data-code=\"G3563\">mind</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G846\">myself</span> <span class=\"wl wl-kjv\" data-code=\"G3303\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> with the <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of sin."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de wet verstaan","tekst":"Namelijk door Mozes gegeven; welke niet alleen de Joden maar ook de Christenen schuldig zijn te verstaan."},{"catchword":"heerst over den mens,","tekst":"Dat is, den mens verbindt om die te gehoorzamen."},{"catchword":"zo langen tijd als hij leeft?","tekst":"Namelijk dien de wet is gegeven; want de wet gebiedt eigenlijk niet de doden, maar de levenden."}],"2":[{"catchword":"die onder den man staat,","tekst":"Namelijk door den band des huwelijks."},{"catchword":"is aan den levenden man","tekst":"Namelijk om Hem getrouw en gehoorzaam te zijn, zolang hij leeft. Want hoewel den man in het Oude Testament toegelaten was de vrouw een scheidbrief te geven, zo is nochtans zulk verlaten van God nooit voor goed gekend. Zie Mat 19:8 ."},{"catchword":"vrijgemaakt","tekst":"Grieks ledig gemaakt; dat is, los en vrijgemaakt."},{"catchword":"van de wet des mans","tekst":"Dat is, van de verbintenis, waarmede haar de wet aan den man verbindt."}],"3":[{"catchword":"eens anderen mans wordt,","tekst":"Dat is, aan een ander man trouwt en zijne vrouw wordt, gelijk ook in het einde van hetzelfde vs."},{"catchword":"genaamd worden;","tekst":"Dat is, inderdaad zijn en met recht genaamd worden, gelijk dit Griekse woord Chrematizein ook genomen wordt; Act 11:26 ."}],"4":[{"catchword":"der wet gedood","tekst":"De tegenstelling scheen te vereisen dat de apostel zou zeggen: De wet is u gedood, of gestorven, alzo de heersende macht der zonde door de wet, of de wet zelve, hier als de man gesteld wordt, die over ons heerst door hare dreigementen tegen de zonde, en aanritsingen tot de zonde vanwege de verkeerdheid onzes vleesches, gelijk hij hierna vs.8 zal verklaren; maar de apostel heeft hetzelve liever omgekeerd, omdat het vreemd zou geschenen hebben zo hij gezegd had dat de wet van Christus gedood was, daar hij maar verstaat, dat de heersende macht der wet gedood was; hetwelk door deze wijze van spreken; wij zijn der wet gedood, dat is, de wet heeft deze dreigende en aanritsende macht niet meer over ons, dewijl wij dood voor haar zijn, wel zo bekwamelijk kan verstaan worden."},{"catchword":"door het lichaam van Christus,","tekst":"Dat is, door de offerande, des lichaams van Christus aan het kruis volbracht, waardoor Hij den vloek der wet en de macht der zonde onder de wet heeft teniet gedaan, en ons daarvan verlost; gelijk in Rom 6 breder is verklaard. Zie ok 1Co 15:56-57 ."},{"catchword":"eens Anderen,","tekst":"Of, voor een anderen, namelijk Christus Jezus."},{"catchword":"Die van de doden opgewekt is,","tekst":"Namelijk niet alleen om zelf te leven, maar om ons ook met Hem te doen leven en met Hem te verenigen."},{"catchword":"opdat wij Gode","tekst":"Namelijk de vruchten van dit geestelijk huwelijk met Christus, welke zijn de vruchten van heiligheid en rechtvaardigheid, waardoor God van ons wordt geëerd en geprezen; Joh 15:8 ."}],"5":[{"catchword":"in het vlees waren,","tekst":"Dat is, in de verdorvenheid onzer natuur en heerschappij derzelve. Zie hierna Rom 8:5 , en vervolgens."},{"catchword":"die door de wet zijn,","tekst":"Dat is, die door de wet ontdekt en opgeritst worden, gelijk door de zon de kwade dampen ontdekt en opgewekt worden, die in het aardrijk verborgen zijn. Zie vs.8."},{"catchword":"in onze leden,","tekst":"Dat is, de verdorvenheid, die in de ziel voornamelijk hare zitplaats had, verspreidde zich door hare kwade bewegingen door al de leden, en bracht door dezelve deze kwade vruchten voort, waarvan het einde de dood is. Zie Mat 15:18-19 ; Jam 1:14-15 ."}],"6":[{"catchword":"vrijgemaakt van de wet,","tekst":"Zie hierboven de aantekeningen vs.4."},{"catchword":"overmits wij dien gestorven zijn,","tekst":"Dat is, overmits de heersende macht der wet en der zonde door Christus' dood en Geest in ons is teniet gedaan. Anders, overmits die gestorven is; namelijk de wet, ten aanzien van hare dwingende, verdoemende en aanritsende kracht."},{"catchword":"onder welken wij gehouden waren;","tekst":"Grieks in welken."},{"catchword":"dienen","tekst":"Namelijk Gode."},{"catchword":"in nieuwigheid des geestes,","tekst":"Dat is, in ware heiligheid, waartoe wij van den Heiligen Geest zijn vernieuwd, door de predikatie des Evangelies, die een dienst der rechtvaardigheid en des Geestes wordt genaamd, 2Co 3:8-9 ."},{"catchword":"in de oudheid der letter","tekst":"Dat is, in de oude verdorvenheid, die door de uitwendige letter der wet meer en meer wordt aangeritst tot de zonde; alzo de wet den zondaar wel verdoemt, maar de kracht niet medebrengt om de zonde te laten. Waarom de wet een doodslaande letter en een dienst des doods wordt genaamd; 2Co 3:6-7 ."}],"7":[{"catchword":"Is de wet zonde?","tekst":"Dat is, oorzaak der zonde; welke tegenwerping hieruit rijst, dat de apostel tevoren vs.5 gezegd had dat de zonde door de wet krachtig was in ons; daarom verklaart hij in de volgende verzen hoe dit moet verstaan worden."},{"catchword":"ik kende de zonde niet","tekst":"Namelijk ten volle en alzo ik behoorde. Want anderszins leert ook de natuur een onderscheid van goed en kwaad in vele dingen; Rom 2:15 ."},{"catchword":"de begeerlijkheid niet geweten","tekst":"Hier wordt de begeerlijkheid genomen voor den grond van alle kwade begeerten en voor de eerste bewegingen derzelve. Want de begeerlijkheid waar wij in bewilligen, wisten ook de heidenen wel dat zonde was; maar deze eerste bewegingen tot het kwaad hielden zij voor geen zonde, gelijk ook niet de Farizeën, waaronder Paulus geweest was. Zie Mat 5:20 , Mat 5:22 , Mat 5:28 , en Mat 23:25 , enz."}],"8":[{"catchword":"de zonde,","tekst":"Dat is, de verdorvenheid die in ons is."},{"catchword":"oorzaak genomen hebbende","tekst":"Of, gaande geworden zijnde. Want de wet ontdekt en verdoemt niet alleen de zonde, gelijk in vs.7 is betuigd, maar de verdorvenheid, die in den mens is, wordt door deze kennis verwekt en gaande gemaakt tegen het gebod, wanneer Gods Geest hetzelve niet belet."},{"catchword":"alle begeerlijkheid gewrocht;","tekst":"Dat is, allerlei soort van dadelijke begeerlijkheid."},{"catchword":"zonder de wet is de zonde","tekst":"Dat is zonder de rechte kennis der wet."},{"catchword":"dood","tekst":"Dat is, toont hare kracht zo niet."}],"9":[{"catchword":"zo leefde ik","tekst":"Of, was ik levend; dat is, ik meende dat ik rechtvaardig was en was daarop gerust. Zie dergelijk voorbeeld in dien jongeling Mat 19:16-18 , enz., en in de Farizeën in het algemeen; Mat 23:28 ."},{"catchword":"eertijds;","tekst":"Namelijk nog een Farizeër zijnde."},{"catchword":"als het gebod gekomen is,","tekst":"Namelijk tot mijne rechte kennis, en dat ik verstond dat ook de inwendige begeerten tegen de wet zonde zijn."},{"catchword":"levend geworden,","tekst":"Dat is, ik heb de menigte der zonde, die in mij wakker geworden was, levendig gevoeld."},{"catchword":"doch ik ben gestorven","tekst":"Dat is, ik ben in mijn gemoed overtuigd, dat ik midden in den dood lag, en heb den moed verloren van door de gehoorzaamheid der wet te kunnen behouden worden; Rom 4:15 ; 2Co 3:6-7 , 2Co 3:9 ."}],"10":[{"catchword":"dat ten leven was,","tekst":"Namelijk voor degenen, die de wet volkomenlijk zouden onderhouden; Rom 10:5 ; Gal 3:12 , enz., hetwelk den mens onmogelijk is, Rom 8:3 ."},{"catchword":"ten dood bevonden","tekst":"Namelijk door mijne verdorvenheid en overtreding."}],"11":[{"catchword":"heeft mij verleid,","tekst":"Zie de aantekeningen bij vs.8."}],"13":[{"catchword":"de dood geworden?","tekst":"Dat is, ene oorzaak des doods, gelijk vs.7."},{"catchword":"door het gebod","tekst":"Namelijk gelijk tevoren op vs.8 verklaard is."}],"14":[{"catchword":"Want wij weten,","tekst":"Tot hiertoe heeft de apostel gesproken van de macht der wet en der zonde in den verdorven en onwedergeboren mens, gelijk hij ook zelf eertijds ervaren had, toen hij nog in zulken stand was, vs.9; maar nu komt hij en spreekt van zichzelven, gelijk hij toen was, en verklaart welke macht de overblijfselen des zondigen vleesches nog in hem hadden, nadat hij nu van de heerschappij der zonde was verlost, gelijk al zijne redenen, die volgen, van den tegenwoordigen tijd spreken, en niet van den verleden."},{"catchword":"geestelijk is,","tekst":"Dat is, die niet alleen een uitwendige, maar ook een inwendige gehoorzaamheid des harten vereist, en den volmaakten regel van een geestelijk en heilig leven voorschrijft, gelijk Christus de som daarvan verklaart Mat 22:37 ."},{"catchword":"ik ben vleselijk,","tekst":"Namelijk nog ten dele, ten aanzien van de overblijfselen des vleesches, die nog in mij zijn, gelijk hij verklaart vs.18, 23. Want dat ook de wedergeborenen, ten aanzien van enige gebreken die nog in hen zijn, vleselijk genaamd kunnen worden, blijkt 1Co 3:1 ."},{"catchword":"verkocht onder de zonde","tekst":"Namelijk niet als een gewillige slaaf, die de begeerte der zonde in alles zou volgen, gelijk Achab gezegd wordt 1Ki 21:20 , maar die tegen zijn dank en wil de begeerten en aanvallen der zonde nog is onderworpen, zonder dat hij zich daarvan nog ten enenmale kan ontslaan, hoewel hij die ernstig wederstaat en ten merendele door den Geest Gods, die in hem is, overwint. Zie dergelijke Gal 5:17-18 ."}],"15":[{"catchword":"doe,","tekst":"Grieks werke, of volbrenge. De apostel neemt hier het woord doen, gelijk ook in het volgende, niet altijd van de uitwendige daad; want de wedergeborenen wandelen niet naar het vlees, maar naar den Geest, Rom 8:1 , hoewel zij hunne gebreken hebben, die zij met leedwezen beklagen, Job 9:2-3 ; Psa 130:3 ; maar hij spreekt hier voornamelijk van de inwendige bewegingen de zonde, die hij haat en die de verdorven natuur in hem menigmaal doet rijzen tegen zijn dank, gelijk hij ook spreekt van de begeerlijkheid des vleesches, Gal 5:17 , Alzo dat gij niet doet wat gij wilt; daar hij nochtans tevoren in Gal 5:16 gezegd had: Wandelt naar den geest, en gij zult de begeerlijkheid des vleesches niet volbrengen."},{"catchword":"ken ik niet;","tekst":"Namelijk voor goed, dat is, dat sta ik niet toe; gelijk hij daarna verklaart. Zie Psa 1:6 ; Mat 7:23 ."},{"catchword":"hetgeen ik wil,","tekst":"Dat is, het goede dat ik wil, gelijk vs.19."},{"catchword":"doe ik niet,","tekst":"Namelijk in zulke volmaaktheid als ik wel wilde, gelijk vs.18."},{"catchword":"hetgeen ik haat,","tekst":"Dat is, het kwaad waar ik een afkeer van heb, en dat ik niet wil; gelijk vs.19."}],"16":[{"catchword":"zo stem ik de wet toe,","tekst":"Namelijk dewijl ik niet wil, noch voor goed houd de begeerlijheid die zij verbiedt."}],"17":[{"catchword":"Ik dan doe datzelve nu niet meer,","tekst":"Namelijk naar den inwendigen mens, gelijk hij verklaart vs.22."},{"catchword":"de zonde, die in mij woont","tekst":"Dat is, de overblijfselen der verdorvenheid, die nog in mij zijn, gelijk hij verklaart vs.18, 20."}],"18":[{"catchword":"is wel bij mij,","tekst":"Grieks ligt bij mij; namelijk door de genade Gods, die hetzelve in mij werkt; Phi 2:13 ."},{"catchword":"het goede te doen,","tekst":"Namleijk in zijne volmaaktheid. Zie Phi 3:12-14 ."}],"21":[{"catchword":"vind ik dan","tekst":"Dat is, bevinde."},{"catchword":"deze wet in mij","tekst":"De apostel noemt hier alzo, gelijk ook vs.23 bij gelijkenis, de overgebleven verdorvenheid in de gelovigen, omdat, gelijk ene wet door hare geboden en verboden den mens vermaant en verplicht tot hare gehoorzaamheid, alzo ook de inwonende zonde hen daartoe drijft door hare begeerten en aanritsingen. Zie vs.23."},{"catchword":"bijligt","tekst":"Of, aanligt; dat is aankleeft of aanhangt, namelijk, door de overblijfselen der verdorven natuur."}],"22":[{"catchword":"naar den inwendigen mens;","tekst":"Hierdoor wordt niet verstaan de natuurlijke rede des mensen, die ook somwijlen wel strijdt voor de burgerlijke deugd; want de Schrift getuigt doorgaans dat de rede des natuurlijken mensen in geestelijke zaken blind en verkeerd is, dezelve voor dwaasheid houdt, 1Co 2:14 , vijandschap is tegen God, en der wet Gods niet wordt onderworpen, ja ook niet kan, Rom 8:7 ; maar wordt verstaan van den mens, voorzoveel hij inwendig door Gods Geest verlicht en wedergeboren is, Rom 2:29 ; 2Co 4:16 ; Eph 3:16 , welke inwendige mens in de wet Gods, die geestelijk is, vs.14, zijn vermaak heeft; Psa 1:2 ; Rom 8:5 ."}],"23":[{"catchword":"in mijn leden,","tekst":"Dat is, in mijn vlees, vs.5, 18."},{"catchword":"de wet mijns gemoeds,","tekst":"Of, de wet mijns verstands; dat is tegen het voorschrift en de bewegingen van den inwendigen en nieuwen mens; gelijk hier voren verklaard is."},{"catchword":"gevangen neemt onder de wet der zonde,","tekst":"Dat is, mij nog tegen mijn dank aankleeft, vs.4."}],"24":[{"catchword":"uit het lichaam dezes doods?","tekst":"Of, uit het lichaam des doods. Hetwelk verstaan kan worden, òf van de overblijfselen der zonde en des ouden mensen, die het lichaam der zonde genoemd worden, Rom 6:6 , òf van het lichaam des mensen, dat hier sterflijk is, en vanwege de zonde den dood onderworpen; Rom 8:10 . Want wij zullen van deze overblijfselen der zonde, en van deze gevangenis, niet eer ten volle worden verlost, voordat wij dit sterflijk lichaam zullen afgelegd hebben."}],"25":[{"catchword":"Ik dank God,","tekst":"Namelijk dat Hij mij alrede zover door Christus verlost heeft van de heerschappij der zonde, dat ik nu, hoewel de zonde mij nog aankleeft, nochtans geen gewillige slaaf derzelve meer ben, maar daartegen strijd, en die door Christus' Geest kan overwinnen; gelijk het besluit dan volgt, en het begin van het Rom 8 medebrengt. Zie 1Co 15:55-57 ."},{"catchword":"Zo dan,","tekst":"Dit is het besluit van dezen gehelen strijd."},{"catchword":"met het gemoed de wet Gods,","tekst":"Dat is, naar den inwendigen mens, vs.22, die de apostel nu erkent hij zelf te zijn, of zijn eigen te zijn, daar het vlees na de wedergeboorte maar een vreemd aanhangsel is, hetwelk allengskens versleten en weggeworpen moet worden."}],"26":[{"catchword":"Ik dank God,","tekst":"Namelijk dat Hij mij alrede zover door Christus verlost heeft van de heerschappij der zonde, dat ik nu, hoewel de zonde mij nog aankleeft, nochtans geen gewillige slaaf derzelve meer ben, maar daartegen strijd, en die door Christus' Geest kan overwinnen; gelijk het besluit dan volgt, en het begin van het Rom 8 medebrengt. Zie 1Co 15:55-57 ."},{"catchword":"Zo dan,","tekst":"Dit is het besluit van dezen gehelen strijd."},{"catchword":"met het gemoed de wet Gods,","tekst":"Dat is, naar den inwendigen mens, vs.22, die de apostel nu erkent hij zelf te zijn, of zijn eigen te zijn, daar het vlees na de wedergeboorte maar een vreemd aanhangsel is, hetwelk allengskens versleten en weggeworpen moet worden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Know ye not Brethren, (for I speak to them that understand the Law) [Namely, given by Moses, which not only the Jews but also Christians are bound to understand] that the law hath dominion over a man [ that is, obligeth man to obey it] so long time as he liveth? [namely, to whom the Law is given, for the Law properly commands not the dead but the living.]"}],"2":[{"catchword":null,"tekst":"For a wife which is under the husband [Namely, by the band of marriage] is bound to the living husband by the Law: [namely, to be faithful and obedient to him as long as he liveth. For howsoever the husband was permitted in the Old Testament to give wife bill of divorce, yet notwithstanding such forsaking was never approved by God. See Mat. 19.8.] but if the husband be dead, she is made free [Gr. Made empty, that is, made loose and free] from the Law of the husband. [that is, from the obligation, whereby the Law binds her to the husband.]"}],"3":[{"catchword":null,"tekst":"Therefore if she become another mans, [That is, marrieth to another man, and become his wife, as also in the end of the this same verse] while the husband liveth, she shall be called [that is, be indeed, and rightly be called, as this Greek word Chrematizein is also taken, Act 11:26.] an adulteress: but if the husband be dead, she is free from the Law, so that she is no adulteress, if she become another mans."}],"4":[{"catchword":null,"tekst":"So then my Brethren, ye are also made dead to the Law [The opposition seemed to require that the Apostle should say the law is put to death, or is dead to you, seeing the reigning power of sin by the Law, or the Law itself is here put as the husband, which bears sway over us by its threatening against sin, and irritations to sin, by reason of the deprivation of our flesh, as he will declare hereafter v.8. but the Apostle rather inverted the same, because it would have seemed strange if he had said that the Law was made dead by Christ, whereas he means that the domineering power of the Law was made dead which by this manner of speaking, we are made dead to the Law, i.e. the Law hath no more this threatening and instigating power over us, seeing we are dead as to it, may altogether as fitly be understood] by the body of Christ, [that is, by the sacrifice of the body of Christ accomplished on the cross, whereby he did away the curse of the Law, and the power of sin under the Law, and delivered us from it: as in the former Chapter is more largely declared. See also 1 Cor. 15. v. 56. 57.] that ye should be another&acirc;&euro;&trade;s, [or for another, namely, Christ Jesus] (namely) his who was raised up from the dead, [namely, not only to live himself, but to cause us to live with him, and to unite us unto him] that we should bear fruits unto God. [namely, the fruits of this spiritual marriage with Christ, which are the fruits of holiness and righteousness, whereby God is honoured and praised by us, John 15. v. 8.]"}],"5":[{"catchword":null,"tekst":"For when we were in the flesh, [That is, in the corruption of our nature and under the dominion of the same. See afterwards chap. 8.5. and the following verses] the motions of sin which are by the law, [that is, which are discovered and irritated by the Law, as ill vapours are discovered and raised by the Sun, which are hidden in the Earth. See v. 8.] wrought in our members, to bring forth fruits of death. [that is, corruption, which had seat principally in the soul, by its evil motions spread itself abroad through all members, and by the same brought forth those ill fruits whereof the end is death. See Mat 15.v18.19. Jam. 1.v14.15.]"}],"6":[{"catchword":null,"tekst":"But now we are made free [See before the annot. On v.4.] from the law, forasmuch as the reigning power of the Law and sin, by the death and spirit of Christ, is abolished in us. Otherwise forasmuch as that is dead, namely, the law, in respect of its compelling, condemning and irritating power] under which [Gr. In which] we were held: so that we serve [namely, God] in newness of spirit, [that is, in true holiness, whereunto we are renewed by the Holy Ghost, through the preaching of the Gospel, which is called a ministry of righteousness and of the spirit, 2 Cor. 3.v.8,9.] and not (in) the oldness of the letter. [that is, in the corruption, which by the external letter of the Law is more and more stirred up to sin, seeing the law indeed condemns the sinner, but brings not with it the power to forsake sin: wherefore the law is called a killing letter, and a ministry of death, 2 Cor. Chap. 3.v.6,7.]"}],"7":[{"catchword":null,"tekst":"What shall we say therefore? Is the law sin? [That is, cause of sin: which objection ariseth from hence, that the Apostle hath said it before v.5. that sin was powerful in us by the Law, therefore he declared in the following verses how this must be understood] far be it: Yea I knew not the sin but by the Law. [namely, to the full, and as I though? For otherwise even nature itself teacheth a difference of good and evil in many things, Rom. 2.v.15.] For even Ihad not known concupiscence (to be sin) [here concupiscence is taken for the ground of all desires, and for the first motions of the same. For the concupiscence to which we consent, the Heathen also well knew that it was sin: but these first motions to evil they held to be no sin, as neither did the Pharisees, amongst whom Paul had been. See Mat. 5.20,22,28. and 23.25, & etc.] if the Law said not, thou shalt not covet."}],"8":[{"catchword":null,"tekst":"But sin [That is, the corruption that is in us] having taken occasion [or being set at going; For the law doth not only discover and condemn sin, as is testified in the former verse, but the corruption which is in man is by this knowledge stirred up and set a going against the commandment, when Gods spirit doth not hinder the same] by the commandment, wrought in me all concupiscence. [that is, all kinds of actual concupiscence] For without the law [that is, without the right knowledge of the law] sin is dead. [that is, doth not show its power.]"}],"9":[{"catchword":null,"tekst":"And without the law I lived [Or I was alive, i.e. I thought that I was just. And thereupon was at rest. See the like example in that young man, Mat. 19.v. ,16,17,18. &c. and in the Pharisees in general, Mat. 23.28.] heretofore: [namely, being yet a Pharisee] but when the commandment came, [namely, to the right knowledge, and that I understood that even the inward desires against the law are sins] sin became alive again, [that is, I felt the multitude of sins which was awaked in me, to be alive] but I died. [that is, I was convinced in my mind that I lay in the midst of death, and lost the confidence of being able to be saved by the obedience of the law, Rom. 4.15. 2 Cor. 3. v.6,7,9.]"}],"10":[{"catchword":null,"tekst":"And the commandment which was into life, [Namely, for those that should perfectly keep the law, Rom. 10.5. Gal. 3 12, &c. which is impossible to man, Rom. 8.v.3.] the same was found to me unto death. [namely, through my corruption and transgression.]"}],"11":[{"catchword":null,"tekst":"For sin having taken occasion by the commandment, seduced me [See the annot. V.8.] and by the same killed me."}],"12":[{"catchword":null,"tekst":"So then the law is holy; and the commandment is holy, and just and good."}],"13":[{"catchword":null,"tekst":"Is therefore good become death [That is, a cause of death as v.7.] to me? Far be it. But sin (is become death unto me) that it might be manifest (to be) sin, working death to me by that which is good: that sin might become above measure sinful by the command. [namely, as is declared before on the 8. verse.]"}],"14":[{"catchword":null,"tekst":"For we know that the Law [Hitherto the Apostle hath spoken of the power of the law and of sin, in the corrupt and unregenerate man; as he himself also had formerly experienced, when he was yet in such a state, v.9. but now he cometh and speaketh of himself as he then was, and declares what power the remainders of sinful flesh had still in him, now after that he was delivered from the dominion of sin, like as all his reasons which follow, speaks of the present time, and not of the time past] is spiritual, [that is, which requires not only an outward but also an inward obedience of the heart, and prescribes the perfect rule of a spiritual and holy life, as Christ expounds the sum thereof, Mat. 22.37.] but I am carnal, [namely, still in part, in respect of the remainders of the flesh which are yet in me, as he declares v.18.23. For that even the regenerate in respect of some defects which are still in them may be called carnal, appears, 1 Cor.3.1.] sold under sin [namely, not as a willing slave, which should in all things follow the desire of sin, as is said of Ahab 1 Kings 21.20. but (as one) against his desire and will is still subject the lusts and assaults of sin, without being able yet wholly to free himself from it, although he earnestly resist it, and for the most part by the Spirit of God which is in him, overcome it. See the like Gal 5:17.18.]"}],"15":[{"catchword":null,"tekst":"For that which I do [Gr. Work or fulfill. The Apostle here takes the word do, as also in that which follows, not always of the outward act: for the regenerate walk not after the flesh but after the spirit, Rom.8:1. howsoever they have their failings which they with sorrow bewail, Job 9:2,3. Psa. 130.3. but he speaks here principally of the inward motions in sin which he hateth, and which corrupt nature causeth oft times to arise in him against his will, as he also speaketh of the lust of the flesh, Gal. 5.17. So that ye do not that which ye would; whereas notwithstanding he said before in the 16. verse, walk after the spirit, and ye shall not fulfill the lust of the flesh] that I know not [namely, for good i.e. that I do not stand to, as he afterwards expounds it. See Psa. 1.6. Mat7.23.] For that which I will [that is, the good which I will, as v.19.] that I do not, [namely, in such perfection as gladly would, as v.18.] but that which I hate [that is, the evil which I am averse from, and that I would not, as v 19.] that do I."}],"16":[{"catchword":null,"tekst":"And if I do that which I will not, I consent unto the Law [Namely, seeing I do not will or approve concupiscence, which it forbids] that it is good."}],"17":[{"catchword":null,"tekst":"I therefore now [Namely, according to the inward man, as he expounds v,22.] no more do the same, but sin that dwelleth in me. [that is, the remainders of corruption which are still in me, as he declares, v.18.20.]"}],"18":[{"catchword":null,"tekst":"For I know that in me, that is, in my flesh, dwelleth no good: for to will is (indeed) with me, [Gr. Lyeth by me. Namely, by the grace of God which worketh the same in me, Phil. 2.13.] but to do well [namely, in its perfection. See Phil. 3.v12,13,14.] that I find not."}],"19":[{"catchword":null,"tekst":"For the good that I will, I do not; but the evil that I will not, that do I."}],"20":[{"catchword":null,"tekst":"If I do that which I will not, I do it no more, but sin that dwelleth in me."}],"21":[{"catchword":null,"tekst":"I find wherefore [That is, have experience of] this law [so the Apostle here calls as also v.23. by a similitude, the remaining corruption in believers, because like as a law by its commands and prohibitions admonisheth and obligeth a man to the obedience thereof, so also indwelling sin instigates then thereunto by its lusts and provocations. See v.23.] (in me) when I am willing to do well, that evil lies by me. [or lies on me, i.e. adheres or hangs on me. Namely, by the remainders of corrupt nature.]"}],"22":[{"catchword":null,"tekst":"For I have delight in the Law of God after the inward man. [ hereby is not understood mans natural reason, which sometimes also strives for moral virtue : for the Scripture throughout testifies that the reason of the natural is blind and perverse in spiritual things, accounts them foolishness, 1 Cor. 2.14. is enmity against God, and is not subject to the Law of God, neither can be, Rom. 8.7. but is to understood of a man as far forth as he is inwardly enlightened and regeneration by the Spirit of God, Rom. 2.29. 2Cor. 4.16. Ephes. 3.16. which inward man hath his delight in the Law of God, Psa. 1.2. Rom. 8.5. which is spiritual v.14.]"}],"23":[{"catchword":null,"tekst":"But I see another law in my members, [That is, in my flesh, v.5.18.] which striveth against the law of my mind [or the law of my understanding, i.e. against the prescript and motion of the inward and new man: as is declared heretofore] and taketh men captive [that is, still adheres to me against my will, v.14.] under the law of sin which is in my members."}],"24":[{"catchword":null,"tekst":"Me! Miserable man, who shall deliver me out of the body of this death? [Or out of this body of death. Which may be understood of the remainders of sin and of the old man, which are called the body of sin, Rom. 6.6. Or of mans body which is mortal here, and by reason of sin subjected to death, Rom. 8.10. For we shall not be fully delivered from the remainders of sin, and from this captivity, before we shall have put off this mortal body.]"}],"25":[{"catchword":null,"tekst":"I thank God through Jesus Christ our Lord. [Namely, that he had already so far delivered me through Christ from the dominion of sin, that now howsoever still cleaves to me, yet nevertheless I am no more a willing slave of the same, but strive against it; and by the spirit of Christ can overcome it: as the conclusion that follows, and the beginning of the following Chapters imports, See 1 Cor. 15.v. 55.56.57.] (7:26) So then I myself [This is the conclusion of this whole conflict] serve indeed with the mind [that is, after the inward man, v.22. which the Apostle now acknowledgeth to be himself or to be his own, whereas the flesh after regeneration is but a strange hanger-on, which by little and little must be worn out and cast away] the law of God, with the flesh the law of sin."}],"26":[{"catchword":null,"tekst":"I thank God through Jesus Christ our Lord. [Namely, that he had already so far delivered me through Christ from the dominion of sin, that now howsoever still cleaves to me, yet nevertheless I am no more a willing slave of the same, but strive against it; and by the spirit of Christ can overcome it: as the conclusion that follows, and the beginning of the following Chapters imports, See 1 Cor. 15.v. 55.56.57.] (7:26) So then I myself [This is the conclusion of this whole conflict] serve indeed with the mind [that is, after the inward man, v.22. which the Apostle now acknowledgeth to be himself or to be his own, whereas the flesh after regeneration is but a strange hanger-on, which by little and little must be worn out and cast away] the law of God, with the flesh the law of sin."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
