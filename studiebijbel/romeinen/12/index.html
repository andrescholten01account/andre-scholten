mate van het geloof; hetzij dienstbetoon, in het dienen; hetzij wie onderwijst, in het onderwijzen;","8":"hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.","9":"De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.","10":"Heb elkaar hartelijk lief met broederlijke liefde; in eerbetoon de een de ander voorgaand.","11":"Wees niet traag in het benaarstigen. Wees vurig van geest. Dien de Heere.","12":"Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.","13":"Deel mee in de behoeften van de heiligen. Streef naar gastvrijheid.","14":"Zegen hen die u vervolgen; zegen en vervloek niet.","15":"Verblijd u met de blijden, en ween met de wenende.","16":"Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.","17":"Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.","18":"Als het mogelijk is, houd voor zover het van u afhangt vrede met alle mensen.","19":"Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.","20":"Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.","21":"Word niet door het kwade overwonnen, maar overwin het kwade door het goede."},"SV":{"1":"Ik bid u dan, broeders, door de ontfermingen Gods, dat gij uw lichamen stelt tot een levende, heilige *en* Gode welbehagelijke offerande, *welke* *is* uw redelijke godsdienst.","2":"En wordt dezer wereld niet gelijkvormig; maar wordt veranderd door de vernieuwing uws gemoeds, opdat gij moogt beproeven, welke de goede, en welbehagelijke en volmaakte wil van God zij.","3":"Want door de genade, die mij gegeven is, zeg ik een iegelijk, die onder u is, dat hij niet wijs zij boven hetgeen men behoort wijs te zijn; maar dat hij wijs zij tot matigheid, gelijk als God een iegelijk de mate des geloofs gedeeld heeft.","4":"Want gelijk wij in een lichaam vele leden hebben, en de leden alle niet dezelfde werking hebben;","5":"Alzo zijn wij velen een lichaam in Christus, maar elkeen zijn wij elkanders leden.","6":"Hebbende nu verscheidene gaven, naar de genade, die ons gegeven is,","7":"*Zo* *laat* *ons* *die* *gaven* *besteden*, hetzij profetie, naar de mate des geloofs; hetzij bediening, in het bedienen; hetzij die leert, in het leren;","8":"Hetzij die vermaant, in het vermanen; die uitdeelt, in eenvoudigheid; die een voorstander is, in naarstigheid; die barmhartigheid doet, in blijmoedigheid.","9":"De liefde zij ongeveinsd. Hebt een afkeer van het boze, en hangt het goede aan.","10":"Hebt elkander hartelijk lief met broederlijke liefde; met eer de een den ander voorgaande.","11":"Zijt niet traag in het benaarstigen. Zijt vurig van geest. Dient den Heere.","12":"Verblijdt u in de hoop. Zijt geduldig in de verdrukking. Volhardt in het gebed.","13":"Deelt mede tot de behoeften der heiligen. Tracht naar herbergzaamheid.","14":"Zegent hen, die u vervolgen; zegent en vervloekt niet.","15":"Verblijdt u met de blijden; en weent met de wenenden.","16":"Weest eensgezind onder elkander. Tracht niet naar de hoge dingen, maar voegt u tot de nederige. Zijt niet wijs bij uzelven.","17":"Vergeldt niemand kwaad voor kwaad. Bezorgt hetgeen eerlijk is voor alle mensen.","18":"Indien het mogelijk is, zoveel in u is, houdt vrede met alle mensen.","19":"Wreekt uzelven niet, beminden, maar geeft den toorn plaats; want er is geschreven: Mij *komt* de wraak *toe*; Ik zal het vergelden, zegt de Heere.","20":"Indien dan uw vijand hongert, zo spijzigt hem; indien hem dorst, zo geeft hem te drinken; want dat doende, zult gij kolen vuurs op zijn hoofd hopen.","21":"Wordt van het kwade niet overwonnen, maar overwint het kwade door het goede."},"KJV":{"1":"I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, *which is* your reasonable service.","2":"And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what *is* that good, and acceptable, and perfect, will of God.","3":"For I say, through the grace given unto me, to every man that is among you, not to think *of himself* more highly than he ought to think; but to think soberly, according as God hath dealt to every man the measure of faith.","4":"For as we have many members in one body, and all members have not the same office:","5":"So we, *being* many, are one body in Christ, and every one members one of another.","6":"Having then gifts differing according to the grace that is given to us, whether prophecy, *let us prophesy* according to the proportion of faith;","7":"Or ministry, *let us wait* on *our* ministering: or he that teacheth, on teaching;","8":"Or he that exhorteth, on exhortation: he that giveth, *let him do it* with simplicity; he that ruleth, with diligence; he that sheweth mercy, with cheerfulness.","9":"*Let* love be without dissimulation. Abhor that which is evil; cleave to that which is good.","10":"*Be* kindly affectioned one to another with brotherly love; in honour preferring one another;","11":"Not slothful in business; fervent in spirit; serving the Lord;","12":"Rejoicing in hope; patient in tribulation; continuing instant in prayer;","13":"Distributing to the necessity of saints; given to hospitality.","14":"Bless them which persecute you: bless, and curse not.","15":"Rejoice with them that do rejoice, and weep with them that weep.","16":"*Be* of the same mind one toward another. Mind not high things, but condescend to men of low estate. Be not wise in your own conceits.","17":"Recompense to no man evil for evil. Provide things honest in the sight of all men.","18":"If it be possible, as much as lieth in you, live peaceably with all men.","19":"Dearly beloved, avenge not yourselves, but *rather* give place unto wrath: for it is written, Vengeance *is* mine; I will repay, saith the Lord.","20":"Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head.","21":"Be not overcome of evil, but overcome evil with good."}},"tsk":{"1":[{"kopje":"smeek","refs":["Rom 15:30","1 Kor 1:10","2 Kor 5:20","2 Kor 6:1","2 Kor 10:1","Ef 4:1","1 Tess 4:1","1 Tess 4:10","1 Tess 5:12","Hebr 13:22"]},{"kopje":"door de","refs":["Rom 2:4","Rom 9:23","Rom 11:30","Rom 11:31","Ps 116:12","Luk 7:47","2 Kor 4:1","2 Kor 5:14","2 Kor 5:15","Ef 2:4-10","Fil 2:1-5","Tit 3:4-8","1 Petr 2:10-12"]},{"kopje":"dat u","refs":["Rom 6:13","Rom 6:16","Rom 6:19","Ps 50:13","Ps 50:14","1 Kor 6:13-20","Fil 1:20","Hebr 10:22"]},{"kopje":"een levend","refs":["Ps 69:31","Ps 69:32","Hos 14:3","1 Kor 5:7","1 Kor 5:8","2 Kor 4:16","Fil 2:17","Hebr 10:20-22","Hebr 13:15","Hebr 13:16","1 Petr 2:5"]},{"kopje":"welbehaaglijk","refs":["Rom 12:2","Rom 15:16","Ps 19:15","Jes 56:7","Jer 6:20","Ef 5:10","Fil 4:18","1 Tim 2:3","1 Tim 5:4","1 Petr 2:5","1 Petr 2:20"]}],"2":[{"kopje":"word niet","refs":["Ex 23:2","Lev 18:29","Lev 18:30","Deut 18:9-14","Joh 7:7","Joh 14:30","Joh 15:19","Joh 17:14","1 Kor 3:19","2 Kor 4:4","2 Kor 6:14-17","Gal 1:4","Ef 2:2","Ef 4:17-20","Jak 1:27","Jak 4:4","1 Petr 1:14","1 Petr 1:18","1 Petr 4:2","2 Petr 1:4","2 Petr 2:20","1 Joh 2:15-17","1 Joh 3:13","1 Joh 4:4","1 Joh 4:5","1 Joh 5:19","Openb 12:9","Openb 13:8"]},{"kopje":"word","refs":["Rom 13:14","Ps 51:12","Ezech 18:31","Ezech 36:26","2 Kor 5:17","Ef 1:18","Ef 4:22-24","Kol 1:21","Kol 1:22","Kol 3:10","Tit 3:5"]},{"kopje":"beproeven","refs":["Rom 12:1","Ps 34:9","Ef 5:10","Ef 5:17","1 Petr 2:3"]},{"kopje":"goede","refs":["Rom 12:1","Rom 7:12","Rom 7:14","Rom 7:22","Ps 19:8-12","Ps 119:47","Ps 119:48","Ps 119:72","Ps 119:97","Ps 119:103","Ps 119:128","Ps 119:174","Spr 3:1-4","Spr 3:13-18","Gal 5:22-23","Ef 5:9","Kol 4:1 conceits.","17":"<span class=\"wl wl-kjv\" data-code=\"G591\">Recompense</span> to no <span class=\"wl wl-kjv\" data-code=\"G3367\">man</span> <span class=\"wl wl-kjv\" data-code=\"G2556\">evil</span> <span class=\"wl wl-kjv\" data-code=\"G473\">for</span> <span class=\"wl wl-kjv\" data-code=\"G2556\">evil.</span> <span class=\"wl wl-kjv\" data-code=\"G4306\">Provide</span> things <span class=\"wl wl-kjv\" data-code=\"G2570\">honest</span> in the <span class=\"wl wl-kjv\" data-code=\"G1799\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> men.","18":"<span class=\"wl wl-kjv\" data-code=\"G1487\">If</span> it be <span class=\"wl wl-kjv\" data-code=\"G1415\">possible,</span> as much as lieth <span class=\"wl wl-kjv\" data-code=\"G1537\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">you,</span> live <span class=\"wl wl-kjv\" data-code=\"G1514\">peaceably</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> men.","19":"Dearly <span class=\"wl wl-kjv\" data-code=\"G27\">beloved,</span> <span class=\"wl wl-kjv\" data-code=\"G1556\">avenge</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1438\">yourselves,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> rather <span class=\"wl wl-kjv\" data-code=\"G1325\">give</span> <span class=\"wl wl-kjv\" data-code=\"G5117\">place</span> unto <span class=\"wl wl-kjv\" data-code=\"G3709\">wrath:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> it is <span class=\"wl wl-kjv\" data-code=\"G1125\">written,</span> <span class=\"wl wl-kjv\" data-code=\"G1557\">Vengeance</span> is <span class=\"wl wl-kjv\" data-code=\"G1698\">mine;</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> will <span class=\"wl wl-kjv\" data-code=\"G467\">repay,</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">saith</span> the Lord.","20":"<span class=\"wl wl-kjv\" data-code=\"G3767\">Therefore</span> <span class=\"wl wl-kjv\" data-code=\"G1437\">if</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thine</span> <span class=\"wl wl-kjv\" data-code=\"G2190\">enemy</span> <span class=\"wl wl-kjv\" data-code=\"G3983\">hunger,</span> <span class=\"wl wl-kjv\" data-code=\"G5595\">feed</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him;</span> <span class=\"wl wl-kjv\" data-code=\"G1437\">if</span> he <span class=\"wl wl-kjv\" data-code=\"G1372\">thirst,</span> <span class=\"wl wl-kjv\" data-code=\"G4222\">give</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G4222\">drink:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> in <span class=\"wl wl-kjv\" data-code=\"G5124\">so</span> <span class=\"wl wl-kjv\" data-code=\"G4160\">doing</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"G4987\">heap</span> <span class=\"wl wl-kjv\" data-code=\"G440\">coals</span> of <span class=\"wl wl-kjv\" data-code=\"G4442\">fire</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> head.","21":"<span class=\"wl wl-kjv\" data-code=\"G3528\">Be</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G3528\">overcome</span> <span class=\"wl wl-kjv\" data-code=\"G5259\">of</span> <span class=\"wl wl-kjv\" data-code=\"G2556\">evil,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G3528\">overcome</span> <span class=\"wl wl-kjv\" data-code=\"G2556\">evil</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> good."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"bid u dan, broeders,","tekst":"Of, ik vermaan."},{"catchword":"door de ontfermingen Gods,","tekst":"Dat is, dewijl dan God ons zo veelvoudige barmhartigheid in Christus heeft betoond, gelijk in het voorgaande geleerd is, hetwelk het woord dan aanwijst."},{"catchword":"uw lichamen","tekst":"Dat is, uzelven, geheel een Hebreeuwse manier van spreken, waardoor een deel voor het geheel genomen wordt; gelijk hetzelve uitgelegd wordt 1Th 5:23 ."},{"catchword":"stelt","tekst":"Dat is, offert op; gelijk de offeranden voor den Heere werden aangeboden en voor Hem daargesteld en alzo Hem toegeëigend."},{"catchword":"een levende,","tekst":"Dat is, niet lichamelijk door slachting gedood, maar geestelijk door doding der begeerlijkheden geslacht zijnde, om Gode te leven; Rom 6:11 ; 2Co 5:15 ; Col 3:3 , Col 3:5 ."},{"catchword":"heilige","tekst":"Dat is, gelijk de beesten, die in het Oude Testament opgeofferd werden, zonder vlek of gebrek moesten zijn; Exo 12:5 ; Lev 1:10 ; Deu 15:21 , dat alzo wij ons afzonderen van alle onheiligheden."},{"catchword":"Gode welbehagelijke offerande,","tekst":"Dat is, voortkomende uit een oprecht en verslagen hart door het geloof gereinigd, zonder hetwelk Gode gene offeranden behagen; Isa 1:11 , en Isa 66:3 ; Jer 6:20 , en Jer 7:29 ; Hos 6:6 ; Heb 11:4 , Heb 11:6 ."},{"catchword":"redelijke godsdienst","tekst":"Dat is, een godsdienst, die niet bestaat in uiterlijk opofferen van onredelijke dieren, gelijk in het Oude Testament, maar in een geestelijk opofferen van redelijke mensen, dat is, van uzelven; Heb 13:15 ; 1Pe 2:5 ."}],"2":[{"catchword":"dezer wereld","tekst":"Grieks, dezer eeuw; namelijk die in het boze gelegen is; 1Jo 5:19 ."},{"catchword":"niet gelijkvormig;","tekst":"Dat is, neemt niet aan den vorm of de gedaante dezer boze wereld. Hoedanig deze vorm nu was, beschrijft de apostel Rom 13:13 ; Eph 4:18-19 , en Petrus, 1Pe 4:3 , en Johannes, 1Jo 2:16 ."},{"catchword":"wordt veranderd door de vernieuwing","tekst":"Grieks, in vorm, of gedaante hersteld; niet naar lichaam, gelijk de poëten in hunne fabelen dichten, somwijlen geschied te zijn, maar naar de ziel en krachten derzelve, namelijk naar het verstand en naar den wil en de genegenheden."},{"catchword":"gemoeds,","tekst":"Of, verstands. Zie Eph 1:18 , en Eph 2:3 , en Eph 4:23 ; Col 1:21 ."},{"catchword":"beproeven,","tekst":"Dat is, onderscheiden; of ene proeve geven door uw godzalig leven, dat gij verstaat welke de goede wil Gods zij."},{"catchword":"wil van God zij","tekst":"Namelijk naar welken als den enigen en volmaakten regel wij ons leven moeten aanstellen, dien Hij in zijn Woord ons volkomen geopenbaard heeft."}],"3":[{"catchword":"de genade,","tekst":"Dat is, naar het ambt des apostelschaps, dat mij uit genade bevolen is, en naar het gezag, dat mij als een apostel en gezant Gods van hem gegeven is."},{"catchword":"zeg ik een","tekst":"Dat is, Ik gebied."},{"catchword":"iegelijk,","tekst":"Namelijk die enige openbare bediening, of bijzondere gave heeft; Deu 29:29 ; Pro 25:27 ; Ecc 7:16 ."},{"catchword":"wijs zij boven hetgeen men behoort wijs te zijn;","tekst":"Grieks, overwijs zij; namelijk boven zijn begrip of beroeping. Of, zich niet late voorstaan, dat bij hem overvloediger wijsheid is dan bij andere."},{"catchword":"wijs zij tot","tekst":"Namelijk in goddelijke zaken; want die mogen en moeten ook van ons met eerbieding en aandachtige naarstigheid onderzocht worden."},{"catchword":"matigheid,","tekst":"Namelijk des verstands of der wetenschap; gelijk het Griekse woord medebrengt; zich tevreden houdende met kennis der dingen, die ter zaligheid nodig of dienstig zijn."},{"catchword":"God","tekst":"Dat is, gedenkende dat het God is, die de kennis, die gij hebt, u gegeven heeft, 1Co 7:17 , en dat gij daarom u niet over dezelve moet verhovaardigen."},{"catchword":"een iegelijk","tekst":"Dat is, gedenkende ook dat gij die kennis alleen niet hebt, maar dat dezelve, en dikwijl ook nog meerder, aan anderen is medegedeeld."},{"catchword":"de mate des geloofs","tekst":"Dat is, naar het deel, dat elkeen der gelovigen van God uitgedeeld is. Want er is niemand, die een volmaakte kennis van alles heeft, maar de ene heeft mindere, de andere meerdere; 1Co 7:7 , en 1Co 13:9 ; Eph 4:7 ."},{"catchword":"gedeeld heeft","tekst":"Namelijk als een huisvader, die elkeen zijner huisgenoten zijn deel uitdeelt, den een wat meerder, den ander wat minder, den een dit, den ander wat anders."}],"4":[{"catchword":"Want gelijk wij in een lichaam vele leden hebben,","tekst":"Dit verklaart hij met de gelijkenis van een lichaam en van deszelfs ledematen; waarmede hij bewijst, dat al de diensten en gaven, die het ene of het andere lidmaat der gemeente heeft, volgens de gemeenschap der heiligen, tot algemene stichting van het ganse lichaam der gemeente moeten besteed worden. Zie van deze gelijkenis ook 1Co 10:17 , en 1Co 12:12 , enz; Eph 4:12 , Eph 4:16 , Eph 4:25 , en Eph 5:30 ; Col 2:19 , en Col 3:15 ."}],"6":[{"catchword":"Hebbende nu verscheidene","tekst":"Namelijk sommige buitengewone, van welke de apostel handelt 1Co 12:14 , sommige gewone, van welke hier voornamelijk gehandeld wordt; die ook verscheiden zijn, gelijk hierna verklaard wordt."},{"catchword":"gaven,","tekst":"Grieks, Charismata; zo worden de bedieningen en de gaven daartoe nodig genaamd, omdat zij van God den mensen uit genade geschonken worden."}],"7":[{"catchword":"Zo laat ons die gaven besteden,","tekst":"Anderen vervullen dit aldus, hetzij profetie, zo laat ons wijs zijn naar de mate des geloofs, enz."},{"catchword":"profetie,","tekst":"Dat is, de gave of beroeping om te profeteren; waardoor verstaan wordt de gave niet zozeer om toekomende dingen te voorzeggen, gelijk gehad hebben de profeten des Ouden Testaments, en in het Nieuwe Agabus, Paulus, Petrus, Johannes en anderen, gelijk dit woord genomen wordt 1Co 12:28 ; Eph 4:11 , als van het recht verstand der Heilige Schrift uit te leggen en tot vertroosting en vermaning de gemeente toe te passen. Zie 1Co 14:1 , 1Co 14:3 ."},{"catchword":"de mate des geloofs;","tekst":"Grieks, analogian; waardoor verstaan wordt, òf de mate van kennis, die iemand van God gegeven is, gelijk vs.3, en Eph 4:7 , òf de gelijkmatigheid en overeenkomstig der hoofdstukken van de Christelijke leer, klaarlijk uitgedrukt in Gods Woord en in de artikelen des geloofs, die als een regel zijn, naar welken alle uitleggingen der Heilige Schrift moeten gedaan worden."},{"catchword":"bediening, in het bedienen;","tekst":"Grieks, diakonian; welk woord hier in het algemeen genomen wordt voor de bedieningen, die hierna in bijzondere soorten afgedeeld worden. Zie Act 1:17 ; 1Co 12:5 ."},{"catchword":"die leert, in het leren;","tekst":"Dat is, die geroepen is om een leraar te zijn; welke leraars, alzo zij hier van de Vermaners onderscheiden worden; zo menen sommigen dat hierdoor in het bijzonder verstaan worden degenen, die voornamelijk geroepen zijn om de Christelijke leer te verklaren, en dezelve tegen de valse leraars en tegensprekers te verdedigen."}],"8":[{"catchword":"die vermaant, in het vermanen;","tekst":"Of, vertroost; waardoor verstaan kunnen worden de leraars, die voornamelijk geroepen zijn om de Christelijke leer der gemeente toe te passen tot vermaning en vertroosting; die anderszins herders genaamd worden; Jer 3:15 , en Jer 23:4 ; Zec 10:2 ; Eph 4:11 ; 1Pe 5:2 , 1Pe 5:4 ."},{"catchword":"die uitdeelt,","tekst":"Dat is, die geroepen is, om de aalmoezen en collecten der gemeente te vergaderen, en aan de armen, naar hunnen nood, uit te delen, die bijzonderlijk diakenen genoemd worden. Zie van dezelve Hand. 6."},{"catchword":"in eenvoudigheid;","tekst":"Namelijk des harten; niet straf of hoogmoedig zijnde tegen de armen, niet uit gunst of nijd gevende; maar met een medelijdend en eenvoudig hart hunnen nood aanziende, en hen naar denzelven getrouwelijk bijstaande."},{"catchword":"die een voorstander is,","tekst":"Of, die over anderen gesteld is. Waardoor verstaan kunnen worden de ouderlingen, die in het Woord niet arbeiden, 1Ti 5:17 , maar met de herders opzicht hebben over de gemeente, om haar te regeren en in Christelijken vrede en tuchtte houden; die anders genaamd worden regeringen; 1Co 12:28 ."},{"catchword":"die barmhartigheid doet,","tekst":"Daardoor kan verstaan worden een zekere soort van diakenen en diakonessen, die bijzondere opzicht en bediening hadden over de kranken, ballingen en vreemdelingen, 1Ti 5:9 , hetwelk een van de bijzondere werken der barmhartigheid is."},{"catchword":"in blijmoedigheid","tekst":"Dat is, met een gewillig en toegenegen hart, zonder zich dien moeilijken dienst te laten verdrieten, of zich tegen de armen gemelijk te tonen."}],"9":[{"catchword":"De liefde","tekst":"Onder de Christelijke deugden wordt deze vooraan gesteld, omdat alle andere deugden daarin begrepen zijn, en met dezelve vergezelschapt moeten worden; Rom 13:8-10 ; 1Co 13:2 ; 1Ti 1:5 ."},{"catchword":"ongeveinsd","tekst":"Dat is, bestaande niet alleen in woorden en uiterlijke gebaren, maar voornamelijk in een oprechte toegenegenheid des harten; 1Jo 3:18 ; 1Pe 1:22 ."},{"catchword":"een afkeer van het boze,","tekst":"Hij vermaant het kwaad niet alleen te vlieden, maar ook als een gruwelijke zaak te haten; Psa 139:22 ."},{"catchword":"hangt het goede aan","tekst":"Grieks, kleeft aan, of wordt aangekleefd; namelijk gelijk als met lijm, vast aan het goede houdende, zonder daarvan afgetrokken te worden; 1Co 6:16-17 . In deze twee stukken bestaat de ganse bekering des mensen; Psa 34:15 ; Isa 1:16 ."}],"10":[{"catchword":"hartelijk lief","tekst":"Het Griekse woord betekent zulke liefde, waarmede de ouders hunne kinderen van nature liefhebben, welke is de grootste en heftigste."},{"catchword":"broederlijke liefde;","tekst":"Dat is, zulke als betaamt dengenen, die niet alleen van een vlees zijn, Isa 58:7 , maar die ook door het geloof broeders zijn van eenen Vader in de hemelen; 1Th 4:9 ; Heb 13:1 ; 1Pe 1:22 , en 1Pe 2:17 ."},{"catchword":"voorgaande","tekst":"Dat is, bejegent elkander met alle burgerlijke eerbieding en beleefdheid naar eens iegelijks staat, zonder te verwachten dat gij eerst van uwen broeder alzo bejegend wordt."}],"11":[{"catchword":"traag","tekst":"Of, lui."},{"catchword":"in het benaarstigen","tekst":"Grieks, in de benaarstiging; dat is, in de werken uwer beroeping naarstiglijk waar te nemen."},{"catchword":"Zijt vurig van geest","tekst":"Dat is, ijverig, niet lauw; Rev 3:16 ."},{"catchword":"Dient den Heere","tekst":"Dat is, wilt als dienstknechten des Heeren vlijtig betrachten alles wat tot Zijn dienst en eer vereist wordt; Psa 2:11 ; Eph 6:7 . Anderen lezen in het Grieks voor Kyrio, dat is de Heere, Kairo, dat is de tijd; in zulken in gelijk Eph 5:16 ; Col 4:5 ."}],"12":[{"catchword":"Verblijdt u","tekst":"In dit vs. worden drie middelen aangewezen om te gebruiken in tijd van kruis en tegenspoed."},{"catchword":"in de hoop","tekst":"Namelijk der verlossing en der zaligheid."}],"13":[{"catchword":"Deelt mede tot de behoeften","tekst":"Dat is, hebt ook mede uw deel in het geven tot onderhoud der armen. Of, hebt gemeenschap aan de noden der heiligen."},{"catchword":"der heiligen","tekst":"Dat is, der arme gebreklijdende Christenen."},{"catchword":"Tracht naar herbergzaamheid","tekst":"Grieks, volgt of vervolgt de herbergzaamheid, jaagt haar na; gelijk Abraham en Loth deden; Gen 18:1-2 en Gen 19:1-2 ."}],"14":[{"catchword":"zegent en","tekst":"Dit woord herhaalt nog eens om te tonen hoe nodig deze vermaning is."},{"catchword":"vervloekt niet","tekst":"Namelijk gelijk gemeenlijk de vleselijke mensen doen; 1Co 4:12 ; 1Pe 2:23 ."}],"15":[{"catchword":"Verblijdt u met de blijden;","tekst":"Dat is, zo het uwen naaste welgaat, dat hij oorzaak heeft om daarover blijde te zijn, verblijdt u ook over zijn voorspoed; en zo hij daarentegen in ellende en tegenspoed is, en daarover bedroefd is, laat u ook zijne ellende ter harte gaan, alsof het uzelven aanging; 1Co 12:26 ; Heb 13:3 ."}],"16":[{"catchword":"eensgezind onder elkander","tekst":"Dit wordt verstaan niet alleen van de enigheid van gevoelen en verstand in de hoofdstukken der Christelijke leer, maar ook voornamelijk van de enigheid der gemoederen en genegenheden tot elkander."},{"catchword":"naar de hoge dingen,","tekst":"Namelijk die uw begrip, krachten of beroeping teboven gaan; of gevoelt niet, namelijk van uzelven, hoge dingen."},{"catchword":"maar voegt u","tekst":"Het Griekse woord betekent zich van iemand mede laten leiden, dat is zich naar iemand voegen."},{"catchword":"tot de nederige","tekst":"Namelijk dingen of zaken, gelijk hij tevoren hoge dingen heeft uitgedrukt, dat is, dingen die naar nederigheid zien."},{"catchword":"Zijt niet wijs bij uzelven","tekst":"Zie vs.3."}],"17":[{"catchword":"Vergeldt niemand kwaad voor kwaad","tekst":"Hetzelfde leert ook Christus Mat 5:39 ."},{"catchword":"Bezorgt hetgeen eerlijk is","tekst":"Dat is, bevlijtigt u om zorgvuldiglijk te betrachten."},{"catchword":"voor alle mensen","tekst":"Dat is, in tegenwoordigheid niet alleen voor God, maar ook voor allerlei mensen, zowel voor de ongelovigen als voor de gelovigen; 2Co 8:21 ."}],"18":[{"catchword":"mogelijk is,","tekst":"Namelijk dat het met goede conscientie kan gedaan worden; of tenzij de boosheid der mensen zo groot zij, dat het onmogelijk is met dezelve vrede te houden."},{"catchword":"zoveel in u is,","tekst":"Dat is, dat gij gene oorzaak van onvrede geeft, en aan uwe zijde alles toebrengt wat dienstig is om den vrede te houden of te maken."},{"catchword":"alle mensen","tekst":"Namelijk niet alleen met de gelovigen, waartoe hij ons vermaant vs.16, maar ook met de ongelovigen die buiten zijn."}],"19":[{"catchword":"geeft den toorn plaats;","tekst":"Sommigen verstaan dit van den toorn des mensen, namelijk òf desgenen, die verongelijkt is, dat hij zijn toorn over het ongelijk, hem aangedaan, plaats, dat is tijd, geve om te stillen: òf desgenen, die ongelijk doet, dat men denzelven niet tegensta om hem niet meer te verbitteren, maar zijn toorn wijke en alzo plaats geve. Doch hetgeen er volgt schijnt te vereisen dat dit moet verstaan worden van den toorn, dat is van de wraak Gods, die Hij doen zal over dengene, die ongelijk doet, welke wraak men plaats geeft als men Gode de wraak opgeeft."}],"20":[{"catchword":"uw vijand","tekst":"Dat is, die zich vijandig tegen u gedraagt, niet dien gij haat of vijand zijt, want dat betaamt den Christenen niet."},{"catchword":"hongert,","tekst":"Dat is, in enigen nood is, en daarin uwe hulp van doen heeft; een deel voor het geheel genomen."},{"catchword":"spijzigt hem;","tekst":"Dat is, bewijs hem alle diensten der liefde in zijnen nood."},{"catchword":"kolen vuurs op zijn hoofd hopen","tekst":"Dat is, gij zult hem daarmede opwekken, om zijn ongelijk te kennen, hem daarvan te bekeren, en ophouden u meer kwaad te doen, gelijk iemand, dien een kool vuur op zijn hoofd gelegd wordt, hetzelve terstond gevoelt en afschudt, als hetzelve niet kunnende verdragen."}],"21":[{"catchword":"van het kwade niet","tekst":"Dat is van het ongelijk, dat u aangedaan wordt."},{"catchword":"overwonnen,","tekst":"Namelijk om daardoor tot wraakgierigheid gebracht te worden."},{"catchword":"overwint het kwade","tekst":"Dat is, neem weg, verbreek, verzacht."},{"catchword":"door het goede","tekst":"Dat is, met lankmoedigheid en weldadigheid."}]},"kanttekeningen_en":{"1":[{"catchword":"Beseech","tekst":"Or, I Exhort"},{"catchword":"you therefore brethren, by the mercies of God","tekst":"that is, seeing then God hath showed us mercy in Christ, as was taught in that which goes before which the word therefore shows"},{"catchword":"that ye set","tekst":"that is, offer up: as the sacrifices were presented before the Lord, and there set before him, and so appropriated to him"},{"catchword":"your bodies","tekst":"that is, your whole selves. A Hebrew phrase, whereby a part is taken for the whole : as the time is interpreted, 1 Thes. 5.23."},{"catchword":"for a living","tekst":"that is, not corporally put to death by slaying, but spiritually slain by mortifying our lust to live to God, Rom. 6.11. 2.Cor. 5.15. Col. 3.3.5."},{"catchword":"holy","tekst":"that is, as the beast which were offered up in the old Testament, must without spot or defect; Exod. 12.5. Levit. 1,ver.10. Deut. 15.21. that we should separate selves from all unholiness"},{"catchword":"(and) well-pleasing sacrifices to God","tekst":"that is, proceeding from upright and contrite heart, purified by faith, without which no sacrifices are pleasing to God, Isa. 1.11. and 66.3. Jer. 6.20. and 7.20. Hos. 6.6. Hebr. 11.4.6."},{"catchword":"(which is) your reasonable worship","tekst":"that is, a worship which consists not in outward offering up of unreasonable beasts, as in the old Testament, but in a spiritual offering up of a reasonable men, i.e. of your selves Heb. 13.15. 1 Pet. 2.5."}],"2":[{"catchword":"And be not comfortable","tekst":"That is, take not upon you the form or fashion of this wicked world. Now what manner of form was, the Apostles describes, Rom. 13.13. Eph. 4.18.19. and Peter 1 Pet 4.3. and John 1. Joh 2:16."},{"catchword":"to this world","tekst":"Gr. To this age. Namely, which lieth the wickedness, 1Jn 5:19."},{"catchword":"but be ye changed","tekst":"Gr. Altered in form or fashion: not according to the body, as the Poets in their fables, feign sometimes to have been done, but according to the soul and the faculties of the same, namely, according to the understanding and according to the will and affections"},{"catchword":"by the renewing of your mind","tekst":"or understanding, See Eph. 1.18. and 2.3. and 4.23. Col.1.21."},{"catchword":"that they may prove","tekst":"that is, discern: or give proof by your godly life that ye understand what is the good will of God"},{"catchword":"what is the good, and the well-pleasing, and perfect will of God","tekst":"namely, according to which as the only and perfect rule we ought to frame our lives: which in his word hath perfectly revealed unto us."}],"3":[{"catchword":"For by the grace which is given unto me","tekst":"That is, according to the Apostolical office which of grace committed unto me, according to the authority which as an Apostle and Ambassador of God is by him given me"},{"catchword":"I say","tekst":"that is, I command"},{"catchword":"to every one","tekst":"namely, who hath any public administration of free gift"},{"catchword":"which is among you, that he be not wise above that which men ought to be wise:","tekst":"Gr. Be not overwise. Namely, beyond his capacity or calling . Or that he have not a conceit, that he hath more abundant wisdom than others"},{"catchword":"but that he shall be wise","tekst":"namely, in divine things: for they may, yea must be searched into by us, with reverence and attentive diligence"},{"catchword":"unto modesty","tekst":"namely, of the understanding, or of knowledge: as the Greek word imports: contenting himself with knowledge of the things which are necessary or serviceable to salvation"},{"catchword":"even as God","tekst":"that is, considering that it is God that hath given you the knowledge which you have, 1Cor. 7.17. and that therefore you must not be proud of the same"},{"catchword":"hath dealt","tekst":"namely, as an householder, who distributes to every one of his family a portion, to the one somewhat more, to the other somewhat less, to one this, to the other somewhat else"},{"catchword":"to everyone","tekst":"that is, considering also thou hast not knowledge alone, but that the same, and oft-times also yet greater, is imparted to another"},{"catchword":"the measure of faith","tekst":"that is, according to the portion, which is by God distributed to each one of the faithful. For there is no man which hath a perfect knowledge of all things, but one hath lesser, another greater 1 Cor.7.7. and chap. 13.9. Eph. 4.7."}],"4":[{"catchword":"For as we have many members in one body","tekst":"This he explains by the similitude of a body, and the members of the same: whereby he proves that all the Offices and gifts which the one or the other members of the Church hath, according to the communion of the Saints, must be employed for the common edification of the whole body of the Church. See of this similitude also 1 Cor. 10.17. and chap 12.12 Col. 2.19. and chap 3.15. and all the members have not the same operation."}],"6":[{"catchword":"Having now different","tekst":"Namely, some extraordinary, of which the Apostle treats 1 Cor. Chap. 12.14. some ordinary, which are principally treated of here: which are also divers, as is hereafter declared"},{"catchword":"gifts","tekst":"Gr. Charismata; So the Ministry, and the gifts needful thereunto are called, because there are of grace freely given to men by God according to the grace which is given unto us."}],"7":[{"catchword":"Let us bestow those gifts","tekst":"Others supply this thus: whether it be prophecy, let us be wise according to the measure of faith etc."},{"catchword":"whether it be prophecy","tekst":"that is, the gift or calling to the prophecy, whereby is understood not so much the gift to foretell things to come, as the Prophets of the old Testament had, and in the new, Agabus, Paul, Peter, John and others, as this word is taken, 1 Cor.12.28. Eph. 4.11. as of interpreting the true meaning of the holy Scripture, and applying it to the comfort and exhortation of the Church: See 1 Cor. 14. ver. 1.3."},{"catchword":"according to the measure of faith","tekst":"Gr. Analogian: whereby is understood either the measure of knowledge which given any man of God as ver. 3. and Eph. 4.7. Or the conformity and agreement of the chief points of Christian doctrine, plainly expressed in Gods word, and in the articles of faith, all interpretations of Scripture must be made"},{"catchword":"whether it be ministry","tekst":"Gr. Diakonian which word is here taken in common for the ministries, which are hereafter divided into particular sorts. See 1 Cor..12.5. Act 1:17."},{"catchword":"in ministering : whether it be he that teacheth","tekst":"that is, he that is called to be a teacher: which teachers seeing they are distinguished from the exhorters, therefore some think, that hereby are especially understood, those that are called principally to expounded Christian doctrine, and to defend the same against false teachers and gainsayers in teaching:"}],"8":[{"catchword":"Whether it be he that hath exhorteth","tekst":"Or, comforted: whereby may be understood the teachers who are called principally to apply Christian doctrine to the Church for exhortation and comfort: who are otherwise called Pastors Jer. 3. 15. and 23.4. Zach. 10.2. Eph. 4.11. 1 Pet.5.2."},{"catchword":"in exhorting: he that distributed","tekst":"that is, he that is called to gather the alms and collections of the Church, and to distribute them to the poor according to their necessities, who are especially called Deacons. See concerning them, Acts 6."},{"catchword":"in simplicity:","tekst":"namely, of heart, not being harsh and high minded against the poor, not giving either of the favor or envy: but with a compassionate and single heart looking upon their necessity, and faithfully assisting them according to the same"},{"catchword":"he that is president","tekst":"or, he that is set over others. Whereby may be understood the Elders which labor not in the word, 1 Tim. 5.17. but together with the Pastors have oversight of the Church, to rule the same, and keep it in Christian peace and discipline, which are otherwise called Governments, 1 Cor. 12.28."},{"catchword":"in diligence: he that showed mercy","tekst":"thereby may be understood a certain sort of Deacons and Deaconess, which had a special oversight and administration about the sick exiles, and strangers, 1 Tim5.9. which is one of the most special works of mercy"},{"catchword":"in cheerfulness","tekst":"that is, with a willing & propense heart, without growing weary of that troublesome service, or showing themselves forwards towards the poor."}],"9":[{"catchword":"Let love","tekst":"Amongst the Christian virtues this is set foremost, because all other virtues are contained therein, and must be accompanied with the same, Rom. 13. ver.8.9.10. 1 Cor. 13.2. 1 Tim. 1.5."},{"catchword":"but unfeigned","tekst":"that is, consisting not only in words and outward gestures, but chiefly in sincere inclination of the heart, 1 Pet. 1.22. 1Jn 3:18."},{"catchword":"Abhor that which is evil","tekst":"he exhorts not only to avoid evil, but also to hate it as an abominable thing, Psal. 139.22."},{"catchword":"and adhere to that which is good","tekst":"Gr. Cleave to, or be cleaved unto. Namely, as is were with glue, holding fast to that which is good, without being plucked off from it, 1 Cor. 6.16,17. In these two points consist the conversion of man, Psa 34:15. Isa. 1.16."}],"10":[{"catchword":"Love one another heartily","tekst":"The Greek word signifies such of a love, wherewith Parents naturally love their children, which is the greatest and most vehement"},{"catchword":"with brotherly love","tekst":"that is, such as becometh them, who are not only of the flesh, Isa. 58.7. but also by faith are brethren of one Father in heavens, 1 Thes. 4.9. Heb. 13.1. 1 Pet. 1.22. and chap 2. ver 17."},{"catchword":"with honor one goes before the other","tekst":"that is, treat one another with all civil respect and courtesy, according to every ones condition, without expecting that thou be first so treated by thy brother."}],"11":[{"catchword":"Be not slow","tekst":"Or, lazy"},{"catchword":"in giving diligence","tekst":"Gr. In diligence, i.e. in looking diligently after the works of your calling"},{"catchword":"Be fervent","tekst":"that is, zealous, not lukewarm, Revel. 3.16."},{"catchword":"in spirit. Serve the Lord:","tekst":"that is, as servants of the Lord, diligently perform all things that are required to his service and honour, Psa 2:11. Eph. 6.7. Others in the Greek for Kyrio, i.e. the Lord; read Kayrio, i.e. the time: in such sense as Eph. 5.16. and Col. 4.5."}],"12":[{"catchword":"Rejoice ye","tekst":"In this verse are showed three remedies to be used in time of crosses and adversity"},{"catchword":"in hope","tekst":"namely, in deliverance and salvation Be patient in tribulation. Persevere in prayer."}],"13":[{"catchword":"Communicate","tekst":"That is, take you also your part in giving to the relief of the poor. Or have communion in the necessities of the Saints"},{"catchword":"to the necessities of the Saints","tekst":"that is, of the poor Christians that suffer want"},{"catchword":"Pursue hospitality","tekst":"Gr. Follow or follow after hospitality, hunt after it; as Abraham and Lot did. Gen. 18.1.2. and 19. ver.1.2."}],"14":[{"catchword":"Bless them which persecute you: bless","tekst":"This word he rehearseth once more, to show how need full thee exhortation is"},{"catchword":"and curse nor","tekst":"namely, as commonly carnal men do 1 Cor. 4.12. 1 Pet. 2.23."}],"15":[{"catchword":"Rejoice with joyful:","tekst":"that is, if it go well with your neighbour, that he hath caused to be glad for it, rejoice thou also for his prosperity: and if on the contrary he be in misery and adversity, and is sorrowful for it, let his misery also go to thy heart, as if it concerns thy self, 1 Cor. 12.26. Heb. 13.3. and weep with them that weep."}],"16":[{"catchword":"Be of one mind","tekst":"This is understood, not only of unity of opinion and understanding, in the chief points of Christian doctrine, but also principally of unity of minds and inclinations one toward another"},{"catchword":"one amongst another. Seek not after high things","tekst":"that is, which are above your capacity, abilities or calling: or think not, namely, of yourselves high things"},{"catchword":"but apply yourselves","tekst":"the Greek word signifies to suffer one self to be conducted by any other, i.e. to be condescend to any other"},{"catchword":"to the lowly","tekst":"namely, things or matters, as before he expressed high things, i.e. things which look towards lowliness"},{"catchword":"Be not wise with yourselves","tekst":"See ver.3."}],"17":[{"catchword":"Recompense to no man evil for evil","tekst":"The same Christ teacheth also, Mat. 5.39."},{"catchword":"Take care for","tekst":"that is, give diligence carefully to provide"},{"catchword":"that which is honourable to all men","tekst":"that is, not only in the presence of God, but also before all sorts of men, as well before unbeliever as before believers, 2 Cor. 8.21."}],"18":[{"catchword":"If it be possible","tekst":"Namely, that it may be done with a good conscience: or except the weakness of men be so great, that it be impossible to keep peace with them"},{"catchword":"as much as in you is","tekst":"that is, do not give any cause of discontent, and on your part contribute all that is serviceable to keep or make peace"},{"catchword":"keep peace with all men","tekst":"namely, not only with believers whereunto he exhorts us, ver.16. but also with unbelievers which are without."}],"19":[{"catchword":"Avenge not your selves&acirc;&euro;&trade; beloved: but give place unto wrath","tekst":"Some understand this of the wrath of men, either of him that is wronged, that he gives his wrath for the injury done unto him, place, i.e. time of assuage; or of him who doth wrong, that it should not be withstood, that we do not embitter him more, but decline his wrath and so give place to it. But that which followed seemed to require, that this must be understood of the wrath, i.e. of vengeance of God, which he shall take of him that doth wrong, to which wrath men gave place, when they leave revenge to God For it is written; Vengeance (belongeth) to me, I will recompense saith the Lord."}],"20":[{"catchword":"If therefore thine enemy","tekst":"That is, who carries himself like an enemy towards thee, not whom thou hates or art an enemy to, for that becometh not Christians"},{"catchword":"hunger","tekst":"that is, be in necessity, and therein hath need of thy help: a part taken from the whole"},{"catchword":"if he thirst, give him drink: For in doing that, thou shalt heap coals of fire upon his head","tekst":"that is, thou shalt thereby stir him up, to know his injury, to turn from it, and to cease to thee any evil, as any one that hath a coal of fire laid on his head, presently feels the same and shakes it off, as not being able to endure it."}],"21":[{"catchword":"Be not overcome","tekst":"Namely, thereby to be brought to desire of revenge"},{"catchword":"of evil","tekst":"that is, of wrong that it done thee"},{"catchword":"but overcome evil","tekst":"that is, take away, break off, mitigate"},{"catchword":"by good","tekst":"that is, with long suffering and bountry."}]}}};

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

function renderPaneel(n) {

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });

  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();

    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {

      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);

    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
