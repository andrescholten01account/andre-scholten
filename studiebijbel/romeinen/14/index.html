elf, en niemand sterft voor zichzelf.","8":"Want hetzij wij leven, wij leven voor de Heere; hetzij wij sterven, wij sterven voor de Heere. Hetzij wij dan leven, hetzij wij sterven, wij zijn van de Heere.","9":"Want daarvoor is Christus ook gestorven, en opgestaan, en weer levend geworden, opdat Hij zou heersen over zowel doden als levenden.","10":"Maar u, wat oordeelt u uw broeder? Of ook u, wat veracht u uw broeder? Want wij zullen allen voor de rechterstoel van Christus gesteld worden.","11":"Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.","12":"Dus zal ieder van ons voor zichzelf rekenschap geven aan God.","13":"Laten wij elkaar dan niet meer oordelen; maar oordeelt dit liever, namelijk dat u de broeder geen aanstoot of ergernis geeft.","14":"Ik weet en ben verzekerd in de Heere Jezus, dat niets onrein is op zichzelf; behalve voor hem die iets acht onrein te zijn, voor hem is het onrein.","15":"Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is.","16":"Laat dan uw goed niet gelasterd worden.","17":"Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.","18":"Want hij die Christus in deze dingen dient, is God welgevallig, en aangenaam bij de mensen.","19":"Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.","20":"Verbreek het werk van God niet om het voedsel. Alle dingen zijn wel rein; maar het is kwaad voor de mens die met aanstoot eet.","21":"Het is goed geen vlees te eten, en geen wijn te drinken, en niets *waaraan* uw broeder zich stoot, of geërgerd wordt, of *waarin* hij zwak is.","22":"Hebt u geloof? Houd dat bij uzelf voor God. Zalig is hij die zichzelf niet oordeelt in wat hij voor goed houdt.","23":"Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof *eet*. En alles wat niet uit het geloof is, dat is zonde."},"SV":{"1":"Dengene nu, die zwak is in het geloof, neemt aan, *maar* niet tot twistige samensprekingen.","2":"De een gelooft wel, dat men alles eten mag, maar die zwak is, eet moeskruiden.","3":"Die daar eet, verachte hem niet, die niet eet; en die niet eet, oordele hem niet, die daar eet; want God heeft hem aangenomen.","4":"Wie zijt gij, die eens anderen huisknecht oordeelt? Hij staat, of hij valt zijn eigen heer; doch hij zal vastgesteld worden, want God is machtig hem vast te stellen.","5":"De een acht wel den *enen* dag boven den *anderen* dag; maar de ander acht al de dagen *gelijk*. Een iegelijk zij in zijn eigen gemoed ten volle verzekerd.","6":"Die den dag waarneemt, die neemt *hem* waar den Heere; en die den dag niet waarneemt, die neemt *hem* niet waar den Heere. Die daar eet, die eet *zulks* den Heere, want hij dankt God; en die niet eet, die eet *zulks* den Heere niet, en hij dankt God.","7":"Want niemand van ons leeft zichzelven, en niemand sterft zichzelven.","8":"Want hetzij dat wij leven, wij leven den Heere; hetzij dat wij sterven, wij sterven den Heere. Hetzij dan dat wij leven, hetzij dat wij sterven, wij zijn des Heeren.","9":"Want daartoe is Christus ook gestorven, en opgestaan, en weder levend geworden, opdat Hij beiden over doden en levenden heersen zou.","10":"Maar gij, wat oordeelt gij uw broeder? Of ook gij, wat veracht gij uw broeder? Want wij zullen allen voor den rechterstoel van Christus gesteld worden.","11":"Want er is geschreven: Ik leef, zegt de Heere; voor Mij zal alle knie zich buigen, en alle tong zal God belijden.","12":"Zo dan een iegelijk van ons zal voor zichzelven Gode rekenschap geven.","13":"Laat ons dan elkander niet meer oordelen; maar oordeelt dit liever, namelijk, dat gij den broeder geen aanstoot of ergernis geeft.","14":"Ik weet en ben verzekerd in den Heere Jezus, dat geen ding onrein is in zichzelven; dan die acht iets onrein te zijn, dien is het onrein.","15":"Maar indien uw broeder om der spijze wil bedroefd wordt, zo wandelt gij niet meer naar liefde. Verderf dien niet met uw spijze, voor welken Christus gestorven is.","16":"Dat dan uw goed niet gelasterd worde.","17":"Want het Koninkrijk Gods is niet spijs en drank, maar rechtvaardigheid, en vrede, en blijdschap, door den Heiligen Geest.","18":"Want die Christus in deze dingen dient, is Gode welbehagelijk, en aangenaam den mensen.","19":"Zo dan laat ons najagen, hetgeen tot den vrede, en hetgeen tot de stichting onder elkander *dient*.","20":"Verbreek het werk van God niet om der spijze wil. Alle dingen zijn wel rein; maar het is kwaad den mens, die met aanstoot eet.","21":"Het is goed geen vlees te eten, noch wijn te drinken, noch *iets*, waaraan uw broeder zich stoot, of geërgerd wordt, of *waarin* hij zwak is.","22":"Hebt gij geloof? hebt *dat* bij uzelven voor God. Zalig is hij, die zichzelven niet oordeelt in hetgeen hij voor goed houdt.","23":"Maar die twijfelt, indien hij eet, is veroordeeld, omdat hij niet uit het geloof *eet*. En al wat uit het geloof niet is, dat is zonde."},"KJV":{"1":"Him that is weak in the faith receive ye, *but* not to doubtful disputations.","2":"For one believeth that he may eat all things: another, who is weak, eateth herbs.","3":"Let not him that eateth despise him that eateth not; and let not him which eateth not judge him that eateth: for God hath received him.","4":"Who art thou that judgest another man's servant? to his own master he standeth or falleth. Yea, he shall be holden up: for God is able to make him stand.","5":"One man esteemeth one day above another: another esteemeth every day *alike*. Let every man be fully persuaded in his own mind.","6":"He that regardeth the day, regardeth *it* unto the Lord; and he that regardeth not the day, to the Lord he doth not regard *it*. He that eateth, eateth to the Lord, for he giveth God thanks; and he that eateth not, to the Lord he eateth not, and giveth God thanks.","7":"For none of us liveth to himself, and no man dieth to himself.","8":"For whether we live, we live unto the Lord; and whether we die, we die unto the Lord: whether we live therefore, or die, we are the Lord's.","9":"For to this end Christ both died, and rose, and revived, that he might be Lord both of the dead and living.","10":"But why dost thou judge thy brother? or why dost thou set at nought thy brother? for we shall all stand before the judgment seat of Christ.","11":"For it is written, *As* I live, saith the Lord, every knee shall bow to me, and every tongue shall confess to God.","12":"So then every one of us shall give account of himself to God.","13":"Let us not therefore judge one another any more: but judge this rather, that no man put a stumblingblock or an occasion to fall in *his* brother's way.","14":"I know, and am persuaded by the Lord Jesus, that *there is* nothing unclean of itself: but to him that esteemeth any thing to be unclean, to him *it is* unclean.","15":"But if thy brother be grieved with *thy* meat, now walkest thou not charitably. Destroy not him with thy meat, for whom Christ died.","16":"Let not then your good be evil spoken of:","17":"For the kingdom of God is not meat and drink; but righteousness, and peace, and joy in the Holy Ghost.","18":"For he that in these things serveth Christ *is* acceptable to God, and approved of men.","19":"Let us therefore follow after the things which make for peace, and things wherewith one may edify another.","20":"For meat destroy not the work of God. All things indeed *are* pure; but *it is* evil for that man who eateth with offence.","21":"*It is* good neither to eat flesh, nor to drink wine, nor *any thing* whereby thy brother stumbleth, or is offended, or is made weak.","22":"Hast thou faith? have *it* to thyself before God. Happy *is* he that condemneth not himself in that thing which he alloweth.","23":"And he that doubteth is damned if he eat, because *he eateth* not of faith: for whatsoever *is* not of faith is sin."}},"tsk":{"1":[{"kopje":"zwak","refs":["Rom 14:21","Rom 4:19","Rom 15:1","Rom 15:7","Job 4:3","Jes 35:3","Jes 35:4","Jes 40:11","Jes 42:3","Ezech 34:4","Ezech 34:16","Zach 11:16","Matt 12:20","Matt 14:31","Matt 18:6","Matt 18:10","Luk 17:2","1 Kor 3:1","1 Kor 3:2","1 Kor 8:7-13","1 Kor 9:22"]},{"kopje":"Neem aan","refs":["Rom 15:7","Matt 10:40-42","Matt 18:5","Joh 13:20","Fil 2:29","2 Joh 1:10","3 Joh 1:8-10"]},{"kopje":"twistige samensprekingen","refs":["Rom 14:2-5"]}],"2":[{"kopje":"dat","refs":["Rom 14:14","1 Kor 10:25","Gal 2:12","1 Tim 4:4","Tit 1:15","Hebr 9:10","Hebr 13:9"]},{"kopje":"de één","refs":["Rom 14:22","Rom 14:23"]},{"kopje":"eet","refs":["Gen 1:29","Gen 9:3","Spr 15:17","Dan 1:12","Dan 1:16"]}],"3":[{"kopje":"verachten","refs":["Rom 14:10","Rom 14:15","Rom 14:21","Zach 4:10","Matt 18:10","Luk 18:9","1 Kor 8:11-13"]},{"kopje":"oordelen","refs":["Rom 14:13","Matt 7:1","Matt 7:2","Matt 9:14","Matt 11:18","Matt 11:19","1 Kor 10:29","1 Kor 10:30","Kol 2:16","Kol 2:17"]},{"kopje":"want","refs":["Hand 10:34","Hand 10:44","Hand 15:8","Hand 15:9"]}],"4":[{"kopje":"Wie","refs":["Rom 9:20","Hand 11:17","1 Kor 4:4","1 Kor 4:5","Jak 4:11","Jak 4:12"]},{"kopje":"hij zal","refs":["Rom 14:3","Rom 11:23","Rom 16:25","Deut 33:27-29","Ps 17:5","Ps 37:17","Ps 37:24","Ps 37:28","Ps 119:116","Ps 119:117","Joh 10:28-30","Rom 8:31-39","Hebr 7:25","1 Petr 1:5","Judas 1:24"]},{"kopje":"want","refs":["Jes 40:29"]}],"5":[{"kopje":"acht","refs":["Gal 4:9","Gal 4:10","Kol 2:16","Kol 2:17"]},{"kopje":"Laat","refs":["Rom 14:14","Rom 14:23","1 Kor 8:7","1 Kor 8:11"]},{"kopje":"overtuigd","refs":["1 Joh 3:19-21"]}],"6":[{"kopje":"neemt in acht","refs":["Gal 4:10"]},{"kopje":"neemt hem in acht","refs":["Ex 12:14","Ex 12:42","Ex 16:25","Jes 58:5","Zach 7:5","Zach 7:6"]},{"kopje":"want","refs":["Matt 14:19","Matt 15:36","Joh 6:28","1 Kor 10:30","1 Kor 10:31","1 Tim 4:3-5"]}],"8":[{"kopje":"wij sterven voor","refs":["Joh 21:19","Hand 13:36","Hand 20:24","Hand 21:1 de=\"G1515\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5479\">joy</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G40\">Holy</span> Ghost.","18":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> he that <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> these <span class=\"wl wl-kjv\" data-code=\"G5125\">things</span> <span class=\"wl wl-kjv\" data-code=\"G1398\">serveth</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> is <span class=\"wl wl-kjv\" data-code=\"G2101\">acceptable</span> to <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1384\">approved</span> of men.","19":"Let <span class=\"wl wl-kjv\" data-code=\"G1377\">us</span> <span class=\"wl wl-kjv\" data-code=\"G686\">therefore</span> follow <span class=\"wl wl-kjv\" data-code=\"G1377\">after</span> the things which make <span class=\"wl wl-kjv\" data-code=\"G3588\">for</span> <span class=\"wl wl-kjv\" data-code=\"G1515\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> things <span class=\"wl wl-kjv\" data-code=\"G1519\">wherewith</span> <span class=\"wl wl-kjv\" data-code=\"G240\">one</span> may <span class=\"wl wl-kjv\" data-code=\"G3619\">edify</span> another.","20":"<span class=\"wl wl-kjv\" data-code=\"G1752\">For</span> <span class=\"wl wl-kjv\" data-code=\"G1033\">meat</span> <span class=\"wl wl-kjv\" data-code=\"G2647\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> the <span class=\"wl wl-kjv\" data-code=\"G2041\">work</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God.</span> All <span class=\"wl wl-kjv\" data-code=\"G3956\">things</span> <span class=\"wl wl-kjv\" data-code=\"G3303\">indeed</span> are <span class=\"wl wl-kjv\" data-code=\"G2513\">pure;</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> it is <span class=\"wl wl-kjv\" data-code=\"G2556\">evil</span> for that <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> who <span class=\"wl wl-kjv\" data-code=\"G2068\">eateth</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">with</span> offence.","21":"It is <span class=\"wl wl-kjv\" data-code=\"G2570\">good</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">neither</span> to <span class=\"wl wl-kjv\" data-code=\"G5315\">eat</span> <span class=\"wl wl-kjv\" data-code=\"G2907\">flesh,</span> <span class=\"wl wl-kjv\" data-code=\"G3366\">nor</span> to <span class=\"wl wl-kjv\" data-code=\"G4095\">drink</span> <span class=\"wl wl-kjv\" data-code=\"G3631\">wine,</span> <span class=\"wl wl-kjv\" data-code=\"G3366\">nor</span> any thing <span class=\"wl wl-kjv\" data-code=\"G1722\">whereby</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brother</span> <span class=\"wl wl-kjv\" data-code=\"G4350\">stumbleth,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> is <span class=\"wl wl-kjv\" data-code=\"G4624\">offended,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> is made weak.","22":"<span class=\"wl wl-kjv\" data-code=\"G2192\">Hast</span> <span class=\"wl wl-kjv\" data-code=\"G4771\">thou</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith?</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> it <span class=\"wl wl-kjv\" data-code=\"G2596\">to</span> <span class=\"wl wl-kjv\" data-code=\"G4572\">thyself</span> <span class=\"wl wl-kjv\" data-code=\"G1799\">before</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God.</span> <span class=\"wl wl-kjv\" data-code=\"G3107\">Happy</span> is he that <span class=\"wl wl-kjv\" data-code=\"G2919\">condemneth</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1438\">himself</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> that thing <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> he alloweth.","23":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> he that <span class=\"wl wl-kjv\" data-code=\"G1252\">doubteth</span> is <span class=\"wl wl-kjv\" data-code=\"G2632\">damned</span> <span class=\"wl wl-kjv\" data-code=\"G1437\">if</span> he <span class=\"wl wl-kjv\" data-code=\"G5315\">eat,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">because</span> he eateth <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">for</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">whatsoever</span> is <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> sin."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"die zwak is in het geloof,","tekst":"Dat is, die het stuk van de afdoening der ceremoniën des Ouden Testaments nog niet recht verstaat uit zwakheid; gelijk vele Joden waren toen ter tijd, die tot de Christelijke religie bekeerd waren, welke, omdat de ceremoniën van God zelf ingesteld waren en zij in dezelve waren opgebracht, toen nog niet wel konden geloven dat zij nagelaten mochten of behoorden te worden, en daarom zich ergerden als de gelovigen uit de heidenen die niet onderhielden. Hij spreekt dan hier niet van degenen, die uit hardnekkigheid staande hielden en leerden dat de onderhouding der ceremoniën ter zaligheid nog noodzakelijk was, tegen welken hij handelt in den brief aan de Galaten."},{"catchword":"neemt aan,","tekst":"Namelijk als een broeder, met alle vriendelijkheid, verdragende in hem zijne zwakheid. Zie Phm 1:12 , Phm 1:17 ."},{"catchword":"tot twistige","tekst":"Grieks, twistingen der samensprekingen; of twijfelingen der gedachten; namelijk dat gij hem daartoe niet brengt."},{"catchword":"samensprekingen","tekst":"Of, overleggingen, disputeringen; dat is, dat gij niet te zeer en te heftig hierover met hem disputeert, twist en hem verwart, en tot meerdere twijfeling brengt; of, dat hij met u ten gevalle doe tegen zijne conscientie."}],"2":[{"catchword":"De een gelooft wel,","tekst":"Namelijk die de Christelijke vrijheid recht verstaat."},{"catchword":"alles eten mag,","tekst":"Dat is, allerlei eetbare spijs, zonder onderscheid van reine of onreine, hetwelk in het Oude Testament was; Lev 11:4 ; Deu 14:7 ."},{"catchword":"die zwak is,","tekst":"Namelijk in het geloof, vs.1."},{"catchword":"eet moeskruiden","tekst":"Namelijk liever dan dat hij hier de wet niet zou houden; dat is, laat hem genoegen met een slechte spijs, die in de wet toegelaten was, en onthoudt hem van het vlees van zwijnen, hazen, konijnen en andere in de wet verboden; Lev 11:5 , enz."}],"3":[{"catchword":"Die daar eet,","tekst":"Dat is, die gelooft dat men allerlei spijs mag eten, en zulks ook doet."},{"catchword":"verachte hem niet,","tekst":"Grieks, houde hem niet als niets. Zie van dit woord Mar 9:12 ; Luk 23:11 ."},{"catchword":"die niet eet; en","tekst":"Namelijk allerlei spijs, omdat hij meent dat zulks niet geoorloofd is."},{"catchword":"oordele hem niet,","tekst":"Dat is, veroordeel, namelijk dat hij daaraan zou zondigen; of dat hij daarom een ongodsdienstig mens of een verachter van de wet zou zijn."},{"catchword":"hem aangenomen","tekst":"Dat is, zowel den een als den ander tot het geloof gebracht en tot een van zijne kinderen in de gemeenschap zijner kerk aangenomen; en behoort daarom van de mensen niet veracht of veroordeeld te worden."}],"4":[{"catchword":"Wie zijt gij,","tekst":"Hij bestraft beiden, de zwakken en de sterken, dat zij elkander verachtten en veroordeelden."},{"catchword":"eens anderen huisknecht","tekst":"Dat is, uwen broeder, die niet uw maar Gods dienstknecht is. Waarmede hij toont dat zulk veroordelen strijdt, zelfs tegen het recht der natuur, naar hetwelk niemand eens anders dienstknecht, over wien hij geen recht heeft, mag veroordelen."},{"catchword":"oordeelt?","tekst":"Dat is, veroordeelt, vs.3."},{"catchword":"Hij staat,","tekst":"Dat is, zo hij wel doet."},{"catchword":"valt","tekst":"Dat is, zo hij zondigt."},{"catchword":"zijn eigen heer;","tekst":"Namelijk wien hij toekomt, en die alleen recht heeft om hem te oordelen; wanneer die hem dan niet veroordeelt, zo behoort hem zijn mededienstknecht niet te veroordelen."},{"catchword":"vastgesteld worden,","tekst":"Dat is, in het geloof meer en meer toenemen en bevestigd worden."},{"catchword":"machtig hem vast te stellen","tekst":"Dat is, heeft niet alleen den wil, want Hij heeft hem aangenomen, vs.3, maar ook de macht om hem te versterken in het geloof, zodat gij niet veel met hem daarover behoeft te twisten."}],"5":[{"catchword":"De een","tekst":"Namelijk de gelovige Jood, die de Christelijke vrijheid nog niet recht verstaat."},{"catchword":"acht wel den enen dag boven den anderen dag;","tekst":"Grieks, oordeelt; dat is meent, dat de feestdagen des Ouden Testaments nog moeten onderhouden worden, en dat overzulks de ene dag heiliger is dan de andere."},{"catchword":"de ander","tekst":"Namelijk de gelovige heiden, die de Christelijke vrijheid verstaat."},{"catchword":"acht al de dagen gelijk","tekst":"Grieks, allen dag, of een iegelijken dag; dat is, houdt dat het onderscheid der dagen nu ophoudt, en dat wij nu aan de feestdagen des Ouden Testaments niet verbonden zijn."},{"catchword":"Een iegelijk zij","tekst":"Namelijk hetzij dat hij eet of niet eet, de dagen onderscheidt of niet onderscheidt."},{"catchword":"in zijn eigen gemoed","tekst":"Of in zijn eigen verstand."},{"catchword":"ten volle verzekerd","tekst":"Namelijk dat hij, zulks doende, niet zondigt en niet voorheeft God te vertoornen, en wetens tegen zijnen wil te doen; en dat hij dienvolgens ook naarstiglijk onderzoeke, welk van beiden den Heere behaagt."}],"6":[{"catchword":"den dag waarneemt,","tekst":"Dat is, de feestdagen des Ouden Testaments, welke de zwakken uit de Joden meenden, ook in het Nieuwe Testament te moeten onderhouden worden."},{"catchword":"den Heere; en die","tekst":"Dat is, heeft anders niets voor, dan daarmede den Heere dienst en ere te bewijzen. Zodat zij beiden, de zwakken en sterken enerlei doel en oogmerk voorhebben, en daarom elkander niet moeten veroordelen."},{"catchword":"Die daar eet,","tekst":"Namelijk allerlei spijs, en gelooft dat zulks geoorloofd is, vs.2."},{"catchword":"hij dankt God; en die niet eet,","tekst":"Namelijk de sterke voor deze vrijheid en voor de spijs, die hij met goede conscientie nuttigt."},{"catchword":"hij dankt God","tekst":"Namelijk de zwakke, hoewel hij meent sommige spijzen verboden te zijn, dat evenwel God hem verleent, waarmede hij met goede conscientie kan gevoed worden; 1Ti 4:5 ."}],"7":[{"catchword":"van ons","tekst":"Namelijk gelovigen Christenen, hetzij sterken of zwakken."},{"catchword":"leeft zichzelven,","tekst":"Dat is, moet zijn leven aanstellen niet naar zijn eigen lust of voordeel; of gelijk hij wil, alzo hij zijn zelfs eigen niet is, maar onder een ander, namelijk den Heere staat; naar wiens bevel en tot wiens dienst hij zijn leven moet richten."},{"catchword":"sterft zichzelven","tekst":"Namelijk gelijk of het met zijn dood ten enenmale met hem uit ware."}],"8":[{"catchword":"wij leven den Heere;","tekst":"Dat is, wij staan onder het gebied des Heeren Jezus Christus, als Zijn eigen dienstknechten zijnde, door Zijn bloed gekocht, en moeten overzulks ons leven tot Zijn dienst en eer besteden."},{"catchword":"wij sterven den Heere","tekst":"Dat is, wij moeten bereid zijn, om ten dienste en ere onzes Heeren ons leven af te leggen, als het Hem belieft, en zullen na onzen dood van ons doen rekenschap geven."},{"catchword":"wij zijn des Heeren","tekst":"Dat is, wij zijn Christus' eigendom en dienstknechten, die onder Hem staan en naar Zijn bevel leven en sterven moeten."}],"9":[{"catchword":"Want daartoe is Christus ook gestorven,","tekst":"Hier bewijst hij dat Christus onze Heere is, en dat hij dit recht van heerschappij door Zijn dood en opstanding over ons verkregen heeft; 1Co 6:20 ;; 1Pe 1:18 ."},{"catchword":"doden en levenden heersen zou","tekst":"Dat is, over alle gelovigen, zowel, die nog leven als die in den Heere gestorven zijn, en die wederom van Hem zullen opgewekt worden."}],"10":[{"catchword":"gij,","tekst":"Namelijk zwakke."},{"catchword":"oordeelt gij","tekst":"Dat is, veroordeelt, vs.3."},{"catchword":"uw broeder?","tekst":"Dat is, de gelovige Christenen, die de Christelijke vrijheid verstaan en gebruiken."},{"catchword":"gij,","tekst":"Namelijk sterke in het geloof."},{"catchword":"veracht gij","tekst":"Zie vs.3."},{"catchword":"uw broeder?","tekst":"Namelijk die de Christelijke vrijheid nog niet verstaat, noch durft gebruiken, om dezer zwakheid wil."},{"catchword":"voor den rechterstoel","tekst":"Dat is, voor het oordeel Gods, hetwelk Christus als Rechter houden zal, 2Co 5:10 , wien het alleen ook toekomt over de conscientiën te oordelen; en dien wij rekenschap moeten geven van al ons doen en laten, vs.12."}],"11":[{"catchword":"Ik leef,","tekst":"Dat is, zo waarachtiglijk als Ik leef; ene manier van eedzweren, die de Heere dikwijls gebruikt, Num 14:21 , Num 14:28 ; Isa 49:18 ; Jer 22:24 ; Eze 5:11 , en Eze 14:16 , Eze 14:18 , en Eze 20:3 ."},{"catchword":"zegt de Heere;","tekst":"Hetgeen van Jehova, den waren God, bij den profeet gezegd is, wordt hier Christus toegeëigend, om te tonen dat Hij ook de waarachtige God is."},{"catchword":"voor Mij zal","tekst":"Namelijk Christus, den Zoon Gods en Zaligmaker. Zie Eph 1:20 , Eph 1:22 ; Phi 2:10 ."},{"catchword":"knie zich buigen,","tekst":"Dat is, eerbied en gehoorzaamheid als hunnen Heere betonen; zie Phi 2:10 ."},{"catchword":"alle tong zal God","tekst":"Dat is, de gelovigen uit alle natiën, zowel sterken als zwakken, zullen met hunne tongen en monden mij belijden de ware God en hun Heere en rechter te zijn; Rom 10:9-10 ."},{"catchword":"belijden","tekst":"Of, loven, danken."}],"12":[{"catchword":"een iegelijk","tekst":"Wie hij ook zij, groot of klein; zwak of sterk."},{"catchword":"voor zichzelven","tekst":"Dat is, van zijn eigen doen en laten, en niet van eens anders doen."},{"catchword":"Gode","tekst":"Dat is, den Heere Christus, die waarachtig God is en Gods gericht houden zal."},{"catchword":"rekenschap geven","tekst":"Namelijk hoe wij ons gedragen hebben in dit leven. Zie Mat 25:2 ; 2Co 5:10 ."}],"13":[{"catchword":"oordelen;","tekst":"Dat is, veroordelen, vs.4, 10, namelijk dewijl het oordeel den Heere Christus toekomt."},{"catchword":"oordeelt dit liever,","tekst":"Dat is, acht en bekent dat dit het beste en betamelijkste is."},{"catchword":"gij","tekst":"Namelijk sterke."},{"catchword":"den broeder","tekst":"Namelijk die nog zwak is."},{"catchword":"aanstoot","tekst":"Namelijk dat gij door uw ontijdig gebruik der Christelijke vrijheid, of lichtvaardig veroordelen, niet worde vervreemd van den Christelijken godsdienst. Zie 1Co 8:9 ."},{"catchword":"geeft","tekst":"Grieks, stelt, of legt."}],"14":[{"catchword":"Ik weet en ben verzekerd","tekst":"Dat is, hoewel ik wel weet."},{"catchword":"in den Heere Jezus,","tekst":"Dat is, voor den Heere Christus. Zie Act 10:15 ."},{"catchword":"geen ding","tekst":"Dat is, gene spijs."},{"catchword":"onrein is","tekst":"Grieks, gemeen is. Zie Act 10:14 , namelijk, nu in het Nieuwe Testament na de komst van Christus."},{"catchword":"in zichzelven;","tekst":"Of, door zichzelven; dat is, uit zijn eigen natuur; Gen 1:31 , en Gen 9:2-3 . Hij spreekt van eetbare spijzen; hoewel dan daarna enige derzelve ten aanzien van het gebod Gods voor een tijd onrein zijn geweest; zo zijn zij nu alle voor rein te houden, overmits die schaduwen nu ophouden; Col 2:16 ; 1Ti 4:3-4 ."},{"catchword":"die acht iets onrein te zijn,","tekst":"Dat is, die nog niet gelooft dat het onderscheid der spijs nu ophoudt, maar meent dat dit verbod Gods nog moet achtervolgd worden. Want de middelmatige zaken zijn ons zodanig, gelijk wij dezelve achten, wanneer zij zonder ergernis kunnen gedaan of gelaten worden."},{"catchword":"die is het onrein","tekst":"Dat is, die mag tegen zijn gevoelen zulke spijs niet eten; want daarmede zou hij doen hetgeen hijzelf zonde houdt te wezen."}],"15":[{"catchword":"uw broeder","tekst":"Dat is, de zwakke medegelovige."},{"catchword":"om der spijze wil","tekst":"Dat is, omdat hij ziet dat gij spijs eet, die hij houdt van God den Christenen verboden te zijn."},{"catchword":"bedroefd wordt,","tekst":"Namelijk als hij ziet dat gij, die sterk zijt, spijs eet, die in het Oude Testament verboden was, menende dat gij daaraan u bezondigt tegen God; hetwelk de godzaligen bedroeft. Of, ziende dat gij daarmede hen als veracht en veroordeelt."},{"catchword":"naar liefde","tekst":"Want die bedroeft of ergert niemand, maar zoekt de zwakken tegemoet te gaan, toe te geven en in het geloof te sterken; 1Co 13:4 , enz."},{"catchword":"Verderf dien niet","tekst":"Namelijk zoveel in u is; hem daarmede vervremende van den Christelijken godsdienst. Of, zo hij uw voorbeeld volgt tegen zijne conscientie, dezelve daarmede kwetsende, waardoor zijn geloof in gevaar gebracht wordt."},{"catchword":"met uw spijze,","tekst":"Dat is, etende voor hem spijs, die hij meent nog verboden te zijn."},{"catchword":"voor welken Christus gestorven is","tekst":"Namelijk om hem te behouden, die gij, zoveel in u is, verderft, hetwelk een gruwelijke zonde is, die ook tegen Christus gedaan wordt; 1Co 8:12 . Anderszins moet men al degenen, die het geloof van Christus belijden, naar het oordeel der liefde, houden voor zodanig, die van Christus door zijn dood verlost zijn. Want dat degenen, die waarlijk door den dood van Christus eens verlost zijn, niet zullen verloren gaan, wordt geleerd Mat 24:24 ; Joh 10:28 ; 1Pe 1:5 ."}],"16":[{"catchword":"uw goed niet","tekst":"Dat is, uwe Christelijke vrijheid en het gebruik derzelve."},{"catchword":"gelasterd worde","tekst":"Zo van de zwakke Christenen als van degenen, die buiten zijn, als zij zullen zien dat de Christenen om zulke geringe zaken met elkander twisten."}],"17":[{"catchword":"het Koninkrijk Gods","tekst":"Dat is, het koninkrijk der heerlijkheid of der eeuwige zaligheid wordt niet verkregen door spijs eten of niet eten, en het rijk der genade of de ware godzaligheid wordt daardoor niet bevorderd. Zie 1Co 8:8 ."},{"catchword":"rechtvaardigheid,","tekst":"Namelijk Gods of des geloofs, die tevoren beschreven is, Rom 4:5 . Waarmede de heiligheid des levens ook gevoegd moet zijn."},{"catchword":"vrede,","tekst":"Namelijk gerustheid in onze harten en conscientiën door de verzekering, dat wij en ons doen door het geloof Gode aangenaam zijn, Rom 5:1 , en ook uiterlijke vrede en enigheid onder de broeders."},{"catchword":"blijdschap,","tekst":"Dat is, een geestelijke vreugde in het hart, ontstaande uit de vaste hoop der zaligheid en uit aanmerking van den welstand der gemeente in vrede bloeiende."},{"catchword":"door den Heiligen Geest","tekst":"Grieks, in den Heiligen Geest; dat is, die van den Heiligen Geest gewrocht en ontstoken wordt, en een geestelijke, niet een wereldse blijdschap is."}],"18":[{"catchword":"in deze dingen","tekst":"Dat is, die zijne gerechtigheid door het geloof in Christus zoekt, naar ware heiligheid staat, en in zichzelven gevoelt den vrede en de blijdschap des Heiligen Geestes, en altijd naar vrede tracht."},{"catchword":"dient,","tekst":"Bewijst Christus de gehoorzaamheid en den godsdienst, die Hij van u eist."},{"catchword":"aangenaam","tekst":"Grieks, beproeft; dat is voor goed en godzalig bevonden en gehouden."},{"catchword":"den mensen","tekst":"Namelijk die recht oordelen."}],"19":[{"catchword":"najagen,","tekst":"Grieks, vervolgen; dat is, op alle manieren zoeken. Zie dergelijke Psa 34:15 ."},{"catchword":"hetgeen tot den vrede,","tekst":"Dat is, laat ons alle middelen aanwenden om vrede onder de gelovigen te houden, en vlieden al wat dien zou kunnen verbreken of verhinderen."},{"catchword":"stichting","tekst":"Eene gelijkenis, genomen van het opbouwen van een huis of tempel; dat is, laat ons trachten naar hetgeen waardoor de kerk Gods, die het huis is des levenden Gods, 1Ti 3:15 , en Heb 3:6 mag opgebouwd en gesticht worden; Mat 16:18 ; 1Co 3:9 ; 2Co 13:10 ; Eph 4:12 ; 1Ti 1:4 ."},{"catchword":"onder elkander dient","tekst":"Dat is, aan wederzijden, elk toebrengende, wat tot stichting der gemeente dienstig is, de zwakke met toenemen in de kennis der Christelijke vrijheid, en niet te veroordelen de andere; en de sterke in het aannemen van de zwakken, met vermijding van ergernis en van verachting der zwakken."}],"20":[{"catchword":"Verbreek","tekst":"Grieks, ontbind niet, of maak niet los; namelijk zoveel in u is, met ontijdig gebruik der Christelijke vrijheid, verachting en aanstoot; dit wordt gesteld tegen opbouwen of stichten."},{"catchword":"het werk van God niet","tekst":"Dat is, het geloof des zwakken broeders, hetwelk God heeft begonnen in hem tot zijne zaligheid te werken; want het is een grote zonde af te breken hetgeen God bouwt."},{"catchword":"om der spijze wil","tekst":"Dat is, om zulk ene geringe zaak, als daar is deze of die spijs te eten."},{"catchword":"Alle dingen zijn wel rein;","tekst":"Dat is, ik beken wel dat den Christenen nu geoorloofd is allerlei spijs te eten. Zie vs.14."},{"catchword":"kwaad den mens,","tekst":"Dat is, zondig en schadelijk."},{"catchword":"met aanstoot eet","tekst":"Namelijk der zwakken."}],"21":[{"catchword":"Het is goed geen vlees te eten,","tekst":"Dat is, dienstig tot stichting der zwakken in de gemeente."},{"catchword":"uw broeder zich","tekst":"Namelijk die nog zwak is in het geloof."},{"catchword":"stoot, of geërgerd wordt,","tekst":"Dat is, wanneer dat eten of drinken, enz., den zwakken aanstoot geeft. Zodat het onthouden van zulk eten of drinken goed is, om het vermijden van ergernis. Zie 1Co 8:13 ."}],"22":[{"catchword":"Hebt gij geloof?","tekst":"Namelijk waardoor gij weet en verzekerd zijt dat de Christenen de vrijheid hebben om allerlei spijs te eten. Zie vs.2, 14; 1Co 8:1 ."},{"catchword":"hebt dat bij uzelven","tekst":"Namelijk in uw eigen conscientie zonder het te tonen met ergernis voor de zwakke broeders."},{"catchword":"voor God","tekst":"Namelijk die evenwel weet dat gij dat geloof hebt, al toont gij het in zulker voege niet. Of, heb het alzo, dat het gebruik van dien Gode moge behagen, dien wij rekenschap zullen geven, en dien wij niet mogen vertoornen."},{"catchword":"oordeelt","tekst":"Dat is, veroordeelt, namelijk de vrijheid zo misbruikende met ergernis, dat hij daarmede verdient van de broeders gestraft en van God geoordeeld te worden."},{"catchword":"in hetgeen hij voor goed houdt","tekst":"Dat is, hetgeen hij verstaat en acht geoorloofd te zijn, als het zonder ergernis geschiedt. Grieks, in hetgeen hij beproeft."}],"23":[{"catchword":"die twijfelt,","tekst":"Dat is, die nog niet volkomen verzekerd is dat allerlei spijs nu rein en geoorloofd is."},{"catchword":"indien hij eet,","tekst":"Namelijk enige spijs in het Oude Testament verboden."},{"catchword":"is veroordeeld,","tekst":"Dat is, kwetst zijne conscientie en maakt zich schuldig aan de verdoemenis."},{"catchword":"uit het geloof niet is,","tekst":"Dat is, gedaan wordt zonder verzekerd te zijn dat het werk, hetwelk wij doen, Gode behaagt in Christus. Of, dat niet voortkomt uit een gelovig hart, zonder hetwelk noch onze werken, noch onze personen God kunnen behagen; Heb 11:6 ."}]},"kanttekeningen_en":{"1":[{"catchword":"NOW him that is weak in the faith","tekst":"That is, he that out of weakness doth not yet rightly understand the point of the abolishing of the ceremonies of the Old Testament: as they were many Jews at that time, who were converted to the Christian Religion, who because the ceremonies were instituted by God himself, and they were brought up in the same, could not then believe that they might or ought to be laid aside, and therefore took offence when the believers of the Gentiles did not observe the same. Therefore he doth not here speaks of those who out of obstinacy maintained and taught that the observation of the ceremonies was still necessary to salvation, against whom he deals in the Epistle to the Galatians"},{"catchword":"receive ye","tekst":"namely, as a brother, with all kindness, bearing the weakness in him. See Phil. V. 12.17."},{"catchword":"(but) not to contentious","tekst":"Gr. To contentious of conferences, or doubting of the thoughts, namely, they that do not bring him thereunto"},{"catchword":"conferences","tekst":"or reaspnings, disputations, i.e. that you do not too much and too eagerly dispute & strive with him thereabout, and so perplex him, and bring him to greater doubting: or that to please you, he doth nothing against his conscience."}],"2":[{"catchword":"One indeed","tekst":"Namely, that he rightly understand the Christian liberty"},{"catchword":"believeth that all things","tekst":"that is, all manner of meat that is to be eaten, without difference of clean or unclean, which was in the old Testament Levi 11.4. Deut. 14.7."},{"catchword":"may be eaten, but he that is weak","tekst":"i.e. in the faith.v.1."},{"catchword":"eateth pot-herbs","tekst":"namely, rather than the herein he would not keep the Law, i.e. contents himself with meat food which was permitted in the Law, and abstains from flesh of swine, hairs, conies, and others forbidden on the Law, Lev. 11. 5. &c."}],"3":[{"catchword":"He that eateth","tekst":"That is, he that believeth that a man may eat all manner of food, and doth so also"},{"catchword":"let him not despise him","tekst":"Gr. Let him that account him as nothing. See of this word, Mark 9.12. Luk 23:11."},{"catchword":"that eateth not :","tekst":"namely, all manner of food, because he thinketh that this is not lawful"},{"catchword":"and he that eateth not, let him not judge","tekst":"that is, condemn, namely, that he sins therein, or that therefore he is an irreligious man, or a condemner of the Law"},{"catchword":"him that eateth; for God hath received him","tekst":"that is, brought as well one as the other to the faith, and received him for one of his children in the communion of his church: and therefore he ought not be despised or condemned by men."}],"4":[{"catchword":"Who art thou","tekst":"He reproves both the weak and the strong, that they despised and condemned one another"},{"catchword":"who judges","tekst":"that is, condemns, v.3,"},{"catchword":"another servant?","tekst":"that is, thy brother, who is not thine but Gods servant. Whereby he showed that such condemning is repugnant to the Law of nature itself, according to which no man may condemn another mans servant, over whom he hath no right"},{"catchword":"He stands","tekst":"that is, if he do well"},{"catchword":"or he falleth","tekst":"that is, if he sin"},{"catchword":"to his own master:","tekst":"namely, to whom he belongs, and who only hath right to judge him; when therefore he doth not condemn him, his fellow servants ought not to condemn him"},{"catchword":"but he shall be set fast:","tekst":"that is, more and more increase and be confirmed in faith"},{"catchword":"for God is able to set him fast:","tekst":"that is, hath not only the will, for he hath received him, v.3. but also the power to strengthen him in the faith, so that you need not to or contend much with him thereabout."}],"5":[{"catchword":"The one","tekst":"Namely, the believing Jew, who doth not yet understand Christian liberty"},{"catchword":"indeed esteemed","tekst":"Gr. Judgeth, i.e. thinketh that the feast days of the old Testament must yet be observed, and that therefore one is holier then another"},{"catchword":"the one day above the (other) day: but the other","tekst":"namely, the believing Gentile, who understandeth Christian liberty"},{"catchword":"esteemed all days","tekst":"Gr. Everyday, or each day, i.e. holds that the difference of days now ceaseth, and that we are not obliged to the feast-days of the old Testament"},{"catchword":"(alike) Let every one","tekst":"namely, whether he eateth or eateth not: makes difference of days, or makes no difference"},{"catchword":"be fully assured","tekst":"namely, that in so doing sinneth not, and intendeth not to offend God, and wittingly to do contrary to his will, and that consequently he also search diligently which of the two is pleasing to God"},{"catchword":"in his own mind","tekst":"or in his own understanding."}],"6":[{"catchword":"He that taketh notice of a day","tekst":"That is, the feast days of the old testament, which the weak amongst the Jews thought must also be observed in the new Testament"},{"catchword":"he takes notice of (it) to the Lord:","tekst":"that is, intendeth nothing else but thereby to give God service and honour: So that both the weak and the strong aim at all one end and scope, and therefore must not condemn one another"},{"catchword":"he that taketh no notice of a day, he taketh no notice of (it) to the Lord, He that eateth","tekst":"namely, all kind of meat, and thinketh that this is lawful, v.2."},{"catchword":"and he that eateth not, he eateth (that) not to the Lord, and he giveth God thanks","tekst":"namely, the weak one, howsoever he thinketh some meat to be forbidden, that nevertheless God afford him wherewith may be fed with a good conscience, 1 Tim. 4.5."}],"7":[{"catchword":"For no man of us","tekst":"Namely, believing Christians, whether strong or weak"},{"catchword":"liveth to himself","tekst":"that is, must order his life not according to his own lust or profit: or as he will, seeing he is not his own, but is subject to another, namely, to the Lord, according to whose command, and for whose service he must frame his life and no man dieth to himself. [namely, as if with his death it was wholly done with him."}],"8":[{"catchword":"For whether we live, we live to the Lord","tekst":"That is, we are subject to the command of the Lord Jesus Christ, as being his proper servants, bought by his blood, and must therefore bestow our lives for his service and honour"},{"catchword":"whether we dye, we dye to the Lord","tekst":"that is, we must be ready to lay down our lives for the service and honour of our Lord, whensoever it pleaseth him: and after our death shall give an account of our doings"},{"catchword":"Therefore whether we live, or whether we dye, we are the Lords","tekst":"that is, we are Christ&acirc;&euro;&trade;s property & servants, which are subject to him, and according to his command must live and & dye."}],"9":[{"catchword":"For this purpose also Christ died","tekst":"Here he proves that Christ is our Lord; and that he got his right of dominion over us, by his death and resurrection, 1 Cor. 6.20. 1 Pet. 1.18."},{"catchword":"and rose, and became alive again, that he might have dominion both over dead and living","tekst":"that is, over all believers, as well they are that are yet alive, as those that are dead in the Lord, and that shall be raised up by him again."}],"10":[{"catchword":"But thou","tekst":"Namely, weak one"},{"catchword":"why dost thou judge","tekst":"that is, condemn v,3."},{"catchword":"thy brother?","tekst":"that is, the believing Christians, which understand and use their Christian liberty"},{"catchword":"Or thou also","tekst":"namely, strong in faith"},{"catchword":"why despiseth thou","tekst":"see v.3."},{"catchword":"thy brother?","tekst":"namely, who doth not yet understand Christian liberty, no dares to use it because of his weakness"},{"catchword":"For we shall also be set before the judgement-seat of Christ","tekst":"that is, before the judgement of God, where Christ shall sit as judge, 2 Cor. 5.10. to whom alone also belongs to judge over the consciences, and to whom we must give an account of all that we have done or omitted, v.12."}],"11":[{"catchword":"For it is written, I live","tekst":"That is, as truly as I live: manner of taking an oath which the Lord often useth, Num. 14.v.21.28. Isa. 49.18. Jer. 22.24. Ezek. 5.11. and 14.16,18. and 20.3."},{"catchword":"saith the Lord:","tekst":"that which is spoken by the Prophet of Jehovah the true God, is here ascribed to Christ, to show that he is also true God"},{"catchword":"every knee shall bow","tekst":"that is, yield reverence and obedience as to their Lord. See Phil. 2.10."},{"catchword":"before me","tekst":"namely, Christ the Son of God, and Saviour. See Eph.1.20,22. Phil. 2.10."},{"catchword":"shall confess","tekst":"or praise, thank God."}],"12":[{"catchword":"So then every one of us","tekst":"Whosoever he be, great or small, weak or strong"},{"catchword":"shall give an account","tekst":"namely, how we have carried our selves in this life. See Mat.25. 2 Co. 5.10."},{"catchword":"for himself","tekst":"that is, of his own actions and omissions, and not of another mans actions"},{"catchword":"to God","tekst":"that is, to the Lord Christ, who is true God, and shall transact the judgement of God."}],"13":[{"catchword":"Let us not therefore judge","tekst":"That is, condemn, v.4,10. namely, seeing judgement belongeth to the Lord Christ"},{"catchword":"that is, esteem and acknowledge that this is best and most seemly, namely, that ye","tekst":"namely, that are strong"},{"catchword":"give","tekst":"Gr. Put or lay"},{"catchword":"no stumbling-block or offence","tekst":"namely, that by your unreasonable use of Christian liberty, or rash condemning, he be not estranged from the Christian Religion. See 1 Cor. 8.9."},{"catchword":"to your brother","tekst":"namely, who is yet weak."}],"14":[{"catchword":"I know","tekst":"That is, although I know well"},{"catchword":"and am assured in the Lord Jesus","tekst":"that is, by the Lord Christ. See Act 10:15."},{"catchword":"that nothing","tekst":"i.e. no meat"},{"catchword":"is unclean","tekst":"Gr. Is common. See Acts10.14. namely, now in the New Testament, since the coming of Christ"},{"catchword":"in it self","tekst":"or by it self, i.e. of its own nature, Gen. 1.v31. and chap. 9.2,3. He speaks of meats to be eaten Howsoever therefore afterwards sow of them respect of Gods prohibition were unclean of time, yet now they are all to be accounted clean, forasmuch as those shadows now cease, Col. 2.16. 1 Tim.4.v.3.4."},{"catchword":"but he that esteemed any thing to be unclean","tekst":"that is, who doth not yet believe that the difference of meat now ceaseth, but thinketh that this prohibition of God must still be continued. For indifferent things are such as we esteem the same, when they may not be done or omitted without offence"},{"catchword":"to him it is unclean","tekst":"that is, he may not against his judgement eat such meat, for therein he should that which he himself holds to basin"}],"15":[{"catchword":"But if thy Brother","tekst":"That is, thy weak fellow-believer"},{"catchword":"be grieved","tekst":"namely, when he seeth that thou who art strong, eats meat which was forbidden in the old Testament, thinking that therein thou sinest against God, which grieveth the godly. Or seeing that thereby thou dost as it were despise and condemn them"},{"catchword":"because of meat","tekst":"that is, because he seeth that thou eat meat which he holds to be forbidden by God to Christians"},{"catchword":"thou walkest no more according to love","tekst":"for that grieveth or offendeth no man, but seeks to condescend to the weak to yield to them, and strengthen them in faith, 1 Cor. 13.4, &c."},{"catchword":"Destroy him not","tekst":"namely, as much as in thee is, thereby estranging him from the Christian Religion. Or if he follows thine example against his conscience, thereby wounding the same, whereby his faith is brought to danger"},{"catchword":"with thy meat","tekst":"that is, eating meat before him which he thinks to be still forbidden"},{"catchword":"for whom Christ died","tekst":"namely, to (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {

    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
