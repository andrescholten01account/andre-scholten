rechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn.","10":"Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven.","11":"En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.","12":"Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben[1].","13":"Want tot de wet was de zonde in de wereld; maar de zonde wordt niet toegerekend als er geen wet is.","14":"Maar de dood heeft geheerst van Adam tot Mozes toe, ook over hen die niet gezondigd hadden op dezelfde manier als de overtreding van Adam, die een voorbeeld is van Hem die komen zou.","15":"Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen.","16":"En het is niet zo dat de gift is zoals de schuld die er was door die ene die gezondigd heeft; want de schuld is wel uit één misdaad tot verdoemenis, maar de genadegift is uit veel misdaden tot rechtvaardigmaking.","17":"Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.","18":"Zo dan, zoals door één misdaad de schuld gekomen is over alle mensen tot verdoemenis; zo komt ook door één rechtvaardigheid de genade over alle mensen tot rechtvaardigmaking van het leven.","19":"Want zoals door de ongehoorzaamheid van die ene mens velen tot zondaars gesteld zijn geworden, zo zullen ook door de gehoorzaamheid van Één velen tot rechtvaardigen gesteld worden.","20":"Maar de wet is bovendien ingekomen, opdat de misdaad meer zou worden; en waar de zonde meer geworden is, daar is de genade veel meer overvloedig geweest;","21":"Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere."},"SV":{"1":"Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onzen Heere Jezus Christus;","2":"Door Welken wij ook de toeleiding hebben door het geloof tot deze genade, in welke wij staan, en roemen in de hoop der heerlijkheid Gods.","3":"En niet alleenlijk *dit*, maar wij roemen ook in de verdrukkingen, wetende, dat de verdrukking lijdzaamheid werkt;","4":"En de lijdzaamheid bevinding, en de bevinding hoop;","5":"En de hoop beschaamt niet, omdat de liefde Gods in onze harten uitgestort is door den Heiligen Geest, Die ons is gegeven.","6":"Want Christus, als wij nog krachteloos waren, is te Zijner tijd voor de goddelozen gestorven.","7":"Want nauwelijks zal iemand voor een rechtvaardige sterven; want voor den goede zal mogelijk iemand ook bestaan te sterven.","8":"Maar God bevestigt Zijn liefde jegens ons, dat Christus voor ons gestorven is, als wij nog zondaars waren.","9":"Veel meer dan, zijnde nu gerechtvaardigd door Zijn bloed, zullen wij door Hem behouden worden van den toorn.","10":"Want indien wij, vijanden zijnde, met God verzoend zijn door den dood Zijns Zoons, veel meer zullen wij, verzoend zijnde, behouden worden door Zijn leven.","11":"En niet alleenlijk *dit*, maar wij roemen ook in God, door onzen Heere Jezus Christus, door Welken wij nu de verzoening gekregen hebben.","12":"Daarom, gelijk door een mens de zonde in de wereld ingekomen is, en door de zonde de dood; en alzo de dood tot alle mensen doorgegaan is, in welken allen gezondigd hebben.","13":"Want tot de wet was de zonde in de wereld; maar de zonde wordt niet toegerekend, als er geen wet is.","14":"Maar de dood heeft geheerst van Adam tot Mozes toe, ook over degenen, die niet gezondigd hadden in de gelijkheid der overtreding van Adam, welke een voorbeeld is Desgenen, Die komen zou.","15":"Doch niet, gelijk de misdaad, alzo is ook de genadegift, want indien, door de misdaad van een, velen gestorven zijn, zo is veel meer de genade Gods, en de gave door de genade, die daar is van een mens Jezus Christus, overvloedig geweest over velen.","16":"En niet, gelijk *de* *schuld* *was* door den een, die gezondigd heeft, *alzo* *is* de gift; want de schuld is wel uit een *misdaad* tot verdoemenis, maar de genadegift is uit vele misdaden tot rechtvaardigmaking.","17":"Want indien door de misdaad van een de dood geheerst heeft door dien enen, veel meer zullen degenen, die den overvloed der genade en der gave der rechtvaardigheid ontvangen, in het leven heersen door dien Enen, *namelijk* Jezus Christus.","18":"Zo dan, gelijk door een misdaad *de* *schuld* *gekomen* *is* over alle mensen tot verdoemenis; alzo ook door een rechtvaardigheid *komt* *de* *genade* over alle mensen tot rechtvaardigmaking des levens.","19":"Want gelijk door de ongehoorzaamheid van dien enen mens velen *tot* zondaars gesteld zijn geworden, alzo zullen ook door de gehoorzaamheid van Enen velen *tot* rechtvaardigen gesteld worden.","20":"Maar de wet is bovendien ingekomen, opdat de misdaad te meerder worde; en waar de zonde meerder geworden is, *daar* is de genade veel meer overvloedig geweest;","21":"Opdat, gelijk de zonde geheerst heeft tot den dood, alzo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onzen Heere."},"KJV":{"1":"Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:","2":"By whom also we have access by faith into this grace wherein we stand, and rejoice in hope of the glory of God.","3":"And not only *so*, but we glory in tribulations also: knowing that tribulation worketh patience;","4":"And patience, experience; and experience, hope:","5":"And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.","6":"For when we were yet without strength, in due time Christ died for the ungodly.","7":"For scarcely for a righteous man will one die: yet peradventure for a good man some would even dare to die.","8":"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.","9":"Much more then, being now justified by his blood, we shall be saved from wrath through him.","10":"For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life.","11":"And not only *so*, but we also joy in God through our Lord Jesus Christ, by whom we have now received the atonement.","12":"Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:","13":"(For until the law sin was in the world: but sin is not imputed when there is no law.","14":"Nevertheless death reigned from Adam to Moses, even over them that had not sinned after the similitude of Adam's transgression, who is the figure of him that was to come.","15":"But not as the offence, so also *is* the free gift. For if through the offence of one many be dead, much more the grace of God, and the gift by grace, *which is* by one man, Jesus Christ, hath abounded unto many.","16":"And not as *it was* by one that sinned, *so is* the gift: for the judgment *was* by one to condemnation, but the free gift *is* of many offences unto justification.","17":"For if by one man's offence death reigned by one; much more they which receive abundance of grace and of the gift of righteousness shall reign in life by one, Jesus Christ.)","18":"Therefore as by the offence of one *judgment came* upon all men to condemnation; even so by the righteousness of one *the free gift came* upon all men unto justification of life.","19":"For as by one man's disobedience many were made sinners, so by the obedience of one shall many be made righteous.","20":"Moreover the law entered, that the offence might abound. But where sin abounded, grace did much more abound:","21":"That as sin hath reigned unto death, even so might grace reign through righteousness unto eternal life by Jesus Christ our Lord."}},"tsk":{"1":[{"kopje":"gerechtvaardigd zijnde","refs":["Rom 5:9","Rom 5:18","Rom 1:17","Rom 3:22","Rom 3:26-28","Rom 3:30","Rom 4:5","Rom 4:24","Rom 4:25","Rom 9:30","Rom 10:10","Hab 2:4","Joh 3:16-18","Joh 5:24","Hand 13:38","Hand 13:39","Gal 2:16","Gal 3:11-14","Gal 3:25","Gal 5:4-6","Fil 3:9","Jak 2:23-26"]},{"kopje":"hebben","refs":["Rom 5:10","Rom 1:7","Rom 10:15","Rom 14:17","Rom 15:13","Rom 15:33","Job 21:21","Ps 85:9-11","Ps 122:6","Jes 27:5","Jes 32:17","Jes 54:13","Jes 55:12","Jes 57:19-21","Zach 6:13","Luk 2:14","Luk 10:5","Luk 10:6","Luk 19:38","Luk 19:42","Joh 14:27","Joh 16:33","Hand 10:36","2 Kor 5:18-20","Ef 2:14-17","Kol 1:20","Kol 3:15","1 Tess 5:23","2 Tess 3:16","Hebr 13:20","Jak 2:23"]},{"kopje":"door","refs":["Rom 6:23","Joh 20:31","Ef 2:7"]}],"2":[{"kopje":"Door Wie","refs":["Joh 10:7","Joh 10:9","Joh 14:6","Hand 14:27","Ef 2:18","Ef 3:12","Hebr 10:19","Hebr 10:20","1 Petr 3:18"]},{"kopje":"waarin","refs":["Rom 5:9","Rom 5:10","Rom 8:1","Rom 8:30-39","Rom 14:4","Joh 5:24","1 Kor 15:1","Ef 6:13","1 Petr 1:4"]},{"kopje":"en roemen","refs":["Rom 5:5","Rom 8:24","Rom 12:12","Rom 15:13","Job 19:25-27","Ps 16:9-11","Ps 17:15","Spr 14:32","2 Tess 2:16","Hebr 3:6","Hebr 6:18","1 Petr 1:3-9","1 Joh 3:1-3"]},{"kopje":"de heerlijkheid","refs":["Rom 2:7","Rom 3:23","Rom 8:17","Rom 8:18","Ex 33:18-20","Ps 73:24","Matt 25:21","Joh 5:24","2 Kor 3:18","2 Kor 4:17","Openb 3:21","Openb 21:3","Openb 21:11","Openb 21:23","Openb 22:4","Openb 22:5"]}],"3":[{"kopje":"maar wij","refs":["Rom 8:35-37","Matt 5:10-12","Luk 6:22","Luk 6:23","Hand 5:41","2 Kor 11:23-30","2 Kor 12:9","2 Kor 12:10","Ef 3:13","Fil 1:29","Fil 2:17","Fil 2:18","Jak 1:2","Jak 1:3","Jak 1:12","1 Petr 3:14","1 Petr 4:16","1 Pe pan> did much more abound:","21":"<span class=\"wl wl-kjv\" data-code=\"G2443\">That</span> <span class=\"wl wl-kjv\" data-code=\"G5618\">as</span> <span class=\"wl wl-kjv\" data-code=\"G266\">sin</span> hath <span class=\"wl wl-kjv\" data-code=\"G936\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G2288\">death,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">even</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> <span class=\"wl wl-kjv\" data-code=\"G936\">might</span> <span class=\"wl wl-kjv\" data-code=\"G5485\">grace</span> <span class=\"wl wl-kjv\" data-code=\"G936\">reign</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">through</span> <span class=\"wl wl-kjv\" data-code=\"G1343\">righteousness</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G166\">eternal</span> <span class=\"wl wl-kjv\" data-code=\"G2222\">life</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> Lord."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"vrede bij God,","tekst":"Dat is, vriendschap Gods, daar wij tevoren zijne vijanden waren, vs.8, 10, en de verzekerdheid daarvan in ons gemoed, waardoor wij in God worden gerust gesteld; Joh 16:33 ; Rom 14:17 ."}],"2":[{"catchword":"toeleiding hebben","tekst":"Of, toegang tot deze genade; waardoor te kennen gegeven wordt, dat wij tot deze genade vanzelf niet zijn gegaan, maar dat wij van Christus door Zijnen Geest daartoe zijn geleid; Eph 2:8 ; Heb 8:10 ."},{"catchword":"tot deze genade,","tekst":"Dat is, tot dezen staat der vriendschap en vrede met God. Waaruit ook voortkomt dat wij met vrijmoedigheid tot Hem gaan en Hem durven aanroepen als een Vader; Eph 2:18 , en Eph 3:12 ; Heb 4:16 ."},{"catchword":"in de hoop","tekst":"Of, op de hoop; dat is lijdzame verwachting door Christus."},{"catchword":"der heerlijkheid Gods","tekst":"Namelijk die namaals in ons zal geopenbaard worden; Rom 8:18 ."}],"3":[{"catchword":"wij roemen ook in de verdrukkingen,","tekst":"Dat is, wij verheugen ons zelfs daarin, en trotsen tegen dezelve om de verzekerdheid, die wij hebben van de goede uitkomst van die; Rom 8:34 , enz."},{"catchword":"lijdzaamheid werkt;","tekst":"Niet dat de verdrukking dat doet door hare natuur, maar omdat Christus de gelovigen door Zijnen Geest daartegen sterkt; Joh 16:33 ; Rom 8:37 ."}],"4":[{"catchword":"bevinding,","tekst":"Of, ervaring, of beproeving; namelijk van Christus' hulp en trouw in het volbrengen van Zijne belofte, waarmede Hij ons heeft beloofd in zulke zwarigheid bij te staan; Joh 14:17-18 ; 2Co 1:5-6 ."},{"catchword":"hoop;","tekst":"Namelijk, dat ook de vervulling van alle andere beloften, en inzonderheid van de eeuwige zaligheid, daarop volgen zal, gelijk wij de vervulling van deze belofte hierin bevinden en gevoelen."}],"5":[{"catchword":"beschaamt niet,","tekst":"Dat is, mist en bedriegt niet. Want als wij iets verwachten, of tot roemens toe hopen, dat wij daarna missen, zo worden wij daarover bij onszelven bedroefd en bij anderen beschaamd."},{"catchword":"de liefde Gods","tekst":"Namelijk waarmede Hij onsin Christus Jezus liefheeft, gelijk uitgedrukt wordt vs.8, hetwelk ons in den tijd van verdrukking meest troost en versterkt; Rom 8:38-39 ."},{"catchword":"uitgestort is","tekst":"Dat is, overvloedig betuigd; Rom 8:16 ."},{"catchword":"Die ons is gegeven","tekst":"Namelijk tot een vertrooster in ons gemoed, en een onderpand van onze erve; Joh 14:16-17 ; 2Co 1:22 ; Eph 1:13 . En dit is het eerste fondament, waarom de hoop niet beschaamt, omdat de Heilige Geest hierin niet kan liegen."}],"6":[{"catchword":"Christus,","tekst":"Dit is het andere fondament onzer hoop, de verzekerdheid der liefde van Christus jegens ons, die ons met God verzoend heeft toen wij nog vreemd van Hem waren, veel meer dan ons behouden zal, nadat wij nu Zijne vrienden door het geloof geworden zijn."},{"catchword":"krachteloos waren,","tekst":"Of, onmachtig; namelijk om onszelven te verlossen, als overwonnen van de zonde gelijk van ene dodelijke ziekte."},{"catchword":"te Zijner tijd","tekst":"Of, ter rechter, of bekwamer tijd; dat is, in den tijd van God bestemd; Gal 4:4 ."},{"catchword":"de goddelozen gestorven","tekst":"Dat is, die in zichzelven zondaars waren, en door hunne zonden Gods toorn meer en meer over zich verwekten."}],"7":[{"catchword":"den goede zal","tekst":"Of, nuttigen; dat is, die Hem of anderen dienstig en nuttig is."},{"catchword":"mogelijk","tekst":"Dit zegt de apostel, omdat inzonderheid in de Romeinse geschiedenis, hoewel zeer weinige, nochtans enige worden gevonden, die zich in den dood hebben begeven om hunne vrienden en medeburgers te verlossen van zwarigheid; maar niemand van die is voor zijne vijanden gestorven, gelijk Christus gedaan heeft."},{"catchword":"bestaan te sterven","tekst":"Grieks durven."}],"8":[{"catchword":"bevestigt","tekst":"Of, recommandeert, aanprijst."},{"catchword":"nog zondaars waren","tekst":"Dat is, als de zonde over ons nog hare heerschappij had; Joh 9:31 ; Rom 6:17 , Rom 6:19-20 ."}],"9":[{"catchword":"door Zijn bloed,","tekst":"Grieks in zijn bloed; dat is, door Zijne gehoorzaamheid tot den dood des kruises, Phi 2:8 , welke is de bewegende oorzaak, waarom ons God rechtvaardigt en waar het geloof op steunt; Rom 3:25 ."},{"catchword":"van den toorn","tekst":"Dat is, van de straf des toekomenden oordeels, 1Th 1:10 , hetwelk ook de dag des toorns genaamd wordt; Rom 2:5 ."}],"10":[{"catchword":"vijanden zijnde,","tekst":"Namelijk om de zonde die in ons was, welke God haat; en vijandschap is tegen God; Rom 8:7 . Anderszins heeft hij gezegd dat God ons liefgehad heeft toen wij nog zondaars waren, vs.8; namelijk ten aanzien, dat wij van Hem uitverkoren en van Christus om te verlossen gegeven waren; Joh 17:2 ,Joh 17:6; Rom 9:13 ."},{"catchword":"door Zijn leven","tekst":"Grieks in zijn leven; dat is, door Hem die nu leeft en zit ter rechterhand Gods, aldaar voor ons bidt, en alle dingen Zich heeft onderworpen; Rom 8:34 ; Eph 1:20-22 , enz.; Heb 9:24 ."}],"11":[{"catchword":"wij roemen ook in God,","tekst":"Namelijk hiervan, dat wij, nu verzoend zijnde, ook zullen behouden worden van den toekomenden toorn, vs.9-10, en dat God onze God is en eeuwiglijk zal blijven."}],"12":[{"catchword":"Daarom, gelijk door","tekst":"In de volgende verzen verklaart de apostel hoe wij door Christus gerechtvaardigd zijn, met ene tegenstelling van Adam en zijne ongehoorzaamheid, door welke de dood doorgedrongen is over alle mensen, vs.12-14, en daarna hoe Christus' gehoorzaamheid ons daarentegen tot rechtvaardigheid sterkt, vs.15-19, door Gods toerekening. En dat het daarom niet ongerijmd is, dat wij allen door eens mensen gehoorzaamheid gerechtvaardigd worden, alzo wij allen door eens mensen ongehoorzaamheid tot zondaars gesteld zijn."},{"catchword":"een mens","tekst":"Namelijk Adam, 1Co 15:21 , waaronder ook Eva begrepen is, alzo deze twee een vlees waren en een algemene stam van het gehele menselijk geslacht; Eph 5:31 ; 1Ti 2:14 ."},{"catchword":"in welken allen","tekst":"Namelijk enen mens, gelijk dit Griekse woord epi voor in, ook elders wordt genomen, Mar 2:4 ; Heb 9:17 , enz., en dit woord in van Paulus ook over deze zaak gebruikt wordt; 1Co 15:22 . Of, voorzoveel, of omdat zij allen gezondigd hebben; en dat brengt ook noodzakelijk denzelfden zin mede, want alle mensen die sterven, hebben in zichzelven geen dadelijke zonden begaan, gelijk blijkt in de onmondige kinderen, van wie velen sterven in hunne onmondigheid, en derhalve moeten gezondigd hebben in dezen eenen mens, in wiens lenden zij waren; gelijk Levi gezegd wordt tienden gegeven te hebben, zijnde in de lenden van Abraham; Heb 7:9 . Zie hiervan breder verklaring in de volgende verzen, en Job 14:4 ; Psa 51:7 ; Joh 3:5-6 ; Eph 2:3 , enz."},{"catchword":"gezondigd hebben","tekst":"Namelijk alzo is ook door enen mens Jezus Christus de gerechtigheid en het leven over alle gelovigen gekomen. Gelijk Paulus besluit vs.18,19."}],"13":[{"catchword":"tot de wet","tekst":"Namelijk van Mozes gegeven."},{"catchword":"was de zonde in de wereld;","tekst":"Dat is, was ook in de wereld, gelijk uit den dood blijkt, vs.14, die de bezolding der zonde is; Rom 6:23 ."},{"catchword":"niet toegerekend,","tekst":"Dat is, niet voor zonde gehouden, of gerekend."},{"catchword":"als er geen wet is","tekst":"Waaruit de apostel besluiten wil dat er dan een andere wet is geweest, door welker overtreding alle mensen ook in dien tijd zondaars geweest zijn; en dat niet alleen de wet der natuur, die de onmondige kinderen niet hebben overtreden, maar de wet, die God aan den eersten mens had gegeven, wiens overtreding aan allen, ook zelfs aan de onmondige kinderen, is toegerekend, gelijk vs.14 medebrengt."}],"14":[{"catchword":"de dood","tekst":"Namelijk niet alleen de geestelijke en eeuwige dood, maar ook de lichamelijke, van welken hij in dit vs. inzonderheid spreekt, omdat die voorallen blijkelijk was; Rom 8:10 ; 1Co 15:22 ."},{"catchword":"die niet gezondigd hadden","tekst":"Dat is, de onmondige kinderen, die nog geen dadelijke zonden tegen de wet Gods hebben begaan, gelijk Adam en alle volwassenen na hem gedaan hebben, en die evenwel sterven. Waaruit dan blijkt dat zij met de erfzonde besmet zijn."},{"catchword":"een voorbeeld is","tekst":"Dat is, een gelijk exemplaar, namelijk dat gelijk Adam, degenen die van hem natuurlijkerwijze geboren zijn, in hem en door hem tot zondaars gesteld heeft, alzo ook Christus alle die door Hem overnatuurlijker wijze herboren worden, in Hem en door Hem tot rechtvaardigen stelt, gelijk de volgende verklaring bewijst."},{"catchword":"Desgenen,","tekst":"Dat is, van Christus des beloofden zaads, dat den Satan den kop zou vertreden, Gen 3:15 , op welke belofte de apostel hier schijnt te zien. Want aldaar wordt de tweede Adam beloofd, zo haast de eerst was gevallen."}],"15":[{"catchword":"de misdaad,","tekst":"Of, val, afval; dat is, de zonde Adams, die in dit hoofdstuk meermalen met dit woord genaamd wordt."},{"catchword":"de genadegift,","tekst":"Dat is, weldaad, die ons door Christus is verkregen en wordt geschonken."},{"catchword":"velen gestorven zijn,","tekst":"Dat is, niet alleen hij zelf, maar vele anderen, namelijk allen, die van Hem naar de natuur gekomen zijn."},{"catchword":"de genade Gods,","tekst":"Dat is, de barmhartigheid en onverdiende gunst Gods."},{"catchword":"de gave door de genade,","tekst":"Dat is, de gerechtigheid van Christus, die ons van God uit genade door het geloof wordt toegerekend."},{"catchword":"overvloedig geweest","tekst":"Dat is, krachtiger en menigvuldiger; ene gelijkenis genomen van het water, dat het vuur door Zijne kracht of Zijne vloed uitblust, dat alzo ook de kracht en overvloed van Christus' gerechtigheid de zonde en schuld uitblust."},{"catchword":"over velen","tekst":"Dat is, allen die Hem door het geloof worden ingelijfd."}],"16":[{"catchword":"den een,","tekst":"Namelijk Adam, gelijk voren."},{"catchword":"de schuld is wel uit een","tekst":"Of, oordeel, dat is, schuld, gelijk 1Ti 5:12 . Namelijk waardoor wij om de zonde voor Gods oordeel den tijdelijken en eeuwigen dood schuldig zijn, gelijk uit het volgende blijkt."},{"catchword":"verdoemenis,","tekst":"Namelijk voor degenen, die door het geloof in Christus van dezen verdoemelijken staat niet verlost worden."},{"catchword":"vele misdaden","tekst":"Namelijk dergenen, die deze algemene zonde met vele bijzondere zonden hebben verzwaard, gelijk alle mensen doen, die tot hunne jaren gekomen zijn."}],"17":[{"catchword":"dien enen,","tekst":"Namelijk eersten Adam, gelijk voren."},{"catchword":"ontvangen,","tekst":"Of, aannemen, namelijk door het waar geloof; Joh 1:12 ."},{"catchword":"in het leven heersen","tekst":"Dat is, dezes geestelijken levens deelachtig zijnde, de overhand hebben over de zonde en schuld derzelve, Gal 2:19-20 ; Eph 2:5-6 , en hierna des eeuwigen levens deelachtig worden, gelijk vs.21 nader verklaard wordt."}],"18":[{"catchword":"tot verdoemenis;","tekst":"Dat is, hen in zulken staat gebracht, waarin zij voor God verdoemelijk zijn; Rom 3:19 ; Eph 2:1 , Eph 2:3 ."},{"catchword":"rechtvaardigheid","tekst":"Grieks dikajoma. Alzo noemt hij de gehoorzaamheid van Christus, omdat zij de kracht heeft om ook anderen te rechtvaardigen, gelijk het Griekse woord hier medebrengt; en wordt gesteld tegen de overtreding van Adam, in welke ook de kracht was om anderen tot zondaars te maken, vs.19."},{"catchword":"over alle mensen","tekst":"Namelijk die in Hem geloven; of die deze gave aannemen, vs.17."}],"19":[{"catchword":"Want gelijk door de ongehoorzaamheid","tekst":"Hier besluit de apostel de gelijkenis van Adam en Christus; namelijk dat, gelijk de ongehoorzaamheid van Adam ons toegerekend wordt tot schuld der verdoemenis, alzo Christus' gehoorzaamheid ons toegerekend wordt tot ontslaging van die schuld. Het is wel waar dat gelijk wij door Adams eerste misdaad niet alleen schuldig zijn geworden aan dezelve en aan de straf van dien, maar ook onze natuur daardoor verdorven is geworden, dat alzo wij door Christus' gehoorzaamheid niet alleen van de straf verlost zijn, maar ook door de kracht derzelve van Zijnen Geest in ons gemoed vernieuwd en geheiligd worden; doch daarvan heeft de apostel tot nog toe niet gesproken, maar begint daarvan te spreken in het volgende. En deze vernieuwing is in dit leven ook geheel onvolmaakt, gelijk hij met zijn eigen voorbeeld zal bewijzen in Rom 7 , zodat wij daardoor voor God niet rechtvaardig kunnen gesteld worden."}],"20":[{"catchword":"Maar de wet","tekst":"Hier beantwoordt de apostel deze tegenwerping: Indien wij door de gerechtigheid van Christus alleen tot rechtvaardigen gesteld worden, waartoe is dan de wet den Israëlieten door Mozes gegeven; en verklaart dat de wet // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
