-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees?","2":"Want als Abraham uit de werken gerechtvaardigd is, dan heeft hij roem, maar niet bij God.","3":"Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.","4":"Nu wordt hem die werkt het loon niet toegerekend naar genade, maar naar schuld.","5":"Doch hem die niet werkt, maar gelooft in Hem, Die de goddeloze rechtvaardigt, wordt zijn geloof gerekend tot rechtvaardigheid.","6":"Zoals ook David de mens gelukkig noemt, aan wie God de rechtvaardigheid toerekent zonder werken:","7":"En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;","8":"Gelukkig is de man, aan wie de Heere de zonden niet toerekent.","9":"Deze gelukkigverklaring dan, is die *alleen* over de besnijdenis, of ook over de voorhuid? Want wij zeggen dat het geloof aan Abraham gerekend is tot rechtvaardigheid.","10":"Hoe is het *hem* dan toegerekend? Toen hij besneden was, of onbesneden? Niet toen hij besneden was, maar toen hij onbesneden was.","11":"En hij heeft het teken van de besnijdenis ontvangen *als* een zegel van de rechtvaardigheid van het geloof, die hem *toegerekend was* toen hij nog onbesneden *was*: opdat hij een vader zou zijn van allen die geloven terwijl zij onbesneden zijn, opdat ook hun de rechtvaardigheid toegerekend wordt;","12":"En een vader van de besnijdenis, namelijk van hen die niet alleen uit de besnijdenis zijn, maar die ook wandelen in de voetstappen van het geloof van onze vader Abraham, dat hij had toen hij nog onbesneden was.","13":"Want de belofte is niet door de wet aan Abraham of zijn nageslacht gebeurd, namelijk dat hij een erfgenaam van de wereld zou zijn, maar door de rechtvaardigheid van het geloof.","14":"Want als zij die uit de wet zijn erfgenamen zijn, dan is het geloof zinloos geworden, en de belofte tenietgedaan.","15":"Want de wet werkt toorn; want waar geen wet is, daar is ook geen overtreding.","16":"Daarom is zij uit het geloof, opdat zij naar genade is; opdat de belofte vaststaat voor heel het nageslacht, niet alleen voor wie uit de wet is, maar ook voor wie uit het geloof van Abraham is, die een vader is van ons allen;","17":"(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;","18":"Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.","19":"En niet verzwakt in het geloof, heeft hij zijn eigen lichaam niet aangemerkt, dat al verstorven was, omdat hij ongeveer honderd jaar oud was, *noch* ook dat de moederschoot van Sara verstorven was.","20":"En hij heeft aan de belofte van God niet getwijfeld door ongeloof; maar is gesterkt geweest in het geloof, en heeft God de eer gegeven;","21":"En was ten volle verzekerd, dat wat beloofd was, Hij ook machtig was te doen.","22":"Daarom is het hem ook tot rechtvaardigheid gerekend.","23":"Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;","24":"Maar ook om onzentwil, aan wie het zal toegerekend worden, namelijk aan hen die geloven in Hem, Die Jezus, onze Heere, uit de doden opgewekt heeft;","25":"Die overgeleverd is om onze zonden, en opgewekt om onze rechtvaardigmaking."},"SV":{"1":"Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees?","2":"Want indien Abraham uit de werken gerechtvaardigd is, zo heeft hij roem, maar niet bij God.","3":"Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.","4":"Nu dengene, die werkt, wordt het loon niet toegerekend naar genade, maar naar schuld.","5":"Doch dengene, die niet werkt, maar gelooft in Hem, Die den goddeloze rechtvaardigt, wordt zijn geloof gerekend tot rechtvaardigheid.","6":"Gelijk ook David den mens zalig spreekt, welken God de rechtvaardigheid toerekent zonder werken;","7":"*Zeggende*: Zalig zijn zij, welker ongerechtigheden vergeven zijn, en welker zonden bedekt zijn;","8":"Zalig is de man, welken de Heere de zonden niet toerekent.","9":"Deze zaligspreking dan, is die *alleen* over de besnijdenis, of ook over de voorhuid? Want wij zeggen, dat Abraham het geloof gerekend is tot rechtvaardigheid.","10":"Hoe is het *hem* dan toegerekend? Als hij in de besnijdenis was, of in de voorhuid? Niet in de besnijdenis, maar in de voorhuid.","11":"En hij heeft het teken der besnijdenis ontvangen *tot* een zegel der rechtvaardigheid des geloofs, die *hem* in de voorhuid *was* *toegerekend*: opdat hij zou zijn een vader van allen, die geloven in de voorhuid zijnde, ten einde ook hun de rechtvaardigheid toegerekend worde;","12":"En een vader der besnijdenis, dengenen *namelijk*, die niet alleen uit de besnijdenis zijn, maar die ook wandelen in de voetstappen des geloofs van onzen vader Abraham, hetwelk in de voorhuid was.","13":"Want de belofte *is* niet door de wet aan Abraham of zijn zaad *geschied*, namelijk, dat hij een erfgenaam der wereld zou zijn, maar door de rechtvaardigheid des geloofs.","14":"Want indien degenen, die uit de wet zijn, erfgenamen zijn, zo is het geloof ijdel geworden, en de beloftenis te niet gedaan.","15":"Want de wet werkt toorn; want waar geen wet is, *daar* is ook geen overtreding.","16":"Daarom is zij uit het geloof, opdat zij naar genade zij; ten einde de belofte vast zij al den zade, niet alleen dat uit de wet is, maar ook dat uit het geloof Abrahams is, welke een vader is van ons allen;","17":"( Gelijk geschreven staat: Ik heb u tot een vader van vele volken gesteld) voor Hem, aan Welken hij geloofd heeft, *namelijk* God, Die de doden levend maakt, en roept de dingen, die niet zijn, alsof zij waren;","18":"Welke tegen hoop op hoop geloofd heeft, dat hij zou worden een vader van vele volken; volgens hetgeen gezegd was: Alzo zal uw zaad wezen.","19":"En niet verzwakt zijnde in het geloof, heeft hij zijn eigen lichaam niet aangemerkt, dat alrede verstorven was, alzo hij omtrent honderd jaren oud was, *noch* ook dat de moeder in Sara verstorven was.","20":"En hij heeft aan de beloftenis Gods niet getwijfeld door ongeloof; maar is gesterkt geweest in het geloof, gevende God de eer;","21":"En ten volle verzekerd zijnde, dat hetgeen beloofd was, Hij ook machtig was te doen.","22":"Daarom is het hem ook tot rechtvaardigheid gerekend.","23":"Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;","24":"Maar ook om onzentwil, welken het zal toegerekend worden, *namelijk* dengenen, die geloven in Hem, Die Jezus, onzen Heere, uit de doden opgewekt heeft;","25":"Welke overgeleverd is om onze zonden, en opgewekt om onze rechtvaardigmaking."},"KJV":{"1":"What shall we say then that Abraham our father, as pertaining to the flesh, hath found?","2":"For if Abraham were justified by works, he hath *whereof* to glory; but not before God.","3":"For what saith the scripture? Abraham believed God, and it was counted unto him for righteousness.","4":"Now to him that worketh is the reward not reckoned of grace, but of debt.","5":"But to him that worketh not, but believeth on him that justifieth the ungodly, his faith is counted for righteousness.","6":"Even as David also describeth the blessedness of the man, unto whom God imputeth righteousness without works,","7":"*Saying*, Blessed *are* they whose iniquities are forgiven, and whose sins are covered.","8":"Blessed *is* the man to whom the Lord will not impute sin.","9":"*Cometh* this blessedness then upon the circumcision *only*, or upon the uncircumcision also? for we say that faith was reckoned to Abraham for righteousness.","10":"How was it then reckoned? when he was in circumcision, or in uncircumcision? Not in circumcision, but in uncircumcision.","11":"And he received the sign of circumcision, a seal of the righteousness of the faith which *he had yet* being uncircumcised: that he might be the father of all them that believe, though they be not circumcised; that righteousness might be imputed unto them also:","12":"And the father of circumcision to them who are not of the circumcision only, but who also walk in the steps of that faith of our father Abraham, which *he had* being *yet* uncircumcised.","13":"For the promise, that he should be the heir of the world, *was* not to Abraham, or to his seed, through the law, but through the righteousness of faith.","14":"For if they which are of the law *be* heirs, faith is made void, and the promise made of none effect:","15":"Because the law worketh wrath: for where no law is, *there is* no transgression.","16":"Therefore *it is* of faith, that *it might be* by grace; to the end the promise might be sure to all the seed; not to that only which is of the law, but to that also which is of the faith of Abraham; who is the father of us all,","17":"(As it is written, I have made thee a father of many nations,) before him whom he believed, *even* God, who quickeneth the dead, and calleth those things which be not as though they were.","18":"Who against hope believed in hope, that he might become the father of many nations, according to that which was spoken, So shall thy seed be.","19":"And being not weak in faith, he considered not his own body now dead, when he was about an hundred years old, neither yet the deadness of Sara's womb:","20":"He staggered not at the promise of God through unbelief; but was strong in faith, giving glory to God;","21":"And being fully persuaded that, what he had promised, he was able also to perform.","22":"And therefore it was imputed to him for righteousness.","23":"Now it was not written for his sake alone, that it was imputed to him;","24":"But for us also, to whom it shall be imputed, if we believe on him that raised up Jesus our Lord from the dead;","25":"Who was delivered for our offences, and was raised again for our justification."}},"tsk":{"1":[{"kopje":"wat","refs":["Rom 6:1","Rom 7:7","Rom 8:31"]},{"kopje":"Abraham","refs":["Jes 51:2","Matt 3:9","Luk 3:8","Luk 16:24","Luk 16:25","Luk 16:29-31","Joh 8:33","Joh 8:37-41","Joh 8:53","Joh 8:56","Hand 13:26","2 Kor 11:22"]},{"kopje":"naar het vlees","refs":["Rom 4:16","Hebr 12:9"]}],"2":[{"kopje":"Abraham","refs":["Rom 3:20-28","Fil 3:9"]},{"kopje":"heeft hij","refs":["Rom 3:27","Rom 15:17","Ezech 8:9","Jer 9:23","Jer 9:24","1 Kor 9:16","2 Kor 5:12","2 Kor 11:12","2 Kor 11:30","2 Kor 12:1-9","Gal 6:13","Gal 6:14","Ef 2:9"]},{"kopje":"maar","refs":["Gen 12:12","Gen 12:13","Gen 12:18","Gen 12:20","Gen 20:9-13","Joz 24:2","1 Kor 1:29","1 Kor 4:7","Gal 3:22"]}],"3":[{"kopje":"wat","refs":["Rom 9:17","Rom 10:11","Rom 11:2","Jes 8:20","Mark 12:10","Jak 4:5","2 Petr 1:20","2 Petr 1:21"]},{"kopje":"Abraham","refs":["Gen 15:6","Gal 3:6-8","Jak 2:23"]},{"kopje":"gerekend","refs":["Rom 4:5","Rom 4:9","Rom 4:11","Rom 4:22-25","Ps 106:31"]}],"5":[{"kopje":"Doch hem","refs chword":"roem,","tekst":"Dat is, oorzaak om te roemen."},{"catchword":"niet bij God","tekst":"Namelijk heeft hij oorzaak om te roemen. Waaruit dan noodzakelijk volgt, dat hij uit de werken voor God niet is gerechtvaardigd; hetwelk hij daarna breder bewijst."}],"3":[{"catchword":"geloofde God,","tekst":"Dat is, de beloften Gods van Hem een schild en groot loon te zullen zijn, en van Hem een erfgenaam te geven, en Zijn zaad te vermenigvuldigen, Gen 15:1 , Gen 15:4-6 , waardoor niet alleen een vleselijk zaad, maar inzonderheid Christus verstaan wordt, de zoon Abrahams, in welken alle geslachten der aarde zouden gezegend worden. Zie hierna vs.11-13, gelijk ook Paulus verklaart Gal 3:16 . Zie ook Joh 8:56 ."},{"catchword":"het is hem gerekend","tekst":"De Hebreeuwse tekst Gen 15:6 zegt: en Hij, namelijk God, heeft het hem gerekend. Doch het is enerlei zijn, waardoor verstaan wordt dat God hem de gerechtigheid, die hij in zichzelven niet had, door het geloof op het beloofde zaad uit genade heeft geschonken."}],"4":[{"catchword":"die werkt,","tekst":"Namelijk met mening van door zijn werk de rechtvaardigheid te verkrijgen of te verdienen."},{"catchword":"naar schuld","tekst":"Namelijk wordt gegeven; want geven naar schuld en toerekenen uit genade worden hier tegen elkander gesteld als tegen elkander strijdende."}],"5":[{"catchword":"die niet werkt,","tekst":"Dat is, die zulke werken van verdienste niet kan noch durft tevoorschijn brengen."},{"catchword":"gelooft in Hem,","tekst":"Dat is, stelt zijn vertrouwen op de genade Gods in Christus, vs.24,25."},{"catchword":"den goddeloze rechtvaardigt,","tekst":"Dat is, die in zichzelven nog onrein en met zonden besmet is, gelijk alle mensen, zelfs ook de wedergeborenen, voor God zijn, naar de getuigenis van David in de volgende verzen."},{"catchword":"zijn geloof","tekst":"Niet dat het geloof, ten aanzien dat het een werk is, dit verdient, of in zichzelven waardig is, gelijk enigen verkeerdelijk menen; want dit heeft Paulus terstond tevoren aan alle werken, en derhalve ook aan het geloof als een werk, benomen; maar omdat God zulks uit enkele genade den gelovigen beloofd heeft, en omdat het geloof als een middel is, hetwelk de gerechtigheid van Christus aanneemt, en dezelve tussen Gods oordeel en zijn eigen misdaden stelt. Zie Rom 5:9 ; 2Co 5:19 ; Phi 3:9 ."},{"catchword":"gerekend tot rechtvaardigheid","tekst":"Het woord rekenen, of toerekenen, wordt genomen van ene gelijkenis dergenen, die iets op iemand rekening stellen; Phm 1:18 . Zo wordt God gezegd iemand de zonde toe te rekenen, als Hij wil dat voor dezelve van hem door de straf zal voldaan worden; en niet toe te rekenen als Hij die vergeeft en de straf kwijtscheldt, vs.8. Desgelijks dat Hij het geloof rekent tot rechtvaardigheid als Hij den gelovigen schenkt, toeschrijft en toerekent de gerechtigheid van Christus, van hen door het geloof aangenomen, en houdt, door deze genadige toerekening, alsof het hun eigen gerechtigheid ware. Daarom wordt ook hier gezegd dat hun de gerechtigheid toegerekend wordt."}],"6":[{"catchword":"den mens zalig spreekt,","tekst":"Grieks de zaligspreking des mensen zegt."}],"7":[{"catchword":"Zeggende","tekst":"Namelijk in het begin van Psa 32 , welk bewijs van Paulus onwedersprekelijk is. Want die uit Zijne werken gerechtvaardigd is, die heeft gene vergeving der zonden van node om gelukzalig te zijn; en wie bidt dat God hem zijne zonden niet toerekene, die bidt ook dat God hem de rechtvaardigheid van Jezus Christus toerekene, alzo deze twee dingen in Gods oordeel niet kunnen gescheiden worden. Zie Rom 3:24 , en Rom 5:19 ; Eph 1:7 , enz."}],"9":[{"catchword":"zaligspreking dan,","tekst":"Of, zaligmaking; waaruit blijkt dat het woord zaligspreken, of zaligmaken, hier van David genomen wordt voor hetzelfde, dat de Schriftuur, Gen 15:6 , van Abraham de toerekening der rechtvaardigheid noemt. De reden is, omdat de grond onzer zaligheid gelegen is in de vergeving der zonden en toerekening der gerechtigheid van Christus."}],"10":[{"catchword":"Als hij in de besnijdenis was,","tekst":"Dat is, is het hem toegerekend als hij alrede besneden was?"},{"catchword":"in de voorhuid?","tekst":"Dat is toen hij nog niet besneden was. Want deze belofte, waar het geloof van Abraham op zag, is wel veertien jaren tevoren geschied, eer Abraham besneden werd; alzo Abraham nog gene hoop van kinderen had, toen deze belofte is gedaan, Gen 15:2 , en Ismaël nu dertien jaren oud was als Abraham negen en negentig jaren oud zijnde, besneden is geworden; Gen 17:24-25 ."}],"11":[{"catchword":"het teken der besnijdenis","tekst":"Dat is, de besnijdenis tot een teken en zegel, dat is verzegeling en versterking, van dat hij door het geloof gerechtvaardigd was; in welke woorden de natuur en eigenschap van alle sacramenten kortelijk wordt aangewezen, gelijk ook Gen 17:11 ; Exo 12:13 ; Eze 20:12 . Namelijk dat zij dienen om het geloof niet eerst te werken, maar te verzegelen en te versterken, en daarom niet blote tekenen, maar ook zegelen zijn."},{"catchword":"een vader van allen,","tekst":"Namelijk naar welks voorbeeld of voetstappen God wil dat zowel heidenen als Joden door het geloof gerechtvaardigd zouden worden."}],"13":[{"catchword":"door de wet aan Abraham","tekst":"Dat is, door de onderhouding der wet. Hier brengt Paulus nog een andere reden voort om te bewijzen dat Abraham niet is gerechtvaardigd uit de werken; want anders zou de belofte aan Abraham gedaan, namelijk dat hij met zijn zaad een erfgenaam der wereld zou zijn, tevergeefs gegeven wezen. Want de wet werkt toorn en geeft de erve niet, omdat zij door het vlees verzwakt is; Rom 8:3 ."},{"catchword":"een erfgenaam der wereld zou zijn,","tekst":"Hier wordt gezien òf op de belofte aan Abraham gedaan, op denzelfden tijd als deze getuigenis van zijne rechtvaardigheid uit het geloof is gegeven; Gen 16:6-8 ; namelijk van de bezitting van het land Kanaän, hetwelk een voorbeeld was van de eeuwige rust der gelovigen in den hemel, waarvan de apostel hier spreekt, Heb 4:3 , en Heb 11:9-10 ; òf op een andere belofte, die uitgedrukt staat Gen 22:17-18 , nadat hij zijnen zoon heeft willen opofferen, namelijk dat alle geslachten der aarde in zijn zaad zullen gezegend worden. Want Abraham, als een vader aller gelovigen, is van God in de erve van de geestelijke wereld gesteld, waarvan al zijn geestelijke kinderen, de gelovigen ook hun deel door Christus, het beloofde zaad, zullen ontvangen; Psa 2:8 ; Heb 2:5 ."}],"14":[{"catchword":"die uit de wet zijn,","tekst":"Dat is, die door de werken of onderhouding der wet willen gerechtvaardigd worden."},{"catchword":"erfgenamen zijn,","tekst":"Namelijk van deze geestelijke wereld vs.13."},{"catchword":"ijdel geworden,","tekst":"Dat is, onnodig, tevergeefs."},{"catchword":"te niet gedaan","tekst":"Dat is, zonder kracht of vrucht."}],"15":[{"catchword":"werkt toorn;","tekst":"Dat is, openbaart Gods toorn tegen de overtreding derzelve door hare dreigementen van straffen, en vermeerdert de zonde door de verkeerdheid van de natuur der mensen; Rom 7:8 ."},{"catchword":"geen wet is,","tekst":"Namelijk noch in de natuur ingeschreven, noch van God gegeven, gelijk tevoren is bewezen."},{"catchword":"geen overtreding","tekst":"Namelijk die bekend en gestraft kan worden."}],"16":[{"catchword":"is zij","tekst":"Namelijk de belofte van deze erfenis."},{"catchword":"uit het geloof,","tekst":"Dat is, onder voorwaarde van het geloof van God gedaan of gegeven."},{"catchword":"naar genade zij;","tekst":"Want geloof en genade gaan altijd tezamen, en het geloof steunt op de onveranderlijke genade Gods, niet op de werken of op zichzelven, vs.5; Eph 2:8 ."},{"catchword":"vast zij al den zade,","tekst":"Want wij kunnen van de erve verzekerd worden alleen door het geloof, en niet door de werken der wet, dewijl niemand de wet onderhoudt, gelijk tevoren bewezen is. Zie ook Gal 3:16 , Gal 3:18 ."},{"catchword":"uit de wet is,","tekst":"Dat is, uit de Joden, wien de wet gegeven was. Want dat niemand uit de werken der wet een erfgenaam kan worden, is in vs.14 geleerd."},{"catchword":"uit het geloof Abrahams is,","tekst":"Dat is, die het geloof van Abraham navolgen, al zijn zij uit Abraham naar het vlees niet gesproten."},{"catchword":"van ons allen;","tekst":"Namelijk die geloven."}],"17":[{"catchword":"een vader van vele volken gesteld)","tekst":"Namelijk niet alleen van degenen die uit hem naar het vlees zouden voortkomen, maar ook van degenen, die door het geloof uit alle andere volken in zijn geestelijke familie zouden ingelijfd en aangenomen worden."},{"catchword":"voor Hem,","tekst":"Van hier af wordt beschreven het geloof van Abraham met al zijne steunselen en eigenschappen, tot Gen 4:22 , vanwaar voorts aangewezen wordt dat ons hetzelve tot een voorbeeld is voorgesteld."},{"catchword":"Die de doden levend maakt,","tekst":"Dit is het eerste steunsel des geloofs, namelijk Gods almacht, hetwelk Abrahams geloof van node had, om vastelijk te geloven dat hij nu in zijnen ouderdom, als verstorven zijnde, kracht zou krijgen om een vader te worden van vele volken."},{"catchword":"roept de dingen,","tekst":"Of, noemt; dat is door zijn woord doet zijn en hun wezen hebben; Psa 33:9 ; 2Co 4:6 ."}],"18":[{"catchword":"Welke","tekst":"Namelijk Abraham."},{"catchword":"tegen hoop","tekst":"Namelijk die de mens uit zijn eigen vernuft of rede zou hebben kunnen scheppen."},{"catchword":"op hoop","tekst":"Namelijk van Gods waarheid en macht."},{"catchword":"geloofd heeft,","tekst":"Dat is, vertrouwd heeft."},{"catchword":"Alzo zal uw zaad wezen","tekst":"Namelijk als de sterren aan den hemel."}],"19":[{"catchword":"niet aangemerkt,","tekst":"Namelijk om uit de aanmerking der zwakheid in zijn betrouwen verzwakt, te worden. Want anderszins heeft hij zelfs zijnen ouderdom en den ouderdom van Sara God voorgehouden; Gen 17:17 ."},{"catchword":"dat de moeder","tekst":"Grieks de verstorvenheid der baarmoeder van Sara."}],"20":[{"catchword":"aan de beloftenis Gods","tekst":"Dit is het andere steunsel van het geloof van Abraham, namelijk de verzekerdheid die hij had van Gods trouw en standvastigheid in zijne beloften; Heb 6:17-18 ."},{"catchword":"gevende God de eer;","tekst":"Dat is, hiermede betonende te geloven dat God kon en zou doen hetgeen Hij beloofd had; en heeft alzo verzegeld dat God waarachtig is; Joh 3:33 ."}],"21":[{"catchword":"machtig was te doen","tekst":"Namelijk al scheen het tegen alle menselijke rede te zijn."}],"23":[{"catchword":"Nu is het niet alleen om zijnentwil geschreven,","tekst":"Hier besluit de apostel de verklaring van het voorgaande hoofdstuk, en betuigt dat alle gelovigen alzo zullen worden gerechtvaardigd, gelijk Abraham gerechtvaardigd is."}],"24":[{"catchword":"die geloven in Hem,","tekst":"Dat is, betrouwen op Hem, want dit is ook hetgeen waar ons geloof op steunt, naar het voorbeeld van het geloof van Abraham, namelijk eerst Gods mogendheid en trouw, die Hij naar Zijne belofte getoond heeft in het opwekken van Christus uit de doden, en ten tweede de dood en opstanding van Jezus Christus, alzo wij door den dood met God verzoend en door de opstanding deze verzoening deelachtig worden."}],"25":[{"catchword":"overgeleverd is","tekst":"Namelijk van God Zijnen Vader; Rom 8:32 ."},{"catchword":"om onze zonden,","tekst":"Namelijk te verzoenen en teniet te doen;; 1Jo 1:7 , en 1Jo 2:2 ."},{"catchword":"om onze rechtvaardigmaking","tekst":"Namelijk overmits God door deze opwekking betoond heeft dat Hij den dood Zijns Zoons voor een genoegzaam rantsoen voor onze zonden heeft aangenomen, en zijn volkomen gehoorzaamheid wil aannemen tot rechtvaardigheid voor allen, die in Hem geloven. Want indien Christus in den dood gebleven ware, zo zou Zijne voldoening niet volkomen geweest zijn, en Hij zou ons de kracht van die niet hebben kunnen toeëigenen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"What shall we say therefore that Abraham our Father hath gotten [Gr. Hath found] according to the flesh? [Some take this word flesh for the state of unregenerated man: but that cannot be here, because Abraham was regenerated long before, and had served God, before this testimony, Gen 15:6. was given him. Others therefore join the word with the foregoing, our Father according to the flesh. But this word may also be fitly taken for according to the works which men see outwardly, and esteem praise worthy, as the following verse expounds this thus, and this word flesh is so taken, Php 3:3,4.]"}],"2":[{"catchword":null,"tekst":"For if Abraham was justified by works, he hath boasting, [that is, cause to boast] but not with God; [namely, hath he caused to boast. From whence therefore it necessarily follows that he was not justified before God by works: which afterwards he proves more at large.]"}],"3":[{"catchword":null,"tekst":"For what he saith the Scripture? And Abraham belied God, [That is, the promises of God, that he would be a shield and great reward to him, and is giving him an heir, and of multiplying his seed, Gen.15, 1,5,6. whereby not only a fleshly seed, but especially Christ is understood, the son of Abraham, in whom all the generations of the Earth should be blessed. See hereafter v.11,12,13. as Paul also expounds it, Gal 3:6. See also Joh 8:56.] and it was counted for righteousness. [the Hebrew Text, Gen. 15.6. saith, and be, namely, God. Counted it unto him: But the sense is all one, whereby is understood, that the righteousness which he had not in himself God gave him grace through faith ni the promised seed.]"}],"4":[{"catchword":null,"tekst":"Now to him that worketh, [Namely, with opinion to obtain or merit righteousness by his works] the reward is not imputed according to grace, but according to debt. [namely, is given: for to give according to debt, and to impute grace, is here opposed one to another as repugnant to each other.]"}],"5":[{"catchword":null,"tekst":"But to him that worketh not [That is, who cannot, nor dares not to bring forth such meritorious works] but believeth in him [that is, put his trust in the grace of God in Christ, v.24.25.] who justifieth the ungodly, [that is, who is yet unclean and defiled with the sin in himself, as all men, even the regenerate themselves are before God, according to the testament of David in the following verses] his faith [not that faith, as it is a work, deserves this, or is worthy of it in itself, as some perversely think, for this Paul hath immediately denied to all works, and therefore also to faith as a work: but because God of meer grace hath promised this to believers, and because faith is an instrument which received the righteousness of Christ, and interposeth the same betwixt God judgement and his own misdeeds. See Rom. 5.9. 2 Cor. 5.19. Phil. 9.] is counted for righteousness [the word count or impute is taken from the similitude of those who put any thing upon a mans account, Phil.v.18. So God is said to impute sin to any man, when he will have him to make satisfaction for the same by punishment: and not to impute them by when he forgives them, and acquits him from punishment, v.8. Likewise that he counts faith for righteousness, when he gives, ascribes and imputes to believers, the righteousness of Christ, by them apprehend by faith, and by this gracious imputation, counts it as if it were their own righteousness. Therefore it is also here laid that righteousness is imputed to them.]"}],"6":[{"catchword":null,"tekst":"As David also pronounceth the blessed [Gr. Saith the blessedness of man] to whom God imputes righteousness without works."}],"7":[{"catchword":null,"tekst":"(Saying) [Namely, in the beginning of the 32. Psalm, which proveth of Paul is irrefragable. For he that is justified by his works, he needeth no remission of sins to be blessed: and that he prayeth that God would not impute his sins to him, he also prayeth that God would impute righteousness of Jesus Christ to him, seeing these two things cannot be separated in Gods judgement. See Rom 3:24. and 5.19. Ephes. 1.7.etc] blessed are they whose iniquities are forgiven , and whose sins are covered."}],"8":[{"catchword":null,"tekst":"Blessed is the man to whom the Lord doth not impute sin."}],"9":[{"catchword":null,"tekst":"This speaking blessed therefore, [Or making blessed, from whence it appears that the word to speak blessed , or to made blessed, is here by David taken for the same that the Scripture Gen 15:6. concerning Abraham, calls the imputing of righteousness. The reason is, because the grounds of our salvation consist in remission of sins, and imputation of the righteousness of Christ] is it (only) upon the circumcision, or upon the uncircumcision also? For we say that Faith was counted to Abraham for righteousness."}],"10":[{"catchword":null,"tekst":"How was it therefore counted (to him?) when he was in circumcision, [That is, was it imputed to him when he was already circumcised] or uncircumcision? [that is, when he was not yet circumcised. For this promise to which Abraham&acirc;&euro;&trade;s faith had respect, was indeed made fourteen years before Abraham was circumcised: seeing Abraham had yet no hope of children when this promise was made, Gen. 15.2. And Ismael was now thirteen years old when Abraham being ninety and nine years old was circumcised, Gen 17:24, 25.] Not in circumcision, but in uncircumcision."}],"11":[{"catchword":null,"tekst":"And he received the sign of circumcision [That is, circumcision for a sign and seal i.e. obsination and confirmation that he was justified by faith: in which words the nature and all Sacraments is briefly set forth, as also Gen. 17.11. Exod. 12.13. Ezek. 20.12. namely, that they serve not the first to work faith, but to seal and strengthen it, and therefore are not bare signs but seals also] (for) a seal of righteousness of faith, might be a Father of that believe [namely, whose example or footsteps God willeth as well Gentiles as Jews should be justified by faith] being in uncircumcision, to the end that righteousness might be imputed to them also."}],"12":[{"catchword":null,"tekst":"And a Father of the circumcision, to them (namely) who not only for the circumcision, but that walk also in the footsteps of the faith of our Father Abraham, which was in uncircumcision."}],"13":[{"catchword":null,"tekst":"For the promise (was) or to his seeds through the Law, [That is, through the keeping of the Law. Here Paul produceth yet another reason to prove that Abraham was not justified by the works for otherwise the promise made to Abraham, namely that he with his seed should be heir to the world, should be given in vain: for the Law worketh wrath, and giveth not the inheritance, because it is weakened by the flesh, Rom 8.3.] namely that he should be the heir of the world, [Here is held either to the promise to Abraham at the same time when this testimony was of his righteousness by faith was given, Gen.15 ver.6.7.8. namely, of the possession of the land of Canaan ,which was a type of the eternal rest of believers in heaven, whereof the Apostle speaketh, Heb. 4.3. and chap.11. ver.9.10. Or to another promise which expressed, Gen 22.ver 17,18. after that he would have up his Son, namely that all generations of the earth shall be blessed in his seed. For Abraham as a father of all believers was by God put into the inheritance, of the spiritual world, whereof all his spiritual children the faithful, shall also receive their part through Christ the promised seed, Psa 2:8. Heb. 2.ver.5.] but by the righteousness of faith."}],"14":[{"catchword":null,"tekst":"For if they are of the Law [That is, they will be justified by works or keeping of the Law] be heir, [namely, of the spiritual world ver.13.] faith is become vain [that is, needless to no purpose] and the promise brought to nought. [that is, without virtue or fruit.]"}],"15":[{"catchword":null,"tekst":"For the Law worketh wrath. [That is, revealeth, Gods wrath against transgressing of the same, by its threatening of punishments: and increaseth sin through the perverseness of mans nature, Rom. 7.8.] For where there is no Law, [namely, neither written in nature, nor given by God, as is proved before] (there) is also no transgression. [namely, which can be known or be punished.]"}],"16":[{"catchword":null,"tekst":"There it is [Namely, the promise of this inheritance] of faith [that is, made or given of God upon condition of faith] that is according to grace: [for faith and grace go always together, and faith relies upon unchangeable grace of God, not on works, nor on mans selfe, ver5. Eph. 2.8.] to the end that the promise may be firm [for we can be assured of the inheritance only by faith, and not by the works of the Law, seeing no man keepeth the Law as is proved before. See also Gal 3:16.18.] to all the seed, not only that which is of the Law, [that is, of the Jews to whom the Law was given : for no man can be a heir by the works of the Law, is taught in the fourteen verse before going] but also that which of the faith of Abraham [that is, which imitate the faith of Abraham, although they may be not sprung from Abraham according to the flesh] who is the Father of us all. [namely, who believe.]"}],"17":[{"catchword":null,"tekst":"(As it is written, I have set thee forth a Father of many Nations.) [Namely, not only of them which should proceed from him according to the flesh, but also of those which should by faith be ingraffed and received into his spiritual family, out of all other Nations] before him on whom he believed, [from henceforward Abrahams faith is described with all its props and properties unto the two and twentieth verse; from whenceforward is showed that the same is propounded to us for example] (namely) God, who quickened the dead, [this is the first prop of faith, namely, Gods omnipotency , which Abrahams faith had need of to believe, firmly, that now in his old age being as it were dead, he should get power to become a father of many Nations] and calleth [or nameth, i.e. by his word causeth to be, and have their being, Psa 33:9. 2. Cor.4.6.] the things, which are not, as if they were."}],"18":[{"catchword":null,"tekst":"Who (namely, Abraham) against hope,[Namely, which a man could have conceived by own his understanding or reason] believed [that is, trusted] on hope, [namely, of Gods truth and power] that he should become a Father of many Nations: according to that which was said, so shall thy seed be. [namely, as the stars in heaven:]"}],"19":[{"catchword":null,"tekst":"And not being weakened in faith, he considered not [Namely, by the consideration of his weakness ; to be weakened in his confidence. For otherwise himself set before God his old age and the old age of Sarah, Gen 17:17.] his own body that was already dead, seeing he was about an hundred years old, (nor) yet that the matrix in Sarah is dead. [Gr. The deadness of the womb of Sarah.)"}],"20":[{"catchword":null,"tekst":"And he doubted not of the promise of God through unbelief : [ This is the other prop of Abrahams faith: namely, the certainty which he had of Gods faithfulness and steadfastness in his promise, Heb.6.ver.17.18.] but was strengthened in faith, giving God the glory: [that is, hereby showing that he believed that God could and would do that which he had promised; and to set his seal that God is true, John 3. ver 33.]"}],"21":[{"catchword":null,"tekst":"And being fully assured that that which was promised, he was also be able to doe. [Namely, although it seemed to be contrary to all humane reason.]"}],"22":[{"catchword":null,"tekst":"Therefore also it was counted to him righteousness."}],"23":[{"catchword":null,"tekst":"Now it was not written [Here the Apostle concludes the exposition of the former chapter, and testifieth that all believer shall so be justified even as Abraham was justified] for his sake alone, that it was imputed to him:"}],"24":[{"catchword":null,"tekst":"But for our sake also, to whom it shall be imputed (namely) to them that believe in him [that is, trust in him, for this is also that on which our faith relies , after the example of Abrahams faith, namely first Gods ability and fidelity, which according to his promise he showed in raising up of Christ from the dead: and secondly the death and resurrection of Jesus Christ, seeing by his death we are reconciled unto God, and by his resurrection we are made partakers of the reconciliation] who raised up Jesus our Lord from the dead."}],"25":[{"catchword":null,"tekst":"Who was delivered over [Namely, by God his Father, Rom.8 32.] for our sins [namely, to expiate and do them away, 1Jn 1:7. and 2.2.] and raised up for our justification. [namely, forasmuch as God showed by the raising up, that he received the death of his Son for a sufficient ransom of our sins, and will receive his obedience unto righteousness of all them that believe him. For if Christ had remained in death, then his satisfaction should not have been to apply the virtue thereof to us.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {

    if (!m) return null;

    if (!slug) return null;

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
