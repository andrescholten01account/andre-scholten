 zeggen): Laat ons het kwade doen, opdat het goede *daaruit* komt? Hun veroordeling is rechtvaardig.","9":"Wat dan? Zijn wij voortreffelijker? Helemaal niet; want wij hebben al eerder beschuldigd zowel Joden als Grieken, dat zij allen onder de zonde zijn;","10":"zoals geschreven is: Er is niemand rechtvaardig, ook niet één;","11":"er is niemand die verstandig is, er is niemand die God zoekt.","12":"Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is *zelfs* niet één.","13":"Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.","14":"Hun mond is vol vervloeking en bitterheid;","15":"hun voeten zijn snel om bloed te vergieten;","16":"vernieling en ellende is op hun wegen;","17":"en de weg van de vrede hebben zij niet gekend.","18":"Er is geen vreze van God voor hun ogen.","19":"Wij weten nu, dat alles wat de wet zegt, zij dat spreekt tot hen die onder de wet zijn; opdat elke mond gestopt wordt en de hele wereld *voor* God schuldig staat.","20":"Daarom zal uit de werken van de wet geen vlees gerechtvaardigd worden, voor Hem; want door de wet is de kennis van de zonde.","21":"Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten:","22":"namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid.","23":"Want zij hebben allen gezondigd, en missen de heerlijkheid van God;","24":"en worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing die in Christus Jezus is;","25":"Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God;","26":"tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.","27":"Waar is dan de roem? Hij is uitgesloten. Door welke wet? Van de werken? Nee, maar door de wet van het geloof.","28":"Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet.","29":"Is God *een God* van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;","30":"omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.","31":"Doen wij dan de wet teniet door het geloof? Dat zij verre; maar wij bevestigen de wet."},"SV":{"1":"Welk is dan het voordeel van den Jood? Of welk is de nuttigheid der besnijdenis?","2":"Vele in alle manier; want *dit* *is* wel het eerste, dat hun de Woorden Gods zijn toebetrouwd.","3":"Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongelovigheid het geloof van God te niet doen?","4":"Dat zij verre. Doch God zij waarachtig, maar alle mens leugenachtig; gelijk als geschreven is: Opdat Gij gerechtvaardigd wordt in Uw woorden, en overwint, wanneer Gij oordeelt.","5":"Indien nu onze ongerechtigheid Gods gerechtigheid bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over *ons* brengt? (Ik spreek naar den mens.)","6":"Dat zij verre, anderszins hoe zal God de wereld oordelen ?","7":"Want indien de waarheid Gods door mijn leugen overvloediger is geworden, tot Zijn heerlijkheid, wat word ik ook nog als een zondaar geoordeeld?","8":"En *zeggen* *wij* niet *liever* ( gelijk wij gelasterd worden, en gelijk sommigen zeggen, dat wij zeggen): Laat ons het kwade doen, opdat het goede *daaruit* kome? Welker verdoemenis rechtvaardig is.","9":"Wat dan? Zijn wij uitnemender? Ganselijk niet; want wij hebben te voren beschuldigd beiden Joden en Grieken, dat zij allen onder de zonde zijn;","10":"Gelijk geschreven is: Er is niemand rechtvaardig, ook niet een;","11":"Er is niemand, die verstandig is, er is niemand, die God zoekt.","12":"Allen zijn zij afgeweken, te zamen zijn zij onnut geworden; er is niemand, die goed doet, er is *ook* niet tot een toe.","13":"Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.","14":"Welker mond vol is van vervloeking en bitterheid;","15":"Hun voeten zijn snel om bloed te vergieten;","16":"Vernieling en ellendigheid is in hun wegen;","17":"En den weg des vredes hebben zij niet gekend.","18":"Er is geen vreze Gods voor hun ogen.","19":"Wij weten nu, dat al wat de wet zegt, zij dat spreekt tot degenen, die onder de wet zijn; opdat alle mond gestopt worde en de gehele wereld *voor* God verdoemelijk zij.","20":"Daarom zal uit de werken der wet geen vlees gerechtvaardigd worden, voor Hem; want door de wet is de kennis der zonde.","21":"Maar nu is de rechtvaardigheid Gods geopenbaard geworden zonder de wet, hebbende getuigenis van de wet en de profeten:","22":"Namelijk de rechtvaardigheid Gods door het geloof van Jezus Christus, tot allen, en over allen, die geloven; want er is geen onderscheid.","23":"Want zij hebben allen gezondigd, en derven de heerlijkheid Gods;","24":"En worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing, die in Christus Jezus is;","25":"Welken God voorgesteld heeft *tot* een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn rechtvaardigheid, door de vergeving der zonden, die te voren geschied zijn onder de verdraagzaamheid Gods;","26":"Tot een betoning van Zijn rechtvaardigheid in dezen tegenwoordigen tijd; opdat Hij rechtvaardig zij, en rechtvaardigende dengene, die uit het geloof van Jezus is.","27":"Waar is dan de roem? Hij is uitgesloten. Door wat wet? Der werken? Neen, maar door de wet des geloofs.","28":"Wij besluiten dan, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken der wet.","29":"Is God *een* *God* der Joden alleen? en is Hij het niet ook der heidenen? Ja, ook der heidenen;","30":"Nademaal Hij een enig God is, Die de besnijdenis rechtvaardigen zal uit het geloof, en de voorhuid door het geloof.","31":"Doen wij dan de wet te niet door het geloof? Dat zij verre; maar wij bevestigen de wet."},"KJV":{"1":"What advantage then hath the Jew? or what profit *is there* of circumcision?","2":"Much every way: chiefly, because that unto them were committed the oracles of God.","3":"For what if some did not believe? shall their unbelief make the faith of God without effect?","4":"God forbid: yea, let God be true, but every man a liar; as it is written, That thou mightest be justified in thy sayings, and mightest overcome when thou art judged.","5":"But if our unrighteousness commend the righteousness of God, what shall we say? *Is* God unrighteous who taketh vengeance? (I speak as a man)","6":"God forbid: for then how shall God judge the world?","7":"For if the truth of God hath more abounded through my lie unto his glory; why yet am I also judged as a sinner?","8":"And not *rather*, (as we be slanderously reported, and as some affirm that we say,) Let us do evil, that good may come? whose damnation is just.","9":"What then? are we better *than they*? No, in no wise: for we have before proved both Jews and Gentiles, that they are all under sin;","10":"As it is written, There is none righteous, no, not one:","11":"There is none that understandeth, there is none that seeketh after God.","12":"They are all gone out of the way, they are together become unprofitable; there is none that doeth good, no, not one.","13":"Their throat *is* an open sepulchre; with their tongues they have used deceit; the poison of asps *is* under their lips:","14":"Whose mouth *is* full of cursing and bitterness:","15":"Their feet *are* swift to shed blood:","16":"Destruction and misery *are* in their ways:","17":"And the way of peace have they not known:","18":"There is no fear of God before their eyes.","19":"Now we know that what things soever the law saith, it saith to them who are under the law: that every mouth may be stopped, and all the world may become guilty before God.","20":"Therefore by the deeds of the law there shall no flesh be justified in his sight: for by the law *is* the knowledge of sin.","21":"But now the righteousness of God without the law is manifested, being witnessed by the law and the prophets;","22":"Even the righteousness of God *which is* by faith of Jesus Christ unto all and upon all them that believe: for there is no difference:","23":"For all have sinned, and come short of the glory of God;","24":"Being justified freely by his grace through the redemption that is in Christ Jesus:","25":"Whom God hath set forth *to be* a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past, through the forbearance of God;","26":"To declare, *I say*, at this time his righteousness: that he might be just, and the justifier of him which believeth in Jesus.","27":"Where *is* boasting then? It is excluded. By what law? of works? Nay: but by the law of faith.","28":"Therefore we conclude that a man is justified by faith without the deeds of the law.","29":"*Is he* the God of the Jews only? *is he* not also of the Gentiles? Yes, of the Gentiles also:","30":"Seeing *it is* one God, which shall justify the circumcision by faith, and uncircumcision through faith.","31":"Do we then make void the law through faith? God forbid: yea, we establish the law."}},"tsk":{"1":[{"kopje":"voordeel","refs":["Rom 2:25-29","Gen 25:32","Pred 6:8","Pred 6:11","Jes 1:11-15","Mal 3:14","1 Kor 15:32","Hebr 13:9"]}],"2":[{"kopje":"Veel","refs":["Rom 3:3","Rom 11:1","Rom 11:2","Rom 11:15-23","Rom 11:28","Rom 11:29"]},{"kopje":"want","refs":["Rom 2:18","Rom 9:4","Deut 4:7","Deut 4:8","Neh 9:13","Neh 9:14","Ps 78:4-7","Ps 147:19","Ps 147:20","Jes 8:20","Ezech 20:11","Ezech 20:12","Luk 16:29-31","Joh 5:39","2 Tim 3:15-17","2 Petr 1:19-21","Openb 19:10"]},{"kopje":"toevertrouwd","refs":["1 Kor 9:17","2 Kor 5:19","Gal 2:7","1 Tim 6:20"]},{"kopje":"de woorden","refs":["Rom 1:2","Ps 119:140","Dan 10:21","Hand 7:38","2 Tim 3:15","2 Tim 3:16","H  is, een groot deel derzelve, namelijk die door hun eigen ongeloof de voordelen, hun van God verleend, krachteloos maken. Zie Heb 3:16-18 ; en Hos 8:12 ."},{"catchword":"hunne ongelovigheid","tekst":"Dat is, derzelver, of zulker ongelovigheid."},{"catchword":"het geloof Gods","tekst":"Dat is, de trouw en waarheid Gods, die onder dat volk, niettegenstaande de ondankbaarheid van velen, altijd de zijnen heeft willen behouden en nog behoudt, op welken de beloften Gods inzonderheid zien, en hunne kracht hebben; Rom 9:8 , Rom 9:27 , en Rom 11:1 , enz."}],"4":[{"catchword":"zij waarachtig","tekst":"Namelijk in het onderhouden van Zijn verbond en volbrengen van Zijne beloften, al is het dat de mensen die onwaardig zijn."},{"catchword":"gerechtvaardigd","tekst":"Dat is, rechtvaardig en trouw erkend."},{"catchword":"overwint","tekst":"Dat is, in uw oordelen zuiver en zonder blaam bevonden wordt. David breekt uit in deze bekentenis, uit aanmerking van zijne zonde tegen God begaan, en van de belofte der vergeving hem van Nathan verkondigd."},{"catchword":"oordeelt","tekst":"Of, geoordeeld wordt ; want het Griekse woord kan beide deze overzettingen verdragen; maar de Hebreeuwse tekst vereist het eerste, hetwelk ook best overeenkomt met Paulus' voornemen, hetwelk is te bewijzen dat God altijd zuiver en rechtvaardig blijft, of overwint, wanneer Hij oordeelt, dat is, de zonder der mensen in de kinderen der ongehoorzaamheid naar verdiensten straft, of wanneer Hij, naar Zijn beloften, Zich ontfermt over de zonden van Zijne kinderen, hetwelk ook door Gods oordeel, doch in Zijn barhartigheid, geschiedt; Mat 12:18 , Mat 12:20 . En wordt de waarheid Gods, In het houden van Zijne beloften, ook in de Schrift gerechtigheid Gods genaamd; Psa 143:11 , en 1Jo 1:9 ."}],"5":[{"catchword":"Gods gerechtigheid","tekst":"Dat is, trouw en waarheid, gelijk voren."},{"catchword":"bevestigt,","tekst":"Of, recommandeert ; dat is, prijselijk en blijkelijk maakt; Rom 5:8 ."},{"catchword":"toorn","tekst":"Dat is, straf, eigenlijk genoemd over sommigen, of ook vaderlijke kastijdingen over de zijnen; Psa 6:2 ."},{"catchword":"naar den mens.)","tekst":"Dat is, naar menselijke bedenking, of oordeel, hetwelk menen zou dat God niet behoorde te straffen hetgeen Zijne eer vordert."}],"6":[{"catchword":"Dat zij verre,","tekst":"Grieks het geschiede niet; namelijk dat God, al doet Hij zulks, daarom zou onrechtvaardig zijn, dewijl Hij een rechter is der gehele wereld, die alles altijd wijs en rechtvaardig doet, al kunnen de mensen dat niet altijd begrijpen. Zie Gen 18:25 ; Mal 2:17 ."}],"7":[{"catchword":"door mijn leugen","tekst":"Dat is, trouweloosheid, ongehoorzaamheid; en wordt hier gesteld tegen de waarheid of getrouwheid Gods in het houden van Zijne beloften."},{"catchword":"overvloediger is geworden,","tekst":"Dat is, openbaarder, blijkelijker."},{"catchword":"als een zondaar geoordeeld?","tekst":"Dat is, gehouden en gestraft, vs.5."}],"8":[{"catchword":"gelijk wij gelasterd worden,","tekst":"Dat is, gelijk zulke gevolgen uit hetgeen wij van Gods genade en rechtvaardigheid leren, ons lasterlijk nageduid worden."},{"catchword":"sommigen zeggen,","tekst":"Namelijk verkeerde mensen, die onze leer verdraaien."},{"catchword":"Welker verdoemenis rechtvaardig is","tekst":"In deze woorden is een korte wederlegging van hetgeen hier voren vs.7-8 tegen de leer van Paulus is ingevoerd, namelijk dat het zover vandaar is, dat hij zelfs degenen, die dat zeggen, met Gods oordeel dreigt."}],"9":[{"catchword":"wij","tekst":"Namelijk Joden."},{"catchword":"uitnemender?","tekst":"Dat is, van onszelven beter, rechtvaardiger, namelijk dan de heidenen."},{"catchword":"te voren","tekst":"Namelijk in de eerste twee hoofdstukken."},{"catchword":"beschuldigd","tekst":"Dat is, met vaste redenen bewezen, of overtuigd. Het Griekse woord betekent dikmaals iemand in rechten beschuldigen en met goed bewijs overtuigen."}],"10":[{"catchword":"Gelijk geschreven is","tekst":"Uit al deze plaatsen bewijst de apostel dat niet alleen de heidenen maar ook de Joden in zichzelven onrechtvaardig zijn voor God."}],"11":[{"catchword":"verstandig is,","tekst":"Namelijk om God recht te kennen."},{"catchword":"God zoekt","tekst":"Namelijk om Hem recht te dienen."}],"12":[{"catchword":"onnut geworden;","tekst":"Dat is, onbekwaam om goed te doen, gelijk verrotte en stinkende dingen, die men wegwerpt."}],"13":[{"catchword":"een geopend graf;","tekst":"Namelijk waar niets dan vuiligheid in is, en niets dan stank uitkomt."},{"catchword":"slangenvenijn","tekst":"Dat is, dodelijk vergif van kwaad spreken."}],"15":[{"catchword":"bloed te vergieten;","tekst":"Dat is, allerlei wreedheid en geweld te doen."}],"16":[{"catchword":"ellendigheid","tekst":"Namelijk die zij anderen aandoen."}],"17":[{"catchword":"den weg des vredes","tekst":"Namelijk om zelf in rust te leven, en anderen in rust te laten."}],"18":[{"catchword":"vreze Gods","tekst":"Namelijk die de grond en fontein is van alle andere deugden, waarmede de apostel besluit, niet dat al deze ondeugden in alle natuurlijke mensen even krachtig altijd uitbreken, maar omdat de kwade fontein van deze alle in hen is, en dat altijd enige daarvan in hun leven openbaar zijn."}],"19":[{"catchword":"spreekt tot degenen,","tekst":"Deze reden doet de apostel daarbij, om te tonen dat hij dit terecht op de Joden duidt, dewijl God in zijn Woord door Zijne profeten tot de Joden spreekt."},{"catchword":"verdoemelijk zij","tekst":"Dat is der verdoemenis, of des rechtvaardigen oordeels Gods schuldig."}],"20":[{"catchword":"Daarom zal uit de werken der wet","tekst":"Hier besluit Paulus uit het geheel voorgaande bewijs van Rom 1:17 tot hier toe, dat de mens door zijne werken niet kan gerechtvaardigd worden voor God."},{"catchword":"geen vlees","tekst":"Dat is, geen levend mens; Psa 143:2 ; Gal 2:16 ."},{"catchword":"gerechtvaardigd worden,","tekst":"Hetwelk niet betekent rechtvaardigheid of heiligheid instorten; want het zou geen zin hier hebben, geen vlees kan de rechtvaardigheid in gestort worden voor God; maar het betekent voor Gods oordeel van de verdoemenis vrijgesproken, en voor rechtvaardig gehouden worden. Zie Job 9:2-3 ; Psa 143:2 ; Rom 8:33-34 ; Gal 2:16-17 , enz."},{"catchword":"de kennis der zonde","tekst":"Namelijk wanneer de wet den mens voorstelt wat God gebiedt en verbiedt; en de conscientie des mensen hem overtuigd, dat hij daartegen met gedachten, lusten, woorden en werken heeft misdaan; Rom 7:7 ; Gal 3:19 , Gal 3:22 ."}],"21":[{"catchword":"de rechtvaardigheid Gods","tekst":"Dat is, die voor God geldt, en die God schenkt."},{"catchword":"zonder de wet,","tekst":"Dat is, niet door de wet, die volkomen gehoorzaamheid van den mens zelven eist, maar door het Evangelie, dat ons op Christus' gehoorzaamheid wijst; Rom 1:16-17 ."},{"catchword":"van de wet","tekst":"Dat is, van de schriften van Mozes, die van de rechtvaardigheid Gods door Christus getuigen, gelijk ook de profeten. Zie Joh 5:46 ; Act 15:11 , en Act 26:22 , enz."}],"22":[{"catchword":"geen onderscheid","tekst":"Namelijk tussen Joden en Grieken, als zij maar geloven."}],"23":[{"catchword":"derven de heerlijkheid Gods;","tekst":"Grieks Hysterountai; hetwelk betekent eigenlijk in het verkrijgen van enige zaken, inzonderheid in het lopen naar den prijs, verachteren of tekortkomen en derhalve dien moeten derven; gelijk alle mensen tekortkomen, die door hunne werken de heerlijkheid Gods, dat is het eeuwige leven zoeken te verkrijgen."}],"24":[{"catchword":"En worden","tekst":"Van hier voort beschrijft de apostel al de oorzaken en eigenschappen van de rechtvaardigmaking des geloofs, die ons in het Evangelie geopenbaard is. De opperste oorzaak dan is de onverdiende genade Gods, de bewegende en verdienende oorzaak is de verzoening en verlossing door Christus geschied; het middel, waardoor ons die wordt toegerekend, is het geloof in het bloed van Christus; het einde is de betoning van Gods gerechtigheid en de vergeving der zonden. De eigenschap is dat alle roem des mensen voor God hierdoor wordt uitgesloten, en dezelve geopenbaard is, niet alleen voor de Joden, maar ook voor de heidenen."},{"catchword":"om niet","tekst":"Grieks tegeefs; dat is, door enkele gifte, zonder enige verdienste."},{"catchword":"de verlossing,","tekst":"Grieks apolytrosis; hetwelk, hoewel het somwijlen wat breder genomen wordt voor allerlei verlossing, zo betekent het nochtans eigenlijk ene verlossing, die geschiedt door opbrenging of betaling van rantsoen, gelijk Christus zelf spreekt Mat 20:28 . Zie ook 1Co 7:23 ; 1Pe 1:18 ."}],"25":[{"catchword":"voorgesteld heeft","tekst":"Namelijk eerst in Zijn eeuwigen raad, en daarna door uitvoering van dien in de volheid des tijds, en eindelijk door de predikatie des Evangelies; 2Ti 1:9-11 ; 1Pe 1:20-22 ."},{"catchword":"verzoening,","tekst":"Grieks hilasterion; dat is, om te zijn een verzoener, namelijk der zondaren. De apostel ziet hier op den genadestoel of het verzoendeksel van zuiver goud gemaakt, dat de ark des verbonds, waar de tafelen der wet in lagen, bedekte; hetwelk ook hilasterion genaamd wordt, Heb 9:5 , en was een voorbeeld dat Christus door Zijne zuiverheid en gehoorzaamheid onze overtredingen tegen de wet voor Gods aanschijn zou bedekken en ons met God verzoenen."},{"catchword":"in Zijn bloed,","tekst":"Dat is in, of door Zijn bloedig lijden en sterven. Deze woorden kunnen gevoegd worden òf bij het woord verzoening, dat Christus ons door Zijn bloed met God verzoend heeft; òf met het woord geloof, omdat het geloof, waardoor wij gerechtvaardigd worden, voornamelijk ziet op de gehoorzaamheid van Christus tot den dood des kruises toe, en daarop steunt en vertrouwt; hetwelk met het oogmerk des apostels schijnt best overeen te komen. Zie ook 2Co 5:19-21 ; Gal 2:20 ."},{"catchword":"tot een betoning","tekst":"Dat is, om te betonen Zijne trouw en waarheid in het houden van Zijn beloften, Luk 1:69-70 , of ook om te bewijzen dat Hij rechtvaardig is, dewijl Hij zelfs in Christus de zonden straft, welke Hij in het Oude Testament vergeven heeft om deze verzoening, die geschieden zou, en in het Nieuwe dagelijks vergeeft den gelovigen om dezelfde voldoening, die nu geschied is; hetwelk de volgende woorden schijnen mede te brengen."},{"catchword":"die te voren geschied zijn","tekst":"Namelijk onder het Oude Testament, die God in Christus eerst in de volheid des tijds gestraft heeft, tot dien tijd dezelve overziende; Heb 9:15 . Of die de mensen gedaan hebben, eer zij door het geloof gerechtvaardigd worden. Hoewel ook de zonden, die na de bekering gedaan worden, niet anders worden vergeven dan om de voldoening van Christus; Phi 3:9 ; Heb 10:14 ; 1Jo 1:7 , en 1Jo 2:2 ."},{"catchword":"onder de verdraagzaamheid Gods;","tekst":"Grieks in. Deze woorden worden van sommigen gevoegd met vs.26, doch hangen beter aan het voorgaande."}],"26":[{"catchword":"Tot een betoning","tekst":"Zie der verklaring van vs.25."}],"27":[{"catchword":"roem?","tekst":"Namelijk waar enig mens in zijne rechtvaardigmaking voor God van zou mogen roemen."},{"catchword":"de wet des geloofs","tekst":"Dat is het voorschrift, of de leer des geloofs, die hij door een Hebreeuwse wijze van spreken bij gelijkenis ene wet noemt, gelijk Isa 2:3 ."}],"28":[{"catchword":"zonder de werken der wet","tekst":"Namelijk die niet alleen voor de bekering geschieden, maar ook na de bekering, gelijk van den apostel in het navolgende hoofdstuk met het voorbeeld van Abraham en David klaarlijk zal bewezen worden."}],"29":[{"catchword":"Is God een God der Joden alleen?","tekst":"Namelijk nu in het Nieuew Testament, wanneer het onderscheid tussen Joden en heidenen is weggenomen; Eph 2:16-18 ."}],"30":[{"catchword":"de besnijdenis","tekst":"Dat is, de Joden."},{"catchword":"de voorhuid door het geloof","tekst":"Dat is, de heidenen van afkomst."}],"31":[{"catchword":"wij bevestigen de wet","tekst":"Namelijk omdat de leer des Evangelies verklaart dat Christus de wet voor ons heeft volbracht, tot onze rechtvaardigmaking; en dat Hij degenen, die gerechtvaardigd worden, ook door Zijnen Geest alzo vernieuwt, dat zij naar alle geboden Gods hun leven zoeken te richten; Rom 8:1-3 . Niet om daardoor voor God gerechtvaardigd te worden, maar om God voor deze Zijne weldaad behoorlijke dankbaarheid te bewijzen, zijnen naaste te stichten, en van zijne eigen rechtvaardigmaking voor God meer en meer verzekerd te worden; gelijk Paulus hierna hfdst. 6, 7, 8, breder zal verklaren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"WHAT is then the advantage of the Jews? [Or in the Excellency; namely, above the Gentiles, if so be the outward Judaism and circumcision, avails not before God unto righteousness, as is taught in the five last verses of the former chapter] or what is the profit of circumcision?"}],"2":[{"catchword":null,"tekst":"Much in every manner. For this (is) indeed the first, [that is, the chiefest, which is the foundation of all other advantages, which the Apostle relates more at large, Rom 9.v.4, 5. Ephes. 2.v.11.12.] that the words of God [that is, the instruments of his covenant, contained in the writings of Moses and the Prophets, Psal. 147. v.19.20. Act 7:38.] were trusted unto them."}],"3":[{"catchword":null,"tekst":"For what is it, though some have been unfaithful, [That is, a great part of them, namely, who by their own unbelief make the advantages granted them by God of none effect. See Hos 8:12. Heb.3.v.16,17,18.] shall their unfaithfulness [that is, of them, or the unfaithfulness of such] annihilated the faith of God? [that is, the faithfulness and truth of God, not withstanding the unthankfulness of many, would always preserve his own amongst that people, and still preserveth them, whom the promise of God especially respect, and on whom they have their force, Rom 9.v8.27. and 11.1, &c.]"}],"4":[{"catchword":null,"tekst":"Farre be it: But let God be true, [Namely, in keeping of his covenant, and fulfilling of his promise, albeit that men are unworthy of the same] but all men liars: like as it is written, that thou mayst be justified in thy words, [that is, acknowledging to be just and faithful] and mayst overcome [that is, be found pure and without blame in thy judgments. David breaks forth into this acknowledgement, by considering of his sin committed against God and of the promise of forgiveness declared unto him by Nathan] when thou judhest. [or art judged; for the Greek word may bear both these translations: but the Hebrew text requires the first, which also best agrees with Pauls intent, which is to prove that God remains always pure and righteous, or overcometh when he judgeth, that is, punisheth the sins of men in the children of disobedience according to desert , or when according to his promises he hath compassion on the sins of his children, which is also done by Gods judgment, yet in his mercy, Mat.12.v18.20. and the truth of God in keeping of his promises, is also in the Scripture called the righteousness of God, Psa. 143.11. 1 John1 v9.]"}],"5":[{"catchword":null,"tekst":"Now if our righteousness confirms [Or commend, i.e. make it laudable and apparent, Rom. 5.8.] Gods righteousness, [ that is, faithfulness and truth as before] what shall we say? Is God un righteous when he bringeth wrath upon (us?) [that is, either punishment properly so called from some, or else fatherly chastisements upon his, Psa. 6.2.] (I speak according to the thought or judgment of men, which might think that God should not punish that which furthers his glory.]"}],"6":[{"catchword":null,"tekst":"Farre be it: [Gr. Let it not be, namely, that God, although he do thus should therefore be unrighteous, seeing judge of the whole world, who always doth things wisely and righteously, although all men cannot always comprehend it. See G en.18.25. Mat. 2.17.] otherwise how shall God judge the world?"}],"7":[{"catchword":null,"tekst":"For if the truth of God by my lie [That is, faithlessness, disobedience, and is here opposed to the truth or faithfulness of God in keeping of his promises] is become more abundant [that is, more manifest, more apparent] unto his glory, why am I also yet judged as a sinner? [that is, accounted and punished v.5.]"}],"8":[{"catchword":null,"tekst":"And (say we) not (rather) (as we are slandered, [That is, as such consequences are slanderously laid to our charge from that which we teach concerning Gods grace and righteousness] and as some we say) [namely, perverse men wrest our doctrine] Let us do evil that Good may come (for it?) whose damnation it just. [in these words is a short confutation of that which heretofore v.7.8. was brought against Paul doctrine, namely, that is so farre from that, that he should own such consequences, that he even threatens the judgment of God to those that say it.]"}],"9":[{"catchword":null,"tekst":"What then? Are we [Namely, Jews] more excellent? [that is, better of our selves, more righteous, namely, them the Gentiles] Not at all: for we have before, [namely, in the two first chapters] accused [that is, proved by firm reasons, or convinced. The Greek word signifies often to accuse any one in judgement, and by good proof convince him] both Jews and Greeks, that they are all under sin."}],"10":[{"catchword":null,"tekst":"As it is written, [From all these places the Apostle proves that not only the Gentiles, but also the Jews are in themselves unrighteous before God] there is no man righteous, no not one."}],"11":[{"catchword":null,"tekst":"There is no man that is understanding, [Namely, to know God aright] there is no man that seeketh God. [namely, to serve him aright.]"}],"12":[{"catchword":null,"tekst":"There all gone together, they are become unprofitable: [That is, unfit to do well, like rotten and stinking things which men cast away] there is no man that doth well, there is not (even) unto one."}],"13":[{"catchword":null,"tekst":"Their Throat is opened grave, [Namely, wherein is nothing but filthiness and nothing but stench comes out] with their Tongues they use deceit: the person of serpents is under their lips: [that is, deadly poison of evil speaking.]"}],"14":[{"catchword":null,"tekst":"Whose mouth is full of cursing and bitterness."}],"15":[{"catchword":null,"tekst":"Their feet are swift to shed blood. [That is, to commit all manner of cruelty and violence.]"}],"16":[{"catchword":null,"tekst":"Destruction and misery [Namely, which they bring upon others] is in their ways."}],"17":[{"catchword":null,"tekst":"And the way of peace [Namely, to live in quiet themselves, & to let others be quiet] they have not known."}],"18":[{"catchword":null,"tekst":"There is no fear of God before their eyes. [Namely, which is the ground and fountain of all other virtues: whereby the Apostle concludes not that all these vices do always alike powerfully break forth in all natural men; but because the evil fountain of all these is in them, and that always some of them are manifest in their lives.]"}],"19":[{"catchword":null,"tekst":"Now we know that whatsoever the Law saith, it speaketh that to those that are under the Law, [This reason the Apostle adds to show that he justly interprets this of the Jews, seeing God in his word by his Prophets unto the Jews] that every mouth may be stopped, and the whole world may be damnable [that is, guilty of damnation, or of the righteous judgement of God] (before) God."}],"20":[{"catchword":null,"tekst":"Therefore [Here Paul concludes from all the former proof, from the 17 v. of the 1. chap. Hitherto, that by his works a man cannot be justified before God] by the works of the Law, shall no flesh [that is, no living man, Psa 143:2. Gal. 2.16.] be justified before him. [which doth not signify to infuse righteousness or holiness; for it would be no sense here, righteousness can be infuted into no flesh before God, but it signifies to be acquitted from condemnation before Gods judgment, and to be accounted just,. See Job 9.v.2.3. Psa 143:2. Rom. 8.33,34. Gal. 2.16,17. etc.] For by the Law is the knowledge of sin. [namely, when the Law sets before a man what God commands and forbids, and a mans conscience convinceth him that he hath offended against it, by thoughts, lusts, words and deeds, Rom. 7.7 Gal. 3.19.22.]"}],"21":[{"catchword":null,"tekst":"But now the righteousness of God [That is, which avails before God, and which God freely gives] is made manifest, without the Law, [that is, not by the Law which requires perfect obedience of mans self, but by the Gospel, that directs us to the obedience of Christ, Rom 1:16.17.] having witness from the law and the prophets. [that is, from the writings of Moses. Which testifies of the righteousness of God through Christ, as also the Prophets. See Joh 5:46. Act 15:11. and 26. 22, etc."}],"22":[{"catchword":null,"tekst":"Namely, the righteousness of God by the faith of Jesus Christ, unto all and upon all that believe: For there is no difference. [Namely, betwixt Jews and Greeks, if they do but believe.]"}],"23":[{"catchword":null,"tekst":"For they have all sinned, and fail the glory of God. [Gr. Hysterountai, which properly signifies to be behind, or to come short in the obtaining of any things, especially in running towards the prize, and for that be forced to want it, as all man come too short who seek to obtain the glory of God, that is, eternal life by their works.]"}],"24":[{"catchword":null,"tekst":"And are justified [From hence forward the Apostle describe all the causes, and the properties of justification of faith, which is revealed to us in the Gospel. The supreme cause therefore is the undeserved grace of God, the moving and meritorious cause is the reconciliation and redemption made by Christ: the means whereby that is imputed to us, is faith in Christs blood: the end is the showing forth of Gods righteousness and the forgiveness of sins. The property is, that all boasting of man before God is hereby executed, and that the same is revealed not only for the Jews but also for the Gentiles] for nought , [Gr. Of gift, i.e. by meer gift without any desert] by his grace, by the redemption which is in Jesus Christ. [Gr.Apolystrosis, which although it may be sometimes taken somewhat more largely, for any kind of deliverance, yet notwithstanding it properly signifies a deliverance which is procured by bringing up or paying of a ransom, as Christ himself speaketh, Mat. 20.28. See also 1 Cor.7.v.23. 1 Pet.1.18.]"}],"25":[{"catchword":null,"tekst":"Whom God hath set forth [Namely, firstly in his eternal counsel, and afterwards by the execution thereof in the fullness of time, and finally by preaching of the Gospel, 2 Tim. 1.9,10,11. 1 Pet. 1 20, 21,22.] (for) a reconciliation [Gr. Hilasterion, i.e. to be a reconciler, namely, of sinners. The Apostle here alludes to the mercy-seat or propitiatory made of pure gold, which covered the Ark of the Covenant, in which the Tables of the Law lay: which is also called hilasterion, Heb. 9. 5. and was a type that Christ by his purity and obedience should cover our transgressions against the Law, before the face of God; or with the word faith, because faith thereby we are justified, chiefly respects Christs obedience even to the death of the cross; and whereon relies and truths,.: which seems best to agree with the scope of the Apostle. See also 2 Cor.5.19.,20,21. Gal 2:20.] a demonstration of his righteousness, [that is, to show forth his faithfulness and truth in keeping of his promise, Luk 1:69,70. Or else to show that he is righteous, seeing he punisheth the sin in Christ himself: which in the Old Testament he forgave upon the account of this reconciliation which was to be accomplished, and in the new, daily forgiveth believers upon the account of the same satisfaction which now is accomplished, which the following words seem to import] by the forgiveness of sins, which were committed before, [namely, under the old Testament, which God first punished in Christ, the fullness of time, Heb.9.v.15. Or which men have committed before they are justified by faith. Although the sins also which are committed after conversion, are no otherwise forgiven then for the satisfaction of Christ, Phil, 3.9. Heb 10:14. 1Jn 1:7. and chap.2.v2.] under the forbearance of God. [Gr. In. These words are by some joined to the following verse: but cohere better with the former.]"}],"26":[{"catchword":null,"tekst":"For a demonstration of his righteousness [See the exposition of the former verse] in this present time: that he may be just, and justifying him that is of faith of Jesus."}],"27":[{"catchword":null,"tekst":"Where is boasting therefore? [That is, where of any may be able to boast, in his justification before God] It is excluding. By what Law? Of works? No, but by the law of faith; which by an Hebraism and by a similitude he calleth a Law, as Isa 2:3]"}],"28":[{"catchword":null,"tekst":"We conclude therefore that a man is justified by faith, without works of the Law? [Namely, not only which are done before conversion: but also after conversion, as shall clearly be proved by the Apostle in the next chapter, by the example of Abraham and David.]"}],"29":[{"catchword":null,"tekst":"Is God (a God) of the Jews only, [Namely, now in the new Testament, when the difference betwixt Jews and Gentiles taken away, Ephes.2.v.16,17,18.] And is he not also of the Gentiles? Yes; of the Gentiles also."}],"30":[{"catchword":null,"tekst":"Forasmuch as he is one only God, who shall justify the circumcision [that is, the Jews] by faith, and the uncircumcision [that is, the Gentiles by descent] through faith."}],"31":[{"catchword":null,"tekst":"Do we therefore abolish the law by faith? Farre be it: but we confirm the Law. [Namely because the doctrine of the Gospel teacheth that Christ hath fulfilled the law for us our justification: and that he also reneweth by the spirit those that are justified, that they seek to frame their lives according to all Gods commandments, Rom.8.v.1,2,3. Not to be justified before thereby, but to show due thankfulness unto God for this his benefit, to edify our neighbour and to be more assured of our own justification before God, as Paul will hereafter in the 6.7. and 8. Chapters more largely declare.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
