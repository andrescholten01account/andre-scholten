ebben een kleine zuster, die nog geen borsten heeft; wat zullen wij voor onze zuster doen in de dag dat men over haar zal spreken?","9":"Als zij een muur is, zullen wij een paleis van zilver op haar bouwen; en als zij een deur is, zullen wij haar rondom bezetten met cederen planken.","10":"Ik ben een muur en mijn borsten zijn als torens. Toen was ik in Zijn ogen als iemand die vrede vindt.","11":"Salomo had een wijngaard, te Baäl-Hamon; hij gaf deze wijngaard aan de hoeders, ieder bracht voor de vrucht ervan duizend zilverlingen.","12":"Mijn wijngaard, die ik heb, is voor mijn aangezicht; de duizend zilverlingen zijn voor u, o Salomo! maar tweehonderd zijn voor de hoeders van de vrucht ervan.","13":"O bewoonster van de hoven! De metgezellen letten op uw stem; laat mij haar horen.","14":"Kom haastig, mijn Liefste! En wees als een ree, of als een welp van de herten, op de bergen van de specerijen."},"SV":{"1":"Och, dat Gij mij als een Broeder waart, zuigende de borsten mijner moeder! dat ik U op de straat vond, ik zou U kussen, ook zouden zij mij niet verachten.","2":"Ik zou U leiden, ik zou U brengen in mijner moeders huis, Gij zoudt mij leren; ik zou U van specerijwijn te drinken geven, en van het sap van mijn granaatappelen.","3":"Zijn linkerhand zij onder mijn hoofd, en Zijn rechterhand omhelze mij.","4":"Ik bezweer u, gij dochteren van Jeruzalem! dat gij die liefde niet opwekt, noch wakker maakt, totdat het *dezelve* lust!","5":"Wie is zij, die daar opklimt uit de woestijn, en liefelijk leunt op haar Liefste? Onder den appelboom heb ik u opgewekt, daar heeft u uw moeder met smart voortgebracht, daar heeft zij *u* met smart voortgebracht, *die* u gebaard heeft.","6":"Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen des Heeren.","7":"Vele wateren zouden deze liefde niet kunnen uitblussen; ja, de rivieren zouden ze niet verdrinken; al gaf iemand al het goed van zijn huis voor deze liefde, men zou hem te enenmale verachten.","8":"Wij hebben een kleine zuster, die nog geen borsten heeft; wat zullen wij onze zuster doen in dien dag, als men van haar spreken zal?","9":"Zo zij een muur is, wij zullen een paleis van zilver op haar bouwen; en zo zij een deur is, wij zullen haar rondom bezetten met cederen planken.","10":"Ik ben een muur en mijn borsten zijn als torens. Toen was ik in Zijn ogen als een, die vrede vindt.","11":"Salomo had een wijngaard, te Baäl-hamon; hij gaf dezen wijngaard aan de hoeders, een ieder bracht voor deszelfs vrucht duizend zilverlingen.","12":"Mijn wijngaard, dien ik heb, is voor mijn aangezicht; de duizend *zilverlingen* zijn voor u, o Salomo! maar tweehonderd zijn voor de hoeders van deszelfs vrucht.","13":"O gij bewoonster der hoven! de metgezellen merken op uw stem; doe ze Mij horen.","14":"Kom haastelijk, mijn Liefste! en wees Gij gelijk een ree, of gelijk een welp der herten op de bergen der specerijen."},"KJV":{"1":"O that thou *wert* as my brother, that sucked the breasts of my mother! *when* I should find thee without, I would kiss thee; yea, I should not be despised.","2":"I would lead thee, *and* bring thee into my mother's house, *who* would instruct me: I would cause thee to drink of spiced wine of the juice of my pomegranate.","3":"His left hand *should be* under my head, and his right hand should embrace","4":"I charge you, O daughters of Jerusalem, that ye stir not up, nor awake *my* love, until he please.","5":"Who *is* this that cometh up from the wilderness, leaning upon her beloved? I raised thee up under the apple tree: there thy mother brought thee forth: there she brought thee forth *that* bare","6":"Set me as a seal upon thine heart, as a seal upon thine arm: for love *is* strong as death; jealousy *is* cruel as the grave: the coals thereof *are* coals of fire, *which hath a* most vehement flame.","7":"Many waters cannot quench love, neither can the floods drown it: if *a* man would give all the substance of his house for love, it would utterly be contemned.","8":"We have a little sister, and she hath no breasts: what shall we do for our sister in the day when she shall be spoken for?","9":"If she *be* a wall, we will build upon her a palace of silver: and if she *be* a door, we will inclose her with boards of cedar.","10":"I *am* a wall, and my breasts like towers: then was I in his eyes as one that found favour.","11":"Solomon had a vineyard at Baalhamon; he let out the vineyard unto keepers; every one for the fruit thereof was to bring a thousand *pieces* of silver.","12":"My vineyard, which *is* mine, *is* before me: thou, O Solomon, *must have* a thousand, and those that keep the fruit thereof two hundred.","13":"Thou that dwellest in the gardens, the companions hearken to thy voice: cause me to hear","14":"Make haste, my beloved, and be thou like to a roe or to a young hart upon the mountains of spices."}},"tsk":{"1":[{"kopje":"als U","refs":["Jes 7:14","Jes 9:5","Hagg 2:8","Zach 9:9","Mal 3:1","Matt 13:16","Matt 13:17","Luk 2:26-32","Luk 2:38","Luk 10:23","Luk 10:24","1 Tim 3:16","Hebr 2:11","Hebr 2:12"]},{"kopje":"gezogen","refs":["Jes 66:11","Jes 66:12","Gal 4:26"]},{"kopje":"Vond ik U","refs":["Joh 1:14","Joh 3:13","Joh 8:42","Joh 13:3","Joh 16:28","Hebr 2:9-14","Hebr 9:26-28"]},{"kopje":"ik zou U","refs":["Hoogl 1:2","Ps 2:12","Ps 45:11","Ps 45:12","Luk 7:45-48","Luk 9:26","Luk 12:8","Joh 7:46-52","Joh 9:25-38","Gal 6:14","Fil 3:3","Fil 3:7","Fil 3:8"]},{"kopje":"en","refs":["Ps 51:19","Ps 102:17","Ps 102:18","Mark 12:42-44","Mark 14:6-9"]},{"kopje":"men zou mij daarom niet verachten","refs":["Jes 60:14","Luk 10:16","Luk 18:9","1 Kor 1:28"]}],"2":[{"kopje":"brengen","refs":["Hoogl 3:4","Gal 4:26"]},{"kopje":"die","refs":["Luk 16:29-31","Joh 5:39","Joh 5:46","Joh 5:47","Hand 17:11","Hand 17:12","2 Tim 3:15","1 Petr 1:10-12","2 Petr 1:19","Openb 19:10"]},{"kopje":"ik zou U te drinken geven","refs":["Hoogl 4:10-16","Hoogl code=\"H1004\">house</span> for <span class=\"wl wl-kjv\" data-code=\"H160\">love,</span> it would <span class=\"wl wl-kjv\" data-code=\"H936\">utterly</span> be contemned.","8":"We have a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> and she hath no <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts:</span> what shall we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for our <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when she shall be spoken for?","9":"If she be a <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> we will <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> upon her a <span class=\"wl wl-kjv\" data-code=\"H2918\">palace</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver:</span> and if she be a <span class=\"wl wl-kjv\" data-code=\"H1817\">door,</span> we will <span class=\"wl wl-kjv\" data-code=\"H6696\">inclose</span> her with <span class=\"wl wl-kjv\" data-code=\"H3871\">boards</span> of cedar.","10":"I am a <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and my <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts</span> like <span class=\"wl wl-kjv\" data-code=\"H4026\">towers:</span> then was I in his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> as one that <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> favour.","11":"<span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had a <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> at <span class=\"wl wl-kjv\" data-code=\"H1174\">Baalhamon;</span> he let <span class=\"wl wl-kjv\" data-code=\"H5414\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> unto <span class=\"wl wl-kjv\" data-code=\"H5201\">keepers;</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> for the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> thereof was to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> pieces of silver.","12":"My <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> which is mine, is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me: thou, O <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> must have a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and those that <span class=\"wl wl-kjv\" data-code=\"H5201\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> thereof two hundred.","13":"Thou that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwellest</span> in the <span class=\"wl wl-kjv\" data-code=\"H1588\">gardens,</span> the <span class=\"wl wl-kjv\" data-code=\"H2270\">companions</span> <span class=\"wl wl-kjv\" data-code=\"H7181\">hearken</span> to thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> cause me to hear","14":"Make <span class=\"wl wl-kjv\" data-code=\"H1272\">haste,</span> my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> and be thou <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> to a <span class=\"wl wl-kjv\" data-code=\"H6643\">roe</span> or to a <span class=\"wl wl-kjv\" data-code=\"H6082\">young</span> <span class=\"wl wl-kjv\" data-code=\"H354\">hart</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of spices."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dat Gij mij","tekst":"Hebreeuws, wie zal u mij geven als mijn broeder! Zie de aantekening Deu 5:29 , en Psa 14:7 . Dit is een wens der Bruid, of der godzaligen, wensende dien dag te mogen zien en beleven, dat ze Christus haren Bruidegom [geworden zijnde haar broeder naar het vlees] zou mogen aanschouwen, in het vlees geopenbaard zijnde. Hoezeer vele godzaligen in het Oude Testament hiernaar verlangd hebben zie Mat 13:17 ; Joh 8:56 ; Heb 11:13 ."},{"catchword":"zuigende","tekst":"Geesterlijkerwijze moet men door de moeder verstaan de algemene kerk, het hemelse Jeruzalem, dat onzer aller moeder is; Gal 4:26 . Christus heeft dezelfde borsten gezogen, die wij gezogen hebben, gelijk Hij de sacramenten des Ouden en des Nieuwen Testaments heeft genoten: de besnijdenis, het paaslam, den doop en het heilige avondmaal, om alzo alle gerechtigheid te volbrengen; Mat 3:15 ."},{"catchword":"kussen,","tekst":"Kussen is een bewijs van liefde, somtijds ook van eer en gehoorzaamheid. Zie Psa 2:12 ; Son 1:2 ."},{"catchword":"verachten","tekst":"Die personen worden versmaad, die wat doen of geacht worden te doen, hetwelk niet eerlijk nocht betamelijk is, Gen 38:23 ; 2Sa 6:16 ; Isa 37:22 . Dewijl dan de Bruid, haren Bruidegom op de straat openlijk kussende, dat is openbaarlijk Hem voor de mensen belijdende en bekennende haar Zaligmaker te zijn, niets onbetamelijks doen zou, zo zou zij deshalve van geen godzalige personen met reden veracht of bespot worden. Of men kan deze woord [ ook zouden zij mij niet verachten ] in dezen zin nemen, alsof de Bruid zeide: Mijne vijanden, de ongelovigen mensen, zouden alsdan mijne hoop, die ik heb van de verschijning van den Messias in het vlees, niet meer bespotten gelijk zij plegen te doen, als de beloften Gods wat lang uitblijven, gelijk Psa 42:11 te zien is, en 2Pe 3:4 ."}],"2":[{"catchword":"U leiden,","tekst":"Te weten, met eerbieding en met vreugde; willende Christus, dat is de kennis van Christus, verbreiden in de algemene kerk zo der Joden als der heidenen."},{"catchword":"in mijner moeders","tekst":"Dat is, in de kerk of verzamelingen der gelovigen, die Gods huizen en tempels zijn, 2Co 6:16 ; Gal 4:26 ; Heb 3:6 ."},{"catchword":"Gij zoudt mij","tekst":"Dit spreekt de kerk tot Christus. Zie Deu 18:15 ; Isa 2:2-3 ; Mic 4:1-2 ; Joh 1:18 , en Joh 4:25 , en Joh 15:15 ; Heb 1:1 ."},{"catchword":"ik zou U","tekst":"Dat is, ik zou zulke goede vruchten tot uwe eer voortbrengen, die u zo aangenaam zouden zijn als wijn met specerijen vermengd, of hypocras, of het sap van granaatappelen, iemand wezen kan."},{"catchword":"van het sap","tekst":"Deze lieflijke drank is geheel het tegendeel van den beker, waarvan gesproken wordt Rev 17:2 , Rev 17:4 ."}],"3":[{"catchword":"Zijn linkerhand","tekst":"De Bruid, aanmerkende hare zwakheid, bidt den Bruidegom, dat Hij haar wil troosten en ondersteunen, opdat zij rust moge vinden voor hare ziel, Son 2:6 . Anders: zijne linkerhand is, of ligt, onder mijn hoofd; dat is, Hij draagt middelerwijl zorg voor mij, tonende zijne kracht in mijne zwakheid, Hij ondersteunt mij in mijn grootsten nood, gelijk een getrouw man zijne huisvrouw bijstaat in haar nood en benauwdheid."}],"4":[{"catchword":"Ik bezweer u,","tekst":"Dat is, ik beveel u een eed. De Bruid, nu gevoelende de genadige vertroostingen van haren Bruidegom, wens dat zij dezelve steeds moge deelachtig zijn en blijven, verbiedende haren vrienden dezelve te ontrusten of te storen. Zie boven Son 2:7 , en Son 3:5 ; te ewten door ketterijen, scheuringen of ergernis. Eenigen menen dat de Bruidegom in vs.4 spreekt."},{"catchword":"dat gij die liefde","tekst":"Anders: waarom, of wat zoudt gijlieden die liefde opwekken, of wakkermaken eer het haar lust? Deze vraag betekent zoveel alsof er stond: wekt deze liefde niet op, het zou ulieden en ons tezamen niet bevorderlijk zijn dat gij uwe moeder, de kerk, harteleed zoudt aandoen. Zie dergelijke manier van spreken boven Son 2:7 , en Son 3:5 ."}],"5":[{"catchword":"Wie is zij,","tekst":"Dit zijn de woorden van den Bruidegom, zich verwonderende over den opgang van een nieuwe gemeente, in ene plaats waar tevoren gene verzameling der gelovigen geweest was. Of, indien dit zijn de woorden van de oude kerk der gelovigen, gelijk sommigen menen, zo is het ene verwondering van de dochters van Jeruzalem over den aanwas, het sterk onwankelbaar geloof en geduld dezer gemeente, zich leunende, steunende, alleenlijk verlatende op de genadige bescherming van haren Bruidegom. Vergelijk Son 3:6 ."},{"catchword":"de woestijn,","tekst":"Men kan hier door de woestijn verstaan de volken dezer wereld, uit welke het volk Gods is verkoren en geroepen; Joh 15:19 ."},{"catchword":"liefelijk","tekst":"Anders: zich voegende, of vergezellende tot haren liefste. Het Hebreeuwse woord, dat in den tekst staat, wordt nergens meer gevonden dan hier alleen. Hier wordt te kennen gegeven de zwakheid, die de Bruid bij zichzelve gevoelt, hare sterkte bestaande in Christus haren Bruidegom, aan wien zij met het geloof leunende, versterkt wordt in alle vrees, twijfelmoedigheid, verzoekingen en gevaarlijkheden, als zijnde, door de vereniging met Hem, zijne genaden en weldaden deelachtig gemaakt, want wie den Heere aanhangt, die is een geest met Hem, 1Co 6:17 , die hem volmaakt, bevestigt, sterkt en fondeert; 1Pe 5:10 ."},{"catchword":"Onder","tekst":"Versta hier bij den appelboom den boom der genade, welks schaduw en vruchten de Bruid aangenaam en vermakelijk zijn."},{"catchword":"heb ik u opgewekt,","tekst":"Dit zijn de woorden der Bruid tot haren Bruidegom, dien zij als uit den slaap opwekt door haar ijverig gebed; gelijk Psa 44:24 , en Psa 68:2 , en Psa 78:65 ."},{"catchword":"daar heeft u","tekst":"Te weten onder dien appelboom."},{"catchword":"uw moeder","tekst":"Of aldus: Daar is uwe moeder van u in arbeid geweest, daar is zij in arbeid geweest, die u gebaard heeft; uwe moeder, dat is de eerste kerk, of verzameling der gelovigen, in welke Christus, bij manier van spreken, geboren is, door het prediken, belijden en het ten uitvoer brengen van zijn Woord, ook door het lijden voor hetzelve."},{"catchword":"met smart","tekst":"Christus in de wereld voort te brengen door de predikatie van het Evangelie, wordt ons hier afgebeeld door de gelijkenis van ene vrouw, zijnde barenssmart; gelijk Gal 4:19 ; Rev 12:2 . Gelijk het kinderbaren geschiedt met vele pijnen en zwarigheid, alzo gaat het ook toe als men Christus in de harten en gemoederen der mensen brengende is, opdat zij in Hem geloven. Dit geschiedt niet dan met veel arbeid, zorg en zwarigheid. Zie 2Co 4:8 tot 2Co 4:11 , en 2Co 6:4-5 ."}],"6":[{"catchword":"Zet mij","tekst":"Met deze woorden bidt de Bruid Christus om verzekering en bevestiging zijner liefde tot haar, dat zij als een zegel in en op zijn hart moge verzegeld zijn en blijven. Dit ziet op den borstlap van den hogepriester, in welken gegraveerd waren de namen van de twaalf stammen van Israël, in twaalf edele stenen; Exo 28:21 , Exo 28:29 . Ten allen tijde zijn zegels gebruikt geweest tot bevestiging van hetgeen men schrijft of belooft, opdat het niet verbroken worde. Zie Neh 9:28 ; Jer 22:24 ; Hag 2:24 ; Mal 3:16 ; 2Ti 2:19 ."},{"catchword":"op Uw arm;","tekst":"De hogepriester droeg de namen der twaalf stammen, niet alleen op zijn hart, maar ook op zijne schouders, ter gedachtenis van de kinderen Israëls. Zie Isa 49:16 . Eenigen menen dat door het hart hier betekend wordt de inwendige liefde des Bruidegoms en door den arm het uitwendig bewijs zijner liefde, gelijk Psa 77:16 , en Psa 86:11 ."},{"catchword":"de liefde","tekst":"Te weten de geestelijke liefde der Bruid tot Christus en desgelijks de liefde van Christus tot zijne kerk en uitverkorenen."},{"catchword":"als de dood;","tekst":"De zin is: Gelijk de dood door zijne kracht ook den allersterksten mens overwint, Psa 89:49 , alzo is de onderlinge liefde tussen ons beiden zeer sterk, en zij kan in ons niet uitgeblust worden door enigen vijand, of tegenspoed, zelfs ook niet door den dood."},{"catchword":"de ijver","tekst":"Of, jaloezie. Dit betekent een heftige brandende liefde. Deze liefde of ijver wordt gezegd hard te wezen gelijk het graf, omdat zij alle zwarigheden verslindt en overwint; Gal 5:24 ; Col 3:5 , gelijk de dood en het graf alles verslinden."},{"catchword":"haar kolen","tekst":"Hier wordt gesproken van de brandende kolen der liefde, die het hart ontsteken en niet kunnen uitgeblust worden."},{"catchword":"vlammen","tekst":"Dat is, grote krachtige vlammen, of vlammen, die van den HEERE ontstoken worden. Versta, de vlammen of het vuur der liefde en van den Geest van Christus, hetwelk met recht groot mag genoemd worden vanwege de sterkte zijner liefde en de krachtige werking zijns Geestes in de harten der uitverkorenen."}],"7":[{"catchword":"Vele wateren","tekst":"Bij wateren en stromen worden dikwijls in de Heilige Schrift betekend tegenspoeden, vervolgingen, aanvechtingen, die de Heere Christus om onzentwil heeft uitgestaan, en met welke het geloof, de liefde en het geduld der kinderen Gods geoefend en beproefd worden, gelijk Psa 42:8 , en Psa 69:2 ; Isa 8:7-8 , en Isa 59:19 ; Dan 9:26 , en Dan 11:22 ; Mat 7:27 . Zie de aantekening 2Sa 22:17 . Vergelijk Rom 8:35-39 ."},{"catchword":"verdrinken;","tekst":"Of, overstelpen, of overzwemmen."},{"catchword":"men zou hem ten enenmale verachten","tekst":"Hebr. verachtende zouden zij hem verachten; dat is, hij zou ze daarvoor geenszins kunnen krijgen; of men zou zijn goed niet aannemen om hem zijne liefde daarvoor te geven. Of, men zou het ten enenmale versmaden. Gelijk de liefde, die daar is tussen Christus en zijne kerk niet kan gescheiden worden, zijnde tezamen gebonden door den band van den Heiligen Geest, alzo kan ook de liefde en enige andere geestelijke gave voor geen geld gekocht worden, maar het is een vrij geschenk van God, die het geeft wien het hem belieft, Act 8:18-20 ; Rom 9:11-19."}],"8":[{"catchword":"Wij hebben","tekst":"De kerk van het Oude Testament spreekt hier tot Christus van een nieuwe opgaande kerk, die uit de heidenen zou beroepen worden, die dikwijls beloofd was, gelijk Psa 2:8 , en 72:8; Isa 11:10 ; welke zij hare zuster noemt, ten aanzien van de enigheid des geloofs. De Joodse kerk wordt de oudste dochter genoemd, omdat zij het eerst geroepen is tot de gemeenschap van het verbond. Zie Rom 9:4-5 ."},{"catchword":"kleine zuster,","tekst":"Aldus wordt de kerk, uit de heidenen bestaande, genoemd, niet omdat zij klein is ten aanzien van het getal der gelovigen, maar omdat zij later tot de kennis van God in Christus geroepen is; te weten in de volheid des tijds, Eph 1:10 , en Eph 2:6 ; want anders heeft deze kleinste of jongste zuster, die zolang onvruchtbaar geweest was, veel meer kinderen gebaard dan de oudste zuster."},{"catchword":"die nog geen","tekst":"Dat is, zij is nog niet manbaar: dat is, de tijd is nog niet gekomen dat de heidenen tot Christus zouden gebracht en aan Hem verhuwelijkt worden."},{"catchword":"als men van haar spreken zal","tekst":"Dat is, als hare bekering tot Christus gekomen zal zijn; wat zullen wij dan best doen tot haar hulp, aanwas en bevestiging in de waarheid en het geloof? Dit geeft te kennen en wijst aan het ambt en de liefde der ene particuliere kerk tot de andere, in het mededelen der gaven en in het bidden voor elkander. Zie Act 11:19 , Act 11:22-23 . Anders: als men tegen haar spreken zal; gelijk Num 21:5 , de Hebreeuwse letter Beth genomen wordt, waar aldus staat: Het volk sprak tegen God en tegen Mozes; alzo Psa 119:23 :Vorsten spraken tegen mij. Zo haast als zich een volk tot den Heere bekeert, stellen zich de goddelozen daartegen met woorden en werken."}],"9":[{"catchword":"Zo","tekst":"Eenigen nemen deze woorden voor de woorden van Christus; anderen voor de woorden der zusterkerken, wensende haren welstand."},{"catchword":"zij een","tekst":"Te weten de kerk uit de heidenen."},{"catchword":"muur is,","tekst":"Dat is, vast en sterk, in het geloof wel gegrond op het fondament van de leer der twaalf stammen Israëls en der apostelen. Zie Rev 21:14 , Rev 21:19 ."},{"catchword":"wij zullen","tekst":"Hierbij kan men verstaan de zusterkerken of de joodse kerken; want door de ledematen derzelve heeft de Heere de heidenen beroepen tot de gemeenschap der heiligen, inzonderheid bij name door de apostelen, die allen geboren Joden waren, die gelijk wijze bouwlieden het fondament van dit zilveren paleis gelegd hebben; 1Co 3:10 ."},{"catchword":"een paleis","tekst":"Of, kasteel, of sterke toren, gelijk men pleegt in of aan sterke muren der steden te bouwen."},{"catchword":"van zilver","tekst":"Dit betekent de zuiverheid, schoonheid en duurzaamheid van dit paleis, versierd zijnde met de gave van Gods Woord en Geest, op welke zij gebouwd zou worden tot ene woonstede Gods; Eph 2:22 ."},{"catchword":"op haar bouwen;","tekst":"Dat is, wij zullen haar meer en meer versterken en versieren, te weten door het woord en de predikatie van het heilige Evangelie."},{"catchword":"zij een deur is,","tekst":"Dat is, staat haar hart open om de predikatie van het goddelijke Woord tot binnen in haar hart te laten komen en dat met vreugde te ontvangen."},{"catchword":"rondom","tekst":"Of, versterken, besluiten, bevrijden. God de Heere belooft, Zec 2:5 , dat Hij een vurige muur rondom zijne kerk wil zijn."},{"catchword":"met cederen","tekst":"Dat is, met sterke palissaden en andere vastigheden. Cederhout, en de planken daarvan gemaakt, zijn schoon, sterk, duurzaam en goed van reuk. Van zulk hout was de tempel van Salomo getimmerd; 1Ki 6:15 . Door deze cederen planken mag men hier verstaan het Woord der waarheid, waartegen de poorten der hel niets vermogen; Mat 16:18 , en 2Co 13:8 ."}],"10":[{"catchword":"Ik ben een muur","tekst":"Dat is, ik ben opgewassen en sterk geworden in het geloof en de liefde aan Jezus Christus. Met deze woorden geeft de kleine zuster, als profeterende, te kennen hare bereidwilligheid om aan te nemen en te wassen in de leer van het heilige Evangelie. Anderen nemen dit voor de woorden der Joodse kerk, dankende den Heere Christus voor zijne genade, dat zij ene stad Gods geworden was, of tot de stad Gods was aangenomen. Of, omdat haar geloof sterk was als een muur."},{"catchword":"mijn borsten","tekst":"De zin dezer woorden is: Mijne borsten zijn hoog opgewassen, of volwassen, gelijk Eze 16:7-8 . Dat is, de kerkedienst is in mij bevestigd, genoegzaam om Christus' kinderen op te voeden, dezelve spijzende met de melk van Gods Woord; 1Pe 2:2 . De gelijkenis van torens betekent ook de sterkte, macht en heerlijkheid van de bediening van het heilige Evangelie en de openbare predikatie deszelven uit predikstoelen, of hoge plaatsen, om van allen gehoord te mogen worden. Want het Hebreeuwse woord migdal wordt ook genomen voor een houten predikstoel; Neh 8:5 ."},{"catchword":"Toen was ik","tekst":"Te weten toen ik dit antwoord kreeg van hetwelk vs.9. Dit spreekt de Bruid tot hare speelgenoten."},{"catchword":"Zijn ogen","tekst":"Te weten in Jezus Christus' ogen. Hiermede wil de Bruid zeggen dat het een onverdiende genade is, die zij van haren Bruidegom ontvangt, dat zij na langdurige zwarigheid en verdriet van Hem getroost wordt. Zie Isa 54:7-8 , enz. Zie ook Eph 2:12-13 , enz."},{"catchword":"als een,","tekst":"Wij zijn al tezamen vijanden Gods. Rom 5:10 . Te weten aangezien zijnde in onze verdorvenheid; maar wij gerechtvaardigd zijnde door het geloof, hebben vrede met God door onzen Heere Jezus Christus; Rom 5:1 ; Isa 32:17 . Het is alsof de Bruid hier zeide: De Bruidegom heeft zich mijn geloof en vlijt laten welgevallen, en Hij is derhalve met mij wel tevreden geweest. Anderen nemen die laatste woroden aldus: Met dit antwoord stelde ik mij gerust en was wel tevreden."}],"11":[{"catchword":"Sálomo","tekst":"Men kan deze woorden nemen als van Christus gesproken te zijn, of van de Bruid. Indien het de woorden van Christus zijn, zo is het ene gelijkenis tussen Salomo met zijnen wijngaard en tussen Christus met den zijnen. Salomo kon zelf geen acht hebben op zijne wijngaarden, [gelijk ook David niet had kunnen doen; 1Ch 27:27 ] maar hij stelde ambtlieden om op dezelve te passen, die hem een jaarlijksen penning daarvoor gaven, en zelf genoten zij enig voordeel voor hunne moeite; maar Christus, die altijd bij zijne kerk is, Mat 28:20 ; Rev 2:1 , slaat zelf zijn wijngaard gade, en derhalve komen al de vruchten daarvan Hem alleen toe. Indien dit de woorden der Bruid zijn, zo betekenen zij een grotere zorg en naarstigheid in haar nu dan in vorige tijden, toen zij bekende dat zij den wijnstok, dien zij had, dat is die haar toevertrouwd was, niet genoegzaam gehoed of in acht genomen had; Son 1:6 . Van de wijngaarden van Salomo, zie Ecc 2:4 ."},{"catchword":"te Baäl-Hamon;","tekst":"Anders: in een vruchtbare plaats. Hebreeuws, een meester of heer der menigte; dat is, een plaats, die vele vruchten draagt, verstaande hierbij òf de wereld, onder de veelheid van welker volkeren Christus de zijnen heeft, Psa 87:4 , òf de kerk wordt aldus genoemd, ten aanzien van de menigvuldige vruchten, die zij God geeft, of behoorde te geven, zijnde gesteld in een vruchtbare plaats, over welke God zijnen zegen gestort had. Zie Isa 5:1 ."},{"catchword":"hij gaf dezen","tekst":"Dat is, hij verhuurde, of verpachtte dezen wijngaard aan de pachters of wachters, opdat zij denzelven zouden bouwen, opdat hij vele vruchten zou voortbrengen."},{"catchword":"de hoeders,","tekst":"Door de hoeders of wachters moet men verstaan de profeten des Ouden en de apostelen mitsgaders hunne navolgers in het Nieuwe Testament; zie Mat 21:33 ; 1Co 3:9 ."},{"catchword":"duizend","tekst":"Duizend zilverlingen [of duizend zilveren sikkels ], hierbij betekenende de grote vruchtbaarheid van dezen wijngaard, die zoveel voor den eigenaar opbracht, behalve het voordeel of de winst van den pachter of van den huurder. Zie ook Isa 7:23 ."},{"catchword":"zilverlingen","tekst":"Van den prijs of waardij van den zilverling, zie Gen 20:16 , en Gen 23:15 ."}],"12":[{"catchword":"Mijn wijngaard,","tekst":"Dat is, mijne gemeente, gelijk Son 1:6 ; Isa 5:1 . Het zijn de woorden van den Bruidegom."},{"catchword":"dien ik heb,","tekst":"Dat is, die mijne zorg en opzicht bevolen en toevertrouwd is."},{"catchword":"is voor mijn","tekst":"Ik zelf pas er steeds op. Ik zelf draag zorg dat hij wel gebouwd worde: niet doende gelijk Salomo, die het op de wachters liet aankomen. Ik neem zelf mijn wijnberg en mijne schapen aan; Eze 34:11-12 , enz.; Joh 10:14 ; Rev 2:1 ."},{"catchword":"de duizend","tekst":"Alsof Hij zeide: Gij Salomo, zult uw volle pacht hebben te weten duizend zilverlingen, vs.11."},{"catchword":"maar tweehonderd","tekst":"Dat is, de arbeiders en opzichters van den wijngaard zullen ook het hunne hebben, elk naar evenredigheid van zijnen arbeid. Zie Mat 20:1-2 , enz.; 1Co 3:8 . Versta hierbij: Maar mij komen de vruchten van mijnen wijnstok geheel en al toe. Deze eer geven gaarne alle getrouwe kerkedienaars hunnen Heere Christus Jezus; wij mogen planten en natmaken, maar het is God alleen, die den wasdom geeft; 1Co 3:6-7 , en 1Co 15:10 ."}],"13":[{"catchword":"O gij bewoonster","tekst":"Hier spreekt Christus zijne Bruid aan, die in de hoven woont, dat is, die zich onthoudt in die plaatsen, waar kerken geplant zijn, in verscheidene landschappen en steden."},{"catchword":"der hoven","tekst":"Of, der gaarden, der luchtingen, der tuinen."},{"catchword":"de metgezellen","tekst":"Het schijnt dat men hier door de metgezellen moet verstaan de andere gelovige Christenen, die even dierbaar geloof verkregen hebben, 2Pe 1:1 , en de leer der kerken horen en volgen."},{"catchword":"Mij horen","tekst":"Te weten, uwe stem."}],"14":[{"catchword":"Kom haastelijk,","tekst":"Hebreeuws, vlied. In deze betekenis schijnt het hier niet genomen te worden, want de kerk bidt niet dat Christus van haar vliede of wijke; dat is de bede der Gadarenen. Mat 8:34 ; maar vlied betekent hier: kom zo haastiglijk tot ons, als iemand die gejaagd zijnde is vliedende. De Bruid bidt en begeert dat zij moge zien het einde van het rijk van Christus in deze wereld [daar Hij in zijne ledematen wordt vervolgd en gekweld] en tegelijk hare opneming in de hoge hemelen. Nu regeert Christus in het midden zijner vijanden, Psa 110:2 , en dat zal alzo voortaan duren, totdat Hij al zijne vijanden onder zijne voeten zal gebracht hebben, en totdat Hij het koninkrijk aan God zijnen Vader zal overgegeven hebben, 1Co 15:24-25 . Naar dezen dag verlangt de Bruid, en wenst dat hij haast moge komen, en dat de Bruidegom haar wil bijstaan, terwijl zij hier beneden in den strijd is. Son 2:17 , en dat Hij zijn laatste toekomst wil bespoedigen tot hare verlossing. Of, als men immers het woord Barach in zijn eigen betekenis zou willen behouden, namelijk voor vluchten of vlieden, zo moest dit de overzetting en de mening zijn: Vlied, mijn liefste...."},{"catchword":"Kom haastelijk,","tekst":"naar de bergen der specerijen; dat is, naar de hemelen, die hier genoemd worden de bergen der specerijen, tenaanzien van de hoogte, de vreugde en vermakelijkheid, die eeuwiglijk zal zijn aan de rechterhand Gods; Son 4:6 , wordt de hemel genoemd een mirreberg en een wierookbergje. Het is zoveel alsof de Bruid hier aldus sprak: Alhoewel het mij zeer lief zou zijn, dat Gij lichamelijk bij mij waart en steeds bleeft, zo beken ik nochtans dat het mij beter is dat Gij in den hemel zijt, om mij vandaar den Trooster, den Heiligen Geest, te zenden, en mij in uws Vaders huis een plaats te bereiden, opdat Gij mij eindelijk tot u neemt in de eeuwige zaligheid; Joh 14:2 , en Joh 16:7 ."},{"catchword":"een ree,","tekst":"Dat haastelijk heenloopt; dat is, haast u om tot ons te komen. Zie Son 2:8-9 , Son 2:17 . Gelijk dit Hooglied begonnen is met verlangen der Bruid naar haren Bruidegom, dat Hij haar kusse met de kussen zijns monds; alzo eindigt het met verlangen naar de tweede komst van Christus, gelijk Hij zijne kerk zal opnemen in de eeuwige vreugde. De Geest en de Bruid zeggen: kom, en wie het hoort, zegge: kom. Christus zelf zegt: Ik kom haastelijk, Amen. Ja kom, Heere Jezus. De genade onzes Heeren Jezus Christus zij met u allen; Rev 22:17 , Rev 22:20-21 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Oh that thou were unto me, as a Brother, [Heb. Who shall give thee unto me, as my brother! See the annotate. Deut.5.29. and Psal.14.7. This is a wish, and longing of the spouse, or of the godly, earnestly wishing and longing that they might live to see that day, wherein they might behold Christ, their Bridegroom (being become their brother, according to the flesh) manifested in the flesh. How greatly many of the people of God in the old Testament longed after this, see Mat 13:17. Joh.8.56. Heb 11:13.] sucking the breasts of my mother! [In a spiritual way here is to be understood by the mother, the universal church, the heavenly Jerusalem, which is the mother of us all, Galat,4.26. Christ sucked the same breasts, that we do or have sucked, when he did partake of the Sacraments of the Old and New Testament; as namely, of Circumcision, the Passover, Baptism, and the Lords Supper, so to fulfil all righteousness, Mat 3:15.] that I might find thee in the street, I would kiss thee, [kissing is a manifestation of love, sometimes also of honour, and obedience, see Psal.2.12.above, chap.1.2.] also they should not despise me. [those persons are despised, that either do, or at least are counted to do, something that is not honest, or not seemly and decent, Gen 38:23. 2 Sam.6.16. Isa 37:22. Therefore inasmuch as the spouse by kissing her bridegroom openly in the street; that is, by professing him publicly before men, and acknowledging him to be her Saviour, can do nothing unseemly or unbesitting, she cannot in that respect be justly despised or mocked by any godly or religious persons. Or these words (also they should not despise me) may be taken in this sence, as if the spouse had said, Mine enemies, that is, infidels or unbelievers would then no more deride mine hope and expectation, which I have concerning the Messia his coming in the flesh, as they were wont to do, when the promises of God tarried a while, and were not presently accomplished, as appeareth, Psal. 42. 11. And 2 Peter 3. 4.]"}],"2":[{"catchword":null,"tekst":"I would lead thee, [To wit, with reverence and with joy; desiring to despise or spread abroad Christ, that is the knowledge of Christ in the universal Church both of Jews and Gentiles, as followeth in the next words] I would bring thee into my mothers house, [that is, into the Church, or assemblies of believers, which are Gods houses and Temples, Gal. 4. 26. 2 Cor. 6. 16. Heb. 3. 6.] thou shouldest teach me; [the Church speaketh this unto Christ, see Deut. 18. 15. Isa. 2. 2, 3. Mich. 4. 1, 2. Joh. 1. 18. And 4. 15. And 15. 15. Heb. 1. 1.] I would give thee to drink of spiced wine, and of the juice of pomegranates. [that is, I would bring forth such good fruits to thy praise and glory, that should be as pleasing and acceptable unto thee, as wine mingled with spices, or hypocras, or the juice of pomegranates can be to any man. This pleasant drink is quite contrary to that cup, whereof mention is made, Rev. 17. 2, 4.]"}],"3":[{"catchword":null,"tekst":"Let his left hand be under mine head, and let his right hand imbrace me. [The Spouse considering her own weakness, beseecheth the Bridegroom to comfort and support her, to the end that she may find rest for her soul, above, chap. 2. 6. Oth. His left hand is, or lieth, under mine head, that is, in the mean while he taketh care for me, manifesting his strength in my weakness; he suporteth me in my greatest necessity, as a faithful husband assisteth his wife in her necessity and distress.]"}],"4":[{"catchword":null,"tekst":"I adjure you, ye daughters of Jerusalem, [That is, I charge you by oath] that ye stir not up that love, nor waken (it) until it please (the same) [The spouse feeling now the gracious comforts and consolations of her Bridegroom, wisheth that she may be, and constantly continue partaker thereof, forbidding her friends to disquiet or molest the same. See above, chap. 2. 7. And 3. 5. To wit, by heresies, schisms, or scandal. Some are of opinion, that the Bridegroom speaketh in this vers. Oth. Why, or to what end should ye stir up that love, or awake (it) before it please her? This question signifieth as much as if it were said, Stir not up this love, it will neither benefit you nor us, to vex and grieve your mother, the Church. See the like phrase above, chap. 2. 7. And 3. 5.]"}],"5":[{"catchword":null,"tekst":"Who is she that cometh up out of the wilderness, and leaneth lovingly upon her best-beloved? [These are the words of Bridegroom, admiring at the rising of a new church in a place, where there had been no assembly or congregation of believers before. Or, if these be the words of the ancient Church of believers (as some are of opinion they are) then it is an admiration of the daughters of Jerusalem at the growth, strength, steadfast, and unmoveable faith and patience of this Church, leaning, trusting, and relying onely upon the gracious defence and protection of her Bridegroom. Compare above, chap. 3. 6. By the wilderness in this place may be understood the Nations of this world, out of which the people of God are chosen and called, Joh. 15. Vers. 19. Oth. Joining her self unto, or associating her self with her best beloved. The Hebrew word that is used in the text is found no where else, but only here. By this phrase of leaning upon her best-beloved, is shewed the weakness and infirminity which the Spouse feeleth in her self, her strength consisting alone in Christ, her Bridegroom, upon whom she leaning and relying by faith, is strengthened in all fears, doubtings, temptations and dangers, as being by union and communion with him, made partaker of his graces and benefits, for he that is joined unto the Lord, is one spirit with him, 1 Cor. 6. 17. Which maketh him perfect, stablisheth, strengtheneth, and setleth him, 1 Pet. 5. 10.] I raised thee up under the apple-tree, [These are the words of the Spouse awaketh out of sleep by her earnest and fervent prayer, as Psal. 44. 24. And 68. 1. And 78. 65. Understand hereby the Apple &acirc;&euro;&ldquo;tree the tree of grace, whose shadow and fruits are pleasing and delightful unto the Spouse] there [to wit, under the apple-tree] thy mother brought thee forth with sorrow, there she brought (thee) forth with sorrow, (that) bare thee, [or, thus; There was thy mother in labour of thee, there was she in labour that bare thee. Thy mother, that is, the primitive Church, or assembly of believers, in whom Christ in a manner may be said to be born, to wit, by the preaching, professing, and practising of his Word, and by suffering for it. To bring forth Christ into the World by the preaching of the Gospel, is here typified and represented unto us under the comparison of a woman, being in travel, or in pain of child bearing is accompanied with much pain and sorrow, so it likewise when Christ is conceived and born in the hearts and minds of men, that they should believe in him. This is not done without much travel, care, pain and grief. See 2 Cor. 6. 4, 5. And 4. 8, to 11.]"}],"6":[{"catchword":null,"tekst":"Set me as a seal upon thine heart, as a seal upon thine arm. [In these words the Spouse prayeth unto Christ for assurance and confirmation of his love unto her, that she might be set and abide as a seal, in and upon his heart, and continue so for ever. This hath respect to the breastplate of the High Priest, wherein were graven the names of the twelve tribes of Israel, in or upon twelve precious stones, Exod. 28. 21, 29. At all times seals were made use of for confirmation of a thing that was written or promised; to the end, that the same might not be broken, see Nehem. 9. 38. Jerem. 22. 24. Hag. 2. 23. Mal. 3. Vers. 16. 2 Tim. 2. 19. The High Priest bare the names of the twelve tribes, not only upon his heart, but also upon his shoulders, for a memorial or remembrance of the children of Israel, See Isa. 49. 16. Some conceive, that by the heart here is meant the inward and intimate love of the Bridegroom, and by the arm the outward manifestation of his love, as Psal. 77. 16. And 86. 11.] for love [to wit, the spiritual love of the Spouse unto Christ, and in like manner the love of Christ unto his Church and elect] is strong as death: [The meaning is, As death by its power overcometh and conquereth even the strongest man that is, Psal. 89. 49. So the mutual love between us both is exceeding strong, and cannot be quenched in us by any enemy or adversity, no not by death itself] zeal is hard as a Grave: [Zeal or jealousy. This signifieth a vehement burning fervent love. This love or zeal is said to be hard as the grave, because it devoureth, and overcometh all difficulties, Gal. 5. 24. Colos. 3. 5. Even as death and grave do swallow up all things] the coals thereof are fiery coals, [here is spoken of the burning coals of love, that kindle and inflame the heart, and cannot be quenched] flames of the LORD. [that is, great mighty flames. Or flames that are kindled by the spirit of Christ, which may justly be called great, by reason of the strength of his love, and the powerful working of the Spirit in the hearts of the elect.]"}],"7":[{"catchword":null,"tekst":"Many waters would not be able to quench this love; yea the Rivers would not (be able to) drown [or overwhelm, overflow] it. [By waters and streams are oftentimes in scripture signified adversities, persecutions, temptations, which the Lord Christ sustained for our sakes, and whereby the faith, love, and patience of the children of God are exercised and tried, as Psal. 42. 8. And 69. 2. Isa. 8. 7, 8. And 59. 19. Dan. 9. 26. And 11. 22. Matth. 7. 27. See the Annotat 2 Sam. 22. On ver. 17. Compare Rom. 8. 35. To 39.] though a man should give all the substance of his house for this love, he would be utterly contemned. [Hebr. Contemning they would contemn him: that is, he would not be able to get it for the same: or his wealth or substance would not be accepted of, to give him this love for it, it would be utterly despised. As the love rated, being tied and fastened together by the band of the Spirit: So neither can love, nor any other spiritual gift giveth it to whomsoever he pleaseth, Acts 8. Vers. 18. 19, 20. Rom. 9. 11, to 19.]"}],"8":[{"catchword":null,"tekst":"We have a little Sister, which yet hath no breasts: [The Church of the old Testament speaketh here unto and gathered from among the heathens or Gentiles, which was often promised of old, as Psal. 2. 8. And 72. 8. Isai. 11. 10. Which Heathen Church she calleth her Sister, in respect of the unity of faith. The Jewish Church is called the eldest Daughter, because she was first called to the fellowship of the covenant. See Rom. 9. 4, 5. (A little Sister:) Thus the Church which consisteth of heathens or Gentiles is called, not because she is little in respect of the number of believers; but because she was called later to the knowledge of God in Christ; to wit, in the fullness of time, Ephes. 1. 10. And 2. 6. For otherwise this least or youngest sister, who had been so long barren and unfruitful, bare many more children, then the eldest sister did. (Which yet hath no breasts:) That is, she is not yet married, or, of age to marry; the time is not yet come, that the Gentiles should be brought unto Christ, and married to him] what shall we do for our Sister in that day, when she shall be spoken of [That is, when the time of her conversion unto Christ shell be come: what shall we then do or contribute towards her assistance, growth, and establishment in the truth and in the faith. It intimateth and sheweth the duty and office of love that one particular Church oweth unto another in the communication of gifts, and in praying for one another. See Acts 11 vers. 19, 22, 23. Oth. When she shall be spoken against, as the Hebrew letter Beth is taken, Numb. 21. 5. Where it is said, The people spake against God, and against Moseh. So Psal. 119. 25. Princes spake against me. As soon as a people convert themselves unto God, straight way the wicked set themselves against them both in words and works]"}],"9":[{"catchword":null,"tekst":"If she be a wall, we will build upon her a palace of silver: and if she be a door, we will compass her about with boards of Cedar. [Some take these words to be the words of Christ: others, to be the words of Sister Churches, wishing and desiring her Prosperity. (If she) To wit, the Church of the Gentiles, (be a wall) that is, firm and strong in the faith, being well grounded upon the foundation of the Doctrine of the twelve tribes of Israel, and of the Apostles. See Rev. 21. Vers. 14. 19. (we, & c) By the word we may be understood the Sister Churches, or Jewish Churches; for by the members thereof the Lord called the Gentiles to the fellowship and communion of Saints, especially and by name by the Holy Apostles, who were all of them Jews born, who as wise builders laid the foundation of this silver-palace, 1 Cor. 3. 10. (will build upon her) That is, we will more and more strengthen and adorn her; to wit, by the word and the preaching of the Gospel. (a palace) Or, castle, or, strong tower, as they are wont to build in or at strong walls of Cities, (of Silver:) This signifieth the pureness, beauty, and lastingness of this palace, being adorned with the gift of Gods Word and Spirit, whereupon she was be to built, for an habitation of God, Eph. 2. 22. (and if she be a door,) That is, if her heart standeth open, to let in the preaching of the Word of God into her heart, and to receive it with joy, (we will compass her about) Or, strengthen, inclose, fence her. The Lord promiseth, Zach. 25. That he will be a wall of fire round about his Church. (with planks, or, boards of Cedar;) That is, with strong palisadores , or others fences. Cedar wood, and the boards or planks that are made of it, are fair, strong, lasting, and of a good smell. Of such kind of wood was Salomons Temple built, 1 Kings 6. 15. By these boards or planks of Cedar may here be understood the word of truth, against which the gates of hell cannot prevail, Matth. 16. 18. And 2 Corinth. 13. 8.]"}],"10":[{"catchword":null,"tekst":"I am a wall: [That is, I am grown up, and become strong in faith, and in the love of Jesus Christ. In these words the little sister, doth (as in Prophetical and manner) shew her willingness and readiness to receive and entertain the Doctrine of the Gospel, and to grow and increase in it. Others take these words to be the Christ for his grace and mercy, in that she was become a City of God, or was received for the City of God: Or, because her faith was strong like a wall] and my breasts are like towers. [The meaning of these words is, My breasts are grown big, or fully grown, as Ezech. 16. 7, 8. That is, Church-government is settled in me, sufficiently to bring up children unto Christ, feeding them with the milk of the Word of God, 1 Pet. 2 vers. 2. The comparison of towers, signifieth also the strength, power, and glory of the administration of Gospel, and the public preaching and dispensing of it out of pulpits, or high places, to be heard by all. For the Hebrew word migdal is also taken for a pulpit of wood, Neh. 8. 5.] Then was 1 [To wit, when I got or obtained that answer, whereof or mention is made, vers. 9.] in his eyes [ To wit, in the eyes of Jesus Christ,] as one that findeth peace. [Hereby which she receiveth of her Bridegroom, that after long continued misery and affliction, she is comforted and relieved by him. See Isa. Chap. 54. V. 7, 8. Etc. See also Eph. 2. Vers. 12, 13, etc. The Spouse speaketh this unto her companions (as one that findeth peace) We are all of us enemies of God, Rom. 5. 10. To wit, being considered in our corruption, or state of nature: but being justified by faith, we have peace with God through our God through our Lord Jesus Christ, Rom. 5. 1. Isa. 32. 17. It is, as if the Spouse here had said, The Bridegroom hath accepted of my faith and diligence, and therefore he was well pleased with me. Others take the meaning of these last words to be this. I was satisfied with that answer, and was well pleased]"}],"11":[{"catchword":null,"tekst":"Salomon had a vineyard at Baal-Hamon: he gave this vineyard unto keepers, every one brought for the fruit thereof a thousand silverlings. [These words may be taken as spoken by Christ; or, by the Spouse. If they be the words of Christ, then it is a comparison between Salomon and his vineyard, and between Christ and his people. Salomon could not in his own person heed and attend his vineyards, (as neither David could do his, 1 Chron. 27. 27.) but he appointed officers to keep and attend the same, which paid a yearly rent for them, and themselves enjoyed some profit or benefit thereof for their labour: But Christ, who is always present with his Church, Matth. 28. 20. Revel. 2. Tendeth his own vineyard himself, and therefore all the fruits and profits thereof pertain to him alone. If these be the words of the Spouse, then they signify a greater care and diligence in her now, then in former time, when she confessed, that she had not sufficiently kept, or regarded the vineyard which she had, that is, which she entrusted with, above cha. 1. 6. Of Salomons vineyards, See Eccles. 2. 4. (at Baal Harmon:) Oth. In a fruitfulplace. Heb a master, or, Lord of the multitude, that is, a place that beareth many fruits; Understanding hereby either the World, among the multitude of whose nations Christ hath those that belong unto him, Or else the Church is so called, in respect of the manifold fruits which she yieldeth unto God, or ought to yield, being placed or planted in a fruitful soil, upon which God had poured forth his blessing; See Isai. 5. 1. (He gave this vineyard unto keepers) That is, he let out this vineyard, or put it to farm unto farmers or keepers, to dress and manure it, that it might bring forth much fruit. By the keepers, or dressers of the vineyard, are to be understood the Prophets of the Old, and The Apostles, with their succesors, in the New Testament. See Matth. 21. 33. 1 Cor. 3. 9. (Every one brought for the fruit thereof a thousand silverlings: Or, a thousand (sheckels) of silver;) Hereby signifying the great fruitfulness of his vineyard, which brought in, or yielded so much profit for the owner, besides the gain and profit of not be taken so here in this signification. For the Church prayeth not the Christ would Flee, or depart from her, that is the request of the Gadarenes, Matth. 8. 34. But flee signifieth here, come to us as quickly, as a man fleeth, that is pursued. The Spouse prayeth and requesteth, that she may see the end of the Kingdom of Christ in this world, [where he is persecuted and afflicted in his members) and likewise her taking up into the high heavens. Now Christ reigneth in the midst of his enemies, Psa. 110. 2. And that shall henceforth continue so, until he shall have delivered up the Kingdom unto God his Father, 1 Cor. 15. 24, 25. After this day doth the Spouse earnestly long; and wisheth that he may come quickly, and that the Bridegroom would assist her, while she is here below in the conflict or combat, above chap. 2. 17. And that he would hasten his last coming for her deliverance and redemption. Or if we will needs retain the word Barach in its own proper signification, then this must be the rendering and meaning of the words, Flee, my best beloved, .......to the mountains of spices; that is, to the heavens, which are called here the mountains of spices, in respect of the height, the fruit, and delight which shall be for ever at the right hand of God. Above chap. 4. 6. Heaven is called a mountain of myrrhe, and an hill of frankiscense. It is as much as if the Spouse here spake after this manner: Although it would be very pleasing and delightful unto me, to enjoy thy bodily presence continually with me, yet I confess that it is better for me, that thou be in heaven so send from thence the Comforter the Holy Ghost unto me, and to prepare a place for me in thy father&acirc;&euro;&trade;s house, that thou mayest at length receive me unto thyself into everlasting bliss, Job. 14. 2. And 16. 7.] and be thou like a roe, [Which runneth swiftly and speedily; That is, make haste to come to us. See above chap. 2. Vers. 8. 9, 17. As this high Song beginneth with an earnest longing of the Spouse after her Bridegroom, that would kiss with the kisses of his mouth: So it endeth and concludeth with an earnest and fervent longing after the second coming of Christ, when he shall receive and take up his Church into everlasting joy: The Spirit and Bride say, Come, and let him that heareth say, Come. Christ himself saith, I come quickly, Amen. Yea come Lord Jesus. The grace of our Lord Jesus Christ be with you all, Rev. C. 22. V. 17. 20, 21.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
