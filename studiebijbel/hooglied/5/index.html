hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Ik ben in Mijn hof gekomen, o Mijn zuster, o bruid! Ik heb Mijn mirre geplukt met Mijn specerij; Ik heb Mijn honigraten met Mijn honig gegeten; Ik heb Mijn wijn, alsook Mijn melk gedronken. Eet, vrienden! Drink, en word dronken, o liefsten!","2":"Ik sliep, maar mijn hart waakte, de stem van mijn Liefste, Die klopte, was: Doe Mij open, Mijn zuster, Mijn vriendin, Mijn duif, Mijn volmaakte! Want Mijn hoofd is vervuld met dauw, Mijn haarlokken met de druppels van de nacht.","3":"Ik heb mijn rok uitgetrokken, hoe zal ik hem weer aantrekken? Ik heb mijn voeten gewassen, hoe zal ik ze weer bezoedelen?","4":"Mijn Liefste trok Zijn hand door het gat van de deur; en mijn binnenste raakte ontroerd om Zijnentwil.","5":"Ik stond op om mijn Liefste open te doen; en mijn handen droppen, terwijl ze van mirre druppen, en mijn vingers van vloeiende mirre, op de handvaten van het slot.","6":"Ik deed mijn Liefste open, maar mijn Liefste was geweken, Hij was doorgegaan; mijn ziel bezweek vanwege Zijn spreken; ik zocht Hem, maar ik vond Hem niet, ik riep Hem, maar Hij antwoordde mij niet.","7":"De wachters die in de stad rondgingen, vonden mij, zij sloegen mij, zij verwondden mij; de wachters op de muren namen mijn sluier van mij af.","8":"Ik bezweer u, dochters van Jeruzalem! Als u mijn Liefste vindt, wat zult u Hem zeggen? Dat ik ziek ben van liefde.","9":"Wat is uw Liefste meer dan een ander liefste, o u, schoonste onder de vrouwen! Wat is uw Liefste meer dan een ander liefste, dat u ons zo bezworen hebt!","10":"Mijn Liefste is blank en rood, Hij draagt de banier boven tienduizend.","11":"Zijn hoofd is van het fijnste goud, van het dichtste goud; Zijn haarlokken zijn gekruld, zwart als een raaf.","12":"Zijn ogen zijn als die van duiven bij de waterstromen, gewassen met melk, passend gezet als in ringen.","13":"Zijn wangen zijn als een bed van specerijen, als welriekende torentjes; Zijn lippen zijn als lelies, druppend van vloeiende mirre.","14":"Zijn handen zijn als gouden ringen, gevuld met turkoois; Zijn buik is als blinkend ivoor, overtrokken met saffieren.","15":"Zijn schenkels zijn als marmeren pilaren, gegrond op voeten van het dichtste goud; Zijn gestalte is als de Libanon, uitverkoren als de ceders.","16":"Zijn gehemelte is enkel zoetigheid, en al wat aan Hem is, is geheel begeerlijk. Zulk een is mijn Liefste; ja, zulk een is mijn Vriend, dochters van Jeruzalem!"},"SV":{"1":"Ik ben in Mijn hof gekomen, o Mijn zuster, o bruid! Ik heb Mijn mirre geplukt met Mijn specerij; Ik heb Mijn honigraten met Mijn honig gegeten; Ik heb Mijn wijn, mitsgaders Mijn melk gedronken. Eet, vrienden! drinkt, en wordt dronken, o liefsten!","2":"Ik sliep, maar mijn hart waakte, de stem mijns Liefsten, Die klopte, was: Doe Mij open, Mijn zuster, Mijn vriendin, Mijn duive, Mijn volmaakte! want Mijn hoofd is vervuld met dauw, Mijn haarlokken met nachtdruppen.","3":"Ik heb mijn rok uitgetogen, hoe zal ik hem weder aantrekken? Ik heb mijn voeten gewassen, hoe zal ik ze weder bezoedelen?","4":"Mijn Liefste trok Zijn hand van het gat *der* *deur*; en mijn ingewand werd ontroerd om Zijnentwil.","5":"Ik stond op, om mijn Liefste open te doen; en mijn handen drupten *van* mirre, en mijn vingers *van* vloeiende mirre, op de handvaten des slots.","6":"Ik deed mijn Liefste open, maar mijn Liefste was geweken, Hij was doorgegaan; mijn ziel ging uit vanwege Zijn spreken; ik zocht Hem, maar ik vond Hem niet, ik riep Hem, doch Hij antwoordde mij niet.","7":"De wachters, die in de stad omgingen, vonden mij, zij sloegen mij, zij verwondden mij; de wachters op de muren namen mijn sluier van mij.","8":"Ik bezweer u, gij dochters van Jeruzalem! indien gij mijn Liefste vindt, wat zult gij Hem aanzeggen? Dat ik krank ben van liefde.","9":"Wat is uw Liefste meer dan een *ander* liefste, o gij schoonste onder de vrouwen! wat is uw Liefste meer dan een *ander* liefste, dat gij ons zo bezworen hebt!","10":"Mijn Liefste is blank en rood, Hij draagt de banier boven tien duizend.","11":"Zijn hoofd is van het fijnste goud, van het dichtste goud; Zijn haarlokken zijn gekruld, zwart als een raaf.","12":"Zijn ogen zijn als der duiven bij de waterstromen, met melk gewassen, staande *als* in kasjes *der* *ringen*.","13":"Zijn wangen zijn als een bed van specerijen, *als* welriekende torentjes; Zijn lippen zijn *als* leliën, druppende van vloeiende mirre.","14":"Zijn handen zijn *als* gouden ringen, gevuld met turkoois; Zijn buik is als blinkend elpenbeen, overtogen met saffieren.","15":"Zijn schenkelen zijn *als* marmeren pilaren, gegrond op voeten van het dichtste goud; Zijn gestalte is als de Libanon, uitverkoren als de cederen.","16":"Zijn gehemelte is enkel zoetigheid, en al wat aan Hem is, is gans begeerlijk. Zulk een is mijn Liefste; ja, zulk een is mijn Vriend, gij dochters van Jeruzalem!"},"KJV":{"1":"I am come into my garden, my sister, *my* spouse: I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk: eat, O friends; drink, yea, drink abundantly, O beloved.","2":"I sleep, but my heart waketh: *it is* the voice of my beloved that knocketh, *saying*, Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, *and* my locks with the drops of the night.","3":"I have put off my coat; how shall I put it on? I have washed my feet; how shall I defile","4":"My beloved put in his hand by the hole *of the door*, and my bowels were moved","5":"I rose up to open to my beloved; and my hands dropped *with* myrrh, and my fingers *with* sweet smelling myrrh, upon the handles of the lock.","6":"I opened to my beloved; but my beloved had withdrawn himself, *and* was gone: my soul failed when he spake: I sought him, but I could not find him; I called him, but he gave me no answer.","7":"The watchmen that went about the city found me, they smote me, they wounded me; the keepers of the walls took away my veil","8":"I charge you, O daughters of Jerusalem, if ye find my beloved, that ye tell him, that I *am* sick of love.","9":"What *is* thy beloved more than *another* beloved, O thou fairest among women? what *is* thy beloved more than *another* beloved, that thou dost so charge","10":"My beloved *is* white and ruddy, the chiefest among ten thousand.","11":"His head *is as* the most fine gold, his locks *are* bushy, *and* black as a raven.","12":"His eyes *are* as *the eyes* of doves by the rivers of waters, washed with milk, *and* fitly set.","13":"His cheeks *are* as a bed of spices, *as* sweet flowers: his lips *like* lilies, dropping sweet smelling myrrh.","14":"His hands *are as* gold rings set with the beryl: his belly *is as* bright ivory overlaid *with* sapphires.","15":"His legs *are as* pillars of marble, set upon sockets of fine gold: his countenance *is* as Lebanon, excellent as the cedars.","16":"His mouth *is* most sweet: yea, he *is* altogether lovely. This *is* my beloved, and this *is* my friend, O daughters of Jerusalem."}},"tsk":{"1":[{"kopje":"gekomen","refs":["Hoogl 4:16","Hoogl 6:2","Hoogl 6:11","Hoogl 8:13","Jes 5:1","Jes 51:3","Jes 58:11","Jes 61:11","Joh 14:21-23"]},{"kopje":"Mijn zuster"," pan>, <span class=\"wl\" data-l=\"L4\" data-code=\"H4390\">gevuld</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4390\">met</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8658\">turkoois</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H8658\">Zijn</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4578\">buik</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4578\">is</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6247\">als</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6247\">blinkend</span> ivoor, <span class=\"wl\" data-l=\"L8\" data-code=\"H5968\">overtrokken</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5968\">met</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5601\">saffieren</span>.","15":"<span class=\"wl\" data-l=\"L1\" data-code=\"H7785\">Zijn</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7785\">schenkels</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7785\">zijn</span> als <span class=\"wl\" data-l=\"L2\" data-code=\"H8336\">marmeren</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5982\">pilaren</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3245\">gegrond</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3245\">op</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H134\">voeten</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H134\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6337\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6337\">dichtste</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6337\">goud</span>; <span class=\"wl\" data-l=\"L6\" data-code=\"H6337\">Zijn</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4758\">gestalte</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4758\">is</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3844\">als</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3844\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3844\">Libanon</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H977\">uitverkoren</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H730\">als</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H730\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H730\">ceders</span>.","16":"<span class=\"wl\" data-l=\"L1\" data-code=\"H2441\">Zijn</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2441\">gehemelte</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2441\">is</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4477\">enkel</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4477\">zoetigheid</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H4261\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4261\">al</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4261\">wat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4261\">aan</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4261\">Hem</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4261\">is</span>, is geheel <span class=\"wl\" data-l=\"L3\" data-code=\"H4261\">begeerlijk</span>. <span class=\"wl\" data-l=\"L4\" data-code=\"H1730\">Zulk</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1730\">een</span> is <span class=\"wl\" data-l=\"L4\" data-code=\"H1730\">mijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1730\">Liefste</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H7453\">ja</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H7453\">zulk</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7453\">een</span> is <span class=\"wl\" data-l=\"L5\" data-code=\"H7453\">mijn</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7453\">Vriend</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H1323\">dochters</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1323\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3389\">Jeruzalem</span>!"},"koppeling_kjv":{"1":"I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into my <span class=\"wl wl-kjv\" data-code=\"H1588\">garden,</span> my <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> my <span class=\"wl wl-kjv\" data-code=\"H3618\">spouse:</span> I have <span class=\"wl wl-kjv\" data-code=\"H717\">gathered</span> my <span class=\"wl wl-kjv\" data-code=\"H4753\">myrrh</span> with my <span class=\"wl wl-kjv\" data-code=\"H1313\">spice;</span> I have <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> my <span class=\"wl wl-kjv\" data-code=\"H3293\">honeycomb</span> with my <span class=\"wl wl-kjv\" data-code=\"H1706\">honey;</span> I have <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> my <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> with my <span class=\"wl wl-kjv\" data-code=\"H2461\">milk:</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> O <span class=\"wl wl-kjv\" data-code=\"H7453\">friends;</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> yea, drink <span class=\"wl wl-kjv\" data-code=\"H7937\">abundantly,</span> O beloved.","2":"I <span class=\"wl wl-kjv\" data-code=\"H3463\">sleep,</span> but my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H5782\">waketh:</span> it is the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> that <span class=\"wl wl-kjv\" data-code=\"H1849\">knocketh,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H6605\">Open</span> to me, my <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> my <span class=\"wl wl-kjv\" data-code=\"H7474\">love,</span> my <span class=\"wl wl-kjv\" data-code=\"H3123\">dove,</span> my <span class=\"wl wl-kjv\" data-code=\"H8535\">undefiled:</span> for my <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> is <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H2919\">dew,</span> and my <span class=\"wl wl-kjv\" data-code=\"H6977\">locks</span> with the <span class=\"wl wl-kjv\" data-code=\"H7447\">drops</span> of the night.","3":"I have put <span class=\"wl wl-kjv\" data-code=\"H6584\">off</span> my <span class=\"wl wl-kjv\" data-code=\"H3801\">coat;</span> <span class=\"wl wl-kjv\" data-code=\"H349\">how</span> shall I put it <span class=\"wl wl-kjv\" data-code=\"H3847\">on?</span> I have <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> my <span class=\"wl wl-kjv\" data-code=\"H7272\">feet;</span> <span class=\"wl wl-kjv\" data-code=\"H349\">how</span> shall I defile","4":"My <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> put <span class=\"wl wl-kjv\" data-code=\"H7971\">in</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H4480\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H2356\">hole</span> of the door, and my <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> were moved","5":"I rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> to my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved;</span> and my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> <span class=\"wl wl-kjv\" data-code=\"H5197\">dropped</span> with <span class=\"wl wl-kjv\" data-code=\"H4753\">myrrh,</span> and my <span class=\"wl wl-kjv\" data-code=\"H676\">fingers</span> with sweet <span class=\"wl wl-kjv\" data-code=\"H5674\">smelling</span> <span class=\"wl wl-kjv\" data-code=\"H4753\">myrrh,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3709\">handles</span> of the lock.","6":"I <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> to my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved;</span> but my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> had <span class=\"wl wl-kjv\" data-code=\"H2559\">withdrawn</span> himself, and was <span class=\"wl wl-kjv\" data-code=\"H5674\">gone:</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">failed</span> when he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake:</span> I <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> him, but I could not <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> him; I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him, but he gave me no answer.","7":"The <span class=\"wl wl-kjv\" data-code=\"H8104\">watchmen</span> that went <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> me, they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> me, they <span class=\"wl wl-kjv\" data-code=\"H6481\">wounded</span> me; the <span class=\"wl wl-kjv\" data-code=\"H8104\">keepers</span> of the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> took <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> my veil","8":"I <span class=\"wl wl-kjv\" data-code=\"H7650\">charge</span> you, O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> if ye <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> that ye <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> him, that I am <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> of love.","9":"What is thy <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> more than another <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> O thou <span class=\"wl wl-kjv\" data-code=\"H3303\">fairest</span> among <span class=\"wl wl-kjv\" data-code=\"H802\">women?</span> what is thy <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> more than another <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> that <span class=\"wl wl-kjv\" data-code=\"H3602\">thou</span> dost so charge","10":"My <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> is <span class=\"wl wl-kjv\" data-code=\"H6703\">white</span> and <span class=\"wl wl-kjv\" data-code=\"H122\">ruddy,</span> the <span class=\"wl wl-kjv\" data-code=\"H1713\">chiefest</span> among ten thousand.","11":"His <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> is as the <span class=\"wl wl-kjv\" data-code=\"H3800\">most</span> fine <span class=\"wl wl-kjv\" data-code=\"H6337\">gold,</span> his <span class=\"wl wl-kjv\" data-code=\"H6977\">locks</span> are <span class=\"wl wl-kjv\" data-code=\"H8534\">bushy,</span> and <span class=\"wl wl-kjv\" data-code=\"H7838\">black</span> as a raven.","12":"His <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> are as the eyes of <span class=\"wl wl-kjv\" data-code=\"H3123\">doves</span> by the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk,</span> and fitly <span class=\"wl wl-kjv\" data-code=\"H3427\">set.</span>","13":"His <span class=\"wl wl-kjv\" data-code=\"H3895\">cheeks</span> are as a <span class=\"wl wl-kjv\" data-code=\"H6170\">bed</span> of <span class=\"wl wl-kjv\" data-code=\"H1314\">spices,</span> as <span class=\"wl wl-kjv\" data-code=\"H4840\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H4026\">flowers:</span> his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> like <span class=\"wl wl-kjv\" data-code=\"H7799\">lilies,</span> <span class=\"wl wl-kjv\" data-code=\"H5197\">dropping</span> sweet <span class=\"wl wl-kjv\" data-code=\"H5674\">smelling</span> myrrh.","14":"His <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> are as <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H1550\">rings</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">set</span> with the <span class=\"wl wl-kjv\" data-code=\"H8658\">beryl:</span> his <span class=\"wl wl-kjv\" data-code=\"H4578\">belly</span> is as <span class=\"wl wl-kjv\" data-code=\"H6247\">bright</span> <span class=\"wl wl-kjv\" data-code=\"H8127\">ivory</span> <span class=\"wl wl-kjv\" data-code=\"H5968\">overlaid</span> with sapphires.","15":"His <span class=\"wl wl-kjv\" data-code=\"H7785\">legs</span> are as <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> of <span class=\"wl wl-kjv\" data-code=\"H8336\">marble,</span> <span class=\"wl wl-kjv\" data-code=\"H3245\">set</span> upon <span class=\"wl wl-kjv\" data-code=\"H134\">sockets</span> of fine <span class=\"wl wl-kjv\" data-code=\"H6337\">gold:</span> his <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance</span> is as <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> <span class=\"wl wl-kjv\" data-code=\"H977\">excellent</span> as the cedars.","16":"His <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> is most <span class=\"wl wl-kjv\" data-code=\"H4477\">sweet:</span> yea, he is altogether <span class=\"wl wl-kjv\" data-code=\"H4261\">lovely.</span> This is my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> and this is my <span class=\"wl wl-kjv\" data-code=\"H7453\">friend,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of Jerusalem."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
