zij verwondden mij; de wachters op de muren namen mijn sluier van mij af.","8":"Ik bezweer u, dochters van Jeruzalem! Als u mijn Liefste vindt, wat zult u Hem zeggen? Dat ik ziek ben van liefde.","9":"Wat is uw Liefste meer dan een ander liefste, o u, schoonste onder de vrouwen! Wat is uw Liefste meer dan een ander liefste, dat u ons zo bezworen hebt!","10":"Mijn Liefste is blank en rood, Hij draagt de banier boven tienduizend.","11":"Zijn hoofd is van het fijnste goud, van het dichtste goud; Zijn haarlokken zijn gekruld, zwart als een raaf.","12":"Zijn ogen zijn als die van duiven bij de waterstromen, gewassen met melk, passend gezet als in ringen.","13":"Zijn wangen zijn als een bed van specerijen, als welriekende torentjes; Zijn lippen zijn als lelies, druppend van vloeiende mirre.","14":"Zijn handen zijn als gouden ringen, gevuld met turkoois; Zijn buik is als blinkend ivoor, overtrokken met saffieren.","15":"Zijn schenkels zijn als marmeren pilaren, gegrond op voeten van het dichtste goud; Zijn gestalte is als de Libanon, uitverkoren als de ceders.","16":"Zijn gehemelte is enkel zoetigheid, en al wat aan Hem is, is geheel begeerlijk. Zulk een is mijn Liefste; ja, zulk een is mijn Vriend, dochters van Jeruzalem!"},"SV":{"1":"Ik ben in Mijn hof gekomen, o Mijn zuster, o bruid! Ik heb Mijn mirre geplukt met Mijn specerij; Ik heb Mijn honigraten met Mijn honig gegeten; Ik heb Mijn wijn, mitsgaders Mijn melk gedronken. Eet, vrienden! drinkt, en wordt dronken, o liefsten!","2":"Ik sliep, maar mijn hart waakte, de stem mijns Liefsten, Die klopte, was: Doe Mij open, Mijn zuster, Mijn vriendin, Mijn duive, Mijn volmaakte! want Mijn hoofd is vervuld met dauw, Mijn haarlokken met nachtdruppen.","3":"Ik heb mijn rok uitgetogen, hoe zal ik hem weder aantrekken? Ik heb mijn voeten gewassen, hoe zal ik ze weder bezoedelen?","4":"Mijn Liefste trok Zijn hand van het gat *der* *deur*; en mijn ingewand werd ontroerd om Zijnentwil.","5":"Ik stond op, om mijn Liefste open te doen; en mijn handen drupten *van* mirre, en mijn vingers *van* vloeiende mirre, op de handvaten des slots.","6":"Ik deed mijn Liefste open, maar mijn Liefste was geweken, Hij was doorgegaan; mijn ziel ging uit vanwege Zijn spreken; ik zocht Hem, maar ik vond Hem niet, ik riep Hem, doch Hij antwoordde mij niet.","7":"De wachters, die in de stad omgingen, vonden mij, zij sloegen mij, zij verwondden mij; de wachters op de muren namen mijn sluier van mij.","8":"Ik bezweer u, gij dochters van Jeruzalem! indien gij mijn Liefste vindt, wat zult gij Hem aanzeggen? Dat ik krank ben van liefde.","9":"Wat is uw Liefste meer dan een *ander* liefste, o gij schoonste onder de vrouwen! wat is uw Liefste meer dan een *ander* liefste, dat gij ons zo bezworen hebt!","10":"Mijn Liefste is blank en rood, Hij draagt de banier boven tien duizend.","11":"Zijn hoofd is van het fijnste goud, van het dichtste goud; Zijn haarlokken zijn gekruld, zwart als een raaf.","12":"Zijn ogen zijn als der duiven bij de waterstromen, met melk gewassen, staande *als* in kasjes *der* *ringen*.","13":"Zijn wangen zijn als een bed van specerijen, *als* welriekende torentjes; Zijn lippen zijn *als* leliën, druppende van vloeiende mirre.","14":"Zijn handen zijn *als* gouden ringen, gevuld met turkoois; Zijn buik is als blinkend elpenbeen, overtogen met saffieren.","15":"Zijn schenkelen zijn *als* marmeren pilaren, gegrond op voeten van het dichtste goud; Zijn gestalte is als de Libanon, uitverkoren als de cederen.","16":"Zijn gehemelte is enkel zoetigheid, en al wat aan Hem is, is gans begeerlijk. Zulk een is mijn Liefste; ja, zulk een is mijn Vriend, gij dochters van Jeruzalem!"},"KJV":{"1":"I am come into my garden, my sister, *my* spouse: I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk: eat, O friends; drink, yea, drink abundantly, O beloved.","2":"I sleep, but my heart waketh: *it is* the voice of my beloved that knocketh, *saying*, Open to me, my sister, my love, my dove, my undefiled: for my head is filled with dew, *and* my locks with the drops of the night.","3":"I have put off my coat; how shall I put it on? I have washed my feet; how shall I defile","4":"My beloved put in his hand by the hole *of the door*, and my bowels were moved","5":"I rose up to open to my beloved; and my hands dropped *with* myrrh, and my fingers *with* sweet smelling myrrh, upon the handles of the lock.","6":"I opened to my beloved; but my beloved had withdrawn himself, *and* was gone: my soul failed when he spake: I sought him, but I could not find him; I called him, but he gave me no answer.","7":"The watchmen that went about the city found me, they smote me, they wounded me; the keepers of the walls took away my veil","8":"I charge you, O daughters of Jerusalem, if ye find my beloved, that ye tell him, that I *am* sick of love.","9":"What *is* thy beloved more than *another* beloved, O thou fairest among women? what *is* thy beloved more than *another* beloved, that thou dost so charge","10":"My beloved *is* white and ruddy, the chiefest among ten thousand.","11":"His head *is as* the most fine gold, his locks *are* bushy, *and* black as a raven.","12":"His eyes *are* as *the eyes* of doves by the rivers of waters, washed with milk, *and* fitly set.","13":"His cheeks *are* as a bed of spices, *as* sweet flowers: his lips *like* lilies, dropping sweet smelling myrrh.","14":"His hands *are as* gold rings set with the beryl: his belly *is as* bright ivory overlaid *with* sapphires.","15":"His legs *are as* pillars of marble, set upon sockets of fine gold: his countenance *is* as Lebanon, excellent as the cedars.","16":"His mouth *is* most sweet: yea, he *is* altogether lovely. This *is* my beloved, and this *is* my friend, O daughters of Jerusalem."}},"tsk":{"1":[{"kopje":"gekomen","refs":["Hoogl 4:16","Hoogl 6:2","Hoogl 6:11","Hoogl 8:13","Jes 5:1","Jes 51:3","Jes 58:11","Jes 61:11","Joh 14:21-23"]},{"kopje":"Mijn zuster","re 0\">beloved</span> is <span class=\"wl wl-kjv\" data-code=\"H6703\">white</span> and <span class=\"wl wl-kjv\" data-code=\"H122\">ruddy,</span> the <span class=\"wl wl-kjv\" data-code=\"H1713\">chiefest</span> among ten thousand.","11":"His <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> is as the <span class=\"wl wl-kjv\" data-code=\"H3800\">most</span> fine <span class=\"wl wl-kjv\" data-code=\"H6337\">gold,</span> his <span class=\"wl wl-kjv\" data-code=\"H6977\">locks</span> are <span class=\"wl wl-kjv\" data-code=\"H8534\">bushy,</span> and <span class=\"wl wl-kjv\" data-code=\"H7838\">black</span> as a raven.","12":"His <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> are as the eyes of <span class=\"wl wl-kjv\" data-code=\"H3123\">doves</span> by the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk,</span> and fitly <span class=\"wl wl-kjv\" data-code=\"H3427\">set.</span>","13":"His <span class=\"wl wl-kjv\" data-code=\"H3895\">cheeks</span> are as a <span class=\"wl wl-kjv\" data-code=\"H6170\">bed</span> of <span class=\"wl wl-kjv\" data-code=\"H1314\">spices,</span> as <span class=\"wl wl-kjv\" data-code=\"H4840\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H4026\">flowers:</span> his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> like <span class=\"wl wl-kjv\" data-code=\"H7799\">lilies,</span> <span class=\"wl wl-kjv\" data-code=\"H5197\">dropping</span> sweet <span class=\"wl wl-kjv\" data-code=\"H5674\">smelling</span> myrrh.","14":"His <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> are as <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H1550\">rings</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">set</span> with the <span class=\"wl wl-kjv\" data-code=\"H8658\">beryl:</span> his <span class=\"wl wl-kjv\" data-code=\"H4578\">belly</span> is as <span class=\"wl wl-kjv\" data-code=\"H6247\">bright</span> <span class=\"wl wl-kjv\" data-code=\"H8127\">ivory</span> <span class=\"wl wl-kjv\" data-code=\"H5968\">overlaid</span> with sapphires.","15":"His <span class=\"wl wl-kjv\" data-code=\"H7785\">legs</span> are as <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> of <span class=\"wl wl-kjv\" data-code=\"H8336\">marble,</span> <span class=\"wl wl-kjv\" data-code=\"H3245\">set</span> upon <span class=\"wl wl-kjv\" data-code=\"H134\">sockets</span> of fine <span class=\"wl wl-kjv\" data-code=\"H6337\">gold:</span> his <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance</span> is as <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> <span class=\"wl wl-kjv\" data-code=\"H977\">excellent</span> as the cedars.","16":"His <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> is most <span class=\"wl wl-kjv\" data-code=\"H4477\">sweet:</span> yea, he is altogether <span class=\"wl wl-kjv\" data-code=\"H4261\">lovely.</span> This is my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> and this is my <span class=\"wl wl-kjv\" data-code=\"H7453\">friend,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of Jerusalem."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in Mijn hof","tekst":"Dat is, in mijne gemeente. Hier antwoordt de Bruidegom op het verzoek der Bruid, Son 4:16 . Hij is vaardig om te doen de begeerte dergenen, die Hem vrezen, Psa 145:19 . Zie ook Exo 20:24 ."},{"catchword":"o Mijn zuster,","tekst":"Zie boven Son 4:8-9 ."},{"catchword":"Ik heb","tekst":"Dat is, Ik heb genoten de gebeden en dankzeggingen der gelovigen, mitsgaders de goede en lieflijke vruchten der goede werken, die Ik in u teweeg gebracht heb door de krachtige werking des Heiligen Geestes. Van de kostelijkheid der mirre, zie boven Son 1:13 ."},{"catchword":"Mijn mirre","tekst":"Merk hier aan dat Christus al deze gerechten noemt zijne gerechten; Hij zegt: mijne mirre, mijn specerij, enz. want zonder Hem kunnen wij niets doen, Joh 1:16 , en Joh 15:5 , en 1Co 4:7 ; Act 3:18 ."},{"catchword":"honigraten","tekst":"Het woord Gods en de leer, mitsgaders de gehoorzaamheid deszelven, en het gebruik der heilige sacramenten, worden vergeleken bij spijs, honigraten, wijn en melk, Psa 19:11 , en Psa 119:103 ; Isa 55:1 ; Joh 4:34 , en 1Pe 2:2 . Omdat, gelijk honig, wijn en melk lieflijk en bekwaam zijn tot voedsel des lichaams, alzo zijn ook de voorgemelde zaken lieflijk en bekwaam om de ziel te laven en te verkwikken."},{"catchword":"gegeten;","tekst":"Dat is, Ik heb een lust en welgevallen aan uw goede vruchten in het voorgaande verhaal en goede werken. Daarentegen worden de kwade vruchten der zondaren genoemd vergiftige wijndruiven, die bittere beziën hebben; Deu 32:32-33 ."},{"catchword":"Eet,","tekst":"Hier nodigt de Bruidegom Christus zijne vrienden, de engelen en alle gelovige mensen, dat zij zich met Hem verheugen vanwege de schone en lieflijke vruchten, dat is de gehoorzaamheid, zijner kerk op aarde; zie Luk 2:13-14 , en Luk 15:7 , Luk 15:10 ."},{"catchword":"vrienden","tekst":"Die zijn vrienden van Christus, die daar doen den wil van zijn hemelsen Vader; Joh 15:14 ."},{"catchword":"wordt dronken,","tekst":"Zie de aantekening Gen 43:34 ; wees dronken, is hier te zeggen: wees vervuld met liefde tot mij en tot elkander, of wees overvloediglijk verzaad met geestelijke vreugde, die daar blijft tot in het eeuwige leven. Zie Pro 9:5 ; Isa 25:6 , en Isa 55:1-2 ."}],"2":[{"catchword":"Ik sliep,","tekst":"Hier wordt aangewezen dat de Bruid, of enige lidmaten der kerk, nadat zij wel gegeten en gedronken hebben, dat is overvloediglijk de weldaden van Christus genoten hebben, somtijds in slaap of sluimer vallen; dat is, traag en slap in ijver en goede werken worden, en in vleselijke gerustheid en zorgeloosheid vervallen. Zie Mat 25:5 ; Rom 13:11 ; 1Th 5:6-7 ."},{"catchword":"maar mijn hart","tekst":"Dat is, ik vergat evenwel mijnen Bruidegom niet, maar hield Hem steeds in mijn hart. Versta hier door het hart den inwendigen mens, of den wedergeboren mens, die gesteld wordt tegen het vlees, of den uiterlijken mens; Rom 2:28-29 ; zie ook Mat 26:41 ; Gal 5:17 ."},{"catchword":"klopte,","tekst":"De Bruid vertelt hier de liefde en zorg van haren Bruidegom, die haar niet wil laten rusten in het bed van het wereldse gemak. Christus klopt aan de deur van ons hart door zijn Woord, door zijn Geest en door kruis of kastijding, Rev 3:20 ."},{"catchword":"Doe Mij open,","tekst":"Of, open mij; te weten de deur van uw hart; sta op van den slaap der zonde, laat mij in uw hart wonen door het geloof, hetzelve opwekkende."},{"catchword":"Mijn zuster,","tekst":"Deze lieflijke namen, die Christus zijne Bruid hier geeft [zij nog zijnde in hare zwakheid] geven te kennen zijn uitnemende genegenheid en liefde tot haar, haar beminnende, onaangezien zij nog in dit zondige vlees leeft en wandelt, haar hare zonden en onvolmaaktheden niet toerekenende."},{"catchword":"Mijn hoofd is vervuld","tekst":"Dat is, Ik heb veel ongemak geleden. Hiermede wordt te kennen gegeven dat Christus veel lijden en veel zwarigheid zou uitstaan om zijne Bruid te verlossen en haar van hare zonden te reinigen. Want nat te zijn van den dauw des hemels is groot ongemak, Gen 31:40 , en het beduidt hier ellende en lijden, gelijk Dan 4:25 ; gelijk ook de regen als men niet overdekt is. Alzo betekenen ook droppelen inwatering, dat is kwellingen of tegenspoeden, Amo 6:11 . Anderen nemen deze woorden aldus: Gelijk de dauw en regen het land vruchtbaar maken, alzo maakt de leer van Christus dat zijne kerk vele vruchten voortbrengt. Zie Deu 32:2 ; Psa 72:6 ; Hos 14:6 ."}],"3":[{"catchword":"Ik heb mijn rok","tekst":"Dit antwoordt de Bruid haren Bruidegom, weigerende op te staan om Hem in te laten, toen Hij aanklopte. Door het uittrekken des roks en het liggen in het bed kan men hier verstaan het gemak dezer wereld, welke ook somtijds de ware gelovige kinderen Gods verhindert en ophoudt, dat zij Christus en zijn Woord zo straks niet openlijk of vrijmoediglijk belijden, gelijk Hij aanklopt en zijne genade haar aanbiedt, vrezende het ongemak, dat daarmede vermengd is."},{"catchword":"hoe zal ik hem","tekst":"Alsof zij zeide: Ik kan hem niet aantrekken zonder moeite."},{"catchword":"Ik heb mijn voeten","tekst":"Dit is nog een argument, aanwijzende dat de Bruid zich tot rust en gemak begeven had; want in die hete landen, waar zij gemeenlijk barrevoets gingen, plachten zij des avonds, als zij op hunne rust gingen, hunne voeten te wassen. Hetwelk de Bruid gedaan hebbende, zo wilde zij [gelijk zij hier zegt] niet gaarne van het bed opstaan om haren Bruidegom in te laten, vrezende dezelve vuil te maken. Van zulke onnutte uitvluchten, zie Luk 14:18 , enz."}],"4":[{"catchword":"trok Zijn hand","tekst":"Zijne hand, die aan het gat der deur geweest was, trok Hij nu af, om weg te gaan, gelijk volgt vs.6. Anders: stak zijne hand door het gat der deur; te weten om de deur te openen; en alzo zou hier gesproken worden van de deur des harten, en te kennen gegeven worden dat Christus bij zijne uitverkorenen aanhoudt met prediken en vermanen, als zij Hem niet straks volgen, hunne harten alzo aanroerende door de kracht en werking des Heiligen Geestes, dat Hij in hen een brandende liefde en verlangen tot zich verwekt."},{"catchword":"mijn ingewand","tekst":"Hebreeuws, mijne ingewanden."},{"catchword":"werd ontroerd","tekst":"Met deze woorden geeft de Bruid hare ongerustheid, hartelijke droefenis en leedwezen te kennen, omdat zij haren Beminde zo onbeleefdelijk afgezet had, als Hij aanklopte, vs.3. Zie dergelijke manier van spreken Jer 4:19 , en Jer 31:20 ."},{"catchword":"om Zijnentwil","tekst":"Of van zijnentwege, te weten vanwege den Bruidegom. Hebreeuws, over hem."}],"5":[{"catchword":"Ik stond op,","tekst":"Hier bewijst de Bruid haar leedwezen, met uiterlijke tekenen van berouw en beterschap [vruchten die der bekering waardig zijn] met op te staan, de deur te openen, te zoeken, roepende haren Bruidegom, die van haar was weggegaan."},{"catchword":"van mirre,","tekst":"Versta hier door mirre mirreolie, waarmede te kennen gegeven wordt dat de aanroering en werken van Christus door zijn Heiligen Geest, in de harten der gelovigen grote kracht heeft, en dat zij, zulks in hunne harten gevoelende, met geloof en boetvaardigheid, [als welriekende specerijen] zich bereiden om haren Bruidegom te ontvangen."},{"catchword":"vloeiende mirre,","tekst":"Of, vlietente. Hebreeuws, voorbijgaande, of voortgaande mirre of overtreffende mirre; dat is, die anderen tebovengaat in waardigheid."},{"catchword":"op de","tekst":"Dat is, die aan de handvatsels van het slot was."},{"catchword":"handvaten","tekst":"Hebreeuws, handen of palmen; dat is handvatsels, waar men de hand aan slaat. Anders, grendels; en versta hier de grendels, waarmede de deur van binnen was gegrendeld geweest, Christus buiten de deur houdende en Hem verhinderende binnen te komen, welke nu met mirreolie bestreken zijnde, dat is, haar hart met de genadeolie gezalfd zijnde, en alzo alle sloten en grendels, dat is alle hindernissen, geweerd zijnde, de Bruidegom ongehindert mocht bij haar binnenkomen om de vruchten te genieten zijner genade, die zij van Hem ontvangen had."}],"6":[{"catchword":"Ik deed","tekst":"Dit gaat nog een trap verder, te weten, dat zij opgestaan zijnde, zelve de deur opent, opdat de Koning der ere tot haar zou mogen inkomen, ter zijde stellende alle uitvluchten, haar verhinderende van het genieten zijner lieflijke tegenwoordigheid."},{"catchword":"was geweken, Hij was doorgegaan","tekst":"Door de verdubbeling dezer rede, met welke de Bruid klaagt over het weggaan van haar Bruidegom, wordt te kennen gegeven haar hartelijke droefenis, overmits zij zijne tegenwoordigheid niet mocht genieten, gelijk zij in vorige tijden gedaan had."},{"catchword":"mijn ziel ging uit","tekst":"Dat is, ik was als dood; te weten van schrik en vrees. Zie Gen 35:18 , en Gen 42:28 , en de aantekening aldaar; als ook 1Ki 10:5 . Of, mijne ziel ging uit; te weten vanwege de grote liefde en het hartelijk verlangen, dat ik naar Hem had."},{"catchword":"vanwege","tekst":"Dat is, omdat Hij zo troostelijk met mij gesproken had, vs.2, hetwelk ik tevoren zo niet ter harte nam, maar nu daardoor zeer bewogen werd."},{"catchword":"ik vond Hem niet,","tekst":"Dit is een van de grootste zwarigheden, die de kinderen Gods overkomen, dat het schijnt dat God hun gebed niet verhoort, al roepen zij dag en nacht tot Hem; Psa 22:3 ; Isa 59:1-3 ."}],"7":[{"catchword":"De wachters,","tekst":"Zie boven, Son 3:3 . Hiermede wordt te kennen gegeven dat God somtijds toelaat, dat zijne kerk van de tirannen en boze regenten dezer wereld, ja, ook wel van valse leraars, vervolgd en benauwd wordt, om haar te tuchtigen vanwege hare traagheid en onachtzaamheid, en opdat zij in het toekomende des te wakkerder en ijveriger zou zijn."},{"catchword":"vonden mij,","tekst":"Hieruit is af te nemen dat de Bruid niet alleen tot aan de deur gegaan is om haren Bruidegom te zoeken, maar ook verder, hem zoekende aan alle hoeken der stad."},{"catchword":"zij sloegen mij,","tekst":"Men slaat niet alleen met de hand, of met stokken en zwaarden, enz., maar ook met de tong, gelijk te zien is Jer 18:18 . Ja, slaan betekent ook somtijds iemand kwellen en verdriet aandoen, hetzij door welk middel het geschiedt; Psa 69:27 ; Isa 53:4 ."},{"catchword":"sluier van mij","tekst":"Of, lamfers. Het Hebreeuwse woord heeft zijn oorsprong van uitspreiden, omdat de vrouwspersonen de sluiers over haar hoofd uitbreiden, eensdeels tot sieraad, Isa 3:23 , anderdeels om der eerbaarheid wille, Gen 20:16 , en Gen 24:65 ; Jer 2:32 ; ook tot een teken van onderdanigheid, 1Co 11:6-7 , 1Co 11:10 . Dat men zulk een deksel ene vrouw van het hoofd afneemt, is tot haar grote schande strekkende; zodat de Bruid hier reden heeft om daarover te klagen alsof men ze geacht had voor een oneerbare lichte vrouw. Zie Eze 23:26 . Eenigen verstaan hier door den sluier de vrijmoedige belijdenis des geloofs en der ware religie. Van dezen sluier zoeken de ontrouwe herders, of valse leraars en de tirannen, altijd de kerk en de ledematen derzelve te beroven."}],"8":[{"catchword":"Ik bezweer u,","tekst":"Dat is, ik beveel het u op uwen eed. Dit spreekt de Bruid nadat zij uit de handen van de wachters was ontkomen, verzoekende hulp en troost bij de ware ledematen der gemeente van Christus."},{"catchword":"dochters","tekst":"Zie de aantekening boven, Son 1:5 , en Son 2:7 ."},{"catchword":"indien","tekst":"Alsof zij zeide: Zo, wanneer gij met uwe gebeden voor Hem verschijnt, zo geeft Hem toch te kennen den soberen staat, waarin zijne Bruid is, te weten, dat ik zo hartelijk zeer verlang naar zijne barmhartigheid, dat Hij de wonden mijner zonden wil genezen, dat ik door het verlangen moet bezwijken indien ik de tekenen zijner liefde nog langer ontberen moet."},{"catchword":"wat zult gij Hem","tekst":"Anders: dit zult gij Hem aanzeggen."}],"9":[{"catchword":"Wat is uw Liefste meer","tekst":"Dit zijn woorden van zulke ledematen der kerk, die Christus nog niet ten volle kenden."},{"catchword":"dan een ander","tekst":"Dat is, dan de andere vrienden, die ook bemind worden en lief zijn; zie boven vs.1, gelijk de patriarchen, profeten en godzalige leraars, die de Bruid niet hebben, maar zij zijn vrienden van den Bruidegom, die zich verheugen in zijne stem; Joh 3:29 ."},{"catchword":"o gij schoonste","tekst":"Zie de aantekening boven Son 1:8 , en merk hier dat of wel [gelijk vs.7,8, gezegd is] de Bruid zo zwaarlijk is geslagen en gewond geworden, vervallen zijnde in den duisteren nacht der vervolging, zo wordt zij nochtans hier genoemd de schoonste onder de vrouwen. Zie Heb 11:26 ."},{"catchword":"wat is uw Liefste","tekst":"Dat zij deze vraag ten anderen maal herhalen, daarmede wordt te kennen gegeven de zeer grote genegenheid, die zij hebben om Christus' recht te kennen."}],"10":[{"catchword":"Mijn Liefste","tekst":"Dit zijn de woorden der Bruid tot degenen, die haar naar haren Bruidegom gevraagd hadden, vs.9."},{"catchword":"blank en rood,","tekst":"Deze twee kleuren in enen mens tegelijk zijnde, versieren hem zeer. De witte kleur beduidt zuiverheid en triomferende heerlijkheid. Daarom staat er dat de engelen verschenen zijn in witte klederen, Mat 28:3 ; Act 1:10 . Ja ook Christus zelf, Mat 17 Zie ook Rev 6:2 , en Rev 19:14 . Bij de rode kleur wordt verstaan het priesterambt van Christus, overmits Hij ons gewassen heeft in zijn bloed, Rev 1:5 . Zie ook Rev 19:13 , enz., en Isa 63:1-3 , enz."},{"catchword":"Hij draagt","tekst":"Hebreeuws, Hij is gebanierd, of Hij baniert. Het is ene gelijkenis, genomen van een vaandrager en zijn vaandel, dat men boven al de andere ziet. De zijn is, dat de Heere Christus uitsteekt boven alle engelen en andere creaturen, overmits Hij in zijne hand draagt en alleen staande houdt, door zijn goddelijke kracht, de banier van zijn heilig Evangelie, Isa 11:12 , en Isa 49:22 . Anders: Hij is versierd met een banier van tien duizend."},{"catchword":"boven tien duizend","tekst":"Dat is, over veel duizenden, een zeker getal voor een onzeker. De zin is, alhoewel Christus een ontallig leger van uitverkorenen onder zich heeft [ Rev 7:9 , en Rev 19:14 ;] dat Hij nochtans uitmunt boven al dezen, als hun hoofd, prins en vaandrager."}],"11":[{"catchword":"het fijnste goud . . . het dichtste goud","tekst":"Hier staan twee woorden bij elkander, met welke de Hebreën twee soorten van het beste goud noemen, Chethem en Phaz. En hier wordt te verstaan gegeven dat het Hoofd, dat is het goddelijke koninkrijk, van den Bruidegom zeer uitnemend schoon en voortreffelijk is, ook gedurig; Dan 7:14 ."},{"catchword":"gekruld,","tekst":"Of, krol, of kroes."},{"catchword":"zwart","tekst":"Hiermede wordt de schoonheid der jeugd te kennen gegeven; want in die tijden hield men het daarvoor dat zwart haar den jongelingen welstond en versierde, zijnde een teken van een hete en sterke natuur."}],"12":[{"catchword":"als der duiven","tekst":"Son 1:15 , en Son 4:1 wordt gezegd dat de Bruid duivenogen heeft; hier staat dat de Bruidegom duivenogen heeft, dat is zuivere, klare, schoon ogen. Dan 10:6 worden Christus toegeschreven ogen als vurige lampen, en Rev 1:14 als vlammen vuurs; alle betekenende dat Hij aller mensen wegen ziet, en dat Hij de geheimen der mensen in het licht brengt; 2Ch 19:9 ; Psa 11:4 , en Psa 90:8 , en Psa 94:9 ; Jer 16:17 ; Heb 4:13 ."},{"catchword":"bij de waterstromen,","tekst":"Dat is, die zich bij de waterbeken onthouden."},{"catchword":"met melk gewassen,","tekst":"Dat is, zo wit alsof zij met melk gewassen waren."},{"catchword":"staande","tekst":"Hebreeuws, zittende in de vulling; dat is, gelijk de stenen in de kasjes der gouden ringen staan of zitten; dat is, zij zijn fraai ingevoegd en staan gelijk een edele steen in een schonen ring ingevat. Dusdanige zijn de zuivere en aangename ogen des Bruidegoms Christus Jezus."}],"13":[{"catchword":"Zijn wangen","tekst":"Des Bruidegoms wangen worden vergeleken bij een hofbedje van specerijen, niet van zulke die verdord of droog zijn, maar die bloemen en bladen hebben, gevende een zoeten reuk, waarmede te verstaan worden gegeven de lieflijke en aangename genaden van Christus, welke deelachtig worden al degenen, die Hem met waar geloof aannemen. Zie onder, Son 6:2 ."},{"catchword":"welriekende","tekst":"Of, specerijentorentjes. Versta, zulke dozen der apothekers, die hoog zijn, gelijk torentjes, waar men specerijen, drogerijen, of poeders of reukwerk in bewaart."},{"catchword":"Zijn lippen","tekst":"Dat is, zijne lippen geven een zoeten reuk, alsof de reuk van leliën en mirre samen vermengd waren. Dat is, zij brengen troostelijke en verkwikkende leringen voort."},{"catchword":"vloeiende mirre","tekst":"Dat is, van olie gemaakt van de welriekende leliën en mirre onder elkander vermengd, gelijk boven vs.5. Dit betekent de gratiën of genaden [of, woorden der genade; Luk 4:22 ,] uitgestort in de lippen van Christus; Psa 45:3 ."}],"14":[{"catchword":"Zijn handen","tekst":"Anders: aan zijne handen zijn gouden ringen. Versta hier door de handen versierd met gouden ringen, waar kostelijke stenen in staan, de dierbare, zuivere en heerlijke werken des Bruidegoms. Aldus wordt het woord handen genomen voor werken of macht, 1Ch 29:12 , en 2Ch 20:6 ."},{"catchword":"turkoois;","tekst":"In het Hebreeuws staat Tharsis; gelijk Exo 28:20 ."},{"catchword":"Zijn buik","tekst":"Hebreeuws, zijne ingewanden. Maar hier moet men door de ingewanden verstaan den buik en de borst, in welke het ingewand besloten ligt. Hierdoor worden te kennen gegeven de innerlijke of hartelijke genegenheden van den Bruidegom, te weten zijne liefde, genade en mededogendheid. Zie Luk 1:78 ; 2Co 7:15 ; Phi 2:1 ."},{"catchword":"blinkend","tekst":"Hebreeuws, de glans des tands; te weten van den tand van een olifant; versta dit van het schoonste, gepolijste blinkende ivoor of elpenbeen."},{"catchword":"overtogen","tekst":"Dat is, versierd met saffieren. Eenige saffieren zijn wit en klaarblinkend als een diamant; andere zijn blauw. Versta hier witte saffieren, waarmede de zuiverheid van den Bruidegom wordt aangewezen. Van den saffier zie ook Job 28:6 ."}],"15":[{"catchword":"Zijn schenkelen","tekst":"Onder den naam van schenkelen of benen worden ook de dijen verstaan, ja, het gehele onderlijf van het lichaam tot de voeten toe, zijnde de instrumenten of delen, die het lichaam dragen, onderstutten en bewegen van de eerste plaats tot de andere. Deze gelijkenis wordt ook gebruikt Rev 1:15 . Zie Psa 147:10 . De sterkte en macht van Christus, of de machtige en gestadige hulp, die Hij zijne kerk bewijst, worden vergeleken bij marmeren pilaren, die sierlijk en vast staan, zijnde gegrond op zuiver of dicht massief goud, betekenende dat de beloften en werken des Heeren zijn zuiver, vast, bestendig, ja, ook tegen de poorten der hel. Te dezen aanzien wordt Christus genoemd de steenrots, waar de kerk op gebouwd staat; Mat 16:18 ; 1Pe 2:6 ."},{"catchword":"als de Libanon,","tekst":"Dat is, heerlijk, sterk en lieflijk, gelijk de schone, grote, hoge bomen van welke vele op den berg Libanon wiessen, van welken zie de aantekening boven, Son 4:8 ."},{"catchword":"uitverkoren","tekst":"Dat is, schoon en aanzienlijk als de cederen. Dingen, die andere overtreffen in schoonheid en grootheid, worden gemeenlijk door de mensen uitgekipt en uitverkoren."}],"16":[{"catchword":"Zijn gehemelte","tekst":"Dat is, zijne woorden, spraak, redenen, [gelijk Pro 5:2 , en Pro 8:7 ] . Idem leringen, vertroostingen, beloften. Zie Rom 15:4 ; Col 3:16 ."},{"catchword":"al wat aan Hem is,","tekst":"Hebreeuws, Hij is geheel begeerlijkheden; dat is, alles wat aan Hem is, is gans lieflijk en waardig dat men begere het te mogen genieten. Dusdanig is Christus zijner gemeente en allen uitverkorenen; maar den goddelozen en verworpelingen is Hij ene ergernis en dwaasheid, 1Co 1:23 . Zie ook Psa 22:7 ; Isa 52:14 , en Isa 53:2 ."},{"catchword":"ja,","tekst":"Met deze woorden wil de Bruid besluiten de uitnemendheid des Heeren Christus boven alle anderen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"I am come into my garden; that is, into my church. Here the bridegroom answereth to the request & petition of the Spouse, chap.4.16. he is ready to fulfill the desire of those that fear him, Psal.145.19. see likewise , Exo 20:24.] O my sister, O spouse, [see above, chap.4.v.8,9.] I have pluckt my myrrhe with my spice, [that is, I have enjoyed the prayers and thanksgivings of believers, as also the good and pleasant fruits of good works, which I wrought in thee by the powerful working of the Holy Ghost. Of the preciousness of Myrrhe, see above ch.1.on v.13. Observe here, that Christ calleth all these portions here mentioned, his portions; he saith, My myrrhe, my spice, my honey-comb, etc. for without him we can do nothing, Joh.15.5. and ch.1.v.16. and 1 Cor.4,7. Rev 3:18.] I have eat my honey-comb with my honey, I have drunk my wine together with my milk. [That is, I take delight in thy good fruits and good works. On the contrary, the evil fruits of sinners are called poisonous or venomous grapes, which have bitter berries, Deut.ch.32.v.32,33. The word of God, and the doctrine of the Gospel, together with the obedience unto the same, the use of the holy Sacraments, are compared to meat, honey and honey-comb, wine and milk, Psal.19.11. and 119.103. Isa 55:1. John 4 34. And 1 Pet.2.2. Because, as honey, wine, and milk are pleasant and convenient to cheer and nourish the body: so are also the aforesaid things pleasant and convenient to refresh and comfort the soul] Eat (O) friends, [here, and in the following words of the verse, Christ, the Bridegroom of his church inviteth the holy Angels and all the faithful to rejoice with him, because of the fair and pleasant fruits (that is, the obedience) of his church upon the earth, see Luke 2.v.13,14. And ch.15.v.7,10. (friends) They are the friends of Christ, that do the will of his heavenly Father, Joh.15.14. compare Isa 41:8. Jam.2.23.] drink and be drunken, O best-beloved. [see the annotate. Gen 43:34. Be drunken, is to say here, be ye filled with love towards me, and toward one another; or be abundantly satisfied with spiritual joy, which abideth unto life everlasting, see Prov.9.v.5. Isa 25:6. and ch.55.v.1.2.]"}],"2":[{"catchword":null,"tekst":"I slept, [Here is shewed, that the Spouse, or some members of the church, after they have eaten and drunk well, that is, have abundantly injoyned the mercies of Christ, do sometimes fall into sleep or slumbering; that is, wax flow and slack in zeal & good works, and fall into carnal ease and security, see Mat 25:4. Rom 13:11. 1 Thes.5.v.6,7.] but mine heart waked; [that is, notwithstanding I forgot not my Bridegroom, but kept him still in mine heart. Understand here by the heart, the inward man, or the regenerate man, who is opposed to the flesh, or the outward man, Rom.2.v.28.29. see likewise, Mat 26:41. Gal 5:17.] (it) was the voice of my most beloved that knocked, [the spouse relateth here the love and care of the bridegroom, that would not suffer her to rest quietly in the bed of worldly ease. Christ knocketh at the door of our heart by his word by his Spirit, and by cross, or chastisement, Rev. 3. Vers. 20] (saying) Open to me, [To wit, the door of thine heart: Rise up out of the sleep of sin, let me dwell in thine heartby faith, awakening it] my Sister; my Love, my Dove, my Perfect (one). [These loving or pleasant names and titles, which Christ here giveth to his spouse (she being yet in her infirmity) signify his transcendent love and affection unto her, loving her, and delighting in her, not withstanding that she yet liveth and converseth in this sinful flesh, not imputing unto her sins and imperfections] for mine head is filled with dew, and locks of mine hair with the drops of the night. [That is, I have endured much hardship and trouble. Hereby is intimidated, that Christ was to suffer much, and to undergo sore and heavy crosses and afflictions, to deliver his Spouse, and to cleanse and purify her from her sins. For to be wet, with the dew of heaven, is a great inconvenience, or discommodity, Gen. 31.40. and it signifieth here to suffer misery or affliction, as Dan. 4. 25. As also rain, when a man is not covered or sheltered. So likewise drops, signify leaking or soaking in of rain, that is, great troubles, or adversities, Amos 6. 11. Others take these words thus. As the dew and rain do make the ground or earth fruitful. So the Doctrine of Christ causeth his Church to bring forth abundance of fruit. See Deut. 32. 2. Psal. 72. 6. Hos. 14. 5.]"}],"3":[{"catchword":null,"tekst":"I have put off my coat, how shall I put it on again? [As if she had said, I cannot put it on without trouble. The spouse maketh this answer to her Bridegroom, refusing to rise for to let him in when he knocked at the door. By the putting off of the coat, and the lying down in the bed, may be here understood the ease and security of this world, which do sometimes hinder and obstruct the true believing children of God themselves, that they do not readily and openly, freely profess Christ and his word, as soon as he knocketh, and offereth his grace unto them, fearing the trouble & persecution that doth usually a tend it] I have washed my feet, how shall I defile them again? [This is yet another argument, proving, that the spouse had given up herself to rest ad ease: for in those hot countries, where they commonly went bare-foot, they were wont in the evening, when they went to take rest, she was loath (as she here affirmeth) to rise from off her bed, to let her Bridegroom in, fearing to soil her feet. Of such frivolous ad idle excuses, see Luke 14. 18, etc.]"}],"4":[{"catchword":null,"tekst":"My best beloved drew (away0 his hand from the hole (of the door, ) [His hand, that had been at the hole of the door, he drew away, to depart, as followeth, vers. 6. Oth. Put his hand through the hole of the door; to wit, for to open the door; and so here should be spoken of the door of the heart, and be intimated, that Christ still continueth preaching unto, and exhorting his elect, when they do not forthwith obey and follow him, so moving and touching their hearts by the power, and up to a servent love ad longing after him, as followeth in the next words] and my bowels are moved for his sake. [Or, because of him: to wit, because of the Bridegroom. Hebr. Over him, or, for him. By these words the Spouse testifieth her disquietness, hearty sorrow, and grief, for putting of her beloved so uncivilly and discourteously, when he knocked at the door, vers. 3. See the like phrase, Jerem. 4. 19. And 31. 20.]"}],"5":[{"catchword":null,"tekst":"I rose up, to open to my best-beloved: and my hands dropped (of) myrrhe, and my fingers (of) flowing myrrhe, upon the handles of the lock. [Here and in the verse following, the Spouse manifesteth her grief by outward tokens of sorrow and amendment, (fruits that are worthy of repentance) in rising up out her bed, opening the door, seeking, and calling after her Bridegroom, that was gone away from her. Understand here by myrrhe, the oil of myrrhe, whereby is signified, that the call and operation of Christ by his Holy-Spirit in the hearts of believers hath exceeding great power; and that they being sensible thereof in their hearts by true faith ad repentance (as sweet-smelling spices) do prepare themselves to receive and entertain their Bridegroom. (with flowing myrrhe;) Or, running myrrhe. Hebr. Passing-by, or, proceeding myrrhe, or, excelling myrrhe: that is, which passeth all other in worth and value. (Upon the handles of the lock:) That is, which were at the handles of the lock. Hebr. Hands, or, palms; that is, handles, whereon a man layeth his hand. Oth. Bars, or, bolts; and understand here the Christ without doors, and hindering him from coming in; which now being oiled with the oil of grace, and so all locks and bolts, that is, all impediments and hinderances being removed, the Bridegroom might come in unto her without molestation, to enjoy the fruits of his grace, which she had received of him]"}],"6":[{"catchword":null,"tekst":"I opened to my Most beloved, [This goeth yet one step degree further, to wit, that she being risen, openeth the door her own self, that the King of glory might come in unto her, laying aside all evasions and excuses, that might hinder her from enjoying his gracious presence] but my best-beloved was departed , he was gone away: [By the iteration or doubling of this sentence, wherein the Spouse complaineth of the departure of her Bridegroom, is signified her hearty sorrow, because she could not enjoy his presence, as she had done in times past] my soul went out [That is, I was like a dead body; to wit, through fear and terror. See Genes. 35. 18. And 42. 28. And the annotate. There. As likewise 1 Kings 10. 5. Or, my soul went out; to wit, by reason of the great love and hearty longing, which I had after him] because of his speaking: [That is, because he had spoken so comfortably unto me, vers. 2. Which before I did not much heed or regard; but now I am heartily moved and sorry for it] I sought him, but now I am heartily moved and sorry for it] I sought him, but I found him not ; I called him, but he answered me not. [This is one of the sorest and greatest troubles that do befall the children of God, when God seemeth not to hear their prayers, though they cry and call night and day unto him, Psal. 22. 3. Isai. 59. Vers. 1,2, 3. So above chap. 3. 1.]"}],"7":[{"catchword":null,"tekst":"The watchmen that went about in the City, found me, [See above chap. 3. Vers. 3. Hence we may gather, that the Spouse went not onely to the door to seek her Bridegroom, but also further, seeking him in everycorner of the City,] they smote me, they wounded me: [hereby is intimated, that God sometimes suffereth his Church to be persecuted and oppressed by Tyrants, and wicked Governours; yea also by false Teachers and Hereticks, to chastise her for her drowsiness and negligence, and to make her the more watchful ad zealous in time to come. Smiting is not onely down with the hand, or with sticks and swords, etc. But also with the tongue, as appeareth, Jerem. 18. 18. Yea smiting signifieth to vex and torment a man be it by what means soever, Psal. 69. 27. Isai. 53. 4.] the watchmen on the walls took (away) my scarf from me [or, my Tiffany, & c, The Hebrew word hath its original from spreading abroad, because women-kind are wont to spread abroad their scarfs or vails over their heads, partly for ornament, Isai 3. 23. And partly for modesties sake, Genes. 20. 16. And 24. 65. Jerem. 2. 32. Likewise for a token of subjection, 1 Cor. 11. Vers. 6 7, 10. Now to take such a covering from off a Woman&acirc;&euro;&trade;s head, tendeth to her great shame and disgrace . So that the Spouse hath cause here to complain of it, as if she had been counted a dishonest, light, unchaste Woman. See Ezech. 23. 26. Some understand herely the scarf or vail, the bold profession of faith, and of true Religion. Of this vail or scarf the unfaithful Shepherds, or false Teachers, and Tyrants seek to rob the Church and members thereof.]"}],"8":[{"catchword":null,"tekst":"I adjure you, ye Daughter of Jerusalem, [That is, I charge you upon your oath. The spouse speaketh this, after she had escaped the watchmens hands, seeking for help and comfort among the true members of the Church of Christ. Of the phrase Daughters of Jerusalem, see the annotate. Above chap. 1. 5. And 2. 7.] if ye find my best beloved, what will ye tell him? [Oth. Ye shall tell him this] That I am sick of love. [As if she had said, when ye come before him in prayer, tell him (I pray) of the sad condition that his Spouse is in; to wit, that I do so heartily long after his mercy and compassion, that he would be pleased to heal the wounds of my sins, that I may not faint through longing, if I must needs want yet a long while the tokens of his love and favour.]"}],"9":[{"catchword":null,"tekst":"What is thy best beloved more than (another) best beloved, [That is, then the other friends which are also loved and are accounted dear. See above vers. 1. as the Patriachs Prophets, and Godly Teachers or Ministers, who have not the Bride, but are friends of the Bridegroom, who rejoice in his voice, John 3. 29.] O thou fairest among women. See Heb. 11. 26.] what is thy best beloved more than (another) best beloved, that thou hast so adjured us? [The words of this verse, they are the words of such members of the Church, that as yet were not fully acquainted with Christ. In that they put forth this question the second time, it intimateth the great affection and desire which they had, for to know Christ alright.]"}],"10":[{"catchword":null,"tekst":"My best beloved is white and red, [these and the following words to the end of the Chapter, are the words of the spouse to those that had asked her concerning her Bridegroom, vers. 9. These two colours (to wit, white and red) being found alike proportion in one man, do much adorn and beautify him. The white colour signifieth pureness and triumphant glory. Wherefore it is said, that the Angels appeared in white raiment, Matth. 28. 3. Acts 1. 10. Yea also Christ himself, Matth. 17. See also Rev. C. 6. 2. And 19. 14. By the Red or Ruddy colour is meant Christs Priest-hood, or Priestly office: because he washed us in the his blood, Re. 1. 5. See likewise Re. 19. V. 13, etc and Isa. 63. 1, 2, 3, & c.] he beareth the banner above ten thousand. [Heb. He is bannered, or, he bannereth, 7 c. It is a similitude borrowed from an ensigne-bearer, and his ensigne or standard, which may be seen above all others. The meaning is, that Christ excellent far above all the Angels, and all other creatures, because he beareth in his hand, and upholdeth alone, by his Divine power, and banner in his Holy Gospel, Isai. 11. 12. And 49. 22. Oth. He is adorned with a banner of ten thousand. (Above ten thousand) That is, over or above many thousand: a certain number for an uncertain. The meaning is, that although Christ hath an innumerable number of elect under him, (Revel. 7. 9. And 19. 14.) yet he exceedeth and surmounteth them all as their Head, Prince, Standard-bearer]"}],"11":[{"catchword":null,"tekst":"His head is of the finest gold, and of the massiest gold: [Here two words stand together, whereby the Hebrew express two sorts of the best and choicest gold, Cbe-them, and Phaz. And hereby intimidated, that the head; that is, the Divine Kingdom of the Bridegroom is exceeding fair and excellent, yea also perpetual and everlasting, Dan. 7. 14.] his hair-locks are curled, [Or, crisped, frizzled] black, as a Raven. [Hereby is signified the beauty of youth; for in these times black hair was held to be an excellent grace and ornament in youth: it being a token of a hot and strong constitution.]"}],"12":[{"catchword":null,"tekst":"His eyes are as the (eyes) of doves [Above c. 1. 15. And 4. 1. It is said, that the Spouse hath doves eyes, and here it is said that the Bridegroom hath doves eyes. In Dan. 10. 6. There are attributed or ascribed unto Christ eyes like lamps of fire: and Revel. 1. 14. Like flames of fire: all of them signifying that he seeth and beholdeth the ways of all men, and bringeth the secret actions of men, yea even their very secret thought to light, 2 Chron. 16. 9. Psal 11. 5. Ad 90. 8. And 94. 9. Jerem. 16. 17. Heb. 4. 13. ] by the water-streams: [that is, that have their abiding place by the water-brooks,] washed with milk, [that is, looking as white, as if they were washed with milk] standing (as) in small ouches of rings. [Hebr. Sitting in the filling; that is, as precious stones stand or sit in the small ouches of gold-rings; that is, they are neatly sitted and joined in, and stand like precious stone sitted and joined in, and stand like precious stone sitted and fastened I a fair gold-ring: Such are the pure and comely eyes of Christ the Bridegroom of his Church]"}],"13":[{"catchword":null,"tekst":"His cheeks are as a bed of spice, [The Bridegrooms cheeks are likened to a garden-bed of spices, not of spices, not of such as are dry and withered, but of such as have flowers and leaves, giving a sweet and pleasant smell: whereby is signified the pleasant and acceptable graces of the Lord Christ, whereof all those that receive him by a true and lively faith, are made partakers. See below chap. 6.2.] (as) fragrant turrets, [Or, little Spice-turrets; meaning such kind of Apothecaries boxes, as are spiring like little turrets or towers, wherein spices, drugs, or powders or perfumes are kept] his lips are (like) lilies, dropping of flowing myrrhe. [that is, his lips send forth sweet ad comfortable Doctrines. (Dropping of flowing myrrhe:) That is, of oil made of sweet-smelling lilies and myrrhe, mixt among one another, asa above v. 5. This signifieth the gifts and graces (or, words of grace, Luke 4. 22.) poured out into the lips of Christ, Psal.45. 3.]"}],"14":[{"catchword":null,"tekst":"His hands are (as) gold rings, filled (or set0 with the turquoise, [In Hebrew Tarsis, as Exod. 28. 20. Oth. On his hands are gold rings, & c. Understand here by the hands, adorned by gold rings, wherein precious stones are set; the precious, pure, and glorious works of the Bridegroom. Thus the word hands is taken for working or power, 1 Chron. 29. 12. And 2 Chron. 20. 6.] his belly [ Hebr. His bowels. But here by bowels must be understood the belly and the brest; wherein the bowels must be understood the belly and the brest; wherein the bowels lie shut up. Hereby is intimated the inward or hearty affections, and inclinations of the bridegroom; to wit, his love, grace, and compassion. See Luke 1. 78. 2 Cor. 7. 15. Phil. 2. 1.] is (as) standing Ivory; [Heb. The splendour of the tooth: to wit, of the tooth of an elephant. Understand this of the fairest, most polished, brightest and cleerest ivory that is] overlaid with Sphirs. [That is, beautified, or adorned with Saphirs. Some Saphirs are white, and glitter like a Diamond: Others are blew. Understand here white Saphirs, whereby the cleanness and pureness of the Bridegroom is set forth. Of the Saphir, see likewise Job 28. 6.]"}],"15":[{"catchword":null,"tekst":"His shanks are as marble-pillars, grounded upon feet of the thickest gold: [Under the name of shanks, or legs, are the thighs also understood, yea the whole inferior part of the body unto the feet, they being the instruments or parts, that carry, support, and move the body from one place to another. This similitude is likewise used, Revel. 1. 15. See Psal. 147. Vers. 10. The strength and power of Christ, or the mighty and constant help which he affordeth unto his Church, are compared unto pillars of marble, which stand beautiful & firm, being set or grounded upon pure, or thick solid gold, signifying, that the promises, and works of god, are pure, firm and constant, yea even prevailing against the gates of Hell. In this respect Christ is called the 1 pet. 2. 6.] his countenance is as the Libanon, [That is, glorious, strong, and pleasant, like the fair, great, and high trees, which grew in great abundance upon mount Libanon, whereof see the annotate. Above chap. 4. Vers. 8.] choice as the Cedars. Things that do exceed others in beauty and greatness, are commonly chosen and picked out by men]"}],"16":[{"catchword":null,"tekst":"The roof of his mouth [That is, his words, speech, sayings, (as Prov. 5. 3. And 8.7.) likewise his Doctrines, comforts, promises] is meer sweetness, [See Rom. 15. 4. And Col. 3. 16.] and whatsoever is in him, is altogether desirable: [Heb. He is altogether desires; that is, all that is in him, is exceeding lovely, and worthy that we should desire and covet to enjoy it. Such a one is Christ unto his Church, and to all his Elect, but to the wicked and reprobate he is a stumbling-block, and foolishness, 1 Cor. 1. 23. See also Psal. 22. 7. Isai. 52. 14. And 53. 2.] Such a one is my best beloved, such a one is my Friend, ye Daughters of Jerusalem. [With these words the spouse intendeth to conclude the excellency and dignity of the Lord Christ, above all others]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
// vanuit een rechtsklik-vertaalmenu (elders) kan de link ?vert=SV meegeven om

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;
let openVers = null;

const popup = document.getElementById('popup');
const toast = document.getElementById('toast');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
