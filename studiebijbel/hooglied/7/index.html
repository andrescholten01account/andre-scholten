.","11":"Kom, mijn Liefste! Laten wij uitgaan in het veld, laten wij overnachten in de dorpen.","12":"Laten wij vroeg opstaan naar de wijngaarden, laten wij zien of de wijnstok bloeit, de jonge druifjes zich openen, de granaatappelbomen uitbotten; daar zal ik U mijn liefde geven.","13":"De liefdesappels geven geur, en aan onze deuren zijn allerlei heerlijke vruchten, nieuwe en oude; mijn Liefste! die heb ik voor U weggelegd."},"SV":{"1":"Hoe schoon zijn uw gangen in de schoenen, gij prinsendochter! de omdraaiingen uwer heupen zijn als kostelijke ketens, zijnde het werk van de handen eens kunstenaars.","2":"Uw navel is *als* een ronde beker, dien geen drank ontbreekt; uw buik is *als* een hoop tarwe, rondom bezet met leliën.","3":"Uw twee borsten zijn als twee welpen, tweelingen van een ree.","4":"Uw hals is als een elpenbenen toren, uw ogen zijn *als* de vijvers te Hesbon, bij de poort van Bath-rabbim; uw neus is als de toren van Libanon, die tegen Damaskus ziet.","5":"Uw hoofd op u is als Karmel, en de haarband uws hoofds als purper; de koning is *als* gebonden op de galerijen.","6":"Hoe schoon zijt gij, en hoe liefelijk zijt gij, o liefde, in wellusten!","7":"Deze uw lengte is te vergelijken bij een palmboom, en uw borsten bij *druif* trossen.","8":"Ik zeide: Ik zal op den palmboom klimmen, ik zal zijn takken grijpen; zo zullen dan uw borsten zijn als *druif* trossen aan den wijnstok, en de reuk van uw neus als appelen.","9":"En uw gehemelte als goede wijn, die recht tot mijn Beminde gaat, doende de lippen der slapenden spreken.","10":"Ik ben mijns Liefsten, en Zijn genegenheid is tot mij.","11":"Kom, mijn Liefste! laat ons uitgaan in het veld, laat ons vernachten op de dorpen.","12":"Laat ons vroeg ons opmaken naar de wijnbergen, laat ons zien, of de wijnstok bloeit, de jonge druifjes zich opendoen, de granaatappelbomen uitbotten; daar zal ik U mijn uitnemende liefde geven.","13":"De dudaim geven reuk, en aan onze deuren zijn allerlei edele vruchten, nieuwe en oude; o mijn Liefste! die heb ik voor U weggelegd."},"KJV":{"1":"How beautiful are thy feet with shoes, O prince's daughter! the joints of thy thighs *are* like jewels, the work of the hands of a cunning workman.","2":"Thy navel *is like* a round goblet, *which* wanteth not liquor: thy belly *is like* an heap of wheat set about with lilies.","3":"Thy two breasts *are* like two young roes *that are* twins.","4":"Thy neck *is* as a tower of ivory; thine eyes *like* the fishpools in Heshbon, by the gate of Bathrabbim: thy nose *is* as the tower of Lebanon which looketh toward Damascus.","5":"Thine head upon thee *is* like Carmel, and the hair of thine head like purple; the king *is* held in the galleries.","6":"How fair and how pleasant art thou, O love, for delights!","7":"This thy stature is like to a palm tree, and thy breasts to clusters","8":"I said, I will go up to the palm tree, I will take hold of the boughs thereof: now also thy breasts shall be as clusters of the vine, and the smell of thy nose like apples;","9":"And the roof of thy mouth like the best wine for my beloved, that goeth *down* sweetly, causing the lips of those that are asleep to speak.","10":"I *am* my beloved's, and his desire","11":"Come, my beloved, let us go forth into the field; let us lodge in the villages.","12":"Let us get up early to the vineyards; let us see if the vine flourish, *whether* the tender grape appear, *and* the pomegranates bud forth: there will I give thee my loves.","13":"The mandrakes give a smell, and at our gates *are* all manner of pleasant *fruits*, new and old, *which* I have laid up for thee, O my beloved."}},"tsk":{"1":[{"kopje":"uw gangen","refs":["Luk 15:22","Ef 6:15","Fil 1:27"]},{"kopje":"prinsendochter","refs":["Ps 45:14","2 Kor 6:18"]},{"kopje":"de omdraaiingen","refs":["Dan 2:32","Ef 4:15","Ef 4:16","Kol 2:19"]},{"kopje":"het werk","refs":["Ex 28:15","Ex 35:35"]}],"2":[{"kopje":"navel","refs":["Spr 3:8"]},{"kopje":"uw buik","refs":["Hoogl 5:14","Ps 45:17"," span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> like apples;","9":"And the roof of thy <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> like the <span class=\"wl wl-kjv\" data-code=\"H2896\">best</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> for my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> down <span class=\"wl wl-kjv\" data-code=\"H4339\">sweetly,</span> causing the <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> of those that are <span class=\"wl wl-kjv\" data-code=\"H3463\">asleep</span> to speak.","10":"I am my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved's,</span> and his desire","11":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> let us go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> let us <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> in the villages.","12":"Let us get up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> to the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards;</span> let us <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> if the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> <span class=\"wl wl-kjv\" data-code=\"H6524\">flourish,</span> whether the tender <span class=\"wl wl-kjv\" data-code=\"H5563\">grape</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">appear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates</span> bud <span class=\"wl wl-kjv\" data-code=\"H5132\">forth:</span> there will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee my loves.","13":"The <span class=\"wl wl-kjv\" data-code=\"H1736\">mandrakes</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> a <span class=\"wl wl-kjv\" data-code=\"H7381\">smell,</span> and at our <span class=\"wl wl-kjv\" data-code=\"H6607\">gates</span> are all manner of <span class=\"wl wl-kjv\" data-code=\"H4022\">pleasant</span> fruits, <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> and <span class=\"wl wl-kjv\" data-code=\"H3465\">old,</span> which I have laid <span class=\"wl wl-kjv\" data-code=\"H6845\">up</span> for thee, O my beloved."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"schoon","tekst":"Het schijnt dat de vrienden der Bruid deze beschrijving van het lichaam der Bruid gemaakt hebben. Want vs.5, 9 wordt van Salomo of Christus gesproken als van een derden persoon. Evenwel houden het anderen daarvoor, dat het de woorden des Bruidegoms zijn."},{"catchword":"uw gangen","tekst":"Versta hierbij, haren wandel in het geloof aan Jezus Christus, alzo namelijk dat hare voeten geschoeid zijn met de vaardigheid van het Evangelie des vredes, betonende daarmede dat zij uit God geboren is; Eph 6:15 . Zie ook Isa 52:7 ."},{"catchword":"gij prinsendochter","tekst":"Vergelijk hiermede Joh 1:13 , en Jam 1:18 . Deze Bruid, of de kerk, wordt ook genoemd eens konings dochter, Psa 45:14 . Want God is een groot Koning."},{"catchword":"omdraaiingen","tekst":"Het Hebreeuwse woord [dat alleen hier gevonden wordt] komt van draaien, of omdraaien, en het schijnt te betekenen de holligheid, waarin de heup zich beweegt of omdraait. Deze omdraaiingen worden vergeleken bij kostelijke ketens, of juwelen, betekenende de vaste, oprechte en schone gestaltenis, handel en wandel van deze prinselijke of edele dochter, wel betamende het Evangelie, waarvan zij belijdenis doet. Anderen vertalen hier het Hebreeuwse woord gordels, en verstaan hierdoor den gordel der waarheid, die gemaakt is door het ingeven van den Geest der waarheid, die de opperste werkman is van alle goede en volmaakte gaven. Deze gordel wordt vergeleken bij gouden ketens, die met vele schakels samengevoegd zijn, want de waarheid heeft wel vele delen, maar zij passen alle op elkander, gelijk de schakels eens ketens."},{"catchword":"als kostelijke","tekst":"Of, gelijk halsketens, of braceletten, of dergelijke versierselen. Zie Pro 25:12 ."},{"catchword":"eens kunstenaars","tekst":"Versta bij dezen kundigen werkman den Heiligen Geest; zie 1Co 12:4 . Daar staat Jam 1:17 :Alle goede gave en volmaakte gift komt van boven, van den Vader der lichten."}],"2":[{"catchword":"Uw navel","tekst":"De navel in het instrument, waardoor het kind gevoed wordt, terwijl het in zijns moeders lichaam besloten is. Versta hier den navel der wedergeboorte, door welken wij het geestelijke leven deelachtig worden, als wij in den buik der kerk ontvangen zijn door het zaad van het goddelijke Woord. Deze gave wordt vergeleken bij een ronden beker, dien geen drank ontbreekt; dat is, die nimmermeer uitdroogt, overmits wij door de wedergeboorte ontvangen den Geest der aanneming tot kindschap, die van de uitverkorenen nimmermeer afwijkt, Joh 14:16 ; maar hij wordt in hen een springende fontein ten eeuwigen leven, Joh 4:14 ."},{"catchword":"dien geen drank","tekst":"Hebreeuws, dien gene vermenging ontbreekt. De drank wordt meermalen vermenging genoemd bij de Hebreën, omdat zij niet altijd den wijn dronken zo zuiver als hij van den wijnstok of pers kwam, maar zij mengden hem met water, of ook wel met specerijen. Zie Pro 9:2 , boven Son 5:1 . En Son 8:2 wordt melding gemaakt van wijn met specerijen gemengd."},{"catchword":"uw buik","tekst":"De geestelijke gaven der Bruid of kerk van Christus zijn ook vruchtbaar, anderen bekerende, in zulk een overvloed als de tarwe, die vele vruchten draagt, Psa 72:16 ."},{"catchword":"rondom bezet","tekst":"Hebreeuws, betuind. Hiermede wordt aangewezen dat de vruchtbaarheid der gemeente gekroond wordt met den zegen Gods en een geestelijke vreugde. Het schijnt te zien op de nieuwe vruchten, die men pleegt te kronen of versieren met bloemen of groene kransen. Zie Hos 14:6 ."}],"3":[{"catchword":"Uw twee","tekst":"Zie de beduiding van dit vers Son 4:5 ."}],"4":[{"catchword":"Uw hals is","tekst":"Door den hals wordt te kennen gegeven de kracht en heerlijkheid der kerk van Christus. Anderen verstaan door den hals de hoop en lijdzaamheid."},{"catchword":"als een elpenbenen","tekst":"Dat is, schoon, sterk en rechtop. Zie Son 4:4 , en de aantekening aldaar."},{"catchword":"uw ogen zijn","tekst":"Te weten de ogen van uw verstand en van uw geloof. Die zijn vol wijsheid en kennis des Heeren, gelijk de vijvers vol zijn van klaar en zuiver water, klaar zijnde om de waarheid te zien en om hun eigen en anderer wegen en gangen aan te merken. Zie boven, Son 4:1 ."},{"catchword":"Hesbon,","tekst":"In de stad Hesbon heeft eertijds de koning Sihon zijn hof gehouden; Num 21:26 . Zij lag in een goede vette landouw, die den Rubenieten is toegevallen. Num 32:3-5 tot Num 32:37 ; het schijnt dat in deze stad schone vijvers geweest zijn, die haar versierden, gelijk de ogen het lichaam doen. Anders: als vijvers met bedenking, of met gedachte; dat is kunstiglijk gemaakt."},{"catchword":"bij de poort","tekst":"Dat is bij de poort, waar vele mensen uit en ingaan, of bij de poort, waar vele mensen samenkomen. Eenigen menen dat er te Jeruzalem ene poort geweest is, Bath-Rabbim genoemd, bij welke ook schone vijvers waren. Sommigen nemen het voor de Schaapspoort; Neh 3:1 ; of de Fonteinpoort; Neh 3:15 . Anderen houden het voor ene poort van Hesbon."},{"catchword":"uw neus","tekst":"Hier wordt door gelijkenis te kennen gegeven de schoonheid van den neus, en voorts van het ganse aangezicht. Sommigen nemen die woorden aldus: Dewijl de neus is het instrument van den reuk, waardoor wij de kracht van vele dingen kunnen onderkennen; daarom verstaan zij daarbij het oordeel en den geest des onderscheids, waardoor wij de verscheidene dingen kunnen onderscheiden; Phi 1:10 . Zie ook Isa 11:3 ."},{"catchword":"toren van Libanon,","tekst":"Dit kan men verstaan van den toren van het huis, hetwelk Salomo in het woud van Libanon gebouwd heeft; 1Ki 7:2 , en 1Ki 10:17 ."},{"catchword":"die tegen","tekst":"Damaskus was in die tijden de vermaardste stad in Syrië; Isa 7:8 , noordwaarts van den berg Libanon gelegen; een zeer schone stad; Jer 49:24-25 . Deze stad was gemeenlijk vijandig, en zij voerde dikwijls krijg tegen het volk Gods. Zie 1Ch 18:5-6 ; 1Ki 11:24-25 ; Isa 7:5 , Isa 7:8 ; Amo 1:3 . Zodat de toren van Libanon, ziende naar Damaskus toe, hier mag betekenen de wachthoudende zorg der Bruid voor de rust van haarzelve en hare kinderen tegen hare vijanden. Voor, die tegen Damaskus ziet, hebben anderen: ziende met het aangezicht naar Damaskus toe."},{"catchword":"Damaskus ziet","tekst":"Hebreeuws, Dammesek; 1Ch 18:5-6 staat: Darmaskus. Maar 2Ki 16:10 , en Act 9:2 , Damaskus."}],"5":[{"catchword":"Karmel,","tekst":"Zie van den berg Karmel, 1Sa 25:2 , 1Sa 25:5 , en 1Ki 18:19-20 tot 1Ki 18:42 , en elders meer. Deze woorden nu, uw hoofd op u is als Karmel, kunnen betekenen dat de Bruid met wijsheid en verstand voortreffelijk begaafd is; gelijk de berg Karmel, zeer vruchtbaar zijnde, veel goede vruchten voortbracht. Anderen vertalen hier het woord Karmel door karmozijn, gelijk een gelijk woord, te weten Karmil, vertaald wordt, 2Ch 3:14 ."},{"catchword":"de haarband","tekst":"Versta hier dien band, waarmede men den pronk of het sieraad des hoofds opbindt. Het Hebreeuwse woord dallath betekent eigenlijk dunnigheid, tederheid, properheid, zodat het hier ook kan beduiden dun of teder haar. Zie Son 4:1 ."},{"catchword":"purper;","tekst":"Deze kleur, alsook karmozijn, droegen eertijds koningen en prinsen, en was derhalve deze Bruid wel passende en betamende, die ene prinsendochter genoemd wordt, vs.1. En deze kleuren zijn afbeeldingen van het bloed van Jezus Christus."},{"catchword":"de koning","tekst":"Versta hier bij den koning den koning Salomo, zijnde een figuur van Christus. De zin is: Als de koning wil gaan over de galerij van de ene kamer naar de andere, en in het gaan u ziet, zo moet hij stilstaan om u te aanschouwen, niet anders dan of hij aan de galerij vastgebonden ware. Anders: De koning wordt [daarvan] gebonden aan de gangen."},{"catchword":"op de galerijen","tekst":"Het Hebreeuwse woord Rehatim is Gen 30:38 , Gen 30:41 , en Exo 2:16 , vertaald goten; maar een gelijk woord Son 1:17 , is vertaald galerijen, gelijk het hier ook alzo moet genomen worden; en versta door het woord galerijen gebouwen langs de huizen gaande. En op, of in, de galerijen gebonden te zijn, betekent hier, dat Christus een vaste woning of verblijf heeft in het huis zijner kerk, waar deze gebonden is en gebonden blijft met de banden der liefde, die Hij zijn lieve Bruid, de kerk, is toedragende, Rom 8:35 . Zie ook Psa 45:12 ; Isa 62:4 ; Eze 37:25-26 , en Eze 48:25 ; Hos 2:19 ; Joh 14:23 ; 2Co 6:16 ; Rev 22:3 , Rev 22:5 ."}],"6":[{"catchword":"Hoe schoon","tekst":"Hier geeft de Bruidegom reden waarom Hij met liefde aan zijne Bruid gebonden is en gebonden blijft, gelijk hij vs.5 gezegd heeft; zie boven Son 1:15-16 , en Son 4:9-10 ."},{"catchword":"in wellusten","tekst":"Dat is, in allerlei vermakelijkheid, alzo dat al degenen, die deze Bruid liefhebben, zich met haar kunnen verheugen en verblijden in de schoonheid harer heerlijkheid, gelijk Isa 66:10-11 ."}],"7":[{"catchword":"lengte","tekst":"Of, statuur, gestalte."},{"catchword":"palmboom,","tekst":"Dit is een schone hoge boom, rechtop wassende, altijd groen en bloeiende en schone vruchten dragende. Daarom wordt der godzaligen staat bij denzelven vergeleken, Psa 92:13 ; zie ook 1Ki 6:29 , en 1Ki 7:36 ."},{"catchword":"druiftrossen","tekst":"Te weten bij zulke druiventrossen, die vol sap en vochtigheid zijn, welke de gelovigen mogen zuigen, hemelse vertroostingen daaruit ontvangende tot verzadiging, Son 4:5 , en Isa 66:11 ."}],"8":[{"catchword":"Ik zeide","tekst":"Te weten bij mijzelven; dat is, Ik dacht, Ik nam mij vast voor."},{"catchword":"Ik zal op den palmboom","tekst":"Te weten om de vruchten daarvan te plukken. Neem deze woorden als van den Bruidegom gesproken zijnde, te kennen gevende dat Hij een welgevallen heeft aan de geestelijke vruchten zijner Bruid. Zie Son 5:1 ."},{"catchword":"ik zal zijn takken","tekst":"Dat is, Ik zal de takken van dezen palmboom tot mij nemen, reinigen en bewaren, opdat zij des te beter vruchten voortbrengen; Joh 15:2 ."},{"catchword":"zo zullen","tekst":"Dit is ene belofte, die de Bruidegom zijne Bruid doet, dat Hij haar zegenen zal, haar vervullende met het sap of de vochtigheid zijner genade, dat zij niet onvruchtbaar zal zijn in de kennis van Christus; 2Pe 1:8 . Zie ook Isa 27:6 . Maar anderen nemen de woorden van den tekst als een wens, in dezen zin: Dat toch uwe borsten zijn gelijk, enz., dat is, dat gij toch geen ledige of onnutte wijnstok zijt, gelijk van Israël geschreven staat; Hos 10:1 . Maar dat gij vol des Geestes zijt, opdat de zuigelingen mogen gezuigen en verzadigd worden met de borsten der vertroosting; Isa 66:11 ."},{"catchword":"uw neus","tekst":"Vergelijk boven vs.4 met de aantekening."},{"catchword":"appelen","tekst":"Die een lieflijken reuk hebben onder andere boomvruchten, van wat soort die ook mogen wezen. Doch enigen verstaan hier reukappelen, die de apothekers maken van verscheidene welriekende specerijen."}],"9":[{"catchword":"uw gehemelte","tekst":"Dat is, de leer der kerk is gelijk goede wijn om de bedroefde harten te laven en te verkwikken; Pro 31:6 . Zie ook deze gelijkenis van den wijn genomen, Isa 55:1 , en Pro 9:5 ."},{"catchword":"recht","tekst":"Hebreeuws, naar de gerechtighende; dat is, recht toe recht aan, gelijk men gemeenlijk spreekt. Alzo ook Pro 23:31 . Anders: die naar de gerechtigheden tot mijn beminde gaat. Dat is, wiens woorden daartoe strekken om anderen tot Christus te brengen en alzo ter gerechtigheid, dat is tot alle goede werken, waarin Hij wil dat wij zullen wandelen."},{"catchword":"tot mijn Beminde","tekst":"Dat is tot elkeen van mijne ledematen."},{"catchword":"doende","tekst":"De mening is, gelijk de wijn de mensen spraakzaam maakt, Pro 23:29 , alzo maakt de Geest Gods dat degenen, die denzelven hebben rijkelijk in hen wonende, spreken van de verborgenheden Gods en vertellen de grote daden des Heeren, Act 2:4 , Act 2:11 , Act 2:13 , enz."},{"catchword":"der slapenden","tekst":"Dat is dergenen, die nu uit den slaap der zonde gewekt zijn door de predikatie van het goddelijke Woord; Eph 4:14 ."}],"10":[{"catchword":"Ik ben mijns Liefsten,","tekst":"Dit zijn de woorden der Bruid, vervuld zijnde met den wijn der genade en van den troost, welken zij van haren Bruidegom ontvangen had; zij getuigt en belijdt hare zekerheid door het geloof dat zij Christus toebehoort. Zie Gal 3:29 . Zie ook de aantekening Son 2:16 , en Son 6:3 ."},{"catchword":"genegenheid","tekst":"Of, zijne begeerte strekt tot mij."}],"11":[{"catchword":"laat ons uitgaan","tekst":"De Bruid verzoekt het gezelschap van Christus, want zonder Hem kunnen wij niets doen; Joh 15:5 ."},{"catchword":"in het veld . . . op de dorpen","tekst":"De Bruid verzoekt aan den Bruidegom dat zij in het veld en op de dorpen mocht gaan; te weten om hare landbouwerij te bezien, hoe het daarmede al ging, en of de bomen goede en overvloedige vruchten voortbrachten, gelijk gezegd wordt vs.12. Dit betekent de liefde en zorg van Christus en van zijne gemeente, tot voortplanting van het heilige Evangelie en wasdom der kerk door de ganse wereld, want het veld of akker is de wereld, Mat 13:38 ; gelijk Christus zelf in de dagen zijns vleesches is gegaan in alle steden en vlekken, predikende het Evangelie, Mat 9:35 ; Mar 6:6 . Alzo zijn ook de apostelen uitgezonden om het Evangelie te prediken allen volken der wereld, Mat 28:19 ; zie ook Act 15:36 . De opbouwing der gemeente wordt ook bij een akkerwerk vergeleken, 1Co 3:9 , en de getrouwe leraars worden ook aldaar Gods medewerkers genoemd."},{"catchword":"laat ons vernachten","tekst":"Hiermede wordt aangewezen de wakende zorgvuldigheid der kerk, die ook bij nacht de wacht is houdende over haren wijnberg."}],"12":[{"catchword":"Laat ons vroeg","tekst":"Dit is wederom een teken van naarstige zorgvuldigheid. Zie 2Ch 36:15 , en Jer 25:3-4 ."},{"catchword":"naar de wijnbergen,","tekst":"Dat is, tot de kerken en plaatsen, waar het Evangelie is geplant of gepredikt geworden. Want het huis van Israël is des Heeren wijngaard; Isa 5:7 ."},{"catchword":"de jonge druifjes","tekst":"Zie Son 2:13 , Son 2:15 ."},{"catchword":"zich opendoen,","tekst":"Of, zich openen, of geopend hebben. Anders, bloeien; zie Son 6:11 ."},{"catchword":"daar zal ik U","tekst":"Te weten in de wijngaarden der kerk, in de vergaderingen der heiligen; daar zal ik mijne ziel en mijn lichaam u opofferen tot een aangename en welriekende offerande."},{"catchword":"mijn uitnemende","tekst":"Dat is, het geniete van de vruchten van mijn geloof, belijdenis, dankbaarheid, goede werken, enz.; zie Isa 27:3 , Isa 27:6 , en Isa 65:9 ; Eze 20:40-41 ."}],"13":[{"catchword":"De dûdaïm","tekst":"De rechte betekenis van het woord is ons onbekend. Zie Gen 30:14 . Het kan geen mandragora zijn, zodanig als die bij ons bekend is, gelijk sommigen menen, overmits onze mandragora een stinkenden reuk heeft, die het hoofd zwaar en slaperig maakt. De Bruid wil hier zeggen dat er alrede goede hoop van bekering aan haar te merken is, gelijk het uitspruiten van de bloemen een voorbereidsel is van toekomende vruchten. Zie boven Son 2:12 ."},{"catchword":"geven reuk,","tekst":"Te weten, een lieflijken aangenamen reuk. De zin is, dat de faam der genade en genade Gods over zijn volk uitgestort, zich wijd en breed verspreidt."},{"catchword":"aan onze deuren","tekst":"Of, bij onze deuren. Vergelijk Mat 24:32-33 ."},{"catchword":"allerlei","tekst":"Zie Son 4:13 , Son 4:16 ."},{"catchword":"nieuwe","tekst":"Dit betekent verscheidenheid en overvloed van vruchten. Zie Lev 26:10 ; zie ook Mat 13:52 . Bij de oude vruchten versta de eerste gaven en werken, die zij tevoren ontvangen hadden; Rev 2:5 . Bij de nieuwe vruchten kan men verstaan de verse genaden, die zij eerst kort ontvange hadden. Want die de gave der wedergeboorte wel gebruikt, die zal er door Gods genade nog meer ontvangen; Mat 25:29 ; Rev 2:19 . Sommigen verstaan hierdoor dubbele vruchten op de bomen, oude, rijpe en afgaande en nieuwe, onrijpe, aankomende, gelijk aan de oranjebomen en verscheiden andere gezien wordt."},{"catchword":"die heb ik","tekst":"Gelijk het goed, hetwelk de Heere voor degenen, die Hem vrezen, heeft weggelegd, groot is; Psa 31:20 ; alzo moeten al de goede vruchten, die van zijn volk vloeien, gericht en aangesteld worden tot zijn eer en lof; want van Hem, en door Hem en tot Hem zijn alle dingen; Hem zij de eer in eeuwigheid, Amen; Rom 11:36 ; Pro 16:4 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"How beautiful are thy goings in the shoes, [Understand hereby, her conversation in the faith in Jesus Christ, to wit so, as that her feet are shod with the preparation of the Gospel of peace, manifesting thereby, that she is born of God, Ephes. 6. 15. See also Isai. 2. 7.] thou Princes Daughter; [Compare herewith John 1. 13. And Jam. 1. 18. This Spouse, or the Church, is also called a Kings Daughter, Psal. 45. 14. For god is a great King] the joints of thy thighs, are like precious chains, [Or, like neck-chains, or, bracelets, or such like ornaments. See Prov. 25. On vers. 12. The Hebrew word rendered here joints (which is onely found in this place) cometh from a word that signifieth turning, or turning about, and it signifieth the hollowness wherein the hip or thigh bone is moved or turned about. These joints (or turning about) are compared to precious chains, or jewels, signifying the sure, upright, and fair feature, dealing, and conversation of his Princely, or Noble Daughter, well becoming the Gospel, whereof she maketh profession. Others render the Hebrew here girdles, and understand thereby the girdle of truth, which the chiefest workman of all good and perfect gifts, as is intimidated in the words following. This girdle is compared to chains of gold, that are fastened and joined together with many links; for truth hath many parts, but they all suit with one another, like the links of a chain] being the work of the hands of an Artificer, [Understand by this skilful workman, the Holy Ghost. See 1 Cor. 12. 4. It is said, Jam. 1. 17. That every good gift, and every perfect gift is from above, and cometh down from the Father of lights. It seemeth that the friends of the vers. 5. And vers. 9. Is spoken of Salomon or Christ, as of a third person: Notwithstanding some hold them to be the words of the Bridegroom]"}],"2":[{"catchword":null,"tekst":"Thy navel is (like) a round goblet, [The navel is the instrument, whereby the child is fed and nourished, while it is shut up in its mother&acirc;&euro;&trade;s womb. Understand here by navel, the navel of regeneration, whereby we are made partakers of spiritual life, when we are conceived in the womb of the Church, by the seed of the word of God. This gift is compared to a round goblet or bowl; which wanteth no drink or liquor, as followeth in the next words of the text; that is, which is never emptied or dried up, because by regeneration we receive the Spirit of adoption, which never departeth from the elect, Joh. 14. 16. But he becometh in them a well of water, springing up into everlasting life, Joh. 4. Vers. 14.] which wanteth no drink (or liquor:) [Heb. Which wanteth no mixture. Drink or liquor is often by the Hebrews called mixture, because they did not always drink the wine as pure as it came from the grape or wine-press, but they mingled it with water; or also with spices. See above chap. 5. 1. And Prov. 9. 2. And below chap. 8. 2. Mention is made of wine mingled with spices] thy belly is like an heap of wheat, [The spiritual gifts of the Spouse or Church of Christ are also fruitful, converting others, in such abundance and plenty, as wheat that beareth and bringeth forth much fruit, Psal. 72. 16.] set round about with lilies. [Heb. Fenced, etc. Hereby is shewed, that the fruitfulness of the Church is crowned with the blessing of God and Spiritual Joy. It seemeth to have respect to the new fruits, which they were used to crown or adorn with flowers, or green garlands. See Hos. 14. 6.]"}],"3":[{"catchword":null,"tekst":"Thy two breasts, are like two whelps, twins of a roe. [See the interpretation of this verse, above chap. 4. 5.]"}],"4":[{"catchword":null,"tekst":"Thy neck [By the neck is meant the power and glory of the Church of Christ. Others understand by the neck, hope and patience] is a tower of Ivory, [that is, beautiful, strong, and right. See above chap. 4. 4. And the annotate. There] thine eyes are (like) the fish-pools at Hesbon (To wit, the eyes of thine understanding, and of thy faith, they are full of clear and pure water, being clear to see and discern the truth, and to consider her own ways and goings, and the ways and going of others. See above chap. 4. Vers. 1. (at Hesbon) In the City of Hesbon King of Sihon formerly kept his Court, Numb. 21. 26. It lay in a goodly fat soil or region, which fell by lot unto the Reubinites, Numb. Cha. 32. Vers. 3, 4, 5, to 37. It seemeth that there were in this city very fair fish-pools, that beautified and adorned it, as the eyes do the body. Oth. Like fish-pools with consideration, or, with thought; that is, curiosly, or artificially made] by the gate of Bath-rabbim: [That is, by the gate, where many go out and in, or, by the gate where many men meet together. Some conceive that there was fair fish pools. Some take it for the sheep gate, Nehem. 3. 1. Or, the fountain-gate,, Nehem. 3. 15. Others take it to be a gate of the city of Hesbon] Thy nose is as the tower of Libanon, [Here by way of similitude or comparison is described the beauty of the nose, and consequently of the whole face. Some take the words thus, Because the nose is the instrument of smell, whereby we can discern the virtue of many things; therefore they understand by it, the judgement, and the spirit of ations of the blood of Christ] the King is (as it were) tied in the galleries. [Understand here by the King, King Salomon, who was a type and figure of Christ. The meaning is; When the King intendeth to go over the galley from one chamber into other, and spieth thee in his going; he is fain to stand still to look upon thee; no otherwise then as if he were bound and tied fast to the gallery. Oth. The King is (thereby) tied to the goings. The Hebrew word Repatim, is Genes.30.38,41. And Exo 2:16. rendered gutters: but a like word, above chap.1.5,17,18. Rendered galleries, as it must likewise be so taken in this place. And understand by the word Galleries, Fabrics or buildings that go all along the Houses. And to be tied upon, or, in the Galleries; signifieth here, that Christ hath a sure and firm habitation or abode, in the house of his church, where this King is tied, and continueth tied with the bands and cords of love, which he beareth unto his beloved spouse the church, Rom 8:35. See also Psal.45.12. Isai.62.4. Ezech.37.25,20. And chap.48.vers.35. Hos 2:19. Joh.14.23. 2 Cor.6.16. Revel.22.3,5.]"}],"6":[{"catchword":null,"tekst":"How fair art thou, and how pleasant art thou, O Love, [Here the Bridegroom sheweth a reason why he is tied, and continued still tied with or by love unto his spouse, as he affirmeth vers.5. See above chap.1.vers.15,16. And chap.4.vers.9,10.] in delights! [That is, in all manner of recreation, so that all those that love this spouse, may rejoice with her, and be glad in the beauty of her glory, as Isai.66.10,11.]"}],"7":[{"catchword":null,"tekst":"This thy length [Or, stature, shape] is to be likened to a palm-tree, [this is a fair tall tree, growing straight up or bolt up-right, always green and flourishing, and bearing fair and excellent fruit. Therefore the condition of the godly is compared unto it, Psal.92.13. See also 1 Kings 6.29. and 7.39.] and thy brests to clusters (of grapes.) [To wit, to such clusters of grapes, as are full of sap and moistures, which the faithful may suck, receiving from thence heavenly comforts and consolations unto satiety, Isa 66:11. and above chap.4.vers.5.]"}],"8":[{"catchword":null,"tekst":"I said, [To wit, with my self; that is, I thought, I firmly resolved] I will climb up into the palm-tree, [to wit, to gather the fruits from off it. Take these words as being spoken by the Bridegroom, intimating that he greatly delighted in the spiritual fruits of his spouse. See above chap.5.vers.1.] I will take hold of the boughs thereof: [that is, I will take the boughs or branches of this palm-tree unto my self, and I will purge and keep them, that they may bring forth better fruit, Joh.15.7.] so then thy brests shall be as clusters of grapes on the vine, [this is a promise, which the bridegroom maketh unto his spouse, to wit, that he will bless her, filling her with the sap and moisture of his grace, so as that she shall not be barren or unfruitful in the knowledge of Christ, 2 Pet.1.8. See also Isai.27.6. But others take the words of the text to be a wish or desire, in this sense: that thy breasts might be, etc. That is, that thou wearest no empty, or an unprofitable vine, as is written of Israel, Hos.10 1. But that thou were full of the Spirit, that the babes and sucklings might suck, and be filled with the breasts of consolation, Isa 66:11.] and the smell of thy nose [compare above vers.4. with the annotate.] like apples. [which have a pleasant smell among other fruits of trees, of what sort soever they may be. But some understand here pomanders or sweetapples, which the Apothecaries make of divers sweet-smelling spices.]"}],"9":[{"catchword":null,"tekst":"And the roof of thy mouth like good wine, which goeth straight to my beloved, causing the lips of the sleeping ones to speak. [That is, the Doctrine of the church is like good wine, to comfort and cheer the sad and heavy hearts, Prov.chap.31.v.6. See likewise this similitude taken from wine, Isa 55:1. and Pro 9:5. (which goeth straight to my beloved:) Hebr. According to the righteousnesses; that is, right on, straight forward, as we commonly use to say, so also Pro 23:31. Oth. Which goeth according to the righteousnesses to my beloved: That is, whose words tend thereunto, to bring others unto Christ, and consequently to righteousness; that is, to all good works, wherein he will have us to walk. (To my beloved:) That is, to every one of my members. (Causing the lips of the sleeping ones to speak:) The meaning is, As wine maketh men affable and fluent in words, Pro 23:29. So the spirit of God maketh those that have him dwelling richly in them, to speak of the mysteries of God, and to relate the great and wonderful works of the Lord, Act 2:4,11,13. (of the sleepings ones:) that is, of those that are now raised or wakened out of the sleep of sin, by the preaching of the word of God, Eph 5:14.]"}],"10":[{"catchword":null,"tekst":"I am my best-beloveds; [These are the words of the Spouse, being filled with the wine of grace and comfort, which she had received of her Bridegroom. She testifieth and confesseth and confesseth her assurance by faith, that she belongeth to Christ, see Gal 3:29. see also the annotate. Above, chap.2. on vers.16. and chap.6.on v.3.] and his affection is toward me. [or, his desire tendeth unto me.]"}],"11":[{"catchword":null,"tekst":"Come my best beloved, let us go forth into the field, let us overnight in the villages; [The Spouse requireth the company of Christ; for without him we can do nothing, Job 15:5. The Spouse petitioneth the Bridegroom for leave to go into the field, and into the villages; to wit, to visit her tillage, to see what success it had, and whether the trees brought forth good and plentiful fruit, as is said, v.12. This signifieth the love and care of Christ, and of his church, for the propagation of the Gospel, and the increase and augmentation of the church throughout the whole world, (for the field is the world, Mat 13:38.) as Christ himself // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
