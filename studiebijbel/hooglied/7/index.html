iefde, in heerlijkheden!", "7": "Deze uw lengte is te vergelijken bij een palmboom, en uw borsten bij druiventrossen.", "8": "Ik zei: Ik zal in de palmboom klimmen, ik zal zijn takken grijpen; zo zullen dan uw borsten zijn als druiventrossen aan de wijnstok, en de geur van uw neus als appels.", "9": "En uw gehemelte als goede wijn, die vlot naar mijn Beminde toe gaat, en de lippen van de slapende doet spreken.", "10": "Ik ben van mijn Liefste, en Zijn verlangen is naar mij uit.", "11": "Kom, mijn Liefste! Laten wij uitgaan in het veld, laten wij overnachten in de dorpen.", "12": "Laten wij vroeg opstaan naar de wijngaarden, laten wij zien of de wijnstok bloeit, de jonge druifjes zich openen, de granaatappelbomen uitbotten; daar zal ik U mijn liefde geven.", "13": "De liefdesappels geven geur, en aan onze deuren zijn allerlei heerlijke vruchten, nieuwe en oude; mijn Liefste! die heb ik voor U weggelegd."}, "SV": {"1": "Hoe schoon zijn uw gangen in de schoenen, gij prinsendochter! de omdraaiingen uwer heupen zijn als kostelijke ketens, zijnde het werk van de handen eens kunstenaars.", "2": "Uw navel is *als* een ronde beker, dien geen drank ontbreekt; uw buik is *als* een hoop tarwe, rondom bezet met leliën.", "3": "Uw twee borsten zijn als twee welpen, tweelingen van een ree.", "4": "Uw hals is als een elpenbenen toren, uw ogen zijn *als* de vijvers te Hesbon, bij de poort van Bath-rabbim; uw neus is als de toren van Libanon, die tegen Damaskus ziet.", "5": "Uw hoofd op u is als Karmel, en de haarband uws hoofds als purper; de koning is *als* gebonden op de galerijen.", "6": "Hoe schoon zijt gij, en hoe liefelijk zijt gij, o liefde, in wellusten!", "7": "Deze uw lengte is te vergelijken bij een palmboom, en uw borsten bij *druif* trossen.", "8": "Ik zeide: Ik zal op den palmboom klimmen, ik zal zijn takken grijpen; zo zullen dan uw borsten zijn als *druif* trossen aan den wijnstok, en de reuk van uw neus als appelen.", "9": "En uw gehemelte als goede wijn, die recht tot mijn Beminde gaat, doende de lippen der slapenden spreken.", "10": "Ik ben mijns Liefsten, en Zijn genegenheid is tot mij.", "11": "Kom, mijn Liefste! laat ons uitgaan in het veld, laat ons vernachten op de dorpen.", "12": "Laat ons vroeg ons opmaken naar de wijnbergen, laat ons zien, of de wijnstok bloeit, de jonge druifjes zich opendoen, de granaatappelbomen uitbotten; daar zal ik U mijn uitnemende liefde geven.", "13": "De dudaim geven reuk, en aan onze deuren zijn allerlei edele vruchten, nieuwe en oude; o mijn Liefste! die heb ik voor U weggelegd."}, "KJV": {"1": "How beautiful are thy feet with shoes, O prince's daughter! the joints of thy thighs *are* like jewels, the work of the hands of a cunning workman.", "2": "Thy navel *is like* a round goblet, *which* wanteth not liquor: thy belly *is like* an heap of wheat set about with lilies.", "3": "Thy two breasts *are* like two young roes *that are* twins.", "4": "Thy neck *is* as a tower of ivory; thine eyes *like* the fishpools in Heshbon, by the gate of Bathrabbim: thy nose *is* as the tower of Lebanon which looketh toward Damascus.", "5": "Thine head upon thee *is* like Carmel, and the hair of thine head like purple; the king *is* held in the galleries.", "6": "How fair and how pleasant art thou, O love, for delights!", "7": "This thy stature is like to a palm tree, and thy breasts to clusters", "8": "I said, I will go up to the palm tree, I will take hold of the boughs thereof: now also thy breasts shall be as clusters of the vine, and the smell of thy nose like apples;", "9": "And the roof of thy mouth like the best wine for my beloved, that goeth *down* sweetly, causing the lips of those that are asleep to speak.", "10": "I *am* my beloved's, and his desire", "11": "Come, my beloved, let us go forth into the field; let us lodge in the villages.", "12": "Let us get up early to the vineyards; let us see if the vine flourish, *whether* the tender grape appear, *and* the pomegranates bud forth: there will I give thee my loves.", "13": "The mandrakes give a smell, and at our gates *are* all manner of pleasant *fruits*, new and old, *which* I have laid up for thee, O my beloved."}}, "tsk": {"1": [{"kopje": "uw gangen", "refs": ["Luk 15:22", "Ef 6:15", "Fil 1:27"]}, {"kopje": "prinsendochter", "refs": ["Ps 45:14", "2 Kor 6:18"]}, {"kopje": "de omdraaiingen", "refs": ["Dan 2:32", "Ef 4:15", "Ef 4:16", "Kol 2:19"]}, {"kopje": "het werk", "refs": ["Ex 28:15", "Ex 35:35"]}], "2": [{"kopje": "navel", "refs": ["Spr 3:8"]}, {"kopje": "uw buik", "refs": ["Hoogl 5:14", "Ps 45:17", "Jes 46:3", "Jer 1:5", "Rom 7:4"]}], "4": [{"kopje": "hals", "refs": ["Hoogl 1:10", "Hoogl 4:4"]}, {"kopje": "ivoren", "refs": ["Hoogl 5:14", "1 Kon 10:18", "1 Kon 10:22", "1 Kon 22:39", "Ps 45:9", "Ps 144:12"]}, {"kopje": "uw ogen", "refs": ["Hoogl 4:1", "Hoogl 4:9", "Hoogl 6:5", "Ef 1:17", "Ef 1:18", "Ef 3:18", "Ef 3:19"]}, {"kopje": "Hesbon", "refs": ["Num 21:25", "Jes 54:4"]}, {"kopje": "uw neus", "refs": ["Fil 1:9", "Fil 1:10", "Hebr 5:14"]}, {"kopje": "de toren", "refs": ["Hoogl 4:8", "Hoogl 5:15", "1 Kon 7:2", "1 Kon 9:19", "2 Kron 8:6"]}, {"kopje": "Damascus", "refs": ["Gen 15:2", "2 Sam 8:6"]}], "5": [{"kopje": "hoofd", "refs": ["Jes 35:2", "Ef 1:22", "Ef 4:15", "Ef 4:16", "Kol 1:18", "Kol 2:19"]}, {"kopje": "Karmel", "refs": ["Micha 7:14"]}, {"kopje": "het haar", "refs": ["Hoogl 4:1", "Hoogl 5:11", "Openb 1:14"]}, {"kopje": "de koning", "refs": ["Hoogl 1:17", "Gen 32:26", "Ps 68:25", "Ps 87:2", "Matt 18:20", "Matt 28:20"]}], "7": [{"kopje": "uw lengte", "refs": ["Ps 92:13", "Jer 10:5", "Ef 4:13"]}, {"kopje": "uw borsten", "refs": ["Hoogl 7:3", "Hoogl 7:8", "Hoogl 1:13", "Hoogl 4:5", "Hoogl 8:8", "Jes 66:10", "Ef 3:17"]}], "8": [{"kopje": "ik zal in", "refs": ["Hoogl 4:16", "Hoogl 5:1", "Jer 32:41", "Joh 14:21-23"]}, {"kopje": "de geur", "refs": ["Hoogl 1:3", "Hoogl 2:3", "2 Kor 2:14"]}], "9": [{"kopje": "gehemelte", "refs": ["Hoogl 2:14", "Hoogl 5:16", "Spr 16:24", "Ef 4:29", "Kol 3:16", "Ko ft overgegeven.", "Hoogl 2:15": "Vang voor ons de vossen, de kleine vossen, die de wijngaarden verderven, want onze wijngaarden hebben jonge druifjes.", "Jes 18:5": "Want vóór de oogst, als de bloesem volkomen is, en de onrijpe druif rijp wordt na de bloei, zo zal Hij de ranken met snoeimessen afsnijden, en de takken wegdoen en afkappen.", "Num 21:25": "Zo nam Israël al deze steden in; en Israël woonde in al de steden van de Amorieten, te Hesbon, en in al haar onderhorige plaatsen.", "Spr 24:30": "Ik ging voorbij de akker van een luiaard, en voorbij de wijngaard van een verstandeloos mens;", "Ps 144:12": "opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis.", "Hoogl 5:11": "Zijn hoofd is van het fijnste goud, van het dichtste goud; Zijn haarlokken zijn gekruld, zwart als een raaf.", "2 Sam 8:6": "En David legde bezettingen in Syrië van Damaskus, en de Syriërs werden David tot knechten, en zij brachten geschenken; en de HEERE behoedde David overal waar hij heentrok.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Zach 9:15-17": "De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden. Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Ef 3:19": "en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Jes 23:18": "En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben.", "Ps 45:12": "Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer.", "Hoogl 5:16": "Zijn gehemelte is enkel zoetigheid, en al wat aan Hem is, is geheel begeerlijk. Zulk een is mijn Liefste; ja, zulk een is mijn Vriend, dochters van Jeruzalem!", "Ps 45:17": "In plaats van uw vaderen zullen uw zonen zijn; U zult hen tot vorsten aanstellen over de hele aarde.", "Ef 1:22": "En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Ezech 27:15": "De kinderen van Dedan waren uw kooplieden; veel eilanden waren de koophandel van uw hand; hoornen van ivoor en ebbenhout gaven zij u terug tot een geschenk.", "Gen 30:14": "En Ruben ging in de dagen van de tarweoogst, en hij vond dudaïm in het veld, en hij bracht die naar zijn moeder Lea. Toen zei Rachel tegen Lea: Geef mij toch van de dudaïm van uw zoon.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Gen 32:26": "En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "Jes 62:8": "De HEERE heeft gezworen bij Zijn rechterhand, en bij de arm van Zijn sterkte: Als Ik uw koren nog geef tot voedsel voor uw vijanden, en als de vreemden zullen drinken van uw most, waarvoor u hebt gewerkt!", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Hoogl 6:11": "Ik ben naar de notenhof afgegaan om de jonge scheuten van het dal te zien; om te zien of de wijnstok bloeide, de granaatbomen uitbotten.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "1 Kor 8:9": "Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn.", "Amos 1:2": "En hij zei: De HEERE zal brullen uit Sion, en Zijn stem verheffen uit Jeruzalem; en de woningen van de herders zullen treuren, en de top van Karmel zal verdorren.", "2 Kron 8:6": "alsook Baälath, en alle schatsteden die Salomo had, en alle wagensteden, en de steden van de ruiters, en alles wat de begeerte van Salomo begeerd had te bouwen in Jeruzalem, en in de Libanon, en in heel het land van zijn heerschappij.", "1 Kon 10:18": "Verder maakte de koning een grote ivoren troon, en overtrok die met zuiver goud.", "Hoogl 5:14": "Zijn handen zijn als gouden ringen, gevuld met turkoois; Zijn buik is als blinkend ivoor, overtrokken met saffieren.", "Ef 6:24": "De genade zij met allen die onze Heere Jezus Christus liefhebben in onvergankelijkheid. Amen. Vanuit Rome aan de Efeziërs geschreven, door bemiddeling van Tychikus.", "Hoogl 1:4": "Trek mij, wij zullen u nalopen! De koning heeft mij gebracht in zijn binnenkamers; wij zullen ons verheugen en in u verblijden; wij zullen uw uitnemende liefde vermelden, meer dan de wijn; de oprechten hebben u lief.", "Spr 16:24": "Vriendelijke woorden zijn een honingraat, zoet voor de ziel, en medicijn voor het gebeente.", "Jes 33:9": "Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud.", "Joh 14:21-23": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren. Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld? Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Hoogl 4:8": "Bij Mij vanaf de Libanon, o bruid! Kom bij Mij vanaf de Libanon; kijk vanaf de top van Amana, vanaf de top van Senir en van Hermon, vanaf de woningen van de leeuwinnen, vanaf de bergen van de luipaarden.", "Gen 30:14-16": "En Ruben ging in de dagen van de tarweoogst, en hij vond dudaïm in het veld, en hij bracht die naar zijn moeder Lea. Toen zei Rachel tegen Lea: Geef mij toch van de dudaïm van uw zoon. En zij zei tegen haar: Is het weinig dat u mijn man genomen hebt, dat u ook de dudaïm van mijn zoon nemen wilt? Toen zei Rachel: Daarom zal hij deze nacht bij u liggen, voor de dudaïm van uw zoon. Toen Jakob 's avonds uit het veld kwam, ging Lea naar buiten, hem tegemoet, en zei: U moet bij mij komen; want ik heb u zeker gehuurd voor de dudaïm van mijn zoon; en hij lag die nacht bij haar.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Hoogl 4:9": "U hebt Mij het hart genomen, Mijn zuster, o bruid! U hebt Mij het hart genomen, met een van uw ogen, met een keten van uw hals.", "Ps 59:17": "Maar ik zal Uw sterkte bezingen, en 's morgens Uw goedertierenheid vrolijk roemen, omdat U mij een Hoog Vertrek bent geweest, en een Toevlucht ten dage dat mij bang was.", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "Jer 32:41": "En Ik zal Mij over hen verblijden, dat Ik hun goeddoe; en Ik zal hen trouw in dat land planten, met Mijn hele hart en met Mijn hele ziel.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Joh 15:8": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn.", "Jes 60:7": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "1 Kon 9:19": "En al de schatsteden, die Salomo had, en de wagensteden, en de steden van de ruiters, en wat de begeerte van Salomo begeerde te bouwen, in Jeruzalem, en op de Libanon, en in het hele land van zijn heerschappij.", "2 Kor 2:14": "En God zij dank, Die ons altijd doet triomferen in Christus, en de geur van Zijn kennis door ons openbaar maakt op elke plaats.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Jer 10:5": "Zij zijn gelijk een palmboom van dicht werk, maar kunnen niet spreken; zij moeten gedragen worden, want zij kunnen niet gaan; vreest niet voor hen, want zij kunnen geen kwaad doen, ook is er geen goeddoen bij hen.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Ef 4:29": "Laat geen vuile taal uit uw mond komen, maar als er iets goeds is tot nuttige opbouw, opdat het genade geeft aan hen die het horen.", "Hand 4:32": "En de menigte van hen die geloofden, was een van hart en een van ziel; en niemand zei dat iets van wat hij had zijn eigendom was, maar alle dingen waren hun gemeenschappelijk.", "Ps 63:2": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "1 Kon 10:22": "Want de koning had op zee schepen van Tharsis, samen met de schepen van Hiram; deze schepen van Tharsis kwamen eens in de drie jaar binnen, met goud, en zilver, ivoor, en apen, en pauwen.", "Hand 15:36": "En na enige dagen zei Paulus tegen Barnabas: Laten wij nu teruggaan en onze broeders bezoeken in elke stad waarin wij het Woord van de Heere verkondigd hebben, om te zien hoe het met hen gaat.", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Luk 15:22": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten;", "Joël 1:12": "De wijnstok is verdord, de vijgenboom is uitgeput; de granaatappelboom, ook de palmboom en appelboom; alle bomen van het veld zijn verdord; ja, de vrolijkheid is verdord van de mensenkinderen.", "Hoogl 2:3": "Als een appelboom onder de bomen van het woud, zo is mijn Liefste onder de zonen; ik heb grote lust in Zijn schaduw, en zit er onder, en Zijn vrucht is mijn gehemelte zoet.", "Hoogl 2:16": "Mijn Liefste is van mij, en ik ben van Hem, Die weidt onder de lelies,", "2 Kor 5:15": "Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.", "Openb 1:14": "En Zijn hoofd en haar was wit, als witte wol, als sneeuw; en Zijn ogen als een vlam van het vuur;", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Ezech 20:40": "Want op Mijn heilige berg, op de hoge berg van Israël, spreekt de Heere HEERE, daar zal Mij het hele huis van Israël in het land dienen, zij allen; daar zal Ik welgevallen aan hen hebben, en daar zal Ik uw hefoffers eisen, en de eerstelingen van uw heffingen met al uw geheiligde dingen.", "Ps 5:4": "Des morgens, HEERE, zult U mijn stem horen; des morgens zal ik mij tot U schikken, en wacht houden.", "Ef 6:15": "en de voeten geschoeid met bereidheid van het Evangelie van de vrede;", "Ps 45:14": "De Dochter van de Koning is geheel verheerlijkt van binnen; haar kleding is van gouden borduursel.", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Hoogl 5:15": "Zijn schenkels zijn als marmeren pilaren, gegrond op voeten van het dichtste goud; Zijn gestalte is als de Libanon, uitverkoren als de ceders.", "Hand 16:30-34": "En hij bracht hen naar buiten en zei: Beste heren, wat moet ik doen om zalig te worden? En zij zeiden: Geloof in de Heere Jezus Christus, en u zult zalig worden, u en uw huis. En zij spraken tot hem het woord van de Heere, en tot allen die in zijn huis waren.", "Jer 1:5": "Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Ps 63:4-9": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen. Zo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen. Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Ef 4:15": "Maar dat wij, terwijl wij de waarheid betrachten in liefde, in alle dingen zouden opgroeien in Hem, Die het Hoofd is, namelijk Christus;", "Hoogl 8:8": "Wij hebben een kleine zuster, die nog geen borsten heeft; wat zullen wij voor onze zuster doen in de dag dat men over haar zal spreken?", "Kol 1:18": "en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.", "Hand 27:23": "Want deze zelfde nacht heeft bij mij gestaan een engel van God, van Wie ik ben en Die ik ook dien,", "Kol 2:19": "En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei.", "Jes 66:10": "Verblijd u met Jeruzalem, en verheug u over haar, al haar liefhebbers! Wees vrolijk over haar met vreugde, u allen die over haar hebt getreurd!", "Hoogl 2:13": "De vijgenboom brengt zijn jonge vijgjes voort, en de wijnstokken geven geur met hun jonge druifjes. Sta op, Mijn vriendin! Mijn schone, en kom!", "Ps 92:13": "De rechtvaardige zal groeien als een palmboom; hij zal groeien als een cederboom op de Libanon.", "Rom 5:11": "En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Spr 25:11": "Een woord, op zijn tijd gesproken, is als gouden appels in zilveren gebeelde schalen.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Ps 122:5": "Want daar staan de stoelen van het gericht, de stoelen van het huis van David.", "Fil 1:9": "En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "1 Tess 3:6": "Maar nu Timotheüs van u tot ons gekomen is, en ons de goede boodschap gebracht heeft van uw geloof en liefde, en dat u altijd goede herinnering aan ons hebt, zeer verlangend om ons te zien, zoals wij ook naar u;", "Hoogl 6:5": "Wend uw ogen van Mij af, want zij overweldigen Mij; uw haar is als een kudde geiten, die van de berghellingen van Gilead afdalen.", "Ef 5:9": "(Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid),", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "Hoogl 2:14": "Mijn duif, die in de kloven van de steenrotsen bent, in het verborgene van een steile plaats, toon Mij uw gedaante, laat Mij uw stem horen; want uw stem is zoet, en uw gedaante is liefelijk.", "Ef 5:25": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Hoogl 4:16": "Ontwaak, noordenwind! En kom, Gij zuidenwind! Doorwaai mijn hof, zodat zijn specerijen uitvloeien. O, dat mijn Liefste tot Zijn hof kwam, en at van zijn edele vruchten!", "1 Kon 7:2": "Hij bouwde ook het huis van het woud van Libanon: honderd el lang, vijftig el breed, en dertig el hoog, op vier rijen cederen pilaren, met cederen balken op de pilaren.", "Micha 7:14": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.", "Hoogl 5:2": "Ik sliep, maar mijn hart waakte, de stem van mijn Liefste, Die klopte, was: Doe Mij open, Mijn zuster, Mijn vriendin, Mijn duif, Mijn volmaakte! Want Mijn hoofd is vervuld met dauw, Mijn haarlokken met de druppels van de nacht.", "Hoogl 4:5": "Uw twee borsten zijn gelijk twee welpen, tweelingen van een ree, die tussen de leliën grazen.", "Spr 3:8": "Het zal een medicijn voor uw navel zijn, en een bevochtiging voor uw beenderen.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Hoogl 8:5": "Wie is zij, die daar opklimt uit de woestijn, en liefelijk leunt op haar Liefste? Onder de appelboom heb ik u opgewekt; daar heeft uw moeder u met smart voortgebracht, daar heeft zij u met smart voortgebracht, die u gebaard heeft.", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "Kol 4:6": "Laat uw woord altijd aangenaam zijn, met zout besprengd, opdat u weet hoe u ieder moet antwoorden.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Spr 24:31": "En zie, hij was helemaal opgeschoten van distels; zijn gedaante was met netels bedekt, en zijn stenen scheidsmuur was afgebroken.", "Jes 19:10": "En zij zullen met hun fundamenten verbrijzeld worden, allen die voor loon lustige staande wateren maken.", "Hebr 5:14": "Maar voor de volwassenen is er het vaste voedsel, voor hen die door de gewoonte hun zintuigen geoefend hebben, om onderscheid te maken tussen goed en kwaad.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ef 3:17": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent;", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "Rom 15:25-27": "Maar nu reis ik naar Jeruzalem, om de heiligen te dienen. Want het heeft hen van Macedonië en Achaje goedgedacht een gezamenlijke bijdrage te doen aan de armen onder de heiligen die in Jeruzalem zijn. Want het heeft hun zo goedgedacht; ook zijn zij hun schuldenaars; want als de heidenen deel hebben gekregen aan hun geestelijke goederen, dan zijn zij ook verplicht hen met stoffelijke goederen te dienen.", "1 Tess 3:5": "Daarom heb ik ook, omdat ik het verlangen niet langer kon verdragen, hem gezonden om uw geloof te leren kennen; of de verzoeker u misschien niet had verzocht, en onze arbeid tevergeefs zou zijn.", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Ps 147:11": "De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.", "Gen 15:2": "Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?", "Hand 2:11-13": "Kretenzers en Arabieren, wij horen hen in onze talen de grote werken van God spreken. En zij ontzetten zich allen, en wisten niet wat zij ervan moesten denken, en zeiden de een tegen de ander: Wat zou dit toch betekenen? En anderen zeiden spottend: Zij zijn vol zoete wijn.", "Jer 50:19": "En Ik zal Israël terugbrengen naar zijn woning, en hij zal weiden op de Karmel en op de Basan; en zijn ziel zal op het gebergte van Efraïm en Gilead verzadigd worden.", "Ef 4:13": "Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Ef 4:16": "Uit Wie het hele lichaam bekwaam samengevoegd en samen vastgemaakt wordt, door alle gewrichten die het voeden, naar de werking van ieder deel in zijn maat, groei van het lichaam bereikt, tot opbouw van zichzelf in de liefde.", "Hoogl 4:1": "Zie, u bent mooi, Mijn vriendin! Zie, u bent mooi; uw ogen zijn duivenogen tussen uw vlechten; uw haar is als een kudde geiten, die van de berg Gilead afscheren.", "Hoogl 1:10": "Uw wangen zijn liefelijk in de spangen, uw hals in de parelsnoeren.", "Ps 87:2": "De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob.", "Ezech 20:41": "Ik zal een welgevallen aan u hebben om de liefelijke reuk, wanneer Ik u van de volken uitleid, en u zal verzamelen uit de landen waarin u verstrooid bent geweest, en Ik zal in u geheiligd worden voor de ogen van de heidenvolken.", "1 Tess 4:14": "Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Ex 28:15": "U zult ook een borstlap van het gericht maken, van het uiterst kunstige werk, gelijk het werk van de efod zult u hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult u hem maken.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Hoogl 8:10": "Ik ben een muur en mijn borsten zijn als torens. Toen was ik in Zijn ogen als iemand die vrede vindt.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Hoogl 2:5": "Ondersteun mij met de flessen, versterk mij met de appels, want ik ben ziek van liefde.", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Hoogl 6:3": "Ik ben van mijn Liefste, en mijn Liefste is van mij, Die onder de leliën weidt.", "Hoogl 1:13": "Mijn Liefste is mij een bundeltje mirre, dat tussen mijn borsten vernacht.", "Rom 13:11": "En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.", "Jer 46:18": "Zo waarachtig als Ik leef, spreekt de Koning, Wiens Naam is HEERE van de heerscharen; hij zal voorzeker, als Thabor onder de bergen, en als Karmel bij de zee, aankomen!", "1 Kon 22:39": "Het overige nu van de geschiedenis van Achab, en alles wat hij gedaan heeft, en het huis van ivoor dat hij gebouwd heeft, en al de steden die hij gebouwd heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Israël?", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Hoogl 5:1": "Ik ben in Mijn hof gekomen, o Mijn zuster, o bruid! Ik heb Mijn mirre geplukt met Mijn specerij; Ik heb Mijn honigraten met Mijn honig gegeten; Ik heb Mijn wijn, alsook Mijn melk gedronken. Eet, vrienden! Drink, en word dronken, o liefsten!", "Hoogl 2:10-13": "Mijn Liefste antwoordt, en zegt tegen mij: Sta op, Mijn vriendin, Mijn schone, en kom! Want zie, de winter is voorbij, de plasregen is over, hij is overgegaan; De bloemen worden gezien in het land, de zangtijd komt dichtbij, en de stem van de tortelduif wordt gehoord in ons land.", "Ef 3:18": "opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is,", "Hoogl 1:3": "Uw oliën zijn goed van geur, uw naam is een olie die uitgestort wordt; daarom hebben de maagden u lief.", "Ps 73:25": "Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "1 Tess 4:13": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben.", "Ps 88:14": "Maar ik, HEERE, roep tot U, en mijn gebed komt U al voor in de morgenstond.", "Hoogl 4:4": "Uw hals is als de toren van David, die gebouwd is tot ophanging van wapentuig, waar duizend rondassen aan hangen, allemaal schilden van de helden.", "Hoogl 1:17": "De balken van onze huizen zijn ceders, onze galerijen zijn cipressen."}, "noten": {"1": "Vers 9, \"slapende\": SV: slapenden. D.i.: hi span class=\"wl wl-kjv\" data-code=\"H8326\">navel</span> is like a <span class=\"wl wl-kjv\" data-code=\"H5469\">round</span> <span class=\"wl wl-kjv\" data-code=\"H101\">goblet,</span> which <span class=\"wl wl-kjv\" data-code=\"H2637\">wanteth</span> not <span class=\"wl wl-kjv\" data-code=\"H4197\">liquor:</span> thy <span class=\"wl wl-kjv\" data-code=\"H990\">belly</span> is like an <span class=\"wl wl-kjv\" data-code=\"H6194\">heap</span> of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> set <span class=\"wl wl-kjv\" data-code=\"H5473\">about</span> with lilies.", "3": "Thy <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts</span> are like <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6082\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6646\">roes</span> that are twins.", "4": "Thy <span class=\"wl wl-kjv\" data-code=\"H6677\">neck</span> is as a <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H8127\">ivory;</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> like the <span class=\"wl wl-kjv\" data-code=\"H1295\">fishpools</span> in <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H1337\">Bathrabbim:</span> thy <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> is as the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> which <span class=\"wl wl-kjv\" data-code=\"H6822\">looketh</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">toward</span> Damascus.", "5": "Thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> upon thee is like <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1803\">hair</span> of thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> like <span class=\"wl wl-kjv\" data-code=\"H713\">purple;</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> is <span class=\"wl wl-kjv\" data-code=\"H631\">held</span> in the galleries.", "6": "How <span class=\"wl wl-kjv\" data-code=\"H3302\">fair</span> and how <span class=\"wl wl-kjv\" data-code=\"H5276\">pleasant</span> art thou, O <span class=\"wl wl-kjv\" data-code=\"H160\">love,</span> for delights!", "7": "This thy <span class=\"wl wl-kjv\" data-code=\"H6967\">stature</span> is <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> to a palm <span class=\"wl wl-kjv\" data-code=\"H8558\">tree,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts</span> to clusters", "8": "I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the palm <span class=\"wl wl-kjv\" data-code=\"H8558\">tree,</span> I will take <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H5577\">boughs</span> thereof: now also thy <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H811\">clusters</span> of the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7381\">smell</span> of thy <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> like apples;", "9": "And the roof of thy <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> like the <span class=\"wl wl-kjv\" data-code=\"H2896\">best</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> for my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> down <span class=\"wl wl-kjv\" data-code=\"H4339\">sweetly,</span> causing the <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> of those that are <span class=\"wl wl-kjv\" data-code=\"H3463\">asleep</span> to speak.", "10": "I am my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved's,</span> and his desire", "11": "<span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> let us go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> let us <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> in the villages.", "12": "Let us get up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> to the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards;</span> let us <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> if the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> <span class=\"wl wl-kjv\" data-code=\"H6524\">flourish,</span> whether the tender <span class=\"wl wl-kjv\" data-code=\"H5563\">grape</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">appear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates</span> bud <span class=\"wl wl-kjv\" data-code=\"H5132\">forth:</span> there will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee my loves.", "13": "The <span class=\"wl wl-kjv\" data-code=\"H1736\">mandrakes</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> a <span class=\"wl wl-kjv\" data-code=\"H7381\">smell,</span> and at our <span class=\"wl wl-kjv\" data-code=\"H6607\">gates</span> are all manner of <span class=\"wl wl-kjv\" data-code=\"H4022\">pleasant</span> fruits, <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> and <span class=\"wl wl-kjv\" data-code=\"H3465\">old,</span> which I have laid <span class=\"wl wl-kjv\" data-code=\"H6845\">up</span> for thee, O my beloved."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
