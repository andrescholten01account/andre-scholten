,"12":"De bloemen worden gezien in het land, de zangtijd komt dichtbij, en de stem van de tortelduif wordt gehoord in ons land.","13":"De vijgenboom brengt zijn jonge vijgjes voort, en de wijnstokken geven geur *met* hun jonge druifjes. Sta op, Mijn vriendin! Mijn schone, en kom!","14":"Mijn duif, die in de kloven van de steenrotsen bent, in het verborgene van een steile plaats, toon Mij uw gedaante, laat Mij uw stem horen; want uw stem is zoet, en uw gedaante is liefelijk.","15":"Vang voor ons de vossen, de kleine vossen, die de wijngaarden verderven, want onze wijngaarden *hebben* jonge druifjes.","16":"Mijn Liefste is van mij, en ik ben van Hem, Die weidt onder de lelies,","17":"Totdat de dag aankomt, en de schaduwen vlieden; keer om, mijn Liefste! word Gij gelijk een ree, of een jong van de herten, op de bergen van Bether."},"SV":{"1":"Ik ben een Roos van Saron, een Lelie der dalen.","2":"Gelijk een lelie onder de doornen, alzo is Mijn vriendin onder de dochteren.","3":"Als een appelboom onder de bomen des wouds, zo is mijn Liefste onder de zonen; ik heb groten lust in Zijn schaduw, en zit er *onder*, en Zijn vrucht is mijn gehemelte zoet.","4":"Hij voert mij in het wijnhuis, en de liefde is Zijn banier over mij.","5":"Ondersteunt gijlieden mij met de flessen, versterkt mij met de appelen, want ik ben krank van liefde.","6":"Zijn linkerhand zij onder mijn hoofd, en Zijn rechterhand omhelze mij.","7":"Ik bezweer u, gij, dochteren van Jeruzalem! *die* bij de reeën, of bij de hinden des velds zijt, dat gij die liefde niet opwekt, noch wakker maakt, totdat het *dezelve* luste!","8":"*Dat* is de stem mijns Liefsten, ziet Hem, Hij komt, springende op de bergen, huppelende op de heuvelen!","9":"Mijn Liefste is gelijk een ree, of een welp der herten; ziet, Hij staat achter onzen muur, kijkende uit de vensteren, blinkende uit de traliën.","10":"Mijn Liefste antwoordt, en zegt tot mij: Sta op, Mijn vriendin, Mijn schone, en kom!","11":"Want zie, de winter is voorbij, de plasregen is over, hij is overgegaan;","12":"De bloemen worden gezien in het land, de zangtijd genaakt, en de stem der tortelduif wordt gehoord in ons land.","13":"De vijgeboom brengt zijn jonge vijgjes voort, en de wijnstokken geven reuk *met* *hun* jonge druifjes. Sta op, Mijn vriendin! Mijn schone, en kom!","14":"Mijn duive, zijnde in de kloven der steenrotsen, in het verborgene ener steile plaats, toon Mij uw gedaante, doe Mij uw stem horen; want uw stem is zoet, en uw gedaante is liefelijk.","15":"Vangt gijlieden ons de vossen, de kleine vossen, die de wijngaarden verderven, want onze wijngaarden *hebben* jonge druifjes.","16":"Mijn Liefste is mijn, en ik ben Zijn, Die weidt onder de leliën,","17":"Totdat de dag aankomt, en de schaduwen vlieden; keer om, mijn Liefste! wordt Gij gelijk een ree, of een welp der herten, op de bergen van Bether."},"KJV":{"1":"I *am* the rose of Sharon, *and* the lily of the valleys.","2":"As the lily among thorns, so *is* my love among the daughters.","3":"As the apple tree among the trees of the wood, so *is* my beloved among the sons. I sat down under his shadow with great delight, and his fruit *was* sweet to my taste.","4":"He brought me to the banqueting house, and his banner over me *was* love.","5":"Stay me with flagons, comfort me with apples: for I *am* sick of love.","6":"His left hand *is* under my head, and his right hand doth embrace","7":"I charge you, O ye daughters of Jerusalem, by the roes, and by the hinds of the field, that ye stir not up, nor awake *my* love, till he please.","8":"The voice of my beloved! behold, he cometh leaping upon the mountains, skipping upon the hills.","9":"My beloved is like a roe or a young hart: behold, he standeth behind our wall, he looketh forth at the windows, shewing himself through the lattice.","10":"My beloved spake, and said unto me, Rise up, my love, my fair one, and come away.","11":"For, lo, the winter is past, the rain is over *and* gone;","12":"The flowers appear on the earth; the time of the singing *of birds* is come, and the voice of the turtle is heard in our land;","13":"The fig tree putteth forth her green figs, and the vines *with* the tender grape give a *good* smell. Arise, my love, my fair one, and come away.","14":"O my dove, *that art* in the clefts of the rock, in the secret *places* of the stairs, let me see thy countenance, let me hear thy voice; for sweet *is* thy voice, and thy countenance *is* comely.","15":"Take us the foxes, the little foxes, that spoil the vines: for our vines *have* tender grapes.","16":"My beloved *is* mine, and I *am* his: he feedeth among the lilies.","17":"Until the day break, and the shadows flee away, turn, my beloved, and be thou like a roe or a young hart upon the mountains of Bether."}},"tsk":{"1":[{"kopje":"roos","refs":["Ps 85:12","Jes 35:1","Jes 35:2"]},{"kopje":"lelie","refs":["Hoogl 2:16","Hoogl 6:3","Jes 57:15"]}],"3":[{"kopje":"appelboom","refs":["Hoogl 8:5","Jes 4:2","Ezech 17:23","Ezech 17:24","Joh 15:1-8"]},{"kopje":"mijn Liefste","refs":["Hoogl 5:9","Hoogl 5:10","Hoogl 5:16","Ps 45:3","Ps 89:7","Joh 1:14-18","Joh 3:29-31","Hebr 1:1-6","Hebr 3:1-6","Hebr 7:23-26","Hebr 12:2"]},{"kopje":"zit er onder","refs":["Richt 9:15","Richt 9:19","Richt 9:20","Ps 57:2","Ps 91:1","Jes 4:6","Jes 25:4","Jes 32:2","1 Joh 1:3","1 Joh 1:4"]},{"kopje":"Zijn vrucht","refs":["Hoogl 2:5","Gen 3:22-24","Ezech 47:12","Openb 22:1","Openb 22:2"]}],"4":[{"kopje":"voert","refs":["Hoogl 1:4","Hoogl 5:1","Ps 63:3-6","Ps 84:11","Joh 14:21-23","Openb 3:20"]},{"kopje":"wijnhuis","refs":["Hoogl 1:1","Hoogl 1:4","Est 7:7"]},{"kopje":"Zijn banier","refs":["Hoogl 6:4","Job 1:10","Ps 60:6","Jes 11:10","Joh 15:9-15","Rom 5:8-10","Rom 8:28-39"]}],"5":[{"kopje":"Ondersteun","refs":["Ps 4:7","Ps 4:8","Ps 42:2","Ps 42:3","Ps 63:2-4","Ps 63:9","Jes 26:8","Jes 26:9","Luk 24:32","Fil 1:23"]},{"kopje":"flessen","refs":["2 Sam 6:19","Hos 3:1"]},{"kopje":"want","refs":["Hoogl 5:8","2 Sam 13:1","2 Sam 13:2","Ps 119:130","Ps 11 5564\">Stay</span> me with <span class=\"wl wl-kjv\" data-code=\"H809\">flagons,</span> <span class=\"wl wl-kjv\" data-code=\"H7502\">comfort</span> me with <span class=\"wl wl-kjv\" data-code=\"H8598\">apples:</span> for I am <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> of love.","6":"His left <span class=\"wl wl-kjv\" data-code=\"H8040\">hand</span> is under my <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> doth embrace","7":"I <span class=\"wl wl-kjv\" data-code=\"H7650\">charge</span> you, O ye <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> by the <span class=\"wl wl-kjv\" data-code=\"H6643\">roes,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">and</span> by the <span class=\"wl wl-kjv\" data-code=\"H355\">hinds</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> that ye stir not <span class=\"wl wl-kjv\" data-code=\"H5782\">up,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5782\">awake</span> my <span class=\"wl wl-kjv\" data-code=\"H160\">love,</span> till he please.","8":"The <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved!</span> behold, he <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> <span class=\"wl wl-kjv\" data-code=\"H1801\">leaping</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> <span class=\"wl wl-kjv\" data-code=\"H7092\">skipping</span> upon the hills.","9":"My <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> is <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> a <span class=\"wl wl-kjv\" data-code=\"H6643\">roe</span> or a <span class=\"wl wl-kjv\" data-code=\"H6082\">young</span> <span class=\"wl wl-kjv\" data-code=\"H354\">hart:</span> behold, he <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> our <span class=\"wl wl-kjv\" data-code=\"H3796\">wall,</span> he looketh <span class=\"wl wl-kjv\" data-code=\"H7688\">forth</span> at the <span class=\"wl wl-kjv\" data-code=\"H2474\">windows,</span> <span class=\"wl wl-kjv\" data-code=\"H6692\">shewing</span> himself through the lattice.","10":"My <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">spake,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> my <span class=\"wl wl-kjv\" data-code=\"H7474\">love,</span> my fair <span class=\"wl wl-kjv\" data-code=\"H3303\">one,</span> and come away.","11":"For, lo, the <span class=\"wl wl-kjv\" data-code=\"H5638\">winter</span> is <span class=\"wl wl-kjv\" data-code=\"H5674\">past,</span> the <span class=\"wl wl-kjv\" data-code=\"H1653\">rain</span> is <span class=\"wl wl-kjv\" data-code=\"H2498\">over</span> and gone;","12":"The <span class=\"wl wl-kjv\" data-code=\"H5339\">flowers</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appear</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H2158\">singing</span> of birds is <span class=\"wl wl-kjv\" data-code=\"H5060\">come,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H8449\">turtle</span> is <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in our land;","13":"The fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree</span> putteth <span class=\"wl wl-kjv\" data-code=\"H2590\">forth</span> her green <span class=\"wl wl-kjv\" data-code=\"H6291\">figs,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1612\">vines</span> with the tender <span class=\"wl wl-kjv\" data-code=\"H5563\">grape</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> a good <span class=\"wl wl-kjv\" data-code=\"H7381\">smell.</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> my <span class=\"wl wl-kjv\" data-code=\"H7474\">love,</span> my fair <span class=\"wl wl-kjv\" data-code=\"H3303\">one,</span> and come away.","14":"O my <span class=\"wl wl-kjv\" data-code=\"H3123\">dove,</span> that art in the <span class=\"wl wl-kjv\" data-code=\"H2288\">clefts</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5643\">secret</span> places of the <span class=\"wl wl-kjv\" data-code=\"H4095\">stairs,</span> let me <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thy <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance,</span> let me <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> for <span class=\"wl wl-kjv\" data-code=\"H6156\">sweet</span> is thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance</span> is comely.","15":"<span class=\"wl wl-kjv\" data-code=\"H270\">Take</span> us the <span class=\"wl wl-kjv\" data-code=\"H7776\">foxes,</span> the <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H7776\">foxes,</span> that <span class=\"wl wl-kjv\" data-code=\"H2254\">spoil</span> the <span class=\"wl wl-kjv\" data-code=\"H3754\">vines:</span> for our <span class=\"wl wl-kjv\" data-code=\"H3754\">vines</span> have tender grapes.","16":"My <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> is mine, and I am his: he <span class=\"wl wl-kjv\" data-code=\"H7462\">feedeth</span> among the lilies.","17":"Until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H6315\">break,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6752\">shadows</span> flee <span class=\"wl wl-kjv\" data-code=\"H5127\">away,</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">turn,</span> my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> and be thou <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> a <span class=\"wl wl-kjv\" data-code=\"H6643\">roe</span> or a <span class=\"wl wl-kjv\" data-code=\"H6082\">young</span> <span class=\"wl wl-kjv\" data-code=\"H354\">hart</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of Bether."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ben","tekst":"Hier spreekt de Bruidegom weder, zo sommigen menen; maar anderen menen dat het de woorden der Bruid zijn."},{"catchword":"een Roos","tekst":"De roos is de edelste onder de bloemen en haar reuk verkwikt de hersenen. Bij de rozen van Saron, dat is die te Saron wassen, worden verstaan uitnemend schone rozen; gelijk bij de leliën der dalen, dat is die in de dalen wassen, worden verstaan schone welriekende leliën. Salomo is zo schoon niet versierd geweest als een van deze, Mat 6:29 ; maar overmits hier gesproken wordt van de roos, wassende in de velden van Saron, en van de leliën in de dalen, maar niet van zulke, die in betuinde of besloten hoven wassen; zo schijnt het dat hiermede wordt te kennen gegeven dat de kerk van Christus verdrukking onderworpen is, gelijk de bloemen des velds van een ieder, die daar voorbijgaat, lichtelijk afgeplukt en van de beesten vertreden en afgebeten worden. Deze zin blijkt de rechte te zijn uit vs.2."},{"catchword":"Saron,","tekst":"Saron is een lustige, schone landstreek, strekkende van Cesarea tot Joppe, niet ver van de Middellandse zee. Aldus wordt ook genoemd ene stad aldaar gelegen. Zie breder van Saron, 1Ch 5:16 ; Isa 33:9 , en Isa 35:3 , en Isa 65:10 ; Act 9:35 ."}],"2":[{"catchword":"Gelijk","tekst":"De zin is: Zozeer als de lelie [vergeleken zijnde met de doornen] dezelve in schoonheid en heerlijkheid ver overtreft; alzo overtreft mijne liefste alle andere dochters, bij dezelve vergeleken zijnde; dat is, de ware kerk vergeleken zijnde bij andere vergaderingen, gaat dezelve alle in voortreffelijkheid ver teboven."},{"catchword":"de doornen,","tekst":"De bozen en goddelozen worden in de Schrift [en ook, naar veler gevoelen, in deze plaats] doornen genoemd, eensdeels ten aanzien hunner onvruchtbaarheid in het voortbrengen van goede vruchten; anderdeels vanwege hun stekelige boosheden tegen de kinderen Gods; zie Num 33:35 ; Pro 22:5 ; Eze 28:24 ."},{"catchword":"dochteren","tekst":"Dochteren worden in de Heilige Schrift genoemd de verzamelingen der mensen, somtijds der goeden, als: de dochter Zions; dat is de gemeente Gods; Isa 37:22 ; somtijds der kwaden, als: de dochter Babels; Psa 137:8 , de dochter Edoms; Lam 4:21 ."}],"3":[{"catchword":"Als een appelboom","tekst":"Dit zijn nu wederom de woorden der Bruid. Onze Heere Jezus Christus wordt dikwijls bij een boom vergeleken, gelijk Rev 2:7 , en Rev 22:2 . Hier bij een appelboom. Gelijk hij alle wilde bomen verre tebovengaat; alzo, zegt hier de Bruid, overtreft ook Christus, mijn liefste, alle mensen, die van nature maar als wilde bomen zijn. En gelijk een appelboom, met zijn brede en lage takken, goede schaduw en schuiling geeft tegen de hitte en lieflijke vrucht voortbrengt tot verkwikking van den mens, alzo vind ik ook schaduw, bescherming en verkwikking onder de vleugels zijner genade, zo tegen de toorn Gods alsook in de hitte der vervolging. Alzo dat ik wens en poog altijd daaronder te schuilen."},{"catchword":"de bomen","tekst":"Dat is, die in het woud, of in het wild wassen. Buiten Christus zijn alle mensen wilde ongehavende bomen, Rom 11:17 , Rom 11:24 , die derhalve òf gene, òf kwade, òf zure, òf vruchten van onaangenamen smaak voortbrengen; tenzij dat zij door het geloof van Christus worden ingegriffeld, zo kunnen zij geen goede vruchten voortbrengen; Mat 7:18 ; Joh 15:4 ."},{"catchword":"onder de zonen;","tekst":"Te weten, van Adam, of der mensen; of zonen; dat is, jongelingen. Dezen allen overtreft Christus ver; Psa 45:3 ."},{"catchword":"in Zijn schaduw,","tekst":"Te weten, onder des appelbooms schaduw, dat is onder zijne bescherming. Gelijk de bomen, ons beschaduwende, bevrijden van den brand en de hitte der zon, alzo bevrijdt ons Christus voor de hitte van den toorn Gods en de vervolgingen der boze wereld. Zie Psa 121:5-7 ; Isa 25:4 . Zie ook de aantekening Psa 91:1 ."},{"catchword":"Zijn vrucht","tekst":"Dit is nog een weldaad, die de Bruid verkrijgt door Christus; te weten, dat zij niet alleen van het kwaad verlost is, maar dat zij ook zijn lieflijke vruchten deelachtig wordt, als van zijn dood, verrijzenis, hemelvaart en andere weldaden. Anderen verstaan hier door de vruchten de vertroostingen van Christus, die het hart der gelovigen zoet zijn."}],"4":[{"catchword":"Hij voert","tekst":"Of, Hij voerde."},{"catchword":"in het wijnhuis,","tekst":"Hebreeuws, in het huis van den wijn; dat is, in het huis der vreugde en der blijdschap, die wij door de kracht en werking van den Heiligen Geest in onze harten ontvangen, 2Co 1:5 . Behalve dat de wijn den dorst verslaat, zo maakt hij ook het hart vrolijk, Psa 104:15 , en hij doet het zijne droefenis vergeten. Zie Pro 31:6-7 . Tot dit huis der vreugde worden alle kinderen Gods genodigd; Pro 1:20 ; zie ook Pro 9:1 , enz."},{"catchword":"de liefde","tekst":"Versta hier de liefde, waarmede Christus ons liefheeft en bemint, Eph 5:2 . Daarom lezen enigen de laatste woorden van vs.4 aldus: Zijne banier is liefde over mij, of te mijwaarts. Zie 2Th 2:16 , en Rom 5:5 ."},{"catchword":"is Zijn banier","tekst":"Gelijk de soldaten van elkander onderscheiden worden door banieren of vaandels; alzo worden de ware ledematen der gemeente van Jezus Christus onderkend en onderscheiden van de huichelaars, door den Geest der aanneming en zijne vruchten, Rom 8:14 ; 1Jo 3:24 . De banier betekent ook beschutting en bescherming tegen al de geestelijke vijanden, den duivel, den dood en de verdoemenis."}],"5":[{"catchword":"Ondersteunt","tekst":"De kerk spreekt hier tot de vrienden des Bruidegoms, die zijn de rechte leraars, Joh 3:29 ; biddende dat zij haar versterken met den troost van het heilig Evangelie, eer zij bezwijke van verlangen."},{"catchword":"met de flessen,","tekst":"Dat is met wijn, die in de flessen is, gelijk Hos 3:1 ; Luk 22:20 ; dat is met de Heilige Schrift, in welke Christus zijn wijn en melk, dat is, al zijne beloften en geestelijke vertroostingen besloten heeft. Zie Psa 94:19 , en Psa 119:92 ."},{"catchword":"versterkt","tekst":"Of, onderstrooit mij appelen; te weten, opdat ik door den reuk derzelve verkwikt worde, waartoe de oranjeappelen en citroenen inzonderheid zeer dienstig en bekwaam zijn. Hierbij worden verstaan de troostelijke leringen der Heilige Schrift, aangaande de genade en verdiensten van Christus."},{"catchword":"ik ben krank","tekst":"Dat is, ik ben flauw en amechtig door het gedurig verlangen naar de vertroostingen mijns Bruidegoms en de tekenen zijner genade; zie Psa 42:2 ; Psa 63:2 ; Son 3:1-2 , en Son 5:6 , Son 5:8 . Het is God, die al onze krankheden geneest; Psa 103:3 ."}],"6":[{"catchword":"linkerhand","tekst":"De gemeente wenst en verwacht de genadige en goedertierene hulp, die de Bruidegom haar in den nood zou bewijzen, haar troostende door den Heiligen Geest en zijn Woord. Zie Son 8:3 ; Eph 5:29 ."},{"catchword":"onder mijn hoofd,","tekst":"Te weten gelijk een peluw, om op te rusten. Door de zonde wordt het ganse hoofd krank en het hart mat; Isa 1:5 . Maar door de vertroostingen des Heiligen Geestes worden onze conscientiën versterkt, en onze zonden [oorzaken onzer ellenden] vergeven. Zie Rom 14:17 ; 1Jo 2:12 , en 1Jo 3:24 ."},{"catchword":"omhelze mij","tekst":"Dit is een uitwendig teken van liefde. Zie Gen 29:13 , en Gen 48:10 ."}],"7":[{"catchword":"Ik bezweer u,","tekst":"Dit nemen sommigen als woorden des Bruidegoms, anderen als woorden der Bruid. De zin is: Ik vermaan en betuig u op het hoogste."},{"catchword":"gij, dochteren","tekst":"Dat is: O gij speelgenoten. Zie Son 3:5 , en Son 8:4 ."},{"catchword":"die bij de reeën,","tekst":"Anders: Ik bezweer u bij de reeën, enz.; dat is, zo lief als u de reeën en de hinden zijn, dat gij die liefde niet opwekt; dat is, dat gij de rust des Bruidegoms, of der Bruid, dat is de gemeente, niet verstoort; te weten door ketterij, scheuring, of met ergernis te geven."},{"catchword":"de hinden","tekst":"Hinden zijn wijfjes der herten."},{"catchword":"totdat het","tekst":"Dat is, nimmermeer derzelver rust stoort."}],"8":[{"catchword":"Dat is","tekst":"Te weten de stem, die ik daar hoor. Dit spreekt de Bruid. Zij wil zeggen: Dat is zijne onderwijzing, die ik daar hoor. Zie Joh 10:3-4 , en Joh 18:37 ; Act 13:46-47 ; Heb 3:7 ."},{"catchword":"Hij komt,","tekst":"Te weten tot mijn hulp en bijstand, gelijk Isa 35:4 ; Joh 14:23 ; Rev 22:20 ."},{"catchword":"springende","tekst":"Eene gelijkenis, genomen van de snelle reeën en hinden, bij welke de Bruidegom wordt vergeleken, vs.9, om aan te wijzen de vrijwilligheid van Christus in het helpen en redden zijner Bruid."}],"9":[{"catchword":"achter onzen muur,","tekst":"Versta hier den vurigen muur der kerk, dat is, de bewaring en beschutting, die God zijne kerk bewijst door zijn heilige engelen. Zie 2Ki 6:17 ; Psa 34:8 ; Zec 2:5 . Als hier staat onzen muur, daarmede wordt te kennen gegeven dat deze muur is een bolwerk, dat de kerk eigen is en haar alleen toekomt. Anderen verstaan die woorden: Hij staat achter onzen muur, aldus, dat zij betekenen een nadere gemeenschap met Christus dan toen Hij nog ver af was, komende al springende op de bergen, vs.8, maar evenwel zo na nog niet, of daar was nog een muur tussenbeiden. Zodat hier aangewezen worden te trappen, waarmede Christus zijne liefde jegens zijne kerk is bewijzende, niet gelijkelijk, maar naardat Hij acht ons goed te wezen."},{"catchword":"kijkende","tekst":"Dit is een gelijkenis, genomen van een wachter, die op een toren de wacht houdt. Zie 2Ki 9:17 ; Eze 33:2 . De Heere Christus is de rechte wachter en hoeder van Israël, die nimmermeer slaapt nocht sluimert; Psa 121:4 . Hij ziet en bespot al de raadslagen der goddelozen tegen zijne kerk; Psa 2:4 ."},{"catchword":"blinkende","tekst":"Of, glinsterende als ene bloem; dat is, zichzelve als een bloem vertonende; te weten lieflijk en aangenaam. Het is vast hetzelfde, dat straks gezegd is. De wederhaling dient tot versterking en bevestiging van het voorzeide."},{"catchword":"de traliën","tekst":"Meermalen worden de traliën en vensters bijeengevoegd, gelijk Jdg 5:29 ; Pro 7:6 , en elders."}],"10":[{"catchword":"Mijn Liefste","tekst":"Met deze woorden geeft de Bruid te kennen de oorzaak van de snelle komst haars Bruidegoms, te weten om haar door zijnen Geest en zijn Woord te roepen uit haar bedroefden staat tot een beteren."},{"catchword":"kom","tekst":"Hebreeuws, komt u. Alzo ook vs.13. Zie de aantekening Gen 12:1 . En kom herwaarts, te weten om mij te dienen."}],"11":[{"catchword":"de winter","tekst":"Dat is, de tijd van de verdrukking der gemeente. Vergelijk Zec 14:8 ."},{"catchword":"de plasregen","tekst":"Dat is, de tijd der beproeving in tegenspoed is door Christus verlicht. Zie Isa 4:6 , en Isa 32:2 ; Mat 7:27 ."},{"catchword":"hij is overgegaan;","tekst":"Of, hij is heengegaan."}],"12":[{"catchword":"worden gezien","tekst":"Of, vertonen zich. Dit is ene beschrijving der lente; geestelijk verstaan zijnde betekent het de wederoprichting der kerk, nadat de zwarigheden verdwenen zijn. Zie Psa 72:16 ; Isa 27:6 ; Hos 14:4-6 ."},{"catchword":"de zangtijd","tekst":"Of, de tijd des gezangs, of de tijd van kwinkeleren; dat is, de lente, of de meitijd, wanneer de vogels zingen; dat is, de gelovigen beginnen te verkwikken en van vreugde te zingen. Anders: de snoeitijd."}],"13":[{"catchword":"De vijgeboom","tekst":"Dat is, de mensen, die tevoren als dorre bomen waren, beginnen nu geestelijkerwijze te bloeien door mijne genade; de gemeente, die tevoren woest gelegen hebben, geven nu beginselen van schone vruchten door de kracht van mijn Geest en Woord, en zij geven van zich een lieflijken reuk, 2Co 2:15 . Zie de gelijkenis van den vijgeboom, Mat 24:32 ; Luk 13:6 ."},{"catchword":"jonge vijgjes","tekst":"Of, onrijpe vijgen. Het Hebreeuwse woord, dat hier gebruikt wordt, vindt men alleen hier."},{"catchword":"de wijnstokken","tekst":"Door de wijnstokken worden hier de particuliere kerken verstaan, gelijk Isa 5:1 ; Hos 9:10 ."},{"catchword":"geven reuk","tekst":"Te weten, een treffelijken reuk, gelijk Son 7:13 ."},{"catchword":"druifjes","tekst":"Of, tedere, kleine, groene, onrijpe druiven. Het Hebreeuwse woord is hier alleen en onder, vs.15, en Son 7:12 ."},{"catchword":"kom","tekst":"Gelijk boven, vs.10."}],"14":[{"catchword":"Mijn duive,","tekst":"Aldus wordt de gemeente van Christus genoemd vanwege hare kuisheid en eenvoudigheid. Zie Mat 10:16 , en boven, Son 1:15 ."},{"catchword":"zijnde","tekst":"Daar schuilende uit vrees der vijanden. Zie Jer 48:28 . Anders: die u onthoudt in de scheuren der steenrotsen; beschaamd zijnde vanwege de mismaaktheid uwer zonden."},{"catchword":"in het verborgene","tekst":"Die u in onbewoonde plaatsen, in holen en spelonken, vanwege de vervolging verbergt; gelijk 1Ki 18:4 ; Psa 55:7-8 , en Psa 68:14 ; Rev 12:6 . Sommigen zetten het over, een verborgen trap, duidende zulks op den Heere Christus, die de trap en ladder is naar den hemel; Gen 28:12 ; Joh 1:52 ."},{"catchword":"toon Mij","tekst":"Dat is, kom tot mij, wandel voor mij oprechtelijk, gelijk Gen 17:1 ; Rom 12:1 ; Eph 5:27 . Te weten, nadat gij door mijn Geest en bloed zult gereinigd zijn."},{"catchword":"uw stem horen;","tekst":"Dat is, uwe gebeden en lofzangen. Zie Psa 5:4 , en Psa 28:2 , en Psa 42:5 , en Psa 50:15 , en elders."},{"catchword":"is zoet,","tekst":"Dat is, zij is mij aangenaam, te weten als zij uit een waar geloof spruitende is."}],"15":[{"catchword":"Vangt","tekst":"Dit zijn de woorden des Bruidegoms tot zijne metgezellen, dat is, Christus tot de leraars of herders der kerk en tot de Christelijke overheden. En vangen is hier te zeggen dat de leraars der vossen loze en boze leringen moeten tegenstaan en wederleggen, en dat de overheden die moeten tonen."},{"catchword":"de vossen,","tekst":"De vossen bederven de wijngaarden met het afeten der druiven. Alzo bederven en vernielen de valse leraars, ketters en bedriegelijke regeerders de ware religie en kerk Gods. Zij worden bij vossen vergeleken, hier en Eze 13:4 ; Luk 13:32 ; eensdeels vanwege hunne bedriegelijkheid; 2Co 11:13 ; anderdeels vanwege hunne schadelijkheid, dewijl hun woord verteert als een kanker; 2Ti 2:17 . Zie dergelijke beschrijvingen en waarschuwingen, Jer 12:10 ; Eph 4:14 ; Tit 1:10-11 ; Heb 13:9 ; 2Pe 2:1 , 2Pe 2:12 ."},{"catchword":"jonge druifjes","tekst":"Of, kleine, tedere."}],"16":[{"catchword":"Mijn Liefste","tekst":"Dit zijn de woorden der Bruid, gelijk Son 6:2 , en Son 7:10 . De zin is: Hij is mijn Herder, en ik ben de kudde zijner schapen, daarom kan mij niets ontbreken. Zie Psa 23:1 ; 1Jo 4:13 ."},{"catchword":"Die weidt","tekst":"De zin is: Hij weidt zijne kudde, niet alleen op een gezonde, maar ook op een genoegelijke weide, zo lieflijk en genoegelijk, alsof zij vol leliën stond. Verstaande hierbij de weide van het goddelijke Woord, hetwelk zoet is als honig en honigraten; en in het gezelschap der godzaligen, die als leliën onder de doornen zijn."}],"17":[{"catchword":"de dag","tekst":"Dat is de tijd der wetenschap, heiligheid, des troostes, vredes en der geestelijke blijdschap. Zie Rom 13:12-13 , en 1Th 5:5 ; 2Pe 1:19 ."},{"catchword":"aankomt,","tekst":"Hebreeuws, aanblaze. Aldus spreken de Hebreën, omdat de dag gemeenlijk met enige koelte opgaat."},{"catchword":"de schaduwen","tekst":"Dat is, al hetgeen nog onvolmaakt is."},{"catchword":"keer om,","tekst":"Te weten tot mij; het zijn de woorden der Bruid tot haren Bruidegom, hem biddende en aanroepende, dat Hij haar wil bijstaan in haar nood en zwarigheden."},{"catchword":"wordt Gij","tekst":"Te weten in snelligheid, om mij te helpen; zie vs.8."},{"catchword":"Bether","tekst":"Of, Bitrons, of der scheiding. Dit zijn de bergen Gileads, die door de Jordaan van Judea afgescheiden worden. Deze bergen waren vol wild en zeer bekwaam tot de jacht. Zie de aantekening 2Sa 2:29 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"I am a Rose of Saron, a Lily of the Valleys. [Here the bridegroom speaketh again, as some conceive: But others are of opinion, that they are the words of the Spouse. The Rose is the choicest and cheereth the brain. By the Roses of Saron (that is, the Roses that grow at Saron) are meant, exceeding fair Roses; as by the Lilies of the valleys (that is, the Lilies that grow in the valleys) are meant, fair sweet-smelling Lilies. Salomon in all his Royalty was not so beautifully arrayed as one of these, Matth.6,29. But forasmuch as here is spoken of the Rose growing in the fields of Saron, and of the Lilies in the valleys, but not of such as grow in fenced or inclosed gardens: it semmeth that hereby is intimated, that the church of Christ is subject and liable to persecution, as the flowers off the field are subject to be plucked off by every one that passeth by, or to be trodden down and bitten off by the beasts and brute creatures. This seemeth to be the true and right meaning of the words, as appeareth by v.2. Saron was a fair, pleasant Country, reaching from Caesarea unto Joppa, not far distant from the Midland-sea. Thus is a certain City likewise called, that lieth there. See further of Saron, 1 Chron.5.16. and Isa 33:9. and 35.2. and 65.10. Act 9:35.]"}],"2":[{"catchword":null,"tekst":"As a lilie among thorns, [Wicked and ungodly men are in Scripture (and likewise, according to the opinion of many, in this place) called thorns, partly in respect of their barrenness in bringing forth good fruit, partly in respect of their pricking malice against the children of God, see Num 33:55. Pro 22:5. Ezek.ch.28.v.24.] so is my love among the daughters. [By daughters are oftentimes meant in Scripture the assemblies of men; and that sometimes of good men, as the daughter of Zion; that is, the Church of God, Isa 36:22. Sometimes of evil and wicked men, as thedaughter of Babel, Psal.137.8. the daughter of Edom, Lament.4.21. The meaning of the verse is this; As far as the lily (being compared with the thorns) excelleth them kin beauty and glory: So far doth also my Love, or most beloved, exceed and surmount all other women, being compared with them. That is, the true church being compared with other meetings and assemblies, goeth far beyond them all in dignity and excellency.]"}],"3":[{"catchword":null,"tekst":"As an apple-tree among the trees of the forest, [That is, the trees that grow in the wood, or in the wild forest. All men without Christ are wild unpruned trees, Rom 11:17,24. Which in that respect bear, either no fruit at all, or else evil, or harsh bitter fruit, or fruit of an unpleasant and unsavoury taste. Unless they be ingrassed into Christ by faith, they cannot bring forth good fruits, Mat. Chap.7.v.18. Job 15:4.] so is my best beloved among the sons: [to wit, the sons of Adam, or the sons of men. Or, among the sons; that is, among young men: All these Christ doth far exceed, Psal.45.3. The words of this verse are now again the words of the Spouse, Our Lord Jesus Christ is often in scripture compared to a tree, as Revel.2.7. and 22.v.2. Here he is compared to an apple-tree, As that (to wit, the apple-tree) doth far exceed all wild trees: so (saith the spouse here,) doth Christ, my best beloved, far exceed all other men, who are by nature like unto wild trees. And as the apple-tree with his broad and low branches giveth a goodly shadow and shelter against the scorching heat of the Sun, and beareth sweet and pleasant fruit, for the cheering and refreshing of man: so (saith the spouse) do I also find shadow, shelter, and refreshing under the do I also find shadow, shelter, and refreshing under the wings of his grace and mercy, both against the wrath of God, and also in the scorching heat of persecution; so that I always desire and indeavour to hide and shelter my self under them, as followeth, in the text] I have great delight in his shadow, and sit (down under) it; [to wit, under the shadow of the apple-tree, that is, under the defence and shelter thereof. As the trees by casting a shadow upon us, do free and protect us from the burning and scorching heat of the Sun: So doth Christ free and deliver us from the scorching heat of Gods wrath, and from the persecution of the wicked world, see Psal.121.v.5,6,7. Isa 25:4. See also Psal.91. the annotate. On v.1.] and his fruit is sweet to my palate. [this is yet another benefit, which the spouse enjoyeth by Christ: to wit, that she is not onely freed and delivered from evil, but also is made partaker of his pleasant fruits, as of his death, resurrection, ascension, and other benefits of his. Others understand here by fruits, the comforts and other understand here by fruits, the comforts and consolations of Christ, which are most sweet and pleasant unto the hearts of true believers.]"}],"4":[{"catchword":null,"tekst":"He bringeth [Or, he brought] me into the wine house, [Heb. Into the house of wine; that is, into the house of joy and gladness, which we receive by the power and working of the Holy Ghost in our hearts, 2 Cor.1.5. Besides, that wine quencheth thirst, it maketh also the hearts mercy, Psal.104.15. and causeth it to forget its sorrow, see Pro 31:6,7. To this house of joy are all Gods children invited, Pro 1:3. see likewise, Pro 1:3. see likewise, Pro 9:1. &c.] and the love [understand here by love, the love wherewith Christ loveth us, Eph.5.2. Therefore some do read the last words of this verse thus, his banner is love over me, or towards me, see 2 Thess.2.16. and Rom 5:5.] is his banner over me. [as soldiers are distinguished one from another by banners or colours: so the true members of the church of Christ are discerned and distinguished from hypocrites and formal professors, by the spirit of adoption, and his fruits, Rom 8:14. 1Jn 3:24. The banner signifieth also defence and protection against all spiritual enemies, the devil, death, and damnation.]"}],"5":[{"catchword":null,"tekst":"Support ye me with flagons, [That is, with the wine that is in the flaggons, as Luk 22:10. and Hos 3:1. that is, with the holy Scriptures, wherein Christ hath shut up his wine and milk, that is, all his promises and spiritual comforts, see Psal.94.19. and 119.92.] strengthen me with apples: [or, strew apples under me; to wit, that by the smell thereof I may be comforted and refreshed; for which end purpose Oranges and Limons especially are very useful and requisite. By these are unconcerning the grace and merits of Christ. The church here speaketh unto the friends of the Bridegroom, which are the true Teachers or Ministers of the Gospel, Joh 3:29. intreating them to strengthen her with the comforts of the Gospel, before she languish and fail for longing after Christ] for I am sick of love. [That is, I am faint, and do languish through continual longing after the comforts and consolations of my Bridegroom, and the tokens of his grace and favour, see Psal.42.2. and 63.vers.2. and below, ch.3.1,2. And 5.v.6,8. It is God that healeth all our diseases, Ps.103.3.]"}],"6":[{"catchword":null,"tekst":"Let his left hand be under mine head, [To wit, as a pillow to rest upon. By reason of sin the whole head is sick, and the heart is faint, Isa 1:5. But by the consolations of the Holy Ghost our consciences are strengthened, and our sins (the causes of our sorrows) pardoned see Rom.14.v.17. and 1Jn 2:12. and 3.24.] and let his right hand imbrace me. [this is an outward token of love, see Gen 29:13. and 48.10. The church desireth and expecteth the gracious and favourable help and assistance, which the bridegroom was to afford her in time of trouble, comforting her by the Holy Ghost, and by his word, see below, ch.8.3. Eph.5.29.]"}],"7":[{"catchword":null,"tekst":"I adjure you, ye daughters of Jerusalem, [Some take these to be the words of the Bridegroom, others to be the words of the spouse. The meaning is, I exhort and charge you in the highest manner or degree, ye daughters of Jerusalem; that is, O ye my companions or friends, see chap.3.5. and 8.4.] (which are by the Roes or by the Hinds of the field) [Hinds are the females of the hearts] that ye star not up that love, nor waken (it,) until it please the same. [that is, that ye never disturb the rest and peace thereof. Others, I adjure you, by the Roes, etc. that is, as dear as the Roes and the Hinds are unto you, that ye stir not up that love; that is, that ye disturb not the rest of the Bridegroom, or of the Spouse, that is, the peace of the Church: to wit, by heresy, schism, or by giving offence.]"}],"8":[{"catchword":null,"tekst":"(That) [To wit, the voice which I hear] is the voice of my best beloved, [the spouse speaketh thus. As if she should say, that is instruction which I hear, see Joh 18:37. and 10.v.3,4. Act 13:46,47. Heb 3:7.] behold him, he cometh, [to wit, to mine help and assistance, as Isa 35:4. Joh 14:23. Rev 22:20.] leaping upon the Mountains, skipping upon the hills. [A similitude borrowed from swift Roes and Hinds, whereunto the Bridegroom is compared, verse 9. To shew the willingness and readiness of Christ to help and deliver his spouse.]"}],"9":[{"catchword":null,"tekst":"My best beloved is like a Roe or a whelp of the Harts: behold, he standeth behind our wall, [Understand here the fiery wall of the Church, or the wall of fire round about the church: that is, the preservation and protection, which God affordeth unto his Church by his holy Angels, see 2 Kings 6.17. Psal.34.8. Zach.2.5. When it is said here, our wall, thereby is intimated, that this wall is a Bulwark, which is proper to the Church, and belongeth to her alone. Others unde // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {

  });
}
document.addEventListener('click', e => {

// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)

  const rij = e.target.closest('.vers');

  const n = rij.id.slice(1);

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
