pomegranate</span> are thy <span class=\"wl wl-kjv\" data-code=\"H7541\">temples</span> <span class=\"wl wl-kjv\" data-code=\"H1157\">within</span> thy locks.","8":"There are <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> <span class=\"wl wl-kjv\" data-code=\"H4436\">queens,</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines,</span> and <span class=\"wl wl-kjv\" data-code=\"H5959\">virgins</span> without number.","9":"My <span class=\"wl wl-kjv\" data-code=\"H3123\">dove,</span> my <span class=\"wl wl-kjv\" data-code=\"H8535\">undefiled</span> is but <span class=\"wl wl-kjv\" data-code=\"H259\">one;</span> she is the only <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of her <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> she is the <span class=\"wl wl-kjv\" data-code=\"H1249\">choice</span> one of her that <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> her. The <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> her, and <span class=\"wl wl-kjv\" data-code=\"H833\">blessed</span> her; yea, the <span class=\"wl wl-kjv\" data-code=\"H4436\">queens</span> and the <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines,</span> and they praised","10":"Who is she that looketh <span class=\"wl wl-kjv\" data-code=\"H8259\">forth</span> as the <span class=\"wl wl-kjv\" data-code=\"H7837\">morning,</span> <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> as the <span class=\"wl wl-kjv\" data-code=\"H3842\">moon,</span> <span class=\"wl wl-kjv\" data-code=\"H1249\">clear</span> as the <span class=\"wl wl-kjv\" data-code=\"H2535\">sun,</span> and <span class=\"wl wl-kjv\" data-code=\"H366\">terrible</span> as an army with banners?","11":"I went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the <span class=\"wl wl-kjv\" data-code=\"H1594\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H93\">nuts</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H3\">fruits</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> whether the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> <span class=\"wl wl-kjv\" data-code=\"H6524\">flourished,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates</span> budded.","12":"Or ever I was <span class=\"wl wl-kjv\" data-code=\"H3045\">aware,</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> me like the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> of Amminadib.","13":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Return,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> O <span class=\"wl wl-kjv\" data-code=\"H7759\">Shulamite;</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H2372\">look</span> upon thee. What will ye <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> in the <span class=\"wl wl-kjv\" data-code=\"H7759\">Shulamite?</span> As it were the <span class=\"wl wl-kjv\" data-code=\"H4246\">company</span> of two armies."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"is uw Liefste","tekst":"Dit zijn de woorden der dochteren van Jeruzalem, waarvan gesproken is Son 5:16 ."},{"catchword":"het aangezicht","tekst":"Te weten, van u tot anderen, of tot een andere plaats."},{"catchword":"opdat wij Hem","tekst":"Of, en wij zullen Hem met u zoeken. De dochteren van Jeruzalem, hebbende gehoord hoe de Bruid haren Bruidegom geprezen had, zijn daardoor bewogen geworden om ernstiglijk tot tweemaal toe naar Hem te vragen [alzo haar groten ijver uitdrukkende], en zij beloven dat zij Hem met haar willen zoeken, opdat zij zijne genade en zegeningen mede mochten deelachtig worden. Dusdanig is de kracht der predikatie van het heilige Evangelie in de harten der uitverkorenen. Zie Act 2:37 , Act 4:4 , en Act 11:20-21 ."}],"2":[{"catchword":"Mijn Liefste","tekst":"De Bruid, die eerst haren Bruidegom gezocht maar niet gevonden had, weet nu waar Hij is, en zij onderwijst anderen daarvan; zodat wij hier zien vervuld hetgeen Christus belooft, Mat 7:7 :Zoekt en gij zult vinden. Zie Deu 4:29 ."},{"catchword":"in Zijn hof,","tekst":"De hof van Christus is zijne gemeente, gelijk boven Son 4:16 , en Son 5:1 . Daar is Hij te zoeken en te vinden."},{"catchword":"de specerijbedden,","tekst":"Het schijnt dat hiermede te kennen gegeven worden de hopen, of gezelschappen der gelovigen, in wier harten, als in een goede aarde, het goede zoetriekende zaad van het goddelijke Woord gezaaid wordt; Mat 13:8 , Mat 13:23 . Dit is des Bruidegoms lusthof, waar Hij met zijn genade en geest altijd omtrent is, en Hij schept zijn vermaak in de goede werken der gelovigen, gelijk iemand doet in lieflijke kruidbedden met allerlei kostelijke specerijen en bloemen bezet en bezaaid."},{"catchword":"om te weiden","tekst":"Dat is om gemeenschap met zijne uitverkorenen te hebben, etende en genietende zijn aangename vrucht. Zie boven Son 4:16 ; alsook om de zijnen te weiden, te voeden en deelachtig te maken de gaven van den Heiligen Geest."},{"catchword":"in de hoven,","tekst":"Dat is, in de particuliere kerken en verzamelingen der gelovigen; gelijk Son 5:1 ."},{"catchword":"om de leliën","tekst":"Dat is, om tot zicht te vergaderen zijn uitverkoren volk, hetwelk vergeleken wordt bij de leliën onder de doornen; Son 2:2 ."}],"3":[{"catchword":"Ik ben mijns Liefsten,","tekst":"De Bruid verheugt zich hier vanwege de liefde en den vrede, tussen haren Bruidegom en haar vernieuwd, onaangezien haar vorige zwakheden en wederwaardigheden. Deze zelfde woorden spreekt de Bruid ook van haren Bruidegom, boven Son 2:16 , en onder Son 7:10 ; doch een weinig in een anderen zin."},{"catchword":"Die onder de leliën","tekst":"Dat is, niet alleen op een gezonde weide, maar ook op een overvloedige lustige weide, tot verkwikking en tot eeuwigen troost zijner schapen."}],"4":[{"catchword":"Gij zijt schoon,","tekst":"De Bruidegom, zijne Bruid gevonden hebbende, roemt haar vanwege de menigvuldige gaven, waarmede zij versierd is. Zie boven, Son 4:1 ."},{"catchword":"Thirza,","tekst":"Dit was ene stad in het land Kanaän, niet wijd van Samaria gelegen, in welke hof gehouden heeft een van de koningen, die Jozua heeft overwonnen; Jos 12:24 . Naderhand hebben de koningen van Israël er hof gehouden, totdat Samaria gebouwd was door Omri. Zie 1Ki 14:17 , en 1Ki 15:21 , 1Ki 15:33 , en 1Ki 16:6 , 1Ki 16:8 , 1Ki 16:23 . De Griekse overzetters vertalen het woord Tihrtsa, en stellen in den tekst, goed vermaak, of gunstige aanneming. Waaruit af te nemen is dat het een schone aangename stad geweest is, in hoedanige plaatsen de koningen en prinsen plachten te wonen. Dusdanige fraaiheid of schoonheid wordt hier de Bruid toegeschreven, zijnde schoon en aangenaam gemaakt door Christus haren Bruidegom; Eph 1:6 , en Eph 5:27 ."},{"catchword":"Jeruzalem,","tekst":"De stad Jeruzalem is vermaard vanwege hare schoonheid en heerlijkheid. Zij is eertijds de vermaardste stad geweest van geheel het Oosten, Plin. lib. 5 cap. 14. Zij was de stoel van den zuiveren godsdienst en de woonplaats der koningen van Juda; Psa 122 . Zij wordt genoemd de vreugde der ganse aarde; Psa 48:3 ."},{"catchword":"schrikkelijk","tekst":"Dat is, vol van majesteit en moed, vreeslijk in de ogen harer vijanden, gelijk onder vs.10."},{"catchword":"als slagorden","tekst":"Hebreeuws, als gebanierden; te weten, legers, of slagorden; dat is als legers, staande onder hunne banieren, of vaandels in slagorde, vaardig om slag te leveren. Daarom is de kerk van Christus schrikkelijk voor de ogen harer vijanden, omdat zij omlegerd is met vele krachtige engelen, 2Ki 6:17 , en 2Ki 19:35 ; idem omdat zij gewapend is met geestelijke wapenen, zie Act 5:11 ; Eph 6:13 ; 2Co 10:4 . Zie ook onder, vs.10."}],"5":[{"catchword":"Wend uw ogen","tekst":"Manier van spreken, uitdrukkende de grootheid der liefde van Christus. Anders: Wend uw ogen naar mij toe. Het Hebreeuwse woord betekent somtijds zich tot iemand wenden, gelijk 1Ch 12:23 , somtijds zich van iemand afwenden, gelijk Eze 7:22 ."},{"catchword":"van Mij af,","tekst":"Of, tegenover mij, gelijk Num 2:2 ."},{"catchword":"zij doen Mij","tekst":"Anders: Zij hebben mij opgelicht, of verheven."},{"catchword":"uw haar is","tekst":"Zie de aantekening Son 4:1 ."},{"catchword":"van Gilead","tekst":"Hier staat alleen Gilead, maar Son 4:1 staat, de berg Gilead. Zo op de ene als op de andere plaats wordt de gehele landstreek van Gilead verstaan."}],"6":[{"catchword":"Uw tanden","tekst":"Zie de aantekening boven Son 4:2 ."}],"7":[{"catchword":"Uw wangen","tekst":"Zie boven, Son 4:3 ."}],"8":[{"catchword":"Er zijn","tekst":"Deze woorden mag men ook nemen als onder voorwaarde gesproken zijnde, aldus: Laat daar zestig koninginnen zijn; dat is, al waren er zestig koninginnen, enz., nochtans is eene mijne duif, enz."},{"catchword":"Zestig . . . tachtig","tekst":"Dit spreekt de Bruidegom Christus onder den naam van Salomo, die zijn voorbeeld geweest is. Eenigen besluiten hieruit dat Salomo dit lied gedicht heeft in de eerste jaren van zijn koninkrijk, toen hij nog zovele vrouwen en bijwijven gehad heeft; 1Ki 11:3 . Doch enigen menen dat hier een zeker getal voor een onzeker gesteld is; Job 5:19 ; Mic 5:4 , en elders meer. De geestelijke zin is dat de ware kerk alleen de kerk van Christus te achten is, gelijk hier vs.9 breder gezegd wordt."},{"catchword":"bijwijven,","tekst":"Van het woord bijwijven zie Gen 22:24 . Het schijnt dat door deze koninginnen en bijwijven verstaan worden die kerken, die zich voor ware kerken uitgeven, maar geen inwendige geestelijke gemeenschap met den Bruidegom Christus hebben, hoewel zij door Gods genade daartoe kunnen gebracht worden."},{"catchword":"maagden","tekst":"Versta hier dienstmaagden of staatjonkvrouwen der koninginnen, gelijk Est 2:9 ; Psa 45:15 ; en bij deze dienstmaagden wordt verstaan het volk, dat van de groten afhangt en zich van dezelven laat leiden, hetwelk verre de grootste hoop in de wereld is."}],"9":[{"catchword":"Een enige","tekst":"Of, [maar] zij alleen is mijn duif. Dit wordt gesteld tegen het groot getal der koninginnen, enz., vs.8. En hier wordt de Bruid van Christus, die maar een is, [gelijk er maar een lichaam, een Geest, eene hoop, een Heere, een geloof is; Eph 4:4-5 ] gesteld en meer geacht dan het groot getal van anderen, die in hun eigen en anderer mensen mening koninginnen en prinsessen zijn. Zie wat God tot Israël spreekt Exo 19:5 ; 2Sa 7:23 ."},{"catchword":"de enige harer","tekst":"Al de particuliere kerken op aarde, die rechtzinnig zijn, maken tezamen niet meer dan een lichaam; Eph 4:16 . De enige kerk zijnde als de enige en wettelijke dochter van het hemelse Jeruzalem, hetwelk is de algemene kerk, welke is onzer aller moeder; Gal 4:26 ."},{"catchword":"de zuivere","tekst":"Of, gezuiverde of uitgelezene, of de klare, en alzo onder vs.10, en 1Ch 7:40 . Daar zijn wel vele bastaardkerken, maar daar is niet meer dan een zuivere, wettelijke uitverkoren kerk. Van welke zie 1Pe 1:2 ."},{"catchword":"dergenen,","tekst":"Hebreeuws, van hare baarster."},{"catchword":"de dochters","tekst":"Te weten, de dochters of maagden van wie vs.8 gesproken is."},{"catchword":"haar zien,","tekst":"Dat is, haar staat en gelegenheid terdege kennen."},{"catchword":"zullen haar","tekst":"Of, zullen haar; te weten deze Bruid. Zie Deu 4:6 , en Deu 26:19 ; Act 5:13 ."},{"catchword":"prijzen","tekst":"Dat is, zij zullen haar gelukzalig achten. De zin is, ofschoon de kerken, die in deze wereld zo van anderen als van zichzelven zo groot geacht worden, schijnen de ware kerk te zijn, nochtans zullen zij eindelijk overtuigd worden, immers [tenzij dat zij zich bekeren] ten jongsten dage, als zij de schapen zullen zien staan aan de rechterhand van den oppersten rechter, dat er maar een ware kerk is en dat die welzalig zijn, die tot dezelve behoren; Mal 3:18 ."}],"10":[{"catchword":"Wie is zij,","tekst":"Dat is, wat voor een is dit? Dit wordt gevraagd door degenen, die in het einde van vs.9 vermeld zijn. Zij verwonderen zich over de schoonheid en heerlijkheid der kerk Gods, alsof zij zeiden: Is dat die kerk, die wij versmaad hebben? Zie hoe heerlijk is zij nu!"},{"catchword":"uitziet","tekst":"Of, uitkijkt, verschijnt."},{"catchword":"als de dageraad,","tekst":"Gelijk de klare morgenstond na den duisteren nacht, alzo staat de Bruid op en komt voort, na de duisternis van het kruis, onwetenschap en dwaling; te weten als de morgenster van de kennis van Christus in haar hart opgaat. Zie Isa 60:2 ; 2Pe 1:19 ."},{"catchword":"de maan,","tekst":"De maan heeft in het Hebreeuws haren naam van wittigheid en van haar helder schijnsel. Hier betekent het schoon schijnen der maan den heerlijken staat der kerk Gods. Zie dergelijke manier van spreken Isa 30:26 , en Isa 60:20 ; Eze 16:14 , en Eze 32:7-8 ; Joe 3:15 ."},{"catchword":"zuiver","tekst":"Zuiver, of klaar, of rein. als de zon, Christus is de zon der gerechtigheid, Mal 4:2 . De vrouw, te weten zijne Bruid, is met de zon bekleed, Rev 12:1 . Want zij heeft Christus aangedaan door het geloof, Gal 3:27 ; door wiens gerechtigheid zij gezuiverd is van hare zonden, en alzo is zij heerlijk en schoon schijnende."},{"catchword":"schrikkelijk","tekst":"Te weten harer vijanden, met wie zij te vechten heeft onder de banier van haren Bruidegom, aanhebbende niet vleselijke wapens, maar machtig door God om de sterkten neder te werpen; 2Co 10:4 . Zie ook Exo 15:14-16 ; Deu 2:25 , en Deu 33:29 ; Psa 48:5-6 . Zie ook boven de aantekening vs.4."}],"11":[{"catchword":"Ik ben","tekst":"Dit zijn de woorden van den Bruidegom, aanwijzende hoe Hij den hof, zijne kerk bezoekt."},{"catchword":"notenhof","tekst":"Het Hebreeuwse woord Egoz wordt alleen hier gevonden. De meeste vertalers nemen het voor noten, en menen dat men hier moet verstaan, niet slechte noten, maar notenmuskaten, hoedanige lieflijke vruchten veel in den hof van den Bruidegom wassen. Zie boven Son 4:12-14 . Anders: gezuiverden of besnoeiden hof."},{"catchword":"groene vruchten","tekst":"Anders: nieuwe of eerste vruchten; te weten die in het voorjaar rijp worden. De zin is, dat na den winter des tegenspoeds, de lieflijke lente der genade in den hof der ker verschijnt."},{"catchword":"der vallei","tekst":"Of, in de laagte, waar de kerk van Christus bewaterd en bevochtigd wordt met Gods Woord en Geest, om overvloedige vruchten te dragen."},{"catchword":"Wijnstok . . . granaatbomen","tekst":"Versta hier door den wijnstok en de granaatbomen het volk van God geroepen en in den hof der kerk geplant, hetwelk bottende en bloeiende in ware en oprechte kennis en wetenschap, daarna vruchten voortbrengt der goede werken ter ere Gods en stichting des naasten. Zie boven Son 2:13-14 ."},{"catchword":"uitbotten","tekst":"Of, bloesemden of knopten."}],"12":[{"catchword":"Eer ik het wist,","tekst":"Dit schijnen nog de woorden des Bruidegoms te zijn. Als Hij zegt: Eer Ik het wist; dat is te zeggen in der haast, onvermoed, onvoorziens, vanwege mijn groot verlangen naar den hof. Alwaar Ik, ziende en bevindende zo schone vruchten, heb Ik mijn volk als met wagens voortgeholpen, het ook beschermende tegen hunne vijanden. Dit kan men ook door het woord wagens verstaan, overmits men eertijds wagens in den krijg gebruikte. Zie Jos 11:4 , en 1Sa 13:5 , en elders meer. Sommigen verstaan hier de heilige engelen."},{"catchword":"zette","tekst":"Dat is: Ik zet mijzelven. Deze manier van spreken is zeer algemeen in de Heilige Schrift; zie daarvan voorbeelden Psa 6:4 ; Ecc 7:28 ; Son 1:7 ; Isa 1:14 , en Isa 61:10 en elders meer. De zin is: Ik werd bewogen door mijn vurige barmhartigheid en niet door uwe verdiensten. Anders: mijne ziel; dat is mijne begeerte. Zie Psa 27:12 ."},{"catchword":"van mijn vrijwillig","tekst":"Of, van mijn edel, of prinselijk volk. Het Hebreeuwse woord nadib, hetwelk hier gebruikt wordt, is te zeggen vrijwillig, of goedwillig, of vrij, of edel, of prinselijk. Eenigen hebben hier: op de wagens van Amminadib, makende van twee woorden een; ook vindt men nergens in de Heilige Schrift wie deze Amminadib zou wezen. Daarom is het beter dat men hier stelle: mijn vrijwillig volk; te weten, de Christengelovigen, die gezegd worden vrijwillig te zijn ten dage der macht, of des heirs; Psa 110:3 . Het gepredikte Woord met alle genegenheid ontvangende, Act 2:41 , en Act 17:11 ."}],"13":[{"catchword":"Keer weder,","tekst":"Dit betekent den ernstigen wens van de bekering der verdwaalden, en het wordt daarom viermaal herhaald, omdat wij van nature traag van hart en van oren zijn, Luk 24:25 ; Heb 5:11 . Eenigen duiden dit op het wederroepen en wederkeren der Joden tot Christus. Zie Rom 11:25 . Anderen menen dat dit de woorden zijn van de speelgenoten der Bruid."},{"catchword":"o Sulammith","tekst":"Salomo heeft zijnen naam van vrede, 1Ch 22:9 . Jeruzalem wordt ook Salem genoemd, Psa 76:3 , dat is, vrede, Heb 7:2 . Alzo wordt de kerk, of het volk, hetwelk geroepen wordt om weder te keren, Sulammith genoemd, hetwelk zoveel te zeggen is, als vreedzame, of vredige, of in vrede levende, ten aanzien van den vrede, dien zij heeft met God door Jezus Christus; Rom 5:1 . Het is dan zoveel alsof de Bruidegom hier zeide: Kom herwaarts, mijn lieve Bruid, die naar mijnen naam Salomo, Vredevorst, of vreedzaam genoemd wordt Sulammith; dat is, vreedzame, keer weder, kom tot mij, Ik zal u tot genade aannemen, al hebt gij mij vertoornd."},{"catchword":"wij u mogen","tekst":"Deze woorden schijnen gesproken te zijn door de vrienden van Sulammith, wensende te mogen zien dat de vorige gaven en genade wederom op of in haar mochten gezien en bespeurd worden, want de engelen zelf wensen te mogen zien die dingen, die de kerk door het Evangelie zijn medegedeeld; 1Pe 1:12 . Zie ook Psa 27:4 ; Isa 52:8 ."},{"catchword":"aanzien","tekst":"Of, aanschouwen; te weten met vreugde en blijdschap."},{"catchword":"Wat ziet gijlieden","tekst":"Eenigen menen dat dit de woorden der Bruid zijn. Anderen nemen ze voor de woorden van den Bruidegom. Anders: wat ziet gijlieden [toch] aan Sulammith? of aan de Sulammietische."},{"catchword":"een rei","tekst":"Of, als een gezelschap; dat is een hoop dergenen, die een rei maken, die tezamen vrolijk zijn. De Israëlieten, zelfs ook de godzaligen, plachten met reien zich te verblijden en God te danken voor verworven overwinningen, of om andere oorzaken; Exo 15:20 ; Jer 31:4 , Jer 31:13 ; Luk 15:25 . In deze plaats wordt door de rei te kennen gegeven de blijdschap der gelovigen, als zij tot Christus komen zullen."},{"catchword":"van twee heiren","tekst":"Door deze twee heiren wordt te kennen gegeven de menigte dergenen, die zich tot Christus bekeren zouden. Doch anderen verstaan door de twee legers de kerk van Christus, bestaande uit Joden en heidenen. Anderen houden hier in den tekst het Hebreeuwse woord Machanaïm, dat twee heiren, of twee leger betekent. Zie Gen 32:1-2 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Whither is thy best beloved gone, O thou fairest among women? [These, and the following words of the verse, are the words of the Daughters of Jesuralem, of whom mention is made, chap. 5. Vers. 16.] whither hath thy best beloved turned (his) face, [To wit, from thee to others, or to another place] that we may seek him with thee? [Or, and we will seek him with thee. The daughters of Jerusalem having heard how the Spouse had praised and commended her Bridegroom, are thereby moved to enquire earnestly, the second time after him, (expressing thereby their great and fervent zeal) and they promise and engage that they will seek him with her, to the end that they also my be made partakers of his grace and blessings. Such is the power of the preaching of the Gospel in the hearts of the Elect: See Acts 2. 27. And 4. 4. And chapter 11. Vers. 20. 21.]"}],"2":[{"catchword":null,"tekst":"My best beloved is gone down into his garden, [The Spouse that at the first sought Christ her Bridegroom, but could not find him, knoweth now where he is, and she instructeth others of it. So that we do here see fulfilled that which Christ promiseth, Matth. 7. 7. Seek, and ye shall find. See Deut.4. 29. The garden of Christ is his Church, as above chap. 4. 16. And 5. 1. There is Christ to be sought, and likewise to be found] to the bed of spices, [It seemeth that hereby is intimated the flocks or companies of Believers, in whose hearts, as in good ground the good sweet-smelling seed of the Word of God is sowen, Matth. 13. 8, 23. This is the Bridegrooms garden of pleasure, where he is continually present with his grace and Spirit, and he taketh his delight in the good works of believers, as men do in pleasant garden plots, which are set and sowen with all manner of precious spices and flowers] to feed in the gardens, [That is, to have fellowship ad communion with his Elect, eating and enjoying his pleasant fruits. See above chap. 4. 16. As also to feed and nourish those that are his, and make them partakers of the gifts and graces of the Holy Ghost. (In the gardens:) That is, in the particular Churches and Congregations of Believers, as above chap. 1.] and for to gather the Lilies. [That is, to gather unto himself his elect and chosen people who are compared unto lilies among thorns; above, chap. 2. 2.]"}],"3":[{"catchword":null,"tekst":"I am my best beloveds, and my best beloved is mine: [The Spouse rejoiceth here because of the love and peace that was renewed betwixt her Bridegroom and herself, notwithstanding her former weaknesses and adversities. Those very words the Spouse likewise uttereth, of, or concerning her Bridegroom, above chap. 2. 16. And below chap. 7. 10. But somewhat in another sense] that feedeth among the Lilies. [That is, not onely in wholesome pasture, but also in an abounding pleasant pasture, to the refreshing, and to the everlasting comfort of his sheep.]"}],"4":[{"catchword":null,"tekst":"Thou art beautiful, my Love, like Thirza, comely as Jerusalem: [The Bridegroom having found his Spouse, commendeth her for the manifold gifts and graces of the Spirit, wherewith she is beautified and adorned. See above chap. 4. 1. Thirza was a City in the Land of Canaan , lying not far from Samaria, wherein one of the Kings which Joshua subdued kept his Court, Jos. 12. 24. Afterwards the Kings of Israel kept their Court there, until Samaria was built by Omri; See 1 Kings 24. 17. And 15. 21, 23. And 16. 6, 8, 23. The Greek interprets leave out the word Thirsta, and put into the text Good refreshing; or, favourable acceptance. Whence may be gathered, that it was a fair pleasant City, in which kind of places Kings and Princes were wont to dwell. Such kind of beauty, or comeliness is here ascribed unto the Spouse, being made fair and acceptable in and by Christ her Bridegroom, Ephes. 1. 6. And 5. 27. The City of Jerusalem is famous for her beauty and glory. It was in times past the famousest City of all the East. Plin. Lib. 5. Cap. 14. It was the seat of pure Religion, or, of the pure worship of God, and the dwelling-place of the Kings of Juda, Psal. 122. It is called the joy of the whole earth, Psal. 48. 3.] terrible [that is, full of majesty and courage,terrible in the eyes of her enemies, as below verse 10] as battalias, that is, as camps standing under their banners, or ensigns in battle-aray, ready to give battel. Therefore the Church is terrible in the eyes of her enemies, because she is environed and compassed about with many powerful Angels, 2 Kings 6. 17. And 19. 35. Likewise because she is armed with spiritual armour or weapons. See Acts 5. 11. Eph. 6. 13. And 2 Cor. 10. 4. See also below v. 10.]"}],"5":[{"catchword":null,"tekst":"Turn away thine eyes from me, [Or, over against me, as Numb. 2. 2. A phrase expressing the greatness of Christs love. Oth. Turn thine eyes towards me. The Hebrew word signifieth sometimes to turn one&acirc;&euro;&trade;s self toward another, as 1 Chron. 12. 23. Sometimes to turn away one&acirc;&euro;&trade;s self from another, as Ezech. 7. 22.] for they offer violence unto me: [Oth. They have lifted me up, or, exalted me] thine hair is as a flock of goats, [See the annotate. Above 4. 1.] that shear off (the grass) of Gilead. [Here is mentioned onely Gilead, but chap. 4. 1. Is mentioned, the Mountain of Gilead. Both in the one place, and in the other the whole country of Gilead is meant and understood.]"}],"6":[{"catchword":null,"tekst":"Thy teeth are as a flock of sheep, that come up from the washing place, which do all together bring forth twins, and (there) is none without young among them. [See above chap. 4. On verse 3.]"}],"7":[{"catchword":null,"tekst":"The teeth are as a peace of pomegranate between thy locks. [See above chap. 4. On verse 3.]"}],"8":[{"catchword":null,"tekst":"There are threescore Queens, and fourscore Concubines, and Virgins without number. [These words may be likewise taken as spoken conditionally, thus, let there be threescore Queens, & c. That is, although there were threescore Queens, etc. Yet (but) one is my dove, etc. Christ the Bridegroom of his church speaketh this under the name of Solomon, who was a type and a figure of him. Some conclude from hence, that Salomon made this song in the first years of his Reign, when he had not so many wives and Concubines, as he had afterward, 1 Kings 11. 3. But some conceive that here a certain number is put for an uncertain, as is further exprest, vers. 9. Of the word Concubines, see further Genes. 22. On vers. 24. It seemeth that by these Queens and Concubines are meant those Churches, which pretend to be true Churches, but have no inward spiritual fellowship and communion wit y found in this place. Most interpreters take it for nuts, and conceive that here must be meant not mean or ordinary nuts, bur nutmegs, such kind of pleasant and precious fruits, as grew in great abundance in the Bridegroom garden. See above cha. 4. Vers. 12, 13, 14. Oth. Cleansed, or, pruned garden. (To seen the green fruits:) Oth. New, or, first fruits; to wit, that ripen in the beginning of the year. The meaning is, that after the winter of adversity, appeareth the pleasant Spring of grace in the garden of the Church. (of the valley;) Or, in the low ground, where the Church of Christ is watered ad moistened with the Word and Spirit of God, that it may bear fruit in great abundance] to see whether the Vine flourished, (and) the pomegranates budded forth. [Or, blossomed, or, spouted out. Understand here by God, and planted in the garden of the Church, which budding ad blossoming in true and sincere knowledge, do afterward bring forth fruits of good works, to the glory of God, and to the edification of their neighbour. See above chap. 2. 13, 14.]"}],"12":[{"catchword":null,"tekst":"Before I knew it, my Soul set me (upon) the charets [That is, I set myself, etc. This phrase is very common in Holy Scripture: see examples thereof, Psal. 6. 4. Eccles. 7. 28. Above chap. 1. 7. Isai. 1. 14. And 61. 10. And elsewhere besides. The meaning is, I was moved by my fervent compassion, and not by the merits. Oth. Mysoul; that is, my desire. See Psal. 27. On vers. 12.] of my willing people. [Or, of my Noble, or, Princeley people. The Hebrew word Nadib, which is used here, signifieth free-willing, or good-willing, or, free, or Noble, or, Princely. Some render it, upon the charets of Amminadib, making of two words one: But we find not in Scripture who this Amminadib was: Therefore it is better to render it, my willing, or, my free-willing people; to wit, true Christians, or believers; who are said to be willing, or, free-willing in the day of power, or host, Psal. 110. 3. Receiving /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
