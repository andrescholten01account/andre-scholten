t hart genomen, Mijn zuster, o bruid! U hebt Mij het hart genomen, met een van uw ogen, met een keten van uw hals.","10":"Hoe mooi is uw uitnemende liefde, Mijn zuster, o bruid! Hoeveel beter is uw uitnemende liefde dan wijn, en de geur van uw oliën dan alle specerijen!","11":"Uw lippen, o bruid! druppen van honingzeem; honing en melk is onder uw tong, en de geur van uw kleren is als de geur van de Libanon.","12":"Mijn zuster, o bruid! U bent een besloten hof, een besloten wel, een verzegelde fontein.","13":"Uw scheuten zijn een paradijs van granaatappels, met edele vruchten, cyprus met nardus;","14":"Nardus en saffraan, kalmus en kaneel, met allerlei bomen van wierook, mirre en aloë, alsook alle voornaamste specerijen.","15":"O fontein van de hoven, put van levend water, dat uit de Libanon vloeit!","16":"Ontwaak, noordenwind! En kom, Gij zuidenwind! Doorwaai mijn hof, zodat zijn specerijen uitvloeien. O, dat mijn Liefste tot Zijn hof kwam, en at van zijn edele vruchten!"},"SV":{"1":"Zie, gij zijt schoon, Mijn vriendin! zie, gij zijt schoon; uw ogen zijn duiven *ogen* tussen uw vlechten; uw haar is als een kudde geiten, die *het* *gras* van den berg Gileads afscheren.","2":"Uw tanden zijn als een kudde *schapen*, die geschoren zijn, die uit de wasstede opkomen; die al te zamen tweelingen voortbrengen, en geen onder hen is jongeloos.","3":"Uw lippen zijn als een scharlaken snoer, en uw spraak is liefelijk; de slaap uws hoofds is als een stuk van een granaatappel tussen uw vlechten.","4":"Uw hals is als Davids toren, die gebouwd is tot ophanging van wapentuig, waar duizend rondassen aan hangen, altemaal zijnde schilden der helden.","5":"Uw twee borsten zijn gelijk twee welpen, tweelingen van een ree, die onder de leliën weiden.","6":"Totdat de dag aankomt, en de schaduwen vlieden, zal Ik gaan tot den mirreberg, en tot den wierookheuvel.","7":"Geheel zijt gij schoon, Mijn vriendin, en er is geen gebrek aan u.","8":"Bij Mij van den Libanon af, o bruid! kom bij Mij van den Libanon af; zie van den top van Amana, van den top van Senir en van Hermon, van de woningen der leeuwinnen, van de bergen der luipaarden.","9":"Gij hebt Mij het hart genomen, Mijn zuster, o bruid! gij hebt Mij het hart genomen, met een van uw ogen, met een keten van uw hals.","10":"Hoe schoon is uw uitnemende liefde, Mijn zuster, o bruid! hoeveel beter is uw uitnemende liefde dan wijn, en de reuk uwer oliën dan alle specerijen!","11":"Uw lippen, o bruid! druppen van honigzeem; honig en melk is onder uw tong, en de reuk uwer klederen is als de reuk van Libanon.","12":"Mijn zuster, o bruid! gij zijt een besloten hof, een besloten wel, een verzegelde fontein.","13":"Uw scheuten zijn een paradijs van granaatappelen, met edele vruchten, cyprus met nardus;","14":"Nardus en saffraan, kalmus en kaneel, met allerlei bomen van wierook, mirre en aloë, mitsgaders alle voornaamste specerijen.","15":"O fontein der hoven, put der levende wateren, die uit Libanon vloeien!","16":"Ontwaak, noordenwind! en kom, Gij zuidenwind! doorwaai mijn hof, dat zijn specerijen uitvloeien. O, dat mijn Liefste tot Zijn hof kwame, en ate zijn edele vruchten!"},"KJV":{"1":"Behold, thou *art* fair, my love; behold, thou *art* fair; thou *hast* doves' eyes within thy locks: thy hair *is* as a flock of goats, that appear from mount Gilead.","2":"Thy teeth *are* like a flock *of sheep that are even* shorn, which came up from the washing; whereof every one bear twins, and none *is* barren","3":"Thy lips *are* like a thread of scarlet, and thy speech *is* comely: thy temples *are* like a piece of a pomegranate within thy locks.","4":"Thy neck *is* like the tower of David builded for an armoury, whereon there hang a thousand bucklers, all shields of mighty men.","5":"Thy two breasts *are* like two young roes that are twins, which feed among the lilies.","6":"Until the day break, and the shadows flee away, I will get me to the mountain of myrrh, and to the hill of frankincense.","7":"Thou *art* all fair, my love; *there is* no spot","8":"Come with me from Lebanon, *my* spouse, with me from Lebanon: look from the top of Amana, from the top of Shenir and Hermon, from the lions' dens, from the mountains of the leopards.","9":"Thou hast ravished my heart, my sister, *my* spouse; thou hast ravished my heart with one of thine eyes, with one chain of thy neck.","10":"How fair is thy love, my sister, *my* spouse! how much better is thy love than wine! and the smell of thine ointments than all spices!","11":"Thy lips, O *my* spouse, drop *as* the honeycomb: honey and milk *are* under thy tongue; and the smell of thy garments *is* like the smell of Lebanon.","12":"A garden inclosed *is* my sister, *my* spouse; a spring shut up, a fountain sealed.","13":"Thy plants *are* an orchard of pomegranates, with pleasant fruits; camphire, with spikenard,","14":"Spikenard and saffron; calamus and cinnamon, with all trees of frankincense; myrrh and aloes, with all the chief spices:","15":"A fountain of gardens, a well of living waters, and streams from Lebanon.","16":"Awake, O north wind; and come, thou south; blow upon my garden, *that* the spices thereof may flow out. Let my beloved come into his garden, and eat his pleasant fruits."}},"tsk":{"1":[{"kopje":"Mijn","refs":["Hoogl 4:9","Hoogl 4:10","Hoogl 1:15","Hoogl 2:10","Hoogl 2:14","Ps 45:12","Ezech 16:14","2 Kor 3:18"]},{"kopje":"uw haar is","refs":["Hoogl 5:12","Matt 11:29","Fil 2:3-5"]},{"kopje":"uw haar","refs":["Hoogl 5:11","Hoogl 6:5","Hoogl 6:7","Hoogl 7:5"]},{"kopje":"berg","refs":["Num 32:1","Num 32:40"]}],"2":[{"kopje":"tanden","refs":["Hoogl 6:6","Jer 15:16","Joh 15:7","Kol 1:4-6","1 Tess 2:13","2 Petr 1:5-8"]},{"kopje":"en geen","refs":["Ex 23:26","Deut 7:13","Deut 7:14"]}],"3":[{"kopje":"lippen","refs":["Hoogl 4:11","Hoogl 5:13","Hoogl 5:16","Hoogl 7:9","Ps 37:30","Ps 45:3","Ps 119:13","Spr 10:13","Spr 10:20","Spr 10:21","Spr 16:21-24","Matt 12:35","Luk 4:22","2 Kor 5:18-21","Ef 4:29","Kol 3:16","Kol 3:17","Kol 4:6"]},{" "H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6082\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6646\">roes</span> that are <span class=\"wl wl-kjv\" data-code=\"H8380\">twins,</span> which <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> among the lilies.","6":"Until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H6315\">break,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6752\">shadows</span> flee <span class=\"wl wl-kjv\" data-code=\"H5127\">away,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3212\">get</span> me to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of <span class=\"wl wl-kjv\" data-code=\"H4753\">myrrh,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill</span> of frankincense.","7":"Thou art all <span class=\"wl wl-kjv\" data-code=\"H3303\">fair,</span> my <span class=\"wl wl-kjv\" data-code=\"H7474\">love;</span> there is no spot","8":"<span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> with me from <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> my <span class=\"wl wl-kjv\" data-code=\"H3618\">spouse,</span> with me from <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon:</span> <span class=\"wl wl-kjv\" data-code=\"H7789\">look</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of <span class=\"wl wl-kjv\" data-code=\"H549\">Amana,</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of <span class=\"wl wl-kjv\" data-code=\"H8149\">Shenir</span> and <span class=\"wl wl-kjv\" data-code=\"H2768\">Hermon,</span> from the <span class=\"wl wl-kjv\" data-code=\"H738\">lions'</span> <span class=\"wl wl-kjv\" data-code=\"H4585\">dens,</span> from the <span class=\"wl wl-kjv\" data-code=\"H2042\">mountains</span> of the leopards.","9":"Thou hast ravished my <span class=\"wl wl-kjv\" data-code=\"H3823\">heart,</span> my <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> my <span class=\"wl wl-kjv\" data-code=\"H3618\">spouse;</span> thou hast ravished my <span class=\"wl wl-kjv\" data-code=\"H3823\">heart</span> with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6060\">chain</span> of thy neck.","10":"How <span class=\"wl wl-kjv\" data-code=\"H3302\">fair</span> is thy <span class=\"wl wl-kjv\" data-code=\"H1730\">love,</span> my <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> my <span class=\"wl wl-kjv\" data-code=\"H3618\">spouse!</span> how much <span class=\"wl wl-kjv\" data-code=\"H2895\">better</span> is thy <span class=\"wl wl-kjv\" data-code=\"H1730\">love</span> than <span class=\"wl wl-kjv\" data-code=\"H3196\">wine!</span> and the <span class=\"wl wl-kjv\" data-code=\"H7381\">smell</span> of thine <span class=\"wl wl-kjv\" data-code=\"H8081\">ointments</span> than all spices!","11":"Thy <span class=\"wl wl-kjv\" data-code=\"H8193\">lips,</span> O my <span class=\"wl wl-kjv\" data-code=\"H3618\">spouse,</span> <span class=\"wl wl-kjv\" data-code=\"H5197\">drop</span> as the <span class=\"wl wl-kjv\" data-code=\"H5317\">honeycomb:</span> <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> and <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> are under thy <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7381\">smell</span> of thy <span class=\"wl wl-kjv\" data-code=\"H8008\">garments</span> is like the <span class=\"wl wl-kjv\" data-code=\"H7381\">smell</span> of Lebanon.","12":"A <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> <span class=\"wl wl-kjv\" data-code=\"H5274\">inclosed</span> is my <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> my <span class=\"wl wl-kjv\" data-code=\"H3618\">spouse;</span> a <span class=\"wl wl-kjv\" data-code=\"H1530\">spring</span> shut <span class=\"wl wl-kjv\" data-code=\"H5274\">up,</span> a <span class=\"wl wl-kjv\" data-code=\"H4599\">fountain</span> sealed.","13":"Thy <span class=\"wl wl-kjv\" data-code=\"H7973\">plants</span> are an <span class=\"wl wl-kjv\" data-code=\"H6508\">orchard</span> of <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates,</span> with <span class=\"wl wl-kjv\" data-code=\"H4022\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H6529\">fruits;</span> <span class=\"wl wl-kjv\" data-code=\"H3724\">camphire,</span> with spikenard,","14":"<span class=\"wl wl-kjv\" data-code=\"H5373\">Spikenard</span> and <span class=\"wl wl-kjv\" data-code=\"H3750\">saffron;</span> <span class=\"wl wl-kjv\" data-code=\"H7070\">calamus</span> and <span class=\"wl wl-kjv\" data-code=\"H7076\">cinnamon,</span> with all <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H3828\">frankincense;</span> <span class=\"wl wl-kjv\" data-code=\"H4753\">myrrh</span> and <span class=\"wl wl-kjv\" data-code=\"H174\">aloes,</span> with all the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> spices:","15":"A <span class=\"wl wl-kjv\" data-code=\"H4599\">fountain</span> of <span class=\"wl wl-kjv\" data-code=\"H1588\">gardens,</span> a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and <span class=\"wl wl-kjv\" data-code=\"H5140\">streams</span> from Lebanon.","16":"<span class=\"wl wl-kjv\" data-code=\"H5782\">Awake,</span> O north <span class=\"wl wl-kjv\" data-code=\"H6828\">wind;</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> thou <span class=\"wl wl-kjv\" data-code=\"H8486\">south;</span> <span class=\"wl wl-kjv\" data-code=\"H6315\">blow</span> upon my <span class=\"wl wl-kjv\" data-code=\"H1588\">garden,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1314\">spices</span> thereof may flow <span class=\"wl wl-kjv\" data-code=\"H5140\">out.</span> Let my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into his <span class=\"wl wl-kjv\" data-code=\"H1588\">garden,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> his <span class=\"wl wl-kjv\" data-code=\"H4022\">pleasant</span> fruits."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gij zijt schoon,","tekst":"De Bruid van Christus wordt schoon genoemd, niet alleen ten aanzien dat zij in Christus wordt aangemerkt, maar ook omdat zij naar het beeld van Christus veranderd wordt van klaarheid tot klaarheid, als van des Heeren Geest; 2Co 3:18 . Zie boven, Son 1:15 ."},{"catchword":"gij zijt schoon;","tekst":"Zie boven, Son 1:15 ."},{"catchword":"duivenogen","tekst":"Zie de aantekening Son 1:15 ."},{"catchword":"tussen","tekst":"Of, tussen uwe tuigen; gelijk onder vs.3. Anders: uwe haarbindselen."},{"catchword":"is als een kudde","tekst":"Dat is, het is schoon, glad en teder, als het haar der geiten, die op den berg van Gilead weiden, of ergens in een goede vette landouw gaan, en daarvan vet worden en teder zacht haar krijgen; dat is, gij zijt versierd met goede werken."},{"catchword":"berg Gileads","tekst":"Deze landstreek was zeer bekwaam om het vee te weiden, vanwege hare vettigheid, gelijk blijkt uit Gen 31:21 ; Num 32:1 ; Jer 22:6 ."},{"catchword":"afscheren","tekst":"Het Hebreeuwse woord vindt men alleen hier en onder, Son 6:5 ; het betekent afscheren, of kaal maken; dat is afeten. Anders: die glinsteren van den berg van Gilead."}],"2":[{"catchword":"Uw tanden","tekst":"Te weten, uw geestelijke tanden, met welke gij de spijs der ziel moet herkauwen, hebben al het sieraad, dat men in de tanden zou mogen vereisen, en zijn dienvolgens bekwaam om de geestelijke spijs te kauwen en herkauwen."},{"catchword":"geschoren","tekst":"Of, afgesneden zijn; of die elkander gelijk gemaakt zijn, alzo dat de een niet groter is dan de ander, anderszins zou het kwalijk staan en hinderlijk zijn in het kauwen der geestelijke spijs."},{"catchword":"die uit de wasstede","tekst":"Of, die opkomen van het wassen, en derhalve schoon en wit zijn."},{"catchword":"zonder jongen","tekst":"Dat is, onvruchtbaar."}],"3":[{"catchword":"Uw lippen","tekst":"De lippen zijn de instrumenten om de woorden voort te brengen; en hier betekenen zij de leraars van het Woord en derzelver lieflijke leringen, hetwelk met de naastvolgende woorden [en uwe spraak is lieflijk] breder wordt te kennen gegeven."},{"catchword":"als een scharlaken","tekst":"Dat is, rood, hetwelk in de lippen geprezen wordt. Het betekent dat hare leer den ledematen der gemeente aangenaam is."},{"catchword":"een stuk","tekst":"Daar men rode korrels of granen in ziet. Onder den slaap moet men mede verstaan de rode blozende wangen, zijnde een deel van de schoonheid van het aangezicht. Doch hier betekent het schaamte, en eerbaarheid in de ledematen der Kerk, zich nauw wachtende van iets te doen of te spreken, waar zij schaamrood van worden."},{"catchword":"tussen","tekst":"Gelijk boven, vs.1."}],"4":[{"catchword":"Uw hals","tekst":"Dat is, uw hals is rechtop hoog en sterk, en met sieraad omhangen, gelijk die schone toren, dien David gebouwd heeft. Zie Neh 3:19 , Neh 3:25 , en Mic 4:8 . Doch anderen verstaan dit van den burg Davids, 2Sa 5:7 , 2Sa 5:9 . Dit betekent den moed, kloekmoedigheid en zekere hoop der kerk van Christus, die met Christus haar Hoofd verenigd zijnde, haar nek niet meer buigt om den duivel te dienen of de zonde, Rom 6:17-18 ; of de mensen, 1Co 7:23 . Maar door de wapenen van haren krijg [die niet vleselijk zijn, maar machtig door God, om de sterken neder te werpen, 2Co 10:4 ] , staat zij vast in den bozen dag, gewapend gelijk er geschreven staat Eph 6:11 , enz."},{"catchword":"tot ophanging","tekst":"Of, tot ene wapenkamer, of magazijn van allerlei wapentuig. Het Hebreeuwse woord wordt alleen hier gevonden; en het schijnt dat hier zulke wapenen worden te verstaan gegeven, die tot kwetsing of bezering des vijands dienen, gelijk door de rondassen en schilden zodanige wapenen, waarmede men zijn lichaam beschermt en de slagen afweert."},{"catchword":"duizend rondassen","tekst":"Het getal van duizend staat hier en elders voor een groot getal."},{"catchword":"der helden","tekst":"Van de helden Davids en hun kloeke daden zie 2Sa 23:8 , en 1Ch 11:10 tot 1Ch 11:47 , wier schilden ter eeuwiger gedachtenis in Davids toren opgehangen zijnde, hier betekenen al diegenen, die door het schild des geloofs, vele grote en treffelijke dingen hebben uitgericht, van welke de apostel enigen verhaalt Heb 11 ."}],"5":[{"catchword":"twee borsten","tekst":"Versta hier bij de twee grote borsten die leringen en vertroostingen, die in het Oude en Nieuwe Testament te vinden zijn, waarmede de gelovigen gespijsd en gelaafd worden. Zie Isa 66:11 , en 1Pe 2:2 . Anderen verstaan door de twee borsten der Bruid de bediening des Woord Gods en der heilige sacramenten, waarmede de schapen en lammeren van Christus als op een goede vette weide gevoed worden."},{"catchword":"zijn gelijk","tekst":"Dat is, zij zijn beide schoon, vol, vast en elkander gelijkvormig. Alzo zijn in alle manieren het Oude en Nieuwe Testament elkander gelijk, het een met het andere in alles accorderende en overeenkomende."},{"catchword":"die onder","tekst":"Te weten, in vette en gezonde weiden, betekenende de goede en gezonde leer der kerk. Zie Son 5:13 ."}],"6":[{"catchword":"Totdat","tekst":"De Bruidegom beantwoordt hier de zwarigheid, die zijne Bruid mocht voorwerpen, zeggende: Heere Jezus Christus, ben ik zo schoon in uwe ogen, waarom wacht Gij zolang met het houden van onze bruiloft? Hierop antwoordt de Bruidegom: Gij moet verwachten den tijd, die hiertoe van eeuwigheid bestemd en besloten is; te weten den tijd van de oprichting aller dingen; Act 3:21 . Dat is, totdat der wereld avond of einde komt, dan zal Ik u tot mij opnemen, middelerwijl zal Ik tot den mirreberg gaan; dat is ten hemel opvaren, waarheen de gelovigen dagelijks hunne gebeden [die als een welriekende mirre en wierook zijn; Son 5:13 ] opofferen en heenzenden; Ik aldaar zijnde en blijvende uw Voorspreker bij mijn hemelsen Vader."}],"7":[{"catchword":"Geheel","tekst":"Boven, vs.1, en Son 1:15 , wordt de Bruid schoon genoemd; hier wordt zij geheel schoon genoemd, dewijl zij in Christus geheel schoon en volmaakt is, Eph 5:25-27 ; Col 1:22 ; en Col 2:10 ; Rev 14:5 ."},{"catchword":"gebrek","tekst":"Zie van dit woord Pro 9:7 ."}],"8":[{"catchword":"Bij Mij","tekst":"Dit spreekt Christus tot zijne Bruid, die Hij straks gezegd heeft heel schoon te zijn. De zin is: Kom tot mij in den hemel, dien gij nu door het geloof aanschouwt, als gij het beloofde land Kanaän zaagt van boven de omliggende bergen, die hier genoemd worden, zijnde nog onder de tirannen gezeten, die men hier moet verstaan door de leeuwen en luipaarden. Zie Psa 57:4 . Eenigen verstaan hier door deze bergen aan verscheidene hoeken van het Joodse land liggende, niet alleen de beroeping der Joden, maar ook der heidenen in die vier hoeken der wereld verstrooid."},{"catchword":"o bruid","tekst":"Aldus wordt de kerk hier en in het volgende genoemd, ten aanzien van het geestelijke huwelijk met haren Bruidegom Christus, hetwelk in den dag der bruiloft in den hemel zal voltrokken worden. Zie Joh 3:29 ; 2Co 11:2 , en Eph 5:25 ; Rev 19:7 , en Rev 21:2 , Rev 21:9 ."},{"catchword":"Libanon af;","tekst":"Libanon, of Libanus, is wel een zeer lustige plaats geweest, Deu 3:25 , maar bij andere vruchtbare plaatsen vergeleken zijnde, was het ene wildernis, Isa 29:17 , en als een wildbaan, of jachtplaats, 2Ki 14:9 , waarop hier gezien wordt. Doch op andere plaatsen der Heilige Schrift betekent Libanus voortreffelijke en lieflijke dingen, ten aanzien van de menigte der schone bomen, die daarop wiessen; gelijk Son 3:9 , en Son 5:15 ."},{"catchword":"top","tekst":"Of, spits. Hebreeuws, het hoofd."},{"catchword":"Amána,","tekst":"Dit is ene berg in Syrië, waar een vallei en rivier was, die denzelfden naam hadden, anders genoemd Abana, 2Ki 5:12 . Strabo zegt, lib.14, dat deze berg is bezeten geweest van verscheidene tirannen."},{"catchword":"Senir","tekst":"Van de bergen Senir en Hermon zie Deu 3:9 . Senir is hier te nemen voor een deel van den berg Hermon. Hermon, Hermon is een vermaarde berg, van welken te lezen is Psa 42:7 , en Psa 89:13 . Hij wordt anders Sion genoemd, met ene S.; Deu 4:48 ."},{"catchword":"der leeuwinnen,","tekst":"Of, der leeuwen."},{"catchword":"van de bergen der luipaarden","tekst":"Hierbij verstaan enigen: verlost en bevrijd zijnde, zult gij zien het gevaar waarin gij geweest zijt. En aan de andere zijde zult gij zien den gelukkigen staat, waar gij toe gebracht zijt; of iets dergelijks; zie 1Co 6:9-11 ."}],"9":[{"catchword":"Mij het hart","tekst":"Of, mijn hart hebt gij genomen."},{"catchword":"genomen,","tekst":"Of, beroofd, of gewond; te weten door liefde. Zie Isa 62:5 . Het Hebreeuwse woord betekent: Gij hebt mij gehard, of onthart. De zin is: Gij hebt mijne gunst en liefde verworven, niettegenstaande uw veelvoudige gebreken."},{"catchword":"Mijn zuster,","tekst":"Aldus wordt de kerk genoemd ten aanzien dat Christus onzer aller broeder is, hebbende ons vlees en bloed aangenomen en ons door het geloof tot Gods kinderen en zijne broeders en medeërfgenamen gemaakt. Zie Mat 12:50 ; Joh 1:13 ; Rom 8:16-17 ; Heb 2:11 ."},{"catchword":"gij hebt mij","tekst":"En derhalve moogt gij wel gerust en verzekerd zijn dat Ik u voor altoos niet verlaten zal."},{"catchword":"met een van uw ogen,","tekst":"Dat is, door het ware geloof, waarmede gij mij aanschouwt en omhelst als uw lieven Bruidegom, wint gij mij het hart af. Zonder geloof kunnen wij God niet behagen; Heb 11:6 ."},{"catchword":"keten","tekst":"Dat is met het sieraad uwer goede werken, uit een waar geloof spruitende; zie Pro 1:9 . Deze keten hebben wij van onszelven niet, maar door de genade Gods, gelijk te zien is Son 1:11 . God kroont in ons zijn eigen gaven."},{"catchword":"van uw hals","tekst":"Te weten, hangende."}],"10":[{"catchword":"Hoe schoon","tekst":"Dat is, hoe vermakelijk en hoe aangenaam is het mij, dat Ik uwe liefde te mijwaarts bespeur. Zie boven, Son 1:2 . Deze liefde is gelegen in het onderhouden der geboden van Christus; 1Jo 2:3-5 ."},{"catchword":"wijn,","tekst":"Zie de aantekening boven, Son 1:2 , Son 1:4 ."},{"catchword":"uwer oliën","tekst":"Versta door de oliën of zalven de gaven van den Heiligen Geest, welke de kerk ontvangen heeft. Zie Phi 4:18 ; 1Jo 2:20 , 1Jo 2:27 . Son 1:3 roemt de Bruid den reuik der oliën of zalven. Zie de aantekening aldaar. Alzo roemt hier de Bruidegom de oliën der Bruid. Zie Isa 62:4-5 ."},{"catchword":"specerijen","tekst":"Dat is, welriekende kruiden, gelijk die waren, waar de heilige zalf of olie van gemaakt was, Exo 30:23 . Zie ook 2Ch 9:1 , 2Ch 9:8 , en 2Ch 16:14 ; Est 2:12 ."}],"11":[{"catchword":"Uw lippen,","tekst":"Met welke gij God aanroept, zijn Woord predikt, zijnen naam looft en prijst en uwen naaste sticht."},{"catchword":"druppen","tekst":"Dat is, uwe redenen zijn mij zo lieflijk en aangenaam als den mensen het honigzeem. Zie deze gelijkenis ook Psa 19:11 , en Psa 119:103 ."},{"catchword":"honig en melk","tekst":"Dit betekent hetzelfde dat straks gezegd is. Zie 1Pe 2:2 ."},{"catchword":"de reuk uwer","tekst":"Dat is, uwe goede werken."},{"catchword":"de reuk van Libanon","tekst":"Op den berg Libanon wiessen vele welriekende bomen en kruiden, inzonderheid wierookbomen, waar de berg Libanon zijnen naam van heeft, want Lebona betekent wierook. Hos 14:6-8 , belooft God Israël dat zijn reuk zou zijn als de Libanon, door den dauw zijner genade. Zie 2Co 2:14-15 ."}],"12":[{"catchword":"besloten hof,","tekst":"Of, gegrendelde, toegesloten, in slot gedane hof. Hiermede wordt de onbevlekte, geestelijke reinheid en kuisheid der kerk beduid, die den vreemden vrijers of verleiders geen toegang geeft. Doch anderen verstaan dit van de bescherming Gods, die zijne kerk bewaart voor de wilde dieren; dat is voor de wrede tirannen. Isa 5 vergelijkt God zijne kerk bij een besloten wijnstok; en Zec 2:5 belooft Hij rondom Jeruzalem te zullen zijn een vurige muur."},{"catchword":"een besloten wel,","tekst":"Uit welke het klare water van het heilig Evangelie is spruitende, waarmede de bedroefde harten en gemoederen verkwikt en gelaafd worden, Psa 23:2 ; achtervolgens de belofte, die God zijne kerk doet, Isa 58:11 . En daarom wordt deze wel of springader gezegd besloten te zijn, omdat dit water der genade alleen den ledematen der kerk toekomt. Niemand komt daartoe dan door Christus."},{"catchword":"een verzegelde","tekst":"Versta hierdoor de verzekering of bevestiging der genade, die Christus zijne gemeente bewijst, zie 2Co 1:22 ; Eph 1:13 ; ja zijne gemeente alleen, want dat men verzegelt, dat maakt men anderen niet deelachtig. Zie Isa 8:16 ."}],"13":[{"catchword":"Uw scheuten","tekst":"Of, uwe planten, of ranken, of plantsoenen; dat is, de gelovigen en ledematen der kerk zijn overvloediglijk met goede werken versierd en vervuld, gelijk een granaatappel vol korrels is. Zij zijn als vruchtbare bomen geplant bij een vers water, Psa 1:3 , en Psa 92:13 ."},{"catchword":"een paradijs","tekst":"Of, lusthof, schone boomgaard. Het betekent eigenlijk ene plaats met bomen beplant, gelijk blijkt uit Ecc 2:5 ; het wordt ook somtijds genomen voor een bos of woud, Neh 2:8 ."},{"catchword":"edele vruchten,","tekst":"Of, uitnemende, voortreffelijke vruchten. Versta hierdoor de goede werken der gelovigen, die God aangenaam zijn, gelijk granaatappelen en andere lieflijke vruchten den mensen zijn."},{"catchword":"cyprus","tekst":"Zie boven, Son 1:14 . Hebreeuws, cyprussen met nardussen, of veel cyprus met veel nardus. Daarom wordt het woord nardus hier gesteld in het getal van velen, en vs.14; in het getal van een, omdat er verscheidene soorten van nardus zijn; of versta hier de bladeren van cyprus en nardus, die ook wel rieken."}],"14":[{"catchword":"kalmus","tekst":"Anders, zoet riet, kalmus en kaneel werden gebruikt in de heilige olie, Exo 30:23 , gelijk de mirre in de olie der zalving; Exo 30:23 tot Exo 30:34 ."},{"catchword":"bomen","tekst":"Dat is, van zulke bomen, die wierook geven."},{"catchword":"aloë,","tekst":"Of, sandelboom. Zie Num 24:6 ; Pro 7:17 , en Psa 45:9 ."},{"catchword":"alle","tekst":"Hebreeuws, alle hoofdspecerijen; dat is allerlei voornaamste specerijen. Zie Exo 30:23 ."},{"catchword":"voornaamste specerijen","tekst":"Versta hierbij, uit vs.13, zijn uwe scheuten, of ranken. En door deze lieflijke, welriekende kruiden of specerijen worden te kennen gegeven de velerlei gaven des Heiligen Geestes, waarmede de godzaligen begenadigd zijn; zie 1Co 12:5-6 , enz.; Gal 5:22-23 ; 1Pe 4:10 ."}],"15":[{"catchword":"O fontein","tekst":"Met deze woorden roemt de Bruid haren Bruidegom, die haar begiftigt met overvloed van wateren, dat is, met vele voortreffelijke geestelijke gaven, waarmede al de hoven, dat is al de gemeenten bewaterd en bevochtigd worden om overvloedige vruchten te dragen. Zie Isa 58:11 ."},{"catchword":"der levende","tekst":"Dat is, der gedurige wateren, altijd lopende, nimmermeer verdrogende of vervuilende, maar de mensen met hunne lieflijkheid verversende. Zie Gen 26:19 . Dusdanig water geeft Christus den zijnen. Zie Joh 4:10 , Joh 4:14 , en Joh 7:38-39 , en Isa 12:3 ."},{"catchword":"die uit Libanon","tekst":"Het schijnt dat hier gezien wordt op de rivier de Jordaan, die haar oorsprong neemt aan den voet van den Libanon, en zij liep langs door het beloofde land, hetzelve bevochtigende. Daar staat Rev 22:1 , dat er uit den troon Gods en des Lams [hetwelk Christus is] een zuivere stroom van het levende water voortkwam."}],"16":[{"catchword":"Ontwaak,","tekst":"Of, rijs op, sta op. Dit is ook een zegen, dien God over zijn hof, dat is over zijne kerk zendt. Te weten, dat de winden daarop waaien, om dien te verversen en de lucht te zuiveren, en alzo denzelven vruchtbaarder te maken. Versta hier door den wind den Heiligen Geest, gelijk Joh 3:8 , en Act 2:2 . En ofschoon de zuider en noordenwind van verscheiden kwaliteiten en werkingen zijn, de een zijnde koud, de andere warm, de een vochtig, de ander droog, zo zijn zij nochtans beide dezen hof of der kerk Gods bevorderlijk, die somtijds scherpe bestraffingen, somtijds ook kalmte en zoete vertroosting van node heeft."},{"catchword":"doorwaai","tekst":"Het is God, die de winden voortbrengt uit zijne schatkamers; Psa 135:7 ."},{"catchword":"mijn hof,","tekst":"Merk dat de kerk dezen hof noemt haren hof, ook zijnen: te weten Christus' hof, ten verscheiden opzien. Christus is de eigenaar en erfgenaam van dezen hof; maar de opzieners der kerk zijn Gods akkerlieden en medewerkers in dezen hof, dat is gemeente, waaraan iegelijk lidmaat de geestelijke gemeenschap mede heeft; 1Co 3:9 ."},{"catchword":"dat zijn specerijen","tekst":"Dat is, opdat de reuk verspreid worde."},{"catchword":"ate","tekst":"Dat is, dat Hij de vruchten geniete, die wij door Hem, door de werking en kracht zijns Geestes, voortbrengen, waardoor wij schuldig zijn Hem te eren; Rom 6:22 ."},{"catchword":"edele vruchten","tekst":"Zie boven, vs.13."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Behold, thou art fair, my Love, [The Spouse of Christ is called fair, or beautiful, not onely as she is behold and considered in Christ, but also as she is transformed and changed into the image of Christ, from glory to glory, as by the spirit of the Lord, 2 Cor.3.18. See above chap.1.on vers.15.] behold, thou art fair, [see above chap.1.on vers.15.] thine eyes are doves (eyes,) [see the annotate.chap.1.15.] between thy locks: [Or, between thy hair-dressing, as below vers.3. Oth. Thine hair-bindings] thine hair is as a flock of goats, that shear off (the grass) of mount Gilead. [That is, it is fair, smooth, and like unto the hair of the goats, that feed upon mount Gilead, or go somewhere in a goodly fat ground or meadow, and thereby grow fat, and get thin soft hair. That is, thou art adorned with good works. (that shear off, &c.) The Hebrew word is onely found here, and below chap.6.5. It signifieth to shear off, or to make bald; that is, to eat off. Oth. That shine from mount Gilead. This Country of Gilead was very commodious to feed cattle in, by reason of its fatness, as appeareth by Genes.31.21. Num 32:1. Jerem.22.vers.6.]"}],"2":[{"catchword":null,"tekst":"Thy teeth are like a flock of (sheep,) [To wit, thy spiritual teeth; whereby thou art to chew the cud, or to ruminate the spiritual food of the soul, have all the beauty and ornament, that may be required in teeth, and consequently are fit and apt to chew and ruminate the spiritual food] that are shorn, [Or, are cut off, or which are make alike or equal to one another, so that the one is not greater then the other; otherwise it would be unseenily, and be an impediment in the chewing of the spiritual food] which come up from the washing-place; [Or, which come up from the washing, and consequently are clean, and white] they all bring forth twins, and none is without young [Or, barren] among them."}],"3":[{"catchword":null,"tekst":"They lips are like a thread of scarlet, [The lips are the instruments of uttering or producing words: And here they signify the Ministers of the word, and their sweet and pleasant Doctrines, which is further intimated by the words following (and thy speech is pleasant, or, comely.) (like a scarlet-lace) That is, red, which is a commendable thing in the lips. It signifieth that their Doctrine is pleasant and delightful to the hearers, or members of the Congregation] and thy speech is pleasant: [compare Psal.147.1. Col.4.5.] thy temples are like a piece of a pomegranate [Wherein little red kernels or gains are seen & discerned. Under the word temples may be likewise understood and comprehended the red blushing cheeks being a part of the beauty of the face. But here it signifieth bashfulness and modesty in the members of the church, taking narrow heed of doing, or speaking anything, whereat they may have cause to blush] between thy locks. [as above v.1.]"}],"4":[{"catchword":null,"tekst":"Thy neck is like the tower of David, which is built for the hanging up of armor, [That is, thy neck is bolt up right, high and strong, and hung about with ornaments, as that fair tower, which David built. See Neh.3. vers.19. and 25. And Mic 4:8. But others understand this of Davids strong-hold, 2 Sam.5.7,9. This signifieth the courage, boldness, and sure hope or confidence of the Church of Christ, who being united unto Christ her head, boweth her neck no more, to serve the Devil, or sin, Rom 6:17,18. Or men, 1 Cor.7.23. But by the weapons of her warfare (which are not carnal, but mighty through God, to cast down strong holds, 2 Cor.10.4.) she standeth fast in the evil day, being armed, as it is written, Eph 6:11, etc. (Built for the hanging up of armory, or arms:) Or, for an armors, or, magazine for all manner of armor, or, arms. The Hebrew word is onely found in this place. And it seemeth, that here such weapons are meant or understood, which serve to hurt or wound the enemy with, as by the bucklers and shields (mentioned in the following words) are meant such kind of weapons or arms, whereby a man defendeth himself, and keepeth off the blows,] whereon (there) hang a thousand bucklers, [The number of thousand is used here and elsewhere for a great number] all being the shields of Champions. [Of Davids Champions, and their valiant acts, see 2 Sam.23.8. to the end, and 1 Chron.11.10. to vers.47. whose shields being hung up in the tower of David for perpetual memory, signify here all those, who by the shield of faith have done many great and valiant acts, whereof the Apostle relateth some, Heb.11.]"}],"5":[{"catchword":null,"tekst":"Thy two breasts, [Understand here by the two breasts, the Doctrines and comforts, which are to be found in the Old and New Testament, wherewith the faithful are fed and nourished. See Isai.66.11. and 1 Pet.2.2. Others understand by the spouses two breasts, the administration of the word of God, and of the Holy Sacraments, wherewith the sheep and lambs of Christ, are fed and nourished as upon a good and fast pasture] are like two whelps, twins of a roe, [That is, both of them are fair, full, firm, and uniform; So are the old and New Testament every way like each other, the one according and agreeing with the other in all things] which feed among the lilies. [To wit, in fat and wholesome doctrine of the church. See below 5.13.]"}],"6":[{"catchword":null,"tekst":"Until that day break, and the shadows fly (away,) I will go to the mountain of myrrhe, and to the hill of frankincense. [The Bridegroom answereth here the scruple which his spouse might object, saying, Lord Jesus Christ, am I so fair and beautiful in thine eye? Why then stayest thou so long from consummating and solemnizingthe marriage betwixt us? Hereunto the Bridegroom maketh answers, Thou must wait the time that is appointed and decreed for it; to wit, the time of the restauration or restitution of all things, Act 3:21. That is, until the evening or end of the world come: then will I take up unto me; in the mean while I will go to mountain of myrrhe, and to the hill of frankincense; that is, I will ascend into heaven, whither the faithful do daily offer up and send up their prayers, which are like unto sweet-smelling myrrhe and frankincense, below, chap.5.13. I being and remaining there thine advocate with mine heavenly father.]"}],"7":[{"catchword":null,"tekst":"Thou art all fair, my Love, [Above, v.1. and chap.1.15. the spouse is called fair; here she is called fair; here she is called all fair: in regard she is all fair and perfect in Christ, Eph.5.v.25,26,27. Col.1.22. and 2.10. Rev 14:5.] and there is no blemish in thee. [see of the word, blemish, Proverbs 9.on v.7.]"}],"8":[{"catchword":null,"tekst":"With me from Libanon, O Spouse, come with me from Libanon: look from the top [Or, point. Hebr. The head] of Amana, from the top of Senir and Hermon, from the dwellings of the Lionesses, [Or, of the Lions] from the mountains of the Leopards. [Christ speaketh this unto his Spouse, of whom he said immediately before, that she was all fair, or altogether fair. The meaning is, Come to me into heaven, which thou now seest and beholdest by faith, as if thou sweat and beheldest the land of Canaan, from the top of the mountains round about that are here named, which are yet under the possession and dominion of tyrants, who are here to be understood by the Lions and the Leopards, see Psal.57.4. Some understand here by these mountains lying at or nigh divers corners of the land of Juda, not onely the calling and conversion of the Jews, but also of the Gentiles scattered in the four corners of the world. (O spouse!) Thus the church is called here, and in the sequel, in respect of her spiritual marriage with Christ, her Bridegroom, which shall be consummated and solemnized on the Marriage-day in Heaven, see Rev 21:2. and 19.7. Joh 3:29. 2 Cor.11.2. Eph.2.25. Libanon or Libanus was indeed a pleasant place, Deut.3.25. But being compared with other fruitful places, it was a kind of wilderness, Jer 29:17. and like a haunt of wild beasts or hunting-place, 2 Kings 14.9. Whereunto respect is had in this place. Yet in other places of Scripture Libanus signifieth excellent and delightful things, in respect of the abundance of the fair trees that grew on it, as below, chap.5.9. and 5.15. Amana is a mountain in Syria, where there was a valley and also a River, that bare the same name, otherwise called Abana, 2 Kings 5.12. Strabo, lib.14. saith, that this mountain was possessed by divers tyrants. Of the mountains Senir and Hermon, see Deut.3.v.9. Senir is to be taken here for apart of mount Hermon. Hermon is a famous mountain, of which we may read, Psal.42.7. and 89.13. It is otherwise called Sion, with an S, Deut.4.48. (From the dwellings of the Lionesses, from the mountains of the Leopards.) Some understand withal, being delivered and freed, thou shalt see the danger wherein thou wast: And on the other side, thou shalt see the blessed state and condition where into thou art brought. Or some such like thing, see 1 Cor.6.v.9,10,11.]"}],"9":[{"catchword":null,"tekst":"Thou hast taken the heart from me, [Or, thou hast taken mine heart: or, hast ravished, or wounded mine heart; to wit, by love, see Isa 62:5. The Hebrew word signifieth, Thou hast hearted, or unhearted me. The meaning is, thou hast gained my love and favour, notwithstanding thy manifold sins and infirmities] my Sister, [thus the church is called, in regard that Christ is the brother of us all, having taken our nature (that is, our flesh and blood) upon him, and by faith made us children of God, and joint-heirs with him. See Mat 12:50. Joh 1:13. Rom 8:16,17. Heb 2:11.] O spouse; thou hast taken the heart from me, [and therefore thou mayest rest satisfied and contented, being fully assured, that I will never leave nor forsaken thee] with one of thine eyes, [that is, thou gainest the heart from me, by true faith, whereby thou beholdest and imbracest me, as thy loving Bridegroom. Without faith we cannot any wise please God, Heb 11:6.] with one chain of thy neck. [to wit, hanging about thy neck; that is, with the ornament of thy works proceeding from true faith, see Pro 1:9. This chain we have not of our selves, but by the grace of God, as appeareth above, chap.1.11. God crowneth his own gifts in us.]"}],"10":[{"catchword":null,"tekst":"How fair is thy surpassing love, [That is, how delightful and acceptable is it unto me, to discern thy love towards me? See above, chap.1.vers.2. This love consisteth in the keeping of Christs commandments, 1 John 2.v.3 4,5.] my sister, O Spouse! How much better is thy surpassing love then wine? See the annotate. Above, chap.1.on v.2. and 4.] and the smell of thine oils, [understand by oils or ointments the gifts and grapes of the spirit, which the church received, see Psal.45.8. and 133.2. 1 Joh.2.20. and 27. Above, ch.1.3. The spouse commendeth the savour of the oils or ointments of the Bridegroom, see the annotate. There: so the Bridegroom here commendeth the oils or ointments of the Spouse, see Isa 62:4,5.] then all spices? [that is, sweet-smelling made, Exo 30:23. see likewise, 2 Chron.ch.9.v.1.9. and 16.14. Esth.2.12.]"}],"11":[{"catchword":null,"tekst":"Thy lips, [Wherewith thou callest upon God, preaches his Word, praisest and glorifies his Name, and edifies thy neighbor] O Spouse, drop of the honey-comb; [that is, thy words and sayings are as pleasant and acceptable unto me, as the honey-comb is unto men, see likewise this similitude, Psal.119.10.103.] honey and milk are under thy tongue, [this signifieth the same that was said immediately before, see 1 Pet.2.2.] and the smell of thy garments [that is, thy good works] is like the smell of Libanon. [Upon Mount Libanon grew many sweet-smelling trees and herbs, especially frankincense trees, from which Mount Libanon hath its name; for Lebona signifieth frankincense. In Hos 14:5,6,7. God promiseth unto Israel that his smell or savour should be like unto Libanon, by the dew of his grace, see 2 Cor.2.14,15.]"}],"12":[{"catchword":null,"tekst":"My sister, O spouse, thou art a garden inclosed, [Or a garden bolted, shut close, looked with a look. Hereby is signified, the immaculate or undefiled spiritual purity and chastity of the church, who giveth no admission or access unto strange wooers or seducers. But others understand this of Gods defence and protection, who keepeth and preserveth his church from wild beasts; that is, from, cruel tyrants. In Isa.chap.5. God compareth his church to a vine inclosed or fenced in. And Zach.2.5. he promiseth that he will be a wall of fire round about Jerusalem] a well shut up, [out of which springeth the clear and pure water of the Gospel, whereby the sad hearts and minds of believers are refreshed and comforted, Psal.23.2. according to the promise which God maketh to his church, Isa.58.v.11. And therefore this well or spring is said to be shut up, because this water of grace pertaineth only to those that are members of the church. No man cometh unto it, but by Christ] a fountain sealed. [understand hereby the assurance or confirmation of grace, which Christ affordeth unto his church, see 2 Cor.1.22. Eph.1.13. yea, unto his church onely; for a thing that is sealed, is not made common, or imparted unto others, see Isa 8:16.]"}],"13":[{"catchword":null,"tekst":"Thy shoots, [Or, thy plants, branches, sprigs] are a Paradise [or, garden of pleasure, fair orchard. It signifieth properly a place beset, or planted with trees, as appeareth by Ecc 2:5. It is likewise sometimes taken for a wood or forest, Nehem.2.8.] of pomegranates, [that is, the faithful members of the church are abundantly adorned and filled with good works, as a pomegranate is full of kernels: they are like fruitful trees planted by the fresh waters, Psal.1.3. and 92.13.] with precious fruits, [or excellent transcendent fruits. Understand hereby the good works of believers, which are pleasing and acceptable unto God, as pomegranates and other pleasant fruits are unto men] Cyprus with Spikenard. [Of Cyprus, see above, chap.1.14. Hebr. Cyprusses with Spikenards, or, much Cyprus with much spikenard. Therefore the word Spikenard is here put in the plural number, and vers.14. in the singular number, because there be divers sorts or kinds of Spikenard; or understand here the leaves of Cyprus and Spikenard, which likewise have a pleasant smell.]"}],"14":[{"catchword":null,"tekst":"Spikenard and Saffron, Calamus, [Oth. Sweet-reed] and Cynamon, [Calamus and Cynamon, as also Myrrhe, were used in the holy oil, Exo 30:23 to 34.] with all manner of trees of frankincense, [that is, of such trees as Produce frankincense] Myrrhe and Aloes, [or tree of lign-aloes, see Num 24:6. Pro.7.17. and Psal.45.9.] together with all the chief spices. [Hebr. All head-spices; that is, all kind of chief spices, see Exod.30.on v.23. Understand withal from verse 13. Are thy shoots or branches. And by these pleasant sweet-smelling herbs or spices, are signified the manifold gifts and graces of the Holy ghost, wherewith the godly are indued, see 1 Cor.chap.12.vers5,6. &c. Galat.5.v.22,23. 1 Pet.4.10.]"}],"15":[{"catchword":null,"tekst":"O fountain of gardens, well of living waters, which flow from Libanon! [With these words the Spouse commendeth her Bridegroom, who indueth her with abundance of waters, that is, with many excellent spiritual gifts or grapes, wherewith all the gardens, that is, all the churches or Congregations are watered and moistened, to bear and bring forth fruits in abundance, see Isa.ch.58.v.11. (Well of living waters;) that is, of perpetual waters, continually running, never drying up or putrifying, but always refreshing and comforting men with their pleasantness, see Gen.26.on v.19. Such kind of water Christ giveth to those that are his, John 4.v.10,14. And 7.38,39. And Isa 12:3. (which flow from Libanon.) It seemeth that here respect is had to the River of Jordan, which taketh its rise at the foot of Libanon, and runneth along through the land of promise, watering it. It is said, Rev 22:1. that there proceeded out of the Throne of God, and of the Lamb (which is Christ) a pure stream of living water.]"}],"16":[{"catchword":null,"tekst":"Awake, [Or arise, rise up] (O) North-wind, and come thou South-wind, and blow through [It is God that bringeth forth the winds out of his treasures, Psal.135.7.] my garden, [observe, that the church calleth this garden, her garden, likewise, his garden, in the words following; to wit, the garden of Christ, and that in divers respect. Christ is the owner and heir of this garden, but the pastors and Over-seers of this garden; that is, the church, wherein also every member hath spiritual fellowship and communion, 1 Cor.3.9.] that the spices thereof may flow out: [that is, the savour and smell may be spread abroad] O that my best-beloved would come into his garden, and eat his precious fruits. [that is, O that he would enjoy the fruits which by the power and working of his Spirit, we bring forth unto him, and whereby we are bound to honour him, Rom 6:22. Of precious fruits, see above, v.13. In the words of this verse is expressed a further blessing, which God bestoweth upon his garden; that is, upon his church; to wit, that the winds do blow upon it, to refresh and revive it, and to purge and cleanse the air, and so to make the garden thereby the more fruitful. Understand here by the wind, the Holy Ghost, as Joh 3:8. and Act 2:2. And although the South and North-wind be of divers qualities and operations, the one being cold, the other warm; the one moist, the other dry; yet they are both beneficial and profitable to this Garden, or to the Church of God, which hath sometimes need of sharp reproofs, and sometimes of calmes, and sweet comforts and consolations.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
