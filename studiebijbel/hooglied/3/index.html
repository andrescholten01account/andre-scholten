9":"De koning Salomo heeft zich een draagkoets gemaakt van het hout van Libanon.","10":"De pilaren daarvan maakte hij *van* zilver, haar vloer *van* goud, haar overkapping *van* purper; het binnenste ervan was bekleed met de liefde van de dochters van Jeruzalem.","11":"Ga naar buiten, en aanschouw, dochters van Sion! de koning Salomo, met de kroon, waarmee Zijn moeder Hem kroonde op de dag van Zijn bruiloft, en op de dag van de vreugde van Zijn hart."},"SV":{"1":"Ik zocht des nachts op mijn leger Hem, Dien mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; *ik* *zeide*: ...","2":"Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Dien mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet.","3":"De wachters, die in de stad omgingen, vonden mij: *ik* *zeide*: Hebt gij Dien gezien, Dien mijn ziel liefheeft?","4":"Toen ik een weinigje van hen weggegaan was, vond ik Hem, Dien mijn ziel liefheeft; ik hield Hem vast, en liet Hem niet gaan, totdat ik Hem in mijner moeders huis gebracht had, en in de binnenste kamer van degene, die mij gebaard heeft.","5":"Ik bezweer u, gij dochteren van Jeruzalem! die bij de reeën of bij de hinden des velds zijt, dat gij de liefde niet opwekt, noch wakker maakt, totdat het *haar* luste!","6":"Wie is zij, die daar opkomt uit de woestijn, als rookpilaren, berookt met mirre en wierook, *en* met allerlei poeder des kruideniers?","7":"Ziet, het bed, dat Salomo heeft, daar zijn zestig helden rondom van de helden van Israël;","8":"Die altemaal zwaarden houden, geleerd ten oorlog, elk hebbende zijn zwaard aan zijn heup, vanwege den schrik des nachts.","9":"De koning Salomo heeft zich een koets gemaakt van het hout van Libanon.","10":"De pilaren derzelve maakte hij *van* zilver, haar vloer *van* goud, haar gehemelte *van* purper; het binnenste was bespreid met de liefde van de dochteren van Jeruzalem.","11":"Gaat uit, en aanschouwt, gij, dochteren van Sion! den koning Salomo, met de kroon, waarmede Hem Zijn moeder kroonde op den dag Zijner bruiloft, en op den dag der vreugde Zijns harten."},"KJV":{"1":"By night on my bed I sought him whom my soul loveth: I sought him, but I found","2":"I will rise now, and go about the city in the streets, and in the broad ways I will seek him whom my soul loveth: I sought him, but I found","3":"The watchmen that go about the city found me: *to whom I said*, Saw ye him whom my soul loveth?","4":"*It was* but a little that I passed from them, but I found him whom my soul loveth: I held him, and would not let him go, until I had brought him into my mother's house, and into the chamber of her that conceived","5":"I charge you, O ye daughters of Jerusalem, by the roes, and by the hinds of the field, that ye stir not up, nor awake *my* love, till he please.","6":"Who *is* this that cometh out of the wilderness like pillars of smoke, perfumed with myrrh and frankincense, with all powders of the merchant?","7":"Behold his bed, which *is* Solomon's; threescore valiant men *are* about it, of the valiant of Israel.","8":"They all hold swords, *being* expert in war: every man *hath* his sword upon his thigh because of fear in the night.","9":"King Solomon made himself a chariot of the wood of Lebanon.","10":"He made the pillars thereof *of* silver, the bottom thereof *of* gold, the covering of it *of* purple, the midst thereof being paved *with* love, for the daughters of Jerusalem.","11":"Go forth, O ye daughters of Zion, and behold king Solomon with the crown wherewith his mother crowned him in the day of his espousals, and in the day of the gladness of his heart."}},"tsk":{"1":[{"kopje":"'s nachts","refs":["Ps 4:5","Ps 6:7","Ps 22:3","Ps 63:7-9","Ps 77:3-5","Jes 26:9"]},{"kopje":"Hem, Die","refs":["Hoogl 1:7","Hoogl 5:8","Joh 21:17","1 Petr 1:8"]},{"kopje":"maar","refs":["Hoogl 5:6","Job 23:8","Job 23:9","Ps 130:1","Ps 130:2","Jes 55:6","Luk 13:24"]}],"2":[{"kopje":"zal opstaan","refs":["Hoogl 5:5","Jes 64:7","Joh 1:6","Matt 26:40","Ma \" data-code=\"H7503\">go,</span> until I had <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him into my <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber</span> of her that conceived","5":"I <span class=\"wl wl-kjv\" data-code=\"H7650\">charge</span> you, O ye <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> by the <span class=\"wl wl-kjv\" data-code=\"H6643\">roes,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">and</span> by the <span class=\"wl wl-kjv\" data-code=\"H355\">hinds</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> that ye stir not <span class=\"wl wl-kjv\" data-code=\"H5782\">up,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5782\">awake</span> my <span class=\"wl wl-kjv\" data-code=\"H160\">love,</span> till he please.","6":"Who is this that <span class=\"wl wl-kjv\" data-code=\"H5927\">cometh</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> like <span class=\"wl wl-kjv\" data-code=\"H8490\">pillars</span> of <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke,</span> <span class=\"wl wl-kjv\" data-code=\"H6999\">perfumed</span> with <span class=\"wl wl-kjv\" data-code=\"H4753\">myrrh</span> and <span class=\"wl wl-kjv\" data-code=\"H3828\">frankincense,</span> with all <span class=\"wl wl-kjv\" data-code=\"H81\">powders</span> of the merchant?","7":"Behold his <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> which is <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's;</span> <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">valiant</span> men are <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> it, of the <span class=\"wl wl-kjv\" data-code=\"H1368\">valiant</span> of Israel.","8":"They all <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">swords,</span> being <span class=\"wl wl-kjv\" data-code=\"H3925\">expert</span> in <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> hath his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> because of <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> in the night.","9":"<span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> himself a <span class=\"wl wl-kjv\" data-code=\"H668\">chariot</span> of the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> of Lebanon.","10":"He <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> thereof of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> the <span class=\"wl wl-kjv\" data-code=\"H7507\">bottom</span> thereof of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> the <span class=\"wl wl-kjv\" data-code=\"H4817\">covering</span> of it of <span class=\"wl wl-kjv\" data-code=\"H713\">purple,</span> the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> thereof being <span class=\"wl wl-kjv\" data-code=\"H7528\">paved</span> with <span class=\"wl wl-kjv\" data-code=\"H160\">love,</span> for the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of Jerusalem.","11":"Go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> with the <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> wherewith his <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H5849\">crowned</span> him in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his <span class=\"wl wl-kjv\" data-code=\"H2861\">espousals,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness</span> of his heart."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"des nachts","tekst":"Hebreeuws, in de nachten. Hierdoor worden te kennen gegeven de grote aanvechtingen en bekoringen der kerk, gelijk Isa 21:12 , en Isa 26:9 ; Amo 5:18 . En tegelijk wordt hier aangewezen dat de kerk ten tijde van aanvechting en vervolging, als het schijnt dat zij verlaten is, Christus zoekt door het gebed. Zie Deu 4:29 ; Jer 50:4 ; Hos 3:5 , en Hos 5:15 ; Zep 2:3 ; Mat 7:7 ."},{"catchword":"Dien","tekst":"Te weten mijnen Bruidegom Jezus Christus, zijne genade en goedertierenheid, die van ons gevonden wordt als wij zijne genade in ons hart gevoelen tot onze vertroosting."},{"catchword":"ik vond Hem niet;","tekst":"Dit strijdt niet tegen de belofte van Christus, Mat 7:7 ; want die stelt geen juisten tijd van vinden, maar die staat alleen in Gods hand; Hij alleen weet den bekwamen tijd tot hulp, Heb 4:16 . Onder, vs.4, staat dat de Bruid, na een weinig tijds, haren liefste gevonden heeft."}],"2":[{"catchword":"in de stad","tekst":"Dat is, in de gemeente Gods, Psa 87:3 ; of in het geestelijke Jeruzalem; zie Heb 12:22 ."},{"catchword":"wijken","tekst":"Of, markten, brede plaatsen. Zie Luk 14:21-23 ."}],"3":[{"catchword":"De wachters,","tekst":"Versta hier onder den naam van wachters zodanige leraars, gelijk die waren, van wie Jesaja zegt, Isa 56:10 :Zij zijn stomme honden, zij kunnen niet bassen, of, men kan hier door de wachters verstaan de groten en wijzen dezer wereld, die, ofschoon men hun vraagt waar Christus te vinden is, zulks niet weten te zeggen. Zie Mat 2:3-4 . Vergelijk onder, Son 5:7 ."},{"catchword":"Hebt gij Dien","tekst":"De zin is: Weet gij mij mijnen vriend of Bruidegom niet te wijzen?"}],"4":[{"catchword":"een weinigje","tekst":"Te weten een weinig tijds, of plaats. Hebreeuws, een weinig dat ik van hen was voorbijgegaan, totdat ik vond, enz."},{"catchword":"vond ik Hem,","tekst":"Hier is vervuld de belofte onzes Heeren Jezus Christus, Mat 7:7 :Zoekt en gij zult vinden, enz."},{"catchword":"ik hield","tekst":"Te weten met de hand des geloofs. Zie Pro 4:13 ; Eph 3:17 ; Col 1:23 . Zie ook Gen 32:26 ."},{"catchword":"totdat","tekst":"De kerk geeft hier te kennen dat zij, de genade van Christus weder gevoelende, in zijne gemeenschap volstandiglijk wil blijven."},{"catchword":"die mij gebaard","tekst":"Of, die mij ontvangen heeft."}],"5":[{"catchword":"Ik bezweer u,","tekst":"Dit gehele vers is verklaard Son 2:7 ."}],"6":[{"catchword":"Wie is zij,","tekst":"Dit is ene verwondering der zwakgelovigen, sprekende van de kerk, als van het volk Israël, dat uit de woestijn opging naar het beloofde land, zich verwonderende over de vrijmoedigheid en heerlijkheid der kerk, nadat zij ontworsteld was uit de verdrukking en zware aanvechting, waarvan boven, Son 2 gesproken is, alsook in het begin van dit hfdst."},{"catchword":"de woestijn,","tekst":"Bij de woestijn wordt hier verstaan de verwoesting van de uiterlijke gedaante der kerk, zo door tirannie als door ketterij, scheuring en zware ergernissen; gelijk het woord woestijn ook genomen wordt Isa 32:15 ; Rev 12:6 ."},{"catchword":"als rookpilaren,","tekst":"Als een sterke rook, die recht opgaat, gelijk een pilaar, of palmboom, welke betekenis het Hebreeuwse woord ook heeft. Dit betekent de vrijmoedigheid der kerk in het oefenen van den waren godsdienst, zonder dien na te laten uit vrees der boze mensen, of andere inzichten; Heb 12:1 ."},{"catchword":"mirre","tekst":"Door mirre en wierook moet men verstaan de verdiensten van Jezus Christus, die God den Vader een welriekende reuk zijn, Eph 5:2 ; Rev 8:3-5 ."},{"catchword":"poeder","tekst":"Men kan bij dit poeder verstaan de vruchten der wedergeboorte, alsook, en inzonderheid, de gebeden en dankzeggingen der gelovigen; Mal 1:11 ."},{"catchword":"des kruideniers?","tekst":"Of, der drogisten. Anders: der apothekers, der parfumeriebereiders."}],"7":[{"catchword":"Ziet,","tekst":"Dit schijnen woorden van de Bruid te zijn."},{"catchword":"het bed,","tekst":"Anders: zijn bed is als het bed van Salomo."},{"catchword":"dat Sálomo","tekst":"Hierdoor wordt afgebeeld dat de kerk Gods van Christus bewaard wordt, maar nog veel beter en voortreffelijker dan de koning Salomo door al zijne trawanten is bewaard geworden. Want de engelen Gods, die dienstbare geesten zijn, worden van Christus uitgezonden om hen te beschutten en te beschermen. Zie Heb 1:14 . De gelovigen kinderen Gods, aldus bewaard en bewaakt zijnde, vrezen niet voor den schrik van den nacht, noch voor den pijl die des daags vliegt; Psa 91:5 . Hierbij kan men ook verstaan de herders en leraars, die de kerk Gods moeten bewaken en bewaren."},{"catchword":"van de helden","tekst":"Wat al kloeke dappere helden er in Israël geweest zijn, is te zien 1Ch 11:10-11 tot 1Ch 11:47 en 1Ch 12:1-2 , tot 1Ch 12:38 ."}],"8":[{"catchword":"Die altemaal","tekst":"Alzo zijn ook de heilige engelen gewapend met Gods rechtvaardige wraak, als met zwaarden om de goeden te beschermen en om de kwaden te straffen; 1Ch 21:16 . Alle getrouwe herders der kerk zijn gewapend met het Woord Gods en de Christelijke tucht, hebbende beide wraak tegen alle ongehoorzaamheid; 2Co 10:6 ; Psa 149:7 . Hoewel ook anderszins alle Christenen gewapend zijn met het zwaard des Geestes; Eph 6:17 ."},{"catchword":"geleerd","tekst":"Te weten van God, die de handen zijns volks leert strijden; 2Sa 22:35 ; en zijnen engelen en leraars kracht geeft om de kerk te bewaken en te bewaren. Anders: ervaren, geschikt, geoefend."},{"catchword":"hebbende","tekst":"Te weten gereed en vaardig staande om te vechten; gelijk Exo 32:27 ."},{"catchword":"vanwege","tekst":"Des nachts is men aan meer gevaren onderworpen dan des daags, hetzij van dieverij, moorderij, verraderij, of dergelijk ongemak, hetwelk meest bij nacht geschiedt; zodat men alsdan goede wacht moet houden, Mat 24:43-44 . Alzo moet elk Christelijk ridder gewapend staan, gelijk de apostel ons leert Eph 6:12-14 ; inzonderheid ten tijde van vervolging."}],"9":[{"catchword":"koets","tekst":"Het Hebreeuwse woord betekent eigenlijk ene bruidkoets of bedstede. Doch het betekent ook een koetswagen. Het schijnt dat hier gesproken wordt van dien triomfwagen, waarvan Psa 45:5 geschreven staat, waar bij den wagen verstaan wordt het woord der waarheid, of de predikatie van het heilig Evangelie. Anderen verstaan door het Hebreeuwse woord een sierlijk gebouw."},{"catchword":"het hout","tekst":"Dat is van cederhout, hetwelk op den berg Libanon overvloediglijk pleegt te wassen. Zie de aantekening Jdg 9:15 . Dit hout verrot niet. Zodat de leer van het heilige Evangelie bekwamelijk bij hetzelve mag vergeleken worden. Want het is een eeuwige Evangelie, Rev 14:6 . Zie Son 1:17 ."}],"10":[{"catchword":"De pilaren","tekst":"Door de pilaren of kolommen wordt de standvastigheid betekend, Rev 3:12 , en door de pilaren van zilver kan men hier verstaan de getrouwe herders der kerk, doch inzonderheid de profeten en apostelen. Zie Gal 2:9 ."},{"catchword":"vloer","tekst":"Of, bodem, grond, onderlaag; anders: stoel; te weten, waarop Salomo zat in zijne koets. Christus, die de grondslag of het fondament zijner kerk is, wordt terecht bij goud vergeleken, maar de pilaren bij zilver. Zie 1Co 3:11 ; Rev 21:21 ."},{"catchword":"gehemelte","tekst":"Versta bij dit gehemelte de koninklijke bescherming Gods over zijne kerk."},{"catchword":"bespreid","tekst":"Of, geplaveid, gevloerd, of bezet met lieflijkheid, of geplaveid met liefde; dat is, lieflijk gewrocht, te weten, met lieflijke beelden of schone figuren geborduurd, of kunstiglijk met de naald gewrocht van de dochteren van Jeruzalem. Anders: ontstoken. Naar de geestelijke beduiding kan men hier door de liefde verstaan die innerlijke liefde, die God zijnen kinderen toedraagt, gevende zijnen Zoon voor het leven derzelve, mitsgaders die liefde, die wij God en onzen naasten toedragen; want wij kunnen God niet liefhebben, of Hij moet ons eerst zijne liefde bewijzen; 1Jo 4:10 . Sommigen verstaan vs.9,10 als ene beschrijving van de hemelse heerlijkheid."}],"11":[{"catchword":"Gaat uit,","tekst":"In vs.11 wordt onder den naam en de heerlijkheid van Salomo, die een voorbeeld op Christus geweest is, beschreven de glorie, die alle kinderen Gods zullen aanschouwen op de bruiloft des Lams, die voor de uitverkoren kinderen Gods bereid is. Als wij vermaand worden uit te gaan, daarmede wordt te kennen gegeven dat het de moeite waard is dat men wat moeite daarom doe, gelijk men doet om een koning in zijn triomf te aanschouwen."},{"catchword":"Gij, dochteren","tekst":"De dochteren Zions betekenen hier de Christenen, of de kerk van Christus, gelijk Isa 49:14 , Isa 49:22 . Dezen worden hier vermaand dat zij Christus [den rechten Salomo] zullen aanschouwen en aannemen met zijne kroon, dat is in glorie en heerlijkheid. Zie Psa 149:2 ; Mat 21:5 ; Rev 6:1 , Rev 6:3 , Rev 6:5 , Rev 6:7 ."},{"catchword":"waarmede Hem","tekst":"Het schijnt uit deze woorden dat Bathseba haren zoon Salomo met een schone en sierlijke kroon vereerd heeft op zijn bruiloftsdag, en door deze kroon wordt afgebeeld de heerlijkheid van Christus, waartoe Hij verheven is door zijne hemelvaart en die Hij zijne kerk zal laten aanschouwen in den hemel. Zie Luk 24:26 ; Joh 17:24 ; Phi 2:9 ."},{"catchword":"Zijner bruiloft,","tekst":"Anders: zijner ondertrouw; te weten toen Salomo trouwde met zijne bruid. Geestelijkerwijze mag men hier verstaan het huwelijk van Christus met zijne kerk, hetwelk geschiedt als zij de predikatie van het heilige Evangelie met waar geloof aanneemt, alsdan wordt zij gezegd aan Christus te huwelijken; 2Co 11:2 . Gelijk zich een bruidegom over zijne bruid verheugt, alzo verheugt zich God over zijn volk; zie Isa 62:1 , Isa 62:5 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"By night on my bed I sought him, whom my soul loveth: [Heb. In the nights. Hereby is intimated the great temptations and trials of the church, as Isa 21:12. and 26.9. Amos 5.18. And likewise here is shewed, that the church in time of temptation and persecution, when she seemeth to be left and forsaken, seeketh Christ by prayer. See Deut.4.29. Jer 50:4. Hos 3:5. and 5.15. Zeph.2.3. Mat 7:7. Him, whom my soul loveth; To wit, my Bridegroom Jesus Christ, his grace, and mercy; who is found of us, when we feel and apprehend his grace and favour in our hearts to our comfort] I sought him, but I found him not, [This is no ways repugnant to the promise of Christ, Mat 7:7. For that sieth no precise punctual time of finding; for that is onely in the hand of God, he alone knoweth the fit and seasonable time of help, Heb 4:16. Below vers.4. it is said of the spouse, that after a little while, she found her beloved] (I said)"}],"2":[{"catchword":null,"tekst":"I will arise now, and go about in the city, [That is, in the church of God, Psal.87.vers.3. or in the spiritual Jerusalem, See Heb 12:22.] in the passages, [Or, markets, broad places. See Luk 14:21,22,23.] and in the streets, I will seek him whom my soul loveth: I sought him, but I found him not."}],"3":[{"catchword":null,"tekst":"The watchmen [Understand here under the name of watchmen, such kind of Teachers or Ministers, as were those, of whom the Prophet Isaiah speaketh chap.56.vers.10. They are (saith he) dumb Dogs, they cannot bark. Orby watchman may here be understood the great and wise men of the World, who if they should be asked where Christ is to be asked where Christ is to be found, are not able to tell where. See Matth.2.vers.3,4. Compare below vers.5.v.7.] that went about in the City, found me; (I said,) Saw ye him, whom my soul loveth? [The meaning is, cannot ye direct me to my friend, or Bridegroom?]"}],"4":[{"catchword":null,"tekst":"When I had passed a little from them, [To wit, a little while, or a little way] I found him without my soul loveth while, or a little way] I found him whom my soul loveth: [Heb. A little that I had passed from them, till I found him whom my soul loveth. Here is fulfilled the promise of our Saviour Christ, Mat 7:7. Seek, and thou shalt find, etc.] I held him fast, and did not let him go: [To wit, I held him fast, etc. with the hand of faith. See Pro 4:13. Eph.3.18. Colos.1.23. See also Genes.32.26.] until I had brought him into my mothers house, and into the innermost chamber of her, that bare me. [Or, that conceived me. The church here intimateth, that she having recovered and gotten again a sense and feeling of the grace and mercy of Christ, will constantly persist or persevere in fellowship and communion with him.]"}],"5":[{"catchword":null,"tekst":"I adjure you, ye Daughters of Jerusalem, which are by the roes, or by the hinds of the field, that ye stir not up that love, nor waken (it) until it please (her.) [This whole verse is expounded above chap.2.vers.7. See also below chap.8.4.]"}],"6":[{"catchword":null,"tekst":"Who is she, that cometh up out of the wilderness, like pillars of smoke, perfumed with myrrhe, and frankincense, (and) all manner of powder of the Grocer! [This is an admiration or wondering of weak believers, speaking of the church, as of the people of Israel, that went up out of the boldness or courage, and glory of the church, after she had by struggling and wrestling got away from under sore troubles and persecutions, whereof mention is made above chap.2. and also in the beginning of this Chapter. By the wilderness is here meant, the desolation or wasting of the outward form and beauty of the Church, as well by tyranny, as by heresy, schism, and great and ul shepherds and Ministers of the Church, are armed with word of God, and with Christian Discipline, having vengeance in readiness against all disobedience, 2 Corinth.ch.10.6. Psal.149.7. Albeit otherwise also, all Christians are (or at least ought to be) armed with the sword of the spirit, Eph 6:17.] taught to war, [to wit, by God, who teacheth the hands of his people to fight, 2 Sam.22.35. and given his angels and ministers power to watch over the church, and to keep and defend it. Oth. Expert, trained, exercised in war] each having his sword at his thigh, [To wit, standing ready and prepared to fight, as Exo 32:27.] because of the terror of the night. [In the night time a man is subject to more danger, then in the day time, whether it be danger of robbery, or of murder, or of treachery, or of the like mischief; which are usually practiced in the night-time, so that a man ought at that time and season, to keep a strong watch and guard Mat 24:43,44. So every Christian Soldier ought to stand ready-armed, as the Apostle reacheth us, Ephes.6.vers.12,13,14. Especially in the time of persecution.]"}],"9":[{"catchword":null,"tekst":"King Salomon made himself a chariot [The Hebrew word signifieth properly a bride-bed, or, bed-stead. But it signifieth also a coach, or, Chariot. It seemeth that here is spoken of that triumph-chariot, of which we read, Ps.45.5. where by the chariots is meant the word of truth, or the preaching of the Gospel. Others understand by the Hebrew word here used, a sumptuous or glorious building, as a palace, or the like] of the wood of Libanon. [That is, of Cedar-wood, which was wont to grow in great abundance on mount Libanon. See the annotate. Judg.9.on vers.15. This word putrifieth not: so that the Doctrine of the Gospel may be fitly compared unto it: For it is an everlasting Gospel, Revel.14.6. See above chap.1,27.]"}],"10":[{"catchword":null,"tekst":"He made the pillars therefore (of) silver, [By pillars is signified in Scripture, constancy, or perseverance, as Revel.3.12. and by pillars of silver, may here be understood, the faithful Pastors or Ministers of the Church, but especially the Prophets and Apostles. See Gal 2:9.] the pavement [Or, bottom, ground, stay. Oth. Seat; to wit, whereon Salomon fat in his charet] of gold. [Christ, who is the ground-work, or foundation of his church, is rightly compared unto gold, but the pillars unto silver. See 1 Cor.3.9. Revel.21.21.] the roof (or top) of it (of) purple: [Understand by this roof, Gods royal defence or protection of his church] the inmost (part thereof) as be spread with the love of the Daughters of Jerusalem. [Or, paved, floored, beset with pleasantness, or, paved with love; that is, pleasantly wrought; to wit, embroidered with pleasant images, or fair pictures, or curiously wrought with the needle by the Daughters of Jerusalem. Oth. Kindled. According to the spiritual application, here by love may be understood, that inward or intimate love that God beareth unto his children, giving his sons for the life of them, as likewise that love, which we bear unto God, and to our neighbor: for we cannot love God, unless he do first manifest his love unto us, 1Jn 4:10. Some understand the 9th.& 10.verses to be a description of the heavenly glory]"}],"11":[{"catchword":null,"tekst":"Go forth, ye Daughters of Zion, and behold King Salomon with the Crown, wherewith his mother crowned him in the day of his marriage, and in the day of the gladness of his heart. [The Daughters of Zion signify here Christians, or the Church of Christ, as Isa 49:14,22. These are here exhorted to behold and receive Christ (the true Salomon) with his Crown; that is, in glory, and honour. See Psal.149.2. Mat 21:5. Revel.6.1,3,5,7. (wherewith his mother crowned him, &c.) It seemeth by those words that Bathseba honoured her son with a very fair and beautiful crown upon his wedding-day: and by this Crown is typified and represented the glory and dignity, whereunto Christ was advanced by his ascension, and which he shall cause his church to behold in Heaven. See Luk 24:26. Joh 17:24. Php 2:9. (In the day of his marriage) Oth. In the day of his espousals: to wit, when Salomon married with his spouse. In a spiritual sense may here be understood Christs marriage with his Church, with is done when she receiveth and embraceth the preaching of the Gospel with a true and lively faith, then, or that time, she is said to be espoused or married to Christ, 2 Cor.11.2. (In the day of the joy, or, gladness of his heart.) As a Bridegroom rejoyeth in his Bride, so doth God rejoice in his people. See Isai.62.1,5. In this verse under the name and glory of Salomon, that was a Type of Christ; there is described the glory, which all the children of God are to behold at the wedding of the Lamb, prepared for all the children of God. When we are exhorted to go forth; thereby is made known, that it is well worth the pain to be at some labour for it, as we see people do, to come forth and behold a King riding in triumph.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
