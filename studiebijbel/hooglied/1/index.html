ingen van de herders.","9":"Mijn vriendin! Ik vergelijk u bij de paarden aan de wagens van Farao.","10":"Uw wangen zijn liefelijk in de spangen, uw hals in de parelsnoeren.","11":"Wij zullen u gouden spangen maken, met zilveren stipjes.","12":"Terwijl de koning aan zijn ronde tafel is, geeft mijn nardus zijn geur.","13":"Mijn Liefste is mij een bundeltje mirre, dat tussen mijn borsten vernacht.","14":"Mijn Liefste is mij een tros van cyprus, in de wijngaarden van En-Gedi.","15":"Zie, u bent mooi, mijn vriendin! Zie, u bent mooi; uw ogen zijn duivenogen.","16":"Zie, U bent mooi, mijn Liefste, ja, liefelijk; ook groent onze rustplaats.","17":"De balken van onze huizen zijn ceders, onze galerijen zijn cipressen."},"SV":{"1":"Het Hooglied, hetwelk van Salomo is.","2":"Hij kusse mij met de kussen Zijns monds; want Uw uitnemende liefde is beter dan wijn.","3":"Uw oliën zijn goed tot reuk, Uw naam is een olie, die uitgestort wordt; daarom hebben U de maagden lief.","4":"Trek mij, wij zullen U nalopen! De Koning heeft mij gebracht in Zijn binnenkameren; wij zullen ons verheugen en in U verblijden; wij zullen Uw uitnemende liefde vermelden, meer dan den wijn; de oprechten hebben U lief.","5":"Ik ben zwart, doch liefelijk (gij dochteren van Jeruzalem!), gelijk de tenten van Kedar, gelijk de gordijnen van Salomo.","6":"Ziet mij niet aan, dat ik zwartachtig ben, omdat mij de zon heeft beschenen; de kinderen mijner moeder waren tegen mij ontstoken, zij hebben mij gezet tot een hoederin der wijngaarden. Mijn wijngaard, dien ik heb, heb ik niet gehoed.","7":"Zeg mij aan, *Gij*, Dien mijn ziel liefheeft, waar Gij weidt, waar Gij *de* *kudde* legert in den middag; want waarom zou ik zijn als een, die zich bedekt bij de kudden Uwer metgezellen?","8":"Indien gij het niet weet, o gij schoonste onder de vrouwen! zo ga uit op de voetstappen der schapen, en weid uw geiten bij de woningen der herderen.","9":"Mijn vriendin! Ik vergelijk u bij de paarden aan de wagens van Farao.","10":"Uw wangen zijn liefelijk in de spangen, uw hals in de parelsnoeren.","11":"Wij zullen u gouden spangen maken, met zilveren stipjes.","12":"Terwijl de Koning aan Zijn ronde tafel is, geeft mijn nardus zijn reuk.","13":"Mijn Liefste is mij een bundeltje mirre, *dat* tussen mijn borsten vernacht.","14":"Mijn Liefste is mij een tros van Cyprus, in de wijngaarden van En-gedi.","15":"Zie, gij zijt schoon, Mijn vriendin! Zie, gij zijt schoon; uw ogen zijn duiven *ogen*.","16":"Zie, gij zijt schoon, mijn Liefste, ja, liefelijk; ook groent onze bedstede.","17":"De balken onzer huizen zijn cederen, onze galerijen zijn cipressen."},"KJV":{"1":"The song of songs, which *is* Solomon's.","2":"Let him kiss me with the kisses of his mouth: for thy love *is* better than wine.","3":"Because of the savour of thy good ointments thy name *is as* ointment poured forth, therefore do the virgins love","4":"Draw me, we will run after thee: the king hath brought me into his chambers: we will be glad and rejoice in thee, we will remember thy love more than wine: the upright love","5":"I *am* black, but comely, O ye daughters of Jerusalem, as the tents of Kedar, as the curtains of Solomon.","6":"Look not upon me, because I *am* black, because the sun hath looked upon me: my mother's children were angry with me; they made me the keeper of the vineyards; *but* mine own vineyard have I not kept.","7":"Tell me, O thou whom my soul loveth, where thou feedest, where thou makest *thy flock* to rest at noon: for why should I be as one that turneth aside by the flocks of thy companions?","8":"If thou know not, O thou fairest among women, go thy way forth by the footsteps of the flock, and feed thy kids beside the shepherds' tents.","9":"I have compared thee, O my love, to a company of horses in Pharaoh's chariots.","10":"Thy cheeks are comely with rows *of jewels*, thy neck with chains","11":"We will make thee borders of gold with studs of silver.","12":"While the king *sitteth* at his table, my spikenard sendeth forth the smell","13":"A bundle of myrrh *is* my wellbeloved unto me; he shall lie all night betwixt my breasts.","14":"My beloved *is* unto me *as* a cluster of camphire in the vineyards of Engedi.","15":"Behold, thou *art* fair, my love; behold, thou *art* fair; thou *hast* doves' eyes.","16":"Behold, thou *art* fair, my beloved, yea, pleasant: also our bed *is* green.","17":"The beams of our house *are* cedar, *and* our rafters of fir."}},"tsk":{"1":[{"kopje":"Hooglied","refs":["Ps 14:1","Jes 5:1"]},{"kopje":"van Salomo","refs":["1 Kon 4:32"]}],"2":[{"kopje":"mij","refs":["Hoogl 5:16","Hoogl 8:1","Gen 27:26","Gen 27:27","Gen 29:11","Gen 45:15","Ps 2:12","Luk 15:20","Hand 21:7","1 Petr 5:14"]},{"kopje":"uw uitnemende liefde","refs":["Hoogl 1:4","Hoogl 2:4","Hoogl 4:10","Hoogl 7:6","Hoogl 7:9","Hoogl 7:12","Hoogl 8:2","Ps 36:8","Ps 63:4-6","Jes 25:6","Jes 55:1","Jes 55:2","Matt 26:26"]}],"3":[{"kopje":"van geur","refs":["Hoogl 3:6","Hoogl 4:10","Hoogl 5:5","Hoogl 5:13","Ex 30:23-28","Ps 45:8","Ps 45:9","Ps 133:2","Spr 27:9","Pred 7:1","Jes 61:3","Joh 12:3","2 Kor 2:14-16","Fil 4:18"]},{"kopje":"uw naam","refs":["Ex 33:12","Ex 33:19","Ex 34:5-7","Ps 89:16","Ps 89:17","Jes 9:5","Jes 9:6","Jer 23:5","Jer 23:6","Matt 1:21-23","Fil 2:9","Fil 2:10"]},{"kopje":"de maagden","refs":["Hoogl 6:8","Ps 45:15","Matt 25:1","2 Kor 11:2","Openb 14:4"]}],"4":[{"kopje":"Trek","refs":["Jer 31:3","Hos 11:4","Joh 6:44","Joh 12:32","Fil 2:12","Fil 2:13"]},{"kopje":"wij zullen","refs":["Ps 119:32","Ps 119:60","Hebr 12:1"]},{"kopje":"de koning","refs":["Hoogl 2:3-5","Hoogl 3:4","Ps 45:15","Ps 45:16","Matt 25:10","Joh 14:2","Joh 14:3","Ef 2:6"]},{"kopje":"wij zullen ons","refs":["Ps 98:4-9","Ps 149:2","Jes 25:8","Jes 45:25","Jes 61:3","Zef 3:14","Zach 9:9","Luk 2:10","Fil 3:3","Fil 4:4","1 Petr 1:8"]},{"kopje":"vermelden","refs":["Hoogl 1:2","Ps 42:5","Ps 48:10","Ps 63:6","Ps 103:1","Ps 103:2","Ps 111:4","Jes 63:7","Luk 22:19","1 Kor 11:23-26"]},{"kopje":"de oprechten hebben u lief", code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> were <span class=\"wl wl-kjv\" data-code=\"H2787\">angry</span> with me; they <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> me the <span class=\"wl wl-kjv\" data-code=\"H5201\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards;</span> but mine own <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> have I not kept.","7":"<span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, O thou whom my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loveth,</span> where thou <span class=\"wl wl-kjv\" data-code=\"H7462\">feedest,</span> <span class=\"wl wl-kjv\" data-code=\"H349\">where</span> thou makest thy flock to <span class=\"wl wl-kjv\" data-code=\"H7257\">rest</span> at <span class=\"wl wl-kjv\" data-code=\"H6672\">noon:</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">for</span> why should I be as one that turneth <span class=\"wl wl-kjv\" data-code=\"H5844\">aside</span> by the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> of thy companions?","8":"If thou <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not, O thou <span class=\"wl wl-kjv\" data-code=\"H3303\">fairest</span> among <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> go thy way <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> by the <span class=\"wl wl-kjv\" data-code=\"H6119\">footsteps</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> and <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> thy <span class=\"wl wl-kjv\" data-code=\"H1429\">kids</span> beside the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds'</span> tents.","9":"I have <span class=\"wl wl-kjv\" data-code=\"H1819\">compared</span> thee, O my <span class=\"wl wl-kjv\" data-code=\"H7474\">love,</span> to a company of <span class=\"wl wl-kjv\" data-code=\"H5484\">horses</span> in <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> chariots.","10":"Thy <span class=\"wl wl-kjv\" data-code=\"H3895\">cheeks</span> are <span class=\"wl wl-kjv\" data-code=\"H4998\">comely</span> with <span class=\"wl wl-kjv\" data-code=\"H8447\">rows</span> of jewels, thy <span class=\"wl wl-kjv\" data-code=\"H6677\">neck</span> with chains","11":"We will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H8447\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> with <span class=\"wl wl-kjv\" data-code=\"H5351\">studs</span> of silver.","12":"While the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> sitteth at his <span class=\"wl wl-kjv\" data-code=\"H4524\">table,</span> my <span class=\"wl wl-kjv\" data-code=\"H5373\">spikenard</span> sendeth <span class=\"wl wl-kjv\" data-code=\"H5414\">forth</span> the smell","13":"A <span class=\"wl wl-kjv\" data-code=\"H6872\">bundle</span> of <span class=\"wl wl-kjv\" data-code=\"H4753\">myrrh</span> is my <span class=\"wl wl-kjv\" data-code=\"H1730\">wellbeloved</span> unto me; he shall <span class=\"wl wl-kjv\" data-code=\"H3885\">lie</span> all night betwixt my breasts.","14":"My <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved</span> is unto me as a <span class=\"wl wl-kjv\" data-code=\"H811\">cluster</span> of <span class=\"wl wl-kjv\" data-code=\"H3724\">camphire</span> in the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards</span> of Engedi.","15":"Behold, thou art <span class=\"wl wl-kjv\" data-code=\"H3303\">fair,</span> my <span class=\"wl wl-kjv\" data-code=\"H7474\">love;</span> behold, thou art <span class=\"wl wl-kjv\" data-code=\"H3303\">fair;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H3123\">doves'</span> eyes.","16":"Behold, thou art <span class=\"wl wl-kjv\" data-code=\"H3303\">fair,</span> my <span class=\"wl wl-kjv\" data-code=\"H1730\">beloved,</span> yea, <span class=\"wl wl-kjv\" data-code=\"H5273\">pleasant:</span> also our <span class=\"wl wl-kjv\" data-code=\"H6210\">bed</span> is green.","17":"The <span class=\"wl wl-kjv\" data-code=\"H6982\">beams</span> of our <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> are <span class=\"wl wl-kjv\" data-code=\"H730\">cedar,</span> and our <span class=\"wl wl-kjv\" data-code=\"H7351\">rafters</span> of fir."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Hooglied,","tekst":"Hebreeuws, het Lied der liederen; dat is, een zeer schoon en bovemate treffelijk lied. Zie de aantekening Gen 9:25 ."},{"catchword":"hetwelk","tekst":"Anders, hetwelk Salomo aangaat. Verstaande door Salomo Jezus Christus, wiens voorbeeld Salomo geweest is in koninklijke hoogheid en glorie, alsook in wijsheid en in het onderwijzen des volks."}],"2":[{"catchword":"Hij","tekst":"Te weten mijn Bruidegom Jezus Christus; het zijn de woorden der Bruid, dat is der gemeente van Jezus Christus."},{"catchword":"kusse mij","tekst":"Dat is, Hij bewijze mij zijne liefde. Anders: och dat mijn Bruidegom mij kuste! Elkander te kussen is ten allen tijde gehouden voor een teken van liefde, vriendschap en beleefdheid; tot een teken waarvan de mannen ook elkander plachten te kussen, Exo 4:27 , en Exo 18:7 ; Rom 16:16 , en 1Th 5:26 . Christus kust zijne Bruid, dat is zijne gemeente of uitverkorenen, als Hij haar die grote liefde bewijst en laat gevoelen, die Hij haar is toedragende. Wij kussen Christus als wij met een oprecht geloof, hartelijke liefde en kinderlijke vreze en eerbieding Hem erkennen te zijn onze Heere en Zaligmaker, en wij ons aan Hem ten enenmale onderwerpen en Hem gehoorzamen. Psa 2:12 ."},{"catchword":"met de kussen","tekst":"In het getal van velen, waarmede uitgedrukt wordt de rijkdom der menigvuldige genaden en weldaden, die Christus zijnen uitverkorenen is bewijzende; Eph 1:7-9 , enz."},{"catchword":"Zijns monds;","tekst":"Onzen Heere Jezus Christus openbaart den gelovigen de liefde, die Hij hun toedraagt, door zijn woord. Daarom staat er Psa 45:3 , dat zijne lippen zeer lieflijk [of genaderijk] zijn. Zie Son 5:13 , Son 5:16 ; en Isa 50:4 . Petrus spreekt ook: Heere Gij hebt de woorden des eeuwigen levens."},{"catchword":"uitnemende","tekst":"Dat is, vriendelijkheid, minnelijkheid. Hebreeuws, liefden. Hier spreekt nu de Bruid, dat is de gemeente Gods, Christus haren Bruidegom aan. Versta hier door het woord liefden de uitnemende liefde en genegenheid, mitsgaders de weldaden en genaden, die Christus zijnen uitverkorenen bewijst."},{"catchword":"wijn","tekst":"Door het woord wijn moet men hier verstaan alle aardse verheugingen en geneugten. Vergelijk Jdg 9:13 ; Psa 104:15 ."}],"3":[{"catchword":"oliën","tekst":"Versta, welriekende oliën, kostelijke zalven, of balsemen. Hierbij worden de geestelijke gaven dikwijls vergeleken, gelijk Psa 45:8 ; Isa 61:1 , en 1Jo 2:27 ."},{"catchword":"Uw naam","tekst":"Versta, den naam, persoon en het zaligmakende ambt van Christus, alzo ons dezelve in het Evangelie zijn geopenbaard."},{"catchword":"een olie,","tekst":"Salomo schijnt hier gezien te hebben op den naam Messias; dat is Christus, Gezalfde, die met den Heiligen Geest gezalfd is, niet alleen voor zichzelven, maar die heilige balsem is gevloeid van Hem, die ons Hoofd is, op ons zijne ledematen. Zie Psa 133:2 , en Joh 1:16 . Deze naam is na de hemelvaart van Christus wijd uitgebreid, want van Christus hebben alle Christenen hunnen naam."},{"catchword":"daarom","tekst":"Dat is, [gelijk er staat vs.4] de oprechten hebben u liEf. Meermalen worden in de Heiligen Schrift de uitverkorenen vergeleken bij maagden, gelijk Mat 25:1 ; 2Co 11:2 ; Rev 14:1 , Rev 14:4-5 ; en dat daarom, omdat de kinderen Gods zo nauw moeten letten op hunne conscientie, dat zij van de zonde en de wereld niet besmet worden, als een eerlijke maagd op haar eer en kuisheid moet passen."}],"4":[{"catchword":"Trek mij,","tekst":"Dat is, neig mijn hart en gemoed, dat het U aanhange met geloof en liefde, want dit trekken geschiedt niet met uiterlijke kracht en geweld, maar door het woord der predikatie uiterlijk en inwendiglijk door de krachtige werking des Geestes van Christus, waardoor der kinderen Gods verstand alzo verlicht en onze wil alzo gebeterd wordt, dat wij gewilliglijk en met vreugde onzen Heere en Bruidegom Jezus Christus navolgen, ja nalopen. Zie Isa 40:31 ; Jer 31:3 ; Joh 6:44-45 , en Joh 12:32 ; Phi 2:13 ; Heb 12:1-2 ."},{"catchword":"Koning","tekst":"Versta hier door den koning Christus, den Koning der gerechtigheid en des vredes, Heb 7:2 , van wien Melchizedek en Salomo voorbeelden geweest zijn."},{"catchword":"in Zijn","tekst":"Door deze binnenkameren worden verstaan de verborgenheden van het rijk van Christus, die in het Oude Testament bedekt waren onder de schaduwen van de ceremoniën der wet; maar nu in het Nieuwe Testament zien wij de klaarheid des Heeren als in een spiegel, 2Co 3:18 . Zie ook Rom 16:25 ; 1Co 2:9-10 , 1Co 2:16 , en 2Co 1:20 ; Heb 8:10-11 . Of versta door de binnenkameren het koninkrijk der hemelen, in hetwelk vele woningen zijn, Joh 14:2 , die wij alreeds door het geloof bezitten; Eph 2:6 ."},{"catchword":"wij zullen ons verheugen","tekst":"Te weten ik en mijne maagden, of speelgenoten, dat is, alle gelovigen. Zij wil zeggen: Hoe meer wij toenemen in uwe kennis en den smaak van uwe genade, hoemeer wij in de geestelijke vreugde zullen gesterkt worden."},{"catchword":"in U verblijden;","tekst":"O Koning en in U; dat is van uwentwege."},{"catchword":"wij zullen Uw","tekst":"Dat is, wij zullen de genade van Christus roemen en verkondigen, die ons uit de duisternis tot zijn wonderlijk licht geroepen heeft; 1Pe 2:9 . Zie ook Psa 45:18 , en Psa 71:16 ; Isa 12:3-4 , en Isa 63:7 ."},{"catchword":"meer dan den wijn;","tekst":"Zij wil zeggen: Heere, wij zullen uwe genade met meerdere vreugde roemen en prijzen, dan de wereldse mensen zich verheugen in aardse dingen. Want de vrede Gods gaat alle verstand teboven. Zie Psa 4:8 ."},{"catchword":"de oprechten","tekst":"Hebreeuws, de rechtheden, of richtigheden; dat is, degenen die met oprechtheid begaafd zijn, die vs.3"}],"5":[{"catchword":"Ik ben zwart,","tekst":"Versta hier bij de zwartheid de uiterlijke mismaaktheid van den staat der kerk, die veroorzaakt wordt door de tirannen en vervolgingen; idem, vanwege de ketterijen, scheuringen en ergernissen, die haar overkomen. Zie Psa 119:83 ; Lam 4:8 , en Lam 5:10 ."},{"catchword":"liefelijk","tekst":"De gemeente van Christus is lieflijk, overmits zij gezuiverd is door het bloed en den geest van Christus, 1Co 6:11 ; alzo dat zij te dien aanzien blinkt en schoon is als de duiven, Psa 68:14 . Zie ook Psa 45:14-15 , enz."},{"catchword":"gij dochteren","tekst":"Dat is, gij gelovige kinderen Gods. Jeruzalem, die daarboven is, is onze aller moeder, Gal 4:26 . Alzo worden ook de gewone kerken en Christenen hier dochters van Jeruzalem genoemd en maagden, 2Co 11:2 ; Rev 14:4 . En Psa 45:13-14 , wordt de kerk genoemd de dochter van den Koning. Dusdanigen worden hier getroost en gesterkt tegen de ergernissen des kruises en de zwakheden, die het kruis in deze wereld vergezelschappen."},{"catchword":"gelijk de tenten","tekst":"Versta hier bij de tenten Kedars de nakomelingen van Kedar, den tweeden zoon van Ismaël, Gen 25:13 , die in tenten woonden, geen vaste woonplaats hebbende, maar zij zwermden om door Arabië van de ene plaats tot de andere. Zie de aantekening Psa 120:5-6 . De kinderen Gods zijn ook naar de wereld en den uiterlijken schijn niet schoon of sierlijk, zij hebben hier ook geen blijvende plaats, maar zij verwachten het hemelse Jeruzalem."},{"catchword":"gelijk de gordijnen","tekst":"Alsof zij zeide: Ik ben wel als de tenten Kedars, maar ook zo schoon als de gordijnen van Salomo; [van welker schoonheid, zie Josefus in Antiq,lib.8,cap.2 ]; want de kinderen Gods zijn inwendig versierd met de gaven van den Heiligen Geest, gelijk zijn godzaligheid, liefde Gods en des naasten. Anders: gelijk de paviljoenen van Salomo, die van buiten [vanwege den regen, wind en der zonne brand] niet zeer schoon waren, maar van binnen waren zij treffelijk en schoon."}],"6":[{"catchword":"Ziet mij","tekst":"De zin is: Ziet niet op mijne uiterlijke slechtigheid of mismaaktheid, en veracht mij daarom niet, maar ziet mijn inwendige schoonheid aan."},{"catchword":"de zon","tekst":"Hebreeuws, de zon heeft mij aangezien. Versta hier bij de zon [die degenen, die zij beschijnt, zwart maakt] de vervolgingen en verdrukkingen, gelijk Mat 13:6 , Mat 13:21 ."},{"catchword":"de kinderen","tekst":"Hier wordt gesproken van valse broeders, gelijk Psa 69:9 ; Isa 48:1-2 ; Act 20:30 , die wel roemen dat de kerk hunne moeder is, maar tevergeefs, dewijl zij God niet tot Vader hebben. Zie Deu 32:5 ; Joh 8:44 ."},{"catchword":"ontstoken","tekst":"Te weten met toorn, dat is, zij hebben mij verdriet en kwelling aangedaan. De vijandschap en vervolging der valse broeders wordt 2Co 11:26 gesteld onder de zwaarste gevaren en kruisen, die de Christenen overkomen. Zie Gal 2:4 ."},{"catchword":"der wijngaarden","tekst":"Bij wijngaarden worden in de Heilige Schrift dikwijls verstaan verzamelingen der mensen, zo der goeden als der kwaden. Van de eersten, zie een voorbeeld Psa 80 ; Isa 5:1 , Isa 5:7 ; Mat. 20. Van de verzamelingen der kwaden, zie Deu 32:32 ; Rev 14:18 . Hier verstaan sommigen door de wijngaarden de vervalste kerken in het algemeen en de geveinsde ledematen in het bijzonder, tot welke haar moeders zonen of kinderen haar zochten te brengen, willende dat zij acht zou geven op de instellingen en geboden der mensen. Zie Mar 7:13 ; Act 15:1 , Act 15:10 ; Gal 6:12-13 ; Col 2:20-23 . Immers klaagt hier de kerk dat zij van de valse broeders dikwijls zover overmeesterd wordt, dat hare regeerders en opzieners de bokken meer verstaan, dan de rechte schapen, de ketters en scheurmakers meer dan de rechtzinnigen. Waaruit dan niets dan groot onheil en verstoring der kerk ontstaan kan."},{"catchword":"Mijn wijngaard,","tekst":"Dat is, ik heb dien niet in acht genomen naar behoren, verhinderd en teruggehouden zijnde òf door mijn eigen zwakheid, òf door tirannie en vervolging. Anderen nemen die woorden aldus, alsof de Bruid [of leraars der eerste kerk] dit wilde zeggen: Ik werd gesteld om opzicht te hebben over andere kerken. Ik heb de eerste kerk, die ik geplant had, verlaten en andere kerken zijn van mij gezaaid geworden door de ganse wereld. De eerste kerk, die te Jeruzalem geplant werd, mocht ik daar niet behouden noch er bij blijven, vanwege de vervolging der Joden en andere tirannen."}],"7":[{"catchword":"Zeg mij aan,","tekst":"Of, geef mij te kennen. Hier spreekt wederom de Bruid haar Bruidegom aan, en zij verzoekt van hem den geest des onderscheids, om door de valse leraars niet bedrogen te worden. Want er zullen valse profeten komen, die zeggen zullen: Hier is Christus, daar is Christus; Mar 13:21 . En somtijds verbergt God zijn aangezicht, Deu 32:20 , en zegt: Ik zal u niet weiden; Zec 11:9 ."},{"catchword":"waar Gij weidt,","tekst":"Christus is de opperste Herder der schapen, Psa 23:1 , die beloofd is; Eze 34:23-24 . De profeten, apostelen en alle oprechte leraars zijn zijne gezanten of boden, die Hij uitzendt om in zijnen naam zijne schapen te weiden in de weiden des levens; Joh 21:15-17 . Hier vraagt de kerk zeer ernstiglijk, waar zij rust en weide vinden zal op den middag, dat is in het heetste van de vervolging, der ketterijen en scheuringen, als de schapen door de hitte des kruises schijnen te versmachten. Vergelijk Isa 49:10 ; Joh 16:33 ."},{"catchword":"waarom","tekst":"Dat is, waarom zoudt Gij toelaten dat ik zou zijn als ene vrouw, die vanwege droefenis bedekt is, omdat ik U niet zou vinden, herwaarts en derwaarts gaande in treurigheid? Het bedekken des aangezichts is een teken òf van droefenis, òf van schaamte. Zo wenst dan hier de Bruid te weten waar de Bruidegom zijne schapen weidt, om zich straks bij dezelve, of bij hem te vervoegen, opdat zij herwaarts en derwaarts gaande, niet zou veracht worden of verdwalen. Anders: als ene, die ter zijde afwijkt tot de kudde uwer gezellen? Alsof zij zeide: Indien ik zulks deed, [bij gebreke van uwe tegenwoordigheid], ik zou kunnen bedrogen worden, overmits er velen zijn, die den naam van uwe metgezellen, dienaars of vrienden voeren; [ Mat 24:5 , Mat 24:24 , en 2Pe 2:1-2 ;] daar zij inderdaad uwe vijanden en afleiders van Christus zijn; 2Co 11:3 . Dit is den Galaten wedervaren, Gal 1:6-7 . Allen, die hun verblijf niet hebben in het erfdeel des Heeren, staan in gevaar van tot anderer goden dienst te vervallen. Zie 1Sa 26:19 ."}],"8":[{"catchword":"Indien gij","tekst":"Anders: dewijl gij dat niet weet; te weten, waar Ik mijne schapen weid. Dat is een antwoord van Jezus Christus op de voorgaande vraag zijner Bruid, vs.7; bestraffendd vriendelijk hare onwetendheid in deze nodige en gewichtige zaak. Anders: indien gij het u, of voor uzelve niet weet; alsof Hij zeide: Dewijl gij van uzelve onwetend zijt, zo zal Ik u onderwijzen."},{"catchword":"schoonste","tekst":"Hebreeuws, gij schone onder de vrouwen; dat is, gij, die de schoonste zijt. Aldus spreekt de engel tot de heilige jonkvrouw Maria: Gij zijt gezegend onder de vrouwen; dat is, de allergezegendste, of meer gezegend dan andere vrouwen; Luk 1:28 , Luk 1:42 . Alzo wordt de leeuw gezegd sterk te zijn onder de beesten; dat is, de sterkste; Pro 30:30 . Zie de aantekening aldaar. De kerk Gods wordt de schoonste genoemd omdat zij door Jezus Christus' bloed en Geest gewassenen en gezuiverd is van al hare zonden, Eph 5:26-27 , en begaafd met allerlei schone geestelijke deugden, alhoewel in zichzelve van nature lelijk en verachtzaam zijnde, Eze 16:3-4 ; zie boven, vs.5, en vs.15,16."},{"catchword":"zo ga uit","tekst":"Alsof hij zeide: Let op de voorbeelden der heilige patriarchen en anderen mijner uiverkorenen, die in de Heilige Schriftuur met voortreffelijke getuigenissen versierd zijn; Hebr. 11. Volg hun geloof en hunne werken na. Volg die na, die van den beginne aan der wereld mij gekend en gevolgd hebben, aanmerkende de uitkomst hunner wandeling; Heb 11:1-2 , enz., en Heb 12:2 , en Heb 13:7 . Zie ook Jer 6:16 , en 1Co 11:1 ."},{"catchword":"schapen,","tekst":"Versta hier door de schapen en de geiten de Christenen die zich tot Gods kerk begeven, Joh 21:15-16 , en 1Pe 2:25 . Deze wil de Bruidegom dat de Bruid, dat is de kerk, zal aannemen en bezorgen, dat zij met de geestelijke spijs gevoed worden."},{"catchword":"bij de woningen","tekst":"Dat is breng uwe kudden in de weide en kooi, die de profeten en apostelen gevolgd en aangewezen hebben, en die zij in hunne schriften der gemeente nagelaten hebben. Zie Psa 77:21 , en Psa 78:70-72 , en 2Pe 1:19 , en 2Pe 3:2 ."}],"9":[{"catchword":"bij de paarden","tekst":"Er wordt op verscheidene plaatsen der Heilige Schrift gesproken van de schone paarden en de macht der wagens van Egypte, Exo 14:17 ; 2Ch 9:28 ; Isa 31:1 ; Eze 17:15 . Bij deze wordt de kerk van Christus vergeleken, zo ten aanzien van hare schoonheid als vanwege haar kracht en vermogen, die zij van Christus ontvangen heeft om hare vijanden te overwinnen; 2Co 10:4 . Onder deze ruiterij blinken bij name de profeten en de apostelen; waarom ook Elia genoemd wordt de wagen Israëls en zijne ruiters, 2Ki 2:12 , gelijk ook Elisa 2Ki 13:14 ; dewijl zij door hunne gebeden meer konden uitrichten dan een grote macht van wagens en ruiters. Zie Rev 19:14-15 ."}],"10":[{"catchword":"de spangen,","tekst":"Het Hebreeuwse woord, hetwelk hier en vs.11 gevonden wordt, betekent eigenlijk tortelduiven, gelijk Lev 12 , en elders. Doch hier beduidt het enig sieraad der vrouwen, gelijk zijnde de tortelduiven, die aan den hals versierd zijn met een halsbandje. Dus schoon zijn de wangen of kaken der Bruid van Christus, dewijl Hij dezelve met zijn bloed heeft gewassen en versierd met kostelijke parelen van geestelijke gaven, inzonderheid met ootmoedigheid en zachtmoedigheid, die kostelijk zijn voor God; 1Pe 3:4 ."},{"catchword":"in de parelsnoeren","tekst":"De Christelijke deugden worden zeer bekwamelijk vergeleken bij parelsnoeren, overmits alle vruchten der wedergeboorte als met een snoer aan elkander geregen zijn; Pro 1:9 , en Pro 20:15 ."}],"11":[{"catchword":"Wij zullen","tekst":"Dit wordt gesproken in den naam van de heilige Drieënigheid, want die de geboden van Christus houden, die worden bemind van den Vader en den Zoon; Joh 14:21 , Joh 14:23 . En de Heilige Geest zal ook in eeuwigheid bij hen blijven; Joh 14:16 ."},{"catchword":"zilveren","tekst":"Of, doppen, of pukkels, of knoopjes. Versta hierdoor allerlei Christelijke deugden, van welke vele genoemd staan Gal 5:22-23 , en Col 3:12 ."}],"12":[{"catchword":"Terwijl","tekst":"Of, zolang als, enz. Hier spreekt de Bruid wederom tot hare maagden, prijzende haren Bruidegom bij dezelve."},{"catchword":"de Koning","tekst":"Bij den Koning wordt Christus de Koning aller koningen verstaan, gelijk boven, vs.4."},{"catchword":"ronde tafel is,","tekst":"Zie 1Sa 16:11 . Bij de tafel wordt verstaan de hemelse heerlijkheid, waar Christus door zijn lijden is ingegaan; zie Mat 8:11 , en Mat 26:29 ; Luk 24:26 ; Rev 3:20 . Hier wil de Bruid zeggen: Terwijl Christus Jezus is in de hemelse glorie, omringd van degenen, die met Hem rondom in zijn rijk aan zijne tafel zitten; zo geeft mijn nardus, enz."},{"catchword":"geeft","tekst":"Dat is de Heilige Geest, dien Hij mij van den Vader zendt, troost mij in alle benauwdheid. Anderen nemen die woorden in dezen zin, alsof de Bruid zeide: Zo benaarstig ik mij om goede werken te doen, die den koning aangenaam mogen zijn; ik leg de gaven, die ik van hem ontvangen heb, wel aan, ik verberg ze niet, maar laat ze haren reuk geven; dat is, goede en Gode aangename werken voortbrengen, die den koning aangenaam zijn."},{"catchword":"nardus","tekst":"Nardus is een zeer kostelijk kruid, met welks olie men de prinsen en voortreffelijke personen placht te overstorten, als zij aan tafel zaten. Zie Mar 14:3 , Mar 14:8 ; Joh 12:3 , Joh 12:7 . Hierbij wordt de Heilige Geest vergeleken, vanwege zijn welriekende gaven, welke na Christus' hemelvaart veel overvloediger zijn uitgestort dan daar tevoren; Joh 7:39 ."}],"13":[{"catchword":"Mijn Liefste","tekst":"Dat is de gedachtenis van Christus' liefde, die Hij met zijn bitter lijden aan mij is bewijzende, is mij als een lieflijk tuiltje of ruikertje van mirre, om mijn hart te verkwikken. Mirre is een zeer goede en lieflijke specerij, drogerij of gom, welke eertijds gebruikt werd om de klederen der prinsen te parfumeren en anderszins. Zie de aantekening Exo 30:23 , en Psa 45:9 . Gemengd zijnde met wijn, maakt zij een zeer lieflijken drank, om het hart te versterken en het bloed te zuiveren, zoals Plinius getuigt. Zij werd ook, nevens andere specerijen, gebruikt om de dode lichamen te balsemen, Joh 19:39 ; in een woord, het is een edel kruid, hetwelk waardig is koningen tot een present te schenken; zie Gen 37:25 , en Gen 43:11 ; Mat 2:11 . Daarom is het geen wonder dat de liefde van Christus daarbij vergeleken wordt."},{"catchword":"dat","tekst":"Hiermede wordt beduidt dat de kerk Gods de nagedachtenis van haren Bruidegom steeds wil behouden, inzonderheid gedurende den duisteren nacht der vervolgingen en benauwdheden, zichzelve daarmede vertroostende en versterkende; Eph 3:17 ."}],"14":[{"catchword":"een tros","tekst":"Cyprus is een zekere plant, die een welriekende vrucht of gom, als een bloeienden druiventak, voortbrengt, zoals Hieronymus getuigt. Eenigen menen dat hierbij een natuurlijken tros druiven verstaan wordt, genoemd met den naam Cyprus. Hebreeuws, Cofer, omdat de druiven van Engedi den smaak hadden van Cyprus, welk kruid daaromtrent veel groeide; zie de kruidenboeken. Hoe het zij, er wordt bij verstaan een uitnemende lieflijke vrucht, bij welke de Heere Christus vergeleken wordt, vanwege zijn welriekende verdiensten en heilzame gaven; het bloed van Jezus Christus reinigt ons van alle zonden, 1Jo 1:7 . Hij is de verzoening voor onze zonden; 1Jo 2:2 ."},{"catchword":"En-gedi","tekst":"Van deze stad zie de aantekening 1Sa 24:1 ."}],"15":[{"catchword":"gij zijt schoon,","tekst":"De schoonheid, die de kerk Gods heeft, komt uit genade, verworven door het bloed van Jezus Christus en zijne gerechtigheid. Zie onder, Son 4:1 ."},{"catchword":"gij zijt schoon;","tekst":"De verdubbeling der woorden dient om de kerk des te meer tegen de vervolgingen harer vijanden te versterken."},{"catchword":"duivenogen","tekst":"Dat is, eenvoudig en kuis. Zie onder, Son 4:1 . Hiermede wordt te kennen gegeven de geestelijke zuiverheid, eenvoudigheid en kuisheid der gemeente van Jezus Christus, wier ogen alleen op Hem zien en in Hem alleen de zaligheid en het eeuwige leven zoeken. Zie Psa 123:1-2 ; Mat 10:16 . Doch enigen verstaan hier bij de ogen de leraars en opzieners der kerk en wegwijzers der onwetenden, die de scherpste ogen in de gemeente moeten hebben. Zie ook Num 10:31 ; Job 29:15 ; Psa 33:8 ; Son 4:1 ."}],"16":[{"catchword":"gij zijt schoon,","tekst":"Christus is schoon van nature, want Hij is het Lam zonder vlek, Exo 12 Maar de Bruid is schoon uit genade, door de verdiensten van Christus, Joh 1:16 ."},{"catchword":"ja, liefelijk;","tekst":"Dat is, niet stuurs, noch trots. Hij nodigt ons zeer vriendelijk, zeggende: Komt tot mij, die belast en beladen zijt, Ik zal u verkwikken; Mat 11:28 ."},{"catchword":"ook groent","tekst":"Dat is, er worden dagelijks vele geestelijke kinderen in uwe gemeente geboren, uit het onsterflijke zaad van uw Woord; 1Pe 1:23 . Hierom wordt de kerk genoemd de moeder aller gelovigen; Gal 4:26 ."}],"17":[{"catchword":"De balken","tekst":"De kerk prijst hare woning, om anderen daartoe te nodigen en aan te brengen. Zij noemt de verzamelingen der gelovigen huizen, in het getal van velen, omdat er vele gewone kerken zijn. Bij de balken wordt verstaan de leer der profeten en der apostelen; want daardoor wordt de kerk vast samengebonden in Christus, als het fondament; Eph 2:20 . Deze balken zijn van cederen, dat is sterk en onvergankelijk; want Gods Woord blijft in der eeuwigheid; Isa 40:8 ; 1Pe 1:25 . Van de duurzaamheid van het cederhout, zie Jdg 9:15 . Christus, sprekende van de vastigheid en duurzaamheid zijner kerk, zegt: De poorten der hel zullen daartegen niet vermogen; Mat 16:18 ."},{"catchword":"galerijen","tekst":"Of, wandelplaatsen, of welfselen, gelijk Gen 30:38 , en 30:41 ."},{"catchword":"cypressen","tekst":"Dit hout is zeer lieflijk, daarom wordt met recht Christus bij hetzelve vergeleken. Anders: van Boratin, in het Latijn Bruta genoemd, hetwelk een boom is, den cypresboom gelijk, zeer lieflijk van reuk, Plin.nat.hist.lib.12:17. Het Hebreeuwse woord, dat hier in den tekst staat, wordt nergens in de Heilige Schrift gevonden dan hier alleen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The High song, [Heb. The song of songs: that is, a very fair, and exceeding excellent song. See the annotate. Gen 9:25.] which is Salomons. [Oth. Which concerneth Salomon. Understanding by Salomon Jesus Christ, of whom Salomon was a type, in his Royal dignity and glory, as also in his wisdom, and in his teaching and instruction of the people.]"}],"2":[{"catchword":null,"tekst":"Let him [To wit, my bridegroom Jesus Christ. They are the words of the Spouse; that is, of the church of Jesus Christ] kiss me [That is, let him shew or manifest his love unto me. Oth. Oh that my bridegroom would kiss me! To kiss me one another was at all times held to be a token of love, friendship, and courtesy: in token whereof, men were also used to kiss one another, Exo 4:27. and 18.7. Rom 16:16. & Thes.5.16. Christ kisseth his spouse, that is, his Church, or chosen ones, when he manifesteth unto them, and causeth them to feel that great and wonderful love which he beareth unto them: We kiss Christ, when with an upright faith, hearty love, and child-like fear and reverence, we acknowledge him to be our Lord and Saviour, and do wholly submit our selves unto him, and obey him, Psal.2.12.] with the kisses [In the plural number, whereby is exprest the riches of the manifold graces and mercies, which Christ sheweth to his elect, Eph 1:7,8,9, etc.] of his mouth, [Our Lord Jesus Christ revealeth unto believers the love with the beareth unto them, by his word. Therefore it is said, Psal.45.3. that his lips are very pleasant, or gracious. See below 5.15. and Isa 50:4. Peter saith likewise, Lord, thou hast the words of eternal life, Joh.6.68.] for thy excelling love [That is, kindness, loveliness. Heb. Loves. Now the spouse (that is, the church of God) speaketh here unto Christ her bridegroom. Understand here by the word loves, the transcedant love and affection, as also the benefits and favours which Christ sheweth unto his elect] is better then wine. [By the word wine, here is to be understood all earthly comforts and delights, Compare Jud 9:13. Psal.104.15. So below chap 4.10.]"}],"3":[{"catchword":null,"tekst":"Thine oils are good for smell, [Understand by oils here, sweet-smelling oils, precious oitments, or balmes. Hereunto spiritual gifts or gives are often resembled, as Psal.45.8. Isai.61.1. and 1 Job 2:27.] thy Name [Understand the name, person, and the soul-saving office of Christ, as the same are revealed unto us in the Gospel] is an oil, that is poured forth: [Salomon seemeth here to have looked at the name Messias; that is, Christ, Anointed, who was anointed with the Holy Ghost, not onely for himself; but that holy Balsam flowed down from him, who is our head, upon us his members. See Psal.133.2. and Joh.1.16. This name after Christs ascension into heaven, is spread far abroad; for all Christians have their name from Christ] therefore do the virgins love thee. [That is, (as it is said, vers.4.) The upright love thee. The elect are more then once in Scripture compared unto Virgins, Mat 25:1. 2 Cor.11.2. Revel.14.1,4,5. And that in this respect, because the children of God must so narrowly heed and watch their consciences, left they be defiled with the sins of the world, as an honest maiden or virgin ought to look to her own honesty and chastity.]"}],"4":[{"catchword":null,"tekst":"Draw me, we will run after thee: [Draw me; That is, incline mine heart and mind, that it may adhere-unto thee by faith and love. For this drawing is not done with outward strength and violence. But by the word of preaching outwardly, and inwardly by the powerful working of the Spirit of Christ, whereby the understanding of the children of God is so enlightened, and our will so reformed and amended, as that we willingly and joyfully follow; yea run after our blessed Lord and Bridegroom Jesus Chirst. See Isai.40.31. Jer 31:3. Joh 6:44,45. And 12.32. Php 2:13. Heb 12:1,2.] the King [Understand by the King, Christ the King of righteousness, and of peace, Heb 7:2. of whom Melchizedek and Salomon were types] brought me into his inner chambers, [By these inner chambers are meant the mysteries of the Kingdom of Christ, which in the Old Testament were vailed and covered under the shadows of the Ceremonial Law: but now in the New Testament we behold the glory of the Lord as in a mirror, 2 Cor.3.18. See also Rom 16:25. and 1 Cor.2. vers.9.19,16. And 2 Cor.1.20. Heb 8:10,11. Or, understand by the inner chambers the Kingdom of Heaven, wherein are many mansions, Joh.14.2. which we already possess and enjoy by faith, Eph.2.6.] we [To wit, I and my maidens, or, companions, that is, all the faithful, or all believers] will rejoice, and he glad in thee; [O King: and in thee; that is, because of thee. As if she should say, the more we increase in the knowledge of thee, and in the taste of thy grace and mercy, the more we shall be confirmed and strengthened in spiritual joy. Compare 1 Pet.1.8.] we will mention thy excelling love, [that is, we will extoll and publish the grace of Christ, who hath called us out of darkness unto his marvelous light, 1 Pet.1.9. See also Psal.25.18. and 71.16. Jsa.12.3,4. And 63.7.] more then wine: [s if she should say, Lord, we will magnify and praise thy grace and favour with more joy and delight, then wordlings take in earthly things. For the peace of God passeth all understanding. See Psal.4.8.] the upright [Heb. The rightnesses, or, uprightnesse; that is, those that are endued with uprightness, who v.3. are called Virgins, namely those, in whom there is found no guile, Psal.32.2. Joh.1.47.] love thee."}],"5":[{"catchword":null,"tekst":"I am black, [Understand here by blackness, the outward deformity of the state and condition of the church, occasioned both by tyrannies and persecutions, also by reason of the heresies, schisms, and offences that do befall the same. See Psal.119.83. Lament.4.8. and 5.10.] but lovely, [the church of Christ is lovely, because she is cleansed and purified by the blood and spirit of Christ, 1 Cor.6.12. So that in that respect she shineth and is fair, as the doves, Psal.68.14. see likewise Psal.45.14,15, &c.] (the Daughters of Jerusalem) [That is, the faithful children of God. Jerusalem that is above, is the mother of us all, Gal 4:26. Thus are also particular Churchs, and Christians called here daughters of Jerusalem, and virgins, 2 Cor.11.2. Revel.14.4. and Psal.45.vers.13.14. the church is called the Kings Daughter. Such are here comforted and strengthened against the scandals of the cross, and the infirmities that do accompany the cross in this world] as the tents of Kedar, [Understand here by the tents of Kedar, the posterity of Kedar, the second son of Ismael, Genes.25.13. who dwelt in tents, having no settled habitation or dwelling-place; but they swerved to and fro throw-out Arabia, from one place to another. See the annotate. Psal.120. vers.5,6. The children of God are likewise according to the world and outward appearance, not beautiful, not comely, they likewise have here no abiding City, but look for the heavenly Jerusalem] as the curtains of Salomon. [As if she had said, I am (it is true) as the tents of Kedar, but likewise as beautiful as the curtains of Salomon: (of the beauty whereof see Josephus in antiq.lib.8.cap 2.) for the children of God are inwardly beautified and adorned with the gifts of the Holy Ghost, as are Godliness, the love of God, and of our neighbor. Oth. As the pavilions of Salomon, which outwardly (by reason of rain, wind, and the scorching of the Sun) were not very beautiful, but inwardly were exceeding fair and beautiful.]"}],"6":[{"catchword":null,"tekst":"Look not upon me, that I am blackish, [The meaning is, look not upon mine outward baseness and deformity, despise me not for it, but look upon mine inward beauty] because the Sun hath shined upon me. [Heb. The Sun hath looked upon me. Understand here by the Sun, (which maketh them black, upon whom it shineth) persecutions and afflictions, as Mat 13:6,21.] My mothers children Isa 48:1,2. Act 20:30. who indeed boast that the Church is their mother, but in vain, seeing they have not God for their Father. See Deut.32.5. Joh.8.44.] were incensed, [To wit, with anger] against me: [That is, they grieved and vexed me. The enmity and persecution of false brethren is (2 Cor. Chap.11.26.) counted among the most grievious afflictions and crosses, that do befall Christians. See Galat.2.4.] they have set me to be a keeper of the Vineyards: [By Vineyards in Scripture are oftentimes meant, the assemblies of men, both good and evil. Of the first, to wit, of the assembly of good men, see Psal.80. Isai.5.2,7. Matth.chap.20. Of the second, to wit, of the assembly of evil or wicked men, see examples, Deut.32.32. Revel.14.18. Some do understand here by the Vineyards, false Churchs in general, and hypocritical members in particular, whereunto her Mothers sons or children sought to bring her, willing that she should give heed to the traditions and commandments of men. See Mark 7.13. Act 15:1,10. Galat.6.12,13. Coloss.2. vers.20,21,22,23. However the Church complaineth there, that she is oftentimes so far overpowered by false brethren, as that her own Rulers and Overseers do rather defend and protect the goats, then the true sheep: the heretics and schismatic rather then the Orthodox. Whence nothing, but great calamity and destruction of the Church can arise] my Vineyard which I have, have I not kept. [That is, I have not minded it, as I ought to have done, being hindered and kept back, either by reason of mine own infirmity, or by reason of tyranny, and persecution. Others take those words thus, as if the spouse, or (the Teachers of the primitive church) should say, I was appointed to have the oversight of other churches, I have left the primitive church which I had planted; and other churchs have been planted by me throughout all the World: The primitive Church that was planted at Jerusalem, I could not keep there, nor tarry with it, by reason of the persecution of Jews and other tyrants.]"}],"7":[{"catchword":null,"tekst":"Tell me [Or, make me acquainted] (thou) whom my soul loveth, [So below, chap.3.1,2,3.] where thou feedest , where thou lodgest (thy flock) at noon: [Here the spouse speaketh again unto her Bridgegroom, and she requireth of him the Spirit of discerning, that she may not be deceaved or seduced by false Teachers, as followeth in the text. For there shall come false Prophets, who shall say, here is Christ, (or) there is Christ, Mark chap.13.vers.21. and sometimes God hideth his face, Deut.32.20. and saith, I will not feed thee, Zach.11.9. Christ is the supreme or chief shepherd of the sheep, Psal.23.1. that is promised, Ezech.34.vers.23,24. The Prophets, and Apostles; and all true Teachers or Ministers of the Word, are his Ambassadors and Messengers, whom he sendeth forth, to feed in his Name his sheep in the pastures of life, Joh.21.vers.15,16,17. The Church enquireth here most earnestly, where she may find rest and pasture at noon, that is, in the hottest time of persecution, of heresies, and schisms, when the sheep are ready to faint by reason of the heat of the cross. Comp // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {

}

// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)

  const n = rij.id.slice(1);

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
