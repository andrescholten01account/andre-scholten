iet zoals de geveinsden; want die bidden graag terwijl ze in de synagogen en op de hoeken van de straten staan, opdat zij door de mensen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.","6":"Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.","7":"En als u bidt, gebruik dan geen zinloze herhaling van woorden, zoals de heidenen; want zij menen dat zij vanwege hun veelheid van woorden verhoord zullen worden.","8":"Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.","9":"Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.","10":"Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.","11":"Geef ons heden ons dagelijks brood.","12":"En vergeef ons onze schulden, zoals ook wij onze schuldenaars vergeven.","13":"En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.","14":"Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.","15":"Maar als u de mensen hun misdaden niet vergeeft, zal ook uw Vader uw misdaden niet vergeven.","16":"En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.","17":"Maar u, als u vast, zalf dan uw hoofd en was uw gezicht;","18":"opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.","19":"Verzamel voor uzelf geen schatten op de aarde, waar de mot en de roest ze verderven, en waar de dieven inbreken en stelen;","20":"maar verzamel voor uzelf schatten in de hemel, waar mot noch roest ze verderft, en waar dieven niet inbreken of stelen;","21":"want waar uw schat is, daar zal ook uw hart zijn.","22":"De lamp van het lichaam is het oog; als dan uw oog helder is, zal heel uw lichaam verlicht zijn;","23":"maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!","24":"Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.","25":"Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding?","26":"Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?","27":"Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?","28":"En waarom bent u bezorgd over de kleding? Kijk naar de lelies van het veld, hoe zij groeien; zij werken niet en spinnen niet;","29":"en Ik zeg u, dat zelfs Salomo, in al zijn heerlijkheid, niet gekleed was zoals één van deze.","30":"Als God nu het gras van het veld, dat er vandaag is en morgen in de oven geworpen wordt, zo kleedt, zal Hij u niet veel meer kleden, kleingelovigen?","31":"Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden?","32":"Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.","33":"Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.","34":"Wees dan niet bezorgd voor de dag van morgen; want de dag van morgen zal voor zichzelf zorgen. Elke dag heeft genoeg aan zijn eigen kwaad."},"SV":{"1":"Hebt acht, dat gij uw aalmoes niet doet voor de mensen, om van hen gezien te worden; anders zo hebt gij geen loon bij uw Vader, Die in de hemelen is.","2":"Wanneer gij dan aalmoes doet, zo laat voor u niet trompetten, gelijk de geveinsden in de synagogen en op de straten doen, opdat zij van de mensen geëerd mogen worden. Voorwaar zeg Ik u: Zij hebben hun loon weg.","3":"Maar als gij aalmoes doet, zo laat uw linker *hand* niet weten, wat uw rechter doet;","4":"Opdat uw aalmoes in het verborgen zij; en uw Vader, Die in het verborgen ziet, Die zal het u in het openbaar vergelden.","5":"En wanneer gij bidt, zo zult gij niet zijn gelijk de geveinsden; want die plegen gaarne, in de synagogen en op de hoeken der straten staande, te bidden, opdat zij van de mensen mogen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon weg hebben.","6":"Maar gij, wanneer gij bidt, gaat in uw binnenkamer, en uw deur gesloten hebbende, bidt uw Vader, Die in het verborgen is; en uw Vader, Die in het verborgen ziet, zal het u in het openbaar vergelden.","7":"En als gij bidt, zo gebruikt geen ijdel verhaal van woorden, gelijk de heidenen; want zij menen, dat zij door hun veelheid van woorden zullen verhoord worden.","8":"Wordt dan hun niet gelijk; want uw Vader weet, wat gij van node hebt, eer gij Hem bidt.","9":"Gij dan bidt aldus: Onze Vader, Die in de hemelen *zijt*! Uw Naam worde geheiligd.","10":"Uw Koninkrijk kome. Uw wil geschiede, gelijk in den hemel *alzo* ook op de aarde.","11":"Geef ons heden ons dagelijks brood.","12":"En vergeef ons onze schulden, gelijk ook wij vergeven onzen schuldenaren.","13":"En leid ons niet in verzoeking, maar verlos ons van den boze. Want Uw is het Koninkrijk, en de kracht, en de heerlijkheid, in der eeuwigheid, amen.","14":"Want indien gij den mensen hun misdaden vergeeft, zo zal uw hemelse Vader ook u vergeven.","15":"Maar indien gij den mensen hun misdaden niet vergeeft, zo zal ook uw Vader uw misdaden niet vergeven.","16":"En wanneer gij vast, toont geen droevig gezicht, gelijk de geveinsden; want zij mismaken hun aangezichten, opdat zij van de mensen mogen gezien worden, als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon weg hebben.","17":"Maar gij, als gij vast, zalft uw hoofd, en wast uw aangezicht;","18":"Opdat het van de mensen niet gezien worde, als gij vast, maar van uw Vader, Die in het verborgen is; en uw Vader, Die in het verborgen ziet, zal het u in het openbaar vergelden.","19":"Vergadert u geen schatten op de aarde, waar ze de mot en de roest verderft, en waar de dieven doorgraven en stelen;","20":"Maar vergadert u schatten in den hemel, waar ze noch mot noch roest verderft, en waar de dieven niet doorgraven noch stelen;","21":"Want waar uw schat is, daar zal ook uw hart zijn.","22":"De kaars des lichaams is het oog; indien dan uw oog eenvoudig is, zo zal uw gehele lichaam verlicht wezen;","23":"Maar indien uw oog boos is, zo zal geheel uw lichaam duister zijn. Indien dan het licht, dat in u is, duisternis is, hoe groot *zal* de duisternis *zelve* *zijn*!","24":"Niemand kan twee heren dienen; want of hij zal den enen haten en den anderen liefhebben, of hij zal den enen aanhangen en den anderen verachten; gij kunt niet God dienen en den Mammon.","25":"Daarom zeg Ik u: Zijt niet bezorgd voor uw leven, wat gij eten, en wat gij drinken zult; noch voor uw lichaam, waarmede gij u kleden zult; is het leven niet meer dan het voedsel, en het lichaam dan de kleding?","26":"Aanziet de vogelen des hemels, dat zij niet zaaien, noch maaien, noch verzamelen in de schuren; en uw hemelse Vader voedt *nochtans* dezelve; gaat gij dezelve niet *zeer* veel te boven?","27":"Wie toch van u kan, met bezorgd te zijn, een el tot zijn lengte toedoen?","28":"En wat zijt gij bezorgd voor de kleding? Aanmerkt de leliën des velds, hoe zij wassen; zij arbeiden niet, en spinnen niet;","29":"En Ik zeg u, dat ook Salomo, in al zijn heerlijkheid, niet is bekleed geweest, gelijk een van deze.","30":"Indien nu God het gras des velds, dat heden is, en morgen in den oven geworpen wordt, alzo bekleedt, zal Hij u niet veel meer *kleden*, gij kleingelovigen?","31":"Daarom zijt niet bezorgd, zeggende: Wat zullen wij eten, of wat zullen wij drinken, of waarmede zullen wij ons kleden?","32":"Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet, dat gij al deze dingen behoeft.","33":"Maar zoekt eerst het Koninkrijk Gods en Zijn gerechtigheid, en al deze dingen zullen u toegeworpen worden.","34":"Zijt dan niet bezorgd tegen den morgen; want de morgen zal voor het zijne zorgen; *elke* dag heeft genoeg aan zijn zelfs kwaad."},"KJV":{"1":"Take heed that ye do not your alms before men, to be seen of them: otherwise ye have no reward of your Father which is in heaven.","2":"Therefore when thou doest *thine* alms, do not sound a trumpet before thee, as the hypocrites do in the synagogues and in the streets, that they may have glory of men. Verily I say unto you, They have their reward.","3":"But when thou doest alms, let not thy left hand know what thy right hand doeth:","4":"That thine alms may be in secret: and thy Father which seeth in secret himself shall reward thee openly.","5":"And when thou prayest, thou shalt not be as the hypocrites *are*: for they love to pray standing in the synagogues and in the corners of the streets, that they may be seen of men. Verily I say unto you, They have their reward.","6":"But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly.","7":"But when ye pray, use not vain repetitions, as the heathen *do*: for they think that they shall be heard for their much speaking.","8":"Be not ye therefore like unto them: for your Father knoweth what things ye have need of, before ye ask him.","9":"After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name.","10":"Thy kingdom come. Thy will be done in earth, as *it is* in heaven.","11":"Give us this day our daily bread.","12":"And forgive us our debts, as we forgive our debtors.","13":"And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen.","14":"For if ye forgive men their trespasses, your heavenly Father will also forgive you:","15":"But if ye forgive not men their trespasses, neither will your Father forgive your trespasses.","16":"Moreover when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast. Verily I say unto you, They have their reward.","17":"But thou, when thou fastest, anoint thine head, and wash thy face;","18":"That thou appear not unto men to fast, but unto thy Father which is in secret: and thy Father, which seeth in secret, shall reward thee openly.","19":"Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal:","20":"But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal:","21":"For where your treasure is, there will your heart be also.","22":"The light of the body is the eye: if therefore thine eye be single, thy whole body shall be full of light.","23":"But if thine eye be evil, thy whole body shall be full of darkness. If therefore the light that is in thee be darkness, how great *is* that darkness!","24":"No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other. Ye cannot serve God and mammon.","25":"Therefore I say unto you, Take no thought for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than meat, and the body than raiment?","26":"Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?","27":"Which of you by taking thought can add one cubit unto his stature?","28":"And why take ye thought for raiment? Consider the lilies of the field, how they grow; they toil not, neither do they spin:","29":"And yet I say unto you, That even Solomon in all his glory was not arrayed like one of these.","30":"Wherefore, if God so clothe the grass of the field, which to day is, and to morrow is cast into the oven, *shall he* not much more *clothe* you, O ye of little faith?","31":"Therefore take no thought, saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed?","32":"(For after all these things do the Gentiles seek:) for your heavenly Father knoweth that ye have need of all these things.","33":"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.","34":"Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day *is* the evil thereof."}},"tsk":{"1":[{"kopje":"Let op","refs":["Matt 16:6","Mark 8:15","Luk 11:35","Luk 12:1","Luk 12:15","Hebr 2:1"]},{"kopje":"aalmoes","refs":["Deut 24:13","Ps 112:9","Dan 4:27","2 Kor 9:9","2 Kor 9:10"]},{"kopje":"gezien te worden","refs":["Matt 6:5","Matt 6:16","Matt 5:16","Matt 23:5","Matt 23:14","Matt 23:28-30","2 Kon 10:16","2 Kon 10:31","Ezech 33:31","Zach 7:5","Zach 13:4","Luk 16:15","Joh 5:44","Joh 12:43","Gal 6:12"]},{"kopje":"anders","refs":["Matt 6:4","Matt 6:6","Matt 5:46","Matt 10:41","Matt 10:42","Matt 16:27","Matt 25:40","1 Kor 9:17","1 Kor 9:18","Hebr 6:10","Hebr 11:26","2 Joh 1:8"]},{"kopje":"uw","refs":["Matt 6:9","Matt 5:48"]}],"2":[{"kopje":"wanneer","refs":["Job 31:16-20","Ps 37:21","Ps 112:9","Spr 19:17","Pred 11:2","Jes 58:7","Jes 58:10-12","Luk 11:41","Luk 12:33","Joh 13:29","Hand 9:36","Hand 10:2","Hand 10:4","Hand 10:31","Hand 11:29","Hand 24:17","Rom 12:8","2 Kor 9:6-15","Gal 2:10","Ef 4:28","1 Tim 6:18","Filem 1:7","Hebr 13:16","Jak 2:15","Jak 2:16","1 Petr 4:11","1 Joh 3:17-19"]},{"kopje":"niet voor u uittrompetten"," ede zonder nood of ernst dikwijls herhaald worden."}],"9":[{"catchword":"aldus","tekst":"Dat is, richt al uw gebeden naar dit formulier. Niet dat wij aan deze woorden alleen of altijd zouden gehouden zijn, want in voorvallende noden is het ook wel geoorloofd enige beden verder uit te breiden, en ook met andere woorden uit te drukken. Zie Joh 17 , en Act 4:24 ."},{"catchword":"in de hemelen zijt,","tekst":"Dat is, in den derden hemel, 2Co 12:2 , waar Hij zijne majesteit en heerlijkheid allermeest openbaart: Psa 103:19 ."},{"catchword":"geheiligd","tekst":"Dat is, van ons met woorden en werken groot gemaakt."}],"10":[{"catchword":"koninkrijk","tekst":"Namelijk zo der genade in deze wereld, als der heerlijkheid in de hemel."},{"catchword":"in den hemel","tekst":"Namelijk van de heilige engelen, Psa 103:20-21 , en van de zalige en volmaakte zielen; Heb 12:23 ."}],"11":[{"catchword":"dagelijks","tekst":"Dat is genoegzaam en nodig tot onderhoud van ons leven voor deze dag, of ons bescheiden deel; Pro 30:8 ."},{"catchword":"brood","tekst":"Dat is, alle nooddruft des lichaams; Gen 3:19 ."}],"12":[{"catchword":"schulden,","tekst":"Dat is, zonden, Luk 11:4 , die ons schuldig maken aan de straf. Zie Mat 18:24 ."}],"13":[{"catchword":"leid ons niet","tekst":"Of, breng ons niet; dat is, geef ons niet over."},{"catchword":"verzoeking,","tekst":"Namelijk des satans, der wereld en van ons vlees, om ons te brengen tot zondigen, of tot kwaad. Zie Jam 1:13-14 ."},{"catchword":"Amen","tekst":"Het is een Hebreeuws woord, en zoveel te zeggen als: het zij of worde alzo; of, het is zekerlijk alzo. Zie Deu 27:15 ; Neh 8:7 ."}],"15":[{"catchword":"misdaden niet vergeven","tekst":"Grieks, misvallen; waardoor allerlei zonden verstaan worden."}],"16":[{"catchword":"vast,","tekst":"Namelijk in het bijzonder. Want in gemeente noden of vasten is het geoorloofd een droevig gelaat te tonen, als het zonder geveinsdheid geschiedt."},{"catchword":"mismaken hun aangezichten,","tekst":"Of, verdonkeren, verderven."}],"17":[{"catchword":"zalft uw hoofd","tekst":"Christus spreekt hier naar het gebruik der Joden, die in tijden van vrolijkheid zich zalfden en wiesen; Psa 23:5 ; Amo 6:6 ; Luk 7:46 ."}],"19":[{"catchword":"Vergadert u geen schatten op de aarde,","tekst":"Namelijk voornamelijk, of alzo dat gij daarvan uw werk zoudt maken, zonder de hemelse recht te betrachten. Zie 1Ti 6:8 ."},{"catchword":"roest verderft,","tekst":"Grieks, eting, ineting."}],"22":[{"catchword":"De kaars des lichaams is het oog;","tekst":"Dat is, gelijk het lichaam door het oog, zo wordt des mensen doen en laten door het verstand geleid en gericht."}],"23":[{"catchword":"boos is,","tekst":"Dat is, verblind of verdorven."}],"24":[{"catchword":"twee heren dienen;","tekst":"Namelijk die elkander tegen zijn."},{"catchword":"aanhangen","tekst":"Of, zich aan den enen houden."},{"catchword":"mammon","tekst":"Het is een Syrisch woord en betekent rijkdom, winst of schatten, die de mensen dikwijls als een god eren en dienen."}],"25":[{"catchword":"Zijt niet bezorgd","tekst":"Namelijk met angstige en onmatige zorg, spruitende uit kleingelovigheid en verhinderende de zorg der zaligheid. Anders zo zijn wij ook schuldig voor deze dingen te zorgen; 1Ti 5:8 ."},{"catchword":"leven,","tekst":"Grieks, ziel; waardoor het leven betekent wordt. Zie Job 2:6 ; Mat 2:20 ."}],"26":[{"catchword":"hemels,","tekst":"Dat is, der lucht. Zie Psa 8:9 ."},{"catchword":"gaat gij dezelve niet zeer veel teboven?","tekst":"Grieks, verschilt gij niet zeer veel van dezelve?"}],"27":[{"catchword":"een el tot zijn lengte toedoen?","tekst":"Grieks, een cubit; dat is, de lengte des arms van den elleboog of tot het uiterste van den middensten vinger, of anderhalve voet."}],"29":[{"catchword":"Sálomo, in al zijn heerlijkheid","tekst":"Lees van dezelve 1Ki 4 ."}],"30":[{"catchword":"morgen in den oven geworpen wordt,","tekst":"Dat is, dat kort daarna verdroogd zijnde, bijna nergens anders toe dient, dan om daarmede de ovens te heten."}],"32":[{"catchword":"zoeken de heidenen;","tekst":"Namelijk met angst en bekommernis, alsof hunne gelukzaligheid daarin gelegen ware."}],"33":[{"catchword":"en Zijn gerechtigheid,","tekst":"Namelijk Gods, gelijk uit den Grieksen tekst blijkt; dat is, die God aangenaam is, voor Hem bestaat en in het Evangelie ons geopenbaard is."},{"catchword":"toegeworpen worden","tekst":"Grieks, toegelegd, of toegegeven; namelijk als een toemaat of toegift. Zie Psa 127:2 ."}],"34":[{"catchword":"zijn eigen kwaad","tekst":"Dat is, kwelling, bekommernis en zwarigheid, die op elken dag voorvalt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Take heed that ye do not your alms [The Ggreek word Eleemosyne, from whence Alms comes, signifies in general a work of mercy, and in special liberality to the poor, because that must proceed from compassion 1 Cor 13.3. some Ggreek Copies hhave rightetousness.] before men, to be seen of them: otherwise ye have no reward with your father which is in the Heavens."}],"2":[{"catchword":null,"tekst":"Therefore when thou doest thine alms, cause not a Trumpet to be sounded before thee, like as the dissemblers do [Gr. hypocrites: which word signifies the Actors in a stage &acirc;&euro;&ldquo; play, which shew themselves for other persons then they are indeed] in the Synagoggues, and in the streets, that they may be honour which they seek of men, is their reward.]"}],"3":[{"catchword":null,"tekst":"But when thou doest alms, let not thy left [hand] know, what thy right hand doth. [That is, do it in the most secret manner, without seeking glory by]"}],"4":[{"catchword":null,"tekst":"That thy alms may be in secret, and thy Father whhich seeth in secret, he shall reward thee openly. [Namely oftentimes hhere, but especially hereafter in the last judgemnet, see Matth 25.34]"}],"5":[{"catchword":null,"tekst":"And when thou prayest, [Namely, in particular For publique prayer also in the Assembles, are acceptable to God, and have special promises, Matth 18.19.] thou shalt not be like the hypocrites: For they love to pray standing in the synagogues, [namely out of the time publique players] and in the corner of the streets, that they may be seen of men. [or, to make a shew before men.] verily, i say unto you , thay they have &acirc;&euro;&ldquo; away their reward."}],"6":[{"catchword":null,"tekst":"But thou when thou prayest, enter into thy inner chamber, [The Greek word signifies a place or chamber, where men lay away or shut up anything] having shhut thy door, pray to thy Father which is in secret, and they Father whhich seethh in secret, shall recompence thee openly"}],"7":[{"catchword":null,"tekst":"And whhen thou prayeth, use no vain rehearfall of words, [Ggr. Battolaggia, that is , when any words or expressions, are often repeated , without need or earnestness] like as the Heathen for they think that they shall he hhead for their multitude of words"}],"8":[{"catchword":null,"tekst":"Be therefore like unto them: for your Father knoweth what thy have need of, before ye pray to him."}],"9":[{"catchword":null,"tekst":"Terefore pray ye thus? [That is to say, order all your prayer according to this form. Not that we are bound only oe always to these words; for in necessities that may fall out, it is also awful further to enlarge some petitions; and also to expresse thhem in orther words. See John 17 and Act 4:24.] Our Fathher, which [art] in Heavens. [that is, in the third Heaven, 2 Cor 12.2. where he most of all manifest his Majestry and Glory, Psalm 103. 19.] Hallowed be thy Name[that is to say magnified by us in words and deeds.]"}],"10":[{"catchword":null,"tekst":"Thy Kingdome come, [Namely, both of grace in this world, and of glory in Heaven] Thy will be done as in Heaven, [namely by the holy Angels, Psa 103:20,21 and of the belsed and perfect souls, Hheb. 12. 23.] [to] also upin earth."}],"11":[{"catchword":null,"tekst":"Ggive us this day, our daily bread [That is, sufficient and necessary for the preservation // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>

    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {

      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
