ondigd.","6":"En gelukkig is hij, die aan Mij niet geërgerd zal worden.","7":"Toen nu deze *mensen* weggingen, begon Jezus tot de menigten te zeggen van Johannes: Wat bent u uitgegaan te zien in de woestijn? Een riet, dat door de wind heen en weer bewogen wordt?","8":"Maar wat bent u uitgegaan te zien? Een mens, met zachte klederen bekleed? Zie, wie zachte *klederen* dragen, zijn in de huizen van koningen.","9":"Maar wat bent u uitgegaan te zien? Een profeet? Ja, Ik zeg u, ook veel meer dan een profeet.","10":"Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.","11":"Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.","12":"En van de dagen van Johannes de Doper tot nu toe wordt het Koninkrijk der hemelen geweld aangedaan, en de geweldigers nemen het met geweld.","13":"Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.","14":"En als u het wilt aannemen, hij is Elia, die komen zou.","15":"Wie oren heeft om te horen, die hoort.","16":"Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen,","17":"En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend.","18":"Want Johannes is gekomen, niet etend, niet drinkend, en zij zeggen: Hij heeft de duivel.","19":"De Zoon des mensen is gekomen, etend en drinkend, en zij zeggen: Zie daar, een Mens, *Die* een vraat en wijnzuiper *is*, een Vriend van tollenaars en zondaars. Maar de Wijsheid is gerechtvaardigd door haar kinderen.","20":"Toen begon Hij de steden te verwijten waarin Zijn krachten meest gebeurd waren, omdat zij zich niet bekeerd hadden.","21":"Wee u, Chorazin! Wee u, Bethsaïda! Want als in Tyrus en Sidon de krachten gebeurd waren die in u gebeurd zijn, zouden zij zich lang geleden in zak en as bekeerd hebben.","22":"Maar Ik zeg u: het zal Tyrus en Sidon draaglijker zijn op de dag van het oordeel, dan u.","23":"En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.","24":"Maar Ik zeg u, dat het het land van Sodom draaglijker zal zijn op de dag van het oordeel, dan u.","25":"In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.","26":"Ja, Vader! Want zo is het welbehagen geweest voor U.","27":"Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.","28":"Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven.","29":"Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen.","30":"Want Mijn juk is zacht, en Mijn last is licht."},"SV":{"1":"En het is geschied, toen Jezus geëindigd had Zijn twaalf discipelen bevelen te geven, dat Hij van daar voortging, om te leren en te prediken in hun steden.","2":"En Johannes, in de gevangenis gehoord hebbende de werken van Christus, zond twee van zijn discipelen;","3":"En zeide tot hem: Zijt Gij Degene, Die komen zou, of verwachten wij een anderen?","4":"En Jezus antwoordde en zeide tot hen: Gaat heen en boodschapt Johannes weder, hetgeen gij hoort en ziet:","5":"De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en den armen wordt het Evangelie verkondigd.","6":"En zalig is hij, die aan Mij niet zal geërgerd worden.","7":"Als nu dezen heengingen, heeft Jezus tot de scharen begonnen te zeggen van Johannes: Wat zijt gij uitgegaan in de woestijn te aanschouwen? Een riet, dat van den wind ginds en weder bewogen wordt?","8":"Maar wat zijt gij uitgegaan te zien? Een mens, met zachte klederen bekleed? Ziet, die zachte *klederen* dragen, zijn in der koningen huizen.","9":"Maar wat zijt gij uitgegaan te zien? Een profeet? Ja, Ik zeg u, ook veel meer dan een profeet.","10":"Want deze is het, van dewelken geschreven staat: Ziet, Ik zende Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.","11":"Voorwaar zeg Ik u: onder degenen, die van vrouwen geboren zijn, is niemand opgestaan meerder dan Johannes de Doper; doch die de minste is in het Koninkrijk der hemelen, is meerder dan hij.","12":"En van de dagen van Johannes den Doper tot nu toe, wordt het Koninkrijk der hemelen geweld aangedaan , en de geweldigers nemen hetzelve met geweld.","13":"Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.","14":"En zo gij het wilt aannemen, hij is Elias, die komen zou.","15":"Wie oren heeft om te horen, die hore.","16":"Doch waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderkens, die op de markten zitten, en hun gezellen toeroepen.","17":"En zeggen: Wij hebben u op de fluit gespeeld, en gij hebt niet gedanst; wij hebben u klaagliederen gezongen, en gij hebt niet geweend.","18":"Want Johannes is gekomen, noch etende, noch drinkende, en zij zeggen: Hij heeft den duivel.","19":"De Zoon des mensen is gekomen, etende en drinkende, en zij zeggen: Ziet daar, een Mens, *Die* een vraat en wijnzuiper *is*, een Vriend van tollenaren en zondaren. Doch de Wijsheid is gerechtvaardigd geworden van Haar kinderen.","20":"Toen begon Hij de steden, in dewelke Zijn krachten meest geschied waren, te verwijten, omdat zij zich niet bekeerd hadden.","21":"Wee u, Chorazin! wee u Bethsaida! want zo in Tyrus en Sidon de krachten waren geschied, die in u geschied zijn, zij zouden zich eertijds in zak en as bekeerd hebben.","22":"Doch Ik zeg u: Het zal Tyrus en Sidon verdragelijker zijn in den dag des oordeels, dan ulieden.","23":"En gij, Kapernaum! die tot den hemel toe zijt verhoogd, gij zult tot de hel toe nedergestoten worden. Want zo in Sodom die krachten waren geschied, die in u geschied zijn, zij zouden tot op den huidigen dag gebleven zijn.","24":"Doch Ik zeg u, dat het den lande van Sodom verdragelijker zal zijn in den dag des oordeels, dan u.","25":"In dienzelfden tijd antwoordde Jezus en zeide: Ik dank U, Vader! Heere des hemels en der aarde! dat Gij deze dingen voor de wijzen en verstandigen verborgen hebt, en hebt dezelve den kinderkens geopenbaard.","26":"Ja, Vader! Want alzo is geweest het welbehagen voor U.","27":"Alle dingen zijn Mij overgegeven van Mijn Vader; en niemand kent den Zoon dan de Vader, noch iemand kent den Vader dan de Zoon, en dien het de Zoon wil openbaren.","28":"Komt herwaarts tot Mij, allen die vermoeid en belast zijt, en Ik zal u rust geven.","29":"Neemt Mijn juk op u, en leert van Mij, dat Ik zachtmoedig ben en nederig van hart; en gij zult rust vinden voor uw zielen.","30":"Want Mijn juk is zacht, en Mijn last is licht."},"KJV":{"1":"And it came to pass, when Jesus had made an end of commanding his twelve disciples, he departed thence to teach and to preach in their cities.","2":"Now when John had heard in the prison the works of Christ, he sent two of his disciples,","3":"And said unto him, Art thou he that should come, or do we look for another?","4":"Jesus answered and said unto them, Go and shew John again those things which ye do hear and see:","5":"The blind receive their sight, and the lame walk, the lepers are cleansed, and the deaf hear, the dead are raised up, and the poor have the gospel preached to them.","6":"And blessed is *he*, whosoever shall not be offended in me.","7":"And as they departed, Jesus began to say unto the multitudes concerning John, What went ye out into the wilderness to see? A reed shaken with the wind?","8":"But what went ye out for to see? A man clothed in soft raiment? behold, they that wear soft *clothing* are in kings' houses.","9":"But what went ye out for to see? A prophet? yea, I say unto you, and more than a prophet.","10":"For this is *he*, of whom it is written, Behold, I send my messenger before thy face, which shall prepare thy way before thee.","11":"Verily I say unto you, Among them that are born of women there hath not risen a greater than John the Baptist: notwithstanding he that is least in the kingdom of heaven is greater than he.","12":"And from the days of John the Baptist until now the kingdom of heaven suffereth violence, and the violent take it by force.","13":"For all the prophets and the law prophesied until John.","14":"And if ye will receive *it*, this is Elias, which was for to come.","15":"He that hath ears to hear, let him hear.","16":"But whereunto shall I liken this generation? It is like unto children sitting in the markets, and calling unto their fellows,","17":"And saying, We have piped unto you, and ye have not danced; we have mourned unto you, and ye have not lamented.","18":"For John came neither eating nor drinking, and they say, He hath a devil.","19":"The Son of man came eating and drinking, and they say, Behold a man gluttonous, and a winebibber, a friend of publicans and sinners. But wisdom is justified of her children.","20":"Then began he to upbraid the cities wherein most of his mighty works were done, because they repented not:","21":"Woe unto thee, Chorazin! woe unto thee, Bethsaida! for if the mighty works, which were done in you, had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.","22":"But I say unto you, It shall be more tolerable for Tyre and Sidon at the day of judgment, than for you.","23":"And thou, Capernaum, which art exalted unto heaven, shalt be brought down to hell: for if the mighty works, which have been done in thee, had been done in Sodom, it would have remained until this day.","24":"But I say unto you, That it shall be more tolerable for the land of Sodom in the day of judgment, than for thee.","25":"At that time Jesus answered and said, I thank thee, O Father, Lord of heaven and earth, because thou hast hid these things from the wise and prudent, and hast revealed them unto babes.","26":"Even so, Father: for so it seemed good in thy sight.","27":"All things are delivered unto me of my Father: and no man knoweth the Son, but the Father; neither knoweth any man the Father, save the Son, and *he* to whomsoever the Son will reveal","28":"Come unto me, all *ye* that labour and are heavy laden, and I will give you rest.","29":"Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls.","30":"For my yoke *is* easy, and my burden is light."}},"tsk":{"1":[{"kopje":"bevelen te geven","refs":["Matt 28:20","Joh 15:10","Joh 15:14","Hand 1:2","Hand 10:42","1 Tess 4:2","2 Tess 3:6","2 Tess 3:10","1 Tim 6:14"]},{"kopje":"Hij van daar verderging","refs":["Matt 4:23","Matt 9:35","Jes 61:1-3","Mark 1:38","Mark 1:39","Luk 4:15-21","Luk 8:1","Hand 10:38"]}],"2":[{"kopje":"in de gevangenis","refs":["Matt 4:12","Matt 14:3","Mark 6:17","Luk 3:19","Luk 7:18-23","Joh 3:24"]},{"kopje":"Johannes","refs":["Matt 9:14","Joh 3:25-28","Joh 4:1","Hand 19:1-3"]}],"3":[{"kopje":"Bent U","refs":["Matt 2:2-6","Gen 3:15","Gen 12:3","Gen 49:10","Num 24:17","Deut 18:15-18","Ps 2:6-12","Ps 110:1-5","Jes 7:14","Jes 9:5","Jes 9:6","Jer 23:5","Jer 23:6","Ezech 34:23","Ezech 34:24","Dan 9:24-26","Hos 3:5","Joël 2:28-32","Amos 9:11","Amos 9:12","Obadja 1:21","Micha 5:1","Zef 3:14-17","Hagg 2:8","Zach 9:9","Mal 3:1","Mal 4:2","Joh 4:21","Joh 7:31","Joh 7:41","Joh 7:42"]},{"kopje":"Degene","refs":["Matt 21:5","Matt 21:9","Mark 11:9","Luk 19:38","Joh 16:14","Joh 12:13","Hebr 10:37"]}],"5":[{"kopje":"blinden","refs":["Matt 9:30","Ps 146:8","Jes 29:18","Jes 35:4-6","Jes 42:6","Jes 42:7","Luk 4:18","Luk 7:21","Luk 7:22","Joh 2:23","Joh 3:2","Joh 5:36","Joh 10:25","Joh 1 function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
