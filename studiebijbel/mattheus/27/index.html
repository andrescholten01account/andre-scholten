annes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen het morgen geworden was, hebben alle overpriesters en de oudsten van het volk samen een besluit genomen tegen Jezus, om Hem te doden.","2":"En nadat zij Hem gebonden hadden, leidden zij Hem weg en gaven Hem over aan Pontius Pilatus, de stadhouder.","3":"Toen Judas, die Hem verraden had, zag dat Hij veroordeeld was, kreeg hij berouw en heeft hij de dertig zilverstukken aan de overpriesters en de oudsten teruggebracht,","4":"en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.","5":"En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.","6":"En de overpriesters namen de zilverstukken en zeiden: Het is niet toegestaan die in de offerkist te leggen, omdat het een prijs van bloed is.","7":"En zij hielden samen overleg en kochten daarmee de akker van de pottenbakker, als begraafplaats voor de vreemdelingen.","8":"Daarom is die akker de Akker van het Bloed genoemd, tot op deze huidige dag.","9":"Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;","10":"en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.","11":"En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het.","12":"En toen Hij door de overpriesters en de oudsten beschuldigd werd, antwoordde Hij niets.","13":"Toen zei Pilatus tegen Hem: Hoort U niet hoeveel zij tegen U getuigen?","14":"Maar Hij antwoordde hem op geen enkel woord, zodat de stadhouder zich zeer verwonderde.","15":"Nu was de stadhouder gewoon op het feest een gevangene los te laten aan het volk, wie zij ook wilden.","16":"En zij hadden toen een welbekende gevangene, genaamd Barabbas.","17":"Toen zij dan bijeengekomen waren, zei Pilatus tegen hen: Wie wilt u dat ik u zal loslaten, Barabbas, of Jezus, Die Christus genoemd wordt?","18":"Want hij wist dat zij Hem uit afgunst overgeleverd hadden.","19":"En terwijl hij op de rechterstoel zat, stuurde zijn vrouw iemand naar hem toe om te zeggen: Bemoei u toch niet met die Rechtvaardige, want ik heb vandaag in een droom veel geleden om Hem.","20":"Maar de overpriesters en de oudsten haalden de menigte over dat zij Barabbas zouden vragen, en Jezus zouden laten doden.","21":"En de stadhouder antwoordde en zei tegen hen: Wie van deze twee wilt u dat ik u zal loslaten? En zij zeiden: Barabbas.","22":"Pilatus zei tegen hen: Wat zal ik dan doen met Jezus, Die Christus genoemd wordt? Zij zeiden allen tegen hem: Laat Hem gekruisigd worden.","23":"Maar de stadhouder zei: Wat heeft Hij dan voor kwaad gedaan? Maar zij riepen des te meer: Laat Hem gekruisigd worden!","24":"Toen Pilatus nu zag dat hij niets bereikte, maar dat er juist meer oproer kwam, nam hij water en waste zijn handen voor de menigte, en zei: Ik ben onschuldig aan het bloed van deze Rechtvaardige; u moet maar toezien.","25":"En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.","26":"Toen liet hij hun Barabbas los; maar nadat hij Jezus gegeseld had, gaf hij Hem over om gekruisigd te worden.","27":"Toen namen de soldaten van de stadhouder Jezus mee naar het rechthuis, en verzamelden de hele legerafdeling om Hem heen.","28":"En nadat zij Hem ontkleed hadden, deden zij Hem een purperen mantel om;","29":"en zij vlochten een kroon van doornen en zetten die op Zijn hoofd, en gaven Hem een rietstok in Zijn rechterhand; en zij vielen voor Hem op de knieën en bespotten Hem, en zeiden: Gegroet, Koning van de Joden!","30":"En zij spuugden op Hem, en namen de rietstok en sloegen Hem op Zijn hoofd.","31":"En nadat zij Hem bespot hadden, deden zij Hem de mantel af, en deden Hem Zijn eigen kleren aan, en leidden Hem weg om Hem te kruisigen.","32":"En toen zij naar buiten gingen, vonden zij een man uit Cyrene, genaamd Simon; hem dwongen zij om Zijn kruis te dragen.","33":"En toen zij gekomen waren op de plaats die Golgotha genoemd wordt, dat wil zeggen: Hoofdschedelplaats,","34":"gaven zij Hem azijn te drinken, gemengd met gal; en toen Hij dat geproefd had, wilde Hij niet drinken.","35":"Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.","36":"En zij gingen zitten en bewaakten Hem daar.","37":"En zij bevestigden boven Zijn hoofd het opschrift met Zijn beschuldiging: DIT IS JEZUS, DE KONING VAN DE JODEN.","38":"Toen werden met Hem twee rovers gekruisigd, een aan Zijn rechterzijde, en een aan Zijn linkerzijde.","39":"En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd,","40":"en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af.","41":"En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:","42":"Anderen heeft Hij verlost, Zichzelf kan Hij niet verlossen. Als Hij de Koning van Israël is, laat Hij nu van het kruis afkomen, en wij zullen Hem geloven.","43":"Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.","44":"En hetzelfde verweten Hem ook de rovers die met Hem gekruisigd waren.","45":"En van het zesde uur af kwam er duisternis over het hele land, tot het negende uur toe.","46":"En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?","47":"En sommigen van hen die daar stonden, hoorden dit en zeiden: Hij roept Elia.","48":"En meteen liep een van hen toe, nam een spons, vulde die met azijn, stak ze op een rietstok, en gaf Hem te drinken.","49":"Maar de anderen zeiden: Wacht, laten we zien of Elia komt om Hem te verlossen.","50":"En Jezus riep opnieuw met luide stem en gaf de geest.","51":"En zie, het voorhangsel van de tempel scheurde in tweeën, van boven tot beneden; en de aarde beefde, en de rotsen scheurden.","52":"En de graven werden geopend, en veel lichamen van de heiligen die ontslapen waren, werden opgewekt;","53":"en nadat zij na Zijn opstanding uit de graven weggegaan waren, kwamen zij in de heilige stad, en zijn aan velen verschenen.","54":"En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!","55":"En daar waren veel vrouwen, die van veraf toekeken, die Jezus vanuit Galilea gevolgd waren om Hem te dienen.","56":"Onder hen waren Maria Magdalena, en Maria, de moeder van Jakobus en Joses, en de moeder van de zonen van Zebedeüs.","57":"En toen het avond geworden was, kwam er een rijk man uit Arimathea, genaamd Jozef, die ook zelf een discipel van Jezus was.","58":"Deze ging naar Pilatus en vroeg om het lichaam van Jezus. Toen gaf Pilatus bevel dat het hem gegeven zou worden.","59":"En Jozef nam het lichaam en wikkelde het in een schoon, fijn linnen kleed.","60":"En hij legde het in zijn nieuwe graf, dat hij in een rots had uitgehouwen; en nadat hij een grote steen voor de ingang van het graf gerold had, ging hij weg.","61":"En daar waren Maria Magdalena en de andere Maria, die tegenover het graf zaten.","62":"De volgende dag, dat is de dag na de voorbereiding, kwamen de overpriesters en de Farizeeën bijeen bij Pilatus,","63":"en zeiden: Heer, wij herinneren ons dat deze verleider, toen Hij nog leefde, gezegd heeft: Na drie dagen zal Ik opstaan.","64":"Beveel dan dat het graf beveiligd wordt tot de derde dag toe, opdat Zijn discipelen niet 's nachts komen en Hem stelen, en tegen het volk zeggen: Hij is opgestaan uit de doden; want dan zal de laatste dwaling erger zijn dan de eerste.","65":"En Pilatus zei tegen hen: U hebt een wacht; ga heen, beveilig het zo goed als u kunt.","66":"En zij gingen heen en beveiligden het graf met de wacht, en verzegelden de steen."},"SV":{"1":"Als het nu morgenstond geworden was, hebben al de overpriesters en de ouderlingen des volks te zamen raad genomen tegen Jezus, dat zij Hem doden zouden.","2":"En Hem gebonden hebbende, leidden zij *Hem* weg, en gaven Hem over aan Pontius Pilatus, den stadhouder.","3":"Toen heeft Judas, dien Hem verraden had, ziende, dat Hij veroordeeld was, berouw gehad, en heeft de dertig zilveren *penningen* den overpriesters en den ouderlingen wedergebracht,","4":"Zeggende: Ik heb gezondigd, verradende het onschuldig bloed! Maar zij zeiden: Wat gaat ons *dat* aan? Gij moogt toezien.","5":"En als hij de zilveren *penningen* in den tempel geworpen had, vertrok hij, en heengaande verworgde *zichzelven*.","6":"En de overpriesters, de zilveren *penningen* nemende, zeiden: Het is niet geoorloofd, dezelve in de offerkist te leggen, dewijl het een prijs des bloeds is.","7":"En te zamen raad gehouden hebbende, kochten zij daarmede den akker des pottenbakkers, tot een begrafenis voor de vreemdelingen.","8":"Daarom is die akker genaamd de akker des bloeds, tot op den huidigen dag.","9":"Toen is vervuld geworden, hetgeen gesproken is door den profeet Jeremia, zeggende: En zij hebben de dertig zilveren *penningen* genomen, de waarde des Gewaardeerden van de kinderen Israëls, Denwelken zij gewaardeerd hebben;","10":"En hebben dezelve gegeven voor den akker des pottenbakkers; volgens hetgeen mij de Heere bevolen heeft.","11":"En Jezus stond voor den stadhouder; en de stadhouder vraagde Hem, zeggende: Zijt Gij de Koning der Joden? En Jezus zeide tot hem: Gij zegt het.","12":"En als Hij van de overpriesters en de ouderlingen beschuldigd werd, antwoordde Hij niets.","13":"Toen zeide Pilatus tot Hem: Hoort Gij niet, hoevele *zaken* zij tegen U getuigen?","14":"Maar Hij antwoordde hem niet op een enig woord, alzo dat de stadhouder zich zeer verwonderde.","15":"En op het feest was de stadhouder gewoon den volke een gevangene los te laten, welken zij wilden.","16":"En zij hadden toen een welbekenden gevangene, genaamd Bar-abbas.","17":"Als zij dan vergaderd waren, zeide Pilatus tot hen: Welken wilt gij, dat ik u zal loslaten, Bar-abbas, of Jezus, Die genaamd wordt Christus?","18":"Want hij wist, dat zij Hem door nijdigheid overgeleverd hadden.","19":"En als hij op den rechterstoel zat, zo heeft zijn huisvrouw tot hem gezonden, zeggende: Heb *toch* niet te doen met dien Rechtvaardige; want ik heb heden veel geleden in den droom om Zijnentwil.","20":"Maar de overpriesters en de ouderlingen hebben den scharen aangeraden, dat zij zouden Bar-abbas begeren, en Jezus doden.","21":"En de stadhouder, antwoordende, zeide tot hen: Welken van deze twee wilt gij, dat ik u zal loslaten? En zij zeiden: Bar-abbas.","22":"Pilatus zeide tot hen: Wat zal ik dan doen *met* Jezus, Die genaamd wordt Christus? Zij zeiden allen tot hem: Laat Hem gekruisigd worden.","23":"Doch de stadhouder zeide: Wat heeft Hij dan kwaads gedaan? En zij riepen te meer, zeggende: Laat Hem gekruisigd worden!","24":"Als nu Pilatus zag, dat hij niet vorderde, maar veel meer *dat* *er* oproer werd, nam hij water en wies de handen voor de schare, zeggende: Ik ben onschuldig aan het bloed dezes Rechtvaardigen; gijlieden moogt toezien.","25":"En al het volk, antwoordende, zeide: Zijn bloed *kome* over ons, en over onze kinderen.","26":"Toen liet hij hun Bar-abbas los, maar Jezus gegeseld hebbende, gaf hij Hem over om gekruisigd te worden.","27":"Toen namen de krijgsknechten des stadhouders Jezus met zich in het rechthuis, en vergaderden over Hem de ganse bende.","28":"En als zij Hem ontkleed hadden, deden zij Hem een purperen mantel om;","29":"En een kroon van doornen gevlochten hebbende, zetten *die* op Zijn hoofd, en een rietstok in Zijn rechter *hand*; en vallende op hun knieën voor Hem, bespotten zij Hem, zeggende: Wees gegroet, Gij Koning der Joden!","30":"En op Hem gespogen hebbende, namen zij den rietstok en sloegen op Zijn hoofd.","31":"En toen zij Hem bespot hadden, deden zij Hem den mantel af, en deden Hem Zijn klederen aan, en leidden Hem heen om te kruisigen.","32":"En uitgaande, vonden zij een man van Cyrene, met name Simon; dezen dwongen zij, dat hij Zijn kruis droeg.","33":"En gekomen zijnde tot de plaats, genaamd Golgotha, welke is gezegd Hoofdschedelplaats,","34":"Gaven zij Hem te drinken edik met gal gemengd; en als Hij *dien* gesmaakt had, wilde Hij niet drinken.","35":"Toen zij nu Hem gekruisigd hadden, verdeelden zij Zijn klederen, het lot werpende; opdat vervuld zou worden, hetgeen gezegd is door den profeet: Zij hebben Mijn klederen onder zich verdeeld, en hebben het lot over Mijn kleding geworpen.","36":"En zij, nederzittende, bewaarden Hem aldaar.","37":"En zij stelden boven Zijn hoofd Zijn beschuldiging geschreven: DEZE IS JEZUS, DE KONING DER JODEN.","38":"Toen werden met Hem twee moordenaars gekruisigd, een ter rechter-, en een ter linker *zijde*.","39":"En die voorbijgingen, lasterden Hem, schuddende hun hoofden.","40":"En zeggende: Gij, Die den tempel afbreekt, en in drie dagen opbouwt, verlos Uzelven. Indien Gij de Zone Gods zijt, zo kom af van het kruis.","41":"En desgelijks ook de overpriesters met de Schriftgeleerden, en ouderlingen, en Farizeën, *Hem* bespottende, zeiden:","42":"Anderen heeft Hij verlost, Hij kan Zichzelven niet verlossen. Indien Hij de Koning Israëls is, dat Hij nu afkome van het kruis, en wij zullen Hem geloven.","43":"Hij heeft op God betrouwd; dat Hij Hem nu verlosse, indien Hij Hem *wel* wil; want Hij heeft gezegd: Ik ben Gods Zoon.","44":"En hetzelfde verweten Hem ook de moordenaars, die met Hem gekruisigd waren.","45":"En van de zesde ure aan werd er duisternis over de gehele aarde, tot de negende ure toe.","46":"En omtrent de negende ure riep Jezus met een grote stem zeggende: ELI, ELI, LAMA SABACHTHANI! dat is: Mijn God! Mijn God! Waarom hebt Gij Mij verlaten!","47":"En sommigen van die daar stonden, *zulks* horende, zeiden: Deze roept Elias.","48":"En terstond een van hen *toe* lopende, nam een spons, en *die* met edik gevuld hebbende, stak ze op een rietstok, en gaf Hem te drinken.","49":"Doch de anderen zeiden: Houd op, laat ons zien, of Elias komt, om Hem te verlossen.","50":"En Jezus, wederom met een grote stem roepende, gaf den geest.","51":"En ziet, het voorhangsel des tempels scheurde in tweeën, van boven tot beneden; en de aarde beefde, en de steenrotsen scheurden.","52":"En de graven werden geopend, en vele lichamen der heiligen, die ontslapen waren, werden opgewekt;","53":"En uit de graven uitgegaan zijnde, na Zijn opstanding, kwamen zij in de heilige stad, en zijn velen verschenen.","54":"En de hoofdman over honderd, en die met hem Jezus bewaarden, ziende de aardbeving, en de dingen, die geschied waren, werden zeer bevreesd, zeggende: Waarlijk, Deze was Gods Zoon!","55":"En aldaar waren vele vrouwen, van verre aanschouwende, die Jezus gevolgd waren van Galilea, om Hem te dienen.","56":"Onder dewelke was Maria Magdalena, en Maria, de moeder van Jakobus en Joses, en de moeder der zonen van Zebedeüs.","57":"En als het avond geworden was, kwam een rijk man van Arimathea, met name Jozef, die ook zelf een discipel van Jezus was.","58":"Deze kwam tot Pilatus, en begeerde het lichaam van Jezus. Toen beval Pilatus, dat *hem* het lichaam gegeven zou worden.","59":"En Jozef, het lichaam nemende, wond hetzelve in een zuiver fijn lijnwaad.","60":"En leide dat in zijn nieuw graf, hetwelk hij in een steenrots uitgehouwen had; en een groten steen *tegen* de deur des grafs gewenteld hebbende, ging hij weg.","61":"En aldaar was Maria Magdalena, en de andere Maria, zittende tegenover het graf.","62":"Des anderen daags nu, welke is na de voorbereiding, vergaderden de overpriesters en de Farizeën tot Pilatus,","63":"Zeggende: Heer, wij zijn indachtig, dat deze verleider, nog levende, gezegd heeft: Na drie dagen zal Ik opstaan.","64":"Beveel dan, dat het graf verzekerd worde tot den derden dag toe, opdat Zijn discipelen misschien niet komen bij nacht, en stelen Hem, en zeggen tot het volk: Hij is opgestaan van de doden; en *zo* zal de laatste dwaling erger zijn, dan de eerste.","65":"En Pilatus zeide tot henlieden: Gij hebt een wacht; gaat heen, verzekert het, gelijk gij het verstaat.","66":"En zij heengaande, verzekerden het graf met de wacht, den steen verzegeld hebbende."},"KJV":{"1":"When the morning was come, all the chief priests and elders of the people took counsel against Jesus to put him to death:","2":"And when they had bound him, they led *him* away, and delivered him to Pontius Pilate the governor.","3":"Then Judas, which had betrayed him, when he saw that he was condemned, repented himself, and brought again the thirty pieces of silver to the chief priests and elders,","4":"Saying, I have sinned in that I have betrayed the innocent blood. And they said, What *is that* to us? see thou","5":"And he cast down the pieces of silver in the temple, and departed, and went and hanged himself.","6":"And the chief priests took the silver pieces, and said, It is not lawful for to put them into the treasury, because it is the price of blood.","7":"And they took counsel, and bought with them the potter's field, to bury strangers in.","8":"Wherefore that field was called, The field of blood, unto this day.","9":"Then was fulfilled that which was spoken by Jeremy the prophet, saying, And they took the thirty pieces of silver, the price of him that was valued, whom they of the children of Israel did value;","10":"And gave them for the potter's field, as the Lord appointed me.","11":"And Jesus stood before the governor: and the governor asked him, saying, Art thou the King of the Jews? And Jesus said unto him, Thou sayest.","12":"And when he was accused of the chief priests and elders, he answered nothing.","13":"Then said Pilate unto him, Hearest thou not how many things they witness against thee?","14":"And he answered him to never a word; insomuch that the governor marvelled greatly.","15":"Now at *that* feast the governor was wont to release unto the people a prisoner, whom they would.","16":"And they had then a notable prisoner, called Barabbas.","17":"Therefore when they were gathered together, Pilate said unto them, Whom will ye that I release unto you? Barabbas, or Jesus which is called Christ?","18":"For he knew that for envy they had delivered him.","19":"When he was set down on the judgment seat, his wife sent unto him, saying, Have thou nothing to do with that just man: for I have suffered many things this day in a dream because of him.","20":"But the chief priests and elders persuaded the multitude that they should ask Barabbas, and destroy Jesus.","21":"The governor answered and said unto them, Whether of the twain will ye that I release unto you? They said, Barabbas.","22":"Pilate saith unto them, What shall I do then with Jesus which is called Christ? *They* all say unto him, Let him be crucified.","23":"And the governor said, Why, what evil hath he done? But they cried out the more, saying, Let him be crucified.","24":"When Pilate saw that he could prevail nothing, but *that* rather a tumult was made, he took water, and washed *his* hands before the multitude, saying, I am innocent of the blood of this just person: see ye","25":"Then answered all the people, and said, His blood *be* on us, and on our children.","26":"Then released he Barabbas unto them: and when he had scourged Jesus, he delivered *him* to be crucified.","27":"Then the soldiers of the governor took Jesus into the common hall, and gathered unto him the whole band","28":"And they stripped him, and put on him a scarlet robe.","29":"And when they had platted a crown of thorns, they put *it* upon his head, and a reed in his right hand: and they bowed the knee before him, and mocked him, saying, Hail, King of the Jews!","30":"And they spit upon him, and took the reed, and smote him on the head.","31":"And after that they had mocked him, they took the robe off from him, and put his own raiment on him, and led him away to crucify","32":"And as they came out, they found a man of Cyrene, Simon by name: him they compelled to bear his cross.","33":"And when they were come unto a place called Golgotha, that is to say, a place of a skull,","34":"They gave him vinegar to drink mingled with gall: and when he had tasted *thereof*, he would not drink.","35":"And they crucified him, and parted his garments, casting lots: that it might be fulfilled which was spoken by the prophet, They parted my garments among them, and upon my vesture did they cast lots.","36":"And sitting down they watched him there;","37":"And set up over his head his accusation written, THIS IS JESUS THE KING OF THE JEWS.","38":"Then were there two thieves crucified with him, one on the right hand, and another on the left.","39":"And they that passed by reviled him, wagging their heads,","40":"And saying, Thou that destroyest the temple, and buildest *it* in three days, save thyself. If thou be the Son of God, come down from the cross.","41":"Likewise also the chief priests mocking *him*, with the scribes and elders, said,","42":"He saved others; himself he cannot save. If he be the King of Israel, let him now come down from the cross, and we will believe him.","43":"He trusted in God; let him deliver him now, if he will have him: for he said, I am the Son of God.","44":"The thieves also, which were crucified with him, cast the same in his teeth.","45":"Now from the sixth hour there was darkness over all the land unto the ninth hour.","46":"And about the ninth hour Jesus cried with a loud voice, saying, Eli, Eli, lama sabachthani? that is to say, My God, my God, why hast thou forsaken me?","47":"Some of them that stood there, when they heard *that*, said, This *man* calleth for Elias.","48":"And straightway one of them ran, and took a spunge, and filled *it* with vinegar, and put *it* on a reed, and gave him to drink.","49":"The rest said, Let be, let us see whether Elias will come to save him.","50":"Jesus, when he had cried again with a loud voice, yielded up the ghost.","51":"And, behold, the veil of the temple was rent in twain from the top to the bottom; and the earth did quake, and the rocks rent;","52":"And the graves were opened; and many bodies of the saints which slept arose,","53":"And came out of the graves after his resurrection, and went into the holy city, and appeared unto many.","54":"Now when the centurion, and they that were with him, watching Jesus, saw the earthquake, and those things that were done, they feared greatly, saying, Truly this was the Son of God.","55":"And many women were there beholding afar off, which followed Jesus from Galilee, ministering unto him:","56":"Among which was Mary Magdalene, and Mary the mother of James and Joses, and the mother of Zebedee's children.","57":"When the even was come, there came a rich man of Arimathaea, named Joseph, who also himself was Jesus' disciple:","58":"He went to Pilate, and begged the body of Jesus. Then Pilate commanded the body to be delivered.","59":"And when Joseph had taken the body, he wrapped it in a clean linen cloth,","60":"And laid it in his own new tomb, which he had hewn out in the rock: and he rolled a great stone to the door of the sepulchre, and departed.","61":"And there was Mary Magdalene, and the other Mary, sitting over against the sepulchre.","62":"Now the next day, that followed the day of the preparation, the chief priests and Pharisees came together unto Pilate,","63":"Saying, Sir, we remember that that deceiver said, while he was yet alive, After three days I will rise again.","64":"Command therefore that the sepulchre be made sure until the third day, lest his disciples come by night, and steal him away, and say unto the people, He is risen from the dead: so the last error shall be worse than the first.","65":"Pilate said unto them, Ye have a watch: go your way, make *it* as sure as ye can.","66":"So they went, and made the sepulchre sure, sealing the stone, and setting a watch."}},"tsk":{"1":[{"kopje":"morgen","refs":["Richt 16:2","1 Sam 19:11","Spr 4:16-18","Micha 2:1","Luk 22:66","Hand 5:21"]},{"kopje":"alle","refs":["Matt 23:13","Matt 26:3","Matt 26:4","Ps 2:2","Mark 15:1","Luk 23:1","Luk 23:2","Joh 18:28","Hand 4:24-28"]}],"2":[{"kopje":"gebonden","refs":["Gen 22:9","Joh 18:12","Joh 18:24","Hand 9:2","Hand 12:6","Hand 21:33","Hand 22:25","Hand 22:29","Hand 24:27","Hand 28:20","2 Tim 2:9","Hebr 13:3"]},{"kopje":"gaven class=\"wl wl-kjv\" data-code=\"G2078\">last</span> <span class=\"wl wl-kjv\" data-code=\"G4106\">error</span> shall <span class=\"wl wl-kjv\" data-code=\"G2071\">be</span> worse <span class=\"wl wl-kjv\" data-code=\"G5501\">than</span> the first.","65":"<span class=\"wl wl-kjv\" data-code=\"G4091\">Pilate</span> <span class=\"wl wl-kjv\" data-code=\"G5346\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> Ye <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> a <span class=\"wl wl-kjv\" data-code=\"G2892\">watch:</span> go your <span class=\"wl wl-kjv\" data-code=\"G5217\">way,</span> make it as <span class=\"wl wl-kjv\" data-code=\"G805\">sure</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> ye can.","66":"<span class=\"wl wl-kjv\" data-code=\"G1161\">So</span> they <span class=\"wl wl-kjv\" data-code=\"G4198\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"G805\">made</span> the <span class=\"wl wl-kjv\" data-code=\"G5028\">sepulchre</span> <span class=\"wl wl-kjv\" data-code=\"G805\">sure,</span> <span class=\"wl wl-kjv\" data-code=\"G4972\">sealing</span> the <span class=\"wl wl-kjv\" data-code=\"G3037\">stone,</span> and <span class=\"wl wl-kjv\" data-code=\"G3326\">setting</span> a watch."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"den stadhouder","tekst":"Namelijk van den Romeinse keizer Tiberius, over het Joodse land, Luk 3:1 ; want de Joden mochten niet meer iemand met den dood straffen, zonder voorgaande bewilliging der Romeinse stadhouders, gelijk zij zelf betuigen Joh 18:31 ."}],"3":[{"catchword":"berouw gehad,","tekst":"Dit was geen oprecht berouw, gelijk Petrus had, alzo het niet was gepaard met verbetering des levens, noch met geloof en betrouwen van vergeving zijner zonden. Paulus noemt zulk een berouw, gelijk Juda had, ene droefheid, der wereld, die den dood werkt; 2Co 7:10 ."},{"catchword":"wedergebracht,","tekst":"Grieks, werdergekeerd; dat is, weder uitgekeerd."}],"5":[{"catchword":"verworgde zichzelven","tekst":"Zie hiervan breder Act 1:18 ."}],"6":[{"catchword":"offerkist te leggen,","tekst":"In den Griekse tekst wordt het Syrische woord Corbanan behouden, hetwelk betekent een gave of offer waarmede zij noemden den schat of de geldkist, in welke het geld, tot den diens Gods gegeven of geheiligd, bewaard werd. Zie 2Ki 12:9 . Deze wordt Mar 12:41 , en Luk 21:1 genaamd Gazophylacium."},{"catchword":"een prijs des bloeds is","tekst":"Dat is, waarvoor Christus van hem gekocht was om hem te doden. Het schijnt dat deze huichelaars zien op de plaats Deu 23:18 ."}],"7":[{"catchword":"de vreemdelingen","tekst":"Dat is uit vreemde landen komende en vreemd zijde van de Joodse religie, met welken het schijnt dat de Joden, zelfs ook na hun dood, gene gemeenschap wilden hebben."}],"8":[{"catchword":"de Akker des bloeds,","tekst":"Van dezen akker, zie Act 1:19 ."}],"9":[{"catchword":"Jeremia,","tekst":"Deze plaats wordt niet gevonden bij Jeremia, maar bij Zec 11:13 , en daarom menen sommige oude leraars dat hier van Mattheus zelf geen naam des profeets uitgedrukt is geweest, gelijk hij ook elders gewoon is te doen, en gelijk deze naam ook in de Syrische overzetting, die zeer oud is, en sommige andere niet gevonden wordt, en de naam van Jeremia door iemand van de afschrijvers door onwetendheid om de gelijkheid van de letters Grieks, I en Z zoals die in het kort geschreven worden, uit den kant in den tekst zou zijn bijgevoegd. Doch anderen menen dat Zacharia ook Jeremia zou genaamd zijn geweest, gelijk onder de Israëlieten zeer gebruikelijk was twee namen te hebben, inzonderheid als dezelve bijna enerlei zaak betekenen."},{"catchword":"de waarde des gewaardeerden","tekst":"Anderen zetten het over: de waarde des gewaardeerden, denwelken gewaardeerd hebben enigen van de kinderen Israëls. Zec 11:13, voert Christus zelf in als sprekende in zijn persoon, maar Mattheus, ziende meer op den zin dan op de woorden van de profeet, spreekt van Christus in den derde persoon, om aan te wijzen dat deze profetie alhier in Hem vervuld was."}],"10":[{"catchword":"volgens hetgeen","tekst":"Deze woorden staan wel niet bij den profeet, maar de inhoud daarvan."}],"11":[{"catchword":"de koning der Joden?","tekst":"Namelijk dien de Joden voor hun Messias en Verlosser verwachten."},{"catchword":"Gij zegt het","tekst":"Zie hiervoren Mat 26:25 , Mat 26:64 en Joh 18:37 ."}],"13":[{"catchword":"hoevele zaken","tekst":"Deze zaken staan uitgedrukt Luk 23:2 ."}],"14":[{"catchword":"niet op een enig woord,","tekst":"Eensdeels omdat de beschuldigingen openbare leugens waren, eensdeels omdat Hij voor ons onschuldig veroordeeld wilde worden. En zo is vervuld hetgeen tevoren van Hem gezegd was, Isa 53:7 ."}],"15":[{"catchword":"feest was de stadhouder","tekst":"Namelijk van Pasen. Joh 18:30 ."},{"catchword":"het volk een gevangene los te laten,","tekst":"Grieks, der schare."}],"16":[{"catchword":"welbekende gevangene,","tekst":"Dat is vermaarden en uitstekenden, wiens persoon en kwade feiten zeer bekend waren. Want Hij was om moord en oproer gevangen; Mar 15:7 ; Luk 23:19 ; Act 3:14 ; Joh 18:40 ."}],"20":[{"catchword":"aangeraden","tekst":"Of, met aanrading daartoe bewogen."}],"24":[{"catchword":"het bloed dezes Rechtvaardigen;","tekst":"Dat is, aan den dood. Waarvan hij nochtans niet geheel onschuldig was, alzo hij niet vermocht een onschuldige ten believe van anderen te doden, gelijk de stadhouder Festus zelf getuigt, Act 25:16 ."}],"25":[{"catchword":"Zijn bloed kome","tekst":"Dat is, zo dit bloed onschuldig vergoten wordt, de straf of wraak van God daarvan kome op ons en onze nakomelingen. Hetwelk ook kort daarna door de Romeinen geschied is en nog geschiedt; Mat 24:21 . Dergelijks manier van spreken zie Lev 20:9 , en 2Sa 1:16 ."}],"26":[{"catchword":"hebbende,","tekst":"De Romeinen hadden wel de gewoonte dat zij degenen, die tot den dood verwezen waren, eerst openlijk deden geselen, maar het blijkt uit Joh 19:1 dat Pilatus dit gedaan heeft, omdat hij hoopte dat hij met die mindere straf den Joden zou voldoen en tot medelijden bewegen om Hem alzo los te laten."}],"28":[{"catchword":"als zij Hem ontkleed hadden,","tekst":"Namelijk van zijn opperkleed."},{"catchword":"purperen mantel om;","tekst":"Dit was een zekers soort van kostelijke purperkleur, gelijk de andere evangellisten het noemen; of van scharlaken, welke alleen van koningen en grote heren gedragen werd, Dan 5:7 , en alzo spotten dezen met het koninklijke ambt van Christus. Waartoe ook diende de doornenkroon en de rietstok in plaats van een scepter en de volgende bespotting."}],"31":[{"catchword":"Zijne klederen aan,","tekst":"Namelijk Zijne opperklederen, die zij uitgedaan hadden."}],"32":[{"catchword":"Simon;","tekst":"Zie van dezen Simon breder, Mar 15:21 ."},{"catchword":"dwongen zij","tekst":"Zie van dit woord Mat 5:41 ."},{"catchword":"droeg","tekst":"Grieks, opnam; namelijk om hetzelve achter Christus te dragen, Luk 23:26 . Het was gebruikelijk dat degenen, die gekruisigd zouden worden, zelf hun kruis moesten dragen ter plaatse der straf. Dan alzo Christus door de voorgaande mishandelingen in Zijn lichaam zeer verzwakt was, zo hebben zij Hem dezen toegevoegd."}],"33":[{"catchword":"Hoofdschedel-plaats,","tekst":"Of, plaats des bekkeneels, of der hoofdpan, welke plaats alzo schijnt genaamd te zijn, omdat aldaar de justitie placht te geschieden. Of, gelijk sommigen menen, omdat deze berg den vorm of de gedaante had van een schedel."}],"34":[{"catchword":"edik met gal gemengd;","tekst":"Marcus 14:23, zegt, wijn met mirre gemengd, welken drank men degenen die veroordeeld waren, plachten te geven om hunne smart te vergeten, bij welken de soldaten edik en gal gedaan hebben, om hun moedwil ook hierin aan Hem te betonen."}],"35":[{"catchword":"het lot over mijne kleding geworpen","tekst":"Omdat zijn onderrok zonder naad was, gelijk te zien is Joh 19:23 ."}],"37":[{"catchword":"beschuldiging geschreven","tekst":"Of, Zijne schuld. Anders, Zijne oorzaak. Namelijk waarvan Hij beschuldigd en waarover Hij veroordeeld was."}],"39":[{"catchword":"schuddende hunne hoofden","tekst":"Tot een teken van verachting, en dat zij het Hem wel gunden. Zie Psa 22:8 ; Lam 2:15 ."}],"42":[{"catchword":"Hij kan zichzelven niet verlossen","tekst":"Of, en kan Hij zichzelven niet verlossen?"}],"43":[{"catchword":"indien Hij Hem wel wil;","tekst":"Grieks, indien Hij Hem wil; dat is, indien Hij aan Hem een welgevallen heeft."}],"44":[{"catchword":"moordenaars,","tekst":"Eigelijk is dit gedaan door een van de mordenaars, gelijk Lukas getuigt in Luk 23:36 , maar idt wordt aldus in het algemeen gezegd om aan te wijzen dat Christus van alle soorten mensen is bespot, zelfs van de moordenaars. Ten ware dat men zeide [gelijk sommige oude leraars menen] dat zij eerst beiden zouden gelasterd hebben, en dat daarna de een, ziende de wonderen die er geschiedden, bekeerd zou zijn."}],"45":[{"catchword":"zesde ure","tekst":"Dat is, van omtrent den middag tot omtrent drie uren na den middag, naar onze rekening. Zie Mat 20:3 ; Joh 11:9 . Zie verder Mar 15:25 ; Joh 19:14 ."},{"catchword":"duisternis","tekst":"Dit was geen gewone verduistering der zon, alzo de pasen op de volle maan gehouden werd, wanneer de maan recht over de zon staat op de andere zijde des hemels, en derhalve het licht der zon niet kan beletten; maar een bovennatuurlijk werk Gods, bij wonder geschied, gelijk de duisternis in Egypte; Exo 10:22 ."},{"catchword":"aarde","tekst":"Sommigen verstaan hierdoor het Joodse land alleen, anderen den gansen aardbodem."}],"46":[{"catchword":"ELI, ELI, LAMA SABACHTHANI","tekst":"Deze woorden zijn genomen uit Psa 22:2 ."},{"catchword":"verlaten?","tekst":"Namelijk onder den last van uw schikkelijken toorn tegen de zonden der mensen, zonder mij het gevoel van uwe gunst en hulp te laten genieten; Gal 3:13 . doch dit zijn gene woorden van wanhoop, dewijl Hij evenwel volkomenlijk op Hem betrouwd heeft, gelijk blijkt uit de worden mijn God. Zie ook hiervan Heb 5:7 ."}],"47":[{"catchword":"Deze roept Elia","tekst":"Dit zeggen zij, met Hem spottende, omdat de woorden Eli en Elia bijna overeenkomen."}],"48":[{"catchword":"stak ze op een rietstok,","tekst":"Grieks, zette deze om een rietstok. Dit deed hij omdat Christus gezegd had: Mij dorst, gelijk Joh 19:28 , getuigt."}],"50":[{"catchword":"gaf den geest","tekst":"Grieks, liet van Hem den geest; dat is zijne ziel; Joh 10:18 ."}],"51":[{"catchword":"het voorhangsel des tempels scheurde in tweeën,","tekst":"Dit was een tapijt of geborduurd kleed, hetwelk voor het heilige der heiligen hing, en dat afscheidde van het heilige of voorste deel des tempels. Wat dit beduidde wordt verklaard Heb 10:20 ."}],"53":[{"catchword":"heilige stad,","tekst":"Namelijk Jeruzalem. Zie Mat 4:5 ."}],"55":[{"catchword":"om Hem te dienen;","tekst":"Grieks, Hem diende; namelijk in zijn leven van hare goederen; Luk 8:3 ."}],"56":[{"catchword":"de moeder van Jakobus en Joses,","tekst":"Zie van deze Mat 13:55 ."},{"catchword":"de moeder der zonen van Zebedeüs","tekst":"Zie ook van deze Mat 20:20 ."}],"57":[{"catchword":"avond geworden was,","tekst":"Dat is, laat op den dag, eer de zon ondergegaan was. Want met zonsondergang begon de sabbat."},{"catchword":"van Arimathea,","tekst":"Namelijk geboortig. Dit was ene stad in het Joodse land; Luk 23:51 ."}],"59":[{"catchword":"zuiver fijn lijnwaad,","tekst":"Hetwelk hij daartoe nieuw gekocht had, Mar 15:46 ."}],"60":[{"catchword":"nieuw graf,","tekst":"In hetwelk nog niemand tevoren gelegd was; Luk 23:53 . Hetwelk door Gods beschikking alzo geschied is, opdat men niet zou zeggen of denken dat er iemand anders opgestaan was."}],"61":[{"catchword":"andere Maria,","tekst":"Namelijk tevoren vs.56 genoemd en beschreven."}],"62":[{"catchword":"na de voorbereiding,","tekst":"Dat is, op hun paasdag zelf, welke toen ook was de sabbatdag."}],"63":[{"catchword":"Verleider,","tekst":"Alzo lasteren deze goddeloze mensen Christus nog na zijn dood."},{"catchword":"zal Ik opstaan","tekst":"Grieks, sta ik op."}],"64":[{"catchword":"dwaling","tekst":"Of, verleiding."}],"65":[{"catchword":"wacht;","tekst":"Welke waren de soldaten, die gesteld waren om de tempel van buiten te bewaren en te bewaken. Zij hadden hun wachtplaats in de burcht Antonia. Zie JosEf. Antig. lib. 18, cap. 6."}],"66":[{"catchword":"verzegeld hebbende","tekst":"Opdat niemand zich zou verstouten zonder hun weten het graf te openen, gelijk Dan 6:18 , hetwelk mede door Gods beschikking is geschied, om de verrijzenis van Christus des zekerder en heerlijker te maken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when the morning was come, all the chief Priests, and Eldres of the people, took counsil together against Jesus, that they might put him to death."}],"2":[{"catchword":null,"tekst":"And having bound him, they led him (away) and gave him over to Pontius Pilate the Governor, [Namely, of the Roman Empourour Tiberius, over to the land of Judah, Luk 3:1. for the jews had no power lest them to punish any man with death, without the foregoing consent of the Roman Governours, as they themselves testifie, Joh 18:31.]"}],"3":[{"catchword":null,"tekst":"Then Judas which had betrayed him, seeing that he was condemned, repented, [This was no true repentance, such as Peter had, seeing it was not accompanied with amendment of life,nor with faith and confiedence of forgiveness of his sins. Paul calls such a repentance as Judas had, a sorrow of the world which worketh death, 2 Cor 7.10.] and brought again [Gr. turned again; that is, turned out again] the thirty silver (pence) to the chief Priest and Elders"}],"4":[{"catchword":null,"tekst":"Saying i have sinned, betraying the innocent bloud. But they said, What is (that) to us? Thou mayest look to it."}],"5":[{"catchword":null,"tekst":"And when he had thrown (down) the silver (pence) in the Temple, he departed, and going away strangled (himself). [see hereof more at large, Acts 1. 18]"}],"6":[{"catchword":null,"tekst":"And the chief Priets taking the silver (pence) said, It is not lawful to put the same into the offering &acirc;&euro;&ldquo; chest , [In the Greek Text the syriack word Corbanan is kept, which signifies a gift or offering, and so they called the treasury or mony &acirc;&euro;&ldquo; chest, in which money given or consecrated to the service of God was kept. see 2 Kings 12 verse 9. This, Mark 12.41. and Luke 21. 1. is called Gazaphylacium] seeing it is a price of bload [that is, for which Christ was bought but them to put him to death. It seems that these hypocrites have respect to the place, Deut 23. verse 18.]"}],"7":[{"catchword":null,"tekst":"And being taken councel together, they bought therewith the potters field fro burying &acirc;&euro;&ldquo; place fro straingers [That is, coming out strange Countries,and being strangers to the Jews Religion, with whom it seems that the Jews have communion, no not after their death]"}],"8":[{"catchword":null,"tekst":"Therefore is that field called the field of bloud, even unto this day. [Of this field, see Act 1:19]"}],"9":[{"catchword":null,"tekst":"Then (there) as fulfilled that which is spoken by the Prophet Jeremy, [This palce is not found in Jeremy, but in Zachary. chap 11 verse 13. and thherefore some ancuent Teachers think that here was no name of the Prophet exprest by Matthew himself, as he is wont also elsewhere to omit it, and as likewise this name is not extant in the Syriack Translation, which is very ancientt, and in some others: and that the name of Jeremy should by some of the Transcribers, although ignorance, (because of the likeness of the letters i and s they are written in short) be inserted out of the margine of the Text. But others think that Zachary was also named Jeremy, as among the Israelites it was very usual to have two names, especially when they signified almost one kind of thing ] Saying , And they took the thirty silver (pence), the value of him that was valued by the children of Israel, w function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

    }).join('');
}

    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
