en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw. Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt. Verberg Uw aangezicht van mijn zonden, en delg al mijn ongerechtigheden uit.", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Mark 6:55": "En zij liepen het hele omliggende land door, en begonnen op draagbedden hen die ziek waren rond te dragen, naar de plaats waar zij hoorden dat Hij was.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Matt 15:38": "En zij die daar gegeten hadden, waren vierduizend mannen, zonder de vrouwen en kinderen.", "Matt 12:38": "Toen antwoordden sommigen van de Schriftgeleerden en Farizeeën: Meester, wij willen graag een teken van U zien.", "Mark 3:31-35": "Toen kwamen Zijn broers en Zijn moeder; en terwijl zij buiten stonden, stuurden zij iemand naar Hem, en riepen Hem. En de menigte zat om Hem heen; en zij zeiden tegen Hem: Zie, Uw moeder en Uw broers zijn buiten en zoeken U. En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers?", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Ps 119:107": "Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.", "Joh 6:5-14": "Toen Jezus dan Zijn ogen opsloeg en zag dat een grote menigte naar Hem toe kwam, zei Hij tegen Filippus: Waar zullen wij broden kopen, zodat dezen kunnen eten? (Maar dit zei Hij om hem te beproeven; want Hij wist Zelf wat Hij doen zou.) Filippus antwoordde Hem: Voor tweehonderd penningen brood is voor hen niet genoeg, zodat ieder van hen een klein beetje krijgt.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Joh 9:29": "Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is.", "Mark 1:45": "Maar hij, toen hij weggegaan was, begon vele dingen te verkondigen en dat woord te verspreiden, zodat Hij niet meer openlijk in de stad kon komen, maar buiten in eenzame plaatsen was; en zij kwamen van alle kanten tot Hem.", "Mark 9:13": "Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Matt 14:3-11": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Gen 26:7": "En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.", "Dan 5:1-4": "De koning Belsazar maakte een grote maaltijd voor zijn duizend leiders, en hij dronk wijn ten overstaan van die duizend. Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken. Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "Mark 7:28": "Maar zij antwoordde en zei tegen Hem: Ja, Heere, maar ook de hondjes eten onder de tafel van de kruimels van de kinderen.", "Joh 14:9-11": "Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken. Geloof Mij, dat Ik in de Vader ben en de Vader in Mij is; en zo niet, geloof Mij dan om de werken zelf.", "Matt 23:18-22": "En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, de gave, of het altaar dat de gave heiligt? Daarom, wie zweert bij het altaar, die zweert bij hetzelf, en bij alles wat daarop is.", "Ps 119:145-149": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "Matt 22:24": "En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken.", "Matt 27:17-26": "Toen zij dan bijeengekomen waren, zei Pilatus tegen hen: Wie wilt u dat ik u zal loslaten, Barabbas, of Jezus, Die Christus genoemd wordt? Want hij wist dat zij Hem uit afgunst overgeleverd hadden. En terwijl hij op de rechterstoel zat, stuurde zijn vrouw iemand naar hem toe om te zeggen: Bemoei u toch niet met die Rechtvaardige, want ik heb vandaag in een droom veel geleden om Hem.", "Joh 10:17": "Daarom heeft de Vader Mij lief, omdat Ik Mijn leven afleg, opdat Ik het opnieuw neem.", "Matt 15:33": "En Zijn discipelen zeiden tegen Hem: Waar zullen wij in de woestijn zoveel broden krijgen, dat wij zo'n grote menigte zouden verzadigen?", "Matt 21:32": "Want Johannes is naar u toe gekomen op de weg van gerechtigheid, en u hebt hem niet geloofd; maar de tollenaars en de hoeren hebben hem geloofd; en u, terwijl u dat zag, hebt daarna geen berouw gehad om hem alsnog te geloven.", "Num 7:85": "Een zilveren schotel woog honderddertig sikkels, en een sprenkelschaal zeventig; al het zilver van de vaten was tweeduizend vierhonderd sikkels, naar de sikkel van het heiligdom.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "Joh 1:18": "Niemand heeft ooit God gezien; de eniggeboren Zoon, Die in de schoot van de Vader is, Die heeft Hem ons verklaard.", "Dan 9:11": "Maar heel Israël heeft Uw wet overtreden, door af te wijken, zodat zij Uw stem niet gehoorzaamden; daarom is over ons uitgestort die vloek en die eed, die geschreven is in de wet van Mozes, de knecht van God, omdat wij tegen Hem gezondigd hebben.", "Rom 8:37-39": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad. Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal, Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Matt 23:34-36": "Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad; opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht.", "Joh 6:47": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, heeft het eeuwige leven.", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Ps 80:4-6": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Luk 1:11": "En aan hem verscheen een engel van de Heere, die stond aan de rechterkant van het reukofferaltaar.", "Richt 11:39": "En het gebeurde, aan het einde van twee maanden, dat zij naar haar vader terugkwam, die met haar deed naar zijn gelofte die hij beloofd had; en zij had geen man bekend. Verder werd het een gewoonte in Israël,", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "Joh 6:14-21": "Toen de mensen dan het teken zagen dat Jezus gedaan had, zeiden zij: Deze is werkelijk de Profeet, Die in de wereld komen zou. Toen Jezus dan merkte dat zij zouden komen om Hem met geweld mee te nemen, om Hem koning te maken, trok Hij Zich weer terug op de berg, Hijzelf alleen. En toen het avond geworden was, gingen Zijn discipelen naar de zee.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Hos 6:1-3": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden. Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven. Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Rom 8:3": "Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "Ps 56:2-14": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Ps 43:1-5": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 93:3": "De rivieren verheffen, o HEERE! de rivieren verheffen hun bruisen; de rivieren verheffen hun golfslag.", "Matt 12:49": "En Hij strekte Zijn hand uit over Zijn discipelen, en zei: Kijk, Mijn moeder en Mijn broeders.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Mark 1:5": "En het hele Joodse land ging naar hem uit, en die van Jeruzalem; en zij werden allen door hem gedoopt in de rivier de Jordaan, terwijl zij hun zonden beleden.", "Gal 1:20": "Wat ik u nu schrijf, zie, ik getuig voor God, dat ik niet lieg!", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "Mark 9:19": "En Hij antwoordde hem en zei: O ongelovig geslacht, hoelang zal Ik nog bij u zijn? Hoelang zal Ik u nog verdragen? Breng hem bij Mij.", "Mark 14:1": "En het pascha, en het feest der ongezuurde broden, was na twee dagen. En de overpriesters en de Schriftgeleerden zochten hoe zij Hem door list konden grijpen en doden.", "Matt 26:53": "Of denkt u dat Ik Mijn Vader nu niet kan bidden, en Hij zal Mij meer dan twaalf legioenen engelen ter beschikking stellen?", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Mark 6:36": "Stuur hen weg, opdat zij naar de omliggende dorpen en plaatsen gaan en brood voor zichzelf kunnen kopen; want zij hebben niets om te eten.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Matt 8:13": "En Jezus zei tegen de hoofdman over honderd: Ga heen, en het gebeurt u zoals u geloofd hebt. En zijn knecht is gezond geworden op datzelfde moment.", "Joh 20:21": "Jezus zei dan opnieuw tegen hen: Vrede zij u; zoals de Vader Mij gezonden heeft, zend Ik ook u.", "Openb 5:8": "En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Joh 7:29": "Maar Ik ken Hem; want Ik ben van Hem, en Hij heeft Mij gezonden.", "Ps 73:13-17": "Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen. Als ik zou zeggen: Ik zal ook zo spreken; zie, dan zou ik trouweloos zijn tegenover het geslacht van Uw kinderen.", "Mark 6:14-16": "En koning Herodes hoorde dit (want Zijn Naam was bekend geworden), en zei: Johannes, die daar doopte, is opgewekt uit de doden, en daarom werken die krachten in Hem. Anderen zeiden: Hij is Elia; en anderen zeiden: Hij is een profeet, of als een van de profeten. Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Matt 15:34": "En Jezus zei tegen hen: Hoeveel broden hebt u? Zij zeiden: Zeven, en een paar visjes.", "Matt 8:25": "En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "Matt 14:1-12": "In diezelfde tijd hoorde Herodes, de viervorst, het gerucht van Jezus; en hij zei tegen zijn knechten: Deze is Johannes de Doper; hij is opgewekt van de doden, en daarom werken die krachten in Hem. Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer.", "Matt 14:19-21": "En Hij beval de menigten neer te zitten op het gras, en nam de vijf broden en de twee vissen, en Hij keek op naar de hemel, zegende ze; en toen Hij ze gebroken had, gaf Hij de broden aan de discipelen, en de discipelen aan de menigten. En zij aten allen en werden verzadigd, en zij namen het overschot van de brokken op, twaalf volle korven. Die nu gegeten hadden, waren ongeveer vijfduizend mannen, zonder de vrouwen en kinderen.", "Mark 6:27-29": "En de koning zond meteen een beul, en gebood zijn hoofd te brengen. Deze ging heen, en onthoofdde hem in de gevangenis; en bracht zijn hoofd op een schotel, en gaf het aan het meisje, en het meisje gaf het aan haar moeder. En toen zijn discipelen dit hoorden, gingen zij en namen zijn lichaam mee, en legden het in een graf.", "Matt 15:30": "En veel menigten kwamen tot Hem, met bij zich kreupelen, blinden, stommen, lammen, en veel anderen, en zij legden ze aan de voeten van Jezus; en Hij genas hen.", "Mark 4:40": "En Hij zei tegen hen: Waarom bent u zo angstig? Hoe kan het dat u geen geloof hebt?", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Luk 18:15": "En zij brachten ook de kinderen bij Hem, zodat Hij ze zou aanraken; en de discipelen, toen ze dat zagen, bestraften hen.", "Joh 7:40-44": "Velen dan uit de menigte, die dit woord hoorden, zeiden: Deze is werkelijk de Profeet. Anderen zeiden: Deze is de Christus. En anderen zeiden: Zal de Christus dan uit Galilea komen? Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Mark 8:7": "En zij hadden een paar visjes; en nadat Hij gezegend had, zei Hij dat zij die ook zouden voorleggen.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Ef 3:17": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent;", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Jes 50:7-10": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Jer 31:25": "Want Ik heb de vermoeide ziel dronken gemaakt, en Ik heb elke treurige ziel vervuld.", "Ps 44:24-27": "Waak op, waarom zou U slapen, Heere! Ontwaak, verstoot niet tot in eeuwigheid. Waarom zou U Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten? Want onze ziel is in het stof neergebogen; onze buik kleeft aan de aarde.", "Matt 17:17": "Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Ps 94:17-19": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond. Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij. Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "Ex 4:13": "Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.", "Hand 23:11": "En de volgende nacht stond de Heere bij hem en zei: Heb goede moed, Paulus, want zoals u in Jeruzalem van Mij getuigd hebt, zo moet u ook in Rome getuigen.", "Matt 14:3-12": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Ps 3:2": "O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.", "Mark 14:5": "Want die had voor meer dan driehonderd penningen verkocht kunnen worden, en dat geld aan de armen gegeven kunnen worden; en zij verweten het haar bitter.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Luk 4:22": "En zij gaven Hem allen getuigenis, en verwonderden zich over de aangename woorden die uit Zijn mond kwamen; en zeiden: Is dit niet de zoon van Jozef?", "Jer 32:16-25": "Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE: Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk. U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Joh 1:2": "Dit was in het begin bij God.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Matt 9:22": "En Jezus keerde Zich om, en toen Hij haar zag, zei Hij: Houd moed, dochter! Uw geloof heeft u behouden. En de vrouw werd op dat moment gezond.)", "Mark 5:7": "En met luide stem roepend, zei hij: Wat heb ik met U te maken, Jezus, Zoon van God, de Allerhoogste? Ik bezweer U bij God, dat U mij niet pijnigt!", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Luk 4:15": "En Hij leerde in hun synagogen, en werd door allen geprezen.", "Luk 5:26": "En verbazing had hen allen overweldigd, en zij verheerlijkten God, en werden vervuld met vrees, en zeiden: Wij hebben vandaag ongelooflijke dingen gezien.", "Joh 8:26-29": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld. Zij begrepen niet dat Hij tot hen over de Vader sprak. Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "Joh 14:31": "Maar opdat de wereld weet dat Ik de Vader liefheb, en zo doe zoals de Vader Mij geboden heeft. Sta op, laten wij vanhier gaan.", "1 Kon 8:31": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en hij hem een vloekeed opgelegd zal hebben, om zichzelf te vervloeken; en de vloekeed voor Uw altaar in dit huis komen zal;", "Matt 15:35": "En Hij gebood de menigten op de grond te gaan zitten.", "Matt 14:6-12": "Maar toen de verjaardag van Herodes gevierd werd, danste de dochter van Herodias in hun midden, en zij beviel Herodes. Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen. En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper.", "Spr 11:24": "Er is er een die uitstrooit, aan wie nog meer toegevoegd wordt; en een die meer inhoudt dan recht is, maar het leidt tot gebrek.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Joh 14:20": "Op die dag zult u weten dat Ik in Mijn Vader ben, en u in Mij, en Ik in u.", "Matt 15:28": "Toen antwoordde Jezus en zei tegen haar: O vrouw! groot is uw geloof; u geschiede zoals u wilt. En haar dochter werd gezond vanaf dat moment.", "Job 11:16-19": "Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is. Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "Luk 24:30": "En het gebeurde, terwijl Hij met hen aan tafel zat, dat Hij het brood nam, en het zegende, en toen Hij het gebroken had, gaf Hij het hun.", "Ef 4:28": "Wie gestolen heeft, moet niet meer stelen, maar moet liever arbeiden, terwijl hij met de handen doet wat goed is, opdat hij kan delen met hem die het nodig heeft.", "Joh 6:16-21": "En toen het avond geworden was, gingen Zijn discipelen naar de zee. En zij gingen in het schip, en voeren over de zee naar Kapernaüm. En het was al donker geworden, en Jezus was nog niet bij hen gekomen. En de zee werd onstuimig, doordat er een harde wind waaide.", "Mark 6:54-56": "En toen zij uit het schip gegaan waren, herkenden de mensen Hem meteen. En zij liepen het hele omliggende land door, en begonnen op draagbedden hen die ziek waren rond te dragen, naar de plaats waar zij hoorden dat Hij was. En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond.", "Luk 3:1": "En in het vijftiende jaar van de regering van keizer Tiberius, toen Pontius Pilatus stadhouder was over Judea, en Herodes viervorst over Galilea, en Filippus, zijn broer, viervorst over Iturea en over het land Trachonitis, en Lysanias viervorst over Abilene;", "Hebr 5:5": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "Luk 8:19-21": "En Zijn moeder en Zijn broers kwamen naar Hem toe, en konden niet bij Hem komen vanwege de menigte. En het werd Hem gemeld door enigen die zeiden: Uw moeder en Uw broers staan buiten en willen U zien. Maar Hij antwoordde en zei tegen hen: Mijn moeder en Mijn broers zijn zij die Gods Woord horen en het doen.", "Hebr 1:1-3": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon; Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft; Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Mark 8:1": "In diezelfde dagen, toen er een heel grote menigte was, en zij niets hadden om te eten, riep Jezus Zijn discipelen tot Zich, en zei tegen hen:", "Luk 13:17": "En toen Hij dit zei, werden allen die zich tegen Hem verzetten beschaamd; en heel de menigte verblijdde zich over al de heerlijke dingen die door Hem gebeurden.", "Luk 6:21-23": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen. Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen. Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Gen 31:42": "Als de God van mijn vader, de God van Abraham, en de Vreze van Izak, niet bij mij was geweest, dan had u mij zeker nu met lege handen weggezonden! God heeft mijn ellende, en de arbeid van mijn handen, gezien, en heeft u gisteravond bestraft.", "Ps 74:21-23": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen. Sta op, o God! Voer Uw eigen rechtszaak; denk aan de smaad die U de hele dag door de dwaas aangedaan wordt. Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.", "Luk 18:16": "Maar Jezus riep hen bij Zich en zei: Laat de kinderen tot Mij komen, en verhinder hen niet; want voor zulken is het Koninkrijk van God.", "1 Kor 15:27": "Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.", "Job 35:10": "Maar niemand zegt: Waar is God, mijn Maker, Die de lofzangen geeft in de nacht?", "Luk 23:47": "Toen de hoofdman over honderd zag wat er gebeurd was, verheerlijkte hij God en zei: Waarlijk, deze Mens was rechtvaardig.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Luk 9:10-17": "En de apostelen keerden terug en vertelden Hem alles wat zij gedaan hadden. En Hij nam hen mee en trok Zich met hen alleen terug naar een eenzame plaats bij de stad die Bethsaïda heet. Maar de menigten kwamen dit te weten en volgden Hem; en Hij ontving hen, en sprak tot hen over het Koninkrijk van God; en Hij maakte hen gezond die genezing nodig hadden. En de dag begon te dalen; en de twaalf kwamen naar Hem toe en zeiden tegen Hem: Stuur de menigte weg, zodat zij naar de omliggende dorpen en gehuchten kunnen gaan om onderdak te vinden en voedsel, want hier zijn wij op een eenzame plaats.", "2 Kon 4:1-7": "Een vrouw uit de vrouwen van de zonen der profeten riep tot Elisa en zei: Uw knecht, mijn man, is gestorven, en u weet dat uw knecht de HEERE was vrezende; nu is de schuldeiser gekomen om mijn beide kinderen voor zich tot knechten te nemen. En Elisa zei tegen haar: Wat zal ik voor u doen? Vertel mij wat u in het huis hebt. En zij zei: Uw dienares heeft helemaal niets in het huis, dan een kruik met olie. Toen zei hij: Ga, vraag voor u vaten van buiten, van al uw buren lege vaten; zorg dat het er niet weinig zijn.", "Mark 6:48": "En Hij zag dat zij zich zeer inspanden om het schip vooruit te krijgen; want de wind was hun tegen; en omstreeks de vierde nachtwake kwam Hij naar hen toe, lopend op de zee, en Hij wilde hen voorbijgaan.", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "Matt 9:18": "Terwijl Hij deze dingen tegen hen sprak, zie, kwam er een leider en aanbad Hem, en zei: Mijn dochter is nu net gestorven, maar kom en leg Uw hand op haar, en zij zal leven.", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "2 Kon 6:31-33": "En hij zei: Zo doe God mij, en doe zo daartoe, als het hoofd van Elisa, de zoon van Safat, vandaag op hem zal blijven staan! (Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem? Terwijl hij nog met hen sprak, zie, zo kwam de bode bij hem af; en hij zei: Zie, dit kwaad is van de HEERE; wat zou ik nog langer op de HEERE wachten?", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "Luk 9:28": "En het gebeurde ongeveer acht dagen na deze woorden, dat Hij Petrus, Johannes en Jakobus meenam en de berg opklom om te bidden.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Joh 11:4": "En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.", "Matt 14:29-31": "En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen. Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij! En Jezus stak meteen Zijn hand uit, greep hem vast, en zei tegen hem: Kleingelovige! Waarom heb je getwijfeld?", "Luk 9:40": "En ik heb Uw discipelen gevraagd hem uit te werpen, en zij konden het niet.", "Matt 15:26-28": "Maar Hij antwoordde en zei: Het is niet betamelijk het brood van de kinderen te nemen, en het aan de hondjes voor te werpen. En zij zei: Ja, Heere! maar de hondjes eten ook van de brokjes die van de tafel van hun heren vallen. Toen antwoordde Jezus en zei tegen haar: O vrouw! groot is uw geloof; u geschiede zoals u wilt. En haar dochter werd gezond vanaf dat moment.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Jes 51:3-13": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang. Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "1 Sam 22:4": "En hij bracht hen voor het aangezicht van de koning van de Moabieten; en zij bleven bij hem al de dagen dat David in de vesting was.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "Matt 11:28": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven.", "Matt 3:5": "Toen liep Jeruzalem naar hem uit, en heel Judea, en heel het land rondom de Jordaan;", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Klaagl 3:18": "Vau. Toen zei ik: Mijn sterkte is vergaan, en mijn hoop van de HEERE.", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Matt 14:28-31": "En Petrus antwoordde Hem, en zei: Heere! Als U het bent, gebied mij dan tot U te komen op het water. En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen. Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "Luk 9:29": "En terwijl Hij bad, veranderde het aanzien van Zijn gezicht, en Zijn kleding werd wit en schitterend.", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Hebr 6:19": "welke hoop wij hebben als een anker van de ziel, dat zeker en vast is, en dat ingaat in het binnenste van het voorhangsel;", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Joh 15:23": "Die Mij haat, die haat ook Mijn Vader.", "1 Sam 10:3": "Als u van daar verder gaat, en komt tot bij Elon-thabor, zullen u daar drie mannen vinden, die opgaan naar God, naar Beth-el; een die drie bokjes draagt, en een die drie broden draagt, en een die een fles wijn draagt.", "Luk 4:42": "En toen het dag werd, ging Hij weg en trok naar een woeste plaats; en de menigten zochten Hem, en kwamen naar Hem toe, en hielden Hem tegen, opdat Hij niet van hen weg zou gaan.", "Gen 15:8": "En hij zei: Heere HEERE, waarbij zal ik weten dat ik het erfelijk bezitten zal?", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Ps 28:1": "Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.", "Job 30:21": "U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "Openb 2:9": "Ik weet uw werken, en verdrukking, en armoede (maar u bent rijk), en de lastering van hen die zeggen dat zij Joden zijn, en zijn het niet, maar zijn een synagoge van de satan.", "2 Kor 8:3": "Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Mark 1:31": "En Hij ging naar haar toe, pakte haar hand, en richtte haar op; en meteen verliet de koorts haar, en zij diende hen.", "Deut 10:20": "De HEERE, uw God, zult u vrezen; Hem zult u dienen, en Hem zult u aanhangen, en bij Zijn Naam zweren.", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Luk 13:32": "En Hij zei tegen hen: Ga en zeg tegen die vos: Zie, Ik drijf duivelen uit en maak gezond, vandaag en morgen, en op de derde dag kom Ik tot mijn einde.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Job 16:5": "Ik zou u versterken met mijn mond, en de beweging van mijn lippen zou de smart verzachten.", "Joh 19:12-16": "Van toen af zocht Pilatus Hem los te laten; maar de Joden riepen: Als u Deze loslaat, bent u geen vriend van de keizer; ieder die zichzelf koning maakt, weerspreekt de keizer. Toen Pilatus dan dit woord hoorde, bracht hij Jezus naar buiten, en ging zitten op de rechterstoel, op de plaats genaamd Lithostrotos, en in het Hebreeuws Gabbatha. En het was de voorbereiding van het pascha, en ongeveer het zesde uur; en hij zei tegen de Joden: Zie, uw Koning!", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Matt 17:14-21": "En toen zij bij de menigte gekomen waren, kwam er iemand naar Hem toe, die voor Hem op de knieën viel en zei: Heere, ontferm U over mijn zoon, want hij is maanziek en lijdt zwaar; want vaak valt hij in het vuur, en vaak in het water. En ik heb hem naar Uw discipelen gebracht, maar zij hebben hem niet kunnen genezen.", "Matt 8:1": "Toen Hij van de berg afgeklommen was, volgden vele menigten Hem.", "Mark 8:8": "En zij aten, en werden verzadigd, en zij verzamelden het overschot van de stukken, zeven manden.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Ps 56:9-11": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register? Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is. In God zal ik het woord prijzen; in de HEERE zal ik het woord prijzen.", "Joh 12:34": "De menigte antwoordde Hem: Wij hebben uit de wet gehoord dat de Christus blijft tot in eeuwigheid; en hoe zegt U dat de Zoon des mensen verhoogd moet worden? Wie is deze Zoon des mensen?", "1 Joh 5:4": "Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning die de wereld overwint, namelijk ons geloof.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "2 Kron 6:24-39": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Luk 13:1": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had.", "Rom 3:22-28": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid. Want zij hebben allen gezondigd, en missen de heerlijkheid van God; en worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing die in Christus Jezus is;", "Mark 8:11": "En de Farizeeën gingen naar buiten, en begonnen met Hem te twisten, en verlangden van Hem een teken uit de hemel, om Hem op de proef te stellen.", "Hand 1:24": "En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,", "Luk 8:22-25": "En het gebeurde op een van die dagen dat Hij in een schip ging, met Zijn discipelen; en Hij zei tegen hen: Laten wij overvaren naar de andere kant van het meer. En zij staken van wal. En terwijl zij voeren, viel Hij in slaap; en er stak een stormwind op over het meer, en het schip liep vol water, en zij waren in nood. En zij gingen naar Hem toe en wekten Hem, en zeiden: Meester, Meester, wij vergaan! En Hij stond op en bestrafte de wind en de golven, en zij hielden op, en het werd stil.", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Ps 55:2-18": "O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking. Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier; Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Luk 9:12": "En de dag begon te dalen; en de twaalf kwamen naar Hem toe en zeiden tegen Hem: Stuur de menigte weg, zodat zij naar de omliggende dorpen en gehuchten kunnen gaan om onderdak te vinden en voedsel, want hier zijn wij op een eenzame plaats.", "Klaagl 5:1": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan.", "Ex 5:22": "Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Matt 16:16": "En Simon Petrus antwoordde en zei: U bent de Christus, de Zoon van de levende God.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Matt 14:22-33": "En meteen dwong Jezus Zijn discipelen om in het schip te gaan, en voor Hem uit te varen naar de andere kant, terwijl Hij de menigten van Zich zou laten gaan. En toen Hij de menigten van Zich had laten gaan, klom Hij de berg op, alleen, om te bidden. En toen het avond was geworden, was Hij daar alleen. En het schip was al midden op de zee, in nood door de golven; want de wind was hun tegen.", "Hebr 7:3": "zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Mark 6:17": "Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had.", "Matt 15:36": "En Hij nam de zeven broden en de vissen, en nadat Hij gedankt had, brak Hij ze, en gaf ze aan Zijn discipelen; en de discipelen gaven ze aan de menigte.", "Hebr 13:7": "Denk aan uw voorgangers, die u het Woord van God gesproken hebben; en volg hun geloof na, terwijl u de uitkomst van hun wandel aanschouwt.", "Mark 9:14-29": "En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?", "Mark 2:15": "En het gebeurde, terwijl Hij in Zijn huis aanzat, dat er ook veel tollenaars en zondaars mee aanzaten met Jezus en Zijn discipelen; want er waren er velen, en zij waren Hem gevolgd.", "Ps 119:170": "Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.", "Klaagl 3:54-57": "Tsade. Het water zwom over mijn hoofd; ik zei: Ik ben afgesneden! Koph. HEERE! Ik heb Uw Naam aangeroepen uit de onderste kuil. Koph. U hebt mijn stem gehoord, verberg Uw oor niet voor mijn zuchten, voor mijn roepen.", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Ps 142:6-8": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "2 Kor 5:13": "Want hetzij dat wij uitzinnig zijn, wij zijn het voor God; hetzij dat wij bezonnen zijn, wij zijn het voor u.", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Mark 6:31": "En Hij zei tegen hen: Kom zelf mee naar een eenzame plaats, alleen, en rust wat uit; want er waren velen die kwamen en gingen, en zij hadden zelfs geen tijd om te eten.", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "Mark 6:21": "En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea;", "Mark 14:38": "Waak en bid, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Jer 45:3": "U zegt: Wee mij nu, want de HEERE heeft droefheid aan mijn smart toegevoegd; ik ben moe van mijn zuchten, en vind geen rust!", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Mark 11:32": "Maar als wij zeggen: Uit de mensen; dan zijn wij bang voor het volk; want zij hielden allen Johannes voor een echte profeet.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Ex 22:10": "Wanneer iemand aan zijn naaste een ezel, of os, of klein vee, of enig ander dier geeft om te bewaren, en het sterft, of het raakt gewond, of het wordt weggedreven, zonder dat iemand het ziet,", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Joh 9:38": "En hij zei: Ik geloof, Heere! En hij aanbad Hem.", "Joh 20:28": "En Thomas antwoordde en zei tegen Hem: Mijn Heere en mijn God!", "1 Petr 2:21-24": "Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen; Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden; Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "Joh 14:12": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader.", "Gen 16:7-13": "En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur. En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai! Toen zei de Engel van de HEERE tegen haar: Keer terug naar uw meesteres, en verneder u onder haar handen.", "Est 1:9": "De koningin Vasthi gaf ook een maaltijd voor de vrouwen in het koninklijk huis van de koning Ahasveros.", "Mark 11:8-10": "En velen spreidden hun kleren op de weg, en anderen hakten takken van de bomen, en spreidden ze op de weg. En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere! Gezegend zij het Koninkrijk van onze vader David, dat komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Matt 26:36": "Toen ging Jezus met hen naar een plaats genaamd Gethsémané, en zei tegen de discipelen: Blijft hier zitten, totdat Ik weggegaan ben en daar gebeden heb.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Luk 19:36-38": "En terwijl Hij verder reisde, spreidden zij hun kleren op de weg. En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden, en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "2 Kron 22:2": "Ahazia was tweeënveertig jaar oud toen hij koning werd, en hij regeerde een jaar in Jeruzalem; en de naam van zijn moeder was Athalia, een dochter van Omri.", "Joh 11:34-38": "en Hij zei: Waar hebt u hem gelegd? Zij zeiden tegen Hem: Heere, kom en zie het. Jezus weende. De Joden dan zeiden: Zie, hoe lief Hij hem had!", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Mark 7:37": "En zij waren bovenmate verbaasd, en zeiden: Hij heeft alles goed gedaan, en Hij maakt dat de doven horen, en de stommen spreken.", "Jak 1:6-8": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt. Want laat die mens niet menen dat hij iets ontvangen zal van de Heere. Een dubbelhartig man is onstandvastig in al zijn wegen.", "Joh 20:29": "Jezus zei tegen hem: Omdat u Mij gezien hebt, Thomas, gelooft u; zalig zijn zij die niet gezien zullen hebben, en toch zullen geloven.", "Openb 10:2": "En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde.", "Joh 1:35-41": "De volgende dag stond Johannes er weer, en twee van zijn discipelen. En terwijl hij zijn ogen op Jezus richtte, Die daar liep, zei hij: Zie, het Lam van God! En die twee discipelen hoorden hem dat zeggen, en zij volgden Jezus.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Mark 14:2": "Maar zij zeiden: Niet tijdens het feest, anders zou er misschien oproer onder het volk ontstaan.", "Matt 18:11-13": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Matt 16:15-17": "Hij zei tegen hen: Maar u, wie zegt u dat Ik ben? En Simon Petrus antwoordde en zei: U bent de Christus, de Zoon van de levende God. En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Joh 6:38": "Want Ik ben uit de hemel neergedaald, niet om Mijn eigen wil te doen, maar de wil van Hem die Mij gezonden heeft.", "Ps 72:15": "En hij zal leven; en men zal hem geven van het goud van Scheba, en men zal voortdurend voor hem bidden; de hele dag zal men hem zegenen.", "Luk 22:41-44": "En Hij trok Zich van hen terug, ongeveer een steenworp ver, en knielde neer en bad, en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede. En van Hem werd een engel uit de hemel gezien, die Hem versterkte.", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Ezech 16:3": "en zeg: Zo zegt de Heere HEERE tot Jeruzalem: Uw oorsprong en uw geboorte zijn uit het land van de Kanaänieten; uw vader was een Amoriet en uw moeder een Hethitische.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Matt 17:20": "En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "Joh 6:1-14": "Hierna vertrok Jezus over de zee van Galilea, ook wel de zee van Tiberias genoemd. En een grote menigte volgde Hem, omdat zij Zijn tekenen zagen, die Hij deed aan de zieken. En Jezus ging de berg op, en zat daar neer met Zijn discipelen.", "Joh 17:15": "Ik bid niet dat U hen uit de wereld wegneemt, maar dat U hen bewaart voor de boze.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Luk 9:7-9": "En Herodes, de viervorst, hoorde alles wat er door Hem gebeurde; en hij wist niet wat hij ervan moest denken, omdat sommigen zeiden dat Johannes uit de doden was opgestaan, en anderen, dat Elia verschenen was; en weer anderen, dat een van de profeten van vroeger was opgestaan. En Herodes zei: Johannes heb ik onthoofd; wie is Deze dan, van Wie ik zulke dingen hoor? En hij probeerde Hem te zien.", "Luk 23:8-12": "En toen Herodes Jezus zag, werd hij zeer verblijd; want hij was al geruime tijd begerig geweest Hem te zien, omdat hij veel over Hem hoorde; en hij hoopte een of ander teken te zien dat door Hem gedaan zou worden. En hij ondervroeg Hem met veel woorden; maar Hij antwoordde hem niets. En de overpriesters en de schriftgeleerden stonden erbij en beschuldigden Hem heftig.", "Luk 1:12": "En Zacharias, die hem zag, schrok hevig, en er viel vrees op hem.", "Matt 26:63": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.", "Joh 16:28": "Ik ben van de Vader uitgegaan, en ben in de wereld gekomen; opnieuw verlaat Ik de wereld, en ga heen tot de Vader.", "Luk 11:16": "En anderen, om Hem te verzoeken, verlangden van Hem een teken uit de hemel.", "Joh 20:17": "Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.", "Luk 3:18-20": "Hij vermaande dan ook nog met veel andere dingen, en verkondigde aan het volk het Evangelie. Maar toen Herodes, de viervorst, door hem bestraft werd vanwege Herodias, de vrouw van Filippus, zijn broer, en vanwege alle slechte dingen die Herodes gedaan had, voegde hij daar bovenop ook nog dit aan toe, dat hij Johannes in de gevangenis opsloot.", "Luk 6:19": "En de hele menigte probeerde Hem aan te raken; want er ging kracht van Hem uit, en Hij genas hen allen.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Luk 7:3-9": "En toen hij over Jezus gehoord had, zond hij de oudsten van de Joden naar Hem toe, en vroeg Hem dringend of Hij wilde komen om zijn dienstknecht gezond te maken. Zij nu, bij Jezus gekomen, smeekten Hem met ernst, en zeiden: Hij is het waard dat U dit voor hem doet; want hij heeft ons volk lief, en heeft zelf de synagoge voor ons gebouwd.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Luk 7:13": "En de Heere, haar ziende, werd innerlijk met ontferming over haar bewogen, en zei tegen haar: Huil niet.", "Luk 9:10": "En de apostelen keerden terug en vertelden Hem alles wat zij gedaan hadden. En Hij nam hen mee en trok Zich met hen alleen terug naar een eenzame plaats bij de stad die Bethsaïda heet.", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "Jes 50:4": "De Heere HEERE heeft Mij een tong van de geleerden gegeven, opdat Ik weet met de moede een woord op de juiste tijd te spreken; Hij wekt elke morgen, Hij wekt Mijn oor, opdat Ik hoor, zoals wie geleerd worden.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Joh 11:26": "en ieder die leeft en in Mij gelooft, zal niet sterven in eeuwigheid. Gelooft u dat?", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Hand 11:17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "Dan 6:15-17": "Toen de koning dit hoorde, was hij zeer bedroefd bij zichzelf, en hij zette zijn hart op Daniël om hem te verlossen; ja, tot aan zonsondergang toe deed hij moeite om hem te redden. Toen kwamen die mannen met elkaar bijeen bij de koning, en zij zeiden tegen de koning: Weet, o koning, dat het de wet van de Meden en de Perzen is, dat geen gebod of verordening die de koning heeft ingesteld, veranderd mag worden. Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "Hand 12:5": "Petrus dan werd in de gevangenis bewaakt; maar door de gemeente werd voortdurend tot God voor hem gebeden.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Matt 19:13": "Toen werden kinderen tot Hem gebracht, opdat Hij de handen op hen zou leggen en bidden; en de discipelen bestraften hen.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "1 Kon 17:5": "Hij ging dan heen, en deed naar het woord van de HEERE; want hij ging en woonde bij de beek Krith, die voor de Jordaan ligt.", "Spr 31:27": "Tsade. Zij houdt toezicht op de gangen van haar huis; en het brood van de luiheid eet zij niet.", "Mark 8:16-21": "En zij overlegden onder elkaar, en zeiden: Dit is omdat wij geen brood hebben. En Jezus, die dit besefte, zei tegen hen: Waarom overlegt u, dat u geen brood hebt? Merkt u het nog niet, en begrijpt u het niet? Is uw hart nog verhard? Ogen hebbend, ziet u niet? En oren hebbend, hoort u niet?", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Joh 13:23": "En een van Zijn discipelen, die Jezus liefhad, lag aan tafel dicht bij Jezus.", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "Job 1:5": "Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt. Zo deed Job al die dagen.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Richt 11:31": "dan zal het zo zijn, dat wat uit de deur van mijn huis mij tegemoet komt, wanneer ik in vrede terugkeer van de kinderen van Ammon, dat zal van de HEERE zijn, en ik zal het offeren als brandoffer.", "Mark 8:6": "En Hij gebood de menigte op de grond te gaan zitten; en Hij nam de zeven broden, en nadat Hij gedankt had, brak Hij ze, en gaf ze aan Zijn discipelen, opdat zij ze zouden voorleggen; en zij legden ze de menigte voor.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Mark 6:35-44": "En toen het al laat op de dag geworden was, kwamen Zijn discipelen naar Hem toe, en zeiden: Dit is een eenzame plaats, en het is al laat op de dag; Stuur hen weg, opdat zij naar de omliggende dorpen en plaatsen gaan en brood voor zichzelf kunnen kopen; want zij hebben niets om te eten. Maar Hij antwoordde en zei tegen hen: Geeft u hun te eten. En zij zeiden tegen Hem: Zullen wij weggaan en voor tweehonderd penningen brood kopen, en hun te eten geven?", "Ps 69:2": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Matt 8:24-32": "En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep. En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan! En Hij zei tegen hen: Waarom bent u angstig, kleingelovigen? Toen stond Hij op, en bestrafte de winden en de zee; en er kwam een grote stilte.", "Jes 30:20": "De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Job 29:25": "Koos ik hun weg, dan zat ik bovenaan, en woonde als een koning onder de troepen, als iemand die treurenden vertroost.", "Luk 7:21": "En op datzelfde uur genas Hij velen van ziekten en kwalen en boze geesten; en aan veel blinden gaf Hij het gezicht terug.", "Joh 18:25-27": "En Simon Petrus stond daar en warmde zich. Zij zeiden dan tegen hem: Bent u ook niet een van Zijn discipelen? Hij ontkende het en zei: Ik ben het niet. Een van de dienstknechten van de hogepriester, die familie was van hem die Petrus het oor afgehakt had, zei: Heb ik u niet in de hof gezien met Hem? Petrus ontkende het dan opnieuw. En meteen kraaide de haan.", "Jer 5:7": "Hoe zou Ik u om deze dingen vergeven? Uw kinderen hebben Mij verlaten, en zweren bij hen die geen God zijn; toen Ik hen verzadigd had, bedreven zij overspel, en verzamelden zich in troepen in het hoerenhuis.", "Luk 22:32": "maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders.", "Num 11:21": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten!", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Matt 27:3-5": "Toen Judas, die Hem verraden had, zag dat Hij veroordeeld was, kreeg hij berouw en heeft hij de dertig zilverstukken aan de overpriesters en de oudsten teruggebracht, en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien. En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Est 1:2-9": "in die dagen, toen de koning Ahasveros op de troon van zijn koninkrijk zat, die op de burcht Susan was, in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig. Hij liet daarbij de rijkdom van de heerlijkheid van zijn koninkrijk zien, en de kostbaarheid van het sieraad van zijn grootheid, vele dagen lang: honderdtachtig dagen.", "Hand 2:37": "En toen zij dit hoorden, werden zij diep in het hart getroffen, en zeiden tegen Petrus en de andere apostelen: Wat moeten wij doen, mannen broeders?", "Matt 7:28": "En het gebeurde, toen Jezus deze woorden geëindigd had, dat de menigten versteld stonden over Zijn onderwijs;", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Joh 13:36-38": "Simon Petrus zei tegen Hem: Heere, waar gaat U heen? Jezus antwoordde hem: Waar Ik heenga, kunt u Mij nu niet volgen; maar u zult Mij later volgen. Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven. Jezus antwoordde hem: Zult u uw leven voor Mij geven? Voorwaar, voorwaar, Ik zeg u: De haan zal niet kraaien, totdat u Mij driemaal verloochend zult hebben.", "Luk 18:42": "En Jezus zei tegen hem: Word ziende; uw geloof heeft u behouden.", "Ezech 19:2": "en zeg: Wat was uw moeder? Een leeuwin, die onder de leeuwen neerlag; zij bracht haar welpen groot te midden van de jonge leeuwen.", "Mark 15:39": "En de hoofdman over honderd, die daarbij tegenover Hem stond, zag dat Hij zo roepend de geest gegeven had, en zei: Werkelijk, deze Mens was Gods Zoon!", "Mark 16:10": "Zij ging heen, en vertelde het aan hen die met Hem geweest waren, die treurden en weenden.", "Joh 7:31": "En velen uit de menigte geloofden in Hem en zeiden: Zal de Christus, wanneer Hij gekomen zal zijn, meer tekenen doen dan deze, die Deze gedaan heeft?", "Matt 16:8": "En Jezus, die dit wist, zei tegen hen: Wat overlegt u bij uzelf, kleingelovigen, dat u geen brood meegenomen hebt?", "Joh 6:20": "Maar Hij zei tegen hen: Ik ben het; wees niet bang.", "1 Kon 17:6": "En de raven brachten hem 's morgens brood en vlees, en zo ook brood en vlees 's avonds; en hij dronk uit de beek.", "Mark 6:17-19": "Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben. En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;", "1 Tim 1:12": "En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft;", "Hebr 6:16": "Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak;", "Mark 6:21-23": "En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea; en toen de dochter van deze Herodias binnenkwam en danste, en Herodes en hen die mee aanzaten behaagde, zei de koning tegen het meisje: Vraag mij wat u maar wilt, en ik zal het u geven. En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, zelfs tot de helft van mijn koninkrijk!", "Matt 28:16": "En de elf discipelen gingen naar Galilea, naar de berg waar Jezus hen had aangewezen.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Gen 18:12-14": "Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is? En de HEERE zei tegen Abraham: Waarom heeft Sara gelachen en gezegd: Zou ik werkelijk nog een kind baren, nu ik oud geworden ben? Zou iets voor de HEERE te wonderlijk zijn? Op de vastgestelde tijd zal Ik bij u terugkomen, omstreeks deze tijd volgend jaar, en Sara zal een zoon hebben!", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "Pred 8:2": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Hand 10:38": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Mark 6:33": "En de menigten zagen hen weggaan, en velen herkenden Hem, en liepen gezamenlijk te voet van alle steden daarheen, en kwamen hun voor, en kwamen samen naar Hem toe.", "Hebr 5:8": "Hoewel Hij de Zoon was, heeft Hij toch gehoorzaamheid geleerd uit wat Hij geleden heeft.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Ex 3:11": "Toen zei Mozes tegen God: Wie ben ik, dat ik naar Farao zou gaan; en dat ik de kinderen van Israël uit Egypte zou voeren?", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Joh 6:57": "Zoals de levende Vader Mij gezonden heeft, en Ik leef door de Vader; zo zal ook wie Mij eet, leven door Mij.", "Luk 24:5": "En toen zij zeer bevreesd werden en het gezicht naar de aarde neigden, zeiden zij tegen hen: Wat zoekt u de Levende bij de doden?", "Lev 6:2-5": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "Hos 1:5": "En het zal op die dag gebeuren, dat Ik de boog van Israël zal breken, in het dal van Jizreël.", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Joh 5:27": "en Hij heeft Hem macht gegeven om ook gericht te houden, omdat Hij de Zoon des mensen is.", "Joz 5:14": "En Hij zei: Nee, maar Ik ben de Vorst van het leger van de HEERE: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zei tegen Hem: Wat spreekt mijn Heere tegen Zijn knecht?", "1 Joh 2:22-24": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent. Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader. Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "Mark 6:22": "en toen de dochter van deze Herodias binnenkwam en danste, en Herodes en hen die mee aanzaten behaagde, zei de koning tegen het meisje: Vraag mij wat u maar wilt, en ik zal het u geven.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Ps 107:27-30": "Zij dansen en waggelen als een dronken man, en al hun wijsheid wordt verslonden. Toen riepen zij tot de HEERE in de benauwdheid die zij had
