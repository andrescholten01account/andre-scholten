den, en Hij voerde hen uit hun angsten. Hij doet de storm stilstaan, zodat hun golven zwijgen.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Matt 4:24": "En het nieuws over Hem verspreidde zich door heel Syrië; en men bracht bij Hem allen die er slecht aan toe waren, met allerlei ziekten en pijnen bevangen, en van de duivel bezetenen, en maanzieken en verlamden; en Hij genas hen.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Luk 9:7": "En Herodes, de viervorst, hoorde alles wat er door Hem gebeurde; en hij wist niet wat hij ervan moest denken, omdat sommigen zeiden dat Johannes uit de doden was opgestaan,", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "Mark 4:37-39": "En er kwam een grote storm van wind, en de golven sloegen over in het schip, zodat het al vol werd. En Hij lag in het achterschip te slapen op een kussen; en zij maakten Hem wakker, en zeiden tegen Hem: Meester, kan het U niet schelen dat wij vergaan? En Hij, wakker geworden, bestrafte de wind, en zei tegen de zee: Zwijg, wees stil! En de wind ging liggen, en er kwam grote stilte.", "Mark 6:46": "En nadat Hij hun afscheid gegeven had, ging Hij de berg op om te bidden.", "Joh 12:42": "Toch geloofden ook zelfs velen van de leiders in Hem; maar om de Farizeeën beleden zij het niet, opdat zij niet uit de synagoge geworpen zouden worden.", "Mark 1:37": "En toen zij Hem gevonden hadden, zeiden zij tegen Hem: Iedereen zoekt U.", "Neh 12:9": "En Bakbukja, en Unni, hun broeders, waren tegenover hen bij de wachten.", "2 Kor 8:2": "Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid.", "Pred 4:1": "Daarna richtte ik mijn aandacht en zag alle onderdrukkingen die onder de zon gebeuren; en zie, er waren de tranen van de verdrukten, en van hen die geen trooster hadden; en aan de kant van hun verdrukkers was macht, zij daarentegen hadden geen trooster.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Openb 7:14-17": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam. Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen. Zij zullen niet meer hongeren, en zullen niet meer dorsten, en de zon zal niet meer op hen vallen, of enige hitte.", "Mark 6:2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "1 Kor 10:16": "De drinkbeker der dankzegging, die wij zegenen met dankzegging, is die niet een gemeenschap met het bloed van Christus? Het brood dat wij breken, is dat niet een gemeenschap met het lichaam van Christus?", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Mark 9:24": "En meteen riep de vader van het kind met tranen: Ik geloof, Heere! Kom mijn ongeloof te hulp.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "1 Sam 25:22": "Zo doet God aan de vijanden van David, en zo doet Hij daar nog aan toe, als ik van allen die hij heeft iets tot morgen overlaat dat mannelijk is!", "Joh 18:9": "Zodat het woord vervuld zou worden dat Hij gezegd had: Van hen die U Mij gegeven hebt, heb Ik niemand verloren.", "1 Sam 14:28": "Toen antwoordde iemand uit het volk en zei: Uw vader heeft het volk streng bezworen en gezegd: Vervloekt is de man die vandaag brood eet! Daarom bezwijkt het volk.", "Joh 14:8-11": "Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg. Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Matt 15:37": "En zij aten allen en werden verzadigd, en zij verzamelden het overschot van de brokken, zeven volle manden.", "Hand 4:27": "Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "Mark 16:11": "En toen dezen hoorden dat Hij leefde, en door haar gezien was, geloofden zij het niet.", "Joh 8:16": "En als Ik toch oordeel, is Mijn oordeel waar; want Ik ben niet alleen, maar Ik en de Vader, Die Mij gezonden heeft.", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Joh 11:32": "Maria dan, toen zij kwam waar Jezus was, en Hem zag, viel aan Zijn voeten, en zei tegen Hem: Heere, als U hier geweest was, zou mijn broeder niet gestorven zijn.", "Openb 5:12-14": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging. En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid. En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Matt 14:34-36": "En toen zij overgevaren waren, kwamen zij in het land Gennesaret. En toen de mannen van die plaats Hem herkenden, stuurden zij berichten naar dat hele omliggende gebied, en zij brachten naar Hem toe allen die ziek waren; en zij smeekten Hem dat zij alleen de zoom van Zijn kleed zouden mogen aanraken; en zovelen als Hem aanraakten, werden gezond.", "Hand 16:31": "En zij zeiden: Geloof in de Heere Jezus Christus, en u zult zalig worden, u en uw huis.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Hand 9:14": "en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.", "Matt 16:8-11": "En Jezus, die dit wist, zei tegen hen: Wat overlegt u bij uzelf, kleingelovigen, dat u geen brood meegenomen hebt? Begrijpt u nog niet, en herinnert u zich niet de vijf broden van de vijfduizend mannen, en hoeveel korven u opnam? Ook niet de zeven broden van de vierduizend mannen, en hoeveel manden u opnam?", "Joh 9:35-37": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God? Hij antwoordde en zei: Wie is Hij, Heere, opdat ik in Hem geloven kan? En Jezus zei tegen hem: U hebt Hem gezien, en Hij die met u spreekt, Die is het.", "Gen 20:2": "Toen Abraham nu van Sara, zijn vrouw, gezegd had: Zij is mijn zuster, stuurde Abimelech, de koning van Gerar, iemand en nam Sara weg.", "Luk 3:21": "En het gebeurde, toen al het volk gedoopt werd, dat ook Jezus gedoopt werd, en bad, dat de hemel geopend werd;", "Ps 73:21": "Toen mijn hart verbitterd was, en ik in mijn nieren geprikkeld werd,", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Hebr 6:6": "en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "Hand 4:9": "Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is;", "Mark 6:18": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "2 Kor 1:23": "Maar ik roep God aan tot Getuige over mijn ziel, dat ik, om u te sparen, nog niet naar Korinthe gekomen ben.", "Mark 6:52": "Want zij hadden het wonder van de broden niet begrepen; want hun hart was verhard.", "Mark 6:24-28": "En zij ging naar buiten en zei tegen haar moeder: Wat zal ik vragen? En die zei: Het hoofd van Johannes de Doper. En zij ging meteen haastig naar de koning, en vroeg het, en zei: Ik wil dat u mij nu meteen op een schotel het hoofd van Johannes de Doper geeft. En de koning werd zeer bedroefd, maar toch, vanwege de eden en degenen die mee aanzaten, wilde hij haar dat niet weigeren.", "Matt 14:17-21": "Maar zij zeiden tegen Hem: Wij hebben hier niets dan vijf broden en twee vissen. En Hij zei: Brengt Mij die hier. En Hij beval de menigten neer te zitten op het gras, en nam de vijf broden en de twee vissen, en Hij keek op naar de hemel, zegende ze; en toen Hij ze gebroken had, gaf Hij de broden aan de discipelen, en de discipelen aan de menigten.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Joh 11:37": "En sommigen van hen zeiden: Kon Hij, Die de ogen van de blinde geopend heeft, niet maken dat ook deze niet gestorven was?", "Matt 14:7-9": "Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen. En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper. En de koning werd bedroefd; maar vanwege de eden, en degenen die met hem aanzaten, gebood hij dat het haar gegeven zou worden;", "Matt 5:10-12": "Zalig zijn zij die vervolgd worden om de gerechtigheid, want hun is het Koninkrijk der hemelen. Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij. Verblijd en verheug u, want uw loon is groot in de hemelen; want zo hebben zij de profeten vervolgd die vóór u geweest zijn.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Hand 19:11": "En God deed ongewone krachten door de handen van Paulus,", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Joh 6:19": "Toen zij dan ongeveer vijfentwintig of dertig stadiën gevaren hadden, zagen zij Jezus lopen op de zee en dicht bij het schip komen; en zij werden bang.", "1 Sam 9:13": "Wanneer u de stad in komt, zult u hem meteen vinden, voordat hij naar de hoogte gaat om te eten; want het volk zal niet eten totdat hij komt, want hij zegent het offer, en daarna eten de genodigden; ga daarom nu naar boven, want juist nu zult u hem vinden.", "Jes 14:31": "Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "Mark 5:36": "En Jezus, die meteen het woord hoorde dat er gesproken werd, zei tegen de leider van de synagoge: Vrees niet; geloof alleen.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Luk 22:49": "En zij die bij Hem waren, zagen wat er zou gebeuren, en zeiden tegen Hem: Heere, zullen wij met het zwaard slaan?", "Jes 49:14": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten.", "Hand 24:23-27": "En hij beval de hoofdman over honderd, dat Paulus bewaard zou worden, en verlichting zou hebben, en dat hij niemand van de zijnen zou beletten hem te dienen, of naar hem toe te komen. En na enige dagen kwam Felix daar met Drusilla, zijn vrouw, die een Jodin was, en hij liet Paulus halen, en hoorde hem over het geloof in Christus. En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen.", "Openb 17:6": "En ik zag dat de vrouw dronken was van het bloed van de heiligen, en van het bloed van de getuigen van Jezus. En ik verwonderde mij, toen ik haar zag, met grote verwondering.", "Hebr 4:14": "Omdat wij dan een grote Hogepriester hebben, Die door de hemelen heen gegaan is, namelijk Jezus, de Zoon van God, laat ons deze belijdenis vasthouden.", "Spr 11:16": "Een aangename vrouw houdt de eer vast, zoals sterke mannen de rijkdom vasthouden.", "Rom 7:26": "Zo dan, ik zelf dien wel met het gemoed de wet van God, maar met het vlees de wet van de zonde.", "Matt 21:36": "Weer stuurde hij andere dienstknechten, meer in aantal dan de eersten, en zij deden hun hetzelfde.", "Matt 2:16": "Toen Herodes zag dat hij door de wijzen bedrogen was, werd hij zeer toornig, en na enigen uitgezonden te hebben, bracht hij al de kinderen om die binnen Bethlehem en in heel dat gebied waren, van twee jaar oud en daaronder, overeenkomstig de tijd die hij van de wijzen nauwkeurig had nagevraagd.", "Matt 14:6-8": "Maar toen de verjaardag van Herodes gevierd werd, danste de dochter van Herodias in hun midden, en zij beviel Herodes. Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen. En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper.", "Est 1:8": "En het drinken gebeurde volgens de regel, dat niemand dwong; want zo had de koning het vast bevolen aan alle leiders van zijn huis, dat zij zouden doen naar de wil van ieder.", "Richt 7:19": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk.", "Ef 5:29": "Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente.", "Mark 1:1": "Het begin van het Evangelie van JEZUS CHRISTUS, de Zoon van God.", "Joh 10:14-16": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend. Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen. Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Num 7:19": "Hij bracht zijn offergave: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Joh 1:51": "Jezus antwoordde en zei tegen hem: Omdat Ik u gezegd heb: Ik zag u onder de vijgenboom, gelooft u; u zult grotere dingen zien dan deze.", "Joh 11:45-48": "Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem. Maar sommigen van hen gingen naar de Farizeeën, en vertelden hun wat Jezus gedaan had. De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen.", "Gal 5:6": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar het geloof, dat door de liefde werkt.", "Joh 9:25": "Hij dan antwoordde en zei: Of Hij een zondaar is, weet ik niet; één ding weet ik, dat ik blind was en nu zie.", "Rom 7:24": "Ik, ellendig mens, wie zal mij verlossen uit het lichaam van deze dood?", "Hand 4:21": "Maar zij dreigden hen nog meer, en lieten hen gaan, omdat zij niets vonden waarmee zij hen konden straffen, om het volk; want allen verheerlijkten God over wat er gebeurd was.", "2 Tim 4:18": "En de Heere zal mij verlossen van alle slecht werk, en bewaren tot Zijn hemels Koninkrijk; aan Hem zij de heerlijkheid, tot in alle eeuwigheid. Amen.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Jes 63:7-9": "Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid. Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland. In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "1 Kon 17:12-16": "Maar zij zei: Zo waarachtig als de HEERE, uw God, leeft, ik heb geen koek, alleen een hand vol van het meel in de kruik, en een beetje olie in de fles! En zie, ik heb een paar stukken hout gesprokkeld, en ik ga naar binnen, en zal het voor mij en voor mijn zoon bereiden, zodat wij het eten, en sterven. En Elia zei tegen haar: Vrees niet, ga naar binnen, doe naar uw woord; maar maak mij eerst een kleine koek daarvan, en breng die mij hier naar buiten; maar voor u en uw zoon zult u daarna iets maken. Want zo zegt de HEERE, de God van Israël: Het meel van de kruik zal niet verteerd worden, en de olie van de fles zal niet ontbreken, tot op de dag dat de HEERE regen op de aardbodem geven zal.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Jer 18:19": "HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.", "Joh 3:24": "Want Johannes was nog niet in de gevangenis geworpen.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Matt 9:33": "En toen de demon uitgeworpen was, sprak de stomme man. En de menigten verwonderden zich en zeiden: Zoiets is nog nooit in Israël gezien!", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "Luk 3:15": "En toen het volk vol verwachting was, en allen in hun hart overlegden over Johannes, of hij misschien de Christus was,", "Ps 62:6-9": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Joh 6:40": "En dit is de wil van Hem die Mij gezonden heeft: dat ieder die de Zoon aanschouwt en in Hem gelooft, het eeuwige leven heeft; en Ik zal hem opwekken op de laatste dag.", "1 Joh 3:23": "En dit is Zijn gebod, dat wij geloven in de Naam van Zijn Zoon Jezus Christus, en elkaar liefhebben, zoals Hij ons een gebod gegeven heeft.", "Matt 26:69-75": "En Petrus zat buiten in de zaal; en een dienstmeisje kwam naar hem toe en zei: U was ook met Jezus, de Galileeër. Maar hij loochende het voor allen en zei: Ik weet niet wat u zegt. En toen hij naar de voorpoort ging, zag een ander dienstmeisje hem, en zei tegen hen die daar waren: Deze was ook met Jezus de Nazarener.", "1 Tim 1:16": "Maar juist daarom is mij barmhartigheid overkomen, opdat Jezus Christus in mij, die de voornaamste ben, al Zijn geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.", "Ex 28:33-43": "En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen. Dat er een gouden schelletje, daarna een granaatappel is; opnieuw een gouden schelletje, en een granaatappel, aan de zomen van de mantel rondom. En Aäron zal die aanhebben om te dienen; opdat zijn geluid gehoord wordt als hij in het heilige, voor het aangezicht van de HEERE, ingaat, en als hij uitgaat, opdat hij niet sterft.", "Mark 1:34": "En Hij genas er velen die door verschillende ziekten getroffen waren; en Hij dreef veel duivels uit, en liet de duivels niet toe om te spreken, omdat zij Hem kenden.", "Luk 9:11": "Maar de menigten kwamen dit te weten en volgden Hem; en Hij ontving hen, en sprak tot hen over het Koninkrijk van God; en Hij maakte hen gezond die genezing nodig hadden.", "Joh 9:33": "Als Deze niet van God was, zou Hij niets kunnen doen.", "Ps 15:1": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid?", "Ps 40:14": "Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Joh 4:29": "Kom, kijk naar een Mens Die mij alles gezegd heeft wat ik gedaan heb; is Deze niet de Christus?", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Spr 21:20": "In de woning van de wijze is een gewenste schat, en olie; maar een dwaas mens verslindt dat.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Joh 6:69": "En wij hebben geloofd en erkend dat U de Christus bent, de Zoon van de levende God.", "Joh 6:29": "Jezus antwoordde en zei tegen hen: Dit is het werk van God: dat u gelooft in Hem, Die Hij gezonden heeft.", "1 Sam 14:39-45": "Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem. Verder zei hij tegen heel Israël: U zult aan de ene kant staan, en ik en mijn zoon Jonathan zullen aan de andere kant staan. Toen zei het volk tegen Saul: Doe wat goed is in uw ogen. Saul nu sprak tot de HEERE, de God van Israël: Toon de onschuldige. Toen werden Jonathan en Saul aangewezen, en het volk ging vrijuit.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Luk 6:12": "En het gebeurde in die dagen, dat Hij de berg opging om te bidden, en Hij bracht de nacht door in het gebed tot God.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 6:2-8": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Matt 9:36": "En Hij zag de menigten, en werd innerlijk met ontferming bewogen over hen, omdat zij vermoeid en verstrooid waren, zoals schapen die geen herder hebben.", "Richt 21:1": "De mannen van Israël hadden in Mizpa gezworen: Niemand van ons zal zijn dochter aan de Benjaminieten tot vrouw geven.", "Joh 13:20": "Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.", "Matt 26:44": "En Hij liet hen achter, ging opnieuw weg, en bad voor de derde keer, met dezelfde woorden.", "Mark 10:1": "En Hij stond op van daar, en ging naar het gebied van Judea, door de overkant van de Jordaan; en de menigten kwamen weer bij Hem samen, en zoals Hij gewoon was, onderwees Hij hen weer.", "Luk 4:36": "En er kwam verbazing over allen; en zij spraken met elkaar en zeiden: Wat voor woord is dit, dat Hij met macht en kracht de onreine geesten gebiedt, en zij gaan eruit?", "Luk 4:41": "En er gingen ook duivelen uit van velen, die riepen en zeiden: U bent de Christus, de Zoon van God! En Hij bestrafte hen en liet hen niet spreken, omdat zij wisten dat Hij de Christus was.", "Matt 26:26": "En toen zij aten, nam Jezus het brood, en na de zegen brak Hij het, en gaf het aan de discipelen en zei: Neemt, eet, dat is Mijn lichaam.", "Matt 15:32-38": "En Jezus riep Zijn discipelen tot Zich en zei: Ik ben innerlijk met ontferming bewogen over de menigte, omdat zij nu al drie dagen bij Mij gebleven zijn, en niets hebben om te eten; en Ik wil hen niet nuchter van Mij laten gaan, zodat zij op de weg niet bezwijken. En Zijn discipelen zeiden tegen Hem: Waar zullen wij in de woestijn zoveel broden krijgen, dat wij zo'n grote menigte zouden verzadigen? En Jezus zei tegen hen: Hoeveel broden hebt u? Zij zeiden: Zeven, en een paar visjes.", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "2 Petr 1:1": "Simeon Petrus, een dienstknecht en apostel van Jezus Christus, aan hen die even kostbaar geloof met ons verkregen hebben, door de rechtvaardigheid van onze God en Zaligmaker, Jezus Christus;", "Gen 19:30": "En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.", "Ps 25:16-19": "Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Matt 14:25-27": "Maar in de vierde nachtwake kwam Jezus naar hen toe, lopend op de zee. En de discipelen, die Hem op de zee zagen lopen, werden ontroerd, en zeiden: Het is een spook! En zij schreeuwden van angst. Maar meteen sprak Jezus hen aan, en zei: Heb goede moed, Ik ben het, vreest niet.", "Jer 31:13": "Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis.", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Joh 10:30": "Ik en de Vader zijn één.", "Joh 11:5": "Jezus nu had Martha, en haar zuster, en Lazarus lief.", "Hos 1:6": "En zij ontving opnieuw, en baarde een dochter; en Hij zei tegen hem: Noem haar naam Lo-Ruchama; want Ik zal Mij voortaan niet meer ontfermen over het huis van Israël, maar Ik zal ze zeker wegvoeren.", "Luk 6:17-19": "En Hij kwam met hen de berg af, en ging op een vlakke plaats staan, met de menigte van Zijn discipelen, en een grote menigte volk van heel Judea en Jeruzalem, en van de kuststreek van Tyrus en Sidon; Die gekomen waren om Hem te horen, en om van hun ziekten genezen te worden; en ook zij die door onreine geesten gekweld werden; en zij werden genezen. En de hele menigte probeerde Hem aan te raken; want er ging kracht van Hem uit, en Hij genas hen allen.", "Luk 4:14": "En Jezus keerde terug, door de kracht van de Geest, naar Galilea; en het gerucht over Hem verspreidde zich door het hele omliggende land.", "Luk 3:19": "Maar toen Herodes, de viervorst, door hem bestraft werd vanwege Herodias, de vrouw van Filippus, zijn broer, en vanwege alle slechte dingen die Herodes gedaan had,", "Mark 2:12": "En hij stond meteen op, en nadat hij het draagbed had opgenomen, ging hij naar buiten in het bijzijn van allen; zodat zij zich allen verbaasden en God verheerlijkten, en zeiden: Wij hebben dit nooit zo gezien!", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Ps 7:8": "Zo zal de vergadering van de volken U omringen; keer dan boven haar terug in de hoogte.", "Hand 15:9": "en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Matt 8:26": "En Hij zei tegen hen: Waarom bent u angstig, kleingelovigen? Toen stond Hij op, en bestrafte de winden en de zee; en er kwam een grote stilte.", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "1 Sam 28:12-14": "Toen de vrouw Samuel zag, riep zij met luide stem, en de vrouw sprak tegen Saul en zei: Waarom hebt u mij bedrogen? Want u bent Saul. En de koning zei tegen haar: Wees niet bang; maar wat ziet u? Toen zei de vrouw tegen Saul: Ik zie goden, opkomend uit de aarde. Hij dan zei tegen haar: Hoe ziet hij eruit? En zij zei: Er komt een oude man op, en hij is met een mantel bekleed. Toen Saul begreep dat het Samuel was, boog hij zich met zijn gezicht ter aarde, en boog hij zich neer.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Ps 45:12": "Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer.", "Mark 6:34": "En Jezus, naar buiten gaand, zag een grote menigte, en werd innerlijk met ontferming bewogen over hen; want zij waren als schapen die geen herder hebben; en Hij begon hun veel dingen te onderwijzen.", "Mark 14:4": "En er waren sommigen die dit bij zichzelf zeer kwalijk namen, en zeiden: Waarom is deze verspilling van de zalf gebeurd?", "Mark 5:28": "Want zij zei: Als ik maar Zijn kleren mag aanraken, zal ik gezond worden.", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Spr 24:10": "Toont u zich slap ten dage van de benauwdheid, dan is uw kracht nauw.", "Ps 104:3": "Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Joh 11:27": "Zij zei tegen Hem: Ja, Heere; ik heb geloofd dat U de Christus bent, de Zoon van God, Die in de wereld komen zou.", "Jer 39:18": "Want Ik zal u zeker bevrijden, en u zult door het zwaard niet vallen; maar u zult uw leven als een buit hebben, omdat u op Mij vertrouwd hebt, spreekt de HEERE.", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Joh 19:26": "Toen Jezus dan Zijn moeder zag, en de discipel die Hij liefhad, daarbij staande, zei Hij tegen Zijn moeder: Vrouw, zie, uw zoon.", "Joh 16:5": "En nu ga Ik heen tot Hem die Mij gezonden heeft, en niemand van u vraagt Mij: Waar gaat U heen?", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Luk 9:9": "En Herodes zei: Johannes heb ik onthoofd; wie is Deze dan, van Wie ik zulke dingen hoor? En hij probeerde Hem te zien.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Mark 6:27": "En de koning zond meteen een beul, en gebood zijn hoofd te brengen. Deze ging heen, en onthoofdde hem in de gevangenis;", "Joz 9:20": "Dit zullen wij hun doen, dat wij hen in leven laten, opdat er geen grote toorn over ons komt, vanwege de eed die wij hun gezworen hebben.", "Mark 6:56": "En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "Matt 16:14": "En zij zeiden: Sommigen: Johannes de Doper; en anderen: Elia; en weer anderen: Jeremia of één van de profeten.", "Matt 15:25": "En zij kwam en aanbad Hem, en zei: Heere, help mij!", "Neh 6:14": "Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.", "Jer 7:9": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,", "Matt 16:8-10": "En Jezus, die dit wist, zei tegen hen: Wat overlegt u bij uzelf, kleingelovigen, dat u geen brood meegenomen hebt? Begrijpt u nog niet, en herinnert u zich niet de vijf broden van de vijfduizend mannen, en hoeveel korven u opnam? Ook niet de zeven broden van de vierduizend mannen, en hoeveel manden u opnam?", "Richt 11:30": "En Jeftha beloofde de HEERE een gelofte, en zei: Als U de kinderen van Ammon werkelijk in mijn hand geeft,", "Joh 8:19": "Zij zeiden dan tegen Hem: Waar is Uw Vader? Jezus antwoordde: U kent Mij niet, en Mijn Vader ook niet; als u Mij kende, zou u ook Mijn Vader kennen.", "Joh 12:27": "Nu is Mijn ziel ontroerd; en wat zal Ik zeggen? Vader, verlos Mij uit dit uur! Maar hierom ben Ik tot dit uur gekomen.", "Matt 21:37": "En ten slotte stuurde hij zijn zoon naar hen toe, en zei: Zij zullen ontzag hebben voor mijn zoon.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Hand 3:16": "En door het geloof in Zijn Naam heeft Zijn Naam deze man sterk gemaakt, die u ziet en kent; en het geloof, dat door Hem is, heeft hem deze volmaakte gezondheid gegeven, in aanwezigheid van u allen.", "Joh 8:40": "Maar nu probeert u Mij te doden, een Mens, Die u de waarheid gesproken heeft, welke Ik van God gehoord heb. Dat deed Abraham niet.", "Joh 10:3": "Voor hem doet de deurwachter open, en de schapen horen zijn stem; en hij roept zijn eigen schapen bij naam, en leidt ze naar buiten.", "Mark 6:26": "En de koning werd zeer bedroefd, maar toch, vanwege de eden en degenen die mee aanzaten, wilde hij haar dat niet weigeren.", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Job 31:17": "En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft;", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Joh 9:35": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God?", "Hebr 2:11": "Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Mark 14:31": "Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Ps 20:2": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Joh 13:1": "En voor het feest van het Pascha wist Jezus dat Zijn tijd gekomen was om uit deze wereld over te gaan tot de Vader; en omdat Hij de Zijnen, die in de wereld waren, liefgehad had, zo heeft Hij hen liefgehad tot het einde.", "Matt 14:1-11": "In diezelfde tijd hoorde Herodes, de viervorst, het gerucht van Jezus; en hij zei tegen zijn knechten: Deze is Johannes de Doper; hij is opgewekt van de doden, en daarom werken die krachten in Hem. Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer.", "Hebr 2:18": "Want doordat Hij Zelf, beproefd zijnde, geleden heeft, kan Hij hun die beproefd worden, te hulp komen.", "Joh 5:30": "Ik kan van Mijzelf niets doen. Zoals Ik hoor, oordeel Ik, en Mijn oordeel is rechtvaardig; want Ik zoek niet Mijn eigen wil, maar de wil van de Vader, Die Mij gezonden heeft.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Ps 69:2-37": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Joh 12:18": "Daarom ging ook de menigte Hem tegemoet, omdat zij gehoord had dat Hij dat teken gedaan had.", "Matt 17:12": "Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Hand 12:15": "En zij zeiden tegen haar: U raast. Maar zij hield vol dat het zo was. En zij zeiden: Het is zijn engel.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "Gen 40:20": "En het gebeurde op de derde dag, de dag van Farao's geboorte, dat hij voor al zijn dienaren een maaltijd maakte; en hij verhief het hoofd van de leider van de schenkers, en het hoofd van de leider van de bakkers, te midden van zijn dienaren.", "Matt 16:1": "En de Farizeeën en Sadduceeën kwamen bij Hem, en om Hem te verzoeken vroegen zij Hem dat Hij hun een teken uit de hemel zou tonen.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Luk 8:50": "Maar toen Jezus dat hoorde, antwoordde Hij hem: Vrees niet, geloof alleen, en zij zal behouden worden.", "Luk 5:5": "En Simon antwoordde en zei tegen Hem: Meester, we hebben de hele nacht gewerkt en niets gevangen; maar op Uw woord zal ik het net uitwerpen.", "Luk 22:31-34": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe; maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders. En hij zei tegen Hem: Heere, ik ben bereid, met U ook in de gevangenis en in de dood te gaan.", "Joh 6:14": "Toen de mensen dan het teken zagen dat Jezus gedaan had, zeiden zij: Deze is werkelijk de Profeet, Die in de wereld komen zou.", "Luk 17:6": "En de Heere zei: Als u een geloof had als een mosterdzaad, zou u tegen deze moerbeiboom zeggen: Word ontworteld en in de zee geplant, en hij zou u gehoorzaam zijn.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Joh 6:11": "En Jezus nam de broden, en nadat Hij gedankt had, deelde Hij ze uit aan de discipelen, en de discipelen aan hen die neergezeten waren; evenzo ook van de visjes, zoveel als zij wilden.", "Mark 6:45-52": "En meteen dwong Hij Zijn discipelen om in het schip te gaan, en vooruit te varen naar de andere kant, tegenover Bethsaïda, terwijl Hij de menigte van Zich zou laten gaan. En nadat Hij hun afscheid gegeven had, ging Hij de berg op om te bidden. En toen het avond geworden was, was het schip midden op de zee, en Hij was alleen op het land.", "2 Kon 11:1": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht al het koninklijke nageslacht om.", "Rom 14:6": "Hij die de dag in acht neemt, neemt hem in acht voor de Heere; en hij die de dag niet in acht neemt, neemt hem niet in acht voor de Heere. Hij die eet, eet dat voor de Heere, want hij dankt God; en hij die niet eet, eet dat niet voor de Heere, en hij dankt God.", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Luk 24:38": "En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart?", "Matt 19:27": "Toen antwoordde Petrus, en zei tegen Hem: Zie, wij hebben alles verlaten, en zijn U gevolgd, wat zal ons dan geworden?", "Matt 21:15": "Toen nu de overpriesters en Schriftgeleerden de wonderen zagen die Hij deed, en de kinderen die in de tempel riepen: Hosanna, de Zoon van David!, namen zij dat zeer kwalijk,"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"G1565\">In</span> <span class=\"wl\" data-l=\"L1\" data-code=\"G1565\">diezelfde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G2540\">tijd</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G191\">hoorde</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G2264\">Herodes</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"G2264\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"G5076\">viervorst</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"G5076\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G189\">gerucht</span> <span class=\"wl\" data-l=\"L1\" data-code=\"G1565\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G2424\">Jezus</span>;", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">en</span> hij <span class=\"wl\" dat /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

  } catch (e) { cache[code] = null; }

}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
const BIJBELUITLEG_HTML = [

function paneelInhoud(n, tab) {

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {

  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
