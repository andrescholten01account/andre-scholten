 "2": "en hij zei tegen zijn knechten: Deze is Johannes de Doper; hij is opgewekt van de doden, en daarom werken die krachten in Hem.", "3": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer.", "4": "Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben.", "5": "En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "6": "Maar toen de verjaardag van Herodes gevierd werd, danste de dochter van Herodias in hun midden, en zij beviel Herodes.", "7": "Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen.", "8": "En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper.", "9": "En de koning werd bedroefd; maar vanwege de eden, en degenen die met hem aanzaten, gebood hij dat het haar gegeven zou worden;", "10": "en hij stuurde iemand heen, en onthoofdde Johannes in de kerker.", "11": "En zijn hoofd werd op een schotel gebracht, en aan het meisje gegeven; en zij bracht het naar haar moeder.", "12": "En zijn discipelen kwamen, en namen het lichaam weg, en begroeven het; en gingen en vertelden het aan Jezus.", "13": "Toen Jezus dit hoorde, vertrok Hij vandaar met een boot naar een eenzame plaats, alleen; en de menigten, die dat hoorden, zijn Hem te voet gevolgd, vanuit de steden.", "14": "En toen Jezus naar buiten ging, zag Hij een grote menigte, en werd innerlijk met ontferming over hen bewogen, en genas hun zieken.", "15": "Toen het nu avond werd, kwamen Zijn discipelen naar Hem toe, en zeiden: Deze plaats is eenzaam, en de tijd is nu voorbijgegaan; stuur de menigten weg, zodat zij naar de dorpen gaan en voor zichzelf voedsel kopen.", "16": "Maar Jezus zei tegen hen: Het is voor hen niet nodig om weg te gaan, geeft u hun te eten.", "17": "Maar zij zeiden tegen Hem: Wij hebben hier niets dan vijf broden en twee vissen.", "18": "En Hij zei: Brengt Mij die hier.", "19": "En Hij beval de menigten neer te zitten op het gras, en nam de vijf broden en de twee vissen, en Hij keek op naar de hemel, zegende ze; en toen Hij ze gebroken had, gaf Hij de broden aan de discipelen, en de discipelen aan de menigten.", "20": "En zij aten allen en werden verzadigd, en zij namen het overschot van de brokken op, twaalf volle korven.", "21": "Die nu gegeten hadden, waren ongeveer vijfduizend mannen, zonder de vrouwen en kinderen.", "22": "En meteen dwong Jezus Zijn discipelen om in het schip te gaan, en voor Hem uit te varen naar de andere kant, terwijl Hij de menigten van Zich zou laten gaan.", "23": "En toen Hij de menigten van Zich had laten gaan, klom Hij de berg op, alleen, om te bidden. En toen het avond was geworden, was Hij daar alleen.", "24": "En het schip was al midden op de zee, in nood door de golven; want de wind was hun tegen.", "25": "Maar in de vierde nachtwake kwam Jezus naar hen toe, lopend op de zee.", "26": "En de discipelen, die Hem op de zee zagen lopen, werden ontroerd, en zeiden: Het is een spook! En zij schreeuwden van angst.", "27": "Maar meteen sprak Jezus hen aan, en zei: Heb goede moed, Ik ben het, vreest niet.", "28": "En Petrus antwoordde Hem, en zei: Heere! Als U het bent, gebied mij dan tot U te komen op het water.", "29": "En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen.", "30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "31": "En Jezus stak meteen Zijn hand uit, greep hem vast, en zei tegen hem: Kleingelovige! Waarom heb je getwijfeld?", "32": "En toen zij in het schip geklommen waren, ging de wind liggen.", "33": "Zij die in het schip waren, kwamen en aanbaden Hem, en zeiden: Werkelijk, U bent Gods Zoon!", "34": "En toen zij overgevaren waren, kwamen zij in het land Gennesaret.", "35": "En toen de mannen van die plaats Hem herkenden, stuurden zij *berichten* naar dat hele omliggende gebied, en zij brachten naar Hem toe allen die ziek waren;", "36": "en zij smeekten Hem dat zij alleen de zoom van Zijn kleed zouden mogen aanraken; en zovelen als Hem aanraakten, werden gezond."}, "SV": {"1": "Te dierzelfder tijd hoorde Herodes, de viervorst, het gerucht van Jezus;", "2": "En zeide tot zijn knechten: Deze is Johannes de Doper; hij is opgewekt van de doden, en daarom werken die krachten in Hem.", "3": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in den kerker gezet, om Herodias’ wil, de huisvrouw van Filippus, zijn broeder.", "4": "Want Johannes zeide tot hem: Het is u niet geoorloofd haar te hebben.", "5": "En willende hem doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "6": "Maar als de dag der geboorte van Herodes gehouden werd, danste de dochter van Herodias in het midden *van* *hen*, en zij behaagde aan Herodes.", "7": "Waarom hij haar met ede beloofde te geven, wat zij ook zou eisen.", "8": "En zij, te voren onderricht zijnde van haar moeder, zeide: Geef mij hier in een schotel het hoofd van Johannes den Doper.", "9": "En de koning werd bedroefd; doch om de eden, en degenen, die *met* *hem* aanzaten, gebood hij, dat het *haar* zou gegeven worden;", "10": "En zond heen, en onthoofdde Johannes in den kerker.", "11": "En zijn hoofd werd gebracht in een schotel, en het dochtertje gegeven; en zij droeg het *tot* haar moeder.", "12": "En zijn discipelen kwamen, en namen het lichaam weg, en begroeven hetzelve; en gingen en boodschapten het Jezus.", "13": "En *als* Jezus *dit* hoorde, vertrok Hij van daar te scheep, naar een woeste plaats alleen; en de scharen, *dat* horende, zijn Hem te voet gevolgd uit de steden.", "14": "En Jezus uitgaande, zag een grote schare, en werd innerlijk met ontferming over hen bewogen, en genas hun kranken.", "15": "En als het nu avond werd, kwamen Zijn discipelen tot Hem, zeggende: Deze plaats is woest, en de tijd is nu voorbijgegaan; laat de scharen van U, opdat zij heengaan in de vlekken en zichzelven spijze kopen.", "16": "Maar Jezus zeide tot hen: Het is hun niet van node heen te gaan, geeft gij hun te eten.", "17": "Doch zij zeiden tot Hem: Wij hebben hier niet, dan vijf broden en twee vissen.", "18": "En Hij zeide: Brengt Mij dezelve hier.", "19": "En Hij beval de scharen neder te zitten op het gras, en nam de vijf broden en de twee vissen, en opwaarts ziende naar den hemel, zegende dezelve; en als Hij ze gebroken had, gaf Hij de broden den discipelen, en de discipelen aan de scharen.", "20": "En zij aten allen en werden verzadigd, en zij namen op, het overschot der brokken, twaalf volle korven.", "21": "Die nu gegeten hadden, waren omtrent vijf duizend mannen, zonder de vrouwen en kinderen.", "22": "En terstond dwong Jezus Zijn discipelen in het schip te gaan, en voor Hem af te varen naar de andere zijde, terwijl Hij de scharen van Zich zou laten.", "23": "En als Hij nu de scharen van Zich gelaten had, klom Hij op den berg alleen, om te bidden. En als het nu avond was geworden, zo was Hij daar alleen.", "24": "En het schip was nu midden in de zee, zijnde in nood van de baren; want de wind was *hun* tegen.", "25": "Maar ter vierde wake des nachts kwam Jezus af tot hen, wandelende op de zee.", "26": "En de discipelen, ziende Hem op de zee wandelen, werden ontroerd, zeggende: Het is een spooksel! En zij schreeuwden van vreze.", "27": "Maar terstond sprak hen Jezus aan, zeggende: Zijt goedsmoeds, Ik ben het, vreest niet.", "28": "En Petrus antwoordde Hem, en zeide: Heere! indien Gij het zijt, zo gebied mij tot U te komen op het water.", "29": "En Hij zeide: Kom. En Petrus klom neder van het schip, en wandelde op het water, om tot Jezus te komen.", "30": "Maar ziende den sterken wind, werd hij bevreesd, en als hij begon neder te zinken, riep hij, zeggende: Heere, behoud mij!", "31": "En Jezus, terstond de hand uitstekende, greep hem aan, en zeide tot hem: Gij kleingelovige! waarom hebt gij gewankeld?", "32": "En als zij in het schip geklommen waren, stilde de wind.", "33": "Die nu in het schip *waren*, kwamen en aanbaden Hem, zeggende: Waarlijk, Gij zijt Gods Zoon!", "34": "En overgevaren zijnde, kwamen zij in het land Gennesaret.", "35": "En als de mannen van die plaats Hem werden kennende, zonden zij in dat gehele omliggende land, en brachten tot Hem allen, die kwalijk gesteld waren;", "36": "En baden Hem, dat zij alleenlijk den zoom Zijns kleeds zouden mogen aanraken; en zovelen als *Hem* aanraakten, werden gezond."}, "KJV": {"1": "At that time Herod the tetrarch heard of the fame of Jesus,", "2": "And said unto his servants, This is John the Baptist; he is risen from the dead; and therefore mighty works do shew forth themselves in him.", "3": "For Herod had laid hold on John, and bound him, and put *him* in prison for Herodias' sake, his brother Philip's wife.", "4": "For John said unto him, It is not lawful for thee to have her.", "5": "And when he would have put him to death, he feared the multitude, because they counted him as a prophet.", "6": "But when Herod's birthday was kept, the daughter of Herodias danced before them, and pleased Herod.", "7": "Whereupon he promised with an oath to give her whatsoever she would ask.", "8": "And she, being before instructed of her mother, said, Give me here John Baptist's head in a charger.", "9": "And the king was sorry: nevertheless for the oath's sake, and them which sat with him at meat, he commanded *it* to be given", "10": "And he sent, and beheaded John in the prison.", "11": "And his head was brought in a charger, and given to the damsel: and she brought *it* to her mother.", "12": "And his disciples came, and took up the body, and buried it, and went and told Jesus.", "13": "When Jesus heard *of it*, he departed thence by ship into a desert place apart: and when the people had heard *thereof*, they followed him on foot out of the cities.", "14": "And Jesus went forth, and saw a great multitude, and was moved with compassion toward them, and he healed their sick.", "15": "And when it was evening, his disciples came to him, saying, This is a desert place, and the time is now past; send the multitude away, that they may go into the villages, and buy themselves victuals.", "16": "But Jesus said unto them, They need not depart; give ye them to eat", "17": "And they say unto him, We have here but five loaves, and two fishes.", "18": "He said, Bring them hither to me.", "19": "And he commanded the multitude to sit down on the grass, and took the five loaves, and the two fishes, and looking up to heaven, he blessed, and brake, and gave the loaves to *his* disciples, and the disciples to the multitude.", "20": "And they did all eat, and were filled: and they took up of the fragments that remained twelve baskets full.", "21": "And they that had eaten were about five thousand men, beside women and children.", "22": "And straightway Jesus constrained his disciples to get into a ship, and to go before him unto the other side, while he sent the multitudes away.", "23": "And when he had sent the multitudes away, he went up into a mountain apart to pray: and when the evening was come, he was there alone.", "24": "But the ship was now in the midst of the sea, tossed with waves: for the wind was contrary.", "25": "And in the fourth watch of the night Jesus went unto them, walking on the sea.", "26": "And when the disciples saw him walking on the sea, they were troubled, saying, It is a spirit; and they cried out for fear.", "27": "But straightway Jesus spake unto them, saying, Be of good cheer; it is I; be not afraid.", "28": "And Peter answered him and said, Lord, if it be thou, bid me come unto thee on the water.", "29": "And he said, Come. And when Peter was come down out of the ship, he walked on the water, to go to Jesus.", "30": "But when he saw the wind boisterous, he was afraid; and beginning to sink, he cried, saying, Lord, save me.", "31": "And immediately Jesus stretched forth *his* hand, and caught him, and said unto him, O thou of little faith, wherefore didst thou doubt?", "32": "And when they were come into the ship, the wind ceased.", "33": "Then they that were in the ship came and worshipped him, saying, Of a truth thou art the Son of God.", "34": "And when they were gone over, they came into the land of Gennesaret.", "35": "And when the men of that place had knowledge of him, they sent out into all that country round about, and brought unto him all that were diseased;", "36": "And besought him that they might only touch the hem of his garment: and as many as touched were made perfectly whole."}}, "tsk": {"1": [{"kopje": "Herodes", "refs": ["Mark 6:14-16", "Mark 8:15", "Luk 9:7-9", "Luk 13:31", "Luk 13:32", "Luk 23:8-12", "Luk 23:15", "Hand 4:27"]}, {"kopje": "viervorst", "refs": ["Luk 3:1"]}], "2": [{"kopje": "Deze", "refs": ["Matt 11:11", "Matt 16:14", "Mark 8:28", "Joh 10:41"]}], "3": [{"kopje": "Herodes", "refs": ["Matt 4:12", "Mark 6:17", "Luk 3:19", "Luk 3:20", "Joh 3:23", "Joh 3:24"]}, {"kopje": "zijn", "refs": ["Luk 13:1"]}], "5": [{"kopje": "hoewel", "refs": ["Mark 6:19", "Mark 6:20", "Mark 14:1", "Mark 14:2", "Hand 4:21", "Hand 5:26"]}, {"kopje": "omdat", "refs": ["Matt 21:26", "Matt 21:32", "Mark 11:30-32", "Luk 20:6"]}], "6": [{"kopje": "verjaardag", "refs": ["Gen 40:20", "Est 1:2-9", "Est 2:18", "Dan 5:1-4", "Hos 1:5", "Hos 1:6", "Mark 6:21-23"]}, {"kopje": "de dochter", "refs": ["Matt 22:24"]}, {"kopje": "danste", "refs": ["Est 1:10-12"]}], "8": [{"kopje": "van tevoren", "refs": ["2 Kron 22:2", "2 Kron 22:3", "Mark 6:24"]}, {"kopje": "Geef", "refs": ["1 Kon 18:4", "1 Kon 18:13", "1 Kon 19:2", "2 Kon 11:1", "Spr 1:16", "Spr 29:10"]}, {"kopje": "een schotel", "refs": ["Num 7:13", "Num 7:19", "Num 7:84", "Num 7:85", "Ezra 1:9"]}], "9": [{"kopje": "de koning", "refs": ["Matt 14:1", "Mark 6:14"]}, {"kopje": "bedroefd", "refs": ["Matt 14:5", "Matt 27:17-26", "Dan 6:15-17", "Mark 6:20", "Mark 6:26", "Luk 13:32", "Joh 19:12-16", "Hand 24:23-27", "Hand 25:3-9"]}, {"kopje" : "Matt 14:35", "svLabel": null}, {"disp": "Matt 14:36", "href": "../../mattheus/14/#v36", "ref": "Matt 14:36", "svLabel": null}, {"disp": "Mark 5:27-34", "href": "../../markus/5/#v27", "ref": "Mark 5:27-34", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "Luk 24:34": "die zeiden: De Heere is werkelijk opgestaan, en is aan Simon verschenen.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Matt 9:28": "En toen Hij het huis binnengegaan was, kwamen de blinden bij Hem. En Jezus zei tegen hen: Gelooft u dat Ik dit kan doen? Zij zeiden tegen Hem: Ja, Heere!", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Mark 6:45-56": "En meteen dwong Hij Zijn discipelen om in het schip te gaan, en vooruit te varen naar de andere kant, tegenover Bethsaïda, terwijl Hij de menigte van Zich zou laten gaan. En nadat Hij hun afscheid gegeven had, ging Hij de berg op om te bidden. En toen het avond geworden was, was het schip midden op de zee, en Hij was alleen op het land.", "Matt 15:32": "En Jezus riep Zijn discipelen tot Zich en zei: Ik ben innerlijk met ontferming bewogen over de menigte, omdat zij nu al drie dagen bij Mij gebleven zijn, en niets hebben om te eten; en Ik wil hen niet nuchter van Mij laten gaan, zodat zij op de weg niet bezwijken.", "Job 31:19-22": "Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had; Als zijn lenden mij niet gezegend hebben, toen hij van de vellen van mijn lammeren verwarmd werd; Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Jak 5:8": "Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Luk 9:19": "En zij antwoordden en zeiden: Johannes de Doper; en anderen: Elia; en weer anderen: dat een van de profeten van vroeger is opgestaan.", "Joh 13:34": "Een nieuw gebod geef Ik u, dat u elkaar liefhebt; zoals Ik u liefgehad heb, dat u ook elkaar liefhebt.", "1 Tim 4:3-5": "die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen. Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt; want het wordt geheiligd door het Woord van God en door het gebed.", "Hand 8:2": "En godvruchtige mannen droegen Stefanus samen naar het graf en bedreven grote rouw over hem.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Matt 10:40": "Wie u ontvangt, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem, Die Mij gezonden heeft.", "Hand 9:5": "En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Gen 40:22": "Maar de leider van de bakkers hing hij op, zoals Jozef hun had uitgelegd.", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Ex 14:15": "Toen zei de HEERE tegen Mozes: Wat roept u tot Mij? Zeg tegen de kinderen van Israël dat zij verder trekken.", "Matt 9:20": "(En zie, een vrouw die twaalf jaar bloedvloeiingen had gehad, kwam van achteren bij Hem en raakte de zoom van Zijn kleed aan;", "Luk 9:14": "Want er waren ongeveer vijfduizend mannen. Maar Hij zei tegen Zijn discipelen: Laat hen neerzitten in groepen van vijftig.", "Joh 3:2": "Deze kwam 's nachts naar Jezus en zei tegen Hem: Rabbi, wij weten dat U als Leraar van God gekomen bent; want niemand kan deze tekenen doen die U doet, als God niet met hem is.", "Mark 6:21-29": "En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea; en toen de dochter van deze Herodias binnenkwam en danste, en Herodes en hen die mee aanzaten behaagde, zei de koning tegen het meisje: Vraag mij wat u maar wilt, en ik zal het u geven. En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, zelfs tot de helft van mijn koninkrijk!", "Gen 26:17": "Toen ging Izak daarvandaan, en hij legerde zich in het dal van Gerar, en woonde daar.", "Matt 15:34-37": "En Jezus zei tegen hen: Hoeveel broden hebt u? Zij zeiden: Zeven, en een paar visjes. En Hij gebood de menigten op de grond te gaan zitten. En Hij nam de zeven broden en de vissen, en nadat Hij gedankt had, brak Hij ze, en gaf ze aan Zijn discipelen; en de discipelen gaven ze aan de menigte.", "Mark 8:3": "En als Ik hen nuchter naar hun huis laat gaan, zullen zij onderweg bezwijken; want sommigen van hen komen van ver.", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "Joh 12:36": "Zolang u het Licht hebt, geloof in het Licht, opdat u kinderen van het Licht mag zijn. Dit sprak Jezus; en Hij ging weg en verborg Zich voor hen.", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Mark 6:24": "En zij ging naar buiten en zei tegen haar moeder: Wat zal ik vragen? En die zei: Het hoofd van Johannes de Doper.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Mark 4:35-41": "En op diezelfde dag, toen het avond geworden was, zei Hij tegen hen: Laten wij oversteken naar de andere kant. En zij lieten de menigte gaan en namen Hem mee, zoals Hij in het schip was; en er waren nog andere scheepjes bij Hem. En er kwam een grote storm van wind, en de golven sloegen over in het schip, zodat het al vol werd.", "Ps 69:34": "Want de HEERE hoort de behoeftigen, en Hij veracht Zijn gevangenen niet.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Dan 3:25": "Hij antwoordde en zei: Zie, ik zie vier mannen, los, wandelend in het midden van het vuur, en er is geen letsel aan hen; en de gedaante van de vierde is gelijk aan een zoon van de goden.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "1 Sam 22:3": "En David ging vandaar naar Mizpa van de Moabieten; en hij zei tegen de koning van de Moabieten: Laat toch mijn vader en mijn moeder bij u komen, totdat ik weet wat God met mij doen zal.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Gen 26:33": "En hij noemde hem Seba; daarom is de naam van die stad Berseba, tot op deze dag.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "Matt 14:8-11": "En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper. En de koning werd bedroefd; maar vanwege de eden, en degenen die met hem aanzaten, gebood hij dat het haar gegeven zou worden; en hij stuurde iemand heen, en onthoofdde Johannes in de kerker.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "2 Kon 4:43": "Doch zijn dienaar zei: Wat, zou ik dit aan honderd mannen voorzetten? En hij zei: Geef aan het volk, zodat zij eten; want zo zegt de HEERE: Men zal eten en overhouden.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Luk 23:28": "En Jezus keerde Zich naar hen toe en zei: Dochters van Jeruzalem, weent niet over Mij, maar weent over uzelf, en over uw kinderen.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Mark 6:30-44": "En de apostelen kwamen weer bij Jezus, en vertelden Hem alles, zowel wat zij gedaan hadden, als wat zij geleerd hadden. En Hij zei tegen hen: Kom zelf mee naar een eenzame plaats, alleen, en rust wat uit; want er waren velen die kwamen en gingen, en zij hadden zelfs geen tijd om te eten. En zij vertrokken in een schip, naar een eenzame plaats, alleen.", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Joh 11:40": "Jezus zei tegen haar: Heb Ik u niet gezegd dat, als u gelooft, u de heerlijkheid van God zien zult?", "Hand 10:43": "Van Deze geven alle profeten getuigenis, dat ieder die in Hem gelooft, vergeving van zonden zal ontvangen door Zijn Naam.", "Joh 12:49": "Want Ik heb niet uit Mijzelf gesproken; maar de Vader, Die Mij gezonden heeft, Die heeft Mij een gebod gegeven wat Ik zeggen zal en wat Ik spreken zal.", "Joh 19:27": "Daarna zei Hij tegen de discipel: Zie, uw moeder. En vanaf dat uur nam de discipel haar in zijn huis.", "Joh 12:18-21": "Daarom ging ook de menigte Hem tegemoet, omdat zij gehoord had dat Hij dat teken gedaan had. De Farizeeën zeiden dan tegen elkaar: Ziet u wel dat u niets bereikt? Zie, de hele wereld loopt Hem na. En er waren enkele Grieken onder hen die opgegaan waren om op het feest te aanbidden;", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Mark 13:35": "Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat in de avond, of te middernacht, of bij het hanengekraai, of in de ochtend);", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "Matt 17:7": "En Jezus kwam bij hen, raakte hen aan en zei: Sta op en wees niet bevreesd.", "Ps 62:3": "Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.", "2 Kon 13:19": "Toen werd de man van God zeer toornig op hem, en zei: U had vijf of zes maal moeten slaan; dan zou u de Syriërs tot het verdoen toe geslagen hebben; doch nu zult u de Syriërs maar driemaal slaan.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Hebr 12:1-4": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is; Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God. Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Hand 27:18": "En omdat wij door het noodweer geweldig heen en weer geslingerd werden, gooiden zij de volgende dag lading overboord;", "Mark 10:13": "En zij brachten kinderen bij Hem, opdat Hij ze zou aanraken; maar de discipelen berispten hen die ze bij Hem brachten.", "Hand 27:35": "En toen hij dit gezegd had en brood genomen had, dankte hij God in aanwezigheid van allen; en nadat hij het gebroken had, begon hij te eten.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Luk 6:46-49": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "Mark 6:16-29": "Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden. Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Mark 6:49": "Maar toen zij Hem op de zee zagen lopen, dachten zij dat het een spook was, en schreeuwden luid;", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Luk 11:1": "En het gebeurde, toen Hij op een zekere plaats was en bad, dat, toen Hij ophield, een van Zijn discipelen tegen Hem zei: Heere, leer ons bidden, zoals ook Johannes zijn discipelen geleerd heeft.", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "2 Kor 9:8": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Joh 9:30": "De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend.", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Matt 28:5": "Maar de engel antwoordde en zei tegen de vrouwen: Wees u niet bang; want ik weet dat u Jezus zoekt, Die gekruisigd was.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Mark 6:53-56": "En toen zij overgevaren waren, kwamen zij in het land Gennesareth, en meerden daar aan. En toen zij uit het schip gegaan waren, herkenden de mensen Hem meteen. En zij liepen het hele omliggende land door, en begonnen op draagbedden hen die ziek waren rond te dragen, naar de plaats waar zij hoorden dat Hij was.", "Joh 12:12": "De volgende dag, toen een grote menigte, die naar het feest gekomen was, hoorde dat Jezus naar Jeruzalem kwam,", "Job 4:3-6": "Zie, u hebt velen onderwezen, en u hebt slappe handen gesterkt; uw woorden hebben de struikelende opgericht, en de knieën die knikten hebt u vastgesteld; maar nu komt het aan bij u, en u bent verdrietig; het raakt tot u, en u wordt beroerd.", "Matt 11:11": "Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.", "Joh 10:41": "En velen kwamen naar Hem toe, en zeiden: Johannes deed wel geen teken; maar alles wat Johannes over Deze gezegd heeft, was waar.", "Mark 1:35": "En vroeg in de morgen, toen het nog diep in de nacht was, stond Hij op, ging naar buiten, en ging naar een eenzame plaats, en bad daar.", "Luk 24:38-40": "En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart? Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb. En toen Hij dit gezegd had, toonde Hij hun de handen en de voeten.", "Luk 3:20": "voegde hij daar bovenop ook nog dit aan toe, dat hij Johannes in de gevangenis opsloot.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "Mark 6:51": "En Hij klom bij hen in het schip, en de wind ging liggen; en zij waren bovenmate zeer verbaasd in zichzelf, en verwonderd.", "Mark 9:7": "En er kwam een wolk die hen overschaduwde, en er kwam een stem uit de wolk: Dit is Mijn geliefde Zoon, hoor Hem!", "Mark 4:38": "En Hij lag in het achterschip te slapen op een kussen; en zij maakten Hem wakker, en zeiden tegen Hem: Meester, kan het U niet schelen dat wij vergaan?", "2 Petr 1:17": "Want Hij heeft van God de Vader eer en heerlijkheid ontvangen, toen zo'n stem van de hoogwaardige heerlijkheid tot Hem gebracht werd: Dit is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb.", "Matt 13:2": "En er verzamelde zich een grote menigte bij Hem, zodat Hij in een schip ging en neerzat, en heel de menigte stond op de oever.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Luk 7:9": "En toen Jezus dit hoorde, verwonderde Hij Zich over hem; en Hij keerde Zich om en zei tegen de menigte die Hem volgde: Ik zeg u: Ik heb zelfs in Israël niet zo'n groot geloof gevonden.", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Matt 9:2": "En Jezus zag hun geloof en zei tegen de verlamde man: Zoon, houd moed; uw zonden zijn u vergeven.", "Matt 7:29": "Want Hij onderwees hen als iemand die macht heeft, en niet als de schriftgeleerden.", "Jes 59:9-14": "Daarom is het recht ver van ons, en de gerechtigheid bereikt ons niet; wij wachten op het licht, maar zie, er is duisternis, op een grote glans, maar wij wandelen in het donker. Wij tasten naar de wand, zoals de blinden, en zoals wie geen ogen hebben, tasten wij; wij struikelen op de middag als in de schemering, wij zijn op woeste plaatsen als de doden. Wij brommen allen als de beren, en wij kirren voortdurend als de duiven; wij wachten op recht, maar er is geen, op heil, maar het is ver van ons.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Matt 14:22-36": "En meteen dwong Jezus Zijn discipelen om in het schip te gaan, en voor Hem uit te varen naar de andere kant, terwijl Hij de menigten van Zich zou laten gaan. En toen Hij de menigten van Zich had laten gaan, klom Hij de berg op, alleen, om te bidden. En toen het avond was geworden, was Hij daar alleen. En het schip was al midden op de zee, in nood door de golven; want de wind was hun tegen.", "Luk 12:38": "En als hij komt in de tweede nachtwake, of komt in de derde nachtwake, en hen zo aantreft, zalig zijn die dienstknechten.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Matt 11:2": "En Johannes, die in de gevangenis gehoord had van de werken van Christus, zond twee van zijn discipelen;", "Matt 14:3-10": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "1 Sam 25:32-34": "Toen zei David tegen Abigaïl: Gezegend zij de HEERE, de God van Israël, Die u vandaag mij tegemoet gezonden heeft! En gezegend zij uw raad, en gezegend bent u, dat u mij vandaag ervan weerhouden hebt te komen met bloedvergieten, en dat mijn hand mij verlost zou hebben! Want voorzeker, zo waarachtig als de HEERE, de God van Israël, leeft, Die mij ervan weerhouden heeft u kwaad te doen: als u zich niet had gehaast en mij tegemoet was gekomen, dan zou er van Nabal niemand die mannelijk is, zijn overgebleven tot het morgenlicht!", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Matt 14:13-21": "Toen Jezus dit hoorde, vertrok Hij vandaar met een boot naar een eenzame plaats, alleen; en de menigten, die dat hoorden, zijn Hem te voet gevolgd, vanuit de steden. En toen Jezus naar buiten ging, zag Hij een grote menigte, en werd innerlijk met ontferming over hen bewogen, en genas hun zieken. Toen het nu avond werd, kwamen Zijn discipelen naar Hem toe, en zeiden: Deze plaats is eenzaam, en de tijd is nu voorbijgegaan; stuur de menigten weg, zodat zij naar de dorpen gaan en voor zichzelf voedsel kopen.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "Hand 4:10": "Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "1 Sam 10:4": "En zij zullen u naar uw welstand vragen, en zij zullen u twee broden geven; die zult u van hun hand aannemen.", "Joh 10:36-38": "zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Mark 6:50": "want zij zagen Hem allen, en werden verschrikt; en meteen sprak Hij met hen, en zei tegen hen: Heb goede moed, Ik ben het; vrees niet.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Mark 6:16-28": "Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden. Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "1 Kor 1:2": "Aan de Gemeente van God, die te Korinthe is, de geheiligden in Christus Jezus, de geroepen heiligen, met allen die de Naam van onze Heere Jezus Christus aanroepen in elke plaats, zowel hun als onze Heere;", "Matt 20:34": "En Jezus, innerlijk bewogen met barmhartigheid, raakte hun ogen aan; en meteen konden hun ogen weer zien, en zij volgden Hem.", "Matt 26:72": "En hij loochende het opnieuw met een eed: Ik ken de Mens niet.", "Ps 89:28": "Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "Ps 34:20": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem.", "Mark 9:37": "Wie een van zulke kinderen in Mijn Naam ontvangt, die ontvangt Mij; en wie Mij ontvangt, die ontvangt niet Mij, maar Hem Die Mij gezonden heeft.", "Joh 3:14-16": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Hos 10:3": "Want nu zullen zij zeggen: Wij hebben geen koning; want wij hebben de Heere niet gevreesd; wat zou een koning dan voor ons doen?", "Mark 4:1": "En Hij begon opnieuw te onderwijzen bij de zee; en er kwam een grote menigte bij Hem samen, zodat Hij in het schip ging en op de zee ging zitten; en heel de menigte was op het land aan de zee.", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "Mark 1:22": "En zij stonden versteld van Zijn onderwijs; want Hij onderwees hen als iemand die gezag heeft, en niet als de Schriftgeleerden.", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "Mark 6:45": "En meteen dwong Hij Zijn discipelen om in het schip te gaan, en vooruit te varen naar de andere kant, tegenover Bethsaïda, terwijl Hij de menigte van Zich zou laten gaan.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "Luk 18:43": "En meteen kon hij weer zien, en hij volgde Hem, terwijl hij God verheerlijkte. En al het volk dat dit zag, gaf God lof.", "Matt 25:34-36": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "2 Kor 12:7-10": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen. Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken. En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Job 31:16": "Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten;", "Matt 9:8": "Toen de menigten dit zagen, verwonderden zij zich en verheerlijkten God, Die zo'n macht aan de mensen gegeven had.", "Luk 8:22-24": "En het gebeurde op een van die dagen dat Hij in een schip ging, met Zijn discipelen; en Hij zei tegen hen: Laten wij overvaren naar de andere kant van het meer. En zij staken van wal. En terwijl zij voeren, viel Hij in slaap; en er stak een stormwind op over het meer, en het schip liep vol water, en zij waren in nood. En zij gingen naar Hem toe en wekten Hem, en zeiden: Meester, Meester, wij vergaan! En Hij stond op en bestrafte de wind en de golven, en zij hielden op, en het werd stil.", "Joh 16:15": "Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Luk 24:39": "Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Hand 4:34": "Want er was ook niemand onder hen die gebrek had; want allen die bezitters waren van landen of huizen, verkochten die, en brachten de prijs van het verkochte,", "Ezech 16:4": "En wat uw geboorte aangaat: op de dag dat u geboren werd, werd uw navel niet afgesneden; en u was niet met water gewassen om u te reinigen; u was ook helemaal niet met zout gewreven, en ook niet in doeken gewikkeld.", "1 Joh 5:9": "Als wij het getuigenis van mensen aannemen, het getuigenis van God is groter; want dit is het getuigenis van God, dat Hij van Zijn Zoon getuigd heeft.", "Ps 51:3-6": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Gen 20:11": "En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.", "Matt 9:27": "En toen Jezus vandaar verder ging, volgden Hem twee blinden, roepend en zeggend: Zoon van David, ontferm U over ons!", "2 Kron 22:3": "Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen.", "Mark 6:39": "En Hij gebood hun dat zij hen allen in groepen zouden laten neerzitten op het groene gras.", "Job 4:14-16": "kwam er schrik en beving over mij, en het deed al mijn beenderen sidderen. Toen ging er een geest voorbij mijn gezicht; hij deed het haar van mijn lichaam overeind komen. Hij stond stil, maar ik herkende zijn gedaante niet; er was een beeltenis voor mijn ogen; er was stilte, en ik hoorde een stem, die zei:", "Ef 3:17-19": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent; opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is, en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Dan 12:7": "En ik hoorde die Man, gekleed in linnen, Die boven op het water van de rivier was, en Hij hief Zijn rechterhand en Zijn linkerhand op naar de hemel, en zwoer bij Hem Die eeuwig leeft, dat het na een bestemde tijd, bestemde tijden, en een helft zal zijn, en wanneer Hij voleindigd zal hebben het uiteenslaan van de macht van het heilige volk, al deze dingen voleindigd zullen worden.", "Matt 18:2-6": "En Jezus riep een kind bij Zich en zette het in hun midden, en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan. Wie zichzelf dan zal vernederen zoals dit kind, die is de belangrijkste in het Koninkrijk der hemelen.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Matt 13:36": "Toen Jezus de menigten van Zich had laten gaan, ging Hij naar huis. En Zijn discipelen kwamen naar Hem toe en zeiden: Verklaar ons de gelijkenis van het onkruid van de akker.", "Joh 1:12": "Maar zovelen Hem aangenomen hebben, aan hen heeft Hij macht gegeven om kinderen van God te worden, namelijk aan hen die in Zijn Naam geloven;", "Num 7:13": "En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Rom 4:19": "En niet verzwakt in het geloof, heeft hij zijn eigen lichaam niet aangemerkt, dat al verstorven was, omdat hij ongeveer honderd jaar oud was, noch ook dat de moederschoot van Sara verstorven was.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Job 9:8": "Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Matt 14:15-21": "Toen het nu avond werd, kwamen Zijn discipelen naar Hem toe, en zeiden: Deze plaats is eenzaam, en de tijd is nu voorbijgegaan; stuur de menigten weg, zodat zij naar de dorpen gaan en voor zichzelf voedsel kopen. Maar Jezus zei tegen hen: Het is voor hen niet nodig om weg te gaan, geeft u hun te eten. Maar zij zeiden tegen Hem: Wij hebben hier niets dan vijf broden en twee vissen.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "Luk 3:22": "en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!", "Joh 6:46": "Niet dat iemand de Vader gezien heeft, behalve Hij Die van God is; Hij heeft de Vader gezien.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Mark 6:20": "want Herodes was bang voor Johannes, wetend dat hij een rechtvaardig en heilig man was, en hij beschermde hem; en wanneer hij hem hoorde, deed hij veel dingen, en hij luisterde graag naar hem.", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "1 Kon 18:7-14": "Toen Obadja nu op de weg was, zie, daar kwam Elia hem tegemoet; en hem herkennend, viel hij op zijn gezicht en zei: Bent u mijn heer Elia? Hij zei: Ik ben het; ga heen, zeg tegen uw heer: Zie, Elia is hier. Maar hij zei: Wat heb ik gezondigd, dat u uw knecht geeft in de hand van Achab, om mij te doden?", "Ezech 19:3": "Zij trok een van haar welpen groot; het werd een jonge leeuw, die leerde roof te roven, hij at mensen op.", "Ps 31:23": "Ik zei wel in mijn haast: Ik ben afgesneden van voor Uw ogen; maar toch hoorde U de stem van mijn smekingen, toen ik tot U riep.", "Joh 12:11": "Want om zijnentwil gingen velen van de Joden weg, en geloofden in Jezus.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Joh 7:23": "Als een mens de besnijdenis ontvangt op de sabbat, zodat de wet van Mozes niet gebroken wordt, bent u dan boos op Mij, omdat Ik een heel mens gezond gemaakt heb op de sabbat?", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "1 Sam 17:24": "Doch alle mannen in Israël vluchtten voor hem weg toen zij die man zagen, en zij vreesden zeer.", "Ef 3:14": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus,", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "Mark 1:27": "En zij waren allen zo verbaasd, dat zij onder elkaar vroegen: Wat is dit? Wat is dit voor een nieuw onderwijs, dat Hij met gezag ook de onreine geesten gebiedt, en zij Hem gehoorzaam zijn?", "Ef 3:12": "door wie wij de vrijmoedigheid hebben, en de toegang met vertrouwen, door het geloof aan Hem.", "Mark 7:27-30": "Maar Jezus zei tegen haar: Laat eerst de kinderen verzadigd worden; want het is niet gepast om het brood van de kinderen te nemen, en het naar de hondjes te werpen. Maar zij antwoordde en zei tegen Hem: Ja, Heere, maar ook de hondjes eten onder de tafel van de kruimels van de kinderen. En Hij zei tegen haar: Vanwege dit woord, ga heen; de duivel is uit uw dochter weggegaan.", "Mark 5:41": "En Hij pakte de hand van het kind, en zei tegen haar: Talitha koemi! Dat is, vertaald: Meisje (Ik zeg u), sta op.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Mark 6:19": "En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Matt 15:32-39": "En Jezus riep Zijn discipelen tot Zich en zei: Ik ben innerlijk met ontferming bewogen over de menigte, omdat zij nu al drie dagen bij Mij gebleven zijn, en niets hebben om te eten; en Ik wil hen niet nuchter van Mij laten gaan, zodat zij op de weg niet bezwijken. En Zijn discipelen zeiden tegen Hem: Waar zullen wij in de woestijn zoveel broden krijgen, dat wij zo'n grote menigte zouden verzadigen? En Jezus zei tegen hen: Hoeveel broden hebt u? Zij zeiden: Zeven, en een paar visjes.", "Matt 4:25": "En grote menigten volgden Hem na, vanuit Galilea en Dekapolis, en Jeruzalem, en Judea, en van over de Jordaan.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Luk 8:25": "En Hij zei tegen hen: Waar is uw geloof? Maar zij werden bevreesd en verwonderden zich, en zeiden tegen elkaar: Wie is toch Deze, dat Hij ook de winden en het water gebiedt, en zij Hem gehoorzaam zijn?", "Matt 17:5": "Terwijl hij nog sprak, zie, een lichtende wolk overschaduwde hen; en zie, een stem uit de wolk zei: Dit is Mijn geliefde Zoon, in wie Ik Mijn welbehagen heb; luister naar Hem!", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Matt 4:3": "En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Hand 12:2": "Hij doodde Jakobus, de broer van Johannes, met het zwaard.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Rom 8:35": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Richt 6:15": "En hij zei tegen Hem: Och, mijn Heere! Waarmee zal ik Israël verlossen? Zie, mijn geslacht is het armste in Manasse, en ik ben de kleinste in mijn vaders huis.", "Ex 3:16": "Ga heen, en verzamel de oudsten van Israël, en zeg tegen hen: De HEERE, de God van uw vaderen, is mij verschenen, de God van Abraham, Izak en Jakob, en Hij zei: Ik heb u getrouw bezocht, en gezien wat u in Egypte is aangedaan;", "Matt 27:58-61": "Deze ging naar Pilatus en vroeg om het lichaam van Jezus. Toen gaf Pilatus bevel dat het hem gegeven zou worden. En Jozef nam het lichaam en wikkelde het in een schoon, fijn linnen kleed. En hij legde het in zijn nieuwe graf, dat hij in een rots had uitgehouwen; en nadat hij een grote steen voor de ingang van het graf gerold had, ging hij weg.", "Mark 10:16": "En Hij omarmde ze met Zijn armen, en Hij legde de handen op hen, en zegende hen.", "Joh 5:37": "En de Vader, Die Mij gezonden heeft, Die heeft Zelf van Mij getuigd. U hebt Zijn stem nooit gehoord, en Zijn gedaante ook niet gezien.", "Micha 5:3": "En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "1 Tess 4:13": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben.", "Mark 6:53": "En toen zij overgevaren waren, kwamen zij in het land Gennesareth, en meerden daar aan.", "Joh 14:1-3": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij. In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden. En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Joh 6:7": "Filippus antwoordde Hem: Voor tweehonderd penningen brood is voor hen niet genoeg, zodat ieder van hen een klein beetje krijgt.", "Luk 9:18": "En het gebeurde, terwijl Hij eens alleen aan het bidden was en de discipelen bij Hem waren, dat Hij hun vroeg: Wie zeggen de menigten dat Ik ben?", "Mark 9:42": "En wie een van deze kleinen die in Mij geloven, doet struikelen, het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd, en dat hij in de zee geworpen werd.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Richt 21:7": "Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want wij hebben bij de HEERE gezworen dat wij hun geen van onze dochters tot vrouwen zullen geven.", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Jes 66:5": "Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "1 Tim 4:4": "Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt;", "1 Sam 16:2": "Maar Samuël zei: Hoe zou ik kunnen gaan? Saul zal het horen en mij doden. Toen zei de HEERE: Neem een kalf van de runderen met u mee, en zeg: Ik ben gekomen om de HEERE een offer te brengen.", "2 Kon 4:42-44": "En er kwam een man van Baäl-Salisa, en bracht de man Gods brood van de eerstelingen, twintig gerstebroden, en groene aren in hun schillen; en hij zei: Geef aan het volk, zodat zij eten. Doch zijn dienaar zei: Wat, zou ik dit aan honderd mannen voorzetten? En hij zei: Geef aan het volk, zodat zij eten; want zo zegt de HEERE: Men zal eten en overhouden. Zo zette hij het hun voor, en zij aten, en zij hielden over, naar het woord van de HEERE.", "Joh 13:29": "Want sommigen dachten, omdat Judas de beurs had, dat Jezus tegen hem zei: Koop wat wij nodig hebben voor het feest, of dat hij de armen wat geven zou.", "Openb 10:8": "En de stem die ik gehoord had uit de hemel, sprak opnieuw met mij, en zei: Ga heen, neem het boekje dat geopend is en in de hand is van de engel die op de zee en op de aarde staat.", "Hand 9:4": "en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Joh 11:42": "Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Joh 9:35-38": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God? Hij antwoordde en zei: Wie is Hij, Heere, opdat ik in Hem geloven kan? En Jezus zei tegen hem: U hebt Hem gezien, en Hij die met u spreekt, Die is het.", "Num 15:39": "En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert;", "Matt 2:2": "Zij zeiden: Waar is de geboren Koning van de Joden? Want wij hebben Zijn ster gezien in het Oosten, en zijn gekomen om Hem te aanbidden.", "Luk 23:42": "En hij zei tegen Jezus: Heere, denk aan mij, wanneer U in Uw Koninkrijk gekomen bent.", "Ezech 35:6": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker tot bloed bestemmen, en het bloed zal u achtervolgen; omdat u het bloed niet hebt gehaat, zal het bloed u ook achtervolgen.", "Joz 9:14": "Toen namen de mannen van hun reiskost; en zij vroegen het de mond van de HEERE niet.", "1 Sam 14:24": "En de mannen van Israël werden uitgeput op die dag, want Saul had het volk bezworen en gezegd: Vervloekt is de man die voedsel eet vóór de avond, totdat ik mij op mijn vijanden gewroken heb! Daarom proefde heel het volk geen voedsel.", "Joh 18:8": "Jezus antwoordde: Ik heb u gezegd dat Ik het ben. Als u dan Mij zoekt, laat dezen dan gaan.", "Ps 85:6-8": "Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Joh 7:46": "De dienaars antwoordden: Nooit heeft een mens zo gesproken, zoals deze Mens.", "Mark 11:18": "En de Schriftgeleerden en de overpriesters hoorden dat, en zochten hoe zij Hem konden doden; want zij waren bang voor Hem, omdat de hele menigte verbaasd was over Zijn onderwijs.", "Luk 9:3-17": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben. En in welk huis u ook binnengaat, blijf daar, en vertrek pas vandaar. En wie u niet zullen ontvangen, schud bij het weggaan uit die stad het stof van uw voeten af, tot een getuigenis tegen hen.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Joh 10:42": "En velen geloofden daar in Hem.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jona 2:1-10": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Jer 15:18": "Waarom is mijn pijn steeds durend, en mijn plaag smartelijk? Zij weigert genezen te worden; zou U voor mij helemaal als een leugenachtige zijn, als water dat niet betrouwbaar is?", "Joh 11:25": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven;", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Matt 19:1": "En het gebeurde, toen Jezus deze woorden geëindigd had, dat Hij vertrok van Galilea, en kwam over de Jordaan, in de landstreken van Judea.", "Ps 103:14": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "1 Sam 28:10": "Saul nu zwoer haar bij de HEERE en zei: Zo waarachtig als de HEERE leeft, u zal geen straf om deze zaak overkomen!", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "1 Kor 15:28": "En wanneer Hem alle dingen onderworpen zullen zijn, dan zal ook de Zoon Zelf onderworpen worden aan Hem Die Hem alle dingen onderworpen heeft, opdat God alles in allen zal zijn.", "Ps 35:17": "Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.", "1 Kon 18:13": "Is mijn heer niet verteld wat ik gedaan heb, toen Izebel de profeten van de HEERE doodde? Dat ik van de profeten van de HEERE honderd man heb verborgen, elk vijftig man in een grot, en hen met brood en water heb onderhouden?", "Hebr 10:27": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden.", "Ps 69:3": "Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij.", "Luk 5:6": "En toen zij dat gedaan hadden, vingen ze een grote hoeveelheid vissen, en hun net scheurde.", "Hand 8:37": "En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.", "Hand 19:12": "zodat ook van zijn lijf op de zieken gedragen werden de zweetdoeken of gordeldoeken, en dat de ziekten van hen weken, en de boze geesten van hen uitvoeren.", "Mark 5:6": "Toen hij nu Jezus van verre zag, rende hij ernaartoe, en aanbad Hem.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Mark 12:37": "David zelf noemt Hem dan zijn Heere, en hoe is Hij dan zijn Zoon? En de menigte hoorde Hem graag.", "1 Sam 11:11": "Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "Kol 1:19": "Want het is het welbehagen van de Vader geweest, dat in Hem heel de volheid wonen zou;", "Luk 21:38": "En al het volk kwam 's morgens vroeg naar Hem toe in de tempel, om Hem te horen.", "Ef 1:12-14": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben. In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte; Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Joz 9:19": "Toen zeiden alle leiders tegen de hele vergadering: Wij hebben hun gezworen bij de HEERE, de God van Israël; daarom kunnen wij hen niet aanraken.", "Openb 16:6": "Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "Mark 14:32-39": "En zij kwamen op een plaats waarvan de naam Gethsémané was, en Hij zei tegen Zijn discipelen: Blijf hier zitten, totdat Ik gebeden zal hebben. En Hij nam Petrus, en Jakobus, en Johannes met Zich mee, en begon zeer ontsteld en angstig te worden; en Hij zei tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijf hier, en waak.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Jes 63:15-17": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "Mark 8:28": "En zij antwoordden: Johannes de Doper; en anderen: Elia; en anderen: Een van de profeten.", "1 Kor 15:24": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Matt 15:31": "Zodat de menigten zich verwonderden, toen zij zagen dat de stommen spraken, de lammen gezond waren, de kreupelen liepen, en de blinden zagen; en zij verheerlijkten de God van Israël.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Hand 25:3-9": "En vroegen hem een gunst tegen Paulus, namelijk dat hij hem zou laten overbrengen naar Jeruzalem; want zij hadden een hinderlaag gelegd om hem onderweg om te brengen. Maar Festus antwoordde dat Paulus in Cesarea bewaakt werd, en dat hijzelf binnenkort daarheen zou reizen. Laat dan, zei hij, degenen onder u die daartoe in staat zijn met mij meereizen, en als er iets onbehoorlijks in deze man is, laten zij hem beschuldigen.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Ezra 1:9": "En dit is hun aantal: dertig gouden bekkens, duizend zilveren bekkens, negenentwintig messen;", "Matt 8:3": "En Jezus, de hand uitstrekkend, raakte hem aan, en zei: Ik wil, word gereinigd! En meteen werd hij van zijn melaatsheid gereinigd.", "Jer 2:30": "Tevergeefs heb
