t de doden, en daarom werken die krachten in Hem. Anderen zeiden: Hij is Elia; en anderen zeiden: Hij is een profeet, of als een van de profeten. Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden.", "1 Kon 17:4": "En het zal gebeuren dat u uit de beek zult drinken; en Ik heb de raven geboden dat zij u daar onderhouden.", "Matt 11:3": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?", "Ps 78:32": "Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen.", "Joh 1:34": "En ik heb gezien, en heb getuigd, dat Deze de Zoon van God is.", "Mark 1:11": "En er kwam een stem uit de hemelen: U bent Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Hebr 4:5-7": "En op deze plaats opnieuw: Zij zullen Mijn rust niet ingaan! Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid, bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Matt 27:43": "Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "Luk 2:8": "En er waren herders in diezelfde landstreek, die in het veld verbleven en 's nachts de wacht hielden over hun kudde.", "Joh 7:12": "En er was veel gemurmel over Hem onder de menigten. Sommigen zeiden: Hij is goed; en anderen zeiden: Nee, maar Hij verleidt de menigte.", "Joh 5:23": "opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft.", "2 Kor 1:19": "Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.", "Mark 1:40": "En er kwam een melaatse tot Hem, die Hem smeekte, op de knieën viel voor Hem, en tegen Hem zei: Als U wilt, kunt U mij reinigen.", "Luk 22:70": "En zij zeiden allen: Bent U dan de Zoon van God? En Hij zei tegen hen: U zegt dat Ik het ben.", "Luk 20:13": "En de heer van de wijngaard zei: Wat zal ik doen? Ik zal mijn geliefde zoon sturen; misschien zullen zij hem ontzien als zij hem zien.", "Matt 8:2": "En zie, een melaatse kwam en aanbad Hem, en zei: Heere, als U wilt, kunt U mij reinigen.", "Mark 9:20-22": "En zij brachten hem bij Hem; en toen hij Hem zag, deed de geest hem meteen stuiptrekken; en hij viel op de grond, en rolde zich schuimend om. En Hij vroeg zijn vader: Hoe lang is het al geleden dat hem dit overkomen is? En hij zei: Van zijn kindsheid af. En vaak heeft hij hem ook in het vuur en in het water geworpen, om hem te vernietigen; maar als U iets kunt, wees met ontferming over ons bewogen, en help ons.", "Deut 18:18": "Een Profeet zal Ik hun doen opstaan uit hun broeders, zoals u; en Ik zal Mijn woorden in Zijn mond leggen, en Hij zal tot hen spreken alles wat Ik Hem gebieden zal.", "1 Kor 10:17": "Want er is één brood, en zo zijn wij, hoewel velen, één lichaam, omdat wij allen deel hebben aan dat ene brood.", "Joh 4:47": "Deze, die gehoord had dat Jezus uit Judea in Galilea kwam, ging naar Hem toe, en vroeg Hem of Hij wilde afkomen en zijn zoon gezond maken; want hij lag op sterven.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Matt 8:23-27": "En toen Hij in het schip gegaan was, volgden Zijn discipelen Hem. En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep. En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Klaagl 3:8": "Gimel. Ook wanneer ik roep en schreeuw, sluit Hij Zijn oren voor mijn gebed.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Hand 26:13-15": "Zag ik, o koning, midden op de dag, op de weg een licht, sterker dan de glans van de zon, vanuit de hemel mij en hen die met mij reisden omschijnen. En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan. En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "Mark 6:2-6": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren? Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem. En Jezus zei tegen hen: Een profeet is niet zonder eer, behalve in zijn eigen vaderland en onder zijn verwanten en in zijn huis.", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Joh 8:22": "De Joden zeiden dan: Zal Hij zichzelf soms doden, omdat Hij zegt: Waar Ik heenga, kunt u niet komen?", "Pred 10:20": "Vloek de koning niet, zelfs niet in uw gedachten, en vloek de rijke niet in het binnenste van uw slaapkamer; want het gevogelte des hemels zou de stem wegvoeren, en het gevleugelde zou het woord bekendmaken.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Joh 7:16": "Jezus antwoordde hun en zei: Mijn leer is niet van Mij, maar van Hem die Mij gezonden heeft.", "Luk 1:37": "Want geen ding zal bij God onmogelijk zijn.", "Joh 12:37": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem;", "Hand 26:26": "Want de koning weet van deze dingen, tot wie ik ook vrijmoedig spreek; want ik geloof niet dat hem iets van deze dingen verborgen is; want dit is niet in een hoek gebeurd.", "Gal 1:16": "om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;", "Deut 4:11": "En u kwam dichterbij en stond onder aan die berg (die berg brandde nu van vuur tot aan het midden van de hemel; er was duisternis, wolken en donkerheid).", "1 Kor 16:20": "U groeten al de broeders. Groet elkaar met een heilige kus.", "Luk 24:21": "En wij hoopten dat Hij Degene was Die Israël verlossen zou. Maar toch, ook naast dit alles, is het vandaag de derde dag sinds deze dingen gebeurd zijn.", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Matt 10:14": "En als iemand u niet ontvangt, en uw woorden niet hoort, schudt dan bij het verlaten van dat huis of die stad het stof van uw voeten af.", "Mark 14:50": "En zij verlieten Hem, en vluchtten allen.", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Hand 15:11": "Maar wij geloven door de genade van de Heere Jezus Christus zalig te worden, op dezelfde wijze als ook zij.", "Luk 9:54": "Toen Zijn discipelen Jakobus en Johannes dit zagen, zeiden zij: Heere, wilt U dat wij zeggen dat er vuur uit de hemel neerdaalt om hen te verslinden, zoals ook Elia gedaan heeft?", "Joh 10:24": "De Joden dan omringden Hem, en zeiden tegen Hem: Hoe lang houdt U ons nog in het onzekere? Als U de Christus bent, zeg het ons ronduit.", "Num 22:35": "De Engel van de HEERE zei toen tegen Bileam: Ga met deze mannen mee; maar alleen dat woord dat Ik tot u spreken zal, dat zult u spreken. Zo ging Bileam met de vorsten van Balak mee.", "Luk 4:35": "En Jezus bestrafte hem en zei: Zwijg, en ga uit hem weg. En de duivel wierp hem in het midden neer, en voer uit hem weg, zonder hem iets te beschadigen.", "Joh 4:52": "Toen vroeg hij hun naar het uur waarop het beter met hem geworden was. En zij zeiden tegen hem: Gisteren op het zevende uur verliet de koorts hem.", "1 Kor 10:33": "Zoals ik ook in alles allen probeer te behagen, niet mijn eigen voordeel zoekend, maar dat van velen, opdat zij behouden worden.", "Ezech 11:22": "Toen tilden de cherubs hun vleugels op, en de raderen tegenover hen; en de heerlijkheid van de God van Israël was van boven over hen.", "Luk 24:37-39": "En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen. En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart? Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.", "Matt 11:6": "En gelukkig is hij, die aan Mij niet geërgerd zal worden.", "2 Kor 4:11": "Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden.", "Mark 9:22": "En vaak heeft hij hem ook in het vuur en in het water geworpen, om hem te vernietigen; maar als U iets kunt, wees met ontferming over ons bewogen, en help ons.", "Joh 10:15": "Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen.", "Matt 11:16-19": "Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen, En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend. Want Johannes is gekomen, niet etend, niet drinkend, en zij zeggen: Hij heeft de duivel.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Rom 6:9": "Terwijl wij weten dat Christus, opgewekt uit de doden, niet meer sterft; de dood heerst niet meer over Hem.", "Joh 12:47": "En als iemand Mijn woorden gehoord heeft en niet gelooft, oordeel Ik hem niet; want Ik ben niet gekomen om de wereld te oordelen, maar om de wereld zalig te maken.", "Matt 21:23-25": "En toen Hij in de tempel gekomen was, kwamen de overpriesters en de oudsten van het volk naar Hem toe terwijl Hij onderwees, en zeiden: Door welke macht doet U deze dingen? En wie heeft U deze macht gegeven? En Jezus antwoordde en zei tegen hen: Ik zal u ook één ding vragen; als u Mij dat zegt, zal Ik u ook zeggen door welke macht Ik deze dingen doe. De doop van Johannes, waar kwam die vandaan, uit de hemel of van de mensen? En zij overlegden bij zichzelf en zeiden: Als wij zeggen: Uit de hemel, dan zal Hij ons zeggen: Waarom hebt u hem dan niet geloofd?", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Jer 31:31-34": "Zie, de dagen komen, spreekt de HEERE, dat Ik met het huis van Israël en met het huis van Juda een nieuw verbond zal sluiten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE; Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Ef 5:30": "Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "Joh 20:27": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Kol 1:15": "Die het Beeld is van de onzienlijke God, de Eerstgeborene van alle schepselen.", "Matt 12:45": "Dan gaat hij weg en neemt zeven andere geesten met zich mee, slechter dan hijzelf, en zij gaan naar binnen en wonen daar; en het laatste van die mens wordt erger dan het eerste. Zo zal het ook met dit slechte geslacht gaan.", "Openb 1:17": "En toen ik Hem zag, viel ik als dood aan Zijn voeten; en Hij legde Zijn rechterhand op mij, en zei tegen mij: Wees niet bang; Ik ben de Eerste en de Laatste;", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "1 Joh 5:14": "En dit is de vrijmoedigheid die wij tegenover Hem hebben, dat als wij iets bidden naar Zijn wil, Hij ons verhoort.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Mark 9:2": "En na zes dagen nam Jezus Petrus, en Jakobus, en Johannes met Zich mee, en bracht hen alleen op een hoge berg, apart; en Hij werd voor hen van gedaante veranderd.", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Luk 9:36": "En toen de stem geklonken had, werd Jezus alleen aangetroffen. En zij zwegen erover, en vertelden in die dagen aan niemand iets van wat zij gezien hadden.", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "2 Kon 19:6": "En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.", "Deut 31:15": "Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur van de tent.", "Hand 2:16-21": "Maar dit is wat gesproken is door de profeet Joël: En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren.", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "Ps 2:1-3": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Mark 9:9": "En toen zij van de berg afkwamen, gebood Hij hun dat zij aan niemand zouden vertellen wat zij gezien hadden, totdat de Zoon des mensen uit de doden zou zijn opgestaan.", "Ps 115:11": "U die de HEERE vreest! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "1 Tim 2:1": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen;", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "Joh 20:3-6": "Petrus dan ging naar buiten, en de andere discipel, en zij kwamen bij het graf. En deze twee liepen tegelijk; en de andere discipel liep vooruit, sneller dan Petrus, en kwam eerst bij het graf. En toen hij zich vooroverboog, zag hij de doeken liggen; toch ging hij er niet in.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ezra 8:21-23": "Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have. Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten. Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Mark 9:13": "Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Mark 16:14": "Daarna verscheen Hij aan de elf, terwijl zij aanzaten, en verweet hun hun ongeloof en hardheid van hart, omdat zij hen die Hem gezien hadden nadat Hij opgestaan was, niet geloofd hadden.", "Hand 16:18": "En dit deed zij vele dagen lang. Maar Paulus, die daarover geërgerd was, keerde zich om en zei tegen de geest: Ik gebied u in de Naam van Jezus Christus dat u van haar uitgaat. En hij ging uit op datzelfde moment.", "Joh 17:21-23": "Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt. En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn; Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Gen 18:18": "Omdat Abraham zeker tot een groot en machtig volk zal worden, en alle volken van de aarde in hem gezegend zullen worden?", "Mark 12:10": "Hebt u deze Schrift niet gelezen: De steen die de bouwers verworpen hebben, die is tot een hoeksteen geworden;", "Gen 26:7": "En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.", "Openb 6:11": "En aan ieder werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleine tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden worden, zoals ook zij.", "Jes 42:21": "De HEERE had een welbehagen aan Hem, om Zijn gerechtigheid; Hij maakte Hem groot door de wet, en Hij maakte Hem heerlijk.", "Joh 5:20-23": "Want de Vader heeft de Zoon lief, en toont Hem alles wat Hijzelf doet; en Hij zal Hem grotere werken tonen dan deze, zodat u zich verwondert. Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil. Want ook de Vader oordeelt niemand, maar heeft heel het oordeel aan de Zoon gegeven,", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "Joh 14:9-11": "Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken. Geloof Mij, dat Ik in de Vader ben en de Vader in Mij is; en zo niet, geloof Mij dan om de werken zelf.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Joh 10:17": "Daarom heeft de Vader Mij lief, omdat Ik Mijn leven afleg, opdat Ik het opnieuw neem.", "Matt 21:32": "Want Johannes is naar u toe gekomen op de weg van gerechtigheid, en u hebt hem niet geloofd; maar de tollenaars en de hoeren hebben hem geloofd; en u, terwijl u dat zag, hebt daarna geen berouw gehad om hem alsnog te geloven.", "Luk 13:34": "Jeruzalem, Jeruzalem! U die de profeten doodt en stenigt hen die naar u toe gezonden zijn, hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens onder haar vleugels verzamelt; en u hebt niet gewild?", "Joh 1:18": "Niemand heeft ooit God gezien; de eniggeboren Zoon, Die in de schoot van de Vader is, Die heeft Hem ons verklaard.", "Matt 4:11": "Toen liet de duivel Hem los; en zie, de engelen kwamen naar Hem toe, en dienden Hem.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "Luk 9:31": "die in heerlijkheid verschenen en spraken over Zijn heengaan, dat Hij te Jeruzalem zou volbrengen.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Rom 11:7": "Wat dan? Wat Israël zoekt, dat heeft het niet verkregen; maar de uitverkorenen hebben het verkregen, en de anderen zijn verhard geworden.", "2 Kon 15:19": "Toen kwam Pul, de koning van Assyrië, tegen het land; en Menahem gaf aan Pul duizend talenten van het zilver, opdat zijn hand met hem zou zijn, om het koninkrijk in zijn hand te versterken.", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Luk 3:4-6": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! Elk dal zal gevuld worden, en elke berg en heuvel zal verlaagd worden, en de kromme wegen zullen tot een rechte weg worden, en de oneffen tot effen wegen. En alle vlees zal de zaligheid van God zien.", "Spr 3:24-26": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn. Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt. Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Joh 6:47": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, heeft het eeuwige leven.", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Hand 5:30-32": "De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven. En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.", "1 Kor 8:13": "Daarom, als het voedsel mijn broeder ergert, zal ik in eeuwigheid geen vlees eten, opdat ik mijn broeder niet erger.", "Luk 20:22-25": "Is het ons geoorloofd de keizer belasting te betalen, of niet? En Hij doorzag hun sluwheid, en zei tegen hen: Waarom stelt u Mij op de proef? Laat Mij een penning zien; van wie is de afbeelding en het opschrift die hij draagt? En zij antwoordden en zeiden: Van de keizer.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Luk 24:11": "En hun woorden leken hun als onzinnig gepraat, en zij geloofden hen niet.", "Joh 12:23": "Maar Jezus antwoordde hun: Het uur is gekomen dat de Zoon des mensen verheerlijkt zal worden.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Hand 2:44-47": "En allen die geloofden, waren bijeen, en hadden alle dingen gemeenschappelijk; En zij verkochten hun bezittingen en have, en verdeelden die onder allen, naar dat ieder nodig had. En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Luk 20:42": "En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Ps 69:8-10": "Want om Uwentwil draag ik smaad; schande heeft mijn gezicht bedekt. Ik ben mijn broeders vreemd geworden, en onbekend aan de kinderen van mijn moeder. Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "1 Kor 12:9": "en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Rom 8:3": "Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Luk 9:30": "En zie, twee mannen spraken met Hem; dat waren Mozes en Elia,", "Num 9:15-23": "En op de dag van het oprichten van de tabernakel bedekte de wolk de tabernakel, op de tent der getuigenis; en in de avond was er over de tabernakel als het ware een gedaante van het vuur, tot aan de morgen. Zo gebeurde het voortdurend; de wolk bedekte hem, en 's nachts was er een gedaante van het vuur. Maar nadat de wolk werd opgeheven van boven de tent, zo trokken daarna ook de kinderen van Israël verder; en op de plaats waar de wolk bleef, daar legerden de kinderen van Israël zich.", "Matt 24:36": "Maar die dag en dat uur kent niemand, ook de engelen van de hemelen niet, maar alleen Mijn Vader.", "Mark 9:2-10": "En na zes dagen nam Jezus Petrus, en Jakobus, en Johannes met Zich mee, en bracht hen alleen op een hoge berg, apart; en Hij werd voor hen van gedaante veranderd. En Zijn kleren werden blinkend, zeer wit als sneeuw, zoals geen wolwasser op aarde ze zo wit kan maken. En aan hen verschenen Elia met Mozes, en zij spraken met Jezus.", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "Dan 8:18": "Terwijl hij met mij sprak, viel ik in een diepe slaap met mijn gezicht op de grond; toen raakte hij mij aan, en hij zette mij weer overeind op de plaats waar ik stond.", "Mark 9:19": "En Hij antwoordde hem en zei: O ongelovig geslacht, hoelang zal Ik nog bij u zijn? Hoelang zal Ik u nog verdragen? Breng hem bij Mij.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "Matt 26:53": "Of denkt u dat Ik Mijn Vader nu niet kan bidden, en Hij zal Mij meer dan twaalf legioenen engelen ter beschikking stellen?", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "1 Petr 2:17": "Eer ieder; heb de broederschap lief; vrees God; eer de koning.", "Matt 8:13": "En Jezus zei tegen de hoofdman over honderd: Ga heen, en het gebeurt u zoals u geloofd hebt. En zijn knecht is gezond geworden op datzelfde moment.", "Rom 14:10": "Maar u, wat oordeelt u uw broeder? Of ook u, wat veracht u uw broeder? Want wij zullen allen voor de rechterstoel van Christus gesteld worden.", "Joh 20:21": "Jezus zei dan opnieuw tegen hen: Vrede zij u; zoals de Vader Mij gezonden heeft, zend Ik ook u.", "Joh 7:29": "Maar Ik ken Hem; want Ik ben van Hem, en Hij heeft Mij gezonden.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Ps 73:13-17": "Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen. Als ik zou zeggen: Ik zal ook zo spreken; zie, dan zou ik trouweloos zijn tegenover het geslacht van Uw kinderen.", "2 Kor 6:14-16": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Hand 6:8": "En Stefanus, vol van geloof en kracht, deed wonderen en grote tekenen onder het volk.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Hebr 3:19": "En wij zien dat zij niet konden binnengaan vanwege hun ongeloof.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Joh 1:22-28": "Zij zeiden dan tegen hem: Wie bent u? opdat wij antwoord kunnen geven aan hen die ons gezonden hebben; wat zegt u van uzelf? Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft. En de afgezondenen waren uit de Farizeeën;", "Matt 15:30": "En veel menigten kwamen tot Hem, met bij zich kreupelen, blinden, stommen, lammen, en veel anderen, en zij legden ze aan de voeten van Jezus; en Hij genas hen.", "Mark 4:40": "En Hij zei tegen hen: Waarom bent u zo angstig? Hoe kan het dat u geen geloof hebt?", "Hand 13:46": "Maar Paulus en Barnabas zeiden vrijmoedig: Het was nodig dat eerst tot u het Woord van God gesproken zou worden; doch aangezien u het verstoot, en uzelf het eeuwige leven niet waard oordeelt, zie, wij keren ons tot de heidenen.", "Luk 24:46": "En Hij zei tegen hen: Zo staat er geschreven, en zo moest de Christus lijden, en op de derde dag opstaan uit de doden.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Joh 14:19": "Nog een korte tijd, en de wereld zal Mij niet meer zien; maar u zult Mij zien; want Ik leef, en u zult leven.", "Ef 3:17": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent;", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Ex 4:13": "Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.", "Matt 27:53": "en nadat zij na Zijn opstanding uit de graven weggegaan waren, kwamen zij in de heilige stad, en zijn aan velen verschenen.", "Joh 7:3-5": "Zijn broers zeiden dan tegen Hem: Vertrek van hier en ga naar Judea, zodat ook Uw discipelen de werken kunnen zien die U doet. Want niemand doet iets in het verborgen als hij zelf zoekt om openlijk bekend te zijn. Als U deze dingen doet, laat Uzelf dan aan de wereld zien. Want ook Zijn broers geloofden niet in Hem.", "Hand 13:3": "Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "Matt 26:56": "maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Deut 1:33": "Die voor u uit op de weg ging, om voor u de plaats uit te zoeken waar u zou legeren; 's nachts in het vuur, om u de weg te wijzen waarin u zou gaan, en overdag in de wolk.", "Joh 1:2": "Dit was in het begin bij God.", "Matt 9:22": "En Jezus keerde Zich om, en toen Hij haar zag, zei Hij: Houd moed, dochter! Uw geloof heeft u behouden. En de vrouw werd op dat moment gezond.)", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Mark 5:7": "En met luide stem roepend, zei hij: Wat heb ik met U te maken, Jezus, Zoon van God, de Allerhoogste? Ik bezweer U bij God, dat U mij niet pijnigt!", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Rom 4:24": "Maar ook om onzentwil, aan wie het zal toegerekend worden, namelijk aan hen die geloven in Hem, Die Jezus, onze Heere, uit de doden opgewekt heeft;", "Joh 8:26-29": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld. Zij begrepen niet dat Hij tot hen over de Vader sprak. Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "Joh 14:31": "Maar opdat de wereld weet dat Ik de Vader liefheb, en zo doe zoals de Vader Mij geboden heeft. Sta op, laten wij vanhier gaan.", "Joh 14:20": "Op die dag zult u weten dat Ik in Mijn Vader ben, en u in Mij, en Ik in u.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Matt 12:38-45": "Toen antwoordden sommigen van de Schriftgeleerden en Farizeeën: Meester, wij willen graag een teken van U zien. Maar Hij antwoordde en zei tegen hen: Het slechte en overspelige geslacht verlangt een teken; en hun zal geen teken gegeven worden, dan het teken van de profeet Jona. Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "Hand 19:4": "Maar Paulus zei: Johannes heeft wel gedoopt met de doop van bekering, en zei tegen het volk dat zij geloven zouden in Hem Die na hem kwam, dat is, in Christus Jezus.", "Matt 15:28": "Toen antwoordde Jezus en zei tegen haar: O vrouw! groot is uw geloof; u geschiede zoals u wilt. En haar dochter werd gezond vanaf dat moment.", "Ps 22:16": "Mijn kracht is verdroogd als een potscherf, en mijn tong kleeft aan mijn gehemelte; en U legt mij in het stof van de dood.", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Luk 2:1-5": "En het gebeurde in diezelfde dagen, dat er een gebod uitging van de keizer Augustus, dat heel de wereld ingeschreven zou worden. Deze eerste inschrijving gebeurde toen Cyrenius over Syrië stadhouder was. En zij gingen allen om ingeschreven te worden, ieder naar zijn eigen stad.", "Mark 5:23": "en smeekte Hem dringend: Mijn dochtertje ligt op sterven; ik smeek U, kom en leg de handen op haar, opdat zij behouden wordt, en zij zal leven.", "Joh 10:25": "Jezus antwoordde hun: Ik heb het u gezegd, en u gelooft het niet. De werken die Ik doe in de Naam van Mijn Vader, die getuigen van Mij.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Hand 1:22": "beginnend vanaf de doop van Johannes, tot de dag toe waarop Hij van ons opgenomen is, één van hen met ons getuige wordt van Zijn opstanding.", "Matt 27:39": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd,", "Hebr 5:5": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.", "Mark 9:33": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar?", "Ps 132:17": "Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Hebr 1:1-3": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon; Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft; Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Mark 1:32": "Toen het nu avond geworden was, toen de zon onderging, brachten zij tot Hem allen die ziek waren en die door de duivel bezeten waren.", "Luk 24:15-25": "En het gebeurde, terwijl zij samen spraken en elkaar ondervroegen, dat Jezus Zelf bij hen kwam, en met hen meeging. En hun ogen werden gehouden, zodat zij Hem niet herkenden. En Hij zei tegen hen: Wat zijn dit voor gesprekken die u onderweg met elkaar voert, en waarom kijkt u zo droevig?", "Jes 6:4": "Zodat de posten van de dorpels bewogen door de stem van hem die riep; en het huis werd vervuld met rook.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.", "1 Kor 15:27": "Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.", "Rom 9:25": "Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.", "1 Kor 15:4": "en dat Hij is begraven, en dat Hij is opgewekt op de derde dag, naar de Schriften;", "Ps 22:23-32": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen. U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël! Want Hij heeft niet veracht, noch verfoeid de verdrukking van de verdrukte, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, toen hij tot Hem riep.", "Num 10:33-36": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren. En de wolk van de HEERE was overdag over hen, als zij uit het leger vertrokken. Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Fil 1:5": "Vanwege uw gemeenschap aan het Evangelie, vanaf de eerste dag tot nu toe;", "Jes 19:8": "En de vissers zullen treuren, en allen die de angel in de stromen werpen, zullen rouw bedrijven; en zij die het werpnet uitspreiden op het water, zullen kwijnen.", "Joh 15:9": "Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde.", "Mark 8:30": "En Hij gebood hun streng, dat zij het niemand zouden zeggen over Hem.", "Ps 109:25": "Nog ben ik hun een smaad; als zij mij zien, schudden zij hun hoofd.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Rom 11:30-32": "Want zoals ook u eertijds God ongehoorzaam geweest bent, maar nu barmhartigheid verkregen hebt door hun ongehoorzaamheid; Zo zijn ook dezen nu ongehoorzaam geweest, opdat ook zij door uw barmhartigheid barmhartigheid zouden verkrijgen. Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "2 Petr 2:11": "terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere.", "Openb 1:14": "En Zijn hoofd en haar was wit, als witte wol, als sneeuw; en Zijn ogen als een vlam van het vuur;", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Matt 9:15": "En Jezus zei tegen hen: Kunnen de bruiloftsgasten treuren, zolang de Bruidegom bij hen is? Maar de dagen zullen komen, wanneer de Bruidegom van hen weggenomen zal zijn, en dan zullen zij vasten.", "Rom 8:34": "Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt.", "Luk 1:16": "En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God.", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "Rom 5:10": "Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven.", "Matt 27:35": "Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.", "Rom 11:20": "Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Hebr 3:1-6": "Daarom, heilige broeders, die deel hebben aan de hemelse roeping, richt uw aandacht op de Apostel en Hogepriester van onze belijdenis, Christus Jezus; Die trouw is aan Hem Die Hem aangesteld heeft, zoals ook Mozes trouw was in heel Zijn huis. Want Deze is zoveel meer heerlijkheid waard geacht dan Mozes, zoals degene die het huis gebouwd heeft, meer eer heeft dan het huis.", "Mark 15:24": "En toen zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, en wierpen het lot erover, wat ieder zou wegnemen.", "Matt 26:2": "U weet dat na twee dagen het Pascha is, en de Zoon des mensen zal overgeleverd worden om gekruisigd te worden.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Matt 17:24-27": "En toen zij in Kapernaüm gekomen waren, kwamen zij die de tempelbelasting inden naar Petrus toe en zeiden: Betaalt uw Meester de tempelbelasting niet? Hij zei: Ja. En toen hij het huis binnenkwam, sprak Jezus hem voor en zei: Wat denkt u, Simon? Van wie innen de koningen van de aarde tol of belasting: van hun eigen zonen, of van vreemden? Petrus zei tegen Hem: Van vreemden. Jezus zei tegen hem: Dan zijn de zonen dus vrij.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Dan 9:21": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer.", "Luk 9:28": "En het gebeurde ongeveer acht dagen na deze woorden, dat Hij Petrus, Johannes en Jakobus meenam en de berg opklom om te bidden.", "Mark 4:31": "Namelijk met een mosterdzaad, dat, wanneer het in de aarde gezaaid wordt, het kleinste is van alle zaden die op de aarde zijn.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Matt 26:21": "En terwijl zij aten, zei Hij: Voorwaar, Ik zeg u dat één van u Mij zal verraden.", "Jes 6:2": "De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Ex 33:10": "Toen het volk de wolkkolom in de deur van de tent zag staan, stond al het volk op, en zij bogen zich, ieder in de deur van zijn tent.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Openb 22:3-5": "En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen; En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn. En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "Joh 11:4": "En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.", "Luk 9:40": "En ik heb Uw discipelen gevraagd hem uit te werpen, en zij konden het niet.", "Matt 14:29-31": "En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen. Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij! En Jezus stak meteen Zijn hand uit, greep hem vast, en zei tegen hem: Kleingelovige! Waarom heb je getwijfeld?", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "1 Sam 22:4": "En hij bracht hen voor het aangezicht van de koning van de Moabieten; en zij bleven bij hem al de dagen dat David in de vesting was.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "Openb 19:14": "En de legers in de hemel volgden Hem op witte paarden, gekleed met wit en rein fijn linnen.", "Klaagl 3:18": "Vau. Toen zei ik: Mijn sterkte is vergaan, en mijn hoop van de HEERE.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Num 10:11": "En het gebeurde in het tweede jaar, in de tweede maand, op de twintigste van de maand, dat de wolk omhoog gebracht werd van boven de tabernakel van de getuigenis.", "Matt 12:39": "Maar Hij antwoordde en zei tegen hen: Het slechte en overspelige geslacht verlangt een teken; en hun zal geen teken gegeven worden, dan het teken van de profeet Jona.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Matt 28:7": "En ga haastig heen, en zeg tegen Zijn discipelen dat Hij opgestaan is van de doden; en zie, Hij gaat u voor naar Galilea, daar zult u Hem zien. Zie, ik heb het u gezegd.", "Joh 6:60-62": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren? Jezus, die bij Zichzelf wist dat Zijn discipelen daarover morden, zei tegen hen: Ergert dit u? Wat zou het dan zijn, als u de Zoon des mensen zag opvaren naar waar Hij eerder was?", "Luk 9:29": "En terwijl Hij bad, veranderde het aanzien van Zijn gezicht, en Zijn kleding werd wit en schitterend.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Joh 5:46": "Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven.", "Hebr 6:19": "welke hoop wij hebben als een anker van de ziel, dat zeker en vast is, en dat ingaat in het binnenste van het voorhangsel;", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Joh 15:23": "Die Mij haat, die haat ook Mijn Vader.", "Gen 15:8": "En hij zei: Heere HEERE, waarbij zal ik weten dat ik het erfelijk bezitten zal?", "Matt 6:16-18": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben. Maar u, als u vast, zalf dan uw hoofd en was uw gezicht; opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Joh 12:32-34": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken. (En dit zei Hij, om aan te duiden wat voor dood Hij sterven zou.) De menigte antwoordde Hem: Wij hebben uit de wet gehoord dat de Christus blijft tot in eeuwigheid; en hoe zegt U dat de Zoon des mensen verhoogd moet worden? Wie is deze Zoon des mensen?", "Jes 42:1": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.", "Joh 1:7": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden.", "Job 30:21": "U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.", "Luk 17:25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "Pred 8:2-4": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God. Haast u niet om van zijn aangezicht weg te gaan; blijf niet staan bij een kwade zaak; want al wat hem lust, doet hij. Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Joh 3:11": "Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Rom 6:4": "Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "Luk 12:50": "Maar Ik moet met een doop gedoopt worden; en hoe beklemd voel Ik Mij, totdat het volbracht is!", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Zach 7:5": "Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast?", "Ex 16:28": "Toen zei de HEERE tegen Mozes: Hoelang weigert u Mijn geboden en Mijn wetten te houden?", "Jes 53:4-6": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "1 Joh 2:23": "Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader.", "Openb 10:1-6": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur. En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde. En hij riep met een luide stem, zoals een leeuw brult; en toen hij geroepen had, spraken de zeven donderslagen met hun stemmen.", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "1 Kor 8:9": "Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "Matt 17:14-21": "En toen zij bij de menigte gekomen waren, kwam er iemand naar Hem toe, die voor Hem op de knieën viel en zei: Heere, ontferm U over mijn zoon, want hij is maanziek en lijdt zwaar; want vaak valt hij in het vuur, en vaak in het water. En ik heb hem naar Uw discipelen gebracht, maar zij hebben hem niet kunnen genezen.", "Luk 10:16": "Wie naar u luistert, luistert naar Mij; en wie u verwerpt, verwerpt Mij; en wie Mij verwerpt, verwerpt Hem die Mij gezonden heeft.", "Fil 2:6": "Die, terwijl Hij in de gestalte van God was, het geen roof geacht heeft God even gelijk te zijn;", "1 Joh 5:4": "Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning die de wereld overwint, namelijk ons geloof.", "Joh 16:8": "En als Hij gekomen is, zal Hij de wereld overtuigen van zonde, en van gerechtigheid, en van oordeel:", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Openb 4:4": "En rondom de troon waren vierentwintig tronen; en op de tronen zag ik de vierentwintig oudsten zitten, bekleed met witte kleren, en zij hadden gouden kronen op hun hoofden.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Tit 2:8": "Het woord gezond en onberispelijk, opdat hij die daartegen is, beschaamd wordt, en niets kwaads heeft te zeggen van u.", "Rom 3:22-28": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid. Want zij hebben allen gezondigd, en missen de heerlijkheid van God; en worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing die in Christus Jezus is;", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Mark 9:5": "En Petrus antwoordde en zei tegen Jezus: Rabbi, het is goed dat wij hier zijn, en laten wij drie tenten maken, voor U een, en voor Mozes een, en voor Elia een.", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Amos 3:3": "Zullen twee samen wandelen, tenzij zij bijeengekomen zijn?", "Ex 5:22": "Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?", "Matt 23:3": "daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Matt 14:22-33": "En meteen dwong Jezus Zijn discipelen om in het schip te gaan, en voor Hem uit te varen naar de andere kant, terwijl Hij de menigten van Zich zou laten gaan. En toen Hij de menigten van Zich had laten gaan, klom Hij de berg op, alleen, om te bidden. En toen het avond was geworden, was Hij daar alleen. En het schip was al midden op de zee, in nood door de golven; want de wind was hun tegen.", "Hebr 7:3": "zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Hebr 13:7": "Denk aan uw voorgangers, die u het Woord van God gesproken hebben; en volg hun geloof na, terwijl u de uitkomst van hun wandel aanschouwt.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "Matt 13:41": "De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "Mark 12:35": "En Jezus antwoordde en zei, terwijl Hij in de tempel onderwees: Hoe kunnen de Schriftgeleerden zeggen dat de Christus een Zoon van David is?", "2 Petr 1:18": "En deze stem hebben wij gehoord, toen zij vanuit de hemel gebracht werd, terwijl wij met Hem op de heilige berg waren.", "Hand 10:41": "niet aan al het volk, maar aan de getuigen die door God van tevoren uitgekozen waren, namelijk aan ons, die met Hem gegeten en gedronken hebben, nadat Hij uit de doden opgestaan was.", "Joh 4:46-53": "Zo kwam Jezus dan weer in Kana in Galilea, waar Hij het water wijn gemaakt had. En er was een zekere koninklijke hoveling, wiens zoon ziek was, in Kapernaüm. Deze, die gehoord had dat Jezus uit Judea in Galilea kwam, ging naar Hem toe, en vroeg Hem of Hij wilde afkomen en zijn zoon gezond maken; want hij lag op sterven. Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven.", "Mark 9:14-29": "En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?", "Matt 27:52": "En de graven werden geopend, en veel lichamen van de heiligen die ontslapen waren, werden opgewekt;", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "Jes 40:4": "Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Jer 45:3": "U zegt: Wee mij nu, want de HEERE heeft droefheid aan mijn smart toegevoegd; ik ben moe van mijn zuchten, en vind geen rust!", "Hand 2:24": "Hem heeft God opgewekt, want Hij ontbond de smarten van de dood, omdat het niet mogelijk was dat Hij daardoor vastgehouden zou worden.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Openb 10:1": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "1 Petr 1:21": "die door Hem gelooft in God, Die Hem uit de doden heeft opgewekt en Hem heerlijkheid gegeven heeft, zodat uw geloof en hoop op God gericht zouden zijn.", "Joh 14:12": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader.", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Luk 24:36-45": "En terwijl zij over deze dingen spraken, stond Jezus Zelf in hun midden, en zei tegen hen: Vrede zij u! En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen. En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart?", "Luk 2:9": "En zie, een engel van de Heere stond bij hen, en de heerlijkheid van de Heere omscheen hen, en zij werden zeer bevreesd.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Joh 11:46-48": "Maar sommigen van hen gingen naar de Farizeeën, en vertelden hun wat Jezus gedaan had. De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen. Als wij Hem zo laten begaan, zullen zij allen in Hem geloven, en de Romeinen zullen komen en zowel onze plaats als ons volk wegnemen.", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "Jes 49:4": "Doch Ik zei: Ik heb tevergeefs gearbeid, Ik heb Mijn kracht nutteloos en tevergeefs besteed; zeker, Mijn recht is bij de HEERE, en Mijn loon is bij Mijn God.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Deut 3:2": "Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Joh 20:29": "Jezus zei tegen hem: Omdat u Mij gezien hebt, Thomas, gelooft u; zalig zijn zij die niet gezien zullen hebben, en toch zullen geloven.", "Matt 13:31": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mosterdzaadje, dat een mens genomen heeft en in zijn akker gezaaid heeft;", "1 Kor 16:19": "U groeten de Gemeenten van Azië. U groeten zeer in de Heere Aquila en Priscilla, met de Gemeente die in hun huis is.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Mark 9:11": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen?", "Jes 53:1-4": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Joh 13:19": "Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben.", "Hand 13:25": "Doch toen Johannes zijn loop volbracht, zei hij: Wie denkt u dat ik ben? Ik ben het niet. Maar zie, Hij komt na mij, van Wie ik niet waard ben de schoenen van Zijn voeten los te maken.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Openb 18:1-3": "En hierna zag ik een andere engel uit de hemel neerdalen, die grote macht had, en de aarde werd verlicht door zijn heerlijkheid. En hij riep met kracht, met een grote stem, en zei: Zij is gevallen, zij is gevallen, het grote Babylon, en is een woonplaats van duivels geworden, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en gehaat gevogelte; Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.", "Matt 16:15-17": "Hij zei tegen hen: Maar u, wie zegt u dat Ik ben? En Simon Petrus antwoordde en zei: U bent de Christus, de Zoon van de levende God. En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Mark 14:28": "Maar nadat Ik zal zijn opgestaan, zal Ik u voorgaan naar Galilea.", "Joh 6:38": "Want Ik ben uit de hemel neergedaald, niet om Mijn eigen wil te doen, maar de wil van Hem die Mij gezonden heeft.", "1 Kor 6:14": "En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht.", "Joh 1:21": "En zij vroegen hem: Wat dan? Bent u Elia? En hij zei: Ik ben die niet. Bent u de profeet? En hij antwoordde: Nee.", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Mark 7:29": "En Hij zei tegen haar: Vanwege dit woord, ga heen; de duivel is uit uw dochter weggegaan.", "Mark 3:1-6": "En Hij ging opnieuw de synagoge in; en daar was een man met een verdorde hand. En zij letten op Hem, of Hij hem op de sabbat zou genezen, opdat zij Hem konden beschuldigen. En Hij zei tegen de man die de verdorde hand had: Kom in het midden staan.", "Openb 19:13": "En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "1 Kor 14:22": "Zo dan, de vreemde talen zijn tot een teken niet voor hun die geloven, maar voor de ongelovigen; en de profetie niet voor de ongelovigen, maar voor hun die geloven.", "Num 14:27": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren.", "Joh 5:32-36": "Er is een ander die van Mij getuigt, en Ik weet dat de getuigenis die hij van Mij getuigt, waar is. U hebt naar Johannes gezonden, en hij heeft van de waarheid getuigenis gegeven. Toch neem Ik geen getuigenis van een mens aan; maar dit zeg Ik, opdat u behouden wordt.", "Matt 26:63": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.", "Matt 20:18": "Zie, wij gaan naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters en Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen;", "Joh 16:28": "Ik ben van de Vader uitgegaan, en ben in de wereld gekomen; opnieuw verlaat Ik de wereld, en ga heen tot de Vader.", "Hebr 13:1": "Laat de broederlijke liefde blijven.", "Joh 20:17": "Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Ps 69:11": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Ps 4:7": "Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!", "Hand 28:27": "Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Matt 15:12-14": "Toen kwamen Zijn discipelen tot Hem, en zeiden tegen Hem: Weet U wel dat de Farizeeën, toen zij dit woord hoorden, zich daaraan ergerden? Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden. Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "Joh 11:26": "en ieder die leeft en in Mij gelooft, zal niet sterven in eeuwigheid. Gelooft u dat?", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Matt 20:19": "en zij zullen Hem aan de heidenen overleveren, om Hem te bespotten en te geselen en te kruisigen; en op de derde dag zal Hij weer opstaan.", "Luk 12:22-32": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "Luk 9:37-43": "En het gebeurde de volgende dag, toen zij van de berg afdaalden, dat een grote menigte Hem tegemoet kwam. En zie, een man uit de menigte riep uit: Meester, ik smeek U, kijk toch naar mijn zoon, want hij is mijn enig kind. En zie, een geest grijpt hem, en plotseling roept hij, en de geest scheurt hem zodat hij schuimt, en wijkt nauwelijks van hem, en verplettert hem daarbij.", "Joh 8:53": "Bent U meer dan onze vader Abraham, die gestorven is? En de profeten zijn gestorven; wie maakt U Uzelf?", "Matt 17:1-9": "En na zes dagen nam Jezus Petrus, Jakobus en Johannes zijn broer met Zich mee, en bracht hen alleen op een hoge berg. En Hij veranderde van gedaante voor hun ogen; Zijn gezicht blonk als de zon, en Zijn kleren werden wit als het licht. En zie, Mozes en Elia verschenen aan hen en spraken met Hem.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Hand 2:32": "Deze Jezus heeft God opgewekt; daarvan zijn wij allen getuigen.", "Joh 4:46-54": "Zo kwam Jezus dan weer in Kana in Galilea, waar Hij het water wijn gemaakt had. En er was een zekere koninklijke hoveling, wiens zoon ziek was, in Kapernaüm. Deze, die gehoord had dat Jezus uit Judea in Galilea kwam, ging naar Hem toe, en vroeg Hem of Hij wilde afkomen en zijn zoon gezond maken; want hij lag op sterven. Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven.", "Matt 22:17-21": "Zeg ons dan: wat denkt U? Is het geoorloofd de keizer belasting te betalen of niet? Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef? Toon Mij de belastingmunt. En zij brachten Hem een penning.", "Matt 2:6": "En u, Bethlehem, land
