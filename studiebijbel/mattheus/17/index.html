igd.", "Joh 5:32-35": "Er is een ander die van Mij getuigt, en Ik weet dat de getuigenis die hij van Mij getuigt, waar is. U hebt naar Johannes gezonden, en hij heeft van de waarheid getuigenis gegeven. Toch neem Ik geen getuigenis van een mens aan; maar dit zeg Ik, opdat u behouden wordt.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Joh 14:9": "Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader?", "Neh 9:19": "Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Ex 40:36-38": "Als nu de wolk opgeheven werd van boven de tabernakel, dan reisden de kinderen van Israël verder op al hun tochten. Maar als de wolk niet opgeheven werd, dan reisden zij niet, tot op de dag dat zij opgeheven werd. Want de wolk van de HEERE was overdag op de tabernakel, en het vuur was er 's nachts op, voor de ogen van heel het huis van Israël, op al hun tochten.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "Kol 1:19": "Want het is het welbehagen van de Vader geweest, dat in Hem heel de volheid wonen zou;", "Num 10:12": "En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.", "Micha 4:14": "Nu, verzamel u met benden, dochter van de bende, hij heeft een belegering tegen ons gelegd; zij zullen de rechter van Israël met de roede op het kinnebak slaan.", "Hebr 5:9": "En nadat Hij volmaakt gemaakt was, is Hij voor allen die Hem gehoorzaam zijn een oorzaak van eeuwige zaligheid geworden;", "1 Petr 2:13-17": "Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag; Hetzij aan de stadhouders, als aan hen die door hem gezonden worden, tot straf van de kwaaddoeners, maar tot lof van hen die goeddoen. Want zo is het de wil van God, dat u, door goed te doen, de mond snoert van de onwetendheid van de dwaze mensen;", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Ef 1:12-14": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben. In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte; Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Mark 9:23-27": "En Jezus zei tegen hem: Als u kunt geloven, zijn alle dingen mogelijk voor hem die gelooft. En meteen riep de vader van het kind met tranen: Ik geloof, Heere! Kom mijn ongeloof te hulp. En toen Jezus zag dat de menigte gezamenlijk toeliep, bestrafte Hij de onreine geest, en zei tegen hem: Stomme en dove geest, Ik gebied u, ga uit hem weg, en kom niet meer in hem.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "2 Kor 11:27": "In arbeid en moeite, in waken menigmaal, in honger en dorst, in vasten menigmaal, in koude en naaktheid.", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Matt 13:58": "En Hij heeft daar niet veel krachten gedaan, vanwege hun ongeloof.", "Matt 9:1-26": "En Hij ging in het schip en voer over, en kwam in Zijn eigen stad. En zie, zij brachten bij Hem een verlamde man, die op een bed lag. En Jezus zag hun geloof en zei tegen de verlamde man: Zoon, houd moed; uw zonden zijn u vergeven. En zie, sommigen van de Schriftgeleerden zeiden bij zichzelf: Deze man lastert God.", "Zach 6:5": "En de Engel antwoordde, en zei tegen mij: Deze zijn de vier winden van de hemel, die uitgaan van waar zij stonden voor de Heere van de hele aarde.", "Ezech 10:18": "Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.", "Joh 14:8": "Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg.", "Matt 9:32": "Toen zij nu weggingen, zie, brachten zij bij Hem een man die stom was en door een demon bezeten was.", "Matt 28:3": "Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw.", "Deut 4:12": "Zo sprak de HEERE tot u uit het midden van het vuur; u hoorde de stem van de woorden, maar u zag geen gelijkenis, alleen de stem.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Matt 26:45": "Toen kwam Hij bij Zijn discipelen en zei tegen hen: Slaapt nu maar door en rust; zie, het uur is nabij gekomen, en de Zoon des mensen wordt overgeleverd in de handen van de zondaars.", "Mark 12:14-17": "Dezen kwamen en zeiden tegen Hem: Meester, wij weten dat U waarachtig bent, en Zich aan niemand stoort; want U kijkt niet naar de persoon van de mensen, maar U onderwijst de weg van God in waarheid; is het geoorloofd de keizer belasting te betalen, of niet? Zullen wij het geven, of niet geven? Maar Hij, die hun huichelarij kende, zei tegen hen: Waarom stelt u Mij op de proef? Breng Mij een penning, zodat Ik hem kan zien. En zij brachten er een. En Hij zei tegen hen: Van wie is deze afbeelding, en het opschrift? En zij zeiden tegen Hem: Van de keizer.", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "Spr 16:15": "In het licht van het gezicht van de koning is leven; en zijn welbehagen is als een wolk van de late regen.", "1 Kor 15:24": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ps 95:8-11": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen. Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Mark 9:30-32": "En zij vertrokken van daar, en reisden door Galilea; en Hij wilde niet dat iemand het wist. Want Hij onderwees Zijn discipelen, en zei tegen hen: De Zoon des mensen zal overgeleverd worden in de handen van mensen, en zij zullen Hem doden, en nadat Hij gedood is, zal Hij op de derde dag weer opstaan. Maar zij begrepen dat woord niet, en zij waren bang Hem te vragen.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Luk 1:76-79": "En u, kind, zult een profeet van de Allerhoogste genoemd worden; want u zult voor het aangezicht van de Heere uit gaan, om Zijn wegen te bereiden; om Zijn volk kennis van het heil te geven, in vergeving van hun zonden, door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Joh 8:38": "Ik spreek wat Ik bij Mijn Vader gezien heb; en u doet dan ook wat u bij uw vader gezien hebt.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Openb 1:13": "en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel;", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Hand 13:35": "Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.", "Hand 1:3": "Aan hen heeft Hij Zichzelf ook, nadat Hij geleden had, levend vertoond, met veel duidelijke bewijzen, gedurende veertig dagen door hen gezien, en sprekend over de dingen die het Koninkrijk van God aangaan.", "1 Tess 4:18": "Zo dan, vertroost elkaar met deze woorden.", "Rom 14:13-16": "Laten wij elkaar dan niet meer oordelen; maar oordeelt dit liever, namelijk dat u de broeder geen aanstoot of ergernis geeft. Ik weet en ben verzekerd in de Heere Jezus, dat niets onrein is op zichzelf; behalve voor hem die iets acht onrein te zijn, voor hem is het onrein. Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is.", "Joh 6:59": "Deze dingen zei Hij in de synagoge, terwijl Hij onderwees in Kapernaüm.", "Joh 15:8-10": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn. Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde. Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Matt 26:18": "En Hij zei: Ga de stad in, naar zo iemand, en zeg hem: De Meester zegt: Mijn tijd is nabij, Ik zal bij u het Pascha houden met Mijn discipelen.", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Joh 5:32": "Er is een ander die van Mij getuigt, en Ik weet dat de getuigenis die hij van Mij getuigt, waar is.", "Matt 21:21": "Maar Jezus antwoordde en zei tegen hen: Voorwaar, Ik zeg u: Als u geloof hebt en niet twijfelt, zult u niet alleen doen wat er met de vijgenboom gebeurd is, maar ook, als u tegen deze berg zegt: Word opgeheven en in de zee geworpen! zal het gebeuren.", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "Joh 14:13": "En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.", "Joh 4:49": "De koninklijke hoveling zei tegen Hem: Heere, kom af voordat mijn kind sterft.", "Deut 18:19": "En het zal gebeuren: de man die niet luistert naar Mijn woorden, die Hij in Mijn Naam zal spreken, van hem zal Ik het opeisen.", "Joh 13:21": "Toen Jezus dit gezegd had, werd Hij ontroerd in de geest, en betuigde en zei: Voorwaar, voorwaar, Ik zeg u, dat een van u Mij zal verraden.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Hebr 3:16-19": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Rom 10:7": "Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen.", "Joh 7:13": "Toch sprak niemand vrijmoedig over Hem, uit vrees voor de Joden.", "Matt 11:27": "Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Joh 5:45-47": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt. Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven. Maar als u zijn geschriften niet gelooft, hoe zult u Mijn woorden geloven?", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Hebr 10:24": "en laten wij op elkaar letten, om elkaar aan te sporen tot liefde en goede werken;", "Matt 23:2": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes;", "Hand 12:11": "En Petrus, tot zichzelf gekomen, zei: Nu weet ik waarachtig dat de Heere Zijn engel gestuurd heeft, en mij verlost heeft uit de hand van Herodes, en van heel de verwachting van het volk van de Joden.", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Mark 7:30": "En toen zij in haar huis kwam, vond zij dat de duivel weggegaan was, en de dochter op het bed liggend.", "Matt 8:32": "En Hij zei tegen hen: Ga heen. En toen zij uitgingen, voeren zij in de kudde varkens; en zie, de hele kudde varkens stortte van de steile helling af in de zee, en zij stierven in het water.", "Matt 9:29": "Toen raakte Hij hun ogen aan en zei: U geschiedt naar uw geloof.", "Ex 14:19": "En de Engel van God, Die voor het leger van Israël uit ging, vertrok, en ging achter hen; de wolkkolom vertrok ook van voor hun gezicht, en stond achter hen.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Num 11:21-23": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten! Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is? Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "Joh 4:46": "Zo kwam Jezus dan weer in Kana in Galilea, waar Hij het water wijn gemaakt had. En er was een zekere koninklijke hoveling, wiens zoon ziek was, in Kapernaüm.", "Matt 17:1-4": "En na zes dagen nam Jezus Petrus, Jakobus en Johannes zijn broer met Zich mee, en bracht hen alleen op een hoge berg. En Hij veranderde van gedaante voor hun ogen; Zijn gezicht blonk als de zon, en Zijn kleren werden wit als het licht. En zie, Mozes en Elia verschenen aan hen en spraken met Hem.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "Mark 9:18": "En waar hij hem ook aangrijpt, werpt hij hem neer, en hij schuimt, en knarst met zijn tanden, en verstijft; en ik heb Uw discipelen gevraagd dat zij hem zouden uitdrijven, en zij hebben het niet gekund.", "Luk 8:28": "Toen hij Jezus zag, schreeuwde hij luid, viel voor Hem neer en zei met luide stem: Wat heb ik met U te maken, Jezus, Zoon van God, de Allerhoogste? Ik bid U dat U mij niet pijnigt!", "Mark 9:2-13": "En na zes dagen nam Jezus Petrus, en Jakobus, en Johannes met Zich mee, en bracht hen alleen op een hoge berg, apart; en Hij werd voor hen van gedaante veranderd. En Zijn kleren werden blinkend, zeer wit als sneeuw, zoals geen wolwasser op aarde ze zo wit kan maken. En aan hen verschenen Elia met Mozes, en zij spraken met Jezus.", "Luk 1:69": "en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Luk 16:16": "De wet en de profeten zijn tot op Johannes; van die tijd af wordt het Koninkrijk van God verkondigd, en ieder doet geweld op datzelfde.", "Ef 4:13": "Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "Joh 15:12": "Dit is Mijn gebod, dat u elkaar liefhebt, zoals Ik u liefgehad heb.", "Hebr 1:9": "U hebt rechtvaardigheid liefgehad, en ongerechtigheid gehaat; daarom heeft God, Uw God, U gezalfd met de olie van vreugde boven Uw medegenoten.", "Mark 9:12": "En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden.", "Hand 13:40": "Kijk dan uit, dat over u niet komt wat gezegd is in de profeten:", "Fil 2:7": "Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden;", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Joh 1:21-25": "En zij vroegen hem: Wat dan? Bent u Elia? En hij zei: Ik ben die niet. Bent u de profeet? En hij antwoordde: Nee. Zij zeiden dan tegen hem: Wie bent u? opdat wij antwoord kunnen geven aan hen die ons gezonden hebben; wat zegt u van uzelf? Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Joh 1:11": "Hij is gekomen tot het Zijne, en de Zijnen hebben Hem niet aangenomen.", "Hand 2:31": "Heeft hij, dit vooruitziend, gesproken over de opstanding van Christus, dat Zijn ziel niet verlaten is in het rijk van de dood, en Zijn vlees geen verderving heeft gezien.", "Joh 6:71": "En Hij zei dit over Judas, de zoon van Simon, Iskariot; want deze zou Hem verraden, hoewel hij een van de twaalf was.", "1 Sam 17:11": "Toen Saul en heel Israël deze woorden van de Filistijn hoorden, schrokken zij enorm, en vreesden zeer.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Joh 21:7": "De discipel dan, die Jezus liefhad, zei tegen Petrus: Het is de Heere! Toen Simon Petrus dan hoorde dat het de Heere was, deed hij zijn bovenkleed om (want hij was naakt), en wierp zichzelf in de zee.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Luk 12:9": "Maar wie Mij verloochenen zal voor de mensen, die zal verloochend worden voor de engelen van God.", "Luk 24:41-45": "En toen zij het van blijdschap nog niet geloofden, en zich verwonderden, zei Hij tegen hen: Hebt u hier iets te eten? En zij gaven Hem een stuk gebraden vis, en wat honingraat. En Hij nam het, en at het voor hun ogen.", "Openb 15:6": "En de zeven engelen, die de zeven plagen hadden, kwamen uit de tempel, bekleed met rein en blinkend linnen, en om de borst omgord met gouden gordels.", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "Klaagl 3:17": "Vau. En U hebt mijn ziel ver van de vrede verstoten, ik heb het goede vergeten.", "Hebr 10:17": "En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken.", "Luk 9:35": "En er kwam een stem uit de wolk, die zei: Dit is Mijn geliefde Zoon; luister naar Hem!", "Joh 8:54": "Jezus antwoordde: Als Ik Mijzelf eer, is Mijn eer niets; Mijn Vader is het, Die Mij eert, van Wie u zegt dat Hij uw God is.", "Hand 7:37": "Dit is de Mozes die tegen de kinderen van Israël gezegd heeft: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem zult u luisteren.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Rom 14:1-4": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen. De één gelooft dat men alles mag eten, maar hij die zwak is, eet groenten. Hij die eet, moet hem niet verachten die niet eet; en hij die niet eet, moet hem niet oordelen die eet; want God heeft hem aangenomen.", "Rom 10:14": "Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Mark 14:61": "Maar Hij zweeg stil, en antwoordde niets. Weer vroeg de hogepriester Hem, en zei tegen Hem: Bent U de Christus, de Zoon van de gezegende God?", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "Num 11:22": "Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is?", "Mark 1:13": "En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.", "Joh 13:3": "Jezus, die wist dat de Vader Hem alle dingen in de handen gegeven had, en dat Hij van God uitgegaan was en tot God heenging,", "Ex 14:10-12": "Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE. En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd? Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Joh 3:34-36": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate. De Vader heeft de Zoon lief en heeft alle dingen in Zijn hand gegeven. Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Hand 2:1": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen.", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Num 21:34": "De HEERE nu zei tegen Mozes: Vrees hem niet; want Ik heb hem in uw hand gegeven, en al zijn volk, ook zijn land; en u zult hem doen, zoals u Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Gen 1:28": "En God zegende hen, en God zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde en onderwerp haar, en heers over de vissen van de zee, en over het gevogelte van de hemel, en over al de dieren die op de aarde kruipen!", "Matt 26:23": "En Hij antwoordde en zei: Die de hand met Mij in de schotel indoopt, die zal Mij verraden.", "Luk 8:56": "En haar ouders stonden versteld; en Hij beval hun aan niemand te vertellen wat er gebeurd was.", "Gal 3:1-29": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Dan 7:14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "1 Kor 15:3-8": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften; en dat Hij is begraven, en dat Hij is opgewekt op de derde dag, naar de Schriften; en dat Hij is gezien door Cefas, daarna door de twaalf.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Ps 22:18-22": "Al mijn beenderen zou ik kunnen tellen; zij schouwen het aan, zij zien op mij. Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad. Maar U, HEERE! Wees niet ver; mijn Sterkte! Haast U tot mijn hulp.", "Joh 14:24": "Wie Mij niet liefheeft, bewaart Mijn woorden niet; en het woord dat u hoort, is niet het Mijne, maar dat van de Vader, Die Mij gezonden heeft.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Joh 15:1": "Ik ben de ware Wijnstok, en Mijn Vader is de Landman.", "Ps 95:7-11": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort, Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen.", "Joh 1:25": "En zij vroegen hem en zeiden tegen hem: Waarom doopt u dan, als u de Christus niet bent, ook Elia niet, en ook de profeet niet?", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "Joh 12:50": "En Ik weet dat Zijn gebod het eeuwige leven is. Wat Ik dan spreek, dat spreek Ik zoals de Vader Mij gezegd heeft.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Hand 9:3-6": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Hebr 5:10": "en Hij is door God een Hogepriester genoemd, naar de ordening van Melchizedek.", "Joh 19:23": "De soldaten dan namen, toen zij Jezus gekruisigd hadden, Zijn kleren (en maakten er vier delen van, voor elke soldaat een deel) en de onderkleding. De onderkleding nu was zonder naad, van boven af helemaal geweven.", "Joh 16:20-22": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden. Een vrouw heeft droefheid wanneer zij baart, omdat haar tijd gekomen is; maar wanneer zij het kind gebaard heeft, denkt zij niet meer aan de benauwdheid, vanwege de blijdschap dat er een mens ter wereld geboren is. En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "1 Joh 4:8": "Wie niet liefheeft, kent God niet; want God is liefde.", "Hand 2:23-31": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood; Hem heeft God opgewekt, want Hij ontbond de smarten van de dood, omdat het niet mogelijk was dat Hij daardoor vastgehouden zou worden. Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden.", "Luk 9:22": "en Hij zei: De Zoon des mensen moet veel lijden, en verworpen worden door de oudsten, overpriesters en Schriftgeleerden, en gedood worden en op de derde dag opgewekt worden.", "Matt 25:31": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Mark 14:62": "En Jezus zei: Ik ben het. En u zult de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen met de wolken van de hemel.", "Jer 8:18": "Mijn verkwikking is in droefenis; mijn hart is flauw in mij.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Openb 5:12": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "1 Kon 17:21": "En hij strekte zich driemaal uit over dat kind, en riep de HEERE aan, en zei: HEERE, mijn God, laat toch de ziel van dit kind in hem wederkeren.", "1 Kon 19:13-18": "En het gebeurde, toen Elia dat hoorde, dat hij zijn gezicht bedekte met zijn mantel, en naar buiten ging, en ging staan in de ingang van de grot. En zie, een stem kwam tot hem, die zei: Wat doet u hier, Elia? En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden. En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.", "Jes 53:7": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.", "Hebr 10:16": "want nadat Hij eerder gezegd had: Dit is het verbond, dat Ik met hen sluiten zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun harten geven, en Ik zal die in hun verstand schrijven;", "Rom 8:29": "Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders.", "Mark 9:31": "Want Hij onderwees Zijn discipelen, en zei tegen hen: De Zoon des mensen zal overgeleverd worden in de handen van mensen, en zij zullen Hem doden, en nadat Hij gedood is, zal Hij op de derde dag weer opstaan.", "2 Kor 4:10": "Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Luk 4:3": "En de duivel zei tegen Hem: Als U Gods Zoon bent, zeg tegen deze steen dat hij brood wordt.", "Joh 5:26": "Want zoals de Vader het leven heeft in Zichzelf, zo heeft Hij ook de Zoon gegeven het leven te hebben in Zichzelf;", "Luk 15:7": "Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben.", "Dan 11:35": "En van de leraren zullen er sommigen vallen, om hen te louteren en te reinigen, en wit te maken, tot de tijd van het einde toe; want het zal nog zijn voor een bepaalde tijd.", "Rom 8:11": "En als de Geest van Hem, Die Jezus uit de doden opgewekt heeft, in u woont, zal Hij, Die Christus uit de doden opgewekt heeft, ook uw sterfelijke lichamen levend maken door Zijn Geest, Die in u woont.", "Hand 13:24-28": "Nadat Johannes eerst, vóór Zijn komst, aan heel het volk van Israël de doop van bekering gepredikt had. Doch toen Johannes zijn loop volbracht, zei hij: Wie denkt u dat ik ben? Ik ben het niet. Maar zie, Hij komt na mij, van Wie ik niet waard ben de schoenen van Zijn voeten los te maken. Mannen broeders, kinderen van het geslacht van Abraham, en zij die onder u God vrezen, tot u is het woord van deze zaligheid gezonden.", "Joh 17:1-26": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt. Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft. En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Luk 4:9": "En hij leidde Hem naar Jeruzalem, en zette Hem op de rand van het dak van de tempel, en zei tegen Hem: Als U de Zoon van God bent, werp Uzelf van hier naar beneden;", "Jes 6:1": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel.", "Neh 9:12": "En U hebt hen overdag geleid met een wolkkolom, en 's nachts met een vuurkolom, om hen licht te geven op de weg waarin zij zouden gaan.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "2 Tess 3:2": "En opdat wij verlost mogen worden van de ongeschikte en boze mensen; want het geloof is niet ieders deel.", "Mark 9:25-27": "En toen Jezus zag dat de menigte gezamenlijk toeliep, bestrafte Hij de onreine geest, en zei tegen hem: Stomme en dove geest, Ik gebied u, ga uit hem weg, en kom niet meer in hem. En hij, roepend en hem zeer heen en weer schuddend, ging uit hem weg; en het kind werd als dood, zodat velen zeiden dat het gestorven was. Maar Jezus pakte hem bij de hand en richtte hem op; en hij stond op.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "Hand 13:18": "En Hij heeft ongeveer veertig jaar lang hun gedrag verdragen in de woestijn.", "Hand 26:23": "Namelijk dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "Luk 9:44": "Neem deze woorden ter harte: want de Zoon des mensen zal overgeleverd worden in de handen van mensen.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Luk 7:1-10": "Nadat Hij al Zijn woorden voltooid had, ten aanhoren van het volk, ging Hij Kapernaüm binnen. En een dienstknecht van een zekere hoofdman over honderd, die hem zeer dierbaar was, was ziek en lag op sterven. En toen hij over Jezus gehoord had, zond hij de oudsten van de Joden naar Hem toe, en vroeg Hem dringend of Hij wilde komen om zijn dienstknecht gezond te maken.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Ps 22:3": "Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.", "Luk 18:33": "En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.", "Luk 22:37": "Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.", "Luk 24:6": "Hij is hier niet, maar Hij is opgestaan. Denk eraan hoe Hij tot u gesproken heeft, toen Hij nog in Galilea was,", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "Joh 12:44": "En Jezus riep en zei: Wie in Mij gelooft, gelooft niet in Mij, maar in Hem Die Mij gezonden heeft.", "Mark 11:23": "Want voorwaar, Ik zeg u, dat wie tegen deze berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven dat wat hij zegt, zal gebeuren, het zal hem gebeuren, wat hij ook zegt.", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "Ex 10:3": "Zo gingen Mozes en Aäron naar Farao, en zeiden tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Hoe lang weigert u zich voor Mijn aangezicht te verootmoedigen? Laat Mijn volk gaan, dat zij Mij dienen.", "Rom 13:6": "Want daarom betaalt u ook belasting; want zij zijn dienaars van God, die daar voortdurend mee bezig zijn.", "Jak 1:7": "Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Luk 1:55": "zoals Hij gesproken heeft tot onze vaderen, tot Abraham en zijn nageslacht, tot in eeuwigheid.", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Joh 3:16-18": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden. Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Job 38:7": "Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.", "Luk 2:32": "een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Joh 3:35": "De Vader heeft de Zoon lief en heeft alle dingen in Zijn hand gegeven.", "Hand 10:26": "Maar Petrus richtte hem op, en zei: Sta op, ik ben zelf ook maar een mens.", "1 Petr 1:8": "Hem, Die u niet gezien hebt en toch liefhebt, in Wie u nu, hoewel u Hem niet ziet, maar gelooft, zich verheugt met een onuitsprekelijke en heerlijke vreugde;", "Jes 53:3-12": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht. Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Mark 14:27-31": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden. Maar nadat Ik zal zijn opgestaan, zal Ik u voorgaan naar Galilea. En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen.", "Joh 10:21": "Anderen zeiden: Dit zijn geen woorden van iemand die bezeten is; kan een duivel soms de ogen van blinden openen?", "Luk 9:28-33": "En het gebeurde ongeveer acht dagen na deze woorden, dat Hij Petrus, Johannes en Jakobus meenam en de berg opklom om te bidden. En terwijl Hij bad, veranderde het aanzien van Zijn gezicht, en Zijn kleding werd wit en schitterend. En zie, twee mannen spraken met Hem; dat waren Mozes en Elia,", "Gen 17:19": "En God zei: Voorwaar, Sara, uw vrouw, zal u een zoon baren, en u zult zijn naam Izak noemen; en Ik zal Mijn verbond met hem oprichten, tot een eeuwig verbond voor zijn nageslacht na hem.", "2 Kor 8:9": "Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "Matt 9:14": "Toen kwamen de discipelen van Johannes bij Hem en zeiden: Waarom vasten wij en de Farizeeën veel, en Uw discipelen vasten niet?", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Hand 19:9": "Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus.", "Hand 3:14": "Maar u hebt de Heilige en Rechtvaardige verloochend, en gevraagd dat u een moordenaar geschonken zou worden;", "Job 23:15-17": "Hierom word ik voor Zijn aangezicht ontsteld; als ik het aanmerk, vrees ik voor Hem; Want God heeft mijn hart week gemaakt, en de Almachtige heeft mij ontsteld; Omdat ik niet weggevaagd ben vóór de duisternis, en Hij van mijn aangezicht de donkerheid niet bedekt heeft.", "Jes 49:15": "Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Luk 9:28-36": "En het gebeurde ongeveer acht dagen na deze woorden, dat Hij Petrus, Johannes en Jakobus meenam en de berg opklom om te bidden. En terwijl Hij bad, veranderde het aanzien van Zijn gezicht, en Zijn kleding werd wit en schitterend. En zie, twee mannen spraken met Hem; dat waren Mozes en Elia,", "Mark 9:23": "En Jezus zei tegen hem: Als u kunt geloven, zijn alle dingen mogelijk voor hem die gelooft.", "Gen 12:13": "Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Mark 9:29": "En Hij zei tegen hen: Dit soort kan nergens door uitgaan, dan door bidden en vasten.", "Rom 4:20": "En hij heeft aan de belofte van God niet getwijfeld door ongeloof; maar is gesterkt geweest in het geloof, en heeft God de eer gegeven;", "Hand 9:13": "En Ananias antwoordde: Heere, ik heb van velen gehoord over deze man, hoeveel kwaad hij Uw heiligen in Jeruzalem heeft aangedaan;", "Joh 5:19-21": "Jezus dan antwoordde en zei tegen hen: Voorwaar, voorwaar, Ik zeg u: De Zoon kan niets van Zichzelf doen, als Hij de Vader dat niet ziet doen; want al wat Die doet, dat doet ook de Zoon evenzo. Want de Vader heeft de Zoon lief, en toont Hem alles wat Hijzelf doet; en Hij zal Hem grotere werken tonen dan deze, zodat u zich verwondert. Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil.", "Matt 16:4": "Het slechte en overspelige geslacht verlangt een teken; en het zal geen teken gegeven worden, dan het teken van Jona, de profeet. En Hij verliet hen en ging weg.", "Matt 21:38-45": "Maar toen de landbouwers de zoon zagen, zeiden zij onder elkaar: Deze is de erfgenaam, kom, laten we hem doden en zijn erfenis voor onszelf houden. En zij grepen hem, wierpen hem de wijngaard uit, en doodden hem. Wanneer dan de heer van de wijngaard komt, wat zal hij die landbouwers doen?", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Hand 13:24": "Nadat Johannes eerst, vóór Zijn komst, aan heel het volk van Israël de doop van bekering gepredikt had.", "Mark 16:7": "Maar ga heen, zeg tegen Zijn discipelen, en Petrus, dat Hij u voorgaat naar Galilea; daar zult u Hem zien, zoals Hij u gezegd heeft.", "Job 9:16-23": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft. Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak. Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.", "Ex 6:11": "Doch Mozes sprak voor de HEERE en zei: Zie, de kinderen van Israël hebben naar mij niet geluisterd; hoe zou Farao dan naar mij luisteren? Bovendien ben ik onbesneden van lippen.", "Mark 10:34": "en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Joh 15:10": "Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "Rom 6:5": "Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Matt 17:18-20": "En Jezus bestrafte hem, en de duivel ging uit hem weg, en het kind werd vanaf dat moment genezen. Toen kwamen de discipelen apart naar Jezus toe en zeiden: Waarom konden wij hem niet uitdrijven? En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "Hand 19:13-15": "En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt! Dit waren zeven zonen van een zekere Sceva, een Joodse overpriester, die dit deden. Maar de boze geest antwoordde en zei: Jezus ken ik, en Paulus weet ik; maar u, wie bent u?", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Joh 21:1-11": "Hierna openbaarde Jezus Zichzelf opnieuw aan de discipelen bij de zee van Tiberias. En Hij openbaarde Zich zo: Er waren samen Simon Petrus, en Thomas, genaamd Didymus, en Nathanaël, die van Kana in Galilea was, en de zonen van Zebedeüs, en twee anderen van Zijn discipelen. Simon Petrus zei tegen hen: Ik ga vissen. Zij zeiden tegen hem: Wij gaan ook met u. Zij gingen naar buiten en gingen meteen aan boord van het schip; en in die nacht vingen zij niets.", "Hand 14:23": "En toen zij in elke gemeente, met opsteken van de handen, oudsten hadden aangesteld, en gebeden hadden met vasten, bevalen zij hen bij de Heere aan, in Wie zij geloofd hadden.", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Zach 13:6": "En als iemand tegen hem zegt: Wat zijn deze wonden in uw handen? dan zal hij zeggen: Het zijn de wonden waarmee ik geslagen ben, in het huis van mijn liefhebbers.", "Mark 9:8": "En toen zij plotseling om zich heen keken, zagen zij niemand meer, dan Jezus alleen bij zich.", "Matt 17:10-12": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen? Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "1 Tess 5:11": "Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Luk 1:15-17": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot. En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God. En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Hand 19:35-41": "En toen de stadsschrijver de menigte tot bedaren had gebracht, zei hij: Mannen van Efeze, welk mens is er toch die niet weet dat de stad van de Efezeërs de tempelbewaarster is van de grote godin Diana, en van het beeld dat uit de hemel gevallen is? Omdat dan deze dingen onweersprekelijk zijn, is het behoorlijk dat u stil bent, en niets van het onbedacht doet. Want u hebt deze mannen hier gebracht, die geen tempelrovers zijn, en ook uw godin niet lasteren.", "1 Kor 15:12-23": "Als nu van Christus gepredikt wordt dat Hij uit de doden opgewekt is, hoe zeggen sommigen onder u dat er geen opstanding van de doden is? En als er geen opstanding van de doden is, dan is Christus ook niet opgewekt. En als Christus niet opgewekt is, dan is onze prediking zonder inhoud, en is ook uw geloof zonder inhoud.", "Matt 26:37": "En Hij nam Petrus en de twee zonen van Zebedeüs met Zich mee, en begon droevig en zeer beangst te worden.", "Mark 15:36": "En er liep iemand, en vulde een spons met azijn, en stak die op een rietstok, en gaf Hem te drinken, en zei: Laat staan, laten we zien of Elia komt om Hem eraf te halen.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Joh 11:41": "Zij namen dan de steen weg, waar de gestorvene lag. En Jezus hief de ogen omhoog, en zei: Vader, Ik dank U dat U Mij gehoord hebt.", "Hand 27:33": "En terwijl het dag zou worden, vermaande Paulus hen allen om voedsel te nemen, en zei: Het is vandaag de veertiende dag dat u wachtend blijft zonder eten, en niets hebt genomen.", "Matt 14:33": "Zij die in het schip waren, kwamen en aanbaden Hem, en zeiden: Werkelijk, U bent Gods Zoon!", "Mark 11:30-32": "De doop van Johannes, was die uit de hemel, of uit de mensen? Antwoord Mij. En zij overlegden onder elkaar, en zeiden: Als wij zeggen: Uit de hemel, dan zal Hij zeggen: Waarom hebt u hem dan niet geloofd? Maar als wij zeggen: Uit de mensen; dan zijn wij bang voor het volk; want zij hielden allen Johannes voor een echte profeet.", "2 Tim 2:1": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is;", "Jes 7:9": "Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden.", "1 Kon 8:10-12": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde. En de priesters konden niet blijven staan om te dienen, vanwege de wolk; want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. Toen zei Salomo: De HEERE heeft gezegd, dat Hij in donkerheid zou wonen.", "Ps 77:4": "Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela.", "Luk 11:23-26": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit. Wanneer de onreine geest van de mens is uitgevaren, gaat hij door dorre plaatsen, op zoek naar rust; en als hij die niet vindt, zegt hij: Ik zal terugkeren naar mijn huis, waar ik uit vandaan kwam. En als hij komt, vindt hij het schoongeveegd en op orde gebracht.", "Hebr 2:6-8": "Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "Num 27:20": "En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "Ps 77:8-10": "Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn? Houdt Zijn goedertierenheid voor eeuwig op? Heeft de toezegging een einde, van geslacht tot geslacht? Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Ps 8:9": "Het gevogelte van de hemel, en de vissen van de zee; wat de paden van de zeeën doorwandelt.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Joh 10:20": "En velen van hen zeiden: Hij heeft een duivel, en is buiten zinnen; waarom luistert u naar Hem?", "Dan 9:21-23": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer. En hij onderrichtte mij en sprak met mij, en zei: Daniël! nu ben ik uitgegaan, om u het inzicht te doen verstaan. In het begin van uw smekingen is het woord uitgegaan, en ik ben gekomen om het u bekend te maken; want u bent een zeer geliefde man; versta dan dit woord, en let op dit visioen.", "Hebr 2:16": "Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Klaagl 5:20": "Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten?", "Luk 18:31-33": "En Hij nam de twaalf bij Zich en zei tegen hen: Zie, wij gaan op naar Jeruzalem, en alles wat door de profeten geschreven is over de Zoon des mensen, zal volbracht worden. Want Hij zal aan de heidenen overgeleverd worden, en Hij zal bespot worden, en smadelijk behandeld worden, en bespuwd worden. En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Luk 5:1-9": "En het gebeurde, toen de menigte op Hem aandrong om het Woord van God te horen, dat Hij bij het meer Gennesareth stond. En Hij zag twee schepen aan de oever van het meer liggen, en de vissers waren eruit gegaan en spoelden de netten. En Hij ging in een van die schepen, dat van Simon was, en vroeg hem of hij een stukje van het land af zou varen; en Hij ging zitten en leerde de menigten vanuit het schip.", "Hand 10:40": "Deze heeft God opgewekt op de derde dag, en gegeven dat Hij openbaar zou worden;", "1 Joh 3:8": "Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Matt 26:31-35": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden. Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea. Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden.", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "Matt 17:10-13": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen? Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Joh 8:24-30": "Ik heb u dan gezegd, dat u in uw zonden zult sterven; want als u niet gelooft dat Ik Die ben, zult u in uw zonden sterven. Zij zeiden dan tegen Hem: Wie bent U? En Jezus zei tegen hen: Wat Ik van het begin af aan u al zeg. Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "2 Kon 2:11-14": "En het gebeurde, terwijl zij verder gingen, al gaande en sprekende, zie, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Zo voer Elia met een storm ten hemel. En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken. Hij nam ook Elia's mantel op, die van hem afgevallen was, en keerde terug, en ging bij de oever van de Jordaan staan.", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Matt 20:17": "En Jezus, op weg naar Jeruzalem, nam de twaalf discipelen apart onderweg, en zei tegen hen:", "Joh 9:17": "Zij zeiden opnieuw tegen de blinde: U, wat zegt u van Hem, omdat Hij uw ogen geopend heeft? En hij zei: Hij is een Profeet.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Matt 16:20": "Toen verbood Hij Zijn discipelen dat zij iemand zouden zeggen dat Hij Jezus, de Christus, was.", "Ps 16:8-11": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "Matt 20:22": "Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Mark 14:66-72": "En terwijl Petrus beneden in de zaal was, kwam een van de dienstmeisjes van de hogepriester; en toen zij Petrus zag zich warmen, keek zij hem aan, en zei: U was ook met Jezus de Nazarener. Maar hij ontkende het, en zei: Ik ken Hem niet, en ik weet niet wat u zegt. En hij ging naar buiten, naar de voorhal, en de haan kraaide.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "Joh 16:32": "Zie, de tijd komt, en is nu gekomen, dat u verstrooid zult worden, ieder naar het zijne, en u Mij alleen zult laten; en toch ben Ik niet alleen, want de Vader is met Mij.", "Ps 69:27": "Want zij vervolgen hem die U geslagen hebt; en maken een praat van de smart van Uw verwonden.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Joh 3:12": "Als Ik u de aardse dingen gezegd heb en u gelooft niet, hoe zult u geloven als Ik u de hemelse dingen zou zeggen?", "Fil 3:9": "En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Ps 49:6": "Waarom zou ik vrezen in kwade dagen, als de ongerechtigen, die op de hielen zijn, mij omringen?", "Joh 19:34": "Maar een van de soldaten doorstak Zijn zijde met een speer, en meteen kwam er bloed en water uit.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "Jes 43:1": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.", "Matt 12:22": "Toen werd tot Hem gebracht iemand die door de duivel bezeten was, die blind en stom was; en Hij genas hem, zodat de blinde en stomme beide sprak en zag.", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Jes 53:10-12": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan. Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen. Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Luk 9:34": "Terwijl hij dit zei, kwam er een wolk en overschaduwde hen; en zij werden bang toen zij de wolk in gingen.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Luk 8:51": "En toen Hij het huis binnenkwam, liet Hij niemand binnengaan dan Petrus en Jakobus en Johannes, en de vader en de moeder van het kind.", "Rom 15:1-7": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen. Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw. Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Joh 3:7": "Verwonder u niet dat Ik u gezegd heb: U moet opnieuw geboren worden.", "Mark 6:5": "En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.", "Job 30:20": "Ik schrei tot U, maar U antwoordt mij niet; ik sta, maar U let niet op mij.", "Hebr 1:10-12": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Joël 1:14": "Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE.", "Joh 14:11": "Geloof Mij, dat Ik in de Vader ben en de Vader in Mij is; en zo niet, geloof Mij dan om de werken zelf.", "Ex 5:23": "Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.", "Joh 7:28": "Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.", "Ps 4:6": "Offer offeranden van gerechtigheid, en vertrouw op de HEERE.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Hand 27:34": "Daarom vermaan ik u voedsel te nemen, want dat dient tot uw behoud; want niemand van u zal een haar van zijn hoofd verliezen.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Matt 11:14": "En als u het wilt aannemen, hij is Elia, die komen zou.", "2 Kon 13:18": "Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "Spr 6:9": "Hoe lang zult u, luiaard, blijven neerliggen? Wanneer zult u opstaan uit uw slaap?", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Openb 1:13-17": "en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel; En Zijn hoofd en haar was wit, als witte wol, als sneeuw; en Zijn ogen als een vlam van het vuur; En Zijn voeten waren als blinkend koper, en gloeiden als in een oven; en Zijn stem als een stem van veel water.", "Jes 43:10": "U bent Mijn getuigen, spreekt de HEERE, en Mijn knecht, die Ik uitverkoren heb; opdat u het weet, en Mij gelooft, en verstaat, dat Ik Dezelfde ben, dat er vóór Mij geen God geformeerd is, en na Mij geen zijn zal.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Jes 43:5": "Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang.", "Mark 2:3": "En er kwamen sommigen naar Hem toe, die een verlamde brachten, die door vier mannen gedragen werd.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Hand 3:13": "De God van Abraham, en van Izak, en van Jakob, de God van onze vaderen, heeft Zijn Kind Jezus verheerlijkt, Die u hebt overgeleverd en verloochend voor het aangezicht van Pilatus, toen die oordeelde dat men Hem zou loslaten.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Matt 27:63": "en zeiden: Heer, wij herinneren ons dat deze verleider, toen Hij nog leefde, gezegd heeft: Na drie dagen zal Ik opstaan.", "Rom 1:12": "dat is: om samen met u vertroost te worden door het onderlinge geloof, zowel het uwe als het mijne.", "Gal 2:16": "maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "2 Kor 3:7-11": "En als de bediening van de dood, die met letters in stenen gegraveerd was, in heerlijkheid is geweest, zodat de kinderen van Israël niet strak konden kijken naar het gezicht van Mozes vanwege de heerlijkheid van zijn gezicht, die teniet gedaan zou worden, hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn? Want als de bediening van de verdoemenis heerlijkheid geweest is, is de bediening van de rechtvaardigheid veel meer overvloedig in heerlijkheid.", "Deut 20:1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Dan 4:13": "Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,", "Matt 27:48": "En meteen liep een van hen toe, nam een spons, vulde die met azijn, stak ze op een rietstok, en gaf Hem te drinken.", "Joh 19:29": "Daar stond dan een vat vol azijn, en zij vulden een spons met azijn, en omlegden ze met hysop, en brachten ze aan Zijn mond.", "Ps 115:9": "Israël! vertrouw jij op de HEERE; Hij is hun Hulp en hun Schild.", "Joh 14:28": "U hebt gehoord dat Ik tot u gezegd heb: Ik ga heen, en kom weer naar u toe. Als u Mij liefhad, zou u zich verblijden, omdat Ik gezegd heb: Ik ga heen tot de Vader; want Mijn Vader is meer dan Ik.", "Deut 1:21-31": "Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd. Toen kwam u allen dichterbij mij, en zei: Laten wij mannen voor ons uit sturen, die het land voor ons verkennen, en ons bericht terugbrengen, welke weg wij daarin op moeten trekken, en tot welke steden wij zullen komen. Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elke stam een man.", "1 Joh 4:7": "Geliefden, laten wij elkaar liefhebben, want de liefde is uit God; en ieder die liefheeft, is uit God geboren, en kent God.", "Mark 3:11": "En de onreine geesten vielen voor Hem neer wanneer zij Hem zagen, en riepen: U bent de Zoon van God!", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Hand 20:35": "Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Luk 20:9-18": "En Hij begon tegen het volk deze gelijkenis te vertellen: Een zeker mens plantte een wijngaard, en verhuurde die aan landbouwers, en ging voor lange tijd naar het buitenland. En toen het de tijd was, stuurde hij een dienstknecht naar de landbouwers, opdat zij hem van de vrucht van de wijngaard zouden geven; maar de landbouwers sloegen hem, en stuurden hem met lege handen weg. En opnieuw stuurde hij nog een andere dienstknecht; maar ook die sloegen zij en behandelden hem schandelijk, en stuurden hem met lege handen weg.", "1 Joh 5:12": "Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet.", "Pred 9:8": "Laat uw kleren altijd wit zijn, en laat op uw hoofd geen olie ontbreken.", "Gal 4:4": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet;", "Luk 9:22-24": "en Hij zei: De Zoon des mensen moet veel lijden, en verworpen worden door de oudsten, overpriesters en Schriftgeleerden, en gedood worden en op de derde dag opgewekt worden. En Hij zei tegen allen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen en dagelijks zijn kruis opnemen, en Mij volgen. Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden.", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Matt 28:2": "En zie, er kwam een grote aardbeving; want een engel van de Heere daalde neer uit de hemel, kwam erbij, rolde de steen van de deur af, en ging erop zitten.", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Ef 2:14-22": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken; en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Zach 8:19": "Zo zegt de HEERE van de heerscharen: Het vasten van de vierde, en het vasten van de vijfde, en het vasten van de zevende, en het vasten van de tiende maand, zal voor het huis van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; heb dan de waarheid en de vrede lief.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Joh 10:38": "maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Jes 6:5-7": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Hand 9:6": "En hij, bevend en verbaasd, zei: Heere, wat wilt U dat ik doen zal? En de Heere zei tegen hem: Sta op, en ga de stad in, en daar zal u gezegd worden wat u doen moet.", "Jona 1:17": "De HEERE nu beschikte een grote vis om Jona in te slokken; en Jona was in de buik van de vis, drie dagen en drie nachten.", "Joh 9:24": "Zij riepen dan voor de tweede maal de man die blind geweest was, en zeiden tegen hem: Geef God de eer; wij weten dat deze Mens een zondaar is.", "Mark 6:14-28": "En koning Herodes hoorde dit (want Zijn Naam was bekend geworden), en zei: Johannes, die daar doopte, is opgewekt ui
