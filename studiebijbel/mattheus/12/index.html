e sabbat ontheiligen, en toch onschuldig zijn?","6":"En Ik zeg u, dat hier Iemand is die meer is dan de tempel.","7":"Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.","8":"Want de Zoon des mensen is ook Heere van de sabbat.","9":"En vandaar verdergaand, kwam Hij in hun synagoge.","10":"En kijk, er was een mens die een verschrompelde hand had, en zij vroegen Hem: Is het geoorloofd op de sabbatdagen te genezen? (om Hem te kunnen beschuldigen.)","11":"En Hij zei tegen hen: Wie onder u is er die een schaap heeft, en als dat op een sabbatdag in een greppel valt, zal hij het niet vastpakken en eruit heffen?","12":"Hoeveel gaat een mens dan een schaap te boven! Daarom is het op de sabbatdagen geoorloofd goed te doen.","13":"Toen zei Hij tegen die mens: Strek uw hand uit; en hij strekte hem uit, en hij werd hersteld, gezond als de andere.","14":"En de Farizeeën gingen naar buiten en beraadslaagden samen tegen Hem, hoe zij Hem konden doden.","15":"Maar Jezus wist dat, en vertrok vandaar, en veel menigten volgden Hem, en Hij genas ze allemaal.","16":"En Hij gebood hun scherp dat zij Hem niet openbaar zouden maken;","17":"Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei:","18":"Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen.","19":"Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.","20":"Het geknakte riet zal Hij niet breken, en de walmende vlaspit zal Hij niet uitblussen, totdat Hij het oordeel tot overwinning zal uitbrengen.","21":"En in Zijn Naam zullen de heidenen hopen.","22":"Toen werd tot Hem gebracht iemand die door de duivel bezeten was, die blind en stom was; en Hij genas hem, zodat de blinde en stomme beide sprak en zag.","23":"En alle menigten waren buiten zichzelf, en zeiden: Is dit niet de Zoon van David?","24":"Maar de Farizeeën hoorden dit en zeiden: Deze werpt de duivels niet anders uit dan door Beëlzebul, de leider van de duivels.","25":"Maar Jezus kende hun gedachten, en zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en elke stad of elk huis dat tegen zichzelf verdeeld is, zal niet standhouden.","26":"En als de satan de satan uitwerpt, dan is hij tegen zichzelf verdeeld; hoe zal zijn rijk dan standhouden?","27":"En als Ik door Beëlzebul de duivels uitwerp, door wie werpen uw zonen ze dan uit? Daarom zullen zij uw rechters zijn.","28":"Maar als Ik door de Geest van God de duivels uitwerp, dan is het Koninkrijk van God tot u gekomen.","29":"Of hoe kan iemand het huis van een sterke man binnengaan en zijn bezittingen roven, als hij niet eerst de sterke man vastbindt? En dan pas zal hij zijn huis beroven.","30":"Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.","31":"Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.","32":"En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.","33":"Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.","34":"Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.","35":"De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.","36":"Maar Ik zeg u, dat van elk nutteloos woord dat de mensen zullen hebben gesproken, zij daarvan rekenschap zullen geven op de dag van het oordeel.","37":"Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.","38":"Toen antwoordden sommigen van de Schriftgeleerden en Farizeeën: Meester, wij willen graag een teken van U zien.","39":"Maar Hij antwoordde en zei tegen hen: Het slechte en overspelige geslacht verlangt een teken; en hun zal geen teken gegeven worden, dan het teken van de profeet Jona.","40":"Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.","41":"De mannen van Ninevé zullen opstaan in het oordeel met dit geslacht, en zullen het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!","42":"De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!","43":"En wanneer de onreine geest van de mens is uitgegaan, gaat hij door dorre plaatsen, op zoek naar rust, en vindt die niet.","44":"Dan zegt hij: Ik zal teruggaan naar mijn huis, waar ik vandaan gekomen ben; en als hij komt, vindt hij het leeg, schoongeveegd en versierd.","45":"Dan gaat hij weg en neemt zeven andere geesten met zich mee, slechter dan hijzelf, en zij gaan naar binnen en wonen daar; en het laatste van die mens wordt erger dan het eerste. Zo zal het ook met dit slechte geslacht gaan.","46":"En terwijl Hij nog tegen de menigten sprak, zie, Zijn moeder en broeders stonden buiten, en wilden Hem spreken.","47":"En iemand zei tegen Hem: Kijk, Uw moeder en Uw broeders staan daar buiten, en willen U spreken.","48":"Maar Hij antwoordde en zei tegen hem die Hem dat zei: Wie is Mijn moeder, en wie zijn Mijn broeders?","49":"En Hij strekte Zijn hand uit over Zijn discipelen, en zei: Kijk, Mijn moeder en Mijn broeders.","50":"Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder."},"SV":{"1":"In dien tijd ging Jezus, op een sabbatdag, door het gezaaide, en Zijn discipelen hadden honger, en begonnen aren te plukken, en te eten.","2":"En de Farizeën, *dat* ziende, zeiden tot Hem: Zie, Uw discipelen doen, wat niet geoorloofd is te doen op den sabbat.","3":"Maar Hij zeide tot hen: Hebt gij niet gelezen, wat David gedaan heeft, toen hem hongerde, en hun, die met hem *waren*?","4":"Hoe hij gegaan is in het huis Gods, en de toonbroden gegeten heeft, die hem niet geoorloofd waren te eten, noch ook hun, die met hem *waren*, maar den priesteren alleen.","5":"Of hebt gij niet gelezen in de wet, dat de priesters den sabbat ontheiligen in den tempel, op de sabbatdagen, en *nochtans* onschuldig zijn?","6":"En Ik zeg u, dat Een, meerder dan de tempel, hier is.","7":"Doch zo gij geweten hadt, wat het zij: Ik wil barmhartigheid en niet offerande, gij zoudt de onschuldigen niet veroordeeld hebben.","8":"Want de Zoon des mensen is een Heere ook van den sabbat.","9":"En van daar voortgaande, kwam Hij in hun synagoge.","10":"En ziet, er was een mens, die een dorre hand had, en zij vraagden Hem, zeggende: Is het ook geoorloofd op de sabbatdagen te genezen? ( opdat zij Hem mochten beschuldigen).","11":"En Hij zeide tot hen: Wat mens zal er zijn onder u, die een schaap heeft, en zo datzelve op een sabbatdag in een gracht valt, *die* hetzelve niet zal aangrijpen en uitheffen?","12":"Hoe veel gaat nu een mens een schaap te boven? Zo is het dan op de sabbatdagen geoorloofd wel te doen.","13":"Toen zeide Hij tot dien mens: Strek uw hand uit; en hij strekte ze uit, en zij werd hersteld, gezond gelijk de andere.","14":"En de Farizeën, uitgegaan zijnde, hielden te zamen raad tegen Hem, hoe zij Hem doden mochten.","15":"Maar Jezus, *dat* wetende, vertrok van daar, en vele scharen volgden Hem, en Hij genas ze allen.","16":"En Hij gebood hun scherpelijk, dat zij Hem niet openbaar maken zouden;","17":"Opdat vervuld zou worden, hetgeen gesproken is door Jesaja, den profeet, zeggende:","18":"Ziet, Mijn Knecht, Welken Ik verkoren heb, Mijn Beminde, in Welken Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel den heidenen verkondigen.","19":"Hij zal niet twisten, noch roepen, noch zal er iemand Zijn stem op de straten horen.","20":"Het gekrookte riet zal Hij niet verbreken, en het rokende lemmet zal Hij niet uitblussen, totdat Hij het oordeel zal uitbrengen tot overwinning.","21":"En in Zijn Naam zullen de heidenen hopen.","22":"Toen werd tot Hem gebracht een van den duivel bezeten, *die* blind en stom *was*; en Hij genas hem, alzo dat de blinde en stomme beide sprak en zag.","23":"En al de scharen ontzetten zich, en zeiden: Is niet Deze de Zoon van David?","24":"Maar de Farizeën, *dit* gehoord hebbende, zeiden: Deze werpt de duivelen niet uit, dan door Beëlzebul, den overste der duivelen.","25":"Doch Jezus, kennende hun gedachten, zeide tot hen: Een ieder koninkrijk, dat tegen zichzelf verdeeld is, wordt verwoest; en een iedere stad, of huis, dat tegen zichzelf verdeeld is, zal niet bestaan.","26":"En indien de satan den satan uitwerpt, zo is hij tegen zichzelf verdeeld; hoe zal dan zijn rijk bestaan?","27":"En indien Ik door Beëlzebul de duivelen uitwerp, door wien werpen ze dan uw zonen uit? Daarom zullen die uw rechters zijn.","28":"Maar indien Ik door den Geest Gods de duivelen uitwerp, zo is dan het Koninkrijk Gods tot u gekomen.","29":"Of hoe kan iemand in het huis eens sterken inkomen, en zijn vaten ontroven, tenzij dat hij eerst den sterke gebonden hebbe? en alsdan zal hij zijn huis beroven.","30":"Wie met Mij niet is, die is tegen Mij; en wie met Mij niet vergadert, die verstrooit.","31":"Daarom zeg Ik u: Alle zonde en lastering zal den mensen vergeven worden; maar de lastering tegen den Geest zal den mensen niet vergeven worden.","32":"En zo wie *enig* woord gesproken zal hebben tegen den Zoon des mensen, het zal hem vergeven worden; maar zo wie tegen den Heiligen Geest zal gesproken hebben, het zal hem niet vergeven worden, noch in deze eeuw, noch in de toekomende.","33":"Of maakt den boom goed en zijn vrucht goed; of maakt den boom kwaad en zijn vrucht kwaad; want uit de vrucht wordt de boom gekend.","34":"Gij adderengebroedsels! hoe kunt gij goede dingen spreken, daar gij boos zijt? want uit den overvloed des harten spreekt de mond.","35":"De goede mens brengt goede dingen voort uit den goeden schat des harten, en de boze mens brengt boze dingen voort uit den boze schat.","36":"Maar Ik zeg u, dat van elk ijdel woord, hetwelk de mensen zullen gesproken hebben, zij van hetzelve zullen rekenschap geven in den dag des oordeels.","37":"Want uit uw woorden zult gij gerechtvaardigd worden, en uit uw woorden zult gij veroordeeld worden.","38":"Toen antwoordden sommigen der Schriftgeleerden en Farizeën, zeggende: Meester! wij willen van U *wel* een teken zien.","39":"Maar Hij antwoordde en zeide tot hen: Het boos en overspelig geslacht verzoekt een teken; en hun zal geen teken gegeven worden, dan het teken van Jonas, den profeet.","40":"Want gelijk Jonas drie dagen en drie nachten was in den buik van den walvis, alzo zal de Zoon des mensen drie dagen en drie nachten wezen in het hart der aarde.","41":"De mannen van Nineve zullen opstaan in het oordeel met dit geslacht, en zullen hetzelve veroordelen; want zij hebben zich bekeerd op de prediking van Jonas; en ziet, meer dan Jona is hier!","42":"De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en hetzelve veroordelen; want zij is gekomen van het einde der aarde, om te horen de wijsheid van Salomo; en ziet, meer dan Salomo is hier!","43":"En wanneer de onreine geest van den mens uitgegaan is, zo gaat hij door dorre plaatsen, zoekende rust, en vindt ze niet.","44":"Dan zegt hij: Ik zal wederkeren in mijn huis, van waar ik uitgegaan ben; en komende, vindt hij het ledig, met bezemen gekeerd en versierd.","45":"Dan gaat hij heen en neemt met zich zeven andere geesten, bozer dan hij zelf, en ingegaan zijnde, wonen zij aldaar; en het laatste van denzelven mens wordt erger dan het eerste. Alzo zal het ook met dit boos geslacht zijn.","46":"En als Hij nog tot de scharen sprak, ziet, Zijn moeder en broeders stonden buiten, zoekende Hem te spreken.","47":"En iemand zeide tot Hem: Zie, Uw moeder en Uw broeders staan *daar* buiten, zoekende U te spreken.","48":"Maar Hij, antwoordende, zeide tot dengene die Hem *dat* zeide: Wie is Mijn moeder, en wie zijn Mijn broeders?","49":"En Zijn hand uitstrekkende over Zijn discipelen, zeide Hij: Ziet, Mijn moeder en Mijn broeders.","50":"Want zo wie den wil Mijns Vaders doet, Die in de hemelen is, dezelve is Mijn broeder, en zuster, en moeder."},"KJV":{"1":"At that time Jesus went on the sabbath day through the corn; and his disciples were an hungred, and began to pluck the ears of corn, and to eat.","2":"But when the Pharisees saw *it*, they said unto him, Behold, thy disciples do that which is not lawful to do upon the sabbath day.","3":"But he said unto them, Have ye not read what David did, when he was an hungred, and they that were with him;","4":"How he entered into the house of God, and did eat the shewbread, which was not lawful for him to eat, neither for them which were with him, but only for the priests?","5":"Or have ye not read in the law, how that on the sabbath days the priests in the temple profane the sabbath, and are blameless?","6":"But I say unto you, That in this place is *one* greater than the temple.","7":"But if ye had known what *this* meaneth, I will have mercy, and not sacrifice, ye would not have condemned the guiltless.","8":"For the Son of man is Lord even of the sabbath day.","9":"And when he was departed thence, he went into their synagogue:","10":"And, behold, there was a man which had *his* hand withered. And they asked him, saying, Is it lawful to heal on the sabbath days? that they might accuse him.","11":"And he said unto them, What man shall there be among you, that shall have one sheep, and if it fall into a pit on the sabbath day, will he not lay hold on it, and lift *it* out?","12":"How much then is a man better than a sheep? Wherefore it is lawful to do well on the sabbath days.","13":"Then saith he to the man, Stretch forth thine hand. And he stretched *it* forth; and it was restored whole, like as the other.","14":"Then the Pharisees went out, and held a council against him, how they might destroy him.","15":"But when Jesus knew *it*, he withdrew himself from thence: and great multitudes followed him, and he healed them all;","16":"And charged them that they should not make him known:","17":"That it might be fulfilled which was spoken by Esaias the prophet, saying,","18":"Behold my servant, whom I have chosen; my beloved, in whom my soul is well pleased: I will put my spirit upon him, and he shall shew judgment to the Gentiles.","19":"He shall not strive, nor cry; neither shall any man hear his voice in the streets.","20":"A bruised reed shall he not break, and smoking flax shall he not quench, till he send forth judgment unto victory.","21":"And in his name shall the Gentiles trust.","22":"Then was brought unto him one possessed with a devil, blind, and dumb: and he healed him, insomuch that the blind and dumb both spake and saw.","23":"And all the people were amazed, and said, Is not this the son of David?","24":"But when the Pharisees heard *it*, they said, This *fellow* doth not cast out devils, but by Beelzebub the prince of the devils.","25":"And Jesus knew their thoughts, and said unto them, Every kingdom divided against itself is brought to desolation; and every city or house divided against itself shall not stand:","26":"And if Satan cast out Satan, he is divided against himself; how shall then his kingdom stand?","27":"And if I by Beelzebub cast out devils, by whom do your children cast *them* out? therefore they shall be your judges.","28":"But if I cast out devils by the Spirit of God, then the kingdom of God is come unto you.","29":"Or else how can one enter into a strong man's house, and spoil his goods, except he first bind the strong man? and then he will spoil his house.","30":"He that is not with me is against me; and he that gathereth not with me scattereth abroad.","31":"Wherefore I say unto you, All manner of sin and blasphemy shall be forgiven unto men: but the blasphemy *against* the *Holy* Ghost shall not be forgiven unto men.","32":"And whosoever speaketh a word against the Son of man, it shall be forgiven him: but whosoever speaketh against the Holy Ghost, it shall not be forgiven him, neither in this world, neither in the *world* to come.","33":"Either make the tree good, and his fruit good; or else make the tree corrupt, and his fruit corrupt: for the tree is known by *his* fruit.","34":"O generation of vipers, how can ye, being evil, speak good things? for out of the abundance of the heart the mouth speaketh.","35":"A good man out of the good treasure of the heart bringeth forth good things: and an evil man out of the evil treasure bringeth forth evil things.","36":"But I say unto you, That every idle word that men shall speak, they shall give account thereof in the day of judgment.","37":"For by thy words thou shalt be justified, and by thy words thou shalt be condemned.","38":"Then certain of the scribes and of the Pharisees answered, saying, Master, we would see a sign from thee.","39":"But he answered and said unto them, An evil and adulterous generation seeketh after a sign; and there shall no sign be given to it, but the sign of the prophet Jonas:","40":"For as Jonas was three days and three nights in the whale's belly; so shall the Son of man be three days and three nights in the heart of the earth.","41":"The men of Nineveh shall rise in judgment with this generation, and shall condemn it: because they repented at the preaching of Jonas; and, behold, a greater than Jonas *is* here.","42":"The queen of the south shall rise up in the judgment with this generation, and shall condemn it: for she came from the uttermost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon *is* here.","43":"When the unclean spirit is gone out of a man, he walketh through dry places, seeking rest, and findeth none.","44":"Then he saith, I will return into my house from whence I came out; and when he is come, he findeth *it* empty, swept, and garnished.","45":"Then goeth he, and taketh with himself seven other spirits more wicked than himself, and they enter in and dwell there: and the last *state* of that man is worse than the first. Even so shall it be also unto this wicked generation.","46":"While he yet talked to the people, behold, *his* mother and his brethren stood without, desiring to speak with him.","47":"Then one said unto him, Behold, thy mother and thy brethren stand without, desiring to speak with thee.","48":"But he answered and said unto him that told him, Who is my mother? and who are my brethren?","49":"And he stretched forth his hand toward his disciples, and said, Behold my mother and my brethren!","50":"For whosoever shall do the will of my Father which is in heaven, the same is my brother, and sister, and mother."}},"tsk":{"1":[{"kopje":"ging","refs":["Mark 2:23-28","Luk 6:1-5"]},{"kopje":"te plukken","refs":["Deut 23:25"]}],"2":[{"kopje":"Kijk","refs":["Matt 12:10","Ex 20:9-11","Ex 23:12","Ex 31:15-17","Ex 35:2","Num 15:32-36","Jes 58:13","Mark 3:2-5","Luk 6:6-11","Luk 13:10-17","Luk 23:56","Joh 5:9-11","Joh 5:16","Joh 5:17","Joh 7:21-24","Joh 9:14-16"]}],"3":[{"kopje":"Hebt","refs":["Matt 12:5","Matt 19:4","Matt 21:16","Matt 22:31","Mark 12:10","Mark 12:26","Luk 6:3","Luk 10:26"]},{"kopje":"wat","refs":["1 Sam 21:3-6","Mark 2:25","Mark 2:26"]}],"4":[{"kopje":"maar","refs":["Ex 29:32","Ex 29:33","Lev 8:31","Lev 24:9"]}],"5":[{"kopje":"op","refs":["Num 28:9","Num 28:10","Joh 7:22","Joh 7:23"]},{"kopje":"ontheiligen","refs":["Neh 13:17","Ezech 24:21"]}],"7":[{"kopje":"als","refs":["Matt 9:13","Matt 22:29","Hand 13:27"]},{"kopje":"Ik wil","refs":["Jes 1:11-17","Hos 6:6","Micha 6:6-8"]} ie hiervoor Mat 9:13 en Mat 23:23 ."}],"8":[{"catchword":"Heere ook van den sabbat","tekst":"Dat is, heeft macht om orde te stellen over de werken van den sabbat."}],"12":[{"catchword":"gaat nu een mens een schaap teboven?","tekst":"Grieks, verschilt van een schaap."},{"catchword":"wel te doen","tekst":"Dat is, werken der liefde te oefenen."}],"14":[{"catchword":"doden mochten","tekst":"Grieks, verderven, of vernielen."}],"18":[{"catchword":"knecht,","tekst":"Christus wordt een knecht des Vaders genaamd, omdat Hij de gedaante van een dienstknecht aangenomen heeft, Phi 2:7 , en de raad des Vaders van onze verlossing door Hem uitgevoerd is, Isa 53:10-11 . Zie ook de aantekening bij Isa 42:1 ."},{"catchword":"oordeel den heidenen verkondigen","tekst":"Dat is, zaligmakende leer, of ware godsdienst, en wat daartoe behoort."}],"19":[{"catchword":"roepen,","tekst":"Namelijk uit eergierigheid of twistgierigheid."}],"20":[{"catchword":"Het","tekst":"Dat is, Hij zal de verslagen gemoederen en de zwakgelovigen niet verstoten, maar met alle toegenegenheid ontmoeten."},{"catchword":"gekrookte riet","tekst":"Of, gepletterde."},{"catchword":"lemmet","tekst":"Grieks, vlas; omdat de lemmeten of wieken daarvan gemaakt werden."},{"catchword":"het oordeel zal","tekst":"Dat is, zal met de waarheid zijner leer krachtig doordringen, totdat deze de overhand behoude."},{"catchword":"uitbrengen tot overwinning","tekst":"Of, tevoorschijn brengen. Grieks, uitstoten, uitwerpen."}],"22":[{"catchword":"blind en stom was ;","tekst":"Dat is, wien de duivel het gebruik der ogen en tong benomen had."}],"24":[{"catchword":"Beëlzebul,","tekst":"Zie hierboven Mat 10:25 ."}],"27":[{"catchword":"zonen uit?","tekst":"Hierdoor worden verstaan òf de discipelen van Christus, die in zijn naam duivelen uitwerpen, Luk 10:17 , òf enige andere Joden, die ook somwijlen zulk deden. Zie Luk 9:49 ."}],"29":[{"catchword":"vaten ontroven,","tekst":"Dat is, huisraad of goed. Want de Hebreën noemen vaten allerlei gereedschap, waar het huis mede voorzien wordt."}],"31":[{"catchword":"vergeven worden;","tekst":"Namelijk indien zij zich bekeren."},{"catchword":"tegen den Geest","tekst":"Deze zonde tegen den Heiligen Geest is wanneer iemand, niet uit zwakheid of vrees gelijk Petrus, noch uit onwetendheid gelijk Paulus, de Evangelische waarheid verzaakt of bestrijdt, maar dezelve uit enkel haat en moedwil, tegen de overtuiging des Heiligen Geestes, wederstaat, lastert en vervolgt."},{"catchword":"niet vergeven worden","tekst":"Namelijk omdat zij zich niet bekeren, noch door het rechtvaardig oordeel Gods bekeerd kunnen worden. Zie Heb 6:4 ."}],"32":[{"catchword":"Noch in deze eeuw","tekst":"Dat is, nimmermeer, gelijk het verklaard wordt, Mar 3:29 , noch hier noch hiernamaals in het uiterste oordeel, hetwelk ook de toekomende eeuw genaamd wordt, zie Luk 18:30 ."}],"33":[{"catchword":"maakt den boom goed","tekst":"Dat is, houdt en oordeelt."},{"catchword":"kwaad en zijn vrucht kwaad;","tekst":"Grieks, verrot."}],"36":[{"catchword":"ijdel woord,","tekst":"Grieks, ledig. Dat is, wat geen nuttigheid heeft tot stichting, Eph 4:29 , hoeveelmeer dan de lasterwoorden."}],"37":[{"catchword":"gerechtvaardigd worden,","tekst":"Dat is, voor rechtvaardig erkend en verklaard worden."}],"39":[{"catchword":"overspelig geslacht","tekst":"Of, ontaard en verbasterd. Zie Joh 8:39 ."}],"40":[{"catchword":"drie dagen en drie nachten","tekst":"Voor een deel der dagen worden hier genomen gehele dagen en nachten, gelijk dat bij de Hebreën gebruikelijk is. Zie 1Sa 30:12 , verg. met vs.13, en Est 4:16 , verg met Est 5:1 . En zo men het neemt naar de Romeinse rekening, die de dagen op de middernacht begonnen en eindigden, zo valt het nog duidelijker."},{"catchword":"hart der aarde","tekst":"Dat is, binnen in de aarde, naar de Hebreeuwse wijze van spreken. Zo wordt Tyrus gezegd te liggen in het hart der zee; Eze 27:4 ."}],"41":[{"catchword":"veroordelen,","tekst":"Namelijk door hun voorbeeld."}],"42":[{"catchword":"zuiden zal opstaan","tekst":"Dat is, van Saba, 1Ki 10:1 , hetwelk zuidwaarts van Judea gelegen was."},{"catchword":"einden der aarde","tekst":"Dat is, van vergelegen plaatsen."}],"43":[{"catchword":"dorre plaatsen,","tekst":"Dat is, droge of waterloze plaatsen."}],"44":[{"catchword":"versierd","tekst":"Of, opgeschikt."}],"45":[{"catchword":"zeven andere geesten,","tekst":"Dat is, vele. Een Hebreeuwse wijze van spreken."},{"catchword":"Alzo zal het ook","tekst":"Met deze gelijkenis leert Christus dat, wanneer een mens door de kennis des evangelies verlost is van zijn natuurlijke onwetendheid, en nochtans deze kennis niet beleeft maar onderdrukt, hij veel erger wordt dan tevoren. Zie 2Pe 2:20-21 ."}],"46":[{"catchword":"broeders stonden buiten,","tekst":"Dat is bloedverwanten, die bij de Hebreën ook broeders genaamd worden. Zie Gen 13:8 , Gen 13:11 ."}],"48":[{"catchword":"Wie is mijn moeder","tekst":"Christus spreekt hier niet uit verachting van zijn moeder, maar prijst alleen de geestelijke maagdschap boven de vleselijke."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"At thhat time Jesus went on a sabbath day [Gr.sabbath] through the sown (fields) and his Disciples hunred, and began to pluck ears and to eat."}],"2":[{"catchword":null,"tekst":"And the Phharisees seeing (that) said unto him, Behold, thy Disciples do that not lawful to do on the sabbath. [The Phharisees rebuked Christ Disciples, not because they pluck ears of anotherr man corn, for that was allowed by the Law, Deut 23. ver. 25 but because they did it on the sabbath.]"}],"3":[{"catchword":null,"tekst":"But hhe said unto them, Have ye not read what David did, when he hungred, and they that (were) with him?"}],"4":[{"catchword":null,"tekst":"How that he went into the house of God [That is, the Tebernacle, which at that time was at Nob. see 1 Sam 21 6.] and did eat the shew &acirc;&euro;&ldquo; bread, [Gr. bread of setting &acirc;&euro;&ldquo; before. Heb of the face; namely, of the Lord. What bread this was, and what was done therewith, see Lev.24.5, etc.] whhich it was not lawfull for him to eat, nor for them that (were) with hhim; but the Priest alone."}],"5":[{"catchword":null,"tekst":"Or have ye read in the Law, that the Priests profane the sabbath [That is, do such works, which would profane the sabbath, if God had not commanded the same, for his service] in the Temple, on the sabbath &acirc;&euro;&ldquo; daies, and (yet) are blemeless. [that is, do not amis in it.]"}],"6":[{"catchword":null,"tekst":"And i say unto you, that one greater then the Temple is here. [For Christ was the Lord of the Temple, and the thing it self figured and signified by the Temple, Mal 3.1. Joh 2:19.]"}],"7":[{"catchword":null,"tekst":"But if ye had known what that is, i will (have) mercy, and not sacrifice, [see before, Mat 9.13.] ye would no have condemned the guiltless."}],"8":[{"catchword":null,"tekst":"For the son of man is Lord also of the Sabbath day [Thhat is, hath power to take order about the works of the sabbath.]"}],"9":[{"catchword":null,"tekst":"And going forth from thence, hhe came into their synagogue."}],"10":[{"catchword":null,"tekst":"And behold therewas a man which had a withered hand, and they asked him, saying, Is it also lawful to heal on the sabbath &acirc;&euro;&ldquo; daies? (that they might accuse him.)"}],"11":[{"catchword":null,"tekst":"And he said unto them, What man shall there be among you, that hath one sheep, and if the same fall into a pit on a sabbath &acirc;&euro;&ldquo; day, that will not lay hold on it, and list it out?"}],"12":[{"catchword":null,"tekst":"Now how much is a man above a sheep? [Gr. differs from a sheep] Therefore it is lawful to do well [that is, to execise works of charity] on the sabbath &acirc;&euro;&ldquo; daies."}],"13":[{"catchword":null,"tekst":"Then said he to the man, strech out thine hand; and he stretchea it out, and it was restored whole like the other."}],"14":[{"catchword":null,"tekst":"And the Pharisees being gone out, consulted together against him, how they might kill him. [Gr. destroy or make him away.]"}],"15":[{"catchword":null,"tekst":"But Jesus knowing (that) departed thenec, and many multitudes followed him, and he hhealed them all."}],"16":[{"catchword":null,"tekst":"And commanded them shharply, thhat they should not make him manifest."}],"17":[{"catchword":null,"tekst":"Thus that mighht be filled which is spoken by Esaias the Prophet , saying,"}],"18":[{"catchword":null,"tekst":"Behold , my servant, [Christ is called the servant of the Father, because he took on him the form of servant, Phil2. verse 7. and because the Father counsel concerning our redemption was accomplished by him, Isa 53.10, 11. See likewise the Annotation on Esa 42. verse 1.] whom i have chosen, my beloved, in whom my soul hath delight. I will put my spirit upon him, and he shall declare judgment [that is, saving doctrine, or the true worship of God, and what belongs thereto] to Gentiles."}],"19":[{"catchword":null,"tekst":"He shall not strive, nor cry, [Namely, out of ambition, or desire of contention] neither shall there any man hear his voice on the streets."}],"20":[{"catchword":null,"tekst":"The howed reed [or bruised] shall be not break, and the smoaking wiek [Gr. flax, because the matches or wieks were made thereof] shall be not quench [that is to say, he shall not reject troubled spirit, or weak in faith, but shall meet them with all tenderness] till he shall bring forth [Or, bring in sight. Gr. thrust out, cast out] judgment into victory. [that is to say, shall powerfully press thorow with the truth of his doctrine, until the same gets the upper hand.]"}],"21":[{"catchword":null,"tekst":"And his name shall the Gentiles hope."}],"22":[{"catchword":null,"tekst":"Then was brought unto him one possessed of the Devil, (who was) bilnd and dumb, [that is, from whom the Devil had taken the use of eyes and tongue] and he healed him, so that the blind both spoke and saw."}],"23":[{"catchword":null,"tekst":"And all the multitudes were amazed, and said, is not this the Son of David?"}],"24":[{"catchword":null,"tekst":"But the Pharisees having heard (this) said, This (man) casteth not out the Devil, but by Beelzebul [see before, chap 10.25.] the Prince of the Devils."}],"25":[{"catchword":null,"tekst":"But Jesus knowing their thoughts, said unto them, Every Kingdom that is divided against it self, is made waste; and evry City or house that is divided against it self, shhall not stand."}],"26":[{"catchword":null,"tekst":"And if thhe Satan cast out the Satan, he is divided against it self: how shall then his Kingdom stand?"}],"27":[{"catchword":null,"tekst":"And if i Beelsebul cast out the Devils, by whom then do your sons [Hereby are understood either the Disciples of Christ, who cast out Devils in his name, Luk 10:17. or some other Jews who also sometimes did thus. See Luk 9:49.] cast them out? Therefore shall thhey be your Judges."}],"28":[{"catchword":null,"tekst":"But if i by the spirit of God cast out the Devils, then is the Kingdome of God come unto you."}],"29":[{"catchword":null,"tekst":"Or how can any one enter into the house of a strong (man) and breave him of hhis vessels [Thhat is, household &acirc;&euro;&ldquo; stuff or goods. For the Hhebrew call all manner of furniture, vessels, wherewith the house is provided] except he first have bound the strong (man), and then he will spoil his house."}],"30":[{"catchword":null,"tekst":"Whoso is not with me, he is against me, and whoso gathereth not with me, he scattereth."}],"31":[{"catchword":null,"tekst":"Therefore i say unto you, allsin and blasphhemy shall be forgiven unto men, [Namely, if they do repent.] but the blasphhemy against the spirit, [this sin against the hholy Ghost is, when any one, not out of weakness or feare, as Peter, nor of ignorance like Paul, deries or opposeth the truth of the Gospel, but out of meer hatred and obsinacy, against the conviction of the holy Ghost, resists, blasphe // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
