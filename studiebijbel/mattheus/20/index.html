 tegen hen: Wat staat u hier de hele dag werkloos?","7":"Zij zeiden tegen hem: Omdat niemand ons gehuurd heeft. Hij zei tegen hen: Gaan u ook naar de wijngaard, en u zult ontvangen wat recht is.","8":"Toen het nu avond geworden was, zei de heer van de wijngaard tegen zijn rentmeester: Roep de arbeiders, en geef hun het loon, te beginnen bij de laatsten tot de eersten.","9":"En toen zij kwamen die omstreeks het elfde uur *gehuurd waren*, ontvingen zij ieder een penning.","10":"En toen de eersten kwamen, dachten zij dat zij meer zouden ontvangen; maar ook zij ontvingen ieder een penning.","11":"En toen zij die ontvangen hadden, morden zij tegen de heer des huizes,","12":"en zeiden: Deze laatsten hebben *maar* één uur gewerkt, en u hebt hen gelijk aan ons gemaakt, die de last van de dag en de hitte gedragen hebben.","13":"Maar hij antwoordde en zei tegen een van hen: Vriend! Ik doe u geen onrecht; bent u niet met mij overeengekomen voor een penning?","14":"Neem het uwe en ga heen. Ik wil deze laatste ook geven, evenveel als u.","15":"Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?","16":"Zo zullen de laatsten de eersten zijn, en de eersten de laatsten; want velen zijn geroepen, maar weinigen uitverkoren.","17":"En Jezus, op weg naar Jeruzalem, nam de twaalf discipelen apart onderweg, en zei tegen hen:","18":"Zie, wij gaan naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters en Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen;","19":"en zij zullen Hem aan de heidenen overleveren, om Hem te bespotten en te geselen en te kruisigen; en op de derde dag zal Hij weer opstaan.","20":"Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets.","21":"En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk.","22":"Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.","23":"En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar *het zal gegeven worden* aan hen voor wie het bereid is door Mijn Vader.","24":"En toen de andere tien dit hoorden, namen zij het de twee broers zeer kwalijk.","25":"En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen.","26":"Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;","27":"en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.","28":"Zoals de Zoon des mensen niet gekomen is om gediend te worden, maar om te dienen, en Zijn ziel te geven *tot* een losprijs voor velen.","29":"En toen zij uit Jericho weggingen, volgde Hem een grote menigte.","30":"En zie, twee blinden, die aan de weg zaten, hoorden dat Jezus voorbijging, en riepen: Heere, Zoon van David! Ontferm U over ons.","31":"En de menigte bestrafte hen, zodat zij zouden zwijgen; maar zij riepen des te harder: Ontferm U over ons, Heere, Zoon van David!","32":"En Jezus bleef staan, riep hen, en zei: Wat wilt u dat Ik voor u doe?","33":"Zij zeiden tegen Hem: Heere, dat onze ogen geopend worden.","34":"En Jezus, innerlijk bewogen met barmhartigheid, raakte hun ogen aan; en meteen konden hun ogen weer zien, en zij volgden Hem."},"SV":{"1":"Want het Koninkrijk der hemelen is gelijk een heer des huizes, die met den morgenstond uitging, om arbeiders te huren in zijn wijngaard.","2":"En als hij met de arbeiders eens geworden was, voor een penning des daags, zond hij hen heen in zijn wijngaard.","3":"En uitgegaan zijnde omtrent de derde ure, zag hij anderen, ledig staande op de markt.","4":"En hij zeide tot dezelve: Gaat ook gij heen in den wijngaard, en zo wat recht is, zal ik u geven. En zij gingen.","5":"Wederom uitgegaan zijnde omtrent de zesde en negende ure, deed hij desgelijks.","6":"En uitgegaan zijnde omtrent de elfde ure, vond hij anderen ledig staande, en zeide tot hen: Wat staat gij hier den gehelen dag ledig?","7":"Zij zeiden tot hem: Omdat ons niemand gehuurd heeft. Hij zeide tot hen: Gaat ook gij heen in den wijngaard, en zo wat recht is, zult gij ontvangen.","8":"Als het nu avond geworden was, zeide de heer des wijngaards, tot zijn rentmeester: Roep de arbeiders, en geef hun het loon, beginnende van de laatsten tot de eersten.","9":"En als zij kwamen, die ter elfder ure *gehuurd* *waren*, ontvingen zij ieder een penning.","10":"En de eersten komende, meenden, dat zij meer ontvangen zouden; en zij zelven ontvingen ook elk een penning.","11":"En *dien* ontvangen hebbende, murmureerden zij tegen den heer des huizes,","12":"Zeggende: Deze laatsten hebben *maar* een uur gearbeid, en gij hebt ze ons gelijk gemaakt, die den last des daags en de hitte gedragen hebben.","13":"Doch hij, antwoordende, zeide tot een van hen: Vriend! ik doe u geen onrecht; zijt gij niet met mij eens geworden voor een penning?","14":"Neem het uwe en ga heen. Ik wil dezen laatsten ook geven, gelijk als u.","15":"Of is het mij niet geoorloofd, te doen met het mijne, wat ik wil ? Of is uw oog boos, omdat ik goed ben?","16":"Alzo zullen de laatsten de eersten zijn, en de eersten de laatsten; want velen zijn geroepen, maar weinigen uitverkoren.","17":"En Jezus, opgaande naar Jeruzalem, nam tot Zich de twaalf discipelen alleen op den weg, en zeide tot hen:","18":"Ziet, wij gaan op naar Jeruzalem, en de Zoon des mensen zal den overpriesteren en Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen;","19":"En zij zullen Hem den heidenen overleveren, om Hem te bespotten en te geselen, en te kruisigen; en ten derden dage zal Hij weder opstaan.","20":"Toen kwam de moeder der zonen van Zebedeüs tot Hem met haar zonen, *Hem* aanbiddende, en begerende wat van Hem.","21":"En Hij zeide tot haar: Wat wilt gij? Zij zeide tot Hem: Zeg, dat deze mijn twee zonen zitten mogen, de een tot Uw rechter-, en de ander tot Uw linker *hand* in Uw Koninkrijk.","22":"Maar Jezus antwoordde en zeide: Gijlieden weet niet wat gij begeert; kunt gij den drinkbeker drinken, dien Ik drinken zal, en met den doop gedoopt worden, waarmede Ik gedoopt worde? Zij zeiden tot Hem: Wij kunnen.","23":"En Hij zeide tot hen: Mijn drinkbeker zult gij wel drinken, en met den doop, waarmede Ik gedoopt worde, zult gij gedoopt worden; maar het zitten tot Mijn rechter-, en tot Mijn linker *hand*, staat bij Mij niet te geven, maar *het* *zal* *gegeven* *worden* dien het bereid is van Mijn Vader.","24":"En als de *andere* tien *dat* hoorden, namen zij het zeer kwalijk van de twee broeders.","25":"En als Jezus hen tot Zich geroepen had, zeide Hij: Gij weet, dat de oversten der volken heerschappij voeren over hen, en de groten gebruiken macht over hen.","26":"Doch alzo zal het onder u niet zijn; maar zo wie onder u zal willen groot worden, *die* zij uw dienaar;","27":"En zo wie onder u zal willen de eerste zijn, die zij uw dienstknecht.","28":"Gelijk de Zoon des mensen niet is gekomen om gediend te worden, maar om te dienen, en Zijn ziel te geven *tot* een rantsoen voor velen.","29":"En als zij van Jericho uitgingen, is Hem een grote schare gevolgd.","30":"En ziet, twee blinden, zittende aan den weg, als zij hoorden, dat Jezus voorbijging, riepen, zeggende: Heere, Gij Zone Davids! ontferm U onzer.","31":"En de schare bestrafte hen, opdat zij zwijgen zouden; maar zij riepen te meer, zeggende: Ontferm U onzer, Heere, Gij Zone Davids!","32":"En Jezus, *stil* staande, riep hen en zeide: Wat wilt gij, dat Ik u doe?","33":"Zij zeiden tot Hem: Heere! dat onze ogen geopend worden.","34":"En Jezus, innerlijk bewogen zijnde met barmhartigheid, raakte hun ogen aan; en terstond werden hun ogen ziende, en zij volgden Hem."},"KJV":{"1":"For the kingdom of heaven is like unto a man *that is* an householder, which went out early in the morning to hire labourers into his vineyard.","2":"And when he had agreed with the labourers for a penny a day, he sent them into his vineyard.","3":"And he went out about the third hour, and saw others standing idle in the marketplace,","4":"And said unto them; Go ye also into the vineyard, and whatsoever is right I will give you. And they went their way.","5":"Again he went out about the sixth and ninth hour, and did likewise.","6":"And about the eleventh hour he went out, and found others standing idle, and saith unto them, Why stand ye here all the day idle?","7":"They say unto him, Because no man hath hired us. He saith unto them, Go ye also into the vineyard; and whatsoever is right, *that* shall ye receive.","8":"So when even was come, the lord of the vineyard saith unto his steward, Call the labourers, and give them *their* hire, beginning from the last unto the first.","9":"And when they came that *were hired* about the eleventh hour, they received every man a penny.","10":"But when the first came, they supposed that they should have received more; and they likewise received every man a penny.","11":"And when they had received *it*, they murmured against the goodman of the house,","12":"Saying, These last have wrought *but* one hour, and thou hast made them equal unto us, which have borne the burden and heat of the day.","13":"But he answered one of them, and said, Friend, I do thee no wrong: didst not thou agree with me for a penny?","14":"Take *that* thine *is*, and go thy way: I will give unto this last, even as unto thee.","15":"Is it not lawful for me to do what I will with mine own? Is thine eye evil, because I am good?","16":"So the last shall be first, and the first last: for many be called, but few chosen.","17":"And Jesus going up to Jerusalem took the twelve disciples apart in the way, and said unto them,","18":"Behold, we go up to Jerusalem; and the Son of man shall be betrayed unto the chief priests and unto the scribes, and they shall condemn him to death,","19":"And shall deliver him to the Gentiles to mock, and to scourge, and to crucify *him*: and the third day he shall rise again.","20":"Then came to him the mother of Zebedee's children with her sons, worshipping *him*, and desiring a certain thing of him.","21":"And he said unto her, What wilt thou? She saith unto him, Grant that these my two sons may sit, the one on thy right hand, and the other on the left, in thy kingdom.","22":"But Jesus answered and said, Ye know not what ye ask. Are ye able to drink of the cup that I shall drink of, and to be baptized with the baptism that I am baptized with? They say unto him, We are able.","23":"And he saith unto them, Ye shall drink indeed of my cup, and be baptized with the baptism that I am baptized with: but to sit on my right hand, and on my left, is not mine to give, but *it shall be given to them* for whom it is prepared of my Father.","24":"And when the ten heard *it*, they were moved with indignation against the two brethren.","25":"But Jesus called them *unto him*, and said, Ye know that the princes of the Gentiles exercise dominion over them, and they that are great exercise authority upon them.","26":"But it shall not be so among you: but whosoever will be great among you, let him be your minister;","27":"And whosoever will be chief among you, let him be your servant:","28":"Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.","29":"And as they departed from Jericho, a great multitude followed him.","30":"And, behold, two blind men sitting by the way side, when they heard that Jesus passed by, cried out, saying, Have mercy on us, O Lord, *thou* Son of David.","31":"And the multitude rebuked them, because they should hold their peace: but they cried the more, saying, Have mercy on us, O Lord, *thou* Son of David.","32":"And Jesus stood still, and called them, and said, What will ye that I shall do unto you?","33":"They say unto him, Lord, that our eyes may be opened.","34":"So Jesus had compassion *on them*, and touched their eyes: and immediately their eyes received sight, and they followed him."}},"tsk":{"1":[{"kopje":"het Koninkrijk","refs":["Matt 3:2","Matt 13:24","Matt 13:31","Matt 13:33","Matt 13:44","Matt 13:45","Matt 13:47","Matt 22:2","Matt 25:1","Matt 25:14"]},{"kopje":"een heer","refs":["Matt 9:37","Matt 9:38","Matt 21:33-43","Hoogl 8:11","Hoogl 8:12","Jes 5:1","Jes 5:2","Joh 15:1"]},{"kopje":"vroeg","refs":["Matt 23:37","Hoogl 8:11","Hoogl 8:12","Jer 25:3","Jer 25:4"]},{"kopje":"arbeiders","refs":["Mark 13:34","1 Kor 15:58","Hebr 13:21","2 Petr 1:5-10"]}],"2":[{"kopje":"overeengekomen was","refs":["Matt 20:13","Ex 19:5","Ex 19:6","Deut 5:27-30"]},{"kopje":"een penning","refs":["Matt 18:28","Matt 22:19","Luk 10:35","Openb 6:6"]},{"kopje":"stuurde hij","refs":["1 Sam 2:18","1 Sam 2:26","1 Sam 3:1","1 Sam 3:21","1 Sam 16:11","1 Sam 16:12","1 Kon 3:6-11","1 Kon 18:12","2 Kron 34:3","Pred 12:1","Luk 1:15","2 Tim 3:15"]}],"3":[{"kopje":"het derde","refs":["Mark 15:25","Hand 2:15"]},{"kopje":"staan","refs":["Matt 20:6","Matt 20:7","Matt 11:16","Matt 11:17","Spr 19:15","Ezech 16:49","Hand 17:17-21","1 Tim 5:13","Hebr 6:12"]}],"4":[{"kopje":"Gaan","refs":["Matt 9:9","Matt 21:23-31","Luk 19:7-10","Rom 6:16-22","1 Kor 6:11","1 Tim 1:12","1 Tim 1:13","Tit 3:8","1 Petr 1:13","1 Petr 4:2","1 Petr 4:3"]},{"kopje":"en wat","refs":["Kol 4:1"]}],"5":[{"kopje":"zesde","refs":["Matt 27:45","Mark 15:33","Mark 15:34","Luk 23:44-46","Joh 1:40","Joh 4:6","Joh 11:9","Hand 3:1","Hand 10:3","Hand 10:9"]},{"kopje":"en deed","refs":["Gen 12:1-4","Joz 24:2","Joz 24:3","2 Kron 33:12-19","Hebr 11:24-26"]}],"6":[{"kopje":"het elfde","refs":["Pred 9:10","Luk 23:40-43","Joh 9:4"]},{"kopje":"Wat","refs":["Spr 19:15","Ezech 16:49","Hand 17:21","Hebr 6:12" // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('p' + openVers).classList.remove('open');

document.addEventListener('click', e => {

    const isKjv = wl.classList.contains('wl-kjv');

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
