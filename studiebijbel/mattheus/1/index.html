ekte Rehabeam, en Rehabeam verwekte Abia, en Abia verwekte Asa;","8":"en Asa verwekte Josafat, en Josafat verwekte Joram, en Joram verwekte Uzzia;","9":"en Uzzia verwekte Jotham, en Jotham verwekte Achaz, en Achaz verwekte Hizkia;","10":"en Hizkia verwekte Manasse, en Manasse verwekte Amon, en Amon verwekte Josia;","11":"en Josia verwekte Jechonia en zijn broers, ten tijde van de Babylonische wegvoering[2].","12":"En na de Babylonische wegvoering verwekte Jechonia Sealthiël, en Sealthiël verwekte Zerubbabel;","13":"en Zerubbabel verwekte Abiud, en Abiud verwekte Eljakim, en Eljakim verwekte Azor;","14":"en Azor verwekte Sadok, en Sadok verwekte Achim, en Achim verwekte Eliud;","15":"en Eliud verwekte Eleazar, en Eleazar verwekte Matthan, en Matthan verwekte Jakob;","16":"en Jakob verwekte Jozef, de man van Maria, uit wie geboren is JEZUS, Die Christus genoemd wordt.","17":"Al de geslachten dus, van Abraham tot David, zijn veertien geslachten; en van David tot de Babylonische wegvoering veertien geslachten; en van de Babylonische wegvoering tot Christus veertien geslachten.","18":"De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.","19":"Jozef nu, haar man, wilde haar, omdat hij rechtvaardig was en haar niet in het openbaar te schande wilde maken, in stilte verlaten.","20":"En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest;","21":"en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken[3] van hun zonden.","22":"En dit alles is gebeurd, opdat vervuld zou worden wat door de Heere gesproken is door de profeet, die zei:","23":"Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.","24":"Toen Jozef uit de slaap ontwaakt was, deed hij zoals de engel van de Heere hem bevolen had, en hij nam zijn vrouw tot zich;","25":"en hij had geen gemeenschap met haar[4], totdat zij deze haar eerstgeboren Zoon gebaard had; en hij gaf Hem de naam JEZUS."},"SV":{"1":"Het boek des geslachts van JEZUS CHRISTUS, den Zoon van David, den zoon van Abraham.","2":"Abraham gewon Izak, en Izak gewon Jakob, en Jakob gewon Juda, en zijn broeders;","3":"En Juda gewon Fares en Zara bij Thamar; en Fares gewon Esrom, en Esrom gewon Aram;","4":"En Aram gewon Aminadab, en Aminadab gewon Nahasson, en Nahasson gewon Salmon;","5":"En Salmon gewon Booz bij Rachab, en Booz gewon Obed bij Ruth, en Obed gewon Jessai;","6":"En Jessai gewon David, den koning; en David, de koning, gewon Salomon bij degene, die Uria’s *vrouw* *was* *geweest*;","7":"En Salomon gewon Roboam, en Roboam gewon Abia, en Abia gewon Asa;","8":"En Asa gewon Josafat, en Josafat gewon Joram, en Joram gewon Ozias;","9":"En Ozias gewon Joatham, en Joatham gewon Achaz, en Achaz gewon Ezekias;","10":"En Ezekias gewon Manasse, en Manasse gewon Amon, en Amon gewon Josias;","11":"En Josias gewon Jechonias, en zijn broeders, omtrent de Babylonische overvoering.","12":"En na de Babylonische overvoering gewon Jechonias Salathiël, en Salathiël gewon Zorobabel;","13":"En Zorobabel gewon Abiud, en Abiud gewon Eljakim, en Eljakim gewon Azor;","14":"En Azor gewon Sadok, en Sadok gewon Achim, en Achim gewon Elihud;","15":"En Elihud gewon Eleazar, en Eleazar gewon Matthan, en Matthan gewon Jakob;","16":"En Jakob gewon Jozef, den man van Maria, uit welke geboren is JEZUS, gezegd Christus.","17":"Al de geslachten dan, van Abraham tot David, *zijn* veertien geslachten; en van David tot de Babylonische overvoering, *zijn* veertien geslachten; en van de Babylonische overvoering tot Christus, *zijn* veertien geslachten.","18":"De geboorte van Jezus Christus was nu aldus; want als Maria, Zijn moeder, met Jozef ondertrouwd was, eer zij samengekomen waren, werd zij zwanger bevonden uit den Heiligen Geest.","19":"Jozef nu, haar man, alzo hij rechtvaardig was, en haar niet wilde openbaarlijk te schande maken, was van wil haar heimelijk te verlaten.","20":"En alzo hij deze dingen in den zin had, ziet, de engel des Heeren verscheen hem in den droom, zeggende: Jozef, *gij* zone Davids! wees niet bevreesd Maria, uw vrouw, tot u te nemen; want hetgeen in haar ontvangen is, dat is uit den Heiligen Geest;","21":"En zij zal een Zoon baren, en gij zult Zijn naam heten JEZUS; want Hij zal Zijn volk zalig maken van hun zonden.","22":"En dit alles is geschied, opdat vervuld zou worden, hetgeen van den Heere gesproken is, door den profeet, zeggende:","23":"Ziet, de maagd zal zwanger worden, en een Zoon baren, en gij zult Zijn naam heten Emmanuël; hetwelk is, overgezet zijnde, God met ons.","24":"Jozef dan, opgewekt zijnde van den slaap, deed, gelijk de engel des Heeren hem bevolen had, en heeft zijn vrouw tot zich genomen;","25":"En bekende haar niet, totdat zij dezen haar eerstgeboren Zoon gebaard had; en heette Zijn naam JEZUS."},"KJV":{"1":"The book of the generation of Jesus Christ, the son of David, the son of Abraham.","2":"Abraham begat Isaac; and Isaac begat Jacob; and Jacob begat Judas and his brethren;","3":"And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram;","4":"And Aram begat Aminadab; and Aminadab begat Naasson; and Naasson begat Salmon;","5":"And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;","6":"And Jesse begat David the king; and David the king begat Solomon of her *that had been the wife* of Urias;","7":"And Solomon begat Roboam; and Roboam begat Abia; and Abia begat Asa;","8":"And Asa begat Josaphat; and Josaphat begat Joram; and Joram begat Ozias;","9":"And Ozias begat Joatham; and Joatham begat Achaz; and Achaz begat Ezekias;","10":"And Ezekias begat Manasses; and Manasses begat Amon; and Amon begat Josias;","11":"And Josias begat Jechonias and his brethren, about the time they were carried away to Babylon:","12":"And after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel;","13":"And Zorobabel begat Abiud; and Abiud begat Eliakim; and Eliakim begat Azor;","14":"And Azor begat Sadoc; and Sadoc begat Achim; and Achim begat Eliud;","15":"And Eliud begat Eleazar; and Eleazar begat Matthan; and Matthan begat Jacob;","16":"And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ.","17":"So all the generations from Abraham to David *are* fourteen generations; and from David until the carrying away into Babylon *are* fourteen generations; and from the carrying away into Babylon unto Christ *are* fourteen generations.","18":"Now the birth of Jesus Christ was on this wise: When as his mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost.","19":"Then Joseph her husband, being a just *man*, and not willing to make her a publick example, was minded to put her away privily.","20":"But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost.","21":"And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins.","22":"Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,","23":"Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.","24":"Then Joseph being raised from sleep did as the angel of the Lord had bidden him, and took unto him his wife:","25":"And knew her not till she had brought forth her firstborn son: and he called his name JESUS."}},"tsk":{"1":[{"kopje":"geslachtsregister","refs ata-code=\"G3739\">which</span> being <span class=\"wl wl-kjv\" data-code=\"G3177\">interpreted</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is,</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> us.","24":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Then</span> <span class=\"wl wl-kjv\" data-code=\"G2501\">Joseph</span> being <span class=\"wl wl-kjv\" data-code=\"G1326\">raised</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G5258\">sleep</span> <span class=\"wl wl-kjv\" data-code=\"G4160\">did</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> the <span class=\"wl wl-kjv\" data-code=\"G32\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> had <span class=\"wl wl-kjv\" data-code=\"G4367\">bidden</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3880\">took</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> his wife:","25":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G1097\">knew</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2193\">till</span> she had brought <span class=\"wl wl-kjv\" data-code=\"G5088\">forth</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G4416\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"G5207\">son:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> he <span class=\"wl wl-kjv\" data-code=\"G2564\">called</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3686\">name</span> JESUS."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"boek des geslachts","tekst":"Dit is geslachtregister, of boom der voorouders van Christus. Het is een Hebreeuwse wijze van spreken. Gen 5:1 ."},{"catchword":"den zoon van David, den zoon van Abraham","tekst":"Deze twee, David en Abraham, worden hier vooraan gesteld, en Christus wordt bijzonder hun beider zoon genaamd, omdat dezen beiden bijzondere beloften waren gedaan, dat Hij uit hun zaad zou geboren worden. Gen 22:18 ; 2Sa 7:12 ; Psa 89:30 en Psa 132:11 . Waarom ook Mattheus dit geslachtsregister eerst van Abraham heeft willen beginnen, gelijk hij ook, vs.6, David bijzonder een koning noemt, omdat David de eerste koning uit den stam van Juda is geweest en een duidelijk voorbeeld van Christus' eeuwig koninkrijk. Luk 1:32"}],"2":[{"catchword":"gewon","tekst":"De andere overzetting heeft: gegenereerd, hetwelk, daar het een Latijns woord is, beter geacht is te behouden het woord gewinnen, hetwelk meest alle oude Nederduitse overzettingen hier gebruiken."}],"3":[{"catchword":"bij Thamar","tekst":"Gr. uit. Deze vrouw, alsook hierna Rachab en Ruth, vs.5, en Bathseba, vs.6, worden van den evangelist hier vermeld, omdat de Schriftuur van haar iets zegt, dienende tot den staat der vernedering van Christus, en ook omdat enige harer van heidense afkomst zijn geweest; opdat daarmede aangewezen zou worden dat ook grote zondaren, en de heidenen zelf, deel zouden hebben aan de vruchten der geboorte van Christus."}],"4":[{"catchword":"Aram","tekst":"Deze Aram wordt Ram genaamd Rth 4:19 ."}],"6":[{"catchword":"Sálomo","tekst":"Lukas stelt in plaats van Salomo en zijne nakomelingen Nathan, een anderen zoon van David, met zijne nakomelingen. De reden van deze verscheidenheid zie: Luk 3:31 ."},{"catchword":"degene","tekst":"Namelijk Bathseba; bij welke David Salomo gewon, toen zij na de dood van haren man Uria met hem getrouwd was. 2Sa 11:3 , 2Sa 11:27 en 2Sa 12:24 ."}],"8":[{"catchword":"Ozias;","tekst":"Hier worden drie koningen overgeslagen en voorbijgegaan, namelijk Ochosias, Joas, en Amasias, om het getal van veertien niet te buiten te gaan, vs.17. Zie van dergelijke uitlatingen een voorbeeld Ezr 7:3 , verg. met 1Ch 6:7 , en wordt deze Ozias ook Azarias genaamd, 1Ch 3:12"}],"11":[{"catchword":"Jechónias","tekst":"Enigen voegen hier bij Jakim; en Jakim gewon Jechoniam, hetwelk met het register der koningen van Juda, 1Ch 3:16 , enz. en met het getal van veertien alhier, vs.17, niet kwalijk schijnt overeen te komen. Dat alzo meest alle oude boeken en overzettingen dit bijvoegsel van Jakim niet hebben, zo wordt dit hier nagelaten; te meer omdat door Jechonias in dit 11e vs. verstaan kan worden de vader, die ook Joakim is genaamd, en door Jechonias in het 12e vs. de zoon, die ook Joachin is genaamd, en aldus wordt hier het getal van veertien ook vervuld."},{"catchword":"omtrent de Babylonische overvoering","tekst":"Of in, of ten tijde; dat is, tegen den tijd van de gevankelijke wegvoering der Joden naar Babylonië."}],"12":[{"catchword":"Saláthiël","tekst":"Velen menen dat dezen Salathiël niet is geweest een natuurlijke zoon van Jechonias, alzo bij Luk 3:27 gezegd wordt te zijn een zoon van Neri, en het Jer 22:30 schijnt dat Jechonias geen kinderen nagelaten heeft; maar dat hij zijn zoon genaamd zou worden omdat hij, als zijn naaste bloedverwant, hem in de regering van het Israëlietische volk opgevolgd is; gelijk 1Ch 3:16 Zedekias genaamd wordt een zoon van Jechonias, omdat hij hem ook in het rijk opgevolgd is, die nochtans 2Ch 24:17 zijn oom genaamd wordt; te meer omdat Luk 3:27 gezegd wordt dat Salathiël afkomstig is geweest van het geslacht Nathan, bij hetwelk na de Babylonische gevangenis de regering des Joodsen volks is geweest, gelijk schijnt afgeleid te kunnen worden uit Zec 12:12 . Doch anderen menen dat deze Salathiël is geweest een natuurlijke zoon van Jechonias, en dat Salathiël, van wien Luk 3:27 , spreekt een andere Salathiël is geweest dan deze, alzo deze aldaar genaamd wordt een zoon van Neri. Zie de aantekening bij Ezr 3:2 ."}],"16":[{"catchword":"Jozef","tekst":"Dit geslachtsregister wordt gebracht op Jozef, omdat het bij de Hebreën niet gebruikelijk was de geslachtsregisters te brengen op de vrouwen; nochtans kan daaruit blijken dat Christus is uit het geslacht Davids, omdat het bij de Joden gebruikelijk was te trouwen, en Mattheus hierover vs.1, getuigt, dat hij hier het geslachtsregister van Jezus Christus verhaalt. Want dat Christus uit Juda en David afkomstig is, wordt doorgaans in de Heilige Schrift klaarlijk geleerd. Zie Luk 1:32 ; Rom 1:3 ; Heb 7:14 ."},{"catchword":"gezegd","tekst":"Dat is, die toegenaamd wordt. Zie van dezen naam Joh 1:42 ."}],"17":[{"catchword":"veertien geslachten","tekst":"De evangelist heeft ook maar veertien koningen en vorsten uitgedrukt, omdat van Abraham tot David maar veertien geslachten van voorvaders zijn geweest, waarom hij enige geslachten der koningen en vorsten heeft overgeslagen. Zie vs.8, en Luk 3:24 , enz."}],"18":[{"catchword":"eer zij samengekomen waren","tekst":"Dat is, eer hij haar tot zich genomen had, gelijk blijkt uit vs.20."},{"catchword":"zwanger","tekst":"nders, bevrucht; echter het woord zwanger komt hier beter, alzo Christus eigenlijk geen vrucht des Heiligen Geestes, maar een vrucht des buiks van Maria; Luk 1:42 ."},{"catchword":"uit den Heiligen Geest","tekst":"Dat is, door de werking des Heiligen Geestes, gelijk blijkt Luk 1:35 . Zo wordt het woordje uit ook elders genomen, gelijk Rom 11:35 , en 1Jo 5:1 . Dit was Jozef toen nog niet bekend, maar wordt hem daarna door de engel geopenbaard, zie vs.20."}],"19":[{"catchword":"openbaarlijk te schande maken","tekst":"Het Griekse woord betekent zoveel als iemand tot een voorbeeld openlijk tentoonstellen en smaadheid aandoen."},{"catchword":"te verlaten","tekst":"Grieks: haar te ontbinden."}],"20":[{"catchword":"ontvangen is","tekst":"Grieks: gegenereerd of geteeld is; voor welke woorden, alzo het ene Latijn is en het andere duister, beter geacht is het woord ontvangen te stellen. Van deze generatie en ontvangenis, zie Luk 1:35 , Luk 1:42 ."}],"21":[{"catchword":"zijn volk","tekst":"Dat is, degenen, die Hem van den Vader gegeven waren om die te verlossen of behouden; Psa 2:8 ; Isa 8:18 ; Joh 6:37 , en Joh 17:24 ; Act 18:10 ; Rom 11:1-2"}],"23":[{"catchword":"de maagd","tekst":"De Hebreeuwse en Griekse teksten spreken hier van een bijzondere maagd."},{"catchword":"gij zult","tekst":"Anders zij zal, of zij zullen; dat is, men zal."},{"catchword":"Emmanuël","tekst":"Wordt alzo genaamd ten aanzien van zijn persoon en ambt, omdat Hij in een persoon beiden waarachtig God en mens is, en ons met God verenigt."}],"24":[{"catchword":"bevolen had","tekst":"Grieks: verordineerd had."}],"25":[{"catchword":"totdat","tekst":"Hieruit kan men niet besluiten dat Jozef haar daarna zou hebben bekend; want deze manier van spreken dit altijd niet medebrengt. Zie 2Sa 6:23 en Mat 28:20 ."},{"catchword":"eerstgeboren zoon gebaard had","tekst":"Een eerstgeboren zoon is die de moeder eerst opent, Exo 13:2 , al is het dat er geen zonen of kinderen na geboren worden. Want als Exo 11:5 gezegd wordt dat de eerstgeborenen van Egypte zouden gedood worden, zijn onder dezelven zonder twijfel ook de eniggeborenen te verstaan."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The book of the generation [i.e Genealogy,or Tree of Christs Ancestours;It is an Hebrew manner of speaking.See Gen 5.1.] of Jesus Christ,the Son of David,the Son of Abraham.These two,David and Abraham,are here set before,and Christ is especially called the Son of these two,because special promises were made to them both,that he should be born of their seed.See Gen 22:18. 2 Sam.7.12. Psalm.89.30. and 132.11.For which cause also,Matthew would bein this Genealogy first from Abraham ; like as he also,verse 6.particularly the names David,the King ; because David was the first King of the Tribe of Judah,and clear Type of the everlasting Kingdom of Christ, Luke 1.verse 32.]"}],"2":[{"catchword":null,"tekst":"Abraham begat Isaac,and Isaac // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';

    let inhoud;
    if (b.modus === 'genummerd') {

        const nr = i + 1;

        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);

            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
