n zeggen: Ik ben de Christus; en zij zullen velen misleiden.","6":"En u zult horen van oorlogen en geruchten van oorlogen; kijk uit, wordt niet verschrikt; want al die dingen moeten gebeuren, maar het einde is er nog niet.","7":"Want het ene volk zal tegen het andere volk opstaan, en het ene koninkrijk tegen het andere koninkrijk; en er zullen hongersnoden zijn, en pestilentiën, en aardbevingen op verschillende plaatsen.","8":"Maar al die dingen zijn nog maar het begin van de smarten.","9":"Dan zullen zij u overleveren aan verdrukking, en zullen u doden, en u zult gehaat worden door alle volken, omwille van Mijn Naam.","10":"En dan zullen er velen ten val komen, en zullen elkaar overleveren, en elkaar haten.","11":"En veel valse profeten zullen opstaan, en zullen er velen misleiden.","12":"En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.","13":"Maar wie zal volharden tot het einde, die zal behouden worden.","14":"En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.","15":"Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats *(die het leest, laat hij daarop letten!)*,","16":"laat dan wie in Judea zijn, vluchten naar de bergen;","17":"wie op het dak is, moet niet naar beneden komen om iets uit zijn huis weg te nemen;","18":"en wie op de akker is, moet niet terugkeren om zijn kleren weg te nemen.","19":"Maar wee de zwangere vrouwen, en de zogende vrouwen in die dagen!","20":"Bid dat uw vlucht niet gebeurt in de winter, en ook niet op een sabbat.","21":"Want dan zal er grote verdrukking zijn, wat voor verdrukking er niet geweest is vanaf het begin van de wereld tot nu toe, en er ook nooit meer zal zijn.","22":"En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.","23":"Als iemand dan tegen u zal zeggen: Kijk, hier is de Christus, of daar, geloof het niet.","24":"Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.","25":"Kijk, Ik heb het u van tevoren gezegd!","26":"Als zij dan tegen u zullen zeggen: Kijk, hij is in de woestijn, ga er niet heen; Kijk, hij is in de binnenkamers, geloof het niet.","27":"Want zoals de bliksem uitgaat vanuit het oosten en schijnt tot het westen, zo zal ook de komst van de Zoon des mensen zijn.","28":"Want waar het dode lichaam ook zal zijn, daar zullen de arenden verzameld worden.","29":"En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.","30":"En dan zal in de hemel het teken van de Zoon des mensen verschijnen; en dan zullen alle geslachten van de aarde treuren, en zij zullen de Zoon des mensen zien komen op de wolken van de hemel, met grote kracht en heerlijkheid.","31":"En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.","32":"En leer van de vijgenboom deze gelijkenis: wanneer zijn tak nu teder wordt en de bladeren uitspruiten, dan weet u dat de zomer nabij is.","33":"Zo ook u, wanneer u al deze dingen zult zien, weet dan dat het nabij is, voor de deur.","34":"Voorwaar, Ik zeg u: dit geslacht zal beslist niet voorbijgaan, totdat al deze dingen gebeurd zijn.","35":"De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.","36":"Maar die dag en dat uur kent niemand, ook de engelen van de hemelen niet, maar alleen Mijn Vader.","37":"En zoals de dagen van Noach waren, zo zal ook de komst van de Zoon des mensen zijn.","38":"Want zoals zij waren in de dagen voor de zondvloed, etend en drinkend, terwijl zij trouwden en ten huwelijk gaven, tot de dag toe waarop Noach in de ark ging;","39":"en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.","40":"Dan zullen er twee op de akker zijn: de één zal aangenomen worden, en de ander zal achtergelaten worden.","41":"Er zullen twee vrouwen malen bij de molen: de één zal aangenomen worden, en de ander zal achtergelaten worden.","42":"Waak dan, want u weet niet in welk uur uw Heere komen zal.","43":"Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven.","44":"Daarom, wees ook u bereid, want op een uur dat u het niet verwacht, zal de Zoon des mensen komen.","45":"Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven?","46":"Gelukkig is die dienstknecht die zijn heer, als hij komt, zo bezig zal vinden.","47":"Voorwaar, Ik zeg u dat hij hem zal aanstellen over al zijn bezittingen.","48":"Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg,","49":"en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards,","50":"dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;","51":"en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden."},"SV":{"1":"En Jezus ging uit en vertrok van den tempel; en Zijn discipelen kwamen bij Hem, om Hem de gebouwen des tempels te tonen.","2":"En Jezus zeide tot hen: Ziet gij niet al deze dingen? Voorwaar zeg Ik u: Hier zal niet *een* steen op den *anderen* steen gelaten worden, die niet afgebroken zal worden.","3":"En als Hij op den Olijfberg gezeten was, gingen de discipelen tot Hem alleen, zeggende: Zeg ons, wanneer zullen deze dingen zijn, en welk *zal* het teken *zijn* van Uw toekomst, en van de voleinding der wereld?","4":"En Jezus, antwoordende, zeide tot hen: Ziet toe, dat u niemand verleide.","5":"Want velen zullen komen onder Mijn Naam, zeggende: Ik ben de Christus; en zij zullen velen verleiden.","6":"En gij zult horen van oorlogen, en geruchten van oorlogen; ziet toe, wordt niet verschrikt; want al *die* dingen moeten geschieden, maar nog is het einde niet.","7":"Want het *ene* volk zal tegen het *andere* volk opstaan, en het *ene* koninkrijk tegen het *andere* koninkrijk; en er zullen zijn hongersnoden, en pestilentien, en aardbevingen in verscheidene plaatsen.","8":"Doch al die dingen *zijn* *maar* een beginsel der smarten.","9":"Alsdan zullen zij u overleveren in verdrukking, en zullen u doden, en gij zult gehaat worden van alle volken, om Mijns Naams wil.","10":"En dan zullen er velen geërgerd worden, en zullen elkander overleveren, en elkander haten.","11":"En vele valse profeten zullen opstaan, en zullen er velen verleiden.","12":"En omdat de ongerechtigheid vermenigvuldigd zal worden, zo zal de liefde van velen verkouden.","13":"Maar wie volharden zal tot het einde, die zal zalig worden.","14":"En dit Evangelie des Koninkrijks zal in de gehele wereld gepredikt worden tot een getuigenis allen volken; en dan zal het einde komen.","15":"Wanneer gij dan zult zien den gruwel der verwoesting, waarvan gesproken is door Daniël, den profeet, staande in de heilige plaats; (die *het* leest, die merke daarop!)","16":"Dat alsdan, die in Judea zijn, vlieden op de bergen;","17":"Die op het dak is, kome niet af, om iets uit zijn huis weg te nemen;","18":"En die op den akker is, kere niet weder terug, om zijn klederen weg te nemen.","19":"Maar wee den bevruchten, en den zogenden *vrouwen* in die dagen!","20":"Doch bidt, dat uw vlucht niet geschiede des winters, noch op een sabbat.","21":"Want alsdan zal grote verdrukking wezen, hoedanige niet is geweest van het begin der wereld tot nu toe, en ook niet zijn zal.","22":"En zo die dagen niet verkort werden, geen vlees zou behouden worden; maar om der uitverkorenen wil zullen die dagen verkort worden.","23":"Alsdan, zo iemand tot ulieden zal zeggen: Ziet, hier is de Christus, of daar, gelooft het niet.","24":"Want er zullen valse christussen en valse profeten opstaan, en zullen grote tekenen en wonderheden doen, alzo dat zij ( indien het mogelijk ware) ook de uitverkorenen zouden verleiden.","25":"Ziet, Ik heb *het* u voorzegd!","26":"Zo zij dan tot u zullen zeggen: Ziet, hij is in de woestijn; gaat niet uit; Ziet, *hij* *is* in de binnenkameren; gelooft het niet.","27":"Want gelijk de bliksem uitgaat van het oosten, en schijnt tot het westen, alzo zal ook de toekomst van den Zoon des mensen wezen.","28":"Want alwaar het dode lichaam zal zijn, daar zullen de arenden vergaderd worden.","29":"En terstond na de verdrukking dier dagen, zal de zon verduisterd worden, en de maan zal haar schijnsel niet geven, en de sterren zullen van den hemel vallen, en de krachten der hemelen zullen bewogen worden.","30":"En alsdan zal in den hemel verschijnen het teken van den Zoon des mensen; en dan zullen al de geslachten der aarde wenen, en zullen den Zoon des mensen zien, komende op de wolken des hemels, met grote kracht en heerlijkheid.","31":"En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenvergaderen uit de vier winden, van *het* *ene* uiterste der hemelen tot het *andere* uiterste derzelve.","32":"En leert van den vijgeboom deze gelijkenis: wanneer zijn tak nu teder wordt, en de bladeren uitspruiten, zo weet gij, dat de zomer nabij is.","33":"Alzo ook gijlieden, wanneer gij al deze dingen zult zien, zo weet , dat *het* nabij is, voor de deur.","34":"Voorwaar, Ik zeg u: Dit geslacht zal geenszins voorbijgaan, totdat al deze dingen zullen geschied zijn.","35":"De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen geenszins voorbijgaan.","36":"Doch van dien dag en die ure weet niemand, ook niet de engelen der hemelen, dan Mijn Vader alleen.","37":"En gelijk de dagen van Noach *waren*, alzo zal ook zijn de toekomst van den Zoon des mensen.","38":"Want gelijk zij waren in de dagen voor den zondvloed, etende en drinkende, trouwende en ten huwelijk uitgevende, tot den dag toe, in welken Noach in de ark ging;","39":"En bekenden het niet, totdat de zondvloed kwam, en hen allen wegnam; alzo zal ook zijn de toekomst van den Zoon des mensen.","40":"Alsdan zullen er twee op den akker zijn, de een zal aangenomen, en de ander zal verlaten worden.","41":"Er zullen twee *vrouwen* malen in den molen, de ene zal aangenomen, en de andere zal verlaten worden.","42":"Waakt dan; want gij weet niet, in welke ure uw Heere komen zal.","43":"Maar weet dit, dat zo de heer des huizes geweten had, in welke nachtwake de dief komen zou, hij zou gewaakt hebben, en zou zijn huis niet hebben laten doorgraven.","44":"Daarom, zijt ook gij bereid; want in welke ure gij het niet meent, zal de Zoon des mensen komen.","45":"Wie is dan de getrouwe en voorzichtige dienstknecht, denwelken zijn heer over zijn dienstboden gesteld heeft, om hunlieder *hun* voedsel te geven ter rechter tijd?","46":"Zalig is die dienstknecht, welken zijn heer, komende, zal vinden alzo doende.","47":"Voorwaar, Ik zeg u, dat hij hem zal zetten over al zijn goederen.","48":"Maar zo die kwade dienstknecht in zijn hart zou zeggen: Mijn heer vertoeft te komen;","49":"En zou beginnen *zijn* mededienstknechten te slaan, en te eten en te drinken met de dronkaards;","50":"Zo zal de heer van dezen dienstknecht komen ten dage, in welken hij *hem* niet verwacht, en ter ure, die hij niet weet;","51":"En zal hem afscheiden, en zijn deel zetten met de geveinsden; daar zal wening zijn en knersing der tanden."},"KJV":{"1":"And Jesus went out, and departed from the temple: and his disciples came to *him* for to shew him the buildings of the temple.","2":"And Jesus said unto them, See ye not all these things? verily I say unto you, There shall not be left here one stone upon another, that shall not be thrown down.","3":"And as he sat upon the mount of Olives, the disciples came unto him privately, saying, Tell us, when shall these things be? and what *shall be* the sign of thy coming, and of the end of the world?","4":"And Jesus answered and said unto them, Take heed that no man deceive you.","5":"For many shall come in my name, saying, I am Christ; and shall deceive many.","6":"And ye shall hear of wars and rumours of wars: see that ye be not troubled: for all *these things* must come to pass, but the end is not yet.","7":"For nation shall rise against nation, and kingdom against kingdom: and there shall be famines, and pestilences, and earthquakes, in divers places.","8":"All these *are* the beginning of sorrows.","9":"Then shall they deliver you up to be afflicted, and shall kill you: and ye shall be hated of all nations for my name's sake.","10":"And then shall many be offended, and shall betray one another, and shall hate one another.","11":"And many false prophets shall rise, and shall deceive many.","12":"And because iniquity shall abound, the love of many shall wax cold.","13":"But he that shall endure unto the end, the same shall be saved.","14":"And this gospel of the kingdom shall be preached in all the world for a witness unto all nations; and then shall the end come.","15":"When ye therefore shall see the abomination of desolation, spoken of by Daniel the prophet, stand in the holy place, (whoso readeth, let him understand:)","16":"Then let them which be in Judaea flee into the mountains:","17":"Let him which is on the housetop not come down to take any thing out of his house:","18":"Neither let him which is in the field return back to take his clothes.","19":"And woe unto them that are with child, and to them that give suck in those days!","20":"But pray ye that your flight be not in the winter, neither on the sabbath day:","21":"For then shall be great tribulation, such as was not since the beginning of the world to this time, no, nor ever shall be.","22":"And except those days should be shortened, there should no flesh be saved: but for the elect's sake those days shall be shortened.","23":"Then if any man shall say unto you, Lo, here *is* Christ, or there; believe *it* not.","24":"For there shall arise false Christs, and false prophets, and shall shew great signs and wonders; insomuch that, if *it were* possible, they shall deceive the very elect.","25":"Behold, I have told you before.","26":"Wherefore if they shall say unto you, Behold, he is in the desert; go not forth: behold, *he is* in the secret chambers; believe *it* not.","27":"For as the lightning cometh out of the east, and shineth even unto the west; so shall also the coming of the Son of man be.","28":"For wheresoever the carcase is, there will the eagles be gathered together.","29":"Immediately after the tribulation of those days shall the sun be darkened, and the moon shall not give her light, and the stars shall fall from heaven, and the powers of the heavens shall be shaken:","30":"And then shall appear the sign of the Son of man in heaven: and then shall all the tribes of the earth mourn, and they shall see the Son of man coming in the clouds of heaven with power and great glory.","31":"And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.","32":"Now learn a parable of the fig tree; When his branch is yet tender, and putteth forth leaves, ye know that summer *is* nigh:","33":"So likewise ye, when ye shall see all these things, know that it is near, *even* at the doors.","34":"Verily I say unto you, This generation shall not pass, till all these things be fulfilled.","35":"Heaven and earth shall pass away, but my words shall not pass away.","36":"But of that day and hour knoweth no *man*, no, not the angels of heaven, but my Father only.","37":"But as the days of Noe *were*, so shall also the coming of the Son of man be.","38":"For as in the days that were before the flood they were eating and drinking, marrying and giving in marriage, until the day that Noe entered into the ark,","39":"And knew not until the flood came, and took them all away; so shall also the coming of the Son of man be.","40":"Then shall two be in the field; the one shall be taken, and the other left.","41":"Two *women shall be* grinding at the mill; the one shall be taken, and the other left.","42":"Watch therefore: for ye know not what hour your Lord doth come.","43":"But know this, that if the goodman of the house had known in what watch the thief would come, he would have watched, and would not have suffered his house to be broken up.","44":"Therefore be ye also ready: for in such an hour as ye think not the Son of man cometh.","45":"Who then is a faithful and wise servant, whom his lord hath made ruler over his household, to give them meat in due season?","46":"Blessed *is* that servant, whom his lord when he cometh shall find so doing.","47":"Verily I say unto you, That he shall make him ruler over all his goods.","48":"But and if that evil servant shall say in his heart, My lord delayeth his coming;","49":"And shall begin to smite *his* fellowservants, and to eat and drink with the drunken;","50":"The lord of that servant shall come in a day when he looketh not for *him*, and in an hour that he is not aware of,","51":"And shall cut him asunder, and appoint *him* his portion with the hypocrites: there shall be weeping and gnashing of teeth."}},"tsk":{"1":[{"kopje":"vertrok","refs":["Matt 23:39","Jer 6:8","Ezech 8:6","Ezech 10:17-19","Ezech 11:22","Ezech 11:23","Hos 9:12"]},{"kopje":"tonen","refs":["Mark 13:1","Mark 13:2","Luk 21:5","Luk 21:6","Joh 2:20"]}],"2":[{"kopje":"hier","refs":["1 Kon 9:7","1 Kon 9:8","Jer 26:18","Ezech 7:20-22","Dan 9:26","Dan 9:27","Micha 3:12","Luk 19:  data-code=\"G1563\">there</span> shall <span class=\"wl wl-kjv\" data-code=\"G2071\">be</span> <span class=\"wl wl-kjv\" data-code=\"G2805\">weeping</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1030\">gnashing</span> of teeth."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de gebouwen des tempels","tekst":"Van de grootheid, sterkte en heerlijheid dezer gebouwen, zie den historieschrijver Josefus Antiq. lib. 15, cap. 14."},{"catchword":"tonen","tekst":"Dewijl Christus voorzegd had in het voorgaande Mat 23:38 , de verwoesting der stad en des tempels, zo schijnt, dat de discipelen daarom deze gebouwen Hem getoond hebben om te kennen te geven dat het hun docht òf onmogelijk òf jammer te wezen, dat zulk een heerlijk gebouw zou verwoest worden."}],"2":[{"catchword":"niet een steen op den anderen steen gelaten worden,","tekst":"Grieks, steen op steen niet gelaten worden."},{"catchword":"afgebroken zal worden","tekst":"Grieks, losgemaakt."}],"3":[{"catchword":"deze dingen zijn,","tekst":"Namelijk die Gij hier en op het einde van het voorgaande Mat 23 , gezegd hebt, zo van de verwoesting der stad en des tempels van Jeruzalem, als van uw laatste toekomst ten oordeel."}],"5":[{"catchword":"onder mijnen naam,","tekst":"Of, in, op mijnen naam; dat is, zich uitgevende voor den beloofden Messias, gelijk omtrent dien tijd en daarna verscheidene opgestaan zijn. Zie Act 5:36-37 , en JosEf. Antiq. lib.18, cap.12. lib.20 cap.2, enz. en de bello Iud. lib.2, cap.12."}],"6":[{"catchword":"nog is het einde niet","tekst":"Namelijk van al de ellenden en uiterste straffen, die den Joden zouden overkomen."}],"7":[{"catchword":"het ene volk","tekst":"Grieks, volk tegen volk."},{"catchword":"het ene koninkrijk","tekst":"Grieks, koninkrijk tegen koninkrijk."}],"8":[{"catchword":"smarten","tekst":"Grieks, weeën; gelijk der vrouwen die in barensnood zijn. Van al deze oorlogen en ellenden zie JosEf. Antiq. lib.20, en de bello ludic. lib.3, enz."}],"10":[{"catchword":"geërgerd worden,","tekst":"Dat is, door vrees voor vervolging van mij afwijken."}],"12":[{"catchword":"ongerechtigheid","tekst":"Grieks, overtreding der wet."},{"catchword":"liefde van velen verkouden","tekst":"Namelijk zo tot de waarheid des Evangelies als tot den naaste."}],"14":[{"catchword":"gehele wereld","tekst":"Grieks, bewoonde wereld. Zie hiervan de vervulling Rom 10:18 ; Col 1:6 ."},{"catchword":"het einde komen","tekst":"Namelijk der stad Jeruzalem en der Joodse regering."}],"15":[{"catchword":"gruwel der verwoesting,","tekst":"Dat is, het gruwelijk verwoestende leger der Romeinen, gelijk verklaard wordt Luk 21:20 ."},{"catchword":"heilige plaats","tekst":"Dat is, in het heilig Joodse land rondom Jeruzalem."}],"16":[{"catchword":"op de bergen","tekst":"Namelijk om zich aldaar te verbergen voor de straf."}],"17":[{"catchword":"dak is,","tekst":"De Joden waren veel op de daken der huizen, omdat zij boven plat waren. Zie hiervoren Mat 10:27 ."}],"18":[{"catchword":"kere niet weder","tekst":"Dat is, verlieze geen tijd om te vluchten."}],"19":[{"catchword":"wee den bevruchten en den zogenden","tekst":"Namelijk omdat zij onbekwaam zullen zijn om haastelijk te vluchten, met hare vrucht of kleine kinderen beladen zijnde."}],"20":[{"catchword":"des winters,","tekst":"Omdat in den winter het vluchten ondoenlijk is, en de Joden op den sabbat niet ver mochten reizen; zie Act 1:12 , noch zich van dingen tot de reis nodig, voorzien."}],"21":[{"catchword":"hoedanige niet is geweest","tekst":"Want gelijk Josefus getuigt, de bello Judas lib. 4,5,6 en 7, cap. 17, zijn door het zwaard, den honger en de pest vergaan, alleen binnen Jeruzalem elf honderd duizend mensen, en boven de zeven en negentig duizend tot slaven verkocht. Dergelijke verwoesting wordt in geen andere historiën gelezen."}],"22":[{"catchword":"die dagen niet verkort werden,","tekst":"Dat is, ten ware dat God de plagen van die tijden, die de Joden nog zwaarder hadden verdiend, had doen ophouden, er zou niemand uit het Joodse volk overgebleven zijn geweest."},{"catchword":"der uitverkorenen wil","tekst":"Namelijk die God onder het Joodse volk had, en altijd behouden wilde."}],"23":[{"catchword":"Alsdan","tekst":"Namelijk na de verwoesting van Jeruzalem tot de voleinding der wereld, van welke Hij begint te spreken in vs.29."},{"catchword":"daar,","tekst":"Grieks, hier."}],"24":[{"catchword":"tekenen","tekst":"Gelijk van den Antichrist getuigd wordt, 2Th 2:9 ; Rev 13:11 , enz."},{"catchword":"(indien het mogelijk ware)","tekst":"Dit wordt gezegd niet mogelijk te zijn, niet ten aanzien van den wil of kracht der uitverkorenen in henzelven. Maar ten aanzien van de onveranderlijkheid van het besluit Gods over hen en van zijn krachtige bewaring tegen de verleiding, volgens zijne beloften, die Hem niet kunne berouwen. Zie Joh 10:28 ; Rom 8:29-30 ; 1Pe 1:5 ."}],"27":[{"catchword":"van het oosten","tekst":"Grieks, van den opgang; namelijk der zon."},{"catchword":"tot het westen,","tekst":"Grieks, ondergang."},{"catchword":"alzo zal ook","tekst":"Namelijk met grote snelheid en klaarheid."}],"28":[{"catchword":"alwaar het dode lichaam zal zijn,","tekst":"Van dit spreekwoord, bij de Hebreën gebruikelijk, zie Job 39:33 , en wordt hiermede geleerd dat waar Christus met zijn lijden en sterven oprecht gepredikt wordt de gelovigen zich aldaar zullen vergaderen, gelijk zij ook in het laatste oordeel tot Christus zullen vergaderd worden om altijd bij Hem te blijven; 1Th 4:16-17 ; Joh 17:24 . Sommigen verstaan dit spreekwoord van de verwoesting des Joodse volks, hetwelk door het aas zou verstaan worden, en de Romeinen door de arenden; gelijk de Chaldeën bij Hab 1:8 ."}],"29":[{"catchword":"de verdrukking dier dagen","tekst":"Namelijk die de tirannen en de Antichrist de kerk Gods zullen hebben aangedaan."},{"catchword":"de krachten der hemelen","tekst":"Dat is, de krachtige of sterke hemelen."},{"catchword":"bewogen worden","tekst":"Namelijk gelijk de zee op en neder gedreven wordt."}],"30":[{"catchword":"het teken van den Zoon des mensen;","tekst":"Dat is, de tekenen zijner heerlijkheid, waarmede Hij in de woken verschijnen zal; zie Mar 13:26 ; Luk 21:27 ."},{"catchword":"wenen,","tekst":"Of, weeklagen. Grieks, van benauwdheid op de borst slaan."}],"31":[{"catchword":"geluid,","tekst":"Grieks, stem. Anders, met een bazuin en groot geluid."},{"catchword":"bijeenvergaderen uit de vier winden,","tekst":"Dat is, uit alle vier hoeken of gewesten der wereld bijeenbrengen, die zij uit hun verheerlijkte lichamen en anderszins zullen onderkennen."}],"32":[{"catchword":"teder wordt","tekst":"Of, sappig, wanneer het sap of groeisel daarin komt."}],"33":[{"catchword":"het nabij is,","tekst":"Of, Hij, namelijk Christus met zijne toekomst."}],"34":[{"catchword":"dit geslacht zal","tekst":"Namelijk des Joodse volks, of deze eeuw."},{"catchword":"voorbijgaan,","tekst":"Of, vergaan."}],"35":[{"catchword":"voorbijgaan,","tekst":"Of, vergaan. Hoe dit geschieden zal, wordt verklaard 2Pe 3:10 ."}],"38":[{"catchword":"etende en drinkende,","tekst":"Dat is, zorgeloos en vleselijk levende zonder vreze Gods, Jud 1:12 ."}],"40":[{"catchword":"aangenomen","tekst":"Namelijk van God onder zijne uitverkorenen."},{"catchword":"ander zal","tekst":"Grieks, de een."},{"catchword":"verlaten worden","tekst":"Namelijk met de verworpenen in de eeuwige verdoemenis."}],"41":[{"catchword":"malen in den molen","tekst":"Of, malen in het molenhuis. Het malen en bakken placht in die landen veel gedaan te worden door de vrouwen of slavinnen, die daartoe karnen of handmolens gebruikten."}],"43":[{"catchword":"de heer des huizes","tekst":"Of, huisvader."},{"catchword":"in welke nachtwake de dief komen zou,","tekst":"Dat is, in welk deel des nachts, die in vier nachtwaken gedeeld werd. Zie Mat 14:25 ."}],"45":[{"catchword":"dienstknecht,","tekst":"Bij dezen dienstknecht worden voornamelijk vergeleken de apostelen en dienaars des Evangelies, die de geestelijke spijs der zielen uitdelen."}],"46":[{"catchword":"alzo doende","tekst":"Namelijk gelijk hij hem bevolen heeft."}],"47":[{"catchword":"over al zijn goederen","tekst":"Of, over al wat hij heeft."}],"49":[{"catchword":"Slaan, en te eten en te drinken","tekst":"Dat is, overlast aan te doen."}],"51":[{"catchword":"afscheiden,","tekst":"Anders, in tweeën houwen. Sommigen menen dat hier gezien wordt op zulke zware straffen, waarvan men leest 1Sa 15:33 , en Dan 3:29 ; doch uit hetgeen volgt schijnt, dat het verstaan wordt van de afscheiding van zijn huisgezin, om daarna gestraft te worden."},{"catchword":"de geveinsden;","tekst":"Dat is, die wel voor de ogen hunner meesters zich schijnen te kwijten, maar in hun afwezen het tegendeel doen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Jesus went out and departed from the Temple, and his Disciples came to him to shew the building of the Temple. [seeing Christ had foretold in the former Chapter, verse 38. the desolation of the City and Temple, therefore it seems that the Disciples shewed him there buildings, giving thereby to undestand, that they thought it either impossible or pity, that such a glorious building should be laid waste: the greatness, strength, and magnificence of these bulldings, see the Historian Josephus, Antiqu. lib. 15. cap. 4.]"}],"2":[{"catchword":null,"tekst":"And Jesus said unto them, see ye not all these things Verily i say unto you, Here shall not (one) stone be left upon (another) stone. [Gr. no be left stone upon stone] which shall not be broken down. [Gr. loosened]"}],"3":[{"catchword":null,"tekst":"And as he was set on the Mount of Olives, the Disciples went unto him alone, saying Tell us when shall these things be? [Namely, which thou hast said here, and at the end of the fore &acirc;&euro;&ldquo; going chapter, as well of the laying waste of the City, and the Temple of Jerusalem, as of thy last coming to judgment] and what (shall be) the sign of thy coming, and of the end of world?"}],"4":[{"catchword":null,"tekst":"And Jesus answering, said unto them, Look to it, that no man seduce you"}],"5":[{"catchword":null,"tekst":"For many shall come under my name [Or in, on my name, i.e. giving themselves out for the promised Messiah, like as about that time and afterwards divers did arise. See Acts 5 verse 36,37. and Joseph. Antiq.lib. 18.cap.12. and lib 20. cap. etc. and de bello Judarco, lib.2. cip.12] saying, i am the Christ, and they shall seduce many."}],"6":[{"catchword":null,"tekst":"And ye shall hear of wars, and runors of wars, Look to it, be not affrighted: for all (those) things, must come to pass, but the end is not yet. [Namely, of all the miseries, and extreamest judgments which should come upon the Jews.]"}],"7":[{"catchword":null,"tekst":"For (one) people shall rise up against (another) people, [Gr. people against people] and (one) Kingdom against (another) kingdom: [Gr. Kingdom against Kingdom]and there shall be famines and pestilence, and carth &acirc;&euro;&ldquo; quakes in diver places."}],"8":[{"catchword":null,"tekst":"But all these things (are but) a beginning of pains. [Gr. pangs, like thse of women in Travel. Of all these and miseries, see Josephus, Antiq.lib.20. and de bello Jud. lib.3. etc]"}],"9":[{"catchword":null,"tekst":"Then shall they deliver you over into affliction, and shall kill you, and ye shall be hated of all people for my names sake."}],"10":[{"catchword":null,"tekst":"And then shall many be offended, [ That is, for fear of persecution fall away from me] and shall deliver up one another, and hate one another."}],"11":[{"catchword":null,"tekst":"And many false Prophets shall araise, and shall seduce many."}],"12":[{"catchword":null,"tekst":"And because the iniquity, [Gr. trangression of the law] shall be multiplyed, the love [namely, as well to the truth of the Gospel, as to their neighbour] of many shall wax cold."}],"13":[{"catchword":null,"tekst":"But he that shall endure unto the end, he shall be save."}],"14":[{"catchword":null,"tekst":"And this Gospel of the Kingdom shall be preached in the whole world, [Gr. the inhabited (world) see the fulfilling hereof, Rom 10 verse 18 Col 1 verse 6.] for witness to all people: and then shall the end come [namely, of the City Jerusalem, and of the Jewish Government.]"}],"15":[{"catchword":null,"tekst":"When therefore ye shall see the abomination of desolation, [That is, the abominable destroying Army of the Romanes, as is expounded, Luk 21:20.] whereof is spoken by Daniel the Prophet, standing in the holy place, [that is, in the holy land of the Jews, round about Jerusalem] he that reads (it) lelet him observe."}],"16":[{"catchword":null,"tekst":"Then let them that are in Judea, flee up into the mounatins. [Namely, there to hide themselves from the judgemnt.]"}],"17":[{"catchword":null,"tekst":"He that is on the house top, [The Jews were much on the top of their houses, because they were flat above. See Matth 10.27.] let him not come down to take away any thing out of his house."}],"18":[{"catchword":null,"tekst":"And he that is the field, let him not return back again, to take away his cloaths. [That is, let him loose no time to flee away]"}],"19":[{"catchword":null,"tekst":"But wo to the (women) that are with child, and that gave suck in those days. [Namely,because they will be unsit to flee away speedly, being laden with their fruit or little children.]"}],"20":[{"catchword":null,"tekst":"But pray ye that your flight happen not in the Winter, nor Sabbath. [Beacuse the Winter is unsit for flight, and the Jews might not travel far on the Sabbath. see Act 1:12. nor provide themselves of things needful for a journey]"}],"21":[{"catchword":null,"tekst":"For then shall be great tribution, such as was not from the beginning of the world, until now; nor yet ever shall be. [For as Josephus testifieth, de bello Jud lib. 4.5,6. and 17. there perished by the sord, famine, and pestilence, within Jerusalem only, eleven hundred thousand men, and above ninety seven thousand men were sold for slaves. The like desolation is not read in any Histories]"}],"22":[{"catchword":null,"tekst":"And id those days should not be shortned, no flesh should be saved: [Were it not that God had caused the plagues of those times to cease, though the Jews had deserved much heavier, there should not one of the Jewish Nation have remained] but for the elects sake [namely, which God had amongst the Jewsh people, and wound always preserve] those dys shall be shortned"}],"23":[{"catchword":null,"tekst":"Then [Namely, after the desolation of Jerusalem, till the end of the world, of which he begins to speak at the 29. verse] if any man shall say unto you, Lo here is the Christ, oe there, [Gr. here] believe it not."}],"24":[{"catchword":null,"tekst":"For there shall false Christ, and false Prophets arise, and shall shew great signs and wonders, [As is testified of Antichrist, 2 Thess2.9. Rev 13. verse 11, &c.] so that (if were possible) they should seduce even the elect. [This is said to be impossible, not respect of the will or power of the elect in themselves: but in respect of the immutability od Gods decree concerning them, and his powerful keeping of them against seduction, according to his promises, of which he cannot repent. See Joh 10:28. Rom 8.29,30. 1 Pet.1.5.]"}],"25":[{"catchword":null,"tekst":"Behold, i have foretold (it) you"}],"26":[{"catchword":null,"tekst":"Therefore if they shall say unto you, Behold he is in the wilderness, go not forth: Behold (he is) in the inner &acirc;&euro;&ldquo; chambers, believe it not."}],"27":[{"catchword":null,"tekst":"For like as the Llighting goeth forth from the East, [Gr. from the rising, namely, of the Sun] and shineth unto the West; [Gr. the setting] so shall also the coming of the Son of man be. [namely , with great swiftness and brightness]"}],"28":[{"catchword":null,"tekst":"For where the dead carcass shall be, there the Eagles will be gathered together, [Of this Proverb, usuall // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
