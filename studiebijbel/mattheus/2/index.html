 U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.","7":"Toen riep Herodes de wijzen heimelijk bij zich, en vroeg hun nauwkeurig naar de tijd waarop de ster verschenen was.","8":"En hij stuurde hen naar Bethlehem en zei: Ga erheen, en onderzoek nauwkeurig naar dat Kindje, en als u Het gevonden hebt, laat het mij weten, opdat ik ook kom en Het aanbid.","9":"Zij nu, toen zij de koning gehoord hadden, gingen op weg; en zie, de ster die zij in het oosten gezien hadden, ging voor hen uit, totdat zij kwam en bleef staan boven de plaats waar het Kindje was.","10":"Toen zij de ster zagen, verheugden zij zich met zeer grote vreugde.","11":"En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.","12":"En omdat zij door God in een droom gewaarschuwd waren dat zij niet naar Herodes zouden terugkeren, vertrokken zij via een andere weg naar hun land.","13":"Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.","14":"Hij stond dan op, nam het Kindje en Zijn moeder 's nachts tot zich, en vertrok naar Egypte;","15":"en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.","16":"Toen Herodes zag dat hij door de wijzen bedrogen was, werd hij zeer toornig, en na enigen uitgezonden te hebben, bracht hij al de kinderen om die binnen Bethlehem en in heel dat gebied waren, van twee jaar oud en daaronder, overeenkomstig de tijd die hij van de wijzen nauwkeurig had nagevraagd.","17":"Toen is vervuld wat gesproken is door de profeet Jeremia:","18":"Een stem is in Rama gehoord, geklaag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet getroost worden, omdat zij er niet meer zijn!","19":"Toen Herodes gestorven was, zie, de engel van de Heere verschijnt aan Jozef in een droom, in Egypte,","20":"en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en ga naar het land Israël; want zij zijn gestorven die het leven van het Kindje zochten.","21":"Hij stond dan op, nam het Kindje en Zijn moeder tot zich, en ging naar het land Israël.","22":"Maar toen hij hoorde dat Archelaüs koning was in Judea, in de plaats van zijn vader Herodes, was hij bang om daarheen te gaan; en nadat hij door God in de droom gewaarschuwd was, vertrok hij naar de streken van Galilea.","23":"En daar aangekomen, vestigde hij zich in de stad die Nazareth heet; opdat vervuld zou worden wat door de profeten gezegd is, dat Hij Nazarener genoemd zal worden."},"SV":{"1":"Toen nu Jezus geboren was te Bethlehem, *gelegen* in Judea, in de dagen van den koning Herodes, ziet, *enige* wijzen van het Oosten zijn te Jeruzalem aangekomen.","2":"Zeggende: Waar is de geboren Koning der Joden? want wij hebben gezien Zijn ster in het Oosten, en zijn gekomen om Hem te aanbidden.","3":"De koning Herodes nu, *dit* gehoord hebbende, werd ontroerd, en geheel Jeruzalem, met hem.","4":"En bijeenvergaderd hebbende al de overpriesters en Schriftgeleerden des volks, vraagde van hen, waar de Christus zou geboren worden.","5":"En zij zeiden tot hem: Te Bethlehem, in Judea *gelegen*; want alzo is geschreven door den profeet:","6":"En gij Bethlehem, *gij* land Juda! zijt geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.","7":"Toen heeft Herodes de wijzen heimelijk geroepen, en vernam naarstiglijk van hen den tijd, wanneer de ster verschenen was;","8":"En hen naar Bethlehem zendende, zeide: Reist heen, en onderzoekt naarstiglijk naar dat Kindeken, en als gij Het zult gevonden hebben, boodschapt het mij, opdat ik ook kome en Datzelve aanbidde.","9":"En zij, den koning gehoord hebbende, zijn heengereisd; en ziet, de ster, die zij in het oosten gezien hadden, ging hun voor , totdat zij kwam en stond boven *de* *plaats*, waar het Kindeken was.","10":"Als zij nu de ster zagen, verheugden zij zich met zeer grote vreugde.","11":"En in het huis gekomen zijnde, vonden zij het Kindeken met Maria, Zijn moeder, en nedervallende hebben zij Hetzelve aangebeden; en hun schatten opengedaan hebbende, brachten zij Hem geschenken: goud en wierook, en mirre.","12":"En door Goddelijke openbaring vermaand zijnde in den droom, dat zij niet zouden wederkeren tot Herodes, vertrokken zij door een anderen weg weder naar hun land.","13":"Toen zij nu vertrokken waren, ziet, de engel des Heeren verschijnt Jozef in den droom, zeggende: Sta op, en neem tot u het Kindeken en Zijn moeder, en vlied in Egypte, en wees aldaar, totdat ik het u zeggen zal; want Herodes zal het Kindeken zoeken, om Hetzelve te doden.","14":"Hij dan opgestaan zijnde, nam het Kindeken en Zijn moeder tot zich in den nacht, en vertrok naar Egypte;","15":"En was aldaar tot den dood van Herodes; opdat vervuld zou worden hetgeen van den Heere gesproken is door den profeet, zeggende: Uit Egypte heb Ik Mijn Zoon geroepen.","16":"Als Herodes zag, dat hij van de wijzen bedrogen was, toen werd hij zeer toornig, en *enigen* afgezonden hebbende, heeft omgebracht al de kinderen, die binnen Bethlehem, en in al deszelfs landpalen *waren*, van twee jaren *oud* en daaronder, naar den tijd, dien hij van de wijzen naarstiglijk onderzocht had.","17":"Toen is vervuld geworden, hetgeen gesproken is door den profeet Jeremia, zeggende:","18":"Een stem is in Rama gehoord, geklag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet vertroost wezen, omdat zij niet zijn!","19":"Toen Herodes nu gestorven was, ziet, de engel des Heeren verschijnt Jozef in den droom, in Egypte.","20":"Zeggende: Sta op, neem het Kindeken en Zijn moeder tot u, en trek in het land Israëls; want zij zijn gestorven, die de ziel van het Kindeken zochten.","21":"Hij dan, opgestaan zijnde, heeft tot zich genomen het Kindeken en Zijn moeder, en is gekomen in het land Israëls.","22":"Maar als hij hoorde, dat Archelaüs in Judea koning was, in de plaats van zijn vader Herodes, vreesde hij daarheen te gaan; maar door Goddelijke openbaring vermaand in den droom, is hij vertrokken in de delen van Galilea.","23":"En *daar* gekomen zijnde, nam hij zijn woonplaats in de stad, genaamd Nazareth; opdat vervuld zou worden, wat door de profeten gezegd is, dat Hij Nazarener zal geheten worden."},"KJV":{"1":"Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem,","2":"Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him.","3":"When Herod the king had heard *these things*, he was troubled, and all Jerusalem with him.","4":"And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born.","5":"And they said unto him, In Bethlehem of Judaea: for thus it is written by the prophet,","6":"And thou Bethlehem, *in* the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel.","7":"Then Herod, when he had privily called the wise men, enquired of them diligently what time the star appeared.","8":"And he sent them to Bethlehem, and said, Go and search diligently for the young child; and when ye have found *him*, bring me word again, that I may come and worship him also.","9":"When they had heard the king, they departed; and, lo, the star, which they saw in the east, went before them, till it came and stood over where the young child was.","10":"When they saw the star, they rejoiced with exceeding great joy.","11":"And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh.","12":"And being warned of God in a dream that they should not return to Herod, they departed into their own country another way.","13":"And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him.","14":"When he arose, he took the young child and his mother by night, and departed into Egypt:","15":"And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son.","16":"Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently enquired of the wise men.","17":"Then was fulfilled that which was spoken by Jeremy the prophet, saying,","18":"In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping *for* her children, and would not be comforted, because they are not.","19":"But when Herod was dead, behold, an angel of the Lord appeareth in a dream to Joseph in Egypt,","20":"Saying, Arise, and take the young child and his mother, and go into the land of Israel: for they are dead which sought the young child's life.","21":"And he arose, and took the young child and his mother, and came into the land of Israel.","22":"But when he heard that Archelaus did reign in Judaea in the room of his father Herod, he was afraid to go thither: notwithstanding, being warned of God in a dream, he turned aside into the parts of Galilee:","23":"And he came and dwelt in a city called Nazareth: that it might be fulfilled which was spoken by the prophets, He shall be called a Nazarene."}},"tsk":{"1":[{"kopje":"Jezus","refs":["Matt 1:25","Luk 2:4-7"]},{"kopje":"Bethlehem","refs":["Matt 2:5","Micha 5:1","Luk 2:11","Luk 2:15","Joh 7:42"]},{"kopje":"Herodes","refs":["Matt 2:3","Matt 2:19","Gen 49:10","Dan 9:24","Dan 9:25","Hagg 2:7-10"]},{"kopje":"uit het Oosten","refs":["Gen 10:30","Gen 25:6","1 Kon 4:30","Job 1:3","Ps 72:9-12","Jes 11:10","Jes 60:1-22"]}],"2":[{"kopje":"geboren","refs":["Matt 21:5","Ps 2:6","Jes 9:5","Jes 9:6","Jes 32:1","Jes 32:2","Jer 23:5","Zach 9:9","Luk 2:11","Luk 19:38","Luk 23:3","Luk 23:38","Joh 1:50","Joh 12:13","Joh 18:37","Joh 19:12-15","Joh 19:19"]},{"kopje":"Zijn","refs":["Num 24:17","Jes 60:3","Luk 1:78","Luk 1:79","Openb 22:16"]},{"kopje":"aanbidden","refs":["Matt 2:10","Matt 2:11","Ps 45:12","Joh 5:23","Joh 9:38","Joh 20:28","Hebr 1:6"]}],"3":[{"kopje":"hij","refs":["Matt 8:29","Matt 23:37","1 Kon 18:17","1 Kon 18:18","Joh 11:47","Joh 11:48","Hand 4:2","Hand 4:24-27","Hand 5:24-28","Hand 16:20","Hand 16:21","Hand 17:6","Hand 17:7"]}],"4":[{"kopje":"de overpriesters","refs":["Matt 21:15","Matt 21:23","Matt 26:3","Matt 26:47","Matt 27:1","1 Kron 24:4-19","2 Kron 36:14","Ezra 10:5","Neh 12:7","Ps 2:2","Joh 7:32","Joh 18:3"]},{"kopje":"Schriftgeleerden","refs":["Matt 7:29","Matt 13:52","2 Kron 34:13","2 Kron 34:15","Ezra 7:6","Ezra 7:11","Ezra 7:12","Jer 8:8","Mark 8:31","Luk 20:19","Luk 23:10","Joh 8:3","Hand 4:5","Hand 6:12","Hand 23:9"]},{"kopje":"vroeg hun","refs":["Mal 2:7","Joh 3:10"]}],"6":[{"kopje":"U","refs":["Matt 2:1","Micha 5:1","Joh 7:42"]},{"kopje":"de Leidsman","refs":["Matt 28:18","Gen 49:10","Num 24:19","1 Kron 5:2","Ps 2:1-6","Jes 9:5","Jes 9:6","Ef 1:22","Kol 1:18","Openb 2:27","Openb 11:15"]},{"kopje":"weiden","refs":["Ps 78:71","Ps 78:72","Jes 40:11","Jer 23:4-6","Ezech 34:23-25","Ezech 37:24-26"]}],"8":[{"kopje":"Ga erheen","refs":["1 Sam 23:22","1 Sam 23:23","2 Sam 17:14","1 Kon 19:2","Job 5:12","Job 5:13","Ps 33:10","Ps 33:11","Spr 21: v\" data-code=\"G1093\">land</span> of <span class=\"wl wl-kjv\" data-code=\"G2474\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> they are <span class=\"wl wl-kjv\" data-code=\"G2348\">dead</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> <span class=\"wl wl-kjv\" data-code=\"G2212\">sought</span> the young <span class=\"wl wl-kjv\" data-code=\"G3813\">child's</span> life.","21":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G1453\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"G3880\">took</span> the young <span class=\"wl wl-kjv\" data-code=\"G3813\">child</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3384\">mother,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2064\">came</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the <span class=\"wl wl-kjv\" data-code=\"G1093\">land</span> of Israel.","22":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> when he <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> <span class=\"wl wl-kjv\" data-code=\"G745\">Archelaus</span> did <span class=\"wl wl-kjv\" data-code=\"G936\">reign</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">in</span> <span class=\"wl wl-kjv\" data-code=\"G2449\">Judaea</span> in the <span class=\"wl wl-kjv\" data-code=\"G473\">room</span> of <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3962\">father</span> <span class=\"wl wl-kjv\" data-code=\"G2264\">Herod,</span> he was <span class=\"wl wl-kjv\" data-code=\"G5399\">afraid</span> to <span class=\"wl wl-kjv\" data-code=\"G565\">go</span> <span class=\"wl wl-kjv\" data-code=\"G1563\">thither:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">notwithstanding,</span> being warned of <span class=\"wl wl-kjv\" data-code=\"G5537\">God</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">in</span> a <span class=\"wl wl-kjv\" data-code=\"G3677\">dream,</span> he turned <span class=\"wl wl-kjv\" data-code=\"G402\">aside</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the <span class=\"wl wl-kjv\" data-code=\"G3313\">parts</span> of Galilee:","23":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G2064\">came</span> and <span class=\"wl wl-kjv\" data-code=\"G2730\">dwelt</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">in</span> a <span class=\"wl wl-kjv\" data-code=\"G4172\">city</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">called</span> <span class=\"wl wl-kjv\" data-code=\"G3478\">Nazareth:</span> <span class=\"wl wl-kjv\" data-code=\"G3704\">that</span> it might be <span class=\"wl wl-kjv\" data-code=\"G4137\">fulfilled</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> was <span class=\"wl wl-kjv\" data-code=\"G4483\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G4396\">prophets,</span> He shall be <span class=\"wl wl-kjv\" data-code=\"G2564\">called</span> a Nazarene."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in Judea","tekst":"Dit wordt hier bij gedaan, omdat er nog een ander Bethlehem was, gelegen in den stam van Zebulon, of neder-Galilea. Zie Jos 19:15 ."},{"catchword":"Heródes","tekst":"Deze was Herodus de Grote, toegenaamd Ascalonita, een Idumeër, de eerste vreemde koning."},{"catchword":"wijzen","tekst":"Grieks: magi. Zo werden bij de Perzen en Meden genaamd de geleerden in allerlei wetenschappen, en voornamelijk in den loop des hemels. Die wel bij hen in groot aanzien waren; maar dat zij koningen zouden geweest zijn, is niet gelooflijk, gelijk hunne benamingen en al de omstandigheden uitwijzen."},{"catchword":"oosten","tekst":"Deze worden gezegd van het oosten gekomen te zijn, omdat deze landen oostwaarts van Judea gelegen waren."}],"4":[{"catchword":"overpriesters","tekst":"Deze waren de hoofden van de ordeningen der priesters, uit Eleazars en Ithamars geslacht, en waren vier en twintig in getal, 1Ch 24:4 , en 2Ch 36:14 , van welken alleen de hogepriester het opperhoofd was."},{"catchword":"schriftgeleerden des volks,","tekst":"Anders, wetgeleerden, gelijk blijkt uit de vergelijking Mat 22:25 met Mar 12:28 . Hun ambt was de Schriften van Mozes en der profeten het volk uit te leggen. Zie Ezra 7:6 en Mat 13:52 . Uit dezen en de overpriesters tezamen bestond de hoogste kerkelijke vergadering der Joden."},{"catchword":"vraagde","tekst":"Dat is, vernam."}],"6":[{"catchword":"geenszins","tekst":"Het woord geenszins staat bij Mic 5:1 niet, maar wordt uit de zin daarbij gedaan. Want hoewel Bethlehem in grootte onder de kleinste steden was, nochthans was het niet het minste in waarde en achting, omdat David daaruit was gesproten, Joh 7:42 , en Christus daaruit zou voortkomen. En daarom lezen sommigen in den grondtekst bij Mic zijt gij de minste? Doch zie hiervan breder de aantekening op Mic 5:1 ."},{"catchword":"vorsten","tekst":"Dat is, oversten over duizend, Mic 5:1 ."},{"catchword":"mijn volk Israël weiden zal","tekst":"Dat is, de gemeente der gelovigen, welke Hij met zijn Woord en Geest regeren zal, als een hemels koning. Zie Rom 9:6 , en Gal 6:16 ."}],"9":[{"catchword":"ging hun voor","tekst":"Hieruit blijkt dat zij geen gewone ster des hemels geweest is, maar een bijzonder geschapen licht, gelijk de vuurkolom was, die de kinderen Israëls door de woestijn leidde."}],"11":[{"catchword":"vonden","tekst":"Anders, zagen."},{"catchword":"goud en wierook en mirre","tekst":"Dit waren de kostelijkste dingen, die in hun land gevonden werden."}],"15":[{"catchword":"Uit Egypte","tekst":"Hoewel deze plaats, Hos 11:1 , van de verlossong des volks Israëls uit Egypte ook verstaan wordt, nochtans moest hetzelve mede in Christus, als het hoofd van dit volk vervuld worden."}],"16":[{"catchword":"bedrogen","tekst":"Grieks: bespot; namelijk naar zijn mening. Want eigenlijk hebben de wijzen hem noch bedrogen noch bespot."},{"catchword":"omgebracht al de kinderen","tekst":"Deze schrikkelijke kindermoord wordt ook door Macrobio, een heidens schrijver, verhaald, Saturnal.lib.2, cap.4."}],"17":[{"catchword":"door den profeet","tekst":"Sommige Griekse boeken hebben hier ook deze woorden: van den Heere."}],"18":[{"catchword":"in Rama","tekst":"Zie hiervan de uitlegging Jer 31:15 ."},{"catchword":"Rachel","tekst":"Dewijl Rachel daaromtrent begraven was, Gen 35:19 , zo worden alhier door haar verstaan de moeders van Bethlehem en daaromtrent."}],"20":[{"catchword":"de ziel","tekst":"Dat is, leven. Zie Exo 4:19 , dat is, die naar zijn leven stonden om dat te benemen. Anderszins wordt deze wijze van spreken ook in het goede genomen, Pro 29:10 ."}],"23":[{"catchword":"dat Hij Nazarener zal geheten worden","tekst":"Dit ziet of op de plaats Jdg 13:5 , Jdg 13:7 , waar Simson als een voorbeeld van Christus gezegd wordt: Hij zal een nazireër, dat is verloofde Gods, zijn; of, hetwelk het waarschijnlijkst is, Isa 11:1 , en Isa 60:21 , waar Christus netzer, dat is, een spruit genaamd wordt, van welk woord de stad Nazareth haar naam heeft. God heeft gewild dat Christus, bij gelegenheid van deze zijn woonplaats Nazarenus zou genaamd worden, als een spruit, die uit zijn plaats voor zijn Vader opwast, Isa 53:2 ; Jer 23:5 , en Isa 33:15 ; Zec 6:12 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when Jesus was born at Bethlehem [lying] in Judea, [This is added, because there was yet another Bethlehem, lying in Tribe of Zabulon, or lower Galilee. See Josh.19.15] in the days of Herod the King. [This was the great, firnamed the Ascalonite, an Idumean, the first King that was a foreiner.] Bhold, [certain] Wise men [Gr. Magi so the Persians and Medes called all those that were Learned in all manner of Sciences, and especially of the couple of the course of the Heavens: who were indeed in the great esteem among them; but that they were Kings is not credible, like as the names given them, and all circumstances do make manifest] from the East [These are said to have come from the East, because those Lands were situate East &acirc;&euro;&ldquo; wards from Juda] came to Jerusalem."}],"2":[{"catchword":null,"tekst":"Saying, where is (new) born King of the Jews? For we have seen his staree in the East, and are come to worship him."}],"3":[{"catchword":null,"tekst":"Now Kingg Herod having hheard [this] was troubles, and all Jerusalem with him."}],"4":[{"catchword":null,"tekst":"And hhaving gathered togethr all the chief Priest [Those were the heads of the Orders of the Priests, of the race of Eleazar and Ithamar, and were twenty four in numbre, 1 Chhron. 24.4. and 2 Chron. 36. 14. of all which the high Priest was the supream] and scribes of the people, [Otherwise Lawyers, as appears by compsring Mat.22. 35. with Mark 12. 28. The office of these was to expound the writings of Moses and the Prophets, to the people. See Ezra 7.6. and Mat 13. 52. Of these and chief Priests together consisted the Supream Ecclesiastical assembly of the Jews] he asked of them [i.e. informed himself ] where the Christ should be born."}],"5":[{"catchword":null,"tekst":"And they said unto him, At Bethelehem [situate] in Judea. For so it is written by the Prophet;"}],"6":[{"catchword":null,"tekst":"And [thou] Bethlehem, thou Land of Juda, art in no wise the least [The word is no wise is not in Micah 5.1. but is added thereto from the sense, for howsoever Bethelem in respect of begners was amongst the least Cities, notwithstanding it was not the least in worth and esteem because David sprang rom thence, Joh 7:42. and Christ was to come out it. And therefore some read in the Original Text of Micah, Art thou the least? but concerning this see more at large the Annotation on Mocah 5.1.] among the Princes of Juda, [i.e. Rules over thousands, Micah 5.1.] for out of thee shall come forth the Leader, which shall feed my people Israel. [i.e. The company of the faithfull; which he shall rule with his Word and Spirit, as an Heavenly King. See Rom 9:6. and Gal. 6.16.]"}],"7":[{"catchword":null,"tekst":"Then Herod privity called the wise men, and enquired diligently of them the time when the star had appeared?"}],"8":[{"catchword":null,"tekst":"And sending them to Bethlehhem, said, Go your ways, and search diligently after that young childe, and when ye shall have found it, bring me word thereof, that i may also come, and worship the same."}],"9":[{"catchword":null,"tekst":"And they having heard the King, went their ways, and behold, the starre which they had seen in the East, went before them, [from hence it appears, that it was no ordinary Starre of the Heaven; but a Light peculiarly created, like as was the fiery pillars, which led the children of Israel through the wilderness] till that it came and stood over [the place] where the young child was."}],"10":[{"catchword":null,"tekst":"Now when they saw the Starre, they rejoice with very great joy."}],"11":[{"catchword":null,"tekst":"And being come into the house, they sound the young childe [Otherwise, they saw] with Mary his Mother and falling they worshipped the same. And having opened their treasures, they brought unto him gifts; Gold, and Frankincense, and Myrrhe. [Thse were the most preciuos thing that were found in their Country."}],"12":[{"catchword":null,"tekst":"And being warned by divine revalation in a dream, thhat they should not return to Herod, they departed again towards their (own) land by another way."}],"13":[{"catchword":null,"tekst":"Now when they were departed; Behold, the Angel of the Lord appereth unto Joseph in a dream, saying , Arise, and take to thee that young child and his mother, and flee into Egypt, and thou there , until i shall tell, thee. For Herod will seek the young child, to kill the same."}],"14":[{"catchword":null,"tekst":"Then he being risen up, took the young and his mother to him in the night, and departed (into) Egypt."}],"15":[{"catchword":null,"tekst":"And was there until the death of Herod, that that might he fulfilled which was spoken of thhe LORD by the Prophet, saying; Out of Egypt have called my Son [Although this place, Hos 11. 12. is also understood of the deliverance of the people of Israel out of Egypt; yet must the same likewise be fulfilled in Christ as the head of this people.]"}],"16":[{"catchword":null,"tekst":"When Herod saw that he was deceived by the Wise men[Gr. illuded; namely, according to his thinking; for properly the wise men did neither deceive nor illude him] then was he very wroth, and having sent forth [some] he slew all the children [This searful massacre of insants, is also related by Macrobius an Heathen Writer. Saturn. lib.2.cap.4.] which were within Bethlehem, and in all boarders of the same, from two years [old] and under, according to the time which he had accurately enquired of the Wise men."}],"17":[{"catchword":null,"tekst":"Then was fulfilled that which is spoken by the Prophet Jeremy, [Some Greek Copies have here also these words, of the Lord.] saying;"}],"18":[{"catchword":null,"tekst":"A voice was heard in Rama, [see the exposition hereof, Jer 31. 15] lamentation, weeping, and much groaning : Rachel weeping of her children, [seeing Rachel was buried thereabout] and would not be comforted, because they are not."}],"19":[{"catchword":null,"tekst":"Now when Herod was dead, Behold, the Angel of the Lord appeareth to Joseph in a dream in Egypt,"}],"20":[{"catchword":null,"tekst":"Saying, Arise, take the young child and his Mother thee, and go into the land of Israel; for they are dead, who sought the young childs soul. [that is, life See Exod 4.19. that is to say, which lay in wait for his life to take it way. Otherwise this manner of speaking is also taken in a good sense, Prov 29. verse 10.]"}],"21":[{"catchword":null,"tekst":"Then be bring risen up, took unto him the young child and his Mother, and come into the Land of Israel"}],"22":[{"catchword":null,"tekst":"But when he heard tha Archelous was King in Judea, in the room of his Father Herod; he was afraid to go thither. But being warned revelation in a dream; he went into the parts of Galilee."}],"23":[{"catchword":null,"tekst":"And being come [thither] he made his habitantion in the City of called Nazareth; that it might be fulfilled which was spoken by the Prophet; that he shall be called a Nazarene. [This hath repsect either to the place, Judge 13.5,7. where is said of Sampson as a type of Christ, he shall be Nazarite, that is to say, dedicated to God; Or which is mostly likely, to Isa. 11.1. and chap. 60.21. where Christ is called Natze, which that to say, a branch; from which word the City Nazareth hath name. It was Gods will that by occasion of his dwelling place, Christ should be called a Nazarene, as a branch that grows up before his father out of his place, Isa. 53.2. Jer 23.9 chap 33. 15. Zach 6.12.]"}]}}};

  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

function bijbeluitlegHtml(n) {

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

function toggle(n) {

document.addEventListener('click', e => {

  const noot = e.target.closest('.noot');
  if (noot) {

  }

    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');

  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat

// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}

    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
