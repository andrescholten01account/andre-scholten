annes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen.","2":"En vijf van hen waren wijs, en vijf waren dwaas.","3":"Zij die dwaas *waren*, namen hun lampen mee, maar namen geen olie met zich mee.","4":"Maar de wijzen namen olie in hun vaten, met hun lampen.","5":"Toen de bruidegom uitbleef, werden zij allemaal slaperig, en vielen in slaap.","6":"En te middernacht kwam er een geroep: Zie, de bruidegom komt, ga hem tegemoet!","7":"Toen stonden al die maagden op, en maakten hun lampen in orde.","8":"En de dwazen zeiden tegen de wijzen: Geef ons van uw olie, want onze lampen gaan uit.","9":"Maar de wijzen antwoordden: *Nee*, anders is er misschien voor ons en voor u niet genoeg; ga liever naar de verkopers, en koop voor uzelf.","10":"Toen zij weggingen om te kopen, kwam de bruidegom; en zij die klaar *waren*, gingen met hem naar binnen, naar de bruiloft, en de deur werd gesloten.","11":"Daarna kwamen ook de andere maagden, en zeiden: Heer, heer, doe ons open!","12":"Maar hij antwoordde: Voorwaar, Ik zeg u: Ik ken u niet.","13":"Waak dan; want u weet de dag niet, en ook het uur niet, waarop de Zoon des mensen komen zal.","14":"Want *het is* net als bij een mens, die naar het buitenland reisde, zijn dienstknechten riep, en hun zijn bezittingen toevertrouwde.","15":"En aan de één gaf hij vijf talenten, en aan de ander twee, en aan de derde één, ieder naar zijn vermogen, en hij vertrok meteen.","16":"Hij nu die de vijf talenten ontvangen had, ging op weg, en handelde daarmee, en verdiende er andere vijf talenten bij.","17":"Evenzo won ook hij die de twee *ontvangen had*, ook andere twee.","18":"Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.","19":"En na lange tijd kwam de heer van die dienstknechten, en hield afrekening met hen.","20":"En hij die de vijf talenten ontvangen had, kwam, en bracht hem andere vijf talenten, en zei: Heer, vijf talenten hebt u mij gegeven; zie, andere vijf talenten heb ik daarbij gewonnen.","21":"En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.","22":"En hij die de twee talenten ontvangen had, kwam ook, en zei: Heer, twee talenten hebt u mij gegeven; zie, twee andere talenten heb ik daarbij gewonnen.","23":"Zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht, over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.","24":"Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt;","25":"En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe.","26":"Maar zijn heer antwoordde en zei tegen hem: U slechte en luie dienstknecht! U wist dat ik maai waar ik niet gezaaid heb, en vandaar verzamel waar ik niet gestrooid heb.","27":"Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben.","28":"Neem hem dan het talent af, en geef het aan hem die de tien talenten heeft.","29":"Want ieder die heeft, aan hem zal gegeven worden, en hij zal overvloed hebben; maar van hem die niet heeft, van hem zal genomen worden ook wat hij heeft.","30":"En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.","31":"En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid.","32":"En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.","33":"En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan *Zijn* linkerhand.","34":"Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand *zijn*: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld.","35":"Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven.","36":"*Ik was* naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.","37":"Dan zullen de rechtvaardigen Hem antwoorden: Heere! Wanneer hebben wij U hongerig gezien, en te eten gegeven, of dorstig, en te drinken gegeven?","38":"En wanneer hebben wij U een vreemdeling gezien, en een onderkomen gegeven, of naakt en gekleed?","39":"En wanneer hebben wij U ziek gezien, of in de gevangenis, en zijn bij U gekomen?","40":"En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.","41":"Dan zal Hij ook zeggen tegen hen die aan de linkerhand *zijn*: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.","42":"Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven;","43":"Ik was een vreemdeling; en u hebt Mij geen onderkomen gegeven; naakt, en u hebt Mij niet gekleed; ziek, en in de gevangenis, en u hebt Mij niet bezocht.","44":"Dan zullen ook zij Hem antwoorden: Heere, wanneer hebben wij U hongerig gezien, of dorstig, of een vreemdeling, of naakt, of ziek, of in de gevangenis, en hebben U niet gediend?","45":"Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan.","46":"En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven."},"SV":{"1":"Alsdan zal het Koninkrijk der hemelen gelijk zijn aan tien maagden, welke haar lampen namen, en gingen uit, den bruidegom tegemoet.","2":"En vijf van haar waren wijzen, en vijf waren dwazen.","3":"Die dwaas *waren*, haar lampen nemende, namen geen olie met zich.","4":"Maar de wijzen namen olie in haar vaten, met haar lampen.","5":"Als nu de bruidegom vertoefde, werden zij allen sluimerig, en vielen in slaap.","6":"En ter middernacht geschiedde een geroep: Ziet, de bruidegom komt, gaat uit hem tegemoet!","7":"Toen stonden al die maagden op, en bereidden haar lampen.","8":"En de dwazen zeiden tot de wijzen: Geeft ons van uw olie; want onze lampen gaan uit.","9":"Doch de wijzen antwoordden, zeggende: *Geenszins*, opdat er misschien voor ons en voor u niet genoeg zij; maar gaat liever tot de verkopers, en koopt voor uzelven.","10":"Als zij nu heengingen om te kopen, kwam de bruidegom; en die gereed *waren*, gingen met hem in tot de bruiloft, en de deur werd gesloten.","11":"Daarna kwamen ook de andere maagden, zeggende: Heer, heer, doe ons open!","12":"En hij, antwoordende, zeide: Voorwaar zeg ik u: Ik ken u niet.","13":"Zo waakt dan; want gij weet den dag niet, noch de ure, in dewelke de Zoon des mensen komen zal.","14":"Want *het* *is* gelijk een mens, die buiten 's lands reizende, zijn dienstknechten riep, en gaf hun zijn goederen over.","15":"En den ene gaf hij vijf talenten, en den ander twee, en den derden een, een iegelijk naar zijn vermogen, en verreisde terstond.","16":"Die nu de vijf talenten ontvangen had, ging heen, en handelde daarmede, en won andere vijf talenten.","17":"Desgelijks ook die de twee *ontvangen* *had*, die won ook andere twee.","18":"Maar die het ene ontvangen had, ging heen en groef in de aarde, en verborg het geld zijns heren.","19":"En na een langen tijd kwam de heer van dezelve dienstknechten, en hield rekening met hen.","20":"En die de vijf talenten ontvangen had, kwam, en bracht tot hem andere vijf talenten, zeggende: Heer, vijf talenten hebt gij mij gegeven; zie, andere vijf talenten heb ik boven dezelve gewonnen.","21":"En zijn heer zeide tot hem: Wel, gij goede en getrouwe dienstknecht! over weinig zijt gij getrouw geweest; over veel zal ik u zetten; ga in, in de vreugde uws heeren.","22":"En die de twee talenten ontvangen had, kwam ook tot hem, en zeide: Heer, twee talenten hebt gij mij gegeven; zie, twee andere talenten heb ik boven dezelve gewonnen.","23":"Zijn heer zeide tot hem: Wel, gij goede en getrouwe dienstknecht, over weinig zijt gij getrouw geweest; over veel zal ik u zetten; ga in, in de vreugde uws heeren.","24":"Maar die het ene talent ontvangen had, kwam ook en zeide: Heer! ik kende u, dat gij een hard mens zijt, maaiende, waar gij niet gezaaid hebt, en vergaderende van daar, *waar* gij niet gestrooid hebt;","25":"En bevreesd zijnde, ben ik heengegaan, en heb uw talent verborgen in de aarde; zie, gij hebt het uwe.","26":"Maar zijn heer, antwoordende, zeide tot hem: Gij boze en luie dienstknecht! gij wist, dat ik maai, waar ik niet gezaaid heb, en van daar vergader, waar ik niet gestrooid heb.","27":"Zo moest gij dan mijn geld den wisselaren gedaan hebben, en ik, komende, zou het mijne wedergenomen hebben met woeker.","28":"Neemt dan van hem het talent weg, en geeft het dengene, die de tien talenten heeft.","29":"Want een iegelijk die heeft, *dien* zal gegeven worden, en hij zal overvloedig hebben; maar van dengene, die niet heeft, van dien zal genomen worden, ook dat hij heeft.","30":"En werpt den onnutten dienstknecht uit in de buitenste duisternis; daar zal wening zijn en knersing der tanden.","31":"En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en al de heilige engelen met Hem, dan zal Hij zitten op den troon Zijner heerlijkheid.","32":"En voor Hem zullen al de volken vergaderd worden, en Hij zal ze van elkander scheiden, gelijk de herder de schapen van de bokken scheidt.","33":"En Hij zal de schapen tot Zijn rechter *hand* zetten, maar de bokken tot *Zijn* linker *hand*.","34":"Alsdan zal de Koning zeggen tot degenen, die tot Zijn rechter *hand* *zijn*: Komt, gij gezegenden Mijns Vaders! beërft dat Koninkrijk, hetwelk u bereid is van de grondlegging der wereld.","35":"Want Ik ben hongerig geweest, en gij hebt Mij te eten gegeven; Ik ben dorstig geweest, en gij hebt Mij te drinken gegeven; Ik was een vreemdeling, en gij hebt Mij geherbergd.","36":"*Ik* *was* naakt, en gij hebt Mij gekleed; Ik ben krank geweest, en gij hebt Mij bezocht; Ik was in de gevangenis, en gij zijt tot Mij gekomen.","37":"Dan zullen de rechtvaardigen Hem antwoorden, zeggende: Heere! wanneer hebben wij U hongerig gezien, en gespijzigd, of dorstig, en te drinken gegeven?","38":"En wanneer hebben wij U een vreemdeling gezien, en geherbergd, of naakt en gekleed?","39":"En wanneer hebben wij U krank gezien, of in de gevangenis, en zijn tot U gekomen?","40":"En de Koning zal antwoorden en tot hen zeggen: Voorwaar zeg Ik u: Voor zoveel gij *dit* een van deze Mijn minste broeders gedaan hebt, zo hebt gij *dat* Mij gedaan.","41":"Dan zal Hij zeggen ook tot degenen, die ter linker *hand* *zijn*: Gaat weg van Mij, gij vervloekten, in het eeuwige vuur, hetwelk den duivel en zijn engelen bereid is.","42":"Want Ik ben hongerig geweest, en gij hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en gij hebt Mij niet te drinken gegeven;","43":"Ik was een vreemdeling; en gij hebt Mij niet geherbergd; naakt, en gij hebt Mij niet gekleed; krank, en in de gevangenis, en gij hebt Mij niet bezocht.","44":"Dan zullen ook dezen Hem antwoorden, zeggende: Heere, wanneer hebben wij U hongerig gezien, of dorstig, of een vreemdeling, of naakt, of krank, of in de gevangenis, en hebben U niet gediend?","45":"Dan zal Hij hun antwoorden en zeggen: Voorwaar zeg Ik u: Voor zoveel gij *dit* een van deze minsten niet gedaan hebt, zo hebt gij het Mij ook niet gedaan.","46":"En dezen zullen gaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven."},"KJV":{"1":"Then shall the kingdom of heaven be likened unto ten virgins, which took their lamps, and went forth to meet the bridegroom.","2":"And five of them were wise, and five *were* foolish.","3":"They that *were* foolish took their lamps, and took no oil with them:","4":"But the wise took oil in their vessels with their lamps.","5":"While the bridegroom tarried, they all slumbered and slept.","6":"And at midnight there was a cry made, Behold, the bridegroom cometh; go ye out to meet him.","7":"Then all those virgins arose, and trimmed their lamps.","8":"And the foolish said unto the wise, Give us of your oil; for our lamps are gone out.","9":"But the wise answered, saying, *Not so*; lest there be not enough for us and you: but go ye rather to them that sell, and buy for yourselves.","10":"And while they went to buy, the bridegroom came; and they that were ready went in with him to the marriage: and the door was shut.","11":"Afterward came also the other virgins, saying, Lord, Lord, open to us.","12":"But he answered and said, Verily I say unto you, I know you not.","13":"Watch therefore, for ye know neither the day nor the hour wherein the Son of man cometh.","14":"For *the kingdom of heaven is* as a man travelling into a far country, *who* called his own servants, and delivered unto them his goods.","15":"And unto one he gave five talents, to another two, and to another one; to every man according to his several ability; and straightway took his journey.","16":"Then he that had received the five talents went and traded with the same, and made *them* other five talents.","17":"And likewise he that *had received* two, he also gained other two.","18":"But he that had received one went and digged in the earth, and hid his lord's money.","19":"After a long time the lord of those servants cometh, and reckoneth with them.","20":"And so he that had received five talents came and brought other five talents, saying, Lord, thou deliveredst unto me five talents: behold, I have gained beside them five talents more.","21":"His lord said unto him, Well done, *thou* good and faithful servant: thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord.","22":"He also that had received two talents came and said, Lord, thou deliveredst unto me two talents: behold, I have gained two other talents beside them.","23":"His lord said unto him, Well done, good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord.","24":"Then he which had received the one talent came and said, Lord, I knew thee that thou art an hard man, reaping where thou hast not sown, and gathering where thou hast not strawed:","25":"And I was afraid, and went and hid thy talent in the earth: lo, *there* thou hast *that is* thine.","26":"His lord answered and said unto him, *Thou* wicked and slothful servant, thou knewest that I reap where I sowed not, and gather where I have not strawed:","27":"Thou oughtest therefore to have put my money to the exchangers, and *then* at my coming I should have received mine own with usury.","28":"Take therefore the talent from him, and give *it* unto him which hath ten talents.","29":"For unto every one that hath shall be given, and he shall have abundance: but from him that hath not shall be taken away even that which he hath.","30":"And cast ye the unprofitable servant into outer darkness: there shall be weeping and gnashing of teeth.","31":"When the Son of man shall come in his glory, and all the holy angels with him, then shall he sit upon the throne of his glory:","32":"And before him shall be gathered all nations: and he shall separate them one from another, as a shepherd divideth *his* sheep from the goats:","33":"And he shall set the sheep on his right hand, but the goats on the left.","34":"Then shall the King say unto them on his right hand, Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world:","35":"For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:","36":"Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came unto me.","37":"Then shall the righteous answer him, saying, Lord, when saw we thee an hungred, and fed *thee*? or thirsty, and gave *thee* drink?","38":"When saw we thee a stranger, and took *thee* in? or naked, and clothed","39":"Or when saw we thee sick, or in prison, and came unto thee?","40":"And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done *it* unto one of the least of these my brethren, ye have done *it* unto me.","41":"Then shall he say also unto them on the left hand, Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels:","42":"For I was an hungred, and ye gave me no meat: I was thirsty, and ye gave me no drink:","43":"I was a stranger, and ye took me not in: naked, and ye clothed me not: sick, and in prison, and ye visited me not.","44":"Then shall they also answer him, saying, Lord, when saw we thee an hungred, or athirst, or a stranger, or naked, or sick, or in prison, and did not minister unto thee?","45":"Then shall he answer them, saying, Verily I say unto you, Inasmuch as ye did *it* not to one of the least of these, ye did *it* not to me.","46":"And these shall go away into everlasting punishment: but the righteous into life eternal."}},"tsk":{"1":[{"kopje":"Toen","refs":["Matt 24:42-51","Luk 21:34-36"]},{"kopje":"het Koninkrijk","refs":["Matt 3:2","Matt 13:24","Matt 13:31","Matt 13:38","Matt 13:44","Matt 13:45","Matt 13:47","Matt 20:1","Matt 22:2","Dan 2:44"]},{"kopje":"tien","refs":["Ps 45:15","Hoogl 1:3","Hoogl 5:8","Hoogl 5:16","Hoogl 6:1","Hoogl 6:8","Hoogl 6:9","1 Kor 11:2","Openb 14:4"]},{"kopje":"die","refs":["Matt 5:16","Luk 12:35","Luk 12:36","Fil 2:15","Fil 2:16"]},{"kopje":"gingen","refs":["2 Tim 4:8","Tit 2:13","2 Petr 1:13-15","2 Petr 3:12","2 Petr 3:13"]},{"kopje":"de bruidegom","refs":["Matt 9:15","Matt 22:2","Ps 45:10-12","Jes 54:5","Jes 62:4","Jes 62:5","Mark 2:19","Mark 2:20","Luk 5:34","Luk 5:35","Joh 3:29","2 Kor 11:2","Ef 5:25-33","Openb 19:7","Openb 21:2","Openb 21:9"]}],"3":[{"kopje":"dwaas","refs":["Matt 23:25","Matt 23:26","Jes 48:1","Jes 48:2","Jes 58:2","Ezech 33:3","2 Tim 3:5","Hebr 12:15","Openb 3:1","Openb 3:15","Openb 3:16"]}],"4":[{"kopje":"olie","refs":["Ps 45:8","Zach 4:2","Zach 4:3","Joh 1:15","Joh 1:16","Joh 3:34","Rom 8:9","2 Kor 1:22","Gal 5:22","Gal 5:23","1 Joh 2:20","1 Joh 2:27","Judas 1:19"]}],"5":[{"kopje":"de","refs":["Matt 25:19","Matt 24:48","Hab 2:3","Luk 12:45","Luk 20:9","Hebr 10:36","Hebr 10 e ons open","tekst":"Hetwelk, dewijl het dan te laat zal zijn, zo wordt daarmede alleen te kennen gegeven dat wij ons intijds moeten voorzien; Joh 9:4 ."}],"12":[{"catchword":"Ik ken u niet","tekst":"Namelijk voor de mijnen. Zie Mat 7:23 ."}],"14":[{"catchword":"gelijk een mens,","tekst":"Door deze gelijkenis worden wij vermaand de gaven, die God ons verleent, elk naar de mate derzelve waar te nemen en te besteden tot de meeste stichting van anderen, met belofte van genadige beloning hier en hiernamaals voor degenen die zulks doen, en bedreiging van zware straffen tegen degenen, die zulks nalaten. Zie Joh 15:2 ; 1Co 12:5-7 ."}],"15":[{"catchword":"vermogen,","tekst":"Dat is, begrip of bekwaamheid, namelijk om te handelen en winst te doen. Waaruit niet kan besloten worden dat een mens uit zichzelven kracht of bekwaamheid heeft om de gaven Gods recht te gebruiken. Want in de Schrift wordt doorgaans getuigd dat al onze bekwaamheid uit God is. Zie Joh 15:5 ; 1Co 15:10 ; 2Co 3:5 ."}],"16":[{"catchword":"won andere vijf talenten","tekst":"Grieks, maakte."}],"19":[{"catchword":"na een langen tijd","tekst":"Grieks, na veel tijds."}],"20":[{"catchword":"boven dezelve gewonnen","tekst":"Of, met, door."}],"21":[{"catchword":"Wel, gij goede en getrouwe dienstknecht,","tekst":"Of, het is wel, het gaat wel, gij hebt wel gedaan."},{"catchword":"ga in, in de vreugde uws heren","tekst":"Dat is, ga in met uwen heer ter plaatse waar hij zijne vreugde en heeflijkheid heeft. Zie Joh 17:24 ; Luk 22:30 ."}],"24":[{"catchword":"hard mens zijt,","tekst":"Of, straf."},{"catchword":"Maaiende, waar gij niet gezaaid hebt,","tekst":"Dit was een spreekwoord, waarmede beschreven werd een mens, die alles op het scherpste en nauwste tot zijn voordeel trekt."}],"26":[{"catchword":"Gij boze en luie dienstknecht,","tekst":"Dat is, niet de vrees van mijne hardigheid, maar uw eigen boosheid en luiheid is daarvan de oorzaak."}],"27":[{"catchword":"gedaan hebben,","tekst":"Grieks, geworpen, of gelegd; namelijk in de wisselbank."},{"catchword":"woeker","tekst":"Grieks, tokos; waardoor allerlei vrucht of winst van het gebruik des gelds wordt betekend, welke soms in het goede, soms in het kwade genomen wordt, naardat de winst redelijk of onredelijk is. Zie voorts Luk 19:23 ."}],"29":[{"catchword":"een iegelijk","tekst":"Grieks, allen."},{"catchword":"die heeft,","tekst":"Dat is, die zijne gaven, die hij heeft, tewerkstelt en wel besteedt."},{"catchword":"die niet heeft,","tekst":"Dat is, die zijne gaven niet gebruikt of ledig laat liggen, alsof hij ze niet had gehad."}],"30":[{"catchword":"buitenste duisternis;","tekst":"Zie Mat 8:12 ."}],"31":[{"catchword":"op den troon","tekst":"Dat is, op zijn heerlijken troon, welke in de wolken zal opgericht worden. Zie Mat 24:30 ; Rev 1:7 ."}],"32":[{"catchword":"vergaderd worden,","tekst":"Namelijk door den dienst der engelen. Zie Mat 13:41 ."}],"33":[{"catchword":"rechter -hand zetten,","tekst":"Of, rechterzijde; alzo ook in het volgende."}],"34":[{"catchword":"de Koning","tekst":"Namelijk Christus, die in vs.31, de Zoon des mensen genaamd wordt, en nu hier Koning, omdat Hij alsdan wezen zal in de volle heerschappij van zijn rijk."},{"catchword":"gezegenden mijns Vaders,","tekst":"Van deze zegening zie Eph 1:3-5 ."},{"catchword":"u bereid is","tekst":"Namelijk van God, door en naar zijn eeuwige verkiezing, Eph 1:4 ."}],"35":[{"catchword":"geherbergd;","tekst":"Grieks, medegeleid, of medegenomen; namelijk om te herbergen."}],"36":[{"catchword":"bezocht;","tekst":"Of, hebt opzicht over mij genomen."},{"catchword":"Ik was in de gevangenis","tekst":"Onder deze verhaalde werken der liefde worden alle andere vruchten des geloofs verstaan, die hier voortgebracht worden, niet als verdienende oorzaken der zaligheid, maar als openbare getuigenissen en tekenen van hun geloof, die om de verdiensten van Christus uit genade zullen beloond worden, om daarmede te bewijzen de rechtvaardigheid van zijn vonnis in dit oordeel voor de gehele wereld, gelijk blijkt uit vs.34, waar als de eerst oorzaak hunner zaligheid gesteld wordt de zegen des Vaders, en de zaligheid een erfdeel wordt genaamd, en deze gezegd wordt hun bereid of toegeschikt te zijn eer de grond der wereld gelegd was; Eph 1:4 ."}],"40":[{"catchword":"zo hebt gij","tekst":"Dat is, dat zal ik achten alsof zulks mijzelven gedaan ware. Act 9:4 ."}],"41":[{"catchword":"vervloekten,","tekst":"Dat is om deze uwe zonden naar Gods rechtvaardig oordeel de straf des eeuwigen vloeks onderworpen."},{"catchword":"duivel en zijnen engelen","tekst":"Zo noemt Hij het hoofd der boze geesten, die hier ook zijne engelen genoemd worden, omdat de duivel hen gebruikt tot zijne dienstboden, gelijk Christus zijn goede engelen; Rev 12:7 ."}],"45":[{"catchword":"deze minsten niet gedaan hebt,","tekst":"Namelijk die hier tot mijne rechterhand staan."}],"46":[{"catchword":"pijn;","tekst":"Of, straf, pijniging, gelijk 1Jo 4:18 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then [Namely, when the Lord Christ shall come to Judgement; of which was spoken in the end of the former chapter] shall the Kingdom of Heaven be like to ten Virgins, which took their lamps, and went out to meet the Bridegroom. [This similitude is taken from that which was usual in the weddings of those times, which were kept by night , in which the Bridegroom with his company, was certain Virgins setched in and conducted to the Bride with burning Lamps or Torches. see likewise, Luke 12. verse 35. of the like custome. And by coming of the bridegroom is understood the coming of Christ to Judgement, verse 13. By Virgins all that bear the name of Christians. By the wise, all upright, true believers. By the foolish, all that are Christians from the teeth outwrd, and hypocrites. By the Lamps, the profession of the Christian faith: By the oil and light, the true faith, which is essectual by love. By midnight, the unexpected time of Christ coming. And by the wedding, the joys of eternal life]"}],"2":[{" // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
