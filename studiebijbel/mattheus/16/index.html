 toen Zijn discipelen naar de overkant gekomen waren, waren zij vergeten brood mee te nemen.","6":"En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.","7":"En zij overlegden bij zichzelf en zeiden: *Het is* omdat wij geen brood meegenomen hebben.","8":"En Jezus, die dit wist, zei tegen hen: Wat overlegt u bij uzelf, kleingelovigen, dat u geen brood meegenomen hebt?","9":"Begrijpt u nog niet, en herinnert u zich niet de vijf broden van de vijfduizend *mannen*, en hoeveel korven u opnam?","10":"Ook niet de zeven broden van de vierduizend *mannen*, en hoeveel manden u opnam?","11":"Hoe komt het dat u niet begrijpt dat Ik u niet over brood gesproken heb, toen Ik zei dat u zich moest wachten voor de zuurdesem van de Farizeeën en Sadduceeën?","12":"Toen begrepen zij dat Hij niet gezegd had dat zij zich moesten wachten voor de zuurdesem van het brood, maar voor de leer van de Farizeeën en Sadduceeën.","13":"Toen Jezus nu gekomen was in de omgeving van Caesarea Filippi, vroeg Hij Zijn discipelen: Wie zeggen de mensen dat Ik, de Zoon des mensen, ben?","14":"En zij zeiden: Sommigen: Johannes de Doper; en anderen: Elia; en weer anderen: Jeremia of één van de profeten.","15":"Hij zei tegen hen: Maar u, wie zegt u dat Ik ben?","16":"En Simon Petrus antwoordde en zei: U bent de Christus, de Zoon van de levende God.","17":"En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.","18":"En Ik zeg u ook, dat u Petrus bent, en op deze petra[1] zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.","19":"En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.","20":"Toen verbood Hij Zijn discipelen dat zij iemand zouden zeggen dat Hij Jezus, de Christus, was.","21":"Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.","22":"En Petrus nam Hem apart, en begon Hem te bestraffen en zei: Heere, dat zij verre van U! Dit zal U geenszins gebeuren.","23":"Maar Hij keerde Zich om en zei tegen Petrus: Ga weg, achter Mij, satan! U bent Mij een struikelblok, want u bedenkt niet de dingen die van God zijn, maar die van de mensen zijn.","24":"Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen.","25":"Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.","26":"Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?","27":"Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.","28":"Voorwaar, Ik zeg u: Er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij de Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk."},"SV":{"1":"En de Farizeën en Sadduceën tot Hem gekomen zijnde, en *Hem* verzoekende, begeerden van Hem, dat Hij hun een teken uit den hemel zou tonen.","2":"Maar Hij antwoordde, en zeide tot hen: Als het avond geworden is, zegt gij: Schoon weder; want de hemel is rood;","3":"En des morgens: Heden onweder; want de hemel is droevig rood. Gij geveinsden! het aanschijn des hemels weet gij wel te onderscheiden, en kunt gij de tekenen der tijden niet *onderscheiden*?","4":"Het boos en overspelig geslacht verzoekt een teken; en hun zal geen teken gegeven worden, dan het teken van Jona, den profeet. En hen verlatende, ging Hij weg.","5":"En als Zijn discipelen op de andere zijde gekomen waren, hadden zij vergeten broden *mede* te nemen.","6":"En Jezus zeide tot hen: Ziet toe, en wacht u van den zuurdesem der Farizeën en Sadduceën.","7":"En zij overlegden bij zichzelven, zeggende: *Het* *is* omdat wij geen broden *mede* genomen hebben.","8":"En Jezus, *dat* wetende, zeide tot hen: Wat overlegt gij bij uzelven, gij kleingelovigen! dat gij geen broden *mede* genomen hebt?","9":"Verstaat gij nog niet? en gedenkt gij niet aan de vijf broden der vijf duizend *mannen*; en hoevele korven gij opnaamt?","10":"Noch aan de zeven broden der vier duizend *mannen*, en hoevele manden gij opnaamt?","11":"Hoe verstaat gij niet, dat Ik u van geen brood gesproken heb, *als* *Ik* *zeide*, dat gij u wachten zoudt van den zuurdesem der Farizeën en Sadduceën.","12":"Toen verstonden zij, dat Hij niet gezegd had, dat zij zich wachten zouden van den zuurdesem des broods, maar van de leer der Farizeën en Sadduceën.","13":"Als nu Jezus gekomen was in de delen van Cesarea Filippi, vraagde Hij Zijn discipelen, zeggende: Wie zeggen de mensen, dat Ik, de Zoon des mensen, ben?","14":"En zij zeiden: Sommigen: Johannes de Doper; en anderen: Elias; en anderen: Jeremia of een van de profeten.","15":"Hij zeide tot hen: Maar gij, wie zegt gij, dat Ik ben?","16":"En Simon Petrus, antwoordende, zeide: Gij zijt de Christus, de Zoon des levenden Gods.","17":"En Jezus, antwoordende, zeide tot hem: Zalig zijt gij, Simon, Bar-jona! want vlees en bloed heeft u *dat* niet geopenbaard, maar Mijn Vader, Die in de hemelen is.","18":"En Ik zeg u ook, dat gij zijt Petrus, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten der hel zullen dezelve niet overweldigen.","19":"En Ik zal u geven de sleutelen van het Koninkrijk der hemelen; en zo wat gij zult binden op de aarde, zal in de hemelen gebonden zijn; en zo wat gij ontbinden zult op de aarde, zal in de hemelen ontbonden zijn.","20":"Toen verbood Hij Zijn discipelen, dat zij iemand zeggen zouden, dat Hij was Jezus, de Christus.","21":"Van toen aan begon Jezus Zijn discipelen te vertonen, dat Hij moest heengaan naar Jeruzalem, en veel lijden van de ouderlingen, en overpriesteren, en Schriftgeleerden, en gedood worden, en ten derden dage opgewekt worden.","22":"En Petrus, Hem tot zich genomen hebbende, begon Hem te bestraffen, zeggende: Heere, *wees* U genadig! dit zal U geenszins geschieden.","23":"Maar Hij, Zich omkerende, zeide tot Petrus: Ga weg achter Mij, satanas! gij zijt Mij een aanstoot, want gij verzint niet de dingen, die Gods zijn, maar die der mensen zijn.","24":"Toen zeide Jezus tot Zijn discipelen: Zo iemand achter Mij wil komen, die verloochene zichzelven, en neme zijn kruis op, en volge Mij.","25":"Want zo wie zijn leven zal willen behouden, die zal hetzelve verliezen; maar zo wie zijn leven verliezen zal, om Mijnentwil, die zal hetzelve vinden.","26":"Want wat baat het een mens, zo hij de gehele wereld gewint, en lijdt schade zijner ziel? Of wat zal een mens geven, tot lossing van zijn ziel?","27":"Want de Zoon des mensen zal komen in de heerlijkheid Zijns Vaders, met Zijn engelen, en alsdan zal Hij een iegelijk vergelden naar zijn doen.","28":"Voorwaar zeg Ik u: Er zijn sommigen van die hier staan, dewelke den dood niet smaken zullen, totdat zij den Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk."},"KJV":{"1":"The Pharisees also with the Sadducees came, and tempting desired him that he would shew them a sign from heaven.","2":"He answered and said unto them, When it is evening, ye say, *It will be* fair weather: for the sky is red.","3":"And in the morning, *It will be* foul weather to day: for the sky is red and lowring. O *ye* hypocrites, ye can discern the face of the sky; but can ye not *discern* the signs of the times?","4":"A wicked and adulterous generation seeketh after a sign; and there shall no sign be given unto it, but the sign of the prophet Jonas. And he left them, and departed.","5":"And when his disciples were come to the other side, they had forgotten to take bread.","6":"Then Jesus said unto them, Take heed and beware of the leaven of the Pharisees and of the Sadducees.","7":"And they reasoned among themselves, saying, *It is* because we have taken no bread.","8":"*Which* when Jesus perceived, he said unto them, O ye of little faith, why reason ye among yourselves, because ye have brought no bread?","9":"Do ye not yet understand, neither remember the five loaves of the five thousand, and how many baskets ye took up?","10":"Neither the seven loaves of the four thousand, and how many baskets ye took up?","11":"How is it that ye do not understand that I spake *it* not to you concerning bread, that ye should beware of the leaven of the Pharisees and of the Sadducees?","12":"Then understood they how that he bade *them* not beware of the leaven of bread, but of the doctrine of the Pharisees and of the Sadducees.","13":"When Jesus came into the coasts of Caesarea Philippi, he asked his disciples, saying, Whom do men say that I the Son of man am?","14":"And they said, Some *say that thou art* John the Baptist: some, Elias; and others, Jeremias, or one of the prophets.","15":"He saith unto them, But whom say ye that I am?","16":"And Simon Peter answered and said, Thou art the Christ, the Son of the living God.","17":"And Jesus answered and said unto him, Blessed art thou, Simon Barjona: for flesh and blood hath not revealed *it* unto thee, but my Father which is in heaven.","18":"And I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it.","19":"And I will give unto thee the keys of the kingdom of heaven: and whatsoever thou shalt bind on earth shall be bound in heaven: and whatsoever thou shalt loose on earth shall be loosed in heaven.","20":"Then charged he his disciples that they should tell no man that he was Jesus the Christ.","21":"From that time forth began Jesus to shew unto his disciples, how that he must go unto Jerusalem, and suffer many things of the elders and chief priests and scribes, and be killed, and be raised again the third day.","22":"Then Peter took him, and began to rebuke him, saying, Be it far from thee, Lord: this shall not be unto thee.","23":"But he turned, and said unto Peter, Get thee behind me, Satan: thou art an offence unto me: for thou savourest not the things that be of God, but those that be of men.","24":"Then said Jesus unto his disciples, If any *man* will come after me, let him deny himself, and take up his cross, and follow me.","25":"For whosoever will save his life shall lose it: and whosoever will lose his life for my sake shall find it.","26":"For what is a man profited, if he shall gain the whole world, and lose his own soul? or what shall a man give in exchange for his soul?","27":"For the Son of man shall come in the glory of his Father with his angels; and then he shall reward every man according to his works.","28":"Verily I say unto you, There be some standing here, which shall not taste of death, till they see the Son of man coming in his kingdom."}},"tsk":{"1":[{"kopje":"Farizeeën","refs":["Matt 5:20","Matt 9:11","Matt 12:14","Matt 15:1","Matt 22:15","Matt 22:34","Matt 23:2","Matt 27:62"]},{"kopje":"Sadduceeën","refs":["Matt 16:6","Matt 16:11","Matt 3:7","Matt 3:8","Matt 22:23","Mark 12:18","Luk 20:27","Hand 4:1","Hand 5:17","Hand 23:6-8"]},{"kopje":"verzoeken","refs":["Matt 19:3","Matt 22:18","Matt 22:35","Mark 10:2","Mark 12:15","Luk 10:25","Luk 11:16","Luk 11:53","Luk 11:54","Luk 20:23","Joh 8:6"]},{"kopje":"een teken","refs":["Matt 12:38","Matt 12:39","Mark 8:11-13","Luk 11:16","Luk 11:29","Luk 11:30","Luk 12:54-56","Joh 6:30","Joh 6:31","1 Kor 1:22"]}],"2":[{"kopje":"Als","refs":["Luk 12:54-56"]}],"3":[{"kopje":"Huichelaars","refs":["Matt 7:5","Matt 15:7","Matt 22:18","Matt 23:13","Luk 11:44","Luk 13:15"]},{"kopje":"de tekenen","refs":["Matt 4:23","Matt 11:5","1 Kron 12:32"]}],"4":[{"kopje":"slechte","refs":["Matt 12:39","Matt 12:40","Mark 8:12","Mark 8:38","Hand (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const popupCache = {};

  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
