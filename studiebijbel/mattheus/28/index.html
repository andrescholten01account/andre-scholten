pdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Ezech 1:4-14": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur. En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels.", "Openb 11:11": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.", "Hand 9:13": "En Ananias antwoordde: Heere, ik heb van velen gehoord over deze man, hoeveel kwaad hij Uw heiligen in Jeruzalem heeft aangedaan;", "Luk 24:22-24": "Maar ook enkele vrouwen uit ons midden hebben ons verbaasd, die vroeg in de morgenstond bij het graf geweest zijn; en toen zij Zijn lichaam niet vonden, kwamen zij en zeiden dat zij ook een verschijning van engelen gezien hadden, die zeggen dat Hij leeft. En sommigen van hen die met ons zijn, gingen naar het graf, en vonden het zo als de vrouwen ook gezegd hadden; maar Hem zagen zij niet.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Matt 16:4": "Het slechte en overspelige geslacht verlangt een teken; en het zal geen teken gegeven worden, dan het teken van Jona, de profeet. En Hij verliet hen en ging weg.", "Ezech 37:9": "En Hij zei tot mij: Profeteer tot de geest; profeteer, mensenkind! En zeg tot de geest: Zo zegt de Heere HEERE: Geest! Kom van de vier winden, en blaas in deze gedoden, zodat zij levend worden.", "Mark 16:7": "Maar ga heen, zeg tegen Zijn discipelen, en Petrus, dat Hij u voorgaat naar Galilea; daar zult u Hem zien, zoals Hij u gezegd heeft.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "1 Kor 1:16": "Overigens heb ik ook het huisgezin van Stefanus gedoopt; verder weet ik niet, of ik iemand anders gedoopt heb.", "Hand 10:19": "En terwijl Petrus over dat gezicht nadacht, zei de Geest tegen hem: Zie, drie mannen zoeken u;", "Mal 4:3": "En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Ef 6:23": "Vrede zij de broeders, en liefde met geloof, van God de Vader, en de Heere Jezus Christus.", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Klaagl 3:57": "Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!", "Ex 6:11": "Doch Mozes sprak voor de HEERE en zei: Zie, de kinderen van Israël hebben naar mij niet geluisterd; hoe zou Farao dan naar mij luisteren? Bovendien ben ik onbesneden van lippen.", "Hand 7:30": "En toen er veertig jaar verstreken waren, verscheen hem in de woestijn van de berg Sinaï een engel van de Heere, in een vlam van vuur uit een doornstruik.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Mark 10:34": "en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Rom 6:5": "Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Matt 4:23": "En Jezus trok rond door heel Galilea, en Hij onderwees in hun synagogen en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Hand 1:4": "En toen Hij met hen vergaderd was, beval Hij hun dat zij niet uit Jeruzalem weg zouden gaan, maar de belofte van de Vader verwachten, die u, zei Hij, van Mij gehoord hebt.", "Matt 11:15": "Wie oren heeft om te horen, die hoort.", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Ps 91:9-12": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek; U zal geen kwaad overkomen, en geen plaag zal uw tent naderen. Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Matt 10:1": "Toen Hij Zijn twaalf discipelen bij Zich geroepen had, gaf Hij hun macht over de onreine geesten, om ze uit te werpen, en om alle ziekte en alle kwaal te genezen.", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Joh 17:7": "Nu weten zij, dat alles wat U Mij gegeven hebt, van U is.", "2 Tess 3:6-12": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft. Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn;", "1 Joh 5:6": "Deze is het Die gekomen is door water en bloed, namelijk Jezus, de Christus; niet door het water alleen, maar door het water en het bloed. En de Geest is het Die getuigt, dat de Geest de waarheid is.", "1 Kor 15:12-23": "Als nu van Christus gepredikt wordt dat Hij uit de doden opgewekt is, hoe zeggen sommigen onder u dat er geen opstanding van de doden is? En als er geen opstanding van de doden is, dan is Christus ook niet opgewekt. En als Christus niet opgewekt is, dan is onze prediking zonder inhoud, en is ook uw geloof zonder inhoud.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "2 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God, onze Vader, en de Heere Jezus Christus:", "Luk 21:27": "En dan zullen zij de Zoon des mensen zien komen in een wolk, met grote kracht en heerlijkheid.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Matt 14:33": "Zij die in het schip waren, kwamen en aanbaden Hem, en zeiden: Werkelijk, U bent Gods Zoon!", "Matt 25:31-34": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid. En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt. En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ezech 1:14": "De levende wezens nu liepen en keerden weer als de gedaante van een bliksemflits.", "1 Petr 1:25": "maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "1 Kor 1:8": "Die God u ook zal bevestigen tot het einde toe, om onberispelijk te zijn in de dag van onze Heere Jezus Christus.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Ef 2:3-5": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen; Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "Jes 11:6-9": "En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven. De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os. En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Luk 22:69": "van nu af aan zal de Zoon des mensen gezeten zijn aan de rechterhand van de kracht van God.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Joh 3:31": "Wie van boven komt, is boven allen; wie uit de aarde is voortgekomen, die is uit de aarde en spreekt uit de aarde. Wie uit de hemel komt, is boven allen.", "1 Tess 2:4-8": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige! Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Luk 1:30": "En de engel zei tegen haar: Wees niet bang, Maria, want u hebt genade bij God gevonden.", "Mark 13:27": "En dan zal Hij Zijn engelen uitzenden, en Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het uiterste van de aarde, tot het uiterste van de hemel.", "Ps 45:18": "Ik zal van uw Naam doen gedenken van elk geslacht tot geslacht; daarom zullen de volken U loven eeuwig en altijd.", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "Joh 15:9-13": "Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde. Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde. Deze dingen heb Ik tot u gesproken, zodat Mijn blijdschap in u blijft, en uw blijdschap vervuld wordt.", "Hand 10:40": "Deze heeft God opgewekt op de derde dag, en gegeven dat Hij openbaar zou worden;", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Jes 51:11": "Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.", "Hand 26:14-18": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan. En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt. Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen;", "2 Petr 1:4": "Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Jes 65:17-25": "Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen. Maar wees u vrolijk, en verheug u tot in eeuwigheid over hetgeen Ik schep; want zie, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid. En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Hand 12:7": "En zie, een engel van de Heere stond daar, en een licht scheen in de cel, en hij sloeg Petrus op de zij, wekte hem en zei: Sta snel op. En zijn kettingen vielen van zijn handen af.", "Matt 17:1": "En na zes dagen nam Jezus Petrus, Jakobus en Johannes zijn broer met Zich mee, en bracht hen alleen op een hoge berg.", "Ezech 37:14": "En Ik zal Mijn Geest in u geven, en u zult leven, en Ik zal u in uw land zetten; en u zult weten dat Ik, de HEERE, dit gesproken en gedaan heb, spreekt de HEERE.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Matt 8:16": "En toen het avond geworden was, brachten zij velen die door de duivel bezeten waren naar Hem toe, en Hij dreef de boze geesten uit met het woord, en Hij genas allen die ziek waren;", "Job 38:25": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen?", "Dan 10:5": "En ik hief mijn ogen op, en zag, en zie, er was een Man met linnen bekleed, en Zijn middel was omgord met fijn goud uit Ufaz.", "Gal 3:27": "Want zovelen als u in Christus gedoopt zijt, hebt u Christus aangedaan.", "Openb 22:21": "De genade van onze Heere Jezus Christus zij met u allen. Amen.", "Hand 8:12": "Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk van God en van de Naam van Jezus Christus verkondigde, werden zij gedoopt, zowel mannen als vrouwen.", "1 Kor 9:10": "Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden.", "Gen 1:2": "De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren.", "Luk 10:24": "Want Ik zeg u dat veel profeten en koningen verlangd hebben te zien wat u ziet, en het niet gezien hebben; en te horen wat u hoort, en het niet gehoord hebben.", "Richt 13:6": "Toen kwam deze vrouw binnen en sprak tegen haar man en zei: Er kwam een Man van God naar mij toe, Wiens gezicht was als het gezicht van een Engel van God, zeer ontzagwekkend; en ik heb Hem niet gevraagd waar Hij vandaan was, en Zijn naam heeft Hij mij niet bekendgemaakt.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Hand 9:18": "En meteen vielen er van zijn ogen dingen af als schellen, en hij kon meteen weer zien; en hij stond op en werd gedoopt.", "Jes 8:13": "De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.", "Luk 22:20": "Net zo ook de drinkbeker na de maaltijd, en zei: Deze drinkbeker is het nieuwe testament in Mijn bloed, dat voor u vergoten wordt.", "1 Petr 5:4": "En als de opperste Herder verschenen zal zijn, zult u de onverwelkbare kroon van de heerlijkheid ontvangen.", "Joh 18:36": "Jezus antwoordde: Mijn Koninkrijk is niet van deze wereld. Als Mijn Koninkrijk van deze wereld was, zouden Mijn dienaren gestreden hebben, zodat Ik niet aan de Joden overgeleverd zou zijn; maar nu is Mijn Koninkrijk niet van hier.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Job 4:14": "kwam er schrik en beving over mij, en het deed al mijn beenderen sidderen.", "Hand 11:18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "1 Tess 5:8-10": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid. Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Mark 16:5": "En toen zij het graf ingingen, zagen zij een jongeman, zittend aan de rechterzijde, gekleed in een wit, lang kleed, en zij werden zeer verbaasd.", "1 Tim 1:4": "Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Openb 18:1": "En hierna zag ik een andere engel uit de hemel neerdalen, die grote macht had, en de aarde werd verlicht door zijn heerlijkheid.", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "Openb 5:11-14": "En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend; die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging. En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Ezra 5:6": "Afschrift van het brief dat Thathnai, de landvoogd aan deze kant van de rivier, met Sthar-boznai, en zijn metgezellen, de Afarsechaieten, die aan deze kant van de rivier waren, aan de koning Darius zond.", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Luk 2:10-14": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal; namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David. En dit zal voor u het teken zijn: u zult het Kindje vinden in doeken gewonden, en liggend in de kribbe.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Matt 10:28-31": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel. Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld.", "1 Kor 13:10-12": "Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden. Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt. Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Openb 20:4": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar.", "Ex 5:23": "Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "Rom 10:8-13": "Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken; namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden. Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid.", "Luk 4:33": "En in de synagoge was een man die een geest van een onreine duivel had; en hij riep uit met luide stem,", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "1 Tess 2:20": "Want u bent onze heerlijkheid en blijdschap.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Ezech 6:11": "Zo zegt de Heere HEERE: Sla met uw hand, en stamp met uw voet, en zeg: Ach, over alle gruwelen van de slechte daden van het huis van Israël; want zij zullen door het zwaard, door de honger en door de pest vallen.", "Matt 16:28": "Voorwaar, Ik zeg u: Er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij de Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "2 Kon 13:18": "Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Gal 3:3": "Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Luk 5:32": "Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Luk 11:20-22": "Maar als Ik door de vinger van God de demonen uitdrijf, dan is het Koninkrijk van God tot u gekomen. Wanneer een sterke, gewapende man zijn eigen woning bewaakt, dan is alles wat hij heeft in vrede. Maar als iemand die sterker is dan hij, hem overvalt en hem overwint, dan neemt die zijn hele wapenrusting weg, waarop hij vertrouwde, en deelt zijn buit uit.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Rom 1:15": "Zo ben ik, voor zover het aan mij ligt, gereed om ook aan u die in Rome bent het Evangelie te verkondigen.", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Ezra 5:3": "In die tijd kwam Thathnai, de landvoogd aan deze kant van de rivier, en Sthar-boznai, en hun metgezellen, naar hen toe en zeiden aldus tegen hen: Wie heeft u bevel gegeven dit huis te bouwen en deze muur te voltooien?", "2 Kor 13:11": "Verder, broeders, wees blij, wordt volmaakt, wees getroost, wees eensgezind, leef in vrede; en de God van de liefde en van de vrede zal met u zijn.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Rom 11:1-36": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin. God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt: Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "1 Petr 1:9": "en zo het einddoel van uw geloof bereikt, namelijk de zaligheid van de zielen.", "Ef 3:8-11": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen, en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus; opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Jer 39:17": "Maar Ik zal u op die dag redden, spreekt de HEERE; en u zult niet overgegeven worden in de hand van de mannen, voor wier aangezicht u vreest.", "1 Tim 2:4": "Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen.", "Luk 9:48": "en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Ps 72:11": "Ja, alle koningen zullen zich voor hem neerbuigen, alle heidenvolken zullen hem dienen.", "Jes 51:4": "Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken.", "Matt 27:63": "en zeiden: Heer, wij herinneren ons dat deze verleider, toen Hij nog leefde, gezegd heeft: Na drie dagen zal Ik opstaan.", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Gal 2:16": "maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "Ef 4:11-17": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars; Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus; Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Hand 6:11": "Toen zetten zij mannen op die zeiden: Wij hebben hem lasterlijke woorden horen spreken tegen Mozes en God.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Jes 55:1-13": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "1 Petr 4:12-14": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam; maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen. Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Dan 6:2-4": "En het leek Darius goed dat hij over het koninkrijk honderdtwintig stadhouders aanstelde, die over het hele koninkrijk zouden zijn; en boven hen drie vorsten, van wie Daniël de eerste zou zijn, aan wie die stadhouders zelf rekenschap moesten geven, zodat de koning geen schade leed. Toen overtrof deze Daniël die vorsten en die stadhouders, omdat er een voortreffelijke geest in hem was; en de koning dacht hem aan te stellen over het hele koninkrijk.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Matt 13:39-42": "En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld. De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "1 Kor 15:48-57": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen. En zoals wij het beeld van de aardse gedragen hebben, zo zullen wij ook het beeld van de Hemelse dragen. Maar dit zeg ik, broeders, dat vlees en bloed het Koninkrijk van God niet kunnen beërven, en de vergankelijkheid beërft de onvergankelijkheid niet.", "Matt 18:10-13": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is. Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken?", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Mark 3:11": "En de onreine geesten vielen voor Hem neer wanneer zij Hem zagen, en riepen: U bent de Zoon van God!", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Gal 1:2": "en al de broeders die bij mij zijn, aan de Gemeenten van Galatië:", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "2 Kor 10:8": "Want al zou ik nog wat overvloediger roemen over onze macht, die de Heere ons gegeven heeft tot opbouw, en niet tot uw neerwerping, dan zal ik daarover niet beschaamd worden;", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Ef 5:25": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Mal 3:12": "En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Matt 19:13-15": "Toen werden kinderen tot Hem gebracht, opdat Hij de handen op hen zou leggen en bidden; en de discipelen bestraften hen. Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen. En toen Hij hun de handen opgelegd had, vertrok Hij vandaar.", "Dan 8:23": "Maar op het laatst van hun koninkrijk, wanneer de afvalligen het toppunt bereikt hebben, zal er een koning opstaan, hard van gezicht, en bedreven in het uitleggen van raadsels;", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "2 Tess 1:10": "Wanneer Hij gekomen zal zijn om verheerlijkt te worden in Zijn heiligen, en bewonderd te worden in allen die geloven (omdat onze getuigenis onder u geloofd is) op die dag.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Pred 9:8": "Laat uw kleren altijd wit zijn, en laat op uw hoofd geen olie ontbreken.", "Fil 2:9-11": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is; Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn. En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Gal 4:4": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet;", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "Job 5:6-27": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Jes 9:4": "Toen de hele strijd van hen die streden, met gedruis gebeurde, en de kleren in het bloed gewenteld en verbrand werden, tot een voedsel van het vuur.", "1 Kor 10:2": "en zij zijn allen in Mozes gedoopt in de wolk en in de zee;", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Luk 1:28": "En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Ef 3:16": "opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Matt 11:3": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?", "Jes 11:1-13": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Luk 5:8": "Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "Ps 48:7": "Beving greep hen daar aan, smart als van een barende vrouw.", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Luk 18:30": "die niet veel meer terug zal ontvangen in deze tijd, en in de toekomende eeuw het eeuwige leven.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Joh 5:23": "opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Ps 89:37": "Zijn zaad zal in eeuwigheid zijn, en zijn troon zal voor Mij zijn als de zon.", "Luk 24:6-8": "Hij is hier niet, maar Hij is opgestaan. Denk eraan hoe Hij tot u gesproken heeft, toen Hij nog in Galilea was, en zei: De Zoon des mensen moet overgeleverd worden in de handen van zondige mensen, en gekruisigd worden, en op de derde dag weer opstaan. En zij herinnerden zich Zijn woorden.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Fil 1:2": "Genade zij u en vrede van God, onze Vader, en van de Heere Jezus Christus.", "1 Kor 9:16": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig!", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Matt 8:23-27": "En toen Hij in het schip gegaan was, volgden Zijn discipelen Hem. En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep. En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "Luk 11:10": "Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden.", "1 Kor 10:1": "Ik wil niet, broeders, dat u onwetend bent van het volgende: onze vaders waren allen onder de wolk, en gingen allen door de zee heen;", "Matt 27:11": "En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Rom 15:3": "Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Hebr 9:15": "En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood daartussen gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.", "Matt 27:61": "En daar waren Maria Magdalena en de andere Maria, die tegenover het graf zaten.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Hand 10:48": "En hij beval dat zij gedoopt zouden worden in de Naam van de Heere. Toen vroegen zij hem of hij enige dagen bij hen wilde blijven.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Kol 1:26-29": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid; Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "Hand 5:9": "En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Jona 1:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar; want hun boosheid is opgeklommen voor Mijn aangezicht.", "Openb 1:14-16": "En Zijn hoofd en haar was wit, als witte wol, als sneeuw; en Zijn ogen als een vlam van het vuur; En Zijn voeten waren als blinkend koper, en gloeiden als in een oven; en Zijn stem als een stem van veel water. En Hij had zeven sterren in Zijn rechterhand; en uit Zijn mond kwam een tweesnijdend scherp zwaard; en Zijn gezicht was als de zon wanneer die schijnt in haar kracht.", "2 Petr 3:2": "Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;", "Zach 6:13": "Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Hand 26:26": "Want de koning weet van deze dingen, tot wie ik ook vrijmoedig spreek; want ik geloof niet dat hem iets van deze dingen verborgen is; want dit is niet in een hoek gebeurd.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Gal 1:16": "om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "1 Tess 4:16-18": "Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn. Zo dan, vertroost elkaar met deze woorden.", "Rom 4:1-25": "Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees? Want als Abraham uit de werken gerechtvaardigd is, dan heeft hij roem, maar niet bij God. Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Jes 25:7": "En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.", "Hand 18:9": "En de Heere zei tegen Paulus door een gezicht in de nacht: Wees niet bevreesd, maar spreek en zwijg niet.", "Ezech 33:6": "Wanneer daarentegen de wachter het zwaard ziet komen, en niet op de bazuin blaast, zodat het volk niet gewaarschuwd wordt; en het zwaard komt en neemt iemand van hen weg, dan is die wel om zijn eigen ongerechtigheid weggenomen, maar zijn bloed zal Ik van de hand van de wachter eisen.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "Luk 23:27": "En een grote menigte van volk en van vrouwen volgde Hem, die ook weenden en Hem beklaagden.", "Ezech 44:23": "En zij zullen Mijn volk onderscheid leren tussen het heilige en het onheilige, en hun het onderscheid bekend maken tussen het onreine en het reine.", "Luk 1:67-79": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Jer 1:7": "Maar de HEERE zei tegen mij: Zeg niet: Ik ben jong; want overal waarheen Ik u zenden zal, zult u gaan, en alles wat Ik u gebieden zal, zult u spreken.", "2 Tim 2:14-16": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Hand 15:11": "Maar wij geloven door de genade van de Heere Jezus Christus zalig te worden, op dezelfde wijze als ook zij.", "Matt 28:8-10": "En zij gingen haastig weg van het graf, met angst en grote blijdschap, en liepen snel weg om het aan Zijn discipelen te vertellen. En terwijl zij heengingen om het aan Zijn discipelen te vertellen, zie, Jezus ontmoette hen en zei: Wees gegroet! En zij kwamen naar Hem toe, grepen Zijn voeten, en aanbaden Hem. Toen zei Jezus tegen hen: Wees niet bang; ga heen, vertel Mijn broeders dat zij naar Galilea moeten gaan, en daar zullen zij Mij zien.", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Luk 2:31": "die U bereid hebt voor het aangezicht van alle volken:", "Ps 69:10": "Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Hand 13:52": "En de discipelen werden vervuld met blijdschap en met de Heilige Geest.", "Micha 4:1-7": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen. En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "2 Kor 4:11": "Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "Ps 22:28": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Luk 7:45": "U hebt Mij geen kus gegeven; maar deze heeft, vanaf het moment dat zij binnenkwam, niet opgehouden Mijn voeten te kussen.", "Luk 22:19": "En Hij nam brood, en toen Hij gedankt had, brak Hij het en gaf het hun, en zei: Dat is Mijn lichaam, dat voor u gegeven wordt; doe dat tot Mijn gedachtenis.", "Joh 20:19": "Toen het dan avond was op die eerste dag van de week, en de deuren gesloten waren waar de discipelen bijeen waren uit vrees voor de Joden, kwam Jezus en stond in hun midden, en zei tegen hen: Vrede zij u!", "Rom 6:9": "Terwijl wij weten dat Christus, opgewekt uit de doden, niet meer sterft; de dood heerst niet meer over Hem.", "Ezech 34:22-31": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee. En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.", "Jes 43:6": "Ik zal zeggen tot het noorden: Geef; en tot het zuiden: Houd niet terug; breng Mijn zonen van verre, en Mijn dochters van het einde der aarde;", "Ps 119:143": "Benauwdheid en angst hebben mij getroffen, doch Uw geboden zijn mijn vermakingen.", "Hand 18:25": "Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes.", "Ps 139:7": "Waar zou ik heengaan voor Uw Geest, en waar zou ik heenvlieden voor Uw aangezicht?", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "1 Kor 10:9": "En laten wij Christus niet beproeven, zoals ook sommigen van hen Hem beproefd hebben, en werden door de slangen omgebracht.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Mark 9:36": "En Hij nam een kind, en zette het in hun midden, en omarmde het met Zijn armen, en zei tegen hen:", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Luk 11:9": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Ef 5:30": "Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "Joh 20:27": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Ps 128:1-6": "Een lied Hammaaloth. Gelukkig is ieder die de HEERE vreest, die in Zijn wegen wandelt. Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel.", "2 Kor 4:8-10": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Openb 1:17": "En toen ik Hem zag, viel ik als dood aan Zijn voeten; en Hij legde Zijn rechterhand op mij, en zei tegen mij: Wees niet bang; Ik ben de Eerste en de Laatste;", "2 Tim 2:23-25": "En verwerp de dwaze en onverstandige vragen, wetend dat zij twisten voortbrengen. En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen; met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "1 Kor 15:47": "De eerste mens is uit de aarde, aards; de tweede Mens is de Heere uit de hemel.", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "Job 38:35": "Kunt u de bliksemen uitlaten, dat zij heengaan, en tot u zeggen: Zie, hier zijn wij?", "Openb 5:5": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.", "1 Tess 3:2": "en wij hebben Timotheüs gezonden, onze broeder en Gods dienaar en onze medearbeider in het Evangelie van Christus, om u te versterken en u te vermanen aangaande uw geloof;", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Joh 10:30-33": "Ik en de Vader zijn één. De Joden dan pakten opnieuw stenen op, om Hem te stenigen. Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Openb 21:24": "En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.", "Mark 3:31-35": "Toen kwamen Zijn broers en Zijn moeder; en terwijl zij buiten stonden, stuurden zij iemand naar Hem, en riepen Hem. En de menigte zat om Hem heen; en zij zeiden tegen Hem: Zie, Uw moeder en Uw broers zijn buiten en zoeken U. En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers?", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Matt 24:27": "Want zoals de bliksem uitgaat vanuit het oosten en schijnt tot het westen, zo zal ook de komst van de Zoon des mensen zijn.", "Mark 9:9": "En toen zij van de berg afkwamen, gebood Hij hun dat zij aan niemand zouden vertellen wat zij gezien hadden, totdat de Zoon des mensen uit de doden zou zijn opgestaan.", "Openb 4:8": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Deut 28:1-13": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Matt 28:5-7": "Maar de engel antwoordde en zei tegen de vrouwen: Wees u niet bang; want ik weet dat u Jezus zoekt, Die gekruisigd was. Hij is hier niet; want Hij is opgestaan, zoals Hij gezegd heeft. Kom hier, kijk naar de plaats waar de Heere gelegen heeft. En ga haastig heen, en zeg tegen Zijn discipelen dat Hij opgestaan is van de doden; en zie, Hij gaat u voor naar Galilea, daar zult u Hem zien. Zie, ik heb het u gezegd.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Mal 3:16-18": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken. En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient. Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Mark 16:14": "Daarna verscheen Hij aan de elf, terwijl zij aanzaten, en verweet hun hun ongeloof en hardheid van hart, omdat zij hen die Hem gezien hadden nadat Hij opgestaan was, niet geloofd hadden.", "Rom 5:17": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "1 Tim 6:1-4": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt. En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen. Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Gen 26:7": "En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Joh 9:31": "En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Openb 6:11": "En aan ieder werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleine tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden worden, zoals ook zij.", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "Ps 145:18-21": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid. Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen. Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Hand 9:3-7": "En terwijl hij reisde, gebeurde het dat hij dicht bij Damaskus kwam, en snel omscheen hem een licht van de hemel; en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij? En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "1 Joh 4:13": "Hieraan herkennen wij dat wij in Hem blijven, en Hij in ons, omdat Hij ons van Zijn Geest gegeven heeft.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Joh 10:17": "Daarom heeft de Vader Mij lief, omdat Ik Mijn leven afleg, opdat Ik het opnieuw neem.", "Joh 21:2": "Er waren samen Simon Petrus, en Thomas, genaamd Didymus, en Nathanaël, die van Kana in Galilea was, en de zonen van Zebedeüs, en twee anderen van Zijn discipelen.", "Hand 13:39": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Rom 8:37-39": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad. Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal, Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "1 Joh 2:3": "En hieraan weten wij, dat wij Hem gekend hebben, als wij Zijn geboden bewaren.", "Luk 9:31": "die in heerlijkheid verschenen en spraken over Zijn heengaan, dat Hij te Jeruzalem zou volbrengen.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Hebr 2:11-18": "Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen, En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen. En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "2 Kor 10:4": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken;", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Joh 20:13": "En zij zeiden tegen haar: Vrouw, waarom huilt u? Zij zei tegen hen: Omdat ze mijn Heere weggenomen hebben, en ik weet niet waar ze Hem hebben neergelegd.", "Rom 16:25": "Hem nu, Die machtig is u te bevestigen, naar mijn Evangelie en de prediking van Jezus Christus, naar de openbaring van het geheimenis dat sinds mensenheugenis verzwegen is geweest;", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Hand 5:30-32": "De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven. En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.", "Spr 1:33": "Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vrees voor het kwaad.", "Mark 16:5-7": "En toen zij het graf ingingen, zagen zij een jongeman, zittend aan de rechterzijde, gekleed in een wit, lang kleed, en zij werden zeer verbaasd. Maar hij zei tegen hen: Wees niet verbaasd; u zoekt Jezus de Nazarener, Die gekruisigd was; Hij is opgestaan; Hij is hier niet; zie de plaats waar zij Hem gelegd hadden. Maar ga heen, zeg tegen Zijn discipelen, en Petrus, dat Hij u voorgaat naar Galilea; daar zult u Hem zien, zoals Hij u gezegd heeft.", "Luk 1:11": "En aan hem verscheen een engel van de Heere, die stond aan de rechterkant van het reukofferaltaar.", "Spr 3:1-10": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Judas 1:21": "Bewaar uzelf in de liefde van God, terwijl u de barmhartigheid van onze Heere Jezus Christus verwacht, tot het eeuwige leven.", "Jes 40:1-3": "Troost, troost Mijn volk, zal uw God zeggen. Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden. Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Joh 12:23": "Maar Jezus antwoordde hun: Het uur is gekomen dat de Zoon des mensen verheerlijkt zal worden.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Hos 6:1-3": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden. Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven. Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Matt 3:16": "En Jezus, toen Hij gedoopt was, kwam meteen op uit het water; en zie, de hemelen werden voor Hem geopend, en Hij zag de Geest van God neerdalen als een duif, en op Hem komen.", "Ps 126:5": "Die met tranen zaaien, zullen met gejuich maaien.", "Luk 17:21": "En men zal niet zeggen: Zie hier, of zie daar, want zie, het Koninkrijk van God is binnen in u.", "Dan 8:25": "En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Hand 24:1": "En vijf dagen daarna kwam de hogepriester Ananias af met de oudsten, en een zekere voorspraak, genaamd Tertullus, die zich meldde bij de stadhouder tegen Paulus.", "Luk 12:32": "Wees niet bang, klein kuddeke, want het is het welbehagen van uw Vader om u het Koninkrijk te geven.", "Hand 16:14": "En een zekere vrouw, met de naam Lydia, een purperverkoopster uit de stad Thyatira, die God diende, hoorde ons; haar hart heeft de Heere geopend, zodat zij acht gaf op wat door Paulus gesproken werd.", "1 Petr 1:23": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God.", "Jer 6:27": "Ik heb u onder Mijn volk gesteld, tot een wachttoren, tot een vesting; opdat u hun weg zou weten en beproeven.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "2 Tim 1:2": "Aan Timotheüs, mijn geliefde zoon: genade, barmhartigheid, vrede zij u van God de Vader, en Christus Jezus, onze Heere.", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "Joh 20:12": "en zag twee engelen in witte kleren zitten, een aan het hoofd en een aan de voeten, waar het lichaam van Jezus gelegen had.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "Hand 8:13": "En Simon geloofde ook zelf, en toen hij gedoopt was, bleef hij voortdurend bij Filippus; en toen hij de tekenen en grote krachten zag die er gebeurden, stond hij versteld.", "Hand 6:13": "en zetten valse getuigen in, die zeiden: Deze man houdt niet op lasterlijke woorden te spreken tegen deze heilige plaats en de wet.", "Hand 5:32": "En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.", "1 Joh 3:24": "En die Zijn geboden bewaart, blijft in Hem, en Hij in hem. En hieraan weten wij dat Hij in ons blijft, namelijk uit de Geest, Die Hij ons gegeven heeft.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Matt 17:2": "En Hij veranderde van gedaante voor hun ogen; Zijn gezicht blonk als de zon, en Zijn kleren werden wit als het licht.", "Hand 16:15": "En toen zij gedoopt was, en haar huis, smeekte zij ons: Als u geoordeeld hebt dat ik de Heere trouw ben, kom dan in mijn huis en blijf daar. En zij drong er sterk op aan.", "Micha 3:11": "Haar hoofden rechtspreken om ge
