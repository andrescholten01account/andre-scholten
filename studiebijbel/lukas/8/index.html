","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde daarna dat Hij van de ene stad en het ene dorp naar het andere reisde, terwijl Hij predikte en het Evangelie van het Koninkrijk van God verkondigde; en de twaalven waren met Hem;","2":"en ook sommige vrouwen die van boze geesten en ziekten genezen waren, namelijk Maria, genaamd Magdalena, uit wie zeven duivels[1] uitgegaan waren;","3":"en Johanna, de vrouw van Chusas, de rentmeester van Herodes, en Susanna, en vele anderen, die Hem dienden met hun bezittingen.","4":"Toen er nu een grote menigte bijeenkwam en zij uit alle steden naar Hem toe kwamen, sprak Hij door een gelijkenis:","5":"Een zaaier ging uit om zijn zaad te zaaien; en terwijl hij zaaide, viel het ene deel langs de weg en werd vertrapt, en de vogels van de hemel aten het op.","6":"En het andere deel viel op een rots, en toen het opgekomen was, verdorde het, omdat het geen vocht had.","7":"En het andere deel viel midden tussen de dorens, en de dorens groeiden mee op en verstikten het.","8":"En het andere deel viel op de goede aarde, en toen het opgekomen was, bracht het honderdvoudig vrucht voort. Toen Hij dit gezegd had, riep Hij: Wie oren heeft om te horen, laat hij horen.","9":"En Zijn discipelen vroegen Hem: Wat betekent deze gelijkenis?","10":"En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.","11":"Dit is nu de gelijkenis: het zaad is het Woord van God.","12":"Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.","13":"En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.","14":"En wat tussen de dorens valt, dat zijn zij die gehoord hebben, en gaandeweg verstikt worden door de zorgen[2] en rijkdom en genietingen van het leven, en geen rijpe vrucht voortbrengen.","15":"En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.","16":"En niemand die een kaars aansteekt, bedekt die met een vat of zet hem onder een bed; maar hij zet hem op een kandelaar, opdat wie binnenkomen het licht kunnen zien.","17":"Want er is niets verborgen dat niet openbaar zal worden, en niets geheim dat niet bekend zal worden en aan het licht zal komen.","18":"Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.","19":"En Zijn moeder en Zijn broers kwamen naar Hem toe, en konden niet bij Hem komen vanwege de menigte.","20":"En het werd Hem gemeld door enigen die zeiden: Uw moeder en Uw broers staan buiten en willen U zien.","21":"Maar Hij antwoordde en zei tegen hen: Mijn moeder en Mijn broers zijn zij die Gods Woord horen en het doen.","22":"En het gebeurde op een van die dagen dat Hij in een schip ging, met Zijn discipelen; en Hij zei tegen hen: Laten wij overvaren naar de andere kant van het meer. En zij staken van wal.","23":"En terwijl zij voeren, viel Hij in slaap; en er stak een stormwind op over het meer, en het schip liep vol water, en zij waren in nood.","24":"En zij gingen naar Hem toe en wekten Hem, en zeiden: Meester, Meester, wij vergaan! En Hij stond op en bestrafte de wind en de golven, en zij hielden op, en het werd stil.","25":"En Hij zei tegen hen: Waar is uw geloof? Maar zij werden bevreesd en verwonderden zich, en zeiden tegen elkaar: Wie is toch Deze, dat Hij ook de winden en het water gebiedt, en zij Hem gehoorzaam zijn?","26":"En zij voeren verder naar het land van de Gadarenen, dat tegenover Galilea ligt.","27":"En toen Hij aan land gegaan was, kwam Hem een man uit de stad tegemoet, die al lange tijd door duivels bezeten was; en hij droeg geen kleren en verbleef niet in een huis, maar in de graven.","28":"Toen hij Jezus zag, schreeuwde hij luid, viel voor Hem neer en zei met luide stem: Wat heb ik met U te maken, Jezus, Zoon van God, de Allerhoogste? Ik bid U dat U mij niet pijnigt!","29":"Want Hij had de onreine geest geboden uit de man weg te gaan; want die had hem vele malen aangegrepen, en hij werd met ketenen en boeien gebonden om bewaakt te worden; maar hij verbrak de boeien en werd door de duivel naar de woestijnen gedreven.","30":"En Jezus vroeg hem: Wat is uw naam? En hij zei: Legio. Want er waren vele duivels in hem gevaren.","31":"En zij smeekten Hem dat Hij hun niet zou gebieden naar de afgrond te gaan.","32":"En daar was een grote kudde zwijnen aan het weiden op de berg; en zij smeekten Hem dat Hij hun zou toestaan daarin te gaan. En Hij stond het hun toe.","33":"En de duivels gingen uit de man weg en voeren in de zwijnen; en de kudde stortte van de steilte af het meer in, en verdronk.","34":"En toen zij die ze weidden zagen wat er gebeurd was, vluchtten zij; en zij gingen heen en meldden het in de stad en op het land.","35":"En zij gingen eropuit om te zien wat er gebeurd was, en kwamen bij Jezus, en vonden de man uit wie de duivels weggegaan waren, zittend aan de voeten van Jezus, gekleed en goed bij zijn verstand; en zij werden bevreesd.","36":"En ook zij die het gezien hadden, vertelden hun hoe de bezetene verlost was.","37":"En de hele menigte uit het omliggende land van de Gadarenen vroeg Hem van hen weg te gaan, want zij waren door grote vrees bevangen. En Hij ging in het schip en keerde terug.","38":"En de man uit wie de duivels weggegaan waren, smeekte Hem bij Hem te mogen blijven. Maar Jezus liet hem van Zich gaan en zei:","39":"Keer terug naar uw huis, en vertel wat voor grote dingen God aan u gedaan heeft. En hij ging heen en verkondigde door de hele stad wat voor grote dingen Jezus aan hem gedaan had.","40":"En het gebeurde, toen Jezus terugkeerde, dat de menigte Hem ontving; want zij waren allen in afwachting van Hem.","41":"En zie, er kwam een man, van wie de naam Jaïrus was, en hij was een leider van de synagoge; en hij viel aan de voeten van Jezus en smeekte Hem naar zijn huis te komen.","42":"Want hij had een enige dochter van ongeveer twaalf jaar, en die lag op sterven. En terwijl Hij erheen ging, verdrongen de menigten Hem.","43":"En een vrouw die twaalf jaar lang bloedvloeiingen gehad had, en die al haar middelen van bestaan[3] aan artsen had uitgegeven, maar door niemand genezen had kunnen worden,","44":"kwam van achteren naar Hem toe en raakte de zoom van Zijn kleed aan; en meteen hield haar bloedvloeiing op.","45":"En Jezus zei: Wie is het die Mij heeft aangeraakt? Toen zij het allen ontkenden, zeiden Petrus en die bij hem waren: Meester, de menigten dringen tegen U aan en verdringen U, en U zegt: Wie is het die Mij aangeraakt heeft?","46":"En Jezus zei: Iemand heeft Mij aangeraakt; want Ik heb gemerkt[4] dat er kracht van Mij uitgegaan is.","47":"Toen de vrouw nu zag dat zij niet onopgemerkt was gebleven, kwam zij bevend, viel voor Hem neer en verklaarde voor heel het volk om welke reden zij Hem aangeraakt had, en hoe zij meteen genezen was.","48":"En Hij zei tegen haar: Dochter, heb goede moed, uw geloof heeft u behouden; ga heen in vrede.","49":"Terwijl Hij nog sprak, kwam er iemand van het huis van de leider van de synagoge, die tegen hem zei: Uw dochter is gestorven; val de Meester niet langer lastig.","50":"Maar toen Jezus dat hoorde, antwoordde Hij hem: Vrees niet, geloof alleen, en zij zal behouden worden.","51":"En toen Hij het huis binnenkwam, liet Hij niemand binnengaan dan Petrus en Jakobus en Johannes, en de vader en de moeder van het kind.","52":"En zij huilden allen en weeklaagden over haar. En Hij zei: Huil niet; zij is niet gestorven, maar zij slaapt.","53":"En zij lachten Hem uit, omdat zij wisten dat zij gestorven was.","54":"Maar toen Hij hen allen naar buiten had gestuurd, greep Hij haar hand en riep: Kind, sta op!","55":"En haar geest keerde terug, en zij stond meteen op; en Hij gebood dat men haar te eten zou geven.","56":"En haar ouders stonden versteld; en Hij beval hun aan niemand te vertellen wat er gebeurd was."},"SV":{"1":"En het geschiedde daarna, dat Hij reisde van de ene stad en vlek tot de andere, predikende en verkondigende het Evangelie van het Koninkrijk Gods; en de twaalven *waren* met Hem;","2":"En sommige vrouwen, die van boze geesten en krankheden genezen waren, *namelijk* Maria, genaamd Magdalena, van welke zeven duivelen uitgegaan waren;","3":"En Johanna, de huisvrouw van Chusas, den rentmeester van Herodes, en Susanna, en vele anderen, die Hem dienden van haar goederen.","4":"Als nu een grote schare bijeenvergaderde, en zij van alle steden tot Hem kwamen, zo zeide Hij door gelijkenis:","5":"Een zaaier ging uit, om zijn zaad te zaaien; en als hij zaaide, viel het ene bij den weg, en werd vertreden, en de vogelen des hemels aten dat op.","6":"En het andere viel op een steenrots, en opgewassen zijnde, is het verdord, omdat het geen vochtigheid had.","7":"En het andere viel in het midden van de doornen, en de doornen mede opwassende, verstikten hetzelve.","8":"En het andere viel op de goede aarde, en opgewassen zijnde, bracht het honderdvoudige vrucht voort. Dit zeggende, riep Hij: Wie oren heeft, om te horen, die hore.","9":"En Zijn discipelen vraagden Hem, zeggende: Wat mag deze gelijkenis wezen?","10":"En Hij zeide: U is het gegeven, de verborgenheden van het Koninkrijk Gods te verstaan; maar tot de anderen *spreek* *Ik* in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.","11":"Dit is nu de gelijkenis: Het zaad is het Woord Gods.","12":"En die bij den weg *bezaaid* *worden*, zijn dezen, die horen; daarna komt de duivel, en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven, en zalig worden.","13":"En die op de steenrots *bezaaid* *worden*, zijn dezen, die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel, die maar voor een tijd geloven, en in den tijd der verzoeking wijken zij af.","14":"En dat in de doornen valt, zijn dezen, die gehoord hebben, en heengaande verstikt worden door de zorgvuldigheden, en rijkdom, en wellusten des levens, en voldragen geen *vrucht*.","15":"En dat in de goede aarde *valt*, zijn dezen, die, het Woord gehoord hebbende, hetzelve in een eerlijk en goed hart bewaren, en in volstandigheid vruchten voortbrengen.","16":"En niemand, die een kaars ontsteekt, bedekt dezelve met een vat, of zet ze onder een bed; maar zet ze op een kandelaar, opdat degenen, die inkomen, het licht zien mogen.","17":"Want er is niets verborgen, dat niet openbaar zal worden; noch heimelijk, dat niet bekend zal worden, en in het openbaar komen.","18":"Ziet dan, hoe gij hoort; want zo wie heeft, dien zal gegeven worden; en zo wie niet heeft, ook hetgeen hij meent te hebben, zal van hem genomen worden.","19":"En Zijn moeder en *Zijn* broeders kwamen tot Hem, en konden bij Hem niet komen, vanwege de schare.","20":"En Hem werd geboodschapt *van* *enigen*, die zeiden: Uw moeder en Uw broeders staan daar buiten, begerende U te zien.","21":"Maar Hij antwoordde en zeide tot hen: Mijn moeder en Mijn broeders zijn dezen, die Gods Woord horen, en datzelve doen.","22":"En het geschiedde in een van die dagen, dat Hij in een schip ging, en Zijn discipelen *met* *Hem*; en Hij zeide tot hen: Laat ons overvaren aan de andere zijde van het meer. En zij staken af.","23":"En als zij voeren, viel Hij in slaap; en er kwam een storm van wind op het meer, en zij werden vol *waters*, en waren in nood.","24":"En zij gingen tot Hem, en wekten Hem op, zeggende: Meester, Meester, wij vergaan! en Hij, opgestaan zijnde, bestrafte den wind en de watergolven, en zij hielden op, en er werd stilte.","25":"En Hij zeide tot hen: Waar is uw geloof? Maar zij, bevreesd zijnde, verwonderden zich, zeggende tot elkander: Wie is toch Deze, dat Hij ook de winden en het water gebiedt, en zij zijn Hem gehoorzaam?","26":"En zij voeren voort naar het land der Gadarenen, hetwelk is tegenover Galilea.","27":"En als Hij aan het land uitgegaan was, ontmoette Hem een zeker man uit de stad, die van over langen tijd met duivelen was bezeten geweest; en was met geen klederen gekleed, en bleef in geen huis, maar in de graven.","28":"En hij, Jezus ziende, en zeer roepende, viel voor Hem neder, en zeide met een grote stem: Wat heb ik met U *te* *doen*, Jezus, Gij Zone Gods, des Allerhoogsten, ik bid U, dat Gij mij niet pijnigt!","29":"Want Hij had den onreinen geest geboden , dat hij van den mens zou uitvaren; want hij had hem menigen tijd bevangen gehad; en hij werd met ketenen en met boeien gebonden, om bewaard te zijn; en hij verbrak de banden, en werd van den duivel gedreven in de woestijnen.","30":"En Jezus vraagde hem, zeggende: Welke is uw naam? En hij zeide: Legio. Want vele duivelen waren in hem gevaren.","31":"En zij baden Hem, dat Hij hun niet gebieden zou in den afgrond heen te varen.","32":"En aldaar was een kudde veler zwijnen, weidende op den berg; en zij baden Hem, dat Hij hun wilde toelaten in dezelve te varen. En Hij liet het hun toe.","33":"En de duivelen, uitvarende van den mens, voeren in de zwijnen; en de kudde stortte van de steilte af in het meer; en versmoorde.","34":"En die ze weidden, ziende hetgeen geschied was, zijn gevlucht; en heengaande boodschapten het in de stad, en op het land.","35":"En zij gingen uit, om te zien hetgeen geschied was, en kwamen tot Jezus, en vonden den mens, van welken de duivelen uitgevaren waren, zittend aan de voeten van Jezus, gekleed en wel bij zijn verstand; en zij werden bevreesd.","36":"En ook, die het gezien hadden, verhaalden hun, hoe de bezetene was verlost geworden.","37":"En de gehele menigte van het omliggende land der Gadarenen baden Hem, dat Hij van hen wegging; want zij waren met grote vreze bevangen. En Hij, in het schip gegaan zijnde, keerde wederom.","38":"En de man, van welken de duivelen uitgevaren waren, bad Hem, dat hij mocht bij Hem zijn. Maar Jezus liet hem van Zich gaan, zeggende:","39":"Keer weder naar uw huis, en vertel, wat grote dingen u God gedaan heeft. En hij ging heen door de gehele stad, verkondigende, wat grote dingen Jezus hem gedaan had.","40":"En het geschiedde, als Jezus wederkeerde, dat Hem de schare ontving; want zij waren allen Hem verwachtende.","41":"En ziet, er kwam een man, wiens naam was Jaïrus, en hij was een overste der synagoge; en hij viel aan de voeten van Jezus, en bad Hem, dat Hij in zijn huis wilde komen.","42":"Want hij had een enige dochter, van omtrent twaalf jaren, en deze lag op haar sterven. En als Hij heenging, zo verdrongen Hem de scharen.","43":"En een vrouw, die twaalf jaren lang den vloed des bloeds gehad had, welke al haar leeftocht aan medicijnmeesters ten koste gelegd had; en van niemand had kunnen genezen worden,","44":"Van achteren tot Hem komende, raakte den zoom Zijns kleeds aan; en terstond stelpte de vloed haars bloeds.","45":"En Jezus zeide: Wie is het, die Mij heeft aangeraakt? En als zij het allen miszaakten, zeide Petrus en die met hem waren: Meester, de scharen drukken en verdringen U, en zegt Gij: Wie is het, die Mij aangeraakt heeft?","46":"En Jezus zeide: Iemand heeft Mij aangeraakt; want Ik heb bekend, dat kracht van Mij uitgegaan is.","47":"De vrouw nu, ziende, dat zij niet verborgen was, kwam bevende, en voor Hem nedervallende, verklaarde Hem voor al het volk, om wat oorzaak zij Hem aangeraakt had, en hoe zij terstond genezen was.","48":"En Hij zeide tot haar: Dochter, wees welgemoed, uw geloof heeft u behouden; ga heen in vrede.","49":"Als Hij nog sprak, kwam er een van *het* *huis* des oversten der synagoge, zeggende tot hem: Uw dochter is gestorven; zijt den Meester niet moeielijk.","50":"Maar Jezus, *dat* horende, antwoordde hem, zeggende: Vrees niet, geloof alleenlijk, en zij zal behouden worden.","51":"En als Hij in het huis kwam, liet Hij niemand inkomen, dan Petrus, en Jakobus, en Johannes, en den vader en de moeder des kinds.","52":"En zij schreiden allen, en maakten misbaar over hetzelve. En Hij zeide: Schreit niet; zij is niet gestorven; maar zij slaapt.","53":"En zij belachten Hem, wetende, dat zij gestorven was.","54":"Maar als Hij ze allen uitgedreven had, greep Hij haar hand en riep, zeggende: Kind, sta op!","55":"En haar geest keerde weder, en zij is terstond opgestaan; en Hij gebood, dat men haar te eten geven zoude.","56":"En haar ouders ontzetten zich; en Hij beval hun, dat zij niemand zouden zeggen hetgeen geschied was."},"KJV":{"1":"And it came to pass afterward, that he went throughout every city and village, preaching and shewing the glad tidings of the kingdom of God: and the twelve *were* with him,","2":"And certain women, which had been healed of evil spirits and infirmities, Mary called Magdalene, out of whom went seven devils,","3":"And Joanna the wife of Chuza Herod's steward, and Susanna, and many others, which ministered unto him of their substance.","4":"And when much people were gathered together, and were come to him out of every city, he spake by a parable:","5":"A sower went out to sow his seed: and as he sowed, some fell by the way side; and it was trodden down, and the fowls of the air devoured it.","6":"And some fell upon a rock; and as soon as it was sprung up, it withered away, because it lacked moisture.","7":"And some fell among thorns; and the thorns sprang up with it, and choked it.","8":"And other fell on good ground, and sprang up, and bare fruit an hundredfold. And when he had said these things, he cried, He that hath ears to hear, let him hear.","9":"And his disciples asked him, saying, What might this parable be?","10":"And he said, Unto you it is given to know the mysteries of the kingdom of God: but to others in parables; that seeing they might not see, and hearing they might not understand.","11":"Now the parable is this: The seed is the word of God.","12":"Those by the way side are they that hear; then cometh the devil, and taketh away the word out of their hearts, lest they should believe and be saved.","13":"They on the rock *are they*, which, when they hear, receive the word with joy; and these have no root, which for a while believe, and in time of temptation fall away.","14":"And that which fell among thorns are they, which, when they have heard, go forth, and are choked with cares and riches and pleasures of *this* life, and bring no fruit to perfection.","15":"But that on the good ground are they, which in an honest and good heart, having heard the word, keep *it*, and bring forth fruit with patience.","16":"No man, when he hath lighted a candle, covereth it with a vessel, or putteth *it* under a bed; but setteth *it* on a candlestick, that they which enter in may see the light.","17":"For nothing is secret, that shall not be made manifest; neither *any thing* hid, that shall not be known and come abroad.","18":"Take heed therefore how ye hear: for whosoever hath, to him shall be given; and whosoever hath not, from him shall be taken even that which he seemeth to have.","19":"Then came to him *his* mother and his brethren, and could not come at him for the press.","20":"And it was told him *by certain* which said, Thy mother and thy brethren stand without, desiring to see thee.","21":"And he answered and said unto them, My mother and my brethren are these which hear the word of God, and do it.","22":"Now it came to pass on a certain day, that he went into a ship with his disciples: and he said unto them, Let us go over unto the other side of the lake. And they launched forth.","23":"But as they sailed he fell asleep: and there came down a storm of wind on the lake; and they were filled *with water*, and were in jeopardy.","24":"And they came to him, and awoke him, saying, Master, master, we perish. Then he arose, and rebuked the wind and the raging of the water: and they ceased, and there was a calm.","25":"And he said unto them, Where is your faith? And they being afraid wondered, saying one to another, What manner of man is this! for he commandeth even the winds and water, and they obey him.","26":"And they arrived at the country of the Gadarenes, which is over against Galilee.","27":"And when he went forth to land, there met him out of the city a certain man, which had devils long time, and ware no clothes, neither abode in *any* house, but in the tombs.","28":"When he saw Jesus, he cried out, and fell down before him, and with a loud voice said, What have I to do with thee, Jesus, *thou* Son of God most high? I beseech thee, torment me not.","29":"(For he had commanded the unclean spirit to come out of the man. For oftentimes it had caught him: and he was kept bound with chains and in fetters; and he brake the bands, and was driven of the devil into the wilderness.)","30":"And Jesus asked him, saying, What is thy name? And he said, Legion: because many devils were entered into him.","31":"And they besought him that he would not command them to go out into the deep.","32":"And there was there an herd of many swine feeding on the mountain: and they besought him that he would suffer them to enter into them. And he suffered them.","33":"Then went the devils out of the man, and entered into the swine: and the herd ran violently down a steep place into the lake, and were choked.","34":"When they that fed *them* saw what was done, they fled, and went and told *it* in the city and in the country.","35":"Then they went out to see what was done; and came to Jesus, and found the man, out of whom the devils were departed, sitting at the feet of Jesus, clothed, and in his right mind: and they were afraid.","36":"They also which saw *it* told them by what means he that was possessed of the devils was healed.","37":"Then the whole multitude of the country of the Gadarenes round about besought him to depart from them; for they were taken with great fear: and he went up into the ship, and returned back again.","38":"Now the man out of whom the devils were departed besought him that he might be with him: but Jesus sent him away, saying,","39":"Return to thine own house, and shew how great things God hath done unto thee. And he went his way, and published throughout the whole city how great things Jesus had done unto him.","40":"And it came to pass, that, when Jesus was returned, the people *gladly* received him: for they were all waiting for him.","41":"And, behold, there came a man named Jairus, and he was a ruler of the synagogue: and he fell down at Jesus' feet, and besought him that he would come into his house:","42":"For he had one only daughter, about twelve years of age, and she lay a dying. But as he went the people thronged him.","43":"And a woman having an issue of blood twelve years, which had spent all her living upon physicians, neither could be healed of any,","44":"Came behind *him*, and touched the border of his garment: and immediately her issue of blood stanched.","45":"And Jesus said, Who touched me? When all denied, Peter and they that were with him said, Master, the multitude throng thee and press *thee*, and sayest thou, Who touched me?","46":"And Jesus said, Somebody hath touched me: for I perceive that virtue is gone out of me.","47":"And when the woman saw that she was not hid, she came trembling, and falling down before him, she declared unto him before all the people for what cause she had touched him, and how she was healed immediately.","48":"And he said unto her, Daughter, be of good comfort: thy faith hath made thee whole; go in peace.","49":"While he yet spake, there cometh one from the ruler of the synagogue's *house*, saying to him, Thy daughter is dead; trouble not the Master.","50":"But when Jesus heard *it*, he answered him, saying, Fear not: believe only, and she shall be made whole.","51":"And when he came into the house, he suffered no man to go in, save Peter, and James, and John, and the father and the mother of the maiden.","52":"And all wept, and bewailed her: but he said, Weep not; she is not dead, but sleepeth.","53":"And they laughed him to scorn, knowing that she was dead.","54":"And he put them all out, and took her by the hand, and called, saying, Maid, arise.","55":"And her spirit came again, and she arose straightway: and he commanded to give her meat.","56":"And her parents were astonished: but he charged them that they should tell no man what was done."}},"tsk":{"1":[{"kopje":"dat","refs":["Luk 4:43","Luk 4:44","Matt 4:23","Matt 9:35","Matt 11:1","Mark 1:39","Hand 10:38"]},{"kopje":"het Evangelie","refs":["Luk 2:10","Luk 2:11","Luk 4:18","Jes 61:1-3","Matt 13:19","Hand 13:32","Rom 10:15"]},{"kopje":"en de","refs":["Luk 6:14-16","Matt 10:2-4","M peak in similitudes, that they seeing may not see, and hearing may not understand."}],"11":[{"catchword":null,"tekst":"Now this is the similitude the seed is [that is, signifieth] the word of God."}],"12":[{"catchword":null,"tekst":"And they that [are sown] by the way [side] are those that hear: afterwards cometh the Duvel, and taketh away the word out of their hearts, that they should not believed and be saved."}],"13":[{"catchword":null,"tekst":"And they that [are sown] on the rock, are they, that when, have heard it, receive the word with joy : and these have no root, which believe but for a time, and in the time of temptation they turn Away."}],"14":[{"catchword":null,"tekst":"And that which falls in the thornes, these are they which having hear, and going away are choked by the cares, and riches, and pleasures of [this] life., and bear no [fruit] to perfection."}],"15":[{"catchword":null,"tekst":"And that which [falleth] in the good Earth, are they which having heard the word, keep the same in an honest and good heart, [That is, opened, excited, and made fit by the spirit of God, to embrace the word of God and obey it Jer. 31.33. Eze 36:26, 27. Acts.16.14.] and in perseverance [or in patience, whereby, notwithstanding all temptations, and tribulations for words sake they preserve constantly.See Matt 24.13. Heb. 10.36."}],"16":[{"catchword":null,"tekst":"And no man that lighteth a candle covers the same with a vessel, or sets it under a bed: [Or bedstead] but setteth it on a candlestick, that those that come may see the light."}],"17":[{"catchword":null,"tekst":"For there is nothing hid [Namely of those things which I have revealed unto you. See Matt 10.27. and Mark 4. 22] that shall not be revealed :nor secret , that shall not be made known, come to light."}],"18":[{"catchword":null,"tekst":"Look thereof how you hear, [That is, with what inclination of heart yee come to the haeringof the word and having heard, how you may make a right use of the same] for whoso oman who had an issue of blood twelve years long, who had spent all her livelihood [Gr. All her living, that is, all her means whereon to live] upon Physicians, and could be healed of no man."}],"44":[{"catchword":null,"tekst":"Coming unto him from behind touched the hemme of his garment: and straightaway the issue of her blood stayed [Gr. Stood .i.e ceased.]"}],"45":[{"catchword":null,"tekst":"And Jesus said, who is it touched me? And when they all denyed it said Peter they that were with him, master, the multitudes press and throng thee, and sayst thou, who is it that touched me?"}],"46":[{"catchword":null,"tekst":"And Jesus said, some body touched me: for I have perceived [That is, I have been aware, or have known] that power is gone out of me. [See hereof Mark 5.30.]"}],"47":[{"catchword":null,"tekst":"Now the woman seeing that she was not hid, came trembling: and falling down before him, declared unto him before all people, for what cause she had touched him, and how she was healed immediately."}],"48":[{"catchword":null,"tekst":"And he said unto her, daughter is of good cheer thy faith hath saved thee: go thy way in peace."}],"49":[{"catchword":null,"tekst":"While he yet spake, there came one from [the house] of the Ruler of the Synagogue, saying unto him, thy daughter is dead: be not troublesome to the m Master."}],"50":[{"catchword":null,"tekst":"But Jesus hearing [that] answered him saying, fear not, believes only, and she shall be saved. [Or be delivered, namely from the dead.]"}],"51":[{"catchword":null,"tekst":"And when he came into the house, he suffered no to come in, save Peter and James, and John, and the father and the mother of the child.]"}],"52":[{"catchword":null,"tekst":"And they wept all, and misbehaved themselves for her, [Gr. smote themselves on the brest for her sake .See Matth 11. 17. And he said, weep not, she is not dead. [Namely, to remain dead as other people when they dy] but she sleepeth [that is, her death is like a sleep, from which she shall be raised up., John 11. v. 23.]"}],"53":[{"catchword":null,"tekst":"And thy derided him, knowing that she was dead."}],"54":[{"catchword":null,"tekst":"But when he had driven them all out, he took her by the hand, and cryed, saying, child arise."}],"55":[{"catchword":null,"tekst":"And her spirit returned, and she arose straightaway, and he commanded that they should give her to eat."}],"56":[{"catchword":null,"tekst":"And her parents were Astonished, and he commanded them to tell no one of what which was done.[Why Christ would not have his miracles spread abroad for a time. See Matth 12. v 16. 17.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
