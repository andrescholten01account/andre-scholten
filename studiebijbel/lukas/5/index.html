"href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde, toen de menigte op Hem aandrong om het Woord van God te horen, dat Hij bij het meer Gennesareth stond.","2":"En Hij zag twee schepen aan de oever van het meer liggen, en de vissers waren eruit gegaan en spoelden de netten.","3":"En Hij ging in een van die schepen, dat van Simon was, en vroeg hem of hij een stukje van het land af zou varen; en Hij ging zitten en leerde de menigten vanuit het schip.","4":"En toen Hij ophield met spreken, zei Hij tegen Simon: Steek af naar de diepte, en werp uw netten uit om te vangen.","5":"En Simon antwoordde en zei tegen Hem: Meester, we hebben de hele nacht gewerkt en niets gevangen; maar op Uw woord zal ik het net uitwerpen.","6":"En toen zij dat gedaan hadden, vingen ze een grote hoeveelheid vissen, en hun net scheurde.","7":"En zij wenkten hun medegenoten die in het andere schip waren, dat die hen zouden komen helpen. En zij kwamen en vulden beide schepen, zodat ze bijna zonken.","8":"Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.","9":"Want verbazing had hem en allen die met hem waren overweldigd, over de vangst van de vissen die zij gevangen hadden;","10":"en evenzo ook Jakobus en Johannes, de zonen van Zebedeüs, die medegenoten van Simon waren. En Jezus zei tegen Simon: Wees niet bang; van nu af aan zult u mensen vangen.","11":"En toen zij de schepen aan land gebracht hadden, verlieten zij alles en volgden Hem.","12":"En het gebeurde, toen Hij in een van die steden was, zie, er was een man vol melaatsheid; en toen Jezus hem zag, viel hij op zijn gezicht en smeekte Hem: Heere, als U wilt, kunt U mij reinigen.","13":"En Hij strekte Zijn hand uit en raakte hem aan, en zei: Ik wil het, word rein! En meteen ging de melaatsheid van hem weg.","14":"En Hij gebood hem het aan niemand te vertellen, maar: Ga heen, zei Hij, laat uzelf aan de priester zien, en offer voor uw reiniging, zoals Mozes geboden heeft, hun tot een getuigenis.","15":"Maar het bericht over Hem verspreidde zich des te meer; en veel menigten kwamen samen om Hem te horen en door Hem genezen te worden van hun ziekten.","16":"Maar Hij trok Zich terug in de woestijnen en bad daar.","17":"En het gebeurde op een van die dagen, terwijl Hij aan het lesgeven was, dat er Farizeeën en leraars van de wet zaten die uit alle dorpen van Galilea en Judea en Jeruzalem gekomen waren; en de kracht van de Heere was er om hen te genezen.","18":"En zie, er brachten mannen op een draagbed[1] een man die verlamd was, en zij probeerden hem naar binnen te brengen en voor Hem neer te leggen.","19":"En toen zij vanwege de menigte geen manier vonden om hem naar binnen te brengen, klommen zij op het dak en lieten hem met het draagbed door de dakpannen naar beneden, midden voor Jezus.","20":"En toen Hij hun geloof zag, zei Hij tegen hem: Mens, uw zonden zijn u vergeven.","21":"En de Schriftgeleerden en de Farizeeën begonnen te overdenken en zeiden: Wie is Deze, Die godslastering spreekt? Wie kan de zonden vergeven, dan God alleen?","22":"Maar Jezus, die hun overdenkingen doorzag, antwoordde en zei tegen hen: Wat overdenkt u in uw harten?","23":"Wat is gemakkelijker te zeggen: Uw zonden zijn u vergeven, of te zeggen: Sta op en loop?","24":"Maar opdat u weet dat de Zoon des mensen macht heeft op de aarde om de zonde te vergeven (zei Hij tegen de verlamde man): Ik zeg u, sta op, en neem uw draagbed op, en ga naar uw huis.","25":"En meteen stond hij voor Hem op, en nam wat waarop hij gelegen had, en ging naar zijn huis, terwijl hij God verheerlijkte.","26":"En verbazing had hen allen overweldigd, en zij verheerlijkten God, en werden vervuld met vrees, en zeiden: Wij hebben vandaag ongelooflijke dingen gezien.","27":"En hierna ging Hij naar buiten en zag een tollenaar, genaamd Levi, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij.","28":"En hij verliet alles, stond op en volgde Hem.","29":"En Levi richtte voor Hem een grote maaltijd aan in zijn huis; en er was een grote menigte van tollenaars en anderen die met hen aanzaten.","30":"En hun Schriftgeleerden en de Farizeeën morden tegen Zijn discipelen en zeiden: Waarom eet en drinkt u met tollenaars en zondaars?","31":"En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.","32":"Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.","33":"En zij zeiden tegen Hem: Waarom vasten de discipelen van Johannes dikwijls en doen gebeden, evenzo ook de discipelen van de Farizeeën, maar de Uwe eten en drinken?","34":"Maar Hij zei tegen hen: Kunt u de bruiloftsgasten laten vasten terwijl de Bruidegom bij hen is?","35":"Maar de dagen zullen komen dat de Bruidegom van hen weggenomen zal zijn; dan zullen zij vasten, in die dagen.","36":"En Hij zei ook een gelijkenis tegen hen: Niemand zet een lap van een nieuw kleed op een oud kleed; anders scheurt ook dat nieuwe, en de lap van het nieuwe past niet bij het oude.","37":"En niemand doet nieuwe wijn in oude leren zakken; anders zal de nieuwe wijn de leren zakken doen barsten, en de wijn zal uitgestort worden, en de leren zakken zullen verloren gaan.","38":"Maar nieuwe wijn moet men in nieuwe leren zakken doen, en beide blijven behouden.","39":"En niemand die oude wijn gedronken heeft, wil meteen nieuwe; want hij zegt: De oude is beter."},"SV":{"1":"En het geschiedde, als de schare op Hem aandrong, om het Woord Gods te horen, dat Hij stond bij het meer Gennesareth.","2":"En Hij zag twee schepen aan *den* *oever* van het meer liggende, en de vissers waren daaruit gegaan, en spoelden de netten.","3":"En Hij ging in een van die schepen, hetwelk van Simon was, en bad hem, dat hij een weinig van het land afstak; en nederzittende, leerde Hij de scharen uit het schip.","4":"En als Hij afliet van spreken, zeide Hij tot Simon: Steek af naar de diepte, en werp uw netten uit om te vangen.","5":"En Simon antwoordde en zeide tot Hem: Meester, wij hebben den gehelen nacht over gearbeid, en niet gevangen; doch op Uw woord zal ik het net uitwerpen.","6":"En als zij dat gedaan hadden, besloten zij een grote menigte vissen, en hun net scheurde.","7":"En zij wenkten hun medegenoten, die in het andere schip waren, dat zij hen zouden komen helpen. En zij kwamen, en vulden beide de schepen, zodat zij bijna zonken.","8":"En Simon Petrus, *dat* ziende, viel neder aan de knieën van Jezus, zeggende: Heere! ga uit van mij; want ik ben een zondig mens.","9":"Want verbaasdheid had hem bevangen, en allen, die met hem waren, over de vangst der vissen, die zij gevangen hadden;","10":"En desgelijks ook Jakobus en Johannes, de zonen van Zebedeüs, die medegenoten van Simon waren. En Jezus zeide tot Simon: Vrees niet; van nu aan zult gij mensen vangen.","11":"En als zij de schepen aan land gestuurd hadden, verlieten zij alles, en volgden Hem.","12":"En het geschiedde, als Hij in een dier steden was, ziet, er *was* een man vol melaatsheid; en Jezus ziende, viel hij op het aangezicht, en bad Hem, zeggende: Heere! zo Gij wilt, Gij kunt mij reinigen.","13":"En Hij, de hand uitstrekkende, raakte hem aan; en zeide: Ik wil, word gereinigd! En terstond ging de melaatsheid van hem.","14":"En Hij gebood hem, dat hij het niemand zeggen zou; maar ga heen, *zeide* *Hij*, vertoon uzelven den priester, en offer voor uw reiniging, gelijk Mozes geboden heeft, hun tot een getuigenis.","15":"Maar het gerucht van Hem ging te meer voort; en vele scharen kwamen samen om *Hem* te horen, en door Hem genezen te worden van hun krankheden.","16":"Maar Hij vertrok in de woestijnen, en bad *aldaar*.","17":"En het geschiedde in een dier dagen, dat Hij leerde, en *er* zaten Farizeën en leraars der wet, die van alle vlekken van Galilea, en Judea, en Jeruzalem gekomen waren; en de kracht des Heeren was *er* om hen te genezen.","18":"En ziet, *enige* mannen brachten op een bed een mens, die geraakt was, en zochten hem in te brengen, en voor Hem te leggen.","19":"En niet vindende, waardoor zij hem inbrengen mochten, overmits de schare, zo klommen zij op het dak, en lieten hem door de tichelen neder met het beddeken, in het midden, voor Jezus.","20":"En Hij ziende hun geloof, zeide tot hem: Mens, uw zonden zijn u vergeven.","21":"En de Schriftgeleerden en de Farizeën begonnen te overdenken, zeggende: Wie is Deze, Die *gods* lastering spreekt? Wie kan de zonden vergeven, dan God alleen?","22":"Maar Jezus, hun overdenkingen bekennende, antwoordde en zeide tot hen: Wat overdenkt gij in uw harten?","23":"Wat is lichter te zeggen: Uw zonden zijn u vergeven, of te zeggen: Sta op en wandel?","24":"Doch opdat gij moogt weten, dat de Zoon des mensen macht heeft op de aarde, de zonde te vergeven (zeide Hij tot den geraakte): Ik zeg u, sta op, en neem uw beddeken op, en ga heen naar uw huis.","25":"En hij, terstond voor Hem opstaande, *en* opgenomen hebbende hetgeen, daar hij op gelegen had, ging heen naar zijn huis, God verheerlijkende.","26":"En ontzetting heeft *hen* allen bevangen, en zij verheerlijkten God, en werden vervuld met vreze, zeggende: Wij hebben heden ongelofelijke dingen gezien.","27":"En na dezen ging Hij uit, en zag een tollenaar, met name Levi, zitten in het tolhuis, en zeide tot hem: Volg Mij.","28":"En hij, alles verlatende, stond op en volgde Hem.","29":"En Levi richtte Hem een groten maaltijd aan, in zijn huis; en *er* was een grote schare van tollenaren, en van anderen, die met hen aanzaten.","30":"En hun Schriftgeleerden en de Farizeën murmureerden tegen Zijn discipelen, zeggende: Waarom eet en drinkt gij met tollenaren en zondaren?","31":"En Jezus, antwoordende, zeide tot hen: Die gezond zijn, hebben den medicijnmeester niet van node, maar die ziek zijn.","32":"Ik ben niet gekomen om te roepen rechtvaardigen, maar zondaren tot bekering.","33":"En zij zeiden tot Hem: Waarom vasten de discipelen van Johannes dikmaals, en doen gebeden, desgelijks ook *de* *discipelen* der Farizeën, maar de Uwe eten en drinken?","34":"Doch Hij zeide tot hen: Kunt gij de bruiloftskinderen, terwijl de Bruidegom bij hen is, doen vasten?","35":"Maar de dagen zullen komen, wanneer de Bruidegom van hen zal weggenomen zijn, dan zullen zij vasten in die dagen.","36":"En Hij zeide ook tot hen een gelijkenis: Niemand zet een lap van een nieuw kleed op een oud kleed; anders zo scheurt ook dat nieuwe *het* *oude*, en de lap van het nieuwe komt met het oude niet overeen.","37":"En niemand doet nieuwen wijn in oude *leder* zakken; anders zo zal de nieuwe wijn de *leder* zakken doen bersten, en de *wijn* zal uitgestort worden, en de *leder* zakken zullen verderven.","38":"Maar nieuwen wijn moet men in nieuwe *leder* zakken doen, en zij worden beide te zamen behouden.","39":"En niemand, die ouden drinkt, begeert terstond nieuwen; want hij zegt: De oude is beter."},"KJV":{"1":"And it came to pass, that, as the people pressed upon him to hear the word of God, he stood by the lake of Gennesaret,","2":"And saw two ships standing by the lake: but the fishermen were gone out of them, and were washing *their* nets.","3":"And he entered into one of the ships, which was Simon's, and prayed him that he would thrust out a little from the land. And he sat down, and taught the people out of the ship.","4":"Now when he had left speaking, he said unto Simon, Launch out into the deep, and let down your nets for a draught.","5":"And Simon answering said unto him, Master, we have toiled all the night, and have taken nothing: nevertheless at thy word I will let down the net.","6":"And when they had this done, they inclosed a great multitude of fishes: and their net brake.","7":"And they beckoned unto *their* partners, which were in the other ship, that they should come and help them. And they came, and filled both the ships, so that they began to sink.","8":"When Simon Peter saw *it*, he fell down at Jesus' knees, saying, Depart from me; for I am a sinful man, O Lord.","9":"For he was astonished, and all that were with him, at the draught of the fishes which they had taken:","10":"And so *was* also James, and John, the sons of Zebedee, which were partners with Simon. And Jesus said unto Simon, Fear not; from henceforth thou shalt catch men.","11":"And when they had brought their ships to land, they forsook all, and followed him.","12":"And it came to pass, when he was in a certain city, behold a man full of leprosy: who seeing Jesus fell on *his* face, and besought him, saying, Lord, if thou wilt, thou canst make me clean.","13":"And he put forth *his* hand, and touched him, saying, I will: be thou clean. And immediately the leprosy departed from him.","14":"And he charged him to tell no man: but go, and shew thyself to the priest, and offer for thy cleansing, according as Moses commanded, for a testimony unto them.","15":"But so much the more went there a fame abroad of him: and great multitudes came together to hear, and to be healed by him of their infirmities.","16":"And he withdrew himself into the wilderness, and prayed.","17":"And it came to pass on a certain day, as he was teaching, that there were Pharisees and doctors of the law sitting by, which were come out of every town of Galilee, and Judaea, and Jerusalem: and the power of the Lord was *present* to heal them.","18":"And, behold, men brought in a bed a man which was taken with a palsy: and they sought *means* to bring him in, and to lay *him* before him.","19":"And when they could not find by what *way* they might bring him in because of the multitude, they went upon the housetop, and let him down through the tiling with *his* couch into the midst before Jesus.","20":"And when he saw their faith, he said unto him, Man, thy sins are forgiven thee.","21":"And the scribes and the Pharisees began to reason, saying, Who is this which speaketh blasphemies? Who can forgive sins, but God alone?","22":"But when Jesus perceived their thoughts, he answering said unto them, What reason ye in your hearts?","23":"Whether is easier, to say, Thy sins be forgiven thee; or to say, Rise up and walk?","24":"But that ye may know that the Son of man hath power upon earth to forgive sins, (he said unto the sick of the palsy,) I say unto thee, Arise, and take up thy couch, and go into thine house.","25":"And immediately he rose up before them, and took up that whereon he lay, and departed to his own house, glorifying God.","26":"And they were all amazed, and they glorified God, and were filled with fear, saying, We have seen strange things to day.","27":"And after these things he went forth, and saw a publican, named Levi, sitting at the receipt of custom: and he said unto him, Follow me.","28":"And he left all, rose up, and followed him.","29":"And Levi made him a great feast in his own house: and there was a great company of publicans and of others that sat down with them.","30":"But their scribes and Pharisees murmured against his disciples, saying, Why do ye eat and drink with publicans and sinners?","31":"And Jesus answering said unto them, They that are whole need not a physician; but they that are sick.","32":"I came not to call the righteous, but sinners to repentance.","33":"And they said unto him, Why do the disciples of John fast often, and make prayers, and likewise *the disciples* of the Pharisees; but thine eat and drink?","34":"And he said unto them, Can ye make the children of the bridechamber fast, while the bridegroom is with them?","35":"But the days will come, when the bridegroom shall be taken away from them, and then shall they fast in those days.","36":"And he spake also a parable unto them; No man putteth a piece of a new garment upon an old; if otherwise, then both the new maketh a rent, and the piece that was *taken* out of the new agreeth not with the old.","37":"And no man putteth new wine into old bottles; else the new wine will burst the bottles, and be spilled, and the bottles shall perish.","38":"But new wine must be put into new bottles; and both are preserved.","39":"No man also having drunk old *wine* straightway desireth new: for he saith, The old is better."}},"tsk":{"1":[{"kopje":"het","refs":["Luk 8:45","Luk 12:1","Matt 4:18-22","Matt 11:12","Mark 1:16-20","Mark 3:9","Mark 5:24"]},{"kopje":"het meer","refs":["Num 34:11","Joz 12:3","Matt 14:34","Mark 6:53"]}],"2":[{"kopje":"spoelden","refs":["Matt 4:21","Mark 1:19"]}],"3":[{"kopje":"dat","refs":["Matt 4:18","Joh 1:42","Joh 1:43"]},{"kopje":"Hij ging zitten","refs":["Matt 13:1","Matt 13:2","Mark 4:1","Mark 4:2","Joh 8:2"]}],"4":[{"kopje":"Steek af","refs":["Matt 17:27","Joh 21:6"]}],"5":[{"kopje":"we","refs":["Ps 127:1","Ps 127:2","Ezech 37:11","Ezech 37:12","Joh 21:3"]},{"kopje":"maar","refs":["Luk 6:46-48","2 Kon 5:10-14","Ezech 37:4-7","Joh 2:5","Joh 15:14"]}],"6":[{"kopje":"vingen z // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

}

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

}

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
