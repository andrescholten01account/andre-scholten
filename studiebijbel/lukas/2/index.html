bbe, omdat er voor hen geen plaats was in de herberg.","8":"En er waren herders in diezelfde landstreek, die in het veld verbleven en 's nachts de wacht hielden over hun kudde.","9":"En zie, een engel van de Heere stond bij hen, en de heerlijkheid van de Heere omscheen hen, en zij werden zeer bevreesd.","10":"En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;","11":"*namelijk* dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.","12":"En dit zal voor u het teken zijn: u zult het Kindje vinden in doeken gewonden, en liggend in de kribbe.","13":"En opeens was er bij de engel een menigte van het hemelse leger, die God prezen en zeiden:","14":"Ere zij God in de hoogste *hemelen*, en vrede op aarde, in de mensen een welbehagen.","15":"En het gebeurde, toen de engelen van hen weggegaan waren naar de hemel, dat de herders tegen elkaar zeiden: Laten we dan naar Bethlehem gaan, en laten we dat woord zien dat er gebeurd is, dat de Heere ons heeft bekendgemaakt.","16":"En zij kwamen met haast, en vonden Maria en Jozef, en het Kindje liggend in de kribbe.","17":"En toen zij Het gezien hadden, maakten zij overal het woord bekend, dat hun over dit Kindje gezegd was.","18":"En allen die het hoorden verwonderden zich over wat hun door de herders gezegd werd.","19":"Maar Maria bewaarde al deze woorden samen, en overlegde ze in haar hart.","20":"En de herders keerden terug, terwijl zij God verheerlijkten en prezen om alles wat zij gehoord en gezien hadden, zoals tegen hen gesproken was.","21":"En toen acht dagen vervuld waren, dat men het Kindje besnijden zou, werd Zijn Naam genoemd JEZUS, zoals Hij genoemd was door de engel voordat Hij in het lichaam ontvangen was.","22":"En toen de dagen van haar reiniging vervuld waren, naar de wet van Mozes, brachten zij Hem naar Jeruzalem, om Hem de Heere voor te stellen;","23":"(zoals geschreven is in de wet van de Heere: Al wat mannelijk is, dat de moeder opent, zal de Heere heilig genoemd worden.)","24":"En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.","25":"En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem.","26":"En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien.","27":"En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,","28":"nam hij Hem in zijn armen, en loofde God, en zei:","29":"Nu laat U, Heere, Uw dienstknecht gaan in vrede, naar Uw woord;","30":"want mijn ogen hebben Uw zaligheid gezien,","31":"die U bereid hebt voor het aangezicht van alle volken:","32":"een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.","33":"En Jozef en Zijn moeder verwonderden zich over wat er van Hem gezegd werd.","34":"En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.","35":"(En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit veel harten geopenbaard worden.","36":"En er was Anna, een profetes, een dochter van Fanuël, uit de stam van Aser; zij was tot hoge ouderdom gekomen, en had met haar man zeven jaar geleefd sinds haar maagdelijkheid.","37":"En zij was een weduwe van ongeveer vierentachtig jaar, die niet week uit de tempel, maar God diende met vasten en bidden, nacht en dag.","38":"En zij kwam op datzelfde moment daarbij, en dankte eveneens de Heere, en sprak over Hem tot allen die de verlossing in Jeruzalem verwachtten.","39":"En toen zij alles voltooid hadden wat naar de wet van de Heere *te doen* was, keerden zij terug naar Galilea, naar hun stad Nazareth.","40":"En het Kindje groeide op, en werd gesterkt in de geest, en vervuld met wijsheid; en de genade van God was op Hem.","41":"En Zijn ouders reisden elk jaar naar Jeruzalem, op het feest van pascha.","42":"En toen Hij twaalf jaar oud geworden was, en zij naar Jeruzalem opgegaan waren, naar de gewoonte van de feestdag,","43":"en de dagen daar voltooid hadden, bleef, toen zij terugkeerden, het Kind Jezus in Jeruzalem, en Jozef en Zijn moeder wisten het niet.","44":"Maar zij dachten dat Hij bij het reisgezelschap was, en gingen een dagreis, en zochten Hem onder de familie en onder de bekenden.","45":"En toen zij Hem niet vonden, keerden zij terug naar Jeruzalem, op zoek naar Hem.","46":"En het gebeurde na drie dagen, dat zij Hem vonden in de tempel, zittend te midden van de leraren, terwijl Hij naar hen luisterde en hun vragen stelde.","47":"En allen die Hem hoorden, waren verbaasd over Zijn verstand en antwoorden.","48":"En zij, toen zij Hem zagen, waren ontdaan; en Zijn moeder zei tegen Hem: Kind, waarom hebt U ons dit aangedaan? Zie, Uw vader en ik hebben U met angst gezocht.","49":"En Hij zei tegen hen: Waarom hebt u Mij gezocht? Wist u niet dat Ik moet zijn in de dingen van Mijn Vader?","50":"En zij begrepen het woord niet dat Hij tot hen sprak.","51":"En Hij ging met hen mee naar beneden, en kwam in Nazareth, en was hun onderdanig. En Zijn moeder bewaarde al deze dingen in haar hart.","52":"En Jezus nam toe in wijsheid en grootte, en in genade bij God en de mensen."},"SV":{"1":"En het geschiedde in diezelfde dagen, dat er een gebod uitging van den Keizer Augustus, dat de gehele wereld beschreven zou worden.","2":"Deze eerste beschrijving geschiedde, als Cyrenius over Syrië stadhouder was.","3":"En zij gingen allen om beschreven te worden, een iegelijk naar zijn eigen stad.","4":"En Jozef ging ook op van Galilea, uit de stad Nazareth, naar Judea, tot de stad Davids, die Bethlehem genaamd wordt, ( omdat hij uit het huis en geslacht van David was);","5":"Om beschreven te worden met Maria, zijn ondertrouwde vrouw, welke bevrucht was.","6":"En het geschiedde, als zij daar waren, dat de dagen vervuld werden, dat zij baren zoude.","7":"En zij baarde haar eerstgeboren Zoon, en wond Hem in doeken, en leide Hem neder in de kribbe, omdat voor henlieden geen plaats was in de herberg.","8":"En er waren herders in diezelfde landstreek, zich houdende in het veld, en hielden de nachtwacht over hun kudde.","9":"En ziet, een engel des Heeren stond bij hen, en de heerlijkheid des Heeren omscheen hen, en zij vreesden met grote vreze.","10":"En de engel zeide tot hen: Vreest niet, want, ziet, ik verkondig u grote blijdschap, die al den volke wezen zal;","11":"*Namelijk* dat u heden geboren is de Zaligmaker, welke is Christus, de Heere, in de stad Davids.","12":"En dit zal u het teken zijn: gij zult het Kindeken vinden in doeken gewonden, en liggende in de kribbe.","13":"En van stonde aan was *er* met den engel een menigte des hemelsen heirlegers, prijzende God en zeggende:","14":"Ere *zij* God in de hoogste *hemelen*, en vrede op aarde, in de mensen een welbehagen.","15":"En het geschiedde, als de engelen van hen weggevaren waren naar den hemel, dat de herders tot elkander zeiden: Laat ons dan heengaan naar Bethlehem, en laat ons zien het woord, dat er geschied is, hetwelk de Heere ons heeft verkondigd.","16":"En zij kwamen met haast, en vonden Maria en Jozef, en het Kindeken liggende in de kribbe.","17":"En als zij Het gezien hadden, maakten zij alom bekend het woord, dat hun van dit Kindeken gezegd was.","18":"En allen, die het hoorden, verwonderden zich over hetgeen hun gezegd werd van de herders.","19":"Doch Maria bewaarde deze woorden alle te zamen, overleggende *die* in haar hart.","20":"En de herders keerden wederom, verheerlijkende en prijzende God over alles, wat zij gehoord en gezien hadden, gelijk tot hen gesproken was.","21":"En als acht dagen vervuld waren, dat men het Kindeken besnijden zou, zo werd Zijn Naam genaamd JEZUS, welke genaamd was van den engel, eer Hij in het lichaam ontvangen was.","22":"En als de dagen harer reiniging vervuld waren, naar de wet van Mozes, brachten zij Hem te Jeruzalem, opdat zij *Hem* den Heere voorstelden;","23":"( Gelijk geschreven is in de wet des Heeren: Al wat mannelijk is, dat de moeder opent, zal den Heere heilig genaamd worden.)","24":"En opdat zij offerande gaven, naar hetgeen in de wet des Heeren gezegd is, een paar tortelduiven, of twee jonge duiven.","25":"En ziet, er was een mens te Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezende; verwachtende de vertroosting Israëls, en de Heilige Geest was op hem.","26":"En hem was een Goddelijke openbaring gedaan door den Heiligen Geest, dat hij den dood niet zien zoude, eer hij den Christus des Heeren zou zien.","27":"En hij kwam door den Geest in den tempel. En als de ouders het Kindeken Jezus inbrachten, om naar de gewoonte der wet met Hem te doen;","28":"Zo nam hij Hetzelve in zijn armen, en loofde God, en zeide:","29":"Nu laat Gij , Heere! Uw dienstknecht gaan in vrede naar Uw woord;","30":"Want mijn ogen hebben Uw zaligheid gezien,","31":"Die Gij bereid hebt voor het aangezicht van al de volken:","32":"Een Licht tot verlichting der heidenen, en tot heerlijkheid van Uw volk Israël.","33":"En Jozef en Zijn moeder verwonderden zich over hetgeen van Hem gezegd werd.","34":"En Simeon zegende henlieden, en zeide tot Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding veler in Israël, en tot een teken, dat wedersproken zal worden.","35":"( En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit vele harten geopenbaard worden.","36":"En er was Anna, een profetesse, een dochter van Fanuël, uit den stam van Aser; deze was tot groten ouderdom gekomen, welke met *haar* man zeven jaren had geleefd van haar maagdom af.","37":"En zij was een weduwe van omtrent vier en tachtig jaren, dewelke niet week uit den tempel, met vasten en bidden, *God* dienende nacht en dag.","38":"En deze, te dierzelfder ure daarbij komende, heeft insgelijks den Heere beleden, en sprak van Hem tot allen, die de verlossing in Jeruzalem verwachtten.","39":"En als zij alles voleindigd hadden, wat naar de wet des Heeren *te* *doen* was, keerden zij weder naar Galilea, tot hun stad Nazareth.","40":"En het Kindeken wies op, en werd gesterkt in den geest, en vervuld met wijsheid; en de genade Gods was over Hem.","41":"En Zijn ouders reisden alle jaar naar Jeruzalem, op het feest van pascha.","42":"En toen Hij twaalf jaren *oud* geworden was, en zij naar Jeruzalem opgegaan waren, naar de gewoonte van den feestdag;","43":"En de dagen *aldaar* voleindigd hadden, toen zij wederkeerden, bleef het Kind Jezus te Jeruzalem, en Jozef en Zijn moeder wisten het niet.","44":"Maar menende, dat Hij in het gezelschap op den weg was, gingen zij een dagreize, en zochten Hem onder de magen, en onder de bekenden.","45":"En als zij Hem niet vonden, keerden zij wederom naar Jeruzalem, Hem zoekende.","46":"En het geschiedde, na drie dagen, dat zij Hem vonden in den tempel, zittende in het midden der leraren, hen horende, en hen ondervragende.","47":"En allen, die Hem hoorden, ontzetten zich over Zijn verstand en antwoorden.","48":"En zij, Hem ziende, werden verslagen; en Zijn moeder zeide tot Hem: Kind! waarom hebt Gij ons zo gedaan? Zie, Uw vader en ik hebben U met angst gezocht.","49":"En Hij zeide tot hen: Wat *is* *het*, dat gij Mij gezocht hebt? Wist gij niet, dat Ik moet zijn in de dingen Mijns Vaders?","50":"En zij verstonden het woord niet, dat Hij tot hen sprak.","51":"En Hij ging met hen af, en kwam te Nazareth, en was hun onderdanig. En Zijn moeder bewaarde al deze dingen in haar hart.","52":"En Jezus nam toe in wijsheid, en in grootte, en in genade bij God en de mensen."},"KJV":{"1":"And it came to pass in those days, that there went out a decree from Caesar Augustus, that all the world should be taxed.","2":"(*And* this taxing was first made when Cyrenius was governor of Syria.)","3":"And all went to be taxed, every one into his own city.","4":"And Joseph also went up from Galilee, out of the city of Nazareth, into Judaea, unto the city of David, which is called Bethlehem; (because he was of the house and lineage of David:)","5":"To be taxed with Mary his espoused wife, being great with child.","6":"And so it was, that, while they were there, the days were accomplished that she should be delivered.","7":"And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn.","8":"And there were in the same country shepherds abiding in the field, keeping watch over their flock by night.","9":"And, lo, the angel of the Lord came upon them, and the glory of the Lord shone round about them: and they were sore afraid.","10":"And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people.","11":"For unto you is born this day in the city of David a Saviour, which is Christ the Lord.","12":"And this *shall be* a sign unto you; Ye shall find the babe wrapped in swaddling clothes, lying in a manger.","13":"And suddenly there was with the angel a multitude of the heavenly host praising God, and saying,","14":"Glory to God in the highest, and on earth peace, good will toward men.","15":"And it came to pass, as the angels were gone away from them into heaven, the shepherds said one to another, Let us now go even unto Bethlehem, and see this thing which is come to pass, which the Lord hath made known unto us.","16":"And they came with haste, and found Mary, and Joseph, and the babe lying in a manger.","17":"And when they had seen *it*, they made known abroad the saying which was told them concerning this child.","18":"And all they that heard *it* wondered at those things which were told them by the shepherds.","19":"But Mary kept all these things, and pondered *them* in her heart.","20":"And the shepherds returned, glorifying and praising God for all the things that they had heard and seen, as it was told unto them.","21":"And when eight days were accomplished for the circumcising of the child, his name was called JESUS, which was so named of the angel before he was conceived in the womb.","22":"And when the days of her purification according to the law of Moses were accomplished, they brought him to Jerusalem, to present *him* to the Lord;","23":"(As it is written in the law of the Lord, Every male that openeth the womb shall be called holy to the Lord;)","24":"And to offer a sacrifice according to that which is said in the law of the Lord, A pair of turtledoves, or two young pigeons.","25":"And, behold, there was a man in Jerusalem, whose name *was* Simeon; and the same man *was* just and devout, waiting for the consolation of Israel: and the Holy Ghost was upon him.","26":"And it was revealed unto him by the Holy Ghost, that he should not see death, before he had seen the Lord's Christ.","27":"And he came by the Spirit into the temple: and when the parents brought in the child Jesus, to do for him after the custom of the law,","28":"Then took he him up in his arms, and blessed God, and said,","29":"Lord, now lettest thou thy servant depart in peace, according to thy word:","30":"For mine eyes have seen thy salvation,","31":"Which thou hast prepared before the face of all people;","32":"A light to lighten the Gentiles, and the glory of thy people Israel.","33":"And Joseph and his mother marvelled at those things which were spoken of him.","34":"And Simeon blessed them, and said unto Mary his mother, Behold, this *child* is set for the fall and rising again of many in Israel; and for a sign which shall be spoken against;","35":"(Yea, a sword shall pierce through thy own soul also,) that the thoughts of many hearts may be revealed.","36":"And there was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Aser: she was of a great age, and had lived with an husband seven years from her virginity;","37":"And she *was* a widow of about fourscore and four years, which departed not from the temple, but served *God* with fastings and prayers night and day.","38":"And she coming in that instant gave thanks likewise unto the Lord, and spake of him to all them that looked for redemption in Jerusalem.","39":"And when they had performed all things according to the law of the Lord, they returned into Galilee, to their own city Nazareth.","40":"And the child grew, and waxed strong in spirit, filled with wisdom: and the grace of God was upon him.","41":"Now his parents went to Jerusalem every year at the feast of the passover.","42":"And when he was twelve years old, they went up to Jerusalem after the custom of the feast.","43":"And when they had fulfilled the days, as they returned, the child Jesus tarried behind in Jerusalem; and Joseph and his mother knew not","44":"But they, supposing him to have been in the company, went a day's journey; and they sought him among *their* kinsfolk and acquaintance.","45":"And when they found him not, they turned back again to Jerusalem, seeking him.","46":"And it came to pass, that after three days they found him in the temple, sitting in the midst of the doctors, both hearing them, and asking them questions.","47":"And all that heard him were astonished at his understanding and answers.","48":"And when they saw him, they were amazed: and his mother said unto him, Son, why hast thou thus dealt with us? behold, thy father and I have sought thee sorrowing.","49":"And he said unto them, How is it that ye sought me? wist ye not that I must be about my Father's business?","50":"And they understood not the saying which he spake unto them.","51":"And he went down with them, and came to Nazareth, and was subject unto them: but his mother kept all these sayings in her heart.","52":"And Jesus increased in wisdom and stature, and in favour with God and man."}},"tsk":{"1":[{"kopje":"keizer","refs":["Luk 3:1","Hand wl wl-kjv\" data-code=\"G3779\">thus</span> <span class=\"wl wl-kjv\" data-code=\"G4160\">dealt</span> with <span class=\"wl wl-kjv\" data-code=\"G2254\">us?</span> <span class=\"wl wl-kjv\" data-code=\"G2400\">behold,</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G3962\">father</span> and <span class=\"wl wl-kjv\" data-code=\"G2504\">I</span> have <span class=\"wl wl-kjv\" data-code=\"G2212\">sought</span> <span class=\"wl wl-kjv\" data-code=\"G4571\">thee</span> sorrowing.","49":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G2036\">said</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">How</span> is it <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> ye <span class=\"wl wl-kjv\" data-code=\"G2212\">sought</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">me?</span> wist <span class=\"wl wl-kjv\" data-code=\"G1492\">ye</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">I</span> <span class=\"wl wl-kjv\" data-code=\"G1163\">must</span> <span class=\"wl wl-kjv\" data-code=\"G1511\">be</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">about</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> Father's business?","50":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G846\">they</span> <span class=\"wl wl-kjv\" data-code=\"G4920\">understood</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> the <span class=\"wl wl-kjv\" data-code=\"G4487\">saying</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> he <span class=\"wl wl-kjv\" data-code=\"G2980\">spake</span> unto them.","51":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he went <span class=\"wl wl-kjv\" data-code=\"G2597\">down</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2064\">came</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G3478\">Nazareth,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> <span class=\"wl wl-kjv\" data-code=\"G5293\">subject</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">them:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">but</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3384\">mother</span> <span class=\"wl wl-kjv\" data-code=\"G1301\">kept</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G5023\">these</span> <span class=\"wl wl-kjv\" data-code=\"G4487\">sayings</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> heart.","52":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G4298\">increased</span> in <span class=\"wl wl-kjv\" data-code=\"G4678\">wisdom</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2244\">stature,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in <span class=\"wl wl-kjv\" data-code=\"G5485\">favour</span> <span class=\"wl wl-kjv\" data-code=\"G3844\">with</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> man."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in diezelfde dagen,","tekst":"Namelijk terwijl Maria zwanger ging."},{"catchword":"Augustus,","tekst":"Deze was de tweede Romeinse keizer, volgende op Julius Cesar, den eersten; en onder zijne regering was het Romeinse rijk in zijn meeste kracht en rust. Hij heeft geregeerd omtrent zes en vijftig jaren, en dit is geschied omtrent het twee en veertigste jaar van zijn keizerrijk."},{"catchword":"de gehele wereld","tekst":"Grieks al het bewoonde; namelijk aardrijk; hetwelk verstaan moet worden zover zich het Romeinse rijk toen uitstrekte."},{"catchword":"beschreven zou worden","tekst":"Namelijk om daaruit te weten de menigte der onderdanen van het Romeinse rijk en hun vermogen, opdat een ieder naar hetzelve zou kunnen geschat worden."}],"2":[{"catchword":"eerste beschrijving geschiedde,","tekst":"Deze beschrijving wordt de eerste genaamd ten aanzien van nog een tweede, die daarna geschied is, waarvan gewag gemaakt wordt Act 5:37 , en bij Josef. Antiq. lib.18, cap.1."},{"catchword":"Cyrenius over Syrië stadhouder was","tekst":"Deze wordt in de Romeinse geschiedenissen genaamd Quirinus, die stadhouder was over gans Syrië, waarvan Judea toentertijd een deel was."}],"3":[{"catchword":"naar zijn eigen stad","tekst":"Namelijk vanwaar hij afkomstig was en waar zijn geslacht woonde."}],"4":[{"catchword":"Bethlehem genaamd wordt,","tekst":"Van deze stad zie Mic 5:1 ; Mat 2:1 , en wordt Davids stad genaamd, omdat David daar geboren en opgevoed was, 1Sa 17:12 ; Joh 7:42 ."}],"5":[{"catchword":"ondertrouwde vrouw,","tekst":"Het is wel gelofelijk dat Jozef haar nu al tot zich genomen had, volgens het bevel des engels, Mat 1:20 , maar wordt evenwel hier nog genaamd ondertrouwde, omdat zij met hem alzo leefde alsof zij maar ondertrouwd was geweest."}],"7":[{"catchword":"eerstgeboren Zoon,","tekst":"Zie hiervan Mat 1:25 ."},{"catchword":"doeken,","tekst":"Grieks windselen."}],"9":[{"catchword":"stond bij hen,","tekst":"Namelijk onverwacht en haastelijk, gelijk het Griekse woord medebrengt."},{"catchword":"heerlijkheid des Heeren omscheen hen,","tekst":"Dat is, een goddelijke glans en klaarheid."}],"10":[{"catchword":"verkondig u grote blijdschap,","tekst":"Grieks Evangeliseer; dat is, verkondig blijde tijding."},{"catchword":"al den volke wezen zal;","tekst":"Namelijk Gods volk. Zie Mat 1:21 ."}],"11":[{"catchword":"Christus, de Heere,","tekst":"Of, de Gezalfde."}],"12":[{"catchword":"het teken zijn","tekst":"Namelijk waarvan gij het kindeken kennen zult, en bevinden waar te zijn wat ik u verkondig."}],"13":[{"catchword":"heirlegers,","tekst":"Dat is, der engelen, die als een heir des Heeren zijn, door wie Hij de vromen beschermt en de kwaden straft, Psa 34:8 , en Psa 103:21 ."}],"14":[{"catchword":"Ere zij God","tekst":"Of, heerlijkheid."},{"catchword":"vrede op aarde,","tekst":"Namelijk met God, Rom 5:1 ."},{"catchword":"een welbehagen","tekst":"Dat is, het welbehagen Gods worde door hem aan de mensen vervuld, 2Th 1:11 . Anders, des welbehagens; dat is, in de mensen, die God naar zijn welbehagen heeft uitverkoren, Eph 1:5 ."}],"15":[{"catchword":"weggevaren waren naar de hemel,","tekst":"Grieks weggegaan."},{"catchword":"de herders tot elkander zeiden","tekst":"Grieks de mensen, de herders."},{"catchword":"het woord, dat er geschied is,","tekst":"Dat is, de gehele zaak. Hebreën."}],"19":[{"catchword":"overleggende die in haar hart","tekst":"Of, vergelijkende die met het andere, dat namelijk haar tevoren hiervan meer geopenbaard en geschied was, Luk 1:1 ."}],"21":[{"catchword":"vervuld waren,","tekst":"Dat is, als de achtste dag gekomen was. Zie Act 2:1 ."},{"catchword":"JEZUS,","tekst":"Zie hiervan en van de uitlegging dezes naams Mat 1:21 ."}],"22":[{"catchword":"harer reiniging vervuld waren,","tekst":"Namelijk Maria."},{"catchword":"de wet van Mozes,","tekst":"Zie van deze wet Lev 12:2 , Lev 12:4 ."}],"23":[{"catchword":"mannelijk is,","tekst":"Namelijk zowel van mensen als van gedierten, Exo 13:2 ; Num 18:15-17 ."},{"catchword":"heilig genaamd worden","tekst":"Namelijk om òf opgeofferd te worden, zo het reine gedierten waren, òf voor vijf sikkels gelost te worden, zo zij naar de wet niet opgeofferd mochten worden."}],"24":[{"catchword":"wet des Heeren gezegd is,","tekst":"Zie Lev 12:6 , Lev 12:8 , waar zulks wordt geordineerd voor geringe lieden; want de rijken moesten een jarig lam opofferen met een tortelduif, of jonge duif; het lam ten brandoffer en de duif ten zondoffer."}],"25":[{"catchword":"de Heilige Geest was op hem","tekst":"Namelijk de Geest der profetie."}],"26":[{"catchword":"niet zien zoude,","tekst":"Dat is, niet sterven."}],"27":[{"catchword":"naar de gewoonte der wet met Hem te doen;","tekst":"Grieks naar het gewoonlijke; waarvan hier tevoren gesproken is."}],"28":[{"catchword":"loofde God, en zeide","tekst":"Grieks zegende."}],"29":[{"catchword":"laat Gij, Heere","tekst":"Grieks ontbind, laat los; namelijk van dit ellendig leven, volgens uwe belofte. Zie dergelijke Phi 1:23 ."}],"30":[{"catchword":"Uw zaligheid gezien","tekst":"Of, uwe zaligmaking; dat is, Zaligmaker, en hetgeen waardoor de zaligheid teweeggebracht wordt. Zie Isa 52:10 , en Luk 3:6 ."}],"31":[{"catchword":"al de volken","tekst":"Namelijk zowel heidenen als Joden, gelijk volgt."}],"32":[{"catchword":"verlichting der heidenen,","tekst":"Grieks openbaring."}],"34":[{"catchword":"gezet tot een val en opstanding veler in Israël,","tekst":"Dat is, verordineerd, namelijk van God. Deze woorden zijn genomen uit Isa 8:14 , en worden verklaard van Paulus, Rom 9:32-33 ; 1Co 1:23-24 ; 2Co 2:16 , en 1Pe 2:6-7 . Zie aldaar de aantekeningen."},{"catchword":"een teken, dat wedersproken zal worden","tekst":"Dat is, als een doelwit waarnaar elkeen mikt en schiet."}],"35":[{"catchword":"een zwaard zal door uw eigen ziel gaan)","tekst":"Dat is, bittere smarten, voornamelijk over het lijden en sterven van dezen uwen Zoon."},{"catchword":"gedachten uit vele harten","tekst":"Dat is, hun geloof en ongeloof zal voor den dag gebracht worden. Zie 1Co 11:19 ."}],"36":[{"catchword":"tot groten ouderdom gekomen,","tekst":"Grieks tot vele dagen."}],"37":[{"catchword":"niet week uit den tempel,","tekst":"Dat is, was gedurig of dagelijks in den tempel."}],"38":[{"catchword":"beleden,","tekst":"Dat is, bekend en betuigd dat Hij de verwachte Messias was."},{"catchword":"de verlossing in Jeruzalem verwachtten","tekst":"Namelijk die beloofd was door den Messias te zullen geschieden."}],"40":[{"catchword":"werd gesterkt","tekst":"Hetzelfde wordt ook Luk 1:80 gezegd van Johannes, doch Christus heeft deze gaven ontvangen niet met mate; Joh 3:34 ."},{"catchword":"in den geest,","tekst":"Of, door den Geest."}],"41":[{"catchword":"reisden alle jaar naar Jeruzalem,","tekst":"Namelijk naar het bevel Gods; Deu 16:16 ."}],"44":[{"catchword":"in het gezelschap op den weg was,","tekst":"Namelijk dergenen, die met hen naar Nazareth wederkeerden. Want de Joden gingen naar de grote feesten met grote hopen tezamen op en keerden weder; Psa 40:5 ."}],"48":[{"catchword":"zij, Hem ziende,","tekst":"Namelijk Jozef en Maria."},{"catchword":"verslagen;","tekst":"Namelijk omdat zij zagen dat Hij, nog een kind zijnde, zich onderstaan had met zulke grote leraars te spreken en te handelen."},{"catchword":"uw vader en ik","tekst":"Namelijk JoZEf. Zo spreekt Maria naar de mening der Joden, Luk 3:23 , of omdat men ook een behuwdvader met den naam van vader placht te noemen."},{"catchword":"angst gezocht","tekst":"Grieks beangst, of benauwd zijnde."}],"49":[{"catchword":"Mijns Vaders?","tekst":"Namelijk die God mijn hemelse Vader mij heeft bevolen, en waartoe Ik van Hem in de wereld gezonden ben."}],"51":[{"catchword":"onderdanig","tekst":"Namelijk gelijk de kinderen hunne ouders schuldig zijn te gehoorzamen naar de wet, aan welke hij zichzelven had onderworpen."},{"catchword":"dingen in haar hart","tekst":"Grieks woorden."}],"52":[{"catchword":"grootte,","tekst":"Of, in ouderdom; want het Griekse woord betekent beide; Luk 19:3 ; Joh 9:21 , Joh 9:23 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass in those same days [Namely, while Mary went with child] that there went forth a command from the Emperor Augustus, [this was the second Roman Emperor succeeding Julius Caesar the first: and under his government the Roman Empire was in its greatest power and quiet: he reigned about fifty six years; and this came to pass about the two and fortieth year of his empire] that the whole world, [Gr. All the inhabited: namely, world, which must be understood as far as the Roman Empire then extended itself] Should be enrolled. [namely, thereby to know the multitude of subjects of the Roman Empire, and their abilities, that every one might be taxed according to the same.]"}],"2":[{"catchword":null,"tekst":"This first enrolling happened [ This enrolling is called the first, in respect of another which happened afterwards; whereof mention is made, Act. 5. 37. and by Josephus Antiquit. Lib. 18. cap. 1.] when Cyrenius [This man in the Roman histories is called Zutrinus, who was governor over whole Syria, whereof Judea at that time was a part] was governor of Syria."}],"3":[{"catchword":null,"tekst":"And they went all to be enrolled, every one to his own City. [Namely, from whence he descended, and where those of his family dwelt.]"}],"4":[{"catchword":null,"tekst":"And Joseph also went up from Galilee out of the City Nazareth into Judea, into the City of David which is called Bethlehem, [Of this City see Micah. 5. 1. Matth. 2. 1. and is called the City of David, because there David was born and brought up. 1 Sam. 17. ver. 1. 2. John 7. 42.] (Because he was of the house and family of David.)"}],"5":[{"catchword":null,"tekst":"To be enrolled with Marie his betrothed wife, [It is very credible that Joseph had now taken her to him, according to the command of the Angel Matth. 1. 20. but is now notwithstanding here still called betrothed, because she lived so with him, as if she had been but betrothed] who was with child."}],"6":[{"catchword":null,"tekst":"And it came to pass while they were there, that the days were fulfilled that she should bring forth."}],"7":[{"catchword":null,"tekst":"And she brought forth her first-born son, [See hereof Matth. 1. ver. 25.] and swathed him, [Gr. Or wrapped him in swathing-hands] and laid him down in the manger, because there was no place for then in the Inn."}],"8":[{"catchword":null,"tekst":"And there were shepherds in that same country, abiding in the field, and kept the night watch over their stock."}],"9":[{"catchword":null,"tekst":"And so, an Angel of the Lord stood by them, [Namely unexpected and suddenly, as the Greek word imports] and the glory of the Lord [ that is, a divine luster and brightness] shined round about them, and they feared with a great fear."}],"10":[{"catchword":null,"tekst":"And the Angel said unto them fear not, for behold I publish unto you [Gr. Evangelize that is, declare glad tidings] great joy, which shall be to all the people. [Namely, Gods people, see Matth. 1. 21.]"}],"11":[{"catchword":"Namely","tekst":"that to day is born to you the Saviour, which is Christ [ or, the anointed] the Lord, in the City of David."}],"12":[{"catchword":null,"tekst":"And this shall be the sign unto you, [ Namely, whereby ye shall know the child, and find that to be true which I declare unto you] ye shall find the babe wrapped in swathing bands, and lying in the manger."}],"13":[{"catchword":null,"tekst":"And immediately [there] was with the Angel a multitude of the heavenly host [That is, of the angels which are as an host of the Lord, by which he defends the good and punisheth the bad. Psal. 34. 8. and 103. 21.] praising God and saying,"}],"14":[{"catchword":null,"tekst":"Honour [Or, glory] [be] to God in the highest [heavens] and peace on earth, [namely, with God, Rom. 5. 1.] in men a good pleasure. [That is, the good pleasure of God be fulfilled by him towards men. 2. Thess. 1. 11. Others of the good pleasure. i.e. in the men which God hath chosen according to his good pleasure. Eph. 1, 5.]"}],"15":[{"catchword":null,"tekst":"And it came to pass when the Angels were passed away from them [Gr. Gone-away] towards heaven, that the shepherds, [Gr. The men the shepherds] said one to another, Let us now go unto Bethlehem, and let us see the word, [That is, the whole matter. Hebr.] that there is come to pass, which the lord hath made known unto us."}],"16":[{"catchword":null,"tekst":"And they came with haste and found Mary and Joseph, and the child lying in the manger."}],"17":[{"catchword":null,"tekst":"And when they had seen it, they made known all about, the word that was told them concerning this child."}],"18":[{"catchword":null,"tekst":"And all that beard it wondered at that which was told them by the shepherds."}],"19":[{"catchword":null,"tekst":"But Mary kept these words all together, pondering [them] in her heart. [or, Comparing them with the other, namely, which before was revealed to her, and came to pass hereabout, chap. 1.]"}],"20":[{"catchword":null,"tekst":"And the shepherds returned, glorifying and praising God for all that they had heard and seen, as it was spoken unto them."}],"21":[{"catchword":null,"tekst":"And when eight days were fulfilled [That is, when the eighth day was come. See Act. 2. 1.] that the child should be circumcised, his name was called Jesus. [See hereof and of the interpretation of this name, Matth. 1. ver. 21.] which was named by the Angel, before he was conceived in the womb."}],"22":[{"catchword":null,"tekst":"And when the days of her [Namely, marries] purification were fulfilled, according to the Law of Moses. [See concerning this law, Levi. 12. 2. 4.] they brought him to Jerusalem, that they might present [him] to the Lord."}],"23":[{"catchword":null,"tekst":"As it is written in the Law of the Lord, All that is male [Namely, as well of men as of beasts. Exod. 13. 2. Numb. 18. ver. 15. 16. 17.] which opened the matrix, shall be called holy to the Lord.) [namely, either to be offered up, if they were clean beasts, or to be redeemed // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
