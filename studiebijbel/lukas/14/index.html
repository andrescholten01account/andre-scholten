veel aarde had; en het kwam meteen op, omdat het geen diepte van aarde had.", "Spr 22:9": "Wie goed van oog is, zal gezegend worden; want hij heeft van zijn brood aan de arme gegeven.", "1 Kor 9:18": "Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Kol 2:16": "Laat dan niemand u oordelen over eten of drinken, of over een feestdag, nieuwe maan of sabbatten;", "Rom 12:8": "hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.", "Rom 11:17-20": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Ezech 33:1-17": "En het woord van de HEERE kwam tot mij: Mensenkind! Spreek tot de kinderen van uw volk, en zeg tegen hen: Wanneer Ik het zwaard over een land breng, en het volk van het land een man uit hun gebied neemt en hem voor zichzelf tot een wachter stelt; En hij het zwaard over het land ziet komen, en op de bazuin blaast en het volk waarschuwt;", "Lev 26:35": "Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "Matt 13:44-46": "Opnieuw, het Koninkrijk der hemelen is gelijk aan een schat, verborgen in de akker, die een mens vond en verborg, en van blijdschap daarover gaat hij heen, en verkoopt alles wat hij heeft, en koopt die akker. Opnieuw, het Koninkrijk der hemelen is gelijk aan een koopman, die mooie parels zoekt; Die, toen hij één parel van grote waarde gevonden had, heenging en alles verkocht wat hij had, en die kocht.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Deut 33:9": "Die tegen zijn vader en tegen zijn moeder zei: Ik zie hem niet; en die zijn broeders niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond.", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Jes 28:22": "Nu dan, drijf de spot niet, opdat uw banden niet vaster gemaakt worden; want ik heb van de Heere HEERE van de heerscharen een verdelging gehoord, ja, een die vast besloten is over het hele land.", "Mark 16:1": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Joh 7:23": "Als een mens de besnijdenis ontvangt op de sabbat, zodat de wet van Mozes niet gebroken wordt, bent u dan boos op Mij, omdat Ik een heel mens gezond gemaakt heb op de sabbat?", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Spr 11:13": "Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak.", "Kol 4:6": "Laat uw woord altijd aangenaam zijn, met zout besprengd, opdat u weet hoe u ieder moet antwoorden.", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Jes 47:4-10": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël. Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Joh 12:37-40": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem; Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Spr 9:2": "Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt.", "Spr 25:8-10": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben. Voer uw geschil met uw naaste; maar openbaar het geheim van een ander niet; Opdat hij die het hoort, u niet smaadt; want uw kwade reputatie zou niet worden afgewend.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Job 32:9-13": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet. Daarom zeg ik: Luister naar mij; ik zal mijn mening ook tonen. Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Matt 15:32-39": "En Jezus riep Zijn discipelen tot Zich en zei: Ik ben innerlijk met ontferming bewogen over de menigte, omdat zij nu al drie dagen bij Mij gebleven zijn, en niets hebben om te eten; en Ik wil hen niet nuchter van Mij laten gaan, zodat zij op de weg niet bezwijken. En Zijn discipelen zeiden tegen Hem: Waar zullen wij in de woestijn zoveel broden krijgen, dat wij zo'n grote menigte zouden verzadigen? En Jezus zei tegen hen: Hoeveel broden hebt u? Zij zeiden: Zeven, en een paar visjes.", "Lev 26:2": "Mijn sabbatten zult u houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Hand 28:24": "En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Luk 7:30-35": "Maar de Farizeeën en de wetgeleerden hebben het raadsbesluit van God tegen zichzelf verworpen, doordat zij zich niet door hem lieten dopen. En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk? Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "2 Sam 24:24": "Doch de koning zei tegen Arauna: Nee, maar ik zal het zeker van u kopen voor de prijs; want ik zal de HEERE, mijn God, geen brandoffers offeren die mij niets kosten. Zo kocht David de dorsvloer en de runderen voor vijftig zilveren sikkels.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Jer 5:12-14": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien. Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren. Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Ezech 31:10-14": "Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over uw stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte; daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, zodat die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid. En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Spr 26:19": "zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?", "Rom 8:35": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Luk 7:14": "En Hij kwam erbij en raakte de baar aan; (de dragers stonden toen stil) en Hij zei: Jongeman, Ik zeg u: sta op!", "1 Joh 2:22": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Hebr 3:10-12": "Daarom was Ik vertoornd over dat geslacht, en zei: Altijd dwalen zij met hun hart, en zij hebben Mijn wegen niet gekend. Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan! Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Rom 9:32": "Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "Luk 11:44": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u bent als de graven die niet zichtbaar zijn, en de mensen die daaroverheen lopen, weten het niet.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "2 Tess 2:3": "Laat niemand u op enige manier verleiden; want die dag komt niet, tenzij eerst de afval gekomen is, en de mens van de zonde geopenbaard wordt, de zoon van het verderf;", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "Fil 4:6": "Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Matt 16:24": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Rom 1:5": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam;", "Spr 14:20": "De arme wordt zelfs door zijn vriend gehaat; maar de liefhebbers van de rijke zijn met velen.", "Jes 5:18-25": "Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen! Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen! Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Jes 29:12": "Of men geeft het boek aan iemand die niet lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet lezen.", "Joh 6:66": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee.", "Matt 22:2-13": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ex 32:22-24": "Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade. Zij zeiden namelijk tegen mij: Maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft opgevoerd, weten wij niet wat er van hem geworden is. Toen zei ik tegen hen: Wie goud heeft, laat die het afrukken en aan mij geven; en ik wierp het in het vuur, en dit kalf is eruit gekomen.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Gal 5:11": "Maar ik, broeders! Als ik nog de besnijdenis predik, waarom word ik dan nog vervolgd? Dan is de ergernis van het kruis verdwenen.", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "1 Joh 2:15-17": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem. Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld. En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Matt 6:1-4": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is. Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen. Maar als u aalmoes doet, laat uw linkerhand dan niet weten wat uw rechterhand doet;", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Job 20:4-29": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Fil 3:11": "Of ik op enige manier mag komen tot de opstanding van de doden.", "Hebr 12:15-17": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden. Dat niemand een hoereerder is, of een onheilige, zoals Ezau, die om één voedsel zijn eerstgeboorterecht wegdeed. Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Matt 11:29": "Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Hos 10:11": "Omdat Efraïm een vaars is, gewend om graag te dorsen, ben Ik over de schoonheid van haar hals heengegaan; Ik zal Efraïm laten rijden, Juda zal ploegen, Jakob zal voor zich eggen.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Hand 12:20": "En Herodes was zeer verbolgen op de Tyriërs en Sidoniërs; maar zij kwamen eensgezind naar hem toe, en nadat zij Blastus, de kamerheer van de koning, hadden overreed, vroegen zij om vrede, omdat hun land werd bevoorraad vanuit het land van de koning.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Jer 8:10": "Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.", "Deut 29:20": "De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Jes 56:2": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.", "Spr 11:9": "De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Hand 28:28": "Laat het u dan bekend zijn dat de zaligheid van God naar de heidenen gezonden is, en die zullen horen.", "Matt 22:2-10": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Hebr 2:4-8": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil. Want Hij heeft de toekomende wereld, waar wij van spreken, niet aan de engelen onderworpen. Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet!", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "Ef 4:2": "Met alle nederigheid en zachtmoedigheid, met geduld, terwijl u elkaar verdraagt in liefde;", "Ex 20:8-11": "Gedenk de sabbatdag, dat u die heiligt. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Gen 11:4-9": "En zij zeiden: Kom aan, laten we voor onszelf een stad bouwen, en een toren, waarvan de top tot in de hemel reikt, en laten we voor onszelf een naam maken, opdat wij niet misschien over de hele aarde verstrooid worden! Toen kwam de HEERE neer, om de stad en de toren te bekijken, die de kinderen van de mensen bouwden. En de HEERE zei: Zie, zij zijn één volk, en hebben allen dezelfde taal; en dit is het waarmee zij beginnen te doen; maar nu zou niets van wat zij bedacht hebben te doen, hun onmogelijk zijn?", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Job 7:15": "Zodat mijn ziel de verworging kiest; de dood meer dan mijn beenderen.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Deut 5:21": "En u zult niet begeren de vrouw van uw naaste; en u zult zich niet laten gelusten naar het huis van uw naaste, zijn akker, noch zijn dienstknecht, noch zijn dienstmaagd, zijn os, noch zijn ezel, noch iets dat van uw naaste is.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Ef 1:9": "Ons bekendgemaakt hebbend het geheimenis van Zijn wil, naar Zijn welbehagen, dat Hij voorgenomen had in Zichzelf.", "Luk 9:46-48": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn. Maar Jezus, die de gedachte van hun hart zag, nam een kind en zette dat naast Zich, en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Matt 5:13": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Job 29:15": "Voor de blinden was ik ogen, en voor de kreupelen was ik voeten.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Spr 30:13": "Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Spr 21:22": "De wijze beklimt de stad van de geweldigen, en werpt de sterkte van hun vertrouwen neer.", "Lev 19:10": "Evenzo zult u uw wijngaard niet nalezen, en de afgevallen bessen van uw wijngaard niet opzamelen; de arme en de vreemdeling zult u die overlaten; Ik ben de HEERE, uw God!", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Joh 11:25": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven;", "Fil 2:3-11": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf. Laat ieder niet alleen op zijn eigen zaken zien, maar ieder ook op wat van de anderen is. Want laat die gezindheid in u zijn, die ook in Christus Jezus was;", "Ps 110:3": "Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Luk 13:30": "En zie, er zijn laatsten die de eersten zullen zijn, en er zijn eersten die de laatsten zullen zijn.", "1 Sam 8:20": "en wij zullen ook zijn zoals alle volken; en onze koning zal ons richten, en hij zal voor ons uit gaan, en hij zal onze oorlogen voeren.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "2 Kor 13:5-7": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent. Maar ik hoop dat u zult begrijpen, dat wij niet verwerpelijk zijn. En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Num 20:13": "Dit zijn de wateren van Meriba, waar de kinderen van Israël met de HEERE getwist hebben; en Hij werd aan hen geheiligd.", "Jak 2:15": "Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel;", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "1 Petr 4:4": "waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;", "Matt 18:8": "Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Jes 30:4": "Wanneer zijn vorsten in Zoan zullen zijn geweest, en zijn gezanten tot dichtbij Chanes zullen zijn gekomen;", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Matt 22:9": "Ga daarom naar de kruispunten van de wegen, en roep zovelen als u er zult vinden, naar de bruiloft.", "Gen 29:30": "En hij kwam ook bij Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog zeven andere jaren.", "Hebr 5:9": "En nadat Hij volmaakt gemaakt was, is Hij voor allen die Hem gehoorzaam zijn een oorzaak van eeuwige zaligheid geworden;", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Luk 19:8": "En Zacheüs stond op en zei tegen de Heere: Zie, Heere, de helft van mijn bezit geef ik aan de armen; en als ik iemand iets door bedrog afhandig gemaakt heb, geef ik dat viervoudig terug.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "1 Kon 1:9": "En Adonia slachtte schapen en runderen en gemest vee bij de steen Zoheleth, die bij de bron Rogel is; en nodigde al zijn broers, de zonen van de koning, en alle mannen van Juda, de knechten van de koning.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Matt 23:12": "En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Matt 12:1": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt.", "Gen 6:5-7": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was. Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart. En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Matt 13:58": "En Hij heeft daar niet veel krachten gedaan, vanwege hun ongeloof.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Deut 24:12-21": "Maar als hij een arme man is, zult u met zijn pand niet neerliggen. U zult hem dat pand zeker teruggeven, als de zon ondergaat, zodat hij in zijn kleed neerligt, en u zegent; en het zal u gerechtigheid zijn voor het aangezicht van de HEERE, uw God. U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Matt 25:41-45": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is. Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven; Ik was een vreemdeling; en u hebt Mij geen onderkomen gegeven; naakt, en u hebt Mij niet gekleed; ziek, en in de gevangenis, en u hebt Mij niet bezocht.", "Matt 10:37-39": "Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard. En wie zijn kruis niet op zich neemt, en Mij navolgt, is Mij niet waard. Wie zijn ziel vindt, zal die verliezen; en wie zijn ziel verloren zal hebben om Mij, zal die vinden.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "Hand 16:26": "En er gebeurde plotseling een grote aardbeving, zodat de fundamenten van de kerker schudden; en meteen gingen alle deuren open, en de boeien van allen raakten los.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Ps 95:8-11": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen. Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Spr 1:17": "Zeker, het net wordt tevergeefs gespreid voor de ogen van allerlei gevogelte;", "Rom 15:9-12": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen. En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk! En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Luk 16:1-13": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte. En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn. En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Spr 22:27": "Als u niets hebt om te betalen, waarom zou men uw bed van onder u wegnemen?", "Ps 39:7": "Zeker, de mens wandelt als in een beeld, zeker, zij maken zich druk voor niets; men brengt bijeen, en men weet niet, wie het naar zich toe zal halen.", "Fil 3:8": "Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen,", "Matt 22:10": "En diezelfde dienstknechten gingen de wegen op en brachten allen bijeen die zij vonden, zowel slechten als goeden; en de bruiloft werd vervuld met gasten die aanzaten.", "Hos 8:3": "Israël heeft het goede verstoten; de vijand zal hem vervolgen.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Joh 6:26": "Jezus antwoordde hun en zei: Voorwaar, voorwaar, Ik zeg u: u zoekt Mij niet omdat u tekenen gezien hebt, maar omdat u van de broden gegeten hebt en verzadigd bent.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Mal 2:13": "Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "Luk 3:11": "En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen.", "1 Kor 10:6": "En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "Spr 31:7": "dat hij drinkt en zijn armoede vergeet, en aan zijn moeite niet meer denkt.", "Jes 24:7-11": "De most treurt, de wijnstok kwijnt weg, allen die blijhartig waren, zuchten. De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust. Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Jer 12:2": "U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.", "Matt 12:11": "En Hij zei tegen hen: Wie onder u is er die een schaap heeft, en als dat op een sabbatdag in een greppel valt, zal hij het niet vastpakken en eruit heffen?", "Amos 5:13": "Daarom zal de verstandige in die tijd zwijgen, want het zal een slechte tijd zijn.", "Jes 16:4": "Laat mijn verdrevenen bij u wonen, o Moab! Wees u hun een schuilplaats voor het aangezicht van de verwoester; want de onderdrukker heeft een einde, de verwoesting is opgehouden, de vertreders zijn van de aarde verdwenen.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Luk 17:10": "Zo ook u: wanneer u alles gedaan hebt wat u bevolen is, zeg dan: Wij zijn onnutte dienstknechten; want wij hebben alleen maar gedaan wat wij verplicht waren te doen.", "Matt 6:2": "Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen.", "Matt 22:5": "Maar zij trokken zich er niets van aan en gingen weg, de een naar zijn akker, de ander naar zijn handel.", "Luk 6:7": "En de Schriftgeleerden en de Farizeeën letten scherp op Hem, of Hij op de sabbat zou genezen, opdat zij een beschuldiging tegen Hem konden vinden.", "Spr 1:20-25": "De opperste Wijsheid roept overluid daarbuiten; Zij verheft Haar stem op de straten. Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad; U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Luk 24:29": "En zij drongen bij Hem aan en zeiden: Blijf bij ons, want het is bijna avond, en de dag is bijna voorbij. En Hij ging naar binnen om bij hen te blijven.", "Job 25:6": "Hoeveel te minder de mens, die een made is, en het mensenkind, die een worm is!", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Job 21:11-15": "Hun jonge kinderen zenden zij uit als een kudde, en hun kinderen huppelen. Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit. In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Matt 18:2-4": "En Jezus riep een kind bij Zich en zette het in hun midden, en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan. Wie zichzelf dan zal vernederen zoals dit kind, die is de belangrijkste in het Koninkrijk der hemelen.", "Jer 23:34": "En aangaande de profeet, of de priester, of het volk, dat zal zeggen: De last van de HEERE; dat Ik bezoeking zal doen over die man en over zijn huis.", "Spr 22:3": "Een verstandig mens ziet het kwaad en verbergt zich; maar de eenvoudigen gaan door en worden gestraft.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "Spr 23:2": "En zet een mes op uw keel, als u een gulzig mens bent;", "Luk 12:18-20": "En hij zei: Dit zal ik doen: ik zal mijn schuren afbreken en grotere bouwen, en daar zal ik al mijn koren en mijn goederen verzamelen; en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk. Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Hebr 3:16-19": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Rom 10:7": "Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen.", "Matt 3:1-12": "En in die dagen kwam Johannes de Doper, en preekte in de woestijn van Judea, en zei: Bekeer u; want het Koninkrijk der hemelen is nabij gekomen. Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Joh 7:13": "Toch sprak niemand vrijmoedig over Hem, uit vrees voor de Joden.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Job 13:16": "Ook zal Hij mij tot heil zijn; maar een huichelaar zal voor Zijn aangezicht niet komen.", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Zach 7:6": "Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "Deut 16:11": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Num 11:21-23": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten! Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is? Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Luk 9:1-5": "Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen. En Hij zond hen erop uit om het Koninkrijk van God te prediken, en om de zieken gezond te maken. En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Jak 5:5": "U hebt lekker geleefd op de aarde, en wellust nagejaagd; u hebt uw harten gevoed als op een dag van slachting.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Matt 6:25": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding?", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Jes 25:10": "Want de hand van de HEERE zal op deze berg rusten; maar Moab zal onder Hem verdorst worden, zoals het stro verdorst wordt tot mest.", "2 Kor 9:5-7": "Ik heb dan nodig geacht deze broeders te vermanen, dat zij eerst tot u zouden komen en van tevoren uw eerder aangediende zegen klaarmaken; zodat die gereed is, als een zegen, en niet als een vrekkigheid. En dit zeg ik: wie spaarzaam zaait, zal ook spaarzaam maaien; en wie in zegeningen zaait, zal ook in zegeningen maaien. Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Openb 15:1-8": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd. En ik zag als een glazen zee, met vuur gemengd; en zij die de overwinning hadden behaald op het beest, en op zijn beeld, en op zijn merkteken, en op het getal van zijn naam, stonden aan de glazen zee, met de citers van God. En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Spr 20:5": "De raad in het hart van een man is als diepe wateren; maar een man van verstand zal die naar boven halen.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "1 Kor 1:28": "En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Luk 12:27": "Kijk naar de lelies, hoe zij groeien; zij werken niet en spinnen niet; en Ik zeg u: zelfs Salomo in al zijn heerlijkheid was niet gekleed als één van deze.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "Luk 4:31": "En Hij kwam af naar Kapernaüm, een stad van Galilea, en leerde hen op de sabbatdagen.", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Hand 4:1": "Terwijl zij tot het volk spraken, kwamen de priesters, en de hoofdman van de tempel, en de Sadduceeën op hen af,", "Hebr 12:16": "Dat niemand een hoereerder is, of een onheilige, zoals Ezau, die om één voedsel zijn eerstgeboorterecht wegdeed.", "Jes 33:23": "Uw touwen zijn slap geworden, zij zullen hun mast niet goed stijf kunnen houden, zij zullen het zeil niet kunnen uitspannen; dan zal de roof van een overvloedige buit uitgedeeld worden, zelfs zullen de lammen de roof roven.", "Hand 17:18": "En sommigen van de Epicureïsche en Stoïcijnse wijsgeren streden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Luk 16:16": "De wet en de profeten zijn tot op Johannes; van die tijd af wordt het Koninkrijk van God verkondigd, en ieder doet geweld op datzelfde.", "2 Tess 2:7-12": "Want de verborgenheid van de onrechtvaardigheid werkt al; alleen, Hij die hem nu weerhoudt, zal hem blijven weerhouden, totdat hij uit het midden weggedaan wordt. En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen;", "Jak 2:1-4": "Mijn broeders, houd het geloof van onze Heere Jezus Christus, de Heere der heerlijkheid, niet met aanneming van de persoon. Want als er in uw samenkomst een man binnenkomt met een gouden ring aan de vinger, in sierlijke kleding, en er komt ook een arme man binnen met slechte kleding; en u zou opzien tegen hem die de sierlijke kleding draagt, en tegen hem zeggen: Ga hier op een goede plaats zitten; en zou tegen de arme zeggen: Ga daar staan, of: Ga hier onder mijn voetbank zitten;", "Joh 19:17": "En Hij droeg Zijn kruis, en ging uit naar de plaats genaamd Hoofdschedelplaats, die in het Hebreeuws Golgotha genoemd wordt;", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Ex 23:11": "Maar in het zevende jaar zult u het laten rusten en braak laten liggen, zodat de armen van uw volk kunnen eten, en wat overblijft, de dieren van het veld kunnen eten. Zo zult u ook doen met uw wijngaard en met uw olijfbomen.", "Spr 15:22": "Plannen worden tenietgedaan als er geen overleg is; maar door veel raadgevers komen ze tot stand.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Hand 13:40": "Kijk dan uit, dat over u niet komt wat gezegd is in de profeten:", "Jes 66:3-5": "Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is als die zwijnenbloed offert; wie wierook brandt tot een gedenkoffer, is als die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels. Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde. Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Pred 10:1": "Een dode vlieg doet de zalf van de apotheker stinken en opwellen; zo doet een weinig dwaasheid met een man die kostelijk is van wijsheid en van eer.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Joh 1:11": "Hij is gekomen tot het Zijne, en de Zijnen hebben Hem niet aangenomen.", "Joh 6:71": "En Hij zei dit over Judas, de zoon van Simon, Iskariot; want deze zou Hem verraden, hoewel hij een van de twaalf was.", "Ps 37:21": "Lamed. De goddeloze leent en geeft niet terug; maar de rechtvaardige ontfermt zich, en geeft.", "Job 22:29": "Als men iemand vernederen zal, en u zult zeggen: Er is verhoging; dan zal God de nederige van ogen behouden.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "2 Kor 10:12": "Want wij durven onszelf niet rekenen tot of vergelijken met sommigen, die zichzelf prijzen; maar zij begrijpen niet, dat zij zichzelf met zichzelf meten, en zichzelf met zichzelf vergelijken.", "1 Joh 3:17-19": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Joh 12:32": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken.", "Matt 6:16": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Jer 45:5": "En zou u voor uzelf grote dingen zoeken? Zoek ze niet; want zie, Ik breng een kwaad over alle vlees, spreekt de HEERE; maar Ik zal u uw leven tot een buit geven, in alle plaatsen waarheen u zult heentrekken.", "Rom 10:14": "Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Matt 10:39": "Wie zijn ziel vindt, zal die verliezen; en wie zijn ziel verloren zal hebben om Mij, zal die vinden.", "Mal 1:11": "Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.", "1 Kon 19:19-21": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem. En hij liet de runderen achter, en liep Elia achterna, en zei: Laat mij toch mijn vader en mijn moeder kussen, daarna zal ik u volgen. En hij zei tegen hem: Ga, keer terug; want wat heb ik u gedaan? Zo keerde hij van achter hem terug, en nam een span runderen, en slachtte het, en met het gereedschap van de runderen kookte hij hun vlees, dat hij aan het volk gaf; en zij aten. Daarna stond hij op, en volgde Elia, en diende hem.", "Hand 18:4": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof.", "Jer 48:15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "2 Kron 31:21": "En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "1 Tess 3:4": "Want ook toen wij bij u waren, zeiden wij u van tevoren dat wij verdrukt zouden worden, zoals ook gebeurd is, en u weet het.", "Joh 9:39": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden.", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "1 Sam 15:17": "En Samuël zei: Is het niet zo, toen u klein was in uw eigen ogen, dat u het hoofd van de stammen van Israël geworden bent, en dat de HEERE u tot koning over Israël gezalfd heeft?", "Matt 12:12": "Hoeveel gaat een mens dan een schaap te boven! Daarom is het op de sabbatdagen geoorloofd goed te doen.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Rom 11:17-21": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Pred 2:17-19": "Daarom haatte ik dit leven, want dit werk dat onder de zon gebeurt, leek mij slecht; want het is allemaal ijdelheid en kwelling van de geest. Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal. Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.", "Joh 11:51": "En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "Ex 16:23-30": "Hij dan zei tegen hen: Dit is het, wat de HEERE gesproken heeft: Morgen is de rustdag, de heilige sabbat van de HEERE! Wat u bakken wilt, bak dat, en kook wat u koken wilt; en al wat overblijft, legt dat voor uzelf weg in bewaring tot de morgen. En zij legden het weg tot de morgen, zoals Mozes geboden had; en het stonk niet, en er zat geen worm in. Toen zei Mozes: Eet dat vandaag, want vandaag is het de sabbat van de HEERE; vandaag zult u het op het veld niet vinden.", "Luk 13:15": "De Heere dan antwoordde hem en zei: Huichelaar, maakt niet ieder van u op de sabbat zijn os of ezel los van de kribbe, en leidt hem weg om hem te laten drinken?", "Spr 17:18": "Een mens zonder verstand slaat de hand erop, en stelt zich borg bij zijn naaste.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Matt 11:5": "De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Job 13:5": "Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen.", "Ezech 18:21-23": "Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Ezech 12:23": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen.", "Ps 145:18": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.", "Pred 7:16": "Wees niet al te rechtvaardig, en houd uzelf ook niet al te wijs; waarom zou u verwoesting over u brengen?", "Spr 7:10-21": "En zie, een vrouw ontmoette hem in hoerenversiersel, en met het hart op haar hoede; Deze was druk en opstandig, haar voeten bleven in haar huis niet; Nu buiten, dan op de straten zijnde, en bij alle hoeken loerend;", "Job 31:16-20": "Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten; En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft; (Want van mijn jonkheid af is hij bij mij opgetogen, als bij een vader, en van mijner moeders buik af heb ik haar geleid;)", "Luk 6:9": "Toen zei Jezus tegen hen: Ik zal u iets vragen: Is het geoorloofd op de sabbatten goed te doen, of kwaad te doen; een mens te behouden, of te laten omkomen?", "2 Tim 4:10": "Want Demas heeft mij verlaten, omdat hij de tegenwoordige wereld heeft liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Hand 8:18": "En toen Simon zag dat door het opleggen van de handen van de apostelen de Heilige Geest gegeven werd, bood hij hun geld aan,", "Kol 1:20-23": "en dat Hij, door Hem vrede gemaakt te hebben door het bloed van Zijn kruis, door Hem, zeg ik, alle dingen met Zichzelf verzoenen zou, hetzij de dingen die op de aarde, hetzij de dingen die in de hemelen zijn. En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend, in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Spr 21:4": "Hoogheid van de ogen, en trotsheid van het hart, en de ploeging van de goddelozen, zijn zonde.", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Luk 14:28-30": "Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken? Anders zou het kunnen gebeuren dat, als hij het fundament gelegd heeft en het niet kan afmaken, iedereen die het ziet hem begint te bespotten, en zegt: Deze man is begonnen te bouwen, en heeft het niet kunnen afmaken.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Jes 51:5": "Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "1 Petr 5:3": "ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Ps 50:16": "Maar tegen de goddeloze zegt God: Wat hebt u Mijn inzettingen te vertellen, en neemt u Mijn verbond in uw mond?", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Gen 12:1": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.", "Ps 10:3": "Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.", "Rom 8:11": "En als de Geest van Hem, Die Jezus uit de doden opgewekt heeft, in u woont, zal Hij, Die Christus uit de doden opgewekt heeft, ook uw sterfelijke lichamen levend maken door Zijn Geest, Die in u woont.", "Ps 75:5-7": "Ik heb gezegd tot de onzinnigen: Wees niet onzinnig; en tot de goddelozen: Verhoog de hoorn niet. Verhoog uw hoorn niet omhoog; spreek niet met stijve hals. Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Hand 1:1": "Het eerste boek heb ik gemaakt, o Theofilus, over alles wat Jezus begonnen heeft te doen en te leren,", "Mark 16:15": "En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen.", "2 Kron 11:16": "Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "2 Tess 3:2": "En opdat wij verlost mogen worden van de ongeschikte en boze mensen; want het geloof is niet ieders deel.", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "Gen 29:31": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Mark 8:34": "En Hij riep de menigte tot Zich, samen met Zijn discipelen, en zei tegen hen: Wie achter Mij aan wil komen, die verloochent zichzelf, en neemt zijn kruis op, en volgt Mij.", "Ps 2:12": "Kust de Zoon, opdat Hij niet toornt, en u op de weg vergaat, wanneer Zijn toorn maar een weinig zou ontbranden. Gelukkig zijn allen die op Hem vertrouwen.", "Luk 9:44": "Neem deze woorden ter harte: want de Zoon des mensen zal overgeleverd worden in de handen van mensen.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Job 34:30": "Opdat de huichelachtige mens niet meer regeert, en geen strikken van het volk zijn.", "1 Tess 3:5": "Daarom heb ik ook, omdat ik het verlangen niet langer kon verdragen, hem gezonden om uw geloof te leren kennen; of de verzoeker u misschien niet had verzocht, en onze arbeid tevergeefs zou zijn.", "Rom 8:12": "Dus, broeders, wij zijn het niet aan het vlees verschuldigd om naar het vlees te leven.", "Luk 14:1-24": "En het gebeurde, toen Hij in het huis van een van de leiders van de Farizeeën gekomen was, op de sabbat, om brood te eten, dat zij Hem in de gaten hielden. En zie, er was een zeker waterzuchtig mens voor Hem. En Jezus antwoordde en zei tegen de wetgeleerden en Farizeeën: Is het ook geoorloofd op de sabbat gezond te maken?", "Openb 19:9": "En hij zei tegen mij: Schrijf, zalig zijn zij die geroepen zijn tot het avondmaal van de bruiloft van het Lam. En hij zei tegen mij: Deze zijn de waarachtige woorden van God.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Luk 14:1-6": "En het gebeurde, toen Hij in het huis van een van de leiders van de Farizeeën gekomen was, op de sabbat, om brood te eten, dat zij Hem in de gaten hielden. En zie, er was een zeker waterzuchtig mens voor Hem. En Jezus antwoordde en zei tegen de wetgeleerden en Farizeeën: Is het ook geoorloofd op de sabbat gezond te maken?", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Jes 24:4": "Het land treurt, het verwelkt; het aardrijk kwijnt weg, het verwelkt; de hoogsten van het volk van het land kwijnen weg.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Joh 11:52": "en niet alleen voor dat volk, maar ook opdat Hij de kinderen van God die verstrooid waren, tot één zou samenbrengen.", "Jak 1:7": "Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Hebr 6:4-8": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest, en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw, en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "Hab 1:15": "Hij trekt ze allen met de vishaak op, hij vergadert ze in zijn sleepnet, en hij verzamelt ze in zijn net; daarom verblijdt hij zich en verheugt hij zich.", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Jer 51:13": "U, die aan veel water woont, die machtig bent van schatten! Uw einde is gekomen, de maat van uw gierigheid.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Job 29:16": "Ik was voor de behoeftigen een vader; en het geschil dat ik niet kende, dat onderzocht ik.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "2 Tim 4:4": "en zij zullen hun oren van de waarheid afkeren, en zich wenden tot fabels.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om h
