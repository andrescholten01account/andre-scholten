<style>

g","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen.","2":"En Hij zond hen erop uit om het Koninkrijk van God te prediken, en om de zieken gezond te maken.","3":"En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.","4":"En in welk huis u ook binnengaat, blijf daar, en vertrek pas vandaar.","5":"En wie u niet zullen ontvangen, schud bij het weggaan uit die stad het stof van uw voeten af, tot een getuigenis tegen hen.","6":"En zij gingen op weg en trokken door alle dorpen, en verkondigden overal het Evangelie en genazen de zieken.","7":"En Herodes, de viervorst, hoorde alles wat er door Hem gebeurde; en hij wist niet wat hij ervan moest denken, omdat sommigen zeiden dat Johannes uit de doden was opgestaan,","8":"en anderen, dat Elia verschenen was; en weer anderen, dat een van de profeten van vroeger was opgestaan.","9":"En Herodes zei: Johannes heb ik onthoofd; wie is Deze dan, van Wie ik zulke dingen hoor? En hij probeerde Hem te zien.","10":"En de apostelen keerden terug en vertelden Hem alles wat zij gedaan hadden. En Hij nam hen mee en trok Zich met hen alleen terug naar een eenzame plaats bij de stad die Bethsaïda heet.","11":"Maar de menigten kwamen dit te weten en volgden Hem; en Hij ontving hen, en sprak tot hen over het Koninkrijk van God; en Hij maakte hen gezond die genezing nodig hadden.","12":"En de dag begon te dalen; en de twaalf kwamen naar Hem toe en zeiden tegen Hem: Stuur de menigte weg, zodat zij naar de omliggende dorpen en gehuchten kunnen gaan om onderdak te vinden en voedsel, want hier zijn wij op een eenzame plaats.","13":"Maar Hij zei tegen hen: Geeft u hun te eten. En zij zeiden: Wij hebben niet meer dan vijf broden en twee vissen; of we zouden op pad moeten gaan om voor al dit volk voedsel te kopen.","14":"Want er waren ongeveer vijfduizend mannen. Maar Hij zei tegen Zijn discipelen: Laat hen neerzitten in groepen van vijftig.","15":"En zij deden zo, en lieten hen allen neerzitten.","16":"En Hij nam de vijf broden en de twee vissen, keek op naar de hemel, zegende ze, brak ze, en gaf ze aan de discipelen om ze aan de menigte voor te leggen.","17":"En zij aten en werden allen verzadigd; en wat er van de brokken overbleef, werd opgehaald: twaalf korven.","18":"En het gebeurde, terwijl Hij eens alleen aan het bidden was en de discipelen bij Hem waren, dat Hij hun vroeg: Wie zeggen de menigten dat Ik ben?","19":"En zij antwoordden en zeiden: Johannes de Doper; en anderen: Elia; en weer anderen: dat een van de profeten van vroeger is opgestaan.","20":"En Hij zei tegen hen: Maar u, wie zegt u dat Ik ben? En Petrus antwoordde en zei: De Christus van God.","21":"En Hij drukte hun scherp op het hart en gebood hun dit aan niemand te vertellen,","22":"en Hij zei: De Zoon des mensen moet veel lijden, en verworpen worden door de oudsten, overpriesters en Schriftgeleerden, en gedood worden en op de derde dag opgewekt worden.","23":"En Hij zei tegen allen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen en dagelijks zijn kruis opnemen, en Mij volgen.","24":"Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden.","25":"Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden?","26":"Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.","27":"En Ik zeg u naar waarheid: er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij het Koninkrijk van God gezien hebben.","28":"En het gebeurde ongeveer acht dagen na deze woorden, dat Hij Petrus, Johannes en Jakobus meenam en de berg opklom om te bidden.","29":"En terwijl Hij bad, veranderde het aanzien van Zijn gezicht, en Zijn kleding werd wit en schitterend.","30":"En zie, twee mannen spraken met Hem; dat waren Mozes en Elia,","31":"die in heerlijkheid verschenen en spraken over Zijn heengaan, dat Hij te Jeruzalem zou volbrengen.","32":"Petrus nu en zij die bij hem waren, waren zwaar van slaap; en toen zij wakker werden, zagen zij Zijn heerlijkheid en de twee mannen die bij Hem stonden.","33":"En het gebeurde, terwijl zij van Hem weggingen, dat Petrus tegen Jezus zei: Meester, het is goed dat wij hier zijn; laten wij drie tenten maken, één voor U, één voor Mozes en één voor Elia — hij wist niet wat hij zei.","34":"Terwijl hij dit zei, kwam er een wolk en overschaduwde hen; en zij werden bang toen zij de wolk in gingen.","35":"En er kwam een stem uit de wolk, die zei: Dit is Mijn geliefde Zoon; luister naar Hem!","36":"En toen de stem geklonken had, werd Jezus alleen aangetroffen. En zij zwegen erover, en vertelden in die dagen aan niemand iets van wat zij gezien hadden.","37":"En het gebeurde de volgende dag, toen zij van de berg afdaalden, dat een grote menigte Hem tegemoet kwam.","38":"En zie, een man uit de menigte riep uit: Meester, ik smeek U, kijk toch naar mijn zoon, want hij is mijn enig kind.","39":"En zie, een geest grijpt hem, en plotseling roept hij, en de geest scheurt hem zodat hij schuimt, en wijkt nauwelijks van hem, en verplettert hem daarbij.","40":"En ik heb Uw discipelen gevraagd hem uit te werpen, en zij konden het niet.","41":"En Jezus antwoordde en zei: O ongelovig en verdorven geslacht, hoe lang zal Ik nog bij u zijn en u verdragen? Breng uw zoon hier.","42":"En terwijl hij nog naderbij kwam, wierp de duivel hem neer en verscheurde hem; maar Jezus bestrafte de onreine geest, en maakte het kind gezond, en gaf het terug aan zijn vader.","43":"En zij stonden allen versteld over de grote macht van God. En terwijl allen zich verwonderden over alles wat Jezus deed, zei Hij tegen Zijn discipelen:","44":"Neem deze woorden ter harte: want de Zoon des mensen zal overgeleverd worden in de handen van mensen.","45":"Maar zij begrepen dit woord niet, en het was voor hen verborgen, zodat zij het niet doorhadden; en zij waren bang Hem naar dat woord te vragen.","46":"En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.","47":"Maar Jezus, die de gedachte van hun hart zag, nam een kind en zette dat naast Zich,","48":"en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.","49":"En Johannes antwoordde en zei: Meester, wij hebben iemand gezien die in Uw Naam de duivelen uitwierp, en wij hebben het hem verboden, omdat hij U niet met ons volgt.","50":"En Jezus zei tegen hem: Verbied het niet, want wie niet tegen ons is, is voor ons.","51":"En het gebeurde, toen de dagen van Zijn opneming vervuld werden, dat Hij vastbesloten Zijn gezicht richtte om naar Jeruzalem te reizen.","52":"En Hij zond boden voor Zich uit; en zij gingen op weg en kwamen in een dorp van de Samaritanen om voor Hem alles klaar te maken.","53":"Maar zij ontvingen Hem niet, omdat Hij duidelijk op weg was naar Jeruzalem.","54":"Toen Zijn discipelen Jakobus en Johannes dit zagen, zeiden zij: Heere, wilt U dat wij zeggen dat er vuur uit de hemel neerdaalt om hen te verslinden, zoals ook Elia gedaan heeft?","55":"Maar Hij keerde Zich om, bestrafte hen en zei: U weet niet wat voor geest u hebt.","56":"Want de Zoon des mensen is niet gekomen om het leven van mensen te vernietigen, maar om het te behouden. En zij gingen naar een ander dorp.","57":"En het gebeurde onderweg, terwijl zij reisden, dat iemand tegen Hem zei: Heere, ik zal U volgen waar U ook heengaat.","58":"En Jezus zei tegen hem: De vossen hebben holen, en de vogels onder de hemel nesten; maar de Zoon des mensen heeft geen plaats om het hoofd neer te leggen.","59":"En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven.","60":"Maar Jezus zei tegen hem: Laat de doden hun doden begraven; maar gaat u heen en verkondig het Koninkrijk van God.","61":"En ook een ander zei: Heere, ik zal U volgen; maar sta mij toe dat ik eerst afscheid neem van hen die in mijn huis zijn.","62":"En Jezus zei tegen hem: Niemand die zijn hand aan de ploeg slaat en achterom kijkt, is geschikt voor het Koninkrijk van God."},"SV":{"1":"En Zijn twaalf discipelen samengeroepen hebbende, gaf Hij hun kracht en macht over al de duivelen, en om ziekten te genezen.","2":"En Hij zond hen heen, om te prediken het Koninkrijk Gods, en de kranken gezond te maken.","3":"En Hij zeide tot hen: Neemt niets mede tot den weg, noch staven, noch male, noch brood, noch geld; noch iemand van u zal twee rokken hebben.","4":"En in wat huis gij ook zult ingaan, blijft aldaar, en gaat van daar uit.","5":"En zo wie u niet zullen ontvangen, uitgaande van die stad, schudt ook het stof af van uw voeten, tot een getuigenis tegen hen.","6":"En zij, uitgaande, doorgingen al de vlekken, verkondigende het Evangelie, en genezende *de* *zieken* overal.","7":"En Herodes, de viervorst, hoorde al de dingen, die van Hem geschiedden; en was twijfelmoedig, omdat van sommigen gezegd werd, dat Johannes van de doden was opgestaan.","8":"En van sommigen, dat Elias verschenen was; en *van* anderen, dat een profeet van de ouden was opgestaan.","9":"En Herodes zeide: Johannes heb ik onthoofd; wie is nu Deze, van Welken ik zulke dingen hoor? En hij zocht Hem te zien.","10":"En de apostelen, wedergekeerd zijnde, verhaalden Hem al wat zij gedaan hadden. En Hij nam hen mede en vertrok alleen in een woeste plaats der stad, genaamd Bethsaida.","11":"En de scharen, *dat* verstaande, volgden Hem; en Hij ontving ze, en sprak tot hen van het Koninkrijk Gods; en die genezing van node hadden, maakte Hij gezond.","12":"En de dag begon te dalen; en de twaalven, tot Hem komende, zeiden tot Hem: Laat de schare van U, opdat zij, heengaande in de omliggende vlekken en in de dorpen, herberg nemen mogen, en spijze vinden; want wij zijn hier in een woeste plaats.","13":"Maar Hij zeide tot hen: Geeft gij hun te eten. En zij zeiden: Wij hebben niet meer dan vijf broden, en twee vissen; tenzij dan dat wij heengaan en spijs kopen voor al dit volk;","14":"Want er waren omtrent vijf duizend mannen. Doch Hij zeide tot Zijn discipelen: Doet hen nederzitten bij zaten, elk van vijftig.","15":"En zij deden alzo, en deden hen allen nederzitten.","16":"En Hij, de vijf broden en de twee vissen genomen hebbende, zag op naar den hemel, en zegende die, en brak ze, en gaf ze den discipelen, om der schare voor te leggen.","17":"En zij aten en werden allen verzadigd; en er werd opgenomen, hetgeen hun van de brokken overgeschoten was, twaalf korven.","18":"En het geschiedde, als Hij alleen was biddende, dat de discipelen met Hem waren, en Hij vraagde hen, zeggende: Wie zeggen de scharen, dat Ik ben?","19":"En zij, antwoordende, zeiden: Johannes de Doper; en anderen: Elias; en anderen: Dat enig profeet van de ouden opgestaan is.","20":"En Hij zeide tot hen: Maar gijlieden, wie zegt gij, dat Ik ben? En Petrus, antwoordende, zeide: De Christus Gods.","21":"En Hij gebood hun scherpelijk en beval, dat zij dit niemand zeggen zouden;","22":"Zeggende: De Zoon des mensen moet veel lijden, en verworpen worden van de ouderlingen, en overpriesters, en Schriftgeleerden, en gedood en ten derden dage opgewekt worden.","23":"En Hij zeide tot allen: Zo iemand achter Mij wil komen, die verloochene zichzelven, en neme zijn kruis dagelijks op, en volge Mij.","24":"Want zo wie zijn leven behouden wil, die zal het verliezen; maar zo wie zijn leven verliezen zal, om Mijnentwil, die zal het behouden.","25":"Want wat baat het een mens, die de gehele wereld zou winnen, en zichzelven verliezen, of schade *zijns* *zelfs* lijden?","26":"Want zo wie zich Mijns en Mijner woorden zal geschaamd hebben, diens zal de Zoon des mensen Zich schamen, wanneer Hij komen zal in Zijn heerlijkheid, en *in* *de* *heerlijkheid* des Vaders, en der heilige engelen.","27":"En Ik zeg u waarlijk: Er zijn sommigen dergenen, die hier staan, die den dood niet zullen smaken, totdat zij het Koninkrijk Gods zullen gezien hebben.","28":"En het geschiedde, omtrent acht dagen na deze woorden, dat Hij medenam Petrus, en Johannes, en Jakobus, en klom op den berg, om te bidden.","29":"En als Hij bad, werd de gedaante Zijns aangezichts veranderd, en Zijn kleding wit *en* zeer blinkende.","30":"En ziet, twee mannen spraken met Hem, welke waren Mozes en Elias.","31":"Dewelke, gezien zijnde in heerlijkheid, zeiden Zijn uitgang, dien Hij zoude volbrengen te Jeruzalem.","32":"Petrus nu, en die met hem *waren*, waren met slaap bezwaard; en ontwaakt zijnde, zagen zij Zijn heerlijkheid, en de twee mannen, die bij Hem stonden.","33":"En het geschiedde, als zij van Hem afscheidden, zo zeide Petrus tot Jezus: Meester, het is goed, dat wij hier zijn; en laat ons drie tabernakelen maken, voor U een, en voor Mozes een, en voor Elias een; niet wetende, wat hij zeide.","34":"Als hij nu dit zeide, kwam een wolk, en overschaduwde hen; en zij werden bevreesd, als die in de wolk ingingen.","35":"En er geschiedde een stem uit de wolk, zeggende: Deze is Mijn geliefde Zoon; hoort Hem!","36":"En als de stem geschiedde, zo werd Jezus alleen gevonden. En zij zwegen stil, en verhaalden in die dagen niemand iets van hetgeen zij gezien hadden.","37":"En het geschiedde des daags daaraan, als zij van den berg afkwamen, dat Hem een grote schare in het gemoet kwam.","38":"En ziet, een man van de schare riep uit, zeggende: Meester, ik bid U, zie toch mijn zoon aan; want hij is mij een eniggeborene.","39":"En zie, een geest neemt hem, en van stonde aan roept hij, en hij scheurt hem, dat hij schuimt, en wijkt nauwelijks van hem, en verplettert hem.","40":"En ik heb Uw discipelen gebeden, dat zij hem zouden uitwerpen, en zij hebben niet gekund.","41":"En Jezus, antwoordende, zeide: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij ulieden zijn, en ulieden verdragen? Breng uw zoon hier.","42":"En nog, als hij *naar* *Hem* toekwam, scheurde hem de duivel, en verscheurde *hem*; maar Jezus bestrafte den onreinen geest, en maakte het kind gezond, en gaf hem zijn vader weder.","43":"En zij werden allen verslagen over de grootdadigheid Gods. En als zij allen zich verwonderden over al de dingen, die Jezus gedaan had, zeide Hij tot Zijn discipelen:","44":"Legt gij deze woorden in uw oren: Want de Zoon des mensen zal overgeleverd worden in der mensen handen.","45":"Maar zij verstonden dit woord niet, en het was voor hen verborgen, alzo dat zij het niet begrepen; en zij vreesden van dat woord Hem te vragen.","46":"En er rees een overlegging onder hen, namelijk, wie van hen de meeste ware.","47":"Maar Jezus, ziende de overlegging hunner harten, nam een kindeken, en stelde dat bij Zich;","48":"En zeide tot hen: Zo wie dit kindeken ontvangen zal in Mijn Naam, die ontvangt Mij; en zo wie Mij ontvangen zal, ontvangt Hem, Die Mij gezonden heeft. Want die de minste onder u allen is, die zal groot zijn.","49":"En Johannes antwoordde en zeide: Meester! wij hebben een gezien, die in Uw Naam de duivelen uitwierp, en wij hebben het hem verboden, omdat hij U met ons niet volgt.","50":"En Jezus zeide tot hem: Verbied het niet; want wie tegen ons niet is, die is voor ons.","51":"En het geschiedde, als de dagen Zijner opneming vervuld werden, zo richtte Hij Zijn aangezicht, om naar Jeruzalem te reizen.","52":"En Hij zond boden uit voor Zijn aangezicht; en zij, heengereisd zijnde, kwamen in een vlek der Samaritanen, om voor Hem *herberg* te bereiden.","53":"En zij ontvingen Hem niet, omdat Zijn aangezicht was *als* reizende naar Jeruzalem.","54":"Als nu Zijn discipelen, Jakobus en Johannes, *dat* zagen, zeiden zij: Heere, wilt Gij, dat wij zeggen, dat vuur van den hemel nederdale, en dezen verslinde, gelijk ook Elias gedaan heeft?","55":"Maar Zich omkerende, bestrafte Hij hen, en zeide: Gij weet niet van hoedanigen geest gij zijt.","56":"Want de Zoon des mensen is niet gekomen om der mensen zielen te verderven, maar om te behouden. En zij gingen naar een ander vlek.","57":"En het geschiedde op den weg, als zij reisden, dat een tot Hem zeide: Heere, ik zal U volgen, waar Gij ook heengaat.","58":"En Jezus zeide tot hem: De vossen hebben holen, en de vogelen des hemels nesten; maar de Zoon des mensen heeft niet, waar Hij het hoofd nederlegge.","59":"En Hij zeide tot een anderen: Volg Mij. Doch hij zeide: Heere, laat mij toe, dat ik heenga, en eerst mijn vader begrave.","60":"Maar Jezus zeide tot hem: Laat de doden hun doden begraven; doch gij, ga heen en verkondig het Koninkrijk Gods.","61":"En ook een ander zeide: Heere, ik zal U volgen; maar laat mij eerst toe, dat ik afscheid neme van degenen, die in mijn huis zijn.","62":"En Jezus zeide tot hem: Niemand, die zijn hand aan den ploeg slaat, en ziet naar hetgeen achter is, is bekwaam tot het Koninkrijk Gods."},"KJV":{"1":"Then he called his twelve disciples together, and gave them power and authority over all devils, and to cure diseases.","2":"And he sent them to preach the kingdom of God, and to heal the sick.","3":"And he said unto them, Take nothing for *your* journey, neither staves, nor scrip, neither bread, neither money; neither have two coats apiece.","4":"And whatsoever house ye enter into, there abide, and thence depart.","5":"And whosoever will not receive you, when ye go out of that city, shake off the very dust from your feet for a testimony against them.","6":"And they departed, and went through the towns, preaching the gospel, and healing every where.","7":"Now Herod the tetrarch heard of all that was done by him: and he was perplexed, because that it was said of some, that John was risen from the dead;","8":"And of some, that Elias had appeared; and of others, that one of the old prophets was risen again.","9":"And Herod said, John have I beheaded: but who is this, of whom I hear such things? And he desired to see him.","10":"And the apostles, when they were returned, told him all that they had done. And he took them, and went aside privately into a desert place belonging to the city called Bethsaida.","11":"And the people, when they knew *it*, followed him: and he received them, and spake unto them of the kingdom of God, and healed them that had need of healing.","12":"And when the day began to wear away, then came the twelve, and said unto him, Send the multitude away, that they may go into the towns and country round about, and lodge, and get victuals: for we are here in a desert place.","13":"But he said unto them, Give ye them to eat. And they said, We have no more but five loaves and two fishes; except we should go and buy meat for all this people.","14":"For they were about five thousand men. And he said to his disciples, Make them sit down by fifties in a company.","15":"And they did so, and made them all sit down.","16":"Then he took the five loaves and the two fishes, and looking up to heaven, he blessed them, and brake, and gave to the disciples to set before the multitude.","17":"And they did eat, and were all filled: and there was taken up of fragments that remained to them twelve baskets.","18":"And it came to pass, as he was alone praying, his disciples were with him: and he asked them, saying, Whom say the people that I am?","19":"They answering said, John the Baptist; but some *say*, Elias; and others *say*, that one of the old prophets is risen again.","20":"He said unto them, But whom say ye that I am? Peter answering said, The Christ of God.","21":"And he straitly charged them, and commanded *them* to tell no man that thing;","22":"Saying, The Son of man must suffer many things, and be rejected of the elders and chief priests and scribes, and be slain, and be raised the third day.","23":"And he said to *them* all, If any *man* will come after me, let him deny himself, and take up his cross daily, and follow me.","24":"For whosoever will save his life shall lose it: but whosoever will lose his life for my sake, the same shall save it.","25":"For what is a man advantaged, if he gain the whole world, and lose himself, or be cast away?","26":"For whosoever shall be ashamed of me and of my words, of him shall the Son of man be ashamed, when he shall come in his own glory, and *in his* Father's, and of the holy angels.","27":"But I tell you of a truth, there be some standing here, which shall not taste of death, till they see the kingdom of God.","28":"And it came to pass about an eight days after these sayings, he took Peter and John and James, and went up into a mountain to pray.","29":"And as he prayed, the fashion of his countenance was altered, and his raiment *was* white *and* glistering.","30":"And, behold, there talked with him two men, which were Moses and Elias:","31":"Who appeared in glory, and spake of his decease which he should accomplish at Jerusalem.","32":"But Peter and they that were with him were heavy with sleep: and when they were awake, they saw his glory, and the two men that stood with him.","33":"And it came to pass, as they departed from him, Peter said unto Jesus, Master, it is good for us to be here: and let us make three tabernacles; one for thee, and one for Moses, and one for Elias: not knowing what he said.","34":"While he thus spake, there came a cloud, and overshadowed them: and they feared as they entered into the cloud.","35":"And there came a voice out of the cloud, saying, This is my beloved Son: hear him.","36":"And when the voice was past, Jesus was found alone. And they kept *it* close, and told no man in those days any of those things which they had seen.","37":"And it came to pass, that on the next day, when they were come down from the hill, much people met him.","38":"And, behold, a man of the company cried out, saying, Master, I beseech thee, look upon my son: for he is mine only child.","39":"And, lo, a spirit taketh him, and he suddenly crieth out; and it teareth him that he foameth again, and bruising him hardly departeth from him.","40":"And I besought thy disciples to cast him out; and they could not.","41":"And Jesus answering said, O faithless and perverse generation, how long shall I be with you, and suffer you? Bring thy son hither.","42":"And as he was yet a coming, the devil threw him down, and tare *him*. And Jesus rebuked the unclean spirit, and healed the child, and delivered him again to his father.","43":"And they were all amazed at the mighty power of God. But while they wondered every one at all things which Jesus did, he said unto his disciples,","44":"Let these sayings sink down into your ears: for the Son of man shall be delivered into the hands of men.","45":"But they understood not this saying, and it was hid from them, that they perceived it not: and they feared to ask him of that saying.","46":"Then there arose a reasoning among them, which of them should be greatest.","47":"And Jesus, perceiving the thought of their heart, took a child, and set him by him,","48":"And said unto them, Whosoever shall receive this child in my name receiveth me: and whosoever shall receive me receiveth him that sent me: for he that is least among you all, the same shall be great.","49":"And John answered and said, Master, we saw one casting out devils in thy name; and we forbad him, because he followeth not with us.","50":"And Jesus said unto him, Forbid *him* not: for he that is not against us is for us.","51":"And it came to pass, when the time was come that he should be received up, he stedfastly set his face to go to Jerusalem,","52":"And sent messengers before his face: and they went, and entered into a village of the Samaritans, to make ready for him.","53":"And they did not receive him, because his face was as though he would go to Jerusalem.","54":"And when his disciples James and John saw *this*, they said, Lord, wilt thou that we command fire to come down from heaven, and consume them, even as Elias did?","55":"But he turned, and rebuked them, and said, Ye know not what manner of spirit ye are of.","56":"For the Son of man is not come to destroy men's lives, but to save *them*. And they went to another village.","57":"And it came to pass, that, as they went in the way, a certain *man* said unto him, Lord, I will follow thee whithersoever thou goest.","58":"And Jesus said unto him, Foxes have holes, and birds of the air *have* nests; but the Son of man hath not where to lay *his* head.","59":"And he said unto another, Follow me. But he said, Lord, suffer me first to go and bury my father.","60":"Jesus said unto him, Let the dead bury their dead: but go thou and preach the kingdom of God.","61":"And another also said, Lord, I will follow thee; but let me first go bid them farewell, which are at home at my house.","62":"And Jesus said unto him, No man, having put his hand to the plough, and looking back, is fit for the kingdom of God."}},"tsk":{"1":[{"kopje":"Hij","refs":["Luk 6:13-16","Matt 10:2-5","Mark 3:13-19","Mark 6:7-13"]},{"kopje":"gaf","refs":["Luk 10:19","Matt 10:1","Matt 16:19","Mark 6:7","Mark 16:17","Mark 16:18","Joh 14:12","Hand 1:8","Hand 3:16","Hand 4:30","Hand 9:34"]}],"3":[{"kopje":"Neem","refs":["Luk 10:4-12","Luk 12:22","Luk 22:35","Ps 37:3","Matt 10:9","Matt 10:10","Mark 6:8","Mark 6:9","2 Tim 2:4"]},{"kopje":"twee","refs":["Luk 3:11","Luk 5:29","Luk 12:28"]}],"5":[{"kopje":"wie","refs":["Luk 9:48","Luk 10:10-12","Luk 10:16","Matt 10:14","Matt 10:15","Mark 6:11","Mark 9:37","Hand 13:51","Hand 18:6"]},{"kopje":"schud","refs":["Luk 9:53-56","Neh 5:13"]},{"kopje":"een getuigenis","refs":["Luk 5:14","Matt 10:18"]}],"7":[{"kopje":"Herodes","refs":["Job 18:11","Job 18:12","Ps 73:19","Matt 14:1-12","Mark 6:14-28"]},{"kopje":"hij","refs":["Luk 21:25","Jes 22:5","Micha 7:4"]}],"9":[{"kopje":"Johannes","refs":["Luk 9:7"]},{"kopje":"En hij","refs":["Luk 13:31","Luk 13:32","Luk 23:8"]}],"10":[{"kopje":"de apostelen","refs":["Luk 10:17","Zach 1:10","Mark 6:30","Hebr 13:17"]},{"kopje":"nam","refs":["Matt 14:13","Mark 2:7","Mark 6:31","Mark 6:32"]},{"kopje":"Bethsaïda","refs":["Matt 11:21","Mark 6:45","Joh 1:45"]}],"11":[{"kopje":"toen","refs":["Matt 14:14","Mark 6:33","Mark 6:34","Rom 10:14","Rom 10:17"]},{"kopje":"en Hij","refs":["Jes 61:1","Joh 4:34","Joh 6:37","Rom 15:3","2 Tim 4:2"]},{"kopje":"het Koninkrijk","refs":["Luk 8:1","Luk 8:10","Matt 21:31","Matt 21:43","Hand 28:31"]},{"kopje":"genezing","refs":["Luk 1:53","Luk 5:31","Hebr 4:16"]}],"12":[{"kopje":"dalen","refs":["Matt 14:15-21","Mark 6:35","Mark 6:36-44","Joh 6:1","Joh 6:5-15"]},{"kopje":"Stuur","refs":["Matt 15:23","Matt 15:32"]},{"kopje":"om","refs":["Ps 78:19","Ps 78:20","Ezech 34:25","Hos 13:5"]}],"13":[{"kopje":"Geeft","refs":[ },"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And having called his twelve Desciples together, he gave them the power and might [Or authority] over all the Devills [That is, against all Devills for to cast them out, Math. 10 .1.] And to cure diseases."}],"2":[{"catchword":null,"tekst":"And sent them to preach the Kingdom of God, [That is. the gospel of the coming of the Kingdom of God] and to heal the sick."}],"3":[{"catchword":null,"tekst":"And he said unto them ,take nothing with you on the way, [See hereof the annot. On Matth 10.10 .] neither staves [Otherwise staffe] nor scrip , nor bread, nor money: neither shall any one of you have two coats."}],"4":[{"catchword":null,"tekst":"And into whatsoever house ye shall abide there,and go out from thence. [That is. abide ther so long until ye depart, without going for ease to lodge from one house to another. seeing your abode there is not to continue long."}],"5":[{"catchword":null,"tekst":"And whoso shall not receive you, going out of the City, shake otf even the dust of the feet, [What this signified, See Mat. 10 14.] for a testimony against them."}],"6":[{"catchword":null,"tekst":"And they going forth went thorow all the Townes [Or went from the one Town to the other] preaching the gospel, and healing the [sick] every where."}],"7":[{"catchword":null,"tekst":"And Herod the Tetrach [Of the Tetrachs, see Mat14.1] heard of all the things that wrer done by him; and was of doubtful minde [namely not knowing what to think or do] because it was said to some, that John was risen from the dead ."}],"8":[{"catchword":null,"tekst":"And of some that Elias had appeared: and [of] others, that one of the old Prophets was risen."}],"9":[{"catchword":null,"tekst":"And Herod said, John have I beheaded; [See hereof Mat. 14.10 and Mark. 6.27.] now who is this of whom I hear such things? And he sought to se him."}],"10":[{"catchword":null,"tekst":"And the Apostles being returned related to him all that they had done. And he too // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
