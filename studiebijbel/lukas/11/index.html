baring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde, toen Hij op een zekere plaats was en bad, dat, toen Hij ophield, een van Zijn discipelen tegen Hem zei: Heere, leer ons bidden, zoals ook Johannes zijn discipelen geleerd heeft.","2":"En Hij zei tegen hen: Wanneer u bidt, zegt dan: Onze Vader, Die in de hemelen bent! Uw Naam worde geheiligd. Laat Uw Koninkrijk komen. Uw wil geschiede, zoals in de hemel, zo ook op de aarde.","3":"Geef ons elke dag ons dagelijks brood.","4":"En vergeef ons onze zonden; want ook wij vergeven ieder die ons schuldig is. En leid ons niet in verzoeking, maar verlos ons van de boze.","5":"En Hij zei tegen hen: Wie van u zal een vriend hebben, en zal midden in de nacht naar hem toe gaan, en tegen hem zeggen: Vriend! leen mij drie broden;","6":"Omdat mijn vriend van de reis bij mij gekomen is, en ik heb niets, dat ik hem kan voorzetten;","7":"En dat die van binnen dan zou antwoorden en zeggen: Val mij niet lastig; de deur is al gesloten, en mijn kinderen zijn met mij in de slaapkamer; ik kan niet opstaan om u te geven.","8":"Ik zeg u: Al zou hij niet opstaan en het hem geven omdat hij zijn vriend is, toch zal hij, om zijn onbeschaamdheid, opstaan en hem geven zoveel als hij nodig heeft.","9":"En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.","10":"Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden.","11":"En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?","12":"Of ook, als hij om een ei zou vragen, zal hij hem een schorpioen geven?","13":"Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?","14":"En Hij dreef een demon uit, en die was stom. En het gebeurde, toen de demon uitgevaren was, dat de stomme sprak; en de menigten verwonderden zich.","15":"Maar sommigen van hen zeiden: Hij drijft de demonen uit door Beëlzebul, de leider van de demonen.","16":"En anderen, om Hem te verzoeken, verlangden van Hem een teken uit de hemel.","17":"Maar Hij, die hun gedachten kende, zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en een huis dat tegen zichzelf verdeeld is, valt.","18":"Als dan ook de satan tegen zichzelf verdeeld is, hoe zal zijn rijk bestaan? Want u zegt dat Ik door Beëlzebul de demonen uitdrijf.","19":"En als Ik door Beëlzebul de demonen uitdrijf, door wie drijven uw zonen ze dan uit? Daarom zullen zij uw rechters zijn.","20":"Maar als Ik door de vinger van God de demonen uitdrijf, dan is het Koninkrijk van God tot u gekomen.","21":"Wanneer een sterke, gewapende man zijn eigen woning bewaakt, dan is alles wat hij heeft in vrede.","22":"Maar als iemand die sterker is dan hij, hem overvalt en hem overwint, dan neemt die zijn hele wapenrusting weg, waarop hij vertrouwde, en deelt zijn buit uit.","23":"Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.","24":"Wanneer de onreine geest van de mens is uitgevaren, gaat hij door dorre plaatsen, op zoek naar rust; en als hij die niet vindt, zegt hij: Ik zal terugkeren naar mijn huis, waar ik uit vandaan kwam.","25":"En als hij komt, vindt hij het schoongeveegd en op orde gebracht.","26":"Dan gaat hij heen, en neemt zeven andere geesten mee, slechter dan hijzelf, en als ze naar binnen gegaan zijn, wonen zij daar; en het einde van die mens wordt erger dan het begin.","27":"En het gebeurde, toen Hij deze dingen sprak, dat een zekere vrouw uit de menigte haar stem verhief en tegen Hem zei: Gelukkig is de moederschoot die U gedragen heeft, en de borsten waaraan U gedronken hebt.","28":"Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.","29":"En toen de menigten dicht bijeenkwamen, begon Hij te zeggen: Dit is een slecht geslacht; het verlangt een teken, maar het zal geen teken gegeven worden, dan het teken van Jona, de profeet.","30":"Want zoals Jona voor de Ninevieten een teken geweest is, zo zal ook de Zoon des mensen dat zijn voor dit geslacht.","31":"De koningin van het Zuiden zal opstaan in het oordeel samen met de mannen van dit geslacht, en hen veroordelen; want zij is gekomen van de einden van de aarde om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier.","32":"De mannen van Ninevé zullen opstaan in het oordeel samen met dit geslacht, en het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!","33":"En niemand die een lamp aansteekt, zet die op een verborgen plaats, of onder een korenmaat, maar op een standaard, opdat wie binnenkomen het licht kunnen zien.","34":"De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister.","35":"Kijk dan uit, dat niet het licht dat in u is, duisternis is.","36":"Als dan uw hele lichaam verlicht is, zonder enig duister deel, dan zal het geheel verlicht zijn, zoals wanneer de lamp u met haar schijnsel verlicht.","37":"Terwijl Hij dit zei, vroeg een zekere Farizeeër Hem bij hem te komen eten; en Hij ging naar binnen en ging aan tafel.","38":"En de Farizeeër, die dat zag, verwonderde zich dat Hij zich niet eerst gewassen had voor het eten.","39":"En de Heere zei tegen hem: Nu, u Farizeeën, u reinigt de buitenkant van de drinkbeker en de schotel; maar uw binnenste is vol roofzucht en boosheid.","40":"Dwazen! Heeft Hij die de buitenkant gemaakt heeft, niet ook de binnenkant gemaakt?","41":"Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.","42":"Maar wee u, Farizeeën, want u geeft tienden van munt en wijnruit en van alle moeskruid, en u gaat voorbij aan het recht en de liefde van God. Dit moest men doen, en het andere niet nalaten.","43":"Wee u, Farizeeën, want u houdt van de voorste plaatsen in de synagogen, en van de begroetingen op de markten.","44":"Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u bent als de graven die niet zichtbaar zijn, en de mensen die daaroverheen lopen, weten het niet.","45":"En een van de wetgeleerden antwoordde en zei tegen Hem: Meester, als U dit zegt, doet U ons ook smaad aan.","46":"Maar Hij zei: Wee ook u, wetgeleerden! want u belast de mensen met lasten die zwaar zijn om te dragen, en zelf raakt u die lasten niet aan met één van uw vingers.","47":"Wee u, want u bouwt de graven van de profeten, en uw vaders hebben hen gedood.","48":"Zo getuigt u dus dat u instemt met de daden van uw vaderen; want zij hebben hen gedood, en u bouwt hun graven.","49":"Daarom zegt ook de wijsheid van God: Ik zal profeten en apostelen naar hen toe zenden, en van hen zullen zij sommigen doden en sommigen vervolgen;","50":"Opdat van dit geslacht opgeëist wordt het bloed van al de profeten, dat vergoten is vanaf de grondlegging van de wereld.","51":"Van het bloed van Abel tot het bloed van Zacharia, die omgekomen is tussen het altaar en het huis van God; ja, Ik zeg u, het zal opgeëist worden van dit geslacht!","52":"Wee u, wetgeleerden, want u hebt de sleutel van de kennis weggenomen; u zelf bent niet naar binnen gegaan, en hen die naar binnen gingen, hebt u tegengehouden.","53":"En toen Hij deze dingen tegen hen zei, begonnen de Schriftgeleerden en Farizeeën Hem hevig aan te vallen, en Hem over veel dingen uit te horen;","54":"Terwijl zij Hem opwachtten en probeerden iets uit Zijn mond op te vangen, om Hem te kunnen beschuldigen."},"SV":{"1":"En het geschiedde, toen Hij in een zekere plaats was biddende, als Hij ophield, dat een van Zijn discipelen tot Hem zeide: Heere, leer ons bidden, gelijk ook Johannes zijn discipelen geleerd heeft.","2":"En Hij zeide tot hen: Wanneer gij bidt, zo zegt: Onze Vader, Die in de hemelen *zijt*! Uw Naam worde geheiligd. Uw Koninkrijk kome. Uw wil geschiede, gelijk in den hemel, *alzo* ook op de aarde.","3":"Geef ons elken dag ons dagelijks brood.","4":"En vergeef ons onze zonden; want ook wij vergeven aan een iegelijk, die ons schuldig is. En leid ons niet in verzoeking, maar verlos ons van den boze.","5":"En Hij zeide tot hen: Wie van u zal een vriend hebben, en zal ter middernacht tot hem gaan, en tot hem zeggen: Vriend! leen mij drie broden;","6":"Overmits mijn vriend van de reis tot mij gekomen is, en ik heb niet, dat ik hem voorzette;","7":"En dat die van binnen, antwoordende, zou zeggen: Doe mij geen moeite aan; de deur is nu gesloten, en mijn kinderen zijn met mij in de slaapkamer; ik kan niet opstaan, om u te geven.","8":"Ik zeg ulieden: Hoewel hij niet zou opstaan en hem geven, omdat hij zijn vriend is, nochtans om zijner onbeschaamdheid wil, zal hij opstaan, en hem geven zoveel als hij er behoeft.","9":"En Ik zeg ulieden: Bidt, en u zal gegeven worden; zoekt, en gij zult vinden; klopt, en u zal opengedaan worden.","10":"Want een iegelijk, die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, dien zal opengedaan worden.","11":"En wat vader onder u, dien de zoon om brood bidt, zal hem een steen geven, of ook om een vis, zal hem voor een vis een slang geven?","12":"Of zo hij ook om een ei zou bidden, zal hij hem een schorpioen geven?","13":"Indien dan gij, die boos zijt, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader den Heiligen Geest geven dengenen, die Hem bidden?","14":"En Hij wierp een duivel uit, en die was stom. En het geschiedde, als de duivel uitgevaren was, dat de stomme sprak; en de scharen verwonderden zich.","15":"Maar sommigen van hen zeiden: Hij werpt de duivelen uit door Beëlzebul, den overste der duivelen.","16":"En anderen, *Hem* verzoekende, begeerden van Hem een teken uit den hemel.","17":"Maar Hij, kennende hun gedachten, zeide tot hen: Een ieder koninkrijk, dat tegen zichzelf verdeeld is, wordt verwoest; en een huis, tegen zichzelf *verdeeld* *zijnde*, valt.","18":"Indien nu ook de satan tegen zichzelven verdeeld is, hoe zal zijn rijk bestaan? Dewijl gij zegt, dat Ik door Beëlzebul de duivelen uitwerp.","19":"En indien Ik door Beëlzebul de duivelen uitwerp, door wien werpen ze uw zonen uit? Daarom zullen dezen uw rechters zijn.","20":"Maar indien Ik door den vinger Gods de duivelen uitwerp, zo is dan het Koninkrijk Gods tot u gekomen.","21":"Wanneer een sterke gewapende zijn hof bewaart, zo is *al* wat hij heeft in vrede.","22":"Maar als een daarover komt, die sterker is dan hij, en hem overwint, die neemt zijn gehele wapenrusting, daar hij op vertrouwde, en deelt zijn roof uit.","23":"Wie met Mij niet is, die is tegen Mij; en wie met Mij niet vergadert, die verstrooit.","24":"Wanneer de onreine geest van den mens uitgevaren is, zo gaat hij door dorre plaatsen, zoekende rust; en die niet vindende, zegt hij: Ik zal wederkeren in mijn huis, daar ik uitgevaren ben.","25":"En komende, vindt hij het *met* *bezemen* gekeerd en versierd.","26":"Dan gaat hij heen, en neemt met zich zeven andere geesten, bozer dan hij zelf is, en ingegaan zijnde, wonen zij aldaar; en het laatste van dien mens wordt erger dan het eerste.","27":"En het geschiedde, als Hij deze dingen sprak, dat een zekere vrouw, de stem verheffende uit de schare, tot Hem zeide: Zalig is de buik, die U gedragen heeft, en de borsten, die Gij hebt gezogen.","28":"Maar Hij zeide: Ja, zalig zijn degenen, die het Woord Gods horen, en hetzelve bewaren.","29":"En als de scharen dicht bijeenvergaderden, begon Hij te zeggen: Dit is een boos geslacht; het verzoekt een teken, en hetzelve zal geen teken gegeven worden, dan het teken van Jonas, den profeet.","30":"Want gelijk Jonas den Ninevieten een teken geweest is, alzo zal ook de Zoon des mensen zijn dezen geslachte.","31":"De koningin van het Zuiden zal opstaan in het oordeel met de mannen van dit geslacht, en zal ze veroordelen; want zij is gekomen van de einden der aarde, om te horen de wijsheid van Salomo; en ziet, meer dan Salomo is hier.","32":"De mannen van Nineve, zullen opstaan in het oordeel met dit geslacht, en zullen hetzelve veroordelen; want zij hebben zich bekeerd op de prediking van Jonas; en ziet, meer dan Jonas is hier!","33":"En niemand, die een kaars ontsteekt, zet *die* in het verborgen, noch onder een koornmaat, maar op een kandelaar, opdat degenen, die inkomen, het licht zien mogen.","34":"De kaars des lichaams is het oog: wanneer dan uw oog eenvoudig is, zo is ook uw gehele lichaam verlicht; maar zo het boos is, zo is ook uw *gehele* lichaam duister.","35":"Zie dan toe, dat niet het licht, hetwelk in u is, duisternis zij.","36":"Indien dan uw lichaam geheel verlicht is, niet hebbende enig deel, dat duister is, zo zal het geheel verlicht zijn, gelijk wanneer de kaars met het schijnsel u verlicht.","37":"Als Hij nu *dit* sprak, bad Hem een zeker Farizeër, dat Hij bij hem het middagmaal wilde eten; en ingegaan zijnde, zat Hij aan.","38":"En de Farizeër, *dat* ziende, verwonderde zich, dat Hij niet eerst, voor het middagmaal, Zich gewassen had.","39":"En de Heere zeide tot hem: Nu gij Farizeën, gij reinigt het buitenste des drinkbekers en des schotels; maar het binnenste van u is vol van roof en boosheid.","40":"Gij onverstandigen! Die het buitenste heeft gemaakt, heeft Hij ook niet het binnenste gemaakt?","41":"Doch geeft tot aalmoes, hetgeen daarin is; en ziet, alles is u rein.","42":"Maar wee u, Farizeën, want gij vertient munte, en ruite, en alle moeskruid, en gij gaat voorbij het oordeel en de liefde Gods. Dit moest men doen, en het andere niet nalaten.","43":"Wee u, Farizeën, want gij bemint het voorgestoelte in de synagogen, en de begroetingen op de markten.","44":"Wee u, gij Schriftgeleerden en Farizeën, gij geveinsden, want gij zijt gelijk de graven, die niet openbaar zijn, en de mensen, die daarover wandelen, weten het niet.","45":"En een van de wetgeleerden, antwoordende, zeide tot Hem: Meester! als Gij deze dingen zegt, zo doet Gij ook ons smaadheid aan.","46":"Doch Hij zeide: Wee ook u, wetgeleerden! want gij belast de mensen met lasten, zwaar om te dragen, en zelven raakt gij die lasten niet aan met een van uw vingeren.","47":"Wee u, want gij bouwt de graven der profeten, en uw vaders hebben dezelve gedood.","48":"Zo getuigt gij dan, dat gij mede behagen hebt aan de werken uwer vaderen; want zij hebben ze gedood, en gij bouwt hun graven.","49":"Waarom ook de wijsheid Gods zegt: Ik zal profeten en apostelen tot hen zenden, en van die zullen zij *sommigen* doden, en *sommigen* zullen zij uitjagen;","50":"Opdat van dit geslacht afgeëist worde het bloed van al de profeten, dat vergoten is van de grondlegging der wereld af.","51":"Van het bloed van Abel, tot het bloed van Zacharia, die gedood is tussen het altaar en het huis *Gods*; ja, zeg Ik u, het zal afgeëist worden van dit geslacht!","52":"Wee u, gij wetgeleerden, want gij hebt den sleutel der kennis weggenomen; gijzelven zijt niet ingegaan, en die ingingen, hebt gij verhinderd.","53":"En als Hij deze dingen tot hen zeide, begonnen de Schriftgeleerden en Farizeën hard aan te houden, en Hem van vele dingen te doen spreken;","54":"Hem lagen leggende, en zoekende iets uit Zijn mond te bejagen, opdat zij Hem beschuldigen mochten."},"KJV":{"1":"And it came to pass, that, as he was praying in a certain place, when he ceased, one of his disciples said unto him, Lord, teach us to pray, as John also taught his disciples.","2":"And he said unto them, When ye pray, say, Our Father which art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done, as in heaven, so in earth.","3":"Give us day by day our daily bread.","4":"And forgive us our sins; for we also forgive every one that is indebted to us. And lead us not into temptation; but deliver us from evil.","5":"And he said unto them, Which of you shall have a friend, and shall go unto him at midnight, and say unto him, Friend, lend me three loaves;","6":"For a friend of mine in his journey is come to me, and I have nothing to set before him?","7":"And he from within shall answer and say, Trouble me not: the door is now shut, and my children are with me in bed; I cannot rise and give thee.","8":"I say unto you, Though he will not rise and give him, because he is his friend, yet because of his importunity he will rise and give him as many as he needeth.","9":"And I say unto you, Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you.","10":"For every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened.","11":"If a son shall ask bread of any of you that is a father, will he give him a stone? or if *he ask* a fish, will he for a fish give him a serpent?","12":"Or if he shall ask an egg, will he offer him a scorpion?","13":"If ye then, being evil, know how to give good gifts unto your children: how much more shall *your* heavenly Father give the Holy Spirit to them that ask him?","14":"And he was casting out a devil, and it was dumb. And it came to pass, when the devil was gone out, the dumb spake; and the people wondered.","15":"But some of them said, He casteth out devils through Beelzebub the chief of the devils.","16":"And others, tempting *him*, sought of him a sign from heaven.","17":"But he, knowing their thoughts, said unto them, Every kingdom divided against itself is brought to desolation; and a house *divided* against a house falleth.","18":"If Satan also be divided against himself, how shall his kingdom stand? because ye say that I cast out devils through Beelzebub.","19":"And if I by Beelzebub cast out devils, by whom do your sons cast *them* out? therefore shall they be your judges.","20":"But if I with the finger of God cast out devils, no doubt the kingdom of God is come upon you.","21":"When a strong man armed keepeth his palace, his goods are in peace:","22":"But when a stronger than he shall come upon him, and overcome him, he taketh from him all his armour wherein he trusted, and divideth his spoils.","23":"He that is not with me is against me: and he that gathereth not with me scattereth.","24":"When the unclean spirit is gone out of a man, he walketh through dry places, seeking rest; and finding none, he saith, I will return unto my house whence I came out.","25":"And when he cometh, he findeth *it* swept and garnished.","26":"Then goeth he, and taketh *to him* seven other spirits more wicked than himself; and they enter in, and dwell there: and the last *state* of that man is worse than the first.","27":"And it came to pass, as he spake these things, a certain woman of the company lifted up her voice, and said unto him, Blessed *is* the womb that bare thee, and the paps which thou hast sucked.","28":"But he said, Yea rather, blessed *are* they that hear the word of God, and keep it.","29":"And when the people were gathered thick together, he began to say, This is an evil generation: they seek a sign; and there shall no sign be given it, but the sign of Jonas the prophet.","30":"For as Jonas was a sign unto the Ninevites, so shall also the Son of man be to this generation.","31":"The queen of the south shall rise up in the judgment with the men of this generation, and condemn them: for she came from the utmost parts of the earth to hear the wisdom of Solomon; and, behold, a greater than Solomon *is* here.","32":"The men of Nineve shall rise up in the judgment with this generation, and shall condemn it: for they repented at the preaching of Jonas; and, behold, a greater than Jonas *is* here.","33":"No man, when he hath lighted a candle, putteth *it* in a secret place, neither under a bushel, but on a candlestick, that they which come in may see the light.","34":"The light of the body is the eye: therefore when thine eye is single, thy whole body also is full of light; but when *thine eye* is evil, thy body also *is* full of darkness.","35":"Take heed therefore that the light which is in thee be not darkness.","36":"If thy whole body therefore *be* full of light, having no part dark, the whole shall be full of light, as when the bright shining of a candle doth give thee light.","37":"And as he spake, a certain Pharisee besought him to dine with him: and he went in, and sat down to meat.","38":"And when the Pharisee saw *it*, he marvelled that he had not first washed before dinner.","39":"And the Lord said unto him, Now do ye Pharisees make clean the outside of the cup and the platter; but your inward part is full of ravening and wickedness.","40":"*Ye* fools, did not he that made that which is without make that which is within also?","41":"But rather give alms of such things as ye have; and, behold, all things are clean unto you.","42":"But woe unto you, Pharisees! for ye tithe mint and rue and all manner of herbs, and pass over judgment and the love of God: these ought ye to have done, and not to leave the other undone.","43":"Woe unto you, Pharisees! for ye love the uppermost seats in the synagogues, and greetings in the markets.","44":"Woe unto you, scribes and Pharisees, hypocrites! for ye are as graves which appear not, and the men that walk over *them* are not aware","45":"Then answered one of the lawyers, and said unto him, Master, thus saying thou reproachest us also.","46":"And he said, Woe unto you also, *ye* lawyers! for ye lade men with burdens grievous to be borne, and ye yourselves touch not the burdens with one of your fingers.","47":"Woe unto you! for ye build the sepulchres of the prophets, and your fathers killed them.","48":"Truly ye bear witness that ye allow the deeds of your fathers: for they indeed killed them, and ye build their sepulchres.","49":"Therefore also said the wisdom of God, I will send them prophets and apostles, and *some* of them they shall slay and persecute:","50":"That the blood of all the prophets, which was shed from the foundation of the world, may be required of this generation;","51":"From the blood of Abel unto the blood of Zacharias, which perished between the altar and the temple: verily I say unto you, It shall be required of this generation.","52":"Woe unto you, lawyers! for ye have taken away the key of knowledge: ye entered not in yourselves, and them that were entering in ye hindered.","53":"And as he said these things unto them, the scribes and the Pharisees began to urge *him* vehemently, and to provoke him to speak of many things:","54":"Laying wait for him, and seeking to catch something out of his mouth, that they might accuse him."}},"tsk":{"1":[{"kopje":"dat","refs":["Luk 6:12","Luk 9:18","Luk 9:28","Luk 22:39-45","Hebr 5:7"]},{"kopje":"leer","refs":["Ps 10:17","Ps 19:15","Rom 8:26","Rom 8:27","Jak 4:2","Jak 4:3","Judas 1:20"]}],"2":[{"kopje":"Wanneer","refs":["Pred 5:1","Hos 14:3","Matt 6:6-8"]},{"kopje":"Onze","refs":[" id, also unto ye Lawyers, ye load men with burdens heavier to be born, and yourselves touch not those burdens with one of your fingers."}],"47":[{"catchword":null,"tekst":"Wo unto you, for ye build the sepulchers of the Prophet, and your Fathers killed them."}],"48":[{"catchword":null,"tekst":"Therefore ye bear witness that ye also take pleasure of your Fathers: [Gr. And ye take pleasurealso.] for they killed them, and ye build their sepulchers. [that is , while ye build up their sepulchers, ye shew thereby that ye are true children of those that killed the Prophets , Matth 23. 31. And howsoever ye would seem thereby to discommend the deed of your Fathers, yet notwithstanding, it appears by the hatred, and the cruelitie which ye shew to the sound Teachers, that therein ye are like unto your fathers. And that if ye had lived at that time, ye would also have done the same to the Prophets.]"}],"49":[{"catchword":null,"tekst":"Therefore also saith [Or sud] the wisedome of God. [this Christ speaks of Himself, seeing he is the eternall wisedome of the Father. Prov 8.1.22.and 1. Cor. 1.24. as appears from Mat 23:34.]I will send the Prophets and Apostles unto them, and of them [some] they shall put to death, and (some) they shall chase out."}],"50":[{"catchword":null,"tekst":"That from this generation may be required the blood of the Prophets, [See Mat 23:25.] that was shed from the foundation of the world."}],"51":[{"catchword":null,"tekst":"From the blood of Abel, to the blood of Zecharias [Of this Zecharias see Mat 23:35.] which was slun between the Alter and the Temple (of God.) [That is, the Temple as is declared Mat 23:35.] yea, I say unto you, it shall be required of this generation."}],"52":[{"catchword":null,"tekst":"Woe unto you ye Lawyers, for ye have taken away the key of knowledge: [This key is the right exposition of Gods words, whereby entrance into heaven is opened unto men; which being taken away, that entrance is as it were shut up. See Matth .23.13.] ye e (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
