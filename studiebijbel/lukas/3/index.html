l zal verlaagd worden, en de kromme *wegen* zullen tot een rechte *weg* worden, en de oneffen tot effen wegen.","6":"En alle vlees zal de zaligheid van God zien.","7":"Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?","8":"Breng dan vruchten voort die de bekering waardig zijn; en begin niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen Abraham kinderen kan verwekken.","9":"En de bijl ligt ook al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.","10":"En de menigten vroegen hem: Wat zullen wij dan doen?","11":"En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen.","12":"En er kwamen ook tollenaars om gedoopt te worden, en zeiden tegen hem: Meester, wat zullen wij doen?","13":"En hij zei tegen hen: Eis niet meer dan wat u opgelegd is.","14":"En ook de soldaten vroegen hem: En wij, wat zullen wij doen? En hij zei tegen hen: Doe niemand geweld aan, en pers niemand af door bedrog, en wees tevreden met uw soldij.","15":"En toen het volk vol verwachting was, en allen in hun hart overlegden over Johannes, of hij misschien de Christus was,","16":"antwoordde Johannes aan allen: Ik doop u wel met water; maar Hij komt Die sterker is dan ik, aan Wie ik niet waardig ben de riem van Zijn schoenen los te maken; Deze zal u dopen met de Heilige Geest en met vuur;","17":"Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.","18":"Hij vermaande dan ook nog met veel andere dingen, en verkondigde aan het volk het Evangelie.","19":"Maar toen Herodes, de viervorst, door hem bestraft werd vanwege Herodias, de vrouw van Filippus, zijn broer, en vanwege alle slechte *dingen* die Herodes gedaan had,","20":"voegde hij daar bovenop ook nog dit aan toe, dat hij Johannes in de gevangenis opsloot.","21":"En het gebeurde, toen al het volk gedoopt werd, dat ook Jezus gedoopt werd, en bad, dat de hemel geopend werd;","22":"en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!","23":"En Hij, Jezus, was ongeveer dertig jaar oud toen Hij Zijn werk begon, en Hij was (naar men meende) de zoon van Jozef, de *zoon* van Heli,","24":"de *zoon* van Matthat, de *zoon* van Levi, de *zoon* van Melchi, de *zoon* van Janna, de *zoon* van Jozef,","25":"de *zoon* van Mattathias, de *zoon* van Amos, de *zoon* van Naum, de *zoon* van Esli, de *zoon* van Naggai,","26":"de *zoon* van Maath, de *zoon* van Mattathias, de *zoon* van Semeï, de *zoon* van Jozef, de *zoon* van Juda,","27":"de *zoon* van Johannes, de *zoon* van Rhesa, de *zoon* van Zorobabel, de *zoon* van Salathiël, de *zoon* van Neri,","28":"de *zoon* van Melchi, de *zoon* van Addi, de *zoon* van Kosam, de *zoon* van Elmodam, de *zoon* van Er,","29":"de *zoon* van Joses, de *zoon* van Eliëzer, de *zoon* van Jorim, de *zoon* van Matthat, de *zoon* van Levi,","30":"de *zoon* van Simeon, de *zoon* van Juda, de *zoon* van Jozef, de *zoon* van Jonan, de *zoon* van Eljakim,","31":"de *zoon* van Meleas, de *zoon* van Mainan, de *zoon* van Mattatha, de *zoon* van Nathan, de *zoon* van David,","32":"de *zoon* van Isaï, de *zoon* van Obed, de *zoon* van Boaz, de *zoon* van Salmon, de *zoon* van Nahasson,","33":"de *zoon* van Aminadab, de *zoon* van Aram, de *zoon* van Esrom, de *zoon* van Fares, de *zoon* van Juda,","34":"de *zoon* van Jakob, de *zoon* van Izak, de *zoon* van Abraham, de *zoon* van Thara, de *zoon* van Nachor,","35":"de *zoon* van Saruch, de *zoon* van Ragau, de *zoon* van Falek, de *zoon* van Heber, de *zoon* van Sala,","36":"de *zoon* van Kaïnan, de *zoon* van Arfaxad, de *zoon* van Sem, de *zoon* van Noach, de *zoon* van Lamech,","37":"de *zoon* van Methusalach, de *zoon* van Henoch, de *zoon* van Jared, de *zoon* van Mahalaleel, de *zoon* van Kaïnan,","38":"de *zoon* van Enos, de *zoon* van Seth, de *zoon* van Adam, de *zoon* van God."},"SV":{"1":"En in het vijftiende jaar der regering van den keizer Tiberius, als Pontius Pilatus stadhouder was over Judea, en Herodes een viervorst over Galilea, en Filippus, zijn broeder, een viervorst over Iturea en over het land Trachonitis, en Lysanias een viervorst over Abilene;","2":"Onder de hogepriesters Annas en Kajafas, geschiedde het woord Gods tot Johannes, den zoon van Zacharias, in de woestijn.","3":"En hij kwam in al het omliggende land der Jordaan, predikende den doop der bekering tot vergeving der zonden.","4":"Gelijk geschreven is in het boek der woorden van Jesaja, den profeet, zeggende: De stem des roependen in de woestijn: Bereidt den weg des Heeren, maakt Zijn paden recht!","5":"Alle dal zal gevuld worden, en alle berg en heuvel zal vernederd worden, en de kromme *wegen* zullen tot een rechten *weg* worden, en de oneffen tot effen wegen.","6":"En alle vlees zal de zaligheid Gods zien.","7":"Hij zeide dan tot de scharen, die uitkwamen , om van hem gedoopt te worden: Gij adderengebroedsels, wie heeft u aangewezen te vlieden van den toekomenden toorn?","8":"Brengt dan vruchten voort der bekering waardig; en begint niet te zeggen bij uzelven: Wij hebben Abraham tot een vader; want ik zeg u, dat God zelfs uit deze stenen Abraham kinderen kan verwekken.","9":"En de bijl ligt ook alrede aan den wortel der bomen; alle boom dan, die geen goede vrucht voortbrengt, wordt uitgehouwen, en in het vuur geworpen.","10":"En de scharen vraagden hem, zeggende: Wat zullen wij dan doen?","11":"En hij, antwoordende, zeide tot hen: Die twee rokken heeft, dele hem mede, die geen heeft; en die spijze heeft, doe desgelijks.","12":"En er kwamen ook tollenaars om gedoopt te worden, en zeiden tot hem: Meester! wat zullen wij doen?","13":"En hij zeide tot hen: Eist niet meer, dan hetgeen u gezet is.","14":"En hem vraagden ook de krijgslieden, zeggende: En wij, wat zullen wij doen? En hij zeide tot hen: Doet niemand overlast, en ontvreemdt niemand het zijne met bedrog, en laat u vergenoegen met uw bezoldigingen.","15":"En als het volk verwachtte, en allen in hun harten overleiden van Johannes, of hij niet mogelijk de Christus ware;","16":"Zo antwoordde Johannes aan allen, zeggende: Ik doop u wel met water; maar Hij komt, Die sterker is dan ik, Wien ik niet waardig ben den riem van Zijn schoenen te ontbinden; Deze zal u dopen met den Heiligen Geest en met vuur;","17":"Wiens wan in Zijn hand is, en Hij zal Zijn dorsvloer doorzuiveren, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onuitblusselijk vuur verbranden.","18":"Hij dan, ook nog vele andere dingen vermanende, verkondigde den volke het Evangelie.","19":"Maar als Herodes, de viervorst, van hem bestraft werd, om Herodias’ wil, de vrouw van Filippus, zijn broeder, en over alle boze *stukken*, die Herodes deed,","20":"Zo heeft hij ook dit nog boven alles daar toegedaan, dat hij Johannes in de gevangenis gesloten heeft.","21":"En het geschiedde, toen al het volk gedoopt werd, en Jezus *ook* gedoopt was, en bad, dat de hemel geopend werd;","22":"En dat de Heilige Geest op Hem nederdaalde, in lichamelijke gedaante, gelijk een duif; en dat er een stem geschiedde uit den hemel, zeggende: Gij zijt Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!","23":"En Hij, Jezus, begon omtrent dertig jaren *oud* te wezen, zijnde ( alzo men meende) de zoon van Jozef, den *zoon* van Heli,","24":"Den *zoon* van Matthat, den *zoon* van Levi, den *zoon* van Melchi, den *zoon* van Janna, den *zoon* van Jozef,","25":"Den *zoon* van Mattathias, den *zoon* van Amos, den *zoon* van Naum, den *zoon* van Esli, den *zoon* van Naggai,","26":"Den *zoon* van Maath, den *zoon* van Mattathias, den *zoon* van Semeï, den *zoon* van Jozef, den *zoon* van Juda,","27":"Den *zoon* van Johannes, den *zoon* van Rhesa, den *zoon* van Zorobabel, den *zoon* van Salathiël, den *zoon* van Neri,","28":"Den *zoon* van Melchi, den *zoon* van Addi, den *zoon* van Kosam, den *zoon* van Elmodam, den *zoon* van Er,","29":"Den *zoon* van Joses, den *zoon* van Eliëzer, den *zoon* van Jorim, den *zoon* van Matthat, den *zoon* van Levi,","30":"Den *zoon* van Simeon, den *zoon* van Juda, den *zoon* van Jozef, den *zoon* van Jonan, den *zoon* van Eljakim,","31":"Den *zoon* van Meleas, den *zoon* van Mainan, den *zoon* van Mattatha, den *zoon* van Nathan, den *zoon* van David,","32":"Den *zoon* van Jesse, den *zoon* van Obed, den *zoon* van Booz, den *zoon* van Salmon, den *zoon* van Nahasson,","33":"Den *zoon* van Aminadab, den *zoon* van Aram, den *zoon* van Esrom, den *zoon* van Fares, den *zoon* van Juda,","34":"Den *zoon* van Jakob, den *zoon* van Izak, den *zoon* van Abraham, den *zoon* van Thara, den *zoon* van Nachor,","35":"Den *zoon* van Saruch, den *zoon* van Ragau, den *zoon* van Falek, den *zoon* van Heber, den *zoon* van Sala,","36":"Den *zoon* van Kaïnan, den *zoon* van Arfaxad, den *zoon* van Sem, den *zoon* van Noe, den *zoon* van Lamech,","37":"Den *zoon* van Mathusala, den *zoon* van Enoch, den *zoon* van Jared, den *zoon* van Malaleel, den *zoon* van Kaïnan,","38":"Den *zoon* van Enos, den *zoon* van Seth, den *zoon* van Adam, den *zoon* van God."},"KJV":{"1":"Now in the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judaea, and Herod being tetrarch of Galilee, and his brother Philip tetrarch of Ituraea and of the region of Trachonitis, and Lysanias the tetrarch of Abilene,","2":"Annas and Caiaphas being the high priests, the word of God came unto John the son of Zacharias in the wilderness.","3":"And he came into all the country about Jordan, preaching the baptism of repentance for the remission of sins;","4":"As it is written in the book of the words of Esaias the prophet, saying, The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight.","5":"Every valley shall be filled, and every mountain and hill shall be brought low; and the crooked shall be made straight, and the rough ways *shall be* made smooth;","6":"And all flesh shall see the salvation of God.","7":"Then said he to the multitude that came forth to be baptized of him, O generation of vipers, who hath warned you to flee from the wrath to come?","8":"Bring forth therefore fruits worthy of repentance, and begin not to say within yourselves, We have Abraham to *our* father: for I say unto you, That God is able of these stones to raise up children unto Abraham.","9":"And now also the axe is laid unto the root of the trees: every tree therefore which bringeth not forth good fruit is hewn down, and cast into the fire.","10":"And the people asked him, saying, What shall we do then?","11":"He answereth and saith unto them, He that hath two coats, let him impart to him that hath none; and he that hath meat, let him do likewise.","12":"Then came also publicans to be baptized, and said unto him, Master, what shall we do?","13":"And he said unto them, Exact no more than that which is appointed you.","14":"And the soldiers likewise demanded of him, saying, And what shall we do? And he said unto them, Do violence to no man, neither accuse *any* falsely; and be content with your wages.","15":"And as the people were in expectation, and all men mused in their hearts of John, whether he were the Christ, or not;","16":"John answered, saying unto *them* all, I indeed baptize you with water; but one mightier than I cometh, the latchet of whose shoes I am not worthy to unloose: he shall baptize you with the Holy Ghost and with fire:","17":"Whose fan *is* in his hand, and he will throughly purge his floor, and will gather the wheat into his garner; but the chaff he will burn with fire unquenchable.","18":"And many other things in his exhortation preached he unto the people.","19":"But Herod the tetrarch, being reproved by him for Herodias his brother Philip's wife, and for all the evils which Herod had done,","20":"Added yet this above all, that he shut up John in prison.","21":"Now when all the people were baptized, it came to pass, that Jesus also being baptized, and praying, the heaven was opened,","22":"And the Holy Ghost descended in a bodily shape like a dove upon him, and a voice came from heaven, which said, Thou art my beloved Son; in thee I am well pleased.","23":"And Jesus himself began to be about thirty years of age, being (as was supposed) the son of Joseph, which was *the son* of Heli,","24":"Which was *the son* of Matthat, which was *the son* of Levi, which was *the son* of Melchi, which was *the son* of Janna, which was *the son* of Joseph,","25":"Which was *the son* of Mattathias, which was *the son* of Amos, which was *the son* of Naum, which was *the son* of Esli, which was *the son* of Nagge,","26":"Which was *the son* of Maath, which was *the son* of Mattathias, which was *the son* of Semei, which was *the son* of Joseph, which was *the son* of Juda,","27":"Which was *the son* of Joanna, which was *the son* of Rhesa, which was *the son* of Zorobabel, which was *the son* of Salathiel, which was *the son* of Neri,","28":"Which was *the son* of Melchi, which was *the son* of Addi, which was *the son* of Cosam, which was *the son* of Elmodam, which was *the son* of Er,","29":"Which was *the son* of Jose, which was *the son* of Eliezer, which was *the son* of Jorim, which was *the son* of Matthat, which was *the son* of Levi,","30":"Which was *the son* of Simeon, which was *the son* of Juda, which was *the son* of Joseph, which was *the son* of Jonan, which was *the son* of Eliakim,","31":"Which was *the son* of Melea, which was *the son* of Menan, which was *the son* of Mattatha, which was *the son* of Nathan, which was *the son* of David,","32":"Which was *the son* bel en Salathiël dezelfden zijn, die Mat 1:12 verhaalt, houdende dat het geslacht van Salomo in Jechonia zou uitgestorven zijn, uit Jer 22:30 . Doch anderen menen dat deze plaats uit Jeremia alzo kan verstaan worden, dat hij gezegd wordt zonder kinderen te zijn, die als koningen op zijn troon zouden zitten, overmits de koninklijke waardigheid in Jechonia is geëindigd; en menen dat uit 1Ch 3:17 blijkt, dat Jechonia eigen kinderen gehad heeft; en dat derhalve waarschijnlijk is, dat deze Zorobabel en Salathiël uit de linie van Nathan andere personen zijn geweest dan die van wie Mattheüs spreekt: gelijk in verscheidene geslachten, die van een stam afkomstig zijn, dikmaals gebeurt, dat enerlei namen den nakomelingen gegeven worden, waarvan hier in vs.24, 29, een voorbeeld is, alwaar de namen van Mattha of Mattath en Levi tweemalen aan elkander in verscheiden personen gevonden worden."}],"31":[{"catchword":"Nathan, den zoon van David,","tekst":"Mattheüs verhaalt het geslachtsregister van David door Salomo op Jozef den man van Maria, maar Lukas verhaalt hier het geslachtsregister van David door Nathan, die een broeder van Salomo en een andere zoon van David was, mede uit Bathseba, 2Sa 5:14 ; 1Ch 3:5 , en 1Ch 14:4 tot op Heli, den vader van Maria, wiens zoon Jozef genaamd wordt, vs.23, omdat hij zijne dochter getrouwd had. Zo is het dan niet vreemd dat alhier andere namen van David tot op Jozef worden gevonden dan bij Mattheüs, omdat zij verscheidene liniën beschrijven; alsook dat Mattheüs minder personen verhaalt dan Lukas, overmits hij verscheidenen uitlaat, om zich binnen het getal van veertien te besluiten. Zie de aantekeningen Mat 1:17 ."}],"36":[{"catchword":"Kaïnan,","tekst":"Deze naam wordt niet gevonden in het geslachtsregister bij Mozes verhaald, Gen 10:24 , en Gen 11:12 , noch ook 1Ch 1:24 ; maar wordt gevonden in de Griekse overzetting, die onder de Joden toentertijd gebruikelijk was; waarom sommigen menen dat dit ook wel overeenkomt met hetgeen Mozes verhaalt, r Herodias sake and bother Philips wife and for all wicked practices which Herod did"}],"20":[{"catchword":null,"tekst":"He added yet this also above all that he shut John in prison."}],"21":[{"catchword":null,"tekst":"And it came to pass when all the people were baptized and Jesus also was baptized and prayed that the heaven was opened."}],"22":[{"catchword":null,"tekst":"And that the holy Ghost [see hereof Mat 16:3] descended upon him in a bodily shape like a dove and that happened a voice out of heaven saying thou art my beloved son in thee I am well pleased ."}],"23":[{"catchword":null,"tekst":"And he Jesus began to be about thirty years old [this age the priest were to be of before they mightful execute their office Num 4:3 1 Chronicles 23.3] being as was suppose the son of Joseph the son of Heli [Joseph Mat 1:16 is said to begotten or born of Jacob but is here called a son of Heli because as many think he had married Mary which was the daughter of Heli like as Ruth is called the daughter of Naomi because she had the son of Naomi Ruth 1.11]"}],"24":[{"catchword":null,"tekst":"The son of Matthat the son of Levi the son of Melchi the son of Jonna the son of Joseph."}],"25":[{"catchword":null,"tekst":"The son of Mattathia the son of Amos the son of Naum the son of Elsi the son of Naggai"}],"26":[{"catchword":null,"tekst":"The son of Maath the son of Mattathia the son of Semei the son of Joseph the son Juda"}],"27":[{"catchword":null,"tekst":"The son of Joana the son of Resha the son of Zerubabel the son of Salathiel some think that this Zerubabel and Salathiel are the same which Matthew rehearseth chapter 1 verse 12 holding that the progeny of Solomon was extinct in Jachonia from Jer 22:30 yet others think that this place of Jeremy may be understood that he is said to be withput children which as King should sit upon his throne seeing the regal dignity ended in Jachonia and think that out of 1 Chronicles 3.17 it appears that Jachonia had children of his own and that for this cause it is likely that this Zerubabel and Salathiel of the line of Nathan were other persons then those of which Matthew speaks like as divers families which are descended from one stock it often happens, that the same name are given to the posterity of which there is an example here in this very chapter verse 24.29.where the name of Matthew or Mattath and Levi are found in several persons twice one after another] the son of Neri."}],"28":[{"catchword":null,"tekst":"The son of Melachi the son of Addi the son of Cosam the son of Elmodam the son of Er"}],"29":[{"catchword":null,"tekst":"The son of Jose the son of Eliezer the son of Jorim the son of Matthat the son of Levi"}],"30":[{"catchword":null,"tekst":"The son of Simeon the son of Juda the son of Jolseph the son of Jonan the son of Eliakim"}],"31":[{"catchword":null,"tekst":"The son of Molea the son of Mainan the son of Mattatha the son of Nathan the son of Dvaid [Matthew relates this genealogy of David by Solomon unto Joseph the husband of Mary but Luke here relates the genealogy of David by Nathan who was a brother of Solomon and another son of David by Bethsheba also 2 Samuel 5 .14,1Ch 3:5 and 14.4 unto Helii the father of Mary whose son Joseph is called verse 23 because he had married his daughter therefore it is not strange that here are other names found from David unto Joseph then are in Matthew because they describe several lines as also that Matthew rehearseth fewer persons then Luke seeing the leaves out of divers to confine himself within the number of fourteen see the annotation on Mat 1:17]"}],"32":[{"catchword":null,"tekst":"The son of Jess the son of Obed the son of booz the son of Salmon the son of Nasson"}],"33":[{"catchword":null,"tekst":"The son of Aminadab the son of Aram the son of Esrom the son of Phares the son of Juda"}],"34":[{"catchword":null,"tekst":"The son of Jacob the son of Isaac the son of Abraham the son of Thara the son of Nachor"}],"35":[{"catchword":null,"tekst":"T // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
