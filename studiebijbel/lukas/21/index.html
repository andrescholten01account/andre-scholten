zullen deze dingen dan gebeuren, en wat is het teken wanneer deze dingen zullen gebeuren?","8":"En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na.","9":"En wanneer u zult horen van oorlogen en opstanden, wordt dan niet verschrikt; want deze dingen moeten eerst gebeuren; maar meteen is het einde nog niet.","10":"Toen zei Hij tegen hen: Het *ene* volk zal tegen het *andere* volk opstaan, en het *ene* koninkrijk tegen het *andere* koninkrijk.","11":"En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.","12":"Maar voor dit alles zullen zij hun handen aan u slaan, en u vervolgen, en u overleveren aan de synagogen en gevangenissen; en u zult voor koningen en stadhouders gebracht worden, omwille van Mijn Naam.","13":"En *dit* zal u overkomen tot een getuigenis.","14":"Neem dan in uw harten voor, om van tevoren niet te overdenken hoe u zich verantwoorden zult;","15":"Want Ik zal u mond en wijsheid geven, die al uw tegenstanders niet zullen kunnen tegenspreken, noch weerstaan.","16":"En u zult overgeleverd worden, ook door ouders, en broers, en verwanten, en vrienden; en zij zullen sommigen van u doden.","17":"En u zult door allen gehaat worden omwille van Mijn Naam.","18":"Toch zal er geen haar van uw hoofd verloren gaan.","19":"Bezit uw zielen[1] in uw volharding.","20":"Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is.","21":"Laten dan zij die in Judea zijn, vluchten naar de bergen; en zij die in het midden ervan zijn, daaruit trekken; en zij die op de velden zijn, daar niet in komen.","22":"Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.","23":"Maar wee de zwangere vrouwen en de vrouwen die zogen in die dagen, want er zal grote nood zijn in het land, en toorn over dit volk.","24":"En zij zullen vallen door de scherpte van het zwaard, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal door de heidenen vertrapt worden, totdat de tijden van de heidenen vervuld zullen zijn.","25":"En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;","26":"En de mensen zal het hart bezwijken van vrees en verwachting van de dingen die het aardrijk zullen overkomen; want de krachten van de hemelen zullen bewogen worden.","27":"En dan zullen zij de Zoon des mensen zien komen in een wolk, met grote kracht en heerlijkheid.","28":"Wanneer nu deze dingen beginnen te gebeuren, kijk dan omhoog, en hef uw hoofden opwaarts, omdat uw verlossing nabij is.","29":"En Hij vertelde hun een gelijkenis: Kijk naar de vijgenboom, en naar alle bomen.","30":"Wanneer zij nu uitspruiten, en u dat ziet, dan weet u uit uzelf, dat de zomer nu nabij is.","31":"Zo ook u, wanneer u deze dingen zult zien gebeuren, weet dan, dat het Koninkrijk van God nabij is.","32":"Voorwaar, Ik zeg u, dat dit geslacht beslist niet zal voorbijgaan, totdat alles gebeurd zal zijn.","33":"De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.","34":"En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.","35":"Want als een strik zal hij komen over allen die op de hele aardbodem gezeten zijn.","36":"Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.","37":"Overdag was Hij lerend in de tempel; maar 's nachts ging Hij uit, en overnachtte op de berg die de Olijfberg genoemd wordt.","38":"En al het volk kwam 's morgens vroeg naar Hem toe in de tempel, om Hem te horen."},"SV":{"1":"En opziende, zag Hij de rijken hun gaven in de schatkist werpen.","2":"En Hij zag ook een zekere arme weduwe twee kleine *penningen* daarin werpen.","3":"En Hij zeide: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen.","4":"Want die allen hebben van hun overvloed geworpen tot de gaven Gods; maar deze heeft van haar gebrek, al den leeftocht, dien zij had, *daarin* geworpen.","5":"En als sommigen zeiden van den tempel, dat hij met schone stenen en begiftigingen versierd was, zeide Hij:","6":"*Wat* deze dingen *aangaat*, die gij aanschouwt, er zullen dagen komen, in welke niet *een* steen op *den* *anderen* steen zal gelaten worden, die niet zal worden afgebroken.","7":"En zij vraagden Hem, zeggende: Meester, wanneer zullen dan deze dingen zijn, en welk is het teken, wanneer deze dingen zullen geschieden?","8":"En Hij zeide: Ziet, dat gij niet verleid wordt; want velen zullen er komen onder Mijn Naam, zeggende: Ik ben *de* *Christus*; en de tijd is nabij gekomen, gaat dan hen niet na.","9":"En wanneer gij zult horen van oorlogen en beroerten, zo wordt niet verschrikt; want deze dingen moeten eerst geschieden; maar *nog* is terstond het einde niet.","10":"Toen zeide Hij tot hen: Het *ene* volk zal tegen het *andere* volk opstaan, en het *ene* koninkrijk tegen het *andere* koninkrijk.","11":"En er zullen grote aardbevingen wezen in verscheidene plaatsen, en hongersnoden, en pestilentien; er zullen ook schrikkelijke dingen, en grote tekenen van den hemel geschieden.","12":"Maar voor dit alles, zullen zij hun handen aan ulieden slaan, en *u* vervolgen, *u* overleverende in de synagogen en gevangenissen; en gij zult getrokken worden voor koningen en stadhouders, om Mijns Naams wil.","13":"En *dit* zal u overkomen tot een getuigenis.","14":"Neemt dan in uw harten voor, van te voren niet te overdenken, *hoe* gij u verantwoorden zult;","15":"Want Ik zal u mond en wijsheid geven, welke niet zullen kunnen tegenspreken, noch wederstaan allen, die zich tegen u zetten.","16":"En gij zult overgeleverd worden ook van ouders, en broeders, en magen, en vrienden; en zij zullen er *sommigen* uit u doden.","17":"En gij zult van allen gehaat worden om Mijns Naams wil.","18":"Doch niet een haar uit uw hoofd zal verloren gaan.","19":"Bezit uw zielen in uw lijdzaamheid.","20":"Maar wanneer gij zien zult, dat Jeruzalem van heirlegers omsingeld wordt, zo weet alsdan, dat haar verwoesting nabij gekomen is.","21":"Alsdan die in Judea zijn, dat zij vlieden naar de bergen; en die in het midden van dezelve zijn, dat zij daaruit trekken; en die op de velden zijn, dat zij in dezelve niet komen.","22":"Want deze zijn dagen der wraak, opdat alles vervuld worde, dat geschreven is.","23":"Doch wee den bevruchten en den zogenden *vrouwen* in die dagen, want er zal grote nood zijn in het land, en toorn over dit volk.","24":"En zij zullen vallen door de scherpte des zwaards, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal van de heidenen vertreden worden, totdat de tijden der heidenen vervuld zullen zijn.","25":"En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid der volken met twijfelmoedigheid, als de zee en watergolven groot geluid zullen geven;","26":"En den mensen het hart zal bezwijken van vrees en verwachting der dingen, die het aardrijk zullen overkomen; want de krachten der hemelen zullen bewogen worden.","27":"En alsdan zullen zij den Zoon des mensen zien komen in een wolk, met grote kracht en heerlijkheid.","28":"Als nu deze dingen beginnen te geschieden, zo ziet omhoog, en heft uw hoofden opwaarts, omdat uw verlossing nabij is.","29":"En Hij zeide tot hen een gelijkenis: Ziet den vijgeboom, en al de bomen.","30":"Wanneer zij nu uitspruiten, en gij *dat* ziet, zo weet gij uit uzelven, dat de zomer nu nabij is.","31":"Alzo ook gij, wanneer gij deze dingen zult zien geschieden, zo weet, dat het Koninkrijk Gods nabij is.","32":"Voorwaar Ik zeg u, dat dit geslacht geenszins zal voorbijgaan, totdat alles zal geschied zijn.","33":"De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen geenszins voorbijgaan.","34":"En wacht uzelven, dat uw harten niet te eniger tijd bezwaard worden met brasserij en dronkenschap, en zorgvuldigheden dezes levens, en dat u die dag niet onvoorziens *over* kome.","35":"Want gelijk een strik zal hij komen over al degenen, die op den gansen aardbodem gezeten zijn.","36":"Waakt dan te aller tijd, biddende, dat gij moogt waardig geacht worden te ontvlieden al deze dingen, die geschieden zullen, en te staan voor den Zoon des mensen.","37":"Des daags nu was Hij lerende in den tempel; maar des nachts ging Hij uit, en vernachtte op den berg, genaamd den Olijf *berg*.","38":"En al het volk kwam des morgens vroeg tot Hem in den tempel, om Hem te horen."},"KJV":{"1":"And he looked up, and saw the rich men casting their gifts into the treasury.","2":"And he saw also a certain poor widow casting in thither two mites.","3":"And he said, Of a truth I say unto you, that this poor widow hath cast in more than they all:","4":"For all these have of their abundance cast in unto the offerings of God: but she of her penury hath cast in all the living that she had.","5":"And as some spake of the temple, how it was adorned with goodly stones and gifts, he said,","6":"*As for* these things which ye behold, the days will come, in the which there shall not be left one stone upon another, that shall not be thrown down.","7":"And they asked him, saying, Master, but when shall these things be? and what sign *will there be* when these things shall come to pass?","8":"And he said, Take heed that ye be not deceived: for many shall come in my name, saying, I am *Christ*; and the time draweth near: go ye not therefore after them.","9":"But when ye shall hear of wars and commotions, be not terrified: for these things must first come to pass; but the end *is* not by and by.","10":"Then said he unto them, Nation shall rise against nation, and kingdom against kingdom:","11":"And great earthquakes shall be in divers places, and famines, and pestilences; and fearful sights and great signs shall there be from heaven.","12":"But before all these, they shall lay their hands on you, and persecute *you*, delivering *you* up to the synagogues, and into prisons, being brought before kings and rulers for my name's sake.","13":"And it shall turn to you for a testimony.","14":"Settle *it* therefore in your hearts, not to meditate before what ye shall answer:","15":"For I will give you a mouth and wisdom, which all your adversaries shall not be able to gainsay nor resist.","16":"And ye shall be betrayed both by parents, and brethren, and kinsfolks, and friends; and *some* of you shall they cause to be put to death.","17":"And ye shall be hated of all *men* for my name's sake.","18":"But there shall not an hair of your head perish.","19":"In your patience possess ye your souls.","20":"And when ye shall see Jerusalem compassed with armies, then know that the desolation thereof is nigh.","21":"Then let them which are in Judaea flee to the mountains; and let them which are in the midst of it depart out; and let not them that are in the countries enter thereinto.","22":"For these be the days of vengeance, that all things which are written may be fulfilled.","23":"But woe unto them that are with child, and to them that give suck, in those days! for there shall be great distress in the land, and wrath upon this people.","24":"And they shall fall by the edge of the sword, and shall be led away captive into all nations: and Jerusalem shall be trodden down of the Gentiles, until the times of the Gentiles be fulfilled.","25":"And there shall be signs in the sun, and in the moon, and in the stars; and upon the earth distress of nations, with perplexity; the sea and the waves roaring;","26":"Men's hearts failing them for fear, and for looking after those things which are coming on the earth: for the powers of heaven shall be shaken.","27":"And then shall they see the Son of man coming in a cloud with power and great glory.","28":"And when these things begin to come to pass, then look up, and lift up your heads; for your redemption draweth nigh.","29":"And he spake to them a parable; Behold the fig tree, and all the trees;","30":"When they now shoot forth, ye see and know of your own selves that summer is now nigh at hand.","31":"So likewise ye, when ye see these things come to pass, know ye that the kingdom of God is nigh at hand.","32":"Verily I say unto you, This generation shall not pass away, till all be fulfilled.","33":"Heaven and earth shall pass away: but my words shall not pass away.","34":"And take heed to yourselves, lest at any time your hearts be overcharged with surfeiting, and drunkenness, and cares of this life, and *so* that day come upon you unawares.","35":"For as a snare shall it come on all them that dwell on the face of the whole earth.","36":"Watch ye therefore, and pray always, that ye may be accounted worthy to escape all these things that shall come to pass, and to stand before the Son of man.","37":"And in the day time he was teaching in the temple; and at night he went out, and abode in the mount that is called *the mount* of Olives.","38":"And all the people came early in the morning to him in the temple, for to hear him."}},"tsk":{"1":[{"kopje":"zag Hij","refs":["Mark 7:11-13","Mark 12:41-44"]},{"kopje":"de schatkist","refs":["Joz 6:19","Joz 6:24","1 Kon 14:26","2 Kon 24:13","2 Kron 36:18","Neh 13:13","Matt 27:6","Joh 8:20"]}],"2":[{"kopje":"kleine penningen","refs":["Mark 12:42"]}],"3":[{"kopje":"Waarlijk","refs":["Luk 4:25","Luk 9:27","Luk 12:44","Hand 4:27","Hand 10:34"]},{"kopje":"meer","refs":["Ex 35:21-29","Mark 12:43","Mark 12:44","Mark 14:8","Mark 14:9","2 Kor 8:2","2 Kor 8:3","2 Kor 8:12","2 Kor 9:6","2 Kor 9:7"]}],"4":[{"kopje":"allen","refs":["Luk 8:43","Luk 15:12","Hand 2:44","Hand 2:45","Hand 4:34"]}],"5":[{"kopje":"over","refs":["Matt 24:1","Matt 24:2","Mark 13: ven of toegeëigend en in de schatkist bewaard werden."},{"catchword":"van haar gebrek,","tekst":"Dat is, van hetgeen zij zelve gebrek of van node had om te leven."},{"catchword":"leeftocht,","tekst":"Grieks leven. Zie Mar 12:44 ."}],"5":[{"catchword":"begiftigingen versierd was,","tekst":"Dit waren eigenlijk zulke giften, die in den tempel Gode geheiligd en tot sieraad opgehangen waren. Zie dergelijke 2Ki 11:10 ."}],"8":[{"catchword":"onder Mijn Naam,","tekst":"Grieks in mijnen naam; dat is, mijnen naam zichzelven valselijk toeschrijvende."},{"catchword":"Ik ben de Christus ;","tekst":"Grieks Ik ben; namelijk de Christus, gelijk uitgedrukt staat Mat 24:5 ."}],"9":[{"catchword":"beroerten,","tekst":"Het Griekse woord betekent zulke beroerten of verwarringen, waardoor gans niets in zijn stand of plaats gelaten wordt."},{"catchword":"eerst geschieden;","tekst":"Namelijk eer de stad en tempel van Jeruzalem zullen verwoest worden."}],"11":[{"catchword":"schrikkelijke dingen,","tekst":"Zie hiervan den Joodsen historieschrijver Josefus, van de Joodse oorlogen, lib.7. cap.12."},{"catchword":"geschieden","tekst":"Grieks zijn."}],"12":[{"catchword":"synagogen en gevangenissen;","tekst":"In welke de gelovigen ook gegeseld werden, gelijk te zien is Act 5:40 , en Act 22:19 , en Act 26:11 ."}],"13":[{"catchword":"overkomen","tekst":"Grieks afkomen, afdalen; dat is, gedijen, strekken."},{"catchword":"getuigenis","tekst":"Namelijk zo van hunne wreedheid en hardnekkigheid, als van uwe standvastigheid in het belijden van mijnen naam en der waarheid mijner voorzeggingen."}],"14":[{"catchword":"Neemt dan in uw harten voor,","tekst":"Grieks stelt, of zet dan in uwe harten."}],"15":[{"catchword":"mond en wijsheid geven,","tekst":"Dat is, bekwaamheid en vrijmoedigheid in het spreken door mijnen Geest. Zie Mar 13:11 ."}],"16":[{"catchword":"overgeleverd worden","tekst":"Of, verraden worden."}],"17":[{"catchword":"van allen gehaat worden","tekst":"Namelijk wereldse mensen. Zie Joh 15:18 ."}],"18":[{"catchword":"haar uit uw hoofd zal verloren gaan","tekst":"Dat is, niemand zal u in het minste beschadigen kunnen zonder den wil uws hemelsen Vaders. Gelijke manier van spreken zie 1Sa 14:45 ; 1Ki 1:52 ."}],"21":[{"catchword":"dat zij in dezelve niet komen","tekst":"Namelijk in de stad Jeruzalem."}],"22":[{"catchword":"wraak,","tekst":"Namelijk Gods, over de hardnekkigheid des Joodsen volks."}],"23":[{"catchword":"wee den bevruchten","tekst":"Dit woord gebruikt Christus niet dreigende, gelijk Hij doet tegen de Farizeën, Luk 11:42 , enz., maar hen beklagende vanwege de zwarigheden, die alsdan zouden overkomen."},{"catchword":"het land,","tekst":"Grieks op de aarde."}],"24":[{"catchword":"scherpte des zwaards,","tekst":"Grieks den mond."},{"catchword":"totdat de tijden der heidenen","tekst":"Namelijk bestemd tot de roeping der heidenen, Rom 11:25 , na welker vervulling die dingen geschieden zullen, die hierna volgen, of bestemd tot straf en wraak over de heidenen, wanneer de maat hunner zonden zal vervuld zijn."}],"25":[{"catchword":"groot geluid zullen geven;","tekst":"Grieks weerklank."}],"26":[{"catchword":"het hart zal bezwijken","tekst":"Of, de mensen den geest zullen geven, of mismoedig zullen worden."},{"catchword":"het aardrijk zullen overkomen;","tekst":"Grieks de bewoonde; namelijk aarde."},{"catchword":"bewogen worden","tekst":"Namelijk op en neder, gelijk de baren van de zee. Zie Mat 24:29 ."}],"27":[{"catchword":"grote kracht","tekst":"Grieks vele."},{"catchword":"heerlijkheid","tekst":"Namelijk in zijn hemelse majesteit, en vergezeld van de heilige engelen, Mat 25:31 ."}],"28":[{"catchword":"ziet omhoog,","tekst":"Of, richt u op; namelijk van vreugde en verlangen, Mat 24:33 ."},{"catchword":"uw verlossing nabij is","tekst":"Namelijk uw volkomen verlossing van alle kwaad, Rom 8:23 ."}],"31":[{"catchword":"Koninkrijk Gods nabij is","tekst":"Namelijk der heerlijkheid. Zie 1Co 15:24 ; 2Ti 4:18 ."}],"32":[{"catchword":"geslacht geenszins zal voorbijgaan,","tekst":"Namelijk van het Joodse volk."}],"33":[{"catchword":"voorbijgaan,","tekst":"Zie hiervan 2Pe 3:10 ."}],"34":[{"catchword":"zorgvuldigheden dezes levens,","tekst":"Namelijk al te grote of onmatige, die de mensen verhindert op de toekomst van Christus te wachten."}],"35":[{"catchword":"op den gansen aardbodem gezeten zijn","tekst":"Grieks op het aangezicht der ganse aarde."}],"36":[{"catchword":"al deze dingen,","tekst":"Dat is, al deze straffen en ellenden."},{"catchword":"staan voor den Zoon des mensen","tekst":"Dat is, bestaan, en met vrijmoedigheid voor Hem verschijnen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And looking up he saw the rich cast their gifts into the treasure chest [of this treasure chest see 2 Kings 12.9 Matthew27.6]"}],"2":[{"catchword":null,"tekst":"And he saw also a certain poor widow cast thereinto two small pences [or very little ones see of the value of the same on Mark 12.42]"}],"3":[{"catchword":null,"tekst":"And he said truly I say unto ye that this poor widow had cast in more than then all"}],"4":[{"catchword":null,"tekst":"For they all have the abundance or over plus cast unto the gifts of God [that is unto the other gifts which were given and consecrated to God and kept in the treasure chest] but she of her want [that is of which is of that which wanted or had need for her to live upon] hath cast threinto all the livelihood which she had [Gr living see Mat 12:44]"}],"5":[{"catchword":null,"tekst":"And as some said of the temple, that it was adorned with beautiful stones, and oblations; [These were properly such gifts, which in the Temple were consecrated to God, and hanged up for ornament. See the like 2 Kings 11.10.] He said,"}],"6":[{"catchword":null,"tekst":"As for these things, which ye behold, there shall be daies to come, in which not (one) stone shall be left upon (another) stone, which shall not be broken down."}],"7":[{"catchword":null,"tekst":"And they asked him saying, Master, when there shall these things be? And what is the sign when these things shall come to pass?"}],"8":[{"catchword":null,"tekst":"And he said, see that ye not be seduced; for many shall come under my name, [Gr. in my name, i.e. falsify ascribing my name.] saying I am (the Christ) [Gr, I am, namely the Christ, is exprest Matth. 24.5.] And the time is coming: go not therefore after them."}],"9":[{"catchword":null,"tekst":"And when ye shall hear of wars, and commotions [Greek word signifies such commotions or confusion whereby nothing at all is left in state or place.] be not affrighted: For these things must first come to pass [namely, before the City and Temple of Jerusalem shall be laid waste] But (yet) the end is not presently."}],"10":[{"catchword":null,"tekst":"Then he said unto them; (one) Nation shall rise up against the (other) Nation, and (one) Kingdom against the (other) Kingdom."}],"11":[{"catchword":null,"tekst":"And there shall be great Earthquakes in divers place, and femine and pestilences: there shall also happen [Gr. be] terrible things and great signs from heaven. [See hereof the Jewish Historin Jos. De bello Jud. Lib.7 cap.12.]"}],"12":[{"catchword":null,"tekst":"But before all these they shall lay their hands on you and persecute (you) delivering you over into the Synagogues [In which the faithfull were scourged also, as may be seen Act 5.40. and22. 19. and 26.11.] and prisons, and ye shall be drawn before Kings and Governors for my name sake"}],"13":[{"catchword":null,"tekst":"And this shall come upon you [Gr. come down or descend, i.e. become tend] for testimony. [Namely, as well of the cruelty and stiffneckedness , as of your steadfastness in the confession of my name, and of the truth of my predictions.]"}],"14":[{"catchword":null,"tekst":"Resolve therefore in your hearts [Gr. settle it, or set it therefore in your hearts] not to consider before hand (how) ye shall defend yourselves"}],"15":[{"catchword":null,"tekst":"For I will give ye a mouth [That is, fitness and boldness in speaking by my spirit, See Nark 13.11.] and wisdome, which all that set themselves against you shall not be able to gain- say nor resist."}],"16":[{"catchword":null,"tekst":"And ye shall be delivered over [Or Betrayed] even of parents, and brethren, and kinsmen and friends: and they shall put (some) of to death."}],"17":[{"catchword":null,"tekst":"And ye shall be hated all [Namely, worldly men See Joh 15:18.] for my names sake."}],"18":[{"catchword":null,"tekst":"Yet not a hair of your heads shall perish. [That is, no man shall be able to hurt you in the least without the will of your heavenly Father. Like Phrases. See 1 Sam. 14.45. and 1 Kings.1.52.]"}],"19":[{"catchword":null,"tekst":"Posses ye your souls in patience."}],"20":[{"catchword":null,"tekst":"But when you shall see that Jerusalem is compassed with armies, then know that her desolation is come nigh."}],"21":[{"catchword":null,"tekst":"Then they that are in Judea, let them flee to the mountains: and they that are in the midst of the same, let them depart out: and they that are in the fields, let them not come into the same. [Namely, to Jerusalem.]"}],"22":[{"catchword":null,"tekst":"For these are the daise of vengeance [Namely, of God, upon the stiffneckedness of the Jewish people.] that all may be fulfilled which is written."}],"23":[{"catchword":null,"tekst":"But two [This word Christ useth, not threatening as he doth against the Pharisees Luk 11:42. &c but lamenting them by reason of the trouble which then should come upon them.] (to the women) that are with child and that give suck in those daise: for there shall be great distre in the Land, [Gr. on the earth] and wrath upon this people."}],"24":[{"catchword":null,"tekst":"And they shall fall by the edge, [Gr. the mouth] of the sword, and be carried away captives among all nations: and Jerusalem shall be trodden down of the Gentiles. Until the times of tha Gentiles shall be fulfilled. [Namely, appointed for the calling of the Gentiles Rom. 11.25. after the fulfilling whereof, those things shall come to pass which follow hereafter, or appointed for judgement and vengeance upon the Gentiles, when the measure of their sins shall be filled up."}],"25":[{"catchword":null,"tekst":"And there shall be signs in the sun, and Moon and Starrs, and on the earth, distress of Nations, with doubtfulness of the mind, when the Sea, and water-billows shall give great sound. [Greek, resound, or Echo.]"}],"26":[{"catchword":null,"tekst":"And mens heart shall fail [Or men shall give up the Ghost, or be quite out if heart.] for fear, and for expectations of the things, which shall come upon the earth, [Gr. the inhibited, namely earth] for the powers of heavens shall be moved. [Namely up and down like the waves of the Sea. See Matth. 24.29.]"}],"27":[{"catchword":null,"tekst":"And then they shall see the Son of man come in a cloud with great power [Gr. much] and glory. [namely in his heavenly Majesty, and accompanied with holy Angels. Matth. 25.31.]"}],"28":[{"catchword":null,"tekst":"Now when these things begin to come to pass, then look on high [Or erect your selves, namely for the joy and longing, Mat. 24.33.] and lift up your heads, because your redemption is near; [namely your perfect deliverance from all the evil, Rom 8.23.]"}],"29":[{"catchword":null,"tekst":"And he spake a similitude unto them, behold the fig-tree and all the trees."}],"30":[{"catchword":null,"tekst":"When they spring forth and yee see (that) yee know of your selves that the summer is now neer."}],"31":[{"catchword":null,"tekst":"Even so also when you shall see these things come to pass, know that the Kingdom of God [Namely of Glory. See 1 cor.15. 24. 2 Tim. 4. 18.] Is near."}],"32":[{"catchword":null,"tekst":"Verily I say unto you, that this generation [Namely of the Jewish people] shall in nowise pass away, until all shall come to pass."}],"33":[{"catchword":null,"tekst":"The Heaven and Earth shall pass away [See hereof 2 Pet. 3 10.] but my words shall in nowise pass away."}],"34":[{"catchword":null,"tekst":"And take heed to your selves , that your hearts be not in any time made heavy with gluttony and drunkenness and cares of this life, [Namely too great or immoderate, which hinder a man from watching for Christs coming] and that that day comes not (upon) you umaware."}],"35":[{"catchword":null,"tekst":"For as snare shall it come upon all those that are seated upon the whole Earth? [Gr. on the face of the whole Earth.]"}],"36":[{"catchword":null,"tekst":"Watch therefore at all the times, praying that yee may be counted worthy, to escape all these things which shall come to pass [That is, all these judgement and miseries] and to stand before the Son of man. [that is, subsist and appear before him with boldness.]"}],"37":[{"catchword":null,"tekst":"Now by day he was teaching in the Temple, but at night he went out, and abode all night on the Mount, called the (Mount) of Olives."}],"38":[{"catchword":null,"tekst":"And all people came to him early in the morning in the Temple for to hear him:"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
