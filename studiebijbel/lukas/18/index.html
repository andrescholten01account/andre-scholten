baring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,","2":"en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag.","3":"En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.","4":"En hij wilde dat een lange tijd niet; maar daarna zei hij bij zichzelf: Hoewel ik God niet vrees en geen mens ontzie,","5":"toch, omdat deze weduwe het mij zo moeilijk maakt, zal ik haar recht doen, zodat ze niet uiteindelijk komt en mij uitput.","6":"En de Heere zei: Hoor wat de onrechtvaardige rechter zegt.","7":"Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?","8":"Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?","9":"En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis:","10":"Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar.","11":"De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.","12":"Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.","13":"En de tollenaar, die op een afstand stond, wilde zelfs zijn ogen niet opheffen naar de hemel, maar sloeg op zijn borst en zei: O God, wees mij, zondaar, genadig!","14":"Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.","15":"En zij brachten ook de kinderen bij Hem, zodat Hij ze zou aanraken; en de discipelen, toen ze dat zagen, bestraften hen.","16":"Maar Jezus riep hen bij Zich en zei: Laat de kinderen tot Mij komen, en verhinder hen niet; want voor zulken is het Koninkrijk van God.","17":"Voorwaar, Ik zeg u: wie het Koninkrijk van God niet ontvangt als een kind, zal daar geenszins ingaan.","18":"En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven?","19":"En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God.","20":"U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.","21":"En hij zei: Al deze dingen heb ik onderhouden van mijn jeugd af aan.","22":"Toen Jezus dit hoorde, zei Hij tegen hem: Nog één ding ontbreekt u; verkoop alles wat u hebt, en deel het onder de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.","23":"Maar toen hij dit hoorde, werd hij erg verdrietig; want hij was zeer rijk.","24":"Toen Jezus zag dat hij erg verdrietig geworden was, zei Hij: Hoe moeilijk zullen zij die rijkdom hebben, het Koninkrijk van God ingaan!","25":"Want het is gemakkelijker dat een kameel door het oog van een naald gaat, dan dat een rijke het Koninkrijk van God ingaat.","26":"En zij die dit hoorden, zeiden: Wie kan dan behouden worden?","27":"En Hij zei: De dingen die onmogelijk zijn bij de mensen, zijn mogelijk bij God.","28":"En Petrus zei: Zie, wij hebben alles verlaten en zijn U gevolgd.","29":"En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,","30":"die niet veel meer terug zal ontvangen in deze tijd, en in de toekomende eeuw het eeuwige leven.","31":"En Hij nam de twaalf bij Zich en zei tegen hen: Zie, wij gaan op naar Jeruzalem, en alles wat door de profeten geschreven is over de Zoon des mensen, zal volbracht worden.","32":"Want Hij zal aan de heidenen overgeleverd worden, en Hij zal bespot worden, en smadelijk behandeld worden, en bespuwd worden.","33":"En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.","34":"En zij begrepen niets van deze dingen; en dit woord was voor hen verborgen, en zij begrepen niet wat er gezegd werd.","35":"En het gebeurde, toen Hij dicht bij Jericho kwam, dat een zekere blinde bij de weg zat te bedelen.","36":"En deze hoorde de menigte voorbijgaan en vroeg wat dat betekende.","37":"En zij vertelden hem dat Jezus de Nazarener voorbijging.","38":"En hij riep: Jezus, Zoon van David, ontferm U over mij!","39":"En zij die voorop liepen, bestraften hem, zodat hij zwijgen zou; maar hij riep des te meer: Zoon van David, ontferm U over mij!","40":"En Jezus bleef staan en beval dat men hem naar Hem toe zou brengen; en toen hij dichtbij gekomen was, vroeg Hij hem:","41":"Wat wilt u dat Ik voor u doe? En hij zei: Heere, dat ik weer kan zien.","42":"En Jezus zei tegen hem: Word ziende; uw geloof heeft u behouden.","43":"En meteen kon hij weer zien, en hij volgde Hem, terwijl hij God verheerlijkte. En al het volk dat dit zag, gaf God lof."},"SV":{"1":"En Hij zeide ook een gelijkenis tot hen, daartoe *strekkende*, dat men altijd bidden moet, en niet vertragen;","2":"Zeggende: Er was een zeker rechter in een stad, die God niet vreesde, en geen mens ontzag.","3":"En er was een zekere weduwe in dezelfde stad, en zij kwam tot hem, zeggende: Doe mij recht tegen mijn wederpartij.","4":"En hij wilde voor een *langen* tijd niet; maar daarna zeide hij bij zichzelven: Hoewel ik God niet vreze, en geen mens ontzie;","5":"Nochtans, omdat deze weduwe mij moeielijk valt, zo zal ik haar recht doen, opdat zij niet eindelijk kome, en mij het hoofd breke.","6":"En de Heere zeide: Hoort, wat de onrechtvaardige rechter zegt.","7":"Zal God dan geen recht doen Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij lankmoedig is over hen?","8":"Ik zeg u, dat Hij hun haastelijk recht doen zal. Doch de Zoon des mensen, als Hij komt, zal Hij ook geloof vinden op de aarde?","9":"En Hij zeide ook tot sommigen, die bij zichzelven vertrouwden, dat zij rechtvaardig waren, en de anderen niets achtten, deze gelijkenis:","10":"Twee mensen gingen op in den tempel om te bidden, de een was een Farizeër, en de ander een tollenaar.","11":"De Farizeër, staande, bad dit bij zichzelven: O God! ik dank U, dat ik niet ben gelijk de andere mensen, rovers, onrechtvaardigen, overspelers; of ook gelijk deze tollenaar.","12":"Ik vast tweemaal per week; ik geef tienden van alles, wat ik bezit.","13":"En de tollenaar, van verre staande, wilde ook zelfs de ogen niet opheffen naar den hemel, maar sloeg op zijn borst, zeggende: O God! wees mij zondaar genadig!","14":"Ik zeg ulieden: Deze ging af gerechtvaardigd in zijn huis, *meer* dan die; want een ieder, die zichzelven verhoogt, zal vernederd worden, en die zichzelven vernedert, zal verhoogd worden.","15":"En zij brachten ook de kinderkens tot Hem, opdat Hij die zou aanraken; en de discipelen, *dat* ziende, bestraften dezelve.","16":"Maar Jezus riep dezelve *kinderkens* tot Zich, en zeide: Laat de kinderkens tot Mij komen, en verhindert hen niet; want derzulken is het Koninkrijk Gods.","17":"Voorwaar, zeg Ik u: Zo wie het Koninkrijk Gods niet zal ontvangen als een kindeken, die zal geenszins in hetzelve komen.","18":"En een zeker overste vraagde Hem, zeggende: Goede Meester, wat doende zal ik het eeuwige leven beërven ?","19":"En Jezus zeide tot hem: Wat noemt gij Mij goed? Niemand is goed, dan Een, *namelijk* God.","20":"Gij weet de geboden: Gij zult geen overspel doen; gij zult niet doden; gij zult niet stelen; gij zult geen valse getuigenis geven; eer uw vader en uw moeder.","21":"En hij zeide: Al deze dingen heb ik onderhouden van mijn jonkheid aan.","22":"Doch Jezus, dit horende, zeide tot hem: Nog een ding ontbreekt u; verkoop alles, wat gij hebt, en deel het onder de armen, en gij zult een schat hebben in den hemel; en kom herwaarts, volg Mij.","23":"Maar als hij dit hoorde, werd hij geheel droevig; want hij was zeer rijk.","24":"Jezus nu, ziende, dat hij geheel droevig geworden was, zeide: Hoe bezwaarlijk zullen degenen, die goed hebben, in het Koninkrijk Gods ingaan!","25":"Want het is lichter, dat een kemel ga door het oog van een naald, dan dat een rijke in het Koninkrijk Gods inga.","26":"En die *dit* hoorden, zeiden: Wie kan dan zalig worden?","27":"En Hij zeide: De dingen, die onmogelijk zijn bij de mensen, zijn mogelijk bij God.","28":"En Petrus zeide: Zie, wij hebben alles verlaten, en zijn U gevolgd.","29":"En Hij zeide tot hen: Voorwaar, Ik zeg ulieden, dat er niemand is, die verlaten heeft huis, of ouders, of broeders, of vrouw, of kinderen, om het Koninkrijk Gods;","30":"Die niet zal veelvoudig weder ontvangen in dezen tijd, en in de toekomende eeuw het eeuwige leven.","31":"En Hij nam de twaalven bij Zich, en zeide tot hen: Ziet, wij gaan op naar Jeruzalem, en het zal alles volbracht worden aan den Zoon des mensen, wat geschreven is door de profeten.","32":"Want Hij zal den heidenen overgeleverd worden, en Hij zal bespot worden, en smadelijk behandeld worden, en bespogen worden.","33":"En *Hem* gegeseld hebbende, zullen zij Hem doden; en ten derden dage zal Hij wederopstaan.","34":"En zij verstonden geen van deze dingen; en dit woord was voor hen verborgen, en zij verstonden niet, hetgeen gezegd werd.","35":"En het geschiedde, als Hij nabij Jericho kwam, dat een zeker blinde aan den weg zat, bedelende.","36":"En deze, horende de schare voorbijgaan, vraagde, wat dat ware.","37":"En zij boodschapten hem, dat Jezus de Nazarener voorbijging.","38":"En hij riep, zeggende: Jezus, Gij Zone Davids, ontferm U mijner!","39":"En die voorbijgingen, bestraften hem, opdat hij zwijgen zou; maar hij riep zoveel te meer: Zone Davids, ontferm U mijner!","40":"En Jezus, *stil* staande, beval, dat men denzelven tot Hem brengen zou; en als hij nabij *Hem* gekomen was, vraagde Hij hem,","41":"Zeggende: Wat wilt gij, dat Ik u doen zal? En hij zeide: Heere! dat ik ziende mag worden.","42":"En Jezus zeide tot hem: Word ziende; uw geloof heeft u behouden.","43":"En terstond werd hij ziende, en volgde Hem, God verheerlijkende. En al het volk, *dat* ziende, gaf Gode lof."},"KJV":{"1":"And he spake a parable unto them *to this end*, that men ought always to pray, and not to faint;","2":"Saying, There was in a city a judge, which feared not God, neither regarded man:","3":"And there was a widow in that city; and she came unto him, saying, Avenge me of mine adversary.","4":"And he would not for a while: but afterward he said within himself, Though I fear not God, nor regard man;","5":"Yet because this widow troubleth me, I will avenge her, lest by her continual coming she weary me.","6":"And the Lord said, Hear what the unjust judge saith.","7":"And shall not God avenge his own elect, which cry day and night unto him, though he bear long with them?","8":"I tell you that he will avenge them speedily. Nevertheless when the Son of man cometh, shall he find faith on the earth?","9":"And he spake this parable unto certain which trusted in themselves that they were righteous, and despised others:","10":"Two men went up into the temple to pray; the one a Pharisee, and the other a publican.","11":"The Pharisee stood and prayed thus with himself, God, I thank thee, that I am not as other men *are*, extortioners, unjust, adulterers, or even as this publican.","12":"I fast twice in the week, I give tithes of all that I possess.","13":"And the publican, standing afar off, would not lift up so much as *his* eyes unto heaven, but smote upon his breast, saying, God be merciful to me a sinner.","14":"I tell you, this man went down to his house justified *rather* than the other: for every one that exalteth himself shall be abased; and he that humbleth himself shall be exalted.","15":"And they brought unto him also infants, that he would touch them: but when *his* disciples saw *it*, they rebuked them.","16":"But Jesus called them *unto him*, and said, Suffer little children to come unto me, and forbid them not: for of such is the kingdom of God.","17":"Verily I say unto you, Whosoever shall not receive the kingdom of God as a little child shall in no wise enter therein.","18":"And a certain ruler asked him, saying, Good Master, what shall I do to inherit eternal life?","19":"And Jesus said unto him, Why callest thou me good? none *is* good, save one, *that is*, God.","20":"Thou knowest the commandments, Do not commit adultery, Do not kill, Do not steal, Do not bear false witness, Honour thy father and thy mother.","21":"And he said, All these have I kept from my youth","22":"Now when Jesus heard these things, he said unto him, Yet lackest thou one thing: sell all that thou hast, and distribute unto the poor, and thou shalt have treasure in heaven: and come, follow me.","23":"And when he heard this, he was very sorrowful: for he was very rich.","24":"And when Jesus saw that he was very sorrowful, he said, How hardly shall they that have riches enter into the kingdom of God!","25":"For it is easier for a camel to go through a needle's eye, than for a rich man to enter into the kingdom of God.","26":"And they that heard *it* said, Who then can be saved?","27":"And he said, The things which are impossible with men are possible with God.","28":"Then Peter said, Lo, we have left all, and followed thee.","29":"And he said unto them, Verily I say unto you, There is no man that hath left house, or parents, or brethren, or wife, or children, for the kingdom of God's sake,","30":"Who shall not receive manifold more in this present time, and in the world to come life everlasting.","31":"Then he took *unto him* the twelve, and said unto them, Behold, we go up to Jerusalem, and all things that are written by the prophets concerning the Son of man shall be accomplished.","32":"For he shall be delivered unto the Gentiles, and shall be mocked, and spitefully entreated, and spitted on:","33":"And they shall scourge *him*, and put him to death: and the third day he shall rise again.","34":"And they understood none of these things: and this saying was hid from them, neither knew they the things which were spoken.","35":"And it came to pass, that as he was come nigh unto Jericho, a certain blind man sat by the way side begging:","36":"And hearing the multitude pass by, he asked what it meant.","37":"And they told him, that Jesus of Nazareth passeth by.","38":"And he cried, saying, Jesus, *thou* Son of David, have mercy on me.","39":"And they which went before rebuked him, that he should hold his peace: but he cried so much the more, *Thou* Son of David, have mercy on me.","40":"And Jesus stood, and commanded him to be brought unto him: and when he was come near, he asked him,","41":"Saying, What wilt thou that I shall do unto thee? And he said, Lord, that I may receive my sight.","42":"And Jesus said unto him, Receive thy sight: thy faith hath saved thee.","43":"And immediately he received his sight, and followed him, glorifying God: and all the people, when they saw *it*, gave praise unto God."}},"tsk":{"1":[{"kopje":"dat","refs":["Luk 11:5-8","Luk 21:36","Gen 32:9-12","Gen 32:24-26","Job 27:8-10","Ps 55:17","Ps 55:18","Ps 65:3","Ps 86:3","Ps 102:18","Ps 142:6-8","Jer 29:12","Rom 12:12","Ef 6:18","Fil 4:6","Kol 4:2","Kol 4:12","1 Tess 5:17"]},{"kopje":"en niet","refs":["Ps 27:13","Jona 2:7","Gal 6:9","Hebr 12:3-5"]}],"2":[{"kopje":"die","refs":["Luk 18:4","Ex 18:21","Ex 18:22","2 Kron 19:3-9","Job 29:7-17","Ps 8:2-5","Jer 22:16","Jer 22:17","Ezech 22:6-8","Micha 3:1-3","Rom 3:14-18"]},{"kopje":"ontzag","refs":["Spr 29:7","Jes 33:8"]}],"3":[{"kopje":"een zekere weduwe","refs":["Deut 27:19","2 Sam 14:5-24","Job 22:9","Job 29:13","Jes 1:17","Jes 1:21-23","Jer 5:28"]},{"kopje":"Doe mij recht","refs":["Luk 18:7","Luk 18:8","Rom 13:3","Rom 13:4"]}],"4":[{"kopje":"zei hij","refs":["Luk 12:17","Luk 16:3","Hebr 4:12","Hebr 4:13"]}],"5":[{"kopje":"omdat","refs":["Luk 11:8","Richt 16:16","2 Sam 13:24-27"]},{"kopje":"uitput","refs":["Luk 18:39","Matt 15:23","Mark 10:47","Mark 10:48"]}],"7":[{"kopje":"Zal","refs":["Luk 11:13","Matt 7:11"]},{"kopje":"recht doen","refs":["1 Sam 24:13-16","1 Sam 26:10","1 Sam 26:11","Ps 9:9","Ps 10:15-18","Ps 54:3-9","Jer 20:11-13","2 Tess 1:6","Openb 6:10","Openb 18:20"]},{"kopje":"die","refs":["Luk 2:37","Ps 88:2","1 Tess 3:10","1 Tim 5:5","2 Tim 1:3","Openb 7:15"]},{"kopje":"hoewel","refs":["Ps 13:2","Ps 13:3","Hab 2:3","Hebr 10:35-37"]}],"8":[{"kopje":"Hij","refs":["Ps 46:6","Ps 143:7-9","2 Petr 2:3","2 Petr 3:8","2 Petr 3:9"]},{"kopje":"als Hij komt","refs":["Matt 24:9-13","Matt 24:24","1 Tess 5:1-3","Hebr 10:23-26","Jak 5:1-8"]}],"9":[{"kopje":"die","refs":["Luk 10:29","Luk 15:29","Luk 16:15","Spr 30:12","Jes 65:5","Jes 66:5","Joh 9:28","Joh 9:34","Rom 7:9","Rom 9:31","Rom 9 pan class=\"wl wl-kjv\" data-code=\"G2036\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> Receive thy <span class=\"wl wl-kjv\" data-code=\"G308\">sight:</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> hath <span class=\"wl wl-kjv\" data-code=\"G4982\">saved</span> thee.","43":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3916\">immediately</span> he received his <span class=\"wl wl-kjv\" data-code=\"G308\">sight,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G190\">followed</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G1392\">glorifying</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G2992\">people,</span> when they <span class=\"wl wl-kjv\" data-code=\"G1492\">saw</span> it, <span class=\"wl wl-kjv\" data-code=\"G1325\">gave</span> <span class=\"wl wl-kjv\" data-code=\"G136\">praise</span> unto God."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
