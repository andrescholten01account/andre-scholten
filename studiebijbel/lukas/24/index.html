naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En op de eerste dag van de week, heel vroeg in de morgenstond, gingen zij naar het graf, en droegen de specerijen die zij bereid hadden, en sommigen met hen.","2":"En zij vonden de steen afgewenteld van het graf.","3":"En toen zij naar binnen gegaan waren, vonden zij het lichaam van de Heere Jezus niet.","4":"En het gebeurde, terwijl zij daarover in verwarring waren, zie, twee mannen stonden bij hen in blinkende kleren.","5":"En toen zij zeer bevreesd werden en het gezicht naar de aarde neigden, zeiden zij tegen hen: Wat zoekt u de Levende bij de doden?","6":"Hij is hier niet, maar Hij is opgestaan. Denk eraan hoe Hij tot u gesproken heeft, toen Hij nog in Galilea was,","7":"en zei: De Zoon des mensen moet overgeleverd worden in de handen van zondige mensen, en gekruisigd worden, en op de derde dag weer opstaan.","8":"En zij herinnerden zich Zijn woorden.","9":"En toen zij van het graf teruggekeerd waren, vertelden zij al deze dingen aan de elf, en aan alle anderen.","10":"En dit waren Maria Magdalena, en Johanna, en Maria, de moeder van Jakobus, en de andere vrouwen met hen, die dit tegen de apostelen zeiden.","11":"En hun woorden leken hun als onzinnig gepraat, en zij geloofden hen niet.","12":"Maar Petrus stond op en liep naar het graf, en bukte zich voorover, en zag de linnen doeken alleen liggen, en ging weg, terwijl hij zich bij zichzelf verwonderde over wat er gebeurd was.","13":"En zie, twee van hen gingen diezelfde dag naar een dorp, dat zestig stadiën van Jeruzalem lag, waarvan de naam Emmaüs was;","14":"en zij spraken samen met elkaar over al deze dingen die er gebeurd waren.","15":"En het gebeurde, terwijl zij samen spraken en elkaar ondervroegen, dat Jezus Zelf bij hen kwam, en met hen meeging.","16":"En hun ogen werden gehouden, zodat zij Hem niet herkenden.","17":"En Hij zei tegen hen: Wat zijn dit voor gesprekken die u onderweg met elkaar voert, en waarom kijkt u zo droevig?","18":"En de een, wiens naam Kleopas was, antwoordde en zei tegen Hem: Bent u alleen een vreemdeling in Jeruzalem, die niet weet wat daar deze dagen gebeurd is?","19":"En Hij zei tegen hen: Wat dan? En zij zeiden tegen Hem: De dingen aangaande Jezus de Nazarener, Die een Profeet was, machtig in werken en woorden, voor God en voor heel het volk.","20":"En hoe onze overpriesters en leiders Hem overgeleverd hebben tot het oordeel van de dood, en Hem gekruisigd hebben.","21":"En wij hoopten dat Hij Degene was Die Israël verlossen zou. Maar toch, ook naast dit alles, is het vandaag de derde dag sinds deze dingen gebeurd zijn.","22":"Maar ook enkele vrouwen uit ons midden hebben ons verbaasd, die vroeg in de morgenstond bij het graf geweest zijn;","23":"en toen zij Zijn lichaam niet vonden, kwamen zij en zeiden dat zij ook een verschijning van engelen gezien hadden, die zeggen dat Hij leeft.","24":"En sommigen van hen die met ons zijn, gingen naar het graf, en vonden het zo als de vrouwen ook gezegd hadden; maar Hem zagen zij niet.","25":"En Hij zei tegen hen: O onverstandigen en tragen van hart om te geloven al wat de profeten gesproken hebben!","26":"Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?","27":"En Hij begon bij Mozes en bij al de profeten, en legde hun uit, in al de Schriften, wat over Hemzelf geschreven was.","28":"En zij kwamen dichtbij het dorp waar zij naartoe gingen; en Hij deed alsof Hij verder zou gaan.","29":"En zij drongen bij Hem aan en zeiden: Blijf bij ons, want het is bijna avond, en de dag is bijna voorbij. En Hij ging naar binnen om bij hen te blijven.","30":"En het gebeurde, terwijl Hij met hen aan tafel zat, dat Hij het brood nam, en het zegende, en toen Hij het gebroken had, gaf Hij het hun.","31":"En hun ogen werden geopend, en zij herkenden Hem; en Hij verdween uit hun gezicht.","32":"En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?","33":"En zij stonden op datzelfde uur op, en keerden terug naar Jeruzalem, en vonden de elf bijeengebracht, en hen die bij hen waren;","34":"die zeiden: De Heere is werkelijk opgestaan, en is aan Simon verschenen.","35":"En zij vertelden wat er onderweg gebeurd was, en hoe Hij door hen herkend was bij het breken van het brood.","36":"En terwijl zij over deze dingen spraken, stond Jezus Zelf in hun midden, en zei tegen hen: Vrede zij u!","37":"En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen.","38":"En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart?","39":"Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.","40":"En toen Hij dit gezegd had, toonde Hij hun de handen en de voeten.","41":"En toen zij het van blijdschap nog niet geloofden, en zich verwonderden, zei Hij tegen hen: Hebt u hier iets te eten?","42":"En zij gaven Hem een stuk gebraden vis, en wat honingraat.","43":"En Hij nam het, en at het voor hun ogen.","44":"En Hij zei tegen hen: Dit zijn de woorden die Ik tot u sprak, toen Ik nog bij u was, namelijk dat alles moest vervuld worden wat over Mij geschreven is in de Wet van Mozes, en de Profeten, en de Psalmen.","45":"Toen opende Hij hun verstand, zodat zij de Schriften begrepen.","46":"En Hij zei tegen hen: Zo staat er geschreven, en zo moest de Christus lijden, en op de derde dag opstaan uit de doden.","47":"En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.","48":"En u bent getuigen van deze dingen.","49":"En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.","50":"En Hij leidde hen naar buiten tot bij Bethanië, en hief Zijn handen op en zegende hen.","51":"En het gebeurde, terwijl Hij hen zegende, dat Hij van hen scheidde, en opgenomen werd in de hemel.","52":"En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.","53":"En zij waren voortdurend in de tempel, waar zij God loofden en dankten. Amen."},"SV":{"1":"En op den eersten *dag* der week, zeer vroeg in den morgenstond, gingen zij naar het graf, dragende de specerijen, die zij bereid hadden, en sommigen met haar.","2":"En zij vonden den steen afgewenteld van het graf.","3":"En ingegaan zijnde, vonden zij het lichaam van den Heere Jezus niet.","4":"En het geschiedde, als zij daarover twijfelmoedig waren, zie, twee mannen stonden bij haar in blinkende klederen.","5":"En als zij zeer bevreesd werden, en het aangezicht naar de aarde neigden, zeiden zij tot haar: Wat zoekt gij den Levende bij de doden?","6":"Hij is hier niet, maar Hij is opgestaan. Gedenkt, hoe Hij tot u gesproken heeft, als Hij nog in Galilea was,","7":"Zeggende: De Zoon des mensen moet overgeleverd worden in de handen der zondige mensen, en gekruisigd worden, en ten derden dage wederopstaan.","8":"En zij werden indachtig Zijner woorden.","9":"En wedergekeerd zijnde van het graf, boodschapten zij al deze dingen aan de elven, en aan al de anderen.","10":"En *deze* waren Maria Magdalena, en Johanna, en Maria, *de* *moeder* van Jakobus, en de andere met haar, die dit tot de apostelen zeiden.","11":"En haar woorden schenen voor hen als ijdel geklap, en zij geloofden haar niet.","12":"Doch Petrus opstaande, liep tot het graf, en nederbukkende, zag hij de linnen doeken, liggende alleen, en ging weg, zich verwonderende bij zichzelven van hetgeen geschied was.","13":"En zie, twee van hen gingen op denzelfden dag naar een vlek, dat zestig stadiën van Jeruzalem was, welks naam was Emmaüs;","14":"En zij spraken samen onder elkander van al deze dingen, die er gebeurd waren.","15":"En het geschiedde, terwijl zij samen spraken, en elkander ondervraagden, dat Jezus Zelf bij *hen* kwam, en met hen ging.","16":"En hun ogen werden gehouden, dat zij Hem niet kenden.","17":"En Hij zeide tot hen: Wat redenen zijn dit, die gij, wandelende, onder elkander verhandelt, en *waarom* ziet gij droevig?","18":"En de een, wiens naam was Kleopas, antwoordende, zeide tot Hem: Zijt Gij alleen een vreemdeling te Jeruzalem, en weet niet de dingen, die deze dagen daarin geschied zijn?","19":"En Hij zeide tot hen: Welke? En zij zeiden tot Hem: De dingen aangaande Jezus den Nazarener, Welke een Profeet was, krachtig in werken en woorden, voor God en al het volk.","20":"En hoe onze overpriesters en oversten Denzelven overgeleverd hebben tot het oordeel des doods, en Hem gekruisigd hebben.","21":"En wij hoopten, dat Hij was Degene, Die Israël verlossen zou. Doch ook, benevens dit alles, is het heden de derde dag, van dat deze dingen geschied zijn.","22":"Maar ook sommige vrouwen uit ons hebben ons ontsteld, die vroeg in den morgenstond aan het graf geweest zijn;","23":"En Zijn lichaam niet vindende, kwamen zij en zeiden, dat zij ook een gezicht van engelen gezien hadden, die zeggen, dat Hij leeft.","24":"En sommigen dergenen, die met ons zijn, gingen heen tot het graf, en bevonden het alzo, gelijk ook de vrouwen gezegd hadden; maar Hem zagen zij niet.","25":"En Hij zeide tot hen: O onverstandigen en tragen van hart, om te geloven al hetgeen de profeten gesproken hebben!","26":"Moest de Christus niet deze dingen lijden, en *alzo* in Zijn heerlijkheid ingaan?","27":"En begonnen hebbende van Mozes en van al de profeten, legde Hij hun uit, in al de Schriften, hetgeen van Hem *geschreven* was.","28":"En zij kwamen nabij het vlek, daar zij naar toegingen; en Hij hield Zich, alsof Hij verder gaan zou.","29":"En zij dwongen Hem, zeggende: Blijf met ons; want het is bij den avond, en de dag is gedaald. En Hij ging in, om met hen te blijven.","30":"En het geschiedde, als Hij met hen aanzat, nam Hij het brood, en zegende het, en als Hij het gebroken had, gaf Hij het hun.","31":"En hun ogen werden geopend, en zij kenden Hem; en Hij kwam weg uit hun gezicht.","32":"En zij zeiden tot elkander: Was ons hart niet brandende in ons, als Hij tot ons sprak op den weg, en als Hij ons de Schriften opende?","33":"En zij, opstaande ter zelfder ure, keerden weder naar Jeruzalem, en vonden de elven samenvergaderd, en die met hen waren;","34":"Welke zeiden: De Heere is waarlijk opgestaan, en is van Simon gezien.","35":"En zij vertelden, hetgeen op den weg *geschied* *was*, en hoe Hij hun bekend was geworden in het breken des broods.","36":"En als zij van deze dingen spraken, stond Jezus Zelf in het midden van hen, en zeide tot hen: Vrede zij ulieden!","37":"En zij verschrikt en zeer bevreesd geworden zijnde, meenden, dat zij een geest zagen.","38":"En Hij zeide tot hen: Wat zijt gij ontroerd, en waarom klimmen *zulke* overleggingen in uw harten?","39":"Ziet Mijn handen en Mijn voeten; want Ik ben het Zelf; tast Mij aan, en ziet; want een geest heeft geen vlees en benen, gelijk gij ziet, dat Ik heb.","40":"En als Hij dit zeide, toonde Hij hun de handen en de voeten.","41":"En toen zij het van blijdschap nog niet geloofden, en zich verwonderden, zeide Hij tot hen: Hebt gij hier iets om te eten?","42":"En zij gaven Hem een stuk van een gebraden vis, en van honigraten.","43":"En Hij nam het, en at het voor hun ogen.","44":"En Hij zeide tot hen: Dit zijn de woorden, die Ik tot u sprak, als Ik nog met u was, *namelijk* dat het alles moest vervuld worden, wat van Mij geschreven is in de Wet van Mozes, en de Profeten, en Psalmen.","45":"Toen opende Hij hun verstand, opdat zij de Schriften verstonden.","46":"En zeide tot hen: Alzo is er geschreven, en alzo moest de Christus lijden, en van de doden opstaan ten derden dage.","47":"En in Zijn Naam gepredikt worden bekering en vergeving der zonden, onder alle volken, beginnende van Jeruzalem.","48":"En gij zijt getuigen van deze dingen.","49":"En ziet, Ik zende de belofte Mijns Vaders op u; maar blijft gij in de stad Jeruzalem, totdat gij zult aangedaan zijn met kracht uit de hoogte.","50":"En Hij leidde hen buiten tot aan Bethanië, en Zijn handen opheffende, zegende Hij hen.","51":"En het geschiedde, als Hij hen zegende, dat Hij van hen scheidde, en werd opgenomen in den hemel.","52":"En zij aanbaden Hem, en keerden weder naar Jeruzalem met grote blijdschap.","53":"En zij waren allen tijd in den tempel, lovende en dankende God. Amen."},"KJV":{"1":"Now upon the first *day* of the week, very early in the morning, they came unto the sepulchre, bringing the spices which they had prepared, and certain *others* with them.","2":"And they found the stone rolled away from the sepulchre.","3":"And they entered in, and found not the body of the Lord Jesus.","4":"And it came to pass, as they were much perplexed thereabout, behold, two men stood by them in shining garments:","5":"And as they were afraid, and bowed down *their* faces to the earth, they said unto them, Why seek ye the living among the dead?","6":"He is not here, but is risen: remember how he spake unto you when he was yet in Galilee,","7":"Saying, The Son of man must be delivered into the hands of sinful men, and be crucified, and the third day rise again.","8":"And they remembered his words,","9":"And returned from the sepulchre, and told all these things unto the eleven, and to all the rest.","10":"It was Mary Magdalene, and Joanna, and Mary *the mother* of James, and other *women that were* with them, which told these things unto the apostles.","11":"And their words seemed to them as idle tales, and they believed them not.","12":"Then arose Peter, and ran unto the sepulchre; and stooping down, he beheld the linen clothes laid by themselves, and departed, wondering in himself at that which was come to pass.","13":"And, behold, two of them went that same day to a village called Emmaus, which was from Jerusalem *about* threescore furlongs.","14":"And they talked together of all these things which had happened.","15":"And it came to pass, that, while they communed *together* and reasoned, Jesus himself drew near, and went with them.","16":"But their eyes were holden that they should not know him.","17":"And he said unto them, What manner of communications *are* these that ye have one to another, as ye walk, and are sad?","18":"And the one of them, whose name was Cleopas, answering said unto him, Art thou only a stranger in Jerusalem, and hast not known the things which are come to pass there in these days?","19":"And he said unto them, What things? And they said unto him, Concerning Jesus of Nazareth, which was a prophet mighty in deed and word before God and all the people:","20":"And how the chief priests and our rulers delivered him to be condemned to death, and have crucified him.","21":"But we trusted that it had been he which should have redeemed Israel: and beside all this, to day is the third day since these things were done.","22":"Yea, and certain women also of our company made us astonished, which were early at the sepulchre;","23":"And when they found not his body, they came, saying, that they had also seen a vision of angels, which said that he was alive.","24":"And certain of them which were with us went to the sepulchre, and found *it* even so as the women had said: but him they saw not.","25":"Then he said unto them, O fools, and slow of heart to believe all that the prophets have spoken:","26":"Ought not Christ to have suffered these things, and to enter into his glory?","27":"And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself.","28":"And they drew nigh unto the village, whither they went: and he made as though he would have gone further.","29":"But they constrained him, saying, Abide with us: for it is toward evening, and the day is far spent. And he went in to tarry with them.","30":"And it came to pass, as he sat at meat with them, he took bread, and blessed *it*, and brake, and gave to them.","31":"And their eyes were opened, and they knew him; and he vanished out of their sight.","32":"And they said one to another, Did not our heart burn within us, while he talked with us by the way, and while he opened to us the scriptures?","33":"And they rose up the same hour, and returned to Jerusalem, and found the eleven gathered together, and them that were with them,","34":"Saying, The Lord is risen indeed, and hath appeared to Simon.","35":"And they told what things *were done* in the way, and how he was known of them in breaking of bread.","36":"And as they thus spake, Jesus himself stood in the midst of them, and saith unto them, Peace *be* unto you.","37":"But they were terrified and affrighted, and supposed that they had seen a spirit.","38":"And he said unto them, Why are ye troubled? and why do thoughts arise in your hearts?","39":"Behold my hands and my feet, that it is I myself: handle me, and see; for a spirit hath not flesh and bones, as ye see me have.","40":"And when he had thus spoken, he shewed them *his* hands and *his* feet.","41":"And while they yet believed not for joy, and wondered, he said unto them, Have ye here any meat?","42":"And they gave him a piece of a broiled fish, and of an honeycomb.","43":"And he took *it*, and did eat before them.","44":"And he said unto them, These *are* the words which I spake unto you, while I was yet with you, that all things must be fulfilled, which were written in the law of Moses, and *in* the prophets, and *in* the psalms, concerning me.","45":"Then opened he their understanding, that they might understand the scriptures,","46":"And said unto them, Thus it is written, and thus it behoved Christ to suffer, and to rise from the dead the third day:","47":"And that repentance and remission of sins should be preached in his name among all nations, beginning at Jerusalem.","48":"And ye are witnesses of these things.","49":"And, behold, I send the promise of my Father upon you: but tarry ye in the city of Jerusalem, until ye be endued with power from on high.","50":"And he led them out as far as to Bethany, and he lifted up his hands, and blessed them.","51":"And it came to pass, while he blessed them, he was parted from them, and carried up into heaven.","52":"And they worshipped him, and returned to Jerusalem with great joy:","53":"And were continually in the temple, praising and blessing God. Amen."}},"tsk":{"1":[{"kopje":"op","refs":["Matt 28:1","Mark 16:1","Mark 16:2","Joh 20:1","Joh 20:2"]},{"kopje":"gingen zij","refs":["Luk 24:10","Luk 8:2","Luk 8:3","Luk 23:55","Luk 23:56","Matt 27:55","Matt 27:56","Mark 15:40"]}],"4":[{"kopje":"twee mannen","refs":["Gen 18:2","Matt 28:2-6","Mark 16:5","Joh 20:11","Joh 20:12","Hand 1:10","Mark 16:2"]}],"5":[{"kopje":"zij","refs":["Luk 1:12","Luk 1:13","Luk 1:29","Dan 8:17","Dan 8:18","Dan 10:7-12","Dan 10:16","Dan 10:19","Matt 28:3-5","Mark 16: =\"G1125\">written</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> of <span class=\"wl wl-kjv\" data-code=\"G3475\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in the <span class=\"wl wl-kjv\" data-code=\"G4396\">prophets,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in the <span class=\"wl wl-kjv\" data-code=\"G5568\">psalms,</span> <span class=\"wl wl-kjv\" data-code=\"G4012\">concerning</span> me.","45":"<span class=\"wl wl-kjv\" data-code=\"G5119\">Then</span> opened <span class=\"wl wl-kjv\" data-code=\"G1272\">he</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G3563\">understanding,</span> that they might <span class=\"wl wl-kjv\" data-code=\"G4920\">understand</span> the scriptures,","46":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G2036\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">Thus</span> it is <span class=\"wl wl-kjv\" data-code=\"G1125\">written,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">thus</span> it <span class=\"wl wl-kjv\" data-code=\"G1163\">behoved</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> to <span class=\"wl wl-kjv\" data-code=\"G3958\">suffer,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> to <span class=\"wl wl-kjv\" data-code=\"G450\">rise</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G3498\">dead</span> the <span class=\"wl wl-kjv\" data-code=\"G5154\">third</span> day:","47":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> that <span class=\"wl wl-kjv\" data-code=\"G3341\">repentance</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G859\">remission</span> of <span class=\"wl wl-kjv\" data-code=\"G266\">sins</span> should be <span class=\"wl wl-kjv\" data-code=\"G2784\">preached</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3686\">name</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">among</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1484\">nations,</span> <span class=\"wl wl-kjv\" data-code=\"G756\">beginning</span> <span class=\"wl wl-kjv\" data-code=\"G575\">at</span> Jerusalem.","48":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G5210\">ye</span> <span class=\"wl wl-kjv\" data-code=\"G2075\">are</span> <span class=\"wl wl-kjv\" data-code=\"G3144\">witnesses</span> of these things.","49":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And,</span> <span class=\"wl wl-kjv\" data-code=\"G2400\">behold,</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G649\">send</span> the <span class=\"wl wl-kjv\" data-code=\"G1860\">promise</span> of <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G3962\">Father</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> <span class=\"wl wl-kjv\" data-code=\"G2523\">tarry</span> <span class=\"wl wl-kjv\" data-code=\"G5210\">ye</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G4172\">city</span> of <span class=\"wl wl-kjv\" data-code=\"G2419\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"G2193\">until</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">ye</span> be <span class=\"wl wl-kjv\" data-code=\"G1746\">endued</span> with <span class=\"wl wl-kjv\" data-code=\"G1411\">power</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> on high.","50":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G1806\">led</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them</span> <span class=\"wl wl-kjv\" data-code=\"G1854\">out</span> as far <span class=\"wl wl-kjv\" data-code=\"G2193\">as</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G963\">Bethany,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> he lifted <span class=\"wl wl-kjv\" data-code=\"G1869\">up</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G5495\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"G2127\">blessed</span> them.","51":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> it came to <span class=\"wl wl-kjv\" data-code=\"G1096\">pass,</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">while</span> <span class=\"wl wl-kjv\" data-code=\"G846\">he</span> <span class=\"wl wl-kjv\" data-code=\"G2127\">blessed</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> he was <span class=\"wl wl-kjv\" data-code=\"G1339\">parted</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> carried <span class=\"wl wl-kjv\" data-code=\"G399\">up</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> heaven.","52":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G846\">they</span> <span class=\"wl wl-kjv\" data-code=\"G4352\">worshipped</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> and <span class=\"wl wl-kjv\" data-code=\"G5290\">returned</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G2419\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G3173\">great</span> joy:","53":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">were</span> <span class=\"wl wl-kjv\" data-code=\"G1275\">continually</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G2411\">temple,</span> <span class=\"wl wl-kjv\" data-code=\"G134\">praising</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2127\">blessing</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God.</span> Amen."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"eersten dag","tekst":"Grieks op ene."},{"catchword":"der week,","tekst":"Grieks der sabbaten. Zie Mat 28:1 ; Mar 16:2 ."},{"catchword":"zeer vroeg in den morgenstond,","tekst":"Zie hiervan de aantekeningen Mar 16:2 ."},{"catchword":"sommigen met haar","tekst":"Namelijk andere vrouwen, van welke zie nader vs.10."}],"4":[{"catchword":"twijfelmoedig waren,","tekst":"Of, zeer bekommerd."},{"catchword":"mannen stonden bij haar in","tekst":"Dat is, engelen in mans gedaanten . Zie Mat 28:2 , die maar van een verhaalt, omdat die het woord voerde."},{"catchword":"blinkende klederen","tekst":"Grieks bliksemende; dat is glinsterende gelijk de bliksem."}],"6":[{"catchword":"gesproken heeft,","tekst":"Waarvan zie Mat 16:21 ."}],"9":[{"catchword":"al de anderen","tekst":"Namelijk discipelen, die daar vergaderd waren."}],"10":[{"catchword":"Johanna, en Maria,","tekst":"Zie van deze Johanna Luk 8:3 ."},{"catchword":"de moeder van Jakobus,","tekst":"Namelijk van den kleinen. Zie Mar 15:40 ."}],"11":[{"catchword":"ijdel geklap,","tekst":"Of, razernij, sufferij."}],"12":[{"catchword":"liep tot het graf,","tekst":"Namelijk met Johannes. Zie Joh 20:3 ."}],"13":[{"catchword":"van hen gingen op denzelfden dag naar een vlek,","tekst":"Niet van de apostelen, maar van de andere discipelen, gelijk blijkt vs.18, 33."},{"catchword":"stadiën van Jeruzalem was,","tekst":"Een stadie is honderd en vijf en twintig schreden, zodat acht stadiën maken een Italiaanse mijl, waarvan drie omtrent een uur gaans zijn; zodat zestig stadiën maken omtrent twee en een half uur gaans."}],"16":[{"catchword":"gehouden,","tekst":"Dat is, wederhouden door Christus' macht."},{"catchword":"dat zij Hem niet kenden","tekst":"Of, opdat zij Hem niet zouden kennen."}],"17":[{"catchword":"droevig?","tekst":"Of, stuur."}],"18":[{"catchword":"een vreemdeling te Jeruzalem,","tekst":"Of, een inwoner."}],"19":[{"catchword":"een Profeet was,","tekst":"Grieks een man, een profeet."},{"catchword":"in werken en woorden,","tekst":"Grieks inderdaad, ook in het werk en in het woord."},{"catchword":"voor God","tekst":"Namelijk die door vele wondertekenen zulks van Hem betuigde."},{"catchword":"het volk","tekst":"Namelijk dat zulks met verwondering en prijzen hoorde en zag."}],"21":[{"catchword":"Israël","tekst":"Dat is, het Israëlietische of Joodse volk."},{"catchword":"verlossen zou","tekst":"Dat is, verlost zou hebben."}],"22":[{"catchword":"uit ons hebben ons ontsteld,","tekst":"Dat is, van ons gezelschap."}],"26":[{"catchword":"ingaan?","tekst":"Namelijk na of door Zijn lijden; Heb 2:9 ; 1Pe 1:11 ."}],"28":[{"catchword":"hield Zich,","tekst":"Of, stelde zich zo aan; hetwelk zonder veinzing geschied is, om hen te beproeven; alzo Hij het gedaan zou hebben, tenware zij Hem met bidden gehouden hadden."}],"29":[{"catchword":"dwongen Hem,","tekst":"Namelijk met bidden en aanhouden. Zie Gen 33:11 ."}],"30":[{"catchword":"zegende het,","tekst":"Namelijk door gebed en dankzegging, 1Ti 4:4-5 ."},{"catchword":"gebroken had, gaf Hij het hun","tekst":"Namelijk naar de wijze der Joden in het begin van hunne maaltijden, welker broden zo gebakken waren, dat zij bekwamelijk gebroken konden worden, Act 2:46 ."}],"31":[{"catchword":"kwam weg uit hun gezicht","tekst":"Grieks Hij werd onschijnbaar van hen; dat is, Hij onttrok zich haastelijk aan hun gezicht."}],"32":[{"catchword":"opende?","tekst":"Dat is, verklaarde, of uitlegde."}],"34":[{"catchword":"Welke zeiden","tekst":"Namelijk elven, en die bij hen waren."}],"37":[{"catchword":"een geest zagen","tekst":"Dat is, spooksel. Zie Mat 14:26 . Of, een engel in menselijke gedaante, Act 12:9 ."}],"39":[{"catchword":"want Ik ben het Zelf;","tekst":"Of, dat Ik het zelf ben."}],"41":[{"catchword":"om te eten?","tekst":"Grieks etelijks, of eetbaars."}],"43":[{"catchword":"at het voor hun ogen","tekst":"Niet dat Hij zulks van node had, dewijl Hij nu onsterflijk geworden was; maar om hun te verzekeren dat Hij hetzelfde lichaam nog had. Zie Act 10:41 ."}],"44":[{"catchword":"met u was,","tekst":"Dat is, openbaar en gedurig met u verkeerde vóór mijn dood."}],"45":[{"catchword":"opende Hij hun verstand,","tekst":"Namelijk door de verlichting Zijns Heiligen Geestes; Act 16:14 ; 1Co 2:13 ."}],"47":[{"catchword":"beginnende van Jeruzalem","tekst":"Dewijl den Joden voornamelijk de Messias beloofd was, Rom 1:16 , en het Evangelie uit Zion en Jeruzalem moest uitgaan, Isa 2:3 ."}],"49":[{"catchword":"belofte Mijns Vaders op u;","tekst":"Dat is, den Heiligen Geest, dien Ik u beloofd heb van den Vader te zullen zenden; Joh 14:16 , en Joh 15:26 ; Act 1:4 ."},{"catchword":"blijft gij in de stad Jeruzalem,","tekst":"Grieks zet u neder."},{"catchword":"kracht","tekst":"Namelijk met den Heiligen Geest; Act 1:8 ."},{"catchword":"uit de hoogte","tekst":"Dat is, uit den hemel; Heb 1:3 ; Act 2:2 ."}],"50":[{"catchword":"buiten tot aan Bethánië,","tekst":"Zie hiervan breder Act 1:12 ."}],"53":[{"catchword":"dankende God","tekst":"Grieks zegenende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"AND on the first (day) [Gr. one] of the week [Gr. of the Sabbaths. See Mat. 28.1. Mark. 16. 2] very early in the morning, [see hereof the annotation on Mark. 16.2. Gr. deep in the morning] they went to the grave, carrying the spices which they had prepared, and some with them. [namely, other women of whom see further v.10.]"}],"2":[{"catchword":null,"tekst":"And they found the Stone rolled away from the grave."}],"3":[{"catchword":null,"tekst":"And being entred in they found not the body of the Lord Jesus."}],"4":[{"catchword":null,"tekst":"And it came to pass as they were doubtful about it, [Or very troubled] behold two men [i.e. Angels in the shape of men, see Mat 28.2. who makes mention but of one because he spake to them] stood by them in shining garments. [Gr. lightning, i.e. glistering like lightning.]"}],"5":[{"catchword":null,"tekst":"And as they were greatly afraid and bowed the face towards the Earth, they said unto them. What seek ye the living with the dead?"}],"6":[{"catchword":null,"tekst":"He is not here, but he is risen. Remember how he spake unto you [Whereof see Mat. 26.21.] while he was yet in Galilee:"}],"7":[{"catchword":null,"tekst":"Saying the Son of Man must be delivered over to sinfull men, and be crucified, and the third day rise again."}],"8":[{"catchword":null,"tekst":"And they remembered his words."}],"9":[{"catchword":null,"tekst":"And being returned from the grave, they told all these things to the eleven, and to all the other. [Namely disciples, which were there gathered together.]"}],"10":[{"catchword":null,"tekst":"And (these) were Mary Magdalen and Mary (the mother) of James and Joanna; [See concerning this Joanna, Luk 8:3. and Mary (the mother) of James [Namely the less. See Mark. 15.40.] and the other with them, which said this to the Apostles"}],"11":[{"catchword":null,"tekst":"And their words seemed before them as idle talk. [Or madness dotage] and they believed them not."}],"12":[{"catchword":null,"tekst":"But Peter rising up ran to the grave [Namely with John. See Joh 20:3] and stooping down he saw the linen clothes lying alone, and away, wondering with himself at that which happened."}],"13":[{"catchword":null,"tekst":"And behold two of them [Namely n // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

      '</div>').join('') : '';

}

  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
