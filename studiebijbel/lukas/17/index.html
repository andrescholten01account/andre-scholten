n de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "3": "Let op uzelf. En als uw broeder tegen u zondigt, bestraf hem; en als hij berouw heeft, vergeef het hem.", "4": "En als hij zevenmaal per dag tegen u zondigt, en zevenmaal per dag naar u terugkeert en zegt: Het spijt mij, zult u het hem vergeven.", "5": "En de apostelen zeiden tegen de Heere: Vermeerder ons geloof.", "6": "En de Heere zei: Als u een geloof had als een mosterdzaad, zou u tegen deze moerbeiboom zeggen: Word ontworteld en in de zee geplant, en hij zou u gehoorzaam zijn.", "7": "En wie van u die een dienstknecht heeft die ploegt of de dieren hoedt, zal tegen hem zeggen, als hij van de akker komt: Kom meteen aan tafel?", "8": "Maar zal hij niet tegen hem zeggen: Maak klaar wat ik vanavond zal eten, omgord u en dien mij, totdat ik gegeten en gedronken heb; en daarna kunt u eten en drinken?", "9": "Dankt hij die dienstknecht ervoor dat hij gedaan heeft wat hem bevolen was? Ik denk het niet.", "10": "Zo ook u: wanneer u alles gedaan hebt wat u bevolen is, zeg dan: Wij zijn onnutte dienstknechten; want wij hebben *alleen maar* gedaan wat wij verplicht waren te doen.", "11": "En het gebeurde, toen Hij naar Jeruzalem reisde, dat Hij door het midden van Samaria en Galilea ging.", "12": "En toen Hij in een zeker dorp kwam, ontmoetten Hem tien melaatse mannen, die van verre bleven staan;", "13": "en zij verhieven hun stem en zeiden: Jezus, Meester, ontferm U over ons!", "14": "En toen Hij hen zag, zei Hij tegen hen: Ga heen en laat uzelf zien aan de priesters. En het gebeurde, terwijl zij heengingen, dat zij gereinigd werden.", "15": "En een van hen, die zag dat hij genezen was, keerde terug en verheerlijkte God met luide stem.", "16": "En hij viel op zijn gezicht voor Zijn voeten en dankte Hem; en dat was een Samaritaan.", "17": "En Jezus antwoordde en zei: Zijn niet de tien gereinigd? Maar waar zijn de negen?", "18": "En is er niemand gevonden die terugkeert om God eer te geven, dan deze vreemdeling?", "19": "En Hij zei tegen hem: Sta op en ga heen; uw geloof heeft u behouden.", "20": "En toen Hij door de Farizeeën gevraagd werd wanneer het Koninkrijk van God komen zou, antwoordde Hij hun en zei: Het Koninkrijk van God komt niet zichtbaar[1].", "21": "En men zal niet zeggen: Zie hier, of zie daar, want zie, het Koninkrijk van God is binnen in u.", "22": "En Hij zei tegen de discipelen: Er zullen dagen komen, waarin u zult verlangen één van de dagen van de Zoon des mensen te zien, en u zult die niet zien.", "23": "En zij zullen tegen u zeggen: Zie hier, of zie daar is Hij; ga niet heen en volg niet.", "24": "Want zoals de bliksem, die van het ene einde onder de hemel bliksemt, tot het andere einde onder de hemel schijnt, zo zal ook de Zoon des mensen zijn in Zijn dag.", "25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "26": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen.", "27": "Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf.", "28": "Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "29": "maar op de dag waarop Lot uit Sodom wegging, regende het vuur en zwavel uit de hemel, en dat verdierf hen allen.", "30": "Precies zo zal het zijn op de dag waarop de Zoon des mensen geopenbaard zal worden.", "31": "Op die dag, wie op het dak zal zijn, met zijn huisraad in huis, laat hij niet naar beneden komen om het weg te nemen; en wie op de akker zal zijn, laat hij zich evenmin omkeren naar wat achter hem is.", "32": "Denk aan de vrouw van Lot.", "33": "Wie zijn leven zal zoeken te behouden, zal het verliezen; en wie het zal verliezen, zal het in het leven behouden.", "34": "Ik zeg u: In die nacht zullen er twee op één bed zijn; de één zal aangenomen worden, en de ander zal achtergelaten worden.", "35": "Twee *vrouwen* zullen samen malen; de één zal aangenomen worden, en de ander zal achtergelaten worden.", "36": "Twee zullen op de akker zijn; de één zal aangenomen worden, en de ander zal achtergelaten worden.", "37": "En zij antwoordden en zeiden tegen Hem: Waar, Heere? En Hij zei tegen hen: Waar het lichaam is, daar zullen de arenden zich verzamelen."}, "SV": {"1": "En Hij zeide tot de discipelen: Het kan niet wezen, dat er geen ergernissen komen; doch wee *hem*, door welken zij komen;", "2": "Het zoude hem nuttiger zijn, dat een molensteen om zijn hals gedaan ware, en hij in de zee geworpen, dan dat hij een van deze kleinen zou ergeren.", "3": "Wacht uzelven. En indien uw broeder tegen u zondigt, zo bestraf hem; en indien het hem leed is, zo vergeef het hem.", "4": "En indien hij zevenmaal daags tegen u zondigt, en zevenmaal daags tot u wederkeert, zeggende: Het is mij leed; zo zult gij het hem vergeven.", "5": "En de apostelen zeiden tot den Heere: Vermeerder ons het geloof.", "6": "En de Heere zeide: Zo gij een geloof hadt als een mostaardzaad, gij zoudt tegen dezen moerbezienboom zeggen: Word ontworteld, en in de zee geplant, en hij zou u gehoorzaam zijn.", "7": "En wie van u heeft een dienstknecht ploegende, of *de* *beesten* hoedende, die tot hem, als hij van den akker inkomt, terstond zal zeggen: Kom bij, en zit aan?", "8": "Maar zal hij niet tot hem zeggen: Bereid, dat ik te avond zal eten, en omgord u, en dien mij, totdat ik zal gegeten en gedronken hebben; en eet en drink gij daarna?", "9": "Dankt hij ook denzelven dienstknecht omdat hij gedaan heeft, hetgeen hem bevolen was? Ik meen, neen.", "10": "Alzo ook gij, wanneer gij zult gedaan hebben al hetgeen u bevolen is, zo zegt: Wij zijn onnutte dienstknechten; want wij hebben *maar* gedaan, hetgeen wij schuldig waren te doen.", "11": "En het geschiedde, als Hij naar Jeruzalem reisde, dat Hij door het midden van Samaria en Galilea ging.", "12": "En als Hij in een zeker vlek kwam, ontmoetten Hem tien melaatse mannen, welke stonden van verre;", "13": "En zij verhieven *hun* stem, zeggende: Jezus, Meester! ontferm U onzer!", "14": "En als Hij hen zag, zeide Hij tot hen: Gaat heen en vertoont uzelven den priesteren. En het geschiedde, terwijl zij heengingen, dat zij gereinigd werden.", "15": "En een van hen, ziende, dat hij genezen was, keerde wederom, met grote stemme God verheerlijkende.", "16": "En hij viel op het aangezicht voor Zijn voeten, Hem dankende; en dezelve was een Samaritaan;", "17": "En Jezus, antwoordende, zeide: Zijn niet de tien gereinigd geworden, en waar zijn de negen?", "18": "En zijn er geen gevonden, die wederkeren, om Gode eer te geven, dan deze vreemdeling?", "19": "En Hij zeide tot hem: Sta op, en ga heen; uw geloof heeft u behouden.", "20": "En gevraagd zijnde van de Farizeën, wanneer het Koninkrijk Gods komen zou, heeft Hij hun geantwoord en gezegd: Het Koninkrijk Gods komt niet met uiterlijk gelaat.", "21": "En men zal niet zeggen: Ziet hier, of ziet daar, want, ziet, het Koninkrijk Gods is binnen ulieden.", "22": "En Hij zeide tot de discipelen: Er zullen dagen komen, wanneer gij zult begeren een der dagen van den Zoon des mensen te zien, en gij zult *dien* niet zien.", "23": "En zij zullen tot u zeggen: Ziet hier, of ziet daar is Hij; gaat niet heen, en volgt niet.", "24": "Want gelijk de bliksem, die van het ene *einde* onder den hemel bliksemt, tot het andere onder den hemel schijnt, alzo zal ook de Zoon des mensen wezen in Zijn dag.", "25": "Maar eerst moet Hij veel lijden, en verworpen worden van dit geslacht.", "26": "En gelijk het geschied is in de dagen van Noach, alzo zal het ook zijn in de dagen van den Zoon des mensen.", "27": "Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot den dag, op welken Noach in de ark ging, en de zondvloed kwam, en verdierf ze allen.", "28": "Desgelijks ook, gelijk het geschiedde in de dagen van Lot; zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "29": "Maar op den dag, op welken Lot van Sodom uitging, regende het vuur en sulfer van den hemel, en verdierf ze allen.", "30": "Even alzo zal het zijn in den dag, op welken de Zoon des mensen geopenbaard zal worden.", "31": "In dienzelven dag, wie op het dak zal zijn, en zijn huisraad in huis, die kome niet af, om hetzelve weg te nemen; en wie op den akker zijn zal, die kere desgelijks niet naar hetgeen, dat achter is.", "32": "Gedenkt aan de vrouw van Lot.", "33": "Zo wie zijn leven zal zoeken te behouden, die zal het verliezen; en zo wie hetzelve zal verliezen, die zal het in het leven behouden.", "34": "Ik zeg u: In dien nacht zullen twee op een bed zijn; de een zal aangenomen, en de ander zal verlaten worden.", "35": "Twee *vrouwen* zullen te zamen malen; de ene zal aangenomen, en de andere zal verlaten worden.", "36": "Twee zullen op den akker zijn; de een zal aangenomen, en de ander zal verlaten worden.", "37": "En zij antwoordden en zeiden tot Hem: Waar, Heere? En Hij zeide tot hen: Waar het lichaam is, aldaar zullen de arenden vergaderd worden."}, "KJV": {"1": "Then said he unto the disciples, It is impossible but that offences will come: but woe *unto him*, through whom they come!", "2": "It were better for him that a millstone were hanged about his neck, and he cast into the sea, than that he should offend one of these little ones.", "3": "Take heed to yourselves: If thy brother trespass against thee, rebuke him; and if he repent, forgive him.", "4": "And if he trespass against thee seven times in a day, and seven times in a day turn again to thee, saying, I repent; thou shalt forgive him.", "5": "And the apostles said unto the Lord, Increase our faith.", "6": "And the Lord said, If ye had faith as a grain of mustard seed, ye might say unto this sycamine tree, Be thou plucked up by the root, and be thou planted in the sea; and it should obey you.", "7": "But which of you, having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, Go and sit down to meat?", "8": "And will not rather say unto him, Make ready wherewith I may sup, and gird thyself, and serve me, till I have eaten and drunken; and afterward thou shalt eat and drink?", "9": "Doth he thank that servant because he did the things that were commanded him? I trow not.", "10": "So likewise ye, when ye shall have done all those things which are commanded you, say, We are unprofitable servants: we have done that which was our duty to do.", "11": "And it came to pass, as he went to Jerusalem, that he passed through the midst of Samaria and Galilee.", "12": "And as he entered into a certain village, there met him ten men that were lepers, which stood afar off:", "13": "And they lifted up *their* voices, and said, Jesus, Master, have mercy on us.", "14": "And when he saw *them*, he said unto them, Go shew yourselves unto the priests. And it came to pass, that, as they went, they were cleansed.", "15": "And one of them, when he saw that he was healed, turned back, and with a loud voice glorified God,", "16": "And fell down on *his* face at his feet, giving him thanks: and he was a Samaritan.", "17": "And Jesus answering said, Were there not ten cleansed? but where *are* the nine?", "18": "There are not found that returned to give glory to God, save this stranger.", "19": "And he said unto him, Arise, go thy way: thy faith hath made thee whole.", "20": "And when he was demanded of the Pharisees, when the kingdom of God should come, he answered them and said, The kingdom of God cometh not with observation:", "21": "Neither shall they say, Lo here! or, lo there! for, behold, the kingdom of God is within you.", "22": "And he said unto the disciples, The days will come, when ye shall desire to see one of the days of the Son of man, and ye shall not see", "23": "And they shall say to you, See here; or, see there: go not after *them*, nor follow", "24": "For as the lightning, that lighteneth out of the one *part* under heaven, shineth unto the other *part* under heaven; so shall also the Son of man be in his day.", "25": "But first must he suffer many things, and be rejected of this generation.", "26": "And as it was in the days of Noe, so shall it be also in the days of the Son of man.", "27": "They did eat, they drank, they married wives, they were given in marriage, until the day that Noe entered into the ark, and the flood came, and destroyed them all.", "28": "Likewise also as it was in the days of Lot; they did eat, they drank, they bought, they sold, they planted, they builded;", "29": "But the same day that Lot went out of Sodom it rained fire and brimstone from heaven, and destroyed *them* all.", "30": "Even thus shall it be in the day when the Son of man is revealed.", "31": "In that day, he which shall be upon the housetop, and his stuff in the house, let him not come down to take it away: and he that is in the field, let him likewise not return back.", "32": "Remember Lot's wife.", "33": "Whosoever shall seek to save his life shall lose it; and whosoever shall lose his life shall preserve it.", "34": "I tell you, in that night there shall be two *men* in one bed; the one shall be taken, and the other shall be left.", "35": "Two *women* shall be grinding together; the one shall be taken, and the other left.", "36": "Two *men* shall be in the field; the one shall be taken, and the other left.", "37": "And they answered and said unto him, Where, Lord? And he said unto them, Wheresoever the body *is*, thither will the eagles be gathered together."}}, "tsk": {"1": [{"kopje": "Het kan niet anders", "refs": ["Matt 16:23", "Matt 18:7", "Rom 14:13", "Rom 14:20", "Rom 14:21", "Rom 16:17", "1 Kor 8:13", "1 Kor 10:32", "1 Kor 11:19", "2 Tess 2:10-12", "Openb 2:14", "Openb 2:20", "Openb 13:14-18"]}], "2": [{"kopje": "beter", "refs": ["Matt 18:6", "Matt 26:24", "Mark 9:42", "1 Kor 9:15", "2 Petr 2:1-3"]}, {"kopje": "één", "refs": ["Jes 40:11", Ik zal met u zijn.", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "1 Kron 16:36": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid tot eeuwigheid! En al het volk zei: Amen! en het loofde de HEERE.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Matt 18:15-18": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Joh 6:36": "Maar Ik heb u gezegd dat u Mij ook gezien hebt, en toch gelooft u niet.", "Jer 2:36": "Wat reist u veel uit, terwijl u uw weg verandert? U zult ook van Egypte beschaamd worden, zoals u van Assur beschaamd bent.", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Jes 42:12": "Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.", "Spr 25:6": "Praal niet voor het aangezicht van de koning, en sta niet op de plaats van de groten;", "1 Petr 2:18-20": "U, huisknechten, wees met alle vrees onderdanig aan uw heren, niet alleen aan de goede en zachtmoedige, maar ook aan de harde. Want dat is genade, als iemand omwille van het geweten voor God moeite verdraagt, terwijl hij ten onrechte lijdt. Want wat lof is het, als u het verdraagt wanneer u zondigt en daarvoor geslagen wordt? Maar als u het verdraagt wanneer u goeddoet en daarvoor lijdt, dat is genade bij God.", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Zach 12:9": "En het zal op die dag gebeuren, dat Ik zal zoeken te verdelgen alle heidenvolken die tegen Jeruzalem aankomen.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Luk 17:26-29": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Gen 19:26": "En zijn vrouw keek achter hem om; en zij werd een zoutpilaar.", "Hebr 6:2": "van de leer van de dopen, en van de handoplegging, en van de opstanding van de doden, en van het eeuwige oordeel.", "Matt 24:30": "En dan zal in de hemel het teken van de Zoon des mensen verschijnen; en dan zullen alle geslachten van de aarde treuren, en zij zullen de Zoon des mensen zien komen op de wolken van de hemel, met grote kracht en heerlijkheid.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Ps 30:5": "Zingt psalmen voor de HEERE, u, Zijn gunstgenoten! en looft ter gedachtenis aan Zijn heiligheid.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Luk 18:38": "En hij riep: Jezus, Zoon van David, ontferm U over mij!", "Micha 6:14": "U zult eten, maar niet verzadigd worden, en uw neergedrukte honger zal in uw midden blijven; en u zult aangrijpen, maar niet wegbrengen, en wat u zult wegbrengen, zal Ik aan het zwaard overgeven.", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Matt 18:3": "en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Spr 27:8": "Zoals een vogel is, die uit zijn nest omdoolt, zo is een man, die omdoolt uit zijn woonplaats.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Matt 18:1-4": "Op datzelfde moment kwamen de discipelen naar Jezus en zeiden: Wie is toch de belangrijkste in het Koninkrijk der hemelen? En Jezus riep een kind bij Zich en zette het in hun midden, en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Jak 5:8": "Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Hos 9:13": "Efraïm is, zoals Ik Tyrus aanzag, geplant in een aangename woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen naar de moordenaar.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "Joz 22:5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Openb 19:5": "En een stem kwam uit de troon, die zei: Looft onze God, u al Zijn dienstknechten, en u die Hem vreest, beiden klein en groot!", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Luk 22:27": "Want wie is meer, hij die aanzit, of hij die dient? Is het niet hij die aanzit? Maar Ik ben in uw midden, als iemand die dient.", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Matt 5:3": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "1 Joh 4:2": "Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Ef 5:11": "En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.", "1 Tim 5:6": "Maar wie haar lust volgt, die is levend gestorven.", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Ps 100:1-5": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Mark 14:18": "En terwijl zij aanzaten en aten, zei Jezus: Voorwaar, Ik zeg u, dat een van u, die met Mij eet, Mij zal verraden.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Mark 1:14": "En nadat Johannes overgeleverd was, kwam Jezus in Galilea, en predikte het Evangelie van het Koninkrijk van God,", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ezech 18:26": "Als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en daarin sterft, zal hij in zijn onrecht, dat hij gedaan heeft, sterven.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Openb 14:14": "En ik zag, en zie, een witte wolk, en op de wolk zat Iemand, gelijk aan de Zoon des mensen, met op Zijn hoofd een gouden kroon; en in Zijn hand een scherpe sikkel.", "Matt 25:31-46": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid. En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt. En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Job 25:5": "Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Luk 1:67-75": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "1 Kor 1:17": "Want Christus heeft mij niet gezonden om te dopen, maar om het Evangelie te verkondigen; niet met wijsheid van woorden, opdat het kruis van Christus niet zinledig gemaakt wordt.", "Jak 5:19": "Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "1 Tim 2:15": "Toch zal zij zalig worden door het baren van kinderen, als zij blijft in het geloof, en liefde, en heiliging, met ingetogenheid.", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Joh 12:36": "Zolang u het Licht hebt, geloof in het Licht, opdat u kinderen van het Licht mag zijn. Dit sprak Jezus; en Hij ging weg en verborg Zich voor hen.", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Ps 99:3": "Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Gal 1:6": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie;", "Joh 8:7-10": "En toen zij Hem bleven vragen, richtte Hij Zich op en zei tegen hen: Wie van u zonder zonde is, werpt als eerste een steen op haar. En Hij bukte weer neer, en schreef in de aarde. Maar zij, dit horend, en door hun geweten overtuigd, gingen weg, de een na de ander, te beginnen bij de oudsten tot de laatsten toe; en Jezus bleef alleen achter, met de vrouw die in het midden stond.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Matt 5:7": "Zalig zijn de barmhartigen, want hun zal barmhartigheid geschieden.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "Mark 6:3-6": "Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem. En Jezus zei tegen hen: Een profeet is niet zonder eer, behalve in zijn eigen vaderland en onder zijn verwanten en in zijn huis. En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.", "Luk 17:27-30": "Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden; maar op de dag waarop Lot uit Sodom wegging, regende het vuur en zwavel uit de hemel, en dat verdierf hen allen.", "Ps 107:8": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Dan 5:20": "Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Joh 8:32-35": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken. Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden? Jezus antwoordde hun: Voorwaar, voorwaar, Ik zeg u: Ieder die de zonde doet, is een dienstknecht van de zonde.", "Joh 16:4": "Maar deze dingen heb Ik tot u gesproken, opdat u, wanneer de tijd gekomen zal zijn, zich zult herinneren dat Ik ze u gezegd heb; doch deze dingen heb Ik u vanaf het begin niet gezegd, omdat Ik bij u was.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "1 Kor 12:8": "Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;", "Ps 147:1-20": "Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig. De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël. Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Ps 119:171": "Mijn lippen zullen Uw lof overvloedig uitstorten, als U mij Uw inzettingen zult geleerd hebben.", "2 Tim 2:3": "Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Job 22:15-18": "Hebt u het pad van vroeger dagen in acht genomen, dat de onrechtvaardige mensen betreden hebben? Die weggerukt zijn voordat het hun tijd was; een vloed is over hun grond uitgestort; Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "1 Tess 5:8": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.", "1 Kor 9:15": "Maar ik heb geen van deze dingen gebruikt. En ik heb dit niet geschreven, opdat het zo bij mij zou gebeuren; want het zou beter voor mij zijn te sterven, dan dat iemand deze mijn roem zou ijdel maken.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Joh 11:40": "Jezus zei tegen haar: Heb Ik u niet gezegd dat, als u gelooft, u de heerlijkheid van God zien zult?", "Openb 22:20": "Die deze dingen getuigt, zegt: Ja, Ik kom haastig. Amen. Ja, kom, Heere Jezus!", "Luk 8:37": "En de hele menigte uit het omliggende land van de Gadarenen vroeg Hem van hen weg te gaan, want zij waren door grote vrees bevangen. En Hij ging in het schip en keerde terug.", "Hand 10:43": "Van Deze geven alle profeten getuigenis, dat ieder die in Hem gelooft, vergeving van zonden zal ontvangen door Zijn Naam.", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Hand 22:14": "En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.", "Matt 15:22": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten.", "2 Kor 11:30": "Als men moet roemen, zal ik roemen over de dingen van mijn zwakheid.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "1 Tess 2:15": "die zowel de Heere Jezus gedood hebben als hun eigen profeten, en ons vervolgd hebben, en God niet behagen, en tegen alle mensen zijn;", "Jak 1:9": "Maar de broeder die nederig is, moet roemen in zijn hoogheid.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Ps 61:9": "Zo zal ik Uw Naam psalmzingen in eeuwigheid; opdat ik mijn geloften betaal, dag bij dag.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Deut 6:11": "En huizen, vol van alle goeds, die u niet gevuld hebt, en uitgehouwen putten, die u niet uitgehouwen hebt, wijngaarden en olijfgaarden, die u niet geplant hebt, en u gegeten hebt en verzadigd bent;", "Amos 6:3-7": "U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt. Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal. Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Joh 5:35": "Hij was een brandende en lichtende lamp; en u hebt u een korte tijd in zijn licht willen verheugen.", "1 Petr 4:8": "Maar heb vooral vurige liefde tot elkaar; want de liefde zal een menigte van zonden bedekken.", "Hand 8:4": "Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.", "Spr 25:12": "Een wijze bestraffer bij een luisterend oor, is een gouden oorsieraad, en een halssieraad van het fijnste goud.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Matt 17:7": "En Jezus kwam bij hen, raakte hen aan en zei: Sta op en wees niet bevreesd.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "2 Tim 4:1": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk:", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Spr 25:7": "Want het is beter dat men tegen u zegt: Kom hier bovenaan, dan dat men u vernedert voor het aangezicht van een vorst, die uw ogen gezien hebben.", "Matt 8:21": "En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ps 35:28": "Zo zal mijn tong Uw gerechtigheid vermelden, en Uw lof de hele dag.", "Spr 27:7": "Een verzadigde ziel vertrapt de honingraat; maar voor een hongerige ziel is alles wat bitter is, zoet.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "Luk 6:46-49": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Spr 28:23": "Wie een mens bestraft, zal daarna meer gunst vinden dan wie met de tong vleit.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Joh 13:33": "Kinderen, nog een korte tijd ben Ik bij u. U zult Mij zoeken, en zoals Ik de Joden gezegd heb: Waar Ik heenga, kunt u niet komen; zo zeg Ik het u nu ook.", "2 Kron 32:25": "Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn.", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Matt 10:25": "Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "1 Petr 4:6": "Want daarom is ook aan de doden het Evangelie verkondigd, opdat zij weliswaar naar de mens in het vlees geoordeeld zouden worden, maar naar God zouden leven in de geest.", "Spr 15:31": "Het oor dat de bestraffing van het leven hoort, zal te midden van de wijzen vernachten.", "Joh 2:5": "Zijn moeder zei tegen de dienaars: Wat Hij u ook zal zeggen, doe dat.", "Matt 24:5": "Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Joh 8:48": "De Joden antwoordden dan en zeiden tegen Hem: Zeggen wij niet terecht dat U een Samaritaan bent, en de duivel hebt?", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Lev 19:17": "U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan.", "Spr 9:7": "Wie de spotter tuchtigt, haalt zich schande op de hals; en wie de goddeloze bestraft, zijn schandvlek.", "Deut 4:15": "Let dan goed op uzelf; want u hebt geen gelijkenis gezien, op de dag dat de HEERE op Horeb uit het midden van het vuur tot u sprak;", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "Luk 5:35": "Maar de dagen zullen komen dat de Bruidegom van hen weggenomen zal zijn; dan zullen zij vasten, in die dagen.", "Matt 11:4-6": "En Jezus antwoordde en zei tegen hen: Ga heen en vertel Johannes weer wat u hoort en ziet: De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd. En gelukkig is hij, die aan Mij niet geërgerd zal worden.", "Ps 73:2-22": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Ezra 3:11-13": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde. Zodat het volk het geluid van het gejuich van de vreugde niet kon onderscheiden van het geluid van het geween van het volk; want het volk juichte met groot gejuich, zodat het geluid tot ver weg gehoord werd.", "Ps 78:68": "Maar Hij verkoos de stam van Juda, de berg Sion, die Hij liefhad.", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Amos 4:11": "Ik heb sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Mark 8:35": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden.", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Hand 2:11": "Kretenzers en Arabieren, wij horen hen in onze talen de grote werken van God spreken.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Luk 11:23": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Joh 19:28-30": "Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst. Daar stond dan een vat vol azijn, en zij vulden een spons met azijn, en omlegden ze met hysop, en brachten ze aan Zijn mond. Toen Jezus dan de azijn genomen had, zei Hij: Het is volbracht! En Hij boog het hoofd, en gaf de geest.", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Gal 5:2": "Let op, ik, Paulus, zeg u: als u zich laat besnijden, zal Christus u niets baten.", "Luk 7:9": "En toen Jezus dit hoorde, verwonderde Hij Zich over hem; en Hij keerde Zich om en zei tegen de menigte die Hem volgde: Ik zeg u: Ik heb zelfs in Israël niet zo'n groot geloof gevonden.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Gal 2:21": "Ik doe de genade van God niet teniet; want als de rechtvaardigheid door de wet is, dan is Christus tevergeefs gestorven.", "Luk 5:24": "Maar opdat u weet dat de Zoon des mensen macht heeft op de aarde om de zonde te vergeven (zei Hij tegen de verlamde man): Ik zeg u, sta op, en neem uw draagbed op, en ga naar uw huis.", "1 Kor 15:23": "Maar ieder in zijn eigen orde: de eersteling Christus, daarna zij die van Christus zijn, bij Zijn komst.", "1 Kor 7:29-31": "Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.", "2 Kor 12:11": "Ik ben roemend onwijs geworden; u hebt mij genoodzaakt, want ik behoorde door u geprezen te worden; want ik ben in niets minder geweest dan de voortreffelijkste apostelen, hoewel ik niets ben.", "Matt 24:25": "Kijk, Ik heb het u van tevoren gezegd!", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "1 Sam 10:19": "Maar u hebt vandaag uw God verworpen, Die u Zelf uit al uw ellenden en uw noden verlost heeft, en u hebt tegen Hem gezegd: Nee, zet een koning over ons; nu dan, stel u voor het aangezicht van de HEERE, naar uw stammen en naar uw duizenden.", "Matt 24:45-51": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven? Gelukkig is die dienstknecht die zijn heer, als hij komt, zo bezig zal vinden. Voorwaar, Ik zeg u dat hij hem zal aanstellen over al zijn bezittingen.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "1 Kor 13:2": "En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Mark 13:21-23": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet. Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen. Maar u, let op; zie, Ik heb u alles van tevoren gezegd!", "Hos 4:7": "Zoals zij meer geworden zijn, zo hebben zij tegen Mij gezondigd; Ik zal hun eer in schande veranderen.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "2 Tess 2:10": "en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Jer 26:11-14": "Toen spraken de priesters en de profeten tot de vorsten en tot al het volk, en zeiden: Deze man verdient de dood, want hij heeft geprofeteerd tegen deze stad, zoals u met uw eigen oren gehoord hebt. Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt; Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "Gen 7:7-23": "Zo ging Noach, en zijn zonen, en zijn vrouw, en de vrouwen van zijn zonen met hem in de ark, vanwege het water van de vloed. Van het reine vee, en van het vee dat niet rein was, en van het gevogelte, en alles wat op de aardbodem kruipt, Kwamen er twee en twee tot Noach in de ark, het mannetje en het wijfje, zoals God Noach geboden had.", "Ps 140:14": "Zeker, de rechtvaardigen zullen Uw Naam loven; de oprechten zullen voor Uw aangezicht blijven.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "2 Tim 3:12": "En ook allen die godzalig willen leven in Christus Jezus, die zullen vervolgd worden.", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Ps 147:11": "De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.", "Luk 17:26-37": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Jona 2:4": "En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Openb 13:8": "En allen die op de aarde wonen, zullen hem aanbidden, van wie de namen niet zijn geschreven in het boek des levens van het Lam, Dat geslacht is, van de grondlegging van de wereld af.", "Luk 9:59-62": "En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven. Maar Jezus zei tegen hem: Laat de doden hun doden begraven; maar gaat u heen en verkondig het Koninkrijk van God. En ook een ander zei: Heere, ik zal U volgen; maar sta mij toe dat ik eerst afscheid neem van hen die in mijn huis zijn.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Deut 32:13": "Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "1 Tess 4:14": "Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.", "Joh 13:16": "Voorwaar, voorwaar, Ik zeg u: Een dienstknecht is niet meer dan zijn heer, en ook een gezant niet meer dan wie hem gezonden heeft.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Spr 30:21-23": "Om drie dingen beeft de aarde, ja, om vier, die zij niet kan dragen: Om een knecht, als hij regeert; en een dwaas, als hij verzadigd is met brood; Om een hatelijke vrouw, als zij getrouwd wordt; en een dienstmaagd, als zij erfgenaam wordt van haar vrouw.", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Ps 118:15": "In de tenten van de rechtvaardigen is een stem van gejuich en van het heil; de rechterhand van de HEERE doet krachtige daden.", "Jes 50:1-11": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden. Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst. Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Ps 146:1-10": "Halleluja! O mijn ziel, prijs de HEERE. Ik zal de HEERE prijzen in mijn leven; ik zal mijn God psalmzingen, terwijl ik nog ben. Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is.", "2 Kor 10:3-5": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees; Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken; Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Amos 3:1": "Hoort dit woord, dat de HEERE tegen u spreekt, kinderen van Israël! Namelijk tegen het gehele geslacht, dat Ik uit Egypteland heb opgevoerd, en Hij zei:", "Mark 12:1-12": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "Luk 22:48": "En Jezus zei tegen hem: Judas, verraadt u de Zoon des mensen met een kus?", "Gal 1:7": "terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Joh 9:16": "Sommigen van de Farizeeën zeiden dan: Deze Mens is niet van God, want Hij houdt de sabbat niet. Anderen zeiden: Hoe kan een mens die een zondaar is, zulke tekenen doen? En er was verdeeldheid onder hen.", "2 Kron 26:15": "Hij maakte ook te Jeruzalem kunstige werktuigen, bedacht door kunstige werkmeesters, om op de torens en op de hoeken te staan, om met pijlen en met grote stenen te schieten; zo ging zijn naam tot ver weg uit, want hij werd wonderlijk geholpen, totdat hij sterk was.", "Joz 10:25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Joh 3:14-16": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "Matt 13:20": "Maar die op steenachtige plaatsen bezaaid is, dit is degene die het woord hoort en dat meteen met vreugde ontvangt;", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Luk 22:15": "En Hij zei tegen hen: Ik heb er sterk naar verlangd dit pascha met u te eten, voordat Ik lijd;", "1 Petr 3:20": "die vroeger ongehoorzaam waren, toen de lankmoedigheid van God eenmaal wachtte, in de dagen van Noach, terwijl de ark klaargemaakt werd; waarin weinige (dat is acht) zielen behouden werden door het water.", "Pred 2:1-12": "Ik zei in mijn hart: Nu, welaan, ik zal u beproeven door vreugde; laat daarom het goede genieten; maar zie, ook dat was ijdelheid. Tot het lachen zei ik: U bent onzinnig, en tot de vreugde: Wat maakt deze? Ik heb in mijn hart nagespeurd om mijn vlees op te houden in de wijn, (en toch mijn hart leidend in wijsheid) en om de dwaasheid vast te houden, totdat ik zou zien wat voor de kinderen van de mensen het beste zou zijn om te doen onder de hemel, gedurende het aantal dagen van hun leven.", "Ef 6:20": "waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Num 12:10": "En de wolk week weg van boven de tent; en zie, Mirjam was melaats, wit als de sneeuw. En Aäron keek naar Mirjam, en zie, zij was melaats.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "Ps 131:2": "Zeker heb ik mijn ziel tot rust gebracht en stilgehouden, zoals een gespeend kind bij zijn moeder! Mijn ziel is in mij als een gespeend kind.", "2 Sam 22:4": "Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "Hebr 5:11": "Over hem hebben wij veel te zeggen, en het is moeilijk uit te leggen, omdat u traag geworden bent om te horen.", "Joh 12:43": "Want zij hadden de eer van mensen lief, meer dan de eer van God.", "Ex 8:15": "Toen Farao nu zag dat er verademing was, verzwaarde hij zijn hart, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.", "Ef 3:11": "naar het eeuwig voornemen, dat Hij gemaakt heeft in Christus Jezus, onze Heere;", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "Ps 56:6": "De hele dag verdraaien zij mijn woorden; al hun gedachten zijn tegen mij ten kwade.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Jak 4:13-15": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "1 Tim 2:5": "Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Ps 112:7": "Mem. Hij zal voor geen kwaad gerucht bang zijn; Nun. zijn hart is vast, vertrouwend op de HEERE.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Fil 4:5": "Uw vriendelijkheid moet bij alle mensen bekend zijn. De Heere is nabij.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Luk 22:34": "Maar Hij zei: Ik zeg u, Petrus, de haan zal vandaag niet kraaien, voordat u driemaal geloochend zult hebben dat u Mij kent.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Zach 13:8": "En het zal gebeuren in het hele land, spreekt de HEERE, dat de twee delen daarin uitgeroeid zullen worden, en de geest geven; maar het derde deel zal daarin overblijven.", "Luk 24:53": "En zij waren voortdurend in de tempel, waar zij God loofden en dankten. Amen.", "Matt 10:23": "Wanneer zij u dan in deze stad vervolgen, vlucht dan naar de andere; want voorwaar, Ik zeg u: u zult uw reis door de steden van Israël niet beëindigd hebben, voordat de Zoon des mensen gekomen zal zijn.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Luk 11:21-26": "Wanneer een sterke, gewapende man zijn eigen woning bewaakt, dan is alles wat hij heeft in vrede. Maar als iemand die sterker is dan hij, hem overvalt en hem overwint, dan neemt die zijn hele wapenrusting weg, waarop hij vertrouwde, en deelt zijn buit uit. Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "Matt 9:27": "En toen Jezus vandaar verder ging, volgden Hem twee blinden, roepend en zeggend: Zoon van David, ontferm U over ons!", "Spr 21:11": "Als men de spotter straft, wordt de eenvoudige wijs; en als men de wijze onderricht, neemt hij kennis aan.", "Matt 5:20": "Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.", "Jer 17:13": "O HEERE, Israëls Verwachting! Allen die U verlaten, zullen beschaamd worden; en die van Mij afwijken, zullen in de aarde geschreven worden; want zij verlaten de HEERE, de Springader van het levende water.", "Matt 23:35": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Matt 26:12": "Want toen zij deze zalf op Mijn lichaam goot, heeft zij dat gedaan als voorbereiding op Mijn begrafenis.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Ef 3:17-19": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent; opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is, en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Joh 3:32": "En wat Hij gezien en gehoord heeft, dat getuigt Hij; en Zijn getuigenis neemt niemand aan.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "Fil 1:12-14": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Hebr 4:3-10": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren. Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust. En op deze plaats opnieuw: Zij zullen Mijn rust niet ingaan!", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Ex 11:5": "En alle eerstgeborenen in Egypteland zullen sterven, van Farao's eerstgeborene af, die op zijn troon zitten zou, tot de eerstgeborene van de dienstmaagd, die achter de molen is, en alle eerstgeborenen van het vee.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Joh 1:12": "Maar zovelen Hem aangenomen hebben, aan hen heeft Hij macht gegeven om kinderen van God te worden, namelijk aan hen die in Zijn Naam geloven;", "Mark 2:28": "Zo is dan de Zoon des mensen ook Heere van de sabbat.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "Luk 22:67": "en zeiden: Bent U de Christus, zeg het ons. En Hij zei tegen hen: Als Ik het u zeg, zult u het niet geloven;", "Joh 6:60-68": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren? Jezus, die bij Zichzelf wist d
