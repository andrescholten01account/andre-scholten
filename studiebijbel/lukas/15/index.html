, "Num 21:7": "Daarom kwam het volk tot Mozes, en zij zeiden: Wij hebben gezondigd, omdat wij tegen de HEERE en tegen u gesproken hebben; bid tot de HEERE, dat Hij deze slangen van ons wegneemt. Toen bad Mozes voor het volk.", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Openb 15:2": "En ik zag als een glazen zee, met vuur gemengd; en zij die de overwinning hadden behaald op het beest, en op zijn beeld, en op zijn merkteken, en op het getal van zijn naam, stonden aan de glazen zee, met de citers van God.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Ps 20:6": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens.", "Luk 8:32-34": "En daar was een grote kudde zwijnen aan het weiden op de berg; en zij smeekten Hem dat Hij hun zou toestaan daarin te gaan. En Hij stond het hun toe. En de duivels gingen uit de man weg en voeren in de zwijnen; en de kudde stortte van de steilte af het meer in, en verdronk. En toen zij die ze weidden zagen wat er gebeurd was, vluchtten zij; en zij gingen heen en meldden het in de stad en op het land.", "Gen 45:28": "En Israël zei: Het is genoeg! Mijn zoon Jozef leeft nog! Ik zal gaan, en hem zien, voordat ik sterf!", "2 Kor 5:1": "Want wij weten dat als ons aardse huis, deze tent, afgebroken wordt, wij een gebouw van God hebben, een huis niet met handen gemaakt, maar eeuwig, in de hemelen.", "Ef 3:6": "namelijk dat de heidenen medeerfgenamen zijn, en van hetzelfde lichaam, en mededeelgenoten van Zijn belofte in Christus, door het Evangelie;", "Ezra 9:6": "En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel.", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.", "Openb 7:13-17": "En een van de oudsten antwoordde en zei tegen mij: Wie zijn deze mensen die bekleed zijn met de lange witte kleren, en waar zijn zij vandaan gekomen? En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam. Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen.", "1 Tess 5:10": "Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Matt 21:31": "Wie van deze twee heeft de wil van de vader gedaan? Zij zeiden tegen Hem: De eerste. Jezus zei tegen hen: Voorwaar, Ik zeg u, dat de tollenaars en de hoeren u voorgaan in het Koninkrijk van God.", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Gen 45:14": "En hij viel om de hals van Benjamin, zijn broer, en weende; en Benjamin weende om zijn hals.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Hand 5:19": "Maar de engel van de Heere opende 's nachts de deuren van de gevangenis en leidde hen naar buiten, en zei:", "Ezech 16:52": "Draag u dan ook uw schande, u die voor uw zusters geoordeeld hebt door uw zonden, die u gruwelijker gemaakt hebt dan zij; zij zijn rechtvaardiger dan u; wees u dan ook beschaamd, en draag uw schande, omdat u uw zusters gerechtvaardigd hebt.", "Jes 32:1-4": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Spr 29:6": "In de overtreding van een boze man is een valstrik; maar de rechtvaardige juicht en is blij.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ex 10:17": "En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "Ezech 7:16": "En hun ontkomenen zullen wel ontkomen, maar zij zullen op de bergen zijn, zij allen zullen zijn als duiven van de dalen, kermend, ieder om zijn ongerechtigheid.", "Hebr 9:17": "want een testament is van kracht bij de doden, omdat het geen kracht heeft zolang hij die het testament maakte leeft.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Luk 11:2": "En Hij zei tegen hen: Wanneer u bidt, zegt dan: Onze Vader, Die in de hemelen bent! Uw Naam worde geheiligd. Laat Uw Koninkrijk komen. Uw wil geschiede, zoals in de hemel, zo ook op de aarde.", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Luk 9:56": "Want de Zoon des mensen is niet gekomen om het leven van mensen te vernietigen, maar om het te behouden. En zij gingen naar een ander dorp.", "Richt 10:10": "Toen riepen de Israëlieten tot de HEERE en zeiden: Wij hebben tegen U gezondigd, omdat wij onze God hebben verlaten en de Baäls gediend hebben.", "2 Petr 2:11": "terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere.", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Ef 2:17": "En toen Hij kwam, heeft Hij door het Evangelie vrede verkondigd aan u, die ver weg was, en aan hen die nabij waren.", "Rom 3:19": "Wij weten nu, dat alles wat de wet zegt, zij dat spreekt tot hen die onder de wet zijn; opdat elke mond gestopt wordt en de hele wereld voor God schuldig staat.", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Luk 7:32": "Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "1 Kon 8:51-53": "want zij zijn Uw volk en Uw erfdeel, die U uitgevoerd hebt uit Egypteland, uit het midden van de ijzeren oven; opdat Uw ogen open zijn tot de smeking van Uw dienaar, en tot de smeking van Uw volk Israël, om naar hen te horen, in al hun roepen tot U. Want U hebt hen voor Uzelf tot een erfdeel afgezonderd, uit alle volken van de aarde; zoals U gesproken hebt door de dienst van Mozes, Uw dienaar, toen U onze vaderen uit Egypte uitvoerde, Heere HEERE!", "Hand 13:23": "Uit het nageslacht van deze heeft God, naar de belofte, voor Israël de Zaligmaker Jezus verwekt;", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "Hagg 2:10": "De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Ps 63:12": "Maar de koning zal zich in God verblijden; ieder die bij Hem zweert, zal zich beroemen; want de mond van de leugensprekers zal gestopt worden.", "Hos 14:9": "Efraïm! wat heb Ik meer met de afgoden te doen? Ik heb hem verhoord, en zal op hem zien; Ik zal hem zijn als een denneboom die groent; uw vrucht is uit Mij gevonden.", "Hand 18:13": "en zeiden: Deze man raadt de mensen aan om God te dienen op een manier die tegen de wet ingaat.", "Jes 66:10-12": "Verblijd u met Jeruzalem, en verheug u over haar, al haar liefhebbers! Wees vrolijk over haar met vreugde, u allen die over haar hebt getreurd! Opdat u mag zuigen, en verzadigd worden van de borsten van haar vertroostingen; opdat u mag uitzuigen, en u verlustigen aan de glans van haar heerlijkheid. Want zo zegt de HEERE: Zie, Ik zal de vrede over haar uitstrekken als een rivier, en de heerlijkheid van de heidenen als een overlopende beek; dan zult u zuigen; u zult op de zijde gedragen worden, en op de knieën heel vriendelijk getroeteld worden.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Job 22:2": "Zal een man God voordelig zijn? Maar voor zichzelf zal de verstandige voordelig zijn.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Ps 53:7": "Och, dat Israëls verlossingen uit Sion kwamen! Als God de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal verblijd zijn.", "Jer 4:1-4": "Als u zich zult bekeren, Israël! spreekt de HEERE, bekeer u tot Mij; en als u uw afschuwelijke afgoden van Mijn aangezicht zult wegdoen, dwaal dan niet meer rond. Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen. Want zo zegt de HEERE tegen de mannen van Juda en tegen Jeruzalem: Braak voor uzelf een braakland, en zaai niet onder de doornen.", "Deut 21:17": "Maar de eerstgeborene, de zoon van de gehate, zal hij erkennen, door hem het dubbele deel te geven van alles wat bij hem gevonden wordt; want hij is het begin van zijn kracht, het recht van de eerstgeboorte komt hem toe.", "Hand 14:19": "Maar daarna kwamen er Joden van Antiochië en Ikonium, en zij overreedden de menigten, en stenigden Paulus, en sleepten hem de stad uit, in de mening dat hij dood was.", "1 Tim 2:3-6": "Want dat is goed en aangenaam voor God, onze Zaligmaker; Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen. Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Jes 6:2": "De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.", "Luk 7:34": "De Zoon des mensen is gekomen, en eet en drinkt wel; en u zegt: Zie, een vraat en wijnzuiper, een vriend van tollenaars en zondaars.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Jer 33:15": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Ps 5:12": "Maar laat verblijd zijn allen die op U vertrouwen, tot in eeuwigheid; laat hen juichen, omdat U hen overdekt; en laat in U van vreugde opspringen die Uw Naam liefhebben.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Rom 8:15": "Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader!", "Deut 33:25": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Ps 121:1-8": "Een lied Hammaaloth¹. Ik hef mijn ogen op naar de bergen, vanwaar mijn hulp komen zal. Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft. Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "1 Kor 3:11": "Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "1 Kon 8:47": "en zij in het land, waar zij gevankelijk weggevoerd zijn, weer tot inkeer komen, en zich bekeren, en tot U smeken in het land van hen die ze gevankelijk hebben weggevoerd, en zeggen: Wij hebben gezondigd, en verkeerd gedaan, wij hebben goddeloos gehandeld;", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Job 22:23-29": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten. Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken; Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Jer 31:6-9": "Want er zal een dag zijn, waarop de wachters op het gebergte van Efraïm zullen roepen: Maak u op, en laat ons opgaan naar Sion, tot de HEERE, onze God! Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël. Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen.", "Luk 20:34-36": "En Jezus antwoordde en zei tegen hen: De kinderen van deze wereld trouwen, en worden ten huwelijk uitgegeven; maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden; want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Matt 15:24": "Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Joh 4:35": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.", "Ezech 12:3": "Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn.", "Ps 73:20": "Als een droom na het ontwaken! Als U opwaakt, o Heere, dan zult U hun beeld verachten.", "Kol 1:26": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen;", "Matt 6:16-18": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben. Maar u, als u vast, zalf dan uw hoofd en was uw gezicht; opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Luk 10:33": "Maar een zekere Samaritaan die op reis was, kwam bij hem, en toen hij hem zag, werd hij met innerlijke ontferming bewogen.", "Joh 1:7": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden.", "Gen 24:36": "En Sara, de vrouw van mijn heer, heeft mijn heer een zoon gebaard, nadat zij oud geworden was; en hij heeft hem gegeven alles wat hij heeft.", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Ex 32:19": "En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak.", "Job 16:18": "O aarde, bedek mijn bloed niet; en laat er voor mijn geroep geen plaats zijn.", "Luk 16:23": "En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot.", "2 Sam 12:4": "Toen er nu bij de rijke man een reiziger op bezoek kwam, wilde hij niet iets nemen van zijn eigen schapen of runderen om dat voor de reiziger die bij hem gekomen was te bereiden; maar hij nam het ooilam van de arme man, en bereidde dat voor de man die bij hem gekomen was.", "Jer 31:15-17": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn. Zo zegt de HEERE: Bedwing uw stem van geween, en uw ogen van tranen; want er is loon voor uw arbeid, spreekt de HEERE; want zij zullen uit het land van de vijand terugkomen. En er is verwachting voor uw nakomelingen, spreekt de HEERE; want uw kinderen zullen terugkomen tot hun grondgebied.", "2 Kron 7:10": "Maar op de drieëntwintigste dag van de zevende maand liet hij het volk gaan naar hun tenten, blij en welgemoed over het goede, dat de HEERE aan David en Salomo, en Zijn volk Israël gedaan had.", "1 Sam 12:10": "En zij riepen tot de HEERE, en zeiden: Wij hebben gezondigd, omdat wij de HEERE verlaten hebben, en de Baäls en Astharoths gediend hebben; en nu, red ons uit de hand van onze vijanden, en wij zullen U dienen.", "Ezech 36:31": "Dan zult u denken aan uw slechte wegen en uw handelingen, die niet goed waren; en u zult een walging van uzelf hebben over uw ongerechtigheden en over uw gruwelen.", "1 Tess 2:19": "Want wat is onze hoop, of blijdschap, of kroon van het roem? Bent u dat niet, voor onze Heere Jezus Christus bij Zijn komst?", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Ef 2:4": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft,", "Joh 5:33": "U hebt naar Johannes gezonden, en hij heeft van de waarheid getuigenis gegeven.", "Rom 13:14": "Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Rom 10:9-13": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden. Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid. Want de Schrift zegt: Ieder die in Hem gelooft, zal niet beschaamd worden.", "Luk 11:9-13": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden. En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?", "Ezech 34:4": "De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "Hand 16:29": "En hij vroeg om licht, sprong naar binnen, en begon hevig te beven, en viel voor Paulus en Silas neer aan hun voeten;", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Ps 51:5-7": "Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen. Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen. Zie, ik ben in ongerechtigheid geboren, en in zonde heeft mijn moeder mij ontvangen.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Jes 27:5": "Of hij moest Mijn sterkte aangrijpen, dan zal hij vrede met Mij maken; vrede zal hij met Mij maken.", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Openb 10:1-6": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur. En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde. En hij riep met een luide stem, zoals een leeuw brult; en toen hij geroepen had, spraken de zeven donderslagen met hun stemmen.", "Hos 2:8-13": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "Ezech 18:30-32": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden. Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël? Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Ps 63:6-8": "Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen. Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken. Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Ps 119:1": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Joh 5:21": "Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil.", "Joh 17:13": "Maar nu kom Ik tot U, en spreek dit in de wereld, opdat zij Mijn blijdschap vervuld in zichzelf mogen hebben.", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Openb 4:4": "En rondom de troon waren vierentwintig tronen; en op de tronen zag ik de vierentwintig oudsten zitten, bekleed met witte kleren, en zij hadden gouden kronen op hun hoofden.", "Matt 20:12": "en zeiden: Deze laatsten hebben maar één uur gewerkt, en u hebt hen gelijk aan ons gemaakt, die de last van de dag en de hitte gedragen hebben.", "1 Sam 12:9": "Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.", "Hos 2:5": "Daarom, zie, Ik zal uw weg met doornen omtuinen, en Ik zal een omheiningsmuur maken, zodat zij haar paden niet zal vinden.", "Spr 20:29": "Het sieraad van de jongelingen is hun kracht, en de heerlijkheid van de ouden is de grijsheid.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Luk 15:10-32": "Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert. En Hij zei: Een zeker mens had twee zonen. En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit.", "Deut 9:29": "Zij zijn toch Uw volk, en Uw erfdeel, dat U door Uw grote kracht, en door Uw uitgestrekte arm hebt uitgevoerd!", "Luk 15:8-10": "Of welke vrouw, die tien munten heeft, steekt geen kaars aan, als zij één munt verliest, en veegt het huis, en zoekt nauwkeurig, totdat zij die vindt? En als zij die gevonden heeft, roept zij de vriendinnen en de buurvrouwen bijeen, en zegt: Wees blij met mij; want ik heb de munt gevonden, die ik verloren had. Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Hand 10:28": "En hij zei tegen hen: U weet hoe het een Joodse man niet toegestaan is zich aan te sluiten bij of naar een vreemde toe te gaan; maar God heeft mij getoond dat ik geen mens gewoon of onrein zou noemen.", "Ex 29:46": "En zij zullen weten, dat Ik de HEERE hun God ben, Die hen uit het land Egypte uitgevoerd heb, opdat Ik in het midden van hen wonen zou; Ik ben de HEERE, hun God.", "Spr 1:1-33": "De spreuken van Salomo, de zoon van David, de koning van Israël, Om wijsheid en tucht te weten; om te verstaan redenen van het verstand; Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "Jes 47:7": "En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht.", "Job 6:13": "Is dan mijn hulp niet in mij, en is de wijsheid uit mij verdreven?", "Ps 119:14": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom.", "Spr 3:1-35": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Openb 14:3": "en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Spr 31:1-3": "De woorden van koning Lemuël, de last, waarmee zijn moeder hem onderwees. Wat, o mijn zoon, en wat, o zoon van mijn buik? Ja, wat, o zoon van mijn geloften? Geef aan de vrouwen uw vermogen niet, en uw wegen niet aan hen die koningen te gronde richten.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Ezech 34:12": "Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Spr 18:9": "Ook wie zich slap aanstelt in zijn werk, is een broeder van een verkwister.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "Matt 13:41": "De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Num 15:41": "Ik ben de HEERE, uw God, Die u uit het land Egypte uitgeleid heb, om u tot een God te zijn; Ik ben de HEERE, uw God!", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Mark 2:15": "En het gebeurde, terwijl Hij in Zijn huis aanzat, dat er ook veel tollenaars en zondaars mee aanzaten met Jezus en Zijn discipelen; want er waren er velen, en zij waren Hem gevolgd.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Jona 2:2-8": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "1 Sam 17:28": "Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.", "Luk 18:11": "De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "2 Kron 21:3": "En hun vader had hun veel geschenken gegeven van zilver, van goud en van kostbaarheden, alsook versterkte steden in Juda; maar het koninkrijk gaf hij aan Joram, omdat hij de eerstgeborene was.", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Jer 8:8": "Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden.", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Rom 1:7": "Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Deut 4:20": "Maar u heeft de HEERE aangenomen, en uit de ijzeroven, uit Egypte, weggevoerd; opdat u Hem tot een erfvolk zou zijn, zoals het vandaag is.", "Deut 7:6-8": "Want u bent een heilig volk voor de HEERE, uw God; u heeft de HEERE, uw God, uitgekozen om Hem een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn. De HEERE heeft geen liefde tot u opgevat, en u niet uitgekozen, om uw grote aantal boven alle andere volken; want u was het minste van alle volken. Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Dan 4:26": "Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.", "Joh 10:9": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden.", "Job 42:6": "Daarom verfoei ik mij, en ik heb berouw in stof en as.", "Rom 3:28-30": "Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet. Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen; omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Gen 27:27": "En hij kwam dichterbij, en hij kuste hem; toen rook hij de geur van zijn kleren, en zegende hem; en hij zei: Zie, de geur van mijn zoon is als de geur van het veld, dat de HEERE gezegend heeft.", "Ezech 14:6": "Daarom, zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Bekeer u, en keer u af van uw drekgoden, en keer uw aangezichten af van al uw gruwelen.", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Jes 49:11": "En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Openb 11:17": "en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;", "Amos 4:12": "Daarom zal Ik u zo doen, Israël! Omdat Ik u dan dit doen zal, maak u dan gereed, Israël, om uw God te ontmoeten.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Matt 23:29-31": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u bouwt de graven van de profeten op, en versiert de graftekens van de rechtvaardigen; en zegt: Als wij in de tijden van onze vaderen hadden geleefd, zouden wij geen deel met hen gehad hebben aan het bloed van de profeten. Zo getuigt u tegen uzelf, dat u kinderen bent van hen die de profeten gedood hebben.", "Ef 3:7": "waarvan ik een dienaar geworden ben, naar de gave van de genade van God, die mij gegeven is, naar de werking van Zijn kracht.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Deut 29:13": "Opdat Hij u heden voor Zichzelf tot een volk bevestigt, en Hij u tot een God is, zoals Hij tot u gesproken heeft, en zoals Hij uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "Ps 85:7": "Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt?", "Job 9:20": "Al zou ik mijzelf rechtvaardigen, mijn mond zal mij verdoemen; ben ik oprecht, Hij zal mij toch verkeerd verklaren.", "Jer 3:21": "Er is een stem gehoord op de hoge plaatsen, geween en smekingen van de kinderen van Israël, omdat zij hun weg verdraaid hebben, en de HEERE, hun God, vergeten hebben.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Joh 1:9": "Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Job 13:3": "Maar ik wil tot de Almachtige spreken, en ik ben erop belust mij te verdedigen voor God.", "Luk 7:42": "en omdat zij niets hadden om te betalen, schold hij het hun beiden kwijt. Zeg dan, wie van hen zal hem het meest liefhebben?", "Amos 8:9-12": "En het zal op die dag gebeuren, spreekt de Heere HEERE, dat Ik de zon op de middag zal doen ondergaan, en het land op klaarlichte dag zal verduisteren. En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag. Zie, de dagen komen, spreekt de Heere HEERE, dat Ik een honger in het land zal zenden; niet een honger naar brood, en geen dorst naar water, maar om de woorden van de HEERE te horen.", "Luk 19:5-7": "En toen Jezus op die plaats kwam, keek Hij omhoog en zag hem, en zei tegen hem: Zacheüs! Kom vlug naar beneden, want Ik moet vandaag in uw huis blijven. En hij kwam vlug naar beneden, en ontving Hem met blijdschap. En allen die het zagen, morden en zeiden: Hij is bij een zondig mens binnengegaan om te logeren.", "Job 42:15": "En er werden zulke mooie vrouwen niet gevonden in het hele land, als de dochters van Job; en hun vader gaf hun erfdeel onder hun broers.", "Matt 18:11-13": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Openb 18:1-3": "En hierna zag ik een andere engel uit de hemel neerdalen, die grote macht had, en de aarde werd verlicht door zijn heerlijkheid. En hij riep met kracht, met een grote stem, en zei: Zij is gevallen, zij is gevallen, het grote Babylon, en is een woonplaats van duivels geworden, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en gehaat gevogelte; Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.", "Mark 1:4": "Johannes doopte in de woestijn en predikte de doop van bekering tot vergeving van de zonden.", "Rom 5:8": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren.", "Joh 5:28": "Verwonder u hier niet over, want de tijd komt waarin allen die in de graven zijn Zijn stem zullen horen;", "Matt 25:21": "En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.", "2 Sam 12:24": "Daarna troostte David zijn vrouw Bathseba, en ging naar haar toe, en lag bij haar; en zij baarde een zoon, wiens naam zij Salomo noemde; en de HEERE had hem lief,", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "Ezech 37:10": "En ik profeteerde, zoals Hij mij bevolen had. Toen kwam de geest in hen, en zij werden levend en gingen op hun voeten staan, een geheel zeer groot leger.", "Job 33:23": "Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;", "2 Kor 5:18-21": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Ps 105:43": "Zo voerde Hij Zijn volk uit met vrolijkheid, Zijn uitverkorenen met gejuich.", "1 Kor 8:12": "Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.", "Jes 55:6-9": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is. De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig. Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Ps 69:6": "O God! U weet van mijn dwaasheid, en mijn schulden zijn voor U niet verborgen.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Matt 7:7-11": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?", "Hand 14:2": "Maar de Joden die ongehoorzaam waren, zetten de heidenen aan en verbitterden hun harten tegen de broeders.", "Job 33:9": "Ik ben rein, zonder overtreding; ik ben zuiver, en heb geen misdaad.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Ps 69:11": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "1 Joh 5:11-13": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon. Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet. Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Jer 29:11": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Joh 10:9-11": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden. De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Hand 11:17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Jer 3:12-14": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden. Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE. Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Luk 6:23": "Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Spr 2:1-22": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Gen 22:16-18": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt; Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten. En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Jer 2:9": "Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.", "Ps 21:7": "Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Fil 2:17": "Ja, ook al word ik tot een drankoffer geofferd over de offerande en bediening van uw geloof, dan verblijd ik mij, en verblijd ik mij met u allen.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Joël 2:15-18": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Openb 21:18": "En het gebouw van haar muur was Jaspis; en de stad was zuiver goud, gelijk aan zuiver glas.", "Joh 6:41-43": "De Joden morden dan over Hem, omdat Hij gezegd had: Ik ben het Brood dat uit de hemel neergedaald is. En zij zeiden: Is dit niet Jezus, de zoon van Jozef, van wie wij de vader en moeder kennen? Hoe zegt Hij dan: Ik ben uit de hemel neergedaald? Jezus antwoordde dan en zei tegen hen: Mor niet onder elkaar.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Ex 12:31-33": "Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt. Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook. En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Ps 57:11": "Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.", "Gal 4:5": "opdat Hij hen die onder de wet waren, verlossen zou, en opdat wij de aanneming tot kinderen verkrijgen zouden.", "2 Kron 33:1-10": "Manasse was twaalf jaar oud, toen hij koning werd, en hij regeerde vijfenvijftig jaar te Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël uit de bezitting verdreven had. Want hij bouwde de hoogten weer op, die zijn vader Jehizkia afgebroken had, en richtte voor de Baäls altaren op, en maakte offerbossen, en boog zich neer voor heel het leger van de hemel, en diende ze.", "Ps 91:16": "Ik zal hem met lengte van dagen verzadigen, en Ik zal hem Mijn heil doen zien.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Gen 22:12": "Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Job 11:13-15": "Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit. Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen. Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen.", "Jona 4:1-3": "Dit vond Jona heel erg vervelend, en zijn woede laaide op. En hij bad tot de HEERE, en zei: Och HEERE! Was dit niet mijn woord, toen ik nog in mijn land was? Daarom kwam ik het voor, door naar Tarsis te vluchten; want ik wist dat U een genadig en barmhartig God bent, geduldig en groot van goedertierenheid, en berouw hebbend over het kwaad. Nu dan, HEERE, neem toch mijn leven van mij weg; want het is beter voor mij te sterven dan te leven.", "Jer 3:14": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Jes 57:3": "Maar kom hier dichterbij, kinderen van de waarzegster! Overspelig nageslacht, en u die hoererij bedrijft!", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Ps 119:111": "Ik heb Uw getuigenissen genomen tot een eeuwige erve, want zij zijn de vrolijkheid van mijn hart.", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Hand 2:37": "En toen zij dit hoorden, werden zij diep in het hart getroffen, en zeiden tegen Petrus en de andere apostelen: Wat moeten wij doen, mannen broeders?", "Openb 3:1": "En schrijf aan de engel van de gemeente die in Sardis is: Dit zegt Hij Die de zeven Geesten van God heeft, en de zeven sterren: Ik ken uw werken, dat u de naam hebt dat u leeft, en u bent dood.", "Luk 2:11": "namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "Ps 50:7": "Hoort, Mijn volk! en Ik zal spreken; Israël! en Ik zal onder u getuigen; Ik, God, ben uw God.", "Openb 5:9-14": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie; en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde. En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Kol 1:11": "bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "2 Sam 7:23": "En wie is gelijk Uw volk, gelijk Israël, een enig volk op aarde, dat God is heengegaan om Zich tot een volk te verlossen, en om Zich een Naam te maken, en om voor u deze grote en verschrikkelijke dingen te doen aan Uw land, voor het aangezicht van Uw volk, dat U voor Uzelf uit Egypte verlost hebt, terwijl U de heidenen en hun goden verdreef.", "Spr 15:9": "De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Openb 7:13": "En een van de oudsten antwoordde en zei tegen mij: Wie zijn deze mensen die bekleed zijn met de lange witte kleren, en waar zijn zij vandaan gekomen?", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Deut 4:37": "En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Neh 9:17-20": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "1 Kon 8:33-50": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Pred 2:18": "Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Klaagl 3:29": "Jod. Hij stekt zijn mond in het stof, en zegt: Misschien is er verwachting.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "1 Sam 21:11": "Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden?", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Jes 66:11": "Opdat u mag zuigen, en verzadigd worden van de borsten van haar vertroostingen; opdat u mag uitzuigen, en u verlustigen aan de glans van haar heerlijkheid.", "Neh 1:6": "Laat toch Uw oor opmerkzaam, en Uw ogen open zijn, om te horen naar het gebed van Uw dienaar, dat ik vandaag voor Uw aangezicht bid, dag en nacht, voor de kinderen van Israël, Uw dienaren; en ik doe belijdenis over de zonden van de kinderen van Israël, die wij tegen U gezondigd hebben; ook ik en het huis van mijn vader, wij hebben gezondigd.", "Openb 5:9-11": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie; en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde. En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Zach 8:8": "En Ik zal hen hierheen brengen, zodat zij in het midden van Jeruzalem wonen zullen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn, in waarheid en in gerechtigheid.", "Ps 145:9": "Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.", "1 Sam 28:24": "En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde koeken van.", "Mark 6:22": "en toen de dochter van deze Herodias binnenkwam en danste, en Herodes en hen die mee aanzaten behaagde, zei de koning tegen het meisje: Vraag mij wat u maar wilt, en ik zal het u geven.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Tit 3:4-6": "Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest; Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Luk 15:18-20": "Ik zal opstaan en naar mijn vader gaan, en ik zal tegen hem zeggen: Vader, ik heb gezondigd tegen de hemel, en tegenover u; en ik ben niet meer waard uw zoon genoemd te worden; maak mij als één van uw dagloners. En hij stond op en ging naar zijn vader. En toen hij nog ver van hem verwijderd was, zag zijn vader hem, en werd innerlijk met ontferming bewogen; en hij liep hem tegemoet, viel hem om de hals, en kuste hem.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Jes 1:10-13": "Hoor het woord van de HEERE, leiders van Sodom! Neem de wet van onze God ter oor, volk van Gomorra! Waartoe zal Mij de veelheid van uw slachtoffers zijn? zegt de HEERE; Ik ben zat van de brandoffers van de rammen, en het vet van de vette dieren, en heb geen lust aan het bloed van de stieren, noch van de lammeren, noch van de bokken. Wanneer u voor Mijn aangezicht komt te verschijnen, wie heeft dat van uw hand geëist, dat u Mijn voorhoven zou betreden?", "Dan 9:5-7": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten. En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land. Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Joh 3:17": "Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Jer 4:27": "Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken);", "Jak 5:4": "Zie, het loon van de arbeiders die uw landen gemaaid hebben, dat door u is achtergehouden, roept; en het geschrei van hen die geoogst hebben, is gekomen tot in de oren van de Heere Sebaoth.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Luk 15:20-24": "En hij stond op en ging naar zijn vader. En toen hij nog ver van hem verwijderd was, zag zijn vader hem, en werd innerlijk met ontferming bewogen; en hij liep hem tegemoet, viel hem om de hals, en kuste hem. En de zoon zei tegen hem: Vader, ik heb gezondigd tegen de hemel, en tegenover u, en ben niet meer waard uw zoon genoemd te worden. Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten;", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Fil 3:7": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd.", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Job 18:2-4": "Hoe lang duurt het nog voordat u een einde maakt aan uw woorden? Let op, en daarna zullen wij spreken. Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen? O u, die uw ziel verscheurt door uw toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots weggenomen worden uit haar plaats?", "Ef 1:21": "Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende;", "Ps 132:16": "En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen.", "Ezra 9:7-14": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onz
