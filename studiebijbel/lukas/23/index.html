baring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de hele menigte van hen stond op en leidde Hem naar Pilatus.","2":"En zij begonnen Hem te beschuldigen en zeiden: Wij hebben bevonden dat Deze het volk verkeerd voorlicht, en verbiedt de keizer schattingen te geven, en zegt dat Hij Zelf Christus, de Koning is.","3":"En Pilatus vroeg Hem: Bent U de Koning van de Joden? En Hij antwoordde hem en zei: U zegt het.","4":"En Pilatus zei tegen de overpriesters en de menigten: Ik vind geen schuld in deze Mens.","5":"Maar zij hielden te sterker aan en zeiden: Hij zet het volk in opschudding, door heel Judea te leren, begonnen vanaf Galilea tot hier toe.","6":"Toen Pilatus dit over Galilea hoorde, vroeg hij of die Mens een Galileeër was.","7":"En toen hij begreep dat Hij onder het gebied van Herodes viel, stuurde hij Hem naar Herodes, die in die dagen ook zelf in Jeruzalem was.","8":"En toen Herodes Jezus zag, werd hij zeer verblijd; want hij was al geruime tijd begerig geweest Hem te zien, omdat hij veel over Hem hoorde; en hij hoopte een of ander teken te zien dat door Hem gedaan zou worden.","9":"En hij ondervroeg Hem met veel woorden; maar Hij antwoordde hem niets.","10":"En de overpriesters en de schriftgeleerden stonden erbij en beschuldigden Hem heftig.","11":"En Herodes met zijn soldaten kleineerde en bespotte Hem, deed Hem een blinkend kleed aan, en stuurde Hem terug naar Pilatus.","12":"En op diezelfde dag werden Pilatus en Herodes vrienden met elkaar; want daarvoor waren zij in vijandschap tegen elkaar geweest.","13":"En toen Pilatus de overpriesters, de leiders en het volk bijeengeroepen had, zei hij tegen hen:","14":"U hebt deze Mens naar mij gebracht, als iemand die het volk afkerig maakt; en zie, ik heb Hem in uw tegenwoordigheid ondervraagd, en heb in deze Mens geen schuld gevonden van wat u Hem verwijt;","15":"Ja, ook Herodes niet; want ik heb u naar hem gestuurd, en zie, er is door Hem niets gedaan wat de dood waard is.","16":"Ik zal Hem dan kastijden en loslaten.","17":"En hij moest hun op het feest één gevangene loslaten.","18":"Maar heel de menigte riep tegelijk: Weg met Deze, en laat ons Bar-abbas los.","19":"Die vanwege een oproer dat in de stad gebeurd was, en om een doodslag, in de gevangenis geworpen was.","20":"Pilatus dan riep hun opnieuw toe, omdat hij Jezus wilde loslaten.","21":"Maar zij riepen terug: Kruisig Hem, kruisig Hem!","22":"En hij zei voor de derde maal tegen hen: Wat heeft Deze dan voor kwaad gedaan? Ik heb geen schuld die de dood verdient in Hem gevonden. Ik zal Hem dan kastijden en loslaten.","23":"Maar zij hielden aan met luid geroep en eisten dat Hij gekruisigd zou worden; en hun geroep, en dat van de overpriesters, werd heviger.","24":"En Pilatus besliste dat hun eis zou gebeuren.","25":"En hij liet hem los die om oproer en doodslag in de gevangenis geworpen was, die zij geëist hadden; maar Jezus gaf hij over aan hun wil.","26":"En toen zij Hem wegleidden, grepen zij een zekere Simon van Cyrene, die van de akker kwam, en legden hem het kruis op, zodat hij het achter Jezus aan droeg.","27":"En een grote menigte van volk en van vrouwen volgde Hem, die ook weenden en Hem beklaagden.","28":"En Jezus keerde Zich naar hen toe en zei: Dochters van Jeruzalem, weent niet over Mij, maar weent over uzelf, en over uw kinderen.","29":"Want zie, er komen dagen waarin men zal zeggen: Zalig zijn de onvruchtbaren, en de buiken die niet gebaard hebben, en de borsten die niet gezoogd hebben.","30":"Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.","31":"Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?","32":"En er werden ook twee anderen weggeleid, kwaaddoeners, om samen met Hem gedood te worden.","33":"En toen zij bij de plaats kwamen die Hoofdschedelplaats genoemd wordt, kruisigden zij Hem daar, en de kwaaddoeners, de een aan de rechterkant en de ander aan de linkerkant.","34":"En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.","35":"En het volk stond te kijken. En ook de leiders bespotten Hem samen met hen en zeiden: Anderen heeft Hij verlost; laat Hij nu Zichzelf verlossen, als Hij de Christus is, de Uitverkorene van God.","36":"En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;","37":"En zeiden: Als U de Koning van de Joden bent, verlos Uzelf dan.","38":"En er stond ook een opschrift boven Hem geschreven, in Griekse, Romeinse en Hebreeuwse letters: DEZE IS DE KONING VAN DE JODEN.","39":"En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons.","40":"Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent?","41":"En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.","42":"En hij zei tegen Jezus: Heere, denk aan mij, wanneer U in Uw Koninkrijk gekomen bent.","43":"En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.","44":"En het was ongeveer het zesde uur, en er kwam duisternis over de hele aarde, tot het negende uur toe.","45":"En de zon werd verduisterd, en het voorhangsel van de tempel scheurde middendoor.","46":"En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.","47":"Toen de hoofdman over honderd zag wat er gebeurd was, verheerlijkte hij God en zei: Waarlijk, deze Mens was rechtvaardig.","48":"En alle menigten die samengekomen waren om dit te aanschouwen, zagen wat er gebeurd was, en keerden terug, terwijl zij op hun borst sloegen.","49":"En al Zijn bekenden stonden van verre af, ook de vrouwen die Hem samen gevolgd waren vanuit Galilea, en zagen dit aan.","50":"En zie, een man met de naam Jozef, een raadsheer, een goed en rechtvaardig man,","51":"(Deze had niet ingestemd met hun raadsbesluit en handelwijze) van Arimathea, een stad van de Joden, en die ook zelf het Koninkrijk van God verwachtte;","52":"Deze ging naar Pilatus en vroeg om het lichaam van Jezus.","53":"En toen hij het afgenomen had, wikkelde hij het in fijn linnen, en legde het in een graf dat in de rots uitgehouwen was, waarin nog nooit iemand gelegen had.","54":"En het was de dag van de voorbereiding, en de sabbat brak aan.","55":"En ook de vrouwen die met Hem uit Galilea gekomen waren, volgden mee en zagen het graf, en hoe Zijn lichaam gelegd werd.","56":"En zij keerden terug en bereidden specerijen en zalven; en op de sabbat rustten zij, volgens het gebod."},"SV":{"1":"En de gehele menigte van hen stond op, en leidde Hem tot Pilatus.","2":"En zij begonnen Hem te beschuldigen, zeggende: Wij hebben bevonden, dat Deze het volk verkeert, en verbiedt den keizer schattingen te geven, zeggende, dat Hij Zelf Christus, de Koning is.","3":"En Pilatus vraagde Hem, zeggende: Zijt Gij de Koning der Joden? En Hij antwoordde hem en zeide: Gij zegt het.","4":"En Pilatus zeide tot de overpriesters en de scharen: Ik vind geen schuld in dezen Mens.","5":"En zij hielden te sterker aan, zeggende: Hij beroert het volk, lerende door geheel Judea, begonnen hebbende van Galilea tot hier toe.","6":"Als nu Pilatus van Galilea hoorde, vraagde hij, of die Mens een Galileër was?","7":"En verstaande, dat Hij uit het gebied van Herodes was, zond hij Hem heen tot Herodes, die ook zelf in die dagen binnen Jeruzalem was.","8":"En als Herodes Jezus zag, werd hij zeer verblijd; want hij was van over lang begerig geweest Hem te zien, omdat hij veel van Hem hoorde; en hoopte enig teken te zien, dat van Hem gedaan zou worden.","9":"En hij vraagde Hem met vele woorden; doch Hij antwoordde hem niets.","10":"En de overpriesters en de Schriftgeleerden stonden, en beschuldigden Hem heftiglijk.","11":"En Herodes met zijn krijgslieden Hem veracht en bespot hebbende, deed Hem een blinkend kleed aan, en zond Hem weder tot Pilatus.","12":"En op denzelfde dag werden Pilatus en Herodes vrienden met elkander; want zij waren te voren in vijandschap tegen den anderen.","13":"En als Pilatus de overpriesters, en de oversten, en het volk bijeengeroepen had, zeide hij tot hen:","14":"Gij hebt dezen Mens tot mij gebracht, als een, die het volk afkerig maakt; en ziet, ik heb *Hem* in uw tegenwoordigheid ondervraagd, en heb in dezen Mens geen schuld gevonden, van hetgeen daar gij Hem mede beschuldigt;","15":"Ja, ook Herodes niet; want ik heb ulieden tot hem gezonden, en ziet, er is van Hem niets gedaan, dat des doods waardig is.","16":"Zo zal ik Hem dan kastijden en loslaten.","17":"En hij moest hun op het feest een loslaten.","18":"Doch al de menigte riep gelijkelijk, zeggende: Weg met Dezen, en laat ons Bar-abbas los.","19":"Dewelke was om zeker oproer, dat in de stad geschied was, en *om* een doodslag, in de gevangenis geworpen.","20":"Pilatus dan riep *hun* wederom toe, willende Jezus loslaten.","21":"Maar zij riepen daartegen, zeggende: Kruis *Hem*, kruis Hem!","22":"En hij zeide ten derden male tot hen: Wat heeft Deze dan kwaads gedaan? Ik heb geen schuld des doods in Hem gevonden. Zo zal ik Hem dan kastijden en loslaten.","23":"Maar zij hielden aan met groot geroep, eisende, dat Hij zou gekruist worden; en hun en der overpriesteren geroep werd geweldiger.","24":"En Pilatus oordeelde, dat hun eis geschieden zou.","25":"En hij liet hun los dengene, die om oproer en doodslag in de gevangenis geworpen was, welken zij geëist hadden; maar Jezus gaf hij over tot hun wil.","26":"En als zij Hem wegleidden, namen zij een Simon van Cyrene, komende van den akker, en legden hem het kruis op, dat hij het achter Jezus droeg.","27":"En een grote menigte van volk en van vrouwen volgde Hem, welke ook weenden en Hem beklaagden.","28":"En Jezus, Zich tot haar kerende, zeide: Gij dochters van Jeruzalem! weent niet over Mij, maar weent over uzelven, en over uw kinderen.","29":"Want ziet, er komen dagen, in welke men zeggen zal: Zalig *zijn* de onvruchtbaren, en de buiken, die niet gebaard hebben, en de borsten, die niet gezoogd hebben.","30":"Alsdan zullen zij beginnen te zeggen tot de bergen: Valt op ons; en tot de heuvelen: Bedekt ons.","31":"Want indien zij dit doen aan het groene hout, wat zal aan het dorre geschieden?","32":"En er werden ook twee anderen, zijnde kwaaddoeners, geleid, om met Hem gedood te worden.","33":"En toen zij kwamen op de plaats, genaamd Hoofdschedel *plaats*, kruisigden zij Hem aldaar, en de kwaaddoeners, den een ter rechter *zijde* en den ander ter linker *zijde*.","34":"En Jezus zeide: Vader, vergeef het hun; want zij weten niet, wat zij doen. En verdelende Zijn klederen, wierpen zij het lot.","35":"En het volk stond en zag het aan. En ook de oversten met hen beschimpten *Hem*, zeggende: Anderen heeft Hij verlost, dat Hij nu Zichzelven verlosse, zo Hij is de Christus, de Uitverkorene Gods.","36":"En ook de krijgsknechten, tot *Hem* komende, bespotten Hem, en brachten Hem edik;","37":"En zeiden: Indien gij de Koning der Joden zijt, zo verlos Uzelven.","38":"En er was ook een opschrift boven Hem geschreven, met Griekse, en Romeinse en Hebreeuwse letters: DEZE IS DE KONING DER JODEN.","39":"En een der kwaaddoeners, die gehangen waren, lasterde Hem, zeggende: Indien Gij de Christus zijt, verlos Uzelven en ons.","40":"Maar de andere, antwoordende, bestrafte hem, zeggende: Vreest gij ook God niet, daar gij in hetzelfde oordeel zijt?","41":"En wij toch rechtvaardiglijk; want wij ontvangen *straf*, waardig hetgeen wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.","42":"En hij zeide tot Jezus: Heere, gedenk mijner, als Gij in Uw Koninkrijk zult gekomen zijn.","43":"En Jezus zeide tot hem: Voorwaar, zeg Ik u: Heden zult gij met Mij in het Paradijs zijn.","44":"En het was omtrent de zesde ure, en er werd duisternis over de gehele aarde, tot de negende ure toe.","45":"En de zon werd verduisterd, en het voorhangsel des tempels scheurde midden *door*.","46":"En Jezus, roepende met grote stemme, zeide: Vader, in Uw handen beveel Ik Mijn geest. En als Hij dat gezegd had, gaf Hij den geest.","47":"Als nu de hoofdman over honderd zag, wat er geschied was, verheerlijkte hij God, en zeide: Waarlijk, deze Mens was rechtvaardig.","48":"En al de scharen, die samengekomen waren om dit te aanschouwen, ziende de dingen, die geschied waren, keerden wederom, slaande op hun borsten.","49":"En al Zijn bekenden stonden van verre, ook de vrouwen, die Hem te zamen gevolgd waren van Galilea, en zagen dit aan.","50":"En zie, een man, met name Jozef, zijnde een raadsheer, een goed en rechtvaardig man,","51":"( Deze had niet mede bewilligd in hun raad en handel) van Arimathea, een stad der Joden, en die ook zelf het Koninkrijk Gods verwachtte;","52":"Deze ging tot Pilatus, en begeerde het lichaam van Jezus.","53":"En als hij hetzelve afgenomen had, wond hij dat in een fijn lijnwaad, en legde het in een graf, in een rots gehouwen, waarin nog nooit iemand gelegd was.","54":"En het was de dag der voorbereiding, en de sabbat kwam aan.","55":"En ook de vrouwen, die met Hem gekomen waren uit Galilea, volgden na en aanschouwden het graf, en hoe Zijn lichaam gelegd werd.","56":"En wedergekeerd zijnde, bereidden zij specerijen en zalven; en op den sabbat rustten zij naar het gebod."},"KJV":{"1":"And the whole multitude of them arose, and led him unto Pilate.","2":"And they began to accuse him, saying, We found this *fellow* perverting the nation, and forbidding to give tribute to Caesar, saying that he himself is Christ a King.","3":"And Pilate asked him, saying, Art thou the King of the Jews? And he answered him and said, Thou sayest","4":"Then said Pilate to the chief priests and *to* the people, I find no fault in this man.","5":"And they were the more fierce, saying, He stirreth up the people, teaching throughout all Jewry, beginning from Galilee to this place.","6":"When Pilate heard of Galilee, he asked whether the man were a Galilaean.","7":"And as soon as he knew that he belonged unto Herod's jurisdiction, he sent him to Herod, who himself also was at Jerusalem at that time.","8":"And when Herod saw Jesus, he was exceeding glad: for he was desirous to see him of a long *season*, because he had heard many things of him; and he hoped to have seen some miracle done by him.","9":"Then he questioned with him in many words; but he answered him nothing.","10":"And the chief priests and scribes stood and vehemently accused him.","11":"And Herod with his men of war set him at nought, and mocked *him*, and arrayed him in a gorgeous robe, and sent him again to Pilate.","12":"And the same day Pilate and Herod were made friends together: for before they were at enmity between themselves.","13":"And Pilate, when he had called together the chief priests and the rulers and the people,","14":"Said unto them, Ye have brought this man unto me, as one that perverteth the people: and, behold, I, having examined *him* before you, have found no fault in this man touching those things whereof ye accuse him:","15":"No, nor yet Herod: for I sent you to him; and, lo, nothing worthy of death is done unto him.","16":"I will therefore chastise him, and release","17":"(For of necessity he must release one unto them at the feast.)","18":"And they cried out all at once, saying, Away with this *man*, and release unto us Barabbas:","19":"(Who for a certain sedition made in the city, and for murder, was cast into prison.)","20":"Pilate therefore, willing to release Jesus, spake again to them.","21":"But they cried, saying, Crucify *him*, crucify him.","22":"And he said unto them the third time, Why, what evil hath he done? I have found no cause of death in him: I will therefore chastise him, and let *him* go.","23":"And they were instant with loud voices, requiring that he might be crucified. And the voices of them and of the chief priests prevailed.","24":"And Pilate gave sentence that it should be as they required.","25":"And he released unto them him that for sedition and murder was cast into prison, whom they had desired; but he delivered Jesus to their will.","26":"And as they led him away, they laid hold upon one Simon, a Cyrenian, coming out of the country, and on him they laid the cross, that he might bear *it* after Jesus.","27":"And there followed him a great company of people, and of women, which also bewailed and lamented him.","28":"But Jesus turning unto them said, Daughters of Jerusalem, weep not for me, but weep for yourselves, and for your children.","29":"For, behold, the days are coming, in the which they shall say, Blessed *are* the barren, and the wombs that never bare, and the paps which never gave suck.","30":"Then shall they begin to say to the mountains, Fall on us; and to the hills, Cover us.","31":"For if they do these things in a green tree, what shall be done in the dry?","32":"And there were also two other, malefactors, led with him to be put to death.","33":"And when they were come to the place, which is called Calvary, there they crucified him, and the malefactors, one on the right hand, and the other on the left.","34":"Then said Jesus, Father, forgive them; for they know not what they do. And they parted his raiment, and cast lots.","35":"And the people stood beholding. And the rulers also with them derided *him*, saying, He saved others; let him save himself, if he be Christ, the chosen of God.","36":"And the soldiers also mocked him, coming to him, and offering him vinegar,","37":"And saying, If thou be the king of the Jews, save thyself.","38":"And a superscription also was written over him in letters of Greek, and Latin, and Hebrew, THIS IS THE KING OF THE JEWS.","39":"And one of the malefactors which were hanged railed on him, saying, If thou be Christ, save thyself and us.","40":"But the other answering rebuked him, saying, Dost not thou fear God, seeing thou art in the same condemnation?","41":"And we indeed justly; for we receive the due reward of our deeds: but this man hath done nothing amiss.","42":"And he said unto Jesus, Lord, remember me when thou comest into thy kingdom.","43":"And Jesus said unto him, Verily I say unto thee, To day shalt thou be with me in paradise.","44":"And it was about the sixth hour, and there was a darkness over all the earth until the ninth hour.","45":"And the sun was darkened, and the veil of the temple was rent in the midst.","46":"And when Jesus had cried with a loud voice, he said, Father, into thy hands I commend my spirit: and having said thus, he gave up the ghost.","47":"Now when the centurion saw what was done, he glorified God, saying, Certainly this was a righteous man.","48":"And all the people that came together to that sight, beholding the things which were done, smote their breasts, and returned.","49":"And all his acquaintance, and the women that followed him from Galilee, stood afar off, beholding these things.","50":"And, behold, *there was* a man named Joseph, a counsellor; *and he was* a good man, and a just:","51":"(The same had not consented to the counsel and deed of them;) *he was* of Arimathaea, a city of the Jews: who also himself waited for the kingdom of God.","52":"This *man* went unto Pilate, and begged the body of Jesus.","53":"And he took it down, and wrapped it in linen, and laid it in a sepulchre that was hewn in stone, wherein never man before was laid.","54":"And that day was the preparation, and the sabbath drew on.","55":"And the women also, which came with him from Galilee, followed after, and beheld the sepulchre, and how his body was laid.","56":"And they returned, and prepared spices and ointments; and rested the sabbath day according to the commandment."}},"tsk":{"2":[{"kopje":"zij","refs":["Zach 11:8","Mark 15:3-5","Joh 18:30"]},{"kopje":"verkeerd voorlicht","refs":["Luk 23:5","1 Kon 18:17","Jer 38:4","Amos 7:10","Hand 16:20","Hand 16:21","Hand 17:6","Hand 17:7","Hand 24:5"]},{"kopje":"verbiedt","refs":["Luk 20:20-25","1 Kon 21:10-13","Ps 35:11","Ps 62:5","Ps 64:4-7","Jer 20:10","Jer 37:13-15","Matt 17:27","Matt 22:21","Matt 26:59","Matt 26:60","Mark 12:17","Mark 14:55","Mark 14:56","Hand 24:13","1 Petr 3:16-18"]},{"kopje":"dat","refs":["Luk 22:69","Luk 22:70","Mark 14:61","Mark 14:62","Joh 18:36","Joh 19:12"]}],"3":[{"kopje":"Pilatus","refs":["Matt 27:11","Mark 15:2","Joh 18:33-37","1 Tim 6:13"]},{"kopje":"de Koning","refs":["Luk 23:38","Luk 1:32","Luk 1:33","Luk 19:38-40","Mark 15:18","Mark 15:32","Joh 1:50","Joh 19:3","Joh 19:19-21"]},{"kopje":"hij antwoordde","refs":["1 Tim 6:13"]}],"4":[{"kopje":"Ik vind","refs":["Luk 23:14","Luk 23:15","Matt 27:19","Matt 27:24","Mark 15:14","Joh 18:38","Joh 19:4-6","Hebr 7:26","1 Petr 1:19","1 Petr 2:22","1 Petr 3:18"]}],"5":[{"kopje":"zij","refs":["Luk 23:23","Luk 11:53" const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
