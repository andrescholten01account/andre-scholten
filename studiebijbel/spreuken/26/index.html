wie boodschappen laat overbrengen door de hand van een dwaas.","7":"Hef de benen van de kreupele op[1]; zo is een spreuk in de mond van de dwazen.","8":"Zoals hij die een edelsteen in een slinger bindt, zo is hij die de dwaas eer geeft.","9":"Zoals een doorn omhooggaat in de hand van een dronkaard, zo is een spreuk in de mond van de dwazen.","10":"De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.","11":"Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.","12":"Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.","13":"De luiaard zegt: Er is een felle leeuw op de weg, een leeuw is op de straten.","14":"Een deur draait om op haar scharnier, zo draait de luiaard op zijn bed.","15":"De luiaard verbergt zijn hand in zijn boezem, het valt hem te zwaar om die weer naar zijn mond te brengen.","16":"De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.","17":"De voorbijganger die zich opwindt in een twist die hem niet aangaat, is als iemand die een hond bij de oren grijpt.","18":"Zoals iemand die zich waanzinnig aanstelt, die vuurpijlen, pijlen en dodelijke dingen werpt;","19":"zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?","20":"Als er geen hout is, gaat het vuur uit; en als er geen roddelaar is, wordt het gekijf gestild.","21":"De dode kool is voor de vurige kool, en het hout voor het vuur; zo is een twistzieke man om ruzie aan te wakkeren.","22":"De woorden van de roddelaar zijn als klappen die aankomen, en die diep in het binnenste van de buik dalen.","23":"Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim.","24":"Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog.","25":"Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.","26":"Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.","27":"Wie een kuil graaft, zal erin vallen, en wie een steen wentelt, op hem zal die terugkeren.","28":"Een valse tong haat hen die zij verbrijzelt; en een gladde mond veroorzaakt val."},"SV":{"1":"Gelijk de sneeuw in den zomer, en gelijk de regen in den oogst, alzo past den zot de eer niet.","2":"Gelijk de mus is tot wegzweven, gelijk een zwaluw tot vervliegen, alzo zal een vloek, die zonder oorzaak is, niet komen.","3":"Een zweep is voor het paard, een toom voor den ezel, en een roede voor den rug der zotten.","4":"Antwoord den zot naar zijn dwaasheid niet, opdat gij ook hem niet gelijk wordt.","5":"Antwoord den zot naar zijn dwaasheid, opdat hij in zijn ogen niet wijs zij.","6":"Hij snijdt *zich* de voeten af, *en* drinkt geweld, die boodschappen zendt door de hand van een zot.","7":"Hef de benen van den kreupele op; alzo is een spreuk in den mond der zotten.","8":"Gelijk hij, die een *edel* gesteente in een slinger bindt, alzo is hij, die den zot eer geeft.","9":"*Gelijk* een doorn gaat in de hand eens dronkaards, alzo is een spreuk in den mond der zotten.","10":"De groten doen een iegelijk verdriet aan, en huren de zotten, en huren de overtreders.","11":"Gelijk een hond tot zijn uitspuwsel wederkeert, *alzo* herneemt de zot zijn dwaasheid.","12":"Hebt gij een man gezien, die wijs in zijn ogen is! Van een zot is meer verwachting dan van hem.","13":"De luiaard zegt: Er is een felle leeuw op den weg, een leeuw is op de straten.","14":"Een deur keert om op haar herre, alzo de luiaard op zijn bed.","15":"De luiaard verbergt zijn hand in den boezem, hij is te moede, om die weder tot zijn mond te brengen.","16":"De luiaard is wijzer in zijn ogen, dan zeven, die *met* rede antwoorden.","17":"De voorbijgaande, die zich vertoornt in een twist, *die* hem niet aangaat, is *gelijk* die een hond bij de oren grijpt.","18":"Gelijk een, die zich veinst te razen, die vuursprankelen, pijlen en dodelijke dingen werpt;","19":"Alzo is een man, die zijn naaste bedriegt, en zegt: Jok ik er niet mede?","20":"Als er geen hout is, gaat het vuur uit; en als er geen oorblazer is, wordt het gekijf gestild.","21":"De dove kool is om de vurige kool, en het hout om het vuur; alzo is een kijfachtig man, om twist te ontsteken.","22":"De woorden des oorblazers zijn als dergenen, die geslagen zijn, en die dalen in het binnenste des buiks.","23":"Brandende lippen, en een boos hart, zijn *als* een potscherf met schuim van zilver overtogen.","24":"Die haat draagt, houdt zich vreemd met zijn lippen; maar in zijn binnenste stelt hij bedrog aan.","25":"Als hij met zijn stem smeekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.","26":"*Wiens* haat door bedrog bedekt is, diens boosheid zal in de gemeente geopenbaard worden.","27":"Die een kuil graaft, zal er in vallen, en die een steen wentelt, op hem zal hij wederkeren.","28":"Een valse tong haat degenen, die zij verbrijzelt; en een gladde mond maakt omstoting."},"KJV":{"1":"As snow in summer, and as rain in harvest, so honour is not seemly for a fool.","2":"As the bird by wandering, as the swallow by flying, so the curse causeless shall not come.","3":"A whip for the horse, a bridle for the ass, and a rod for the fool's back.","4":"Answer not a fool according to his folly, lest thou also be like","5":"Answer a fool according to his folly, lest he be wise in his own conceit.","6":"He that sendeth a message by the hand of a fool cutteth off the feet, *and* drinketh damage.","7":"The legs of the lame are not equal: so *is* a parable in the mouth of fools.","8":"As he that bindeth a stone in a sling, so *is* he that giveth honour to a fool.","9":"*As* a thorn goeth up into the hand of a drunkard, so *is* a parable in the mouth of fools.","10":"The great *God* that formed all *things* both rewardeth the fool, and rewardeth transgressors.","11":"As a dog returneth to his vomit, *so* a fool returneth to his folly.","12":"Seest thou a man wise in his own conceit? *there is* more hope of a fool","13":"The slothful *man* saith, *There is* a lion in the way; a lion *is* in the streets.","14":"*As* the door turneth upon his hinges, so *doth* the slothful upon his bed.","15":"The slothful hideth his hand in *his* bosom; it grieveth him to bring it again to his mouth.","16":"The sluggard *is* wiser in his own conceit than seven men that can render a reason.","17":"He that passeth by, *and* meddleth with strife *belonging* not to him, *is like* one that taketh a dog by the ears.","18":"As a mad *man* who casteth firebrands, arrows, and death,","19":"So *is* the man *that* deceiveth his neighbour, and saith, Am not I in sport?","20":"Where no wood is, *there* the fire goeth out: so where *there is* no talebearer, the strife ceaseth.","21":"*As* coals *are* to burning coals, and wood to fire; so *is* a contentious man to kindle strife.","22":"The words of a talebearer *are* as wounds, and they go down into the innermost parts of the belly.","23":"Burning lips and a wicked heart *are like* a potsherd covered with silver dross.","24":"He that hateth dissembleth with his lips, and layeth up deceit within","25":"When he speaketh fair, believe him not: for *there are* seven abominations in his heart.","26":"*Whose* hatred is covered by deceit, his wickedness shall be shewed before the *whole* congregation.","27":"Whoso diggeth a pit shall fall therein: and he that rolleth a stone, it will return","28":"A lying tongue hateth *those that are* afflicted by it; and a flattering mouth worketh ruin."}},"tsk":{"1":[{"kopje":"in de zomer","refs":["1 Sam 12:17","1 Sam 12:18"]},{"kopje":"zo","refs":["Spr 26:3","Spr 28:16","Richt 9:7","Richt 9:20","Richt 9:56","Richt 9:57","Est 3:1-15","Est 4:6","Est 4:9","Ps 12:9","Ps 15:4","Ps 52:3","Pred 10:5-7"]}],"2":[{"kopje":"zo","refs":["Num 23:8","Deut 23:4","Deut 23:5","1 Sam 14:28","1 Sam 14:29","1 Sam 17:43","2 Sam 16:12","Neh 13:2","Ps 109:28"]}],"5":[{"kopje":"de dwaas","refs":["1 Kon 22:24-28","Jer 36:17"," 22":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of a <span class=\"wl wl-kjv\" data-code=\"H5372\">talebearer</span> are as <span class=\"wl wl-kjv\" data-code=\"H3859\">wounds,</span> and they go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the innermost <span class=\"wl wl-kjv\" data-code=\"H2315\">parts</span> of the belly.","23":"<span class=\"wl wl-kjv\" data-code=\"H1814\">Burning</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> and a <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> are like a <span class=\"wl wl-kjv\" data-code=\"H2789\">potsherd</span> <span class=\"wl wl-kjv\" data-code=\"H6823\">covered</span> with <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> dross.","24":"He that <span class=\"wl wl-kjv\" data-code=\"H8130\">hateth</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">dissembleth</span> with his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips,</span> and layeth <span class=\"wl wl-kjv\" data-code=\"H7896\">up</span> <span class=\"wl wl-kjv\" data-code=\"H4820\">deceit</span> within","25":"When he <span class=\"wl wl-kjv\" data-code=\"H6963\">speaketh</span> <span class=\"wl wl-kjv\" data-code=\"H2603\">fair,</span> <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> him not: for there are <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> in his heart.","26":"Whose <span class=\"wl wl-kjv\" data-code=\"H8135\">hatred</span> is <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> by <span class=\"wl wl-kjv\" data-code=\"H4860\">deceit,</span> his <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1540\">shewed</span> before the whole congregation.","27":"Whoso <span class=\"wl wl-kjv\" data-code=\"H3738\">diggeth</span> a <span class=\"wl wl-kjv\" data-code=\"H7845\">pit</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> therein: and he that <span class=\"wl wl-kjv\" data-code=\"H1556\">rolleth</span> a <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> it will return","28":"A <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hateth</span> those that are <span class=\"wl wl-kjv\" data-code=\"H1790\">afflicted</span> by it; and a <span class=\"wl wl-kjv\" data-code=\"H2509\">flattering</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">worketh</span> ruin."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"oogst,","tekst":"Te weten niet voegen, maar ontijdig en schadelijk zijn. In het Joodse land regende het niet op den tijd van den oogst, of zeer zelden. Zie 1Sa 12:17 ."},{"catchword":"eer niet","tekst":"Dat is, staat en regering, waarmede hij zichzelven te schande maken en anderen verdrukken zou."}],"2":[{"catchword":"mus","tekst":"Zie van het Hebreeuwse woord, [hetwelk hier voor een mus genomen wordt] Gen 7:14 , en Lev 14:4 ."},{"catchword":"die zonder oorzaak","tekst":"Dat is die men tegen een onschuldige gedaan heeft."},{"catchword":"niet komen","tekst":"Dat is, dengene, die gevloekt wordt, niet treffen, maar van hem als een vogel wegvliegen."}],"4":[{"catchword":"Antwoord den zot","tekst":"Te weten op die wijze, welke hij in zijn rede gebruikt, namelijk met smaadwoorden, lasteringen, valse redenen en bespottingen; en alzo dat gij u door den twist laat wegrukken tot onbehoorlijke driften."}],"5":[{"catchword":"naar zijn dwaasheid,","tekst":"Te weten naardat zijne dwaasheid eist, dat zij namelijk met goeden vasten grond bestraf en wederlegd worde."},{"catchword":"in zijn ogen","tekst":"Dat is, in zijn eigen oordeel, waardoor hij zich laat dunken dat hij wijs is. Alzo onder vs.12, 16."}],"6":[{"catchword":"Hij snijdt","tekst":"Dat is, hij maakt dat hij met zijne zaken niet voortkomen kan. Of, hij beneemt zichzelven de gelegenheid en bekwaamheid om zijne dingen uit te voeren gemerkt dat hij ze veel beter door zichzelven of door anderen dan door den zot doen zou."},{"catchword":"drinkt","tekst":"Dat is, doet zichzelven ongelijk een behaalt schande en schade bij degenen, tot wien hij den zot uitzendt. De manier van spreken betekent zoveel als eeuwig kwaad lijden, of daarmede gestraft worden; vergelijk de aantekening Psa 75:9 ."},{"catchword":"boodschappen","tekst":"Hebreeuws, woorden."},{"catchword":"door de hand","tekst":"Dat is, door den dienst; zie Exo 4:13 ."}],"7":[{"catchword":"op;","tekst":"Te weten opdat hij die in enig wel zou mogen gebruiken. Doch gelijk dit niet bekwamelijk geschieden kan, alzo kan ook een zot een wijze spreuk niet wel verhalen. Anders: De benen des kreupelen zijn opgeheven; versta, het ene meer dan het andere, zodat zij ongelijk zijn. De zin is, gelijk de benen of schenkels van een kreupele gene evenredigheid hebben, alzo zijn de redenen van een zot ongerijmd en passen op elkander niet. Man ken ook vs.7 aldus vertalen: Neem de benen van den kreupele weg; en de spreuken [die] in der zotten mond zijn. Sommigen verstaan ook door de benen de versierselen derzelve, die den kreupele niet wel schijnen te voegen. De zin zou zijn dat wijze redenen in den mond der dwazen niet beter passen dan de benen, of hun sieraad, aan de kreupelen."}],"8":[{"catchword":"hij, die een","tekst":"Hebreeuws, gelijk het binden, of bindsel van een edelgesteente; te weten gans ongerijmd is, omdat de kostelijke steen, geslingerd zijnde, niets bijzonders kan uitrichten en ook verloren wordt, alzo is hij, enz."},{"catchword":"edel gesteente","tekst":"Het Hebreeuwse woord wordt ook voor edelgesteente genomen, Exo 31:5 . Zie de aantekening. Anders: die een [edel]gesteente vindt in een steenhoop."},{"catchword":"eer geeft","tekst":"Dat is, staat, ambten, rijkdom, die de zot niet recht gebruiken kan, maar laat verloren gaan."}],"9":[{"catchword":"gaat","tekst":"Hebreeuws, opgaat; dat is, gelijk een dronkaard zichzelven of anderen beschadigt als hij een doorn behandelen zou, alzo kan een zot een goede spreuk niet wel gebruiken."}],"10":[{"catchword":"groten","tekst":"Hebreeuws, de grote doet een iegelijk verdriet aan, en huurt een zot, en huurt de overtreders. Versta, tirannen, of heren en vorsten, of zodanige groten, die bij hen zulk aanzien hebben, dat zij een ieder moeite en verdriet aandoen. Tot welk einde zij zotten en overtreders in hunnen dienst hebben, waarvan de eersten niet kunnen en anderen niet willen goeddoen."},{"catchword":"de zotten,","tekst":"Zie boven Pro 1:22 ."},{"catchword":"overtreders","tekst":"Anders: de voorbijgaanden, wie zij zouden mogen zijn, die slechts maar genegen zijn het voornemen der groten, die hen huren, te volgen."}],"11":[{"catchword":"wederkeert,","tekst":"Te weten om dat weder in te slokken, hebbende vergeten dat het uitgespogene hem kwalijk bekwam."}],"12":[{"catchword":"die wijs","tekst":"Zie boven vs.5."},{"catchword":"een zot","tekst":"Zie boven Pro 1:22 ."},{"catchword":"verwachting","tekst":"Te weten, van wijs en deugdzaam te worden."}],"13":[{"catchword":"De luiaard","tekst":"Vergelijk boven Pro 22:13 ."}],"14":[{"catchword":"herre,","tekst":"Dat is, hengsel of gehing, waaraan zij hangt en vast is."},{"catchword":"op zijn bed","tekst":"Te weten zonder daarvan af te komen om zijn behoorlijk werk te doen."}],"15":[{"catchword":"De luiaard","tekst":"Zie boven Pro 19:24 en de aantekening daarop."},{"catchword":"den boezem,","tekst":"Anders: in den schotel."}],"16":[{"catchword":"is wijzer","tekst":"Zie boven vs.5, en onder Pro 28:11 ."},{"catchword":"zeven,","tekst":"Dat is, van velen. Het is een zeker getal voor een onzeker; zie boven Pro 6:31 ."},{"catchword":"met rede","tekst":"Dat is, die redelijk of vernuftig, of met goed verstand en recht oordeel kunnen spreken. Van het Hebreeuwse woord, zie Job 12:20 , op het woord oordeel."}],"17":[{"catchword":"die hem","tekst":"Hebreeuws, niet zijne; dat is die zijne niet is."},{"catchword":"die een hond","tekst":"Dat is, die zichzelven zonder oorzaak in gevaar van moeite en schade werpt, gelijk hij, die een hond bij de oren trekt, dien tergt om hem te bespringen en te bijten."}],"18":[{"catchword":"die zich veinst","tekst":"Dat is, zich houdt of hij onzinnig of slecht ware. Gelijk onder zulk deksel niemand zich kan ontschuldigen als hij iemand leed gedaan heeft, alzo is die niet te ontschuldigen, die onder het deksel van jokken en spelen zijnen naaste beschadigt. Anders: die zich veinst amechtig te zijn."},{"catchword":"vuursprankelen,","tekst":"Of, vuurfakkelen, of vlammen. Anders: boeien, banden, of strikken, waarmede iemand, voornamelijk aan zijne handen, vastgemaakt wordt."},{"catchword":"dodelijke","tekst":"Hebreeuws, dood; dat is die den dood iemand kunnen aanbrengen."}],"19":[{"catchword":"Jok ik","tekst":"Hebreeuws, ben ik niet jokkende, of gekkende? Dat is, hetgeen ik gedaan heb, is niet uit moedwil en een kwaad opzet, maar uit jokkernij en genoegen, en al spelende gedaan."}],"20":[{"catchword":"en als er geen","tekst":"Vergelijk boven Pro 22:10 ."},{"catchword":"oorblazer is,","tekst":"Zie boven Pro 16:28 ."},{"catchword":"gestild","tekst":"Hebreeuws, zwijgt; dat is, wordt stil en houdt op. Zie van het Hebreeuwse woord Jos 10:12 ."}],"21":[{"catchword":"kijfachtig man,","tekst":"Hebreeuws, een man der kijving, of der geschillen."}],"22":[{"catchword":"De woorden","tekst":"Zie boven Pro 18:8 , waar dezelfde spreuk met dezelfde woorden voorgesteld wordt."}],"23":[{"catchword":"Brandende","tekst":"Versta, de mensen, die uit vurige liefde en goede toegenegenheid schijnen te spreken, maar nochtans hun, die zij toespreken, een kwaad hart toedragen."},{"catchword":"een potscherf","tekst":"Hetwelk van zichzelven wel van kleine waarde is, maar van buiten door den schijn en de gelijkheid des zilvers een schonen luister geeft, die de mensen bedrieft, menende dat de potscherf, daarmede overtrokken, goed massief zilver is."}],"24":[{"catchword":"gelaat","tekst":"Dat is, veinst zich anders van buiten door zijne woorden, dan hij van binnen in zijn hart is."},{"catchword":"binnenste","tekst":"Dat is, in zijn hart. Zie Job 20:14 ."}],"25":[{"catchword":"hij met zijn stem","tekst":"Te weten de hater, van wien in vs.24 gesproken is."},{"catchword":"zeven","tekst":"Dat is, vele, gelijk boven vs.16 en Pro 24:16 . Zie boven Pro 6:31 ."},{"catchword":"gruwelen","tekst":"Dat is, gruwelijke gedachten en praktijken om kwaad te doen."}],"26":[{"catchword":"door bedrog","tekst":"Anders: [als] in een woestijn; dat is, in een plaats waar geen mens in is, die boosheid ziet of hoort."},{"catchword":"in de gemeente","tekst":"Dat is, openbaar voor al de wereld, hetzij in dit leven, [gelijk het dikwijls geschiedt] of immers ten jongsten dage in het algemeen oordeel, tenzij men zich bekeert."}],"27":[{"catchword":"graaft,","tekst":"Te weten om een ander daarin te doen vallen."},{"catchword":"hem zal hij","tekst":"Te weten op hem, die den steen opwaarts tegen ene hoogte gewenteld heeft, om op iemand te doen vallen."}],"28":[{"catchword":"Een valse tong","tekst":"Hebreeuws, een tong der valsheid; dat is, een mens die met een valse tong omgaat."},{"catchword":"verbrijzelt;","tekst":"Of, verbrijzelen zal; dat is, verderven en uitroeien."},{"catchword":"gladde mond","tekst":"Dat is, vleiende en pluimstrijkende. Vergelijk boven Pro 5:3 , en de aantekening."},{"catchword":"omstoting","tekst":"Dat is, slaat een mens te gronde."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"As snow in Summer, and as rain in harvest; [To wit, are not seemly, but unseasonable and hurtful. In the land of Jud it rained not in harvest-time, or very seldom. See 1 Sam.12.17.] so honour is not seemly for a fool. [that is, dignity, and government, whereby he would bring shame upon himself, and oppress others, besitteth him not.]"}],"2":[{"catchword":null,"tekst":"As a sparrow is (given) to wander away, [See of the Hebrew word (which is here taken for a sparrow), Gen.7.on verse 14. And Lev.14.on verse 4.] as a swallow to flying away; so the curse, which is without cause, [that is, which is done to an innocent person] shall not come. [that is, not hurt him that is cursed, but fly away from him as a bird.]"}],"3":[{"catchword":null,"tekst":"A whip for the horse, bridle for the ass; [Compare Psa 32:9,10.] and a rod for the back of fools. [compare above chapter 10.13.]"}],"4":[{"catchword":null,"tekst":"Answer not the fool according to his folly: [To wit, in that manner, which he useth in his discourse, namely, with teams of reproach, slanderings, false accusations, and derisions; and so, as that thou suffer thy self by contention to be led away unto unseeming passions, as in hinted in the following words] lest thou also be like unto him."}],"5":[{"catchword":null,"tekst":"Answer the fool according to his folly: [To wit, according as his folly requireth; namely so, as that it be reproved and confused upon a good and sure ground] lest he be wise in his own eyes. [that is, in his own judgement, or whereby he imagineth and persuadeth himself that he is wife. So below verse 12,16.]"}],"6":[{"catchword":null,"tekst":"He cutteth off (his own) feet, [That is, he maketh that he cannot go on with his business. Or he taketh away from himself the occasion and fitness to perform his affairs, in regard he may do them far better by himself, or by others, then by a fool] (and) drinketh violence [that is, wrongeth himself, and getteth shame and damage by those, to whom he sendeth the fool. The phrase signifieth as much as to endure any mischief, or to be punished therewith. Compare Psalm 75. The annot.on verse 9.] that sendeth messages [Hebr. Words] by hand [that is, by the Ministery. See Exod.3.on verse 13.] of a fool."}],"7":[{"catchword":null,"tekst":"Lift up the legs of the cripple: so is a proverb in the mouth of fools. [Lift up the legs of the cripple, &c. To wit, that he may be able to use them well in any work. But as this cannot be conveniently done, so neither can a fool utter a wise sentence or proverb aright. Oth. The legs of a cripple are lifted up: meaning one leg more then the other, so that they are unequal. The meaning is, as the legs or shanks of a cripple have no proportion, so are the words and speechs of a fool absurd, and agree not together. This verse may be likewise rendered thus: Take away the legs from the cripple; and the proverbs (which) are in the mouth of fools. Some understand also by legs, the ornaments of the legs, which seem not to becomes a cripple well: and so the sense or meaning would be this, that wise speechs or sentences in the mouth of fools suit no better then legs, or ornaments of the legs do to those that be lame or cripple.]"}],"8":[{"catchword":null,"tekst":"As he that bindeth a (precious) stone [The Hebrew word is likewise taken for a precious stone, Exo 31:5. see the annot] in a sling: [Oth. He that bindeth a (precious) stone in an heap of stones] so is he, that giveth honour to a fool. [that is, dignity, offices, riches, which the fools cannot use aright, but letteth them perish. Hebr. As to bind a precious stone, or, the binding of a precious stone, &c. To wit, is very absurd and unseemly, because the precious stone being slung, cannot effect any special thing, or do any notable exploit, but is lost and gone, as soon as ever it is thrown out of the sling: so is be, etc.]"}],"9":[{"catchword":null,"tekst":"(As) a thorn entereth [Heb. Goeth up] into the hand of a drunkard; so is a proverb in the mouth of fools. [That is, as a drunkard hurteth himself, or others, when he handleth a thorn: so neither can a fool use a good proverb or sentence well.]"}],"10":[{"catchword":null,"tekst":"The great ones cause grief to every man: and hire fools, [Of fools, see above chapter 1.on verse 22.] and hire trangressors. [oth. Passengers, or, those that pass by, who ever they might be, if they be but onely bent to do as the great ones that hire them, would have them to do. Heb. The great one causeth grief to every one: and hireth a fool, and hireth trangressors. Meaning Tyrants; or Lords, and Princes, or such kind of great ones, who are so awed and reverenced by them, that they cause trouble and grief to every one. For which end they entertain fools and transgressors in their service, whereof the first cannot, and the other will not do good.]"}],"11":[{"catchword":null,"tekst":"As a dog returneth to his vomit: [To wit, to swallow it in again, having forgotten that what he had vomited up, did not well agree with him] (so) doth a fool re-assume his folly, [compare 2 Pet.2.22.]"}],"12":[{"catchword":null,"tekst":"Hast thou seen a man, that is wise in his (own) eyes? [See above on verse 5.] (there) in more expectation [to wit, of becoming wise and virtuous] of a fool, [see above chapter 1.on verse 22.] then of him. [so bel.ch.29.20.]"}],"13":[{"catchword":null,"tekst":"The slothful man saith, there is a fierce lion in the way; a lion is in the streets. [Compare above ch.22.13.]"}],"14":[{"catchword":null,"tekst":"(As) a door turneth about upon his hinge; [To wit, whereon it hangeth, and is fastened] so (doth) the slothful man upon his bed. [to wit, without coming off from it, to do the work that concerneth him.]"}],"15":[{"catchword":null,"tekst":"The slothful hideth his hand in (his) bosome; [Oth. In the dish] he is too weary, to bring it again to his mouth [see above chapter 19.24. and the annotate. Thereon.]"}],"16":[{"catchword":null,"tekst":"The sluggard is wiser in his (own) eyes, [See ab.on verse 5. Item below chapter 28.11.] then seven men) [that is, then many men. It is a certain number for an uncertain. See above chapter 6.on verse 31.] that answer (with) reason. [that is, that are able to speak rationally, or wisely, or with good understanding, and right judgement. Of the Hebrew word, see J // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  for (const n of nummers) {

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},

  const MAX_CW = 60;

    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');

function paneelInhoud(n, tab) {

    } else {

  }

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
