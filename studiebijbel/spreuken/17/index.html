chuldig blijven.","6":"De kroon van de ouderen zijn de kleinkinderen, en het sieraad van de kinderen zijn hun vaders.","7":"Een voortreffelijke lip past een dwaas niet, veel minder een vorst een leugenachtige lip.","8":"Het geschenk is in de ogen van wie het bezit een aangenaam gesteente; waarheen het zich ook wendt, het zal wel gedijen.","9":"Die de overtreding toedekt, zoekt liefde; maar die de zaak weer ophaalt, brengt scheiding tussen de beste vrienden.","10":"De bestraffing gaat dieper in de verstandige, dan de dwaas honderdmaal te slaan.","11":"Zeker, de weerspannige zoekt het kwaad; maar een wrede bode zal tegen hem gezonden worden.","12":"Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.","13":"Die kwaad voor goed vergeldt, het kwaad zal van zijn huis niet wijken.","14":"Het begin van het krakeel is als iemand die het water opening geeft; laat daarom de twist varen, voordat hij losbarst.","15":"Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.","16":"Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?","17":"Een vriend heeft te allen tijde lief; en een broeder wordt geboren voor de tijd van benauwdheid.","18":"Een mens zonder verstand slaat de hand erop, en stelt zich borg bij zijn naaste.","19":"Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.","20":"Wie verdraaid is van hart, zal het goede niet vinden; en die verkeerd is met zijn tong, zal in het kwaad vallen.","21":"Wie een dwaas voortbrengt, die zal hem tot droefheid zijn; en de vader van de dwaas zal zich niet verblijden.","22":"Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.","23":"De goddeloze neemt het geschenk uit de schoot, om de paden van het recht te buigen.","24":"In het aangezicht van de verstandige is wijsheid; maar de ogen van de dwaas zijn aan het einde van de aarde.","25":"Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.","26":"Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.","27":"Wie kennis heeft, houdt zijn woorden in; en een man van verstand is kostbaar van geest.","28":"Zelfs een dwaas, die zwijgt, wordt wijs geacht, en die zijn lippen toesluit, verstandig."},"SV":{"1":"Een droge bete, en rust daarbij, is beter, dan een huis vol van geslachte beesten met twist.","2":"Een verstandig knecht zal heersen over een zoon, die beschaamd maakt, en in het midden der broederen zal hij erfenis delen.","3":"De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE proeft de harten.","4":"De boosdoener merkt op de ongerechtige lip; een leugenaar neigt het oor tot de verkeerde tong.","5":"Die den arme bespot, smaadt deszelfs Maker; die zich verblijdt in het verderf, zal niet onschuldig zijn.","6":"De kroon de ouden zijn de kindskinderen, en der kinderen sieraad zijn hun vaderen.","7":"Een voortreffelijke lip past een dwaze niet, veelmin een prins een leugenachtige lip.","8":"Het geschenk is in de ogen zijner heren een aangenaam gesteente; waarhenen het zich zal wenden, zal het wel gedijen.","9":"Die de overtreding toedekt, zoekt liefde; maar die de zaak weder ophaalt, scheidt den voornaamsten vriend.","10":"De bestraffing gaat dieper in den verstandige, dan den zot honderdmaal te slaan.","11":"Zekerlijk, de wederspannige zoekt het kwaad; maar een wrede bode zal tegen hem gezonden worden.","12":"Dat een beer, die van jongen beroofd is, een man tegemoet kome, maar niet een zot in zijn dwaasheid.","13":"Die kwaad voor goed vergeldt, het kwaad zal van zijn huis niet wijken .","14":"Het begin des krakeels is *gelijk* een, die het water opening geeft; daarom verlaat den twist, eer hij zich vermengt.","15":"Wie den goddeloze rechtvaardigt, en den rechtvaardige verdoemt, zijn den HEERE een gruwel, ja, die beiden.","16":"Waarom toch zou in de hand des zots het koopgeld zijn, om wijsheid te kopen, dewijl hij geen verstand heeft?","17":"Een vriend heeft te aller tijd lief; en een broeder wordt in de benauwdheid geboren.","18":"Een verstandeloos mens klapt in de hand, zich borg stellende bij zijn naaste.","19":"Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt verbreking.","20":"Wie verdraaid is van hart, zal het goede niet vinden; en die verkeerd is met zijn tong, zal in het kwaad vallen.","21":"Wie een zot genereert, *die* zal hem tot droefheid zijn; en de vader des dwazen zal zich niet verblijden.","22":"Een blij hart zal een medicijn goed maken; maar een verslagen geest zal het gebeente verdrogen.","23":"De goddeloze zal het geschenk uit den schoot nemen, om de paden des rechts te buigen.","24":"In het aangezicht des verstandigen is wijsheid; maar de ogen des zots zijn in het einde der aarde.","25":"Een zotte zoon is een verdriet voor zijn vader, en bittere droefheid voor degene, die hem gebaard heeft.","26":"Het is niet goed, den rechtvaardige ook te doen boeten, dat de prinsen *iemand* slaan zouden om hetgeen recht is.","27":"Wie wetenschap weet, houdt zijn woorden in; *en* een man van verstand is kostelijk van geest.","28":"Een dwaas zelfs, die zwijgt, zal wijs geacht worden, *en* die zijn lippen toesluit, verstandig."},"KJV":{"1":"Better *is* a dry morsel, and quietness therewith, than an house full of sacrifices *with* strife.","2":"A wise servant shall have rule over a son that causeth shame, and shall have part of the inheritance among the brethren.","3":"The fining pot *is* for silver, and the furnace for gold: but the LORD trieth the hearts.","4":"A wicked doer giveth heed to false lips; *and* a liar giveth ear to a naughty tongue.","5":"Whoso mocketh the poor reproacheth his Maker: *and* he that is glad at calamities shall not be unpunished.","6":"Children's children *are* the crown of old men; and the glory of children *are* their fathers.","7":"Excellent speech becometh not a fool: much less do lying lips a prince.","8":"A gift *is as* a precious stone in the eyes of him that hath it: whithersoever it turneth, it prospereth.","9":"He that covereth a transgression seeketh love; but he that repeateth a matter separateth *very* friends.","10":"A reproof entereth more into a wise man than an hundred stripes into a fool.","11":"An evil *man* seeketh only rebellion: therefore a cruel messenger shall be sent","12":"Let a bear robbed of her whelps meet a man, rather than a fool in his folly.","13":"Whoso rewardeth evil for good, evil shall not depart from his house.","14":"The beginning of strife *is as* when one letteth out water: therefore leave off contention, before it be meddled","15":"He that justifieth the wicked, and he that condemneth the just, even they both *are* abomination to the LORD.","16":"Wherefore *is there* a price in the hand of a fool to get wisdom, seeing *he hath* no heart","17":"A friend loveth at all times, and a brother is born for adversity.","18":"A man void of understanding striketh hands, *and* becometh surety in the presence of his friend.","19":"He loveth transgression that loveth strife: *and* he that exalteth his gate seeketh destruction.","20":"He that hath a froward heart findeth no good: and he that hath a perverse tongue falleth into mischief.","21":"He that begetteth a fool *doeth it* to his sorrow: and the father of a fool hath no joy.","22":"A merry heart doeth good *like* a medicine: but a broken spirit drieth the bones.","23":"A wicked *man* taketh a gift out of the bosom to pervert the ways of judgment.","24":"Wisdom *is* before him that hath understanding; but the eyes of a fool *are* in the ends of the earth.","25":"A foolish son *is* a grief to his father, and bitterness to her that bare","26":"Also to punish the just *is* not good, *nor* to strike princes for equity.","27":"He that hath knowledge spareth his words: *and* jv\" data-code=\"H2896\">good:</span> and he that hath a <span class=\"wl wl-kjv\" data-code=\"H2015\">perverse</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> into mischief.","21":"He that <span class=\"wl wl-kjv\" data-code=\"H3205\">begetteth</span> a <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> doeth it to his <span class=\"wl wl-kjv\" data-code=\"H8424\">sorrow:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of a <span class=\"wl wl-kjv\" data-code=\"H5036\">fool</span> hath no joy.","22":"A <span class=\"wl wl-kjv\" data-code=\"H8056\">merry</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> doeth <span class=\"wl wl-kjv\" data-code=\"H3190\">good</span> like a <span class=\"wl wl-kjv\" data-code=\"H1456\">medicine:</span> but a <span class=\"wl wl-kjv\" data-code=\"H5218\">broken</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H3001\">drieth</span> the bones.","23":"A <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> man <span class=\"wl wl-kjv\" data-code=\"H3947\">taketh</span> a <span class=\"wl wl-kjv\" data-code=\"H7810\">gift</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom</span> to <span class=\"wl wl-kjv\" data-code=\"H5186\">pervert</span> the <span class=\"wl wl-kjv\" data-code=\"H734\">ways</span> of judgment.","24":"<span class=\"wl wl-kjv\" data-code=\"H2451\">Wisdom</span> is before him that hath <span class=\"wl wl-kjv\" data-code=\"H6440\">understanding;</span> but the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of a <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> are in the <span class=\"wl wl-kjv\" data-code=\"H7097\">ends</span> of the earth.","25":"A <span class=\"wl wl-kjv\" data-code=\"H3684\">foolish</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> is a <span class=\"wl wl-kjv\" data-code=\"H3708\">grief</span> to his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H4470\">bitterness</span> to her that bare","26":"Also to <span class=\"wl wl-kjv\" data-code=\"H6064\">punish</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> is not <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> nor to <span class=\"wl wl-kjv\" data-code=\"H5221\">strike</span> <span class=\"wl wl-kjv\" data-code=\"H5081\">princes</span> for equity.","27":"He that <span class=\"wl wl-kjv\" data-code=\"H3045\">hath</span> <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> <span class=\"wl wl-kjv\" data-code=\"H2820\">spareth</span> his <span class=\"wl wl-kjv\" data-code=\"H561\">words:</span> and a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> is of an <span class=\"wl wl-kjv\" data-code=\"H3368\">excellent</span> spirit.","28":"Even a <span class=\"wl wl-kjv\" data-code=\"H191\">fool,</span> when he holdeth his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> is <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> <span class=\"wl wl-kjv\" data-code=\"H2450\">wise:</span> and he that <span class=\"wl wl-kjv\" data-code=\"H331\">shutteth</span> his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> is esteemed a man of understanding."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"geslachte","tekst":"Hebreeuws, slachting. Het Hebreeuwse woord betekent wel meest beesten, die ter offerande geslacht worden, maar het betekent ook die ter spijs en ter maaltijd bereid zijn; gelijk hier en Gen 31:54 . Zie de aantekening aldaar."},{"catchword":"met twist","tekst":"Hebreeuws, van den twist; dat is waar twist bij is."}],"2":[{"catchword":"die beschaamd","tekst":"Vergelijk boven Pro 10:5 ."},{"catchword":"in het midden","tekst":"De zin is dat hij onder de broeders van den beschaamden zoon ook een deel van het erfdeel wegdragen zal. Anderen verstaan dat hij als gouverneur zal zijn van de kinderen en van zulk aanzien, dat hem ook het beleid hunner goederen, en vervolgens het bedelen hunner erfenissen, zal toevertrouwd worden."}],"3":[{"catchword":"smeltkroes","tekst":"Versta, een vat, waarin het zilver gesmolten en gezuiverd wordt; alzo onder Pro 27:21 ."},{"catchword":"oven","tekst":"Te weten, waarin zilver, tin, koper, enz., gesmolten en gezuiverd wordt. Zie Eze 22:18-20 , enz."},{"catchword":"de HEERE","tekst":"Versta, de Heere alleen. De mensen kunnen wel, door hun kunst, goud en zilver beproeven om te weten of het goed of kwaad is, maar het hart van den mens kan niemand doorgronden dan God."}],"4":[{"catchword":"boosdoener","tekst":"Dat is, die zijnen naaste kwaaddoet of genegen is kwaad te doen."},{"catchword":"op de ongerechtige","tekst":"Hebreeuws, lip der ongerechtigheid; te weten, die te kennen geeft hoe men ongerechtigheid bedrijven en zijnen naaste leed kan doen."},{"catchword":"leugenaar","tekst":"Hebreeuws, valsheid of leugen; dat is die met valsheid of leugen omgaat. Zie Job 35:13 ."},{"catchword":"verkeerde tong","tekst":"Hebreeuws, de tong der verkeerdheden; dat is die verkeerdheden spreekt. Zie boven Pro 2:12 . Anders: horende de leugens op de verkeerde tong."}],"5":[{"catchword":"bespot,","tekst":"Te weten, met gebaren, woorden of daden. Vergelijk boven Pro 14:31 ."},{"catchword":"smaadt","tekst":"Dat is, onteert God, die den arme niet alleen geschapen heeft, maar ook door de armoede bezoekt en oefent."},{"catchword":"verderf,","tekst":"Te weten, zijns naasten. Zie onder Pro 24:17 ."},{"catchword":"onschuldig zijn","tekst":"Dat is, ongestraft blijven. Zie 1Ki 2:9 ."}],"6":[{"catchword":"kroon","tekst":"Dat is, sieraad. Zie boven Pro 12:4 ."},{"catchword":"kindskinderen,","tekst":"Te weten, die wijs en vroom zijn; in welken de ouden genieten Gods zegen, van welken zie Psa 127:3 , en Psa 128:3 ."},{"catchword":"zijn hun vaderen","tekst":"Want het is heerlijk uit eerlijke ouders te zijn."}],"7":[{"catchword":"voortreffelijke","tekst":"Hebreeuws, een lip der voortreffelijkheid, of uitnemendheid; dat is een voortreffelijke rede, handelende van uitnemende dingen, als van wijsheid en deugdzaamheid. Alzo is in het volgende, Hebreeuws, een lip der valsheid, een valse rede."},{"catchword":"dwaas","tekst":"Dat is, een kwaden zot, die van alle wijsheid, eer en deugd vervallen is. Zie 1Sa 25:25 ."}],"8":[{"catchword":"heren","tekst":"Dat is, die genegen zijn dat te ontvangen, of die het alrede ontvangen hebben en nu bezitten. Zie van dit woord Gen 14:13 ."},{"catchword":"een aangenaam","tekst":"Hebreeuws, gesteente der aangenaamheid; dat is, als een aangenaam edelgesteente, of als parelen, welke om hare schoonheid en kostelijkheid zeer lieftallig plegen te zijn."},{"catchword":"het zich","tekst":"Te weten, het geschenk door het beleid en aanbieden des schenkers. Anders: waarheen hij, te weten de schenker of eigenaar, zich zal wenden, zal hij voorspoed hebben."},{"catchword":"zal het wel","tekst":"Dat is, het zal wat uitrichten bij dengene, die het ontvangt, tot voordeel desgenen, die het geeft. Salomo spreekt niet van hetgeen men doen moet, maar van hetgeen pleegt te geschieden."}],"9":[{"catchword":"overtreding","tekst":"Te weten, die tegen hem door zijnen naaste begaan is. Vergelijk boven Pro 10:12 ."},{"catchword":"toedekt,","tekst":"Te wetne, door die te vergeten en te vergeven."},{"catchword":"zoekt liefde;","tekst":"Dat is, poogt de liefde, door welke hij van zijnen vriend bemind wordt, te voeden en te onderhouden."},{"catchword":"zaak","tekst":"Of, het woord, te weten der overtreding."},{"catchword":"den voornaamsten","tekst":"Zie boven Pro 16:28 ."}],"10":[{"catchword":"te slaan","tekst":"Te weten om hem tot verbetering te brengen."}],"11":[{"catchword":"Zekerlijk,","tekst":"Of, de wederspannige zoekt alleenlijk het kwaad; Hebreeuws, de wederspannigheid; dat is, die zeer wederspannig is. Zie Job 35:13 . Alzo boven vs.4, valsheid voor valsaard. Versta, degenen, die wederspannig is tegen God en die over hem gesteld zijn. Anders: de kwade zoekt alleen, of zekerlijk, wederspannigheid."},{"catchword":"kwaad;","tekst":"Te weten dat hij zijnen naaste aandoet en voornamelijk den vrome."},{"catchword":"wrede","tekst":"Te weten, de Satan, of enige zware plaag, die God als zijne scherprechters gebruikt."},{"catchword":"gezonden","tekst":"Namelijk van God."}],"12":[{"catchword":"Dat een beer,","tekst":"De zin is, dat het minder gevaar is een beer te ontmoeten in zijn woedende wreedheid dan een zot, enz."},{"catchword":"in zijn dwaasheid","tekst":"Dat is, als hij door zijne dwaasheid tot alle onredelijke en razende driften gedreven wordt."}],"13":[{"catchword":"kwaad zal","tekst":"Te weten, der straf. Zie Gen 19:19 ."},{"catchword":"huis","tekst":"Dat is van zijn huisgezin. Zie Gen 7:1 . Of van zijn geslacht en nakomelingen; te weten, die zijne zonden navolgen. Zie 1Ki 14:10 ."}],"14":[{"catchword":"Het begin","tekst":"Dat is die het krakeel of geschil begint."},{"catchword":"die het water","tekst":"Dat is die het water inlaat, door de sluis te openen of den dam te breken, waarmede het wederhouden wordt. Want deze opening en breuk blijvende, is er geen houden aan den loop des waters; ja deszelfs doorgang wordt hoe langer zo ruimer."},{"catchword":"hij zich","tekst":"Te weten, de twist."},{"catchword":"vermengt","tekst":"Of, vermengd worde; te weten, onder velen, die daarin getrokken en mede gemoeid worden. Of eer gij u daarin mengt."}],"15":[{"catchword":"rechtvaardigt,","tekst":"Dat is, vrijspreekt en rechtvaardig verklaart. Zie Gen 44:16 , en Deu 25:1 ."},{"catchword":"verdoemt,","tekst":"Dat is, onrechtvaardig, schuldig en strafwaardig verklaart; zie Deu 25:1 ."},{"catchword":"ja,","tekst":"Dat is, de een zowel als de ander, beiden geleidelijk. Zie dezelfde manier van spreken onder Pro 20:10 , Pro 20:12 ."}],"16":[{"catchword":"het koopgeld","tekst":"Dat is, de rijkdom en middelen om kunsten en wetenschappen te leren."},{"catchword":"te kopen,","tekst":"Te weten, gelijk andere dingen, die voor geld of waar altijd kunnen gekregen worden; even alsof de wijsheid en geleerdheid in alle manieren ook zodanig waren, en van een ieder, zelfs van de zotten, ook alzo te verkrijgen waren."},{"catchword":"verstand","tekst":"Hebreeuws, hart; dat is verstand. Zie Job 9:4 . Hij spreekt van het verstand, waardoor men bekwaam is om de wijsheid ernstig te begeren, grondig te begrijpen en stichtelijk te gebruiken."}],"17":[{"catchword":"Een vriend","tekst":"Te weten, die een oprecht vriend is, dat is die weldadigheid en trouw aan zijnen vriend doet, Gen 24:49 , en die waarheid en vrede liefheeft; Zec 8:19 ."},{"catchword":"te aller tijd","tekst":"Niet alleen in voorspoed, maar ook in tegenspoed."},{"catchword":"een broeder","tekst":"Dat is, die ware broederlijke liefde bewijst om zijnen vriend uit den nood te helpen, of immers daarin enige verlichting hem naar zijn vermogen toe te brengen."},{"catchword":"geboren","tekst":"Dat is, door Gods voorzienigheid toegeschikt en tevoorschijn gebracht, alzo dat in de benauwdheid geopenbaard wordt wie een rechte broeder is. Anders: een broeder is tegen de benauwdheid geboren; te weten, om in dezelfde bij te staan, of en hij [te weten, een vriend] wordt een broeder in de benauwdheid geboren."}],"18":[{"catchword":"klapt","tekst":"Zie boven Pro 6:1 ."},{"catchword":"zich borg","tekst":"Of, borgtocht belovende."},{"catchword":"bij zijn","tekst":"Hebreeuws, voor het aangezicht; dat is, in de tegenwoordigheid; anders: voor."},{"catchword":"naaste","tekst":"Versta, den schuldheer, tot wiens verzekering de borg zich tot de betaling verbindt. Anderen verstaan den schuldenaar, voor wien de borgtocht geschiedt."}],"19":[{"catchword":"Die het gekijf","tekst":"De reden is, omdat de kijving een oorsprong is van vele zonden, die de twistgierige met zijn doen schijnt lief te hebben."},{"catchword":"zijn deur","tekst":"Te weten, de deur van zijn gebouw, die hij hoog opgetrokken heeft. Het is te verstaan als een algemeen spreekwoord van degenen, die zich boven hun staat uitsteken. Want gelijk een huis zeer hoog opgebouwd zijnde, dikwijls den val onderworpen is, alzo zal een mens, die zich verheft boven zijn staat en zijnen naaste veracht, dien hij door twisten zoekt te verdrukken, zeer dikwijls tot een schrikkelijken val komen."},{"catchword":"zoekt","tekst":"Zie boven Pro 8:36 ."},{"catchword":"verbreking","tekst":"Dat is, schade en verderf. Alzo boven Pro 16:18 ."}],"20":[{"catchword":"verdraaid","tekst":"Of, verkeerd. Zie boven Pro 6:14 ."},{"catchword":"het goede","tekst":"Vergelijk boven Pro 16:20 en de aantekening."},{"catchword":"verkeerd","tekst":"Zie boven Pro 2:12 ."}],"21":[{"catchword":"een zot","tekst":"Dat is, die een zot mettertijd worden zal."},{"catchword":"dwazen","tekst":"Zie van dit woord boven vs.7."}],"22":[{"catchword":"goed maken;","tekst":"Dat is, krachtig, dat zij het lichaam deugd doet. Vergelijk de manier van spreken met Pro 15:2 . Anders: zal goeddoen [als] een medicijn; te weten, het lichaam, om dat in goede gezondheid te onderhouden. Of, maakt goede medicijn; te weten die het lichaam doet welvaren."},{"catchword":"gebeente","tekst":"Dat is, de inwendigste leden en de krachten van het lichaam. Zie Job 7:15 ."}],"23":[{"catchword":"den schoot","tekst":"Te weten desgenen, die het aanbiedt; dat is, zal het heimelijk en in het verborgen nemen; want niemand is gaarne bekend voor een, die het recht buigt. Vergelijk boven Pro 16:33 ."},{"catchword":"om","tekst":"Vergelijk onder Pro 18:5 , en Pro 21:14 ; Isa 10:2 ; Amo 5:12 ."},{"catchword":"de paden","tekst":"Dat is, de rechte manier van doen, die in het gericht moet gevolgd worden, te verkeren. Vergelijk Exo 23:2 ."}],"24":[{"catchword":"In het aangezicht","tekst":"Dat is, de wijsheid ziet den verstandige als de ogen uit; te weten, als men acht neemt op de gestadigheid zijner ogen, de manierlijkheid van zijn wezen en schaamachtigheid van zijn gelaat. Anderen verstaan dit alzo, dat de wijsheid den verstandigen altijd bij de hand is en niet ver te zoeken; of dat zij die altijd voor ogen hebben om zich naar die te voegen; Ecc 2:14 ."},{"catchword":"de ogen","tekst":"Dat is, het gezicht van den zot zweeft en dwaalt herwaarts en derwaarts naar alle hoeken. De vliegende ogen zijn een teken van de ijdelheid en ongestadigheid van het gemoed. Anders: de zot ziet overal om wijsheid te vinden, maar tevergeefs, boven Pro 14:6 ."}],"25":[{"catchword":"bittere","tekst":"Hebreeuws, bitterheid; dat is, een oorzaak der droefheid, die hun hart zeer bitter smaakt. Zie 2Ki 4:27 ."}],"26":[{"catchword":"niet goed,","tekst":"Dat is, zeer kwaad, onbehoorlijk en niet deugende, alzo onder Pro 18:5 ; idem Pro 19:2 , en Pro 20:23 ; alzo niet kwaad wordt gezegd voor hetgeen goed is; onder Pro 31:12 ."},{"catchword":"rechtvaardige","tekst":"Dat is, die geen schuld heeft."},{"catchword":"ook te doen boeten,","tekst":"Dat is, niet alleen de bozen, maar ook de vromen; of: het is niet goed den rechtvaardigen boete op te leggen, veel minder ten onrechte aan het lijf te straffen."},{"catchword":"om hetgeen","tekst":"Of, boven, of tegen het recht."}],"27":[{"catchword":"wetenschap","tekst":"Dat is, goed en vast verstand heeft."},{"catchword":"kostelijk","tekst":"Dat is, dierbaar en spaarzaam van gemoed, niet lichtvaardig en onbedacht uitstrooiende al hetgeen hij weet en in of op zijn hart heeft. Anders: is koel van geest, of koelzinnig; dat is, vrij van driften of beroeringen en traag in het spreken. Zie van het woord geest in dezen zin genomen 2Ki 19:7 , en onder Pro 29:11 ; zie de aantekening."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Better is a day morse, and quietness therewith, then an house full of slain beasts, [Hebr. Slaughter. The Hebrew word for the most part signifieth beasts, that are killed for sacrifice, but it signifieth also those that are made ready for food, and for a banquet, or feast, as here, and Gen 31:54. See the annot. There] with strife. [Hebr. Of strife: that is, where there is strife withal. Comp.above chap.15.17.]"}],"2":[{"catchword":null,"tekst":"An understanding servant shall have rule over a son, that maketh ashamed: [Compare above chap.10.on verse 5.] and he shall divide the inheritance in the midst of the brethren. [the meaning is, that he shall also carry away a part of the inheritance among the brethren of the son, as that he shall be entrusted with, that causeth shame. Others understand he shall be as it were Governor or Guardian of the children, and shall be in such respect among them, as that he shall be entrusted with the disposing of their means and estate, and consequently with the dividing of their inheritances.]"}],"3":[{"catchword":null,"tekst":"The fining-pot is for silver [By the fining-pot here, is meant a vessel, wherein silver is melted, and refined. So below chapter 27.21.] and the furnace [to wit, wherein, silver, tin, copper, &c. Is melted, and refined. See Eze 22:18,19,20,&c.] for gold: but the LORD trieth the hearts. [meaning, the LORD alone. Men may indeed by their art silver, and gold, to know whether it be good or bad: but none can search into the heart of man, save God alone. Compare Jer 17:10.]"}],"4":[{"catchword":null,"tekst":"The wicked doer [That is, he that doth evil to his neighbour, or is prone to do evil] giveth heed to the unrighteous lip: [Hebr. Lip of unrighteousness: to wit, which sheweth, how a man may commit iniquity, or unrighteousness, and hurt his neighbour] a liar [Heb. Falsehood, or lying: See Job 35. On verse 13.] inclineth (his) ear to the perverse tongue. [Hebr. Tongue of perversenesses: that is, that speaketh perverse things. See above chap.2.on verse 12. Oth. Hearing lying in the perverse tongue.]"}],"5":[{"catchword":null,"tekst":"He that mocketh the poor [To wit, either in gesture, word, or deed. Compare above chapter 14.31.] reproacheth his Maker: [that is, disho // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
