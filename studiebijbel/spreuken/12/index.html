lozen zijn bedrog.","6":"De woorden van de goddelozen zijn om op bloed te loeren; maar de mond van de oprechten zal ze redden.","7":"De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.","8":"Ieder zal geprezen worden, naarmate zijn verstandigheid is; maar wie verkeerd van hart is, zal tot verachting wezen.","9":"Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.","10":"De rechtvaardige kent het leven van zijn dier; maar de barmhartigheden van de goddelozen zijn wreed.","11":"Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.","12":"De goddeloze begeert het net van de bozen; maar de wortel van de rechtvaardigen zal vrucht dragen.","13":"In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.","14":"Ieder wordt van de vrucht van de mond met goed verzadigd; en de vergelding van de handen van de mens zal Hij hem terugbrengen.","15":"De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.","16":"De toorn van de dwaas wordt op diezelfde dag bekend; maar wie schrander is, bedekt de schande.","17":"Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens *maakt* bedrog *bekend*.","18":"Er is een die woorden als steken van een zwaard onbedacht uitspreekt; maar de tong van de wijzen is medicijn.","19":"Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.","20":"Bedrog is in het hart van hen die kwaad smeden; maar zij die vrede raden, hebben blijdschap.","21":"De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.","22":"Valse lippen zijn de HEERE een gruwel; maar wie trouw handelen, zijn Zijn welgevallen.","23":"Een schrander mens bedekt de wetenschap; maar het hart van de zotten roept dwaasheid uit.","24":"De hand van de vlijtigen zal heersen; maar de bedriegers zullen onder cijns wezen.","25":"Bekommernis in het hart van de mens buigt het neer; maar een goed woord verblijdt het.","26":"De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.","27":"Een bedrieger zal zijn jachtbuit niet braden; maar het kostelijke goed van de mens is voor de vlijtige.","28":"In het pad van de gerechtigheid is het leven; en op de weg van haar voetpad is de dood niet."},"SV":{"1":"Wie de tucht liefheeft, die heeft de wetenschap lief; maar wie de bestraffing haat, is onvernuftig.","2":"De goede zal een welgevallen trekken van den HEERE; maar een man van schandelijke verdichtselen zal Hij verdoemen.","3":"De mens zal niet bevestigd worden door goddeloosheid; maar de wortel der rechtvaardigen zal niet bewogen worden.","4":"Een kloeke huisvrouw is een kroon haars heren; maar die beschaamt maakt, is als verrotting in zijn beenderen.","5":"Der rechtvaardigen gedachten zijn recht; der goddelozen raadslagen zijn bedrog.","6":"De woorden der goddelozen zijn om op bloed te loeren; maar de mond der oprechten zal ze redden.","7":"De goddelozen worden omgekeerd, dat zij niet *meer* zijn; maar het huis der rechtvaardigen zal bestaan.","8":"Een ieder zal geprezen worden, naardat zijn verstandigheid is; maar die verkeerd van hart is, zal tot verachting wezen.","9":"Beter is, die zich gering acht, en een knecht heeft, dan die zichzelven eert, en des broods gebrek heeft.","10":"De rechtvaardige kent het leven van zijn beest; maar de barmhartigheden der goddelozen zijn wreed.","11":"Die zijn land bouwt, zal van brood verzadigd worden; maar die ijdele *mensen* volgt, is verstandeloos.","12":"De goddeloze begeert het net der bozen; maar de wortel der rechtvaardigen zal uitgeven.","13":"In de overtreding der lippen is de strik des bozen; maar de rechtvaardige zal uit de benauwdheid uitkomen.","14":"Een ieder wordt van de vrucht des monds met goed verzadigd; en de vergelding van des mensen handen zal hij tot zich wederbrengen .","15":"De weg des dwazen is recht in zijn ogen; maar die naar raad hoort, is wijs.","16":"De toorn des dwazen wordt ten zelven dage bekend; maar die kloekzinnig is, bedekt de schande.","17":"Die waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige der valsheden, bedrog.","18":"Daar is een, die *woorden* als steken van een zwaard onbedachtelijk uitspreekt; maar de tong der wijzen is medicijn.","19":"Een waarachtige lip zal bevestigd worden in eeuwigheid; maar een valse tong is *maar* voor een ogenblik.","20":"Bedrog is in het hart dergenen, die kwaad smeden; maar degenen die vrede raden, hebben blijdschap.","21":"Den rechtvaardigen zal geen leed wedervaren; maar de goddelozen zullen met kwaad vervuld worden.","22":"Valse lippen zijn den HEERE een gruwel; maar die trouwelijk handelen, zijn Zijn welgevallen.","23":"Een kloekzinnig mens bedekt de wetenschap; maar het hart der zotten roept dwaasheid uit.","24":"De hand der vlijtigen zal heersen; maar de bedriegers zullen onder cijns wezen.","25":"Bekommernis in het hart des mensen buigt het neder; maar een goed woord verblijdt het.","26":"De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg der goddelozen doet hen dwalen.","27":"Een bedrieger zal zijn jachtvang niet braden; maar het kostelijk goed des mensen is des vlijtigen.","28":"In het pad der gerechtigheid is het leven; en *in* den weg *van* *haar* voetpad is de dood niet."},"KJV":{"1":"Whoso loveth instruction loveth knowledge: but he that hateth reproof *is* brutish.","2":"A good *man* obtaineth favour of the LORD: but a man of wicked devices will he condemn.","3":"A man shall not be established by wickedness: but the root of the righteous shall not be moved.","4":"A virtuous woman *is* a crown to her husband: but she that maketh ashamed *is* as rottenness in his bones.","5":"The thoughts of the righteous *are* right: *but* the counsels of the wicked *are* deceit.","6":"The words of the wicked *are* to lie in wait for blood: but the mouth of the upright shall deliver","7":"The wicked are overthrown, and *are* not: but the house of the righteous shall stand.","8":"A man shall be commended according to his wisdom: but he that is of a perverse heart shall be despised.","9":"*He that is* despised, and hath a servant, *is* better than he that honoureth himself, and lacketh bread.","10":"A righteous *man* regardeth the life of his beast: but the tender mercies of the wicked *are* cruel.","11":"He that tilleth his land shall be satisfied with bread: but he that followeth vain *persons is* void of understanding.","12":"The wicked desireth the net of evil *men*: but the root of the righteous yieldeth","13":"The wicked is snared by the transgression of *his* lips: but the just shall come out of trouble.","14":"A man shall be satisfied with good by the fruit of *his* mouth: and the recompence of a man's hands shall be rendered","15":"The way of a fool *is* right in his own eyes: but he that hearkeneth unto counsel *is* wise.","16":"A fool's wrath is presently known: but a prudent *man* covereth shame.","17":"*He that* speaketh truth sheweth forth righteousness: but a false witness deceit.","18":"There is that speaketh like the piercings of a sword: but the tongue of the wise *is* health.","19":"The lip of truth shall be established for ever: but a lying tongue *is* but for a moment.","20":"Deceit *is* in the heart of them that imagine evil: but to the counsellors of peace *is* joy.","21":"There shall no evil happen to the just: but the wicked shall be filled with mischief.","22":"Lying lips *are* abomination to the LORD: but they that deal truly *are* his delight.","23":"A prudent man concealeth knowledge: but the heart of fools proclaimeth foolishness.","24":"The hand of the diligent shall bear rule: but the slothful shall be under tribute.","25":"Heaviness in the heart of man maketh it stoop: but a good word maketh it glad.","26":"The righteous *is* mor aar de wortel","tekst":"De zin is, dat de vromen vast en onbeweeglijk blijven in hunnen stand, gelijk een boom, welks wortel zich diep en wijd uitspreidt en wel bevochtigd is; Psa 1:3 ; idem vergelijk Psa 15:5 , en Jer 17:8 ."}],"4":[{"catchword":"kloeke","tekst":"Dat is, verstandige, deugdzame en wel huishoudende. Hebreeuws, ene vrouw der kloekheid. Zie van het Hebreeuwse woord Gen 47:6 ."},{"catchword":"kroon","tekst":"Dat is, sieraad en heerlijkheid. Zie van het woord kroon in dezen zin genomen, Job 19:9 ."},{"catchword":"heren;","tekst":"Dat is, mans. Alzo Exo 21:3 ; Joe 1:8 ."},{"catchword":"die beschaamt","tekst":"Te weten, zichzelve en haren man, door hare onverstandigheid, ongeschikte manieren en achteloze huishouding. Vergelijk boven Pro 10:5 ."},{"catchword":"is als verrotting","tekst":"Dat is, ene kwelling in het binnenste zijner ziel en tering in het binnenste zijns lichaams, omdat hij zijne schande altijd voor ogen ziet. Zie dezelfde gelijkenis onder Pro 14:30 ; Hab 3:16 , en dergelijke; Psa 42:11 ; idem het tegendeel, Psa 51:10 ."}],"5":[{"catchword":"recht;","tekst":"Dat is, zijn naar den eis des rechts wel bedacht. Vergelijk Num 27:11 , en de aantekening."},{"catchword":"raadslagen","tekst":"Dit woord is hier in het kwade genomen voor listige vonden en spitsvondige bedenkingen om schade te doen. Elders is het in het goede genomen. Zie van hetzelve Job 37:12 ."}],"6":[{"catchword":"om op bloed","tekst":"Zie 1Sa 22:9-10 ; Psa 52:5-6 ."},{"catchword":"zal ze redden","tekst":"Te weten degenen, op wier bloed de goddelozen loeren. Zie exempelen 1Sa 19:4 ; Est 7:2-3 ."}],"7":[{"catchword":"goddelozen","tekst":"Hebreeuws, de goddelozen keren om; dat is worden omgekeerd, dat is uitgeroeid."},{"catchword":"niet meer","tekst":"Dat is dat zij van deze wereld weggenomen worden. Zie Gen 42:13 , en de aantekenng, idem Psa 39:14 , en Psa 103:16 ; Jer 31:15 ; Mat 2:18 ; vergelijk ook Gen 5:24 ."},{"catchword":"huis","tekst":"Dat is, staat, rijkdom, woonplaats en nakomelingen; alzo 2Sa 7:29 ; Job 8:15 ; Psa 49:17 , onder Pro 14:11 ."}],"8":[{"catchword":"geprezen","tekst":"Te weten, van de wijzen en rechtoordelenden."},{"catchword":"naardat","tekst":"Dat is, naardat hij met woorden en werken bewijst dat hij verstand heeft, strekkende tot de ware godvruchtigheid."},{"catchword":"verkeerd","tekst":"Zie boven Pro 11:20 ."}],"9":[{"catchword":"gering","tekst":"Anders: die gering geacht wordt. Maar men kan uit de tegenstellingen verstaan dat hier gesproken wordt van dengene, die zichzelven voor klein en gering houdt."},{"catchword":"een knecht","tekst":"Dat is, zoveel heeft, dat hij zich mag laten dienen. Anders: die zichzelven een knecht is. Dat is, zichzelven dient."},{"catchword":"zichzelven","tekst":"Te weten, roemende dat hij een groot meester is en zeer veel goeds heeft."}],"10":[{"catchword":"kent","tekst":"Dat is, draagt zorg voor het leven zijner beesten. Te weten, om die hunne behoeften te geven. Het woord kennen is voor zorgen en toezien dikwijls genomen. Zie Gen 18:19 , en Psa 1:6 ."},{"catchword":"leven","tekst":"Hebreeuws, ziel."},{"catchword":"wreed","tekst":"Hebreeuws, eens wreden; te weten, mensen, dat is, gans geen; want de wreden hebben gene barmhartigheid."}],"11":[{"catchword":"ijdele","tekst":"Dat is, lediggangers, behoeftigen, en die ledig van deugd en vreze Gods zijn. Zie Jdg 9:4 ."}],"12":[{"catchword":"net","tekst":"Versta, de schelmse praktijken en loze tukken, die de kwaden gebruiken om de vromen te bedriegen, van hun goed te beroven en te verdrukken. Anders: het net der kwade dingen, of van allerlei kwaad. Dat is, waarmede allerlei soort van onrecht bedreven wordt."},{"catchword":"de wortel","tekst":"Dat is, de godvruchtigheid, waarin de vromen vastgeworteld zijn. Vergelijk boven vs.3."},{"catchword":"zal uitgeven","tekst":"Dat is, voortzetten, uitschieten en vruchten dragen. De zin is dat ze in de vreze des Heeren trouwelijk handelende, genoeg zullen hebben. vs.12 wordt ook aldus overzet: De goddeloze begeert [wel] ene sterkte tegen alle kwaad, maar de wortel der rechtvaardigen geeft [dezelve]."}],"13":[{"catchword":"overtreding","tekst":"Te weten, die de bozen met spreken begaan tegen God en hunne naasten."},{"catchword":"strik","tekst":"Dat is het net, waarin de boze zelf gevangen wordt."},{"catchword":"benauwdheid","tekst":"Dat is, uit grote zwarigheid."},{"catchword":"uitkomen","tekst":"Te weten, door een goed en voorzichtig gebruik zijner lippen."}],"14":[{"catchword":"Een ieder","tekst":"Hebreeuws, van de vrucht des mans mond wordt hij met goed verzadigd; dat is, naardat een ieder zijne tong wel gebruikt, zal hij goed van God ontvangen."},{"catchword":"vrucht","tekst":"Versta, zijn wijze en godvruchtige redenen. Vergelijk onder Pro 13:2 , en Pro 18:20 ."},{"catchword":"goed verzadigd;","tekst":"Dat is, dat het tijdelijke en eeuwige welvaren aangaat."},{"catchword":"van des mensen","tekst":"Versta, van zijn eigen handen."},{"catchword":"zich wederbrengen","tekst":"Dat is, weder van God uit genade bekomen. Naar dat een ieder gedaan heeft zal hem ook geschieden."}],"15":[{"catchword":"De weg","tekst":"Zie Gen 6:12 ."},{"catchword":"in zijn ogen;","tekst":"Dat is, naar zijn gevoelen en oordeel. Zie Lev 13:5 , en Job 18:3 ."},{"catchword":"raad hoort,","tekst":"Te weten, die heilig en heilzaam is, zodat hij zich niet verlaat op zijn eigen verstand en goeddunken."}],"16":[{"catchword":"ten zelven","tekst":"Dat is, ten zelfden tijde en stonde, als hij toornig geworden is over het leed hem aangedaan."},{"catchword":"bekend;","tekst":"Te weten, uit zijne woorden, gebaren en daden."},{"catchword":"kloekzinnig is,","tekst":"Alzo onder vs.23. Zie van dit woord boven Pro 1:4 ."},{"catchword":"schande","tekst":"Te weten, die uit haastigen toorn voortkomt."}],"17":[{"catchword":"voortbrengt,","tekst":"Hebreeuws, blaast."},{"catchword":"gerechtigheid","tekst":"Dat is, dat recht overeenkomt met hetgeen geschied is of gesproken wordt, opdat niemand ongelijk gedaan worde."},{"catchword":"bedrog","tekst":"Dat is, niet overeenkomende met de waarheid der zaak, die geschied is, en dat om iemand daarmede listiglijk schade te doen."}],"18":[{"catchword":"woorden","tekst":"Dat is, die met lichtvaardige en kwalijk verzinde redenen hunnen naaste kwetsen aan zijn gemoed, eer, leven en welvaren, gelijk men aan het lichaam met een zwaard gekwetst wordt. Zie 1Sa 22:9-10 ; Psa 57:5 , en Psa 59:8 ."},{"catchword":"medicijn","tekst":"Dat is, als een medicijn niet alleen, die het verzwakte of gekwetste geneest, maar ook bewaart van verzwakt of gekwetst te worden. Vergelijk boven Pro 4:22 ."}],"19":[{"catchword":"Een waarachtige","tekst":"Hebreeuws, lip der waarheid; dat is die de waarheid spreekt. Alzo lip der vleiing; die vleiing spreekt, Psa 12:3 ; lippen der valsheid, die valsheid spreken; Psa 31:19 ; lippen der wetenschap, die wetenschap voortbrengen, onder Pro 14:7 ; alzo terstond in vs.19, tong der valsheid, of der leugen, voor een tong, die valsheid of leugen spreekt; idem, onder vs.22; idem, lippen der gerechtigheid, die gerechtige redenen voorstelt; onder Pro 16:13 ."},{"catchword":"bevestigd","tekst":"De waarheid [en vervolgens die dezelve spreekt] blijft staande, en is altijd vast in zichzelve, ofschoon ze tegengesproken wordt."}],"20":[{"catchword":"kwaad","tekst":"Te weten, der onenigheid en der twisting."},{"catchword":"blijdschap","tekst":"Te weten, in hun hart voor God en in hun leven bij de mensen."}],"21":[{"catchword":"leed","tekst":"Of, moeite, of verdriet; te weten, dat hem van de goddelozen alzo zou aangedaan worden, dat hij daaronder zou blijven liggen, en het zal hem alles ten goede gedijen; Rom 8:28 . Anders: gene ongerechtigheid overkomen; te weten, in welke de rechtvaardige zo zou komen te vervallen, dat hij daaruit niet weder door Gods Geest opgericht zou worden. Van het Hebreeuwse woord, zie Job 5:6 ."}],"22":[{"catchword":"Valse","tekst":"Zie boven vs.19."},{"catchword":"trouwelijk","tekst":"Hebreeuws, trouw, of waarheid doen; dat is, die in woorden en werken jegens God en hunnen naaste waarheid en trouw oprechtelijk onderhouden. Alzo Eze 18:9 ; 1Jo 1:6 ."},{"catchword":"welgevallen","tekst":"Dat is, Hem aangenaam en welgevallig. Alzo boven Pro 11:20 ."}],"23":[{"catchword":"bedekt","tekst":"Dat is, hij giet ze niet door lichtvaardige en opgeblazen praat uit, om zichzelven daarmede ten toon te stellen."},{"catchword":"dwaasheid","tekst":"Dat is, allerlei onwetendheid en dwaling, rakende het geloof en den wandel der mensen."}],"24":[{"catchword":"bedriegers","tekst":"Hebreeuws, het bedrog zal, enz., zie Job 35:13 . Versta door deze bedriegers de luie lediggangers, die, omdat zij niet arbeiden willen, door bedrog en dieverij zoeken den kost te rapen. Zie boven Pro 10:4 , en de aantekening. Idem onder vs.27."},{"catchword":"onder cijns","tekst":"Dat is, dengenen, die heersen en het gebied hebben, schatting geven. Zie dezelfde manier van spreken Jdg 1:30 , Jdg 1:35 ; Lam 1:1 ."}],"26":[{"catchword":"voortreffelijker","tekst":"Te weten, voor de ogen Gods en der vromen, die niet aanzien den uitwendigen voorspoed en de pracht dezes levens, maar het goede dat hier in de vromen begonnen wordt en hierna volbracht zal worden."},{"catchword":"naaste;","tekst":"Namelijk, die goddeloos is."},{"catchword":"weg","tekst":"Dat is het leven, bedrijf, en manier van doen."},{"catchword":"doet hen dwalen","tekst":"Te weten, hen en anderen, namelijk, door den uiterlijken schijn, die de goddelozen voordoen van gemak, weelde, wellust, rijkdom, eer en hoge staten."}],"27":[{"catchword":"Een bedrieger","tekst":"Hebreeuws, het bedrog. Zie vs.26."},{"catchword":"jachtvang","tekst":"Versta, onder deze ene soort, allerlei goed, dat met listige praktijken verkregen wordt."},{"catchword":"niet braden;","tekst":"Dat is, niet gebruiken of genieten."},{"catchword":"kostelijk","tekst":"Zo wordt het wel en deugdelijk gewonnen goed genaamd, omdat het den mens beter bijblijft en meer deugd doet dan dat door bedrog verkregen is. Anders: het goed eens naarstigen is kostelijk. Anders: het kostelijk goed des mensen is naarstigheid. Anders: het goed zal zijn des kostelijken, [dat is, vromen] [en] vlijtigen mensen. Sommigen nemen het aldus: het goed des kostelijken [dat is, vromen] mensen zal gesneden [dat is, genuttigd en gebruikt] worden."},{"catchword":"vlijtigen","tekst":"Te weten, zich onderhoudende met een oprechten geoorloofden arbeid, of handel."}],"28":[{"catchword":"In het pad","tekst":"Vergelijk boven Pro 10:16 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Whoso loveth discipline, [That is, the instruction, whereby men are instructed, for to attain unto knowledge. See above ch.1.on verse 2. Or understand the chastenings of the Lord, which are sent to a man for that very end and purpose, as Deut.11.2. Job 5:17. Psa 94:12. Jer 10:14. Compare above chap.9. the annot. On verse 7.] he loveth knowledge: [unto which a man attaineth by discipline, and instruction] but he that hateth reproof, is brutish."}],"2":[{"catchword":null,"tekst":"The good man [That is, he that is prone unto good, and practiseth it] shall draw a well-liking of the LORD; [see above ch.8.on verse 35.] but a man of wicked devises [that is, that inventeth and plotteth mischief in his heart, or doth likewise actually commit it. Compare Psalm 5.on verse 7. The Hebrew word is here taken in a bad sense; see of it, Job 21.on verse 27. Also compare below ch.14.17.] will he [namely, the Lord] condemn. [that is, pronounce him to be wicked, and worthy of punishment. See of the Hebrew word, Deut.25.on verse 1. And Job 10.on verse 2.]"}],"3":[{"catchword":null,"tekst":"The (wicked) men shall not be established [That is, shall not long enjoy his desire, he shall not prosper and flourish long. Compare above chapter 10.2. and 11.4.] by wickedness; but the root of the righteous shall not be moved. [the meaning is, that the godly continue firm and unmoveable in their condition, as a tree whose root spreadeth it self deep and wide in the ground, and is well watered, Psa 1:3. also compare Psalm 15.on verse 5. And Jer.17.verse 8.]"}],"4":[{"catchword":null,"tekst":"A prudent wife [that is, a wise, virtuous woman, and one that knoweth how to keep her house in order. Hebr. A woman of prudence, or, virtue. See of the Hebrew word, Gen.47.on verse 6.] is a crown [that is, ornament and glory: see of the word crown taken in this sense, Job 19.on verse 9.] of her Lord; [that is, husband. So Exo 21:3. Joel 1.8.] but she that maketh ashamed, is as rottenness in his bones. [that is, a grief and vexation to his soul, and a consumption to his body, because he beholdeth his shame always before his eyes. See the same comparison, below ch.14.30. Habakkuk 3.16. and the like, Psa 42:11. also contrary, Ps.51.20.]"}],"5":[{"catchword":null,"tekst":"The thoughts of the righteous are right: [That is, are well conceived, or imagined, according as equity and justice requireth. Compare Num 27:11. and the annot.] the counsels [this word is here taken in a bad sense, for crafty intentions, and cunning devices or plottings to do mischief. Elsewhere it&acirc;&euro;&trade;s taken in a good sense; see of it, Job 37.on verse 12.] of the wicked are deceit."}],"6":[{"catchword":null,"tekst":"The words of the wicked are to lie in wait for blood; [See 1 Sam.22.9,10. Ps.52.5,6. Compa.ab.ch.1.11,18. And ch.11.9.] but the mouth of the upright shall deliver them. [to wit, those for whose blood the wicked lie in wait. See examples, 1 Sam.19.4. Esth.7.2,3.]"}],"7":[{"catchword":null,"tekst":"The wicked are overturned [Hebr. The wicked over turn; that is, are overturned; that is, destroyed] (so) that they are no more: [That is, so that they are taken away from this world. See Gen 42:13. and the annot. Also Psa 39:14. and 103.16. Jer 31:15. Mat 2:18. Compare also Gen 5:24. Psa 37:36, &c.] but the house [that is, the estate, riches, habitation, and posterity. So 2 Sam.7.29. Job 8:15. Psa 49:17. blow chap.14.11.] of the righteous shall stand."}],"8":[{"catchword":null,"tekst":"Every one shall be commended [To wit, of wise men, and such as judge rightly] according as his understanding is: [that is, according as he can make it appear by words and works, that he hath wisdom and understanding tending to true piety] but he that is perverse in heart, [see above chapter 11.on verse 20.] shall be contempt."}],"9":[{"catchword":null,"tekst":"Better is he that esteemeth himself mean [Oth. That is esteemed mean: But we may plainly perceive by the opposition, that here is spoken of him, that hath a mean and low esteem of himself] and hath a servant; [that is, hath so much, as that he may cause himself to be served, and waited upon. Oth. That is a servant to himself; that is, that serveth himself, or is his own fervent] then he that honoureth himself: [to wit, bragging that he is a great rich man, and hath a great estate] and lacketh bread. [see below ch.13.7.]"}],"10":[{"catchword":null,"tekst":"The righteous man knoweth the life [Heb.soul] of his beast; [that is, a righteous man taketh care of the life of his beasts: to wit, to give them that which is needful for them. The word knowing is often taken for taking care, and looking to. See Gen.18.on verse 19. And Psalm 1.on verse 6.] but the mercies of the wicked are cruel: [Hebrew a cruel ones: that is, they are the mercies of a cruel man; that is, they are no mercies, for cruel men have no mercies, for cruel men have no mercy at all.]"}],"11":[{"catchword":null,"tekst":"He that tilleth his land, shall be satisfied with bread: [So below chapter 28.19.] but he that followeth vain (men), [that is, idle vagabonds, bare and necessitous persons, and such as are empty, and void of grace, and of the fear of God. See Judges 9.on verse 4.] is void of understanding."}],"12":[{"catchword":null,"tekst":"The wicked desireth the net of evil men: [That is, the heinous practises, and crafty devices, which evil men use to deceive the godly by to rob them of their estate, and to oppress them. Oth. The net of evil things, or, of all manner of evil; that is, whereby all manner of iniquity is committed] but the root of the righteous [that is, the piety or godliness, wherein the godly are firmly rooted and grounded. Compare above verse 3.] shall give forth. [that is, shoot out, spring forth, and bear fruit. The meaning is, that they, dealing truly and faithfully in the fear of the Lord, shall have enough. This verse is likewise thus translated: The wicked desireth (indeed) a strong hold against all evil, but the root of the righteous giveth (the same.)"}],"13":[{"catchword":null,"tekst":"In the transgression of the lips [To wit, which a wicked man in speaking committeth against God, and against his neighbour] is the snare of the wicked: [that is, the snare, wherein the wicked man himself is caught. Compare above chapter 10. Verse 14. And below chapter 18.verse 7.] but the righteous shall come out of distress. [that is, out of great trouble, and that by the wise and discreet use of his lips.]"}],"14":[{"catchword":null,"tekst":"Every one is satisfied with good [To wit, with that good, which concerneth both his temporal both his temporal and eternal welfare] by the fruit of the mouth: [meaning his wise and godly speeches. Compare below chapter 13.2. and 18.20. Hebr. By the fruit of a mans mouth is he satisfied with good; that is, according as every one shall use his tongue well, shall he receive good at the hand of God] and the recompence of a mans hands [meaning of a mans own hands] shall be recover to himself. [that is, obtain again of God out of free grace. According as every one hath done, it shall be likewise done unto him.]"}],"15":[{"catchword":null,"tekst":"The way [see Genesis 6.on verse 12.] if a fool is right in his own eyes: [that is, in his own eyes: [that is, in his own conceit, and judgement. See Lev.13.on verse 5. And Job 18.on verse 3. Compare above chapter 3.7.] but he that hearkeneth to counsel, [to wit, which is holy, and wholesome, so that he trusteth not to his own understanding, and good conceit] his wise."}],"16":[{"catchword":null,"tekst":"The fools wrath is known [To wit, by his words, gestures, and actions] the same day: [that is, at the same time and season, that he is grown angry at the hurt done to him] but he that is prudent, covereth [so below on verse 23. See of the word prudent, above chapter 1.on verse 4.] shame. [to wit, which proceedeth from sudden anger.]"}],"17":[{"catchword":null,"tekst":"He that uttereth [Hebr. Bloweth] truth, maketh righteousness known; [that is, discovereth that which doth rightly agree with that which is done or spoken, that no man may be wronged] but a witness of falsities, deceit. [that is, not agreeing with the truth of the thing that is done, and that to hurt a man craftily thereby. Compare below chap.14.5.]"}],"18":[{"catchword":null,"tekst":"There is one, that uttereth (words) indiscreetly, like the piercings of a sword: [that is, that with rash and ill advised speeches. Hurt and wound their neighbour in his mind, honour, life, and well-being, as a man is hurt and wounded in his body with a sword. See 1 Sam.22.9,10. Psa 57:5. and 59.8. below chap.16.27.] but the tongue of the wise is physic. [that is, as physic, it not onely crueth and healeth that which is weakened and hurt, but also preverseth from being weakened, or hurt. Compare above chapter 4.on verse 22.]"}],"19":[{"catchword":null,"tekst":"A true lip [Hebr. Lip of truth: that is, which speaketh truth: So lip of flattery, which speaketh flattery, Psa 12:3. lips of falsehood, which speak falsehood, Psa 31:19. lips of knowledge, which utter knowledge, below chapter 14.7. So immediately in this verse, tongue of falsehood, or of lies, is put for a tongue, which speaketh falsehood, or lies, also below verse 22. Also lips of righteousness, that is, lips that speak or utter righteous words, below chapter 16.13.] shall be established for ever: [truth (and consequently he that speaketh truth) abideth constant, and is always fixed and immoveable in it self, although it be sometimes gainsaid, or spoken against] but a false tongue is (but) for a moment."}],"20":[{"catchword":null,"tekst":"Deceit is in the heart of them that forge evil: [To wit, the evil of dissention, and strife] but those that counsel (for) peace, have joy. [to wit, in their heart in the sight of God, and in their life in the sight of men.]"}],"21":[{"catchword":null,"tekst":"(There) shall no harm [Or, trouble, or, affliction] happen to the righteous: [to wit, which should be so offered to him by the wicked, as that he should faint and lie down under it. No, but all things shall work for good unto him, Rom 8:28. Oth.no iniquity shall befall him: to wit, into which the righteous should come to fall: so, as that he should not be raised up again out of it by the spirit of God. Of the Hebrew word rendered here harm, see Job 5.on verse 6.] but the wicked shall be filled with mischief."}],"22":[{"catchword":null,"tekst":"False lips [Se above chap on verse 19.] are an abomination unto the LORD: but they that deal faithfully [Hebr. Perform faithfulness or, truth; that is, those that both in words and deeds, both towards God, and towards their neighbour, keep truth and faithfulnesssincerely and uprightly. So Eze 18:9. 1Jn 1:6.] are his delight. [that is, well-pleasing and acceptable unto him. So above chap.11.20.]"}],"23":[{"catchword":null,"tekst":"A prudent man concealeth knowledge: [That is, he poureth it not out by foolish and vaunting discourse, that he may thereby make a shew of himself. Compare ab.chapter 13.16. and 15.2.] but the heart of fools proclaimeth foolishness. [that is, all manner of ignorance, and error, concerning faith, and the life and practice of men. Compare above chap.13.16. and 15.2.]"}],"24":[{"catchword":null,"tekst":"The hand of the diligently shall bear rule; [Comp.above chap.10.4.] but the deceivers shall be under tribute. [that is, under them that bear rule, an // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
