d! Bekijk haar wegen, en word wijs;","7":"terwijl zij geen leider, opzichter of heerser heeft,","8":"bereidt zij haar brood in de zomer, verzamelt zij haar voedsel in de oogst.","9":"Hoe lang zult u, luiaard, blijven neerliggen? Wanneer zult u opstaan uit uw slaap?","10":"Een beetje slapen, een beetje sluimeren, een beetje de handen vouwen terwijl u neerligt;","11":"zo zal uw armoede over u komen als een zwerver, en uw gebrek als een gewapend man.","12":"Een nietsnut, een verdorven man, gaat om met een verkeerde mond;","13":"hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers;","14":"in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.","15":"Daarom zal zijn ondergang snel komen; plotseling zal hij verbroken worden, zonder dat er genezing is.","16":"Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:","17":"hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;","18":"een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;","19":"een vals getuige, die leugens uitblaast; en wie ruzie zaait tussen broeders.","20":"Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet.","21":"Bind ze voortdurend aan uw hart, hecht ze aan uw hals.","22":"Als u wandelt, zal dat u leiden; als u neerligt, zal het over u de wacht houden; als u wakker wordt, zal het met u spreken.","23":"Want het gebod is een lamp, en de wet is een licht, en de vermaningen van de tucht zijn de weg van het leven;","24":"om u te bewaren voor de slechte vrouw, voor het gevlei van de tong van de vreemde vrouw.","25":"Begeer haar schoonheid niet in uw hart, en laat u door haar niet vangen met haar oogleden.","26":"Want door een vrouw die een hoer is, komt men tot een stuk brood; en de huisvrouw van een andere man jaagt op het kostbare leven.","27":"Zal iemand vuur in zijn boezem nemen, zonder dat zijn kleren verbranden?","28":"Zal iemand over kolen lopen, zonder dat zijn voeten verbranden?","29":"Zo vergaat het hem die bij de vrouw van zijn naaste komt; wie haar aanraakt, zal niet onschuldig blijven.","30":"Men veracht een dief niet, als hij steelt om zijn honger te stillen, omdat hij honger heeft;","31":"maar als hij gevonden wordt, moet hij het zevenvoudig vergoeden; hij moet alle bezit van zijn huis geven.","32":"Maar wie met een vrouw overspel doet, mist verstand; hij die dat doet, richt zichzelf te gronde;","33":"plaag en schande zal hij vinden, en zijn smaad zal niet uitgewist worden.","34":"Want jaloezie is de woede van een man; en op de dag van de wraak zal hij niet sparen.","35":"Hij zal geen losgeld aanvaarden; en hij zal niet tevreden zijn, ook al maakt u het geschenk groter."},"SV":{"1":"Mijn zoon! zo gij voor uw naaste borg geworden zijt, voor een vreemde uw hand toegeklapt hebt;","2":"Gij zijt verstrikt met de redenen uws monds; gij zijt gevangen met de redenen uws monds.","3":"Doe nu dit, mijn zoon! en red u, dewijl gij in de hand uws naasten gekomen zijt; ga, onderwerp uzelven, en sterk uw naaste.","4":"Laat uw ogen geen slaap toe, noch uw oogleden sluimering;","5":"Red u, als een ree uit de hand *des* *jagers*, en als een vogel uit de hand des vogelvangers.","6":"Ga tot de mier, gij luiaard! zie haar wegen, en word wijs;","7":"Dewelke, geen overste, ambtman noch heerser hebbende,","8":"Haar brood bereidt in den zomer, haar spijs vergadert in den oogst.","9":"Hoe lang zult gij, luiaard, nederliggen? Wanneer zult gij van uw slaap opstaan?","10":"Een weinig slapens, een weinig sluimerens, een weinig handvouwens, al nederliggende;","11":"Zo zal uw armoede *u* overkomen als een wandelaar, en uw gebrek als een gewapend man.","12":"Een Belialsmens, een ondeugdzaam man gaat met verkeerdheid des monds om;","13":"Wenkt met zijn ogen, spreekt met zijn voeten, leert met zijn vingeren;","14":"In zijn hart zijn verkeerdheden, hij smeedt te aller tijd kwaad; hij werpt twisten in.","15":"Daarom zal zijn verderf haastelijk komen; hij zal schielijk verbroken worden, dat er geen genezen aan zij.","16":"Deze zes haat de HEERE; ja, zeven zijn Zijn ziel een gruwel:","17":"Hoge ogen, een valse tong, en handen, die onschuldig bloed vergieten;","18":"Een hart, dat ondeugdzame gedachten smeedt; voeten, die zich haasten, om tot kwaad te lopen;","19":"Een vals getuige, *die* leugenen blaast; en die tussen broederen krakelen inwerpt.","20":"Mijn zoon, bewaar het gebod uws vaders, en verlaat de wet uwer moeder niet.","21":"Bind ze steeds aan uw hart, hecht ze aan uw hals.","22":"Als gij wandelt, zal dat u geleiden; als gij nederligt, zal het over u de wacht houden; als gij wakker wordt, zal hetzelve *met* u spreken.","23":"Want het gebod is een lamp, en de wet is een licht, en de bestraffingen der tucht zijn de weg des levens;","24":"Om u te bewaren voor de kwade vrouw, voor het gevlei der vreemde tong.","25":"Begeer haar schoonheid niet in uw hart, en laat ze u niet vangen met haar oogleden.","26":"Want door een vrouw, *die* een hoer is, komt men tot een stuk broods; en eens mans huisvrouw jaagt de kostelijke ziel.","27":"Zal iemand vuur in zijn boezem nemen, dat zijn klederen niet verbrand worden?","28":"Zal iemand op kolen gaan, dat zijn voeten niet branden?","29":"Alzo die tot zijns naasten huisvrouw ingaat; al wie haar aanroert, zal niet onschuldig gehouden worden.","30":"Men doet een dief geen verachting aan, als hij steelt om zijn ziel te vullen, dewijl hij honger heeft;","31":"En gevonden zijnde, vergeldt hij het zevenvoudig; hij geeft al het goed van zijn huis.","32":"*Maar* die met een vrouw overspel doet, is verstandeloos; hij verderft zijn ziel, die dat doet;","33":"Plage en schande zal hij vinden, en zijn smaad zal niet uitgewist worden.","34":"Want jaloërsheid is een grimmigheid des mans; en in den dag der wraak zal hij niet verschonen.","35":"Hij zal geen verzoening aannemen; en hij zal niet bewilligen, ofschoon gij het geschenk vergroot."},"KJV":{"1":"My son, if thou be surety for thy friend, *if* thou hast stricken thy hand with a stranger,","2":"Thou art snared with the words of thy mouth, thou art taken with the words of thy mouth.","3":"Do this now, my son, and deliver thyself, when thou art come into the hand of thy friend; go, humble thyself, and make sure thy friend.","4":"Give not sleep to thine eyes, nor slumber to thine eyelids.","5":"Deliver thyself as a roe from the hand *of the hunter*, and as a bird from the hand of the fowler.","6":"Go to the ant, thou sluggard; consider her ways, and be wise:","7":"Which having no guide, overseer, or ruler,","8":"Provideth her meat in the summer, *and* gathereth her food in the harvest.","9":"How long wilt thou sleep, O sluggard? when wilt thou arise out of thy sleep?","10":"*Yet* a little sleep, a little slumber, a little folding of the hands to sleep:","11":"So shall thy poverty come as one that travelleth, and thy want as an armed man.","12":"A naughty person, a wicked man, walketh with a froward mouth.","13":"He winketh with his eyes, he speaketh with his feet, he teacheth with his fingers;","14":"Frowardness *is* in his heart, he deviseth mischief continually; he soweth discord.","15":"Therefore shall his calamity come suddenly; suddenly shall he be broken without remedy.","16":"These six *things* doth the LORD hate: yea, seven *are* an abomination unto him:","17":"A proud look, a lying tongue, and hands that shed innocent blood,","18":"An heart that deviseth wicked imaginations, feet that be swift in running to mischief,","19":"A false witness *that* speaketh lies, and he that soweth discord among brethren.","20":"My son, keep thy father's commandment, and forsake not the law of thy mother:","21":"Bind them continually upon thine heart, *and* tie them about thy neck.","22":"When thou goest, it shall lead thee; when thou sleepest, it shall keep thee; and *when* thou awakest, it shall talk","23":"For the commandment *is* a lamp; and the law *is* light; and reproofs of instruction *are* the way of life:","24":"To keep thee from the evil woman, from the flattery of the tongue of a strange woman.","25":"Lust not after her beauty in thine heart; neither let her take thee with her eyelids.","26":"For by means of a whorish woman *a man is brought* to a piece of bread: and the adulteress will hunt for the precious life.","27":"Can a man take fire in his bosom, and his clothes not be burned?","28":"Can one go upon hot coals, and his feet not be burned?","29":"So he that goeth in to his neighbour's wife; whosoever toucheth her shall not be innocent.","30":"*Men* do not despise a thief, if he steal to satisfy his soul when he is hungry;","31":"But *if* he be found, he shall restore sevenfold; he shall give all the substance of his house.","32":"*But* whoso committeth adultery with a woman lacketh understanding: he *that* doeth it destroyeth his own soul.","33":"A wound and dishonour shall he get; and his reproach shall not be wiped away.","34":"For jealousy *is* the rage of a man: therefore he will not spare in the day of vengeance.","35":"He will not regard any ransom; neither will he rest content, though thou givest many gifts."}},"tsk":{"1":[{"kopje":"als","refs":["Spr 11:15","Spr 17:18","Spr 20:16","Spr 22:26","Spr 27:13","Gen 43:9","Gen 44:32","Gen 44:33","Job 17:3","Filem 1:18","Filem 1:19","Hebr 7:22"]}],"3":[{"kopje":"omdat","refs":["2 Sam 24:14","2 Kron 12:5","Ps 31:9"]},{"kopje":"ga","refs":["Ex 10:3","2 Kron 36:12","Jak 4:10"]}],"5":[{"kopje":"als een vogel","refs":["Spr 1:17","Ps 11:1","Ps 124:7"]}],"6":[{"kopje":"de mier","refs":["Spr 1:17","Job 12:7","Job 12:8","Jes 1:3","Matt 6:26"]},{"kopje":"u","refs":["Spr 6:9","Spr 10:26","Spr 13:4","Spr 15:19","Spr 18:9","Spr 19:15","Spr 19:24","Spr 20:4","Spr 21:25","Spr 22:13","Spr 24:30-34","Spr 26:13-16","Matt 25:26","Rom 12:11","Hebr 6:12"]}],"9":[{"kopje":"Hoe lang","refs":["Spr 1:22","Spr 24:33","Spr 24:34","Jer 4:14"]},{"kopje":"wanneer","refs":["Ps 94:8","Joh 1:6","Rom 13:11","Ef 5:14","1 Tess 5:2- 21":"<span class=\"wl wl-kjv\" data-code=\"H7194\">Bind</span> them <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H6029\">tie</span> them about thy neck.","22":"When thou <span class=\"wl wl-kjv\" data-code=\"H1980\">goest,</span> it shall <span class=\"wl wl-kjv\" data-code=\"H5148\">lead</span> thee; when thou <span class=\"wl wl-kjv\" data-code=\"H7901\">sleepest,</span> it shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thee; and when thou <span class=\"wl wl-kjv\" data-code=\"H6974\">awakest,</span> it shall talk","23":"For the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> is a <span class=\"wl wl-kjv\" data-code=\"H5216\">lamp;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> is <span class=\"wl wl-kjv\" data-code=\"H216\">light;</span> and <span class=\"wl wl-kjv\" data-code=\"H8433\">reproofs</span> of <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction</span> are the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of life:","24":"To <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thee from the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> from the <span class=\"wl wl-kjv\" data-code=\"H2513\">flattery</span> of the <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> of a strange woman.","25":"<span class=\"wl wl-kjv\" data-code=\"H2530\">Lust</span> not after her <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart;</span> neither let her <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee with her eyelids.","26":"For by means <span class=\"wl wl-kjv\" data-code=\"H1157\">of</span> a <span class=\"wl wl-kjv\" data-code=\"H2181\">whorish</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wom :"But whoso committeth <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery</span> with a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2638\">lacketh</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">understanding:</span> he that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> it <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyeth</span> his own soul.","33":"A <span class=\"wl wl-kjv\" data-code=\"H5061\">wound</span> and <span class=\"wl wl-kjv\" data-code=\"H7036\">dishonour</span> shall he <span class=\"wl wl-kjv\" data-code=\"H4672\">get;</span> and his <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> shall not be wiped away.","34":"For <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> is the <span class=\"wl wl-kjv\" data-code=\"H2534\">rage</span> of a <span class=\"wl wl-kjv\" data-code=\"H1397\">man:</span> therefore he will not <span class=\"wl wl-kjv\" data-code=\"H2550\">spare</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of vengeance.","35":"He will not <span class=\"wl wl-kjv\" data-code=\"H5375\">regard</span> any <span class=\"wl wl-kjv\" data-code=\"H3724\">ransom;</span> neither will he rest <span class=\"wl wl-kjv\" data-code=\"H14\">content,</span> though thou givest <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> gifts."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zoon","tekst":"Zie boven Pro 1:8 ."},{"catchword":"voor een vreemde","tekst":"Dat is, voor een, die u onbekend is, of voor een ander, dat is, voor iemand, wie hij zou mogen wezen, u bekend of niet. Vergelijk onder Pro 11:15 ."},{"catchword":"uw hand","tekst":"Te weten, tot een teken dat gij uw woord houden zult, waardoor gij beloofd hebt te zullen betalen, zo de schuldenaar in gebreke valt. Zie Job 17:3 . Het recht en voorzichtig gebruik van borg voor een ander te worden is hier niet bestraft, maar de onvoorzichtigheid, lichtvaardigheid en onbedachtzaamheid, die hierin dikwijls geschiedt."}],"2":[{"catchword":"Gij zijt","tekst":"Anders: zijt gij verstrikt, enz."}],"3":[{"catchword":"red u,","tekst":"Dat is, maak u vrij van de borgschuld, hetzij bij den schuldheer, opdat hij u ontsla of bij den schuldenaar, dat hij betale en u buiten zorg stelle."},{"catchword":"in de hand","tekst":"Dat is, in het geweld van uwen schuldheer, voorzoveel als hij van u te eisen heeft. Vergelijk Gen 16:6 , en de aantekening."},{"catchword":"onderwerp","tekst":"Het Hebreeuwse woord betekent zulke vernedering, alsof men zich met de voeten wil laten vertrappen; alzo Psa 68:31 . Zie aldaar de aantekening."},{"catchword":"sterk","tekst":"Dat is, geef den schuldenaar goeden moed, opdat hij tevreden zij van de betaling, en hij die van u niet strengelijk afeise, maar geduldiglijk van den schuldenaar wachte en sterk of dring dengene voor wien gij borg geworden zijt, dat hij zijn best doe om te betalen."}],"4":[{"catchword":"Laat uw ogen","tekst":"Dat is, neem geen uitstel om uzelven en den schuldheer gerust te stellen."}],"5":[{"catchword":"Red u","tekst":"Te weten, uit het geweld van den schuldheer, aan wien gij u tot de betaling verbonden hebt."}],"6":[{"catchword":"wegen,","tekst":"Dat is, manier, of wijze van doen, te weten, in het wakker, zorgvuldig en naarstig vergaderen van haren kost. Zo is het woord weg genomen, onder Pro 13:15 , en Pro 14:12 , en Pro 16:2 , en Pro 21:2 , en Pro 30:19-20 ."}],"7":[{"catchword":"overste,","tekst":"Gelijk wel onder andere beesten de bijen haar koningin hebben, die de haren tot naarstigheid stuwt, en de ledigen doodbijt of uitwerpt; maar de mier, niet zulk een koning behoevende, drijft zichzelven tot het werk."}],"8":[{"catchword":"brood","tekst":"Versta, korengraantjes, welke zij beknabbelt en met bijten doorsnijdt, opdat zij niet uitschieten zouden, ten einde zij tegen den winter daarvan hare provisie hebben mocht, uit welke oorzaak zij bij de Hebreën nemalah genaamd wordt van namal, hetwelk is besnijden, afsnijden."}],"10":[{"catchword":"Een weinig","tekst":"Dat is, terwijl gij u vast tot het slapen en luieren begeeft, zo zal u de armoede overvallen. Sommigen menen dat hier de luiaard wordt ingevoerd, sprekende tot zichzelven, of op de voorgaande bestraffing antwoordende en wensende dat hij nog slechts een weinig slapens, enz. mocht hebben, enz. Zoveel is het, dat Salomo schijnt te zien op de manier van doen en spreken dergenen, die zich tot luiheid gewennen."}],"11":[{"catchword":"als een wandelaar","tekst":"Dat is, haastelijk en onvoorziens; gelijk een reizende man zich bespoedigt en gemeenlijk onverwachts overkomt."},{"catchword":"als een gewapend","tekst":"Hebreeuws, een man des schilds; dat is, die een schild draagt. Versta, een sterk gewapend man, die pleegt in te komen zonder vragen en niet lichtelijk weder kan uitgedreven worden."}],"12":[{"catchword":"Belialsmens,","tekst":"Alzo onder Pro 16:27 . Zie Deu 13:13 ."},{"catchword":"een ondeugdzaam man","tekst":"Hebreeuws, een man van ondeugdzaamheid, of ijdelheid, of ongerechtigheid. Zie Job 11:11 , en Psa 5:7 . Anders: een Belials mens is een ondeugdzaam, of ongerechtig man, omgaande met verkeerdheid des monds."},{"catchword":"verkeerdheid","tekst":"Zie boven Pro 2:12 , en Pro 4:24 ."}],"13":[{"catchword":"Wenkt","tekst":"De zin is dat hij niet alleen zijnen mond misbruikt, maar ook al zijne leden aanlegt om zijne boosheid in het werk te stellen."},{"catchword":"zijn ogen,","tekst":"Daarmede te kennen gevende enig kwaad, dat hijzelf voorheeft, of van een ander begeert gedaan te hebben."},{"catchword":"spreekt","tekst":"Te weten, al stotende, stampende, aanroerende, of tredende met dezelve."},{"catchword":"leert","tekst":"Te weten, daarmede wijzende, tellende, dreigende, enz."}],"14":[{"catchword":"verkeerdheden,","tekst":"Dat is, bedenkingen, lusten en voorslagen om iets verkeerds of onrechts te stichten met woorden of werken."},{"catchword":"smeedt","tekst":"Zie boven Pro 3:29 , alzo onder vs.18."},{"catchword":"werpt","tekst":"Hebreeuws, zendt; dat is, veroorzaakt veel onenigheid, stof daartoe gevende en de gemoederen der mensen ophitsende. Alzo onder vs.19, en Pro 16:28 ."}],"15":[{"catchword":"geen genezen","tekst":"Dat is, geen middel om het verderf te ontkomen. Alzo onder Pro 29:1 ."}],"16":[{"catchword":"zes","tekst":"Een zeker getal voor een onzeker."},{"catchword":"zeven","tekst":"Anders: het zevende. Zie van deze manier van spreken Job 5:19 ."},{"catchword":"Zijn ziel","tekst":"Hebreeuws, zijner zielen gruwel, of de gruwel van zijne ziel; dat is, dat zijne ziel voor een gruwel houdt. Zie Deu 17:1 , en boven Pro 3:32 ."}],"17":[{"catchword":"Hoge ogen,","tekst":"Dat is, hovaardij, waarvan de verheven en opvliegende ogen een teken zijn. Vergelijk Psa 101:5 ; Pro 30:13 ; Isa 5:15 . Tegen deze zijn de nederigen van ogen; Job 22:29 ."},{"catchword":"valse tong,","tekst":"Hebreeuws, tong der valsheid; dat is die leugentaal spreekt; alzo Psa 109:2 ; onder Pro 12:19 , en Pro 21:6 ."}],"18":[{"catchword":"dat ondeugdzame","tekst":"Hebreeuws, gedachten der ondeugdzaamheid, of ongerechtigheid. Versta, een hart, dat op snode en ongerechtige praktijken zich toelegt. Zie boven Pro 3:29 , en vs.14."},{"catchword":"voeten,","tekst":"Versta, mensen, die door hun kwade zinnen en ongenegenheden zeer gedreven worden om hunnen naasten schade en verdriet aan te doen."}],"19":[{"catchword":"Een vals","tekst":"Hebreeuws, een getuige der valsheid."},{"catchword":"blaast;","tekst":"Dat is, met grote menigte en moedigheid verzint en voortbrengt. Alzo onder Pro 14:25 , en Pro 19:5 , Pro 19:9 ."},{"catchword":"inwerpt","tekst":"Hebreeuws, zendt; zie boven vs.14."}],"21":[{"catchword":"Bind","tekst":"Vergelijk boven Pro 3:3 , en de aantekening."}],"22":[{"catchword":"dat u geleiden;","tekst":"Te weten, dat gebod van uw vader, waarvan in het voorgaande vs.20 gesproken is; hoewel het woord ook zien kan op de wet der moeder."},{"catchword":"met u spreken","tekst":"Dat is, u indach :"Alzo","tekst":"Gelijk de twee voorgaande gelijkenissen vast gaan en zeker zijn, alzo ook dit, dat daarop gepast wordt; te weten, dat de overspeler zich kwetst en schade doet aan goed, lichaam, eer en ziel."},{"catchword":"zijns naasten","tekst":"Zie de aantekening Gen 6:4 ."},{"catchword":"aanroert,","tekst":"Dat is, met haar te doen heeft door bijslaping. Zie gelijke manier van spreken, Gen 20:6 ; 1Co 7:1 ."},{"catchword":"onschuldig","tekst":"Dat is, niet ongestraft blijven. Zie 1Ki 2:9 ; Job 9:28 ."}],"30":[{"catchword":"Men doet","tekst":"Hij wil zeggen dat dieverij zo grote zonde niet is als overspel, en dat dieverij, geschied bijzonderlijk door hongersnood, niet zo smadelijk en hardelijk gestraft wordt als overspel. En dit kan men verstaan van een particuliere handeling tussen den dief en den man, wien hij iets ontstolen heeft."},{"catchword":"ziel","tekst":"Dat is, zich te verzadigen; of versta door ziel begeerte. Zie Gen 34:3 ; Psa 27:12 ."}],"31":[{"catchword":"zevenvoudig;","tekst":"Dat is, veelvoudig. Zeven is dikwijls in de Heilige Schrift een zeker getal voor een onzeker; gelijk Gen 4:15 ; Lev 26:18 ; Psa 119:164 , onder Pro 24:16 , en Pro 26:25 , betekenende veelheid. De blote dieven moesten wel het gestolene maar twee of vier of vijfdubbel wedergeven, Exo 22:1 , Exo 22:4 ; maar sommigen menen dat de straf, den dieven door de wet opgelegd, ten tijde van Salomo verzwaard was; of men kan het zo verstaan, dat de dief met den man overeenkomt dat hij hem zoveel wil geven, opdat hij hem geen schande aandoe."},{"catchword":"al het goed","tekst":"Te weten, indien hij zo schamel is dat hij niet veelvoudiglijk kan wedergeven."}],"32":[{"catchword":"is verstandeloos;","tekst":"Hebreeuws, harteloos, of heeft geen hart, of gebrek van een hart; dat is, heeft geen wetenschap, verstand en zinnen, niet begrijpende wat God aangenaam, eerlijk voor de mensen en voordelig voor zichzelven is. Zie dezelfde benaming onder Pro 7:7 , en Pro 9:4 , Pro 9:16 , en Pro 10:13 , en rge thee out of fear and care] seeing thou art come into the hand of thy neighbour: [that is, into the power of thy creditor, forasmuch as he hath power to require the debt of thee. Compare Gen 6:16. and the annot.] go, submit thy self, [the Hebrew word signifieth such an humiliation, as if a man would suffer himself to be trod upon with the foot. So Psa 68:31. see the annot. There] and strengthen thy neighbour. [That is, put courage into the creditor, that he may be contented with the payment, and not requite it strictly of thee, but expect it patiently of or from the debtor. Or, strengthen, and urge the party for whom thou art become surety, that he do his endeavour to pay.]"}],"4":[{"catchword":null,"tekst":"Give not sleep to thine eyes, nor slumber to thine eye-lids: [That is, delay not to quiet and pacify thy self, and the creditor.]"}],"5":[{"catchword":null,"tekst":"Deliver thy self [to wit, from the power of the creditor, unto whom hast bound thy self for the payment of the money] as a roe from the hand (of the hunter); and as a bird from the hand of the fowler."}],"6":[{"catchword":null,"tekst":"Go to the Ant, thou sluggard: behold her ways, [That is, manner, or course of life; to wit, in vigilant, careful, and diligent gathering and providing food for her self. So is the word way taken below, chap.13.15. and 14.12. and 16.2. and 21.2. and 30.19,20.] and be wise:"}],"7":[{"catchword":null,"tekst":"Which having no guide, Governor, nor Ruler, [As among other beasts Bees have their King, that quickens on and stirs up his own unto diligence, and stings the idle drones to death, and casts them forth out of the hive: but the pismire having no need of such a King, puts her self on to labour.]"}],"8":[{"catchword":null,"tekst":"Prepareth her bread in the summer, (and) gathereth her food in the harvest. [By bread, or food, which the pismire prepareth and gathereth in summer, and in harvest, is meant here grains of corn, which she gnaweth, and with her biting cutteth ng, touching, or treading therewith] (he) teacheth with his fingers; [to wit, therewith pointing, numbering, threatening, &c. The meaning is, that he not onely abuseth his mouth, but also employed all his members, to put his wickedness in practice.]"}],"14":[{"catchword":null,"tekst":"Frowardnesses are in his heart, [That is, inventions, plots and devices are in his heart to act some wicked and perverse thing, either in words or deeds] he forget evil [see above chap.3.on verse 29. So below verse 18.] always; he casteth in strifes. [Hebr. Sendeth; that is, occasioneth much discord, affording matter thereunto, and stirring up mens minds to dissention and disagreement. So below verse 19. And chap.16.28.]"}],"15":[{"catchword":null,"tekst":"Therefore shall his destruction come speedily, suddenly shall he be broken, (so) that there shall be no healing of (him). [That is, no means for to escape destruction. So below chap.29.1.]"}],"16":[{"catchword":null,"tekst":"These six (things) [ A certain number for an uncertain] doth the LORD hate: yea seven [Oth. The seventh. See of this phrase, Job 5.on verse 19.] are an abomination unto his soul: [Hebr. His souls abomination, or, the abomination of his soul; that is, which his soul holdeth to be abomination. See Deut.17.on verse 1. And above chap.3.on verse 32.]"}],"17":[{"catchword":null,"tekst":"Lofty eyes, [That is, pride, whereof the eyes that are lifted up, and soar aloft, are a plain token. Compare Psa 101:5. Prov. Chap.30.13. Isa 5:15. unto these are opposed those that be of lowly or humble eyes, Job 22:29.] a false tongue; [Hebr. A tongue of falsehood; that is, which speaketh lies; so Psa 109:2. and bel. Chap.12.19. and 21.6.] and hands that shed innocent blood:"}],"18":[{"catchword":null,"tekst":"An heart that forget vicious thoughts, [Hebrew, thoughts of viciousness, or, iniquity. Meaning an heart that pierceth and plotteth wicked and unjust practises. See ab.ch.3.on v.29. and the 14. Verse of this Chapter] feet that make haste to run to evil: [that is, men, who by their evil inclinations and affections, are exceedingly put on to wrong and mischieve their neighbors.]"}],"19":[{"catchword":null,"tekst":"A false witness, [Hebr. A witness of falsehood] (that) lies; [that is, that inventeth and uttereth lies in great abundance, and with boldness. So below ch.14.25. and ch.18. verse 5.9.] and (him) that casteth in contentions [Hebr. Sendeth, &c. See above on verse 14.] between brethren."}],"20":[{"catchword":null,"tekst":"My son, keep the commandment of thy father and forsake not the law of thy mother. [Compare ab.ch.1.8.]"}],"21":[{"catchword":null,"tekst":"Bind them continually unto thine heart: fasten them unto thy neck. [Compare above ch.3.3. and the Annot.]"}],"22":[{"catchword":null,"tekst":"When thou walkest, it [To wit, the commandment of thy father, whereof mention is made, verse 20. Although the particle (it) may also relate or have respect to the law of the mother] shall conduct thee, when thou liest down, it shall keep watch over thee; when thou awakes, it s hall talk (with) thee. [that is, put thee in mind what thou oughtest to do or omit in thy dealing and converse, and wherewith thou oughtest to comfort thy selk in thy sufferings.]"}],"23":[{"catchword":null,"tekst":"For the Commandment [To wit, which is taken out of the Word and Law of God] is a Lamp, [compare Psa 119:105.] and the law is a light: and the reproofs of discipline [To wit, which is done by discipline, or by instruction, which must preceed, or go before, if a man would attain unto wisdom. See of this word ab.ch.1.on verse 2.] are the way of life: [That is, which leadeth unto life: so the way of death, which leadeth unto death: see Jer 21:8. comp.ab.ch.2.on v.8.]"}],"24":[{"catchword":null,"tekst":"To keep thee from the evil woman: [Hebr. Woman of evil; that is, that makes it her business to do evil; or, that getteth her living by doing evil] from the flatteries [that is, soothing, cogging, fair speaking. Comp.ab.ch.2.on ver.16.] of the strange tongue. [see above chap.2.on ver.16. and ch.5.3. and 7.5.]"}],"25":[{"catchword":null,"tekst":"Lust not after her beauty in thine heart: neither let her take thee with her eyes-lids. [That is, with her fair looks, and with her lovely countenance.]"}],"26":[{"catchword":null,"tekst":"For by a woman, (that) is an harlot, [Hebr. A woman, an harlot; that is, which is an harlot. So 1 Ki.3.16. also a woman, a Prophetess: that is, which was a Prophetess, Judg.4.4. a man, a Prophet; that is, which was a Prophet, Judg.6.8.] (a man cometh) to a piece of bread; [that is, to poverty, yea even to beggary] and a mans wife [that is, a woman that hath an husband, and yet desires to keep company with other men. Oth. A wife sick of a man. Some understand by a mans wife, one that is every mans wife] hunteth (for) the precious soul. [that is, she bringeth not onely the body of him, that enticeth her to uncleanness, into temporal destruction, but also his soul, which is his most precious and most worthy part, into everlasting suffering. Compare Eze 13:18.]"}],"27":[{"catchword":null,"tekst":"Shall any man take fire in his bosom, (so) that his cloaths be not burnt? [This question, as also the next to it, do deny strongly. See Genesis 18.on ver.17.]"}],"28":[{"catchword":null,"tekst":"Shall any man go upon coals, [To wit, fiery, or red hot coals. See of this word, Job 41.on ver.12.] (so) that his feet be not burnt?"}],"29":[{"catchword":null,"tekst":"So he that goeth ;in to his neighbours wife: [See Genesis 6. The Annotations on verse 4.] who so ever toucheth her, [that is, hath any dealings with her by carnal copulation: see the like phrase, Gen 20:6. 1 Corinthians 7.1.] shall not be held guiltless. [that is, shall not go unpunished. See 1 Kings 2.on verse 9. And Job 9.on verse 28. As the two former similitudes laid down in the two former verses, are sure and certain, so is also this that is applied thereunto; to wit, that the adulterer hurteth and damnisieth himself in his estate, body, honour, and soul.]"}],"30":[{"catchword":null,"tekst":"Men do not offer disgrace to a thief, when he stealeth to fill his soul. [That is, to satisfy himself; or, understand by soul, desire. See Gen.34.on verse 3. And Psalm 27.on verse 12.] seeing he is hungry; [intimating, that theft, or felony is not so great a sin as adultery is; and that felony which is chiefly committed through hunger and want, is not so heinously and severely punished, as adultery is: and this may be gathered from the particular dealing between the thief, and the party whom he hath robbed, as followeth in the next verse.]"}],"31":[{"catchword":null,"tekst":"And being found he restoreth it sevenfold: [That is, manifold. Seven is often in scripture a certain number for an uncertain, as Gen 4:15. Lev 26:18. Psa 119:164. below chapter 24.16. and 26.25. signifying multitude. Those that had commited simple or bare theft, were to make onely two fold, or fourfold, or fivefold restitution, Exo 22:1, etc. And 4. But some conceive that the punishment increased in Salomons time. Or it may be thus understood, that the thief agreeth to give the man so much, that he may nor bring him to shame and disgrace] he giveth all the goods of his house. [to wit, if he be so poor, that he cannot make manifold restitution.]"}],"32":[{"catchword":null,"tekst":"(But) whose committeth adultery with a woman, is void of understanding; [Hebr. Is heartless, or, hath no heart, or, lacketh an heart; that is, hath no knowledge, understanding, nor, capacity, to apprehend what is pleasing unto God, honourable kin the sight of men, and profitable unto himself. See the same epithet, or appellation, below chap.7.7. and 9.4,16. And 10.13. and 11.12. and 15.21. and 17.18, &c. The word heart is often taken for the understanding. See Job 9.on verse 4.] he that doth it, [that is, he that committeth adultery] destroyeth his (own) soul:"}],"33":[{"catchword":null,"tekst":"A blow, and dishonour shall he find, and his reproach shall not be blotted out: [Or, be put out, wiped away.]"}],"34":[{"catchword":null,"tekst":"For jealousy is the rage of a man: and he will not spare [To wit, the adulterer] in the day of vengeance. [that is, when occasion shall serve, or offer it self, to take vengeance, or for a man to avenge himself. So the time when God would be avenged on the enemies of his Church, is called a day of vengeance, Isa 34:8. Compare Job 20:28. and 24.1. and below chap.11.4.]"}],"35":[{"catchword":null,"tekst":"He will not accept any reconciliation: [Compare Numb.35.on verse 31. Hebrew, be will not accept the face of all reconciliation: that is, accept no ransom. See 1 Kings 11.on verse 34. Of the phrase, to accept the face, see Gen.32.on verse 20.] neither will he consent, though thou enlarge the gift. [Or, multiply gifts.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
