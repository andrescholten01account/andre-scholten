al</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4229\">niet</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4229\">uitgewist</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4229\">worden</span>.", "34": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7068\">Want</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7068\">jaloezie</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7068\">is</span> de woede van een man; <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">en</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">op</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">dag</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5359\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5359\">wraak</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5359\">zal</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2550\">hij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2550\">niet</span> sparen.", "35": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3724\">Hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3724\">zal</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3724\">geen</span> losgeld aanvaarden; <span class=\"wl\" data-l=\"L2\" data-code=\"H14\">en</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H14\">hij</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H14\">zal</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H14\">niet</span> tevreden zijn, ook al maakt u <span class=\"wl\" data-l=\"L3\" data-code=\"H7810\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7810\">geschenk</span> groter."}, "koppeling_kjv": {"1": "My <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> if thou be <span class=\"wl wl-kjv\" data-code=\"H6148\">surety</span> for thy <span class=\"wl wl-kjv\" data-code=\"H7453\">friend,</span> if thou hast <span class=\"wl wl-kjv\" data-code=\"H8628\">stricken</span> thy <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> with a stranger,", "2": "Thou art <span class=\"wl wl-kjv\" data-code=\"H3369\">snared</span> with the <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> thou art <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> with the <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> of thy mouth.", "3": "<span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> this <span class=\"wl wl-kjv\" data-code=\"H645\">now,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> thyself, when thou art <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7453\">friend;</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H7511\">humble</span> thyself, and make <span class=\"wl wl-kjv\" data-code=\"H7292\">sure</span> thy friend.", "4": "<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> not <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep</span> to thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8572\">slumber</span> to thine eyelids.", "5": "<span class=\"wl wl-kjv\" data-code=\"H5337\">Deliver</span> thyself as a <span class=\"wl wl-kjv\" data-code=\"H6643\">roe</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the hunter, and as a <span class=\"wl wl-kjv\" data-code=\"H6833\">bird</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the fowler.", "6": "<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> to the <span class=\"wl wl-kjv\" data-code=\"H5244\">ant,</span> thou <span class=\"wl wl-kjv\" data-code=\"H6102\">sluggard;</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">consider</span> her <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and be wise:", "7": "Which having no <span class=\"wl wl-kjv\" data-code=\"H7101\">guide,</span> <span class=\"wl wl-kjv\" data-code=\"H7860\">overseer,</span> or ruler,", "8": "<span class=\"wl wl-kjv\" data-code=\"H3559\">Provideth</span> her <span class=\"wl wl-kjv\" data-code=\"H3899\">meat</span> in the <span class=\"wl wl-kjv\" data-code=\"H7019\">summer,</span> and <span class=\"wl wl-kjv\" data-code=\"H103\">gathereth</span> her <span class=\"wl wl-kjv\" data-code=\"H3978\">food</span> in the harvest.", "9": "How long wilt thou <span class=\"wl wl-kjv\" data-code=\"H7901\">sleep,</span> O <span class=\"wl wl-kjv\" data-code=\"H6102\">sluggard?</span> when wilt thou <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> out of thy sleep?", "10": "Yet a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H8572\">slumber,</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H2264\">folding</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> to sleep:", "11": "So shall thy <span class=\"wl wl-kjv\" data-code=\"H7389\">poverty</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> as one that <span class=\"wl wl-kjv\" data-code=\"H1980\">travelleth,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4270\">want</span> as an <span class=\"wl wl-kjv\" data-code=\"H4043\">armed</span> man.", "12": "A <span class=\"wl wl-kjv\" data-code=\"H1100\">naughty</span> <span class=\"wl wl-kjv\" data-code=\"H120\">person,</span> a <span class=\"wl wl-kjv\" data-code=\"H205\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> with a <span class=\"wl wl-kjv\" data-code=\"H6143\">froward</span> mouth.", "13": "He <span class=\"wl wl-kjv\" data-code=\"H7169\">winketh</span> with his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> he <span class=\"wl wl-kjv\" data-code=\"H4448\">speaketh</span> with his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> he <span class=\"wl wl-kjv\" data-code=\"H3384\">teacheth</span> with his fingers;", "14": "<span class=\"wl wl-kjv\" data-code=\"H8419\">Frowardness</span> is in his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> he <span class=\"wl wl-kjv\" data-code=\"H2790\">deviseth</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">mischief</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">continually;</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">soweth</span> <span class=\"wl wl-kjv\" data-code=\"H4066\">discord.</span>", "15": "Therefore shall his <span class=\"wl wl-kjv\" data-code=\"H343\">calamity</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly;</span> <span class=\"wl wl-kjv\" data-code=\"H6621\">suddenly</span> shall he be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> without remedy.", "16": "These <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> things doth the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hate:</span> yea, <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> are an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> unto him:", "17": "A <span class=\"wl wl-kjv\" data-code=\"H7311\">proud</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">look,</span> a <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue,</span> and <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> that <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> blood,", "18": "An <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> that <span class=\"wl wl-kjv\" data-code=\"H2790\">deviseth</span> <span class=\"wl wl-kjv\" data-code=\"H205\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H4284\">imaginations,</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> that be <span class=\"wl wl-kjv\" data-code=\"H4116\">swift</span> in <span class=\"wl wl-kjv\" data-code=\"H7323\">running</span> to mischief,", "19": "A <span class=\"wl wl-kjv\" data-code=\"H8267\">false</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> that <span class=\"wl wl-kjv\" data-code=\"H6315\">speaketh</span> <span class=\"wl wl-kjv\" data-code=\"H3577\">lies,</span> and he that <span class=\"wl wl-kjv\" data-code=\"H7971\">soweth</span> <span class=\"wl wl-kjv\" data-code=\"H4090\">discord</span> among brethren.", "20": "My <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H5341\">keep</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment,</span> and <span class=\"wl wl-kjv\" data-code=\"H5203\">forsake</span> not the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of thy mother:", "21": "<span class=\"wl wl-kjv\" data-code=\"H7194\">Bind</span> them <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H6029\">tie</span> them about thy neck.", "22": "When thou <span class=\"wl wl-kjv\" data-code=\"H1980\">goest,</span> it shall <span class=\"wl wl-kjv\" data-code=\"H5148\">lead</span> thee; when thou <span class=\"wl wl-kjv\" data-code=\"H7901\">sleepest,</span> it shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thee; and when thou <span class=\"wl wl-kjv\" data-code=\"H6974\">awakest,</span> it shall talk", "23": "For the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> is a <span class=\"wl wl-kjv\" data-code=\"H5216\">lamp;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> is <span class=\"wl wl-kjv\" data-code=\"H216\">light;</span> and <span class=\"wl wl-kjv\" data-code=\"H8433\">reproofs</span> of <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction</span> are the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of life:", "24": "To <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thee from the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> from the <span class=\"wl wl-kjv\" data-code=\"H2513\">flattery</span> of the <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> of a strange woman.", "25": "<span class=\"wl wl-kjv\" data-code=\"H2530\">Lust</span> not after her <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart;</span> neither let her <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee with her eyelids.", "26": "For by means <span class=\"wl wl-kjv\" data-code=\"H1157\">of</span> a <span class=\"wl wl-kjv\" data-code=\"H2181\">whorish</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> a man is brought to a <span class=\"wl wl-kjv\" data-code=\"H3603\">piece</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread:</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">adulteress</span> will <span class=\"wl wl-kjv\" data-code=\"H6679\">hunt</span> for the <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> life.", "27": "Can a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2846\">take</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> not be burned?", "28": "Can <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> upon hot <span class=\"wl wl-kjv\" data-code=\"H1513\">coals,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> not be burned?", "29": "So he that goeth <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> her shall not be innocent.", "30": "Men do not <span class=\"wl wl-kjv\" data-code=\"H936\">despise</span> a <span class=\"wl wl-kjv\" data-code=\"H1590\">thief,</span> if he <span class=\"wl wl-kjv\" data-code=\"H1589\">steal</span> to <span class=\"wl wl-kjv\" data-code=\"H4390\">satisfy</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> when he is hungry;", "31": "But if he be <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> <span class=\"wl wl-kjv\" data-code=\"H7659\">sevenfold;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> all the <span class=\"wl wl-kjv\" data-code=\"H1952\">substance</span> of his house.", "32": "But whoso committeth <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery</span> with a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2638\">lacketh</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">understanding:</span> he that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> it <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyeth</span> his own soul.", "33": "A <span class=\"wl wl-kjv\" data-code=\"H5061\">wound</span> and <span class=\"wl wl-kjv\" data-code=\"H7036\">dishonour</span> shall he <span class=\"wl wl-kjv\" data-code=\"H4672\">get;</span> and his <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> shall not be wiped away.", "34": "For <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> is the <span class=\"wl wl-kjv\" data-code=\"H2534\">rage</span> of a <span class=\"wl wl-kjv\" data-code=\"H1397\">man:</span> therefore he will not <span class=\"wl wl-kjv\" data-code=\"H2550\">spare</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of vengeance.", "35": "He will not <span class=\"wl wl-kjv\" data-code=\"H5375\">regard</span> any <span class=\"wl wl-kjv\" data-code=\"H3724\">ransom;</span> neither will he rest <span class=\"wl wl-kjv\" data-code=\"H14\">content,</span> though thou givest <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> gifts."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
