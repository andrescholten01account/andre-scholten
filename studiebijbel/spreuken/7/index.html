n, zal verdrogen; het zal weggestoten worden, en niet meer zijn.", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Rom 7:5": "Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Joh 12:50": "En Ik weet dat Zijn gebod het eeuwige leven is. Wat Ik dan spreek, dat spreek Ik zoals de Vader Mij gezegd heeft.", "1 Tim 5:13": "En meteen leren zij ook nietsdoend rondgaan bij de huizen; en zijn niet alleen nietsdoend, maar ook praatziek, en bezig met wat hen niet aangaat, terwijl zij spreken wat niet betaamt.", "Spr 20:14": "Het is slecht, het is slecht! zal de koper zeggen; maar als hij weggegaan is, dan zal hij zich beroemen.", "Gen 37:25": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "Gen 39:7": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij!", "Matt 7:15": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.", "1 Joh 4:8": "Wie niet liefheeft, kent God niet; want God is liefde.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Spr 20:16": "Als iemand borg geworden is voor een vreemde, neem zijn kleed; en pand hem voor de onbekenden.", "Spr 7:5-23": "Opdat zij u bewaren voor een vreemde vrouw, voor de onbekende, die met haar woorden vleit. Want door het venster van mijn huis, door mijn tralie keek ik uit; En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling;", "Hos 2:12": "En Ik zal aan haar de dagen van de Baäl bezoeken, waarin zij hem wierook gebracht heeft, en zich versierd heeft met haar voorhoofdsieraad, en haar halssieraad, en haar minnaars is nagegaan, maar Mij heeft vergeten, spreekt de Heere.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal men des te meer eisen.", "Spr 7:10-21": "En zie, een vrouw ontmoette hem in hoerenversiersel, en met het hart op haar hoede; Deze was druk en opstandig, haar voeten bleven in haar huis niet; Nu buiten, dan op de straten zijnde, en bij alle hoeken loerend;", "Spr 23:12": "Richt uw hart op de tucht, en uw oren op de woorden van kennis.", "Spr 5:6-21": "Opdat u het pad van het leven niet zoudt overwegen, zijn haar gangen onvast, zodat u het niet merkt. Nu dan, kinderen! Hoor naar mij, en wijk niet van de woorden van mijn mond. Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Spr 31:22": "Mem. Zij maakt voor zichzelf sierlijke dekens; haar kleding is fijn linnen en purper.", "Job 32:22": "Want ik weet geen bijnamen te gebruiken; anders zou mijn Maker mij binnenkort wegnemen.", "Ps 17:8": "Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "Job 32:21": "Och, dat ik niemands aanzien aanneem, en tegen de mens geen bijnamen gebruik!", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Spr 2:1-7": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Spr 17:16": "Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Job 5:27": "Zie dit, wij hebben het doorzocht, het is zo; hoor het, en bemerk het voor uzelf.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Hand 16:15": "En toen zij gedoopt was, en haar huis, smeekte zij ons: Als u geoordeeld hebt dat ik de Heere trouw ben, kom dan in mijn huis en blijf daar. En zij drong er sterk op aan.", "Job 12:7-13": "En werkelijk, vraag toch de dieren, en ieder van hen zal het u leren; en de vogels van de hemel, die zullen het u bekendmaken. Of spreek tot de aarde, en zij zal het u leren; ook zullen de vissen van de zee het u vertellen. Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Job 36:29": "Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Matt 12:49": "En Hij strekte Zijn hand uit over Zijn discipelen, en zei: Kijk, Mijn moeder en Mijn broeders.", "Spr 27:12": "De schrandere ziet het kwaad, en verbergt zich; de eenvoudigen gaan door, en worden gestraft.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Matt 23:26": "Blinde Farizeeër, reinig eerst wat binnen in de drinkbeker en de schotel is, opdat ook de buitenkant daarvan rein wordt.", "Ps 95:10": "Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "2 Kor 11:14": "En het is geen wonder, want de satan zelf verandert zich in een engel van het licht.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Jes 27:11": "Als haar takken verdord zijn, zullen ze afgebroken worden, en de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.", "Spr 23:15-35": "Mijn zoon! als uw hart wijs is, zal mijn hart zich verblijden, ja, ik zelf. En mijn nieren zullen opspringen van vreugde, als uw lippen spreken wat recht is. Laat uw hart niet jaloers zijn op de zondaars; maar wees de hele dag in de vreze van de HEERE.", "Job 36:14": "Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Luk 22:3": "En de satan voer in Judas, die bijgenaamd was Iskariot, die uit het getal van de twaalf was.", "Job 36:26": "Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Ps 50:16": "Maar tegen de goddeloze zegt God: Wat hebt u Mijn inzettingen te vertellen, en neemt u Mijn verbond in uw mond?", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "2 Petr 1:9": "Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Ezech 14:7": "Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "1 Sam 28:23": "Doch hij weigerde het, en zei: Ik zal niet eten. Maar zijn dienaren, en ook de vrouw, drongen bij hem aan. Toen luisterde hij naar hun stem, en hij stond op van de aarde, en ging op het bed zitten.", "Spr 9:9-12": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis. De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand. Want door mij zullen uw dagen zich vermenigvuldigen, en de jaren van uw leven zullen u toegevoegd worden.", "Rom 15:14": "Doch, mijn broeders, ook ik zelf ben ervan verzekerd dat u ook zelf vol bent van goedheid, vervuld met alle kennis, in staat om ook elkaar te vermanen.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "2 Tim 2:23": "En verwerp de dwaze en onverstandige vragen, wetend dat zij twisten voortbrengen.", "Spr 22:16": "Wie de arme verdrukt om zijn eigen bezit te vermeerderen, en wie aan de rijke geeft, komt zeker tot gebrek.", "Ex 20:3-17": "U zult geen andere goden voor Mijn aangezicht hebben. U zult zich geen gesneden beeld maken, of enige gelijkenis van hetgeen boven in de hemel is, of van hetgeen beneden op de aarde is, of van hetgeen in het water onder de aarde is. U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jes 48:2": "Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen is Zijn Naam.", "Est 2:12": "Toen nu de beurt van elke jonge dochter naderde om bij koning Ahasveros te komen, nadat haar twaalf maanden lang naar de wet van de vrouwen gebeurd was; want zo werden vervuld de dagen van haar schoonheidsverzorging, zes maanden met mirreolie, en zes maanden met specerijen, en met andere schoonheidsmiddelen van de vrouwen;", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "Matt 23:2-33": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes; daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet. Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Spr 27:21": "De smeltkroes is voor het zilver, en de oven voor het goud; zo wordt een man beproefd naar zijn lof.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "Spr 7:21-23": "Zij bewoog hem door de veelheid van haar onderricht, zij dreef hem aan door het gevlei van haar lippen. Hij ging haar meteen achterna, zoals een os naar de slachting gaat, en zoals een dwaas naar de bestraffing van de boeien. Totdat de pijl zijn lever doorsneed; zoals een vogel zich haast naar de strik, en niet weet dat die tegen zijn leven is.", "2 Kor 11:2": "Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Num 11:5": "Wij denken aan de vissen die wij in Egypte voor niets aten; aan de komkommers, en aan de meloenen, en aan het look, en aan de uien, en aan het knoflook.", "1 Kor 7:37": "Maar wie vast staat in zijn hart, geen noodzaak hebbende, maar macht heeft over zijn eigen wil, en dit in zijn hart besloten heeft, dat hij zijn maagd zal bewaren, die doet goed.", "Joh 8:43": "Waarom begrijpt u Mijn spraak niet? Het is omdat u Mijn woord niet kunt horen.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Spr 7:11-27": "Deze was druk en opstandig, haar voeten bleven in haar huis niet; Nu buiten, dan op de straten zijnde, en bij alle hoeken loerend; En zij greep hem vast, en kuste hem; zij verhardde haar gezicht, en zei tegen hem:", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Job 24:15-18": "Ook houdt het oog van de overspeler de schemering in de gaten, en zegt: Geen oog zal mij zien; en hij bedekt zijn gezicht. In de duisternis breekt hij in de huizen in, die zij zich overdag hadden uitgekeken; zij kennen het licht niet. Want de morgenstond is voor hen allemaal de schaduw van de dood; want kent men hen, dan verkeren zij in de verschrikkingen van de schaduw van de dood.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Spr 13:14": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood.", "Spr 25:24": "Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.", "Mark 13:21": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.", "Job 8:9": "Want wij zijn van gisteren en weten niets, omdat onze dagen op de aarde een schaduw zijn.", "Ps 18:6": "Banden van het graf omringden mij, strikken van de dood bejegenden mij.", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Pred 9:13-18": "Ook heb ik onder de zon deze wijsheid gezien, en zij leek mij groot: Er was een kleine stad, en er waren maar weinig mensen in; en een groot koning kwam tegen haar op, en hij omsingelde haar, en hij bouwde grote belegeringswerken tegen haar. En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "Ps 49:14": "Deze weg van hen is een dwaasheid van hen; toch hebben hun nakomelingen welbehagen in hun woorden. Sela.", "Pred 6:11": "Voorwaar, er zijn veel dingen die de ijdelheid vermeerderen; wat heeft de mens daar meer aan?", "Spr 24:1-34": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn. Want hun hart bedenkt verwoesting, en hun lippen spreken over moeite. Door wijsheid wordt een huis gebouwd, en door verstandigheid bevestigd;", "Job 34:30": "Opdat de huichelachtige mens niet meer regeert, en geen strikken van het volk zijn.", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "1 Tess 3:5": "Daarom heb ik ook, omdat ik het verlangen niet langer kon verdragen, hem gezonden om uw geloof te leren kennen; of de verzoeker u misschien niet had verzocht, en onze arbeid tevergeefs zou zijn.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "1 Kor 7:26": "Ik houd het er dan voor dat dit goed is vanwege de aanstaande nood, dat het, zeg ik, voor de mens goed is om zo te zijn.", "Spr 2:16-18": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit; Die de leidsman van haar jeugd verlaat, en het verbond van haar God vergeet; Want haar huis helt naar de dood, en haar paden naar de overledenen.", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Jer 8:7-9": "Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet. Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden. De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Spr 30:11": "Er is een geslacht dat zijn vader vervloekt, en zijn moeder niet zegent;", "Job 20:4-18": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Ezech 3:7-9": "Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij. Zie, Ik heb uw gezicht stijf gemaakt tegen hun gezichten, en uw voorhoofd stijf tegen hun voorhoofd. Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en wees niet ontzet voor hun gezichten, omdat zij een opstandig huis zijn.", "Spr 7:6-23": "Want door het venster van mijn huis, door mijn tralie keek ik uit; En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Joh 9:29-39": "Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is. De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend. En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Jes 3:16-24": "Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren. Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,", "1 Joh 2:13-17": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend. Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen. Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Matt 5:15": "Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.", "Hoogl 5:13": "Zijn wangen zijn als een bed van specerijen, als welriekende torentjes; Zijn lippen zijn als lelies, druppend van vloeiende mirre.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Spr 4:1-27": "Hoort, kinderen! De tucht van je vader, en let op, om verstand te krijgen. Omdat ik u goede leer geef, verlaat mijn wet niet. Want ik was de zoon van mijn vader, teder, en een enige voor het aangezicht van mijn moeder.", "Matt 21:28-32": "Maar wat denkt u? Een man had twee zonen, en hij ging naar de eerste en zei: Zoon, ga vandaag in mijn wijngaard werken. Maar hij antwoordde en zei: Ik wil niet; maar later kreeg hij berouw en ging hij toch. En hij ging naar de tweede en zei hetzelfde. En deze antwoordde en zei: Ik ga, heer! En hij ging niet.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Dan 11:34": "Als zij nu zullen vallen, zullen zij met een kleine hulp geholpen worden; doch velen zullen zich door vleierijen bij hen aansluiten.", "Hand 1:7": "En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;", "Luk 15:11-32": "En Hij zei: Een zeker mens had twee zonen. En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit. En niet veel dagen daarna heeft de jongste zoon alles bijeengebracht, en is weggereisd naar een ver land, en heeft daar zijn bezit doorgebracht, terwijl hij overdadig leefde.", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Spr 4:4-13": "Hij leerde mij, en zei tegen mij: Uw hart houdt mijn woorden vast, onderhoud mijn geboden, en leef. Verkrijg wijsheid, verkrijg verstand; vergeet niet, en wijk niet van de woorden van mijn mond. Verlaat haar niet, en zij zal u behoeden; heb haar lief, en zij zal u bewaren.", "Jak 1:12-16": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben. Niemand moet, als hij verzocht wordt, zeggen: Ik word door God verzocht; want God kan niet verzocht worden met het kwade, en Hij Zelf verzoekt niemand. Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Matt 22:18": "Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef?", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "Deut 13:3": "dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Ezech 18:6": "Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert;", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Jes 23:15": "En het zal op die dag gebeuren, dat Tyrus zeventig jaren vergeten zal worden, zoals de dagen van één koning; maar aan het einde van zeventig jaren zal het met Tyrus zijn als in het lied van een hoer:", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Spr 4:1": "Hoort, kinderen! De tucht van je vader, en let op, om verstand te krijgen.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Hos 4:2": "Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "Mark 6:52": "Want zij hadden het wonder van de broden niet begrepen; want hun hart was verhard.", "Spr 6:1-35": "Mijn zoon! Als u voor uw naaste borg geworden bent, voor een vreemde uw hand toegeklapt hebt; dan bent u verstrikt door de woorden van uw mond, dan bent u gevangen door de woorden van uw mond. Doe dan dit, mijn zoon! En red uzelf, omdat u in de hand van uw naaste gekomen bent; ga, verneder uzelf en dring aan bij uw naaste.", "2 Kron 10:8": "Maar hij liet de raad van de oudsten los, die zij hem gegeven hadden; en hij hield raad met de jongemannen die met hem opgegroeid waren, die voor hem stonden.", "Openb 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Joz 8:30-35": "Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal; zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers. Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "Job 15:33": "Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.", "Ezech 20:39": "En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.", "Job 26:6": "Het dodenrijk is naakt voor Hem, en geen bedekking is er voor het verderf.", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Ps 52:6": "U hebt alle woorden van verslinding lief, en een tong van het bedrog.", "Joh 10:14": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend.", "Joh 8:15": "U oordeelt naar het vlees; Ik oordeel niemand.", "1 Kor 1:20": "Waar is de wijze? Waar is de schriftgeleerde? Waar is de onderzoeker van deze eeuw? Heeft God de wijsheid van deze wereld niet dwaas gemaakt?", "Job 36:13": "En zij die met het hart huichelachtig zijn, stapelen toorn op; zij roepen niet, wanneer Hij hen gebonden heeft.", "Jes 57:8": "En achter de deur en de posten zet u uw gedenkteken; want u wendt u van Mij af, ontdekt uzelf en klimt op; u maakt uw slaapplaats wijd, en sluit een verbond met sommigen van hen; u hebt hun leger lief, in elke plaats die u ziet.", "Gen 18:9": "Toen zeiden zij tegen hem: Waar is Sara, uw vrouw? En hij zei: Zie, in de tent.", "Openb 14:1-5": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "Ps 45:9": "Al Uw kleren zijn mirre, en aloë, en kassie; uit de ivoren paleizen, van waar zij U verblijden.", "1 Kor 5:9": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders;", "Ex 21:15": "Wie zijn vader of zijn moeder slaat, die zal zeker gedood worden.", "Jer 3:25": "Wij liggen in onze schaamte, en onze schande overdekt ons, want wij hebben tegen de HEERE, onze God, gezondigd, wij en onze vaderen, van onze jeugd af aan tot op deze dag; en wij zijn de stem van de HEERE, onze God, niet gehoorzaam geweest.", "Ezech 2:6": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis.", "Jer 7:10": "en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Spr 24:30": "Ik ging voorbij de akker van een luiaard, en voorbij de wijngaard van een verstandeloos mens;", "Spr 5:15-21": "Drink water uit uw eigen bak, en stromend water uit het midden van uw eigen bron; Laat uw bronnen zich naar buiten verspreiden, en de waterbeken op de straten; Laat ze van u alleen zijn, en niet van een vreemde naast u.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Joh 8:57": "De Joden zeiden dan tegen Hem: U bent nog geen vijftig jaar, en hebt U Abraham gezien?", "1 Joh 1:10": "Als wij zeggen dat wij niet gezondigd hebben, dan maken wij Hem tot een leugenaar, en Zijn woord is niet in ons.", "Num 31:16": "Zie, dezen waren het, die door de raad van Bileam de kinderen van Israël ertoe brachten trouweloos te handelen tegen de HEERE, in de zaak van Peor; waardoor die plaag kwam onder de vergadering van de HEERE.", "Hebr 5:11": "Over hem hebben wij veel te zeggen, en het is moeilijk uit te leggen, omdat u traag geworden bent om te horen.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Spr 5:5": "Haar voeten dalen af naar de dood, haar treden houden het graf vast.", "Luk 18:18-23": "En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God. U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Luk 11:34-36": "De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister. Kijk dan uit, dat niet het licht dat in u is, duisternis is. Als dan uw hele lichaam verlicht is, zonder enig duister deel, dan zal het geheel verlicht zijn, zoals wanneer de lamp u met haar schijnsel verlicht.", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet.", "Jak 1:8": "Een dubbelhartig man is onstandvastig in al zijn wegen.", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Hos 8:2": "Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.", "Mal 1:6-14": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Spr 4:6-8": "Verlaat haar niet, en zij zal u behoeden; heb haar lief, en zij zal u bewaren. De wijsheid is het voornaamste; verkrijg dan wijsheid, en verkrijg verstand met al uw bezit. Verhef haar, en zij zal u verhogen; zij zal u eren, als u haar zult omhelzen.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "1 Kor 2:7-10": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was; Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben. Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Openb 17:3-5": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens. En de vrouw was bekleed met purper en scharlaken, en versierd met goud en kostbaar gesteente en parels, en had in haar hand een gouden drinkbeker, vol van gruwelen en van de onreinheid van haar hoererij. En op haar voorhoofd was een naam geschreven: namelijk Verborgenheid; het grote Babylon, de moeder van de hoererijen en van de gruwelen van de aarde.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "Jes 3:5": "En het volk zal gedrongen worden, de een zal zijn tegen de ander, en ieder tegen zijn naaste; de jongeling zal zich brutaal gedragen tegen de oude, de verachte tegen de eerlijke.", "Ps 78:36": "En zij vleiden Hem met hun mond, en logen tegen Hem met hun tong.", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Luk 8:14": "En wat tussen de dorens valt, dat zijn zij die gehoord hebben, en gaandeweg verstikt worden door de zorgen en rijkdom en genietingen van het leven, en geen rijpe vrucht voortbrengen.", "Luk 20:47": "die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Spr 12:8": "Ieder zal geprezen worden, naarmate zijn verstandigheid is; maar wie verkeerd van hart is, zal tot verachting wezen.", "Num 25:9": "Degenen nu die aan de plaag stierven, waren vierentwintigduizend.", "Spr 4:14": "Kom niet op het pad van de goddelozen, en betreed niet de weg van de bozen.", "Joh 16:1": "Deze dingen heb Ik tot u gesproken, opdat u niet geërgerd wordt.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Gal 5:21": "Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "Spr 1:4": "Om de eenvoudigen kloekzinnigheid te geven, de jongeling wetenschap en bedachtzaamheid.", "Spr 8:32": "Nu dan, kinderen! hoor naar Mij; want gelukkig zijn zij die Mijn wegen bewaren.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Spr 21:11": "Als men de spotter straft, wordt de eenvoudige wijs; en als men de wijze onderricht, neemt hij kennis aan.", "Jer 3:11": "Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "Spr 16:16": "Hoeveel beter is het wijsheid te verkrijgen dan goud, en voortreffelijker: verstand te verkrijgen dan zilver!", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "Rom 7:8": "Maar de zonde nam de gelegenheid door het gebod en heeft in mij alle begeerte bewerkt; want zonder de wet is de zonde dood.", "Job 19:18": "Ook versmaden de jonge kinderen mij; sta ik op, dan spreken zij mij tegen.", "2 Kon 9:30": "En Jehu kwam te Jizreël. Toen Izebel dat hoorde, blankette zij haar gezicht, en versierde haar hoofd, en keek uit het venster.", "Pred 3:11": "Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "Joh 3:20": "Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Spr 9:16": "Wie is eenvoudig? Hij keert zich hierheen; en tegen wie geen verstand heeft, zegt zij:", "Jer 3:1": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE.", "2 Kron 32:30": "Deze Jehizkia dichtte ook de bovenste waterloop van Gihon, en leidde die recht naar beneden naar het westen van de stad van David; want Jehizkia had voorspoed in al zijn werk.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Spr 17:24": "In het aangezicht van de verstandige is wijsheid; maar de ogen van de dwaas zijn aan het einde van de aarde.", "Spr 19:4": "Bezit brengt veel vrienden mee; maar de arme wordt van zijn vriend gescheiden.", "2 Kor 3:15": "Maar tot op de huidige dag, telkens als Mozes gelezen wordt, ligt er een deksel op hun hart.", "Zach 13:6": "En als iemand tegen hem zegt: Wat zijn deze wonden in uw handen? dan zal hij zeggen: Het zijn de wonden waarmee ik geslagen ben, in het huis van mijn liefhebbers.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Jes 44:18-20": "Zij weten niet, en begrijpen niet, want het heeft hun ogen dichtgesmeerd, zodat zij niet zien, en hun harten, zodat zij niet begrijpen. En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is? Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Spr 2:16": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;", "Ps 49:19": "Hoewel hij zijn ziel in zijn leven zegent, en zij u loven, omdat u uzelf goed doet;", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "Job 11:7": "Zult u de doorgronding van God vinden? Zult u tot de volmaaktheid toe de Almachtige vinden?", "Deut 32:28": "Want zij zijn een volk, dat door raadslagen verloren gaat, en er is geen verstand in hen.", "Spr 14:27": "De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.", "Spr 23:23": "Koop de waarheid, en verkoop ze niet, alsook wijsheid, en tucht, en verstand.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Matt 15:14": "Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Spr 6:24-29": "om u te bewaren voor de slechte vrouw, voor het gevlei van de tong van de vreemde vrouw. Begeer haar schoonheid niet in uw hart, en laat u door haar niet vangen met haar oogleden. Want door een vrouw die een hoer is, komt men tot een stuk brood; en de huisvrouw van een andere man jaagt op het kostbare leven.", "Ps 79:6": "Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de koninkrijken, die Uw Naam niet aanroepen.", "Ezech 27:7": "Fijn linnen met stiksel uit Egypte was uw uitgespreide zeil, dat het u tot een zeil zou zijn; hemelsblauw en purper, uit de eilanden van Elisa, was uw dek.", "Luk 16:18": "Ieder die zijn vrouw verlaat en een andere trouwt, doet overspel; en ieder die haar trouwt die door de man verlaten is, doet ook overspel.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Joh 6:52": "De Joden streden dan onder elkaar en zeiden: Hoe kan Hij ons Zijn vlees te eten geven?", "Jer 2:24": "Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Spr 9:18": "Maar hij weet niet dat daar de doden zijn; haar genode gasten zijn in de diepten van het dodenrijk.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Hos 9:4": "Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "Spr 10:1": "De spreuken van Salomo. Een wijze zoon verblijdt de vader; maar een dwaze zoon is het verdriet van zijn moeder.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "Jer 7:17": "Ziet u niet wat zij doen in de steden van Juda en op de straten van Jeruzalem?", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Jes 56:10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "2 Sam 15:7-9": "Aan het einde van veertig jaren gebeurde het dat Absalom tegen de koning zei: Laat mij toch gaan, en mijn gelofte, die ik de HEERE beloofd heb, te Hebron inlossen. Want uw knecht heeft een gelofte gedaan, toen ik te Gesur in Syrië woonde, en zei: Als de HEERE mij werkelijk terug naar Jeruzalem zal brengen, dan zal ik de HEERE dienen. Toen zei de koning tegen hem: Ga in vrede. Zo stond hij op, en ging naar Hebron.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Mark 13:12": "En de ene broer zal de andere overleveren tot de dood, en de vader het kind; en de kinderen zullen opstaan tegen de ouders, en hen doden.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Mark 7:6-8": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij. Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen; Want u laat het gebod van God los, en houdt vast aan de overleveringen van mensen, namelijk het wassen van kannen en drinkbekers; en vele andere dergelijke dingen doet u.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Luk 14:35": "Het is niet meer geschikt voor het land, en ook niet voor de mesthoop; men gooit het weg. Wie oren heeft om te horen, laat hij horen.", "Spr 1:21-33": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad; U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten? Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Spr 10:14": "De wijzen leggen kennis weg; maar de mond van de dwaas is de ondergang nabij.", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Jer 23:10": "Want het land is vol overspelers, want het land treurt vanwege de vloek, de weiden van de woestijn verdorren, omdat hun loop slecht is, en hun macht niet recht.", "2 Kron 2:4": "Zie, ik zal een huis bouwen voor de Naam van de HEERE, mijn God, om Hem te heiligen, om reukwerk van welriekende specerijen voor Zijn aangezicht aan te steken, en voor de bereiding van het voortdurende brood, en voor de brandoffers van de morgen en de avond, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden van de HEERE, onze God; dit is voor eeuwig een verordening in Israël.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Jak 2:14-26": "Wat voor nut heeft het, mijn broeders, als iemand zegt dat hij het geloof heeft, maar hij heeft de werken niet? Kan dat geloof hem zaligmaken? Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel; en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?", "Ps 139:8": "Als ik opvaar naar de hemel, U bent daar; of maak ik mijn bed in het rijk van de dood, zie, U bent daar.", "Jes 1:11-15": "Waartoe zal Mij de veelheid van uw slachtoffers zijn? zegt de HEERE; Ik ben zat van de brandoffers van de rammen, en het vet van de vette dieren, en heb geen lust aan het bloed van de stieren, noch van de lammeren, noch van de bokken. Wanneer u voor Mijn aangezicht komt te verschijnen, wie heeft dat van uw hand geëist, dat u Mijn voorhoven zou betreden? Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.", "2 Sam 22:6": "Banden van het graf omringden mij; strikken van de dood bejegenden mij.", "1 Kor 10:8": "En laten wij niet hoereren, zoals sommigen van hen gehoereerd hebben, en er vielen op één dag drieëntwintigduizend.", "Joh 3:31": "Wie van boven komt, is boven allen; wie uit de aarde is voortgekomen, die is uit de aarde en spreekt uit de aarde. Wie uit de hemel komt, is boven allen.", "Gal 4:19": "mijn kinderen, voor wie ik opnieuw weeën lijd totdat Christus gestalte in u krijgt.", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Spr 23:19": "Hoor toch, mijn zoon! en word wijs, en richt uw hart op de weg.", "Spr 27:14": "Wie zijn vriend zegent met luide stem, terwijl hij zich 's morgens vroeg opmaakt, het zal hem tot een vloek gerekend worden.", "Matt 7:21-23": "Niet ieder die tegen Mij zegt: Heere, Heere! zal ingaan in het Koninkrijk der hemelen, maar wie de wil doet van Mijn Vader, Die in de hemelen is. Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan? En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "1 Joh 3:6": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Hand 15:20": "maar hun schrijven dat zij zich onthouden van de dingen die door de afgoden besmet zijn, en van hoererij, en van het verstikte, en van bloed.", "Matt 23:16-24": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "Spr 9:14-17": "En zij zit aan de deur van haar huis, op een stoel, op de hoge plaatsen van de stad; om te roepen naar hen die op de weg voorbijgaan, die hun paden recht maken: Wie is eenvoudig? Hij keert zich hierheen; en tegen wie geen verstand heeft, zegt zij:", "Pred 10:12": "De woorden van de mond van een wijze zijn aangenaam; maar de lippen van een dwaas verslinden hemzelf.", "Matt 6:1": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is.", "Jer 16:10": "En het zal gebeuren, als u dit volk al deze woorden aanzegt, en zij tegen u zeggen: Waarom spreekt de HEERE al dit grote kwaad over ons, en wat is onze misdaad, en wat is onze zonde, die wij tegen de HEERE, onze God, gezondigd hebben?", "Spr 14:33": "Wijsheid rust in het hart van de verstandige; maar wat in het binnenste van de dwazen is, wordt bekend.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "Spr 14:6-8": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht. Ga weg van het gezicht van een dwaze man; want u zou bij hem geen lippen van kennis merken. De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Spr 15:7": "De lippen van de wijzen zullen de wetenschap uitstrooien; maar het hart van de zotten niet zo.", "Spr 5:3-22": "Want de lippen van de vreemde vrouw druppen honingzeem, en haar gehemelte is gladder dan olie. Maar het laatste van haar is bitter als alsem, scherp als een tweesnijdend zwaard. Haar voeten dalen af naar de dood, haar treden houden het graf vast.", "Spr 1:8": "Mijn zoon! hoor de tucht van uw vader, en verlaat de leer van uw moeder niet;", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "Job 31:9-12": "Als mijn hart verlokt is geweest tot een vrouw, of ik aan mijn naasten deur geloerd heb; Zo moet mijn huisvrouw met een ander malen, en anderen zich over haar krommen! Want dat is een schandelijke daad, en het is een misdaad bij de rechters.", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Joël 3:3": "En zij hebben het lot geworpen over Mijn volk, en een jongetje gegeven voor een hoer, en een meisje verkocht voor wijn, om die te drinken.", "1 Kor 13:9": "Want wij kennen ten dele, en wij profeteren ten dele;", "Spr 2:10-12": "Als de wijsheid in uw hart gekomen zal zijn, en de wetenschap voor uw ziel liefelijk zal zijn; Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden; Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Matt 6:22": "De lamp van het lichaam is het oog; als dan uw oog helder is, zal heel uw lichaam verlicht zijn;", "Spr 13:14-16": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood. Goed verstand geeft aangenaamheid; maar de weg van de trouwelozen is streng. Al wie verstandig is, handelt met kennis; maar een dwaas breidt dwaasheid uit.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Matt 25:3": "Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Rom 9:6": "Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Joh 7:17": "Als iemand de wil van Hem wil doen, zal hij van deze leer weten of ze uit God is, of dat Ik uit Mijzelf spreek.", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "2 Kor 3:14": "Maar hun gedachten zijn verhard geworden; want tot op deze huidige dag blijft datzelfde deksel bij het lezen van het Oude Testament, zonder weggenomen te worden, dat door Christus teniet gedaan wordt.", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "2 Tess 2:1": "En wij vragen u dringend, broeders, met het oog op de komst van onze Heere Jezus Christus, en onze samenkomst met Hem,", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Matt 5:32": "Maar Ik zeg u, dat ieder die zijn vrouw verlaat, anders dan vanwege hoererij, maakt dat zij overspel doet; en wie haar die verlaten is trouwt, doet overspel.", "Hos 8:13": "Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Matt 7:5": "Huichelaar! Haal eerst de balk uit uw eigen oog, en dan zult u goed genoeg zien om de splinter uit het oog van uw broeder te halen.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Ps 76:2": "God is bekend in Juda; Zijn Naam is groot in Israël.", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Luk 6:26": "Wee u, wanneer alle mensen goed van u spreken, want hun vaders deden hetzelfde met de valse profeten.", "1 Joh 2:19": "Zij zijn uit ons weggegaan, maar zij waren niet uit ons; want als zij uit ons geweest waren, dan zouden zij bij ons gebleven zijn; maar dit is gebeurd, opdat zij openbaar zouden worden, dat zij niet allen uit ons zijn.", "Jer 35:5-7": "En ik zette de kinderen van het huis van de Rechabieten koppen vol wijn en bekers voor, en ik zei tegen hen: Drink wijn. Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid. Ook zult u geen huis bouwen, geen zaad zaaien, geen wijngaard planten, noch hebben; maar u zult in tenten wonen al uw dagen, opdat u veel dagen leeft in het land waar u als vreemdeling verblijft.", "Pred 7:26": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.", "Spr 18:15": "Het hart van de verstandigen verwerft kennis, en het oor van de wijzen zoekt kennis.", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Mark 8:15": "En Hij gebood hun: Kijk uit, wees op uw hoede voor het zuurdeeg van de Farizeeën, en voor het zuurdeeg van Herodes.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "1 Kon 12:6-15": "En koning Rehabeam hield raad met de oudsten, die voor het aangezicht van zijn vader Salomo gestaan hadden toen hij nog leefde, en zei: Hoe raadt u mij, dat men dit volk antwoorden zal? En zij spraken tegen hem en zeiden: Als u vandaag een knecht van dit volk wilt zijn, en hen dient, en hun antwoordt, en tot hen goede woorden spreekt, dan zullen zij voor altijd uw knechten zijn. Maar hij liet de raad van de oudsten varen, die zij hem gegeven hadden; en hij hield raad met de jongemannen, die met hem opgegroeid waren, die voor zijn aangezicht stonden.", "Spr 16:20-24": "Wie op het woord verstandig let, zal het goede vinden; en wie op de HEERE vertrouwt, is gelukkig. Wie wijs van hart is, zal verstandig genoemd worden; en zoetheid van de lippen zal de lering vermeerderen. Het verstand van hen die het bezitten is een bron van leven; maar de tucht van de dwazen is dwaasheid.", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Hoogl 3:6": "Wie is zij, die daar opkomt uit de woestijn, als rookpilaren, berookt met mirre en wierook, en met allerlei poeder van de kruidenier?", "Luk 12:54-56": "En Hij zei ook tegen de menigten: Wanneer u een wolk ziet opkomen vanuit het westen, zegt u meteen: Er komt regen; en zo gebeurt het. En wanneer u de zuidenwind ziet waaien, zegt u: Er zal hitte komen; en het gebeurt. Huichelaars, het aanzien van de aarde en de hemel weet u te beoordelen; hoe komt het dan dat u deze tijd niet weet te beoordelen?", "Richt 16:20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "Spr 8:1-36": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "Pred 7:24": "Wat ver weg is, en zeer diep, wie zal dat vinden?", "1 Kor 13:11": "Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Hos 7:16": "Zij keren zich om, maar niet naar de Allerhoogste, zij zijn als een bedrieglijke boog; hun vorsten vallen door het zwaard, vanwege de woede van hun tong; dit zal hun bespotting zijn in het land Egypte.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Jak 1:22-24": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "2 Kor 8:7": "Zo dan, zoals u in alles overvloedig bent, in geloof, en in woord, en in kennis, en in alle naarstigheid, en in uw liefde tot ons, zorg ervoor, dat u ook in deze gave overvloedig bent.", "Gen 23:13": "En
