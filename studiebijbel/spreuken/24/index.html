eid is voor de dwaas te hoog; hij zal in de poort zijn mond niet opendoen.","8":"Wie erop bedacht is kwaad te doen, die zal men een meester in schandelijke plannen noemen.","9":"De gedachte van de dwaasheid is zonde; en een spotter is de mensen een gruwel.","10":"Toont u zich slap ten dage van de benauwdheid, dan is uw kracht nauw.","11":"Red hen die ter dood gegrepen zijn; want zij wankelen ter doding, als u zich onthoudt.","12":"Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.","13":"Eet honing, mijn zoon! want hij is goed, en honingzeem is zoet voor uw gehemelte.","14":"Zo is de kennis van de wijsheid voor uw ziel; als u ze vindt, zal er beloning zijn, en uw verwachting zal niet afgesneden worden.","15":"Loer niet, o goddeloze! op de woning van de rechtvaardige; verwoest zijn legerplaats niet.","16":"Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.","17":"Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;","18":"Opdat de HEERE het niet ziet, en het kwaad is in Zijn ogen en Hij Zijn toorn van hem afkeert.","19":"Ontsteek u niet over de boosdoeners; wees niet jaloers op de goddelozen.","20":"Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.","21":"Mijn zoon! vrees de HEERE en de koning; vermeng u niet met hen, die naar verandering staan;","22":"Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?","23":"Ook deze *spreuken* zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed.","24":"Wie tegen de goddeloze zegt: U bent rechtvaardig; die zullen de volken vervloeken, de naties zullen hem verafschuwen.","25":"Maar voor hen die *hem* bestraffen, zal liefelijkheid zijn; en de zegen van het goede zal op hen komen.","26":"Men zal de lippen kussen van hem die rechte woorden antwoordt.","27":"Regel uw werk daarbuiten, en maak het voor u gereed op de akker, en bouw daarna uw huis.","28":"Wees niet zonder reden getuige tegen uw naaste; want zou u misleiden met uw lip?","29":"Zeg niet: Zoals hij mij gedaan heeft, zo zal ik hem doen; ik zal ieder vergelden naar zijn werk.","30":"Ik ging voorbij de akker van een luiaard, en voorbij de wijngaard van een verstandeloos mens;","31":"En zie, hij was helemaal opgeschoten van distels; zijn gedaante was met netels bedekt, en zijn stenen scheidsmuur was afgebroken.","32":"Toen ik dat aanschouwde, nam ik het ter harte; ik zag het, *en* nam onderwijzing aan;","33":"Een weinig van het slapen, een weinig van het sluimeren, en een weinig handen vouwen, al neerliggende;","34":"Zo zal uw armoede *u* overkomen, *als* een wandelaar, en uw velerlei gebrek als een gewapend man."},"SV":{"1":"Zijt niet nijdig over de boze lieden, en laat u niet gelusten, om bij hen te zijn.","2":"Want hun hart bedenkt verwoesting, en hun lippen spreken moeite.","3":"Door wijsheid wordt een huis gebouwd, en door verstandigheid bevestigd;","4":"En door wetenschap worden de binnenkameren vervuld met alle kostelijk en liefelijk goed.","5":"Een wijs man is sterk; en een man van wetenschap maakt de kracht vast.","6":"Want door wijze raadslagen zult gij voor u den krijg voeren, en in de veelheid der raadgevers is de overwinning.","7":"Alle wijsheid is voor den dwaze te hoog; hij zal in de poort zijn mond niet opendoen.","8":"Die denkt om kwaad te doen, dien zal men een meester van schandelijke verdichtselen noemen.","9":"De gedachte der dwaasheid is zonde; en een spotter is den mens een gruwel.","10":"Vertoont gij u slap ten dage der benauwdheid, uw kracht is nauw.","11":"Red degenen, die ter dood gegrepen zijn; want zij wankelen ter doding, zo gij u onthoudt.","12":"Wanneer gij zegt: Ziet, wij weten dat niet; zal Hij, Die de harten weegt, *dat* niet merken? En Die uwe ziel gadeslaat, zal Hij het niet weten? Want Hij zal den mens vergelden naar zijn werk.","13":"Eet honig, mijn zoon! want hij is goed, en honigzeem is zoet voor uw gehemelte.","14":"Zodanig is de kennis der wijsheid voor uw ziel; als gij ze vindt, zo zal er beloning wezen, en uw verwachting zal niet afgesneden worden.","15":"Loer niet, o goddeloze! op de woning des rechtvaardigen; verwoest zijn legerplaats niet.","16":"Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad nederstruikelen.","17":"Verblijd u niet, als uw vijand valt; en als hij nederstruikelt, laat uw hart zich niet verheugen;","18":"Opdat het de HEERE niet zie, en het kwaad zij in Zijn ogen en Hij Zijn toorn van hem afkere.","19":"Ontsteek u niet over de boosdoeners; zijt niet nijdig over de goddelozen.","20":"Want de kwade zal geen beloning hebben, de lamp der goddelozen zal uitgeblust worden.","21":"Mijn zoon! vrees den HEERE en den koning; vermeng u niet met hen, die naar verandering staan;","22":"Want hun verderf zal haastelijk ontstaan; en wie weet hun beider ondergang?","23":"Deze *spreuken* zijn ook van de wijzen. Het aangezicht in het gericht te kennen, is niet goed.","24":"Die tot den goddeloze zegt: Gij zijt rechtvaardig; dien zullen de volken vervloeken, de natiën zullen hem gram zijn.","25":"Maar voor degenen, die *hem* bestraffen, zal liefelijkheid zijn; en de zegen des goeds zal op hen komen.","26":"Men zal de lippen kussen desgenen, die rechte woorden antwoordt.","27":"Beschik uw werk daarbuiten, en bereid het voor u op den akker, en bouw daarna uw huis.","28":"Wees niet zonder oorzaak getuige tegen uw naaste; want zoudt gij verleiden met uw lip?","29":"Zeg niet: Gelijk als hij mij gedaan heeft, zo zal ik hem doen; ik zal een ieder vergelden naar zijn werk.","30":"Ik ging voorbij den akker eens luiaards, en voorbij den wijngaard van een verstandeloos mens;","31":"En ziet, hij was gans opgeschoten van distelen; zijn gedaante was *met* netelen bedekt, en zijn stenen scheidsmuur was afgebroken.","32":"Als ik dat aanschouwde, nam ik het ter harte; ik zag het, *en* nam onderwijzing aan;","33":"Een weinig slapens, een weinig sluimerens, en weinig handvouwens, al nederliggende;","34":"Zo zal uw armoede *u* overkomen, *als* een wandelaar, en uw velerlei gebrek als een gewapend man."},"KJV":{"1":"Be not thou envious against evil men, neither desire","2":"For their heart studieth destruction, and their lips talk of mischief.","3":"Through wisdom is an house builded; and by understanding it is established:","4":"And by knowledge shall the chambers be filled with all precious and pleasant riches.","5":"A wise man *is* strong; yea, a man of knowledge increaseth strength.","6":"For by wise counsel thou shalt make thy war: and in multitude of counsellors *there is* safety.","7":"Wisdom *is* too high for a fool: he openeth not his mouth in the gate.","8":"He that deviseth to do evil shall be called a mischievous person.","9":"The thought of foolishness *is* sin: and the scorner *is* an abomination to men.","10":"*If* thou faint in the day of adversity, thy strength *is* small.","11":"If thou forbear to deliver *them that are* drawn unto death, and *those that are* ready to be slain;","12":"If thou sayest, Behold, we knew it not; doth not he that pondereth the heart consider *it*? and he that keepeth thy soul, doth *not* he know *it*? and shall *not* he render to *every* man according to his works?","13":"My son, eat thou honey, because *it is* good; and the honeycomb, *which is* sweet to thy taste:","14":"So *shall* the knowledge of wisdom *be* unto thy soul: when thou hast found *it*, then there shall be a reward, and thy expectation shall not be cut off.","15":"Lay not wait, O wicked *man*, against the dwelling of the righteous; spoil not his resting place:","16":"For a just *man* falleth seven times, and riseth up again: but the wicked shall fall into mischief.","17":"Rejoice not when thine enemy falleth, and let not thine heart be glad when he stumbleth:","18":"Lest the LORD see *it*, and it displease him, and he turn away his wrath","19":"Fret not thyself because of evil *men*, neither be thou envious at the wicked;","20":"For there shall be no reward to the evil *man*; the candle of the wicked shall be put out.","21":"My son, fear thou the LORD and the king: *and* meddle not with them that are given to change:","22":"For their calamity shall rise suddenly; and who knoweth the ruin of them both?","23":"These *things* also *belong* to the wise. *It is* not good to have respect of persons in judgment.","24":"He that saith unto the wicked, Thou *art* righteous; him shall the people curse, nations shall abhor","25":"But to them that rebuke *him* shall be delight, and a good blessing shall come","26":"*Every man* shall kiss *his* lips that giveth a right answer.","27":"Prepare thy work without, and make it fit for thyself in the field; and afterwards build thine house.","28":"Be not a witness against thy neighbour without cause; and deceive *not* with thy lips.","29":"Say not, I will do so to him as he hath done to me: I will render to the man according to his work.","30":"I went by the field of the slothful, and by the vineyard of the man void of understanding;","31":"And, lo, it was all grown over with thorns, *and* nettles had covered the face thereof, and the stone wall thereof was broken down.","32":"Then I saw, *and* considered *it* well: I looked upon *it, and* received instruction.","33":"*Yet* a little sleep, a little slumber, a little folding of the hands to sleep:","34":"So shall thy poverty come *as* one that travelleth; and thy want as an armed man."}},"tsk":{"1":[{"kopje":"niet","refs":["Spr 24:19","Spr 3:31","Spr 23:17","Ps 37:1","Ps 37:7","Ps 73:3","Gal 5:19-21","Jak 4:5","Jak 4:6"]},{"kopje":"en laat u niet","refs":["Spr 1:11-15","Spr 13:20","Gen 13:10-13","Gen 19:1-11","Ps 26:9"]}],"3":[{"kopje":"wijsheid","refs":["Spr 9:1","Spr 14:1","1 Kor 3:9"]},{"kopje":"wordt","refs":["2 Sam 7:26","Jer 10:12","Kol 2:7"] 01\">kiss</span> his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> that <span class=\"wl wl-kjv\" data-code=\"H7725\">giveth</span> a <span class=\"wl wl-kjv\" data-code=\"H5228\">right</span> answer.","27":"<span class=\"wl wl-kjv\" data-code=\"H3559\">Prepare</span> thy <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without,</span> and make it <span class=\"wl wl-kjv\" data-code=\"H6257\">fit</span> for thyself in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterwards</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> thine house.","28":"Be not a <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> against thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> without <span class=\"wl wl-kjv\" data-code=\"H2600\">cause;</span> and <span class=\"wl wl-kjv\" data-code=\"H6601\">deceive</span> not with thy lips.","29":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> not, I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so to him as he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to me: I will <span class=\"wl wl-kjv\" data-code=\"H7725\">render</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> according to his work.","30":"I <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> by the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">slothful,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> of the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2638\">void</span> of understanding;","31":"And, lo, it was all grown <span class=\"wl wl-kjv\" data-code=\"H5927\">over</span> with <span class=\"wl wl-kjv\" data-code=\"H7063\">thorns,</span> and <span class=\"wl wl-kjv\" data-code=\"H2738\">nettles</span> had <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> <span class=\"wl wl-kjv\" data-code=\"H1444\">wall</span> thereof was broken down.","32":"Then I <span class=\"wl wl-kjv\" data-code=\"H2372\">saw,</span> and considered it <span class=\"wl wl-kjv\" data-code=\"H7896\">well:</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> upon it, and <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> instruction.","33":"Yet a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H8572\">slumber,</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H2264\">folding</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> to sleep:","34":"So shall thy <span class=\"wl wl-kjv\" data-code=\"H7389\">poverty</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> as one that <span class=\"wl wl-kjv\" data-code=\"H1980\">travelleth;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4270\">want</span> as an <span class=\"wl wl-kjv\" data-code=\"H4043\">armed</span> man."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"niet nijdig","tekst":"Zie Psa 37:1 ."},{"catchword":"de boze lieden,","tekst":"Hebreeuws, mannen der boosheid, of des kwaads; dat is, mensen die de boosheid toegedaan, of tot alle kwaad genegen zijn. Zie Job 11:11 ."}],"2":[{"catchword":"verwoesting,","tekst":"Dat is, schade en verderf, dat zij hunnen naaste willen aandoen, ja ook alzo over zichzelven brengen."}],"3":[{"catchword":"huis","tekst":"Versta dit, niet alleen van een stoffelijk huis, maar voornamelijk van de huishouding en van de middelen, waardoor een huis, of huisgezin, onderhouden wordt. Alzo is het woord huis genomen, Gen 39:4 , en het woord bouwen, boven Pro 14:1 ; zie de aantekening. De zin is dat een goede huishouding door wijsheid en verstand wordt aangesteld en tot groot voordeel onderhouden."}],"5":[{"catchword":"sterk;","tekst":"Hebreeuws, in sterkte; dat is met sterkte begaafd. Versta, niet de uitwendige en lichamelijke sterkte, maar de inwendige en geestelijke."},{"catchword":"maakt de kracht","tekst":"Dat is, indien hij uiterlijke sterkte heeft, de wetenschap maakt hem nog sterker. Daarom overtreft hij ook een, die sterk is en geen verstand heeft. In een woord: wijsheid is beter dan sterkte. Vergelijk boven Pro 21:22 ; Ecc 9:15 ."}],"6":[{"catchword":"wijze","tekst":"Zie van het Hebreeuwse woord Job 37:12 ."},{"catchword":"voor u den krijg","tekst":"Dat is, u ten goede, of tot uw best en het welvaren van het land."},{"catchword":"veelheid","tekst":"Te weten, van goede raadgevers. Zie boven Pro 18:22 , of in de grootheid; dat is waardigheid, bekwaamheid en kloekheid derzelve."},{"catchword":"overwinning","tekst":"Of, behoudenis. Zie van de betekenis van het Hebreeuwse woord teschuah, 2Sa 8:6 ."}],"7":[{"catchword":"wijsheid","tekst":"Hebreeuws, wijsheden."},{"catchword":"te hoog;","tekst":"Dat is, boven zijn begrip. Maar den verstandigen is de wijsheid licht, boven Pro 14:6 ."},{"catchword":"poort","tekst":"Dat is, in het raadhuis, of de vergadering der heren. Zie Gen 22:17 ."},{"catchword":"niet opendoen","tekst":"Te weten om iets bijzonders voort te brengen, dewijl hij zonder wijsheid en raad is. Vergelijk de aantekening Job 33:2 ."}],"8":[{"catchword":"meester","tekst":"Dat is, uitvinder en zogenaamde kunstenaar, die tot schelmerij genegen is, en dezelve in het werk weet te stellen. Zie van het Hebreeuwse woord Baäl, Gen 14:13 ."},{"catchword":"schandelijke","tekst":"Zie van het Hebreeuwse woord Job 21:27 ."}],"9":[{"catchword":"der dwaasheid","tekst":"Dat is, van den mens, die dwaas is. Vergelijk Job 24:20 , en Job 35:13 . Of, de dwaze gedachte."}],"10":[{"catchword":"slap","tekst":"Te weten dat gij onder den tegenspoed en de aanvechtingen bezwijkt."},{"catchword":"der benauwdheid,","tekst":"Dat is, als men allerbest proeve van zijne sterkte moet hebben."},{"catchword":"nauw","tekst":"Dat is, klein, gering, benepen, ingekrompen, ingedwongen. vs.10 wordt ook aldus vertaald: Vertoont gij u slap; dat is, onachtzaam om wijsheid te leren en zorgeloos om God te vrezen, uwe kracht zal ten dage uwer benauwdheid nauw of benauwd wezen."}],"11":[{"catchword":"Red","tekst":"Dit raakt eigenlijk de rechters en de overheden, die vanwege hun ambt gehouden zijn de onnozelen te beschermen, ja ook zelfs als ze door gegeven vonnis ter dood veroordeeld zijn, zo dan eindelijk hunne onschuld bleek. Voorts raakt het ook alle vromen in het algemeen, die, naar den eis van hun beroep, door de wettelijke middelen schuldig zijn de onnozelen voor te staan en te helpen."},{"catchword":"gegrepen zijn;","tekst":"Namelijk ten onrechte."},{"catchword":"want zij","tekst":"Dat is, zij staan in gevaar om gedood te worden. Anders: Want zoudt gij u onthouden van degenen, die worden weggerukt om gedood te worden? Deze vraag loochent sterkelijk dat dit zou mogen nagelaten worden door degenen, die ambtshalve door wettelijke middelen zulks te doen toestaat."},{"catchword":"wankelen","tekst":"Of, worden weggevoerd of hellen der doding."}],"12":[{"catchword":"wij weten dat niet;","tekst":"Namelijk dat hij onschuldig is, of hoe wij hem zouden mogen helpen. Anders: wij kennen hem of dezen niet."},{"catchword":"Die de harten weegt,","tekst":"Dat is, God; zie boven Pro 16:2 en de aantekening."},{"catchword":"ziel gadeslaat,","tekst":"Te weten, niet alleen ten opzichte van den tijdelijken, maar ook van den eeuwigen dood."},{"catchword":"niet weten?","tekst":"Namelijk of uw verontschuldiging waarachtig en wel gegrond is."},{"catchword":"Hij zal den mens","tekst":"Te weten, God, die de harten weegt, enz."}],"13":[{"catchword":"honig,","tekst":"De honig was in Palestina een algemene en zeer aangename spijs. Vergelijk Exo 3:8 . De profeet verklaart nu dat men dien wel nuttigen mocht voor het lichaam, maar dat men voornamelijk moest trachten naar de wijsheid, die ene spijs is, aangenaam voor de ziel."},{"catchword":"gehemelte","tekst":"Dat is, in uwen mond. Het gehemelte wordt de smaak toegeschreven. Job 12:11 , en Job 34:3 ."}],"14":[{"catchword":"Zodanig","tekst":"Anders: alzo kan de wijsheid voor uwe ziel."},{"catchword":"vindt,","tekst":"Dat is, bekom, of verkrijg. Alzo boven Pro 8:9 . Zie Gen 26:12 ."},{"catchword":"beloning","tekst":"Hebreeuws, een laatste, of achterste; dat is, een goed naloon. Zie onder vs.20."},{"catchword":"verwachting","tekst":"Dat is, het goed, dat gij van de genade Gods verwacht. Zie Job 5:16 ."}],"15":[{"catchword":"verwoest","tekst":"Hij verbiedt, nevens de listige aanslagen ook het openbaar geweld."}],"16":[{"catchword":"zevenmaal","tekst":"Dat is, dikwijls; een zeker getal voor een onzeker; zie Lev 26:8 ."},{"catchword":"vallen,","tekst":"Te weten, in ellenden en zwarigheden. Alzo in vs.17, idem Psa 37:24 ; of ook in zonden en gebreken, in welke de vromen ook worden gezegd te vallen; 1Co 10:12 ."},{"catchword":"opstaan;","tekst":"Dat is, daaruit verlost en opgeholpen worden, te weten door Gods genadigen bijstand, Job 5:19 ; Psa 34:20 ."},{"catchword":"kwaad","tekst":"Te weten, der straf en der tegenheid; dat is, zullen daarin zo gestort worden, dat zij niet weder zullen kunnen opstaan."}],"17":[{"catchword":"valt;","tekst":"Te weten, in enig ongeluk of zwarigheid."}],"18":[{"catchword":"kwaad zij","tekst":"Dat is, hem mishage. Zie Gen 21:11 ."},{"catchword":"afkere","tekst":"Te weten om denzelven over u te zenden."}],"20":[{"catchword":"beloning","tekst":"Versta, geen goede of gewenste beloning, of geen goed einde. Zie boven Pro 18:22 . Hebreeuws, achterste, of uiterste, of einde. Dan, het Hebreeuwse woord is ook voor loon genomen. Zie boven Pro 23:18 . Anders: nakomelingen; zal gene nakomelingen hebben, en zo hij ze krijgt, zullen ze vergaan; waarop het volgende in vs.20 van sommigen geduld wordt."},{"catchword":"de lamp","tekst":"Zie boven Pro 20:20 , Job 18:6 ."}],"21":[{"catchword":"hen,","tekst":"Hebreeuws, met degenen, die veranderen; dat is, die veranderingen en nieuwigheden zoeken, afwijkende van de gehoorzaamheid Gods en van hun wettelijke overheid, en zich tegen dezelve opmaken."}],"22":[{"catchword":"wie weet","tekst":"Alsof hij zeide: Hun zal ene straf overkomen waar zij niet om denken, of waarmen men kwalijk kan weten of gissen hoe zwaar dat ze zal wezen."},{"catchword":"beider","tekst":"Zowel degenen, die God niet vrezen, als degenen, die de overheid niet ontzien. Of, het ongeluk van die twee; te weten, dat hun zo van God als van den koning toegezonden zal worden."}],"23":[{"catchword":"van de wijzen","tekst":"Of [behoren] tot de wijzen, of voor de wijzen, of raken de wijzen."},{"catchword":"Het aangezicht","tekst":"Zie Deu 1:17 , en de aantekening en Deu 16:19 . Hetzelfde wordt elders genoemd het aangezicht aannemen en vereren. Zie Lev 19:15 , en de aantekening."},{"catchword":"is niet goed","tekst":"Dat is, het deugt niet, het is zeer kwaad. Zie boven Pro 17:26 ."}],"24":[{"catchword":"volken","tekst":"Te weten die goed zijn, God vrezen, de boosheid haten en de vroomheid liefhebben. Vergelijk boven Pro 18:22 , op het woord vrouw."}],"25":[{"catchword":"hem","tekst":"Te weten, den goddeloze."},{"catchword":"liefelijkheid","tekst":"Dat is, het zal hun welgaan, hun zal stof van blijdschap en vermaking gegeven worden."},{"catchword":"zegen","tekst":"Dat is, alle goed zal hun wedervaren van God en de mensen."},{"catchword":"hem komen","tekst":"Te weten, die den goddeloze bestraffen."}],"26":[{"catchword":"Men zal de lippen","tekst":"De zin is dat degene, die goede, ware en stichtelijke dingen ter bekwamer tijd voortbrengt, geëerd en bemind zal zijn door degenen, die hem horen, even alsof zij hem met een vriendelijken kus ontvingen. Eertijds was het kussen een teken van eerbieding en bewijs van goedwilligheid. Zie Gen 27:26 , en Gen 41:40 . Anders: hij kust de lippen die rechte woorden antwoordt. Dat is, hij bewijst de meeste vriendschap."}],"27":[{"catchword":"Beschik","tekst":"Dat is, gedenk eerst uw huis te voorzien van hetgeen nodig is om eerlijk den kost te krijgen, als door middel van de landbouwing; daarna mag men denken op hetgeen tot de vermaking van de huisgenoten of tot sieraad van het huis zou mogen dienen."},{"catchword":"bouw","tekst":"Versta dit niet zozeer van het bouwen van een huis, als van de opschikking en stoffering van hetzelve."}],"28":[{"catchword":"zonder oorzaak","tekst":"Dat is, zonder redelijken en merkelijken nood, die een mens verbindt om getuigenis te geven, of zonder goede zekerheid van hetgeen er te getuigen is."},{"catchword":"verleiden","tekst":"Te weten met een valse of onvaste getuigenis te geven, of anderszins met getuigen te misdoen."},{"catchword":"lip?","tekst":"Dat is, met uwe woorden en redenen; zie Job 2:10 ."}],"30":[{"catchword":"een verstandeloos","tekst":"Zie boven Pro 6:32 ."}],"31":[{"catchword":"hij was gans","tekst":"Te weten, de akker of wijngaard."},{"catchword":"stenen scheidsmuur","tekst":"In Palestina worden de velden, akkers en wijngaarden meest afgeschoten met enige lichte muren van samengestapelde stenen zonder enige kalk of gruis van steen, opdat het wild gedierte die niet zou beschadigen. Vergelijk Num 22:24 ; Ezr 9:9 ; Psa 80:13 ."}],"32":[{"catchword":"nam ik het","tekst":"Hebreeuws, zette ik mijn hart [daarop]; dat is, ik nam het waar en betrachtte het. Vergelijk de manier van spreken met Job 1:8 , en de aantekening daarop."},{"catchword":"nam onderwijzing","tekst":"Dat is, ik werd met eens anderen mans schade wijzer."}],"33":[{"catchword":"Een weinig slapens,","tekst":"Zie de verklaring van vs.33 en het volgende boven Pro 6:10-11 ."}],"34":[{"catchword":"een gewapend","tekst":"Hebreeuws, een man des schilds."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Be not (thou) envious against wicked men; [See Psal.37.on verse 1. And 73.3. above chap.3.31. and 23.17. before verse 19. Hebr. Men of wickedness, or, of evil; that is, men that are addicted unto wickedness, or that proud and bent to all evil. See Job 11.on verse 11.] and covet not to be with them."}],"2":[{"catchword":null,"tekst":"For their heart deviseth desolation, [That is, harm, and destruction, which they intend to do unto their neighbour, yea will also thereby bring the same upon themselves] and their lips speak trouble. [Compare Psal.107.]"}],"3":[{"catchword":null,"tekst":"Through wisdom is an house builded; and by, understanding (it is) established. [Understand this not onely of a material house, but principally of house-keeping, and of the means, whereby an house, or family is maintained. So is the word house taken, Gen 39:4. and the word building, or, to build, above chap.4.1. See the Annot. The meaning is, that a good house-keeping is ordered and managed by wisdom and understanding, and is thereby great advanced and maintained.]"}],"4":[{"catchword":null,"tekst":"And by knowledge are the inner chambers filled with all precious and pleasant goods."}],"5":[{"catchword":null,"tekst":"A wise man is strong: [Hebr. In strength: that is, indued with strength. Understand not the outward and bodily strength, but the inward and spiritual strength] and a man of knowledge maketh strength sure. [that is, if so be he have outward strength, knowledge will make him yet stronger. Therefore he excellent also a man that is, strong, and yet hath no understanding. In brief, wisdom is better then strength. Compare above chap.21.22. Ecc 9:15.]"}],"6":[{"catchword":null,"tekst":"For by wise counsels [See of the Hebrew word, Job 37:12.] shalt thou wage war for thy self: [That is, for thy good, or for thy benefit, and the welfare of the Land] and in the multitude of counsellors [to wit, of good counsellors. See above chap.18.on verse 22. Or, in the greatness; that is, worthiness, sitness, and wisdom of them] is the victory. [Or, safety. See of the signification of the Hebrew word teschuah, 2 Sam.8. on verse 6. Compare above chap.11.14. and 15 22. And 20.18.]"}],"7":[{"catchword":null,"tekst":"All wisdom [Hebr. Wisdoms] is too high for the fool: [that is, is above his apprehension: but wisdom is easy to a man of understanding, above chap.14.6.] he shall not open his mouth [to wit, to utter some special and excellent matter, forasmuch as he is without wisdom and counsel. Compare Job 33. And the annot.on verse 2.] in the gate, [that is, in the Senate-house, or in the assembly of Lords. See Gen.22.on verse 17.]"}],"8":[{"catchword":null,"tekst":"He that deviseth to do evil, he shall be called a Master [That is, a practitioner, and an evil artificer, that is prone to villainy and mischief, and knoweth how to put it in practice. See of the Hebrew word Baal, Gen.14.on verse 13.] of wicked intentions. [See of the Hebrew word, Job 21.on verse 27.]"}],"9":[{"catchword":null,"tekst":"The thought of foolishness [That is, of the man, that is foolish. Compare Job 24.on verse 20. And 35.on verse 13. Or, the foolish thought] is sin: and a scorner is an abomination to man."}],"10":[{"catchword":null,"tekst":"(If) thou shew thy self feeble [To wit, so that thou faintest under adversity and temptations] in the day of distress, [that is, when a man should have the best trial of his strength is narrow. [that is, small, mean, nipt, shrunk, restrained. This verse is also thus rendered: (If) thou shew thy self slack, that is, negligent to learn wisdom, and careless to fear God, thy strength shall be narrow, or, strained in the day of thy distress]"}],"11":[{"catchword":null,"tekst":"deliver them that are taken unto death: [Namely, wrongfully. This doth properly concern Judges, and Magistrates, who by virtue of their office are bound to defend the innocent, yea even when they are condemned to die, and have the sentence of death past upon them, if so be that at last their innocency may appear. Compare Psal.82.4. Moreover, it concerneth also all godly people in general, who according to the nature and condition of their calling, and by lawful means, are bound to protect and help those that be innocent] for the reel unto the slaughter, [or, are carried away, or, bend down to the slaughter; that is, they are in danger to be put to death,] if thou refrain thy self. [Oth. For shouldest thou refrain thy self from those that are haled away to be put to death? This question implyeth a strong denial, that this thing should be neglected by those, who by reason of their office are bound to use all good means for the performing of it]"}],"12":[{"catchword":null,"tekst":"When thou sayest, Behold we know it not; [Namely, that he is innocent, or how we may be able to help him. Oth. We know him not or, we know not this man] shall not he that pondereth the heart, [that is, God. See above chap.16.2. and the annotate.] consider (it)? And he that looketh to thy soul, [to wit, not onely in respect of temporal, but also of eternal death] shall not know it? [namely, whether thy excuse be true, and well-grounded] for he [to wit, God, who pondereth the hearts, &c.] will reward a man according to his work. [Compare Job 34:11. Psal.62.13. Jer 32:19. Rom 2:6. Rev 22:12.]"}],"13":[{"catchword":null,"tekst":"Eat honey, my son, for it is good: and the honeycomb is sweet for the palate. [That is, in thy mouth. Unto the palate taste is attributed and ascribed, Job 12:1. and 34.3. honey was a common, and a very dainty and pleasant food in Palestina. Compare Exod.3.on verse 8. Now the prophet relateth, that it might indeed be eaten for the good, and nourishment of the body, but that men should chiefly and principally seek and endeavour after wisdom, which is a most pleasant and acceptable food for the soul]"}],"14":[{"catchword":null,"tekst":"Such is the knowledge of wisdom for thy soul: [Oth. So know wisdom (to be) for thy soul. Compare Psal.19.11. and 119.103.] when thou findest it, [that it, gettest, or obtainest it. So above chap.8.9. See Gen.26.on verse 12.] then there shall be a reward: [Hebr. A last, or, hindermost: that is, a good after-reward. See below verse 20. Compare also above chap.23.18.] and thine expectation [that is, the good which thou expectest and lookest for of Gods free grace. See Job 5.on vers.16.] shall not be cut off."}],"15":[{"catchword":null,"tekst":"Lurk not, O wicked man, for the dwelling of the righteous: waste not his ramping place. [He forbiddeth next to crafty devices, also open violence.]"}],"16":[{"catchword":null,"tekst":"For the righteous man shall fall [To wit, into miseries and troubles. So in the next verse also, Psal.37.24. Or also into sins, and infirmities, whereunto also the godly are also said to fall, 1 Cor.10.12.] seven times [that is, often, a certain number for an uncertain. See Lev.26.on verse 8.] and rise up (again): [that is, be delivered and helped out, to wit, by Gods gracious assistance, Job 5:19. Psal.34.20.] but the wicked shall stumble down into evil. [to wit, into the evil of punishment, and of adversity; that is, they shall be so cast down, as that they shall not be able to rise again."}],"17":[{"catchword":null,"tekst":"Be not glad when thine enemy falleth: [To wit, into mischief, or trouble. Compare Job 13:29. above chapter 17.5.] and let not thine heart rejoice, when he staumbleth down;"}],"18":[{"catchword":null,"tekst":"Lest the LORD see it, and (it) be evil in his eyes: [That is, displease him. See Genesis 21.on verse 11.] and (he) turn away his wrath from him. [To wit, to turn it against thee.]"}],"19":[{"catchword":null,"tekst":"Kindle not thy self because of evil doers: be not envious against the wicked: [Compare Psa 37:1. and 73.3. above chapter 3.31. and 23.17. and here verse 1.]"}],"20":[{"catchword":null,"tekst":"For the evil (man) shall have no reward: [Meaning no good, or desired reward, or, no good end. See above chapter 18.on verse 22. Heb. Hindermost, or, uttermost, or, end. But the Hebrew word is also taken for reward. See above chapter 23.on verse 18. Oth.posterity; the wicked man shall have no posterity, and if he get any, they shall perish, whereunto the following verse is applied by some] the lamp of the wicked shall be put out. [see ab.ch.20.on v.20. Job 18.on v.6. and Pro 13:9.]"}],"21":[{"catchword":null,"tekst":"My son, fear the LORD, and the King: and mingle not thy self with them that stand for a changed. [Hebr. With them that change. That is, those that are addicted to changes, and novelties, departing from the obedience which they owe unto God, and to their lawful Magistrate, and rising up in rebellion against them.]"}],"22":[{"catchword":null,"tekst":"For their destruction shall rise suddenly; and who knoweth the ruine of them both? [As if he had said; A judgement shall light upon them, whereof they had not the least thought: or whereof a man is not able know or conjecture, how heavy it shall be. Of them both; to wit, as well of those that fear not God, as of those that doe not stand in awe of the civil Magistrate. Or, the mischief of those two: to wit, which shall be sent upon them both by God, and the King.]"}],"23":[{"catchword":null,"tekst":"These (proverbs) are also (the proverbs) of the wise. [Or, (belong) to the wise, or (are) for the wise, or, concern the wise] To know the face in judgement [see Deut.1.17. and the annot. Also ch.16.19. The same is elsewhere called accepting, and honouring the face. See Lev.19.15. and the annot. Compare also Exo 23:3,6. Deut.16.19. above chapter 18.5. and below chapter 28.21. Joh 7:24. Jas 2:1.] is not good. [that is, it is evil, it is odious. See above chapter 17.on verse 26.]"}],"24":[{"catchword":null,"tekst":"He that saith unto the wicked, Thou art righteous; [Compare above chapter 17.15. Isa 5:23. and 24. 24.] him shall the people [to wit, that are good, and godly, that hate wickedness, and love // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {

    const engels = D.tsk_kjv[n];

    } else {

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
