n de overtreding van een boze man is een valstrik; maar de rechtvaardige juicht en is blij.","7":"De rechtvaardige neemt kennis van de rechtszaak van de armen; maar de goddeloze begrijpt die kennis niet.","8":"Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.","9":"Een wijs man, die met een dwaas man een geschil voert, wordt of boos of belachen, en toch komt er geen rust.","10":"Bloeddorstige mensen haten de vrome; maar de oprechten zoeken zijn leven.","11":"Een dwaas laat zijn hele geest de vrije loop, maar de wijze weerhoudt die en houdt hem in.","12":"Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.","13":"De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.","14":"Een koning die de armen in trouw recht doet, diens troon zal voor eeuwig bevestigd worden.","15":"De roede en de bestraffing geven wijsheid; maar een kind dat aan zichzelf overgelaten wordt, brengt zijn moeder schande.","16":"Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.","17":"Tuchtig uw zoon, en hij zal u rust geven, en hij zal uw ziel vreugde geven.","18":"Als er geen profetie is, wordt het volk ontbloot; maar gelukkig is hij die de wet bewaart.","19":"Een knecht zal door woorden niet getuchtigd worden; al begrijpt hij het, toch zal hij niet gehoorzamen.","20":"Hebt u een man gezien die haastig is in zijn woorden? Van een dwaas is meer te verwachten dan van hem.","21":"Als men zijn knecht van jongs af aan verwend behandelt, zal hij uiteindelijk als een zoon willen zijn.","22":"Een toornig man verwekt ruzie; en de driftige is overvloedig in overtreding.","23":"De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.","24":"Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.","25":"De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.","26":"Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.","27":"Een onrechtvaardig man is voor de rechtvaardige een gruwel; maar wie recht van weg is, is voor de goddeloze een gruwel."},"SV":{"1":"Een man, die, dikwijls bestraft zijnde, den nek verhardt, zal schielijk verbroken worden, zodat er geen genezen aan is.","2":"Als de rechtvaardigen groot worden, verblijdt zich het volk; maar als de goddeloze heerst, zucht het volk.","3":"Een man, die de wijsheid bemint, verblijdt zijn vader; maar die een metgezel der hoeren is, brengt het goed door.","4":"Een koning houdt het land staande door het recht; maar een, die tot geschenken genegen is, verstoort hetzelve.","5":"Een man, die zijn naaste vleit, spreidt een net uit voor deszelfs gangen.","6":"In de overtreding eens bozen mans is een strik; maar de rechtvaardige juicht en is blijde.","7":"De rechtvaardige neemt kennis van de rechtzaak der armen; *maar* de goddeloze begrijpt de wetenschap niet.","8":"Spotdrijvende lieden blazen een stad aan *brand*; maar de wijzen keren den toorn af.","9":"Een wijs man, met een dwaas man in rechten zich begeven hebbende, hetzij dat hij beroerd is of lacht, zo is er toch geen rust.","10":"Bloedgierige lieden haten den vrome; maar de oprechten zoeken zijn ziel.","11":"Een zot laat zijn gansen geest uit, maar de wijze wederhoudt dien achterwaarts.","12":"Een heerser, die op leugentaal acht geeft, al zijn dienaars zijn goddeloos.","13":"De arme en de bedrieger ontmoeten elkander; de HEERE verlicht hun beider ogen.","14":"Een koning, die de armen in trouw recht doet, diens troon zal in eeuwigheid bevestigd worden.","15":"De roede, en de bestraffing geeft wijsheid; maar een kind, dat *aan* *zich* *zelf* gelaten is, beschaamt zijn moeder.","16":"Als de goddelozen velen worden, wordt de overtreding veel; maar de rechtvaardigen zullen hun val aanzien.","17":"Tuchtig uw zoon, en hij zal u gerustheid aandoen, en hij zal uw ziel vermakelijkheden geven.","18":"Als er geen profetie is, wordt het volk ontbloot; maar welgelukzalig is hij, die de wet bewaart.","19":"Een knecht zal door de woorden niet getuchtigd worden; hoewel hij *u* verstaat, nochtans zal hij niet antwoorden.","20":"Hebt gij een man gezien, die haastig in zijn woorden is? Van een zot is meer verwachting dan van hem.","21":"Als men zijn knecht van jongs op weeldig houdt, hij zal in zijn laatste een zoon *willen* zijn.","22":"Een toornig man verwekt gekijf; en de grammoedige is veelvoudig in overtreding.","23":"De hoogmoed des mensen zal hem vernederen; maar de nederige van geest zal de eer vasthouden.","24":"Die met een dief deelt, haat zijn ziel; hij hoort een vloek, en hij geeft het niet te kennen.","25":"De siddering des mensen legt een strik; maar die op den HEERE vertrouwt, zal in een hoog vertrek gesteld worden.","26":"Velen zoeken het aangezicht des heersers; maar een ieders recht is van den HEERE.","27":"Een ongerechtig man is den rechtvaardige een gruwel; maar die recht is van weg, is den goddeloze een gruwel."},"KJV":{"1":"He, that being often reproved hardeneth *his* neck, shall suddenly be destroyed, and that without remedy.","2":"When the righteous are in authority, the people rejoice: but when the wicked beareth rule, the people mourn.","3":"Whoso loveth wisdom rejoiceth his father: but he that keepeth company with harlots spendeth *his* substance.","4":"The king by judgment establisheth the land: but he that receiveth gifts overthroweth","5":"A man that flattereth his neighbour spreadeth a net for his feet.","6":"In the transgression of an evil man *there is* a snare: but the righteous doth sing and rejoice.","7":"The righteous considereth the cause of the poor: *but* the wicked regardeth not to know","8":"Scornful men bring a city into a snare: but wise *men* turn away wrath.","9":"*If* a wise man contendeth with a foolish man, whether he rage or laugh, *there is* no rest.","10":"The bloodthirsty hate the upright: but the just seek his soul.","11":"A fool uttereth all his mind: but a wise *man* keepeth it in till afterwards.","12":"If a ruler hearken to lies, all his servants *are* wicked.","13":"The poor and the deceitful man meet together: the LORD lighteneth both their eyes.","14":"The king that faithfully judgeth the poor, his throne shall be established for ever.","15":"The rod and reproof give wisdom: but a child left *to himself* bringeth his mother to shame.","16":"When the wicked are multiplied, transgression increaseth: but the righteous shall see their fall.","17":"Correct thy son, and he shall give thee rest; yea, he shall give delight unto thy soul.","18":"Where *there is* no vision, the people perish: but he that keepeth the law, happy","19":"A servant will not be corrected by words: for though he understand he will not answer.","20":"Seest thou a man *that is* hasty in his words? *there is* more hope of a fool","21":"He that delicately bringeth up his servant from a child shall have him become *his* son at the length.","22":"An angry man stirreth up strife, and a furious man aboundeth in transgression.","23":"A man's pride shall bring him low: but honour shall uphold the humble in spirit.","24":"Whoso is partner with a thief hateth his own soul: he heareth cursing, and bewrayeth","25":"The fear of man bringeth a snare: but whoso putteth his trust in the LORD shall be safe.","26":"Many seek the ruler's favour; but *every* man's judgment *cometh* from the LORD.","27":"An unjust man *is* an abomination to the just: and *he that is* upright in the way *is* abomination to the wicked."}},"tsk":{"1":[{"kopje":"Een man die, vaak bestraft","refs":["Spr 1:24-31","1 Sam 2:25","1 Sam 2:34","1 Kon 17:1","1 Kon 18:18","1 Kon 20:42","1 Kon 21:20-23","1 Kon 22:20-23","1 Kon 22:28","1 Kon 22:34-37","2 Kron 25:16","2 Kron 33:10","2 Kron 36:15-17","Jer 25:3-5","Jer 26:3-5","Jer 35:13-16","Zach 1:3-6","Matt 26:21-25","Joh 6:70","Joh 6:71","Joh 13:10","Joh 13:11","Joh 13:18","Joh 13:26","Hand 1:18","Hand 1:25"]},{"kopje" but every <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> cometh from the LORD.","27":"An <span class=\"wl wl-kjv\" data-code=\"H5766\">unjust</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> to the <span class=\"wl wl-kjv\" data-code=\"H6662\">just:</span> and he that is <span class=\"wl wl-kjv\" data-code=\"H3477\">upright</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> is <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> to the wicked."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"man,","tekst":"Hebreeuws, een man der bestraffingen; dat is die veel en dikwijls bestraft wordt. Alzo een man der smarten, Isa 53:3 , voor dengene, die veel smarten lijdt. Een man der begeerten, Dan 10:11 voor dengene, die zeer begeerd wordt."},{"catchword":"den nek","tekst":"Zie Exo 32:9 ."},{"catchword":"zodat","tekst":"Zie boven Pro 6:15 ."}],"2":[{"catchword":"groot","tekst":"Dat is, als zij tot groot aanzien komen en in de regering zitten; gelijk af te nemen is uit het andere lid van vs.2. Vergelijk 2Ki 5:1 , en 2Ki 10:6 , en 2Ki 25:9 , met de aantekening. Anders: vele worden, of vermenigvuldigen."},{"catchword":"zucht","tekst":"Te weten onder den last der tirannie waarmede het van de goddeloze heersers verdrukt wordt; zie een exempel Exo 2:23 ."}],"3":[{"catchword":"maar die","tekst":"Dat is, der hoeren aanhanger, voeder en onderhouder. Hebreeuws, weider. Zie boven Pro 13:20 ."}],"4":[{"catchword":"Een koning","tekst":"Te weten, die wijs en vroom is. Zie boven Pro 18:22 ."},{"catchword":"het land","tekst":"Dat is, de regering, of den staat van het land en het welvaren der inwoners of onderzaten."},{"catchword":"door het recht;","tekst":"Dat is, door het handhaven van alle goede wetten, waardoor de goeden voorgestaan en de kwaden gestraft worden."},{"catchword":"maar een,","tekst":"Hebreeuws, een man der heffing, of der hefoffers. Van het Hebreeuwse woord terumah zie Lev 7:14 , en Num 5:9 , in de aantekening. Hier verstaan wij hetzelve van de heffing der geschenken, waartoe een heer des lands zou mogen genegen zijn om iemand gunst toe te dragen, zonder aanzien op het recht te hebben. Men kan het woord ook verstaan van de oplegging der schattingen, die een prins van zijne onderzaten met verdrukking derzelven tiranniglijk opneemt."}],"5":[{"catchword":"vleit,","tekst":"Te weten met hem onmatig te prijzen, te verschonen in zijne zonden en bedektelijk tot allerlei boosheid op te hitsen, enz."},{"catchword":"spreidt","tekst":"Dat is, brengt hem in gevaar des verderfs, dat onder de vleiende woorden verborgen is; gelijk een vogel door het aas aangelokt wordt om in het net, waarom hij niet verdacht is, gevangen te worden."}],"6":[{"catchword":"strik;","tekst":"Te weten verborgen, hetwelk hem brengt in het gevaar des verderfs, ja, waarin hij gewisselijk zal verloren gaan, tenzij God hem door de bekering daaruit trekke."},{"catchword":"juicht","tekst":"Te weten omdat hij, zich wachtende van zonden, zodanigen strik niet vreest."}],"7":[{"catchword":"rechtvaardige","tekst":"Te weten, rechter."},{"catchword":"neemt kennis","tekst":"Dat is, neemt aan het geschil der armen te onderzoeken, te verstaan, te bezorgen en te helpen, zoals de gerechtigheid der zaak vereist. Vergelijk Job 29:16 ."},{"catchword":"de wetenschap","tekst":"Namelijk waardoor hij behoort te verstaan zowel zijn schuldigen plicht, die hem verbindt tot de hulp der armen als de rechte manier en wijze om dezelve wel en tijdig te betonen."}],"8":[{"catchword":"Spotdrijvende","tekst":"Hebreeuws, mannen, of lieden der spotternij, of bespotting."},{"catchword":"blazen","tekst":"Te weten door het vuur der goddelijke wraak aan te steken door hun gruwelijken zonden, of ook het vuur der onenigheid of van muiterij en oorlog door hun kwaden raad en ontrouw. Anders: verstrikken ene stad."},{"catchword":"toorn","tekst":"Te weten, Gods, door hun godvruchtige gebeden, en der mensen, door hun voorzichtigheid, zachtmoedigheid, manierlijkheid, enz."}],"9":[{"catchword":"hij beroerd","tekst":"Te weten de wijze man. De zin is, hetzij hij zich toorniglijk, hetzij vriendelijk aanstelt, het is eveneens. Anderen verstaan dit van den dwaas, die nu gram wordt en dan lacht, maar al met enerlei bezwaarlijke uitkomst."},{"catchword":"rust","tekst":"Te weten van het geschil. Want de dwaze zal altijd nog uitvlucht zoeken en wat in te brengen hebben."}],"10":[{"catchword":"Bloedgierige","tekst":"Hebreeuws, mannen, of lieden der bloeden; dat is de bloedgierige mensen, of die tot doodslagen genegen zijn. Zie Psa 5:7 ."},{"catchword":"vrome;","tekst":"Zie Gen 6:9 , en Job 1:1 ."},{"catchword":"ziel","tekst":"Te weten om die van het verderf te bevrijden. Vergelijk Psa 142:5 . Anders is de ziel van iemand te zoeken naar zijn leven staan. Zie Exo 4:19 ; 2Sa 4:8 ."}],"11":[{"catchword":"zijn gansen","tekst":"Dat is, al zijne gedachten. Vergelijk boven Pro 1:23 ; idem gedachten, bewegingen, genegenheden. Zie 2Ki 19:7 ."},{"catchword":"weerhoudt","tekst":"Dat is, houdt en bindt zichzelven in, dat hij al zijne gedachten, wetenschap en voornemen niet tevens openbaart."}],"12":[{"catchword":"heerser,","tekst":"Versta een, die over enig landschap en volk de opperste regeerder is. Zie 2Sa 23:3 ."},{"catchword":"leugentaal","tekst":"Hebreeuws, het woord der valsheid; alzo boven Pro 13:5 ."},{"catchword":"acht geeft,","tekst":"Te weten alzo, dat hij ze genegen is te geloven en voor te staan."},{"catchword":"zijn goddeloos","tekst":"Welverstaande ten merendeel, vermits een goddeloos regeerder zijns gelijken begeert en gemeenlijk krijgt door het beleid der zijnen, die hem gelijk zijn, of zo zij vroom zijn, die hij krijgt, poogt dezelven naar zijn zin te formeren of af te richten."}],"13":[{"catchword":"de bedrieger","tekst":"Hebreeuws, de man der bedriegerijen, of der woekeringen, of loosheden. Versta, een onrechtvaardigen rijke, die zijn rijkdom wint met loze en onrechtvaardige praktijken. Anders: een man der loze vlijtigheden; dat is, die door naarstigheid, vermengd met behendigheid middelen vergadert."},{"catchword":"ontmoeten","tekst":"Dat is, leven en handelen met elkander. Vergelijk boven Pro 22:2 , en de aantekening."},{"catchword":"verlicht","tekst":"Te weten met het licht der zon, zodat Hij hen beiden in het leven houdt, zolang als het hem belieft; Mat 5:45 . Sommigen verstaan het van de verlichting van het natuurlijke verstand. Vergelijk Joh 1:9 ."}],"14":[{"catchword":"armen","tekst":"Te weten die lichtelijk kunnen verdrukt worden door de onrechtvaardigheid en het geweld van anderen, en bezwaarlijk hulp vinden door hun eigen onvermogen en armoede."},{"catchword":"recht doet,","tekst":"Dat is, kennis neemt van hunne zaak, daarvan recht oordeelt zonder aanzien van personen, en zo hij hen bevindt recht te hebben, dezelve voorstaat tegen hunne verdrukkers, met veroordeling en uitvoering, zonder daarin te verflauwen door des enen kleinheid en armoede, of omgekeerd te worden door des anderen grootheid en rijkdom. Alzo Psa 83:3 ; Isa 1:17 , enz."}],"15":[{"catchword":"roede,","tekst":"Versta, de straf, die geschiedt door slagen; zie boven Pro 10:13 ."},{"catchword":"bestraffing","tekst":"Te weten die geschiedt door woorden; hoewel het woord in het oorspronkelijke somtijds ook betekent de straffing, welke dadelijk geschiedt door slagen. Zie boven Pro 3:11 ."},{"catchword":"dat aan zichzelf","tekst":"Dat is, dat men toelaat zijn zelfs te zijn, zonder onder iemands opzicht onderwijs en bedwang te staan."},{"catchword":"zijn moeder","tekst":"Ja ook zijnen vader; maar voornamelijk de moeder, omdat zij meest in deszelfs opbrenging bezig is geweest, gelijk ook het vrouwelijk geslacht de versmading der kwaadwilligen meest onderworpen is en zich dezelve lichter aantrekt."}],"16":[{"catchword":"velen worden,","tekst":"Of vermenigvuldigen, of groot worden; vergelijk boven vs.2."},{"catchword":"hun val","tekst":"Vergelijk Psa 37:34 ."}],"17":[{"catchword":"Tuchtig","tekst":"Te weten met woorden en slagen, naardat de zaak vereisht. Zie boven Pro 9:7 ."}],"18":[{"catchword":"profetie is,","tekst":"Hebreeuws, gezicht. versta, gene verkondiging van Gods Woord, waardoor de wil Gods jegens ons en onze schuldige plicht jegens hem ons aangediend en verklaard wordt. Alzo is het woord gezicht genomen, 1Sa 3:1 ; 1Ch 17:15 ."},{"catchword":"ontbloot;","tekst":"Te weten van Gods genade, zegen en bescherming, en alzo van zijn tijdelijk en eeuwig welvaren. Vergelijk Exo 32:25 , en de aantekening. Anders: verlaten, of verworpen, of keert zich terug."},{"catchword":"die de wet","tekst":"Dat is, die den weg des Heeren houdt. Zie Gen 18:19 ."}],"19":[{"catchword":"knecht","tekst":"Versta, al degenen, die een slaafsen geest hebbende, niet tot hun schuldigen plicht kunnen gebracht worden door goede vermaning, maar behoeven daartoe ook harde slagen."},{"catchword":"niet getuchtigd","tekst":"Te weten om te doen wat zijn heer hem beveelt en daartoe ook verbonden is."},{"catchword":"hoewel hij","tekst":"Of, als hij [u] verstaat en niet antwoordt."},{"catchword":"niet antwoorden","tekst":"Te weten noch met ongeveinsde woorden noch met gehoorzame daad."}],"20":[{"catchword":"Hebt gij","tekst":"Vergelijk boven Pro 26:12 ."},{"catchword":"woorden is?","tekst":"Of, werken en daden."},{"catchword":"verwachting","tekst":"Te weten van voorzichtig en tijdig te spreken, of iets met goeden raad in het werk te stellen."}],"21":[{"catchword":"zoon","tekst":"Een zoon van het huisgezin, die het recht van het kindschap en der erfenis tot zich wil trekken. Vergelijk de voorbeelden van Abner, 2Sa 3:7-8 ; van Jerobeam, 1Ki 11:26-28 ; van Zimri, 1Ki 16:9 ."}],"22":[{"catchword":"toornig man","tekst":"Hebreeuws, een man des toorns; dat is, die tot toorn genegen is. Zie Job 11:11 ."},{"catchword":"de grammoedige","tekst":"Hebreeuws, een heer der grimmigheid. Vergelijk boven Pro 22:24 ."}],"23":[{"catchword":"vasthouden","tekst":"Dat is, zekerlijk verkrijgen en steeds behouden, te weten bij God, bij de vromen en bij de getuigenis zijner conscientie. Zie gelijke manier van spreken, boven Pro 11:16 . Anders: maar de nederige van geest zal de eer ondersteunen."}],"24":[{"catchword":"haat","tekst":"Dat is, in zijn eigen vijand, zich aanbrengende grote schande en schade. Zie gelijke manieren van spreken boven Pro 8:36 , en de aantekening."},{"catchword":"hij hoort","tekst":"De zin is, dat hij gemaand zijnde van den rechter met beëediging en vervloeking desgenen, die den dief weet en niet te kennen geeft, nochtans daar hij hem weet, dien loochent te weten. Anders: [alzo] die een vloek hoort en niet te kennen geeft, [gelijk er staat Lev 5:1 ] , die haat ook zijne ziel."}],"25":[{"catchword":"siddering","tekst":"Te weten die al te groot en overmatig is, waardoor men in de gevaren en gedreigde zwarigheden niet vertrouwt op God, gelijk men behoort."},{"catchword":"legt","tekst":"Dat is, brengt den bevreesden mens in groot gevaar van meer te zondigen tegen God en door velerlei ongelukkige bejegeningen meer van God gestraft te worden."},{"catchword":"in een hoog","tekst":"Te weten daar hij zeker en vrij van alle gevaren zal zijn."}],"26":[{"catchword":"zoeken","tekst":"Te weten om iets te begeren tot handhaving en bevordering van het recht, dat zij tegen iemand uitstaande hebben."},{"catchword":"is van den HEERE","tekst":"Te weten die volkomenlijk de gerechtigheid bemint, en ook der heren harten in zijne hand heeft, boven Pro 21:1 , en daarom vooral moet aangesproken wezen. Zie exempelen hiervan Neh 1:4 ; Est 4:16 ."}],"27":[{"catchword":"Een ongerechtig","tekst":"Hebreeuws, een man des onrechts; dat is, die onrecht liefheeft. Vergelijk boven Pro 6:12 ."},{"catchword":"die recht","tekst":"Dat is, die wijs en vroom is. Vergelijk Psa 37:14 , en Psa 119:1 ."},{"catchword":"den goddeloze","tekst":"Hebreeuws, des goddelozen gruwel. Zie boven Pro 3:32 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A man that being often reproved, [Hebr. A man of reproof; that is, that is much and often reproved. So a man of sorrows, Isa 53:3. for him that endureth many sorrows; a man of desires, Dan.10.on ver.11. for him, that is much desired] hardeneth (his) neck, [see Exod.32.on v.9.] shall suddenly be broken, so that there be no healing (him.) [see above chap.6.on v.15.]"}],"2":[{"catchword":null,"tekst":"When the righteous become great, [That is, when they come to great authority, and sit in place of government, as may be gathered from the other clause of his verse. Compare 2 Kings 5,1. And 10.6. and 25.9. with the annotate. Oth. Become many, or do multiply] the people rejoice: [compare above chap.11.10. and 28.12.] but when the wicked heareth rule, the people groan. [to wit, under the burden of tyranny, wherewith they are oppressed by wicked Rulers. See an example, Exo 2:23. compare above chap.28.28.]"}],"3":[{"catchword":null,"tekst":"A man that loveth wisdom, rejoiceth his Father: [Compare above chap.10.1. and 15.20.] but he that is a companion of harlots [that is, a follower, nourisher and maintainer of whores. Hebr. Feeder, see above chap.13.on v.20.] spendeth (his) substance. [compare above chap.28.7. Luk 15:13.]"}],"4":[{"catchword":null,"tekst":"A King [To wit, that is wise and godly. See above chap.18.on verse.22.] by judgement [that is, by making and maintaining good laws, whereby the good are protected, and the wicked deservedly punished] stablisheth the land; [that is, the government, or the state of the land, and the prosperity of the inhabitants or subjects] but one that inclined to (receive) gifts, [Heb. A man of heavings, or heav-offerings. Of the Hebrew word terumah, see Lev.7.14. and Num 5:9. in the annotate. Here the same is to be understood of the heaving or lifting up of gifts, whereunto a Ruler of the Land might be prone and inclined, to shew favour unto some, without having respect unto Law or equity. The word may be also understood of the imposing of taxes, which a Prince tyrannically levieth and gathereth of his poor subjects, and thereby greatly burdeneth and oppresseth them.] troubleth it."}],"5":[{"catchword":null,"tekst":"A man that flattereth his neighbour, [To wit, by praising him excessively, by favouring and sparing him in his sins, and by closely provoking & encouraging him to the commiting of all manner of wickedness, etc.] spreadeth a net abroad for his goings. [that is, bringeth him into danger of destruction, which is hid under flattering words: as a bird is enticing, by the bait, to be caught in the net, which it was not aware of, or not suspected.]"}],"6":[{"catchword":null,"tekst":"In the transgression of an evil man (there) is a snare: [To wit, hid, which bringeth him into danger of destruction; yea, wherein he shall certainly perish, unless God, by repentance, pluck him out] but the righteous shouteth, and is glad. [to wit, because he, taking heed of sin, feareth no such snare.]"}],"7":[{"catchword":null,"tekst":"The righteous [To wit, Judge] taketh notice of the cause of the poor: [that is, undertaketh to search into the suit or controversy of the poor, is careful to understand and know it aright, and to help and assist the poor in their cause, so far as may stand with justice and equity. Compare, Job 29,16.] (but) the wicked apprehendeth not knowledge. [namely, whereby he ought to understand, both his duty, which engageth him to help and aid the poor, and also the right manner and way, to do it well and seasonably.]"}],"8":[{"catchword":null,"tekst":"Scornful men [Hebr. Men of scorning, or mocking] set a City on (fire,) [to wit, by kindling the fire of divine vengeance, through their abominable sins; or also the fire of dissension, or of munity and war, by their evil counsel and disloyalty. Otherwise, ensnare a city, or bring a city into a snare] but the wise turn away wrath. [to wit, the wrath of God, by their pious prayers; and the wrath of men, by their prudence, meekness, modesty, etc.]"}],"9":[{"catchword":null,"tekst":"A wise man going to law with a foolish man, whether be [To wit, the wise man] be troubled, or laugh, yet there is no rest. [to wit, no rest or end of the suit: for the foolish man will always seek some evasion or other, and will always have something or other still to alledge. The meaning is, that a wise man going to law with a foolish man, whether he be displeased, or whether he be well pleased, it is al one; there is no end of the controversy for all that. Others understand this of the foolish man, that is sometimes angry, and sometimes laughteth, but all with one kind of sad or heavy event.]"}],"10":[{"catchword":null,"tekst":"Blood thirsty men [ Hebr. Men of blood: that is, blood-thirsty men, or they that are prone to shed blood, and to commit murder, see Psal.5.on vers.11.] hate the godly man, [of the godly man, see Gen.6.on v.9. and Job 1.on vers.1.] but the upright seek his soul. [to wit, to save and deliver it from destruction. Compare, Psal.142.5. Otherwise, to seek the soul of a man, is to seek to take away his life. See Exod.4.on vers.19. and 2. Sam.4. on vers.8.]"}],"11":[{"catchword":null,"tekst":"A fool uttereth his whole spirit: [That is, all his thoughts. Compare above chap.1.on vers.23. also affections, motions, inclinations, see 2 Kings 19.on vers.7. compare also above, cha.14.33.] but a wise man keepeth it in (till) afterwards. [that is, he restraineth and keepeth himself in, so that he doth not reveal and discover all his thoughts, knowledge, mind, and intention at once.]"}],"12":[{"catchword":null,"tekst":"A Ruler [Meaning one that is supreme head and governor over a Country or people, see 2 Sam.23.on vers.3.] that giveth heed to lying, [to wit, so that he is inclined to believe and maintain it. Heb. The word of falsehood, so above, chap.13.5.] all his servants are wicked. [meaning, the greatest part of them, because a wicked Ruler desireth to have such to wait upon him that are like himself, and by the ordering and managing of those that belong unto him, doth commonly get such servants as are like him; or if so be pious and godly that he getteth, then he indeavoureth to frame and fashion them, according to his mind, or else to discard and cashier them.]"}],"13":[{"catchword":null,"tekst":"The poor and the deceiver [Heb. The man of deceits, or of usuries, or of subtilities. Understand an unrighteous rich man that getteth his riches by crafty and unjust dealings or devices. Others, a man of crafty diligences, that is, one that gathereth riches by diligence mixt with policy or subtilty] meet together; [that is, live and trade together. Compare above chap.22.2. and the Annotat.] the Lord lighteneth both their eyes. [to wit, with the light of the Sun, so that he preserveth and 45. Some understand it of the enlightening of the natural understanding. Compare Job 1:9.]"}],"14":[{"catchword":null,"tekst":"A King that in faithfulness doth justice to the poor, [That is, taketh notice of their cause, judgeth rightly thereof, without respect of persons; and, if he find them to be in the right, maintaineth and defendeth them against their oppressors, both by sentence and execution, without growing weary, or fainting therein, by reason of the meanness and poverty of the one, or being subverted and turned about, by reason of the greatness and riches of the other, so Psa 82:3. Isa.17, &c. To the poor, to wit, to those that may easily be oppressed by the unjustice and violence of others, and do hardily find help or aid, by reason of their own disability and poverty] his throne shall be established forever. [compare above, chap.20.28. & 25.5.]"}],"15":[{"catchword":null,"tekst":"The rod [meaning the punishment which is done by blows, see above, chap.10.on verse 13.] and reproof [to wit, which is done by words: although the word in the original doth sometimes also signify the rebuke or punishment which is done actually by blows, see above, chap.13.24. and 22.15. and 23.13.] but a child that is left (to himself) [that is, that is suffered to be his own master, and is under no mans tuition, guidance or instruction] maketh his mother ashamed. [yea, and also his father; but especially his mother, because she hath been most busied in his education, and bringing for him up, as also the female sex is commonly most subject to the reproach and scorn of wicked and rebellious children, and do least take it to heart. Compare above, chap.10.1. and 17.21,25.]"}],"16":[{"catchword":null,"tekst":"When the wicked grow many, [Heb. Do multiply, or grow great. Compare above, verse 2.] transgression growth much; but the righteous shall behold their fall. [compare Psal.37.34. and 58.11. and 91.8.]"}],"17":[{"catchword":null,"tekst":"Correct thy son, [To wit, with words and blows, as the cause requireth, see above chap.9.on vers.7.] and he shall give thee rest; [compare above, chap.13.24. and 22.15. and23.13,14.] and he shall give delight to thy soul."}],"18":[{"catchword":null,"tekst":"When there is no prophecy, [Heb. Vision, meaning no preaching of the Word of God, whereby the will of God to us, and our duty to him, is shewed and made known unto us: so is the word vision taken, 1. Sam.3.1. 1 Chron.17.15.] the people are made wicked; [to wit, of the grace, blessing, and protection of God, and consequently of their temporal and eternal welfare, compare Exo 32:25. and the Annotat. Oth. Are forsaken, or cast off: or turn back.] but happy is he that keepeth the law. [that is, that keepeth the way of the Lord, see Gen.18.on vers.19.]"}],"19":[{"catchword":null,"tekst":"A servant will not be corrected by words; [To wit, to do that which his master commandeth him, and whereunto he is also engaged. The meaning is, that all those that be of a servile and slavish spirit or disposition, they cannot be brought or won to the performance of their duty by soft words, by good instructions and admonitions, but have need to be compelled and forced thereto by hard and heavy blows] although he understand (thee) yet will he not answer. [to wit, neither with unfeigned works, nor with obedient deeds. Or, when he understandeth (thee) and answereth not.]"}],"20":[{"catchword":null,"tekst":"Hast thou seen a man that is hasty in his words; [Or, works and deeds] there is more expectation [to wit, of speaking prudently and seasonably, or of doing things wish good advice and counsel] of a fool, then of him. [compare above, chap.26.12.]"}],"21":[{"catchword":null,"tekst":"When a man keepeth his servant delicately from a child, he will at last desire to be a son. [A son of the family, that will draw unto himself the right of son-ship, and of inheritance. Compare the examples of Abner, 2 Sam.3.7,8. Of Jerobeam, 1 Kings 11.26,27,28. Of Simri, 1 Kings 16.9.]"}],"22":[{"catchword":null,"tekst":"An angry man [Heb. A man of anger; that is, that is prone to anger, see Job 11.on vers.11.] stirreth up brawling, [compare above, chap.15.18. and 26.21.] and the wrathful (man) [Heb. A Lord of wrath, compare above, chap.22.on vers.24.] is manifold in transgression."}],"23":[{"catchword":null,"tekst":"A mans pride shall humble him: but the humble in spirit shall hold honour fast. [That is, shall surely get, and constantly keep honour; to wit, in the sight of God, in the presence and esteem of good men, and in the witness and testimony of his own conscience. See the like phrase above chap.11.16. Oth. But honour shall uphold the humble in spirit. Compare Job 22:29. Pro 15:33. and 18.12. Isa 66:2. Mat 23:12. Luk 14:11. and 18.14. Jam.4.6,10. 1 Pet.5.5.]"}],"24":[{"catchword":null,"tekst":"He that is partner with a thief, hateth his (own) soul; [That is, is his own enemy, bringing great shame and disgrace upon himself. See the like phrase above, chap.8.36. and in the Annotat.] he heareth a curse, and he bewrayeth it not. [the meaning is, that he, being required by the Judge upon his corporal oath, and with a cursed denounced against him that is privy to the theft, discovereth it not, notwithstanding he knowing thereof, utterly denieth to have any knowledge of it. Oth. (so) he that heareth a curse, and bewrayeth it not, (as it is, Levit.5.1.) he hateth also his own soul.]"}],"25":[{"catchword":null,"tekst":"The trembling of man [To wit, which is too great and immoderate, whereby men do not in dangers and difficulties threatened trust and rely on God so as they ought to do] layeth a snare, [that is, bringeth the fearful man into great danger of sinning more against God, and of being more punished of God by many unhappy disasters and sad accidents] but he that trusteth in the LORD, shall be set in a high place of refuge [to wit, where he shall be safe, free from all dangers.]"}],"26":[{"catchword":null,"tekst":"Many seek the Rulers face, [To wit, to require something of him, that may tend to the advancing and promoting of their cause, and of their suit, which they have against another. Compare above, chap.19.6.] but every mans judgement is from the LORD. [to wit, who absolutely loveth righteousness, and hath also the hearts of Rulers in his hand, see above, chap.21.1. and therefore must first of all, and before all others be sought unto. See examples hereof, Nehem.1.4. Est 4:16.]"}],"27":[{"catchword":null,"tekst":"An unjust man [Hebr. A man of injustice, that is, that loveth injustice. Compare above, chap.6. on verse 14.] is an abomination to the just: but he that is right in way, [that is, he that wise and godly, or upright. Compare, Psalm37.14. and 119.1.] is an abomination to the wicked. [Heb. An abomination of the wicked. See above, chap.3.on v.32.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  document.getElementById('hfdnav').innerHTML =

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

    `</span>` +

  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */

  if (!k) return;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
