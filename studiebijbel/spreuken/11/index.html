romen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid.","7":"Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.","8":"De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.","9":"De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.","10":"Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.","11":"Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.","12":"Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.","13":"Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak.","14":"Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.","15":"Als iemand voor een vreemde borg geworden is, zal hij zeker daarvoor lijden; maar wie ervoor terugdeinst om vast toe te slaan, is zeker van zichzelf.","16":"Een aangename vrouw houdt de eer vast, zoals sterke mannen de rijkdom vasthouden.","17":"Een goedertieren mens doet zijn eigen ziel goed; maar wie wreed is, brengt zijn eigen vlees in beroering.","18":"De goddeloze doet een vals werk; maar hem die gerechtigheid zaait, is een trouw loon toegezegd.","19":"Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.","20":"De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.","21":"Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.","22":"Een mooie vrouw die geen verstand heeft, is een gouden ring in een varkenssnuit.","23":"Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.","24":"Er is er een die uitstrooit, aan wie nog meer toegevoegd wordt; en een die meer inhoudt dan recht is, maar het leidt tot gebrek.","25":"De zegenende ziel zal vet gemaakt worden; en wie bevochtigt, zal ook zelf verkwikt worden.","26":"Wie koren inhoudt, hem vervloekt het volk; maar zegening zal zijn over het hoofd van de verkoper.","27":"Wie het goede vroeg nazoekt, zoekt welgevalligheid; maar wie het kwade natracht, hem zal het overkomen.","28":"Wie op zijn rijkdom vertrouwt, die zal vallen; maar de rechtvaardigen zullen groenen als loof.","29":"Wie zijn huis in beroering brengt, zal wind erven; en de dwaas zal een knecht zijn van hem die wijs van hart is.","30":"De vrucht van de rechtvaardige is een boom des levens; en wie zielen vangt, is wijs.","31":"Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!"},"SV":{"1":"Een bedriegelijke weegschaal is den HEERE een gruwel; maar een volkomen weegsteen is Zijn welgevallen.","2":"Als de hovaardigheid komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.","3":"De oprechtheid der oprechten leidt hen; maar de verkeerdheden der trouwelozen verstoort hen.","4":"Goed doet geen nut ten dage der verbolgenheid; maar de gerechtigheid redt van den dood.","5":"De gerechtigheid des oprechten maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.","6":"De gerechtigheid der vromen zal hen redden; maar de trouwelozen worden gevangen in *hun* verkeerdheid.","7":"Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs is de allersterkste hoop vergaan.","8":"De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.","9":"De huichelaar verderft zijn naaste door den mond; maar door wetenschap worden de rechtvaardigen bevrijd.","10":"Een stad springt op van vreugde over het welvaren der rechtvaardigen; en als de goddelozen vergaan, is er gejuich.","11":"Door den zegen der oprechten wordt een stad verheven; maar door den mond der goddelozen wordt zij verbroken.","12":"Die verstandeloos is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.","13":"Die *als* een achterklapper wandelt, openbaart het heimelijke; maar die getrouw is van geest, bedekt de zaak.","14":"Als er geen wijze raadslagen zijn, vervalt het volk; maar de behoudenis is in de veelheid der raadslieden.","15":"Als *iemand* voor een vreemde borg geworden is, hij zal zekerlijk verbroken worden; maar wie degenen haat, die *in* *de* *hand* klappen, is zeker.","16":"Een aangename huisvrouw houdt de eer vast, gelijk de geweldigen den rijkdom vasthouden.","17":"Een goedertieren mens doet zijn ziel wel; maar die wreed is, beroert zijn vlees.","18":"De goddeloze doet een vals werk; maar *voor* dengene, die gerechtigheid zaait, is trouwe loon.","19":"Alzo is de gerechtigheid ten leven, gelijk die het kwade najaagt, naar zijn dood *jaagt*.","20":"De verkeerden van hart zijn den HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.","21":"Hand aan hand zal de boze niet onschuldig zijn; maar het zaad der rechtvaardigen zal ontkomen.","22":"Een schone vrouw, die van rede afwijkt, is een gouden bagge in een varkenssnuit.","23":"De begeerte der rechtvaardigen is alleenlijk het goede; maar de verwachting der goddelozen is verbolgenheid.","24":"Er is een, die uitstrooit, denwelken nog meer toegedaan wordt; en een, die meer inhoudt dan recht is, maar het is tot gebrek.","25":"De zegenende ziel zal vet gemaakt worden; en die bevochtigt, zal ook zelf een vroege regen worden.","26":"Wie koren inhoudt, dien vloekt het volk; maar zegening zal zijn over het hoofd des verkopers.","27":"Wie het goede vroeg nazoekt, zoekt welgevalligheid; maar wie het kwade natracht, dien zal het overkomen.","28":"Wie op zijn rijkdom vertrouwt, die zal vallen; maar de rechtvaardigen zullen groenen als loof.","29":"Wie zijn huis beroert, zal wind erven; en de dwaas zal een knecht zijn desgenen, die wijs van hart is.","30":"De vrucht des rechtvaardigen is een boom des levens; en wie zielen vangt, is wijs.","31":"Ziet, den rechtvaardige wordt vergolden op de aarde, hoeveel te meer den goddeloze en zondaar!"},"KJV":{"1":"A false balance *is* abomination to the LORD: but a just weight *is* his delight.","2":"*When* pride cometh, then cometh shame: but with the lowly *is* wisdom.","3":"The integrity of the upright shall guide them: but the perverseness of transgressors shall destroy","4":"Riches profit not in the day of wrath: but righteousness delivereth from death.","5":"The righteousness of the perfect shall direct his way: but the wicked shall fall by his own wickedness.","6":"The righteousness of the upright shall deliver them: but transgressors shall be taken in *their own* naughtiness.","7":"When a wicked man dieth, *his* expectation shall perish: and the hope of unjust *men* perisheth.","8":"The righteous is delivered out of trouble, and the wicked cometh","9":"An hypocrite with *his* mouth destroyeth his neighbour: but through knowledge shall the just be delivered.","10":"When it goeth well with the righteous, the city rejoiceth: and when the wicked perish, *there is* shouting.","11":"By the blessing of the upright the city is exalted: but it is overthrown by the mouth of the wicked.","12":"He that is void of wisdom despiseth his neighbour: but a man of understanding holdeth his peace.","13":"A talebearer revealeth secrets: but he that is of a faithful spirit concealeth the matter.","14":"Where no counsel *is*, the people fall: but in the multitude of counsellors *there is* safety.","15":"He that is surety for a stranger shall smart *for it*: and he that hateth suretiship is sure.","16":"A gracious woman retaineth honour: and strong *men* retain riches.","17":"The merciful man doeth good to his own soul: but *he that is* cruel troubleth his own flesh.","18":"The wicked worketh a deceitful work: but to him that soweth righteousness *shall be* a sure reward.","19":"As righteousness *tendeth* to life: so he that pursueth evil *pursueth it* to his own death.","20":"They that are of a froward heart *are* abomination to the LORD: but *such as are* upright in *their* way *are* his delight.","21":"*Though* hand *join* in hand, the wicked shall not be unpunished: but the seed of the righteous shall be delivered.","22":"*As* a jewel of gold in a swine's snout, *so is* a fair woman which is without discretion.","23":"The desire of the righteous *is* only good: *but* the expectation of the wicked *is* wrath.","24":"There is that scattereth, and yet increaseth; and *there is* that withholdeth more than is meet, but *it tendeth* to poverty.","25":"The liberal soul shall be made fat: and he that watereth shall be watered","26":"He that withholdeth corn, the people shall curse him: but blessing *shall be* upon the head of him that selleth","27":"He that diligently seeketh good procureth favour: but he that seeketh mischief, it shall come","28":"He that trusteth in his riches shall fall: but the righteous shall flourish as a branch.","29":"He that troubleth his own house shall inherit the wind: and the fool *shall be* servant to the wise of heart.","30":"The fruit of the righteous *is* a tree of life; and he that winneth souls *is* wise.","31":"Behold, the righteous shall be recompensed in the earth: much more the wicked and the sinner."}},"tsk":{"1":[{"kopje":"Een bedrieglijke weegschaal is","refs":["Spr 16:11","Spr 20:10","Spr 20:23","Lev 19:35","Lev 19:36","Deut 25:13-16","Hos 12:8","Amos 8:5","Amos 8:6","Micha 6:10","Micha 6:11"]},{"kopje":"een volkomen weegsteen","refs":["Spr 16:11","Ezech 45:10-12"]}],"2":[{"kopje":"de hoogmoed","refs":["Spr 3:34","Spr 3:35","Spr 16:18","Spr 16:19","Dan 4:30-32","Luk 14:8-11","Luk 18:14"]},{"kopje":"maar","refs":["Spr 15:33","1 Kor 8:1","1 Kor 8:2"]}],"3":[{"kopje":"De oprechtheid","refs":["Spr 11:5","Spr 13:6","Ps 25:21","Ps 26:1","Joh 7:17"]},{"kopje":"de verkeerdheid","refs":["Spr 21:7","Spr 28:18","Pred 7:17","Jes 1:28"]}],"4":[{"kopje":"Bezit","refs":["Spr 10:2","Job 36:18","Job 36:19","Ps 49:7-9","Ezech 7:19" hendt hen."}],"4":[{"catchword":"doet geen nut","tekst":"Te weten, den goddelozen."},{"catchword":"der verbolgenheid;","tekst":"Te weten, der goddelijke verbolgenheid. Zie 2Ch 28:13 . Dat is, ten tijde als God zijn gramschap bewijst, door zijne straffen over de mensen uit te zenden. Zie Job 20:28 ."},{"catchword":"gerechtigheid","tekst":"Zie boven Pro 10:2 ."}],"5":[{"catchword":"maakt zijn weg","tekst":"Dat is, maakt dat hij door den goeden weg recht wandelt, zodat hij eindelijk geraakt waar hij wezen wil, te weten tot de eeuwige gelukzaligheid. Vergelijk boven Pro 3:6 , en de aantekening."},{"catchword":"valt","tekst":"Te weten, in zijn kwaden weg, zodat hij daarin vergaat zonder tot een gelukzalig einde te komen."}],"6":[{"catchword":"zal hen","tekst":"Te weten, naar de genadige belofte, die God hun gedaan heeft. Vergelijk dit met het einde van vs.4."},{"catchword":"gevangen","tekst":"Dat is, achterhaald en verstrikt in het kwaad, dat zij anderen aandoen willen, zulks dat het hunzelven ten verderve dient. Vergelijk Psa 7:16 , onder Pro 26:27 ; Ecc 10:8 ."},{"catchword":"verkeerdheid","tekst":"Alzo wordt het Hebreeuwse woord genomen, onder Pro 17:4 ."}],"7":[{"catchword":"zijn verwachting;","tekst":"Te weten, die hij had om hier door zijne macht en middelen nog voor een tijdlang op zijn gemak gelukkig te leven; of om hier nog enig kwaad aan te richten, waarmede hij zich, de zijnen en anderen, die op hem steunen, naar zijne wijze zou mogen goeddoen."},{"catchword":"allersterkste","tekst":"Hebreeuws, de hoop der sterkten, of vastigheden, of machten; dat is, zeer sterke, vaste of machtige hoop, te weten, die de goddelozen hadden. Of, hoop der sterkten; dat is, aller dingen, in welke hij zijne hoop stelde. Anders: de hoop der ongerechtigen vergaat."}],"8":[{"catchword":"in zijn plaats","tekst":"Dat is, in de benauwdheid, even alsof hij tot een rantsoen gegeven ware tot loslating van de vromen. Vergelijk onder Pro 21:18 ; Isa 43:3 ."}],"9":[{"catchword":"huichelaar","tekst":"Wat een huichelaar is, zie Job 8:13 ."},{"catchword":"den mond;","tekst":"Te weten, door zijn geveinsd spreken, hem lokkende tot de zonde en zich houdende alsof hij zijn vriend ware, daar hij nochtans zijn grote vijand is."},{"catchword":"wetenschap","tekst":"Te weten, door welke de rechtvaardigen verstaan dat men de zonden moet schuwen, omdat zij van God verboden zijn en gestraft worden, en dat men de huichelaar niet moet geloven."},{"catchword":"bevrijd","tekst":"Te weten, van het bedrog des huichelaars."}],"10":[{"catchword":"Een stad","tekst":"Dat is, de inwoners ener stad, te weten die wel gesteld is, zijnde voorzien van goede regering en burgerij. Stad voor hare inwoners; gelijk Gen 35:5 ; 1Sa 4:13 ; 1Ki 1:41 ; Isa 14:31 ; Mat 21:10 , enz."},{"catchword":"het welvaren","tekst":"Hebreeuws, in het goede; hetwelk men hier verstaan kan van den uiterlijken welstand der vromen. Zie het woord goed alzo genomen, Job 21:13 , en vergelijk de aantekening."}],"11":[{"catchword":"Door den zegen","tekst":"Dat is, door de zegening, die zij van God ontvangen, en voorts die zij spreken, de gebeden die zij doen, den raad dien zij geven en de weldaden die zij bewijzen."},{"catchword":"den mond","tekst":"Te weten, die valse leer drijft, kwade wetten geeft en schadelijke redenen tegen de regering voert."}],"12":[{"catchword":"veracht","tekst":"Te weten, niet alleen in zijn hart kwalijk van hem gevoelende, maar ook met zijn mond kwalijk van hem sprekende."},{"catchword":"groot verstand","tekst":"Hebreeuws, van verstanden."},{"catchword":"zwijgt stil","tekst":"Dat is, gevoelt het beste en spreekt niet kwalijk, ja niet met al, wanneer zulks met de liefde Gods en des naasten bestaan kan."}],"13":[{"catchword":"Die als","tekst":"Zie de eigen betekenis der oorspronkelijke manier van spreken Lev 19:16 ."},{"catchword":"van geest,","tekst":"Dat is, van wil, voornemen en genegenheid om de achterklappers niet gelijk te worden. Zie van het woord geest in deze betekenis genomen, 2Ki 19:7 ."}],"14":[{"catchword":"wijze","tekst":"Zie van dit woord Job 37:12 ."},{"catchword":"raadslieden","tekst":"Te weten, dergenen, die God vrezen, hun stuk wel verstaan en het welvaren des volks beminnen."}],"15":[{"catchword":"iemand","tekst":"Dit woord moet meermalen tot vervulling van den zin in onze taal ingevoegd worden, gelijk Exo 22:9 ; onder Pro 20:16 , en Pro 27:13 , enz."},{"catchword":"voor","tekst":"Dit woord is hier ingevoegd uit Pro 6:1 ."},{"catchword":"een vreemde","tekst":"Zie boven Pro 6:1 ."},{"catchword":"zekerlijk","tekst":"Hebreeuws, verbrekende verbroken worden; te weten, òf door de zorg en moeite, die hij zal hebben, òf door de schade, die hij zal lijden, òf door beide."},{"catchword":"degenen","tekst":"Dat is, die tot een teken van de beloofde betaling in de hand slaan. Zie boven Pro 6:1 , en de aantekening."},{"catchword":"zeker","tekst":"Of, gerust."}],"16":[{"catchword":"aangename","tekst":"Hebreeuws, vrouw der aangenaamheid; dat is, die aangenaam is, te weten door hare deugden."},{"catchword":"de eer vast,","tekst":"Te weten van verstandigheid, kuisheid, zedigheid, vriendelijkheid en kloeke huishouding."},{"catchword":"gelijk","tekst":"Zo wordt de letter Vau somtijds genomen. Zie Job 5:7 ."},{"catchword":"vasthouden","tekst":"Te weten, dat zij dien hun niet willen laten ontnemen."}],"17":[{"catchword":"goedertieren","tekst":"Hebreeuws, een man der goedertierenheid, of goedgunstigheid, of weldadigheid. Alzo een man der wetenschap; dat is, een vernuftig en verstandig man, onder Pro 24:5 ; een man der waarheid of trouw; dat is, waarachtig of getrouw, Neh 7:2 ; een man des vredes; dat is, die vreedzaam is, Psa 41:10 ; mannen der heiligheid; dat is heiligen, Exo 22:31 , enz. Vergelijk Job 11:11 ."},{"catchword":"doet","tekst":"Het Hebreeuwse woord betekent somtijds iemand goeddoen, gelijk hier Psa 13:6 ; Isa 63:7 ; somtijds kwaad doen; gelijk Isa 3:9 . Eigenlijk betekent het vergelden, hetzij in het goede of in het kwade. Zie 2Ch 20:11 ."},{"catchword":"zijn ziel","tekst":"Dat is, zichzelven; zie 1Ki 19:4 ."},{"catchword":"beroert","tekst":"Te weten, niet alleen door onnodige bekommering, maar ook door weigering van de nodige behoefte des voedsels, der kleding en woning."}],"18":[{"catchword":"een vals werk;","tekst":"Hebreeuws, een werk der valsheid; dat is, dat niet deugt, geen loon, profijt of voordeel inbrengt, maar gans nietig en tevergeefs is."},{"catchword":"gerechtigheid","tekst":"Dat is, die goede werken doen; hetwelk geschiedt wel met arbeid en moeite, maar ook met verwachting van een genadigen oogst. Vergelijk Hos 10:12 ; Gal 6:8 . Van het zaaien des onrechts, zie Job 4:8 ."},{"catchword":"trouwe loon","tekst":"Hebreeuws, loon der trouw, of waarheid."}],"20":[{"catchword":"verkeerden","tekst":"Versta, degenen, die in zake van geloof en van wandel niet oprecht zijn. Zie van de verkeerdheid des harten, Psa 101:4 ; boven Pro 6:14 ; onder Pro 12:8 , en Pro 17:20 ; Jer 17:9 ."},{"catchword":"van weg","tekst":"Alzo Psa 119:1 . Versta, degenen, die in het stuk van leer en leven rechtuit, onvervalst, zuiver van zin en gemoed zijn."},{"catchword":"Zijn welgevallen","tekst":"Dat is Hem welgevallig en aangenaam; alzo boven vs.1, en onder Pro 12:22 , en Pro 15:8 ."}],"21":[{"catchword":"Hand aan hand","tekst":"Dat is, van hand tot hand. Niet alleen in zijn eigen persoon, maar ook in zijne nakomelingen, die zijn boze wegen ingaan. Vergelijk Exo 20:5 , en Deu 5:9 . Anders: Al ware] hand aan hand, zo zal, enz. Dat is, hoewel de boze, in gevaar zijnde, van allen geholpen werd, zo zal hij nochtans de straf Gods niet ontgaan. Hans is hier voor hulp, gelijk 2Sa 3:12 , en 2Sa 14:19 ; Neh 2:18 ; Psa 119:173 ; onder Pro 16:5 ."},{"catchword":"onschuldig","tekst":"Dat is, niet ongestraft blijven. Zie 1Ki 2:9 ."},{"catchword":"zaad","tekst":"Dat is, kinderen en nakomelingen. Zie Gen 4:25 , en Gen 9:9 ; en de aantekeningen."},{"catchword":"ontkomen","tekst":"Te weten, door de hand en hulp Gods."}],"22":[{"catchword":"van rede","tekst":"Of, redelijkheid. Hebreeuws, van smaak; te weten, des geestes. Deze is het verstand en het oordeel des mensen. Zie Job 12:20 ."},{"catchword":"bagge","tekst":"Zie van de betekenis van het Hebreeuwse woord, Gen 24:22 ."}],"23":[{"catchword":"is alleenlijk","tekst":"Te weten, als zij recht wandelen op de weg der gerechtigheid, en daarop niet struikelen door menselijke zwakheid."},{"catchword":"verbolgenheid","tekst":"Dat is haat, nijd, spijtigheid, vijandschap en korzeligheid, waardoor zij onrust en moeite onder de mensen maken en Gods rechtvaardige gramschap verwekken."}],"24":[{"catchword":"uitstrooit,","tekst":"Uitstrooien is hier rijkelijk van zijne middelen uitdelen waar het nodig is, alzo Psa 112:9 ; in welken zin ook het woord zaaien gebruikt wordt, 2Co 9:6 ."},{"catchword":"dan recht is,","tekst":"Want de rijke, ja een ieder naar zijn vermogen, is schuldig den arme mede te delen."},{"catchword":"het is tot gebrek","tekst":"Dat is, hij wordt daardoor niet rijk."}],"25":[{"catchword":"De zegenende","tekst":"Hebreeuws, de ziel der zegening; dat is, die met weldoen een zegen is voor andere mensen. Zie boven vs.11."},{"catchword":"vet gemaakt","tekst":"Dat is, meer gezegend worden en gans welvaren. Zie dezelfde manier van spreken onder Pro 13:4 , en Pro 15:30 , en Pro 28:25 ."},{"catchword":"die bevochtigt,","tekst":"Dat is, die den armen rijkelijk mededeelt; gelijk men een dorre aarde met water bevochtigt."},{"catchword":"zelf","tekst":"Dat is, overvloediglijk met Gods zegen overgoten worden, en zo bevochtigd zijn alsof hij zelf ook een regen ware, waardoor hij ook meer middel zal krijgen om in het weldoen voort te varen."}],"27":[{"catchword":"het goede","tekst":"Dat is, zijnen naasten vlijtiglijk deugd doet."},{"catchword":"zoekt","tekst":"Te weten, alzo, dat hij ze ook vindt en krijgt."},{"catchword":"welgevalligheid;","tekst":"Waardoor hij God en den vromen mensen behagelijk is."},{"catchword":"natracht,","tekst":"Of, bezorgt."}],"28":[{"catchword":"rechtvaardigen","tekst":"Dat is, die zich op den rijkdom niet verlaten, maar op God alleen, naar zijn bevel; Psa 62:11-12 ."},{"catchword":"zullen groenen","tekst":"Dat is, zullen welvaren en welgelukzalig zijn. Vergelijk Psa 1:3 , en Psa 72:7 , en Psa 92:13 ; Isa 27:6 ; Hos 14:6 ."}],"29":[{"catchword":"beroert,","tekst":"Versta, die door ongeregelde huishouding en verkwisting van goederen zijn huisgezin berooid maakt en bedroeft. Vergelijk Gen 34:30 , en de aantekening."},{"catchword":"wind","tekst":"Dat is, niet met al, maar hij zal tot armoede komen. Vergelijk Job 7:7 ."},{"catchword":"knecht","tekst":"Dat is, lijfeigene, of immers dienstknecht, om den kost te krijgen. Vergelijk Gen 47:19 ."},{"catchword":"wijs","tekst":"Dat is, wel weet huis te houden."}],"30":[{"catchword":"vrucht","tekst":"Dat is, zijne onderwijzing en deugdzaamheid."},{"catchword":"is een boom","tekst":"Dat is, gelijk een boom des levens, die wat goeds voortbrengt, waardoor de mens ten eeuwigen leven gevoed en gesterkt wordt; vergelijk boven Pro 3:18 ."},{"catchword":"wie zielen","tekst":"Die de mensen trekt tot Gods kennis; vergelijk Mat 4:19 ."}],"31":[{"catchword":"vergolden","tekst":"Dat is, gestraft om zijne zonden. Zie van het Hebreeuwse woord Job 21:19 ."},{"catchword":"zondaar","tekst":"Te weten, die uitsteekt in het zondigen en zijn werk daarvan maakt. Zie 1Sa 15:18 ; Psa 1:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Deceitful balance [Hebr. Balance of deceit, so Hos 12:7. Amos 8.5. also balances of iniquity, Mic 6:1. The contrary are the balances of righteousness, Lev.19.36. Job 31:6.] is an abomination to the LORD, [Hebr. The Lords abomination; that is, which God esteemeth and accounteth an abomination; see Deut.17.on verse 1. And above chapter 3. On verse 32.] but a perfect weigh-stone [that is, weight; see Lev.19.on ver.36.] is his delight. [that is, is acceptable and well-pleasing unto him. See above chapter 10.on verse 32.Compare Lev 19:36. Deut.25.13. Pro 16:11. and 20.10,23.]"}],"2":[{"catchword":null,"tekst":"When pride cometh, (then) will also shame come: [To wit, by the just providence God, who useth commonly to punish sins with judgements, that are parallel or like unto the sins. For because proud persons despise other men, and especially humble men, and such as are brought low and pressed down by afflictions and crosses, therefore they are oftentimes brought to a fall, and to a low ebbe, and so justly rewarded with shame and disgrace. Compare below chapter 15.33. and 16.18. and 18.12.] but with the humble [or, mannerly, courteous, lowly] is wisdom. [to wit, so as not to come to shame or disgrace by reason of pride, whereby they continue in honour and repute with all wise and understanding men, and such as judge rightly. Compare below chapter 15. 33. And 18.12.]"}],"3":[{"catchword":null,"tekst":"The integrity of the upright them: [To wit, it leadeth and guideth them in the right way, in which they sincerely walk toward the good end of their journey where they would be. Compare below chapter 13.6.] but the perverseness of the faithless [to wit, whereby they seek to cousin and wrong their neighbour] disturbeth them. [that is, destroyeth them utterly. Oth. Layeth them waste, or spoileth them.]"}],"4":[{"catchword":null,"tekst":"Wealth profiteth not [To wit, the wicked] in the day of wrath: [to wit, in the day of Gods wrath and indignation. See 2 Chron.chapter 28. On verse 13. That is, at such a time, when God doth manifest his wrath, by sending out his judgements upon men. So Job 20.on verse 28. Compare above chapter 10.2. Eze 7:9. Zephan.1.18.] but righteousness delivereth from death. [see above chap.10.on verse 2.]"}],"5":[{"catchword":null,"tekst":"The righteousness of the upright maketh his way straight: [That is, causeth him to walk aright in the good way, so that he at last cometh where he would be, to wit, to everlasting bliss. Compare above chapter 3.8. and the annot.] but the wicked falleth [to wit, in his evil way, so that he perisheth in it, without coming to an happy and blessed end] by his (own) wickedness."}],"6":[{"catchword":null,"tekst":"The righteousness of the upright shall deliver them: [To wit, according to the gracious promise, that God hath made unto them. Comp. This with the end of the foregoing fourth verse] but the faithless are caught in (their own) perverseness. [that is, overtaken, and ensnared in the evil and mischief, which they intended to do unto others, so that it tendeth to their own destruction. Compare Psa 7:16. below chapter 26. Verse 27. Ecc 10:8. The Hebrew word rendered here perverseness, is so taken below chap.17.4.]"}],"7":[{"catchword":null,"tekst":"When the wicked man dieth, his expectation perisheth: [To wit, the expectation that he had, to live here yet a while at ease and in prosperity by reason of his wealth and means; or do here yet some mischief, whereby he might in a manner be able to benefit himself, those that belong to him, and others that rely and depend upon him] even the strongest hope [Hebr. The hope of strengths; or, firmnesses, or powers; that is, very strong, firm, or mighty hope, to wit, which the wicked had. Or, hope of strengths; that is, of all things, wherein he set his hope] is perished. [Oth. And the hope of unjust men perisheth.]"}],"8":[{"catchword":null,"tekst":"The righteous is delivered out of distress: [Compare Psa 34:20.] and the wicked cometh in his stead. [That is, in trouble, or distress, as if he were given for a ransom, to release the godly man. Compare below chap.21.18. Isa 43:3.]"}],"9":[{"catchword":null,"tekst":"The hypocrite [What an hypocrite is, see Job 8.on verse 13.] destroyeth his neighbour with (his) mouth: [to wit, by his collaging and dissembling speech, enticing him to sin, and demeaning himself as if he were his fast friend, whereas he is indeed his greatest enemy] but the righteous are delivered [to wit, from the deceit of the hypocrite] by knowledge. [to wit, whereby the righteous understand, that sins ought to be avoided, because they are forbidden by God, and punished by him, and that the hypocrite ought not to be believed.]"}],"10":[{"catchword":null,"tekst":"A City [That is, the inhabitants of a City that is in good plight, being furnished with good government, and good Citizens. City put for the inhabitants of it, as Gen 35:5. 1 Sam.4.13. 1 Kings 1.41. Isa 14:31. Mat.ch.21. verse 10. &c.] leapeth for joy, at the prosperity of the righteous: [Hebr. In the good, &c. Which may here be understood of the outward prosperity of the godly. See the word good so taken, Job 21:13. and compare the annotations] and when the wicked perish, there is shouting."}],"11":[{"catchword":null,"tekst":"By the blessing of the upright, [That is, by the blessing which they receive of God, and consequently which they speak, the prayers which they make, the counsel which they give, and the mercies which they shew] a City is exalted: but by the mouth of the wicked [to wit, who teach and maintain false doctrine, make bad laws, and give out hurtful speeches against the Commonwealth] it is broken."}],"12":[{"catchword":null,"tekst":"He that is void of understanding, despiseth his neighbour: [To wit, having not onely a bad opinion of him in his heart, but also speaking ill of him with his mouth] but a man of great understanding [Heb. Of understandings] holdeth his peace. [that is, hath a good opinion of him, and speaketh not ill of him, yea nothing at all, when it may consist with the love of God, and of his neighbour.]"}],"13":[{"catchword":null,"tekst":"He that walketh (as) a back-biter, [See the proper signification of the original phrase, Lev.19.on verse 16.] revealeth the thing that is secret: but he that is faithful in spirit, [that is, in will, intention, and affection, so as not to be like the tale-bearers, back-biters, or slanderers, see of the word spirit taken in this signification, 2 Kin.19.on verse 7.] covereth the matter."}],"14":[{"catchword":null,"tekst":"When there are no wise counsels, [See of the word rendered here wise counsels Job 37.v.12.] the people fall: [See 1 Kin.12.1, &c.] but in the multitude of Counsellors [to wit, of those that fear God, understand matters aright, and love the welfare of the people] (there) is preservation."}],"15":[{"catchword":null,"tekst":"When (any one) [This word must often be inserted to supply and fill up the sense, as Exo 22:9. bel.ch.20.v.16.& 27.13,&c.] is become surety (for) [this word is here inserted from ch.6.v.1.] a stranger, [see ab.ch.6.on v.1.] he shall surely be broken: [Heb. Breaking, be broken; to wit, either through care and trouble, which he shall have, or through the loss and damage that he shall suffer, or through both] but whoso hateth them that strike (hands), [that is, those that strike hands, to signify that they promise payment. See ab.ch.6.ver.1. and the annot.] is safe. [or, secure, or, quiet.]"}],"16":[{"catchword":null,"tekst":"A gracious wife [Heb. A woman of grace; that is, which is gracious and acceptable, to wit, by reason of her vertues] holdeth honour fast; [to wit, the honour of understanding, chastity, modesty, friendliness, prudent and wise house-keeping] as [so is the letter vau sometimes taken. See Job 5.on verse 7.] mighty men hold riches fast. [to wit, so that they will not suffer them to be taken from them.]"}],"17":[{"catchword":null,"tekst":"A merciful man [Hebr. A man of mercifulness, or, bounty, or, liberality. So a man of knowledge; that is, a knowing, and understanding man, below chapter 24 25. A man of truth, or faithfulness; that is, a true or faithful man, Nehemiah chapter 7. Verse 2. A man of peace; that is, one that is peaceable, Psa 41:10. men of holiness; that is, holy men, saints, Exo 22:31, &c. Compare Job 11.on ver.11.] doth good [the Hebrew word signifieth sometimes so do good to a man, as here, and Psa 13:6. Isa 63:7. sometimes to doe hurt, as Isa 3:9. Properly it signifieth to reward, or recompence, whethe // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

    toast.classList.add('zichtbaar');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
