 een voortgedreven ijdelheid van hen die de dood zoeken.","7":"De verwoesting van de goddelozen zal hen doorsnijden, omdat zij weigeren recht te doen.","8":"De weg van de mens is hele verkeerd en vreemd; maar het werk van de zuivere is recht.","9":"Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.","10":"De ziel van de goddeloze begeert het kwaad; zijn naaste krijgt geen genade in zijn ogen.","11":"Als men de spotter straft, wordt de eenvoudige wijs; en als men de wijze onderricht, neemt hij kennis aan.","12":"De rechtvaardige let verstandig op het huis van de goddeloze, als *God* de goddelozen in het kwaad stort.","13":"Wie zijn oor stopt voor het geschrei van de arme, die zal ook roepen, en niet verhoord worden.","14":"Een gift in het verborgene houdt de toorn onder, en een geschenk in de schoot de sterke woede.","15":"Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.","16":"Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.","17":"Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.","18":"De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.","19":"Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.","20":"In de woning van de wijze is een gewenste schat, en olie; maar een dwaas mens verslindt dat.","21":"Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.","22":"De wijze beklimt de stad van de geweldigen, en werpt de sterkte van hun vertrouwen neer.","23":"Wie zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.","24":"Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.","25":"De begeerte van de luiaard zal hem doden, want zijn handen weigeren te werken.","26":"De hele dag begeert hij begeerlijke dingen; maar de rechtvaardige zal geven, en niet inhouden.","27":"Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!","28":"Een leugenachtige getuige zal vergaan; en een man die hoort, zal spreken tot overwinning.","29":"Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.","30":"Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.","31":"Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE."},"SV":{"1":"Des konings hart is in de hand des HEEREN *als* waterbeken. Hij neigt het tot al wat Hij wil.","2":"Alle weg des mensen is recht in zijn ogen; maar de HEERE weegt de harten.","3":"Gerechtigheid en recht te doen is bij den HEERE uitgelezener dan offer.","4":"Hoogheid der ogen, en trotsheid des harten, *en* de ploeging der goddelozen, zijn zonde.","5":"De gedachten des vlijtigen zijn alleen tot overschot; maar van een ieder, die haastig is, alleen tot gebrek.","6":"Te arbeiden om schatten met een valse tong, is een voortgedrevene ijdelheid dergenen, die den dood zoeken.","7":"De verwoesting der goddelozen zal hen doorsnijden, omdat zij weigeren recht te doen.","8":"De weg des mensen is gans verkeerd en vreemd; maar het werk des zuiveren is recht.","9":"Het is beter te wonen op een hoek van het dak, dan met een kijfachtige huisvrouw, en dat *in* een huis van gezelschap.","10":"De ziel des goddelozen begeert het kwaad; zijn naaste krijgt geen genade in zijn ogen.","11":"Als men den spotter straft, wordt de slechte wijs; en als men den wijze onderricht, neemt hij wetenschap aan.","12":"De rechtvaardige let verstandelijk op des goddelozen huis, als *God* de goddelozen in het kwaad stort.","13":"Die zijn oor stopt voor het geschrei des armen, die zal ook roepen, en niet verhoord worden.","14":"Een gift in het verborgene houdt den toorn onder, en een geschenk in den schoot de sterke grimmigheid.","15":"Het is den rechtvaardige een blijdschap recht te doen; maar voor de werkers der ongerechtigheid is het verschrikking.","16":"Een mens, die van den weg des verstands afdwaalt, zal in de gemeente der doden rusten.","17":"Die blijdschap liefheeft, die zal gebrek lijden; die wijn en olie liefheeft, zal niet rijk worden.","18":"De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.","19":"Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige huisvrouw.","20":"In des wijzen woning is een gewenste schat, en olie; maar een zot mens verslindt zulks.","21":"Die rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.","22":"De wijze beklimt de stad der geweldigen, en werpt de sterkte huns vertrouwens neder.","23":"Die zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.","24":"Die een hovaardig pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.","25":"De begeerte des luiaards zal hem doden, want zijn handen weigeren te werken.","26":"Den gansen dag begeert hij begeerlijke dingen; maar de rechtvaardige zal geven, en niet inhouden.","27":"Het offer der goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!","28":"Een leugenachtig getuige zal vergaan; en een man, die hoort, zal spreken tot overwinning.","29":"Een goddeloos man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast .","30":"Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen den HEERE.","31":"Het paard wordt bereid tegen den dag des strijds; maar de overwinning is des HEEREN."},"KJV":{"1":"The king's heart *is* in the hand of the LORD, *as* the rivers of water: he turneth it whithersoever he will.","2":"Every way of a man *is* right in his own eyes: but the LORD pondereth the hearts.","3":"To do justice and judgment *is* more acceptable to the LORD than sacrifice.","4":"An high look, and a proud heart, *and* the plowing of the wicked, *is* sin.","5":"The thoughts of the diligent *tend* only to plenteousness; but of every one *that is* hasty only to want.","6":"The getting of treasures by a lying tongue *is* a vanity tossed to and fro of them that seek death.","7":"The robbery of the wicked shall destroy them; because they refuse to do judgment.","8":"The way of man *is* froward and strange: but *as for* the pure, his work *is* right.","9":"*It is* better to dwell in a corner of the housetop, than with a brawling woman in a wide house.","10":"The soul of the wicked desireth evil: his neighbour findeth no favour in his eyes.","11":"When the scorner is punished, the simple is made wise: and when the wise is instructed, he receiveth knowledge.","12":"The righteous *man* wisely considereth the house of the wicked: *but God* overthroweth the wicked for *their* wickedness.","13":"Whoso stoppeth his ears at the cry of the poor, he also shall cry himself, but shall not be heard.","14":"A gift in secret pacifieth anger: and a reward in the bosom strong wrath.","15":"*It is* joy to the just to do judgment: but destruction *shall be* to the workers of iniquity.","16":"The man that wandereth out of the way of understanding shall remain in the congregation of the dead.","17":"He that loveth pleasure *shall be* a poor man: he that loveth wine and oil shall not be rich.","18":"The wicked *shall be* a ransom for the righteous, and the transgressor for the upright.","19":"*It is* better to dwell in the wilderness, than with a contentious and an angry woman.","20":"*There is* treasure to be desired and oil in the dwelling of the wise; but a foolish man spendeth it up.","21":"He that followeth after righteousness and mercy findeth life, righteousness, and honour.","22":"A wise *man* scaleth the city of the mighty, and casteth down the strength of the confidence","23":"Whoso keepeth his mouth and his tongue keepeth his soul from troubles.","24":"Proud *and* haughty scorner *is* his name, who dealeth in proud wrath.","25":"The desire of the slothful killeth him; for his hands refuse to labour.","26":"He coveteth greedily all the day long: but the righteous giveth and spareth","27":"The sacrifice of the wicked *is* abomination: how much more, *when* he bringeth it with a wicked mind?","28":"A false witness shall perish: but the man that heareth speaketh constantly.","29":"A wicked man hardeneth his face: but *as for* the upright, he directeth his way.","30":"*There is* no wisdom nor understanding nor counsel against the LORD.","31":"The horse *is* prepared against the day of battle: but safety *is* of the LORD."}},"tsk":{"1":[{"kopje":"Het hart van de koning","refs":["Spr 16:1","Spr 16:9","Spr 20:24","Ezra 7:27","Ezra 7:28","Neh 1:11","Neh 2:4","Ps 105:25","Ps 106:46","Dan 4:35","Hand 7:10"]},{"kopje":"als","refs":["Ps 74:15","Ps 93:4","Ps 114:3","Ps 114:5","Jes 43:19","Jes 44:27","Openb 16:4","Openb 16:12"]}],"2":[{"kopje":"recht","refs":["Spr 16:2","Spr 16:25","Spr 20:6","Spr 30:12","Ps 36:3","Luk 18:11","Luk 18:12","Gal 6:3","Jak 1:22"]},{"kopje":"de HEERE","refs":["Spr 24:12","1 Sam 16:7","Jer 17:10","Luk 16:15","Joh 2:24","Joh 2:25","Openb 2:23"]}],"4":[{"kopje":"Hoogheid van de ogen","refs":["Spr 6:17","Spr 8:13","Spr 30:13","Ps 10:4","Jes 2:11","Jes 2:17","Jes 3:16","Luk 18:14","1 Petr 5:5"]},{"kopje":"en de","refs":["Spr 21:27","Spr 15:8","Rom 14:23"]}],"5":[{"kopje":"gedachten","refs":["Spr 10:4","Spr 13:4","Spr 27:23-27","Ef 4:28","1 Tess 4:11","1 Tess 4:12"]},{"kopje":"van ieder","refs":["Spr 14:29","Spr 20:21","Spr 28:22"]}],"6":[{"kopje":"arbeiden","refs":["Spr 10:2","Spr 13:11","Spr 20:14","Spr 20:21","Spr 22:8","Spr 30:8","Jer 17:11","1 Tim 6:9","1 Tim 6:10","Tit 1:11","2 Petr 2:3"]},{"kopje":"zoeken","refs":["Spr 8:36","Ezech 18:31"]}],"7":[{"kopje":"verwoesting","refs":["Spr 1:18","Spr 1:19","Spr 10:6","Spr 22:22","Spr 22:23","Ps 7:17","Ps 9:17","Jes 1:23","Jes 1:24","Jer 7:9-11","Jer 7:15","Ezech 22:13","Ezech 22:1 n class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> is <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> against the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> but <span class=\"wl wl-kjv\" data-code=\"H8668\">safety</span> is of the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in de hand","tekst":"Dat is, in zijn gebied en macht, om dat naar zijne wijsheid te leiden en te besturen."},{"catchword":"waterbeken","tekst":"Dat is, gelijk waterbeken zijn in de hand der hoveniers en landlieden, om die herwaarts en derwaarts tot nut des lands in of uit te laten en voort te leiden."}],"2":[{"catchword":"Alle weg","tekst":"Zie de verklaring van vs.2 boven Pro 16:2 ."},{"catchword":"harten","tekst":"Of, geesten; gelijk boven Pro 16:2 . Overzulks betekent hier het woord harten zoveel als daar het woord geesten; te weten gedachten; genegenheden, bewegingen en voornemen; alzo Psa 7:10 , en Psa 26:2 ."}],"3":[{"catchword":"Gerechtigheid","tekst":"De verklaring dezer manier van sprken, zie Gen 18:19 , en 1Ki 10:9 ."}],"4":[{"catchword":"Hoogheid","tekst":"Zie boven Pro 6:17 ."},{"catchword":"trotsheid","tekst":"Hebreeuws, breedheid des harten; dat is stoutheid en grootsheid des harten. Zie Psa 101:5 , en de aantekening."},{"catchword":"ploeging","tekst":"Dat is, het bedrijf. Versta, al wat zij heimelijk verzinnen en openbaarlijk in het werk stellen; alzo is het woord smeden genomen. Zie boven Pro 3:29 , waar het Hebreeuwse woord ook ploegen kan overgezet worden. Of aldus: Hoogheid der ogen en breedheid des harten zijn de ploeging, of het bedrijf der goddelozen, [en] zonde. Anders: de lamp der goddelozen; dat is hun welvaren en voorspoed, is zonde."}],"5":[{"catchword":"alleen","tekst":"Anders: waarlijk, of gewisselijk. Alzo in het volgende lid van vs.5."},{"catchword":"tot overschot;","tekst":"Dat is, worden zo gezegend van God dat de vlijtige arbeider daarvan niet alleen zijn dagelijkse noodruft krijgt, maar ook wat daarenboven voor een buitengewonen nood en voor zijne kinderen."},{"catchword":"die haastig is,","tekst":"Dat is, die met een schielijke en onvoorzichtige haastigheid door allerlei middelen zoekt rijk te worden; vergelijk boven Pro 20:21 ."}],"6":[{"catchword":"Te arbeiden","tekst":"Hebreeuws, het werk der schatten; dat is de arbeid, die gedaan wordt om veel goeds bijeen te rapen."},{"catchword":"valse tong,","tekst":"Hebreeuws, tong der valsheid; dat is die met valsheid en bedrog omgaat. Versta hieronder alle ongerechtigheid. Vergelijk boven Pro 6:17 , en de aantekening."},{"catchword":"voortgedrevene","tekst":"Versta, ijdelheid, die zeer onwaardig, nietig en vruchteloos is, zijnde te vergelijken bij kaf en stof, dat uit oorzaak zijner lichtheid door een sterken wind herwaarts en derwaarts verwaaid wordt."},{"catchword":"die den dood","tekst":"Dat is, die zich in gevaar der tijdelijke en eeuwige straffen begeven."}],"7":[{"catchword":"verwoesting","tekst":"Te weten, waardoor zij hunnen naaste verwoesten. Of, gelijk sommigen, waardoor zijzelf verwoest worden."},{"catchword":"zal hen doorsnijden,","tekst":"Of, zal hen doorzagen, nedervellen; gelijk wanneer een boom afgezaagd wordt; dat is, zal oorzaak zijn dat zij door Gods rechtvaardig oordeel ten enenmale uitgeroeid worden. Het shijnt dat hier gezien wordt op de manier van straf waardoor de misdadigers van de overheid met de zaag doorsneden werden. Zie 2Sa 12:31 . Anders: zal hen bijblijven; te weten, totdat zij ook verwoest zullen worden. Anders: de roof der goddelozen zal hen verschrikken."},{"catchword":"recht","tekst":"Dat is, een iegelijk het zijne te geven."}],"8":[{"catchword":"gans","tekst":"Te weten, door de verdorvenheid zijner natuur."},{"catchword":"vreemd;","tekst":"Te weten, van God of van de ware zuiverheid en heiligheid."},{"catchword":"het werk","tekst":"Dat is, die door den Geest der heiligmaking gezuiverd is."}],"9":[{"catchword":"van het dak,","tekst":"Want de daken in het land Kanaän waren plat, in welke het niet bekwaam was te wonen, omdat zij voor den wind en regen open waren en voornamelijk in hunne hoeken, waar het regenwater vergaderde en afliep. Vergelijk Deu 22:8 ."},{"catchword":"huis","tekst":"Dat is, in een wijd of ruim huis, waarin men gemakkelijk kan wonen met veel gezelschap, niet benauwd zijnde door de engte der plaats als in een hoek. Een huis van gezelschap kan men ook verstaan van een huis, waarin een man met ene vrouw samen wonen onder een huishouding begrepen zijnde. Vergelijk onder vs.19."}],"10":[{"catchword":"het kwaad;","tekst":"Versta, het kwaad der schuld, dat is de zonde."},{"catchword":"zijn naaste","tekst":"Of metgezel, of vriend. De zin is dat de goddeloze gans genegen is om een ieder kwaad te doen; of dat hij ook zijn eigen vriend niet spaart. Zie van het Hebreeuwse woord boven Pro 14:20 ."}],"11":[{"catchword":"straft,","tekst":"Te weten, niet alleen met woorden, maar ook met oplegging van boete gelijk het woord hier medebrengt, of ook met slagen, gelijk de tekst luidt, boven Pro 19:25 ."},{"catchword":"onderricht,","tekst":"Te weten, met woorden; zie boven Pro 19:25 . Anders: als hij, te weten, de slechte, verstandiglijk let op den wijze, enz."},{"catchword":"neemt hij","tekst":"Dat is, hij voegt zich bij zijn voorgaande wetenschap nog andere, dewijl hij de goede leer ontvangt en navolgt. Vergelijk boven Pro 1:5 ."}],"12":[{"catchword":"let verstandelijk","tekst":"Te weten, om zijn voordeel te doen met de aanmerkingen van de oordelen Gods."},{"catchword":"in het kwaad","tekst":"Te weten, in het kwaad der straf. Anders: om het kwaad, te weten der zonde, omkeert; dat is, om de zonde, die zij dagelijks bedrijven, verderft en uitroeit. Anders kan vs.12 aldus vertaald worden: Hij, te weten God, onderwijst den rechtvaardige door het huis des goddelozen, die de goddelozen in het kwade stort. Of aldus: Hetwelk [te weten, huis] de goddeloze in het kwade stort."}],"13":[{"catchword":"geschrei","tekst":"Te weten, waardoor hij schreit om hulp in zijne armoede."},{"catchword":"roepen,","tekst":"Te weten, tot God of de mensen, als hij in enigen nood gesteld is."}],"14":[{"catchword":"in het verborgene","tekst":"Te weten, gegeven aan den rechter, of iemand die zeer vergramd is."},{"catchword":"houdt","tekst":"Dat is, neemt hem weg, drukt hem neder, of blust hem uit."},{"catchword":"in den schoot","tekst":"Zie boven Pro 17:23 ."}],"15":[{"catchword":"recht te doen;","tekst":"Te weten, òf in hun gemene leven, òf in een bijzonder ambt, waarin hij gesteld is om het recht aan anderen te bedienen."},{"catchword":"der ongerechtigheid","tekst":"Hetzij dat hij de ongerechtigheid werkt als een gewoon mens, of als een publiek persoon."},{"catchword":"verschrikking","tekst":"Of, verslagenheid, verstoring; te weten, òf als hij zelf recht moet doen, òf wanneer het van anderen geschiedt."}],"16":[{"catchword":"doden","tekst":"Versta, der doden, niet alleen naar het lichaam, maar ook naar de ziel. Zie van het Hebreeuwse woord boven Pro 2:18 ."},{"catchword":"rusten","tekst":"Dat is, geduriglijk blijven."}],"17":[{"catchword":"blijdschap","tekst":"Te weten, ongeoorloofde, goddeloze en onmatige blijdschap."},{"catchword":"gebrek lijden;","tekst":"Hebreeuws, een man des gebreks of der behoefte zijn."},{"catchword":"wijn en olie","tekst":"Dat is, die een wellustig en overdadig leven zoekt. Hier voortijds gebruikte men in vrolijke maaltijden benevens den wijn, vele oliën en zalven, waarmede zij hunne leden, maar inzonderheid het hoofd bestreken, tot bewaring van de gezondheid en verkwikking van den geest. Zie Rth 3:3 ; Psa 23:5 ; onder Pro 27:9 ; Son 1:3 ; Amo 6:6 ; Mat 26:7 . Bovendien had de olie in het Joodse land nog veel ander gebruik. Zie Jdg 9:9 , en onder vs.20; maar hier wordt gesproken van het misbruik der olie en van den wijn, zijnde onder deze twee dingen ook alle andere begrepen, die den mens tot vermaking gegeven zijn."}],"18":[{"catchword":"De goddeloze","tekst":"De zin is dat in vele algemene straffen de vromen uit de gevaren, die hen meest plegen te dreigen, onvoorziens geraken, en de goddelozen, door Gods wijze en rechtvaardige regering, in hunne plaats komen, alsof zij hun losgeld waren. Zie boven, Pro 11:8 ."},{"catchword":"rantsoen","tekst":"Versta, den prijs, die gegeven wordt om iemand uit enig lijden te verlossen."}],"19":[{"catchword":"een woest land,","tekst":"Hebreeuws, in een land der woestijn."},{"catchword":"zeer kijfachtige","tekst":"Hebreeuws, ene huisvrouw der kijvingen en der toornigheid. Vergelijk boven vs.9, en Pro 19:13 ."}],"20":[{"catchword":"schat,","tekst":"Dienende tot onderhouding en vermaking des mensen; waaronder ook de olie was. Zie boven de aantekening vs.17."}],"21":[{"catchword":"rechtvaardigheid","tekst":"Te weten, waardoor men een ieder geeft wat men hem naar het burgerlijke recht schuldig is."},{"catchword":"weldadigheid","tekst":"Te weten, waardoor men den mens uit liefde en milddadigheid goeddoet naar den eis van de goddelijke en natuurlijke wet. Zie boven Pro 3:27 ."},{"catchword":"rechtvaardigheid","tekst":"Dat is, God zal maken dat hem ook recht van de mensen zal gedaan worden."}],"22":[{"catchword":"De wijze","tekst":"De zin is dat wijsheid meer te achten is dan sterkte, Ecc 9:16 ; gelijk de ervaring leert, dat dikwijls veel meer uitgericht wordt door het wijs beleid van een overste dan door de grote menigte der krijgslieden."},{"catchword":"beklimt","tekst":"Te weten, in tijd van oorlog."},{"catchword":"sterkte","tekst":"Dat is, de sterkten, waarop de stad zich verliet."}],"23":[{"catchword":"Die zijn mond","tekst":"Dat is, die wel toeziet dat hij met kwade, lichtvaardige en twistgierige redenen God niet vertoornt en zijn naaste niet tegen zich ophitst."}],"24":[{"catchword":"Die een hovaardig","tekst":"Of, die hovaardig [en] trots, of vermetel is, wiens naam is spotter, gaat met, enz."},{"catchword":"zijn naam","tekst":"Dat is, gelijk hij in der waarheid een spotter is, zo mag hij ook alzo wel genaamd worden, overmits hij alle goede vermaningen verwerpt en tegen zijn naaste met verachting trotselijk uitvaart. Zie een voorbeeld in Haman; Est 3:5-6 ."},{"catchword":"hij gaat","tekst":"Dat is, hij doet alle dingen door hoogmoedige en oplopende zinnen, volgende niet enige rede, maar zijn ongebonden driften."}],"25":[{"catchword":"begeerte","tekst":"Te weten, waardoor hij wenst zijne nooddruft te hebben, zonder daartoe door eerlijken arbeid te geraken."},{"catchword":"hem doden,","tekst":"Niet alleen tot grote armoede brengen, maar ook tot zijn gehelen ondergang."}],"26":[{"catchword":"begeerlijke","tekst":"Hebreeuws, de begeerte. Anders: begeert de begerige; dat is, de mens, die zeer begerig is, te weten om goed te krijgen; zie Job 35:13 ."},{"catchword":"zal geven,","tekst":"Te weten, aan den arme en nooddruftige, en dat naar zijn vermogen, van hetgeen hem God verleend heeft."}],"27":[{"catchword":"schandelijk","tekst":"Te weten, opzettelijk voorhebbende enige boosheid daarmede uit te richten, en gelijk als God aanroepende tot een hulp van hunne schelmerij. Zie hiervan een exempel in Bileam; Num 23:1 ."}],"28":[{"catchword":"Een leugenachtig","tekst":"Hebreeuws, een getuige der leugenen."},{"catchword":"die hoort,","tekst":"Te weten, naar de wet des Heeren, en voornamelijk naar het gebod van geen valse getuigenis te geven. Of, die naarstiglijk toehoort en niets anders getuigt dan hetgeen hij gehoord of gezien heeft."},{"catchword":"tot overwinning","tekst":"Anders: altoos; te weten, hetzij hij geroepen wordt in het gericht om getuigenis te geven, of anderszins om iets naar de waarheid, die hem bekend is, te verhalen, gelijk nodig en stichtelijk is."}],"29":[{"catchword":"sterkt zich","tekst":"Of, stijft zich; dat is, verhardt zijn aangezicht. De zin is dat hij met grote hardnekkigheid en onbeschaamdheid zijn eigen zin volgt, zonder acht te geven op hetgeen recht en hem bevolen is."},{"catchword":"maakt zijn weg","tekst":"Te weten, omdat hij al zijn doen en laten naar Gods Woord aanricht."}],"30":[{"catchword":"tegen den HEERE","tekst":"Dat is, die met des Heeren wijsheid en verstand enz. te vergelijken is, en die zou kunnen wederstaan."}],"31":[{"catchword":"paard","tekst":"Versta onder dit woord alle uiterlijke middelen, die tegen den oorlog en den strijd plegen aangelegd te worden."},{"catchword":"overwinning","tekst":"Zie 2Sa 8:6 ."},{"catchword":"is des HEEREN","tekst":"Dat is, komt van den Heere."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Kings hearts in the hand of the LORD, [That is, in his command and power, to direct and guide it according to his wisdom] (as) water-brooks: [that is, as water-brooks are in the hand of gardeners, and husband-men, to let them in and out at their pleasure, and to carry them whithersoever they list for the use and benefit of the land and country] he enclineth it to all that he will."}],"2":[{"catchword":null,"tekst":"All (Or every) way of a man, is right his (own) eyes: [See the exposition of this verse above chap.16.on verse 2.] but the LORD weighteth the hearts. [or, spirits, as above chap.16.2. In this regard the word hearts signifieth here, as much as the word spirits doth there; to wit, the thoughts, affections, inclinations, motions, and purposes. So Psa 7:10. and 26.2.]"}],"3":[{"catchword":null,"tekst":"To do justice, and judgement, [See the exposition of this phrase, Gen.18. on verse 19. And 1 Kings 10. On verse 9.] is a more choice (thing) with the LORD, then offering. [Compare 1 Sam.15.22. Psa 50:8,14. Isa.1,11,16. Hos 6:6.]"}],"4":[{"catchword":null,"tekst":"Haughtiness of eyes, [See above chap.6.on verse 17.] and pride of hearts, [Hebr. Breadth of heart; that is, stoutness, and pride of heart. See Psa 101:5. and the annot.] (and) the plowing of the wicked, [that is, the practice of the wicked. To wit, whatsoever they secretly plot and invent, and do publicly put in practice; so is the word forging taken, see above chapter 3.on verse 29. Where the Hebrew word may likewise be translated plowing] are sin. [or thus: highness of eyes, and broadness of heart, are the plowing, or, the practice of the wicked, (and) sin. Oth. The lamp of the wicked; that is, their welfare and prosperity, is sin.]"}],"5":[{"catchword":null,"tekst":"The thoughts of the diligent are (or tend) onely [Oth. Truly, or, certainly; so i n the following clause of this verse] to a remainder, [that is, they are so blessed by God, that the diligent labourer, or pains-taker, gets not onely his daily necessaries supplied thereby, but also somewhat over and above for an extraordinary time of need, and for to give and leave unto his children, compare above chapter 10.4. and 13.4.] but of every one, that is hasty, [that is, that with a rash and improvident or unadvised hastiness seeketh to grow rich by all manner of means or ways whatsoever. Compare above chap.20.21.] onely to want."}],"6":[{"catchword":null,"tekst":"To labour for treasures [Hebr. The work of treasures; that is, the labour that is done, or the pains that is taken to get store of wealth] with a false tongue [Heb. Tongue of falsehood; that is, tongue that useth falsehood and deceit. Understand under this notion of false tongue, all manner of injustice or wrong-dealing. Compare ab.ch.6.17. and the annot.] is a vanity driven forward [meaning a vanity, which is of no value, exceeding empty, and unprofitable, being to be compared with chaff, and dust, that by reason of its lightness is blown and tossed to and fro by a strong or mighty wind. Compare above chap.10.2,4. And 13.11.] of them that seek death. [that is, of those that rush into danger both of temporal and eternal punishment.]"}],"7":[{"catchword":null,"tekst":"The wasting of the wicked [To wit, whereby they waste and devour their neighbour, or as some, whereby they themselves shall be wasted] shall cut them whereby they themselves shall be wasted] shall cut them asunder; [or, shall saw them asunder, cast them down; as when a tree is sawn down; that is, shall be an occasion, that by Gods just judgement they be utterly destroyed. It seemeth that here respect is had to that kind of punishment, whereby malefactors were by the Magistrate cut asunder with the saw, or sawen in pieces, See 2 Sam.12. on verse 31. Oth. Shall tarry, or, abide with them; to wit, until they also shall be wasted, or, destroyed. Oth. The robbery of the wicked shall affrighted them] because they refuse to do judgement. [that is, to give every one his due.]"}],"8":[{"catchword":null,"tekst":"The way of man is exceeding perverse, [To wit, by the corruption of his nature] and strange: [to wit, from God, or from true purity and holiness] but the work of the pure, [that is, of him that is cleansed and purified by the spirit of sanctification] is right."}],"9":[{"catchword":null,"tekst":"It is better to dwell in a corner of the house-top [For the tops of the houses in the land of Canaan were flat, wherein it was not convenient to dwell, because they lay open both to wind and rain: and especially in the corners of those house-tops, where the rain-water did gather, and run down. Compare Deut.22.on verse 8.] then with a brawling wife, and that (in) an house of company. [that is, in a wide, or large house, wherein a man may easily dwell with a great company, without being straitened for want of room, as in a corner. An house of company may also be understood of an house, wherein man and wife live together, being comprehended under one family or house-keeping. Compare below verse 19.]"}],"10":[{"catchword":null,"tekst":"The soul of the wicked desireth evil: and [Meaning the evil of guilt; that is, sin] his neighbour [or, companion, or, friend] getteth no favour in his eyes. [the meaning is, that a wicked man is wholly bent to do every one mischief; or, that the he spareth not even his own friend. See of the Hebrew word above chapter 14.on verse 20.]"}],"11":[{"catchword":null,"tekst":"When the scorner is punished, [To wit, not onely reproved or rebuked with words, but also by charging a fine, or an amercement upon him, as the here used importeth, or also with blows, as the Text holdeth forth, above chapter 19.25.] the simple is made wise: [compare above chapter 19.25.] and when the wise is instructed, [to wit, with words, see above ch.19.on verse 25. Oth. When he; to wit, the simple, understandingly heedeth the wise] he receiveth knowledge. [that is, he addeth unto his former knowledge yet other also, forasmuch as he entertaineth, and followeth the doctrine that is good. Compare above ch.1.5.]"}],"12":[{"catchword":null,"tekst":"The righteous heedeth understandingly the house of the wicked; [to wit, so as to profit by the observation of Gods judgements that come upon it] when (God) poureth thew wicked into evil. [to wit, into the evil of punishment. Oth. Overthroweth the wicked for evil, to wit, for the evil of sin; that is, consumed and destroyeth them for the sins, which they daily commit. Otherwise this verse might be thus rendered, or translated: he, to wit, God, instructeth the righteous by the hand of the wicked, who poureth the wicked into evil. Or thus: which (to wit, house) poureth the wicked into evil.]"}],"13":[{"catchword":null,"tekst":"He that stoppeth his ear at the cry of the poor; [To wit, whereby he cryeth for help and relief in his poverty] he shall also cry, [to wit, unto God, or unto men, when he is in any strait, or distress] and not be heard."}],"14":[{"catchword":null,"tekst":"A gift in secret [To wit, given to the Judge, or to one that is exceedingly provoked to anger] restraineth anger: [that is, removeth it, crusheth it down, or quencheth it] and a reward in the bosome, [see above ch.17.on verse 23.] strong wrath. [compare above ch.17.8. and 18.16.]"}],"15":[{"catchword":null,"tekst":"It is joy to the righteous, to do right: [To wit, either in his private life, or in a peculiar office, wherein he is placed, to administer right and justice unto others] but it is terror [or, amazement, or, trouble; to wit, either when he must do justice himself, or when it is done by others] for the workers of iniquity. [whether they work iniquity as private men, or as public persons.]"}],"16":[{"catchword":null,"tekst":"A man that wandereth out of the way of understanding, shall rest [That is, continually remain] in the congregation of the dead. [meaning such as are not onely dead in body, but also in soul. See of the Hebrew word above ch.2.on verse 18.]"}],"17":[{"catchword":null,"tekst":"He that loveth gladness, [To wit, unlawful, wicked, and immoderate joy, or gladness] he shall suffer want: [Hebr. Shall be a man of want: or, of need] he that a voluptuous, and intemperate life. Heretofore at merry feast they used many oils and ointments, wherewith they anointed their members, and especially the head, for the preservation of health, and reviving of the spirit. See Ruth 3.on verse 3. Psa 23:5. below ch.27.9. Cant.1.3. Amos 6.6. Mat 26:7. Besides this, oil had yet other uses in the land of Juda. See Judg.9.on verse 9. And below verse 20. But here is spoken of the abuse of oil, and wine, all other things (that are given for the comfort and chearing of man) being comprehended under these two.]"}],"18":[{"catchword":null,"tekst":"The wicked is a ransom [By ransom if meant the price, or sum of money, that is paid to redeem a man out of misery, or suffering] for the righteous; and the faithless, for the upright. [the meaning is, that in many common calamities godly persons get out of dangers, that are wont to threaten them most, and wicked men by the wise and just Providence of God come in their stead, as if so be they were their ransom, or redemption-money. See above ch.11.on verse 8.]"}],"19":[{"catchword":null,"tekst":"It is better to dwell in a waste land; [Hebrew in a land of wilderness] then with a very brawling, and angry wife. [Hebr. A wife of brawlings, and of anger. Compare above verse 9. And ch.19.13. and below ch.25.24.]"}],"20":[{"catchword":null,"tekst":"In the dwelling of the wise is a desired treasure; [Serving to the preservation, and cheering of man; under which was also oil comprehended, mentioned in the following words, See above the annotations on verse 17.] and oil: but a foolish man devoureth such things."}],"21":[{"catchword":null,"tekst":"He that pursueth after righteousness, [To wit, whereby a man giveth to every one that which is his due, according to the civil law, or the law of nations] and mercy, [to wit, whereby we do good unto a man out of love, and liberality, as the law of God, and the Law of nature requireth, see above chap.3.on verse 27.] shall find life, righteousness, [that is, God will cause that justice and equity be likewise done unto him by men] and honour."}],"22":[{"catchword":null,"tekst":"The wise scaleth the city of the mighty; [To wit, in time of war] and casteth down the strength of the confidence thereof. [that is, the castles, and strong holds, whereon the city relied. The meaning is, that wisdom is to be more esteemed, and regarded, then strength, Ecc 9:16. as experience teacheth, that oftentimes there is more good done by the wise managing or direction of one Commander, then by the great multitude of souldiers in the Army.]"}],"23":[{"catchword":null,"tekst":"He that keepeth his mouth, and his tongue. [That is, he that taketh heed that he provoked not God, nor incense his neighbour against himself, by evil, vain, and contentious words] keepeth his soul from distresses. [compare above ch.18.21.]"}],"24":[{"catchword":null,"tekst":"He that is a proud boaster, his name is scorner, [That is, as he indeed and in truth a scorner, so may he likewise be justly so called; because he casteth aside all good admonitions, and falleth proudly upon his neighbour with contempts and disdainings of him. See an example in Haman, Esth.3.5,6.] he dealeth in proud wrath. [that is, he doth all things with a losty and soaring spirit, following not the guide or dictates of reason, but his own loose passions and disordered affections. Or, he that is proud, (and) haughty, or, presumptuous, whose name is scorner, dealeth in proud wrath."}],"25":[{"catchword":null,"tekst":"The desire of the slothful [To wit, whereby he desireth to have his want or need supplied, without endeavouring to attain unto it by honest labour] shall kill him; [that is, it shall not onely bring him to great poverty, but also to his utter ruine] for his hands refuse to work."}],"26":[{"catchword":null,"tekst":"He covereth all the day long desirable things: [Hebr. The desire. Oth. He coveteth the covetous; that is, the man that is very covetous, or desirous; to wit, to get wealth. See Job 34.on verse 13.] but the righteous shall give, [to wit, unto the poor and needy, and that according to his ability, of that which God hath given him] and not refrain. [compare Psa 37:26.]"}],"27":[{"catchword":null,"tekst":"The sacrifice of the wicked is an abomination: [Compare above ch.15.8. Isa 1:13. Jer 6:20. Amos 5.21.] how much more when they bring it with a wicked intent? [to wit, expressly intending to effect or accomplish some wicked act thereby, and as it were calling upon God to be an help to advance and set forward their villainy. See an example hereof in Bileam, Num 23:1.]"}],"28":[{"catchword":null,"tekst":"A lying witness [Hebr. A witness of lies] shall perish: [Compare above chapter 19.5,9.] and a man that hearkeneth, [to wit, unto the law of God, and especially to the commandment of bearing no false witness; or, he that giveth diligent attention, and witnesseth nothing else, but what he hath heard, or seen] shall speak thing else, but what he hath heard, or seen] shall speak unto victory. [Oth. Always: to wit, whether he be summoned in judgement, to give in evidence, or else to relate a thing that he knoweth, according to truth, when it is needful, and profitable to edification.]"}],"29":[{"catchword":null,"tekst":"A wicked man strengtheneth himself in his face; [ (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
