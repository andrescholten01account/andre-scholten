d; en door de vreze van de HEERE wijkt men af van het kwade.","7":"Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.","8":"Beter is een weinig met gerechtigheid, dan de veelheid van inkomsten zonder recht.","9":"Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.","10":"Een uitspraak van God is op de lippen van de koning; zijn mond zal niet zondigen in het gericht.","11":"Een eerlijke weegschaal en balans zijn van de HEERE; alle gewichten in de zak zijn Zijn werk.","12":"Het is voor koningen een gruwel goddeloosheid te doen; want door gerechtigheid wordt de troon bevestigd.","13":"De lippen van de gerechtigheid zijn het welbehagen van koningen; en ieder van hen zal liefhebben wie oprechte dingen spreekt.","14":"De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.","15":"In het licht van het gezicht van de koning is leven; en zijn welbehagen is als een wolk van de late regen.","16":"Hoeveel beter is het wijsheid te verkrijgen dan goud, en voortreffelijker: verstand te verkrijgen dan zilver!","17":"De weg van de oprechten is van het kwaad af te wijken; hij bewaart zijn ziel, die zijn weg bewaakt.","18":"Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.","19":"Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.","20":"Wie op het woord verstandig let, zal het goede vinden; en wie op de HEERE vertrouwt, is gelukkig.[2]","21":"Wie wijs van hart is, zal verstandig genoemd worden; en zoetheid van de lippen zal de lering vermeerderen.","22":"Het verstand van hen die het bezitten is een bron van leven; maar de tucht van de dwazen is dwaasheid.","23":"Het hart van een wijze maakt zijn mond verstandig, en zal op zijn lippen de lering vermeerderen.","24":"Vriendelijke woorden zijn een honingraat, zoet voor de ziel, en medicijn voor het gebeente.","25":"Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.","26":"De ziel van de arbeidzame arbeidt voor zichzelf; want zijn mond dringt hem daartoe.","27":"Een nietswaardig man graaft kwaad op; en op zijn lippen is als brandend vuur.","28":"Een verkeerd man zal onenigheid zaaien; en een lasteraar scheidt de beste vrienden.","29":"Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.","30":"Hij sluit zijn ogen, om verkeerdheden te bedenken; zijn lippen samenknijpend, brengt hij het kwaad tot stand.","31":"Grijs haar is een sierlijke kroon; zij wordt gevonden op de weg van de gerechtigheid.","32":"Wie geduldig is, is beter dan de sterke; en wie heerst over zijn geest, dan wie een stad inneemt.","33":"Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE."},"SV":{"1":"De mens heeft schikkingen des harten; maar het antwoord der tong is van den HEERE.","2":"Alle wegen des mans zijn zuiver in zijn ogen; maar de HEERE weegt de geesten.","3":"Wentel uw werken op den HEERE, en uw gedachten zullen bevestigd worden.","4":"De HEERE heeft alles gewrocht om Zijns Zelfs wil; ja, ook den goddeloze tot den dag des kwaads.","5":"Al wie hoog is van hart, is den HEERE een gruwel; hand aan hand, zal hij niet onschuldig zijn.","6":"Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze des HEEREN wijkt men af van het kwade.","7":"Als iemands wegen den HEERE behagen, zo zal Hij ook zijn vijanden met hem bevredigen.","8":"Beter is een weinig met gerechtigheid, dan de veelheid der inkomsten zonder recht.","9":"Het hart des mensen overdenkt zijn weg; maar de HEERE stiert zijn gang.","10":"Waarzegging is op de lippen des konings; zijn mond zal niet overtreden in het gericht.","11":"Een rechte waag en weegschaal zijn des HEEREN; alle weegstenen des zaks zijn Zijn werk.","12":"Het is der koningen gruwel goddeloosheid te doen; want door gerechtigheid wordt de troon bevestigd.","13":"De lippen der gerechtigheid zijn het welgevallen der koningen; en elkeen van hen zal liefhebben dien, die rechte dingen spreekt.","14":"De grimmigheid des konings is *als* de boden des doods; maar een wijs man zal die verzoenen.","15":"In het licht van des konings aangezicht is leven; en zijn welgevallen is als een wolk des spaden regens.","16":"Hoeveel beter is het wijsheid te bekomen, dan uitgegraven goud, en uitnemender, verstand te bekomen, dan zilver!","17":"De baan der oprechten is van het kwaad af te wijken; hij behoedt zijn ziel, die zijn weg bewaart.","18":"Hovaardigheid is voor de verbreking, en hoogheid des geestes voor den val.","19":"Het is beter nederig van geest te zijn met de zachtmoedigen, dan roof te delen met de hovaardigen.","20":"Die op het woord verstandelijk let, zal het goede vinden; en die op den HEERE vertrouwt, is welgelukzalig.","21":"De wijze van hart zal verstandig genoemd worden; en de zoetheid der lippen zal de lering vermeerderen.","22":"Het verstand dergenen, die het bezitten, is een springader des levens; maar de tucht der dwazen is dwaasheid.","23":"Het hart eens wijzen maakt zijn mond verstandig, en zal op zijn lippen de lering vermeerderen.","24":"Liefelijke redenen zijn een honigraat, zoet voor de ziel, en medicijn voor het gebeente.","25":"Er is een weg, die iemand recht schijnt; maar het laatste van dien zijn wegen des doods.","26":"De ziel des arbeidzamen arbeidt voor zichzelven; want zijn mond buigt zich voor hem.","27":"Een Belialsman graaft kwaad; en op zijn lippen is als brandend vuur.","28":"Een verkeerd man zal krakeel inwerpen; en een oorblazer scheidt den voornaamsten vriend.","29":"Een man des gewelds verlokt zijn naaste, en hij leidt hem in een weg, die niet goed is.","30":"Hij sluit zijn ogen, om verkeerdheden te bedenken; zijn lippen bijtende, volbrengt hij het kwaad.","31":"De grijsheid is een sierlijke kroon; zij wordt op den weg der gerechtigheid gevonden.","32":"De lankmoedige is beter dan de sterke; en die heerst over zijn geest, dan die een stad inneemt.","33":"Het lot wordt in den schoot geworpen; maar het gehele beleid daarvan is van den HEERE."},"KJV":{"1":"The preparations of the heart in man, and the answer of the tongue, *is* from the LORD.","2":"All the ways of a man *are* clean in his own eyes; but the LORD weigheth the spirits.","3":"Commit thy works unto the LORD, and thy thoughts shall be established.","4":"The LORD hath made all *things* for himself: yea, even the wicked for the day of evil.","5":"Every one *that is* proud in heart *is* an abomination to the LORD: *though* hand *join* in hand, he shall not be unpunished.","6":"By mercy and truth iniquity is purged: and by the fear of the LORD *men* depart from evil.","7":"When a man's ways please the LORD, he maketh even his enemies to be at peace","8":"Better *is* a little with righteousness than great revenues without right.","9":"A man's heart deviseth his way: but the LORD directeth his steps.","10":"A divine sentence *is* in the lips of the king: his mouth transgresseth not in judgment.","11":"A just weight and balance *are* the LORD'S: all the weights of the bag *are* his work.","12":"*It is* an abomination to kings to commit wickedness: for the throne is established by righteousness.","13":"Righteous lips *are* the delight of kings; and they love him that speaketh right.","14":"The wrath of a king *is as* messengers of death: but a wise man will pacify","15":"In the light of the king's countenance *is* life; and his favour *is* as a cloud of the latter rain.","16":"How much better *is it* to get wisdom than gold! and to get understanding rather to be chosen than silver!","17":"The highway of the upright *is* to depart from evil: he that keepeth his way preserveth his soul.","18":"Pride *goeth* before destruction, and an haughty spirit before a fall.","19":"Better *it is to be* of an humble spirit with the lowly, than to divide the spoil with the proud.","20":"He that handleth a matter wisely shall find good: and whoso trusteth in the LORD, happy","21":"The wise in heart shall be called prudent: and the sweetness of the lips increaseth learning.","22":"Understanding *is* a wellspring of life unto him that hath it: but the instruction of fools *is* folly.","23":"The heart of the wise teacheth his mouth, and addeth learning to his lips.","24":"Pleasant words *are as* an honeycomb, sweet to the soul, and health to the bones.","25":"There is a way that seemeth right unto a man, but the end thereof *are* the ways of death.","26":"He that laboureth laboureth for himself; for his mouth craveth","27":"An ungodly man diggeth up evil: and in his lips *there is* as a burning fire.","28":"A froward man soweth strife: and a whisperer separateth chief friends.","29":"A violent man enticeth his neighbour, and leadeth him into the way *that is* not good.","30":"He shutteth his eyes to devise froward things: moving his lips he bringeth evil to pass.","31":"The hoary head *is* a crown of glory, *if* it be found in the way of righteousness.","32":"*He that is* slow to anger *is* better than the mighty; and he that ruleth his spirit than he that taketh a city.","33":"The lot is cast into the lap; but the whole disposing thereof *is* of the LORD."}},"tsk":{"1":[{"kopje":"plannen","refs":["Spr 16:9","Spr 19:21","Spr 20:24","Spr 21:1","2 Kron 18:31","Ezra 7:27","Neh 1:11","Ps 10:17","Ps 119:36","Jer 10:23","Jer 32:39","Jer 32:40","Ezech 36:26","Ezech 36:27","2 Kor 8:16","Fil 2:13","Jak 1:16-18"]},{"kopje":"maar","refs":["Ex 4:11","Ex 4:12","Ex 4:15","Jer 1:7-9","Matt 10:19","Matt 10:20","Luk 12:11","Luk 12:12","Luk 21:14","Luk 21:15"]}],"2":[{"kopje":"wegen","refs":["Spr 16:25","Spr 21:2","Spr 30:12","1 Sam 15:13","1 Sam 15:14","Ps 36:3","Jer 2:22","Jer 2:23","Luk 18:9-11","Rom 7:7-9"]},{"kopje":"maar","refs":["Spr 5:21","Spr 24:12","1 Sam 16:7","Jes 26:7","Jer 17:10","Dan 5:27","Luk 16:15","Openb 2:18","Openb 2:23"]}],"3":[{"kopje":"uw werken","refs":["Job 5:8","Ps 37:4","Ps 37:5","Ps 55:23","Matt 6:25-34","Luk 12:22","Fil 4:6","1 Petr 5:7"]},{"kopje":"uw n class=\"wl wl-kjv\" data-code=\"H6504\">separateth</span> chief friends.","29":"A <span class=\"wl wl-kjv\" data-code=\"H2555\">violent</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6601\">enticeth</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">leadeth</span> him into the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that is not good.","30":"He <span class=\"wl wl-kjv\" data-code=\"H6095\">shutteth</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> to <span class=\"wl wl-kjv\" data-code=\"H2803\">devise</span> froward <span class=\"wl wl-kjv\" data-code=\"H8419\">things:</span> <span class=\"wl wl-kjv\" data-code=\"H7169\">moving</span> his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> he <span class=\"wl wl-kjv\" data-code=\"H3615\">bringeth</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> to pass.","31":"The hoary <span class=\"wl wl-kjv\" data-code=\"H7872\">head</span> is a <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> of <span class=\"wl wl-kjv\" data-code=\"H8597\">glory,</span> if it be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of righteousness.","32":"He that is <span class=\"wl wl-kjv\" data-code=\"H750\">slow</span> to <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty;</span> and he that <span class=\"wl wl-kjv\" data-code=\"H4910\">ruleth</span> his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> than he that <span class=\"wl wl-kjv\" data-code=\"H3920\">taketh</span> a city.","33":"The <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> is <span class=\"wl wl-kjv\" data-code=\"H2904\">cast</span> into the <span class=\"wl wl-kjv\" data-code=\"H2436\">lap;</span> but the whole <span class=\"wl wl-kjv\" data-code=\"H4941\">disposing</span> thereof is of the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"schikkingen","tekst":"Versta, de gedachten, die de mens in zijn hart zich ordelijk voorstelt en voorneemt, doch de krachtige regering Gods geenszins uitgesloten zijnde. Zie onder Pro 21:1 ."},{"catchword":"antwoord","tekst":"Het Hebreeuwse woord betekent wel eigenlijk antwoorden; maar het wordt ook voor allerlei reden en aanspraak genomen; zie boven Pro 15:1 ."},{"catchword":"is van den HEERE","tekst":"Te weten, onder hetwelk zij niet kunnen uitspreken wat zij bedacht hebben, noch uitrichten wat zij besproken hebben."}],"2":[{"catchword":"wegen","tekst":"Dat is, zijn leven, zijn doen en laten; zie Gen 6:12 ."},{"catchword":"in zijn ogen;","tekst":"Dat is, in zijn eigen oordeel en goeddunken. Zie Job 18:3 ."},{"catchword":"weegt","tekst":"Dat is, onderzoekt, doorgrondt, beproeft en bevindt. Alzo onder Pro 21:2 , en Pro 24:12 ."},{"catchword":"geesten","tekst":"Dat is, gedachten, genegenheden, bewegingen en het voornemen. Zie 2Ki 19:7 ."}],"3":[{"catchword":"Wentel","tekst":"Zie Psa 22:9 , en Psa 37:5 ."},{"catchword":"gedachten","tekst":"Welke schikkingen des harten genaamd worden, boven vs.1; zie aldaar de aantekening."}],"4":[{"catchword":"om Zijns Zelfs wil;","tekst":"Dat is, om zijner ere wil; te weten, opdat in al zijne werken klaarlijk schijnen zou zijne wijsheid, macht, goedheid, rechtvaardigheid en al zijn andere goddelijke eigenschappen. Vergelijk Rom 9:17 , Rom 9:22-23 , en Rom 11:36 ; Eph 1:5-6 , Eph 1:12 , Eph 1:14 ."},{"catchword":"des kwaads","tekst":"Versta, het kwaad der straf."}],"5":[{"catchword":"hoog is","tekst":"Dat is, hoogmoedig, hovaardig en trots. Zie van deze ondeugd boven Pro 6:17 , en Pro 8:13 , idem vs.18."},{"catchword":"den HEERE","tekst":"Hebreeuws, des Heeren gruwel."},{"catchword":"hand aan hand,","tekst":"Zie den zin dezer woorden, boven Pro 11:21 ."}],"6":[{"catchword":"goedertierenheid","tekst":"Dat is, door de loutere genade des Heeren, die waarachtig en trouw is in zijne beloften, wordt de zonde, om de verzoening, die door Christus geschied is, weggenomen; Rom 3:24 . Of versta dit van de goedheid en trouw, die de mensen elkander bewijzen, te weten, niet om daarmede de vergeving der zonden voor God te verdienen, maar als door vruchten van het rechtvaardigmakende geloof zichzelven te verzekeren en aan anderen openbaar te maken dat zij met God uit genade verzoend zijn. Ook kan de verzoening verstaan worden van den vrede, dien wij maken door allerlei bewijs van liefde en weldadigheid met hem, dien wij misdaan hebben, en alzo met hem verzoenen. Vergelijk boven Pro 10:12 , en de aantekening."},{"catchword":"kwade","tekst":"Te weten, der schuld en daarom ook der straf."}],"7":[{"catchword":"ook zijn vijanden","tekst":"Dat is, niet alleen zijne vrienden en die zijne vijanden nooit geweest zijn, met hem in vrede houden, maar ook zijne vijanden tot vrede en vriendschap bewegen, dat zij hem niet beschadigen; zie Gen 33:4 ; Exo 12:36 ."}],"8":[{"catchword":"recht","tekst":"Te weten, verkregen en vergaderd."}],"9":[{"catchword":"overdenkt","tekst":"Dat is, verzint, overweegt wat het doen en laten wil. Vergelijk boven vs.1, en de aantekening daarop; idem, onder Pro 19:21 ."},{"catchword":"stiert","tekst":"Dat is, schikt, beleidt en laat het zijn voornemen uitrichten of achterblijven, tot zulk een einde als met de eer van zijn heiligen naam overeenkomt."}],"10":[{"catchword":"Waarzegging","tekst":"Het Hebreeuwse woord kesem betekent meest bijgelovige en ongeoorloofde waarzegging en toekomende en verborgen zaken, uit dingen die niet vast gaan, ja duivels zijn, gelijk Num 22:7 , en Num 23:23 ; Deu 18:10 ; 2Ki 17:17 ; Jer 14:14 ; Eze 13:6 ; maar hier wordt het genomen voor de gissing, die uit zekere, vaste en scherpzinnige aanmerking voortkomt. Zodanige is geweest in David; 2Sa 14:20 , en in Salomo; 1Ki 3:24 , enz."},{"catchword":"is op de lippen","tekst":"Anders: zij."},{"catchword":"zijn mond","tekst":"Namelijk, de mond van een wijzen en godvruchtigen koning."},{"catchword":"zal niet overtreden","tekst":"Anders: overtreedt niet, enz."},{"catchword":"in het gericht","tekst":"Dat is, in het uitspreken van het recht en in het vonnissen, daartoe gezeten zijnde op den rechterstoel."}],"11":[{"catchword":"rechte","tekst":"Hebreeuws, een balans des gerichts, of rechts; dat is, een rechte waag, enz. Alzo Lev 19:36 , waag der gerechtigheid; dat is rechte waag."},{"catchword":"waag","tekst":"Door dit woord verstaan vele overzetters een grote balans, en door de volgende weegschaal de kleine, die men in de hand houdt, en dat overmits God gezegd wordt de bergen te wegen met de waag, maar de heuvelen, die minder zijn, met de weegschaal; Isa 40:12 . Sommigen verstaan vs.11 als figuurlijk gesproken van al de delen en werken des gerichts."},{"catchword":"des HEEREN;","tekst":"Te weten, welgevallen, gelijk staat boven Pro 11:1 ; of zijn werk, gelijk in de volgende woorden van vs.11. Anders: zijn van den Heere."},{"catchword":"weegstenen","tekst":"Dat is, gewicht. Alzo boven Pro 11:1 ; zie Lev 19:36 ."},{"catchword":"zaks","tekst":"Of, buidels; te weten, waarin zij hunne stenen staken, opdat zij te minder verslijten, of breken zouden. Vergelijk Deu 25:13 ; Mic 6:11 ."},{"catchword":"Zijn werk","tekst":"Te weten, dat Hij heeft geboden en dat Hem behaagt. Versta, gelijk ze zijn, zo ze behoren."}],"12":[{"catchword":"der koningen","tekst":"Dat is ene zaak, waarvan zij een gruwel hebben moeten; of, het is den koningen een gruwel; dat is ene zaak waarvan zij een gruwel hebben; te weten, de wijze en vrome koningen; zie boven Pro 3:32 . Anders: het zij den koningen een gruwel, enz."}],"13":[{"catchword":"lippen","tekst":"Dat is, gerechtige en deugdelijke redenen, of de mond die rechte dingen spreekt. Vergelijk boven Pro 12:19 ."},{"catchword":"zijn het welgevallen","tekst":"Dat is, waarin zij een welgevallen hebben moeten; of, zijn den koningen een welgevallen; te weten, den godvruchtigen koningen. Anders: dat de lippen der gerechtigheid den koningen een welgevallen zijn; dat is, hun wel behagende."},{"catchword":"van hen zal liefhebben","tekst":"Te weten, koningen."}],"14":[{"catchword":"als","tekst":"Dat is, als boden verkondigende aan hem, op wien de koning vergramd is, dat hij moet sterven. Het getal van velen toont de zekerheid der boodschap, indien des konings gramschap niet gestild wordt; zie een exempel Est 7:7 ."},{"catchword":"die","tekst":"Te weten, grimmigheid."},{"catchword":"verzoenen","tekst":"Dat is, stillen en tot vrede brengen; zie exempelen 1Sa 24:10 , enz. en 1Sa 25:32-33 ."}],"15":[{"catchword":"het licht","tekst":"Versta, het vriendelijk gelaat, waardoor de koning iemand gunst aanziet; vergelijk boven de aantekening Pro 15:30 ."},{"catchword":"leven;","tekst":"Dat is, als een bode des levens, of verkwikking des levens, inzonderheid voor hem, op wien de koning tevoren vergramd was."},{"catchword":"welgevallen","tekst":"Dat is, gunst en goedwilligheid."},{"catchword":"spaden regens","tekst":"Te weten, die zeer aangenaam is, vallende na een lange droogte in de lente om de vruchten te doen zwellen en tot rijpheid te brengen; zie Deu 11:14 ."}],"16":[{"catchword":"wijsheid","tekst":"Hoe wijsheid en verstand in dit boek onderscheiden worden, zie boven Pro 1:2 ."},{"catchword":"uitgegraven","tekst":"Zie boven Pro 3:14 ."}],"17":[{"catchword":"baan","tekst":"Gelijk de gebaande weg, of des heren straat, de zekerste is voor de reizende lieden, zijn de ongebaande bijwegen vol gevaren; alzo is voor de vromen in hun geestelijke reis niets zekerder of beter dan de zonde te schuwen."},{"catchword":"zijn weg","tekst":"Zie 1Ki 2:4 ."}],"18":[{"catchword":"verbreking,","tekst":"Dat is, verderf, ondergang, verstoring. Alzo onder Pro 17:19 ; Isa 59:7 ; Jer 14:17 ."},{"catchword":"hoogheid","tekst":"Dat is, hoogmoedigheid. Het tegendeel is nederigheid des geestes; waarvan zie vs.19."}],"19":[{"catchword":"nederig","tekst":"Dat is zeker nederig te gedragen, gelijk degenen, die van hunne vijanden gevangen en hun tot een roof geworden zijn. Vergelijk Isa 57:15 , waar dezelfde manier van spreken is."},{"catchword":"zachtmoedigen,","tekst":"Anders, bedrukten, ellendigen, of armen; die ook gemeenlijk zachtmoedig zijn."},{"catchword":"dan roof","tekst":"Het is aan te merken dat hier den hoogmoedigen rijken de roverij toegeschreven wordt."}],"20":[{"catchword":"woord","tekst":"Te weten, des Heeren. Of ook, op de onderwijzing, die met het Woord des Heeren overeenkomt."},{"catchword":"het goede","tekst":"Te weten, het lichamelijke, dat tot het tegenwoordige, en het geestelijke, dat tot het eeuwige leven behoort, boven Pro 8:35 ; 1Ti 4:8 . Vergelijk de manier van spreken, onder Pro 17:20 , en Pro 18:22 , en Pro 19:8 . Het tegendeel is als het kwaad den mens wordt gezegd te vinden; Job 31:29 ; Est 8:6 ."}],"21":[{"catchword":"verstandig","tekst":"Te weten, omdat uit de ware wijsheid het verstand komt, waardoor men weet hoe men leven en alle dingen recht aanleggen zal."},{"catchword":"de zoetheid","tekst":"Dat is, de welsprekendheid en de bekwaamheid om zijn woord wel te kunnen doen is dienstelijk om anderen vruchtbaar te onderwijzen."},{"catchword":"der lippen","tekst":"Dat is der spraak; zie Gen 11:1 ."}],"22":[{"catchword":"dergenen,","tekst":"Hebreeuws, zijner meesters, eigenaars, heren, of bezitters; dat is dergenen, die dat hebben of bezitten, en daarmede begaafd zijn en gebruik daarvan hebben; zie Gen 14:13 ."},{"catchword":"springader","tekst":"Te weten, die geduriglijk verlicht met lering, verkwikt met vertroosting, sterkt met vermaning, enz. zonder in zichzelven verminderd te worden; zie boven Pro 10:11 ."},{"catchword":"tucht","tekst":"Het Hebreeuwse woord musar is ook voor kwade tucht of onderwijzing genomen, Jer 10:8 ."},{"catchword":"dwaasheid","tekst":"Te weten, die den dood medebrengt."}],"23":[{"catchword":"maakt","tekst":"Dat is, stiert, bereidt en beleidt zijnen mond, opdat hij anders niet dan verstandig, voorzichtig en tijdig spreke."},{"catchword":"zijn mond","tekst":"Dat is, den mond des wijzen."},{"catchword":"op zijn lippen","tekst":"Dat is in den mond het goede onderwijs, dat het anderen mededelen wil, overvloediglijk uitstorten."}],"24":[{"catchword":"Liefelijke","tekst":"Hebreeuws, redenen der lieflijkheid. Versta, de redenen der wijzen, die aangenaam en vermakelijk zijn door hun veelvoudige leer, vermaning, troost, waarschuwing. Vergelijk boven Pro 15:26 , en de aantekening."},{"catchword":"ziel,","tekst":"Te weten, die verstandig is."},{"catchword":"medicijn","tekst":"Zie boven Pro 4:22 . Anders, gezondheid."},{"catchword":"het gebeente","tekst":"Vergelijk boven Pro 14:30 ."}],"25":[{"catchword":"Er is een weg,","tekst":"Zie van de verklaring van vs.25, boven Pro 14:12 ."}],"26":[{"catchword":"ziel","tekst":"Dat is de mens, die arbeidt, te weten om den kost te winnen. Ziel voor mens; zie Gen 12:5 . Anderen vertalen vs.26 aldus: een moeilijke ziel, dat is, die met woorden moeite maakt, doet zichzelve moeite aan; want hun mond wordt weder tegen hen geboden; dat is, hun moeilijke redenen vallen henzelf tegen en maken hun moeite."},{"catchword":"voor zichzelven;","tekst":"Dat is, tot onderhouding van zijn eigen lichaam."},{"catchword":"zijn mond","tekst":"Te weten, dat die spijs gebruiken en nuttigen moet voor al de leden des lichaams. Vergelijk Ecc 6:7 ."},{"catchword":"buigt zich","tekst":"Te weten, als met eerbiediging den arbeider biddende dat hij naarstiglijk werken zou, opdat hij altijd wat hebben zou om den mond te bieden. Het is ene gelijkenis, genomen van degenen, die iets verzoeken bij enige heren, wien zij grote eer bewijzen, om in hun goede gunst te staan."},{"catchword":"hem","tekst":"Te weten, den arbeider, of den mens die arbeidt."}],"27":[{"catchword":"Belialsman","tekst":"Zie Deu 13:13 ."},{"catchword":"graaft kwaad;","tekst":"Dat is, bedenkt en legt er zich op toe dat hij zijnen naaste iets kwaads berokkent; gelijk men met moeite graaft naar enig ding, dat men uit de aarde hebben wil."},{"catchword":"brandend vuur","tekst":"Te weten, van de lastering, waardoor hij met een hittigen lust den naam van zijn naaste brandmerkt, om hem ten enenmale te vernielen."}],"28":[{"catchword":"verkeerd man","tekst":"Zie boven Pro 6:14 ."},{"catchword":"inwerpen;","tekst":"Zie Pro 6:14 ."},{"catchword":"oorblazer","tekst":"Dat is, heimelijke en achterklapper, die in het verborgene van zijnen naaste kwaadspreekt; alzo onder Pro 18:8 , en Pro 26:20 , Pro 26:22 ."},{"catchword":"den voornaamsten","tekst":"Of, leidsman en voorganger; te weten, der vrienden, dat is den besten en voornaamsten vriend; alzo onder Pro 17:9 ; idem, vergelijk Psa 55:14 . Anders: scheidt den vorst; dat is, de vorsten van elkander."}],"29":[{"catchword":"man des gewelds","tekst":"Dat is die met geweld, wrevel en onrecht omgaat; zie Job 11:11 ; Psa 5:7 , en de aantekening."},{"catchword":"verlokt","tekst":"Hij doet niet alleen zelf anderen overlast, maar poogt ook zijnen naaste of metgezel daartoe te trekken, om dat met hem te doen; zie boven Pro 1:11 , en van het Hebreeuwse woord, Jdg 14:15 ."},{"catchword":"niet goed is","tekst":"Zie boven Pro 2:12 ."}],"30":[{"catchword":"Hij sluit","tekst":"Te weten, om te beter met zijn verkeerde gedachten bezig te zijn, want door de aanschouwing der uiterlijke dingen worden de inwendige zinnen in hunne werkingen verhinderd. Vergelijk boven Pro 6:14 , en de aantekening."},{"catchword":"bijtende,","tekst":"Hebreeuws, insnijdende, of haastelijk roerende en bewegende, en afbrekende zijne redenen; dat is, het ene deel derzelve voorstellende, het andere, dat hij eigenlijk voorheeft, in zijn hart verbergende."},{"catchword":"volbrengt","tekst":"Te weten, dat ten volle besluitende en voornemende in de gedachten zijns harten."},{"catchword":"kwaad","tekst":"Te weten, dat hij voorheeft zijnen naaste aan te doen."}],"31":[{"catchword":"sierlijke","tekst":"Dat is, die sieraad toebrengt. Zie boven Pro 4:9 . Hebreeuws, kroon des sieraads."},{"catchword":"kroon;","tekst":"Vergelijk boven Pro 12:4 ."},{"catchword":"weg","tekst":"Anders genaamd de paden des rechts, enz. Zie boven Pro 2:8 , en de aantekening. De zin is dat de vromen dikwijls die kroon krijgen, te weten als het hun zalig is. Of versta, dat de grijsheid een kroon des sieraads is aan degenen, die op het pad der gerechtigheid wandelen. Vergelijk Psa 37:11 , Psa 37:18 , Psa 37:27 , en de aantekening. Zie ook boven Pro 3:2 ."}],"32":[{"catchword":"lankmoedige","tekst":"Hebreeuws, land van toornigheden. Zie boven Pro 14:29 ."},{"catchword":"geest,","tekst":"Dat is, eigen wil, genegenheid, gemoedsaandoeningen, driften, bewegingen, die kwaad zijn. Zie 2Ki 19:7 ."}],"33":[{"catchword":"lot","tekst":"Hetwelk hire in de voortijden zeer gebruikelijk was in de bedeling der erfenissen, Num 26:55 ; Jos 18:10 , en Jos 19:1 ; Mic 2:5 ; en andere goederen, Psa 22:19 , boven Pro 1:14 , idem in de uitrichting en ordening van goddelijke en heilige zaken, Lev 16:8 , enz.; 1Ch 24:5 , enz.; Act 1:25 ; idem in het eindigen van geschillen en andere twijfelachtige dingen; Jos 7:14 ; 1Sa 14:41 ; onder Pro 18:18 ; Jon 1:7 ."},{"catchword":"schoot","tekst":"Of, in een besloten vat, of heimelijke plaats. Vergelijk onder, Pro 17:23 ."},{"catchword":"beleid","tekst":"Het Hebreeuwse woord betekent voornamelijk oordeel, recht, gericht; maar hier is het aangenomen voor het beleid, dat is de besturing en regering van enige zaak; gelijk het woord oordelen of richten, dikwijls alzo in de Heilige Schrift genomen wordt. Zie Jdg 2:16 ; idem, Psa 96:13 ; Mic 4:3 ; Zec 3:7 , enz. Anders: het gehele oordeel deszelven; dat is hetgeen door het lot geoordeeld wordt."},{"catchword":"van den HEERE","tekst":"Te weten, die door zijne voorzienigheid het lot zo bestuurt gelijk Hij wil dat het valt, zulks dat hier niets geschiedt bij geval of blind avontuur."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Man hath disposing of the heart; [Understand the thoughts, which a man orderly propoundeth to himself, and intendeth of purposeth, yet not excluding the over-ruling power of Gods providence. See below chap.21.1.] but the answer of the tongue [the Hebrew word indeed signifieth properly answer, but it is also taken for all manner of speech or communication. See above chapter 15.on verse 1.] is of the LORD. [to wit, without whom they can neither utter that which they have thought and imagined, nor perform that which they have said.]"}],"2":[{"catchword":null,"tekst":"All the ways of a man [That is, his life, his doing, and omitting. See Gen.6.on verse 12.] are pure in his (own) eyes: [that is, in his own judgement and conceit. See Job 18.on verse 3.] but the LORD weigheth [that is, searcheth, examineth, trieth, and proveth. [So below chapter 21.2. and 24.12.] the spirits. [that is, the thoughts, inclinations, motions, and purposes. See 2 Kings ch.19. on verse 7.]"}],"3":[{"catchword":null,"tekst":"Roll thy works upon the LORD: [See Psalm 22.on verse 9. And 37.on verse 5. And compare Psa 55:23. Mat 6:25. Luk 12:22. 1 Pet.5.7.] and thy thoughts [which are called disposings, or adornings of the heart, above verse 1. See there the annot.] shall be established."}],"4":[{"catchword":null,"tekst":"The LORD hath wrought all things for his own sake: [That is, for his own honour and glory, to wit, that in all his works, his wisdom, power, goodness, justice, and all his other divine attributes and properties might clearly appear. Compare Rom 9:17,22,23. And 11.36.] Eze 1:5,6,12,14.] yea also the wicked for the day of evil. [meaning the evil of punishment. Compare Job 21:30.]"}],"5":[{"catchword":null,"tekst":"All (or every) that is lofty in heart [That is, proud, high-minded, lofty, disdainful. See of this vice, above chapter 6.17. and 8.13. also verse 18.] is an abomination to the LORD: [Hebrew, the Lords abomination] hand to hand, he shall not be guiltness. [see the meaning of these words, above ch.11.on verse 21.]"}],"6":[{"catchword":null,"tekst":"By mercy and faithfulness the offence is expiated: [That is, by the free grace and mercy of God, who is true and faithful in his promises, is sin pardoned and taken away, for the atonement and reconciliation made by Jesus Christ, Rom 3:24. Or, understand this of the goodness and faithfulness, which men shew to one another. To wit, not that they may merit thereby pardon of sin before God, but that they may get assurance to them selves, as by the fruits of justifying faith: and may also make it appear unto others, that they are freely by grace reconciled unto God. Also the reconciliation and atonement here, may be understood of the peace, which we make with him whom we have offended, by shewing him all manner of love and kindness, and so reconciliation our selves unto him. Comp.ab.ch.10. &.12. and the annot.] and by the fear of the LORD men depart from evil, [to wit, the evil of sin, and therefore also the evil of punishment.]"}],"7":[{"catchword":null,"tekst":"When a mans ways please the LORD, then he will also make his enemies to be at peace with him. [That is, he will not onely keep his friends, and those that never were his foes, in peace with him; but will also move and encline his very enemies unto peace and friendship, so that they shall not in any wise hurt or annoy him. See Gen 33:4. Exo 12:36.]"}],"8":[{"catchword":null,"tekst":"Better is a little with righteousness, then a multitude of revenues without right. [To wit, gotten and gathered. Compare Psa 37:16. above chapter 15.16.]"}],"9":[{"catchword":null,"tekst":"The heart of a man considereth his way: [That is, bethinketh, meditateth, pondereth, what it will doe, or leave undone. Comp. Ab.verse 1. And the annotations thereon; also below ch.19.21.] but the LORD directeth his going, [that is, ordereth and disposeth of the intent and purpose of the heart (so as that it shall be either put in practise, or not) to such an end, as suiteth best with the glory of his holy Name.]"}],"10":[{"catchword":null,"tekst":"Divination [The Hebrew word kesen, signifieth for the most part superstitious, and unlawful divination of future and hidden events, or issues, by things that go not sure, yea are devilish, as Num 22:7. and 23.23. Deut.18.10. 2 Kin.17.7. Jer 14:14. Eze 13:6. But here it is taken for such a kind of guessing, as proceedeth from a sure certain, and acute or quick apprehension; Such kind of divination was in David, 2 Sam.14.20.and in Salomon, 1 Kings 3.24, etc.] is [Oth. Be] in the lips of the King: his mouth [namely, the mouth of a wise, and religious King] shall not transgress [Oth.transgresseth not] in judgement. [that is, in [pronouncing sentence, or judgementl sitting for that very end and purpose in the place of Judicature, or on the Judgement-seat.]"}],"11":[{"catchword":null,"tekst":"A right balance, [Hebrew a balance of Judgement, or, right; that is, a right balance. So Lev.19,v .36. balance of righteousness, or, justice; that is, righteous, or just balance. Many Translators understanding by this word balance, a great balance, and by the following word scales, the little balance, which is held in the hand; and that because the Lord is said to weigh the mountains in the balance, but the hills, that are less, in the scales, Isa 40:12. Some understand this verse as spoken figuratively of all the parts and works of judgement] and scales are the LORDS: [to wit, delight, as is said above chap.11.1. or his work, as is said in the following words of this verse. Oth. Are of the Lord] all the weighing-stones [that is, weights. So above ch.11.1. See Lev.19.on verse 36.] of the sack [or, bag; to wit, where into they put their stones or weights, that they might the less wear out, or break. Compare Deuteronomy 25. On verse 13. Mich.6.on verse 11.] are his work. [to wit, which he hath commanded, and which pleaseth him: Meaning when they are as they ought to be. See Lev.19.36. Deut.25.13, &c. Above chap.11.1. below 20.10,23.]"}],"12":[{"catchword":null,"tekst":"It is the abomination of Kings, [That is, a thing which they ought to abhor and abominate: or, it is an abomination unto Kings; that is, a thing which they abhore and abominate; to wit, wise, and godly Kings. See above chapter 3.on verse 32. Oth. Let it be an abomination unto Kings, &c.] to commit wickedness: for the throne is established by righteousness."}],"13":[{"catchword":null,"tekst":"The lips of righteousness [That is, righteous, and virtuous speeches; or, the mouth that speaketh right things. Compare above chapter 12.on verse 19.] are the delight of Kings: [that is, wherein they ought to take delight. Or, are a delight unto Kings: that is, unto religious Kings. Oth. Let the lips of righteousness be a delight unto Kings: that is, well-pleasing unto them] and every one of them [to wit, Kings] will love him that speaketh right things."}],"14":[{"catchword":null,"tekst":"The wrath of the King is (as) the messengers of death: [That is, as messengers, telling him against whom the King is incensed, that he must die. The plural number sheweth the certainty of the message, if the Kings wrath be not appeased. See an example, Esth.7.7. Compare below chapter 19.12. and 20.2.] but a wise man will reconcile it. [to wit, wrath: that is, appease and pacify it. See examples, 1 Sam.24.10, &c. And chap.25.32,33.]"}],"15":[{"catchword":null,"tekst":"In the light of the Kings countenance [Meaning the friendly countenance, whereby the King looketh favourably upon a man. Compare above chapter 15. The annotations on verse 30.] is life: [that is, as a messenger of life, or a refreshing of life, especially unto him, against whom the King was formerly incensed] and his delight [that is, favour and good will] is a cloud of the latter rain. [to wit, which is very welcome and acceptable, when it falleth after a long drought in the Spring, to cause the fruits to swell and to bring them to ripeness. See Deut.11.on verse 14. Compare below ch.19.12.]"}],"16":[{"catchword":null,"tekst":"How much better is it to get wisdom, then gold digged out? [Of gold digged out, see above chap.3.on verse 14.] and more excellent to get understanding, then silver? [Compare Job 28:15. how wisdom and understanding do differ, or are distinguished in this book, see above chap.1.on verse 2.]"}],"17":[{"catchword":null,"tekst":"The high-way of the upright is, to depart from evil: [As the high-way, or road is the safest and surest way for travellers and way-faring men, the other paths and by-ways being full of danger and peril; so there is nothing more safe and better for the godly in their spiritual journey, then to shun and avoid sin] he preserveth his soul, that keepeth his way. [see 1 Kings 2.on verse 4.]"}],"18":[{"catchword":null,"tekst":"Pride is before breaking to shivers [That is, destruction, ruine, overthrow. So below ch.17.19. Isa 59:7. Jer 14:17.] and loftiness of spirit [that is, high-mindedness. The contrary is lowliness of spirit, whereof see the following verse] before the fall."}],"19":[{"catchword":null,"tekst":"It is better to be of an humble spirit [That is, to behave ones self humble and lowly, as those that are taken captive by their enemies, and are become a prey unto them. Compare Isa 57:15. where the same phrase is used] with the meek; [oth. Afflicted, wretched, or poor: who are also commonly meek] then to divide the spoil with the proud. [it is worth our observation, that robbery is here ascribed and attributed unto proud high-minded rich men.]"}],"20":[{"catchword":null,"tekst":"He that considereth the word [To wit, of God: or, also the instruction, that agreeth with the Word of God] understandingly, shall find good: [to wit, corporal good, belonging to this temporal life; and spiritual good, belonging to life eternal, above chap.8.25. 1 Tim.4.8. Compare the phrase, below chap.17.20. and 18.22. and 19.18. The contrary hereunto is, when evil is said to find a m re above chapter 15.26. and the annot.] are an honey-comb; sweet to the soul, [ to wit, that is wise and understanding] and physic to the bones. [see above chapter 4.on verse 22. Oth. Health. Compare also above chapter 14.on verse 30.]"}],"25":[{"catchword":null,"tekst":"There is a way, that seemeth right unto man: but the last thereof, are the ways of death. [See the exposition of this verse, above chapter 14.on verse 12.]"}],"26":[{"catchword":null,"tekst":"The soul of the laborious man [That is, the man that laboureth, to wit, to get his living. Soul for man, see Gen.12.on verse 5.] laboureth for himself: [that is, for the sustentation of his own body] for the mouth [to wit, which must use and eat food for all the members of the body. Compare Ecc 6:7.] boweth it self before him [to wit, the laboureth, or the man that laboureth: to wit, as it were with reverence, entreating and beseeching the labouring man to work diligently, that he may always have something to offer, and present unto the mouth. It is a similitude taken from those, that put up a Petition to some LORDS or great person, to whom they shew great honour and respect, to gain their favour and good will. Others render this verse thus: A troublesome soul (that is, that causeth trouble by words) causeth trouble to her self: for her mouth is bent against her; that is, her troublesome speeches do fall cross against themselves, and create trouble unto her.]"}],"27":[{"catchword":null,"tekst":"A man of Belial [See Deut.13.on verse 13.] diggeth up evil: [that is, plotteth, and practiseth to do his neighbour a mischief: as men dig with labour and pains for a thing that they would fain have out of the ground] and in his lips (there) is as a burning fire. [to wit, of slander, whereby he with an hot and eager desire brandeth the good name and repute of his neighbour, that he may utterly undo him. Compare above chapter 12.18.]"}],"28":[{"catchword":null,"tekst":"A forward man [See above chapter 6.on verse 14.] will led the paths of judgement. See above ch.2.8. and the annot. The meaning is, that the godly do often get the Crown, to wit, when it is good for them. Or understand that hoariness (or the hoary head) is a path of righteousness. Compare Psa 37:11, 18, 27. And the annot. See also above chap.3.on ver.2.]"}],"32":[{"catchword":null,"tekst":"The long-suffering (man) [Hebr. Long of wraths. See above ch.14.on verse 29.] is better then the mighty (man) : and he that hath rule over his (own) spirit, [that is, his own will, inclination, affections, passions, motions, that are evil. See 2 Kings 19.on verse 7.] then he that taketh a City."}],"33":[{"catchword":null,"tekst":"The lot [Which in former times was much used, in the dividing of inheritances, Num 26:25. Jos.18.10. and 19.1. Mat 2:5. and of Other goods, Psalm 22 19. Above chapter 14. Also in the executing, and ordering of divine, and holy matters, Lev.16.8, etc. 1 Chron.24.5, &c. Act 1:25. also in the deciding of controversies, and other doubtful things, Jos.7.14. 1 Sa.14.41. below chapter 18.18. Jonah 1.7.] is cast into the lap: [or, in a close vessel, or secret place. Compare below Chapter 17.23.] but the whole disposing thereof [the Hebrew word signifieth principally judgement, but here it is taken for the disposing; that is, the guiding, and governing of a thing: as the word judging, or converse 16. Also Psa 96:13. Mic.4.3. Zach.3.7, &c. Oth. The whole judgement of it; that is, that which is judged by the lot] is of the LORD. [to wit, who by his providences so ruleth and directeth the lot, as he will have it fall: insomuch that nothing here happeneth by chance, or blind fortune.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
