k aan hem die verloren gaat, en wijn aan hen die bitter bedroefd van ziel zijn;","7":"dat hij drinkt en zijn armoede vergeet, en aan zijn moeite niet meer denkt.","8":"Open uw mond voor de stomme, voor de rechtszaak van allen die dreigen om te komen.","9":"Open uw mond; oordeel rechtvaardig, en doe de verdrukte en de arme recht.","10":"Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waarde gaat ver boven de robijnen.","11":"Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken.","12":"Gimel. Zij doet hem goed en geen kwaad, al de dagen van haar leven.","13":"Daleth. Zij zoekt wol en vlas, en werkt met plezier met haar handen.","14":"He. Zij is als de schepen van een koopman; zij laat haar brood van verre komen.","15":"Vau. En zij staat op als het nog nacht is, en geeft haar huis voedsel, en haar dienstmaagden het vastgestelde deel.","16":"Zain. Zij denkt na over een akker, en verwerft die; van de vrucht van haar handen plant zij een wijngaard.","17":"Cheth. Zij gordt haar lenden met kracht, en zij versterkt haar armen.","18":"Teth. Zij merkt dat haar handel goed is; haar lamp gaat 's nachts niet uit.","19":"Jod. Zij steekt haar handen uit naar de spinklos, en haar handpalmen grijpen de spinrok.","20":"Caph. Zij breidt haar handpalm uit naar de ellendige; en zij steekt haar handen uit naar de arme.","21":"Lamed. Zij is voor haar huis niet bang vanwege de sneeuw; want haar hele huis is met dubbele kleding gekleed.","22":"Mem. Zij maakt voor zichzelf sierlijke dekens; haar kleding is fijn linnen en purper.","23":"Nun. Haar man is bekend in de poorten, als hij zit met de oudsten van het land.","24":"Samech. Zij maakt fijn linnen en verkoopt het; en zij levert de koopman gordels.","25":"Ain. Sterkte en waardigheid zijn haar kleding; en zij lacht over de komende dag.","26":"Pe. Zij doet haar mond open met wijsheid; en op haar tong is onderwijs van goedheid.","27":"Tsade. Zij houdt toezicht op de gangen van haar huis; en het brood van de luiheid eet zij niet.","28":"Koph. Haar kinderen staan op, en prijzen haar gelukkig; ook haar man, en hij prijst haar, en zegt:","29":"Resch. Veel dochters hebben deugdelijk gehandeld; maar u overtreft ze allemaal.","30":"Schin. De bevalligheid is bedrog, en de schoonheid vergankelijk; maar een vrouw die de HEERE vreest, die zal geprezen worden.","31":"Thau. Geef haar van de vrucht van haar handen, en laat haar werken haar prijzen in de poorten."},"SV":{"1":"De woorden van den koning Lemuël; de last, maarmede zijn moeder hem onderwees.","2":"Wat, o mijn zoon, en wat, o zoon mijns buiks? ja, wat, o zoon mijner geloften?","3":"Geeft aan de vrouwen uw vermogen niet, noch uw wegen, om koningen te verdelgen.","4":"Het komt den koningen niet toe, o Lemuël! het komt den koningen niet toe wijn te drinken, en den prinsen, sterken drank te begeren;","5":"Opdat hij niet drinke, en het gezette vergete, en de rechtzaak van alle verdrukten verandere.","6":"Geeft sterken drank dengene, die verloren gaat, en wijn dengenen, die bitterlijk bedroefd van ziel zijn;","7":"Dat hij drinke, en zijn armoede vergete, en zijner moeite niet meer gedenke.","8":"Open uw mond voor den stomme, voor de rechtzaak van allen, die omkomen zouden.","9":"Open uw mond; oordeel gerechtelijk, en doe den verdrukte en nooddruftige recht.","10":"Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waardij is verre boven de robijnen.","11":"Beth. Het hart haars heren vertrouwt op haar, zodat hem geen goed zal ontbreken.","12":"Gimel. Zij doet hem goed en geen kwaad, al de dagen haars levens.","13":"Daleth. Zij zoekt wol en vlas, en werkt met lust harer handen.","14":"He. Zij is als de schepen eens koopmans; zij doet haar brood van verre komen.","15":"Vau. En zij staat op, als het nog nacht is, en geeft haar huis spijze, en haar dienstmaagden het bescheiden deel.","16":"Zain. Zij denkt om een akker, en krijgt hem; van de vrucht harer handen plant zij een wijngaard.","17":"Cheth. Zij gordt haar lenden met kracht, en zij versterkt haar armen.","18":"Teth. Zij smaakt, dat haar koophandel goed is; haar lamp gaat des nachts niet uit.","19":"Jod. Zij steekt haar handen uit naar de spil, en haar handpalmen vatten den spinrok.","20":"Caph. Zij breidt haar handpalm uit tot den ellendige; en zij steekt haar handen uit tot den nooddruftige.","21":"Lamed. Zij vreest voor haar huis niet vanwege de sneeuw; want haar ganse huis is met dubbele klederen gekleed.","22":"Mem. Zij maakt voor zich tapijtsieraad; haar kleding is fijn linnen en purper.","23":"Nun. Haar man is bekend in de poorten, als hij zit met de oudsten des lands.","24":"Samech. Zij maakt fijn lijnwaad en verkoopt het; en zij levert den koopman gordelen.","25":"Ain. Sterkte en heerlijkheid zijn haar kleding; en zij lacht over den nakomenden dag.","26":"Pe. Zij doet haar mond open met wijsheid; en op haar tong is leer der goeddadigheid.","27":"Tsade. Zij beschouwt de gangen van haar huis; en het brood der luiheid eet zij niet.","28":"Koph. Haar kinderen staan op, en roemen haar welgelukzalig; *ook* haar man, en hij prijst haar, *zeggende*:","29":"Resch. Vele dochteren hebben deugdelijke gehandeld; maar gij gaat die allen te boven.","30":"Schin. De bevalligheid is bedrog, en de schoonheid ijdelheid; *maar* een vrouw, die den HEERE vreest, die zal geprezen worden.","31":"Thau. Geef haar van de vrucht harer handen, en laat haar werken haar prijzen in de poorten."},"KJV":{"1":"The words of king Lemuel, the prophecy that his mother taught","2":"What, my son? and what, the son of my womb? and what, the son of my vows?","3":"Give not thy strength unto women, nor thy ways to that which destroyeth kings.","4":"*It is* not for kings, O Lemuel, *it is* not for kings to drink wine; nor for princes strong drink:","5":"Lest they drink, and forget the law, and pervert the judgment of any of the afflicted.","6":"Give strong drink unto him that is ready to perish, and wine unto those that be of heavy hearts.","7":"Let him drink, and forget his poverty, and remember his misery","8":"Open thy mouth for the dumb in the cause of all such as are appointed to destruction.","9":"Open thy mouth, judge righteously, and plead the cause of the poor and needy.","10":"Who can find a virtuous woman? for her price *is* far above rubies.","11":"The heart of her husband doth safely trust in her, so that he shall have no need of spoil.","12":"She will do him good and not evil all the days of her life.","13":"She seeketh wool, and flax, and worketh willingly with her hands.","14":"She is like the merchants' ships; she bringeth her food from afar.","15":"She riseth also while it is yet night, and giveth meat to her household, and a portion to her maidens.","16":"She considereth a field, and buyeth it: with the fruit of her hands she planteth a vineyard.","17":"She girdeth her loins with strength, and strengtheneth her arms.","18":"She perceiveth that her merchandise *is* good: her candle goeth not out by night.","19":"She layeth her hands to the spindle, and her hands hold the distaff.","20":"She stretcheth out her hand to the poor; yea, she reacheth forth her hands to the needy.","21":"She is not afraid of the snow for her household: for all her household *are* clothed with scarlet.","22":"She maketh herself coverings of tapestry; her clothing *is* silk and purple.","23":"Her husband is known in the gates, when he sitteth among the elders of the land.","24":"She maketh fine linen, and selleth *it*; and delivereth girdles unto the merchant.","25":"Strength and honour *are* her clothing; and she shall rejoice in time to come.","26":"She openeth her mouth with wisdom; and in her tongue *is* the law of kindness.","27":"She looketh well to the ways of her household, and eateth not the bread of idleness.","28":"Her children arise up, and call her blessed; her husband *also*, and he praiseth","29":"Many daughters have done virtuously, but thou excellest","30":"Favour *is* deceitful, and beauty *is* vain: *but* a woman *that* feareth the LORD, she shall be praised.","31":"Give her of the fruit of her hands; and let her own works praise her in the gates."}},"tsk":{"1":[{"kopje":"de last","refs":["Spr 30:1"]},{"kopje":"zijn","refs":["Spr 1:8","Spr 6:20","2 Tim 1:5","2 Tim 3:15"]}],"2":[{"kopje":"zoon van mijn buik","refs":["Jes 49:15"]},{"kopje":"zoon van mijn geloften","refs":["1 Sam 1:11","1 Sam 1:28"]}],"3":[{"kopje":"vermogen","refs":["Spr 5:9-11","Spr 7:26","Spr 7:27","Hos 4:11"]},{"kopje":"aan hen","refs":["Deut 17:17","Neh 13:26"]}],"5":[{"kopje":"alle verdrukten","refs":["Hab 2:5"]}],"6":[{"kopje":"sterke","refs":["Ps 104:15","1 Tim 5:23"]},{"kopje":"bitter bedroefd van ziel","refs":["1 Sam 1:10","1 Sam 30:6","2 Kon 4:27"]}],"8":[{"kopje":"Open","refs":["Spr 24:7","Spr 24:11","Spr 24:12","1 Sam 19:4-7","1 Sam 20:32","1 Sam 22:14","1 Sam 22:15","Est 4:13-16","Job 29:9","Job 29:17","Ps 82:3","Ps 82:4","Jer 26:16-19","Jer 26:24","Jer 38:7-10","Joh 7:51"]},{"kopje":"allen","refs":["Ps 79:11"]}],"10":[{"kopje":"zal","refs":["Spr 12:4","Spr 18:22","Spr 19:14","Ruth 3:11","Pred 7:28","Hoogl 6:8","Hoogl 6:9","Ef 5:25-33"]},{"kopje":"haar","refs":["Spr 3:15","Spr 8:11","Spr 20:15"]}],"13":[{"kopje":"werkt","refs":["Gen 18:6-8","Gen 24:13","Gen 24:14","Gen 24:18-20","Gen 29:9","Gen 29:10","Ex 2:16","Ruth 2:2","Ruth 2:3","Ruth 2:23","Jes 3:16-24","Jes 32:9-11","Hand 9:39","Hand 9:40","1 Tess 4:11","2 Tess 3:10-12","1 Tim 5:10","1 Tim 5:14","Tit 2:5"]}],"15":[{"kopje":"staat op","refs":["Joz 3:1","2 Kron 36:15","Ps 119:147","Ps 119:148","Pred 9:10","Mark 1:35","Rom 12:11"]},{"kopje":"en geeft","refs":["Matt 24:25","Luk 12:42"]}],"16":[{"kopje":"denkt na over","refs":["Joz 15:18","Hoogl 8:12","Matt 13:44"]}],"17":[{"kopje":"gordt","refs":["1 Kon 18:46","2 Kon 4:29","Job 38:3","Luk 12:35","Ef 6:10","Ef 6:14","1 Petr 1:13"]},{"kopje":"versterkt","refs":["Gen 49:24","Jes 44:12","Hos 7:15"]}],"18":[{"kopje":"haar lamp","refs":["Gen 31:40","Ps 127:2","Matt 25:3-10","1 Tess 2:9","2 Tess ata-code=\"H6213\">worketh</span> <span class=\"wl wl-kjv\" data-code=\"H2656\">willingly</span> with her hands.","14":"She is like the <span class=\"wl wl-kjv\" data-code=\"H5503\">merchants'</span> <span class=\"wl wl-kjv\" data-code=\"H591\">ships;</span> she <span class=\"wl wl-kjv\" data-code=\"H935\">bringeth</span> her <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> from afar.","15":"She <span class=\"wl wl-kjv\" data-code=\"H6965\">riseth</span> also while it is yet <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H2964\">meat</span> to her <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2706\">portion</span> to her maidens.","16":"She <span class=\"wl wl-kjv\" data-code=\"H2161\">considereth</span> a <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">buyeth</span> it: with the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of her <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> she <span class=\"wl wl-kjv\" data-code=\"H5193\">planteth</span> a vineyard.","17":"She <span class=\"wl wl-kjv\" data-code=\"H2296\">girdeth</span> her <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> with <span class=\"wl wl-kjv\" data-code=\"H5797\">strength,</span> and <span class=\"wl wl-kjv\" data-code=\"H553\">strengtheneth</span> her arms.","18":"She <span class=\"wl wl-kjv\" data-code=\"H2938\">perceiveth</span> that her <span class=\"wl wl-kjv\" data-code=\"H5504\">merchandise</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> her <span class=\"wl wl-kjv\" data-code=\"H5216\">candle</span> goeth not <span class=\"wl wl-kjv\" data-code=\"H3518\">out</span> by night.","19":"She <span class=\"wl wl-kjv\" data-code=\"H7971\">layeth</span> her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> to the <span class=\"wl wl-kjv\" data-code=\"H3601\">spindle,</span> and her <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> <span class=\"wl wl-kjv\" data-code=\"H8551\">hold</span> the distaff.","20":"She stretcheth <span class=\"wl wl-kjv\" data-code=\"H6566\">out</span> her <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> to the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor;</span> yea, she reacheth <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> to the needy.","21":"She is not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of the <span class=\"wl wl-kjv\" data-code=\"H7950\">snow</span> for her <span class=\"wl wl-kjv\" data-code=\"H1004\">household:</span> for all her <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> are <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> with scarlet.","22":"She <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> herself coverings of <span class=\"wl wl-kjv\" data-code=\"H4765\">tapestry;</span> her <span class=\"wl wl-kjv\" data-code=\"H3830\">clothing</span> is <span class=\"wl wl-kjv\" data-code=\"H8336\">silk</span> and purple.","23":"Her <span class=\"wl wl-kjv\" data-code=\"H1167\">husband</span> is <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> when he <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> among the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the land.","24":"She <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> fine <span class=\"wl wl-kjv\" data-code=\"H5466\">linen,</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">selleth</span> it; and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivereth</span> <span class=\"wl wl-kjv\" data-code=\"H2289\">girdles</span> unto the merchant.","25":"<span class=\"wl wl-kjv\" data-code=\"H5797\">Strength</span> and <span class=\"wl wl-kjv\" data-code=\"H1926\">honour</span> are her <span class=\"wl wl-kjv\" data-code=\"H3830\">clothing;</span> and she shall <span class=\"wl wl-kjv\" data-code=\"H7832\">rejoice</span> in <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> to come.","26":"She <span class=\"wl wl-kjv\" data-code=\"H6605\">openeth</span> her <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> with <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom;</span> and in her <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of kindness.","27":"She looketh <span class=\"wl wl-kjv\" data-code=\"H6822\">well</span> to the <span class=\"wl wl-kjv\" data-code=\"H1979\">ways</span> of her <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> not the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of idleness.","28":"Her <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> arise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and call her <span class=\"wl wl-kjv\" data-code=\"H833\">blessed;</span> her <span class=\"wl wl-kjv\" data-code=\"H1167\">husband</span> also, and he praiseth","29":"<span class=\"wl wl-kjv\" data-code=\"H7227\">Many</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">virtuously,</span> but thou excellest","30":"<span class=\"wl wl-kjv\" data-code=\"H2580\">Favour</span> is <span class=\"wl wl-kjv\" data-code=\"H8267\">deceitful,</span> and <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty</span> is <span class=\"wl wl-kjv\" data-code=\"H1892\">vain:</span> but a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that <span class=\"wl wl-kjv\" data-code=\"H3373\">feareth</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> she shall be praised.","31":"<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> her of the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands;</span> and let her own <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> her in the gates."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"van den koning","tekst":"Dat is, die dezen koning tot een vermaning gegeven zijn geweest en van hem aangenomen, opgetekend en aldus nagelaten tot aller mensen onderwijzing."},{"catchword":"Lemuël;","tekst":"Die ook genoemd wordt Lemoel, onder vs.4, welk woord betekent zoveel als tot, of voor God; dat is, die God toebehoort of toegeëigend is. Het algemeen gevoelen is dat door dezen te verstaan is de koning Salomo, die ook genaamd was Jedidja, dat is, de beminde des Heeren; zie 2Sa 12:25 , en de aantekening."},{"catchword":"last,","tekst":"Zie boven Pro 30:1 ."},{"catchword":"zijn moeder","tekst":"Namelijk Bathseba, van wie zie 2Sa 11:3 ; 1Ki 1:11 , en 1Ki 2:13 , enz."},{"catchword":"onderwees","tekst":"Te weten eer hij koning geworden was, of terstond daarna."}],"2":[{"catchword":"Wat, o mijn zoon,","tekst":"Dit zijn de woorden van de onderwijzing der moeder; alsof zij zeide: Wat [zal ik zeggen], of wat, of hoe zal het zijn, o mijn zoon, ik moet u onderrichten van hetgeen ik u acht nodig te wezen."},{"catchword":"mijns buiks?","tekst":"Vergelijk Isa 49:15 . Zo worden de kinderen ook genaamd ten aanzien van hunnen vader, Job 19:17 ; alzo ook de vrucht des buiks; te weten van hunne ouders, Deu 28:4 , Deu 28:18 , Deu 28:53 ."},{"catchword":"mijner geloften?","tekst":"Dat is, om wien ik den Heere zovele geloften gedaan en volbracht heb opdat gij tot het koninkrijk zoudt mogen komen en daarin u kwijten gelijk een godvrezenden koning betaamt."}],"3":[{"catchword":"vermogen niet,","tekst":"Dat is, de krachten uwer ziel en van uw lichaam, mitsgaders uw tijdelijke middelen. Vergelijk boven Pro 5:9-10 ."},{"catchword":"uw wegen,","tekst":"Dat is, uw genegenheden, handel en werken."},{"catchword":"om koningen","tekst":"Dat is, om vermetelijk en zonder oorzaak der koningen landen en steden te veroveren, oorlog tegen hen voerende uit enkele verwaandheid, hoogmoedig en gierigheid. Anders: Geef uwe genegenheden niet de vrouwen, hetwelk dient om de koningen te verdelgen; dat is te verderven en uit te roeien."}],"4":[{"catchword":"Het komt","tekst":"Anders: Het zij verre van de koningen, enz. wijn te drinken, enz."},{"catchword":"wijn","tekst":"Te weten onmatiglijk."},{"catchword":"en den prinsen,","tekst":"Of, noch den prinsen sterken drank, of en [te vragen] waar is sterke drank?"}],"5":[{"catchword":"niet drinke,","tekst":"Te weten elkeen der koningen en prinsen."},{"catchword":"gezette","tekst":"Het Hebreeuwse woord betekent hetgeen als ene wet, niet alleen eens geordineerd en vastgesteld is om onderhouden te worden, maar dat ook tot zulk een einde in steen, koper, of iets anders ingegraveerd, gesneden of geschreven is, waarnaar de uitspraak van den rechter ten allen tijde moet ingericht zijn."},{"catchword":"verdrukten","tekst":"Hebreeuws, kinderen der verdrukking; dat is verdrukte mensen. Alzo kinderen des doods, Psa 78:11 , voor mensen, die ter dood geëigend zijn. Kinderen der verandering, of des ondergangs, vs.8. Kinderen der gevangenis, Ezr 4:1 , voor mensen, die gevangen waren geweest. Kinderen der vervloeking, 2Pe 2:14 , voor vervloekte mensen."}],"6":[{"catchword":"verloren gaat,","tekst":"Dat is, versmelt en als uitteert, uit oorzaak van enige zwarigheid, waarin hij steekt. Vergelijk Deu 26:5 ."},{"catchword":"bitterlijk","tekst":"Hebreeuws, bitter van ziel; dat is, die in hun hart bitterlijk bedroefd zijn. Zie 2Ki 4:27 ."}],"7":[{"catchword":"hij drinke,","tekst":"Te weten die vergaat en bitter van ziel is. Hier is verandering des getals. Vergelijk Job 24:18 ."}],"8":[{"catchword":"Open uw mond","tekst":"Alzo in vs.9. Zie Job 33:2 ."},{"catchword":"stomme,","tekst":"Dat is, voor hem, die zijn woord niet kan voeren vanwege zijne onbekwaamheid, of nie durft uit vrees van de macht zijner partij."},{"catchword":"die omkomen","tekst":"Hebreeuws, kinderen der verandering, of uitroeiing; dat is, die in gevaar staan van ten onrechte enige schadelijke verandering, dat is groot nadeel, te zullen lijden in hun goed, lichaam, of eer, ja, die tot hun verderf zou mogen dienen. Anders: van alle kinderen des doorgangs; dat is, van alle mensen, wier leven hier anders niet is dan gelijk een korte doorgang, overstap, of passering tot den dood."}],"9":[{"catchword":"oordeel","tekst":"Hebreeuws, oordeel gerechtigheid; dat is gerechtiglijk, of recht. Alzo Deu 1:16 . Anders in, of met gerechtigheid; gelijk deze volle manier van spreken gevonden wordt Lev 19:15 ; Psa 9:9 ."}],"10":[{"catchword":"Aleph","tekst":"Deze lof en verklaring van de deugden ener kloeke en vlijtige huismoeder is hier gesteld in de eerste letters van elk vers naar de orde van het Hebreeuwse A. B., en daarom worden de namen der letter vooraan gesteld. Zie Psa 25:1 ."},{"catchword":"deugdelijke","tekst":"Hebreeuws, ener huisvrouw der deugd, of vroomheid, of kloekheid. Alzo Rth 3:11 . Zie Gen 47:6 , de aantekening op het woord kloeke."},{"catchword":"robijnen","tekst":"Zie Job 28:18 , en de aantekening."}],"11":[{"catchword":"heren","tekst":"Dat is, van haren man. Zie 2Sa 11:26 , en de aantekening."},{"catchword":"goed zal ontbreken","tekst":"Het Hebreeuwse woord salal betekent eigenlijk roof en buit, dat is alle roerende goederen, welke in tijd van oorlog den vijanden ontnomen worden; maar versta hier bij gelijkenis al het goed, dat tot de huishouding nodig is en door arbeid of handel gewonnen wordt. Vergelijk hiermede onder vs.15, de betekenis van het woord tereph, spijs."}],"12":[{"catchword":"doet hem","tekst":"Of, vergeldt hem goed, enz. Zie van het Hebreeuwse woord 2Ch 20:11 ; Pro 11:17 ."},{"catchword":"en geen kwaad,","tekst":"De natuur der Hebreeuwse taal is hetzelfde met loochening van het tegendeel weder te verhalen; Psa 102:18 ; Luk 1:20 , enz."}],"13":[{"catchword":"werkt","tekst":"Het Hebreeuwse woord asah is ook elders voor werken genomen. Zie Gen 30:30 ; Exo 31:4 ; Rth 2:19 , en de aantekening; 2Ch 2:7 ."},{"catchword":"lust","tekst":"Alzo is de handen weigering, of ongenegenheid en onwil toegeschreven, boven Pro 21:25 ."}],"14":[{"catchword":"als de schepen","tekst":"Dat is, gelijk de koopvaarders."},{"catchword":"brood","tekst":"Dat is, als wat dienstig is tot de onderhouding van dit tijdelijke leven. Vergelijk boven Pro 4:17 ."},{"catchword":"van verre","tekst":"Dat is, zij voorziet zich tijdig, niet alleen van hetgeen er binnenslands te bekomen is, maar dat uit vergelegen landschappen gekregen moet worden; waarvoor zij, òf geld geeft, òf waren door haar huisvolk gemaakt."}],"15":[{"catchword":"huis","tekst":"Dat is, haar huisgezin. Zie Gen 7:1 ."},{"catchword":"spijze,","tekst":"Het Hebreeuws woord tereph betekent wel eigenlijk roof, of kost, die met roven gekregen wordt; gelijk Num 23:24 ; Job 24:5 ; maar het is ook voor anderen kost genomen, gelijk hier en Psa 111:5 ; Mal 3:10 ; gelijk ook het woord hitriph, boven Pro 30:8 , zoveel is als voeden met gewone spijs."},{"catchword":"bescheiden","tekst":"Zie Job 23:12 ."}],"16":[{"catchword":"denkt","tekst":"Het woord zamam is merendeel in het kwade en voor schelmse gedachten genomen, gelijk Deu 19:19 ; Psa 37:12 ; boven Pro 30:32 , enz.; maar hier is het in het goede genomen voor vlijtige, kloeke en vrome gedachten. Vergelijk Zec 8:15 ; alzo is het woord mezimmah, gedachte, beide in het goede en in het kwade genomen. Zie Job 21:27 ."},{"catchword":"krijgt hem;","tekst":"Te weten met de mening om nog meer gewin voor haar huis te trekken. Vergelijk boven Pro 24:27 ."},{"catchword":"vrucht","tekst":"Dat is van het gewin, hetwelk zij van haar handwerk en koophandel geniet."}],"17":[{"catchword":"Zij gordt","tekst":"Dat is, zij schikt zich met vlijt en kloekmoedigheid tot het werk. Zie Exo 12:11 ."},{"catchword":"zij versterkt","tekst":"Dat is, zij maakt hare armen vaardig tot het werk, of [gelijk wij zeggen] zij stroopt hare armen op. Hier wordt van de lenden en armen vooral gewag gemaakt, omdat daarin de meeste kracht, nodig tot den arbeid, gelegen is."}],"18":[{"catchword":"smaakt,","tekst":"Dat is, oordeelt, gevoelt, bevindt en wordt gewaar. Versta dit van den smaak des harten. Vergelijk Psa 34:9 , en Job 12:20 ."},{"catchword":"goed is;","tekst":"Dat is, voordelig, alzo Jer 5:25 ; 1Co 7:1 ."},{"catchword":"haar lamp","tekst":"Te weten omdat zij die lang in den nacht gebruikt."}],"19":[{"catchword":"de spil,","tekst":"Te weten waarmede zij haar garen draait. Anders: wervel."},{"catchword":"vatten","tekst":"Te weten om dien bijwijlen te keren en haar vlas of wol daarvan te halen of te trekken. Men meent dat de oude manier van spinnen geschiedde niet met een wiel, maar gelijk nog heden veel met een spil en spinrok."}],"20":[{"catchword":"breidt","tekst":"Te weten om die te helpen. Want zij is naarstig, niet alleen voor haar eigen huisgezin, maar ook om der armen mede te delen."}],"21":[{"catchword":"huis niet","tekst":"Dat is, huisgezin. Alzo boven vs.15 en terstond weder in vs.21."},{"catchword":"sneeuw;","tekst":"Versta hieronder allerlei soorten van ongemak, hetwelk uit de lucht komt."},{"catchword":"met dubbele","tekst":"Dat is, met twee pak klederen. Anders: met scharlaken; dat is, niet alleen ter noodzakelijkheid, om de koude te weren, maar ook tot versiering dergenen, die tot het huisgezin ener grote vrouw behoren. Sommigen verstaan door haar huis niemand dan haar man en hare kinderen. Niettemin alzo het schijnt dat het scharlaken in die landen redelijk algemeen is geweest, 2Sa 1:24 , het is niet ongelooflijk dat enige dienaren en staatvrouwen van zulke huisgezinnen die klederen mede gebruikt mogen hebben, en daarom nog veel meer voorzien waren van de andere klederen, die hen tegen den nood der koude dienden."}],"22":[{"catchword":"tapijtsieraad;","tekst":"Zie boven Pro 7:16 ."},{"catchword":"fijn linnen","tekst":"Zie Gen 41:42 ."},{"catchword":"purper","tekst":"Dat is, een kleed, dat van donker of hoogrood, of karmozijn kleur is."}],"23":[{"catchword":"poorten,","tekst":"Dat is, rechthuizen. Zie Gen 22:17 ."},{"catchword":"oudsten","tekst":"Dat is, de regeerders des lands, die gemeenlijk uit de ouden van jaren [immers van verstand] genomen worden. Zie 2Ki 23:1 ."}],"24":[{"catchword":"fijn lijnwaad","tekst":"Zie hiervan Jdg 14:12 ."},{"catchword":"koopman","tekst":"Hebreeuws, den Kanaäniet. Zie Job 40:25 ."},{"catchword":"gordels","tekst":"Welke dienden in den oorlog om daarmede, als met een krijgsteken, tot het gebruik der wapens ontvangen te worden, 2Ki 3:21 , om het zwaard daaraan te hangen, 2Sa 20:8 , en om de leden des lichaams tot enig werk vaardig, vast en sterk te maken. Zie Exo 12:11 ; Eph 6:14 . De gordel diende ook tot een sieraad des lichaams, Isa 3:24 ."}],"25":[{"catchword":"Sterkte","tekst":"Dat is, kloekheid, dapperheid, vertrouwen op God en onversaagdheid des geestes."},{"catchword":"heerlijkheid","tekst":"Dat is, sieraad van godzaligheid en eerlijke zeden."},{"catchword":"haar kleding;","tekst":"Dat is, daarmede is zij wel voorzien en gestoffeerd, en houdt zich daaraan vast, als aan een gewone en dagelijkse kleding. Vergelijk Job 29:14 ."},{"catchword":"zij lacht","tekst":"Dat is, zij is gerust, onbekommerd en zonder vrees ten aanzien van den toekomenden tijd, en dat door het gevoel van Gods gunst en zegen, door een goede conscientie, en de orde, die zij in hare huishouding gesteld heeft. Lachen is hier genomen voor onbevreesd zijn en verachten; zie Job 5:22 ."},{"catchword":"den nakomenden dag","tekst":"Versta, den toekomenden tijd, tegen welken zij zou mogen bezorgd zijn van tegenspoed, gebrek, of armoede. Anderen verstaan den tijd des ouderdoms òf des stervens, òf den dag des toekomenden oordeels."}],"26":[{"catchword":"leer der goeddadigheid","tekst":"Dat is, spraak, van allen wel te willen doen, en vermaning om anderen daartoe op te wekken."}],"27":[{"catchword":"gangen","tekst":"Dat is hoe het in haar huis toegaat, hebbende acht op hare kinderen, op haar dienstvolk, op het werk, dat zij te doen hebben, en op de meubelen, mitsgaders middelen, die haar van haren man toevertrouwd zijn."},{"catchword":"der luiheid","tekst":"Dat is, wat zonder eerlijken arbeid gekregen is; vergelijk boven Pro 4:17 ."}],"28":[{"catchword":"kinderen","tekst":"Of, zonen."},{"catchword":"staan op,","tekst":"Dat is, zijn bereid en vaardig om haar te prijzen; gelijk zij dat ook dadelijk volbrengen. Alzo is opstaan, of zich opmaken, zoveel als zich vaardig maken en begeven tot enig werk; Gen 37:35 ; Exo 2:17 ; Jos 18:4 ; 1Sa 25:29 , enz."},{"catchword":"haar man,","tekst":"Te weten maakt zich op."}],"29":[{"catchword":"Vele","tekst":"Dit zijn de woorden van den man en zijner zonen."},{"catchword":"dochteren","tekst":"Dat is, vrouwspersonen. Alzo Gen 30:13 ; Luk 23:28 ."},{"catchword":"deugdelijke","tekst":"Te weten in de huishouding. Alzo is het woord chail genomen, Rth 3:11 , en hier boven vs.10. Anders: hebben deugd gedaan, of rijkdom vergaderd."}],"30":[{"catchword":"De bevalligheid","tekst":"Versta, de uiterlijke aangenaamheid en goede gratie, die enige vrouwspersonen over zich zouden mogen hebben; zie Nah 3:4 ."},{"catchword":"is bedrog,","tekst":"Hebreeuws, leugen, of valsheid; te weten omdat zij bedrogen worden, die zich daarop als een vast goed verlaten, en omdat grote en grove ondeugden dikwijls daaronder schuilen."},{"catchword":"ijdelheid;","tekst":"Dat is, vergankelijk en licht verdwijnende; zie Job 15:31 ."},{"catchword":"die den HEERE vreest,","tekst":"Of, ene vrouw van de vreze des Heeren; dat is die met de vreze des Heeren begaafd is."}],"31":[{"catchword":"Geef haar","tekst":"Iets in woorden geven is prijzen; Jer 13:16 . Hij wil zeggen dat men uit de vrucht harer handen stof nemen moet om haar te prijzen."},{"catchword":"de vrucht","tekst":"Zie boven Pro 1:31 ."},{"catchword":"handen,","tekst":"Dat is, werken."},{"catchword":"in de poorten","tekst":"Dat is, in de openbare vergadering van het volk, die in de poorten plachten te wezen, waar men het gericht hield."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The words of King Lemuel, [That is, the words which were given unto this King for an instruction, and by him embraced, recorded, and thus left unto all men for them use and edification. This Lemuel is also called Lemuel, below v.4. Which word signifieth as much as unto, or before God; that is, he that belongeth unto God, on is dedicated unto him. The common opinion is, that by this man is meant King Salomon himself, who is also called Jedidja, that is, the beloved of the Lord. See 2 Sam.25. and the annotate.] the burden, [see above chap.30.on v.1.] whereby his Mother [namely, Bethseba, of whom see 2 Sam.11.3. 1 Kings 1.11. and chap.2.13. etc.] instructed him. [to wit, before he was crowned King, or presently after.]"}],"2":[{"catchword":null,"tekst":"What O my son? And what, O son of my womb? And what, o son of my vow? [These are the words of his Mothers instruction, as if she had said, what (shall I say) ? or how shall the thing be, o my son? I must needs teach and instruct thee in that, which I count to be most needful and necessary for thee. Son of my womb. Compare Isa 49:15. So are children also called in respect of their Father, Job 19:15. So likewise the fruit of the womb; to wit, of their parents, Deut.28.4. 18,53. Son of my vows; that is, for whom I made so many vows unto the Lord, (which I have also performed) to wit, that thou mightiest come to the crown and Kingdom, and therein quit thy self so, as becometh a godly and religious King to do.]"}],"3":[{"catchword":null,"tekst":"Give not thy strength [That is, the powers and faculties of thy soul and body, together with thy temporal estate. Compare above chap.5.9,10.] unto women; [compare Deut.17.17.] nor thy ways, [that is, thy inclinations, dealing and works] to destroy Kings. [that is, presumptuously and without cause, to conquer the lands and cities of Kings, making war against them out of meer arrogancy, pride and covetousness. Oth.give not thy affections unto women, which tendeth to destroy Kings; that is, utterly to consume them, and to cause them to perish.]"}],"4":[{"catchword":null,"tekst":"It is not for Kings, O Lemoel, it is not meet for Kings to drink wine; [To wit, inconsiderately. Oth. Be it far from Kings, &c. To drink wine, &c.] and for Princes to desire strong drink. [or, nor Princes strong drink, or, and (to enquire) where strong drink is."}],"5":[{"catchword":null,"tekst":"Lest he [To wit, every one of the Kings and Princes] drink, and forget the statute [the Hebrew word signifieth that which is not only once ordained and established, to be kept as a Law; but which is also for such an end and purpose ingraved, carved and written in stone, copper or any other material, according to which the Judges sentence must at all times be formed and framed] and alter the judgement of all afflicted ones. [Heb. Children of affliction; that is, afflicted men. So children of death, Psa 79:1. for men appointed unto death; children of alteration, or of ruine, or destruction, v.8. children of the captivity, Eph.4.1. for men that had been carried away captive: children of the curse, 2 Pet.2.14. for cursed men.]"}],"6":[{"catchword":null,"tekst":"Give strong drink unto him that is ready to perish: [That is, that pineth and melteth away, and (as it were) consumeth away to nothing, by reason of some grief, wherein he is plunged. Compare Deut.26.5.] and wine unto those, that are bitterly grieved in soul; [Heb. That are bitter in soul; that is, that are bitterly grieved in their heart. See 2 Kings 4.on v.27.]"}],"7":[{"catchword":null,"tekst":"Let him drink, [To wit, he that perisheth and is bitter in soul. Here is a change or alteration of the number. Compare Job 24.on v.8.] and forget his poverty; and remember his trouble no more."}],"8":[{"catchword":null,"tekst":"Open thy mouth [So in the next verse, see Job 33.on v.2.] for the dumb; [that is, for him that is not able to speak for himself by reason of his unfitness and impediment in his speech; or date not speak, through fear of his potent adversary] for the cause of all that are about to perish. [Hebr. Children of alteration, or of destruction; that is, that are in danger of suffering wrongfully some hurtful change or alteration, that is, great damage in their estates, body or credit, yea which might tend to their utter undoing. Oth. Of all the children of else but as it were a throw-fare, and stepping over, or passage unto death.]"}],"9":[{"catchword":null,"tekst":"Open thy mouth, judge righteously: [Heb. Judge righteousness; that is, righteously or rightly, so Deut.1.16. Oth.in or with righteousness, as this full and entire phrase is found, Lev.19.15. Psa 9:9.] and do justice to the afflicted and needy."}],"10":[{"catchword":null,"tekst":"Aleph. Who shall find a virtuous wife? [This praise and declaration of the vertues of a prudent and diligent Mother of a family, is here placed, and set down in the first letters of every verse, according to the order of the Hebrew ALPHABET: and therefore the names of the names of the letters are put if the beginning of the verse. See Psa.25.on v.1. Heb. A wife of virtue, or piety, or valour. So Ruth 3.11. see Gen 47:6. the annotate. On the word valiant, compare above chap.12.4.] for her value is far above Rubies. [of Rubies see Job 28:18. and the annotate.]"}],"11":[{"catchword":null,"tekst":"Beth. The heart of her Lord [That is, of her husband. See 2 Sam.11.26. and the annotate.] trusteth in her, so that no good (thing) shall be wanting unto him. [the Hebrew word Selah, (rendered here good) siginfieth properly spoil, or prey; that is, all moveable goods, which in time of war are spoiled, or taken away from the Enemy: but understand here by way of comparison, or similitude, all kind of Goods, that are gained and gotten by labour or trading. Compare herewith below v.15. the signification of the word tereph, meat, or food.]"}],"12":[{"catchword":null,"tekst":"Gimel. She doth him good, and not evil, all the days of her life, [Or, she rewardeth good unto him, &c. See of the Hebrew word 2 Chron.20.on v.11. Prov.11.on v.17. The idiom and property of the Hebrew tongue is, to repeat the same thing again with denial of the contrary, Psal.102.18. Luk 1:20. &c.]"}],"13":[{"catchword":null,"tekst":"Daleth. She seeketh wool and flax, and worketh [The Hebrew word asah is elsewhere taken for working. See Gen.39.on v.30. Exo 31:4. Ruth 2.10. and the annotate. 2 Chron.2.7.] with delight of her hands. [so to the hands is ascribed refusing or dislike and unwillingness, above chap.21.25.]"}],"14":[{"catchword":null,"tekst":"He. She is like the merchants ships; [That is, like the merchant men; or the ships that go upon merchants affairs, and trade for merchandise] she causeth her bread [that is, whatsoever tendeth to the sustentation and preservation of this temporal life. Compare above chap.4.on v.17.] to come from a far. [that is, she provideth and furnisheth her self opportunity, not only of those things that are to be had there in the country where she liveth, but also of those that must be fetched and brought from far and remote places; for which she either payeth money, or wares made by her own folks.]"}],"15":[{"catchword":null,"tekst":"Vau. And she riseth, when it is yet night, and giveth meat [The Hebrew word, Tereph, signifieth properly prey, or victual that is gotten by robbing or plundering, as Nuymb.23.24. Job 24:5. but it is also taken for other food or victual, as here, and Psa 111:5. Malach.3.10. as also the word hitriph, above, chap.30.8. is as much as feeding with ordinary food] to her house, [that is, to her household, see Gen.7.on v.1.] and the appointed portion [see Job 23.on v.8.] to her maidens."}],"16":[{"catchword":null,"tekst":"Zain. She thinketh of a field, [The word Zaman is for the most part taken in a bad sense, and for evil and wicked thoughts, as Deut.19.19. Psal.37.12. above chap.30.32, &c. But here it is taken in a good sense, for diligent, prudent, and pious thoughts. Compare Zach.8.15. So the word. Mezimmah, signifying thought, is taken likewise both in a good and in a bad sense. See, Job 21.on vers.27.] and getteth it [To wit, with an intention to raise yet more gain and profit thereby for her family. Compare above chap.24.27.] with the fruit of her hands [that is, with the gain and profit which she getteth by her handy-work, and trading] she planteth a vineyard."}],"17":[{"catchword":null,"tekst":"Cheth. She girdeth her loines with strength, [That is, she applieth her self with diligence and courage to the work, she goeth roundly to it, as we say, see Exod.12.on v.11.] and she strengtheneth her arms. [That is, she maketh her self ready for the work, or (as we use to say) she strips up her arms. Here mention is made especially of the loines and arms, because therein lieth the greatest strength that is requisite and needful for labour.]"}],"18":[{"catchword":null,"tekst":"Teth. She tasteth, [That is, judgeth, conceiveth, findeth, and perceiveth. Understand this of the taste of heart. Compare Psal.34.on vers.9. and Job 12.on v.20.] that her merchandize is good: [that is, profitable, so Jer 5:51. 1 Cor.7.1.] her lamp goeth not out by night. [to wit, because she useth it a long while in the night, or in night-time.]"}],"19":[{"catchword":null,"tekst":"Jod. She putteth forth her hands to the spindle. [To wit, whereby she windeth or twisteth her threed or yarn. Oth. Where] and the palms of her hand take hold of the distaff. [to wit, to turn it by whiles, and to pull or draw her flax or wool off from it. It is conceived, that the old fashion or custome of spinning was not done with a wheel, but (as at this day, is yet much and frequently used) with a spindle and distaff.]"}],"20":[{"catchword":null,"tekst":"Coph. She strenghteth out the palm of her hand to the miserable: (or poor) and she putteth forth her hands to the needy. [to wit, to help them; for she is diligent, not onely to provide for her own family, but also to communicate unto the poor.]"}],"21":[{"catchword":null,"tekst":"Lamed. She feareth not for her house, [That is, household, so above, v.15. and straightway again in this same verse.] because of the snow: [understand hereby all manner of intemperance issuing from the air] for all her house is cloathed with double garments. [that is, with two suits of apparel. Oth. With scarlet, that is, not onely for necessity, to keep off the cold, but also for ornament to those that belong to the family of a great woman or Lady. Some understand by her house, none but her husband, and her children. Yet forasmuch as it seemeth, that scarlet was somewhat common in those countrys, 2. Sam.1.24. it is not incredible, but that some servants and waiting Gentle-women, pertaining to such great houses and families, might have worn such kind of apparel, and therefore (doubtless) were much more stored with other garments, to fence and protect them against the coldness and sharpness of the weather.]"}],"22":[{"catchword":null,"tekst":"Mem. She maketh for her self Tapestry-ornament, [See above, chap.7.on v.16.] her clothing is fine linen [see Gen.41.on v.42.] and purple. [that is, a garment that is of a dark or deep red, or crimson colour.]"}],"23":[{"catchword":null,"tekst":"Nun. Her husband is known in the gates; [That is, houses or places of judicature, see Gen.22.on v.17.] when he sitteth with the eldest of the land. [that is, the Rulers and Governors of the land, who are commonly chosen out of those that are old in years (at least old in wisdom and understanding) see 2 Kings 23.1.]"}],"24":[{"catchword":null,"tekst":"Samech. She maketh fine linen cloth, [See here of Judge.14.on v.12.] and selleth it: and she delivered girdles [which served in war, to be thereby, as by a military token or badge, admitted to the use and practice of 20.8. and to make the members of the body ready, firm, and strong for any work or business, see Exod.12.on v.11. Eph.6.14. The girdle served also for an ornament to the body, Isa.3.on verse.24.] unto the merchant. [Hebr. Unto the Canaanite. See Job 40.on vers.25.]"}],"25":[{"catchword":null,"tekst":"Ain. Strength, [That is, valour, courage, confidence in God, and undauntedness of spirit] and glory [that is, ornament of piety, and virtuous manners] are her clothing: [that is, she is therewith well stored and provided, and keepeth her self close thereunto as unto an ordinary and daily clothing or wearing apparel, compare Job 29.on vers.14.] and she laughteth at the day that is a coming. [that is, she is quiet, void of care, and without fear, in respect of the time to come, and that by reason of a good conscience, and the order which she hath made and taken in her housekeeping. Laughing is here taken, for being without fear, and for despising, see Job 5.on v.22.] at the day that is a coming. [meaning, the time to come, wherein she might be visited with adversity, want, or poverty. Others understand the time of old age, or the time of death, or the day of judgement that is to come.]"}],"26":[{"catchword":null,"tekst":"Pe. She openeth her mouth with wisdom, and in her tongue is the doctrine of kindness. [That is, speech of desiring to do well unto all, and exhortation to provoke and stir up others thereunto.]"}],"27":[{"catchword":null,"tekst":"Tsade. She beholdeth the goings of her house: [That is, how things go in her family, minding her children, her servants, the businesses and employements they are about, the moveables and household-stuff, as also the means and moneys that she is intrusted withal by her husband] and she eateth not the bread of idleness. [that is, the bread that is gotten without honest labour and taking of pains. Compare above, chap.4. on verse 17.]"}],"28":[{"catchword":null,"tekst":"Koph. Her children [Or sons] rise up, [that is, are ready and prepared to praise and commend her; as they likewise do straightway perform it. So, to rise up, or to get ones self up, is as much as to fit and make one self ready for, or apply ones self to any business, Gen 37:35. Exo 2:17. Jos.18.4. 1 Sam.25.29, &c.] and pronounce her blessed: (also) her husband; [to wit, getteth him up] and he praiseth her; (saying)"}],"29":[{"catchword":null,"tekst":"Resch. Many daughters [That is, many women, so, Genes.30.13. Luk 23:28.] have done virtuously; [to wit, in house-keeping, so is the word Chail taken, Ruth 3.11. and here above, verse 10.Oth. have done virtue, or, gathered riches] But thou excellest them all. [These and the former words of the verse, are the words of the verse, are the words of the husband and his sons.]"}],"30":[{"catchword":null,"tekst":"Schin. Favour, [Meaning, outward comeliness, and grace, or handsomeness, which some women-kind might have in or about them. See, Nahum.3.4.] is deceit, [Hebr. A lie, or falsehood, to wit, because they are deceived that rely upon it, as upon a sure and lasting estate; and because oftentimes great and gross vices are hidden under it] and beauty (is) vanty; [That is, fading, and soon or easily vanishing, see Job 15.on verse 31.] (but) a woman that feareth the LORD, [or a woman of the fear of the Lord; that is, a woman that is indued with the fear of the Lord] she shall be praised."}],"31":[{"catchword":null,"tekst":"Tau. Give her of fruit [Of the word, fruit see above, chap.1.o verse 31.] of her hands: [that is, works. To give something in words, is to praise, or commend, Jer 13:16. he intimateth by the forementioned words, that others should from the work of her hands take matter for to praise and commend her] and let her works praise her in the gates. [that is, in the public Congregations and Assemblies of the people, which were wont to be in the gates, where Judgement was kept, and Justice administered.]"}]}}};

(function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =

    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
