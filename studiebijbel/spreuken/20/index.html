oven halen.","6":"Elk van de menigte van de mensen roept zijn eigen weldadigheid uit; maar wie zal een echt trouwe man vinden?","7":"De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.","8":"Een koning, die op de troon van het gericht zit, verstrooit alle kwaad met zijn ogen.","9":"Wie kan zeggen: Ik heb mijn hart gezuiverd, ik ben rein van mijn zonde?","10":"Tweeërlei weegsteen, tweeërlei efa is de HEERE een gruwel, ja, die beide.","11":"Een jongen zal ook door zijn daden zich bekend maken, of zijn werk zuiver is, en of het recht zal zijn.","12":"Een horend oor en een ziend oog heeft de HEERE gemaakt, ja, die beide.","13":"Heb de slaap niet lief, opdat u niet arm wordt; open uw ogen, verzadig u met brood.","14":"Het is slecht, het is slecht! zal de koper zeggen; maar als hij weggegaan is, dan zal hij zich beroemen.","15":"Goud is er, en een menigte van robijnen; maar de lippen van de wetenschap zijn een kostbaar kleinood.","16":"Als iemand borg geworden is voor een vreemde, neem zijn kleed; en pand hem voor de onbekenden.","17":"Het brood van de leugen is de mens zoet; maar daarna zal zijn mond vol worden van zandsteentjes.","18":"Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.","19":"Wie als een achterklapper rondgaat, openbaart het geheime; vermeng u dan niet met hem die met zijn lippen verlokt.","20":"Wie zijn vader of zijn moeder vervloekt, diens lamp zal uitgeblust worden in zwarte duisternis.","21":"Als een erfenis in het begin gehaast verkregen wordt, zal het einde ervan niet gezegend worden.","22":"Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.","23":"Tweeërlei weegsteen is de HEERE een gruwel, en de bedrieglijke weegschaal is niet goed.","24":"De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?","25":"Het is een strik voor de mens, dat hij het heilige verslindt, en na *gedane* geloften onderzoek te doen.","26":"Een wijs koning verstrooit de goddelozen, en hij brengt het rad over hen.","27":"De ziel van de mens is een lamp van de HEERE, die alle binnenkamers van de buik doorzoekt.","28":"Weldadigheid en waarheid bewaren de koning; en door weldadigheid ondersteunt hij zijn troon.","29":"Het sieraad van de jongelingen is hun kracht, en de heerlijkheid van de ouden is de grijsheid.","30":"Gezwellen van de wond zijn een zuivering in de boze, alsook de slagen van het binnenste van de buik."},"SV":{"1":"De wijn is een spotter, de sterke drank is woelachtig; al wie daarin dwaalt, zal niet wijs zijn.","2":"De schrik des konings is als het brullen eens jongen leeuws; die zich tegen hem vergramt, zondigt tegen zijn ziel.","3":"Het is eer voor een man, van twist af te blijven; maar ieder dwaas zal er zich in mengen.","4":"Om den winter zal de luiaard niet ploegen; daarom zal hij bedelen in den oogst, maar er zal niet zijn.","5":"De raad in het hart eens mans is *als* diepe wateren; maar een man van verstand zal dien uithalen.","6":"Elk van de menigte der mensen roept zijn weldadigheid uit; maar wie zal een recht trouwen man vinden?","7":"De rechtvaardige wandelt steeds in zijn oprechtheid; welgelukzalig zijn zijn kinderen na hem.","8":"Een koning, zittende op den troon des gerichts, verstrooit alle kwaad met zijn ogen.","9":"Wie kan zeggen: Ik heb mijn hart gezuiverd, ik ben rein van mijn zonde?","10":"Tweeërlei weegsteen, tweeërlei efa is den HEERE een gruwel, ja die beide.","11":"Een jongen zal ook door zijn handelingen zich bekend maken, of zijn werk zuiver, en of het recht zal wezen.","12":"Een horend oor, en een ziend oog heeft de HEERE gemaakt, ja, die beide.","13":"Heb den slaap niet lief, opdat gij niet arm wordt; open uw ogen, verzadig u met brood.","14":"Het is kwaad, het is kwaad! zal de koper zeggen; maar als hij weggegaan is, dan zal hij zich beroemen.","15":"Goud is er, en menigte van robijnen; maar de lippen de wetenschap zijn een kostelijk kleinood.","16":"Als *iemand* *voor* een vreemde borg geworden is, neem zijn kleed; en pand hem voor de onbekenden.","17":"Het brood der leugen is den mens zoet; maar daarna zal zijn mond vol van zandsteentjes worden.","18":"Elke gedachte wordt door raad bevestigd, daarom voer oorlog met wijze raadslagen.","19":"Die *als* een achterklapper wandelt, openbaart het heimelijke; vermeng u dan niet met hem, die met zijn lippen verlokt.","20":"Wie zijn vader of zijn moeder vloekt, diens lamp zal uitgeblust worden in zwarte duisternis.","21":"Als een erfenis in het eerste verhaast wordt , zo zal haar laatste niet gezegend worden.","22":"Zeg niet: Ik zal het kwaad vergelden; wacht op den HEERE, en Hij zal u verlossen.","23":"Tweeërlei weegsteen is den HEERE een gruwel, en de bedriegelijke weegschaal is niet goed.","24":"De treden des mans zijn van den HEERE; hoe zou dan een mens zijn weg verstaan?","25":"Het is een strik des mensen, dat hij het heilige verslindt, en na *gedane* geloften, onderzoek te doen.","26":"Een wijs koning verstrooit de goddelozen, en hij brengt het rad over hen.","27":"De ziel des mensen is een lamp des HEEREN, doorzoekende al de binnenkameren des buiks.","28":"Weldadigheid en waarheid bewaren den koning; en door weldadigheid ondersteunt hij zijn troon.","29":"Der jongelingen sieraad is hun kracht, en der ouden heerlijkheid is de grijsheid.","30":"Gezwellen der wonde zijn in den boze een zuivering, mitsgaders de slagen van het binnenste des buiks."},"KJV":{"1":"Wine *is* a mocker, strong drink *is* raging: and whosoever is deceived thereby is not wise.","2":"The fear of a king *is* as the roaring of a lion: *whoso* provoketh him to anger sinneth *against* his own soul.","3":"*It is* an honour for a man to cease from strife: but every fool will be meddling.","4":"The sluggard will not plow by reason of the cold; *therefore* shall he beg in harvest,","5":"Counsel in the heart of man *is like* deep water; but a man of understanding will draw it out.","6":"Most men will proclaim every one his own goodness: but a faithful man who can find?","7":"The just *man* walketh in his integrity: his children *are* blessed after","8":"A king that sitteth in the throne of judgment scattereth away all evil with his eyes.","9":"Who can say, I have made my heart clean, I am pure from my sin?","10":"Divers weights, *and* divers measures, both of them *are* alike abomination to the LORD.","11":"Even a child is known by his doings, whether his work *be* pure, and whether *it be* right.","12":"The hearing ear, and the seeing eye, the LORD hath made even both","13":"Love not sleep, lest thou come to poverty; open thine eyes, *and* thou shalt be satisfied with bread.","14":"*It is* naught, *it is* naught, saith the buyer: but when he is gone his way, then he boasteth.","15":"There is gold, and a multitude of rubies: but the lips of knowledge *are* a precious jewel.","16":"Take his garment that is surety *for* a stranger: and take a pledge of him for a strange woman.","17":"Bread of deceit *is* sweet to a man; but afterwards his mouth shall be filled with gravel.","18":"*Every* purpose is established by counsel: and with good advice make war.","19":"He that goeth about *as* a talebearer revealeth secrets: therefore meddle not with him that flattereth with his lips.","20":"Whoso curseth his father or his mother, his lamp shall be put out in obscure darkness.","21":"An inheritance *may be* gotten hastily at the beginning; but the end thereof shall not be blessed.","22":"Say not thou, I will recompense evil; *but* wait on the LORD, and he shall save","23":"Divers weights *are* an abomination unto the LORD; and a false balance *is* not good.","24":"Man's goings *are* of the LORD; how can a man then understand his own way?","25":"*It is* a snare to the man *who* devoureth *that which is* holy, and after vows to make enquiry.","26":"A wise king scattereth the wicked, and bringeth the wheel","27":"The spirit of man *is* the candle of the LORD, searching all the inward parts of the belly.","28":"Mercy and truth preserve the king: and his throne is upholden by mercy.","29":"The glory of young men *is* their strength: and the beauty of old men *is* the gray head.","30":"The blueness of a wound cleanseth away evil: so *do* stripes the inward parts of the belly."}},"tsk":{"2":[{"kopje":"schrik","refs":["Spr 16:14","Spr 16:15","Spr 19:12","Pred 10:4","Hos 11:10","Amos 3:8"]},{"kopje":"zondigt","refs":["Spr 8:36","1 Kon 2:23"]}],"3":[{"kopje":"een","refs":["Spr 14:29","Spr 16:32","Spr 17:14","Spr 19:11","Spr 25:8-10","Ef 1:6-8","Ef 4:32","Ef 5:1"]},{"kopje":"maar","refs":["Spr 14:17","Spr 18:6","Spr 21:24","2 Kon 14:9","Jak 3:14","Jak 4:1"]}],"4":[{"kopje":"luiaard","refs":["Spr 10:4","Spr 19:15","Spr 19:24","Spr 26:13-16"]},{"kopje":"daarom","refs":["Spr 6:10","Spr 6:11","Spr 19:15","Spr 24:34","Matt 25:3-10","Matt 25:24-28","2 Petr 1:5-11"]}],"6":[{"kopje":"roept uit","refs":["Spr 25:14","Spr 27:2","Matt 6:2","Luk 18:8","Luk 18:11","Luk 18:28","Luk 22:33","2 Kor 12:11"]},{"kopje":"maar","refs":["Ps 12:2","Pred 7:28","Jer 5:1","Micha 7:2","Luk 18:8","Joh 1:48"]}],"7":[{"kopje":"rechtvaardige","refs":["Spr 14:2","Spr 19:1","Ps 15:2","Ps 26:1","Ps 26:11","Jes 33:15","Luk 1:6","2 Kor 1:12","Tit 2:11","Tit 2:12","3 Joh 1:3","3 Joh 1:4"]},{"kopje":"zijn kinderen","refs":["Spr 13:22","Gen 17:7","Ps 37:26","Ps 112:2","Jer 32:39","Hand 2:39"]}],"10":[{"kopje":"Tweeërlei weegsteen, tweeërlei efa","refs":["Deut 25:13"]},{"kopje":"die beide","refs":["Spr 20:23","Spr 11:1","Spr 16:11","Lev 19:35","Deut 25:13-15","Amos 8:4-7","Micha 6:10","Micha 6:11"]},{"kopje":"gruwel","refs":["Deut 7:25","Deut 7:26","Openb 21:8"]}],"13":[{"kopje":"Heb ... lief","refs":["Spr 6:9-11","Spr 10:4","Spr 12:11","Spr 13:4","Spr 19:15","Spr 24:30-34","Rom 12:11","2 Tess 3:10"]},{"kopje":"open","refs":["Jona 1:6","Rom 13:11","1 Kor 15:34","Ef 5:14"]}],"14":[{"kopje":"Het is slecht","refs":["Pred 1:10","Hos 12:8","Hos 12:9","1 Tess 4:6"]}],"15":[{"kopje":"maar","refs":["Spr 3:15","Spr 8:11"  is a <span class=\"wl wl-kjv\" data-code=\"H4170\">snare</span> to the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> who <span class=\"wl wl-kjv\" data-code=\"H3216\">devoureth</span> that which is <span class=\"wl wl-kjv\" data-code=\"H6944\">holy,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> to make enquiry.","26":"A <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2219\">scattereth</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">bringeth</span> the wheel","27":"The <span class=\"wl wl-kjv\" data-code=\"H5397\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> is the <span class=\"wl wl-kjv\" data-code=\"H5216\">candle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H2664\">searching</span> all the inward <span class=\"wl wl-kjv\" data-code=\"H2315\">parts</span> of the belly.","28":"<span class=\"wl wl-kjv\" data-code=\"H2617\">Mercy</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> <span class=\"wl wl-kjv\" data-code=\"H5341\">preserve</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> and his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> is <span class=\"wl wl-kjv\" data-code=\"H5582\">upholden</span> by mercy.","29":"The <span class=\"wl wl-kjv\" data-code=\"H8597\">glory</span> of young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> is their <span class=\"wl wl-kjv\" data-code=\"H3581\">strength:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1926\">beauty</span> of old <span class=\"wl wl-kjv\" data-code=\"H2205\">men</span> is the gray head.","30":"The <span class=\"wl wl-kjv\" data-code=\"H2250\">blueness</span> of a <span class=\"wl wl-kjv\" data-code=\"H6482\">wound</span> <span class=\"wl wl-kjv\" data-code=\"H8562\">cleanseth</span> away <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> so do <span class=\"wl wl-kjv\" data-code=\"H4347\">stripes</span> the inward <span class=\"wl wl-kjv\" data-code=\"H2315\">parts</span> of the belly."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"wijn","tekst":"Dat is, de wijn en andere sterke drank, door overdaad misbruikt zijnde, maakt dat de mensen, die hem misbruiken, spotters en gewoelmakers worden."},{"catchword":"de sterke drank","tekst":"Hebreeuws, schechar. Zie van dit woord Lev 10:9 ."},{"catchword":"woelachtig;","tekst":"Of, woelende, of een gewoelmaker; dat is die tot roepen, tieren, kijven, slaan, vechten, enz. den mens verwekt. Zie onder Pro 23:29 ; idem, Hos 4:11 , Hos 4:18 , en van het Hebreeuwse woord, boven Pro 7:11 ."},{"catchword":"daarin dwaalt,","tekst":"Dat is, in het drinken deszelven de maat tebuitengaat. Zie dezelfde manier van spreken in het kwade genomen, Isa 28:7 , en in het goede, boven Pro 5:19 ; op het woord doolt."},{"catchword":"zal niet wijs zijn","tekst":"Dat is, zal de ware wijsheid niet leren, als daartoe onbekwaam zijnde. Of: is niet wijs; dat is, niet verstandig, niet welbedacht, niet godvrezend of deugdzaam."}],"2":[{"catchword":"eens konings","tekst":"Te weten, welken een koning iemand in zijn toornigheid aanbrengt. Versta alzo de verschrikking der mensen; Gen 9:2 . De schrik Gods; Gen 35:5 . De schrik der Israëlieten; Deu 2:25 ."},{"catchword":"eens jongen leeuws;","tekst":"Zie boven Pro 19:12 ."},{"catchword":"hem","tekst":"Namelijk, den koning."},{"catchword":"vergramt,","tekst":"Te weten, met gramme en toornige redenen den koning bejegent."},{"catchword":"tegen zijn ziel","tekst":"Dat is, tegen zijn leven, hetwelk hij in groot gevaar brengt. Vergelijk Num 16:38 , en 1Ki 2:23 , en boven Pro 8:36 , mitsgaders de aantekening."}],"3":[{"catchword":"af te blijven;","tekst":"Hebreeuws, te zitten. Zitten voor blijven; zie 2Ch 32:10 ."}],"4":[{"catchword":"den winter","tekst":"Te weten, die in den zaaitijd nabij is; dat is, om de koude, die dan begint aante komen, of ter wille van het kwade weder. Anders: in den herfst zal de luiaard, enz. Maar het Hebreeuwse woord choreph is tegen den zomer gesteld; Gen 8:22 ; Psa 74:17 ; Amo 3:15 ; Zec 14:8 . En de winter is alzo genoemd, omdat hij gelijk de smaad is der aarde, wegnemende alle schoonheid, groenheid en lieflijkheid derzelve."},{"catchword":"bedelen","tekst":"Het Hebreeuwse woord is aldus genomen, Psa 109:10 ."},{"catchword":"daar zal niets zijn","tekst":"Te weten, dat hij zou mogen maaien, gelijk anderen, die geploegd en gezaaid hebben."}],"5":[{"catchword":"raad","tekst":"Dat is, de wijsheid, waardoor men weet zichzelven en anderen in alle voorvallende dingen wel te raden."},{"catchword":"mans","tekst":"Te weten, die wijs, voorzichtig en kloekzinnig is."},{"catchword":"diepe wateren;","tekst":"Zie boven Pro 18:4 ."},{"catchword":"van verstand","tekst":"Dat is, die verstandig is, alzo boven Pro 10:23 , en Pro 11:12 ."},{"catchword":"dien","tekst":"Te weten, raad."},{"catchword":"uithalen","tekst":"Dat is, uitputten en uittrekken, te weten, met den wijze te vragen, aan te horen en alzo te leren. Vergelijk boven Pro 1:5 . Of versta dat eens diepzinnigen en eenzamen mans genegenheid en voornemen nog enigszins van een verstandig man kan onderzocht, uitgevorst en ontdekt worden."}],"6":[{"catchword":"weldadigheid","tekst":"Dat is, roemt zich over zijn goede werken en weldaden, die hij aan anderen bewijst; doch dikwijls met onwaardigheid, door enkel eergierigheid."},{"catchword":"recht trouwen man","tekst":"Hebreeuws, een man der getrouwheden. De vraag geeft hier te kennen dat er weinig zodanigen te vinden zijn. Zie gelijke manier van vragen onder Pro 31:10 ."}],"7":[{"catchword":"oprechtheid;","tekst":"Zie Gen 20:5 ."}],"8":[{"catchword":"koning,","tekst":"Te weten, die wijs, vroom en gerechtigd is."},{"catchword":"op den troon","tekst":"Om onder zijn volk het recht uit te spreken."},{"catchword":"verstrooit","tekst":"Dat is, doet van hem en zijn volk alle boosheid en het boze wegruimen en uit zijn land delgen, gelijk de zon met haar schijnsel de dikke nevelen en dampen verdrijft. Vergelijk Psa 101:4 ."},{"catchword":"kwaad","tekst":"Te weten, door de misdadigers voor hem te dagvaarden, kennis te nemen van hun boze stukken, daarover hen te overtuigen, te veroordelen en te bestraffen. J, hij weet hen met een opslag der ogen te verschrikken en te verjagen."}],"9":[{"catchword":"zeggen","tekst":"Te weten, met der waarheid. Het is een vraag, die sterk loochent. Zie Gen 18:17 ."}],"10":[{"catchword":"Tweeërlei","tekst":"Hebreeuws, steen en steen, efa en efa; dat is, tweeërlei steen en tweeërlei efa, te weten, een grote, om daarmede in te kopen, en een kleine, om daarmede te verkopen, alzo Deu 25:13 ; zie de aantekening aldaar; idem, onder vs.23."},{"catchword":"weegsteen,","tekst":"Dat is, gewicht. Zie Lev 19:36 ."},{"catchword":"efa","tekst":"Dat is, maat. Wat efa eigenlijk voor een maat geweest is, zie Exo 16:36 ."},{"catchword":"den HEERE","tekst":"Hebreeuws, des Heeren gruwel. Zie boven Pro 3:32 ."},{"catchword":"ja","tekst":"Zie dezelfde manier van spreken boven Pro 17:15 , en onder vs.12."}],"11":[{"catchword":"door zijn handelingen","tekst":"Dat is, door zijn kinderlijke manieren, die in zijn eerste jaren zich vertonen."},{"catchword":"zijn werk","tekst":"Versta, zijn leven, hetwelk hij in den toekomenden tijd leiden zal."}],"12":[{"catchword":"Een horend oor,","tekst":"De zin is dat van God zijn niet alleen de instrumenten en werktuigen der uiterlijke zinnen, maar ook de macht om die te gebruiken en de gaven om wel te gebruiken. Sommigen verstaan dit in het bijzonder van de gehoorzaamheid, die de onderzaten hunnen overheden schuldig zijn, en van de wijze en voorzichtige regering, waardoor de overheden trouwe ogen moeten hebben over het welvaren hunner onderzaten."}],"13":[{"catchword":"slaap","tekst":"Te weten, die onmatig is en uit luiheid voortkomt; boven Pro 19:15 ."},{"catchword":"open uw ogen,","tekst":"Te weten, nadat de natuur haar behoorlijken slaap gehad heeft; begeef u dan tot eerlijken arbeid om den kost te winnen."},{"catchword":"verzadig","tekst":"Het is een bevel, inhoudende de belofte van verzadigd te zullen worden. Zie van zulke manier van spreken boven Pro 3:25 ."},{"catchword":"brood","tekst":"Versta, lichamelijke nooddruft. Zie Gen 3:19 , en Gen 18:5 , mitsgaders de aantekening."}],"14":[{"catchword":"Het is kwaad,","tekst":"Te weten, het goed, of de waar, die de koper dingt om te kopen; lakende alzo uit eigen baatzoeking hetgeen hij gaarne had."},{"catchword":"als hij weggegaan is,","tekst":"Dat is, als hij tot zijn eigen voordeel den koop gedaan heeft, gaat hij zijns weegs en prijst zichzelven dat hij door zijne loosheid de waar onder hare waarde gekocht heeft."}],"15":[{"catchword":"robijnen;","tekst":"Zie Job 28:18 ."},{"catchword":"lippen","tekst":"Dat is, die wetenschap voortbrengen. Versta, wijze en deugdzame redenen; alzo boven Pro 14:7 . Vergelijk ook boven Pro 12:19 , en zie de aantekening."},{"catchword":"kleinood","tekst":"Hebreeuws, vat, of gereedschap. Zie Job 28:17 ."}],"16":[{"catchword":"iemand","tekst":"Van de invoeging van dit woord, vergelijk boven Pro 11:15 , en onder Pro 27:13 ."},{"catchword":"voor","tekst":"] Dit woord is hier ingevoegd uit het volgende lid van vs.16. Vergelijk boven Pro 11:15 , en onder Pro 27:13 ."},{"catchword":"vreemde","tekst":"Dat is, die u onbekend is, en van wiens middelen gij gene zekerheid hebt om van zijne betaling onbezorgd te wezen."},{"catchword":"neem","tekst":"Te weten, gij, tot wiens verzekering de borg gesteld is."},{"catchword":"zijn kleed;","tekst":"Te weten, desgenen, die borg geworden is voor een onbekende, en dat tot een pand en zekerheid, dat hij voor den vreemde, zo hij in gebreke valt, zal betalen."},{"catchword":"de onbekenden","tekst":"Te weten, lieden. Anders: Voor een uitlandse vrouw; alzo onder Pro 27:13 . Versta door een uitlandse vrouw ene hoer, of die u onbekend is. Zie boven Pro 2:16 ."}],"17":[{"catchword":"der leugen","tekst":"Dat is het goed door valse en bedriegelijke middelen gekregen. Zie boven Pro 4:17 ; idem vergelijk boven Pro 9:17 , en de aantekening."},{"catchword":"zal zijn mond","tekst":"De zin is dat zulk goed hem in het einde schadelijk zal zijn en groot verdriet toebrengen."},{"catchword":"zandsteentjes","tekst":"Of, breekstenen, of keistenen. Zie het Hebreeuwse woord ook Lam 3:16 ."}],"19":[{"catchword":"als","tekst":"Zie Lev 19:16 ."},{"catchword":"heimelijke;","tekst":"Dat is, het geheim van een ander, dat hem toevertrouwd is."},{"catchword":"verlokt","tekst":"Of, liefkoost, vleit, verleidt; dat is, die met aanlokkende en schone woorden iemand aankomt om wat uit zijnen mond te trekken, hetwelk hij daarna gaat overdragen. Zie van het Hebreeuwse woord Jdg 14:15 , op het woord overreden."}],"20":[{"catchword":"lamp","tekst":"Dat is, zijn welstand, voorspoed en welgelukzaligheid zal vergaan. Zie Job 18:6 ."},{"catchword":"in zwarte duisternis","tekst":"Hebreeuws, in de zwartheid der duisternis; dat is als de duisternis zo groot is, dat zij gans zwart en dik is. Vergelijk boven Pro 7:9 , en de aantekening. Versta daarbij een zeer droevigen en ellendigen staat, in welken de vloeker van God zal verlaten worden. Zie Gen 15:12 ."}],"21":[{"catchword":"erfenis","tekst":"Versta, allerlei rijkdom en goed, dat iemand zou mogen aankomen en hij zijnen erfgenamen nalaten."},{"catchword":"verhaast","tekst":"Dat is, in korten tijd met grote woeling door allerlei middelen en wegen vergaderd en opgehoopt wordt. Vergelijk onder Pro 21:5 ."}],"22":[{"catchword":"Zeg niet","tekst":"Te weten, bij uzelven, of ook tegen uwen naaste."}],"23":[{"catchword":"Tweeërlei","tekst":"Hebreeuws, steen en steen. Zie boven vs.10."},{"catchword":"bedriegelijke","tekst":"Hebreeuws, de waag des bedrogs; dat is, waarmede men zijnen naaste bedriegt, door hem zijn volle gewicht niet te geven en voor zichzelven meer dan het zijne te nemen."},{"catchword":"is niet goed","tekst":"Dat is, zij is zeer kwaad. Zie boven Pro 17:26 ."}],"24":[{"catchword":"treden des mans","tekst":"Dat is, de gedachten, het voornemen, de woorden en werken, het doen en laten."},{"catchword":"zijn van den HEERE;","tekst":"Te weten, niet alleen door het werk der schepping, maar ook door de werken der onderhouding en regering."},{"catchword":"zijn weg","tekst":"Dat is, wat hem in zijn leven zal overkomen."}],"25":[{"catchword":"strik","tekst":"Te weten, waarin hijzelf gevangen wordt; dat is, het is een schadelijk ding voor den mens."},{"catchword":"het heilige","tekst":"Dat is, dat door de geloften Gode toegeheiligd is."},{"catchword":"verslindt,","tekst":"Te weten, met dezelve te eten of te drinken, hetwelk tegen de wet was; Lev 27:9 ; Deu 23:21 ."},{"catchword":"onderzoek","tekst":"Te weten, of gij uwe geloften onderhouden zult of niet."}],"26":[{"catchword":"verstrooit","tekst":"Zie de aantekening boven vs.8."},{"catchword":"rad","tekst":"Dat is, hij laat een harde lijfstraf over hen gaan. Voortijds werden grote kwaaddoeners aldus gestraft, dat men een wagen met scherp beslagen wielen over hen liet gaan. Zie 2Sa 12:31 . Versta hieronder, allerlei harde straf."}],"27":[{"catchword":"ziel","tekst":"Versta, de redelijke ziel, die met het natuurlijke licht van vernuft en onderscheid tussen goed en kwaad begaafd is, of ook met het bovennatuurlijke der wedergeboorte, waardoor de mens verstaan kan wat hij geloven en hoe hij leven moet."},{"catchword":"lamp","tekst":"Dat is, ene klaarschijnend licht der wetenschap, gegeven en ontstoken van den Heere, waardoor de mens zichzelven van buiten en van binnen kent, en onder Gods beleid bestuurd wordt in al zijn doen en laten; vergelijk Mat 6:22-23 ; Luk 11:34-35 ; 1Co 2:11 ."},{"catchword":"al de binnenkameren","tekst":"Dat is, al de binnenste delen der gedachten, genegenheden, gemoedsbewegingen en der zeer verborgen conscientie; zie Job 15:2 ."}],"28":[{"catchword":"Weldadigheid","tekst":"Zie Psa 101:1 , en onder Pro 25:5 ."}],"29":[{"catchword":"heerlijkheid","tekst":"Te weten, omdat de ouderdom menigmaal een zegen is, waarmede God de vromen vereert; en omdat daarbij ten meeste dele is wijsheid, ervarenheid en raadzaamheid."}],"30":[{"catchword":"Gezwellen","tekst":"De zin is, dat aan een mens, die tot boosheid overgegeven is, gene betering te verwachten is, dan door zware lijfstraffen."},{"catchword":"van het binnenste","tekst":"Dat is, die tot het binnenste van lichaam en ziel doordringen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wine is a mocker, strong drink is outrageous: [Or, raging, or, a disturber, or causer of trouble and raging: that is, that provoketh a man to cry, roar, make a noise, to child, brawl, scold, sight, squabble, &c. See bel.chapter 23.20. also Hos 4:11.18. and of the Hebrew word, ab.chapter 7.11. The meaning is, that wine, and other strong drink, being abused by excess and intemperance, maketh those men, that do abuse them, to become mockers, and outrageous or raging persons. The word rendered here strong drink, is in Hebrew schechar. See of this word, Levit.ch.10.on verse 9.] whosoever erreth therein, [that is, exceedeth measure in drinking thereof. See the same phrase taken in bad sense, Isa 28:7. and in a good sense, ab.ch.5.19. on the word erreth] shall not be wise. [that is, shall not learn true wisdom, as being unfit for it. Or, is not wise; that is, is not prudent, not well advised, not godly, nor virtuous.]"}],"2":[{"catchword":null,"tekst":"The terror of a King [To wit, the terror, which a King in his wrath causeth or produceth in a man. Understand so likewise the terror of men, Gen 9:1. The terror of God, Gen 35:5. the terror of the Israelites, Deut.2.25.] is as the roaring of a young lion: [see above chapter 19.on verse 12. Compare also above chapter 16.14.] he that is angerly affected towards him, [namely, the King, that is, he that useth harsh and angry language against the King] sinneth against his (own) soul. [that is, against his own life, which he bringeth into great danger. Compare Num 16:38. and 1 Kings 2.23. and ab.ch.8.36. together with the annot.]"}],"3":[{"catchword":null,"tekst":"It is an honour for a man to tarry away [Hebr. To sit. Sitting for straying, or tarrying, see 2 Chron.32.on verse 10.] from strife: [comp.ab.ch.17.14.] but every fool will mingle himself in it."}],"4":[{"catchword":null,"tekst":"The sluggard will not plow by reason of winter: [To wit, which is nigh at hand, in seed-time; that is, by reason of the cold that then beginneth to come, or because of the badness of the weather. Oth. The sluggard will not plow in harvest. But the Hebrew word choreph is opposed unto Summer, Gen 8:22. Psalm 74. 17. Amos 3.15. Zach.14.8. And winter is so called, because it is as it were the reproach of the earth; taking away all the beauty, greenness, and loveliness of it] therefore shall he beg [the Hebr. Word is so taken, Psa 109:10.] in harvest: but there shall be nothing. [to wit, for him to reap, as there is for others, that have plowed, and sowen.]"}],"5":[{"catchword":null,"tekst":"Counsel [That is, wisdom, whereby men are able to give themselves and others good advice in all things that fall out] in the heart of a man, [to wit, that is wise, understanding, and prudent] is (as) deep waters: [see above chapter 18.on verse 4.] but a man of understanding [that is, a man that is wise and understanding: so above chapter 10.23. and 11.12. will fetch it [to wit, counsel] out. [that is, draw it out, and pluck it out: to wit, by moving questions to wise men, and hearing what they can say to them, and so learning of them. Compare above chap.1.5. Or, the meaning is, that the bent and purpose of a deep witted and retired man may yet in a manner be searched, sifted out, and discovered by a wise and understanding man.]"}],"6":[{"catchword":null,"tekst":"Every one of the multitude of men proclaimeth his own goodness; [That is, boasteth of his own good deeds, and kindnesses shewed unto others; though oftentimes not in reality, and in truth; but merely out of ambition, and a greedy and eager desire of honour and vain-glory] but who can find a right faithful man? [Hebrew a man faithfulnesses. The question intimateth here, that there be but few such men to be found. See the like manner asking, bel.ch.31.10.]"}],"7":[{"catchword":null,"tekst":"The righteous walketh continually in his uprightness: [See Gen.20.on verse 5.] his children are blessed after him."}],"8":[{"catchword":null,"tekst":"A King to wit, that is was, godly, and righteous] sitting on the throne of judgement, [to pronounce judgement, or give sentence amongst his people] scattereth away all evil with his eyes. [to wit, by summoning malefactors, or wicked doers before him, by taking knowledge of their offences, by convincing them of their wicked crimes, by sentencing and condemning of them, and by causing them to be punished according to their deservings, yea he knowneth how to frighten them, and to chase them away with a very look, or cast of his eye. The meaning is, that a wise, godly, and righteous King, that sitteth among his subjects in the place of Judicature, to execute justice, and judgement, causeth all wickedness, and wicked doers to remove from him, and from his people, yea to be destroyed and rooted out of his land, and that by his very looks, or casting his eyes upon them; even as the sun by its beams and shining dispelleth and driveth away the thick mists and vapours, that arise out of the earth. Compare Psa 101:4. below verse 26.]"}],"9":[{"catchword":null,"tekst":"Who can say [To wit, indeed and in truth. It is a question, that implyeth a strong denial. See Gen.18.on verse 17.] I have made mine heart clean? I am pure from my sin? [Compare 1 Kings 8.46. Job14.4. Psa 51:7. Ecc 7:21. 1Jn 1:8.]"}],"10":[{"catchword":null,"tekst":"A twofold weighing stone, [That is, a twofold weight. See Lev.19.on verse 36.] (and) a twofold Epha, [that is, a twofold measure. What kind of measure the Epha properly was, see Exod.16.on verse 36. Hebr. Stone and stone, Epha and Epha; that is, a twofold stone, and a twofold Epha; to wit, a great one, to buy by, and small one, to sell by. So Deut.25.13. see the annot. There, also below verse 23.] is an abomination unto the LORD, [Hebr. Is the Lords abomination. See above chapter 3.on verse 32.] yea they both. [See the same phrase, above chapter 17.15. and below verse 12. Compare Deut.25.16. above chapter 11.1. and below ver.23.]"}],"11":[{"catchword":null,"tekst":"A boy will also make himself known by his dealings, [That is, by his childish manners, that discover themselves in his first years] whether his work [meaning his life, which he shall lead hereafter, in time to come] (shall be) pure, and whether it shall be right."}],"12":[{"catchword":null,"tekst":"An hearing ear, and a seeing eye, the LORD hath made, yea both of them. [The meaning is, that of or from God, do proceed not only the instruments, and work tools of the outward senses, but also the power and faculty to use them, and the gift to use them well. Compare Exod.4,11. Psa 34:9. Some understand this in particular of the obedience and loyalty which subjects owe unto their Prince, or Soveraign, and of the wise and prudent government, whereby Princes and Magistrates ought to have faithful eyes upon, and a tender care of the welfare and prosperity of their subjects.]"}],"13":[{"catchword":null,"tekst":"Love not sleep, [To wit, that which is immoderate, and which proceedeth from idleness, or laziness, above chapter 19.15.] left thou become poor: open thine eyes, [to wit, after that nature hath had her due sleep. Then apply thy self to honest labour in thy lawful calling, for to get thy living by] satisfy thy self with bread. [it is a commandment, containing in it a promise that we shall be satisfied if we take pai // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
