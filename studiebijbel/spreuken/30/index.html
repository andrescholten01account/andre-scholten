"Elk woord van God is doorlouterd; Hij is een Schild voor hen die op Hem vertrouwen.","6":"Voeg niets toe aan Zijn woorden, opdat Hij u niet bestraft, en u leugenachtig wordt bevonden.","7":"Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf;","8":"Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;","9":"Opdat ik, als ik verzadigd ben, *U* dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.","10":"Belaster een knecht niet bij zijn heer, opdat hij u niet vloekt, en u schuldig wordt.","11":"Er is een geslacht dat zijn vader vervloekt, en zijn moeder niet zegent;","12":"Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;","13":"Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;","14":"Een geslacht wiens tanden zwaarden zijn, en wiens baktanden messen zijn, om de ellendigen van de aarde en de behoeftigen onder de mensen te verslinden.","15":"De bloedzuiger heeft twee dochters: Geef, geef! Deze drie dingen worden niet verzadigd; *ja*, vier zeggen niet: Het is genoeg!","16":"Het graf, de gesloten baarmoeder, de aarde die van water niet verzadigd wordt, en het vuur dat niet zegt: Het is genoeg!","17":"Het oog dat de vader bespot, of de gehoorzaamheid aan de moeder veracht, dat zullen de raven van de beek uitpikken, en de jongen van de arend zullen het eten.","18":"Deze drie dingen zijn voor mij te wonderlijk, ja, vier, die ik niet begrijp:","19":"De weg van een arend in de hemel; de weg van een slang op een rotssteen; de weg van een schip in het hart van de zee; en de weg van een man bij een meisje.","20":"Zo is de weg van een overspelige vrouw; zij eet en veegt haar mond af, en zegt: Ik heb geen onrecht gedaan!","21":"Om drie dingen beeft de aarde, ja, om vier, die zij niet kan dragen:","22":"Om een knecht, als hij regeert; en een dwaas, als hij verzadigd is met brood;","23":"Om een hatelijke *vrouw*, als zij getrouwd wordt; en een dienstmaagd, als zij erfgenaam wordt van haar vrouw.","24":"Deze vier zijn van de kleinste op de aarde; toch zijn ze wijs, met wijsheid goed toegerust.","25":"De mieren zijn een volk zonder kracht; toch bereiden zij in de zomer hun voedsel.","26":"De klipdassen zijn een machteloos volk; toch bouwen zij hun huis in de rots.","27":"De sprinkhanen hebben geen koning; toch trekken zij allen uit, verdeeld in groepen.","28":"De spin grijpt met haar poten, en is in de paleizen van koningen.","29":"Deze drie hebben een mooie tred; ja, vier zijn er die een mooie gang hebben;","30":"De leeuw, geweldig onder de dieren, die voor niemand terugwijkt;","31":"Een windhond met sterke lenden, of een bok; en een koning tegen wie niemand kan opstaan.","32":"Als u dwaas gehandeld hebt door uzelf te verheffen, en als u kwaad bedacht hebt: de hand op de mond!","33":"Want het karnen van melk brengt boter voort, en het knijpen van de neus brengt bloed voort, en het opjagen van de toorn brengt twist voort."},"SV":{"1":"De woorden van Agur, den zoon van Jake; een last. De man spreekt tot Ithiel, tot Ithiel en Uchal.","2":"Voorwaar, ik ben onvernuftiger dan iemand; en ik heb geen mensenverstand;","3":"En ik heb geen wijsheid geleerd, noch de wetenschap der heiligen gekend.","4":"Wie is ten hemel opgeklommen, en nedergedaald? Wie heeft den wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft al de einden der aarde gesteld? Hoe is Zijn Naam, en hoe is de Naam Zijns Zoons, zo gij het weet?","5":"Alle rede Gods is doorlouterd; Hij is een Schild dengenen, die op Hem betrouwen.","6":"Doe niet tot Zijn woorden, opdat Hij u niet bestraffe, en gij leugenachtig bevonden wordt.","7":"Twee dingen heb ik van U begeerd, onthoud ze mij niet, eer ik sterve;","8":"Ijdelheid en leugentaal doe verre van mij; armoede of rijkdom geef mij niet; voed mij met het brood mijns bescheiden deels;","9":"Opdat ik, zat zijnde, *U* dan niet verloochene, en zegge: Wie is de HEERE? of dat ik, verarmd zijnde, dan niet stele, en den Naam mijns Gods aantaste.","10":"Achterklap niet van den knecht bij zijn heer, opdat hij u niet vloeke, en gij schuldig wordt.","11":"Daar is een geslacht, dat zijn vader vervloekt, en zijn moeder niet zegent;","12":"Een geslacht, dat rein in zijn ogen is, en van zijn drek niet gewassen is;","13":"Een geslacht, welks ogen hoog zijn, en welks oogleden verheven zijn;","14":"Een geslacht, welks tanden zwaarden, en welks baktanden messen zijn, om de ellendigen van de aarde en de nooddruftigen van onder de mensen te verteren.","15":"De bloedzuiger heeft twee dochters: Geef, geef! Deze drie dingen worden niet verzadigd; *ja*, vier zeggen niet: Het is genoeg!","16":"Het graf, de gesloten baarmoeder, de aarde, *die* van water niet verzadigd wordt, en het vuur zegt niet: Het is genoeg!","17":"Het oog, *dat* den vader bespot, of de gehoorzaamheid der moeder veracht, dat zullen de raven der beek uitpikken, en des arends jongen zullen het eten.","18":"Deze drie dingen zijn voor mij te wonderlijk, ja, vier, die ik niet weet:","19":"De weg eens arends in den hemel; de weg ener slang op een rotssteen; de weg van een schip in het hart der zee; en de weg eens mans bij een maagd.","20":"Alzo is de weg ener overspelige vrouw; zij eet en wist haar mond, en zegt: Ik heb geen ongerechtigheid gewrocht!","21":"Om drie dingen ontroert zich de aarde, ja, om vier, *die* zij niet dragen kan:","22":"Om een knecht, als hij regeert; en een dwaas, als hij van brood verzadigd is;","23":"Om een hatelijke *vrouw*, als zij getrouwd wordt; en een dienstmaagd, als zij erfgenaam is van haar vrouw.","24":"Deze vier zijn van de kleinste der aarde; doch dezelve zijn wijs, met wijsheid wel voorzien.","25":"De mieren zijn een onsterk volk; evenwel bereiden zij in de zomer haar spijs.","26":"De konijnen zijn een machteloos volk; nochtans stellen zij hun huis in den rotssteen.","27":"De sprinkhanen hebben geen koning; nochtans gaan zij allen uit, zich verdelende *in* *hopen*.","28":"De spinnekop grijpt met de handen, en is in de paleizen der koningen.","29":"Deze drie maken een goeden tred; ja, vier zijn er, die een goeden gang maken;","30":"De oude leeuw geweldig onder de gedierten, die voor niemand zal wederkeren;","31":"Een windhond van goede lenden, of een bok; en een koning, die niet tegen te staan is.","32":"Zo gij dwaselijk gehandeld hebt, met u te verheffen, en zo gij kwaad bedacht hebt, de hand op den mond!","33":"Want de drukking der melk brengt boter voort, en de drukking van den neus brengt bloed voort, en de drukking des toorns brengt twist voort."},"KJV":{"1":"The words of Agur the son of Jakeh, *even* the prophecy: the man spake unto Ithiel, even unto Ithiel and Ucal,","2":"Surely I *am* more brutish than *any* man, and have not the understanding of a man.","3":"I neither learned wisdom, nor have the knowledge of the holy.","4":"Who hath ascended up into heaven, or descended? who hath gathered the wind in his fists? who hath bound the waters in a garment? who hath established all the ends of the earth? what *is* his name, and what *is* his son's name, if thou canst tell?","5":"Every word of God *is* pure: he *is* a shield unto them that put their trust","6":"Add thou not unto his words, lest he reprove thee, and thou be found a liar.","7":"Two *things* have I required of thee; deny me *them* not before I die:","8":"Remove far from me vanity and lies: give me neither poverty nor riches; feed me with food convenient","9":"Lest I be full, and deny *thee*, and say, Who *is* the LORD? or lest I be poor, and steal, and take the name of my God","10":"Accuse not a servant unto his master, lest he curse thee, and thou be found guilty.","11":"*There is* a generation *that* curseth their father, and doth not bless their mother.","12":"*There is* a generation *that are* pure in their own eyes, and *yet* is not washed from their filthiness.","13":"*There is* a generation, O how lofty are their eyes! and their eyelids are lifted up.","14":"*There is* a generation, whose teeth *are as* swords, and their jaw teeth *as* knives, to devour the poor from off the earth, and the needy from *among* men.","15":"The horseleach hath two daughters, *crying*, Give, give. There are three *things that* are never satisfied, *yea*, four *things* say not, *It is* enough:","16":"The grave; and the barren womb; the earth *that* is not filled with water; and the fire *that* saith not, *It is* enough.","17":"The eye *that* mocketh at *his* father, and despiseth to obey *his* mother, the ravens of the valley shall pick it out, and the young eagles shall eat","18":"There be three *things which* are too wonderful for me, yea, four which I know","19":"The way of an eagle in the air; the way of a serpent upon a rock; the way of a ship in the midst of the sea; and the way of a man with a maid.","20":"Such *is* the way of an adulterous woman; she eateth, and wipeth her mouth, and saith, I have done no wickedness.","21":"For three *things* the earth is disquieted, and for four *which* it cannot bear:","22":"For a servant when he reigneth; and a fool when he is filled with meat;","23":"For an odious *woman* when she is married; and an handmaid that is heir to her mistress.","24":"There be four *things which are* little upon the earth, but they *are* exceeding wise:","25":"The ants *are* a people not strong, yet they prepare their meat in the summer;","26":"The conies *are but* a feeble folk, yet make they their houses in the rocks;","27":"The locusts have no king, yet go they forth all of them by bands;","28":"The spider taketh hold with her hands, and is in kings' palaces.","29":"There be three *things* which go well, yea, four are comely in going:","30":"A lion *which is* strongest among beasts, and turneth not away for","31":"A greyhound; an he goat also; and a king, against whom *there is* no rising up.","32":"If thou hast done foolishly in lifting up thyself, or if thou hast thought evil, *lay* thine hand upon thy mouth.","33":"Surely the churning of milk bringeth forth butter, and the wringing of the nose bringeth forth blood: so the forcing of wrath bringeth forth strife."}},"tsk":{"1":[{"kopje":"de man","refs":["Spr 31:1","2 Petr 1:19-21"]}],"2":[{"kopje":"ik ben","refs":["Job 42:3-6","Ps 73:22","Jes 6:5","Rom 11:25","1 Kor 3:18","1 Kor 8:2","Jak 1:5"]},{"kopje":"onverstandiger","refs":["Spr 5:12","Ps 92:7","Jer 10:14","2 Petr 2:12-16"]}],"3":[{"kopje":"niet","refs":["Amos 7:14","Amos 7:15","Matt 16:17"]},{"kopje":"en","refs":["Job 11:7-9","Matt 11:27","Joh 17:3","Rom 11:33","Ef 3:18","Ef 3:19"]},{"kopje":"de heiligen","refs":["Jes 6:3","Jes 6:10","Jes 30:11","Jes 57:15","Openb 3:7","Openb 4:8"]}],"4":[{"kopje":"Wie is opgeklommen","refs":["Deut 30:12","Joh 3:13","Rom 10:6","Ef 4:9","Ef 4:10"]},{"kopje":"Wie heeft verzameld","refs":["Job 38:4-3","Ps 104:2-35","Jes 40:12-31","Jes 53:8"]},{"kopje":"hoe is Zijn Naam","refs":["Ex 3:13-15","Ex 6:2","Ex 34:5-7","Deut 28:58"]},{"kopje":"en hoe","refs":["Gen 32:29","Richt 13:18","Ps 2:7","Jes 7:14","Jes 9:5","Jer 23:6","Matt 1:21-23","Matt 11:27","Luk 10:22"]}],"5":[{"kopje":"woord","refs":["Ps 12:7","Ps 18:31","Ps 19:9","Ps 119:140","Rom 7:12","Jak 3:17"]},{"kopje":"doorlouterd","refs":["Gen 15:1","Ps 84:12","Ps 91:2","Ps 115:9-11","Ps 144:2"]}],"6":[{"kopje":"Voeg niets toe","refs":["Deut 4:2","Deut 12:32","Openb 22:18","Openb 22:19"]},{"kopje":"en","refs":["Job 13:7-9","1 Kor 15:15"]}],"7":[{"kopje":"heb","refs":["1 Kon 3:5-9","2 Kon 2:9","Ps 27:4","Luk 10:42"]},{"kopje":"onthoud ze mij niet","refs":["Ps 21:3"]}],"8":[{"kopje":"doe die ver","refs":["Spr 21:6","Spr 22:8","Spr 23:5","Ps 62:10","Ps 62:11","Ps 119:29","Ps 119:37","Pred 1:2","Jes 5:18","Jes 59:4","Joh 2:8","Hand 14:15"]},{"kopje":"voed","refs":["Gen 28:20","Gen 48:15","Gen 48:16","Ex 16:15","Ex 16:18","Ex 16:21","Ex 16:22","Ex 16:29","Ex 16:35","Matt 6:11","Matt 6:33","Luk 11 v\" data-code=\"H657\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth?</span> what is his <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and what is his <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> if thou canst tell?","5":"Every <span class=\"wl wl-kjv\" data-code=\"H565\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H6884\">pure:</span> he is a <span class=\"wl wl-kjv\" data-code=\"H4043\">shield</span> unto them that put their trust","6":"<span class=\"wl wl-kjv\" data-code=\"H3254\">Add</span> thou not unto his <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> lest he <span class=\"wl wl-kjv\" data-code=\"H3198\">reprove</span> thee, and thou be found a liar.","7":"<span class=\"wl wl-kjv\" data-code=\"H8147\">Two</span> things have I <span class=\"wl wl-kjv\" data-code=\"H7592\">required</span> of thee; <span class=\"wl wl-kjv\" data-code=\"H4513\">deny</span> me them not before I die:","8":"Remove <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity</span> and <span class=\"wl wl-kjv\" data-code=\"H1697\">lies:</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me neither <span class=\"wl wl-kjv\" data-code=\"H7389\">poverty</span> nor <span class=\"wl wl-kjv\" data-code=\"H6239\">riches;</span> <span class=\"wl wl-kjv\" data-code=\"H2963\">feed</span> me with <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> convenient","9":"Lest I be <span class=\"wl wl-kjv\" data-code=\"H7646\">full,</span> and <span class=\"wl wl-kjv\" data-code=\"H3584\">deny</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Who is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> or lest I be <span class=\"wl wl-kjv\" data-code=\"H3423\">poor,</span> and <span class=\"wl wl-kjv\" data from among men.","15":"The <span class=\"wl wl-kjv\" data-code=\"H5936\">horseleach</span> hath <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> crying, <span class=\"wl wl-kjv\" data-code=\"H3051\">Give,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">give.</span> There are <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> things that are never <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied,</span> yea, <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> things <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> not, It is enough:","16":"The <span class=\"wl wl-kjv\" data-code=\"H7585\">grave;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6115\">barren</span> <span class=\"wl wl-kjv\" data-code=\"H7356\">womb;</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> that is not <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> and the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> that <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> not, It is enough.","17":"The <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> that <span class=\"wl wl-kjv\" data-code=\"H3932\">mocketh</span> at his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H936\">despiseth</span> to <span class=\"wl wl-kjv\" data-code=\"H3349\">obey</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> the <span class=\"wl wl-kjv\" data-code=\"H6158\">ravens</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> shall pick it <span class=\"wl wl-kjv\" data-code=\"H5365\">out,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H5404\">eagles</span> shall eat","18":"There be <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> things which are too <span class=\"wl wl-kjv\" data-code=\"H6381\">wonderful</span> for me, yea, <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> which I know","19":"The <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of an <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">air;</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of a <span class=\"wl wl-kjv\" data-code=\"H5175\">serpent</span> upon a <span class=\"wl wl-kjv\" data-code=\"H6697\">rock;</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of a <span class=\"wl wl-kjv\" data-code=\"H591\">ship</span> in the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> with a maid.","20":"Such is the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of an <span class=\"wl wl-kjv\" data-code=\"H5003\">adulterous</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman;</span> she <span class=\"wl wl-kjv\" data-code=\"H398\">eateth,</span> and <span class=\"wl wl-kjv\" data-code=\"H4229\">wipeth</span> her <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> I have <span class=\"wl wl-kjv\" data-code=\"H6466\">done</span> no wickedness.","21":"For <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> things the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H7264\">disquieted,</span> and for <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> which it <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> bear:","22":"For a <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> when he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigneth;</span> and a <span class=\"wl wl-kjv\" data-code=\"H5036\">fool</span> when he is <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> with meat;","23":"For an <span class=\"wl wl-kjv\" data-code=\"H8130\">odious</span> woman when she is <span class=\"wl wl-kjv\" data-code=\"H1166\">married;</span> and an <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> that is <span class=\"wl wl-kjv\" data-code=\"H3423\">heir</span> to her mistress.","24":"There be <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> things which are <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> but they are <span class=\"wl wl-kjv\" data-code=\"H2449\">exceeding</span> wise:","25":"The <span class=\"wl wl-kjv\" data-code=\"H5244\">ants</span> are a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> not <span class=\"wl wl-kjv\" data-code=\"H5794\">strong,</span> yet they <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> their <span class=\"wl wl-kjv\" data-code=\"H3899\">meat</span> in the summer;","26":"The <span class=\"wl wl-kjv\" data-code=\"H8227\">conies</span> are but a <span class=\"wl wl-kjv\" data-code=\"H6099\">feeble</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">folk,</span> yet <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> they their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> in the rocks;","27":"The <span class=\"wl wl-kjv\" data-code=\"H697\">locusts</span> have no <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> yet go they <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> all of them by bands;","28":"The <span class=\"wl wl-kjv\" data-code=\"H8079\">spider</span> taketh <span class=\"wl wl-kjv\" data-code=\"H8610\">hold</span> with her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and is in <span class=\"wl wl-kjv\" data-code=\"H4428\">kings'</span> palaces.","29":"There be <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> things which <span class=\"wl wl-kjv\" data-code=\"H6806\">go</span> <span class=\"wl wl-kjv\" data-code=\"H3190\">well,</span> yea, <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> are <span class=\"wl wl-kjv\" data-code=\"H2895\">comely</span> in going:","30":"A <span class=\"wl wl-kjv\" data-code=\"H3918\">lion</span> which is <span class=\"wl wl-kjv\" data-code=\"H1368\">strongest</span> among <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> and turneth not <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> for","31":"A <span class=\"wl wl-kjv\" data-code=\"H4975\">greyhound;</span> an he <span class=\"wl wl-kjv\" data-code=\"H8495\">goat</span> <span class=\"wl wl-kjv\" data-code=\"H176\">also;</span> and a <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> against whom there is no rising up.","32":"If thou hast done <span class=\"wl wl-kjv\" data-code=\"H5034\">foolishly</span> in lifting <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thyself, or if thou hast thought <span class=\"wl wl-kjv\" data-code=\"H2161\">evil,</span> lay thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon thy mouth.","33":"Surely the <span class=\"wl wl-kjv\" data-code=\"H4330\">churning</span> of <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2529\">butter,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4330\">wringing</span> of the <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> so the <span class=\"wl wl-kjv\" data-code=\"H4330\">forcing</span> of <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> strife."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Agur,","tekst":"Eenigen verstaan door dezen naam Salomo zelf, vanwege het vergaderen zijner spreuken. Want de naam komt van een woord, hetwelk betekent vergaderen en samenbrengen. Anderen verstaan dat Agur de naam is van een profeet, die de spreuken van dit hoofdstuk gesteld en aan de twee personen, hierbij genoemd toegeschreven heeft."},{"catchword":"last","tekst":"Dat is, de lering. Zie van het Hebreeuwse woord 2Ki 9:25 , waar het betekent een profetisch dreigement; maar hier is het genomen voor allerlei goed onderwijs, waarmede de mens gesticht wordt."},{"catchword":"Ithiël","tekst":"Dit houden sommigen voor namen of titels van onzen Heeren Jezus Christus, van wien gesproken wordt vs.4. Ithiël is zoveel als: God is met mij; komende ten naastenbij overeen met den naam Immanuel; Isa 7:14 . Uchal, dat is, ik zal vermogen, of kunnen. Anderen verstaan dat het namen zouden zijn van Agurs metgezellen of discipelen, of [gelijk enigen menen] zonen, die de volgende spreuken van hem zouden ontvangen hebben."}],"2":[{"catchword":"Voorwaar,","tekst":"De profeet begint zijne spreuken met ene voorrede van de kleinheid en nietigheid zijns verstands, zowel om zichzelven maat te stellen in het onderzoeken van verborgen dingen alsook om anderen te vermanen, dat zij de hoge zaken, die het verstand der mensen tebovengaan, niet nieuwsgierig moesten nazoeken, maar zich houden binnen de palen der nederige leerzaamheid."},{"catchword":"dan iemand;","tekst":"Agur, door het klein gevoel, dat hij van zichzelven heeft, maakt zich ten aanzien van hoge en diepgrondige vraagstukken geringer dan enig mens."},{"catchword":"mensenverstand;","tekst":"Te weten niet zoals het nu is, maar zoals het in Adam geschapen was."}],"3":[{"catchword":"geen wijsheid","tekst":"Te weten dat ik zo hoge dingen zou kunnen begrijpen."},{"catchword":"heiligen","tekst":"Zie Job 15:15 , en de aantekening. Anders: zou ik dan de wetenschap der heiligen weten?"}],"4":[{"catchword":"Wie is ten hemel","tekst":"Het is zoveel alsof hij zeide: Wie is de wijsheid Gods en de kracht Gods, als Gods eniggeboren zoon, de Messias, in wien alle schatten der wijsheid en kennis verborgen zijn? Vergelijk boven Pro 8:22 tot Pro 8:32 toe, en 1Co 1:24 ; Col 2:3 , en zie wijders dezelfde woorden op den Heere Christus alleen geduid Joh 3:13 ; Eph 4:9-10 ."},{"catchword":"Wie heeft","tekst":"Als God de Vader en zijn eniggeboren Zoon zonder uit te sluiten den Heiligen Geest, die van hen beiden uitgaat, en de Geest des Vaders en des Zoons is. Vergelijk Joh 1:3 ; Heb 1:3 , enz."},{"catchword":"de wateren","tekst":"Versta, de bovenwateren, dat is de wolken, die God alleen in de lucht houdt hangende, alsof zij in een kleed besloten waren, hetwelk Hij losmaakt en ontvouwt naar zijn welbehagen."},{"catchword":"de einden","tekst":"Te weten dat ze in het midden der lucht op haar eigen gewicht gevestigd staan."},{"catchword":"Zijn Naam,","tekst":"Te weten, van God zijn Vader en van zijn eeuwigen Zoon. [Vergelijk Psa 2:7 , en Psa 80:16 ; Isa 9:5 ] , wier naam, [dat is eeuwig goddelijk wezen] geen creatuur kan begrijpen. Zie Exo 3:13-14 ; Jdg 13:17-18 ."}],"5":[{"catchword":"Alle rede","tekst":"Versta, het Woord Gods, ons in de heilige Schrift geopenbaard, inhoudende de leer, die wij geloven, en de geboden, die wij nakomen moeten, zonder ons al te zeer te bekommeren met de verborgenheden, die God voor zichzelven behouden heeft en die ons verstand teboven gaan; Deu 29:29 ."},{"catchword":"een Schild","tekst":"Vergelijk Gen 15:1 , en de aantekening."}],"6":[{"catchword":"Doe niet","tekst":"Hij verbiedt niet iets af te doen van de woorden Gods, niet omdat zulks geoorloofd is; want dat is mede verboden, Deu 4:2 , en Deu 12:32 ; Rev 22:19 ; maar omdat de mensen meest tot toedoen genegen zijn, en dat onder den schijn van goede uitlegging en buitengewone heiligheid."}],"7":[{"catchword":"U begeerd,","tekst":"Namelijk, o God."},{"catchword":"eer ik sterve","tekst":"Dat is, aleer ik scheid uit dit vergankelijk leven; in hetwelk des mensen ziel den zondigen aard altijd onderworpen is en zijn lichaam de tijdelijke nooddruft behoeft."}],"8":[{"catchword":"ijdelheid","tekst":"Versta alle wangeloof, dwaling en valsheid in de leer. Alzo is het woord genomen, Lam 2:14 ; Eze 12:24 , en Eze 13:6-7 ; Zec 10:2 ."},{"catchword":"leugentaal","tekst":"Versta allerlei valsheid, huichelarij, bedrog, vleiing, uitstrijking, snoodheid en verkeerdheid in het leven; alzo Psa 4:3 , en Psa 62:5 ; boven Pro 19:22 , en Pro 23:3 ."},{"catchword":"verre van mij;","tekst":"Te weten door de verlichting en heiligmaking van uwen Geest. Dit is het eerste dat hij begeert."},{"catchword":"armoede","tekst":"Dit is de tweede begeerte."},{"catchword":"mijns bescheiden deels;","tekst":"Zie Job 23:12 ."}],"9":[{"catchword":"zat zijnde,","tekst":"Dat is, vol zijnde van de bezitting van grote middelen en dartel van het overdadig misbruik derzelve. Vergelijk Deu 31:20 , en Deu 32:15 ; Neh 9:25-26 , onder vs.22."},{"catchword":"Naam","tekst":"Te weten door ijdel misbruik deszelven, of vals eedzweren om goed te vergaderen, of dieverij te loochenen of door murmurering tegen God omdat Hij mij met armoede bezoekt."}],"10":[{"catchword":"Achterklap","tekst":"Dat is, bezwaar hem niet lichtvaardiglijk en buiten zijne schuld. Zie Psa 101:5 ."},{"catchword":"en gij","tekst":"Dat is, wraak over u van God begere, die de arme verdrukte mensen beloofd heeft voor te staan, Exo 22:23 ; maar de beschuldiging ten rechte gedaan zijnde, heeft hij niet te vrezen, boven Pro 26:2 ; maar ook zegen te verwachten, 2Sa 16:12 ."},{"catchword":"schuldig","tekst":"Dat is, niet alleen overtuigd van uwe zonde, maar ook daarover van God gestraft wordt. Vergelijk Gen 42:21 ; Lev 4:22 ; Num 5:6-7 ."}],"11":[{"catchword":"Daar is","tekst":"De profeet verhaalt hier en in vs.12-14 enige soorten van zondaren, die zeer gruwelijk zijn voor God."},{"catchword":"geslacht,","tekst":"Dat is, een aard of soort van mensen; alzo Deu 1:35 , en Deu 32:5 ; Psa 14:5 , en hier in de volgende verzen vs.12-14."},{"catchword":"niet zegent;","tekst":"Dat is, ook zal vervloeken. Hetzelfde dat verhaald was, wordt wederom vernieuwd met loochening van het tegendeel van hetgeen verhaald was. Alzo Deu 33:6 ; Isa 38:1 , enz."}],"12":[{"catchword":"in zijn ogen","tekst":"Dat is, in zijn eigen gevoelen en oordeel. Vergelijk Job 18:3 , en zie de aantekening. Versta hier de schijnheiligen en geveinsden, die zich houden zuiver van zonde te zijn, of immers zeer weinig daarmede besmet ten aanzien van anderen."},{"catchword":"drek","tekst":"Dat is, zonden, welke hier genaamd worden met een woord, hetwelk betekent de onreinheid, die door den kamergang uitgeworpen wordt. Alzo Isa 4:4 ."}],"13":[{"catchword":"welks ogen","tekst":"Versta, hovaardige mensen, die veel gevoelen van zichzelven, een ieder verachten en over het hoofd zien willen. Zie boven Pro 6:17 ."}],"14":[{"catchword":"welks","tekst":"Versta, in het algemeen, die geheel wreed en zonder medelijden zijnde, hun aanzien en vermogen misbruiken om de kleinen te vernielen; gelijk daar zijn achterklappers, faamrovers en lasteraars; idem, die met geweld de ellendigen verdrukken; mitsgaders de gierigaards, die hunnen naaste door bedriegelijken handel verdrukken of door woeker uitzuigen."},{"catchword":"tanden","tekst":"Vergelijk Psa 57:5 ."},{"catchword":"baktanden","tekst":"Zie Job 29:17 ."},{"catchword":"te verteren","tekst":"Dat is, te verslinden en te vernielen. Zie Exo 15:7 , en de aantekening, Deu 32:42 ; 2Sa 2:26 ."}],"15":[{"catchword":"De","tekst":"Door gelijkenissen wordt hier nu afgemaaid de onverzadelijke begeerlijkheid dergenen, die in vs.14 zijn voorgesteld geweest."},{"catchword":"bloedzuiger","tekst":"Versta, een dikken waterworm, anders ook echel (bloedzuiger) genaamd, die in poelen en moerassen is, hebbende een scherpe tong, in twee takken gekliefd, waarmede hij, aan een lichaam gevoegd zijnde, deszelfs vel doornijpt, en dan zoveel bloed intrekt dat hij vanzelf daarvan afvalt, zijnde de lust wel niet verzadigd, maar het lichaam zo opgevuld, dat het niet meer vermag. De gelijkenis is wel te verstaan."},{"catchword":"dochters","tekst":"Het Hebreeuwse woord betekent eigenlijk dochters, maar het is ook voor takken genomen, omdat zij als dochters zijn van den stam, waaruit zij voortkomen; Gen 49:22 . Versta hier, de gespleten tong, waarvan in de voorgaande aantekening gemeld is."},{"catchword":"Geef, geef","tekst":"Dat is, van welke elk een zegt geef, of breng, of die beide zo genoemd mogen worden, om hunne onverzadelijkheid daarmede uit te drukken."},{"catchword":"drie","tekst":"Zie boven Pro 6:16 ."}],"16":[{"catchword":"Het graf,","tekst":"Vergelijk boven Pro 1:12 , en Pro 27:20 ."},{"catchword":"de gesloten","tekst":"Hebreeuws, de sluitmoeder, baarmoeder; dat is de gesloten en onvruchtbare baarmoeder. Zie Gen 20:18 . De Israëlietische vrouwen waren in dien tijd bovenmate begerig om kinderen te krijgen. Zie Gen 39:1 , Gen 39:23 , met de aantekening."},{"catchword":"aarde,","tekst":"Te weten de dorre en zandige aarde. Want hoewel zij zeer bevochtigd wordt, zo wordt zij nochtans in korten tijd weder zo dorstig, dat zij niet schijnt bewaterd geweest te zijn."},{"catchword":"vuur","tekst":"Dat nimmermeer moede is van branden, hoeveel brandbare stof ook daarin geworpen wordt."},{"catchword":"zegt niet","tekst":"Vergelijk Job 14:7 , en de aantekening."}],"17":[{"catchword":"oog,","tekst":"Het oog wordt voornamelijk in deze straffen vermeld, omdat zich daarin de tekenen van spot, spijt, verachting en kwaadwilligheid meest openbaren."},{"catchword":"raven","tekst":"Dat is, die zich omtrent de beken, rivieren en waterstomen ophouden, om aldaar te drinken of haar aas te zoeken van de dode lichamen en anderen dingen, die daar dikwijls in drijven. Anders: de raven des dals, of der vallei; hoedanig daarna was het dal Hinnoms, waar somtijds veel dode lichamen en andere vuiligheden lagen, 2Ki 23:10 . De zin is dat de moedwillige kinderen, die hunne ouders bespotten, eindelijk aan een galg geraken, of onbegraven den vogels tot een aas plegen voorgeworpen te worden."}],"19":[{"catchword":"weg eens","tekst":"Dat is, de manier van doen. Zie boven Pro 6:6 ."},{"catchword":"arends","tekst":"Deze manier van doen is wonderbaar, omdat hij tezamen zeer snellijk en hoog opvliegt. Anders, omdat hij met zijn vliegen de lucht scheurende en doorsnijdende, nochtans daarin geen spoor of litteken nalaat."},{"catchword":"weg ener slang","tekst":"Die wonderlijk is, omdat zij zonder voeten haastiglijk kruipt en klimt op gladde rotsen. Anders, omdat zij op de rotsen, waarop zij kruipt, geen groeve maakt en geen slijm achter zich laat, gelijk de waterslangen; noch pluimen, gelijk de vogels, noch mist, gelijk meest alle andere gedierten."},{"catchword":"de weg van een schip","tekst":"Die wonderlijk is, omdat een schip in het midden der zee, nu in een diepen afgrond nederdaalt en daarna weder opklimt, zonder om te vallen en te verzinken. Anders, omdat het wel in een stil water een streek achter zich nalaat, maar die haastiglijk verdwijnt, en ook zo niet kan bespeurd worden in het hart van de zee, uit oorzaak der grote baren en golven, die de schepen op en nederdrijven."},{"catchword":"in het hart","tekst":"Dat is, in het midden der zee. Zie boven Pro 23:34 ."},{"catchword":"weg eens mans","tekst":"Die wonderbaar is, zowel om de zeldzame verbinding zijns harten met de maagd, alsook om de wonderlijke middelen, die hij gebruikt om haar te genieten."}],"20":[{"catchword":"Alzo","tekst":"Dat is, zo wonderbaar of verborgen als de vier voorverhaalde dingen, te weten om de grote boosheid en behendigheid, die zij weet te gebruiken, zowel in het plegen van hare onkuischheid als in het verontschuldigen en bedekken derzelve."},{"catchword":"zij eet","tekst":"Zij geniet de onkuische bijslaping. Vergelijk boven Pro 9:17 , en Pro 20:17 ."},{"catchword":"wist haar mond,","tekst":"Dat is, zij houdt zich van geen kwaad te weten, alsof zij ene van de allereerbaarste was."}],"21":[{"catchword":"drie dingen","tekst":"Vergelijk boven Pro 6:16 ."},{"catchword":"de aarde,","tekst":"Dat is, de inwoners der aarde. Vergelijk Gen 41:30 , en de aantekening."}],"22":[{"catchword":"hij regeert;","tekst":"Dat is, een aanzienlijken staat en waardig ambt bedient, waardoor hij grote macht krijgt, welke hij misbruikt tot verdrukking van anderen en zijn eigen verderf."},{"catchword":"een dwaas,","tekst":"Zie 1Sa 25:25 ."},{"catchword":"hij van","tekst":"Zie boven vs.9."},{"catchword":"brood","tekst":"Dat is, allerlei goed, hetwelk dient tot onderhouding van het tijdelijke leven. Zie boven Pro 4:17 ."}],"23":[{"catchword":"hatelijke vrouw,","tekst":"Versta, ene vrouw, die van een ieder gehaat wordt en waardig is gehaat te worden, om haar kwade manieren en boze handelingen. Want getrouwd zijnde, is zij onverdragelijk voor haar man, kinderen, dienstvolk, geburen, enz. Sommigen verstaan door deze hatelijke, de vrouw van een man, die haar onder andere vrouwen, welke hij naar het gebruik van dien tijd tevens had, eerst minst, maar daarna meest beminde, waardoor zij aan hare metgezellinnen onverdragelijk werd."},{"catchword":"zij erfgenaam","tekst":"Dat is, als zij met haren meester trouwt na het overlijden van hare vrouw. Hebreeuws, als zij hare vrouw erft. Vergelijk Jdg 11:23-24 ."}],"24":[{"catchword":"zijn wijs,","tekst":"Dat is, zijn vernuftig, hetwelk zij bewijzen door enige werken, die zij uit nature doen, waardoor de mensen behoren opgewekt te worden tot verscheidene deugden."},{"catchword":"met wijsheid","tekst":"Hebreeuws, wijs gemaakt; dat is met wijsheid voorzien en begaafd, te weten van God, die dezelve door het werk der schepping in hunne natuur ingestort heeft."}],"25":[{"catchword":"een onsterk volk;","tekst":"Dat is, een soort van onredelijke dieren. Alzo in vs.26. Aangaande de toeëigening van dit exempel gepast op de mensen, zie boven Pro 6:6 , enz."},{"catchword":"spijs","tekst":"Hebreeuws, brood."}],"26":[{"catchword":"De konijnen","tekst":"Zie Lev 11:5 , en van hetzelfde gedierte, Deu 14:7 , en Psa 104:18 . Anders: bergmuizen of beermuizen, omdat het konijn hier te lande in de steenrotsen zijne holen niet heeft."},{"catchword":"huis","tekst":"Dat is, hol, of nest. Vergelijk Job 8:14 ; Psa 84:4 , en Psa 104:17 ."},{"catchword":"rotssteen","tekst":"Te weten met aarde en zand vermengd."}],"27":[{"catchword":"zich verdelende","tekst":"Dat is, gelijk in slagorde te velde trekkende, opdat zij, hunne benden en kracht bijeenhoudende, te vreeslijker zijn zouden en van hunne weide niet afgedreven worden. Anders: tezamen vergaderd, of ineen verzameld; of zij gaan alle schietende, uit, of alle [gelijk] een pijl, of alles doorsnijdende; dat is vermalende, afetende."}],"28":[{"catchword":"spinnekop","tekst":"Anders, sim."},{"catchword":"de handen,","tekst":"Versta, hare poten, die zij gebruikt niet alleen om daarop te gaan, maar ook om daarmede haar net te maken en daarin vliegen en muggen te vangen."},{"catchword":"in de paleizen","tekst":"Te weten waar haar meeste gevaar is om verjaagd of gedood te worden, en meerdere vrees om haar werk te doen."}],"29":[{"catchword":"Deze drie","tekst":"Na het verhaal van vier kleine, zwakke en vreesachtige creaturen, worden hier nu voorgesteld vier grote, sterke en onversaagde schepselen, ons vermanende tot kloekheid in onze beroeping."},{"catchword":"ja,","tekst":"Vergelijk deze manier van spreken met Job 5:19 , en de aantekening."}],"30":[{"catchword":"oude leeuw","tekst":"Het woord in het oorspronkelijke betekent eigenlijk een leeuw, die bij den groten ouderdom ook grote moedigheid heeft. Vergelijk boven Pro 5:11 ."},{"catchword":"geweldig","tekst":"Dat is, de geweldigste der gedierten. Alzo Jos 14:15 , groot onder de Enakim; dat is, de grootste der Enakim. Idem, Son 1:8 , schone onder de vrouwen; dat is, de schoonste der vrouwen."},{"catchword":"voor niemand","tekst":"Hebreeuws, van aller, of van al de aangezichten; dat is, voor niemand zal wederkeren, te weten noch voor mensen, noch voor beesten, die hem tegenkomen."}],"31":[{"catchword":"windhond","tekst":"Het woord heeft zijn oorsprong van het Hebreeuwse zarah; dat is, spreiden, of, gelijk anderen menen, van het Chaldeeuwse woord zeraz; dat is, opschorten, opschikken; en daarom wordt daarbij verstaan een dier, dat van zichzelf moedig, wel in het lijf en op de benen is en vaardig tot zijn werk, hetwelk anderen menen op het paard wel te passen; zie Job 39:22 . Anderen vertalen het een haan, of luipaard van goede lenden."},{"catchword":"bok;","tekst":"Die zeer trots, moedig en met een opgeheven hoofd gaat voor zijne kudde. Het Griekse rijk, hetwelk het Perzische tenondergebracht heeft, wordt bij een bok vergeleken; Dan 8:3 , enz."}],"32":[{"catchword":"te verheffen,","tekst":"Te weten tot gramschap, waarvan vs.33, hetwelk aan vs.32 hangt, gesproken wordt."},{"catchword":"hand","tekst":"Dat is, bedwing u en wacht u te zeggen, veel minder te doen, het kwaad dat gij voorhadt, en verontschuldig uw voorgaanden toorn niet; zie Job 21:5 ."}],"33":[{"catchword":"drukking der melk","tekst":"Dat is, de kerning."},{"catchword":"drukking van den neus","tekst":"Dat is, de harde snuiting."},{"catchword":"drukking des toorns","tekst":"Dat is, de ontsteking des toorns, te weten zowel desgenen, die iemand door toorn verwekt, als desgenen, die tot toorn verwekt wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The words of Agur, [Some do understand by this name, Solomon himself, by reason of the gathering of his Proverbs all together into one volume or book; for the name Agur cometh from a word, that signifieth gathering and bringing together. Others conceive, that Agur is the name of a Prophet, that make the Proverbs of this chapter, inscribed and dedicated them to the two persons that are here named or mentioned] the son of Jake, a burden; [that is, the doctrine. See of the Hebrew word, 2 Kings 9.on verse 25. Where it signifieth a prophetical threatening; but it is here taken for all manner of good instruction, whereby a man is edified] the man speaketh unto Ithiel, unto Ithiel and Uchal. [some conceive These two (Ithiel and Uchal) to be names and titles of our blessed Saviour, the Lord Jesus Christ, of whom mention is made in the fourth verse: Ithiel is as much, as God is with me, agreeing very neer with the name, Immanuel, Isa 7:14. Uchal signifieth, I shall prevail, or be able. Others conceivce them to be the names of Agurs companions, or scholars, or (as some are of opinion) sons, who received the insuing proverbs at his hand, or of him.]"}],"2":[{"catchword":null,"tekst":"Verily I am more brutish then any man; and I have no human understanding: [The prophet beginneth his Proverbs with a presence concerning the meanness, and (as I may say) nothingness of his understanding and apprehension, both to set bounds and limits unto himself, in the searching and diving into secret and hidden things, and also to instruct and teach others, that they ought not curiously to pry into high and deep matters, that exceed and surmount the capacity of man, but to keep themselves within the bounds of humble docibility] then any man, [Agur, by reason of the mean conceit that he hath himself, maketh himself, in regard of the high, transparent, mysterious quetions, viler and baser then any man.] And I have no human understanding, [or, I have not the understanding of a man. To wit, not as it is now since the fall, but as it was at first, when created in Adam.]"}],"3":[{"catchword":null,"tekst":"Neither have I learned wisdom, [To wit, that I should be able to apprehend things that are so high] nor known the knowledge of the holy (ones.) [Of the word holy (ones) or Saints, see Job 15:15. and the Annotat. Oth. Should I then know the knowledge of the holy (ones?)"}],"4":[{"catchword":null,"tekst":"Who hath ascended up into heaven, and descendeth? [It is as much as if he had said; Who is the wisdom of God, and the power of God, as the onely begotten Son of God, the Messias, in whom are hid all the treasures of wisdom and knowledge? Compare above, chap.8. from vers.22. to verse 32. And 1 Cor.1.24. Cor.2.3. And see further these very words applied to our Saviour Christ, Joh.3.13. Eph.4.9,10.] who hath gathered the wind in his fists? [as God the father, and his onely begotten son doth, without excluding the Holy Ghost, who proceedeth from them both, and is the spirit of the Father and of the Son. Compare, Joh 1:3. Heb 1:3. &c.] who hath bound the waters in a garment? [Meaning, the superior waters, or the waters that are above; that is, the clouds, which God alone keepeth and holdeth hanging in the air, as if they were bound and shut up in a garment, which he looseneth and unfoldeth at his pleasure] who hath established all the ends of the earth? [to wit, that they are founded in the midst of the air, upon their own weight. Compare, Job 38:4. Psalm.104.3. Isa 40:12.] how is his name, and how, if thou know it, his sons name? [to wit, God the Fathers name, and his eternal Sons name. Compare, Psal.2.7. and 80.16. Isa 9:5. whose name (that is, whose eternal divine essence) no creature is able to comprehend, see Exod.3,13,14. Judg.13.17,18.]"}],"5":[{"catchword":null,"tekst":"All (or every) saying of God [Meaning the word of God revealed unto us in in Scripture, containing in it the doctrine which we are to believe, and the commandments which we ought to keep and perform, without troubling our selves too much with the secrets which God hath kept for himself alone, and which excel and transcend our capacity and apprehension, Deut.29.29.] is purified: [compare, Psa 12:7. and 18.31. and 19.9. and 119.40.] he is a shield [compare, Gen 15:1. and the Annotat.] unto them that trust in him."}],"6":[{"catchword":null,"tekst":"Add not unto his words, [Compare, Deut.4.2. and 12.32. Rev 22:19.] left he reprove thee, and thou be found lying. [he forbiddeth not to diminish ought from the words of God, not because it is law to do so, for that is likewise firbidden, Deut.4.2. and 12.32. Revel.22.19. but because men are most prone and inclined to adding; and that under a colour of rightly interpreting and expounding the word, and also of singular and eminent holiness.]"}],"7":[{"catchword":null,"tekst":"Two things have I required of thee; [Namely, O God] with-hold them not from me, before I die. [that is, before I depart out of this transitory life: wherein mans soul is always subject to a sinful nature and condition, and his body hath always need of temporal necessaries to support it.]"}],"8":[{"catchword":null,"tekst":"Vanity, [Meaning all infidently, error and falsehood in doctrine. So is the word taken, Lament.2.14. Eze 12:24. and 13.6,7. Zach.10.2.] and lying [meaning all manner of falsehood, hypocrisy, deceit, flattering, circumvention, lewdness and perversness in life, so Psal.4.3. and 62.5. above, chap.19.22. and 23.3.] remove far from me, [to wit, by the illumination and sanctification of thy spirit. This is the first thing that he desireth or requireth at the hand of God] give me neither poverty nor riches, [this is his second request] feed me with the bread of mine appointed distinct portion. [see Job 23.on v.12.]"}],"9":[{"catchword":null,"tekst":"Lest I being full, should then deny (thee,) and say, who is the LORD? [That is, being full in regard of the possession of great riches, or of a great estate; and wanton, by reason of the immoderate and excessive abuse of them. Compare, Deut.31.20. and 32.15. Neh.925. 26. Below, v.22.] or lest I being improverished, should then steal, and take hold of the Name of my God. [to wit, by vain and idle abuse of it, or by perjury and taking a false oath, to get wealth, or by denying theft committed by me, or by murmuring against God for visiting me with poverty.]"}],"10":[{"catchword":null,"tekst":"Accuse not a servant unto his master, [That is, accuse him not rashly, and wrongfully, without any fault at all by him committed, see Psal.101. on verse 5.] left he curse thee, [that is, beg vengeance of God upon thee, who hath promised to help and defend the poor that are oppressed and afflicted, Exo 22:23. but when the accusation is well grounded and justly made, a man needeth not to fear any curse at all, above, chap.26.2. but may on the contrary expect a blessing, 2 Sam.16.12.] and thou become guilty. [That is, be not onely convinced of thy sin, but also be punished of God for it. Compare, Gen 41:21. Lev.4.22. Num 5:6,7.]"}],"11":[{"catchword":null,"tekst":"There is a generation [That is, a sort or kind of men, so Deut.1.35. and 32.5. Psal.14.5. and here in the following 12,13,14 verse] that curseth their father, [the prophet relateth here, and in the three following verses, some sort of sinners that are very odious and abominable in the sight of God] and doth not bless their mother. [that is, will also curse her. That which was before related, again repeated, with a denial of the contrary unto that which was related and asserted, so Deut.33.6. Isa 38:1, &c.]"}],"12":[{"catchword":null,"tekst":"A generation that is poor in their (own) eyes [That is, in their own conceit and judgement. Compare Job 18:3. and see the Annotat. Understand here by these, all hypocrites, and such as seem holy in outward shew and appearance, who count themselves to be clean and pure from sin, (or at least very little defiled there with) in comparison of others] and is not washed from their dung. [that is sins, which are here called by a word which signifieth filth or excrements, which are voided by going to stool, so, Isa 4:4.]"}],"13":[{"catchword":null,"tekst":"A generation, whose eyes are lofty, and whose eyelids are lifted up. [Meaning, proud men, that have a high conceit of themselves, despise every one, and desire to look over all men heads, see above, chap.6.on verse.12.]"}],"14":[{"catchword":null,"tekst":"A generation, whose teeth are swords, [Compare Psal.57.5.] and whose great teeth [see Job 29.on v.17.] (are) knives, to consume [that is, to devour and to destroy, see Exo 15:7. and the Annotat. Deut.32.42.2. Sam.2.26.] the miserable from off the earth, and the needy from among men. [understand in general, those that being extream cruel, and without any pity or compassion at all, abuse their power and authority, to destroy those that are poor and mean in the world: as there are such as are back-biters, defames, or takes away of others good name and repute, and slanderers: also those that violently oppress and wrong the poor, as likewise covetous persons, that wrong and oppress their neighbour by coarsening and fraudulent, or suck them dry by usury and extortion.]"}],"15":[{"catchword":null,"tekst":"The blood-sucker [Meaning a thick water-worm, otherwise called an horse-leach, that liveth in ponds, or pools, and moors, having a sharp tongue cloven in two branches, wherewith being applied to the body, she pincheth through the skin of it, and then sucketh in so much blood, as that she falleth off from the body of her own accord, her appetite being not fully satisfied, but her body so filled and puffed up with blood, that it can hold no more. The comparison is well to be heeded] hath two daughters, [the Hebrew word signifieth properly daughters, but it is also taken for branches or springs, because they are as daughters of the stock from whence they issue, Gen 49:22. Understand here the split or cloven tongue, whereof mention was made in the former Annotat.] Give, Give [that is, whereof every one sait. Give, or Bring, or both of them may be so called, to express their insatiability thereby] These three things [see above, chap.6.on verse 16.] are not satisfied: (yea) four [see the same place] say not, It is enough."}],"16":[{"catchword":null,"tekst":"The grave, [Compare above chap.1.12. and 27.20.] the closed womb, [Heb. The closing up of the womb: that is, the closed and barren womb, see Gen.20.on vers.18. The Israelitish women were in those times exceeding (yea, beyond measure) desirous to have children, see Gen 30:1,23. With the Annotat.] the earth, (that) is not satisfied with water: [to wit, the dry and sandy earth: for although it be much moistened, yet in a short time it becometh again so dry and thirsty, that it seemeth not to have been watered at all] and the fire, [which is never weary of burning, though never so much combustible matter be thrown into it] saith not, it is enough. [Compare, Job 14 7. And the Annotat.]"}],"17":[{"catchword":null,"tekst":"The eye that mocketh (his) Father, or despiseth the obedience of (his) Mother, the ravens of the brook [That is, the ravens about brooks, rivers and streams of water, to drink there, or to seek their prey from dead bodies or carcases, and other things, and other things, that do often drive or float in them. Oth. The ravens of the valley, such as afterwards was the valley of Hinnom, where there lay sometimes dead carcases, and other filthy and noisome things, 2 Kings 23.10.] shall pick it out, and the Eagles young ones shall eat it. [The meaning is, that stubborn and rebellious children that mock and deride their parents, do at last come to the gallows, to unburied are wont to be cast before birds, as a prey to be eaten and devoured by them. The eyes is specially mentioned in his punishment, because the tokens of mocking, despite, contempt and stubbornness are for the most part seen in the eye.]"}],"18":[{"catchword":null,"tekst":"These three things are too wonderful for me: yea four, which I know not."}],"19":[{"catchword":null,"tekst":"The way [That is, the manner of acting. See above chap.6.on v.6.] of an eagle in the heaven, [Her way of acting is wonderful, because she flieth both exceeding swift and exceeding high all at once. Oth. Because she with her flying rendereth and cutteth the air asunder, and yet leaveth no mark or print to be seen in it] the way of a serpent upon a rock: [which is wonderful, because without feet she creepeth speedily, and climbeth up into slippery rocks. Oth. Because in the rock, upon which she creepeth, she maketh no furrow, nor leaveth any slime behind her, as water-snakes do, nor feathers, as birds do, nor dung, as almost all other creatures do] the way of a ship in the heart of the Sea, [that is, in the midst of the Sea, see above chap.23.on ver.34. This is likewise wonderful, because a ship in the midst of the sea now goeth down into a deep profundity, as into the very bottom of the sea, anon riseth up again, and mounteth aloft as if it would tear the very sky, without tossing upside down and drowning. Oth. Because in a still and calm water it leaveth a kind of print and furrow behind it, but which suddenly vanisheth, neither can it so be discerned in the midst of the sea, by reason of the waves up waves and billows, that drive and carry the waves up and down] and the way of a man with a maid. [which is wonderful, both in the respect of the rare and wonderful briding and uniting of his heart with maid, and also in respect of the wonderful means used by him for the getting and enjoying of her.]"}],"20":[{"catchword":null,"tekst":"So is the way of an adulterous woman: [That is, so wonderful or hidden, as the four afore-recited things are: To wit, by reason of the great wickedness and vileness, which she knoweth how to use, as well in the practising of her unclean and immodest actions, as in the excusing and hiding of them, when she hath done; as followeth in the text] she eateth [that is, she enjoyeth the unchaste carnal copulation. Compare above chap.9.17. and 20.17.] and wipeth her mouth and saith, I have wrought no iniquity. [that is, she feigneth to know of no wickedness at all, as if she were one of the honestest women in the world.]"}],"21":[{"catchword":null,"tekst":"For three things [Compare above chap.6.on v.16.] the Earth [that is, the inhabitants of the Earth. Compare Gen 41:30. and the annotate.] is disquieted: yea for you four (which) it cannot bear."}],"22":[{"catchword":null,"tekst":"For a servant, when he reigneth: [That is, is in place of authority, and advanced to high dignity, whereby he obtaineth great powers which he abuseth to the oppression of others, and to his own destruction] and a fool [see 1 Sam.25.on v.25.] when he is satisfied [see above on ver.9.] with bread. [that is, all manner of good things tending to the preservation and upholding of his temporal life, see above chap.4.on v.17.]"}],"23":[{"catchword":null,"tekst":"For an hateful (woman) when she is married; [Meaning a woman that is hated of every body, and deserveth to be hated for her bad qualities and ill conditions: for being married she is intolerable to her husband, children, servants, neighbours, etc. Some understand by this hated woman, the wife of an husband, who among other wives, (which he had all at once, according to the custome of those times) loved her as the first least, but afterwards most of all, whereby she become odious and intolerable unto her companions and corrivals] and an hand-maid, when she is heir of her mistress. [that is, when she marrieth her master after her mistresses decease. Hebr. When she inheriteth her mistress. Compare Judg.11.23,24.]"}],"24":[{"catchword":null,"tekst":"These four (things) are of the least (things) of the Earth: but they are wise, [That is, are prudent and intelligent, which they manifest and discover by certain works, which they do by the dictate and instinct of nature, whereby men ought to be provoked and stirred up to the practising of sundry vertues] well furnished with wisdom; [Hebr. Made wise: that is, furnished and endued with wisdom: to wit, by God, who by the work of creation infused the same into their natures.]"}],"25":[{"catchword":null,"tekst":"The Arts are a weak people: [That is, a kind of unreasonable creatures. So in the next verse] yet they prepare their meat [Hebr. Bread] in the summer. [concerning the application of this example unto man, see above chap.6.6, etc.]"}],"26":[{"catchword":null,"tekst":"The Conies [See Lev.11.on v.5. and of the same creature, Deut.14.7. and Psa 104:18. Oth. Mountain-mice, or bear-mice, because the cony in those countries hath not her holes or burrows in the rocks] are a feeble folk, yet make their house [or hole, or nest, or burrow. Compare Job 8:14. Psa 84:4. and 104.17.] in the rock. [to wit, mixed with earth and sand.]"}],"27":[{"catchword":null,"tekst":"The Grass-hoppers have no King: yet go yet they all forth, dividing themselves (into heaps.) [That is, as it were in battle array marching into the field, that so, keeping their bands and force together, they might be the more dreadful and terrible, and not so easily driven away from their pasture. Oth. Gathered together, or assembled into one, or they go all forth shooting, to all (as) an arrow, or cutting all asunder; that is, devouring, eating down all.]"}],"28":[{"catchword":null,"tekst":"The spider [Oth. The Ape] taketh hold with (her) hands [meaning her paws which she maketh use of, not only for to go upon them, but also to make her web withal, for to catch flies and ganats in] and is in Kings palaces. [to wit, where she is in most danger of being hunted away and killed, and in more fear for to do her work.]"}],"29":[{"catchword":null,"tekst":"These three make a good pace, yea there be four [Compare this phrase with Job 5:19. and the annotate.] that make a good going. [After the recital of four small, weak and fearful creatures, there are here represented and held forth four great, strong and undaunted creatures, which do exhort and stir us up courage and boldness in our calling.]"}],"30":[{"catchword":null,"tekst":"The old Lion [The word in the Original signifieth properly a Lion, who with his great age, hath also great boldness and courage. Compare above chap.5.on v.11.] strong among the beasts. [that is, the strongest of beasts. So Jos.14.15. Great among the Anakims; that is, the greatest of the Anakims. Item Cant.1.8. fair among women; that is, the fairest of women] who will not turn away for any, to wit, neither for man nor beast, that might come against him.]"}],"31":[{"catchword":null,"tekst":"A Grey-hound of good loins: [The word rendered here Grey-hound, etc. Hath its original from the Hebrew zeraz; that is, to spread: or as others conceive from the Chalde zeraz; that is, to spread: or as others conceive from the Chalde zeraz; that is, to tuck up, or dress up; and therefore there is meant by it a creature, that is in it self stout and courageous, well set in regard of his body, and strong and lusty in his feet, and ready for the work he is set about, which others conceive to sit the horse well. See Job 39:22. Others translate it a cock, or leopard of good liones, or an he-goat; [who goeth very proudly and stately with an exalted head (or an head lifted up) before his flock. The Grecian Empire, which subdued the Persian, is resembled to an he-goat, Dan.8.3, etc.] and a King, who is not to be resisted."}],"32":[{"catchword":null,"tekst":"If thou hast done foolishly, in lifting up thy self, [To wit, unto wrath, whereof mention is made in the following verse, which dependeth on this verse] and if thou hast thought evil; (lay) thine hand upon (thy) mouth. [that is, turn thy self and take heed of speaking, much less of doing the evil which thou intendest, and excuse not thy former wrath, see Job 21.on v.5.]"}],"33":[{"catchword":null,"tekst":"For the pressing of milk [That is, the churning of milk] bringeth forth butter; and the pressing of the nose [that is, the hard blowing of the nose] bringeth forth blood; and the pressing of wrath [that is, the kindling of wrath; to wit, as well his, that by wrath provoketh another unto wrath, as his, that is provoked unto wrath] bringeth forth strife."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
function bijbeluitlegHtml(n) {

        if (kortCw) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';

  }

  }
  if (tab === 'verwijzingen') {

    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }

    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

  const o = D.onderwerpen[n];

    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

    .then(r => r.ok ? r.json() : null).catch(() => null);

}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer

  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
