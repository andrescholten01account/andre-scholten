en;","7":"Want zoals hij bedacht heeft in zijn ziel, zo is hij; hij zal tegen u zeggen: Eet en drink! maar zijn hart is niet met u.","8":"Uw hap, die u gegeten hebt, zult u uitspuwen; en u zult uw liefelijke woorden verspild hebben.","9":"Spreek niet ten aanhoren van een dwaas, want hij zou het verstand van uw woorden verachten.","10":"Verzet de oude grenspalen niet; en kom niet op de akkers van de wezen;","11":"Want hun Verlosser is sterk; Die zal hun rechtszaak tegen u voeren.","12":"Richt uw hart op de tucht, en uw oren op de woorden van kennis.","13":"Onthoud een jongen de tucht niet; als u hem met de roede slaat, zal hij niet sterven.","14":"U zult hem met de roede slaan, en zijn ziel redden van het dodenrijk.","15":"Mijn zoon! als uw hart wijs is, zal mijn hart zich verblijden, ja, ik zelf.","16":"En mijn nieren zullen opspringen van vreugde, als uw lippen spreken wat recht is.","17":"Laat uw hart niet jaloers zijn op de zondaars; maar wees de hele dag in de vreze van de HEERE.","18":"Want zeker, er is een beloning; en uw verwachting zal niet afgesneden worden.","19":"Hoor toch, mijn zoon! en word wijs, en richt uw hart op de weg.","20":"Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;","21":"Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.","22":"Hoor naar uw vader, die u verwekt heeft; en veracht uw moeder niet, als zij oud geworden is.","23":"Koop de waarheid, en verkoop ze niet, alsook wijsheid, en tucht, en verstand.","24":"De vader van de rechtvaardige zal zich zeer verheugen; en wie een wijze zoon verwekt, zal zich over hem verblijden.","25":"Laat uw vader zich verblijden, ook uw moeder; en laat zij zich verheugen, die u gebaard heeft.","26":"Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen behartigen.","27":"Want een hoer is een diepe gracht, en een vreemde vrouw is een nauwe put.","28":"Ook loert zij als een rover; en zij vermeerdert de trouwelozen onder de mensen.","29":"Bij wie is wee? bij wie ach en wee? bij wie geruzie? bij wie geklaag? bij wie wonden zonder oorzaak? bij wie roodheid van de ogen?","30":"Bij hen die bij de wijn blijven hangen; bij hen die komen om gemengde drank op te zoeken.","31":"Zie niet naar de wijn, als hij zich rood vertoont, als hij in de beker zijn kleur geeft, als hij vlot naar binnen glijdt;","32":"Aan zijn einde zal hij bijten als een slang, en steken als een adder.","33":"Uw ogen zullen naar vreemde vrouwen zien, en uw hart zal verkeerde dingen spreken.","34":"En u zult zijn als iemand die in het hart van de zee ligt te slapen; en als iemand die boven op de mast ligt te slapen.","35":"Men heeft mij geslagen, zult u zeggen, ik ben er niet ziek van geweest; men heeft mij gebeukt, ik heb het niet gevoeld; wanneer zal ik ontwaken? Ik zal het nog meer opzoeken!"},"SV":{"1":"Als gij aangezeten zult zijn om met een heerser te eten, zo zult gij scherpelijk letten op dengene, die voor uw aangezicht is.","2":"En zet een mes aan uw keel, indien gij een gulzig mens zijt;","3":"Laat u niet gelusten zijner smakelijke spijzen, want het is een leugenachtig brood.","4":"Vermoei u niet om rijk te worden; sta af van uw vernuft.","5":"Zult gij uw ogen laten vliegen op hetgeen niets is? Want het zal zich gewisselijk vleugelen maken gelijk een arend, die naar den hemel vliegt .","6":"Eet het brood niet desgenen, die boos is van oog, en wees niet belust op zijn smakelijke spijzen;","7":"Want gelijk hij bedacht heeft in zijn ziel, alzo zal hij tot u zeggen: Eet en drink! maar zijn hart is niet met u;","8":"Uw bete, die gij gegeten hebt, zoudt gij uitspuwen; en gij zoudt uw liefelijke woorden verderven.","9":"Spreek niet voor het oor van een zot, want hij zou het verstand uwer woorden verachten.","10":"Zet de oude palen niet terug; en kom op de akkers der wezen niet;","11":"Want hun Verlosser is sterk; Die zal hun twistzaak tegen u twisten.","12":"Begeef uw hart tot de tucht, en uw oren tot de redenen der wetenschap.","13":"Weer de tucht van den jongen niet; als gij hem met de roede zult slaan, zal hij niet sterven.","14":"Gij zult hem met de roede slaan, en zijn ziel van de hel redden.","15":"Mijn zoon! zo uw hart wijs is, mijn hart zal blijde zijn, ja, ik.","16":"En mijn nieren zullen van vreugde opspringen, als uw lippen billijkheden spreken zullen.","17":"Uw hart zij niet nijdig over de zondaren; maar zijt te allen dage in de vreze des HEEREN.","18":"Want zekerlijk, er is een beloning; en uw verwachting zal niet afgesneden worden.","19":"Hoor gij, mijn zoon! en word wijs, en richt uw hart op den weg.","20":"Zijt niet onder de wijnzuipers, noch onder de vleesvreters;","21":"Want een zuiper en vraat zal arm worden; en de sluimering doet verscheurde klederen dragen.","22":"Hoor naar uw vader, die u gewonnen heeft; en veracht uw moeder niet, als zij oud geworden is.","23":"Koop de waarheid, en verkoop ze niet, *mitsgaders* wijsheid, en tucht, en verstand.","24":"De vader des rechtvaardigen zal zich zeer verheugen; en die een wijzen *zoon* gewint, zal zich over hem verblijden.","25":"Laat uw vader zich verblijden, ook uw moeder; en laat haar zich verheugen, die u gebaard heeft.","26":"Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen bewaren.","27":"Want een hoer is een diepe gracht, en een vreemde vrouw is een enge put.","28":"Ook loert zij als een rover; en zij vermenigvuldigt de trouwelozen onder de mensen.","29":"Bij wien is wee? bij wien och arme? bij wien gekijf? bij wien het beklag? bij wien wonden zonder oorzaak? bij wien de roodheid der ogen?","30":"Bij degenen, die bij den wijn vertoeven; bij degenen, die komen om gemengden drank na te zoeken.","31":"Zie den wijn niet aan, als hij zich rood vertoont, als hij in den beker zijn verve geeft, *als* hij recht opgaat;","32":"*In* zijn einde zal hij als een slang bijten, en steken als een adder.","33":"Uw ogen zullen naar vreemde vrouwen zien, en uw hart zal verkeerdheden spreken.","34":"En gij zult zijn, gelijk een, die in het hart van de zee slaapt; en gelijk een, die in het opperste van den mast slaapt.","35":"Men heeft mij geslagen, *zult* *gij* *zeggen*, ik ben niet ziek geweest; men heeft mij gebeukt, ik heb het niet gevoeld; wanneer zal ik opwaken? Ik zal hem nog meer zoeken!"},"KJV":{"1":"When thou sittest to eat with a ruler, consider diligently what *is* before","2":"And put a knife to thy throat, if thou *be* a man given to appetite.","3":"Be not desirous of his dainties: for they *are* deceitful meat.","4":"Labour not to be rich: cease from thine own wisdom.","5":"Wilt thou set thine eyes upon that which is not? for *riches* certainly make themselves wings; they fly away as an eagle toward heaven.","6":"Eat thou not the bread of *him that hath* an evil eye, neither desire thou his dainty meats:","7":"For as he thinketh in his heart, so *is* he: Eat and drink, saith he to thee; but his heart","8":"The morsel *which* thou hast eaten shalt thou vomit up, and lose thy sweet words.","9":"Speak not in the ears of a fool: for he will despise the wisdom of thy words.","10":"Remove not the old landmark; and enter not into the fields of the fatherless:","11":"For their redeemer *is* mighty; he shall plead their cause","12":"Apply thine heart unto instruction, and thine ears to the words of knowledge.","13":"Withhold not correction from the child: for *if* thou beatest him with the rod, he shall not die.","14":"Thou shalt beat him with the rod, and shalt deliver his soul from hell.","15":"My son, if thine heart be wise, my heart shall rejoice, even mine.","16":"Yea, my reins shall rejoice, when thy lips speak right things.","17":"Let not thine heart envy sinners: but *be thou* in the fear of the LORD all the day","18":"For surely there is an end; and thine expectation shall not be cut off.","19":"Hear thou, my son, and be wise, and guide thine heart in the way.","20":"Be not among winebibbers; among riotous eaters of flesh:","21":"For the drunkard and the glutton shall come to poverty: and drowsiness shall clothe *a man* with rags.","22":"Hearken unto thy father that begat thee, and despise not thy mother when she is old.","23":"Buy the truth, and sell *it* not; *also* wisdom, and instruction, and understanding.","24":"The father of the righteous shall greatly rejoice: and he that begetteth a wise *child* shall have joy","25":"Thy father and thy mother shall be glad, and she that bare thee shall rejoice.","26":"My son, give me thine heart, and let thine eyes observe my ways.","27":"For a whore *is* a deep ditch; and a strange woman *is* a narrow pit.","28":"She also lieth in wait as *for* a prey, and increaseth the transgressors among men.","29":"Who hath woe? who hath sorrow? who hath contentions? who hath babbling? who hath wounds without cause? who hath redness of eyes?","30":"They that tarry long at the wine; they that go to seek mixed wine.","31":"Look not thou upon the wine when it is red, when it giveth his colour in the cup, *when* it moveth itself aright.","32":"At the last it biteth like a serpent, and stingeth like an adder.","33":"Thine eyes shall behold strange women, and thine heart shall utter perverse things.","34":"Yea, thou shalt be as he that lieth down in the midst of the sea, or as he that lieth upon the top of a mast.","35":"They have stricken me, *shalt thou say, and* I was not sick; they have beaten me, *and* I felt *it* not: when shall I awake? I will seek it yet"}},"tsk":{"4":[{"kopje":"Vermoei","refs":["Spr 28:20","Joh 6:27","1 Tim 6:8-10"]},{"kopje":"zie af","refs":["Spr 3:5","Spr 26:12","Jes 5:21","Rom 11:25","Rom 12:16"]}],"5":[{"kopje":"u","refs":["Ps 119:36","Ps 119:37","Jer 22:17","1 Joh 2:16"]},{"kopje":"iets wat","refs":["Gen 42:36","Pred 1:2","Pred 12:8","Jes 55:2","1 Kor 7:29-31"]},{"kopje":"vleugels","refs":["Spr 27:24","Job 1:14-17","Ps 39:7","Pred 5:12","Pred 5:13","Matt 6:19","1 Tim 6:17","Jak 5:1","Jak 5:2"]}],"6":[{"kopje":"boos","refs":["Spr 22:9","Deut 15:9","Deut 28:56","Matt 20:15","Mark 7:22"]},{"kopje":"be  meerder is dan gij zijt en u schade zou kunnen aandoen, zo gij hem enige oorzaak van verstoring geven zoudt."},{"catchword":"scherpelijk","tekst":"Hebreeuws, lettende letten; dat is scherpelijk, of naarstiglijk letten."},{"catchword":"op dengene,","tekst":"Te weten, dien gij moet aanzien en in ere hebben, opdat gij hem met geen woord, gebaar, of daad verbelgt. Anders: op hetgeen voor uw aangezicht is; te weten, opdat gij daarvan niets nuttigt, dan met zulke zedigheid en matigheid als betamelijk is."}],"2":[{"catchword":"zet","tekst":"Dat is, bedwing uwe begeerlijkheid van onmatig te eten en te drinken, alsof uw keel met een mes daarvan afgeschrikt ware. Of, anders zoudt gij een mes aan uw keel zetten, enz.; dat is, gij zoudt u in het uiterste gevaar steken van lichamelijke krankheid, of enige andere grote zwarigheid, indien u de lekkere gerechten tot onmatigheid verlokten."},{"catchword":"mes aan uw keel,","tekst":"Anderen vertalen het Hebreeuws woord doornen, doch de zin komt op een uit."},{"catchword":"gulzig mens zijt;","tekst":"Hebreeuws, een heer der ziel; dat is van den lust en der begeerlijkheid. Versta, een die zeer graag en begerig is tot spijs en drank. Vergelijk Job 39:1 , en de aantekening op het woord gretigheid. Anders: indien gij uws zelfs meester, of liefhebber zijt."}],"3":[{"catchword":"smakelijke","tekst":"Of, lekkernijen, die den mond zeer aangenaam en smakelijk zijn. Alzo onder vs.6. Vergelijk Gen 27:4 , Gen 27:7 , Gen 27:9 , enz."},{"catchword":"leugenachtig","tekst":"Hebreeuws, brood der leugenen; dat is leugenachtige of bedriegelijke spijs. De zin is dat de hoofse weelden als een aas zijn, waarmede de mensen verlokt en gemeenlijk in hunne verwachtingen bedrogen worden. Vergelijk boven Pro 20:17 ."}],"4":[{"catchword":"uw vernuft","tekst":"Te weten, dat gij zoudt mogen aanleggen om rijk te worden."}],"5":[{"catchword":"op hetgeen","tekst":"Te weten, op den rijkdom, waarvan in vs.4 gesproken is."},{"catchword":"niets is?","tekst":"Dat is, gans 12":[{"catchword":"tucht,","tekst":"Dat is, tot de rechte onderwijzing, om wijsheid te leren. Zie boven Pro 1:2 ."},{"catchword":"der wetenschap","tekst":"Dat is, door welke de ware wetenschap en wijsheid geleerd en verkregen wordt."}],"13":[{"catchword":"tucht","tekst":"Versta, de tucht, die niet alleen geschiedt door woorden, maar ook door straffen. Zie boven Pro 7:22 ."},{"catchword":"niet sterven","tekst":"Te weten, noch hier door de tijdelijke straf der overheid, noch hierna door de eeuwige straf van God."}],"15":[{"catchword":"ja,","tekst":"Gelijke manier van spreken, die grote macht heeft om te verzekeren wat verhaald wordt, is boven Pro 22:19 ."}],"16":[{"catchword":"nieren","tekst":"Versta door dit woord de inwendigste krachten der ziel. Zie Job 9:27 ."},{"catchword":"billijkheden","tekst":"Of, rechte dingen. Vergelijk boven Pro 1:3 ."}],"17":[{"catchword":"zondaren;","tekst":"Die gans genegen zijn tot de zonde, en hun werk daarvan maken. Zie Gen 13:13 ; 1Sa 15:18 ; Psa 1:1 , en de aantekening."},{"catchword":"te allen dage","tekst":"Dat is, gestadiglijk, al den tijd uws levens."}],"18":[{"catchword":"Want zekerlijk,","tekst":"Zie van deze twee eerste woordjes, in het Hebreeuws chi im, Job 42:8 ."},{"catchword":"beloning;","tekst":"Hebreeuws, achterste einde, of uiterste; dat is loon, of zalig einde. Zo wordt het loon genaamd, omdat hij het einde van het werk is, of het werk achterna volgt. God heeft het loon uit genade beloofd dengenen, die in zijne vreze tot het einde toe volharden. Vergelijk Psa 37:37 ; onder Pro 24:14 , Pro 24:20 . Elders betekent het een kwaad naloon en onzalig einde. Zie boven Pro 5:4 ; en de aantekening."},{"catchword":"verwachting","tekst":"Dat is, het goed, hetwelk gij van de genade Gods verwacht. Zie Job 5:16 ."}],"19":[{"catchword":"mijn zoon","tekst":"Zie boven Pro 1:8 ."},{"catchword":"den weg","tekst":"Te weten, des Heeren. Zie van dezen weg Gen 18:19 ."}],"20":[{"catchword":"onder de wijnzuipers,","tekst":"Te weten, om die in hun overdadig drinken en gulzig eten na te volgen; hetwelk die lichtelijk doen, die met hen veel verkeren; zie boven Pro 13:20 ."},{"catchword":"onder de vleesvreters;","tekst":"Hebreeuws, onder degenen, die voor zich vlees slokken, of verslinden."}],"21":[{"catchword":"sluimering","tekst":"Het Hebreeuwse woord betekent eigenlijk [naar eniger gevoelen] het begin en de genegenheid tot den slaap. Vervolgens is door het woord, dat wij hier in den tekst hebben, te verstaan de slaperigheid, te weten die uit luiheid en achteloosheid voortkomt."}],"23":[{"catchword":"Koop","tekst":"Dat is, poog haar op allerlei eerlijke manier te verkrijgen, en wanneer gij haar verkregen hebt, verlaat haar en vergeet haar niet; gelijk de verkopers voor wat anders hunne waren omzetten."},{"catchword":"waarheid,","tekst":"Dat is, de rechte en ware kennis van alle dingen, rakende het geloof en den wandel, die wij moeten weten om God te behagen en zalig te worden."}],"24":[{"catchword":"zich zeer verheugen;","tekst":"Hebreeuws, verheugende verheugen; dat is zeer verheugen te weten, omdat hij een rechtvaardigen en wijzen zoon heeft, dat is, die vroom, godvrezend en verstandig is."}],"25":[{"catchword":"Laat uw vader","tekst":"Dat is, maak dat uw vader en uwe moeder zich verblijden, inziende uwe verstandigheid en deugdzaamheid."},{"catchword":"verheugen,","tekst":"Te weten voor den weedom, dien zij gehad heeft met u te baren."}],"26":[{"catchword":"geef mij uw hart,","tekst":"Dat is, voeg en begeef uw verstand en uwen geest hiertoe, dat gij aanhoort, verstaat, aanneemt en onderhoudt mijne geboden."},{"catchword":"ogen","tekst":"Te weten, de ogen uws verstands."},{"catchword":"wegen bewaren","tekst":"Dat is, de wijze en manier van leven, die ik u beveel en voorschrijf, en inzonderheid van het vermijden der hoererij en des overspels."}],"27":[{"catchword":"diepe gracht,","tekst":"Te weten der ellenden, waaruit men niet lichtelijk geraken kan, gelijk ook niet uit een engen put; vergelijk boven Pro 22:14 , en de aantekening."},{"catchword":"vreemde vrouw","tekst":"Zie boven Pro 2:16 ."}],"28":[{"catchword":"loert zij","tekst":"Te weten op degenen, die zij zoekt te verleiden en in haar onkuische liefde te verstrikken."},{"catchword":"een rover;","tekst":"Of, [een man] des roofs. Vergelijk Job 24:20 , en Job 35:13 en de aantekening. Anders: als [op] een roof. Vergelijk boven Pro 7:10-15 ."},{"catchword":"vermenigvuldigt","tekst":"Dat is, zij is oorzaak, dat zeer vele mensen in boosheid vervallen en hunnen God ontrouw worden."}],"29":[{"catchword":"Bij wien","tekst":"Dit is een verhaal der plagen en ellenden, die uit de dronkenschap voortkomen, vragenderwijze voorgesteld. De vraag wordt beantwoord in vs.30."},{"catchword":"och arme?","tekst":"Het Hebreeuwse woord schijnt eigen te zijn dengenen, die om de armoede, waarin zij gevallen zijn, groot gekerm maken."},{"catchword":"beklag?","tekst":"Of ijdel geklap, of onnut gezwets en gesnater."},{"catchword":"wonden","tekst":"Of, slagen; te weten, die men lichtvaardiglijk op zijn hals haalt met kwaad te spreken door dronkenschap, of de dronkaards te vergezelschappen."}],"30":[{"catchword":"vertoeven;","tekst":"Dat is, lang blijven zitten, zonder van het drinken een einde te kunnen maken."},{"catchword":"gemengden","tekst":"Hebreeuws, menging; dat is, gemengden wijn. Zie boven Pro 9:2 ."}],"31":[{"catchword":"Zie den wijn","tekst":"Te weten, met een onmatige begeerte."},{"catchword":"verf geeft,","tekst":"Hebreeuws, oog. Zie Num 11:7 ."},{"catchword":"recht opgaat;","tekst":"Hebreeuws, in, of met richtigheden gaat, of zich doet gaan; dat is, als hijzich in den beker beweegt en door zijne kracht, als met zandjes, opspringt en recht omhoog stijgt. Anders: recht ingaat."}],"32":[{"catchword":"adder","tekst":"Anders: basilisk."}],"33":[{"catchword":"vreemde vrouwen","tekst":"Dat is, die de uwe niet zijn. Zie boven Pro 2:16 ."},{"catchword":"verkeerdheden","tekst":"Dat is, alle dingen, welke dienen om uw wellust te verzadigen; of ijdele, lichtvaardige en onnutte redenen, die haat, nijd en twist verwekken."}],"34":[{"catchword":"gij zult","tekst":"Te weten, die u met den drank overlaadt."},{"catchword":"gelijk een,","tekst":"Te weten, omdat uw hoofd zal ontsteld zijn door de dampen des dranks uit de maag rijzende, gelijk de zee door de winden, die over haar waaien."},{"catchword":"hart van de zee","tekst":"Dat is, in het midden der zee. Zie Exo 15:8 . De verklaring is Exo 14:22 , Exo 14:29 . Alzo het hart des hemels; Deu 4:11 , enz. Zie aldaar de aantekening."},{"catchword":"die in het opperste","tekst":"Te weten, gelijk in de mars. Versta, een die in groot gevaar is van in enig zwaar ongeluk te vallen."}],"35":[{"catchword":"Men heeft mij geslagen,","tekst":"Dit zijn de woorden, die Salomo den dronkaards toeëigent, kortelijk te kennen gevende dat ze zonder gevoel zijn, niet alleen des lichaams, omdat ze de slagen niet gevoelen, maar ook des geestes, omdat ze, den drank nauwelijks uitgeslapen hebbende, terstond weder daaraan willen."},{"catchword":"opwaken?","tekst":"Te weten van den wijn."},{"catchword":"hem nog meer zoeken","tekst":"Te weten den wijn."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When thou shalt sit down to eat with a Ruler; [That is, King, Prince, Duke, Lord, or one that is greater then thy self, and is able to do thee a mischief, if thou shouldest give him occasion to be angry with thee] then shalt thou sharply heed. [Hebr. Heeding, heed; that is, narrowly, or diligently heed] him that is before thy face. [to wit, whom thou must honour and respect, that thou mayest not offend him either in word, gesture, or actions. Oth. That which is before thy face; to wit, that thou mayest not eat thereof, then with such modesty and temperance, as is becoming, or decent.]"}],"2":[{"catchword":null,"tekst":"And put a knife to thy throat, [That is, restrain thine inordinate desire, or appetite eat and drink immoderately, as if thy throat were frighten from it by a knife. Or, otherwise thou shouldest out a knife to thy throat; that is, thou shouldest incure the uttermost hazard of bodily sickness, or of some other dangerous grief, if the liquorish meats and dainty dishes should allure thee to intemperance. Oth. Translate the Hebrew word, rendered here knife, thorns: but the sense is all one, or one and the same] if thou be a gluttonous man. [Hebr. A Lord of the soul; that is, of lust, and appetite, or desire. Meaning one that is very greedy and covetous after meat and drink. Compare Job 39. Verse 1. And the annot. Upon the word greediness. Oth. If thou be master, or, lover of thy self.]"}],"3":[{"catchword":null,"tekst":"Covet not his savoury meats: [Or, dainties, which are very pleasant, and toothsome to the mouth. So below verse 6. Compare Gen.27,4,7,9, &c.] for it is a lying, or deceitful meat. The meaning is, that Court-delights are as a bait, whereby men are enticed and allured, and commonly deceived in their expectations. Compare above chapter 20.17.]"}],"4":[{"catchword":null,"tekst":"Trouble not thy self to grow rich: desist from thine (own) understanding. [To wit, which thou mightiest employ to grow rich.]"}],"5":[{"catchword":null,"tekst":"Wilt thou suffer thine eyes to fly upon that which is not? [To wit, upon riches, whereof mention is made in the former verse. That which is not: that is, is very uncertain, and unconstant, and in many necessaries very impotent and weak. Compare Psa 37:35,36. And 49.13,18. 1 Tim.6.17. Oth. That which (soon) will not be] for it [to wit, temporal wealth, or riches, it will soon get away, and leave thee, as followeth] will certainly make [Hebr. Making, make] it self wings: as an eagle, that flieth toward Heaven. [to wit, that flieth so swiftly on high towards Heaven, as that he is soon vanished away out of a mans sight: even so do riches perish and decay in a short time, so that a man cannot tell whither they are gone, or what is become of them.]"}],"6":[{"catchword":null,"tekst":"Eat not the bread of him that is of an evil eye, [That is, of him that is covetous, grudging, and envious. See Deut.15.on verse 9. Also below ch.28.22. Mark 7.22. To this is opposed the good eye, whereof see above ch.22.9. and the annot.] neither be desirous of his savory meats. [see above on verse 3.]"}],"7":[{"catchword":null,"tekst":"For as he hath thought in his soul, so will he say unto thee, [Oth. As he conceiveth in his soul, so is he; that is, thinketh or imagineth evil with himself, to wit, that thou consumes and devourest that which is his] eat and drink; but his heart is not with thee: [to wit, bearing thee no good will at all, but yet so, as that his covetous mind may be in a manner gathered from his gestures and words. Although he seeketh thereby to manifest the contrary.]"}],"8":[{"catchword":null,"tekst":"Thy morsel which thou hast eaten, shalt thou vomit up; [That is, it will vex and grieve thee that thou hast eaten of his meat, and hast had some friendly discourse at table with him] and thou shalt spoil thy pleasant words. [that is, lose them, and reap no profit or benefit by them.]"}],"9":[{"catchword":null,"tekst":"Speak not before the ear of a fool: for he will despise the understanding of thy words. [That is, that which thou hast spoken understandingly, learnedly, or prudently. Comp.ch.9.8. Mat 7:6.]"}],"10":[{"catchword":null,"tekst":"Set not the ancient border back: [See above ch.22.on verse 28. Hebr. Border of eternity] and enter not into the fields of the fatherless: [to wit, to wrong them: by deceit, or violence.]"}],"11":[{"catchword":null,"tekst":"For their Redeemer [To wit, God] is strong: he shall plead their cause against thee. [See above ch.22.on verse 23.]"}],"12":[{"catchword":null,"tekst":"Apply thine heart unto discipline: [To wit, unto good instruction, to learn wisdom. See above ch.1.on verse 2.] and thine ears to the speeches of knowledge. [that is, whereby true knowledge and wisdom, is learned, and obtained.]"}],"13":[{"catchword":null,"tekst":"Withhold not discipline [Meaning the discipline, which is not onely done by words, but also by blows: see ab.ch.7.on verse 22.] from the boy: [compare ab.ch.13.24. and 19.18. and 22.15. and below chap.29.15,17.] when thou shalt beat him with the rod, he shall not die: [to wit, neither here by the temporal punishment of the Magistrate, nor hereafter by the everlasting punishment of God.]"}],"14":[{"catchword":null,"tekst":"Thou shalt beat him with the rod, and deliver his soul from hell."}],"15":[{"catchword":null,"tekst":"My son; if thine heart be wise; mine heart shall rejoice, yea I. [The same phrase which hath great strength to confirm and ratify that which is related, is used above ch.22.19.]"}],"16":[{"catchword":null,"tekst":"And my reins [Understand by this word the innermost powers and faculties of the soul. See Job 19.on innermost powers and faculties of the soul. See Job 19.on verse 27.] shall leap up for joy, when thy lips shall speak equities. [or, right things. Comp.ab.ch.1.on v.3.]"}],"17":[{"catchword":null,"tekst":"Let not thine heart be envious against sinners: [That is, those that are wholly bent unto sin, and make it their business to commit sin, and wickedness. See Gen 13:13. 1 Sam.15.18. Psal.1.1. and the annotate. Compare Psal.37.1. and 73.3. above chap.3.31. below chap.24.1.] but be (thou) in the fear of the LORD all the day (long): [that is, continually, all thy lifetime.]"}],"18":[{"catchword":null,"tekst":"For surely [See of these two first words in Hebrew chi im, Job 42.on ver. 8.] there is a reward: [Hebr. Hindermost end, or, uttermost; that is, reward, or blessed and happy end. So is the reward called, because it is the end of the work, or followeth after the work. God hath of his grace promised a reward to those that persevere and continue in his fear unto the end. Compare Psal.37.37. below chap.24.14,20. Elsewhere it signifieth an evil reward, and unhappy end. See above chap.5.4. and the annotate.] and thine expectation. [that is, the good which thou expectest, and lookest for of Gods free grace. See Job 5.on ver.18.] shall not be cut off."}],"19":[{"catchword":null,"tekst":"Hear thou, my son. [See above chap.1.on verse 8.] and be wise: and direct thine heart in the way. [To wit, of the Lord, See of this way, Genes.18.on verse 19.]"}],"20":[{"catchword":null,"tekst":"Be not amongst the Wine-bibbers, nor amongst the flesh-devourers. [To wit, to imitate or follow them in their excessive drinking, and riotous or gluttonons eating; which those easily do, that converse and keep company with them. See above chap.13.20. Hebr. Amongst those that do swallow down, or, devour flesh for themselves. Compare Isa 5:22. Luk.21.34. Rom 13:13. Eph 5:18.]"}],"21":[{"catchword":null,"tekst":"For a bibber, and (a) glutton shall be poor: and drawiness [The Hebrew word signifieth properly (according to the opinion of some) the beginning, and the proneness or inclination, or aptness to sleep. Consequently by the word here used in the Text, is to be understood the sleepiness or drowsiness, to wit, which issueth from laziness, and carelessness] causeth (a man) to wear rent clothes."}],"22":[{"catchword":null,"tekst":"Hearken unto thy Father, that begat thee: and despise not thy Mother, when she is grown old. [Compare above chap.1.8.]"}],"23":[{"catchword":null,"tekst":"Buy the truth, [That is, the right and true knowledge of all things, concerning faith, and life, which we ought to know, that we may please God, and be saved] and fell it not: [that is, endeavour to get it by all honest and lawful ways and means; and when thou hast gotten it, lose it not, neither forget it: as the sellers do, that are willing to part with their wares and commodities for something else] (together with) wisdom, discipline, and understanding. [Compare above chap.4.7,8.]"}],"24":[{"catchword":null,"tekst":"The father of the righteous shall greatly rejoice: [Hebr. Rejoicing rejoice: that is, greatly rejoice; to wit, because he hath a righteous, and gracious son, that is, that is honest, godly, and prudent] and he that begetteth a wise (son) shall be glad because of him. [Compare Pro 10:1. and 15.20.]"}],"25":[{"catchword":null,"tekst":"Let thy father be glad, also thy mother: [That is, cause thy father and thy mother to be glad, when they behold thy understanding, and thy virtuous life] and let her rejoice that bare thee. [To wit, for the sorrow which she hath had in bearing thee.]"}],"26":[{"catchword":null,"tekst":"My son, give me thine heart: [That is, apply thine understanding, and thy mind hereunto, that thou hear, understand, receive, and keep my commandments] and let thine eyes [to wit, the eyes of thine understanding] keep my ways. [That is, the manner course of life, which I command, and prescribe unto thee, and especially warning the avoiding of whoredom, and adultery.]"}],"27":[{"catchword":null,"tekst":"For an whore is a deep ditch: [To wit, of miseries, out of which a man cannot easily get: as also not out of a narrow pit. Compare above chap.22.14. and the annotate.] and a strange woman [see above chap.2.on vers.16.] is a narrow pit."}],"28":[{"catchword":null,"tekst":"She also looketh [To wit, for those whom she seeketh to seduce, and to ensnare in her immodest and unchaste love] as a robber: [or, (a man) of prey. Compare Job 24:20. and chap.35.13. and the annotate. Oth.as (for) a prey; Compare above chap.7.10,11,12,13,14,15.] and she multiplieth the faithless (ones) among men. [That is, she is the cause or occasion that very many fall into evil, and become disloyal unto their God]"}],"29":[{"catchword":null,"tekst":"With whom is who, with whom (is) alas? [The Hebrew word seemeth proper to those, who make great moan by reason of poverty where into they are fallen] with whom (are) brawlings? With whom (is) complaint? [Or, vain babbling, or unprofitable chattering and prating] with whom (are) wounds [or, blows: to wit, which a man easily gets about his ears, by ill-speaking when he is in drink, or by keeping company with drunkards] wit out cause? With whom (is) redress of eyes? [This is a relation of the plagues and calamities, which issue from drunkenness, propounded by way of questioning or asking. The question is answered in the following verse]"}],"30":[{"catchword":null,"tekst":"With those, that tarry long at the wine: [That is, that sit long by it, without making an end of drinking. Compare Isa 5:11,22.] with those that go to seek after mixt wine, [Hebr. Mixture; that is, mingled wine. See above chap.9.on ver.2. also Isa 5:22.]"}],"31":[{"catchword":null,"tekst":"Look not upon the wine [To wit, with an immoderate desire] when it appeareth red; when it giveth his colour [Hebr. Eye, see Numb.11.on ver.7.] in the cup (when) it goeth upright: [Hebr. Goeth in, or, with rightnesses, or, causeth it self to go in, or, with rightnesses; that is, when it moves it self in the cup, and by its strength leapeth up as with little sand, and mounteth straight upward. Oth.goeth straight in.]"}],"32":[{"catchword":null,"tekst":"(In) the end thereof it will bite like a serpent, and sting like an adder. [Oth. Basilisk]"}],"33":[{"catchword":null,"tekst":"Thine eyes shall look after strange women; [That is, those that are not thine. See above chap.2.on ver.16.] and thine heart shall perverseness. [That is, all things that tend to satisfy thy delight: or, idle, vain, and unprofitable words, and discourse, that cause hatred, envy, and strife.]"}],"34":[{"catchword":null,"tekst":"And thou [To wit, that overloadest thy self with drink] shalt be as one that slippeth into the heart of the sea; [that is, in the midst of the sea. See Exod.15.on ver.8. The Exposition is in Exo 14:22,29. So the heart of heaven, Deut.4.11, &c. See there the annotate. Thou shall be as one that sleepeth in the heart of the sea, &c. To wit, because thine head shall be so out of temper by the vapours of the drink arising, or ascending up out of the stomach into the head, as the sea is disturbed or distempered by reason of the winds that blow mightily upon it] and as one that sleepeth upon the top of the mast. [To wit, as upon the top-gallant. Understand one, that is in great danger of falling into some grievous mischief]"}],"35":[{"catchword":null,"tekst":"They have stricken me, (shalt thou say) (and) I was not sick: they have beaten me, (and) I felt it not: when shall I awake? [to wit, from the wine] I will seek it this verse are the words which Solomon appropriateth unto drunkards, briefly signifying thereby, that they are without feeling; not onely without feeling, because they feel not the blows or stripes that are given them, but also without spiritual feeling, because having hardly slept out, or slept away their drink, they fall present to it again.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
