RE, en wijk van het kwade.","8":"Het zal een medicijn voor uw navel zijn, en een bevochtiging voor uw beenderen.","9":"Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;","10":"Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.","11":"Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;","12":"Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.","13":"Gelukkig is de mens die wijsheid vindt, en de mens die verstandigheid voortbrengt!","14":"Want haar koophandel is beter dan de koophandel van zilver, en haar inkomst dan het uitgegraven goud.","15":"Zij is kostbaarder dan robijnen; en alles wat u kan verlangen, is met haar niet te vergelijken.","16":"Lengte van dagen is in haar rechterhand, in haar linkerhand rijkdom en eer.","17":"Haar wegen zijn wegen van liefelijkheid, en al haar paden vrede.","18":"Zij is een boom van het leven voor hen die haar aangrijpen, en ieder die haar vasthoudt, wordt gelukkig.","19":"De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.","20":"Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.","21":"Mijn zoon! Laat ze niet afwijken van uw ogen; bewaar de degelijke wijsheid en bedachtzaamheid.","22":"Want zij zullen het leven voor uw ziel zijn, en een sieraad voor uw hals.","23":"Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.","24":"Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.","25":"Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.","26":"Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.","27":"Onthoud het goede niet aan hen die het toekomt, als het in de macht van uw hand is het te doen.","28":"Zeg niet tegen uw naaste: Ga heen, en kom terug, en morgen zal ik geven, terwijl u het bij u hebt.","29":"Smeed geen kwaad tegen uw naaste, aangezien hij met vertrouwen bij u woont.","30":"Twist met een mens niet zonder reden, als hij u geen kwaad gedaan heeft.","31":"Wees niet jaloers op een man van het geweld, en kies geen van zijn wegen.","32":"Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.","33":"De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.","34":"Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.","35":"De wijzen zullen eer beërven; maar de dwazen dragen schande."},"SV":{"1":"Mijn zoon! vergeet mijn wet niet, maar uw hart beware mijn geboden.","2":"Want langheid van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.","3":"Dat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel uws harten.","4":"En vind gunst en goed verstand, in de ogen Gods en der mensen.","5":"Vertrouw op den HEERE met uw ganse hart, en steun op uw verstand niet.","6":"Ken Hem in al uw wegen, en Hij zal uw paden recht maken.","7":"Zijt niet wijs in uw ogen; vrees den HEERE, en wijk van het kwade.","8":"Het zal een medicijn voor uw navel zijn, en een bevochtiging voor uw beenderen.","9":"Vereer den HEERE van uw goed, en van de eerstelingen al uwer inkomsten;","10":"Zo zullen uw schuren met overvloed vervuld worden, en uw perskuipen van most overlopen.","11":"Mijn zoon! verwerp de tucht des HEEREN niet, en wees niet verdrietig over Zijn kastijding;","12":"Want de HEERE kastijdt dengene, dien Hij liefheeft, ja, gelijk een vader den zoon, *in* *denwelken* hij een welbehagen heeft.","13":"Welgelukzalig is de mens, *die* wijsheid vindt, en de mens, *die* verstandigheid voortbrengt!","14":"Want haar koophandel is beter dan de koophandel van zilver, en haar inkomst dan het uitgegraven goud.","15":"Zij is kostelijker dan robijnen; en al wat u lusten mag, is met haar niet te vergelijken.","16":"Langheid der dagen is in haar rechterhand, in haar linkerhand rijkdom en eer.","17":"Haar wegen zijn wegen der liefelijkheid, en al haar paden vrede.","18":"Zij is een boom des levens dengenen, die ze aangrijpen, en elkeen, die ze vast houdt, wordt gelukzalig.","19":"De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.","20":"Door Zijn wetenschap zijn de afgronden gekloofd, en de wolken druipen dauw.","21":"Mijn zoon! laat ze niet afwijken van uw ogen; bewaar de bestendige wijsheid en bedachtzaamheid.","22":"Want zij zullen het leven voor uw ziel zijn, en een aangenaamheid voor uw hals.","23":"Dan zult gij uw weg zeker wandelen, en gij zult uw voet niet stoten.","24":"Zo gij nederligt, zult gij niet schrikken; maar gij zult nederliggen en uw slaap zal zoet wezen.","25":"Vrees niet voor haastigen schrik, noch voor de verwoesting der goddelozen, als zij komt.","26":"Want de HEERE zal met uw hoop wezen, en Hij zal uw voet bewaren van gevangen te worden.","27":"Onthoud het goed van zijn meesters niet, als het in het vermogen uwer hand is te doen.","28":"Zeg niet tot uw naaste: Ga heen, en kom weder, en morgen zal ik geven, dewijl het bij u is.","29":"Smeed geen kwaad tegen uw naaste, aangezien hij met vertrouwen bij u woont.","30":"Twist met een mens niet zonder oorzaak, zo hij u geen kwaad gedaan heeft.","31":"Zijt niet nijdig over een man des gewelds, en verkies geen van zijn wegen.","32":"Want de afwijker is den HEERE een gruwel; maar Zijn verborgenheid is met den oprechte.","33":"De vloek des HEEREN is in het huis des goddelozen; maar de woning der rechtvaardigen zal Hij zegenen.","34":"Zekerlijk, de spotters zal Hij bespotten, maar den zachtmoedigen zal Hij genade geven.","35":"De wijzen zullen eer beërven; maar elk een der zotten neemt schande op zich."},"KJV":{"1":"My son, forget not my law; but let thine heart keep my commandments:","2":"For length of days, and long life, and peace, shall they add","3":"Let not mercy and truth forsake thee: bind them about thy neck; write them upon the table of thine heart:","4":"So shalt thou find favour and good understanding in the sight of God and man.","5":"Trust in the LORD with all thine heart; and lean not unto thine own understanding.","6":"In all thy ways acknowledge him, and he shall direct thy paths.","7":"Be not wise in thine own eyes: fear the LORD, and depart from evil.","8":"It shall be health to thy navel, and marrow to thy bones.","9":"Honour the LORD with thy substance, and with the firstfruits of all thine increase:","10":"So shall thy barns be filled with plenty, and thy presses shall burst out with new wine.","11":"My son, despise not the chastening of the LORD; neither be weary of his correction:","12":"For whom the LORD loveth he correcteth; even as a father the son *in whom* he delighteth.","13":"Happy *is* the man *that* findeth wisdom, and the man *that* getteth understanding.","14":"For the merchandise of it *is* better than the merchandise of silver, and the gain thereof than fine gold.","15":"She *is* more precious than rubies: and all the things thou canst desire are not to be compared","16":"Length of days *is* in her right hand; *and* in her left hand riches and honour.","17":"Her ways *are* ways of pleasantness, and all her paths *are* peace.","18":"She *is* a tree of life to them that lay hold upon her: and happy *is every one* that retaineth","19":"The LORD by wisdom hath founded the earth; by understanding hath he established the heavens.","20":"By his knowledge the depths are broken up, and the clouds drop down the dew.","21":"My son, let not them depart from thine eyes: keep sound wisdom and discretion:","22":"So shall they be life unto thy soul, and grace to thy neck.","23":"Then shalt thou walk in thy way safely, and thy foot shall not stumble.","24":"When thou liest down, thou shalt not be afraid: yea, thou shalt lie down, and thy sleep shall be sweet.","25":"Be not afraid of sudden fear, neither of the desolation of the wicked, when it cometh.","26":"For the LORD shall be thy confidence, and shall keep thy foot from being taken.","27":"Withhold not good from them to whom it is due, when it is in the power of thine hand to do","28":"Say not unto thy neighbour, Go, and come again, and to morrow I will give; when thou hast","29":"Devise not evil against thy neighbour, seeing he dwelleth securely","30":"Strive not with a man without cause, if he have done thee no harm.","31":"Envy thou not the oppressor, and choose none of his ways.","32":"For the froward *is* abomination to the LORD: but his secret *is* with the righteous.","33":"The curse of the LORD *is* in the house of the wicked: but he blesseth the habitation of the just.","34":"Surely he scorneth the scorners: but he giveth grace unto the lowly.","35":"The wise shall inherit glory: but shame shall be the promotion of fools."}},"tsk":{"1":[{"kopje":"Vergeet","refs":["Spr 1:8","Spr 4:5","Spr 31:5","Deut 4:23","Ps 119:93","Ps 119:153","Ps 119:176","Hos 4:6"]},{"kopje":"Vergeet","refs":["Deut 4:9","Deut 6:6-9","Deut 8:1","Deut 30:16-20","Ps 119:11","Ps 119:16","Ps 119:34","Ps 119:47","Ps 119:48","Jes 51:17","Jer 31:33","Joh 14:21-24"]}],"2":[{"kopje":"lengte","refs":["Spr 3:16","Spr 4:10","Spr 9:11","Job 5:26","Ps 34:12-15","Ps 91:16","Ps 128:6","Ef 6:1-3","1 Tim 4:8"]},{"kopje":"jaren van leven","refs":["Ps 21:5"]},{"kopje":"en vrede","refs":["Spr 3:17","Ps 119:165","Jes 32:17","Jes 57:19-21","Rom 5:1","Rom 14:17","Rom 15:13"]}],"3":[{"kopje":"goedertierenheid","refs":["Spr 16:6","Spr 20:28","2 Sam 15:20","Ps 25:10","Hos 4:1","Micha 7:18-20","Mal 2:6","Matt 23:23","Ef 5:1","Ef 5:2","Ef 5:9"]},{"kopje":"bind","refs":["Spr 6:21","Spr 7:3","Ex 13:9","Deut 6:8","Deut 11:18-21","Ps 119:11"]},{"kopje":"schrijf","refs":["Jer 17:1","2 Kor 3:3","Hebr 10:16"]}],"4":[{"kopje":"vind","refs":["Gen 39:2-4","Gen 39:21","1 Sam 2:26","Ps 111:10","Dan 1:9","Luk 2:52","Hand 2:47","Rom 14:18"]},{"kopje":"goed verstand","refs":["Joz 1:7","Joz 1:8","Ps 111:10"]}],"5":[{"kopje" ata-code=\"H2790\">Devise</span> not <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> seeing he <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> securely","30":"<span class=\"wl wl-kjv\" data-code=\"H7378\">Strive</span> not with a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> without <span class=\"wl wl-kjv\" data-code=\"H2600\">cause,</span> if he have <span class=\"wl wl-kjv\" data-code=\"H1580\">done</span> thee no harm.","31":"<span class=\"wl wl-kjv\" data-code=\"H7065\">Envy</span> thou not the <span class=\"wl wl-kjv\" data-code=\"H376\">oppressor,</span> and <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> none of his ways.","32":"For the <span class=\"wl wl-kjv\" data-code=\"H3868\">froward</span> is <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> but his <span class=\"wl wl-kjv\" data-code=\"H5475\">secret</span> is with the righteous.","33":"The <span class=\"wl wl-kjv\" data-code=\"H3994\">curse</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked:</span> but he <span class=\"wl wl-kjv\" data-code=\"H1288\">blesseth</span> the <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> of the just.","34":"Surely he <span class=\"wl wl-kjv\" data-code=\"H3887\">scorneth</span> the <span class=\"wl wl-kjv\" data-code=\"H3887\">scorners:</span> but he <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6035\">lowly.</span>","35":"The <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> shall <span class=\"wl wl-kjv\" data-code=\"H5157\">inherit</span> <span class=\"wl wl-kjv\" data-code=\"H3519\">glory:</span> but <span class=\"wl wl-kjv\" data-code=\"H7036\">shame</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H7311\">promotion</span> of fools."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"wet niet,","tekst":"Of, leer; te weten, waardoor ik u leer en onderwijs, om uw leven wel aan te stellen. Zie boven Pro 1:8 ."}],"2":[{"catchword":"dagen,","tekst":"Dat is, een groten ouderdom en een veeljarig leven; alzo Deu 30:20 ; Job 12:12 ; Psa 21:5 , en Psa 91:16 ; onder vs.16, en Pro 4:10 , en Pro 9:11 ."},{"catchword":"leven,","tekst":"Dat is, welstand naar ziel en lichaam. Zie Gen 37:14 ."},{"catchword":"vermeerderen","tekst":"Alzo onder Pro 9:11 . Hebreeuws eigenlijk, toedoen, hetwelk hier zoveel is als vermenigvuldigen."}],"3":[{"catchword":"Dat de goedertierenheid","tekst":"Dit kan men verstaan van de goedertierenheid en trouw van God, zulks dat het zou zijn een bevel, vermanende den mens daaraan vast te hangen, met ene belofte dat Hij hen behouden zou. Zie onder vs.25. Anderen verstaan dit van de weldadigheid en trouw, die een ieder jegens zijnen naaste bewijzen moet."},{"catchword":"bind ze","tekst":"Te weten, de geboden Gods, waarvan in vs.1 gesproken is. Of, de goedertierenheid en trouw, dat is, de beloften Gods daarvan."},{"catchword":"aan uw hals,","tekst":"Te weten, als een sieraad of keten, gelijk boven Pro 1:9 , en om die altijd voor ogen te hebben. Zie onder vs.21, en Pro 6:21 , en vergelijk Exo 13:9 ; Deu 6:8 ."},{"catchword":"schrijf","tekst":"Dat is, druk het diep in het binnenste van uw verstand, opdat zij nimmermeer uit uwe memorie vergaan. Alzo onder Pro 7:3 ; Jer 17:1 ; 2Co 3:3 ."}],"4":[{"catchword":"vind","tekst":"Het is weder een bevel, bevattende een sterke belofte, gelijk in het begin van vs.3. Het bevel is, poog genade te vinden, enz. De belofte is: gij zult God en den vromen mensen aangenaam zijn en een gezonde kennis hebben van wel te leven."},{"catchword":"gunst","tekst":"Of, genade; dat is, aangenaamheid, waardoor men iemand behagelijk is; alzo Gen 39:21 ; Psa 45:3 ; boven Pro 1:9 ; onder Pro 11:16 , en Pro 22:11 ; Ecc 10:12 ; Luk 2:52 ."},{"catchword":"verstand,","tekst":"Zie boven Pro 1:3 ."}],"5":[{"catchword":"met uw ganse hart,","tekst":"Vergelijk Deu 6:5 , en 1Ki 2:4 , en de aantekening."}],"6":[{"catchword":"in al uw wegen,","tekst":"Dat is, in al hetgeen gij voorneemt, aangrijpt, spreekt, doet en laat. Zie Gen 6:12 . In denzelfden zin is terstond in vs.6 het woord paden genomen."},{"catchword":"recht maken","tekst":"Dat is, besturen naar zijne wet en u recht daarnaar leiden, opdat gij tot het gewenste einde van uw leven moogt geraken. Vergelijk onder Pro 11:5 , en Pro 15:21 ."}],"7":[{"catchword":"in uw ogen;","tekst":"Dat is, in uw eigen gevoelen en oordeel. Zie Lev 13:5 ; Job 18:3 ."}],"8":[{"catchword":"voor uw navel","tekst":"Het is een manier van spreken bij gelijkenis genomen van de kinderen, wier navels met grote voorzichtigheid moeten behandeld en verzorgd worden, en ook van de volwassenen, die aldaar week en zwak zijn, en dikwijls medicijnen van node hebben. De zin is dat men, de vreze Gods hebbende, ten aanzien van het geestelijke leven der ziel gans welvarend en in goede sterkte wezen zal."},{"catchword":"bevochtiging","tekst":"Een andere gelijkenis, genomen van de beenderen van het lichaam, welke met goed merg moeten vervuld worden tot onderhouding van de krachten des mensen. Alzo heeft ook de ziel hare sterkte van de kennis en vreze des Heeren. Vergelijk Job 21:24 ."}],"9":[{"catchword":"den HEERE","tekst":"Te weten, in zijne dienaren, de priesters en Levieten; idem in de weduwen, wezen en armen, die van uwe middelen mededelende; Exo 23:19 ; Deu 26:2-3 , enz."},{"catchword":"eerstelingen","tekst":"Zie van deze Exo 22:29-30 ; Lev 2:12 , en Lev 23:17 ."}],"10":[{"catchword":"overvloed","tekst":"Hebreeuws, verzaadheid; dat is, met overvloed van vruchten, waarmede de mensen verzadigd kunnen worden. Zie Gen 41:29 , en de aantekening; idem, Ecc 5:11 ."},{"catchword":"overlopen","tekst":"Hebreeuws, doorbreken."}],"11":[{"catchword":"de tucht","tekst":"Dit woord betekent wel de onderwijzing, die geschiedt met woorden, maar het wordt hier ook voor dadelijke straffen genomen. Zie onder Pro 7:22 . Alzo ook het woord tuchtigen, onder Pro 9:7 . Zie de aantekening."},{"catchword":"kastijding;","tekst":"dit woord is ook niet alleen voor woordstraf genomen, gelijk onder Pro 15:31-32 , en Pro 28:23 , maar ook voor dadelijke straf, gelijk hier en Psa 73:14 , en Psa 149:7 ; Hos 5:9 ; alzo het woord bestraffen, Psa 6:2 ."}],"12":[{"catchword":"welbehagen","tekst":"Zie van de betekenis van het Hebreeuwse woord, 2Sa 24:23 ."}],"13":[{"catchword":"vindt,","tekst":"Hebreeuws, gevonden heeft; dat is, doorgaans vindt; daarom staat ook het volgende woord naar den oorspronkelijken tekst in den toekomenden tijd. Het woord vinden schijnt te zien op het zoeken en naspeuren der wijsheid, waarvan gesproken is boven Pro 2:4 ; zie de aantekening."},{"catchword":"voortbrengt","tekst":"Of, uithaalt; te weten, als uit een verborgen plaats, en dienvolgens die met groten arbeid bekomt."}],"14":[{"catchword":"koophandel","tekst":"Dat is, de waar, of het goed, dat bij de wijsheid te vinden is; alzo wordt het Hebreeuwse woord door enigen genomen, onder Pro 31:18 ; Isa 23:18 . Anders: hantering, of handeling; dat is naspeuring, waardoor zij gezocht, gevonden en gekregen wordt; alzo hantering van zilver; dat is handel, waardoor het zilver verkregen wordt."},{"catchword":"uitgegraven","tekst":"Versta, zeer fijn goud; zo mogelijk genaamd omdat het uit de aarde gegraven wordt. Dezelfde naam is Psa 68:14 , onder Pro 8:10 , Pro 8:19 , en Pro 16:16 ; Zec 9:3 ."}],"15":[{"catchword":"robijnen","tekst":"Zie Job 28:18 ."},{"catchword":"al wat u lusten mag,","tekst":"Hebreeuws, al uwe lusten zullen met haar niet vergeleken worden; dat is, al wat gij zoudt kunnen wensen is van zulke waarde niet, dat het bij haar zou mogen vergeleken worden; alzo onder Pro 8:11 ."}],"16":[{"catchword":"Langheid","tekst":"Zie boven vs.2."},{"catchword":"is in haar","tekst":"De wijsheid wordt hier vergeleken bij ene vrouw, die in groten overvloed allerlei goederen uitdeelt dengenen, die haar volgen en gehoorzamen. Onder de tijdelijke goederen zijn ook de eeuwige begrepen."}],"17":[{"catchword":"wegen","tekst":"Dat is, al wat zij voorschrijft te geloven en te doen. Versta ook alzo het volgende woord paden."},{"catchword":"vrede","tekst":"Dat is, welstand en gelukzaligheid, naar ziel en lichaam, gelijk boven vs.2. De zin is, dat deze door de wijsheid verkregen wordt."}],"18":[{"catchword":"Zij","tekst":"Te weten, de wijsheid. Zie boven vs.13."},{"catchword":"is een boom","tekst":"Dat is, als een boom des levens, gevende het leven en de volle genoegzaamheid dengenen, die van hare vruchten eten, dat is, die hare onderwijzing ontvangen. Vergelijk Gen 2:9 , en Gen 3:22 ; idem onder Pro 11:30 , en Pro 13:12 , en Pro 15:4 ."}],"19":[{"catchword":"bereid","tekst":"Dat is, sierlijk opgeschikt, heerlijk toegemaakt en ordelijk samengepast. Alzo is het Hebreeuwse woord genomen Job 31:15 ."}],"20":[{"catchword":"afgronden","tekst":"Versta, zeeën, en voorts fonteinen, waterwellen, rivieren en allerlei soorten van stromen, die uit de diepte der aarde, als met derzelver verscheuring uitborrelen en voortkomen."}],"21":[{"catchword":"laat ze niet","tekst":"Te weten, de wijsheid, verstandigheid en wetenschap, van welke in vs.19,20 gesproken is. Anders: de wet en de geboden; waarvan zie vs.1."},{"catchword":"de bestendige","tekst":"Zie van het Hebreeuwse woord Job 5:12 , en boven Pro 2:7 ."},{"catchword":"bedachtzaamheid","tekst":"Zie boven Pro 1:4 ."}],"22":[{"catchword":"zullen","tekst":"Dat is, uwe ziel het leven toebrengen."},{"catchword":"aangenaamheid","tekst":"Dat is, een versiersel, dat u zal aangenaam maken voor God en alle vromen. Vergelijk boven Pro 1:9 , en de aantekening."}],"23":[{"catchword":"uw weg","tekst":"Dat is, in uw voornemen, doen en laten, vast gaan; alzo onder Pro 10:9 , en vergelijk onder Pro 28:18 ; Isa 40:31 ."},{"catchword":"uw voet","tekst":"Dat is, in het gevaar niet vallen van uzelven te beschadigen. Anders: uw voet zal zich niet stoten. Vergelijk Psa 91:12 , voet voor den mens zelf; alzo Psa 31:9 , onder Pro 7:11 ; Isa 52:7 ."}],"24":[{"catchword":"nederligt,","tekst":"Te weten, om te slapen."}],"25":[{"catchword":"Vrees niet","tekst":"Het is een bevel, inhoudende ene belofte, gelijk boven vs.3,4; idem, Pro 4:4 , en Pro 7:2 , en Pro 9:6 . Zie Psa 37:3 . Daarom vertalen sommigen deze woorden aldus: Gij zult niet vrezen voor een haastige verschrikking, enz., maar de overzetting, die in den tekst is, komt met het Hebreeuwse woord al beter overeen. De zin is dat de liefhebbers de wijsheid niet zullen behoeven te vrezen voor, enz."},{"catchword":"voor haastigen schrik,","tekst":"Hebreeuws, van schrik haastelijk; dat is, die haastig is, of onverwacht komt; alzo onder Pro 15:24 , van de hel, of het graf onder, of beneden; dat is dat onder of nederwaarts is."},{"catchword":"verwoesting","tekst":"Zie Psa 35:8 , en boven Pro 1:27 ."},{"catchword":"der goddelozen,","tekst":"Dat is, die de goddelozen onder de vromen zoeken aan te richten; of liever: die den goddelozen door Gods rechtvaardig oordeel overkomen zal."}],"26":[{"catchword":"zal met uw","tekst":"Dat is, Hij zal zich bij u, als gij op Hem hoopt, vinden laten om uwe hoop, waardoor gij op zijne hulp wacht, niet ijdel te laten wezen. Anders: zal u tot hoop wezen."},{"catchword":"hoop wezen,","tekst":"Zie het Hebreeuwse woord zo genomen, Job 4:6 en de aantekening."},{"catchword":"van gevangen","tekst":"Hebreeuws, van den vang; te weten, waardoor gij in het geweld der goddelozen zoudt mogen komen en van die verdrukt worden."}],"27":[{"catchword":"Onthoud","tekst":"Dit is een algemene spreuk, verbiedende het weldoen aan iemand na te laten of te verhinderen."},{"catchword":"het goed","tekst":"Versta, het lichamelijke of geestelijke goed."},{"catchword":"zijn meesters","tekst":"Versta door dezen, dien men enig goed schuldig is, òf naar de burgerlijke, òf naar de goddelijke en natuurlijke wet. De burgerlijke wet is, dat men een ander moet geven wat hem toekomt, uit kracht van samenhandeling; de goddelijke en natuurlijke, dat men geven moet uit plicht van de algemene liefde en mededogendheid. Vervolgens zijn hier door het woord meesters ook de armen te verstaan, overmits de rijken hun als rentmeesters en uitdelers van God gegeven zijn, om hun van hunne middelen mede te delen; ten welken anzien de aalmoezen gerechtigheid genaamd worden; Dan 4:27 ."},{"catchword":"als het in het vermogen","tekst":"Dat is, als God u het middel heeft gegeven, òf in het burgerlijke om uwen naasten te voldoen, òf in het goddelijke en natuurlijke om den armen wel te doen. De zin is dat beide die plichten in zulke gelegenheid niet moeten uitgesteld worden. Anders: Ofschoon het in het vermogen uwer hand ware dat te doen; te weten, iemand, hetgeen hem toekomt te onthouden."}],"28":[{"catchword":"ik geven,","tekst":"Namelijk, wat gij hem enigszins schuldig zijt, en wat hij van u begeert en gans van node heeft; Lev 19:13 ; Deu 24:14 ; idem, Gal 6:18 ; Jam 2:15-16 ."}],"29":[{"catchword":"Smeed","tekst":"Het Hebreeuwse woord betekent hier iets stilzwijgend en heimelijk bedenken, voorhebben en praktiseren; hetwelk òf in het kwade, òf in het goede kan gezegd worden. Hier is het te nemen in het kwade, gelijk ook onder Pro 6:14 , Pro 6:18 , elders ook in het goede; gelijk Pro 14:22 ."},{"catchword":"met vertrouwen","tekst":"Dat is, gerustelijk en zonder enig kwaad nadenken van u te hebben. Anders: op trouw."}],"30":[{"catchword":"Twist","tekst":"Te weten, noch in het gericht, noch buiten hetzelve."},{"catchword":"zo hij u geen kwaad","tekst":"Want zo hij dat gedaan heeft, is het geoorloofd zijn rechte te vervolgen door middel der overheid, of hem tot schuldbekentenis te brengen door den kerkeraad of andere private vermaning, en dat zonder wraakgierigheid en lastering; Exo 22:8 ; Mat 18:15-17 ; 1Co 6:4 ; Eph 4:26 ."}],"31":[{"catchword":"Wees niet nijdig","tekst":"Zie Psa 37:1 ."},{"catchword":"man des gewelds,","tekst":"Dat is, die met geweld omgaat en overlast pleegt, en daardoor groot, rijk en verheven wordt. Zie van deze manier van spreken 2Sa 22:49 ; Job 11:11 , en Psa 5:7 ."},{"catchword":"geen van zijn wegen","tekst":"Hebreeuws, niet al zijne wegen; dat is, geen derzelve. Zie 1Ki 11:34 ."}],"32":[{"catchword":"afwijker","tekst":"Dat is, die afwijkt van den rechten weg."},{"catchword":"is den HEERE","tekst":"Hebreeuws, is des Heeren gruwel; dat is, dien God voor een gruwel houdt. Alzo onder Pro 11:1 , Pro 11:20 , en Pro 12:22 , en Pro 15:9 , en Pro 16:5 , enz. Zie Deu 17:1 . Elders wordt iets gezegd te zijn een gruwel voor het aangezicht des Heeren; Deu 24:4 ; of, een gruwel den Heere, Isa 1:13 . De zin is enerlei; alzo een gruwel is den mens; onder Pro 24:9 ."},{"catchword":"verborgenheid","tekst":"Dat is, zijn allerdiepste genade en goedwilligheid in den Messias. Zie Psa 25:14 ."}],"34":[{"catchword":"Zekerlijk,","tekst":"Anders: zo Hij de spotters bespot, Hij zal ook den zachtmoedigen genade geven."},{"catchword":"zachtmoedigen","tekst":"Zie Psa 22:27 ."}],"35":[{"catchword":"neemt schande","tekst":"Dat is, neemt de schande voor zijn deel mede. Of, de schande neemt de dwazen weg; dat is, maakt hen en al hunne verwachting teniet. Of, schande verhoogt de zotten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"My son, forget not my law: [Or, doctrine: to wit, which I teach thee, and instruct thee in, namely, how to order thy life and conversation aright. See above chap.1.on verse 8.] but let thine heart keep my commandments."}],"2":[{"catchword":null,"tekst":"For they shall increase [So below chapter 9.11. Hebrew properly add, which is here as much as multiply] unto thee length of days, and years of life, [that is, a great age, and a long life, or a life of many years. So Deu 30:20. Job 12:12. Psalm.21.5. and 91.16. below verse 16. And 4.10. and 9.11.] and peace. [that is, prosperity both in soul and body: See Genesis 37.on ver.14.]"}],"3":[{"catchword":null,"tekst":"Let not mercy and faithfulness forsake thee; [This may be understood of the mercy and truth of God; so that it is a command exhorting a man to cleave close thereunto, with a promise that he shall keep and preserve them. See below on verse 25. Others understand it of the bounty and faithfulness, which every one ought to shew unto his neighbour] bind them [to wit, the commandments of God, whereof is spoken in the first verse: or, mercy and faithfulness, that is, the promises of God concerning them] about thy neck, [to wit, as an ornament, or chain, as above chap.1.9. and to have them always before thine eyes, and in thy sight. See below ver.21. and 6.21. and compare Exo 13:9. Deut.6.8.] write them upon the table of thine heart. [that is, imprint them deep in the innermost part of thine understanding, that they may never slip out of thy memory. So below chap.7.3. Jer 17:1. 2 Cor.chap.3.3.]"}],"4":[{"catchword":null,"tekst":"And find favour, [Or, grace; that is, acceptation or acceptableness, whereby a man is acceptable and pleasing unto others; so Gen 39:21. Psa 46:3. above chap.1.9. below chap.11.16. and 22.verse 11 Eccl.10.12. Luk 2:52.] and good understanding [of understanding, see above chap.1.on verse 3.] in the eyes of God, and men. [&acirc;&euro;&tilde;Tis again a command, containing in it also a strong and earnest promise, as in the beginning of the former verse. The command is, labour to find grace, &c. The promise is, Thou shalt be acceptable both to God and good men, and have sound knowledge to live well.]"}],"5":[{"catchword":null,"tekst":"Trust in the LORD with all thine heart; [Compare Deut.6.5. and 1 Kings 2.4. and the annot.] and lean not unto thine (own) understanding."}],"6":[{"catchword":null,"tekst":"Acknowledge him in all thy ways: [That is, in all that thou intendeth, understakest, speakest, doest, and omittest. See Gen.6.on verse 12. In the same sense is the word paths presently taken in this verse] and he shall make thy paths strait. [That is, direct them according to his law, and lead thee right according unto it, that thou maist at length attain unto the desired end of thy life. Compare below chap.11.5. and 15.21.]"}],"7":[{"catchword":null,"tekst":"Be not wise in thine (own) eyes: [That is, in thine own conceit, and judgement. See Lev.13.on ver.3. and Job 18.on ver.3. Rom 12:16.] fear the LORD, and depart from evil:"}],"8":[{"catchword":null,"tekst":"It shall be physic for thy navel, [it&acirc;&euro;&trade;s a phrase, by way of similitude, borrowed from young children, whose navels must be handled and dealt with, with singular care and prudence: and also from grown persons, that are weak and feeble in that are weak and feeble in that part of the body, and oftentimes have need of physic to be applied thereunto. The meaning is, that those that have the fear of God, shall, in respect of the spiritual life of the soul, be in very good health, and enjoy perfect strength] and moistening for thy bones. [Its another similitude borrowed from the bones in a mans body, which must be filled with good marrow to preserve the strength and vigour in man: So hath the soul likewise its strength and vigour from the knowledge and fear of the Lord. Compare Job 21:24.]"}],"9":[{"catchword":null,"tekst":"Honour the LORD with thy substance [Honour him, to wit, in his Ministers, the Priests, and Levites: also in the widows, the fatherless, and the poor, by communicating unto them of thy means, Exo 23:19. and 34.36. Deut.26.2. &c. Mal.3.10. Luk 14:13.] and with the first-fruits of all thine increase. [See of these, Exodus. Chapter 22.verse 29.30. Levit.2.12. and 23.17.]"}],"10":[{"catchword":null,"tekst":"So shall thy barns be filled with plenty; [Hebr. Satiety; that is, with plenty of fruits, whereby men may be satisfied and filled. See Gen 41:29. and the annotate. Also, Eccl.5.11. Compare Deut.28.8.] and thy press-fats run over [Hebr. Break asunder with new wine.]"}],"11":[{"catchword":null,"tekst":"My son, reject not discipline [This word signifieth indeed the teaching or instruction, which is done in, or by words, but is here also taken for actual chastening or punishing. See below chap.7.on verse 22. So likewise the Hebrew Verb translated , rebuking, below chap.9.7. see the annotate.] of the LORD: neither be weary of his chastising: [this word is also not onely taken for Verbal punishment or reproof, such as is done by words, as below chap.15.31,32. And 28.23. but also for actual punishment, by blows, or plagues, or scourges, as here, and Psa 73:14. and 149.7. Hos 5:9. So the Verb. Reprove, Psa 6:2.]"}],"12":[{"catchword":null,"tekst":"For the LORD chasteneth the man whom he loveth, [Compare Rev 3:19.] yea as a father the son in whom he hath a delight. [See of the signification of the Hebrew word, 2 Sam.24.on verse 23.]"}],"13":[{"catchword":null,"tekst":"Happy is the man, (that) findeth wisdom: [Heb. (that) hath found, &c. That is, that findeth continually: therefore also the following Verb in the Original is put in the Future Tense. The word finding seemeth to relate to the seeking and searching after wisdom, whereof mention is made above chap.2.4. see the annot.] and the man, (that) bringeth for the [or, fetcheth out, to wit, as out of an hidden place, and consequently obtaineth it with great labour and pains] understanding."}],"14":[{"catchword":null,"tekst":"For the merchandise of it [That is, the ware, or the commodity that is to be found with wisdom; so is 23.18. Oth. Managing, or, handling; that is, searching after it, whereby it is sought, found, and obtained] is better then the merchandise of silver, [compare Job28. 15. Psa 19:10. Pro 8:11,19. And 16.16. Oth. Ordering, or, managing of silver is gotten and obtained] and the increase thereof then gold digged out. [meaning very fine gold, perhaps so called, because it&acirc;&euro;&trade;s digg&acirc;&euro;&trade;d out of the ground. The same name is used, Psa 68:14. below chap.8.10,19. And 16.16. Zach.9,3.]"}],"15":[{"catchword":null,"tekst":"She is more precious then rubies; [See Job 28.on verse 18.] and whatsoever thou canst delight in, is not be compared unto her: that is, whatsoever thou canst wish or desire, is not of such worth and value, as that it should be able to be compared with wisdom. So below chap.8.11.]"}],"16":[{"catchword":null,"tekst":"Length of days [See above on verse 2.] is in her right hand; in her left hand, riches and honour. [Wisdom is here compared to a woman, that in great plenty divideth all manner of goods to those that follow, and obey her. Under temporal goods are comprehended also those that are eternal.]"}],"17":[{"catchword":null,"tekst":"Her ways [That is, whatsoever she prescribeth to believe, and to do. Understand also in like manner the following word paths] are ways of pleasantness, and all her paths peace. [that is, prosperity and happiness, both in soul and body; as above verse 2. The meaning is, that this is obtained by wisdom.]"}],"18":[{"catchword":null,"tekst":"She [To wit, wisdom; see above verse 13.] is a tree of life to them that lay hold upon her; [that is, as a tree life, giving life, and full contentment or satisfaction to them that eat of her fruits, that is, that receive her instruction. Compare Gen 2:9. and 3.22. also below chap.11.30. and 13.12. and 15.4.] and every one that holdeth her fast, is happy."}],"19":[{"catchword":null,"tekst":"The LORD by wisdom hath founded the earth, by understanding hath prepared [that is, beautifully adorned, gloriously sitted, and orderly composed and joined together. So is the Hebrew word taketh, Job 31:15.] the Heavens."}],"20":[{"catchword":null,"tekst":"By his knowledge the depths are cloven, [Meaning the seas, and consequently the fountains, springs, rivers, and all sorts of streams, that issue and spread out of the depth and bottom of the earth, as it were by the renting thereof in twain. Compare Gen 1:9,10.] and the clouds drop (down) dew."}],"21":[{"catchword":null,"tekst":"My son, let not them [To wit, wisdom, understanding, and knowledge, whereof is spoken in the two former verses. Oth. The Law, and the commandments, of which see verse 1. Of this chapter] depart from thine eyes: keep the durable wisdom [see of the Hebr. Word Job 5.on verse 12. And abo.chap.2.on verse 7.] and discretion. [See above chap.1.on verse 4.]"}],"22":[{"catchword":null,"tekst":"For they shall be life for thy soul; [That is, bring life to thy neck. [that is, an ornament, which will make thee gracious and acceptable both in the fight of God, and of all good men. Compare above chap.1.9. and the annot.]"}],"23":[{"catchword":null,"tekst":"Then shalt thou walk (in) thy way safety: [That is, go sure in thy intention, doing, and omitting. So below chap.10.9. and compare Psa 37:24. and 91.11,12. Below chap.28.18. Isa.chap.40.31.] and thou shalt not dash thy foot. [that is, thou shalt not come into danger, so as to hurt thy self. Oth. And thy foot shall not dash it self, or, stumble. Compare Psa 91:12. Foot is taken for the man himself. So Psa 31:9. below chap.7.11. Isa 52:7.]"}],"24":[{"catchword":null,"tekst":"If thou liest down, [To wit, to sleep, or, rest] thou shalt not be afraid; but thou shalt lie down, and thy sleep shall be sweet. [Compare Lev.26.6. Job 11:19. Psa 3:6. and 4.9.]"}],"25":[{"catchword":null,"tekst":"Be not afraid of sudden terror, [&acirc;&euro;&tilde;Tis a Commandment, containing in it a promise, as above verse 3,4. Also below chap.4.4. and 7.2. and 9.6. see Psal.37.on verse 3. Therefore some render these words thus: Thou shalt not be afraid of sudden terror, &c. But with the translation, that is in the text, doth the Hebrew particle all, or, any, better agree. The meaning is, that the lovers of wisdom shall not need to fear, or be afraid of, &c. Hebr. Of terror suddenly; that is, which is sudden, or cometh unwares, and unexpected. So below ch.15.24. from hell, or the grave below, or beneath; that is, which is below, or beneath] neither of the desolation [see Psalm 35.on verse 8. And above chap.1.on verse 27.] of the wicked seek to raise or effect among the godly: or rather, which shall come upon the wicked by the just judgement of God] when it cometh."}],"26":[{"catchword":null,"tekst":"For the LORD shall be with thine hope: [That is, he will be found of thee, when thou hopest in him, that thy hope, whereby thou waitest on his help, may not be in vain. Oth. Shall be thine hope. Of the word hope, see the Hebrew word so taken, Job 4:6. and the annot.] and he shall keep thy foot from being taken. [Hebr. From taking: To wit, whereby thou mightiest come into the hand and power of the wicked, and be oppressed by them.]"}],"27":[{"catchword":null,"tekst":"Withhold not good [Meaning, either corporal, or spiritual good] from the masters (or owners) thereof, [understand by these, those to whom we owed any thing that is good, either according to the Civil Law, or according to the Divine and Natural Law. The Civil Law is, that we should give to others, that which belongeth to them, by virtue of commerce or trading one with another. The Divine, and Natural, or Moral Law is, that we should give unto others, by virtue of our duty of love and compassion, which we owe unto them in general. Consequently by the word masters, or owners, the poor are here also to be understood, because the rich are given unto them by God as Stewards, and Dispensers, to communicate unto them, and to make them sharers of their means. In which respect alms or almsdeeds are called righteousness, Dan.4.27.] when it is in the power of thine hand to do (it). [that is, when God hath given the means and ability, either in Civils, to content and satisfy thy neighbour, or in Divine and Naturals, to do good unto poor, and to relieve them in their wants and necessities. The meaning is, that both those duties in such a case may not be delayed. Oth. Although it were in the power of thine hand to do it; to wit, to withhold from any man that which is his due, or belongeth unto him. That which is delivered in this, and the following verse, is a general proverb, forbidding the neglect, or hindering of doing good unto others.]"}],"28":[{"catchword":null,"tekst":"Say not unto thy neighbour; Go thy ways, and come again, and tomorrow I will give; [Namely, that which thou in a manner owest him, and which he asketh and craveth of thee, and hath greatly need of: compare Lev.19.13. Deut.24.14. also Gal 6:10. Jas 2:15,16.] seeing it is with thee."}],"29":[{"catchword":null,"tekst":"Forge not evil against neighbour, [The Hebrew word rendered here forge, signifieth to devise, intend and promise a thing closely and secretly; which may be said to be done either in a bad, or a in good sense. Here its taken in a bad sense, as also below chap.6.14,18. Elsewhere it is also taken in a good sense, as below chap.14.verse 22.] seeing he dwelleth with confidence [That is, securely, without having any mistrust, or evil suspicion of thee. Oth.in truth, or, fidelity] by thee."}],"30":[{"catchword":null,"tekst":"Strive not with a man without cause; [To wit, neither in judgement, nor elsewhere beside] if he have done thee no harm. [for if he have done so, it is then lawful for a man to vindicate his own right; either by the means of the Magistrate, or to bring him to an acknowledgement of his fault by the Ecclesiastical power, or other private admonition, and that without desire of revenge, and scandal, Exod.22.verse 8. Mat 18:15,16,17. 1 Cor.6.4. Eph.4.26."}],"31":[{"catchword":null,"tekst":"Be not envious [See Psalm 37.on verse 1.] against a man of violence: [That is, that useth violence, and practiseth oppression, and thereby becometh great, rich, and mighty. See of this phrase, 2 Sam.22.49. Job 11.on verse 11. And Psalm 5.on verse 7. Compare Psalm 37,1. And 73.3. above chap.23.17.] and choose none of his ways. [Hebr. Not all his ways; that is, none of them. See 1 Kings 11.on verse 34.]"}],"32":[{"catchword":null,"tekst":"For the revolter [That is, he that revolteth or departeth from the right way] is an abomination unto the LORD: [Hebr. Is the Lords abomination; that is, whom God esteemeth as an abomination. So below ch.11.1.20. and 12.22. and 15.9. and 16.5, &c. See Deut.17.on verse 1. Elsewhere a thing is said to be an abomination unto the LORD, Isa.1.verse 13. The sense or meaning is one and the same: so is an abomination to man, below chap.24.9.] but his secret [that is, his deepest mercy, and good will in the Messiah. See .Ps.25.on verse 14.] is with the upright. [Compare 25.14.]"}],"33":[{"catchword":null,"tekst":"The curse of the LORD is in the house of the wicked: [Compare Lev.26.14. etc. Deuter.28.15.etc. Mal.2.2.] but he will bless the habitation of the righteous."}],"34":[{"catchword":null,"tekst":"Surely he will scorn the scorners: but he will give grace unto the meek. [Oth. If he scorneth the scorners, he will also give grace unto the meek. Compare Jam.4.6. 1 Pet.5.5. Of the word meek, see Psalm 22.on verse 27.]"}],"35":[{"catchword":null,"tekst":"The wise shall inherit honour; but every one of the fools taketh shame upon himself, [that is, taketh shame with him for his portion: or, shame taketh fools away; that is, frustrateth them and all their expectation; or, shame exalteth fools.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
