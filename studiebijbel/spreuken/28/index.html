ijpen alles.","6":"De arme, die in zijn oprechtheid wandelt, is beter dan wie verkeerd is van wegen, al is hij rijk.","7":"Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.","8":"Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.","9":"Wie zijn oor afwendt van het horen van de wet, diens gebed zelfs zal een gruwel zijn.","10":"Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.","11":"Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.","12":"Als de rechtvaardigen opspringen van vreugde, is er grote heerlijkheid; maar als de goddelozen opkomen, wordt de mens angstvallig gezocht.","13":"Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.","14":"Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.","15":"De goddeloze, heersend over een arm volk, is een brullende leeuw, en een beer, die heen en weer rondloopt.","16":"Een vorst, die alle verstand mist, is ook zeer onderdrukkend; maar wie de hebzucht haat, zal de dagen verlengen.","17":"Een mens, gedrukt door het bloed van iemand, zal naar de kuil toevluchten; men houde hem niet tegen!","18":"Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.","19":"Wie zijn land bouwt, zal met brood verzadigd worden; maar wie nietige mensen volgt, zal met armoede verzadigd worden.","20":"Een geheel getrouw man zal overvloedig zijn in zegeningen; maar wie zich haast om rijk te worden, zal niet onschuldig blijven.","21":"Personen aanzien is niet goed; want een man zal om een stuk brood overtreden.","22":"Wie zich haast naar rijkdom, is een man met een boosaardig oog; maar hij weet niet dat het gebrek hem zal overkomen.","23":"Wie een mens bestraft, zal daarna meer gunst vinden dan wie met de tong vleit.","24":"Wie zijn vader of zijn moeder berooft, en zegt: Het is geen overtreding; die is de metgezel van een verwoestend man.","25":"Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.","26":"Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.","27":"Wie de arme geeft, zal geen gebrek hebben; maar wie zijn ogen verbergt, zal veel vervloekt worden.","28":"Als de goddelozen opkomen, verbergt de mens zich; maar als zij omkomen, worden de rechtvaardigen talrijker."},"SV":{"1":"De goddelozen vlieden, waar geen vervolger is; maar elk rechtvaardige is moedig, als een jonge leeuw.","2":"Om de overtreding des lands zijn deszelfs vorsten vele; maar om verstandige *en* wetende mensen zal insgelijks verlenging wezen.","3":"Een arm man, die de geringen verdrukt, is een wegvagende regen, zodat er geen brood zij.","4":"Die de wet verlaten, prijzen de goddelozen; maar die de wet bewaren, mengen zich *in* *strijd* tegen hen.","5":"De kwade lieden verstaan het recht niet; maar die den HEERE zoeken, verstaan alles.","6":"De arme, wandelende in zijn oprechtheid, is beter, dan die verkeerd is van wegen, al is hij rijk.","7":"Die de wet bewaart, is een verstandig zoon; maar die der vraten metgezel is, beschaamt zijn vader.","8":"Die zijn goed vermeerdert met woeker en met overwinst, vergadert dat voor dengene, die zich des armen ontfermt.","9":"Die zijn oor afwendt van de wet te horen, diens gebed zelfs zal een gruwel zijn.","10":"Die de oprechten doet dwalen op een kwaden weg, zal zelf in zijn gracht vallen; maar de vromen zullen het goede beërven.","11":"Een rijk man is wijs in zijn ogen; maar de arme, die verstandig is, doorzoekt hem.","12":"Als de rechtvaardigen opspringen van vreugde, is er grote heerlijkheid; maar als de goddelozen opkomen, wordt de mens nauw gezocht.","13":"Die zijn overtredingen bedekt, zal niet voorspoedig zijn; maar die ze bekent en laat, zal barmhartigheid verkrijgen.","14":"Welgelukzalig is de mens, die geduriglijk vreest; maar die zijn hart verhardt, zal in het kwaad vallen.","15":"De goddeloze, heersende over een arm volk, is een brullende leeuw, en een beer, die ginds en weder loopt.","16":"Een vorst, die van alle verstand gebrek heeft, is ook veelvoudig in verdrukkingen; *maar* die de gierigheid haat, zal de dagen verlengen.","17":"Een mens, gedrukt om het bloed ener ziel, zal naar den kuil toevlieden; men ondersteune hem niet!","18":"Die oprecht wandelt, zal behouden worden; maar die zich verkeerdelijk gedraagt in twee wegen, zal in den enen vallen.","19":"Die zijn land bouwt, zal met brood verzadigd worden; maar die ijdele *mensen* volgt, zal met armoede verzadigd worden.","20":"Een gans getrouw man zal veelvoudig zijn in zegeningen; maar die haastig is, om rijk te worden, zal niet onschuldig wezen.","21":"De aangezichten te kennen, is niet goed; want een man zal om een stuk broods overtreden.","22":"Die zich haast naar goed, is een man van een boos oog; maar hij weet niet, dat het gebrek hem overkomen zal.","23":"Die een mens bestraft, zal achterna gunst vinden, meer dan die met de tong vleit.","24":"Wie zijn vader of zijn moeder berooft, en zegt: Het is geen overtreding; die is des verdervenden mans gezel.","25":"Die grootmoedig is, verwekt gekijf; maar die op den HEERE vertrouwt, zal vet worden.","26":"Die op zijn hart vertrouwt, die is een zot; maar die in wijsheid wandelt, die zal ontkomen.","27":"Die den armen geeft, zal geen gebrek hebben; maar die zijn ogen verbergt, zal veel vervloekt worden.","28":"Als de goddelozen opkomen, verbergt zich de mens; maar als zij omkomen, vermenigvuldigen de rechtvaardigen."},"KJV":{"1":"The wicked flee when no man pursueth: but the righteous are bold as a lion.","2":"For the transgression of a land many *are* the princes thereof: but by a man of understanding *and* knowledge the state *thereof* shall be prolonged.","3":"A poor man that oppresseth the poor *is like* a sweeping rain which leaveth no food.","4":"They that forsake the law praise the wicked: but such as keep the law contend","5":"Evil men understand not judgment: but they that seek the LORD understand","6":"Better *is* the poor that walketh in his uprightness, than *he that is* perverse *in his* ways, though he *be* rich.","7":"Whoso keepeth the law *is* a wise son: but he that is a companion of riotous *men* shameth his father.","8":"He that by usury and unjust gain increaseth his substance, he shall gather it for him that will pity the poor.","9":"He that turneth away his ear from hearing the law, even his prayer *shall be* abomination.","10":"Whoso causeth the righteous to go astray in an evil way, he shall fall himself into his own pit: but the upright shall have good *things* in possession.","11":"The rich man *is* wise in his own conceit; but the poor that hath understanding searcheth him out.","12":"When righteous *men* do rejoice, *there is* great glory: but when the wicked rise, a man is hidden.","13":"He that covereth his sins shall not prosper: but whoso confesseth and forsaketh *them* shall have mercy.","14":"Happy *is* the man that feareth alway: but he that hardeneth his heart shall fall into mischief.","15":"*As* a roaring lion, and a ranging bear; *so is* a wicked ruler over the poor people.","16":"The prince that wanteth understanding *is* also a great oppressor: *but* he that hateth covetousness shall prolong *his* days.","17":"A man that doeth violence to the blood of *any* person shall flee to the pit; let no man stay","18":"Whoso walketh uprightly shall be saved: but *he that is* perverse *in his* ways shall fall at once.","19":"He that tilleth his land shall have plenty of bread: but he that followeth after vain *persons* shall have poverty enough.","20":"A faithful man shall abound with blessings: but he that maketh haste to be rich shall not be innocent.","21":"To have respect of persons *is* not good: for for a piece of bread *that* man will transgress.","22":"He that hasteth to be rich *hath* an evil eye, and considereth not that poverty shall come","23":"He that rebuketh a man afterwards shall find more favour than he that flattereth with the tongue.","24":"Whoso robbeth his father or his mother, and saith, *It is* no transgression; the same *is* the companion of a destroyer.","25":"He that is of a proud heart stirreth up strife: but he that putteth his trust in the LORD shall be made fat.","26":"He that trusteth in his own heart is a fool: but whoso walketh wisely, he shall be delivered.","27":"He that giveth unto the poor shall not lack: but he that hideth his eyes shall have many a curse.","28":"When the wicked rise, men hide themselves: but when they perish, the righteous increase."}},"tsk":{"1":[{"kopje":"goddelozen","refs":["Lev 26:17","Lev 26:36","Deut 28:7","Deut 28:25","2 Kon 7:6","2 Kon 7:7","2 Kon 7:15","Ps 53:6","Jes 7:2","Jer 20:4"]},{"kopje":"elke rechtvaardige","refs":["Ex 11:8","Ps 27:1","Ps 27:2","Ps 46:3","Ps 46:4","Ps 112:7","Jes 26:3","Jes 26:4","Dan 3:16-18","Dan 6:11","Dan 6:12","Hand 4:13","Hand 14:3","1 Tess 2:2"]}],"2":[{"kopje":"de overtreding","refs":["1 Kon 15:25","1 Kon 15:28","1 Kon 16:8-29","2 Kon 15:8-31","2 Kron 36:1-12","Jes 3:1-7","Hos 13:11"]},{"kopje":"maar","refs":["Gen 45:5-8","2 Kron 32:20-26","Job 22:28-30","Pred 9:15","Jes 58:12","Dan 4:27"]}],"3":[{"kopje":"arme man","refs":["Matt 18:28-30"]}],"4":[{"kopje":"dat","refs":["1 Sam 23:19-21","Ps 10:3","Ps 49:19","Jer 5:30","Matt 3:15","Hand 12:22","Hand 24:2-4","Rom 1:32","1 Joh 4:5"]},{"kopje":"maar","refs":["1 Sam 15:14-24","1 Sam 22:14","1 Sam 22:15","1 Kon 18:18","1 Kon 18:21","1 Kon 20:41","1 Kon 20:42","1 Kon 21:19","1 Kon 21:20","1 Kon 22:19-28","2 Kon 3:13","2 Kon 3:14","Neh 5:7-13","Neh 13:8-11","Neh 13:17-20","Neh 13:23-26","Neh 13:28","Matt 3:7","Matt 14:4","Hand 15:2","Hand 19:9","Gal 2:3-6","Ef 5:11","1 Tess 2:2","Judas 1:3"]}],"7":[{"kopje":"bewaart","ref pan> <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> is also a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4642\">oppressor:</span> but he that <span class=\"wl wl-kjv\" data-code=\"H8130\">hateth</span> <span class=\"wl wl-kjv\" data-code=\"H1215\">covetousness</span> shall <span class=\"wl wl-kjv\" data-code=\"H748\">prolong</span> his days.","17":"A <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that doeth <span class=\"wl wl-kjv\" data-code=\"H6231\">violence</span> to the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of any <span class=\"wl wl-kjv\" data-code=\"H5315\">person</span> shall <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> to the <span class=\"wl wl-kjv\" data-code=\"H953\">pit;</span> let no man stay","18":"Whoso <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> <span class=\"wl wl-kjv\" data-code=\"H8549\">uprightly</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3467\">saved:</span> but he that is <span class=\"wl wl-kjv\" data-code=\"H6140\">perverse</span> in his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> at once.","19":"He that <span class=\"wl wl-kjv\" data-code=\"H5647\">tilleth</span> his <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> shall have <span class=\"wl wl-kjv\" data-code=\"H7646\">plenty</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread:</span> but he that <span class=\"wl wl-kjv\" data-code=\"H7291\">followeth</span> after <span class=\"wl wl-kjv\" data-code=\"H7386\">vain</span> persons shall have poverty enough.","20":"A <span class=\"wl wl-kjv\" data-code=\"H530\">faithful</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H7227\">abound</span> with <span class=\"wl wl-kjv\" data-code=\"H1293\">blessings:</span> but he that maketh <span class=\"wl wl-kjv\" data-code=\"H213\">haste</span> to be <span class=\"wl wl-kjv\" data-code=\"H6238\">rich</span> shall not be innocent.","21":"To have <span class=\"wl wl-kjv\" data-code=\"H5234\">respect</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">persons</span> is not <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> for for a <span class=\"wl wl-kjv\" data-code=\"H6595\">piece</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> that <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> will transgress.","22":"<span class=\"wl wl-kjv\" data-code=\"H376\">He</span> that <span class=\"wl wl-kjv\" data-code=\"H926\">hasteth</span> to be <span class=\"wl wl-kjv\" data-code=\"H1952\">rich</span> hath an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eye,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">considereth</span> not that <span class=\"wl wl-kjv\" data-code=\"H2639\">poverty</span> shall come","23":"He that <span class=\"wl wl-kjv\" data-code=\"H3198\">rebuketh</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H310\">afterwards</span> shall <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> more <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> than he that <span class=\"wl wl-kjv\" data-code=\"H2505\">flattereth</span> with the tongue.","24":"Whoso <span class=\"wl wl-kjv\" data-code=\"H1497\">robbeth</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> or his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> It is no <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression;</span> the same is the <span class=\"wl wl-kjv\" data-code=\"H2270\">companion</span> of a <span class=\"wl wl-kjv\" data-code=\"H376\">destroyer.</span>","25":"He that is of a <span class=\"wl wl-kjv\" data-code=\"H7342\">proud</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">heart</span> stirreth <span class=\"wl wl-kjv\" data-code=\"H1624\">up</span> <span class=\"wl wl-kjv\" data-code=\"H4066\">strife:</span> but he that putteth his <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be made fat.","26":"He that <span class=\"wl wl-kjv\" data-code=\"H982\">trusteth</span> in his own <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is a <span class=\"wl wl-kjv\" data-code=\"H3684\">fool:</span> but whoso <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisely,</span> he shall be delivered.","27":"He that <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7326\">poor</span> shall not <span class=\"wl wl-kjv\" data-code=\"H4270\">lack:</span> but he that <span class=\"wl wl-kjv\" data-code=\"H5956\">hideth</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall have <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> a curse.","28":"When the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">rise,</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> themselves: but when they <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> increase."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"is moedig,","tekst":"Te weten, door het vast vertrouwen, dat zij op den Heere stellen. Anders: de rechtvaardigen zijn als een jonge leeuw [die] moedig is. Hebreeuws, vertrouwt."},{"catchword":"jonge leeuw","tekst":"Die gewoonlijk moediger en onbevreesder is dan een leeuwenwelp, of oudachtige leeuw. Vergelijk boven de aantekening Pro 19:12 ."}],"2":[{"catchword":"overtreding","tekst":"Dat is, de inwoners des lands."},{"catchword":"zijn deszelfs","tekst":"Te weten omdat de ene haast zijn natuurlijken dood sterft, de andere vermoord en uitgeroeid wordt. Zie voorbeelden 1Ki 16 , en 2Ki 24 , enz. Hierdoor komen grote veranderingen in een land, welke den inwoners zeer zorgelijk en schadelijk zijn."},{"catchword":"verlenging","tekst":"Te weten van het leven van een goeden regent en van de goede regering."}],"3":[{"catchword":"arm man,","tekst":"Deze wordt hier voornamelijk genoemd omdat hij meer dan de rijken behoorde medelijden te hebben met de armen, als welker ellende hij mede gevoelt, en omdat de armen het goed, dat zij den armen ontnomen hebben, niet kunnen, gelijk wel de rijken, wedergeven, ja ook omdat zij, behoeftiger zijnde, met weinig verongelijkens dikwijls niet tevreden zijn."},{"catchword":"een wegvagende regen,","tekst":"Versta dit van een regen, die door zijn grootte en gedurigheid een vloed maakt, waardoor het koren met andere granen en vruchten worden nedergeslagen, uitgeroeid en weggesleept; zodat er op het veld geen voorraad van brood en anderen leeftocht overgelaten wordt."}],"4":[{"catchword":"mengen","tekst":"Te weten met de bestraffing van hunne goddeloosheid door woorden en goede wandeling en anderzins, naardat hunne beroeping uitwijst."},{"catchword":"hen","tekst":"Te weten die de wet verlaten."}],"5":[{"catchword":"kwade","tekst":"Hebreeuws, de mannen, of lieden des kwaads; dat is, die het kwaad toegedaan zijn en het bedrijven; zie Job 11:11 ."},{"catchword":"het recht niet;","tekst":"Dat is, hetgeen zij schuldig zijn te geloven, te doen en te laten."},{"catchword":"HEERE zoeken,","tekst":"Zie 2Ch 11:16 ."},{"catchword":"alles","tekst":"Te weten dat hun ter zaligheid nodig is, rakende de zaken des geloofs en des wandels."}],"6":[{"catchword":"wandelende","tekst":"Vergelijk boven Pro 2:7 , en de aantekening."},{"catchword":"verkeerd","tekst":"Vergelijk boven Pro 2:15 ."},{"catchword":"wegen,","tekst":"Het Hebreeuwse woord betekent twee wegen. Het schijnt dat de Heilige Geest alzo spreekt omdat de rechte weg, die in het midden van twee uiterste gebreken gesteld is, van de onvromen verlaten wordt, door niet alleen tot het ene van de twee uiterste gebreken, maar ook dikwijls tot beide af te wijken. Men kan het ook alzo verstaan, dat enige onvromen zich alzo houden, alsof zij vroom waren, en nochtans onvroom wandelen en handelen, hetwelk twee wegen zijn; de ene is zich door woorden en gebaren te gedragen wat men niet is; de andere zich metterdaad te betonen wat men in der waarheid is. Of, twee wegen zijn, zich bij de vromen te veinzen alsof men ook vroom ware, en bij de bozen zich te gedragen als die recht boos is. Vergelijk onder vs.13."}],"7":[{"catchword":"der vraten","tekst":"Zie van deze ook Deu 21:20 , en boven Pro 23:20-21 ; en versta onder hetzelve alle grove overtreders der wet."},{"catchword":"metgezel","tekst":"Dat is, voeder en onderhouder. Hebreeuws, weider. Vergelijk boven Pro 13:20 ."},{"catchword":"beschaamt","tekst":"Zie boven Pro 10:5 . Onder den naam des vaders begrijp ook de moeder. Zie boven Pro 15:20 ."}],"8":[{"catchword":"Woeker . . . overwinst","tekst":"Zie van deze twee woorden Lev 25:36 ."},{"catchword":"vergadert","tekst":"Te weten door de heimelijke beschikking der goddelijke voorzienigheid, zonder dat hij daarop denkt."}],"9":[{"catchword":"wet","tekst":"Te weten Gods."},{"catchword":"een gruwel","tekst":"Te weten Gods. Zie boven Pro 3:32 , en vergelijk boven Pro 15:8 , en Pro 21:27 ."}],"10":[{"catchword":"kwaden weg,","tekst":"Zie boven Pro 2:12 ."},{"catchword":"zijn gracht","tekst":"Te weten die hij voor den rechtzinnige gemaakt had. Zie boven Pro 26:27 ."}],"11":[{"catchword":"doorzoekt","tekst":"Dat is, let op hem [te weten op den rijke], ziende meer op zijn doen en laten dan op den luister zijner rijkdommen, die wijsheid noch deugd kunnen geven."}],"12":[{"catchword":"rechtvaardigen","tekst":"Versta inzonderheid de vrome regeerders van landen en steden."},{"catchword":"opspringen","tekst":"Dat is welvaren, gelukkig zijn, vooruitgaan en bloeien."},{"catchword":"heerlijkheid;","tekst":"Of, sierlijkheid, dat is goede, welgestelde orde in kerkelijke en politieke zaken, trouwe bediening van alle ambten, met allerlei zegen des Heeren."},{"catchword":"wordt de mens","tekst":"Te weten omdat hij zich versteekt en verbergt, uit vrees van vervolging en verdrukking, die de onvrome regeerders aanrichten, bijzonder tegen de rechtvaardigen. Vergelijk onder vs.28."}],"13":[{"catchword":"die ze bekent","tekst":"Te weten voor den Heere, of ook voor de mensen, als de zaak zulks vereist."}],"14":[{"catchword":"die geduriglijk vreest;","tekst":"Dat is die oprecht bekeerd zijnde door ware eerbieding, die hij God toedraagt, Hem vreest te vertoornen, en voor ogen nemende de straffen, die den kwaden bereid zijn, zich in ootmoed en kinderlijke vreze naar de geboden Gods aanstelt, om niet verloren te gaan."},{"catchword":"hart","tekst":"Dat is, zich gans moedwillig aanstelt en tot wederspannigheid overgeeft. Vergelijk Exo 4:21 , en Exo 8:15 , en Exo 32:9 ; 2Ki 17:14 ."}],"15":[{"catchword":"die ginds","tekst":"Te weten van honger, om een roof te krijgen, gelijk van den duivel wordt gezegd; 1Pe 5:8 ."}],"16":[{"catchword":"vorst,","tekst":"Of voorganger, of leidsman, of overste, die het volk voorgaat in het ambt der regering. Zie Neh 11:1 , en de aantekening."},{"catchword":"veelvoudig","tekst":"Dat is, een groot onderdrukker; of doet velerlei overlast aan zijne onderdanen, en is daarom ook zelf Gods straffen en velerlei onderdrukking onderworpen."},{"catchword":"die de gierigheid","tekst":"Of, elkeen; te weten der voorgangers, die het vuil gewin of de gierigheid haten."},{"catchword":"de dagen","tekst":"Te weten, zijns levens; dat is een lang leven hebben door de middelen, daartoe van God verordineerd. Vergelijk boven Pro 3:2 ."}],"17":[{"catchword":"gedrukt","tekst":"Dat is, vervolgd van den bloedwreker en beangst van zijne conscientie. Anders: die geweld heeft gedaan aan het bloed ener ziel; te weten dat hij moedwillig en ten onrechte vergoten heeft."},{"catchword":"bloed","tekst":"Dat is, den doodslag; zie Gen 37:26 ."},{"catchword":"ziel,","tekst":"Dat is, eens mensen. Zie Gen 12:5 ."},{"catchword":"zal naar den kuil","tekst":"Dat is, naar het verderf, of naar zijnen ondergang. Alzo is het woord kuil genomen, Psa 7:16 , en Psa 28:1 , en Psa 30:4 , en Psa 40:3 ."},{"catchword":"toevlieden;","tekst":"Te weten, uit vrees der goddelijke wraak, zodat hij herwaarts en derwaarts de vlucht nemende, onvoorziens in enig verderf vallen zal."},{"catchword":"men ondersteune","tekst":"Anders: laat niemand hem vasthouden; te weten, opdat hij in den kuil immers gerake, waarin hij moet wezen; dat is, niemand zoeke hem te verlossen of te verbergen, of op enige andere manier van de straf vrij te maken."}],"18":[{"catchword":"oprecht","tekst":"Zie boven Pro 2:7 ."},{"catchword":"die zich","tekst":"Zie boven Pro 2:15 , en boven vs.6."},{"catchword":"twee wegen,","tekst":"Zie boven vs.6."},{"catchword":"in den enen","tekst":"Dat is, zal in een van beiden verloren gaan, te weten, hetzij dat hij zich bij de vromen voegt in zijn uiterlijken wandel om hun gelijk te schijnen, of door enigen schijn zich vergezelschapt bij de kwaden om van hunne voordelen te genieten."}],"19":[{"catchword":"die ijdele","tekst":"Zie boven Pro 12:11 ."},{"catchword":"verzadigd","tekst":"Zie Job 7:4 ."}],"20":[{"catchword":"gans","tekst":"Hebreeuws, een man van waarheden, of van getrouwheden. Zie boven Pro 11:17 . Versta een, die waarachtig, oprecht en getrouw in zijn handel is."},{"catchword":"veelvoudig","tekst":"Dat is, zal zeer gezegend worden. God zal hem goeddoen, en de vromen zullen hem goeds toewensen."},{"catchword":"niet onschuldig","tekst":"Dat is, niet zonder nadenken van ongerechtige handelingen, misbruiken en zonden, en daarom ook niet onstrafbaar gehouden worden."}],"21":[{"catchword":"aangezichten","tekst":"Zie Deu 1:17 , en de aantekening. Dit is zoveel als de aangezichten of personen aan te nemen, Lev 19:15 ; zie ook aldaar de aantekening."},{"catchword":"niet goed;","tekst":"Dat is, gans kwaad; zie boven Pro 17:26 ."},{"catchword":"om een stuk broods","tekst":"De zin is: Indien men de personen in het gericht mocht aanzien, de mensen zouden gans geen werk van overtredingen maken; om een stuk broods, [alzo men zegt] ja, om nietmetal zou men grote schelmerij bedrijven."}],"22":[{"catchword":"zich haast","tekst":"Versta ene verhaasting, die met grote beroering en bekommering des geestes verenigd is; gelijk ook het Hebreeuwse woord door beroerd worden overgezet wordt; 2Sa 4:1 , in de aantekening; Job 4:5 , en Job 21:6 , en Job 23:15 ."},{"catchword":"een man","tekst":"Dat is, die een boos oog heeft. Versta, een nijdig, stuurs en gierig mens; zie Deu 15:9 , en boven Pro 23:6 ."},{"catchword":"dat het gebrek","tekst":"Te weten zowel van God, dien hij vergramt door zijne gierigheid en wreedheid, als van de mensen, die hij daarmede beschadigt."}],"23":[{"catchword":"bestraft,","tekst":"Te weten met woorden. Zie boven Pro 15:31 ."},{"catchword":"achterna","tekst":"Te weten als hij, die bestraft is geweest, bevinden en bemerken zal dat de bestraffing hem goed gedaan heeft. Anders: mij navolgende."},{"catchword":"met de tong","tekst":"Vergelijk boven Pro 2:16 , en de aantekening op het woord vleien."}],"24":[{"catchword":"Het is geen overtreding;","tekst":"Alsof hij zeide: Het is gene dieverij, die God in zijne wet verbiedt, overmits het goed mij na hunnen dood toekomt."},{"catchword":"des verdervenden","tekst":"Of, den verdervenden man, of des mans der verderving; dat is, of des moordenaars, omdat hij zijnen vader, of zijne moeder, of beiden, de middelen beneemt, waarmede zij hun leven moeten onderhouden; of des verkwisters en doorbrengers, van wie zie boven Pro 18:9 . Van het woord verderven, zie Jdg 20:21 ."}],"25":[{"catchword":"grootmoedig","tekst":"Hebreeuws, breed, of wijd van ziel."},{"catchword":"zal /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
