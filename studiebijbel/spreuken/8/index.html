, en het gehoor door het Woord van God,", "Mark 12:39": "en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden;", "Pred 7:23": "Dit alles heb ik met wijsheid beproefd; ik zei: Ik zal wijsheid verkrijgen, maar zij was nog ver van mij.", "Matt 19:13-15": "Toen werden kinderen tot Hem gebracht, opdat Hij de handen op hen zou leggen en bidden; en de discipelen bestraften hen. Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen. En toen Hij hun de handen opgelegd had, vertrok Hij vandaar.", "Matt 19:19": "Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.", "Gen 2:1-25": "Zo zijn de hemel en de aarde voltooid, en heel hun leger. Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had. En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "Spr 12:6": "De woorden van de goddelozen zijn om op bloed te loeren; maar de mond van de oprechten zal ze redden.", "Spr 4:25": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten.", "1 Joh 5:12": "Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet.", "Jer 50:4": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.", "Ef 5:4": "ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging.", "1 Kor 11:12": "Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "Kol 3:10": "en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft;", "2 Kron 32:22": "Zo verloste de HEERE Jehizkia en de inwoners van Jeruzalem uit de hand van Sanherib, de koning van Assyrië, en uit de hand van allen; en Hij leidde hen aan alle zijden.", "Luk 1:28": "En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "1 Petr 5:8": "Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.", "Spr 10:13": "In de lippen van de verstandige wordt wijsheid gevonden; maar op de rug van hem die zonder verstand is, de roede.", "Ps 45:11": "Hoor, o Dochter! en zie, en neig uw oor; en vergeet uw volk en het huis van uw vader.", "Ezech 30:6": "Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hoogmoed van zijn sterkte zal neerdalen; van de toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Mark 10:43": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn.", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Rom 3:11": "er is niemand die verstandig is, er is niemand die God zoekt.", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "Ps 119:133": "Maak mijn voetstappen vast in Uw Woord, en laat geen ongerechtigheid over mij heersen.", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Matt 5:37": "maar laat uw woord zijn: ja, ja; nee, nee; wat meer is dan dit, is uit de boze.", "Lev 19:3": "Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!", "Spr 4:1-4": "Hoort, kinderen! De tucht van je vader, en let op, om verstand te krijgen. Omdat ik u goede leer geef, verlaat mijn wet niet. Want ik was de zoon van mijn vader, teder, en een enige voor het aangezicht van mijn moeder.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Job 28:13": "De mens weet haar waarde niet, en zij wordt niet gevonden in het land van de levenden.", "Ps 136:6": "Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig.", "Gen 18:30": "Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Job 29:3-5": "Toen Hij Zijn lamp deed schijnen over mijn hoofd, en ik bij Zijn licht door de duisternis liep; Zoals ik was in de dagen van mijn jeugd, toen Gods vertrouwelijke omgang over mijn tent was; Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Rom 15:3": "Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Deut 10:12": "Nu dan, Israël! Wat vraagt de HEERE, uw God, van u, dan de HEERE, uw God, te vrezen, in al Zijn wegen te wandelen, en Hem lief te hebben, en de HEERE, uw God, te dienen, met heel uw hart en met heel uw ziel;", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Pred 10:20": "Vloek de koning niet, zelfs niet in uw gedachten, en vloek de rijke niet in het binnenste van uw slaapkamer; want het gevogelte des hemels zou de stem wegvoeren, en het gevleugelde zou het woord bekendmaken.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "1 Joh 4:18": "Er is in de liefde geen vrees, maar de volmaakte liefde drijft de vrees naar buiten; want de vrees heeft pijn, en die vreest, is niet volmaakt in de liefde.", "Ps 102:13": "Maar U, HEERE! blijft in eeuwigheid, en Uw gedachtenis van geslacht tot geslacht.", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Ps 69:13": "Die in de poort zitten, praten over mij; en ik ben een lied voor hen die sterke drank drinken.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Job 12:17": "Hij voert de raadsheren beroofd weg, en de rechters maakt Hij uitzinnig,", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Job 18:3": "Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen?", "Rom 4:1-25": "Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees? Want als Abraham uit de werken gerechtvaardigd is, dan heeft hij roem, maar niet bij God. Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Ps 18:2": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!", "Spr 6:31": "maar als hij gevonden wordt, moet hij het zevenvoudig vergoeden; hij moet alle bezit van zijn huis geven.", "Jes 25:7": "En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "2 Kor 6:10": "als treurend, maar altijd blij; als arm, maar velen rijk makend; als niets hebbend, en toch alles bezittend.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Ps 77:2-10": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen. Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela.", "Rom 8:17": "En als wij kinderen zijn, dan zijn wij ook erfgenamen: erfgenamen van God, en mede-erfgenamen van Christus; als wij tenminste met Hem lijden, opdat wij ook met Hem verheerlijkt worden.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Ps 1:1-4": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters; Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht. Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Spr 13:16": "Al wie verstandig is, handelt met kennis; maar een dwaas breidt dwaasheid uit.", "Hand 15:11": "Maar wij geloven door de genade van de Heere Jezus Christus zalig te worden, op dezelfde wijze als ook zij.", "Luk 2:31": "die U bereid hebt voor het aangezicht van alle volken:", "Ps 69:10": "Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Matt 26:40": "En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?", "Rom 3:13": "Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Kol 3:3": "Want u bent gestorven, en uw leven is met Christus verborgen in God.", "Spr 3:13-26": "Gelukkig is de mens die wijsheid vindt, en de mens die verstandigheid voortbrengt! Want haar koophandel is beter dan de koophandel van zilver, en haar inkomst dan het uitgegraven goud. Zij is kostbaarder dan robijnen; en alles wat u kan verlangen, is met haar niet te vergelijken.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Spr 7:2-4": "Bewaar mijn geboden, en leef, en mijn wet als de appel van uw ogen. Bind ze aan uw vingers, schrijf ze op de tafel van uw hart. Zeg tegen de wijsheid: U bent mijn zuster; en noem het verstand uw bloedverwant;", "Jes 11:9": "Men zal nergens leed doen of verderven op de hele berg van Mijn heiligheid; want de aarde zal vol zijn van kennis van de HEERE, zoals het water de bodem van de zee bedekt.", "Luk 12:21": "Zo gaat het met wie voor zichzelf schatten verzamelt, en niet rijk is in God.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Ps 146:10": "De HEERE zal in eeuwigheid regeren; uw God, o Sion! is van geslacht tot geslacht. Halleluja!", "Ps 115:15": "U bent door de HEERE gezegend, Die de hemel en de aarde gemaakt heeft.", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Fil 1:9": "En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Pred 8:3": "Haast u niet om van zijn aangezicht weg te gaan; blijf niet staan bij een kwade zaak; want al wat hem lust, doet hij.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 24:2": "Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.", "Jer 1:9": "En de HEERE stak Zijn hand uit, en raakte mijn mond aan; en de HEERE zei tegen mij: Zie, Ik geef Mijn woorden in uw mond.", "Klaagl 5:19": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht.", "Mark 9:36": "En Hij nam een kind, en zette het in hun midden, en omarmde het met Zijn armen, en zei tegen hen:", "Ef 5:30": "Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "Joh 20:27": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Spr 11:4": "Bezit doet geen nut ten dage van de verbolgenheid; maar de gerechtigheid redt van de dood.", "Dan 10:13": "Doch de vorst van het koninkrijk van Perzië stond eenentwintig dagen tegenover Mij; en zie, Michaël, een van de voornaamste vorsten, kwam om Mij te helpen, en Ik bleef daar bij de koningen van Perzië.", "Openb 1:17": "En toen ik Hem zag, viel ik als dood aan Zijn voeten; en Hij legde Zijn rechterhand op mij, en zei tegen mij: Wees niet bang; Ik ben de Eerste en de Laatste;", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Spr 2:3-5": "Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid; Als u haar zoekt als zilver, en naspeurt als verborgen schatten; Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Jes 55:8": "Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Spr 29:11": "Een dwaas laat zijn hele geest de vrije loop, maar de wijze weerhoudt die en houdt hem in.", "Openb 5:5": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Spr 20:23": "Tweeërlei weegsteen is de HEERE een gruwel, en de bedrieglijke weegschaal is niet goed.", "Spr 15:4": "De medicijn van de tong is een boom van het leven; maar de verkeerdheid daarin is een breuk in de geest.", "Deut 11:1": "Daarom zult u de HEERE, uw God, liefhebben, en u zult altijd onderhouden Zijn bevel, en Zijn inzettingen, en Zijn rechten, en Zijn geboden.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Spr 29:27": "Een onrechtvaardig man is voor de rechtvaardige een gruwel; maar wie recht van weg is, is voor de goddeloze een gruwel.", "Mark 3:31-35": "Toen kwamen Zijn broers en Zijn moeder; en terwijl zij buiten stonden, stuurden zij iemand naar Hem, en riepen Hem. En de menigte zat om Hem heen; en zij zeiden tegen Hem: Zie, Uw moeder en Uw broers zijn buiten en zoeken U. En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers?", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Ef 4:11-13": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars; Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus; Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "1 Sam 2:3-5": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan. De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord. Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Ps 141:3": "HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Gen 23:10": "Efron nu zat in het midden van de zonen van Heth; en Efron de Hethiet antwoordde Abraham, ten aanhoren van de zonen van Heth, van allen die door de poort van zijn stad naar binnen gingen, en zei:", "Tit 1:11": "hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "1 Joh 5:1-3": "Ieder die gelooft dat Jezus de Christus is, is uit God geboren; en ieder die Hem liefheeft Die geboren heeft, heeft ook lief hem die uit Hem geboren is. Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren. Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "1 Joh 3:19": "En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Job 28:8-11": "De jonge hoogmoedige dieren hebben het niet betreden, de felle leeuw is er niet overheen gegaan. Hij legt zijn hand aan de keiachtige rots, hij keert de bergen vanaf de wortel om. In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Spr 19:22": "De wens van de mens is zijn weldadigheid; maar de arme is beter dan een leugenachtig man.", "Mark 12:38": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten;", "Jes 51:1": "Hoor naar Mij, u die de gerechtigheid najaagt, u die de HEERE zoekt! Kijk naar de rots waaruit u gehouwen bent, en naar de holte van de bornput waaruit u gegraven bent.", "Spr 8:1-16": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:", "Spr 22:17-21": "Neig uw oor, en luister naar de woorden van de wijzen, en richt uw hart op mijn kennis; want het is aangenaam, als u die in uw binnenste bewaart; ze zullen samen op uw lippen gepast worden. Opdat uw vertrouwen op de HEERE is, maak ik ze u vandaag bekend, ja, aan u.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "Gen 18:26": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.", "1 Kor 5:2": "En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden?", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Hand 13:39": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes.", "Jer 33:2": "Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "Joh 1:18": "Niemand heeft ooit God gezien; de eniggeboren Zoon, Die in de schoot van de Vader is, Die heeft Hem ons verklaard.", "Spr 23:16": "En mijn nieren zullen opspringen van vreugde, als uw lippen spreken wat recht is.", "Rom 8:37-39": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad. Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal, Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "1 Petr 1:4": "Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Matt 12:34-37": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond. De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat. Maar Ik zeg u, dat van elk nutteloos woord dat de mensen zullen hebben gesproken, zij daarvan rekenschap zullen geven op de dag van het oordeel.", "Ps 12:7": "De woorden van de HEERE zijn reine woorden, zilver, gelouterd in een aarden smeltkroes, gezuiverd zevenmaal.", "Tit 2:6": "Vermaan de jonge mannen eveneens dat zij matig zijn.", "Ef 5:15": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen,", "Job 34:3": "Want het oor proeft de woorden, zoals het gehemelte het voedsel smaakt.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Ps 52:4-6": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela. U hebt alle woorden van verslinding lief, en een tong van het bedrog.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Spr 23:9": "Spreek niet ten aanhoren van een dwaas, want hij zou het verstand van uw woorden verachten.", "Job 26:7-13": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Spr 4:26": "Weeg de gang van uw voet, en laat al uw wegen vast staan.", "Spr 1:33": "Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vrees voor het kwaad.", "Spr 3:1-10": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Hebr 2:9": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven.", "Ps 139:6": "De kennis is mij te wonderbaar, ze is hoog, ik kan er niet bij.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Spr 5:12": "En zegt: Hoe heb ik de tucht gehaat, en heeft mijn hart de bestraffing versmaad!", "Pred 6:12": "Want wie weet wat goed is voor de mens in dit leven, gedurende het aantal dagen van het leven van zijn ijdelheid, dat hij doorbrengt als een schaduw? Want wie kan de mens aanzeggen wat na hem wezen zal onder de zon?", "Ps 102:8": "Ik waak, en ben geworden als een eenzame mus op het dak.", "Gen 49:18": "Op Uw zaligheid wacht ik, HEERE!", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "1 Kron 16:11": "Vraagt naar de HEERE en Zijn sterkte, zoekt Zijn aangezicht voortdurend.", "Spr 20:15": "Goud is er, en een menigte van robijnen; maar de lippen van de wetenschap zijn een kostbaar kleinood.", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "Spr 16:27": "Een nietswaardig man graaft kwaad op; en op zijn lippen is als brandend vuur.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "Jak 1:22-25": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Ps 19:8-12": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid. De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen. De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "1 Kon 3:28": "En heel Israël hoorde dat oordeel dat de koning geveld had, en zij hadden ontzag voor het aangezicht van de koning; want zij zagen dat de wijsheid van God in hem was, om recht te doen.", "Spr 27:12": "De schrandere ziet het kwaad, en verbergt zich; de eenvoudigen gaan door, en worden gestraft.", "Matt 12:49": "En Hij strekte Zijn hand uit over Zijn discipelen, en zei: Kijk, Mijn moeder en Mijn broeders.", "Spr 10:6": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Ef 2:14": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft,", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Spr 27:21": "De smeltkroes is voor het zilver, en de oven voor het goud; zo wordt een man beproefd naar zijn lof.", "1 Joh 4:17": "Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in de dag van het oordeel, namelijk dat wij zijn zoals Hij is, in deze wereld.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Kol 3:11": "waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Hand 13:46": "Maar Paulus en Barnabas zeiden vrijmoedig: Het was nodig dat eerst tot u het Woord van God gesproken zou worden; doch aangezien u het verstoot, en uzelf het eeuwige leven niet waard oordeelt, zie, wij keren ons tot de heidenen.", "Richt 9:14": "Toen zeiden alle bomen tegen de doornstruik: Kom u, wees koning over ons.", "Matt 22:38": "Dit is het eerste en het grootste gebod.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Luk 18:15": "En zij brachten ook de kinderen bij Hem, zodat Hij ze zou aanraken; en de discipelen, toen ze dat zagen, bestraften hen.", "Amos 8:12": "En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden.", "Joh 8:23": "En Hij zei tegen hen: U bent van beneden, Ik ben van boven; u bent uit deze wereld, Ik ben niet uit deze wereld.", "Hand 13:26": "Mannen broeders, kinderen van het geslacht van Abraham, en zij die onder u God vrezen, tot u is het woord van deze zaligheid gezonden.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Jes 56:6": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Job 8:5": "Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Jes 23:9": "De HEERE van de heerscharen heeft het besloten, om de hoogmoed van alle luister te ontheiligen, om alle heerlijksten van de aarde verachtelijk te maken.", "Joh 6:62": "Wat zou het dan zijn, als u de Zoon des mensen zag opvaren naar waar Hij eerder was?", "Klaagl 3:27": "Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.", "Openb 7:17": "Want het Lam, Dat in het midden van de troon is, zal hen weiden, en zal hun een Leidsman zijn tot levende fonteinen van water; en God zal alle tranen van hun ogen afwissen.", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "1 Petr 1:20": "Die al vóór de grondlegging van de wereld voorbestemd was, maar in deze laatste tijden geopenbaard is omwille van u,", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Dan 4:32": "En men zal u van de mensen verstoten, en uw woning zal bij de dieren van het veld zijn; men zal u gras te eten geven, zoals de ossen, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste over de koninkrijken van de mensen heerschappij heeft, en dat Hij ze geeft aan wie Hij wil.", "Joh 7:37": "En op de laatste dag, zijnde de grote dag van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken.", "1 Kron 16:26": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Spr 1:3": "Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "1 Joh 2:14": "Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ps 78:34": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Joh 1:2": "Dit was in het begin bij God.", "Jer 20:10": "Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "1 Joh 4:16-21": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem. Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in de dag van het oordeel, namelijk dat wij zijn zoals Hij is, in deze wereld. Er is in de liefde geen vrees, maar de volmaakte liefde drijft de vrees naar buiten; want de vrees heeft pijn, en die vreest, is niet volmaakt in de liefde.", "Ps 42:2-5": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God! Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen? Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Jak 3:8-10": "Maar de tong kan geen mens temmen; zij is een onbedwingbaar kwaad, vol dodelijk gif. Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn. Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "Spr 16:12": "Het is voor koningen een gruwel goddeloosheid te doen; want door gerechtigheid wordt de troon bevestigd.", "Job 26:7": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets.", "Ezech 48:35": "Rondom achttienduizend; en de naam van de stad zal van die dag af zijn: DE Heere IS DAAR.", "1 Kor 4:10": "Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht.", "Spr 22:26": "Wees niet onder hen die in de hand klappen, onder hen die borg staan voor schulden.", "Ex 18:10": "En Jethro zei: Gezegend zij de HEERE, Die u verlost heeft uit de hand van de Egyptenaren, en uit de hand van Farao; Die dit volk van onder de hand van de Egyptenaren verlost heeft!", "Spr 3:1-3": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Luk 11:34-36": "De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister. Kijk dan uit, dat niet het licht dat in u is, duisternis is. Als dan uw hele lichaam verlicht is, zonder enig duister deel, dan zal het geheel verlicht zijn, zoals wanneer de lamp u met haar schijnsel verlicht.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Mal 2:15": "Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.", "2 Petr 2:8": "(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Gen 18:28": "Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Luk 8:19-21": "En Zijn moeder en Zijn broers kwamen naar Hem toe, en konden niet bij Hem komen vanwege de menigte. En het werd Hem gemeld door enigen die zeiden: Uw moeder en Uw broers staan buiten en willen U zien. Maar Hij antwoordde en zei tegen hen: Mijn moeder en Mijn broers zijn zij die Gods Woord horen en het doen.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Spr 2:4": "Als u haar zoekt als zilver, en naspeurt als verborgen schatten;", "Ps 140:12": "Een man van kwade tong zal op de aarde niet bevestigd worden; een boos man van geweld, die zal men jagen, totdat hij helemaal verdreven is.", "Hebr 6:20": "waar de Voorloper voor ons is ingegaan, namelijk Jezus, naar de ordening van Melchizedek, Hogepriester geworden in eeuwigheid.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "Matt 24:42-51": "Waak dan, want u weet niet in welk uur uw Heere komen zal. Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven. Daarom, wees ook u bereid, want op een uur dat u het niet verwacht, zal de Zoon des mensen komen.", "Gen 1:9": "En God zei: Laten de wateren van onder de hemel op één plaats samenvloeien, en laat het droge gezien worden! En het was zo.", "Ef 3:6": "namelijk dat de heidenen medeerfgenamen zijn, en van hetzelfde lichaam, en mededeelgenoten van Zijn belofte in Christus, door het Evangelie;", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Spr 16:16": "Hoeveel beter is het wijsheid te verkrijgen dan goud, en voortreffelijker: verstand te verkrijgen dan zilver!", "Matt 21:31": "Wie van deze twee heeft de wil van de vader gedaan? Zij zeiden tegen Hem: De eerste. Jezus zei tegen hen: Voorwaar, Ik zeg u, dat de tollenaars en de hoeren u voorgaan in het Koninkrijk van God.", "Luk 18:16": "Maar Jezus riep hen bij Zich en zei: Laat de kinderen tot Mij komen, en verhinder hen niet; want voor zulken is het Koninkrijk van God.", "Luk 11:43": "Wee u, Farizeeën, want u houdt van de voorste plaatsen in de synagogen, en van de begroetingen op de markten.", "Spr 23:15": "Mijn zoon! als uw hart wijs is, zal mijn hart zich verblijden, ja, ik zelf.", "Jes 32:1-4": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Kol 4:2": "Houd sterk aan in het gebed, en waak daarin met dankzegging;", "Ps 23:2": "Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren.", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "1 Kor 10:25-33": "Eet alles wat in de vleeshal verkocht wordt, zonder daarover vragen te stellen, omwille van het geweten; want de aarde is van de Heere, en al wat zij bevat. En als iemand van de ongelovigen u uitnodigt, en u besluit te gaan, eet dan alles wat u wordt voorgezet, zonder daarover vragen te stellen, omwille van het geweten.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Jer 2:2": "Ga en roep voor de oren van Jeruzalem, en zeg: Zo zegt de HEERE: Ik gedenk de weldadigheid van uw jeugd, de liefde van uw ondertrouw, toen u Mij nawandelde in de woestijn, in onbezaaid land.", "Spr 16:20": "Wie op het woord verstandig let, zal het goede vinden; en wie op de HEERE vertrouwt, is gelukkig.", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Ps 63:2": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water.", "Spr 1:13": "Alle kostelijk goed zullen wij vinden, onze huizen zullen wij met roof vullen.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Joël 2:27": "En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "Ps 37:4": "En verlustig u in de HEERE, zo zal Hij u geven de verlangens van uw hart.", "Spr 6:12": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond;", "Ef 2:17": "En toen Hij kwam, heeft Hij door het Evangelie vrede verkondigd aan u, die ver weg was, en aan hen die nabij waren.", "Spr 26:20-23": "Als er geen hout is, gaat het vuur uit; en als er geen roddelaar is, wordt het gekijf gestild. De dode kool is voor de vurige kool, en het hout voor het vuur; zo is een twistzieke man om ruzie aan te wakkeren. De woorden van de roddelaar zijn als klappen die aankomen, en die diep in het binnenste van de buik dalen.", "Spr 10:14": "De wijzen leggen kennis weg; maar de mond van de dwaas is de ondergang nabij.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 89:13": "Het noorden en het zuiden, die hebt Gij geschapen; Thabor en Hermon juichen in Uw Naam.", "Spr 10:17": "Het pad naar het leven is voor hem die de tucht bewaart; maar wie de bestraffing verlaat, doet dwalen.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Luk 21:8-36": "En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na. En wanneer u zult horen van oorlogen en opstanden, wordt dan niet verschrikt; want deze dingen moeten eerst gebeuren; maar meteen is het einde nog niet. Toen zei Hij tegen hen: Het ene volk zal tegen het andere volk opstaan, en het ene koninkrijk tegen het andere koninkrijk.", "Joh 4:16-19": "Jezus zei tegen haar: Ga heen, roep uw man, en kom hier. De vrouw antwoordde en zei: Ik heb geen man. Jezus zei tegen haar: U hebt goed gezegd: Ik heb geen man. Want u hebt vijf mannen gehad, en degene die u nu hebt, is uw man niet; dat hebt u naar waarheid gezegd.", "Pred 10:12": "De woorden van de mond van een wijze zijn aangenaam; maar de lippen van een dwaas verslinden hemzelf.", "Matt 6:1": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is.", "Job 34:4": "Laat ons kiezen voor ons, wat recht is; laat ons kennen onder ons wat goed is.", "Spr 15:7": "De lippen van de wijzen zullen de wetenschap uitstrooien; maar het hart van de zotten niet zo.", "Spr 1:8": "Mijn zoon! hoor de tucht van uw vader, en verlaat de leer van uw moeder niet;", "Job 37:18": "Hebt u met Hem de hemelen uitgespannen, die vast zijn, als een gegoten spiegel?", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "1 Tim 2:3-6": "Want dat is goed en aangenaam voor God, onze Zaligmaker; Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen. Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Spr 21:23": "Wie zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Spr 21:24": "Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Gen 1:1-31": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "1 Kor 3:21-23": "Niemand roemt dan op mensen; want alles is van u. Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Jer 33:15": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Ps 63:9": "Mijn ziel kleeft U achteraan; Uw rechterhand ondersteunt mij.", "Spr 18:15": "Het hart van de verstandigen verwerft kennis, en het oor van de wijzen zoekt kennis.", "Ps 31:4": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Ps 121:1-8": "Een lied Hammaaloth¹. Ik hef mijn ogen op naar de bergen, vanwaar mijn hulp komen zal. Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft. Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Ps 119:23": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht.", "Luk 12:35-40": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Spr 1:2": "Om wijsheid en tucht te weten; om te verstaan redenen van het verstand;", "Amos 5:14": "Zoek het goede, en niet het kwade, opdat u leeft; en zo zal de HEERE, de God van de heerscharen¹, met u zijn, zoals u zegt.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Ef 5:15-17": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen, en koop de tijd uit, omdat de dagen slecht zijn. Wees daarom niet onverstandig, maar begrijp wat de wil van de Heere is.", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Rom 13:11": "En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.", "Job 15:1-13": "Toen antwoordde Elifaz, de Themaniet, en zei: Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind? Bestraffend door woorden, die niet baten, en door redenen, waarmee hij geen voordeel doet?", "Jer 10:7": "Wie zou U niet vrezen, Koning van de heidenen? Want het komt U toe; omdat toch onder alle wijzen van de heidenen, en in hun hele koninkrijk, niemand U gelijk is.", "Spr 20:10": "Tweeërlei weegsteen, tweeërlei efa is de HEERE een gruwel, ja, die beide.", "Spr 26:28": "Een valse tong haat hen die zij verbrijzelt; en een gladde mond veroorzaakt val.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Spr 14:16": "De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.", "Joh 15:23": "Die Mij haat, die haat ook Mijn Vader.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Kol 1:26": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen;", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Spr 23:25": "Laat uw vader zich verblijden, ook uw moeder; en laat zij zich verheugen, die u gebaard heeft.", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Jes 42:1": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.", "Joh 1:7": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Pred 8:7": "Want hij weet niet wat er gebeuren zal; want wie zal het hem bekendmaken, wanneer het zal gebeuren?", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "Ps 89:18": "Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden.", "Luk 11:9-13": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden. En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?", "Num 14:14": "en zij zullen het zeggen tegen de inwoners van dit land, die gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "Hos 8:4": "Zij hebben koningen aangesteld, maar niet door Mij; zij hebben vorsten aangesteld, maar Ik heb het niet erkend; van hun zilver en hun goud hebben zij voor zichzelf afgoden gemaakt, zodat zij uitgeroeid worden.", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Matt 19:15": "En toen Hij hun de handen opgelegd had, vertrok Hij vandaar.", "Ps 83:17": "Maak hun gezicht vol schande, opdat zij, o HEERE, Uw Naam zoeken.", "Ps 119:1": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Spr 28:9": "Wie zijn oor afwendt van het horen van de wet, diens gebed zelfs zal een gruwel zijn.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Hand 17:27": "Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "1 Kon 5:7": "En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk!", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Pred 7:22": "Want uw hart heeft ook veel keren erkend, dat u ook anderen vervloekt hebt.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Matt 6:19": "Verzamel voor uzelf geen schatten op de aarde, waar de mot en de roest ze verderven, en waar de dieven inbreken en stelen;", "2 Sam 22:29": "Want U bent mijn Lamp, o HEERE, en de HEERE doet mijn duisternis opklaren.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Hand 1:24": "En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,", "Ps 63:2-9": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water. Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien; Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "1 Kor 2:6": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Spr 29:23": "De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Ezech 16:56": "Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Spr 12:17-19": "Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens maakt bedrog bekend. Er is een die woorden als steken van een zwaard onbedacht uitspreekt; maar de tong van de wijzen is medicijn. Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Fil 2:5-7": "Want laat die gezindheid in u zijn, die ook in Christus Jezus was; Die, terwijl Hij in de gestalte van God was, het geen roof geacht heeft God even gelijk te zijn; Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden;", "Spr 4:12": "Als u gaat, zal uw tred niet belemmerd worden, en als u loopt, zult u niet struikelen.", "Ps 104:9": "U hebt een grens gesteld, die zij niet zullen overgaan; zij zullen de aarde niet weer bedekken.", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "Spr 4:11": "Ik onderwijs u in de weg van de wijsheid; ik doe u treden op de rechte paden.", "2 Kron 2:11": "Huram nu, de koning van Tyrus, antwoordde per brief, en zond die naar Salomo: Omdat de HEERE Zijn volk liefheeft, heeft Hij u over hen tot koning gesteld.", "Deut 5:32": "Neem er dan acht op dat u doet zoals de HEERE, uw God, u geboden heeft; en wijk niet af naar rechts of naar links.", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Dan 11:32": "En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "2 Kor 5:13": "Want hetzij dat wij uitzinnig zijn, wij zijn het voor God; hetzij dat wij bezonnen zijn, wij zijn het voor u.", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Ex 36:1-4": "Toen werkten Bezaleël en Aholiab, en ieder man die wijs van hart was, aan wie de HEERE wijsheid en verstand gegeven had om te weten hoe zij al het werk voor de dienst van het heiligdom moesten maken, naar alles wat de HEERE geboden had. Want Mozes had Bezaleël en Aholiab geroepen, en ieder man die wijs van hart was, in wiens hart God wijsheid gegeven had, ieder wiens hart hem ertoe bewoog om naar het werk te gaan om dat te maken. Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "2 Kron 15:13": "En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe.", "Joh 17:5": "En nu, verheerlijk Mij, U, Vader, bij Uzelf, met de heerlijkheid die Ik bij U had, voordat de wereld was.", "Ps 25:4": "Daleth. HEERE! maak mij Uw wegen bekend, leer mij Uw paden.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Spr 8:22-26": "De HEERE bezat Mij in het beginsel van Zijn weg, voor Zijn werken, van toen aan. Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water;", "Jak 3:13": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Rom 3:28-30": "Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet. Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen; omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Spr 4:5-7": "Verkrijg wijsheid, verkrijg verstand; vergeet niet, en wijk niet van de woorden van mijn mond. Verlaat haar niet, en zij zal u behoeden; heb haar lief, en zij zal u bewaren. De wijsheid is het voornaamste; verkrijg dan wijsheid, en verkrijg verstand met al uw bezit.", "Jes 49:11": "En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Job 8:8": "Want vraag toch aan het vorige geslacht, en stel u open voor het onderzoek van hun vaderen.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, z
