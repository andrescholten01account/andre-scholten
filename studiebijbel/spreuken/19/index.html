en.","26":"Wie zijn vader verwoest, of zijn moeder verjaagt, is een zoon die beschaamd maakt, en schande aandoet.","27":"Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.","28":"Een getuige van Belial bespot het recht; en de mond van de goddelozen slokt de ongerechtigheid in.","29":"Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen."},"SV":{"1":"De arme, in zijn oprechtheid wandelende, is beter dan de verkeerde van lippen, en die een zot is.","2":"Ook is de ziel zonder wetenschap niet goed; en die met de voeten haastig is, zondigt.","3":"De dwaasheid des mensen zal zijn weg verkeren; en zijn hart zal zich tegen den HEERE vergrammen.","4":"Het goed brengt veel vrienden toe; maar de arme wordt van zijn vriend gescheiden.","5":"Een vals getuige zal niet onschuldig zijn; en die leugenen blaast, zal niet ontkomen.","6":"Velen smeken het aangezicht des prinsen; en een ieder is een vriend desgenen, die giften geeft.","7":"Al de broeders des armen haten hem; hoeveel te meer gaan zijn vrienden verre van hem! Hij loopt hen na *met* woorden, die niets zijn.","8":"Die verstand bekomt, heeft zijn ziel lief; hij neemt de verstandigheid waar, om het goede te vinden.","9":"Een vals getuige zal niet onschuldig zijn; en die leugenen blaast, zal vergaan.","10":"De weelde staat een zot niet wel; hoeveel te min een knecht te heersen over vorsten!","11":"Het verstand des mensen vertraagt zijn toorn; en zijn sieraad is de overtreding voorbij te gaan.","12":"Des konings gramschap is als het brullen eens jongen leeuws; maar zijn welgevallen is als dauw op het kruid.","13":"Een zotte zoon is zijn vader grote ellende; en de kijvingen ener vrouw *als* een gestadig druipen.","14":"Huis en goed is een erve van de vaderen; maar een verstandige vrouw is van den HEERE.","15":"Luiheid doet in diepen slaap vallen; en een bedriegelijke ziel zal hongeren.","16":"Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.","17":"Die zich des armen ontfermt, leent den HEERE, en Hij zal hem zijn weldaad vergelden.","18":"Tuchtig uw zoon, als er nog hoop is; maar verhef uw ziel niet, om hem te doden.","19":"Die groot is van grimmigheid, zal straf dragen; want zo gij *hem* uitredt, zo zult gij nog moeten voortvaren.","20":"Hoor raad, en ontvang tucht, opdat gij in uw laatste wijs zijt.","21":"In het hart des mans zijn veel gedachten; maar de raad des HEEREN, die zal bestaan.","22":"De wens des mensen is zijn weldadigheid; maar de arme is beter dan een leugenachtig man.","23":"De vreze des HEEREN is ten leven; want men zal verzadigd zijnde vernachten; met het kwaad zal men niet bezocht worden.","24":"Een luiaard verbergt de hand in den boezem, en hij zal ze niet weder aan zijn mond brengen.","25":"Sla den spotter, zo zal de slechte kloekzinnig worden; en bestraf den verstandige, hij zal wetenschap begrijpen.","26":"Wie den vader verwoest, *of* de moeder verjaagt, is een zoon, die beschaamd maakt, en schande aandoet.","27":"Laat af, mijn zoon, horende de tucht, af te dwalen van de redenen der wetenschap.","28":"Een Belialsgetuige bespot het recht; en de mond der goddelozen slokt de ongerechtigheid in.","29":"Gerichten zijn voor de spotters bereid, en slagen voor den rug der zotten."},"KJV":{"1":"Better *is* the poor that walketh in his integrity, than *he that is* perverse in his lips, and is a fool.","2":"Also, *that* the soul *be* without knowledge, *it is* not good; and he that hasteth with *his* feet sinneth.","3":"The foolishness of man perverteth his way: and his heart fretteth against the LORD.","4":"Wealth maketh many friends; but the poor is separated from his neighbour.","5":"A false witness shall not be unpunished, and *he that* speaketh lies shall not escape.","6":"Many will intreat the favour of the prince: and every man *is* a friend to him that giveth gifts.","7":"All the brethren of the poor do hate him: how much more do his friends go far from him? he pursueth *them iglijk voortloopt met zijn onbedachte zinnen en voortdrijvende gemoedsbewegingen, zonder eerst wel beraden te zijn; zie boven Pro 1:15 ."}],"3":[{"catchword":"zijn weg","tekst":"Dat is, zijn voorstel, handel en zaken doen mislukken, kwalijk slaan en te gronde brengen."},{"catchword":"tegen den HEERE","tekst":"Dat is, zal murmureren en zich ontstellen met een gevoel alsof de schuld bij den Heere was, dat al zijn voornemen en doen verloren gaat."}],"4":[{"catchword":"vriend gescheiden","tekst":"Al heeft hij maar een vriend, van dien wordt hij zelfs ook dikwijls verlaten."}],"5":[{"catchword":"Een vals","tekst":"Hebreeuws, een getuige der valsheden."},{"catchword":"niet onschuldig","tekst":"Dat is, niet ongestraft. Zie 1Ki 2:9 ."},{"catchword":"leugens blaast,","tekst":"Alzo boven Pro 6:19 ; zie de aantekening aldaar."}],"6":[{"catchword":"aangezicht","tekst":"Dat is, den persoon. Zie van het Hebreeuwse woord in denzelfden zin genomen, Job 11:19 , en de aantekening."},{"catchword":"prinsen;","tekst":"Of, des milden. Zie van het Hebreeuwse woord Nadib, Job 12:21 ."},{"catchword":"desgenen,","tekst":"Hebreeuws, den man, of den man der gift; dat is, die genegen is te geven en mildelijk te delen."}],"7":[{"catchword":"broeders","tekst":"Dat is, die hem in maagschap bestaan, hoewel niet toegedaan in oprechte en ongeveinsde liefde."},{"catchword":"armen","tekst":"Dat is, desgenen, die verarmd is en afgegaan van goed."},{"catchword":"haten hem;","tekst":"Dat is, verlaten hem, even alsof zij hem haatten; of zij hebben hem minder lief dan voordat hij arm was. Zie Gen 29:31 ."},{"catchword":"zijn vrienden","tekst":"Dat is, zijne bekenden en metgezellen, hoewel maar in schijn. Want hoedanig een ongeveinsd vriend is, zie boven Pro 17:17 , en Pro 18:24 ."},{"catchword":"Hij","tekst":"Te weten, de arme."},{"catchword":"loopt","tekst":"Te weten, zijne broeders en vrienden."},{"catchword":"woorden","tekst":"Te weten, waardoor hij hen om hulp roept."},{"catchword":"niets zijn","tekst":"Dat is, van gene kracht of waarde, overmits zij niet aangenomen, maar veracht worden. Of, [maar] zij, te weten, de broeders en vrienden, zijn dezelve niet; te weten, waardoor zij zich uitgaven, eer de verarmde uit oorzaak zijner armoede hen naliep. Anders: hij volgt woorden, die niet zijn; dat is, hij steunt op de beloften, die zij hem gegeven hebben eer hij arm werd, die van gene waarde zijn."}],"8":[{"catchword":"verstand","tekst":"Dat is, die verstand zoekt te bekomen. Hebreeuws, het hart; welk woord dikwijls in de Heilige Schrift voor wijsheid en verstand genomen wordt. Zie Job 9:4 ."},{"catchword":"verstandigheid","tekst":"Zie boven Pro 1:3 ."},{"catchword":"het goede","tekst":"Zie boven Pro 16:20 ."}],"9":[{"catchword":"Een vals","tekst":"Hebreeuws, een getuige der valsheden. Alzo boven vs.5. Zie aldaar de aantekening."}],"10":[{"catchword":"een zot","tekst":"De reden is, omdat hij daardoor nog zotter wordt; dat is darteler en moedwilliger."}],"11":[{"catchword":"vertrekt","tekst":"Hebreeuws, verlengt; dat is vertraagt zijnen toorn, stelt hem uit, houdt hem in. Anders: het is een kloek verstand van den mens, dat hij zijn toorn vertrekt. Dezelfde manier van spreken is ook Isa 48:9 ."},{"catchword":"zijn sieraad","tekst":"Te weten, des mensen."},{"catchword":"de overtreding","tekst":"Dat is, het kwaad, dat hem aangedaan is, voorbij te gaan, door hetzelve te vergeten en te vergeven, naardat de eer Gods en de stichting der mensen zulks lijden kunnen."}],"12":[{"catchword":"jongen leeuws;","tekst":"Genaamd bij de Hebreën chephir, die zeer moedig en fel is, zijnde ouder en meerder dan het welp van een leeuw, hetwelk zij gur noemen; zie Eze 19:2 ."},{"catchword":"zijn welgevallen","tekst":"Dat is, zijne gunst en goedwilligheid, die hij iemand toedraagt."},{"catchword":"dauw","tekst":"Waardoor het kruid bevochtigd, verkwikt en gevoed wordt."}],"13":[{"catchword":"ellende;","tekst":"Het Hebreeuwse woord staat in het getal van velen, om de grootheid of veelheid der ellende en des verdriets uit te drukken."},{"catchword":"vrouw","tekst":"Versta, ene huisvrouw, die met haar gekijf veel ongenoegen, beroerte en schade in de huishouding kan aanrichten."},{"catchword":"gestadig","tekst":"Te weten, hetwelk het huis doet verrotten, het huisraad beschadigt, de huisgenoten kwelt, ja, eindelijk ook uit het huis jaagt."}],"14":[{"catchword":"is een erve","tekst":"Dat is, worden geërfd van de ouders."},{"catchword":"is van den HEERE","tekst":"Te weten, als een bijzondere gave, die niet allen gegeven wordt, en niet komt door erfenis en successie; zie boven Pro 18:22 ."}],"15":[{"catchword":"Luiheid","tekst":"De luiheid brengt lediggang voort; de lediggang werkt slaapzucht; waaruit dan komt ongezondheid, vadzigheid der leden en domheid des geestes; met welke ook armoede pleegt te volgen."},{"catchword":"een bedriegelijke","tekst":"Versta, een mens die niet werken wil, en daarom door kwade praktijken den kost zoekt te krijgen. Vergelijk boven Pro 10:4 ."}],"16":[{"catchword":"gebod","tekst":"Dat is, de geboden, te weten, Gods en voornamelijk die Hij gebiedt in de wet der zeden. Zie Gen 26:5 ."},{"catchword":"zijn wegen","tekst":"Dat is, geen acht geeft op zijn handel en wandel, doen en laten; om zulks alles naar het Woord van God aan te stellen."}],"17":[{"catchword":"Hij zal hem","tekst":"Namelijk, de Heere."}],"18":[{"catchword":"Tuchtig uw zoon,","tekst":"Te weten, met woorden en slagen. Zie van het Hebreeuwse woord boven Pro 9:7 ."},{"catchword":"hoop is;","tekst":"Te weten, dat hij door onderwijs en kastijding zou mogen gebeterd worden."},{"catchword":"verhef","tekst":"Dat is, vaar niet uit met een kwade begeerte, om, enz. Het verheffen zijner ziel betekent wel somtijds goede en geoorloofde drijving van het gemoed, verenigd met grote begeerte en verlangen, gelijk Deu 24:15 ; Psa 25:1 ; Jer 44:14 , maar het betekent ook lust en drijving tot hetgeen kwaad is, gelijk hier, Psa 24:4 ; Hos 4:8 . Anders: uw hart vergeve [hem] niet tot zijn verderf, of verhef uwe ziel niet om zijn getier; dat is, vraag er niet naar."},{"catchword":"te doden","tekst":"Te weten, door gebrek van straf, òf te veel slaan, òf andere hardheid."}],"19":[{"catchword":"Die groot is","tekst":"Te weten, de zoon, die zeer moedwillig en korzel is, of om der straf wil veel getier en grote beroerte maakt."},{"catchword":"straf dragen;","tekst":"Dat is, behoort de straf niet te ontgaan, zelfs ook om zijn onmatig gebaar, dat hij aanstelt."},{"catchword":"uitredt,","tekst":"Te weten, uit de straf, die hij verdiend heeft."},{"catchword":"voortvaren","tekst":"Te weten, met hem te straffen, overmits hij, los zijnde van kastijding, bozer zal worden en een oorzaak van veel kwaad. Of, hij zal boete betalen; want zo gij hem uithelpt, dat is, de boete voor hem betaalt, zult gij het meer moeten doen. Sommigen nemen deze spreuk in het algemeen van alle zeer grimmige mensen."}],"20":[{"catchword":"raad,","tekst":"Te weten, goeden en wijzen raad."},{"catchword":"tucht,","tekst":"Dat is, ware onderwijzing door woorden, of ook kastijding door straffen. Zie van het Hebreeuwse woord boven Pro 7:22 , en vergelijk boven Pro 9:7 ."},{"catchword":"laatste","tekst":"Zie van dit woord Psa 37:37 ."}],"21":[{"catchword":"In het hart","tekst":"Te weten, die nimmermeer uit het hart komen metterdaad, ja, ook niet met woorden; gelijk deze zin uit de tegenstelling van het volgende lid van vs.21 kan afgenomen worden."},{"catchword":"des mans","tekst":"Dat is, des mensen. Zie Job 12:10 ."},{"catchword":"de raad des HEEREN,","tekst":"Dat is, dat God besloten heeft; alzo Psa 33:11 ; Isa 25:1 ; Act 2:23 ."}],"22":[{"catchword":"des mensen","tekst":"Te weten, die gaarne rijk zou wezen, om een ieder [zo hij zegt] goed te doen, maar evenwel als hij rijk geworden is, dat niet doet. Anders: de wens des mensen zij zijne weldadigheid."},{"catchword":"zijn weldadigheid;","tekst":"Dat is, rijk te zijn, om goed aan den behoeftige te doen."},{"catchword":"de arme","tekst":"Dat is, die niet heeft om anderen te helpen, en ook met geen ijdele beloften hem teleurstelt."},{"catchword":"leugenachtig","tekst":"Te weten, die kan en belooft weldadigheid te bewijzen, doch dat metterdaad niet volbrengt."}],"23":[{"catchword":"is ten leven;","tekst":"Dat is, voordelig voor het tijdelijke en eeuwige leven; 1Ti 4:8 ."},{"catchword":"zal","tekst":"Te weten, als men de ware vreze des Heeren heeft."},{"catchword":"verzadigd","tekst":"Te weten, met Gods goederen en weldaden."},{"catchword":"vernachten;","tekst":"Dat is, goede rust hebben. Vergelijk Psa 25:13 . Van het tegendeel zie Psa 50:15-16 ."},{"catchword":"kwaad","tekst":"Te weten, der straf."},{"catchword":"niet bezocht","tekst":"Namelijk ten verderve. Van het woord bezoeken zie Gen 21:1 ."}],"24":[{"catchword":"in den boezem,","tekst":"Dat is, hij wil zijne hand aan geen werk slaan. Anders: in den schotel, te weten om spijs daaruit te nemen. De zin is dat hij zo lui is, dat hij nauwelijks de moeite wil doen om te eten. Het is een overtollige manier van spreken. Vergelijk onder Pro 26:15 ."}],"25":[{"catchword":"Sla","tekst":"Te weten, om hem over zijne spotternij te straffen."},{"catchword":"spotter,","tekst":"Zie Psa 1:1 ."},{"catchword":"slechte","tekst":"Dit woord is hier in het goede genomen voor de onwetenden en eenvoudigen, die leerzaam zijn; zie boven Pro 1:4 ."},{"catchword":"bestraf","tekst":"Te weten, met woorden. Alzo Gen 21:25 ; Job 15:3 ; boven Pro 9:8 ."}],"26":[{"catchword":"Wie den vader","tekst":"Te weten, zijn eigen vader of moeder."},{"catchword":"verwoest,","tekst":"Dat is, bloot en berooid maakt; zie van het Hebreeuwse woord ook Jdg 5:27 . Of, die den vader verwoest, verjaagt de moeder, hij is een zoon, enz."},{"catchword":"beschaamd","tekst":"Zie boven Pro 10:5 ."}],"27":[{"catchword":"mijn zoon,","tekst":"Zie boven Pro 1:8 ."},{"catchword":"horende","tekst":"Anders: laat af, mijn zoon, van te horen het onderwijs, [strekkende] tot het afdwalen, enz.; te weten, kwaad onderwijs, kwade tucht. Zie boven Pro 7:22 , en Pro 16:22 , en de aantekening."},{"catchword":"der wetenschap","tekst":"Dat is, die wetenschap voortbrengen."}],"28":[{"catchword":"Belialsgetuige","tekst":"Versta, een deugniet, die naar niemand wil horen. Zie Deu 13:13 ."},{"catchword":"bespot","tekst":"Dewijl hij met valse getuigenis den rechter bedriegt. Anders: verbloemt de rechtzaak; dat is, geeft het een luister met zijne schone woorden en schijnbare redenen. Zie boven Pro 14:9 ."},{"catchword":"slokt","tekst":"Gelijk de dronkaards hun drank ingieten. Vergelijk Job 15:16 . Anders: verslindt de ongerechtigheid; dat is, bedekt ze, of verbergt ze onder een bemanteling van woorden. Want dat verslonden en ingezwolgen is, wordt voor der mensen ogen weggedaan en verborgen."}],"29":[{"catchword":"Gerichten","tekst":"Dat is straffen, zo goddelijke, als menselijke, tijdelijke als eeuwige. Alzo Psa 119:120 ; Jer 48:47 ; Luk 24:20 ; Rom 13:2 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The poor walking in his uprightness, [That is, living in unfeigned intergrity. See above chapter 2.on verse 7.] is better then the perverse in lips, [see above chapter 2.on verse 12.] and that is a fool. [see above chap.1.on verse 22.]"}],"2":[{"catchword":null,"tekst":"Also the soul [That is, the desire, and affection, to do a thing , or to leave it undone. See Psalm 27.on verse 12. The Prophet reproveth two things. 1. To be prone and enclined to a thing, of which a man hath no knowledge or understanding. 2. If a man have understanding of it, yet to set upon, and to peruse it rashly, and unadvisedly] without knowledge, [that is, that understandeth not, what is should do, or leave undone, to please God, and to walk circumspectly and profitably towards men] is not good: [that is, very bad, and hurtful. Compare above chapter 17.26. and the annot.] and he that is hasty with (his) feet, [to wit, unto evil. Or understand it thus: he that runneth on hastily, with an unadvised mind, and with posting head-long affections, without first taking counsel, or being well-advised upon the matter he goeth about. See above chap.1.on verse 15.] sinneth."}],"3":[{"catchword":null,"tekst":"The foolishness of man will pervert his way: [That is, will disappoint, confound, and destroy all his purposes, resolutions, affairs, and practises] and his heart will fret against the LORD. [that is, will murmur, and vex it self with a conceit, as if the blame or fault were in God, that all his intentions and actions are lost, and come to nothing.]"}],"4":[{"catchword":null,"tekst":"Wealth maketh many friends: [So above chapter 14.20.] but the poor is separated from his friend. [though he have but one friend, yet even of him he is often left and forsaken. See the same place below verse 7.]"}],"5":[{"catchword":null,"tekst":"A false witness [Hebr. A witness of falsehoods] shall not be guiltless: [that is, not be unpunished. See 1 Kings 2.on verse 9. Compare Deut.19.19. and bel.chap.21.28.] and he that bloweth lies, [So above ch.6.19. See the annot.. there] shall not escape."}],"6":[{"catchword":null,"tekst":"Many entreat the face [That is, the person. See of the Hebrew word taken in the same sense, Job 11:19. and the annot.] of the Prince; and every one is a friend to him, that giveth gifts. [Or, of the liberal man. See of the Hebrew word Nadib, Job 12.on verse 21. Hebrew to the man, or, of the man of gifts; that is, that is prone to give, and to communicate liberally.]"}],"7":[{"catchword":null,"tekst":"All the brethren [That is, that are of his kindred, though not affected to him with sincere and unfeigned love] of the poor [that is, of him that is improverished and decreased in wealth] do hate him: [that is, forsake him, even as if they hated him: or they love him less now, then they did before he was grown poor. See Genesis 20.on verse 31. Compare above chapter 14.20. and here verse 4.] how much more do his friends [that is, his acquaintance, and companions, though but in shew: for what an unfeigned friend is, see above chap. 17.17. and 18.24.] go far from him? He [to wit, the poor man] runneth after them [to wit, after his brethren, and friends] (with) words, [to wit, whereby he calleth unto them for help] which are not. [to wit, of any force or value; forasmuch as they are not accepted; but despised, and rejected. Or, but they, to wit, his brethren, and friends, are not the same; to wit, that they pretended themselves to be, before the improverished man by reason of his poverty ran after them. Oth. He pursueth words, which are not. That is, he relieth on promises, which they made unto him before he became poor, which are of no value.]"}],"8":[{"catchword":null,"tekst":"He that getteth understanding, [That is, he that endeavoureth to get understanding. Hebr. The heart; which word is often taken in Scripture for wisdom, and understanding. See Job 9.on verse 4.] loveth his (own) soul; he heedeth understanding, [See above ch.1.on ver.3.] to find good. [see ab.ch.16.on ver.20.]"}],"9":[{"catchword":null,"tekst":"A false witness [Hebr. A witness of falsehoods, [So above verse 5. See there the annot.] shall not be guiltless: and he that bloweth lies shall perish."}],"10":[{"catchword":null,"tekst":"Pleasure becometh not a fool: [The reason is, because he growth polisher thereby; that is, more wanton, and more wilful] how much less a servant to have rule over Princes? [so below ch.30.22.]"}],"11":[{"catchword":null,"tekst":"Understanding of a man differed his anger: [Hebr. Lengtheneth, or, prolongeth: that is, delayeth his anger, putteth it off, restraineth, or curbeth it. Oth. It is a mans discretion to defer his anger: The same phrase is also used, Isa 48:9.] and (it) is his ornament, [to wit, a mans ornament] to pass by the transgression. [that is, to pass by the wrong that is done to him, by forgetting, and forgiving it, so far as may stand with the glory of God, and with the good of man.]"}],"12":[{"catchword":null,"tekst":"The Kings wrath is as the roaring of a young lion: [Called by the Hebrews chepir, which is very fierce, and cruel, being older and bigger then a lions whelp, which they call gur. See Eze 19:2. Compare above chap.16.14. and below chapter 20.2.] but his delight [that is, his favour and good will, which he beareth to a man] is as dew upon the herb. [whereby the herb (or grass) is moistened, refreshed, and fed.]"}],"13":[{"catchword":null,"tekst":"A foolish son is his fathers great misery: [The Hebrew word is used in the plural number, to express the greatness or abundance of misery, and grief. Comp. Above chapter 10.1. and 15.20. and 17.25.] and the contentions of a woman [meaning a wife, who with her scolding and brawling may occasion much sadness, trouble and hurt in the whole family, and set it out of order] are (as) a continual dropping. [to wit, which rotteth the house, hurteth the household-stuff, annoyeth those of the household ort family, yea in the end driveth them also out of the house. Comp.bel.ch.27.15.]"}],"14":[{"catchword":null,"tekst":"House and riches are inheritance of the fathers: [that is, are inherited by children from their parents] but an understanding wife is from the LORD. [to wit, as a peculiar and principal gift, which is not given to every one, neither cometh it by inheritance, or succession. See above chapter 18.22.]"}],"15":[{"catchword":null,"tekst":"Slothness causeth (a man) to fall into deep sleep: [Slothfulness begetteth idleness: causeth sleepiness, whence issueth unhealthiness, languishing of the members, and dullness of the spirit; wherewith poverty is also wont to follow. See ab.ch.6.9,10,11. And bel.ch.20.13.] and a deceitful soul [meaning a man that will not work, and therefore seeketh to get a livelihood by evil and wicked practises. Comp.ab.ch.10.4.] shall suffer hunger."}],"16":[{"catchword":null,"tekst":"He that keepeth the commandment [That is, the commandments; to wit, the commandments of God; and especially those which he enjoineth and commandeth in the Moral law. See Gen.26.on verse 5.] keepeth his (own) soul: [Comp.ab.ch.3.21, 22.] he that despiseth his ways, [that is, taketh no heed to his life and conversation, or to his intentions, purposes, and actions, so as to order and form them all according to the Word of God] shall die."}],"17":[{"catchword":null,"tekst":"He that hath pity upon the poor, lendeth unto the LORD: and he [Namely, the Lord] will recompense his benefits unto him."}],"18":[{"catchword":null,"tekst":"Correct thy son, [To wit, with words and blows. See of the Hebrew word above chap.9.on verse 7.] while there is yet hope: [to wit, that he may be made better by instruction, and by chastening. Comp.ab.ch.13.24. and bel.ch.23.13.] but lift not up thy soul, to kill him. [to wit, through want of punishment, or too much beating, or other severity. That is, break not out into anger, with an evil desire, to &c. The lifting up of the soul signifieth indeed sometimes a good and lawful motion or moving of the mind, united and conjoined with an eager desire, and earnest longing, as Deut.24.15. Psa 25:1. Jer 44:14. but it signifieth also desire, and moving to that which is evil, as here, and Psa 24:4. Hos 4:6. Oth. And let not thine heart pardon (him) to his destruction, or, lift not up thy soul for his roaring; that is, care not for it.]"}],"19":[{"catchword":null,"tekst":"He that is great in wrath, [To wit, the son, that is very witful, and forward, or who because of the puniment roareth mighty, and maketh a loud noise] shall suffer punishment. [that is, ought not to escape punishment, yea even for the immoderate noise and great ado that he maketh] for if thou deliver (him), [to wit, from the punishment which he hath deserved] then thou must yet go on. [to wit, in punishing of him; because he being freed from chastening, will grow worse, and be the cause of much evil and mischief. Or, he shall pay a fine: for if thou ease him of it, that is, pay the fine for him, thou must do it more. Some take these w // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;

      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {

        if (kortCw) {

          }

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
