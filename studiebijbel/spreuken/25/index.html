:"Praal niet voor het aangezicht van de koning, en sta niet op de plaats van de groten;","7":"Want het is beter dat men tegen u zegt: Kom hier bovenaan, dan dat men u vernedert voor het aangezicht van een vorst, die uw ogen gezien hebben.","8":"Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben.","9":"Voer uw geschil met uw naaste; maar openbaar het geheim van een ander niet;","10":"Opdat hij die het hoort, u niet smaadt; want uw kwade reputatie zou niet worden afgewend.","11":"Een woord, op zijn tijd gesproken, is *als* gouden appels in zilveren gebeelde schalen.","12":"Een wijze bestraffer bij een luisterend oor, is een gouden oorsieraad, en een halssieraad van het fijnste goud.","13":"Een trouwe gezant is voor hen die hem zenden, als de koelte van sneeuw op de dag van de oogst; want hij verkwikt de ziel van zijn heer.","14":"Een man die zichzelf beroemt op een valse gift, is *als* wolken en wind, waar geen regen bij is.","15":"Een leider wordt door geduld overreed; en een zachte tong breekt het gebeente.","16":"Hebt u honig gevonden, eet zoveel als u genoeg is; opdat u er misschien niet zat van wordt, en het uitspuwt.","17":"Spaar uw voet voor het huis van uw naaste, opdat hij niet zat van u wordt, en u haat.","18":"Een man die tegen zijn naaste een valse getuigenis spreekt, is een hamer, en zwaard, en scherpe pijl.","19":"Het vertrouwen op een trouweloze, op de dag van benauwdheid, is *als* een gebroken tand en een verstuikte voet.","20":"Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, *en* *als* azijn op salpeter.","21":"Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;","22":"Want u zult vurige kolen op zijn hoofd hopen, en de HEERE zal het u vergelden.","23":"De noordenwind verdrijft de regen, en een vertoornd aangezicht de verborgen tong.","24":"Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.","25":"Een goede tijding uit een ver land is als koud water op een vermoeide ziel.","26":"De rechtvaardige, wankelend voor het aangezicht van de goddeloze, is een beroerde bron, en een verdorven springader.","27":"Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.","28":"Een man die zijn geest niet weerhouden kan, is een opengebroken stad zonder muur."},"SV":{"1":"Dit zijn ook spreuken van Salomo, die de mannen van Hizkia, den koning van Juda, uitgeschreven hebben.","2":"Het is Gods eer een zaak te verbergen; maar de eer der koningen een zaak te doorgronden.","3":"Aan de hoogte des hemels, en aan de diepte der aarde, en *aan* het hart der koningen is geen doorgronding.","4":"Doe het schuim van het zilver weg, en er zal een vat voor den smelter uitkomen;","5":"Doe den goddelozen weg van het aangezicht des konings, en zijn troon zal door gerechtigheid bevestigd worden.","6":"Praal niet voor het aangezicht des konings, en sta niet in de plaats der groten;","7":"Want het is beter, dat men tot u zegge: Kom hier bovenaan, dan dat men u vernedere voor het aangezicht eens prinsen, dien uw ogen gezien hebben.","8":"Vaar niet haastelijk voort om te twisten, opdat gij misschien in het laatste daarvan niet wat doet, als uw naaste u zou mogen beschaamd hebben.","9":"Twist uw twistzaak met uw naaste; maar openbaar het heimelijke van een ander niet;","10":"Opdat degene, die het hoort, u niet smade; want uw kwaad gerucht zou niet afgekeerd worden.","11":"Een rede, op zijn pas gesproken, is *als* gouden appelen in zilveren gebeelde schalen.","12":"Een wijs bestraffer bij een horend oor, is een gouden oorsiersel, en een halssieraad van het fijnste goud.","13":"Een trouw gezant is dengenen, die hem zenden, als de koude der sneeuw ten dage des oogstes; want hij verkwikt zijns heren ziel.","14":"Een man, die zichzelven beroemt over een valse gift, is *als* wolken en wind, waar geen regen bij is.","15":"Een overste wordt door lankmoedigheid overreed; en een zachte tong breekt het gebeente.","16":"Hebt gij honig gevonden, eet dat u genoeg is; opdat gij misschien daarvan niet zat wordt, en dien uitspuwt.","17":"Spaar uw voet van het huis uws naasten, opdat hij niet zat van u worde, en u hate.","18":"Een man, tegen zijn naaste een valse getuigenis sprekende, is een hamer, en zwaard, en scherpe pijl.","19":"Het vertrouwen op een trouweloze, ten dage der benauwdheid, is *als* een gebroken tand en verstuikte voet.","20":"Die liederen zingt bij een treurig hart, is gelijk hij, die een kleed aflegt ten dage der koude, *en* *als* edik op salpeter.","21":"Indien dengene, die u haat, hongert, geef hem brood te eten; en zo hij dorstig is, geef hem water te drinken;","22":"Want gij zult vurige kolen op zijn hoofd hopen, en de HEERE zal het u vergelden.","23":"De noordenwind verdrijft den regen, en een vergramd aangezicht de verborgen tong.","24":"Het is beter te wonen op een hoek van het dak, dan met een kijfachtige huisvrouw, en dat in een huis van gezelschap.","25":"Een goede tijding uit een ver land is als koud water op een vermoeide ziel.","26":"De rechtvaardige, wankelende voor het aangezicht des goddelozen, is een beroerde fontein, en verdorven springader.","27":"Veel honigs te eten is niet goed; maar de onderzoeking van de heerlijkheid van zulke dingen is eer.","28":"Een man, die zijn geest niet wederhouden kan, is een opengebrokene stad zonder muur."},"KJV":{"1":"These *are* also proverbs of Solomon, which the men of Hezekiah king of Judah copied out.","2":"*It is* the glory of God to conceal a thing: but the honour of kings *is* to search out a matter.","3":"The heaven for height, and the earth for depth, and the heart of kings *is* unsearchable.","4":"Take away the dross from the silver, and there shall come forth a vessel for the finer.","5":"Take away the wicked *from* before the king, and his throne shall be established in righteousness.","6":"Put not forth thyself in the presence of the king, and stand not in the place of great","7":"For better *it is* that it be said unto thee, Come up hither; than that thou shouldest be put lower in the presence of the prince whom thine eyes have seen.","8":"Go not forth hastily to strive, lest *thou know not* what to do in the end thereof, when thy neighbour hath put thee to shame.","9":"Debate thy cause with thy neighbour *himself*; and discover not a secret to another:","10":"Lest he that heareth *it* put thee to shame, and thine infamy turn not away.","11":"A word fitly spoken *is like* apples of gold in pictures of silver.","12":"*As* an earring of gold, and an ornament of fine gold, *so is* a wise reprover upon an obedient ear.","13":"As the cold of snow in the time of harvest, *so is* a faithful messenger to them that send him: for he refresheth the soul of his masters.","14":"Whoso boasteth himself of a false gift *is like* clouds and wind without rain.","15":"By long forbearing is a prince persuaded, and a soft tongue breaketh the bone.","16":"Hast thou found honey? eat so much as is sufficient for thee, lest thou be filled therewith, and vomit","17":"Withdraw thy foot from thy neighbour's house; lest he be weary of thee, and *so* hate","18":"A man that beareth false witness against his neighbour *is* a maul, and a sword, and a sharp arrow.","19":"Confidence in an unfaithful man in time of trouble *is like* a broken tooth, and a foot out of joint.","20":"*As* he that taketh away a garment in cold weather, *and as* vinegar upon nitre, so *is* he that singeth songs to an heavy heart.","21":"If thine enemy be hungry, give him bread to eat; and if he be thirsty, give him water to drink:","22":"For thou shalt heap coals of fire upon his head, and the LORD shall reward","23":"The north wind driveth away rain: so *doth* an angry countenance a backbiting tongue.","24":"*It is* better to dwell in the corner of the housetop, than with a brawling woman and in a wide house.","25":"*As* cold waters to a thirsty soul, so *is* good news from a far country.","26":"A righteous man falling down before the wicked *is as* a troubled fountain, and a corrupt spring.","27":"*It is* not good to eat much honey: so *for men* to search their own glory *is not* glory.","28":"He that *hath* no rule over his own spirit *is like* a city *that is* broken down, *and* without walls."}},"tsk":{"1":[{"kopje":"spreuken","refs":["Spr 1:1","Spr 10:1","1 Kon 4:32","Pred 12:9"]},{"kopje":"die","refs":["Jes 1:1","Jes 36:22","Jes 37:2","Hos 1:1","Micha 1:1"]}],"2":[{"kopje":"de eer","refs":["Deut 29:29","Job 11:7","Job 11:8","Job 38:4-3","Job 39:4-33","Job 39:35","Job 42:3","Rom 11:33","Rom 11:34"]},{"kopje":"de eer","refs":["1 Kon 3:9-28","1 Kon 4:29-34","Ezra 4:15","Ezra 4:19","Ezra 5:17","Ezra 6:1","Job 29:16"]}],"3":[{"kopje":"hemel","refs":["Ps 103:11","Jes 7:11","Jes 55:9","Rom 8:39"]},{"kopje":"is geen doorgronding","refs":["1 Kon 4:29","1 Petr 1:7"]}],"5":[{"kopje":"weg","refs":["Spr 20:8","1 Kon 2:33","1 Kon 2:46","Est 7:10","Est 8:11-17","Ps 101:7","Ps 101:8"]},{"kopje":"zijn","refs":["Spr 16:12","Spr 20:28","Spr 29:14","Jes 9:6","Jes 16:5"]}],"6":[{"kopje":"Praal niet","refs":["Spr 25:27","Spr 27:2"]},{"kopje":"voor het aangezicht","refs":["Spr 16:19","Ex 3:11","1 Sam 9:20-22","1 Sam 15:17","1 Sam 18:18-23","2 Sam 7:8-17","Ps 131:1","Jer 1:6-10","Amos 7:12-15"]}],"7":[{"kopje":"dat men","refs":["Spr 16:19","Luk 14:8-10"]},{"kopje":"Kom","refs":["Openb 4:1"]},{"kopje":"dan","refs":["Luk 18:14","1 Petr 5:5"]}],"8":[{"kopje":"haastig","refs":["Spr 17:14","Spr 18:6","Spr 30:33","2 Sam 2:14-16","2 Sam 2:26","2 Kon 14:8-12","Luk 14:31","Luk 14:32"]},{"kopje":"wat","refs":["Spr 14:12","Jer 5:31","Matt 5:25"]}],"9":[{"kopje":"met","refs":["Matt 18:5-17"]},{"kopje":"het geheim van een ander","refs":["Spr 11:13","Spr 20:19"]}],"10":[{"kopje":"uw","refs":["Ps 119:39"]}],"11":[{"kopje":"woord","refs":["Spr 15:23","Spr 24:26"," "H2714\">search</span> their own <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> is not glory.","28":"<span class=\"wl wl-kjv\" data-code=\"H376\">He</span> that hath no <span class=\"wl wl-kjv\" data-code=\"H4623\">rule</span> over his own <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> is like a <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> that is broken <span class=\"wl wl-kjv\" data-code=\"H6555\">down,</span> and without walls."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de mannen","tekst":"Versta, wijzen, of profeten, die geleefd hebben ten tijde van den koning Hizkia, en wien hij dit werk gelast heeft, hetwelk zij door ingeving des Heiligen Geestes volbracht hebben."},{"catchword":"uitgeschreven","tekst":"Dit meent men geschied te zijn als de koning Hizkia den kerkelijken en den burgerlijken staat van zijn rijk in orde stelde; want Salomo had drieduizend spreuken gesproken; 1Ki 4:32 ."}],"2":[{"catchword":"Het is Gods eer","tekst":"Dat is, het dient tot Gods eer."},{"catchword":"zaak te verbergen;","tekst":"Te weten, van hetgeen Hij bij zichzelven besluit en te zijner tijd uitvoert, hetwelk dikwijls voor aller redelijke creaturen verstand onbegrijpelijk is, en dat wij niet nieuwsgierig moeten onderzoeken, maar ootmoedig aanbidden, waarmede Hij vereerd wordt. Vergelijk Deu 29:29 ; Rom 11:33 ."},{"catchword":"zaak te doorgronden","tekst":"Te weten die hunne regering aangaat, en daarvan kennis en verstand moeten hebben, opdat zij hunnen onderdaden goed recht doen en hunne regering wijselijk aanleggen mogen."}],"3":[{"catchword":"geen doorgronding","tekst":"Te weten die bij geen mensen volkomenlijk geschieden kan en maar stuksgewijze bij velen, en bij het merendeel gans gene."}],"4":[{"catchword":"Doe het schuim","tekst":"Gelijk het zilver gereinigd van schuim en droesem een bekwame hoeveelheid werd, waar de zilversmid een schoon stuk werk van maakt; alzo een koning, het schuim van boeven en onrechtvaardige mensen van zich werende, maakt zijn hof eerlijk en zijn rijk wordt bevestigd."}],"6":[{"catchword":"Praal","tekst":"Of, stelt u niet heerlijk, of groots, te weten in woorden, of gelaat, of kleding, of op enige andere wijze."},{"catchword":"en sta niet","tekst":"Te weten dewijl gij van het getal der groten niet zijt. Versta door de groten, die groot zijn door hunne afkomst, staat, ambt, gaven, waardigheid. Zie 2Ki 10:6 ."}],"7":[{"catchword":"Kom hier bovenaan,","tekst":"Vergelijk Luk 14:10 ."},{"catchword":"prinsen,","tekst":"Zie van het Hebreeuwse woord Job 12:21 ."},{"catchword":"dien uw ogen","tekst":"Dat is, bij wien gij u te na gevoegd hebt om hem met al te grote vrijheid in het aangezicht te zien. Anders: dat het uwe ogen zien; dat is, dat gij het voor uwe ogen moet zien, zonder het te kunnen keren."}],"8":[{"catchword":"haastelijk","tekst":"Dat is, lichtvaardiglijk, onbedachtelijk."},{"catchword":"daarvan","tekst":"Te weten van haastelijk tot twistingen en pleitingen te komen."},{"catchword":"wat doet,","tekst":"Te weten dat onredelijk en strafbaar zou wezen, als met kijven, vechten, kwetsen en doden."},{"catchword":"uw naaste","tekst":"Te weten, die tegen u twist of pleit."},{"catchword":"beschaamd hebben","tekst":"Te weten, mits u door het recht te verwinnen en te bewijzen dat gij hem met onrecht en valsheid hebt beklaagd."}],"9":[{"catchword":"Twist uw twistzaak","tekst":"Dat is, indien gij geschil hebt met uwen naaste, poog dat eerst af te doen tussen u beiden, en verhaast u niet om dat voor den rechter te brengen."},{"catchword":"openbaar","tekst":"Dat is, gedraag u zo beleefd in uw geschil, dat gij uwen naaste in zijn eer niet kwetst, mits te ontdekken dat wel verzwegen mocht zijn. Of, ontdek niet wat u een ander in het geheim gezegd heeft; hetzij dat hij u raad in uwe zaak heeft gegeven, of dat hij anderszins niet wil hebben dat het een ander weten zal."}],"10":[{"catchword":"smade;","tekst":"Te weten door u voor een oorblazer of achterklapper te schelden."},{"catchword":"afgekeerd","tekst":"Dat is, niet ophouden, maar u steeds bijblijven."}],"11":[{"catchword":"op zijn pas","tekst":"Dat is, te zijner tijd en plaats en ten bondigste. Hebreeuws, naar zijne wijzen, of raderen."},{"catchword":"in zilveren","tekst":"Of, zilveren schilderijen, of beeltenissen. Anders: met zilveren lofwerk versierd."}],"12":[{"catchword":"horend oor","tekst":"Dat is, die gewillig en naarstig is om naar goede vermaning te luisteren."},{"catchword":"gouden","tekst":"Dat is, gelijk een gouden oorsiersel. Zie van het Hebreeuwse woord Gen 24:22 ."},{"catchword":"halssieraad","tekst":"Anders: halsband; anders: juweel, of sieraad."}],"13":[{"catchword":"dengenen,","tekst":"Hij ziet op de wijze dergenen, die in hete landen wonen, en hun drank in de hitte van den zomer verkoelen met ijs of sneeuw, welke zij in diepe kelders onder de aarde daartoe bewaren."},{"catchword":"ten dage des oogstes;","tekst":"Te weten, den maaiers is, als zij door de hitte van den dag en de zwaarheid van hun arbeid dorstig zijnde, verlangen naar koelen drank."},{"catchword":"verkwikt","tekst":"Te weten als hij goede tijding wederbrengt; zie van het Hebreeuwse woord Psa 19:8 ."}],"14":[{"catchword":"valse gift,","tekst":"Dat is, die hij wel met woorden belooft, maar metterdaad niet geeft. Hebreeuws, gift der valsheid."},{"catchword":"als","tekst":"Van dezelfde gelijkenis kan men ook zien 2Pe 2:17 , en Jud 1:12 ."},{"catchword":"regen","tekst":"Het Hebreeuwse woord geschem betekent wel meest een plasregen, die met groten overvloed en geweld nedervalt, gelijk Gen 7:12 , en Gen 8:2 ; Ezr 10:9 ; maar hier schijnt het alleen regen te betekenen, gelijk 1Ki 17:7 ."}],"15":[{"catchword":"overreed;","tekst":"Dat is, bewogen, als door redenen, om te doen hetgeen waar hij anderszins niet toe gezind is."},{"catchword":"zachte tong","tekst":"Dat is, zachtmoedige rede."},{"catchword":"het gebeente","tekst":"Dat is, het gemoed, dat zo hard is als been, of [gelijk wij zeggen] als steen."}],"16":[{"catchword":"honig","tekst":"Versta, onder dit woord allerlei lieflijk voedsel, waarvan wij onze bekomst mogen nemen, met vermijding van het onmatig misbruik. Sommigen verstaan hierdoor de onderzoeking van hoge en hemelse zaken, die den geest des mensen wel aangenaam zijn, maar de mate van zijn begrip teboven gaan. Men kan vs.16 ook verstaan van het rechte gebruik der ware vriendschap, die zeer lieflijk is, waarvan in vs.17 gesproken wordt."},{"catchword":"dat u genoeg is;","tekst":"Hebreeuws, uwe genoegzaamheid; dat is: uwe bekomst, zoveel als uwe gezondheid verdragen mag."},{"catchword":"zat wordt,","tekst":"Te weten zo gij meer at dan u genoeg is."}],"17":[{"catchword":"Spaar","tekst":"Of, onttrek uwen voet. Hebreeuws, houd uwen voet kostelijk; dat is spaarzaam, van in uws naasten huis al te vrijelijk te komen en zijn gemeenzaamheid, die hij u toont, onbeleefd te misbruiken. Vergelijk 1Sa 3:1 ."}],"18":[{"catchword":"sprekende,","tekst":"Hebreeuws, antwoordende. Zie Jdg 18:14 ."}],"19":[{"catchword":"Het vertrouwen","tekst":"Hebreeuws, het vertrouwen des trouwelozen; dat is, dat men op een trouwelozen vriend stelt, of dat de trouweloze zelf ergens op heeft in den tijd des noods."},{"catchword":"als","tekst":"Te weten om daarmede te kauwen als men hongerig is."},{"catchword":"verstuikte","tekst":"Te weten om daarmede te lopen als men weg moet. Het Hebreeuwse woord betekent eigenlijk een voet, die door de verstuiktheid wankelende gemaakt is."}],"20":[{"catchword":"treurig hart,","tekst":"Hebreeuws, kwaad of boos; dat is droevig of treurig. Zie Gen 40:7 . Alzo wordt goed voor blijde genomen. Zie 1Ki 21:7 . De zin nu hier is dat het niet wel past, blijde liedjes te zingen bij den droevige; want bij dezen zal men droevig zijn, en bij den blijde blijde; Rom 12:15 ."},{"catchword":"een kleed","tekst":"Hetwelk buiten tijds is."},{"catchword":"edik","tekst":"Die het salpeter dissolveert, of doet smelten."}],"21":[{"catchword":"brood","tekst":"Versta door brood en water de gehele lichamelijke nooddruft; te weten spijs en drank. Zie 1Ki 13:8 , en de aantekening."}],"22":[{"catchword":"vurige kolen","tekst":"Dat is, gij zult hem daartoe drijven, dat hij de vijandschap, die hij jegens u heeft, haast van zich werpt; gelijk iemand, wien gloeiende kolen op het hoofd gelegd zouden worden, die terstond zou afschudden. Of, gij zult zijn hart vermurwen en gedwee maken, dat hij van zijn ongelijk overtuigd zal zijn; gelijk de smede het ijzer met gloeiende kolen vermurwen."},{"catchword":"hopen,","tekst":"Hebreeuws, nemen; dat is, nemende hopen. De Hebreën begrijpen dikwijls onder een woord nog de betekenis van een ander. Zie Gen 12:15 ."},{"catchword":"u vergelden","tekst":"Te weten het goed, dat gij uwen vijand gedaan hebt, hoewel hij jegens u ondankbaar is."}],"23":[{"catchword":"verdrijft","tekst":"Hebreeuws, doet smart of weedom aan; hetwelk sommigen verstaan van verdrijven, anderen van baren."},{"catchword":"vergramd","tekst":"Te weten van een wijs en vroom man, die daarin geen behagen heeft."},{"catchword":"verborgen","tekst":"Hebreeuws, een tong der verborgenheid; dat is, die niet recht uitspreekt, maar omgaat met bedrog, vleiing, achterklap, steking en terging, enz."}],"24":[{"catchword":"Het is beter","tekst":"Zie de verklaring van vs.24 boven Pro 21:9 ."},{"catchword":"kijfachtige","tekst":"Hebreeuws, ene huisvrouw der kijvingen."}],"25":[{"catchword":"ziel","tekst":"Dat is, mens of persoon; zie Gen 12:5 . De zin is dat een mens met een goede tijding zo wel verkwikt is, als een die vermoeid is, met vers koel water."}],"26":[{"catchword":"wankelende","tekst":"Te weten enigen misslag doende voor de ogen van den onvrome. Of, niet durvende zijn ambt doen om den onvrome te bestraffen; vergelijk Job 4 ."},{"catchword":"fontein,","tekst":"Der vromen monden en leringen worden vergeleken bij fonteinen en springaders, waaruit alle goede onderwijzingen vloeien, boven Pro 10:11 , en Pro 13:14 , en Pro 16:22 . Wanneer zij dan door enige zwarigheid in zulk hun ambt komen te falen, zo is dat alsof de fontein beroerd en modderig ware en de springader verstopt."}],"27":[{"catchword":"niet goed;","tekst":"Maar wel kwaad en schadelijk. Vergelijk boven vs.16."},{"catchword":"zulke dingen","tekst":"Te weten die den honig gelijk zijn, dat is die zoet, lieflijk en vermakelijk zijn, als de onderzoeking van de natuur der werken Gods, der geschiedenissen in de wereld, enz."},{"catchword":"is eer","tekst":"Te weten, als men daarin behoorlijke maat houdt, de rechte streek der waarheid volgt, en het rechte gebruik en einde bekomt. vs.27 is anders aldus overgezet: Veel honig te eten is [den mens] niet goed en [gene] eer de nazoeking van hun eigen eer."}],"28":[{"catchword":"die zijn geest","tekst":"Dat is, die zijn gemoed, gedachten en bewegingen niet intomen en vermeesteren kan. Hebreeuws, wiens geest gene wederhouding of heerschappij heeft."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"These are also Proverbs of Salomon, which the men of Hizkia King of Juda copied out. [Understand by these, wise men, or prophets, that lived in Kings Hizkia&acirc;&euro;&trade;s time, and to whom he committed this work to be done, which they performed by the instinct, or inspiration of the holy Ghost. This is thought to have been done, when King Hizkia settled both the Ecclesiastical and Civil state of his Kingdom in order. For Salomon had spoken three thousand proverbs, 1 Kings 4.32.]"}],"2":[{"catchword":null,"tekst":"It is the glory of God, [That is, it tendeth to Gods glory] to conceal a matter; [to wit, concerning that which he secretly decreeth with himself, and executeth in due time, which is oftentimes incomprehensible to wisdom and understanding all reasonable creatures, and which we may not curiously dive and search into, but ought with all humility and reverence to admire and adore; whereby he is honoured and exalted. Compare Deut.29.29. Rom 11:33.] but the honour of a King is to search out a matter, [to wit, that concerneth their government, and whereof they ought to have knowledge, and understanding, that they may do justice and judgement unto their subjects, and wisely and prudently manage their government.]"}],"3":[{"catchword":null,"tekst":"At the height of heaven, and (at) the depth of the earth, and (at) the heart of Kings, (there) is no searching. [To wit, which may be done fully and perfectly by any, and is or can be done but in part by many, and by the greatest part of men in no wise at all.]"}],"4":[{"catchword":null,"tekst":"Take away the dross from the silver; and there shall come forth a vessel for the finer."}],"5":[{"catchword":null,"tekst":"Take away the wicked from the face of the King: and his throne shall be established in righteousness. [As silver that is purified from scum and dross, becometh fit matter for the Gold-smith to make some precious vessel thereof; so a King by putting away from him the scum and dross of wicked and unrighteous persons, maketh his Court honourable, and established his Throne and Kingdom thereby. Compare above chapter 20. Verse 8. And 28.]"}],"6":[{"catchword":null,"tekst":"Be not proud [Or, do not demean thy self stately, or, haughty; to wit, either in words, or behaviour, or apparel, or any other way] before the face of the King: and stand not in the place of great men. [to wit, in regard thou art not of the number of great men. Understand by great men, those that be great in regard of birth, honour, office, gifts, dignity, &c. See 2 Kings 10.on ver.6.]"}],"7":[{"catchword":null,"tekst":"For better it is, that be said unto thee: Come up hither; then that thou shouldest be put lower before the face of the prince, [Compare Luk 14:8,9,10. Of the Hebrew word rendered here Prince, see Job 12.on verse 21.] whom thine eyes have seen. [that is, unto whom thou hast joined thy self too near, as to look him in the face with too great boldness. Oth. That thine eyes should see it; that is, that thou shalt be fain to see it with thine own eyes, without being able to shun it.]"}],"8":[{"catchword":null,"tekst":"Go not forth hastily [That is, rashly, unadvisedly] to strive: lest peradventure in the end thereof [To wit, of entering hastily into strifes and suits] thou do act something, [to wit, that should be unseemly, and worthy of punishment, as quarrelling, fighting, wounding, and killing] when thy neighbour [to wit, that contendeth, or goeth to law with thee] shall have made thee ashamed. [to wit, by conquering thee at law, and by making it appear, that thou hast impleaded him wrongfully and erroneously.]"}],"9":[{"catchword":null,"tekst":"Debate thy cause with thy neighbour; [That is, if thou hast a controversy with thy neighbour, endeavour first to take up the business among your selves, and be not over hasty to sue one another presently at law] and reveal not anothers secret: [that is, be have thy self so modest and temperate in thy suit, that thou wrong not thy neighbour in his reputation; by discovering that which might very well be concealed. Or discover not that which another hath told thee in private, whether it be he that hath given thee counsel concerning thine own affairs, or whether it but such a thing, as he would by no means have another to know it.]"}],"10":[{"catchword":null,"tekst":"Lest he that heareth it, reproach thee, [To wit, by calling thee a whisperer, or tale-bearer] for thy ill report will not be turned away. [that is, will not cease, but will abide continually with thee.]"}],"11":[{"catchword":null,"tekst":"A sentence fitly spoken [That is, in due time, and place, and to purpose. Hebr. According to its ways, or, wheels] is (as) golden apples in silver pictured bowls. [or, silver pictures, or, images. Oth. Adorned with silver leaf-work.]"}],"12":[{"catchword":null,"tekst":"A wise reprove to an hearing ear [That is, to an ear that is willing, and diligent to hearken to good instruction and advice] is a golden ear-ring, [that is, as a golden ear-ring. See of the Hebrew word, Gen.24.on verse 22.] and a neck-lace [oth. Collar. Oth. Jewel, or, ornament] of the finest gold."}],"13":[{"catchword":null,"tekst":"A faithful ambassador is to them that send him, as the cold of snow in the day of harvest; [to wit, is to the reapers, when being very thirsty by reason of the heat of the day, and the hardness of their labour, they long for a draught of cool drink to quench their thirst. He hath respect to the manner or custom of those that dwell in hot countries, and in the heat of summer cool their drink with ice, or snow, which for that very purpose they keep in deep cellars under the ground] for he refresheth the soul of his masters. [to wit, when he bringeth good tidings back. See of the Hebrew word rendered refreshing, Psalm 19.on verse 8. Compare above chapter 13.17.]"}],"14":[{"catchword":null,"tekst":"A man that boasteth himself of a false gift [That is, which he indeed promiseth in words, but giveth it not in deed, and in truth. Hebr. Gift of falsehood] is (as) clouds, and wind, and where no rain is withal. [See also of the same similitude, 2 Pet.2.17. and Jude verse 12. The Hebrew word geschem rendered here rain, signifieth for the most part a great shower of rain, which falleth down in great abundance, and with a mighty violence, as Gen 7:12. and 8.2. Ezra 10 9. But here it seemeth to signify all kind of rain, as 1 Kings 17.7.]"}],"15":[{"catchword":null,"tekst":"By long forbearing a Ruler is persuaded; [That is, moved, as with reasons and arguments to do that, whereunto otherways he had no mind nor inclination] and a soft tongue breaketh the bone. [that is, the mind, which is as hard as bone, or (as we use to say) as hard as stone. Compare above chapter 15.1. and 16.14.]"}],"16":[{"catchword":null,"tekst":"Hast thou found honey? Eat that which is sufficient for thee. [Understand under the word honey all manner of pleasant food, whereof as much as may suffice nature, so as to avoid all excessive and immoderate abuse of the creature. Some understand hereby the searching after high and heavenly things, which are indeed delightful pleasant to the spirit of man, but do exceed and surmount the measure of his apprehension. This verse may be likewise understood of the right use of true friendship, which is very pleasant and delightful, whereof mention is made in the next verse. Hebr. Thy sufficiency; that is, as much as sufficeth nature, as much as thy health will bear, or suffer thee to eat] lest thou be filled therewith, and vomit it up. [to wit, thou shouldest eat more then is sufficient for thee, or more then will doe thee good.]"}],"17":[{"catchword":null,"tekst":"Spare thy foot from thy neighbours house, [Or, withdraw thy foot, &c. Hebr. Keep thy foot precious; that is, sparing, from going too boldly into thy neighbours house, and discourteously abusing the familiarity and kindness which he sheweth towards thee. Compare 1 Sam.3. on verse 1.] left he be full thee, and hate thee."}],"18":[{"catchword":null,"tekst":"A man speaking [Hebr. Answering. See Judg.18.on verse 14.] false witness against his neighbour, is a hammer, and a sword, and a sharp arrow. [compare Psa 11:2. and 57.5. and 59.8. and 120.4. above chapter 12.18.]"}],"19":[{"catchword":null,"tekst":"Confidence in an unfaithful man in the day of distress, [Hebr. The confidence of an unfaithful man; that is, the confidence that is put in an unfaithful friend, or the confidence which an unfaithful person himself hath in any thing in time of need] is like a broken tooth, [to wit, to chew therewith, when a man is hungry] and a foot out of joint. [to wit, to run therewith, when a man must haste away. The Hebrew word signifieth properly a foot, that because it is out of joint, is ever ready to stumble and fall.]"}],"20":[{"catchword":null,"tekst":"He that singeth songs to a sorrowful [Hebrew evil, or bad; that is, sorrowful, or heavy, or grieved. See Gen.40.on verse 7. So the word good is likewise taken for merry, or joyful. See 1 Kings 21.on verse 7.] heart, is as he that putteth off a garment in the day of cold, [which is a thing very unseasonable] (and as) vinegar upon salt-peter. [which dissolveth the salt-peter, or causeth it to melt. The meaning is, that it is not a seemly thing to sing mercy songs in the presence of those that are sad and heavy; for with those we ought to be sad and heavy, and to be joyful with those that are joyful, Rom 12:15.]"}],"21":[{"catchword":null,"tekst":"If he that hateth thee, be hungry, giveth him bread to eat; and if he thirsty, give him water to drink: [Understand by bread, and water, all bodily necessaries; to wit, meat and drink, see 1 Kings 13.8. and the annot.]"}],"22":[{"catchword":null,"tekst":"For thou shalt heap [Hebr. Take; that is, taking heap. The Hebrews do often comprehend under one word also the signification of another. See Gen.12.on verse 15.] fiery coals upon his head: [that is, thou shalt bring him to this, that he will soon lay aside all malice and enmity, that he hath against thee, as one that should have hot burning coals laid upon his head, eh would presently shake them off from him. Or thou shalt soften his heart, and make it pliable, that he shall be convinced of the wrong that he hath done thee: as Smiths are wont to mollify and sharpen iron with hot burning coals] and the LORD shall reward thee. [to wit, the good that thou hast done to thine enemy, although he be unthankful toward thee.]"}],"23":[{"catchword":null,"tekst":"The north-wind driveth away [Hebr. Causeth, or, procureth sorrow, or, pain: which some understand of driving away, others of bearing or bringing forth] rain: and an angry countenance [to wit, of a wise, and godly man, who taketh no delight in such a tongue as is here mentioned] the secret tongue. [Hebr. A tongue of secrecy; that is, that speaketh not down-right, but useth deceit, flattering, back-biting, stinging, and provoking, &c.]"}],"24":[{"catchword":null,"tekst":"It is better to dwell in a corner of the house-top, then with a brawling wife, [Hebr. A wife of brawlings] and that in an house of company. [See the exposition of this verse above chapter 21. On verse 9. Compare also verse 19. Of the same chapter.]"}],"25":[{"catchword":null,"tekst":"Good news from a far land is as cold water to a wearied soul. [That is, man, or person. See Gen.12.on verse 5. The meaning is, that a man is well refreshed and cheared by hearing good news, as one that is weary and thirsty, is refreshed and cheared with fresh cool water.]"}],"26":[{"catchword":null,"tekst":"The righteous man stumbling before the face of the wicked, [To wit, commiting some fault in the sight of a wicked man. Or, not daring to do his duty, in reproving a wicked person. Compare Job 4.on verse 4.] is a troubled fountain, and corrupt spring. [the mouths and teachings of godly men are resembled to fountains and springs, whence all good instructions flow, above ch.10.11. and 12.14. and 16.22. When therefore by reason of some cross or affliction, they come to fail in the performance of this duty of theirs, then is it as if the fountain were troubled, and muddy, and the spring or well stopped.]"}],"27":[{"catchword":null,"tekst":"It is good to eat much honey: [But indeed bad, and hurtful. Compare above verse 16.] but the searching of the glory of such things, [to wit, that are like unto honey; that is, that are sweet, pleasant, and delightful, as the searching of the nature of Gods works, of things done in the world, &c.] is honour. [to wit, when men keep due measure and moderation therein, follow the right line and rule of truth, and obtain the right use and end. This verse is otherwise thus rendered: It is not good (for a man) to eat much honey, and (no) glory the searching of their own glory.]"}],"28":[{"catchword":null,"tekst":"A man that cannot restrain his (own) spirit, [That is, he that cannot bridle, or master his mind, or affections, and motions. Hebr. Whose spirit hath not restraint, or, rule] is a city broken open without a wall."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);

  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat

// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}

  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
