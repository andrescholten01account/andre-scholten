e kennis is voor de verstandige licht.","7":"Ga weg van het gezicht van een dwaze man; want u zou bij hem geen lippen van kennis merken.","8":"De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.","9":"Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.","10":"Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.","11":"Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.","12":"Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.","13":"Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.","14":"Wie afvallig van hart is, zal verzadigd worden van zijn eigen wegen; maar een goed man van zichzelf.","15":"De onnozele gelooft elk woord; maar de kloekzinnige let goed op zijn gang.","16":"De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.","17":"Wie haastig is tot toorn, zal dwaasheid doen; en een man met schandelijke plannen zal gehaat worden.","18":"De onnozelen erven dwaasheid; maar de kloekzinnigen zullen zich met kennis kronen.","19":"De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.","20":"De arme wordt zelfs door zijn vriend gehaat; maar de liefhebbers van de rijke zijn met velen.","21":"Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.","22":"Dwalen zij niet, die kwaad beramen? Maar goedertierenheid en trouw is er voor hen die goed beramen.","23":"In alle smartelijke arbeid is winst; maar het woord van de lippen leidt alleen tot gebrek.","24":"De kroon van de wijzen is hun rijkdom; de dwaasheid van de dwazen is dwaasheid.","25":"Een waarachtig getuige redt zielen; maar wie leugens uitwaait, is een bedrieger.","26":"In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.","27":"De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.","28":"In de menigte van het volk is de heerlijkheid van de koning; maar in gebrek aan volk is het verval van een vorst.","29":"Wie lankmoedig is, is groot van verstand; maar wie haastig is van gemoed, verheft de dwaasheid.","30":"Een gezond hart is het leven van het vlees; maar afgunst is verrotting van de beenderen.","31":"Wie de arme verdrukt, smaadt zijn Maker; maar wie zich over de behoeftige ontfermt, eert Hem.","32":"De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.","33":"Wijsheid rust in het hart van de verstandige; maar wat in het binnenste van de dwazen is, wordt bekend.","34":"Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.","35":"Het welbehagen van de koning is over een verstandige knecht; maar zijn verbolgenheid zal zijn over hem die beschaamd maakt."},"SV":{"1":"Elke wijze vrouw bouwt haar huis; maar die zeer dwaas is, breekt het af met haar handen.","2":"Die in zijn oprechtheid wandelt, vreest den HEERE; maar die afwijkt in zijn wegen, veracht Hem.","3":"In den mond des dwazen is een roede des hoogmoeds; maar de lippen der wijzen bewaren hen.","4":"Als er geen ossen zijn, zo is de krib rein; maar door de kracht van den os is der inkomsten veel.","5":"Een waarachtig getuige zal niet liegen; maar een vals getuige blaast leugens.","6":"De spotter zoekt wijsheid, en er is gene; maar de wetenschap is voor den verstandige licht.","7":"Ga weg van de tegenwoordigheid eens zotten mans; want gij zoudt *bij* *hem* geen lippen der wetenschap merken.","8":"De wijsheid des kloekzinnigen is zijn weg te verstaan; maar dwaasheid der zotten is bedriegerij.","9":"Elke dwaas zal de schuld verbloemen; maar onder de oprechten is goedwilligheid.","10":"Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met deszelfs blijdschap niet vermengen.","11":"Het huis der goddelozen zal verdelgd worden; maar de tent der oprechten zal bloeien.","12":"Er is een weg, die iemand recht schijnt; maar het laatste van dien zijn wegen des doods.","13":"Het hart zal ook in het lachen smart hebben; en het laatste van die blijdschap is droefheid.","14":"Die afkerig van hart is, zal van zijn wegen verzadigd worden; maar een goed man van zich zelven.","15":"De slechte gelooft alle woord; maar de kloekzinnige merkt op zijn gang.","16":"De wijze vreest, en wijkt van het kwade; maar de zot is oplopende toornig, en zorgeloos.","17":"Die haastig is tot toorn, zal dwaasheid doen; en een man van schandelijke verdichtselen zal gehaat worden.","18":"De slechten erven dwaasheid; maar de kloekzinnigen zullen zich met wetenschap kronen.","19":"De kwaden buigen voor het aangezicht der goeden neder, en de goddelozen voor de poorten des rechtvaardigen.","20":"De arme wordt zelfs van zijn vriend gehaat; maar de liefhebbers des rijken zijn vele.","21":"Die zijn naaste veracht, zondigt; maar die zich der nederigen ontfermt, die is welgelukzalig.","22":"Dwalen zij niet, die kwaad stichten? Maar weldadigheid en trouw is voor degenen, die goed stichten.","23":"In allen smartelijken arbeid is overschot; maar het woord der lippen *strekt* alleen tot gebrek.","24":"Der wijzen kroon is hun rijkdom; de dwaasheid der zotten is dwaasheid.","25":"Een waarachtig getuige redt de zielen; maar die leugens blaast, is een bedrieger.","26":"In de vreze des HEEREN is een sterk vertrouwen, en Hij zal Zijn kinderen een Toevlucht wezen.","27":"De vreze des HEEREN is een springader des levens, om af te wijken van de strikken des doods.","28":"In de menigte des volks is des konings heerlijkheid; maar in gebrek van volk is eens vorsten verstoring.","29":"De lankmoedige is groot van verstand; maar die haastig is van gemoed, verheft de dwaasheid.","30":"Een gezond hart is het leven des vleses; maar nijd is verrotting der beenderen.","31":"Die den arme verdrukt, smaadt deszelfs Maker; maar die zich des nooddruftigen ontfermt, eert Hem.","32":"De goddeloze zal heengedreven worden in zijn kwaad; maar de rechtvaardige betrouwt *zelfs* in zijn dood.","33":"Wijsheid rust in het hart des verstandigen; maar wat in het binnenste der zotten is, wordt bekend.","34":"Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek der natiën.","35":"Het welbehagen des konings is over een verstandigen knecht; maar zijn verbolgenheid zal zijn *over* dengene, die beschaamd maakt."},"KJV":{"1":"Every wise woman buildeth her house: but the foolish plucketh it down with her hands.","2":"He that walketh in his uprightness feareth the LORD: but *he that is* perverse in his ways despiseth","3":"In the mouth of the foolish *is* a rod of pride: but the lips of the wise shall preserve","4":"Where no oxen *are*, the crib *is* clean: but much increase *is* by the strength of the ox.","5":"A faithful witness will not lie: but a false witness will utter lies.","6":"A scorner seeketh wisdom, and *findeth it* not: but knowledge *is* easy unto him that understandeth.","7":"Go from the presence of a foolish man, when thou perceivest not *in him* the lips of knowledge.","8":"The wisdom of the prudent *is* to understand his way: but the folly of fools *is* deceit.","9":"Fools make a mock at sin: but among the righteous *there is* favour.","10":"The heart knoweth his own bitterness; and a stranger doth not intermeddle with his joy.","11":"The house of the wicked shall be overthrown: but the tabernacle of the upright shall flourish.","12":"There is a way which seemeth right unto a man, but the end thereof *are* the ways of death.","13":"Even in laughter the heart is sorrowful; and the end of that mirth *is* heaviness.","14":"The backslider in heart shall be filled with his own ways: and a good man","15":"The simple believeth every word: but the prudent *man* looketh well to his going.","16":"A wise *man* feareth, and departeth from evil: but the fool rageth, and is confident.","17":"*He that is* soon angry dealeth foolishly: and a man of wicked devices is hated.","18":"The simple inherit folly: but the prudent are crowned with knowledge.","19":"The evil bow before the good; and the wicked at the gates of the righteous.","20":"The poor is hated even of his own neighbour: but the rich *hath* many friends.","21":"He that despiseth his neighbour sinneth: but he that hath mercy on the poor, happy","22":"Do they not err that devise evil? but mercy and truth *shall be* to them that devise good.","23":"In all labour there is profit: but the talk of the lips *tendeth* only to penury.","24":"The crown of the wise *is* their riches: *but* the foolishness of fools *is* folly.","25":"A true witness delivereth souls: but a deceitful *witness* speaketh lies.","26":"In the fear of the LORD *is* strong confidence: and his children shall have a place of refuge.","27":"The fear of the LORD *is* a fountain of life, to depart from the snares of death.","28":"In the multitude of people *is* the king's honour: but in the want of people *is* the destruction of the prince.","29":"*He that is* slow to wrath *is* of great understanding: but *he that is* hasty of spirit exalteth folly.","30":"A sound heart *is* the life of the flesh: but envy the rottenness of the bones.","31":"He that oppresseth the poor reproacheth his Maker: but he that honoureth him hath mercy on the poor.","32":"The wicked is driven away in his wickedness: but the righteous hath hope in his death.","33":"Wisdom resteth in the heart of him that hath understanding: but *that which is* in the midst of fools is made known.","34":"Righteousness exalteth a nation: but sin *is* a reproach to any people.","35":"The king's favour *is* toward a wise servant: but his wrath is *against* him that causeth shame."}},"tsk":{"1":[{"kopje":"wijze","refs":["Spr 24:3","Spr 24:4","Spr 31:10-31","Ruth 4:11"]},{"kopje":"dwaas is","refs":["Spr 9:13-15","Spr 19:13","Spr 21:9","Spr 21:19","1 Kon 16:31","1 Kon 21:24","1 Kon 21:25","2 Kon 11:1"]} l-kjv\" data-code=\"H7538\">rottenness</span> of the bones.","31":"He that <span class=\"wl wl-kjv\" data-code=\"H6231\">oppresseth</span> the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> <span class=\"wl wl-kjv\" data-code=\"H2778\">reproacheth</span> his <span class=\"wl wl-kjv\" data-code=\"H6213\">Maker:</span> but he that <span class=\"wl wl-kjv\" data-code=\"H3513\">honoureth</span> him hath <span class=\"wl wl-kjv\" data-code=\"H2603\">mercy</span> on the poor.","32":"The <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> is driven <span class=\"wl wl-kjv\" data-code=\"H1760\">away</span> in his <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness:</span> but the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> hath <span class=\"wl wl-kjv\" data-code=\"H2620\">hope</span> in his death.","33":"<span class=\"wl wl-kjv\" data-code=\"H2451\">Wisdom</span> <span class=\"wl wl-kjv\" data-code=\"H5117\">resteth</span> in the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of him that hath <span class=\"wl wl-kjv\" data-code=\"H995\">understanding:</span> but that which is in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H3684\">fools</span> is made known.","34":"<span class=\"wl wl-kjv\" data-code=\"H6666\">Righteousness</span> <span class=\"wl wl-kjv\" data-code=\"H7311\">exalteth</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation:</span> but <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> is a <span class=\"wl wl-kjv\" data-code=\"H2617\">reproach</span> to any people.","35":"The <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H7522\">favour</span> is toward a <span class=\"wl wl-kjv\" data-code=\"H7919\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span> but his <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath</span> is against him that causeth shame."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"wijze","tekst":"Hebreeuws, de wijze der vrouwen; dat is, zo wie onder de vrouwen wijs is. Vergelijk Gen 47:3 ; Job 12:7 , en onder vs.9."},{"catchword":"bouwt","tekst":"Te weten, door hare kinderen godvruchtig op te brengen, hare dienstboden wijselijk te regeren, en den gansen staat des huisgezins in goede orde te houden. Alzo is het woord bouwen genomen, onder Pro 24:3 ."},{"catchword":"die zeer dwaas is,","tekst":"Hebreeuws, de dwaasheid; dat is, zeer dwaas, alsof hij zeide: die de dwaasheid zelve is. Zie Job 35:13 ."},{"catchword":"haar handen","tekst":"Dat is, met haar doen en laten. Alzo wordt de vergelding der handen genoemd hetgeen iemand voor zijn doen en laten vergolden wordt; Isa 3:11 ."}],"2":[{"catchword":"in zijn oprechtheid","tekst":"Vergelijk boven de aantekening Pro 2:7 , over de woorden oprechtelijke wandelen."},{"catchword":"afwijkt","tekst":"Te weten, van den rechten weg. Alzo boven Pro 2:15 ; zie de aantekening."},{"catchword":"in zijn wegen,","tekst":"Dat is, in zijn eigen voornemen, doen en laten. Zie Gen 6:12 ."},{"catchword":"Hem","tekst":"Te weten, den Heere."}],"3":[{"catchword":"roede","tekst":"Dat is, een hovaardige en trotse roede of stok, waarmede hij eensdeels anderen slaat als hij hen stoutelijk lastert, eensdeels zichzelven als hij, in zijn leugenspreken achterhaald zijnde, gelijk als met een wederslag geraakt wordt."},{"catchword":"bewaren hen","tekst":"Te weten, door hun beleefde, voorzichtige en redelijke redenen, dat zij in het kwaad en onheil van den dwaas niet vallen."}],"4":[{"catchword":"ossen zijn,","tekst":"Alzo is het Hebreeuwse woord genomen, Deu 7:13 , en Deu 28:4 , Deu 28:18 , Deu 28:51 ; Psa 8:8 . Versta dit van de ossen, waarmede men het akkerwerk deed; Deu 22:10 , en Deu 25:4 ."},{"catchword":"rein;","tekst":"Dat is, ledig van voeder voor de beesten en vervolgens van akkervruchten tot voeding der mensen. Alzo is gebrek van brood of leeftocht genaamd reinheid, dat is ledigheid der tanden, Amo 4:6 . Vergelijk boven Pro 12:11 , en onder Pro 28:19 ."}],"5":[{"catchword":"waarachtig","tekst":"Hebreeuws, een getuige der waarheid; alzo onder vs.25, en in het volgende. Hebreeuws, een getuige der valsheid."},{"catchword":"blaast","tekst":"Alzo boven Pro 6:19 , en onder vs.25."}],"6":[{"catchword":"gene;","tekst":"Te weten, voorhanden, of te vinden, overmits de spotter die niet zoekt zoals hij behoort en waar zij te vinden is."},{"catchword":"licht","tekst":"Te weten, om te vinden, dewijl hij die zoekt, waar en zoals het behoort."}],"7":[{"catchword":"lippen","tekst":"Dat is, die verstandige en deugdelijke redenen voortbrengen; en dienvolgens is hij ook niet verstandig en deugdzaam van hart; want de mond spreekt uit den overvloed des harten; Mat 12:34 , vergelijk boven Pro 12:19 ."}],"8":[{"catchword":"zijn weg","tekst":"Dat is, wat hij voornemen, doen of laten moet."},{"catchword":"bedriegerij","tekst":"Te weten omdat zij, niet lettende op hetgeen wel of kwalijk gedaan wordt, anderen mensen schadelijk zijn en zelf bedrogen uitkomen."}],"9":[{"catchword":"de schuld","tekst":"Versta de zonde, waarin hij zich of de zijnen bevindt schuldig te wezen."},{"catchword":"verbloemen;","tekst":"Dat is, met schone woorden en schijnbare redenen verschonen, bemantelen en ontschuldigen, opdat ze meer deugd dan misdaad gelijke. Anders: zal de zonde bespotten, dat is een spotwerk daarvan maken, uit hetwelk een ieder zijn tijdverdrijf neme en geen zwarigheid verwekke."},{"catchword":"goedwilligheid","tekst":"Te weten, waardoor de een den ander niet beschadigt, noch met woorden, noch met werken; of zo iemand zich vergrepen heeft, dat bekent en vriendelijk afmaakt, zulks dat zij zodanige verbloemde verschoning onder elkander, als zij misdaan hebben, niet behoeven."}],"10":[{"catchword":"zijn eigen","tekst":"Hebreeuws, zijne ziel. Vergelijk 1Ki 19:4 ."},{"catchword":"bittere droefheid;","tekst":"Hebreeuws, bitterheid; dat is bittere droefheid en treurigheid; zie 2Ki 4:27 ."},{"catchword":"deszelfs","tekst":"Te weten, die in eens anders hart verborgen is. Want een ieder alleen weet de droefheid en blijdschap, die in zijn hart is; 1Co 2:11 ; Rev 2:17 ."}],"11":[{"catchword":"huis","tekst":"Dat is, de woning, staat, rijkdom en nakomelingen. Zie boven Pro 12:7 ."},{"catchword":"tent","tekst":"Dat is, hun geringe woning. Zie 2Ki 13:5 ."}],"12":[{"catchword":"weg,","tekst":"Dat is, een manier van doen of van leven. Zie boven Pro 6:6 ; alzo in het volgende lid van vs.12."},{"catchword":"iemand","tekst":"Hebreeuws, voor het aangezicht des mans; dat is, in zijn ogen en oordeel; alzo onder Pro 16:25 . Vergelijk Ecc 2:26 , en Ecc 7:26 ."},{"catchword":"het laatste","tekst":"Of, het achterste, het einde. Zie van het Hebreeuwse woord Psa 37:37 ."},{"catchword":"wegen","tekst":"Dat is, wijzen van doen, die ter dood leiden, of den dood en het verderf veroorzaken; vergelijk Jer 21:8 ."}],"13":[{"catchword":"in het lachen","tekst":"Dat is, als de mens uitwendige tekenen van vreugde vertoont."},{"catchword":"smart hebben;","tekst":"Te weten, inwendige, die bedekt is met het uiterlijk gelaat der blijdschap."},{"catchword":"het laatste","tekst":"Versta dit en het voorgaande van hetgeen dikwijls gebeurt, maar niet altijd."},{"catchword":"van die blijdschap","tekst":"Te weten, van het lachen."}],"14":[{"catchword":"Die afkerig","tekst":"Dat is, die in zijn hart afgeweken is van God, of van zijne geboden en paden. Alzo Psa 44:19 ."},{"catchword":"van zijn wegen","tekst":"Dat is, van zijn doen en laten, strijden tegen Gods wet. Zie Gen 6:12 ."},{"catchword":"verzadigd","tekst":"Dat is, naar zijne verdienste met rechtvaardige straffen door God opgevoed worden. Zie Job 7:4 ."},{"catchword":"van zichzelven","tekst":"Te weten, zal verzadigd en voldaan worden, dat is, zal zijne genoegzaamheid hebben, te weten in het loon, waarmede God uit genade zijne vroomheid vergelden zal. Anders: maar een goed man [is afkerig], of [wijk] van hem; te weten, die afkerig van hart is, waarmede hij ook straffen deszelven ontgaat. Anders: van de zijne; te weten, wegen."}],"15":[{"catchword":"woord;","tekst":"Of ding; te weten, hoedanig zou hetzelve mogen wezen, te weten: waar of vals, hem eerlijk of oneerlijk, voordelig of schadelijk."},{"catchword":"merkt op","tekst":"Dat is, wacht zichzelven dat hij in zijn doen en laten door lichtgelovigheid op allemans zeggen niet aangaat."}],"16":[{"catchword":"is oplopende","tekst":"Te weten tegen degenen, die hem waarschuwen en van Godswege dreigen, zichzelven wijsmakende dat hij geen nood heeft."}],"17":[{"catchword":"haastig","tekst":"Hebreeuws, kort van toornigheden; dat is, haast toornig, korthoofdig, korzel, die onder vs.29 wordt genoemd kort van geest."},{"catchword":"van schandelijke","tekst":"Het Hebreeuwse woord, van hetwelk te zien is Job 21:27 , is hiet in het kwade genomen, gelijk boven Pro 12:2 . Anderen nemen het in het goede, voor bedachtzaamheid, gelijk boven Pro 1:4 , en vertalen deze plaats aldus: en een man der bedachtzaamheden; dat is die alles rijpelijk verzint, zichzelven brekende en intomende, wordt gehaat, te weten van de kwaden."}],"18":[{"catchword":"erven","tekst":"Dat is, genieten de schadelijke vrucht daarvan, welken meer en meer in dwaasheid vervallen en alzo Gods ongenade vermeerderen en schande behalen bij de mensen, met het verderf der ziel en des lichaams."},{"catchword":"met wetenschap","tekst":"Of, met wetenschap gekroond worden; dat is, in wetenschap toenemen en zo uitsteken dat zij daarmede als met een kroon zullen versierd en vereerd wezen."}],"19":[{"catchword":"buigen","tekst":"Hetwelk somtijds geschiedt omdat zij door de krachtige hand Gods hier vernederd, en de goeden verheven worden, of omdat hunne conscientie hen dwingt de deugd in de deugdzamen te eren. Vergelijk de aantekening Gen 4:7 ."},{"catchword":"voor de poorten","tekst":"Anders: zijn aan de poorten, enz.; te weten, om troost, raad en bijstand van hen te begeren, nadat zij voor Gods straffen vernederd zijn geweest."}],"20":[{"catchword":"vriend","tekst":"Het Hebreeuwse woord betekent wel ieder mens, met wien wij te doen hebben en dien wij onzen naaste noemen, gelijk Gen 11:3 ; Exo 21:14 ; Lev 19:18 , en hier in vs.21 enz.; maar hier wordt het genomen voor een vriend, metgezel of goede bekende, gelijk 2Sa 16:17 ; Job 16:20 ; Pro 19:6 ; Mic 7:5 , enz."}],"21":[{"catchword":"Die zijn naaste","tekst":"Anders: een zondaar veracht zijnen naaste."},{"catchword":"veracht,","tekst":"Te weten, om zijne armoede, tegenspoed, ellende, nederheid, of iets dergelijks, zoals uit de tegenstelling kan afgenomen worden."},{"catchword":"der nederigen","tekst":"Of, zachtmoedigen. Versta, degenen, die bij hunne ellende zachtzinnig, manierlijk en nederig zijnde, niet lichtelijk tot toorn uitbreken, en daarom haast verdrukt kunnen worden. Zie Psa 10:17 ."}],"22":[{"catchword":"Dwalen","tekst":"Deze manier van vragen verzekert krachtiglijk hetgeen gezegd wordt."},{"catchword":"zij niet,","tekst":"Te weten, niet alleen van het oogmerk, dat zij zich voorstellen, maar inzonderheid van hun eigen welvaren, zulks dat zij in het verderf geraken."},{"catchword":"die kwaad","tekst":"Dat is, smeden, verzinnen en praktiseren, om dat tot huns naasten schade aan te leggen. Zie van het Hebreeuwse woord boven Pro 3:29 ."},{"catchword":"weldadigheid","tekst":"Te weten zowel van de vrome mensen als van God zelf, die volgens zijne beloften, getrouwelijk den goeden goeddoet."}],"23":[{"catchword":"In allen","tekst":"Te weten, die men wel en eerlijk doet, naar zijne beroeping."},{"catchword":"overschot;","tekst":"Dat is, gewin, voordeel en verovering."},{"catchword":"woord","tekst":"Versta, alle ijdele en lichtvaardige redenen, die nergens toe nut hebben dan om den kostelijken tijd met grote schade te verliezen; van welke te zien is boven Pro 10:19 . Vergelijk 2Ki 18:20 ."}],"24":[{"catchword":"kroon","tekst":"Dat is, sieraad, die hen bij de mensen aanzienlijk maakt. Zie boven Pro 12:4 ."},{"catchword":"rijkdom;","tekst":"Te weten, omdat zij dien wel gebruiken, daarmede dankbaar zijnde jegens God, weldadig jegens hunnen naaste en matig omtrent zichzelven."},{"catchword":"der zotten","tekst":"Te weten, die rijk zijn."},{"catchword":"is dwaasheid","tekst":"Dat is, blijft, dient hun niet tot eer en aangenaamheid bij de mensen, maar tot schande en verachting, gelijk de dwaasheid bij allen schandelijk en verachtelijk is, en al wat zij hebben baat hun niet, maar strekt hun tot enkel dwaasheid."}],"25":[{"catchword":"waarachtig","tekst":"Hebreeuws, getuige der waarheid. Alzo boven vs.5."},{"catchword":"redt","tekst":"Dat is, bevrijdt en verlost van den dood."},{"catchword":"de zielen;","tekst":"Dat is, de mensen, die men door lasteringen en valse beschuldigingen om hals zoekt te brengen."},{"catchword":"leugens","tekst":"Alzo boven vs.5, en Pro 6:19 ; zie de aantekening. Versta hier leugens, en waardoor iemand ter dood bezwaard wordt."},{"catchword":"een bedrieger","tekst":"Hebreeuws, bedrog; alzo boven Pro 12:24 en Pro 13:6 ; zonde voor zondaar. Anders: maar een bedrieger blaast leugens uit."}],"26":[{"catchword":"sterk","tekst":"Hebreeuws, vertrouwen der sterkte; dat is een sterk vertrouwen; namelijk voor degenen, die den Heere vrezen. Alzo Psa 71:7 ."},{"catchword":"Zijn kinderen","tekst":"Versta, Gods kinderen, of de kinderen dergenen, die Hem vrezen en zich op Hem verlaten, dien Hij om hunnentwil gunstig is."}],"27":[{"catchword":"een springader","tekst":"Dat is, als een springader, uit welken het leven voortvloeit. Vergelijk boven Pro 10:11 , en de aantekening."},{"catchword":"strikken","tekst":"Zie boven Pro 13:14 ."}],"28":[{"catchword":"eens vorsten","tekst":"Anders: de verstoring, of het verderf, of de verbreking eens prinsdoms of ener heerschappij."}],"29":[{"catchword":"lankmoedige","tekst":"Hebreeuws, lang van toornigheden; dat is, niet haastig tot gramschap; zie Exo 34:6 ."},{"catchword":"is groot","tekst":"Dat is, heeft veel verstand, hetwelk hij bewijst doordat hij het ongelijk hem aangedaan, of het kwaad, dat hij ziet geschieden, met geduld opnemende, zich wachten kan iets te doen, dat tegen eer en vroomheid strijden zou."},{"catchword":"haastig is","tekst":"Hebreeuws, kort van geest; dat is, haastig tot toorn; zie boven vs.17, en vergelijk Ecc 7:9 ."},{"catchword":"verheft","tekst":"Dat is, steekt haar gelijk omhoog en brengt haar voor den dag om van allen gezien te worden, dewijl hij door zijne toornigheid dingen aanricht, die met de eer en deugd niet bestaan kunnen."}],"30":[{"catchword":"gezond","tekst":"Hebreeuws, een hart der gezondheid. Versta, een hart of gemoed, dat zuiver is van alle kwade gedachten, driften en bewegingen tegen zijnen naaste, en voornamelijk van den nijd, waarvan hier eigenlijk gesproken wordt."},{"catchword":"het leven","tekst":"Dat is de gezondheid en het welvaren van het lichaam. Alzo leven voor genezen en gezond worden, of welvaren naar het lichaam; 2Ki 8:8 . Zie aldaar de aantekening."},{"catchword":"des vleses;","tekst":"Het Hebreeuwse woord staat in het getal van velen, om te kennen te geven dat een gezond hart niet alleen zijn eigen lichaam goeddoet, maar ook de lichamen van anderen."},{"catchword":"der beenderen","tekst":"Dat is, der allerinwendigste leden en krachten des lichaams, en dienvolgens ook des geestes. Zie Job 7:15 . Vergelijk boven Pro 12:4 , en de aantekening. Idem onder Pro 17:22 , en de aantekening."}],"31":[{"catchword":"verdrukt,","tekst":"Te weten, door bedrog, of geweld. Vergelijk onder Pro 22:16 , en de aantekening Eze 18:18 ."},{"catchword":"deszelfs","tekst":"Zie Job 4:17 ."}],"32":[{"catchword":"kwaad;","tekst":"Versta, het kwaad der straf; dat is, in zijn ongeluk, ellende en tegenspoed. Anders: om zijner kwaadheid of boosheid wil; verstaande dit van het kwaad der schuld."},{"catchword":"betrouwt","tekst":"Te weten, op God."},{"catchword":"in zijn dood","tekst":"Dat is, niet alleen in allerlei tegenspoed van dit leven, maar ook in den dood, die hem natuurlijk overkomt of geweldiglijk aangedaan wordt. Zie Job 13:15 ."}],"33":[{"catchword":"rust","tekst":"Te weten, daarin opgesloten als in een kabinet, om die ter bekwamer tijd en plaats voort te brengen."},{"catchword":"is,","tekst":"Te weten, de dwaasheid, die in hun hart is, of de wijsheid, die zij onverstandig en ontijdig uitwerpen. Anders: maar in het midden der zotten wordt zij bekend; te weten, wanneer zij overtuigd worden door de vromen in hunne conscientiën, of wanneer het onderscheid gemerkt wordt, dat er is tussen de zotten en de wijzen."}],"34":[{"catchword":"verhoogt","tekst":"Te weten, dat het gezegend zij van God en vermaard onder de mensen."},{"catchword":"is een schandvlek","tekst":"Dat is, maakt de volken te schande. Zie deze betekenis van het Hebreeuwse woord chesed Lev 20:17 ."}],"35":[{"catchword":"knecht;","tekst":"Zie Gen 20:8 ."},{"catchword":"die beschaamd","tekst":"Te weten, zijn koning en zichzelven. Vergelijk boven Pro 10:5 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Every wise woman [Hebr. The wife of women, that is, whosoever is wise among women. Compare Gen. Chap.47.on verse 3. And Job 12. On verse 7. And bel.verse 9.] buildeth her house: [to wit, by bringing up her children godlily, by ruling her servants wisely, and by keeping the whole family in good order. So is the word building, or to build taken, below chap.24.3.] but she that is very foolish [Hebr. Folly, or, foolishness; that is, very foolish; as if he had said, she that is folly it self. See Job 35.on verse 13.] breaketh it down with her hands. [that is, with her doing and omitting. Thus that which is rendered to a man for that which he doth and omitteth, is called the recompence, or, reward of his hands. Isa 3:11.]"}],"2":[{"catchword":null,"tekst":"He that walketh in his uprightness [Comp. Abo.chap.2. the annotations on verse 7. Upon the words walking uprightly] feareth the LORD: but he that declineth [to wit, from the way. So above chapter 2.15. see the annot.] in his ways, [that is, in his own intention, doing and omitting. See Gen.6.on verse 12.] despiseth him. [to wit, the Lord.]"}],"3":[{"catchword":null,"tekst":"In the mouth of the foolish, is a rod of pride: [That is, proud and lofty rod or staff, wherewith he partly beateth others, when he boldly slandereth and backbiteth them; partly himself, when being found and taken in his lies, he gets as it were a back blow thereby] but the lips of the wise preserve them. [to wit, by their courteous, wise, and prudent sayings, from falling into the evil and mischief of fools.]"}],"4":[{"catchword":null,"tekst":"When there are no oxen, [So is the Hebrew word taken, Deut.7.13. and 28. Verse 4,18,51. Psa 8:8. Understand this of the oxen, wherewith they were wont to plow and to do all manner of husbandry, Deut.22.10. and 25.4.] then the crib is clean: [that is, empty of fodder and provision for beasts, and consequently of fruits of the ground needful for the sustentation of man. Thus want of bread or victual is called cleanness (that is emptiness) of teeth, Amos 4.verse 6. Compare ab.chap.12.11. and below chap.28.verse 19.] but by the strength of the oxe there is much increase."}],"5":[{"catchword":null,"tekst":"A true witness [Hebr. A witness of truth. So below verse 25. And in the following words. Hebr. A witness of falsehood] will not lie; but a false witness bloweth lies. [so above chap.6.19. and below verse 25.]"}],"6":[{"catchword":null,"tekst":"The scorner seeketh wisdom, and there is none: [To wit, at hand, or, to be found, because the scorner seeketh it not, as he ought to do, and where it is to be found] but knowledge is easy [to wit, to be found] to him that hath understanding. [because he seeketh it as her ought to do, and where it is to be found.]"}],"7":[{"catchword":null,"tekst":"Go away from the presence of a foolish man, for thou shalt nor perceive (within him) the lips of knowledge. [That is, lips that utter wise and virtuous speeches, and consequently l,"tekst":"There is a way [That is, a course of life. See above chap.6.on verse 6. So in the following clause of this verse] which seemeth right unto a man; [Heb. before the face of a man; that is, in his eyes, and judgement. So below chapter 16.25. Compare Ecc 2:26. and 7.26.] but the last [or, the hindmost, the end. See of the Hebrew word, Psal.37.on verse 37.] therefore are the ways of death. [that is, courses, which lead unto death, or, which cause death and destruction. Compare Jer 21:8.]"}],"13":[{"catchword":null,"tekst":"The heart shall have sorrow [To wit, inward sorrow, which is covered with an outward shew of joy] even in laughter: [that is, when a man sheweth outward tokens of joy] and the last of that mirth [to wit, of that laughter] is heaviness. [understand this and the former clause of that which happeneth often, but ones always.]"}],"14":[{"catchword":null,"tekst":"He that is a back-slinder in heart, [That is, he that is revolted from God, or from his commandments and paths. So Psa 44:19.] shall be satisfied with his (own) ways; [that is, with his own doings, and omissions or neglects repugnant to the law of God. See Gen.6.on verse 12. That is, he shall, according to his desert, be fed and nourished by God, with just punishments. See Job 7.on verse 4.] but a good man, from himself. [to wit, shall be satisfied, and filled. That is, shall have his sufficiency, to wit, in the reward, wherewith God will graciously recompence his goodiness, and vertous behaviour Oth. But a good man (back-slideth) or, (departed) from him: to wit, from him that is a back-slider in heart, whereby he also escapeth his punishments. Oth. from his; to wit, ways.]"}],"15":[{"catchword":null,"tekst":"The simple believeth all (or every) word: [Or, thing: to wit, whatsoever it might or could be, whether true or false, honest, or dsihonest, profitable, or hurtful unto him] but the prudent (man) looketh well to his going. [that is, taketh heed to himself, that in his conversation and ich see above chap.to penury."}],"24":[{"catchword":null,"tekst":"The crown of the wise [That is, the ornament, which maketh them gracious and honourable in the sight of men. See above ch.12. on verse 4.] is their riches: [to wit, because they use them well, being therewith thankful unto God, merciful unto their neighbour, and sober toward themselves] the foolishness of fools [to wit, that are rich] is folly. [that is, abideth, tendeth not to make them honourable and gracious before men, but to bring them to shame and contempt, as folly is shameful and desicable in the eyes of all men, and whatsoever they have, profiteth them nothing at all, but tendeth to their meer folly and disgrace.]"}],"25":[{"catchword":null,"tekst":"A true witness [Hebr. Witness of truth; so above verse 5.] delivereth [that is, freeth and delivereth from death] souls: [that is, men, whom they seek to slay by slanderings, and false accusations] but he that bloweth lies, [so above verse 5. And ch.6.19. See the annot. Understanding here lies, wherewith a man is burdened and oppressed unto death] is a deceiver. [Hebr. Deceit. So above chap.12. verse 24. And 13.6. Sin for sinner. Oth. But a deceiver bloweth forth lies.]"}],"26":[{"catchword":null,"tekst":"In the fear of the LORD is strong confidence: [Hebr. Confidence of strength; that is, strong confidence; namely, for them that fear the Lord. So Psa 71:7.] and he will be a refuge unto his children. [meaning the children of God, or the children of them that fear him, and rely upon him, unto whom he is therefore favourable.]"}],"27":[{"catchword":null,"tekst":"The fear of the LORD is a fountain of life, [That is, as a fountain out of which life floweth forth. Compare above chap.10,11. And the annot.] to depart from the snares of death. [see above chap.13.on verse 14.]"}],"28":[{"catchword":null,"tekst":"In the multitude of people is the Kings glory; but in the want of people is the disturbance of a Prince. [Oth. The disturbance, or, the destruction, or, the breaking of a Princedom, or, of a Dominion.]"}],"29":[{"catchword":null,"tekst":"The long-suffering (person) [Hebr. Long of wraths: that is, not soon angry. See Exod.34.on verse 6.] is of great understanding, [or hath much understanding, which he discovereth by this, in that he knoweth how to bear wrongs and injuries patiently, and can beware of doing any thing that may truly oppose honour and virtue] but he that is hasty of mind, [Hebr. Short of spirit: that is, soon angry. See above on verse 17. And compare Ecc 7:9.] exalteth folly. [that is, setteth it as it were on high, and bringeth it into open light, to be seen of all men, forasmuch as in his anger he doth those things, which cannot consist with honour and virtue.]"}],"30":[{"catchword":null,"tekst":"A sound heart [Hebr. An heart of soundness, or, health. Meaning an heart, or mind, that is clean and free from all evil affections, passions, and motions against a mans neighbour, and especially from envy, whereof here properly mention is made] is the life of the flesh: [that is, the health and welfare of the body. So to live, is taken for to be healed, and to recover, or to enjoy bodily health, 2 Kings 8.8. See there the annot. The Hebrew word rendered here flesh, is used in the plural number, to signify that a sound and healthy heart doth not onely do good to his own body, but also to the bodies of others] but envy is the rottenness of the bones. [that is, of the innermost parts and members of the body, and consequently also of the innermost powers and facuilties of the soul. See Job 7.on verse 15. Compare above chap.12.4. and the annot. Also below chap.17.22. and the annot.]"}],"31":[{"catchword":null,"tekst":"He that oppresseth the poor [To wit, by deceit, or violence. Compare below chapter 22.16. and the annot. Eze 18:18.] reproacheth his Maker: [see Job 4.on verse 17. Compare below chapter 17.5.] but he that hath compassion on the needy, he honoureth him. [compare above verse 21.]"}],"32":[{"catc /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
