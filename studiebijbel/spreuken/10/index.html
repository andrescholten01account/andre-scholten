ningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen.","7":"De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten.","8":"Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.","9":"Wie in oprechtheid wandelt, wandelt zeker; maar wie zijn wegen verdraait, zal bekend worden.","10":"Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.","11":"De mond van de rechtvaardige is een bron van leven; maar het geweld bedekt de mond van de goddelozen.","12":"Haat verwekt ruzies; maar de liefde bedekt alle overtredingen.","13":"In de lippen van de verstandige wordt wijsheid gevonden; maar op de rug van hem die zonder verstand is, de roede.","14":"De wijzen leggen kennis weg; maar de mond van de dwaas is de ondergang nabij.","15":"Het bezit van de rijke is zijn sterke stad; de armoede van de geringen is hun ondergang.","16":"Het werk van de rechtvaardige leidt tot leven; de opbrengst van de goddeloze leidt tot zonde.","17":"Het pad naar het leven is voor hem die de tucht bewaart; maar wie de bestraffing verlaat, doet dwalen.","18":"Wie haat bedekt, heeft valse lippen, en wie een kwaad gerucht verspreidt, is een dwaas.","19":"In de veelheid van woorden ontbreekt de overtreding niet; maar wie zijn lippen bedwingt, is verstandig.","20":"De tong van de rechtvaardige is uitgelezen zilver; het hart van de goddelozen is weinig *waard*.","21":"De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.","22":"De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.","23":"Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid *te plegen*.","24":"Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal *God* geven.","25":"Zoals een wervelwind voorbijgaat, zo is de goddeloze niet *meer*; maar de rechtvaardige is een eeuwig fundament.","26":"Zoals azijn is voor de tanden, en zoals rook voor de ogen, zo is de luiaard voor hen die hem uitzenden.","27":"De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort.","28":"De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan.","29":"De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.","30":"De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.","31":"De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.","32":"De lippen van de rechtvaardige weten wat welgevallig is; maar de mond van de goddelozen spreekt enkel verkeerdheid."},"SV":{"1":"De spreuken van Salomo. Een wijs zoon verblijdt den vader; maar een zot zoon is zijner moeder droefheid.","2":"Schatten der goddeloosheid doen geen nut; maar de gerechtigheid redt van den dood.","3":"De HEERE laat de ziel des rechtvaardigen niet hongeren; maar de have der goddelozen stoot Hij weg.","4":"Die met een bedriegelijke hand werkt, wordt arm; maar de hand der vlijtigen maakt rijk.","5":"Die in den zomer vergadert, is een verstandig zoon; *maar* die in den oogst vast slaapt, is een zoon die beschaamd maakt.","6":"Zegeningen zijn op het hoofd des rechtvaardigen; maar het geweld bedekt den mond der goddelozen.","7":"De gedachtenis des rechtvaardigen zal tot zegening zijn; maar de naam der goddelozen zal verrotten.","8":"Die wijs van hart is, neemt de geboden aan; maar die dwaas is van lippen, zal omgeworpen worden.","9":"Die in oprechtheid wandelt, wandelt zeker; maar die zijn wegen verkeert, zal bekend worden.","10":"Die met het oog wenkt, richt smart aan; en een dwaas van lippen zal omgeworpen worden.","11":"De mond des rechtvaardigen is een springader des levens; maar het geweld bedekt den mond der goddelozen.","12":"Haat verwekt krakelen; maar de liefde dekt alle overtredingen toe.","13":"In de lippen des verstandigen wordt wijsheid gevonden; maar op den rug des verstandelozen de roede.","14":"De wijzen leggen wetenschap weg; maar den mond des dwazen is de verstoring nabij.","15":"Des rijken goed is een stad zijner sterkte; de armoede der geringen is hun verstoring.","16":"Het werk des rechtvaardigen is ten leven; de inkomst des goddelozen is ter zonde.","17":"Het pad tot het leven is desgenen die de tucht bewaart; maar die de bestraffing verlaat, doet dwalen.","18":"Die den haat bedekt, is van valse lippen, en die een kwaad gerucht voortbrengt, is een zot.","19":"In de veelheid der woorden ontbreekt de overtreding niet; maar die zijn lippen weerhoudt, is kloek verstandig.","20":"De tong des rechtvaardigen is uitgelezen zilver; het hart der goddelozen is weinig *waard*.","21":"De lippen des rechtvaardigen voeden er velen; maar de dwazen sterven door gebrek van verstand.","22":"De zegen des HEEREN, die maakt rijk; en Hij voegt er geen smart bij.","23":"Het is voor den zot als spel schandelijkheid te doen; maar voor een man van verstand, wijsheid *te* *plegen*.","24":"De vreze des goddelozen, die zal hem overkomen; maar de begeerte der rechtvaardigen zal *God* geven.","25":"Gelijk een wervelwind voorbijgaat, alzo is de goddeloze niet *meer*; maar de rechtvaardige is een eeuwige grondvest.","26":"Gelijk edik den tanden, en gelijk rook den ogen is, zo is de luie dengenen, die hem uitzenden.","27":"De vreze des HEEREN vermeerdert de dagen; maar de jaren der goddelozen worden verkort.","28":"De hoop der rechtvaardigen is blijdschap; maar de verwachting der goddelozen zal vergaan.","29":"De weg des HEEREN is voor den oprechte sterkte; maar voor de werkers der ongerechtigheid verstoring.","30":"De rechtvaardige zal in eeuwigheid niet bewogen worden; maar de goddelozen zullen de aarde niet bewonen.","31":"De mond des rechtvaardigen brengt overvloediglijk wijsheid voort; maar de tong der verkeerdheden zal uitgeroeid worden.","32":"De lippen des rechtvaardigen weten wat welgevallig is; maar de mond der goddelozen enkel verkeerdheid."},"KJV":{"1":"The proverbs of Solomon. A wise son maketh a glad father: but a foolish son *is* the heaviness of his mother.","2":"Treasures of wickedness profit nothing: but righteousness delivereth from death.","3":"The LORD will not suffer the soul of the righteous to famish: but he casteth away the substance of the wicked.","4":"He becometh poor that dealeth *with* a slack hand: but the hand of the diligent maketh rich.","5":"He that gathereth in summer *is* a wise son: *but* he that sleepeth in harvest *is* a son that causeth shame.","6":"Blessings *are* upon the head of the just: but violence covereth the mouth of the wicked.","7":"The memory of the just *is* blessed: but the name of the wicked shall rot.","8":"The wise in heart will receive commandments: but a prating fool shall fall.","9":"He that walketh uprightly walketh surely: but he that perverteth his ways shall be known.","10":"He that winketh with the eye causeth sorrow: but a prating fool shall fall.","11":"The mouth of a righteous *man is* a well of life: but violence covereth the mouth of the wicked.","12":"Hatred stirreth up strifes: but love covereth all sins.","13":"In the lips of him that hath understanding wisdom is found: but a rod *is* for the back of him that is void of understanding.","14":"Wise *men* lay up knowledge: but the mouth of the foolish *is* near destruction.","15":"The rich man's wealth *is* his strong city: the destruction of the poor *is* their poverty.","16":"The labour of the righteous *tendeth* to life: the fruit of the wicked to sin.","17":"He *is in* the way of life that keepeth instruction: but he that refuseth reproof erreth.","18":"He that hideth hatred *with* lying lips, and he that uttereth a slander, *is* a fool.","19":"In the multitude of words there wanteth not sin: but he that refraineth his lips *is* wise.","20":"The tongue of the just *is as* choice silver: the heart of the wicked *is* little worth.","21":"The lips of the righteous feed many: but fools die for want of wisdom.","22":"The blessing of the LORD, it maketh rich, and he addeth no sorrow","23":"*It is* as sport to a fool to do mischief: but a man of understanding hath wisdom.","24":"The fear of the wicked, it shall come upon him: but the desire of the righteous shall be granted.","25":"As the whirlwind passeth, so *is* the wicked no *more*: but the righteous *is* an everlasting foundation.","26":"As vinegar to the teeth, and as smoke to the eyes, so *is* the sluggard to them that send","27":"The fear of the LORD prolongeth days: but the years of the wicked shall be shortened.","28":"The hope of the righteous *shall be* gladness: but the expectation of the wicked shall perish.","29":"The way of the LORD *is* strength to the upright: but destruction *shall be* to the workers of iniquity.","30":"The righteous shall never be removed: but the wicked shall not inhabit the earth.","31":"The mouth of the just bringeth forth wisdom: but the froward tongue shall be cut out.","32":"The lips of the righteous know what is acceptable: but the mouth of the wicked *speaketh* frowardness."}},"tsk":{"1":[{"kopje":"spreuken","refs":["Spr 1:1","Spr 25:1","1 Kon 4:32","Pred 12:9"]},{"kopje":"Een wijze","refs":["Spr 15:20","Spr 17:21","Spr 17:25","Spr 19:13","Spr 23:15","Spr 23:16","Spr 23:24","Spr 23:25","Spr 29:3","Spr 29:15","Pred 2:19"]}],"2":[{"kopje":"Schatten","refs":["Spr 11:4","Ps 49:7-11","Jes 10:2","Jes 10:3","Zef 1:18","Luk 12:15-21","Luk 16:22","Luk 16:23","Rom 2:5","Jak 5:1-3"]},{"kopje":"maar","refs":["Spr 12:28","Dan 4:27","Rom 5:21","Fil 3:9"]}],"3":[{"kopje":"laat","refs":["Job 5:20","Ps 10:14","Ps 33:19","Ps 34:10","Ps 34:11","Ps 37:3","Ps 37:19","Ps 37:25","Jes 33:16","Matt 6:30-33","Luk 12:22-24","Luk 12:31","Hebr 13:5","Hebr 13:6"]},{"kopje":"maar","refs":["Job 20:5-8","Job 20:20-22","Job 20:28","Hab 2:6-8","Zef 1:18"]},{"kopje":"de n> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> but <span class=\"wl wl-kjv\" data-code=\"H191\">fools</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> for <span class=\"wl wl-kjv\" data-code=\"H2638\">want</span> of wisdom.","22":"The <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> it maketh <span class=\"wl wl-kjv\" data-code=\"H6238\">rich,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3254\">addeth</span> no sorrow","23":"It is as <span class=\"wl wl-kjv\" data-code=\"H7814\">sport</span> to a <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H2154\">mischief:</span> but a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> hath wisdom.","24":"The <span class=\"wl wl-kjv\" data-code=\"H4034\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> it shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon him: but the <span class=\"wl wl-kjv\" data-code=\"H8378\">desire</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> shall be granted.","25":"As the <span class=\"wl wl-kjv\" data-code=\"H5492\">whirlwind</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth,</span> so is the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> no more: but the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> is an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> foundation.","26":"As <span class=\"wl wl-kjv\" data-code=\"H2558\">vinegar</span> to the <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth,</span> and as <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> to the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> so is the <span class=\"wl wl-kjv\" data-code=\"H6102\">sluggard</span> to them that send","27":"The <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">prolongeth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> but the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> shall be shortened.","28":"The <span class=\"wl wl-kjv\" data-code=\"H8431\">hope</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness:</span> but the <span class=\"wl wl-kjv\" data-code=\"H8615\">expectation</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> shall perish.","29":"The <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H4581\">strength</span> to the <span class=\"wl wl-kjv\" data-code=\"H8537\">upright:</span> but <span class=\"wl wl-kjv\" data-code=\"H4288\">destruction</span> shall be to the <span class=\"wl wl-kjv\" data-code=\"H6466\">workers</span> of iniquity.","30":"The <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> shall <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be <span class=\"wl wl-kjv\" data-code=\"H4131\">removed:</span> but the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> shall not <span class=\"wl wl-kjv\" data-code=\"H7931\">inhabit</span> the earth.","31":"The <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> bringeth <span class=\"wl wl-kjv\" data-code=\"H5107\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom:</span> but the <span class=\"wl wl-kjv\" data-code=\"H8419\">froward</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> shall be cut out.","32":"The <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> what is <span class=\"wl wl-kjv\" data-code=\"H7522\">acceptable:</span> but the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> speaketh frowardness."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"spreuken","tekst":"De negen voorgaande hoofdstukken zijn als een voorrede om de mensen te verwekken tot aanhoring der volgende spreuken, die meest onderscheiden zijn en niet aan elkander hangen. Zij zijn als regelen, rakende het geloof, de goede zeden en gebreken der mensen."},{"catchword":"vader;","tekst":"Versta, onder den naam des vaders, ook dien der moeder, en onder den volgenden naam der moeder, ook den vader."}],"2":[{"catchword":"der goddeloosheid","tekst":"Dat is, die door ongerechtigheid verkregen zijn, of ook goddelooslijk misbruikt worden."},{"catchword":"de gerechtigheid","tekst":"Versta, in het algemeen de liefde en trouw, die men zijnen naaste, naar de tweede tafel en voornamelijk naar het achtste gebod, schuldig is. Sommigen verstaan het woord gerechtigheid in het bijzonder van de aalmoezen en werken der barmhartigheid aan de armen, gelijk Dan 4:27 ."},{"catchword":"redt","tekst":"Te weten, niet omdat zij zulks uit hare waardigheid vermag of verdiend heeft; maar omdat God haar zo genadiglijk te belonen beloofd heeft, alzo onder Pro 11:4 ."}],"3":[{"catchword":"have","tekst":"Anders: verkeerdheid; dat is, rijkdom door verkeerdheid gekregen."}],"4":[{"catchword":"een bedriegelijke","tekst":"Hebreeuws, met een handpalm des bedrogs; dat is met een ontrouwe, slappe en trage hand, en alzo door bedrog zijns naasten goed aan zich trekt; bedrog voor traagheid, onder Pro 19:15 ; Jer 48:10 , gelijk ook daarom bedrog tegen vlijtigheid gesteld wordt, gelijk hier, en onder Pro 12:24 , Pro 12:27 ; want die lui zijn en een afkeer van den arbeid hebben, plegen met bedrog om te gaan, waarmede zij den kost zoeken te vinden; maar armoede is eindelijk hun loon. Anders: een bedriegelijke weegschaal maakt arm."}],"5":[{"catchword":"vergadert,","tekst":"Te weten, zijne vruchten of gewas, dat hij op het veld heeft. Vergelijk boven Pro 6:8 ."},{"catchword":"die beschaamd","tekst":"Te weten, zichzelven en ook zijne ouders; namelijk door zijne gebreken en kwade manieren. Alzo onder Pro 12:4 , en Pro 14:35 , en Pro 17:2 , en Pro 19:26 , en Pro 28:7 . Deze spreuk mag bekwamelijk verstaan worden bij gelijkenis op een mens, die, terwijl hij nog jong is, arbeidt om wat in zijn ouderdom te hebben, enz. Zie boven Pro 6:8 ."}],"6":[{"catchword":"Zegeningen","tekst":"Zegeningen; te weten zo tijdelijke als eeuwige."},{"catchword":"op het hoofd","tekst":"Dit schijnt te zien op het oude gebruik van enigen zegen uit te spreken; overmits dit geschiedde met de hand op het hoofd van dengene, die gezegend werd, te leggen. Zie Gen 48:14 . Of men kan het alzo verstaan dat de rechtvarigen, zelf gezegend zijnde, den zegen aan anderen ook mededelen, maar dat de mond van den goddeloze vol is van enkel geweld."},{"catchword":"geweld","tekst":"Versta wrevel, onrecht, overlast en verdrukking, waarmede zij omgegaan hebben."},{"catchword":"bedekt","tekst":"Dat is, brengt hen ter dood, zie Job 40:8 ; òf bedekt hen met schaamte als met een kleed; vergelijk Psa 44:16 , en Psa 69:8 ; òf vervult hen met straffen tot den vollen mond toe."}],"7":[{"catchword":"zal tot zegening","tekst":"Dat is, dient hem tot prijs en een eerlijk gerucht, als men van hem òf afwezig, òf ook dood zijnde, gewag maakt."},{"catchword":"zal verrotten","tekst":"Of, vervuilen en stinkende worden, en vervolgens vergaan."}],"8":[{"catchword":"geboden","tekst":"Te weten die den mens leren hoe hij zijn leven recht zal aanstellen om God te behagen en zijnen naaste te stichten, en alzo Gods zegen te genieten."},{"catchword":"dwaas","tekst":"Dat is, die verkeerde dingen spreekt, waardoor hij met een halsstarrigen zin al het goede onderwijs en vermaning verwerpt, zich beroemende bij zijn kwaad gevoelen en boos voornemen te willen blijven, hebbende vervolgens bij de dwaasheid der lippen ook de dwaasheid des harten; want uit overvloedigheid van dezen spreken de lippen, Mat 12:34 . Vergelijk boven Pro 2:12 , en Pro 4:24 , en Pro 6:12 ."},{"catchword":"omgeworpen","tekst":"Zie van het Hebreeuwse woord Hos 4:14 . Alzo onder vs.10."}],"9":[{"catchword":"in oprechtheid","tekst":"Zie boven Pro 2:7 ."},{"catchword":"zeker;","tekst":"Of, gerustelijk, dewijl hij weet dat zijne werken goed zijn, en dat God daarop geen kwade uitkomsten tot zijn verderf zal laten komen."},{"catchword":"zijn wegen","tekst":"Vergelijk Gen 6:12 ."},{"catchword":"bekend","tekst":"Te weten, door de openbare straffen, die God hem in het aanzien van allen toezenden zal, en dat door middel van de overheid of anderszins."}],"10":[{"catchword":"met het oog","tekst":"Dat is, bedektelijk op de zonde toelegt en die behendiglijk zoekt te bedrijven. Vergelijk boven Pro 6:13 ."},{"catchword":"een dwaas","tekst":"Zie boven vs.8."},{"catchword":"zal omgeworpen","tekst":"Zie boven vs.8."}],"11":[{"catchword":"springader","tekst":"Te weten, waaruit woorden voortkomen, die niet alleen anderen ten eeuwigen leven onderwijzen, vermanen en sterken; maar die ook den rechtvaardige zelf, die zulks doet, ten zulken einde dienstig zijn. Vergelijk onder Pro 13:14 , en Pro 14:27 , en Pro 16:22 ."},{"catchword":"het geweld","tekst":"Zie boven vs.6."}],"12":[{"catchword":"de liefde","tekst":"Namelijk desgenen, die ongelijk van zijnen naaste geleden heeft, of hem in enige zwakheid ziet vervallen te zijn."},{"catchword":"dekt","tekst":"Te weten, met die te verdragen, of vriendelijk te bestraffen en niet uit te breiden. Versta, dat van particuliere zonden en die met goede conscientie mogen verzwegen worden."},{"catchword":"alle","tekst":"Versta, niet onze eigen overtredingen begaan tegen God, maar door anderen begaan tegen ons."}],"13":[{"catchword":"gevonden;","tekst":"En daarom behaalt hij ook eer en loon; gelijk daarentegen de onbezinde slagen krijgt, omdat men in zijne lippen dwaasheid vindt."},{"catchword":"verstandelozen","tekst":"Hebreeuws, die gebrek heeft van hart. Zie boven Pro 6:32 . Het woord hart is hier voor den zin en het verstand van den mens genomen. Zie Job 9:4 ."},{"catchword":"de roede","tekst":"Dat is, de straf, welke geschiedt door slagen. Alzo onder Pro 23:13 , en Pro 26:3 , en Pro 29:15 ."}],"14":[{"catchword":"leggen","tekst":"Hebreeuws, verbergen; dat is, gelijk men een schat weglegt, of voorraad van spijs opsluit, om ter bekwamer tijd voort te brengen; alzo vergaderen de wijzen veel wetenschap, om die, als het tijdig en stichtelijk is, uit te spreken, of anderszins voor zichzelven te gebruiken."},{"catchword":"de verstoring","tekst":"Of, ontzetting, verschrikking; dat is onheil, moeite, zwarigheid, waarvoor men verschrikt en ontzet pleegt te worden, veroorzaakt door dwaze, onvoorzichtige, kwalijk bedachte en ontijdige redenen."}],"15":[{"catchword":"geringen","tekst":"Hebreeuws, der dunnen; dat is, die gans weinig hebben. De zin is, dat die zonder goed is, ook moedeloos is en vrees heeft dat hij zal vergaan; en dat die bloot is, meest ook blode is; gelijk integendeel die groot goed hebben gemeenlijk zichzelven daarop verlaten en menen dat zij zeer wel verzekerd zijn tegen alle ongeLucas"}],"16":[{"catchword":"werk","tekst":"Te weten, waardoor hij iets eerlijks doet om den kost te winnen; of versta, al wat hij voorneemt spreekt of doet."},{"catchword":"ten leven;","tekst":"Dat is, strekt tot zijn welvaren en tot zijn best; Rom 8:28 ."},{"catchword":"de inkomst","tekst":"Versta, zijne middelen, of al hetgeen dat van hem en zijn doen voortkomt."},{"catchword":"ter zonde","tekst":"Dat is, verstrekt, of leidt tot kwaaddoen en tot zijn eeuwig verderf; want de bezolding der zonde is de dood; Rom 6:23 ."}],"17":[{"catchword":"tot het leven","tekst":"Te weten, leidende. Of aldus: die de tucht bewaart, is een pad des levens, of [op] het pad des levens."},{"catchword":"doet dwalen","tekst":"Te weten, zichzelven en anderen, die zo tezamen in het verderf geraken."}],"18":[{"catchword":"Die den haat","tekst":"De zin is dat zij beiden kwalijk doen, zowel degene, die hun naaste heimelijk haten, hoewel zij niet kwaad van hem spreken, als die zijnen naam vrijuit met openbare lasterrede schenden. Anders: die den haat bedekt [met] valse lippen, en die een kwaad gerucht uitbrengt, die is een zot. Anders: valse lippen bedekken gaat, enz."}],"19":[{"catchword":"par der woorden","tekst":"Te weten, die lichtvaardig, onbedacht, uit ijdele zinnen en kwade genegenheden voortkomen."}],"20":[{"catchword":"is uitgelezen","tekst":"Dat is, het uitgelezen zilver gelijk; te weten in aangenaamheid, waarde en nuttigheid."},{"catchword":"weinig waard","tekst":"Of, zeker, gering; en daarom ook zijne tong, die uitgeeft al wat het hart inheeft. Hebreeuws, als weinig. De letter caph betekenende als, wordt bij de Hebreën somtijds voor zekerlijk, waarlijk, vast, alzo genomen. Zie Gen 27:12 , en Neh 7:2 ."}],"21":[{"catchword":"voeden","tekst":"Te weten naar de ziel, door heilzame onderwijzing, vermaning, bestraffing, vertroosting, waardoor de rechtvaardige ook zichzelven ten eeuwigen leven goeddoet."},{"catchword":"sterven","tekst":"Dat is, gaan verloren naar ziel en lichaam."},{"catchword":"door gebrek","tekst":"Hebreeuws, door gebrek des harten; dat is, des verstands; te weten: waardoor zij niet alleen anderen met goede leer niet kunnen voeden, maar ook zichzelven niet schikken om God te kennen, te vrezen en te dienen. Van het woord hart, genomen voor verstand, zie Job 9:4 ."}],"22":[{"catchword":"zegen","tekst":"Dat is, weldadigheid. Zie Gen 12:2 ."},{"catchword":"Hij voegt","tekst":"Te weten, de Heere."},{"catchword":"smart","tekst":"Te weten, gelijk in het hart en huis is der gierigen, die nimmermeer tevreden zijn, en met hun overvloed noch zichzelven noch anderen deugd doen."},{"catchword":"bij","tekst":"Te weten, bij den zegen. Vergelijk hiermede Psa 127:2 . Anders aldus: En de smart; [dat is den smartelijken arbeid] voegt er niet bij."}],"23":[{"catchword":"wijsheid","tekst":"Te weten, waardoor hij God vreest, zich wacht schelmerij te doen, en poogt wat wijselijks ter ere Gods te spreken of uit te richten, hetwelk zijn plezier en geneugte is."}],"24":[{"catchword":"vreze","tekst":"Dat is, het kwaad dat hij vreest. Zie boven Pro 1:26 ."},{"catchword":"begeerte","tekst":"Dat is, dat de rechtvaardigen begeren en wensen van God; begeerte voor het goed, dat begeerd wordt; Psa 21:3 , en Psa 78:29 , onder Pro 13:12 , Pro 13:19 ."}],"25":[{"catchword":"Gelijk","tekst":"Of, alzo haast de wervelwind voorbijgegaan is, zo is de goddeloze niet meer. De zin is dat de goddelozen zeer haastiglijk en schrikkelijk omkomen, gelijk alsof zij met een zeer snellen en geweldigen draaiwind van de wereld uitgerukt waren. Zie van dezelfde gelijkenis des onweders, Job 9:17 , en boven Pro 1:27 ."},{"catchword":"is een eeuwige","tekst":"Dat is, staat onbewegelijk, te weten in zijn geloof, liefde, hoop, en vervolgens in een rechten welstand tot den einde toe. Vergelijk Psa 125:1 ; Mat 7:24-25 ."}],"26":[{"catchword":"zo is de luie","tekst":"De zin is dat de luie zeer verdrietelijk is dengenen, die hem te werk stellen, en bijzonderlijk die hem uitzenden om haastig wat te boodschappen en bescheid daarvan weder te brengen."}],"27":[{"catchword":"dagen;","tekst":"Te weten des levens, namelijk, dergenen, die den Heere oprechtelijk vrezen. Versta dit ten aanzien van degenen, die teder van lichaam en zwak door ziekte en door tegenspoed nedergestort zijnde, evenwel door Gods vertroosting langer leven dan de kracht hunner natuur zou kunnen uitgeven, zo God niet voorgenomen had hen langer in het leven te behouden. Sommigen verstaan dit in het bijzonder ten aanzien van de uiterlijke weldaden, die God den Israëlieten beloofde, zolang zij in het land Kanaän zouden wonen."},{"catchword":"verkort","tekst":"Want naar de kracht en gestaltenis hunner natuur hadden zij langer kunnen leven, maar zij worden door Gods rechtvaardig oordeel geweldig van hier weggerukt. Versta deze spreuk niet in het algemeen van allen, maar in het bijzonder van enigen, met wie het Gode belieft naar zijn onbegrijpelijke wijsheid alzo te handelen."}],"28":[{"catchword":"is blijdschap;","tekst":"Dat is, brengt den rechtvaardigen blijdschap mede, omdat zij vast gaan, steunende op Gods beloften; Rom 5:5 ."},{"catchword":"zal vergaan","tekst":"Dat is, niet vervuld worden, omdat zij niet zien dan op ijdele inbeeldingen, en daarom zullen zij ook eindelijk in droefenis komen."}],"29":[{"catchword":"De weg","tekst":"Zie Gen 18:19 ."},{"catchword":"sterkte;","tekst":"Tegen al hetgeen hunne zaligheid zou mogen beschadigen, tegen de wereld, den Satan en hun eigen vlees."},{"catchword":"verstoring","tekst":"Te weten, omdat zij weten dat daarin vele dingen zijn, die hun tegenwoordig leven tegenspreken en hen met den toekomenden dood dreigen."}],"30":[{"catchword":"niet bewonen","tekst":"Te weten, met stilheid en rust des gemoeds, en niet geduriglijk."}],"31":[{"catchword":"De mond","tekst":"Zie boven vs.11, en de aantekening."},{"catchword":"tong","tekst":"Zie boven Pro 8:13 ."}],"32":[{"catchword":"wat welgevallig is;","tekst":"Het Hebreeuwse woord is niet alleen genomen voor den wil en het welbehagen zelf, gelijk Psa 30:8 , en Psa 51:20 , maar ook voor hetgeen men wil en dat aangenaam of welgevallig is; Psa 40:9 , en Psa 145:19 , onder Pro 11:1 ."},{"catchword":"enkel verkeerdheid","tekst":"Hebreeuws, verkeerdheden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Proverbs of Salomon. [The nine foregoing Chapters are as preface, to stir men up to give diligent attention unto the ensuing Proverbs, which for the mo hword":null,"tekst":"He that gathereth in Summer, [To wit, his fruits, or that which he hath growing in the field. Compare abo.chap.6.8.] is a wise son: (but) he that sleepeth securely in the harvest, is a son that maketh ashamed. [to wit, he shames himself, and also his parents; namely, by his faults and misdemeanors. So below chap.12.4. and 14.35. and 17.2. and 19.26. and 26.7. This proverb may fitly by way of comparison be understood of a man, who while he is yet young and lusty, taketh pains, that he may have somewhat to keep him when he is old. See above chap.6.8.]"}],"6":[{"catchword":null,"tekst":"Blessings [To wit, both temporal, and eternal] are upon the head of the righteousness: [this seemeth to look at the old custom of pronouncing any blessing; because this was done by laying the hand upon the head of him that was blessed. See Gen.48.on verse 14. Or it may be also thus understood, that the righteous being blessed themselves, do likewise impart and communicate the blessing unto others, but that the mouth of the wicked is full of meer violence, as followeth in the words of the Text] but violence [understand malice, cruelty, injustice, extortion, and oppression, which they have used] covereth the mouth of the wicked. [that is, bringeth them to death. See Job 40.on verse 8. Or covereth them with shame, as with a garment. Compare Psa 44:16. and 69.8. or filleth them with plagues and punishments until their very mouth be full.]"}],"7":[{"catchword":null,"tekst":"The memory of the just shall be a blessing: [That is, shall tend to his praise, and honourable report, when they shall make mention of him, either being absent, or also being dead] but the name of the wicked shall rot. [or, purify, and grow stinking, and consequently perish.]"}],"8":[{"catchword":null,"tekst":"He that is wise in heart, receiveth the Commandments: [To wit, which teach a man how to order his life and conversation aright, so as that the he may please God, and edify his neighbour, and so /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
