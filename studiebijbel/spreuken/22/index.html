h a bountiful eye shall be blessed; for he giveth of his bread to the poor.","10":"Cast out the scorner, and contention shall go out; yea, strife and reproach shall cease.","11":"He that loveth pureness of heart, *for* the grace of his lips the king *shall be* his friend.","12":"The eyes of the LORD preserve knowledge, and he overthroweth the words of the transgressor.","13":"The slothful *man* saith, *There is* a lion without, I shall be slain in the streets.","14":"The mouth of strange women *is* a deep pit: he that is abhorred of the LORD shall fall","15":"Foolishness *is* bound in the heart of a child; *but* the rod of correction shall drive it far","16":"He that oppresseth the poor to increase his *riches, and* he that giveth to the rich, *shall* surely *come* to want.","17":"Bow down thine ear, and hear the words of the wise, and apply thine heart unto my knowledge.","18":"For *it is* a pleasant thing if thou keep them within thee; they shall withal be fitted in thy lips.","19":"That thy trust may be in the LORD, I have made known to thee this day,","20":"Have not I written to thee excellent things in counsels and knowledge,","21":"That I might make thee know the certainty of the words of truth; that thou mightest answer the words of truth to them that send","22":"Rob not the poor, because he *is* poor: neither oppress the afflicted in the gate:","23":"For the LORD will plead their cause, and spoil the soul of those that spoiled","24":"Make no friendship with an angry man; and with a furious man thou shalt not go:","25":"Lest thou learn his ways, and get a snare to thy soul.","26":"Be not thou *one* of them that strike hands, *or* of them that are sureties for debts.","27":"If thou hast nothing to pay, why should he take away thy bed","28":"Remove not the ancient landmark, which thy fathers have set.","29":"Seest thou a man diligent in his business? he shall stand before kings; he shall not stand before mean"}},"tsk":{"1":[{"kopje":"naam","refs":["1 Kon 1:47", 28":"<span class=\"wl wl-kjv\" data-code=\"H5253\">Remove</span> not the <span class=\"wl wl-kjv\" data-code=\"H5769\">ancient</span> <span class=\"wl wl-kjv\" data-code=\"H1366\">landmark,</span> which thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have set.","29":"<span class=\"wl wl-kjv\" data-code=\"H2372\">Seest</span> thou a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4106\">diligent</span> in his <span class=\"wl wl-kjv\" data-code=\"H4399\">business?</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3320\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings;</span> he shall not <span class=\"wl wl-kjv\" data-code=\"H3320\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> mean"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"naam","tekst":"Versta, een goede naam en eerlijke lof bij de mensen. Naam voor goeden naam. Het woord goed moet hier den zin geven uit het volgende lid van vs.1. Vergelijk boven Pro 18:22 ."},{"catchword":"goede gunst","tekst":"Dat is, het goed gevoelen, dat vrome mensen van iemand hebben, en de goede genegenheid, die zij hem toedragen. Vergelijk boven Pro 3:4 ; de aantekening op het woord gunst."}],"2":[{"catchword":"ontmoeten","tekst":"Dat is, zij leven met elkander en hebben den een den ander van doen. Vergelijk onder Pro 29:13 ."},{"catchword":"HEERE","tekst":"Te weten, die den rijke verbiedt den arme te verachten en den arme den rijke te benijden. De rijken zijn gehouden de armen uit liefde te helpen en de armen de rijken voor loon te dienen."}],"3":[{"catchword":"kloekzinnig mens","tekst":"Dat is, die voorzichtig is en kloek van verstand. Zie boven Pro 1:4 ."},{"catchword":"kwaad,","tekst":"Te weten, dat schijnt over de mensen te zullen vallen en vorziet zich daartegen om het te ontgaan."},{"catchword":"gaan henen","tekst":"Te weten, omdat zij niet voorzien het kwaad, dat over hen hangt, of het verachten."}],"4":[{"catchword":"met","tekst":"Dat is, die met de vreze des Heeren gevoegd is. In denzelfden zin kunnen de woorden ook overgezet worden, [en] der vreze des Heeren."},{"catchword":"rijkdom,","tekst":"Dat is, gelijk met de ware nederigheid de vreze Gods verenigd is, alzo heeft de vreze Gods de belofte van het tegenwoordige en het toekomende leven; 1Ti 4:8 ."}],"5":[{"catchword":"Doornen","tekst":"Dat is, ellendigheden en plagen, waarin de boze door zijn kwade werken zo verward en verstrikt wordt, dat hij zich daaruit niet kan redden."},{"catchword":"des verkeerden;","tekst":"Dat is, des onherborenen en desgenen, die vreemd is van de vreze Gods."}],"6":[{"catchword":"Leer den jongen","tekst":"Het Hebreeuwse woord betekent eigenlijk iemand van jongsaf in enige wetenschap, en voornamelijk in de gronden der heilige leer, tot zijner ziele zaligheid onderwijzen. Vergelijk Gen 14:14 . Het is hier zoveel als catechiseren, hetwelk dikwijls in het Nieuwe Testament alzo gebruikt wordt. Zie Luk 1:4 ; Act 18:25 ; Rom 2:18 ; 1Co 14:19 ; Gal 6:6 ."},{"catchword":"naar den eis","tekst":"Hebreeuws, naar den mond; dat is, naar den eis of de gelegenheid zijns wegs, dat is zijns ouderdoms, begrips en zijner tederheid. Anders: in het begin, of den ingang zijns wegs; dat is in den aanvang zijns levens."},{"catchword":"daarvan niet","tekst":"Te weten, van hetgeen gij in zijne jonkheid met de eerste onderwijzing hem ingestort hebt."}],"7":[{"catchword":"rijke","tekst":"Te weten, die den arme wat leent, of enige weldaad bewijst."},{"catchword":"armen;","tekst":"Te weten, die van de rijke wat geleend, of enige weldaad ontvangen heeft."},{"catchword":"knecht","tekst":"Dat is, die hem ten dienste staan moet. Hij spreekt eigenlijk niet van hetgeen behoort te geschieden, maar van hetgeen ten meesten dele in de wereld geschiedt."}],"8":[{"catchword":"onrecht","tekst":"Zie Job 4:8 ."},{"catchword":"roede","tekst":"Dat is de plaag, waarmede hij anderen door zijn oplopende grimmigheid gekweld, beledigd en verdrukt heeft. Het schijnt een gelijkenis te zijn van een stok, waarmede men het zaad en gewas placht te dorsen."}],"9":[{"catchword":"goed van oog is,","tekst":"Dat is, die vriendelijk, mild, medelijdend en goeddadig is; alzo Mat 20:15 . Want gemeenlijk openbaart zich de genegenheid van de mensen in de ogen. Het goede oog wordt ook genaamd een eenvoudig oog, Mat 6:22 . Zie van een kwaad, of boos oog, Deu 15:9 , en onder Pro 23:6 ."},{"catchword":"den armen","tekst":"Hebreeuws, den dunne."}],"10":[{"catchword":"gekijf","tekst":"Te weten, dien hij pleegt te verwekken."},{"catchword":"schande","tekst":"Te weten, die hij anderen met zijne twistingen aandoet."}],"11":[{"catchword":"reinheid","tekst":"Dat is, de oprechtheid des gemoeds; waarvan zie Gen 20:5 ; 1Ki 9:4 ; Psa 51:12 ; Mat 5:8 ."},{"catchword":"wiens lippen","tekst":"Dat is, die zo bespraakt is, dat hij zijn oprechte gedachten met bevalligheid kan voortbrengen. De overzetting kan ook aldus staan: met, of door, of om de aangenaamheid zijner lippen is de koning zijn vriend."},{"catchword":"aangenaam zijn,","tekst":"Hebreeuws, aangenaamheid; dat is bevalligheid. Zie van deze Psa 45:3 ; Ecc 10:12 ."}],"12":[{"catchword":"De ogen","tekst":"Dat is, de voorzienigheid en zorg des Heeren; zie 2Ch 16:9 ."},{"catchword":"wetenschap;","tekst":"Dat is, degenen, die met ware wetenschap en godvruchtige wijsheid begaafd is, en naar dezelve zijne woorden en werken beleidt. Vergelijk de manier van spreken met Job 35:13 ."},{"catchword":"zaken","tekst":"Anders: woorden."},{"catchword":"trouwelozen","tekst":"Dat is, des goddelozen, die, het verbond des Heeren niet getrouwelijk houdende, in woorden en werken zich moedwilliglijk verloopt."}],"13":[{"catchword":"zegt","tekst":"Te weten om den arbeid te ontgaan. Dan vindt hij lichtelijk ene voorwending vna dit of dat gevaar, hetwelk hij verzint voorhanden te wezen."}],"14":[{"catchword":"De mond","tekst":"Te weten, door hun vleien, pluimstrijken en aanlokkende woorden."},{"catchword":"vreemde vrouwen","tekst":"Zie boven Pro 2:16 ."},{"catchword":"gracht;","tekst":"Te weten, der ellenden voor het lichaam en de ziel. Vergelijk onder Pro 23:27 ."}],"15":[{"catchword":"De dwaasheid","tekst":"Zie boven Pro 12:23 ."},{"catchword":"gebonden;","tekst":"Het is ene gelijkenis, te kennen gevende dat de zonde zo vast aan de jonge jeugd gehecht is als de dingen, die met touwen en repen aan elkander gebonden worden."},{"catchword":"der tucht","tekst":"Dat is, waardoor een kind gekastijd wordt."}],"16":[{"catchword":"verdrukt,","tekst":"Te weten, door bedrog of geweld. Vergelijk boven Pro 14:31 ."},{"catchword":"vermeerderen,","tekst":"Of, zich te vergroten."},{"catchword":"geeft,","tekst":"Te weten, om zijne gunst, hulp en vordering te krijgen jegens de armen."},{"catchword":"zekerlijk","tekst":"Anders: alleen, of niet dan tot gebrek. Vergelijk boven Pro 21:5 , en de aantekening."}],"17":[{"catchword":"Neig uw oor,","tekst":"Deze vermaning wordt hier ingevoegd om den lezer tot de rechte betrachting van deze spreuken, ja van alle geboden Gods, op te scherpen."},{"catchword":"der wijzen,","tekst":"Salomo noemt deze spreuken niet alleen zijne, maar ook van alle andere ware wijzen, die hetzelve toestemden, van welken enigen genoemd worden onder Pro 30 , Pro 31 ."},{"catchword":"mijn wetenschap;","tekst":"Dat is, mijne leer en geboden, die gij weten moet. Zie boven Pro 15:7 . Anders: om mij te kennen, [mij]; te weten, de wijsheid."}],"18":[{"catchword":"die","tekst":"Te weten, woorden der wijzen."},{"catchword":"in uw binnenste","tekst":"Hebreeuws, in uwen buik; dat is in het binnenste uws harten. Zie boven Pro 18:8 , en Pro 20:30 ; Job 15:2 ."},{"catchword":"gepast worden","tekst":"Te weten, opdat gij ze bekwamelijk en stichtelijk tot de mensen zoudt mogen uitspreken."}],"19":[{"catchword":"Opdat","tekst":"Vergelijk boven Pro 3:5-6 . Hiermede is het doel dezer spreuken aangewezen, hetwelk is in God te geloven en alles goeds van Hem te verwachten, mits dat wij Hem ook gehoorzamen."},{"catchword":"gij ook","tekst":"Te weten, die de wijsheid zoekt horende of lezende deze spreuken. Anders: [doet] gij ze ook. Vergelijk de manier van spreken met Pro 23:15 ."}],"20":[{"catchword":"heerlijke","tekst":"Dat is, die den heren zelf en den gouverneurs of regeerders dienstig zijn, om van hen overlegd, besproken en in het werk gesteld te worden. Vergelijk boven Pro 8:6 . Anders: heb ik niet driemaal, dat is, dikwijls geschreven?"},{"catchword":"allerlei","tekst":"Dat is, allerlei goede aanleidingen en onderwijs, om zichzelven naar Gods woord in het publieke en private leven wel aan te stellen."}],"21":[{"catchword":"opdat gij","tekst":"Dat is opdat gij niet alleen zelf de waarheid weet, maar ook anderen die bekend moogt maken, naar de gelegenheid van uwe roeping."},{"catchword":"zenden","tekst":"Te weten, om enig werk voor hen in het bijzonder te doen, of voor allen in het algemeen enig ambt te bedienen. Anders: die [tot] u zenden; te weten, om goeden raad en rechte onderwijzing van u te hebben."}],"22":[{"catchword":"arm is;","tekst":"De rijken en machtigen worden niet uitgesloten; maar de armen worden voornamelijk vermeld, omdat zij lichtelijk verdrukt kunnen worden, Job 31:21 , en omdat wij gehouden zijn hun meest goed te doen. Zie boven Pro 3:27 ."},{"catchword":"in de poort","tekst":"Dat is, in het gericht. Zie Gen 22:17 ."}],"23":[{"catchword":"twistzaak","tekst":"Dat is, hunne zaken beschermen en voorstaan. Zie dezelfde manier van spreken 1Sa 25:39 ; onder Pro 23:11 ; Jer 51:36 ."},{"catchword":"die hen beroven,","tekst":"Dat is, die den ellendigen hunne goederen en middelen afnemen."},{"catchword":"de ziel roven","tekst":"Dat is, het leven nemen."}],"24":[{"catchword":"grammoedige,","tekst":"Hebreeuws, heer, of bezitter des toorns; dat is die van nature en door gewoonte zeer tot toorn genegen is; alzo onder Pro 29:22 ; een heer der grimmigheid. Vergelijk Gen 14:13 ."},{"catchword":"zeer grimmig man;","tekst":"Hebreeuws, man der grimmigheden, of der brandende toornigheden; dat is, die haast met groten toorn ontstoken wordt. Vergelijk Job 11:11 , en Psa 5:7 ."}],"25":[{"catchword":"paden","tekst":"Of, wegen; zie Gen 6:12 ."},{"catchword":"een strik","tekst":"Dat is, een kwaad en verderf over uzelven brengt, dat gij niet ontgaan kunt. Vergelijk boven Pro 18:7 ."}],"26":[{"catchword":"hand klappen,","tekst":"Te weten, van den schuldheer, tot een teken dat men voor den schuldenaar borg is; zie Job 17:3 , en boven Pro 6:1 ."}],"27":[{"catchword":"te betalen,","tekst":"Te weten, den schuldheer, tot wiens verzekering gij voor den schuldenaar borg geworden zijt."},{"catchword":"wegnemen?","tekst":"Te weten, zo er anders in uw huis niets ware om den schuldeiser te voldoen. Versta dit van dengene, die zich borg stelde voor de schuld van een ander; want daarmede verklaarde hij dat hij rijk was en de macht had om te betalen, zodat hij zich niet mocht behelpen met de wet, Exo 22:26-27 ; Deu 24:6 . Hoewel dan de wet der liefde beval dat men des armen noodzakelijke dingen niet zou te pand nemen; nochtans liet het burgerlijke recht zulks in zekere gevallen toe, ja ook den schuldenaar voor een tijd tot slaaf te maken, 2Ki 4:1 . Zie ook boven Pro 20:16 ."}],"28":[{"catchword":"de oude","tekst":"Hebreeuws, de palen der eeuwigheid. Zie van deze palen Deu 19:14 , en Deu 27:17 ; boven Pro 15:25 , en onder Pro 23:10 ; en van het woord eeuwigheid, dat hier voor een langen en onbepaalden tijd genomen wordt, 1Ki 1:31 ."}],"29":[{"catchword":"voor het aangezicht","tekst":"Voor iemands aangezicht gesteld worden, of staan, is hem te dienen, of daartoe bevorderd en geroepen te worden; zie Deu 1:38 , en 1Ki 1:2 ."},{"catchword":"ongeachte","tekst":"Hebreeuws, duistere; te weten, lieden, of mensen; dat is, gemene, onbekende, slechte en niet van aanzien."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The name [Meaning a good name, and honest report among men. Name for good name. The word good must here be supplied, to make up the sense, from the following branch of this verse. Compare above chapter 18.on verse 22.] is a more choice (thing) then great riches: the good favour, [that is, the good opinion that the godly have of a man, and the good affection which they bear unto him. Compare ab.ch.3.4. the annot. Upon the word favour] then silver, and then gold. [compare Ecc 7:1.]"}],"2":[{"catchword":null,"tekst":"The rich, and poor, meet together: [That is, they live among one another, and have need of one another. Compare bel.ch.29.13.] the LORD hath made them all. [to wit, the Lord, who forbiddeth the rich to despise the poor are bound to serve the rich , for reward.]"}],"3":[{"catchword":null,"tekst":"A prudent man [That is, that is provident, and of wise understanding. See ab.ch.1.4.] seeth the evil, and hideth himself: [he foreseeth the evil, to wit, which hangeth over men, and which will certainly fall upon them, and provideth for himself against it, that he may escape it] but the simple pass on, and are punished. [to wit, because they do not foresee the evil that hangeth over them, or because they despise it.]"}],"4":[{"catchword":null,"tekst":"The reward of humility, (with) the fear of the LORD, [That is, which is joined with the fear of the Lord. In the same sense the words may be also rendered, (and) of the fear of the LORD] is riches, and honour, and life. [that is, as the fear of God is united and conjoined with true humility, so hath also the fear of God the promise of the life that now is, and of that which is to come, 1 Tim.4.8.]"}],"5":[{"catchword":null,"tekst":"Thorns, (and) snares are in the way of the forward (one): [That is, calamities, and plagues, wherein the wicked by his evil and wicked doings is so entangled and ensnared, that he cannot deliver himself out them. By the forward, or, perverse person her, is meant the unregenerate man, and he that is estranged from the fear of God] be that keepeth his soul, will keep far off from him."}],"6":[{"catchword":null,"tekst":"Teach a boy the first principles [The Hebrew signifieth properly to instruct a man from his youth, or childhood in some science, and especially in the grounds and principles of Christian Religion, to the comfort and salvation of his soul. Compare Gen.14.on verse 14. It is here as much as Catechizing, which is often so used in the New Testament. See Luk 1:4. Act 18:25. the nature of his way; [Hebr. According to the mouth (that is, according to the request, or condition) of his way; that is, of his age, apprehension, and tenderness. Oth.in the beginning, or, entrance of his way, that is, in the beginning of his life] also when he shall be grown old, he will not depart from it. [to wit, from which thou in his youth hast infused into him with his first institution.]"}],"7":[{"catchword":null,"tekst":"The rich [To wit, he that lendeth something to the poor, or sheweth him some kindness or favour] ruleth over the poor: [to wit, over him that hath borrowed something of the rich, or hath received a kindness or favour at his hand] and he that borroweth, is the lenders servant. [that is, he must be at his service, and ready to wait upon him. He speaketh not properly of that which ought to be done, but of that which for the most part cometh to pass in the world.]"}],"8":[{"catchword":null,"tekst":"He that soweth iniquity, shall reap trouble: [See Job 4.on verse 8. Also Hos 10:13.] and the rod of his indignation shall have an end. [that is, the plague, or punishment, whereby he vexed, annoyed, and oppressed others in his fierce wrath, shall cease. It seemeth to be a similitude, borrowed from a staff, wherewith we are wont to thresh seed, or grain.]"}],"9":[{"catchword":null,"tekst":"He that is of a good eye, [That is, he that is friendly, liberal, compassionate, and bountiful. So Mat 20:15. For commonly the nature and the nature and disposition of a man is seen and discovered in the eyes. The good eye is also called a single eye, Mat 6:22. See of an evil, or, wicked eye, Deut.15.on verse 9. And below chap.23.6.] he shall blessed: [Compare 2 Cor.9. verse 6.] for he hath given of his bread to the poor. [Hebr. To the thin (ones).]"}],"10":[{"catchword":null,"tekst":"Drive out the scorner, and brawling [to wit, which he is wont to raise] shall go away; and contention with reproach [to wit, the reproach which he offereth to others by his strifes and contentions] shall cease."}],"11":[{"catchword":null,"tekst":"He that loveth pureness of heart, [That is, sincerity, or uprightness of mind: which see Gen.20.verse 5. 1 Kings 9.4. Psa 5:12. Mat 5:8.] whose lips are gracious, [that is, that is so eloquent, that he can utter and express his upright thoughts with a kind of grace. Heb. Whose lips are grave; that is, pleasantness, or acceptableness. See of this, Psa 45:3. Ecc 10:12.] the King is his friend. [The Translation may be also thus rendered: with, or, because of the grace of his lips the Kings is his friend.]"}],"12":[{"catchword":null,"tekst":"The eyes of the LORD [That is, the Providence and care of God. See 2 Chron.16.on verse 9.] preserve knowledge: [that is, him that is endowed with true knowledge, and godly wisdom, and ordereth his words and actions according to it. Compare the phrase with Job 35.on verse 13.] but he will overthrow the affairs [Oth. Words] of the faithless (one.) [that is, of the wicked man, who not keeping faithfully the covenant of God, transgresseth wilfully both in words and deeds.]"}],"13":[{"catchword":null,"tekst":"The slothful man saith there is a lion without: I may be slain in the midst of the streets. [To wit, he speaketh so, that he may escape labour, or pains. When he is bid to work, or take pains to get his living, he then findeth easily a pretence of this or that danger, which he feigneth to be present or ready at hand to hinder him, when he should go about any business. So bel.ch.26.13.]"}],"14":[{"catchword":null,"tekst":"The mouth of stranger women [See above chapter 2.on verse 16.] is a deep pit: [to wit, of miseries, both for body and soul. Compare below chapter 23.27. Her mouth is a deep pit, to wit, by reason of her flattering, soothing, and enticing words. See above chapter 2.16. and 5.3. and 5.7.] (he) against whom the LORD is provoked to anger, shall fall therein."}],"15":[{"catchword":null,"tekst":"Foolishness [See above chapter 12.on verse 23.] is bound in the heart of a boy: [it is a similitude or comparison, signifying that sin is tied as fast unto youth, or to the younger sort, as things that are tied and bound fast together with cords and ropes] the rod of discipline [that is, the rod whereby a child is chastified, or corrected] shall remove it far from him. [compare above chap.13.24. and 19.18. and below ch.23.14. and 29.15.,17.]"}],"16":[{"catchword":null,"tekst":"He that oppresseth the poor [To wit, by deceit, or violence. Compare above chapter 14.on verse 31.] to increase his own (substance); [or, to make himself great] (and) giveth to the rich, [to wit, to get his favour to want. [oth. Onely, or, to nothing but want. Compare above chapter 21.5. and the annot.]"}],"17":[{"catchword":null,"tekst":"Incline thine ear, and hear [This exhortation is here inserted, to stir up the Reader to the due and right consideration of these proverbs, yea of all the commandments of God] the words of the wise: [Salomon calleth these proverbs not onely his proverbs, but also the proverbs of all other truly wise, that consented thereunto, and joined in the making and publishing of them, of which some are named below chap.30. and 31.] and apply thine heart unto my knowledge. [that is, my doctrine, and commandments, which thou oughtest to know. See above ch.15.on verse 7. Oth. To know me. Me; to wit, wisdom.]"}],"18":[{"catchword":null,"tekst":"For it is pleasant when thou keepest them [To wit, the words of the wise] in thy inner most (parts): [Hebr. In thy belly: that is, in the innermost parts o // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +

  }
  if (tab === 'bijbeluitleg') {

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];

    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
