oor naar mij, en wijk niet van de woorden van mijn mond.","8":"Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;","9":"Opdat u anderen uw eer niet geeft, en uw jaren aan de wrede;","10":"Opdat vreemden zich niet verzadigen van uw vermogen, en al uw smartelijke arbeid niet komt in het huis van de onbekende;","11":"En u in uw laatste dagen kermt, als uw vlees en uw lijf verteerd zijn;","12":"En zegt: Hoe heb ik de tucht gehaat, en heeft mijn hart de bestraffing versmaad!","13":"En heb niet geluisterd naar de stem van mijn onderwijzers, mijn oren niet geneigd tot mijn leraars!","14":"Ik ben bijna in alle kwaad geweest, midden in de gemeente en de vergadering!","15":"Drink water uit uw eigen bak, en stromend water uit het midden van uw eigen bron;","16":"Laat uw bronnen zich naar buiten verspreiden, *en* de waterbeken op de straten;","17":"Laat ze van u alleen zijn, en niet van een vreemde naast u.","18":"Uw bron zij gezegend; en verblijd u vanwege de vrouw van uw jeugd;","19":"Een zeer lieflijke hinde, en een aangenaam steengeitje; laat haar borsten u altijd dronken maken; dool voortdurend in haar liefde.","20":"En waarom zou u, mijn zoon, dolen in een vreemde vrouw, en de schoot van de onbekende omvangen?","21":"Want de wegen van ieder mens zijn voor de ogen van de HEERE, en Hij weegt al zijn gangen.","22":"De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.","23":"Hij zal sterven, omdat hij zonder tucht geweest is, en in de grootheid van zijn dwaasheid zal hij verdwalen."},"SV":{"1":"Mijn zoon! merk op mijn wijsheid, neig uw oor tot mijn verstand;","2":"Opdat gij alle bedachtzaamheid behoudt, en uw lippen wetenschap bewaren.","3":"Want de lippen der vreemde *vrouw* druppen honigzeem, en haar gehemelte is gladder dan olie.","4":"Maar het laatste van haar is bitter als alsem, scherp als een tweesnijdend zwaard.","5":"Haar voeten dalen naar den dood, haar treden houden de hel vast.","6":"Opdat gij het pad des levens niet zoudt wegen, zijn haar gangen ongestadig, *dat* gij het niet merkt.","7":"Nu dan, gij kinderen! hoort naar mij, en wijkt niet van de redenen mijns monds.","8":"Maak uw weg verre van haar, en nader niet tot de deur van haar huis;","9":"Opdat gij anderen uw eer niet geeft, en uw jaren den wrede;","10":"Opdat de vreemden zich niet verzadigen van uw vermogen, en al uw smartelijke arbeid niet *kome* in het huis des onbekenden;","11":"En gij in uw laatste brult, als uw vlees, en uw lijf verteerd is;","12":"En zegt: Hoe heb ik de tucht gehaat, en mijn hart de bestraffing versmaad!","13":"En heb niet gehoord naar de stem mijner onderwijzers, noch mijn oren geneigd tot mijn leraars!","14":"Ik ben bijna in alle kwaad geweest, in het midden der gemeente en der vergadering!","15":"Drink water uit uw bak, en vloeden uit het midden van uw bornput;","16":"Laat uw fonteinen zich buiten verspreiden, *en* de waterbeken op de straten;","17":"Laat ze de uwe alleen zijn, en van geen vreemde met u.","18":"Uw springader zij gezegend; en verblijd u vanwege de huisvrouw uwer jeugd;","19":"Een zeer liefelijke hinde, en een aangenaam steengeitje; laat u haar borsten te allen tijd dronken maken; dool steeds in haar liefde.","20":"En waarom zoudt gij, mijn zoon, in een vreemde dolen, en den schoot der onbekende omvangen?","21":"Want eens iegelijks wegen zijn voor de ogen des HEEREN, en Hij weegt al zijne gangen.","22":"Den goddeloze zullen zijn ongerechtigheden vangen, en met de banden zijner zonden zal hij vastgehouden worden.","23":"Hij zal sterven, omdat hij zonder tucht geweest is, en in de grootheid zijner dwaasheid zal hij verdwalen."},"KJV":{"1":"My son, attend unto my wisdom, *and* bow thine ear to my understanding:","2":"That thou mayest regard discretion, and *that* thy lips may keep knowledge.","3":"For the lips of a strange woman drop *as* an honeycomb, and her mouth *is* smoother than oil:","4":"But her end is bitter as wormwood, sharp as a twoedged sword.","5":"Her feet go down to death; her steps take hold on hell.","6":"Lest thou shouldest ponder the path of life, her ways are moveable, *that* thou canst not know","7":"Hear me now therefore, O ye children, and depart not from the words of my mouth.","8":"Remove thy way far from her, and come not nigh the door of her house:","9":"Lest thou give thine honour unto others, and thy years unto the cruel:","10":"Lest strangers be filled with thy wealth; and thy labours *be* in the house of a stranger;","11":"And thou mourn at the last, when thy flesh and thy body are consumed,","12":"And say, How have I hated instruction, and my heart despised reproof;","13":"And have not obeyed the voice of my teachers, nor inclined mine ear to them that instructed","14":"I was almost in all evil in the midst of the congregation and assembly.","15":"Drink waters out of thine own cistern, and running waters out of thine own well.","16":"Let thy fountains be dispersed abroad, *and* rivers of waters in the streets.","17":"Let them be only thine own, and not strangers'","18":"Let thy fountain be blessed: and rejoice with the wife of thy youth.","19":"*Let her be as* the loving hind and pleasant roe; let her breasts satisfy thee at all times; and be thou ravished always with her love.","20":"And why wilt thou, my son, be ravished with a strange woman, and embrace the bosom of a stranger?","21":"For the ways of man *are* before the eyes of the LORD, and he pondereth all his goings.","22":"His own iniquities shall take the wicked himself, and he shall be holden with the cords of his sins.","23":"He shall die without instruction; and in the greatness of his folly he shall go astray."}},"tsk":{"1":[{"kopje":"Let op","refs":["Spr 2:1","Spr 4:1","Spr 4:20","Matt 3:9","Mark 4:23","Openb 2:7","Openb 2:11","Openb 2:17","Openb 2:29","Openb 3:6","Openb 3:13","Openb 3:22"]},{"kopje":"neig","refs":["Spr 22:17","Jak 1:19"]}],"2":[{"kopje":"uw lippen","refs":["Spr 10:21","Spr 15:2","Spr 15:7"  <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> and assembly.","15":"<span class=\"wl wl-kjv\" data-code=\"H8354\">Drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> out of thine own <span class=\"wl wl-kjv\" data-code=\"H953\">cistern,</span> and running <span class=\"wl wl-kjv\" data-code=\"H5140\">waters</span> out <span class=\"wl wl-kjv\" data-code=\"H8432\">of</span> thine own well.","16":"Let thy <span class=\"wl wl-kjv\" data-code=\"H4599\">fountains</span> be <span class=\"wl wl-kjv\" data-code=\"H6327\">dispersed</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad,</span> and <span class=\"wl wl-kjv\" data-code=\"H6388\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> in the streets.","17":"Let them be only thine own, and not strangers'","18":"Let thy <span class=\"wl wl-kjv\" data-code=\"H4726\">fountain</span> be <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed:</span> and <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> with the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of thy youth.","19":"Let her be as the <span class=\"wl wl-kjv\" data-code=\"H158\">loving</span> <span class=\"wl wl-kjv\" data-code=\"H365\">hind</span> and <span class=\"wl wl-kjv\" data-code=\"H2580\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H3280\">roe;</span> let her <span class=\"wl wl-kjv\" data-code=\"H1717\">breasts</span> <span class=\"wl wl-kjv\" data-code=\"H7301\">satisfy</span> thee at all <span class=\"wl wl-kjv\" data-code=\"H6256\">times;</span> and be thou <span class=\"wl wl-kjv\" data-code=\"H7686\">ravished</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">always</span> with her love.","20":"And why wilt thou, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> be <span class=\"wl wl-kjv\" data-code=\"H7686\">ravished</span> with a strange <span class=\"wl wl-kjv\" data-code=\"H2114\">woman,</span> and <span class=\"wl wl-kjv\" data-code=\"H2263\">embrace</span> the <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom</span> of a stranger?","21":"For the <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> of <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> are <span class=\"wl wl-kjv\" data-code=\"H5227\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and he <span class=\"wl wl-kjv\" data-code=\"H6424\">pondereth</span> all his goings.","22":"His own <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities</span> shall <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> himself, and he shall be <span class=\"wl wl-kjv\" data-code=\"H8551\">holden</span> with the <span class=\"wl wl-kjv\" data-code=\"H2256\">cords</span> of his sins.","23":"He shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> without <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction;</span> and in the <span class=\"wl wl-kjv\" data-code=\"H7230\">greatness</span> of his <span class=\"wl wl-kjv\" data-code=\"H200\">folly</span> he shall go astray."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Wijsheid . . . verstand","tekst":"Van het onderscheid dezer twee woorden wijsheid en verstand, zie boven Pro 1:2 ."}],"2":[{"catchword":"bedachtzaamheid","tekst":"Hebreeuws, bedachtzaamheden, zie boven Pro 1:4 ."},{"catchword":"lippen","tekst":"Te weten, waarmede gij de wetenschap, die gij uit mijne lering krijgt, anderen moogt mededelen. Vergelijk Mal 2:7 ."}],"3":[{"catchword":"Want","tekst":"Hier wordt reden gegeven, waarom de voorgaande vermaning bij de mensen behoort plaats te hebben."},{"catchword":"lippen","tekst":"Dat is, woorden. Zie Job 2:10 . Dezelfde betekenis heeft het woord gehemelte, dat volgt. Alzo Job 31:30 ."},{"catchword":"der vreemde","tekst":"Zie boven Pro 2:16 ."},{"catchword":"druipen","tekst":"Dat is, brengen zoete en lieflijke woorden zonder ophouden voort, waardoor de jonge mannen tot hare liefde aangelokt worden. Zie van deze manier van spreken Deu 32:2 , en de aantekening."},{"catchword":"haar gehemelte","tekst":"Dat hare redenen gelijden in het hart door haar lieflijke vleiing, gelijk de olie in de maag door hare gladheid. Vergelijk onder Pro 26:28 ."}],"4":[{"catchword":"het laatste","tekst":"Of, haar einde, of uitgang. De zin is dat de uitkomst van al de lieflijkheid en zoetigheid der vreemde vrouw en dergenen, die haar aanhangen, anders niet is dan gelijk in den tekst volgt. Alzo wordt het oorspronkelijke woord voor een ongelukkig einde genomen, Deu 32:20 , onder Pro 14:13 , en Pro 23:32 ; Amo 8:10 ."},{"catchword":"een tweesnijdend","tekst":"Hebreeuws, een zwaard der monden; dat is, dat twee monden heeft. Versta, een zwaard, dat aan beide zijden snijdt. Alzo Psa 149:6 ; Heb 4:12 ."}],"5":[{"catchword":"den dood,","tekst":"Hierbij wordt niet alleen de tijdelijke dood en het zichtbare graf verstaan, maar ook de eeuwige dood en de hel."},{"catchword":"houden","tekst":"Dat is, strekken daarheen, dat zij dezelve niet ontgaan zullen."},{"catchword":"hel","tekst":"Zie van de betekenissen van het woord Gen 37:35 ."}],"6":[{"catchword":"Opdat","tekst":"Dat is, opdat gij niet komt bij uzelven te overwegen of men met haar zou kunnen verkeren en evenwel den weg des levens behouden; zo weet dat hare gangen en manieren van doen zo ongestadig, veranderlijk en dwalende zijn in het aanleggen van alle listigheid om u te verleiden, dat gij het niet zult kunnen bemerken, en zult dienvolgens van haar in het net des verderfs gevangen worden."},{"catchword":"pad","tekst":"Dat is, dat tot het ware leven leidt. Zie boven Pro 2:19 ."},{"catchword":"gangen","tekst":"Hebreeuws, sporen; dat is, hare woorden en werken."},{"catchword":"ongestadig,","tekst":"Of, bewegen zich heen en weder, zijn weifelende; dat is dwalende, onzeker, met alle winden gedreven, nu tot deze dan tot die hangende, en dat om de mensen te verleiden."},{"catchword":"dat","tekst":"Of, [dat] gij het niet gewaar wordt, of bevindt, te weten dat hare gangen van het pad des levens afdwalen en den mens naar den dood leiden."},{"catchword":"merkt","tekst":"Het Hebreeuwse woord is alzo dikwijls genomen. Zie Job 5:24 ."}],"8":[{"catchword":"Maak uw weg","tekst":"Dat is, heb gene gemeenschap met haar en wacht u van omtrent haar te komen."}],"9":[{"catchword":"anderen","tekst":"Te weten, de overspelers en haar man."},{"catchword":"eer","tekst":"Dat is, uw jeugd, sterkte, middelen, goeden naam en zielewelvaart. Versta hieronder ook de kinderen, die een hoereerder van de hoer krijgt; want die blijven meest in het huis der echtbreekster."},{"catchword":"geeft,","tekst":"Te weten, als een roof en prooi, om die kwijt te worden."},{"catchword":"jaren","tekst":"Te weten, uw jonge jaren en den besten tijd van uw leven."},{"catchword":"wrede;","tekst":"Versta het hoerengezelschap en den man der hoer, die u wredelijk vervolgen en de overheid overgeven zal. Vergelijk onder Pro 6:34-35 ."}],"10":[{"catchword":"vreemden","tekst":"Versta, niet alleen de overspeleres en haar man, maar ook alle hoerenwaarden, koppelaars, koppelaressen en overspelige gedrochten, die enige profijt van de onkuischheid trekken."},{"catchword":"van uw vermogen,","tekst":"Dat is, van uw tijdelijke middelen; alzo Hos 7:9 ."},{"catchword":"al uw smartelijke","tekst":"Dat is, dat gij door uwen arbeid [met smart en moeite verenigd] gewonnen hebt. Vergelijk onder Pro 14:23 ; Isa 58:3 ."},{"catchword":"onbekenden;","tekst":"Of, uitlandsen; alzo onder vs.20."}],"11":[{"catchword":"brult,","tekst":"Of, schreeuwt. Het Hebreeuwse woord betekent eigenlijk het getier en gebrul, dat de beesten en bijzonderlijk de leeuwen maken, als zij in enigen nood zijn, hoewel zij niet verzinnen vanwaar die komt. Vergelijk Psa 32:3 ; Isa 5:29-30 ; Eze 24:23 ."}],"14":[{"catchword":"Ik ben","tekst":"Hebreeuws, ik ben na, of omtrent een weinig in alle kwaad geweest."},{"catchword":"kwaad","tekst":"Te weten, het kwaad der straf; zie Gen 19:19 ; of versta ook daarbij het kwaad der schuld, waarvan zie Job 20:12 ."},{"catchword":"in het midden","tekst":"Dat is, in het openbaar voor de gemeente Gods en de ganse wereld."}],"15":[{"catchword":"Drink","tekst":"Dit is een figuurlijke beschrijving tot vs.19 ingesloten, vertonende den schuldigen plicht, het welvaren en de gerustheid des gemoeds dergenen, die in den heiligen echtenstaat naar Gods ordinantie kuiselijk leven. De zin is, dat een ieder zich met zijn eigen wettelijk gezelschap alleen in alle eerbaarheid vermaken moet; gelijk volgt vs.18,19. Anderen hebben dit verstaan van het wettelijk bezit en gebruik der tijdelijke goederen en van de weldadigheid, die wij daarmede bewijzen moeten."},{"catchword":"vloeden","tekst":"Of, stromen."}],"16":[{"catchword":"fonteinen","tekst":"Versta, uwe kinderen, die uit u als uit ene fontein voortkomen; vergelijk Isa 51:1 . De zin is dat een ieder de zijnen eerlijk zou opkweken, opdat zij niet alleen het huisgezin sieraad en dienst zouden toebrengen, maar ook andere mensen, naar hunne gelegenheid, vriendschap en deugd doen."},{"catchword":"waterbeken","tekst":"Zie Psa 1:3 ."}],"17":[{"catchword":"Laat ze","tekst":"Te weten, mits dat zij alleen u voor hunnen vader kennen en gij hen voor uwe kinderen; hetwelk niet kan geschieden onder de kinderen, die uit ene overspeleres geboren worden."}],"18":[{"catchword":"Uw springader","tekst":"Dat is, uw wettelijke huisvrouw, uit welke u de kinderen, omdat zij van het hert [zoals enigen schrijven] zeer innig bemind wordt."}],"19":[{"catchword":"zeer liefelijke","tekst":"Hebreeuws, hinde der liefde. Van deze wordt hier gewag gemaakt, omdat zij van het hert [zoals enigen schrijven] zeer innig bemind wordt."},{"catchword":"aangenaam","tekst":"Hebreeuws, ree der aangenaamheid."},{"catchword":"dronken maken;","tekst":"Of, bevochtigen, drenken, laven; dat is, met vreugde en wellust vervullen. Vergelijk onder Pro 7:18 ."},{"catchword":"dool","tekst":"Dat is, vermaak u met haar gelijk iemand zich pleegt te vermaken in hetgeen geoorloofd is, en daarin zich zo te vergeten dat hij naar het ongeoorloofde niet eens omziet."}],"20":[{"catchword":"in een vreemde","tekst":"Dat is, in de liefde ener vreemde."},{"catchword":"onbekende","tekst":"Of, uitlandse."}],"21":[{"catchword":"eens iegelijks","tekst":"Of, van een man."},{"catchword":"weegt","tekst":"Hebreeuws, weegt al zijne sporen; dat is, Hij beproeft als met een paslood, een iegelijks wegen, of zij recht of slim zijn; wetende volkomenlijk al het doen en laten der mensen."}],"23":[{"catchword":"omdat","tekst":"Dat is, omdat hij geen onderricht of tuchtiging heeft willen horen, of, als hij ze hoorde, heeft willen aannemen."},{"catchword":"grootheid","tekst":"Of, vermenigvuldigheid; dat is, grote of menigvuldige dwaasheid."},{"catchword":"verdwalen","tekst":"Te weten, van den weg des levens en alzo ter verdoemenis lopen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"My son, attend unto my wisdom: encline thine ear to my understanding: [Of the difference of these two words, wisdom, and understanding, see above chap.1.on verse 2.]"}],"2":[{"catchword":null,"tekst":"That thou mayest preserve all discretion; [Hebr. Discretions. See above chap.1.on verse 4.] and (that) thy lips may keep knowledge. [to wit, the lips, whereby thou mayest impart and communicate that knowledge unto others, which thou gettest by my teaching and instruction, compare Mal.2.7.]"}],"3":[{"catchword":null,"tekst":"For [Here a reason is given, why the former exhortation should take place with men] the lips [that is, the words. See Job 2.on verse 20. The same signification hath the word palate, or, roof of the mouth, that followeth. So Job 31:30.] of a strange (woman) [see above chap.2.on verse 16.] drop an honey-comb: [that is, bring forth sweet, and pleasant words without ceasing, whereby young men are allured to the love her. See of this phrase Deut.32.2. and the Annot.] and her palate is smoother then oil. [that is, her words slip into the heart, by reason of her sweet and pleasant flattery, as oil slippeth into the stomach by reason of the smoothness and slipperiness thereof. Compare below chap.26. verse 28. See above chap.2.16. and below chap.6.24.]"}],"4":[{"catchword":null,"tekst":"But her last [Or, her end, or issue. The meaning is, that the event, or issue of all the pleasantness and sweetness of the strange woman, and of those that cleave unto her, is no otherwise, then as followeth in the Text. Thus the original word is taken for an unhappy end, Deut.32.20. below chap.14.13. and 23.32. Amos 8,10.] is bitter as wormwood, sharp as a two-edged sword: [Hebr. A sword of mouths: that is, that hath two mouths. Meaning a two-edged sword, or a sword that cutteth on both sides. So Psa 149:6. Heb 4:12.]"}],"5":[{"catchword":null,"tekst":"Her feet go down to death: her steps take hold on hell. [That is, tend thither, so that they shall not in any wise escape it. See of the signification of the word hell, Gen.37.on verse 35. By death, and hell is in this place meant not onely temporal death, and the visible grave, but also eternal death, and hell it self, even the place of the damned.]"}],"6":[{"catchword":null,"tekst":"Lest thou shouldest ponder the path of life, [That is, the path which leadeth unto true life. See above cha.2.on verse 19.] her goings [Hebr. Footsteps; that is, her words and works] are unstable [or, move to and fro, hither et thither, are wavering; that is, straying, uncertain, driven with all winds, now cleaving to this, anon to that man, and that for to deceive and seduce him] (that) thou perceives it not. [the Hebrew word rendered here perceivest, is often so taken. See Job 5.on verse 24. Or, (that) thou art not aware of it, or, discernest it not: to wit, that her goings stray from the path of life, and lead a man unto death. The meaning of the whole verse is this, Lest thou come to consider with thyself, whether a man can keep her company, and yet notwithstanding keep the way of life, know of a certain, that her goings and the manner of her actings, are so unstable, mutable, and straying, in using all manner of craft and subtility to deceive and seduce thee, that thou shalt not be able to perceive it, and consequently shalt be caught by her in the net of destruction.]"}],"7":[{"catchword":null,"tekst":"Now then, ye children, hearken unto me; and depart not from the sayings of my mouth."}],"8":[{"catchword":null,"tekst":"Make thy way far from her, and come not nigh the door of her house. [That is, have no fellowship with her, and beware of coming nigh her.]"}],"9":[{"catchword":null,"tekst":"Lest thou give [To wit, as a prey, and booty, to be deprived of it] thine honour [that is, thy youth, strength, means, good name, and souls prosperity. Understand hereunder also the children which the whoremonger getteth by the whore: for they for the most part abide in the house of the adulteress, or of her that breaketh wedlock] unto others; [to wit, unto the adulteress, and her husband] and years [to wit, thy youthful years, and the best time of thy life] unto the cruel. [meaning the whores company, and the whores husband, who shall cruelly persecute thee, and deliver thee over unto the Magistrate. Compare below chap.6.34, 35.]"}],"10":[{"catchword":null,"tekst":"Lest strangers [Meaning not onely the adulteress, and her husband, but also all ruffians, panders and panderesses, and all the adulterous crew, that reap any profit or gain by such unclean and filthy acts] satisfy themselves with thy wealth; [that is, with thy temporal means, or estate. So Hos 7:9.] and all thy painful labour [that is, all that thou hast gotten or gained by thy labour, joined with pain, and trouble. Compare below chap.14.23. and Isa 58:3.] (come) into the house of one unknown: [Or, of an alien, foreigner, outlandish person: so below verse 20.]"}],"11":[{"catchword":null,"tekst":"And thou roar [Or, cry, bawl. The Hebrew word signifieth properly the noise, and roaring, that beasts, and especially lions make, when they are in any danger or distress, although they are not sensible, from whence it cometh. Compare Psa 32:3. Isa 5:29,30. Eze 24:2.] at the last, when thy flesh, and thy body is consumed."}],"12":[{"catchword":null,"tekst":"And say, how have I hated discipline? And mine heart despised reproof?"}],"13":[{"catchword":null,"tekst":"And have not hearkened to the voice of my instructors; nor inclined mine ear unto my teachers?"}],"14":[{"catchword":null,"tekst":"I was almost in all evil, [Heb. I was almost, or, within a little in all evil: to wit, the evil of punishment, see Gen.19.on vers.19. Or, understand withal, the evil of sin, of which see Job 20:12.] in the midst of the Congregation, and of the assembly. [that is, publicly before the Church of God, and all the world.]"}],"15":[{"catchword":null,"tekst":"Drink water out of thine (own) cistern, and floods [Or, streams] out of the midst of thine (own) well. [this is a figurative description, from the beginning prosperity, and quietness of mind of those, who live purely and chastely in the holy state of wedlock, according to the ordinance of God. The meaning is, that every one ought to delight onely in his own lawful yoak-fellow in all honesty and sobriety, as followeth, verse 18,19. Others have understood this of the lawful possession and use of temporal goods or riches, and of the liberality and mercifulness, that we ought to shew therewith unto the poor and needy.]"}],"16":[{"catchword":null,"tekst":"Let thy fountains [Meaning thy children, that issue from thee as from a fountain. Compare Isa 51:1.] spread themselves, abroad, (and) the water-brooks [See Psalm 1.on verse 3.] in the streets. [the meaning is, that every one ought to bring up his children honestly, that they may not onely be a grace and a credit to their family, but also in their places according to their abilities, be useful and serviceable unto others.]"}],"17":[{"catchword":null,"tekst":"Let them be onely thine (own) and not a strangers with thee. [To wit, they taking and acknowledging thee onely to be their father, and thou them to be thy children: which cannot be done among those children that are born of an adulteress.]"}],"18":[{"catchword":null,"tekst":"Let thy fountain [That is, thy lawful wife, from whom thy children do proceed and issue, as from a springing Fountain] be blessed, and rejoice because of the wife of thy youth;"}],"19":[{"catchword":null,"tekst":"A very loving hind [Hebr. Hind of loves. Of this mention is made here, because she is most dearly and intimately beloved of the hart, as some do write] and a pleasant wild goat: [Hebr. Roe of pleasantness] let her breasts at all times make thee drunk; [or, moisten, drench, refresh thee; that is, fill thee with joy and pleasure. Compare below chap.7.18.] err continually in her love. [that is, recreate thy self with her, as a man useth to recreate and delight himself in the thing that is lawful, and so to forget himself in it, that he not once regardeth the thing that is unlawful.]"}],"20":[{"catchword":null,"tekst":"And why shouldest thou, my son, erre in a strange (woman), [That is, in the love of a strange (woman)] and embrace the bosom of the unknown (woman?) [Or, foreign, outlandish (woman)]"}],"21":[{"catchword":null,"tekst":"For the wars of every one [Or, of a man] are before the eyes of the LORD: and he pondereth all his goings. [Hebr. Weigheth, or, pondereth all his steps; that is, he trieth as with a plummet every ones ways, whether they be right or crooked, knowing fully all the commissions and omissions of men. Compare 2 Chron.16.9. Job 31:5. and 34.21. Pro 15:3. Jer 16:17. and 32.19.]"}],"22":[{"catchword":null,"tekst":"His (own) iniquities shall take the wicked (himself); and he s // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
