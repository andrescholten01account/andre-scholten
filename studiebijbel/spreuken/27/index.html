:"Een verzadigde ziel vertrapt de honingraat; maar voor een hongerige ziel is alles wat bitter is, zoet.","8":"Zoals een vogel is, die uit zijn nest omdoolt, zo is een man, die omdoolt uit zijn woonplaats.","9":"Olie en reukwerk verblijden het hart; zo doet de zoetheid van iemands vriend, vanwege hartelijke raad.","10":"Verlaat uw vriend, en ook de vriend van uw vader niet; en ga op de dag van uw tegenspoed niet naar het huis van uw broer. Beter is een buur die dichtbij is, dan een broer die ver weg is.","11":"Wees wijs, mijn zoon, en verblijd mijn hart; opdat ik hem die mij smaadt, iets te antwoorden heb.","12":"De schrandere ziet het kwaad, en verbergt zich; de eenvoudigen gaan door, en worden gestraft.","13":"Als iemand voor een vreemde borg is geworden, neem zijn kleed, en neem pand van hem voor een onbekende vrouw.","14":"Wie zijn vriend zegent met luide stem, terwijl hij zich 's morgens vroeg opmaakt, het zal hem tot een vloek gerekend worden.","15":"Een aanhoudend druppelen op een dag van slagregen en een twistzieke huisvrouw zijn precies gelijk.","16":"Ieder die haar verbergt, zou de wind verbergen, en de olie van zijn rechterhand, die zich verraadt.","17":"IJzer scherpt men met ijzer; zo scherpt een man het gezicht van zijn naaste.","18":"Wie de vijgenboom bewaakt, zal zijn vrucht eten; en wie zijn heer waarneemt, zal geëerd worden.","19":"Zoals in het water het gezicht tegenover het gezicht is, zo is het hart van de mens tegenover de mens.","20":"Het dodenrijk en het verderf worden niet verzadigd; zo worden de ogen van de mens niet verzadigd.","21":"De smeltkroes is voor het zilver, en de oven voor het goud; zo wordt een man beproefd naar zijn lof.","22":"Al stampte u de dwaas in een vijzel met een stamper, midden tussen het gestoten graan, zijn dwaasheid zou niet van hem wijken.","23":"Wees ijverig om het gezicht van uw schapen te kennen; richt uw hart op de kudden.","24":"Want de schat is niet voor eeuwig; of zal de kroon van geslacht tot geslacht zijn?","25":"Als het gras zich vertoont, en de grasscheuten gezien worden, laat de kruiden van de bergen verzameld worden.","26":"De lammeren zullen dienen tot uw kleding, en de bokken de prijs van het veld.","27":"Daarbij zult u genoeg geitenmelk hebben tot uw voedsel, tot voedsel van uw huis, en levensonderhoud van uw dienstmeisjes."},"SV":{"1":"Beroem u niet over den dag van morgen; want gij weet niet, wat de dag zal baren.","2":"Laat u een vreemde prijzen, en niet uw mond; een onbekende, en niet uw lippen.","3":"Een steen is zwaar, en het zand gewichtig; maar de toornigheid des dwazen is zwaarder dan die beide.","4":"Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor nijdigheid bestaan?","5":"Openbare bestraffing is beter dan verborgene liefde.","6":"De wonden des liefhebbers zijn getrouw; maar de kussingen des haters zijn af te bidden.","7":"Een verzadigde ziel vertreedt het honigzeem; maar aan een hongerige ziel is alle bitter zoet.","8":"Gelijk een vogel is, die uit zijn nest omdoolt, alzo is een man, die omdoolt uit zijn plaats.","9":"Olie en reukwerk verblijdt het hart; alzo is de zoetigheid van iemands vriend, vanwege den raad der ziel.","10":"Verlaat uw vriend, noch den vriend uws vaders niet; en ga ten huize uws broeders niet op den dag van uw tegenspoed. Beter is een gebuur die nabij is, dan een broeder, die verre is.","11":"Zijt wijs, mijn zoon, en verblijd mijn hart; opdat ik mijn smader wat te antwoorden heb.","12":"De kloekzinnige ziet het kwaad, *en* verbergt zich; de slechten gaan henen door, *en* worden gestraft.","13":"Als *iemand* voor een vreemde borg geworden is, neem zijn kleed, en pand hem voor een onbekende *vrouw*.","14":"Die zijn vriend zegent met luider stem, zich des morgens vroeg opmakende, het zal hem tot een vloek gerekend worden.","15":"Een gedurige druiping ten dage des slagregens en een kijfachtige huisvrouw zijn even gelijk.","16":"Elkeen, die haar verbergt, zou den wind verbergen, en de olie zijner rechterhand, *die* roept.","17":"Ijzer scherpt men met ijzer; alzo scherpt een man het aangezicht zijns naasten.","18":"Die den vijgeboom bewaart, zal zijn vrucht eten; en die zijn heer waarneemt, zal geëerd worden.","19":"Gelijk *in* *het* water het aangezicht is tegen het aangezicht, alzo is des mensen hart tegen den mens.","20":"De hel en het verderf worden niet verzadigd; alzo worden de ogen des mensen niet verzadigd.","21":"De smeltkroes is voor het zilver, en de oven voor het goud; alzo is een man naar zijn lof *te* *proeven*.","22":"Al stiet gij den dwaas in een mortier met een stamper, in het midden van het gestoten graan, zijn dwaasheid zou van hem niet afwijken.","23":"Zijt naarstig, om het aangezicht uwer schapen te kennen; zet uw hart op de kudden.","24":"Want de schat is niet tot in eeuwigheid; of zal de kroon van geslacht tot geslacht zijn?","25":"Als het gras zich openbaart, en de grasscheuten gezien worden, laat de kruiden der bergen verzameld worden.","26":"De lammeren zullen zijn tot uw kleding, en de bokken de prijs des velds.","27":"Daartoe zult gij genoegzaamheid van geitenmelk *hebben* tot uw spijze, tot spijze van uw huis, en leeftocht uwer maagden."},"KJV":{"1":"Boast not thyself of to morrow; for thou knowest not what a day may bring forth.","2":"Let another man praise thee, and not thine own mouth; a stranger, and not thine own lips.","3":"A stone *is* heavy, and the sand weighty; but a fool's wrath *is* heavier than them both.","4":"Wrath *is* cruel, and anger *is* outrageous; but who *is* able to stand before envy?","5":"Open rebuke *is* better than secret love.","6":"Faithful *are* the wounds of a friend; but the kisses of an enemy *are* deceitful.","7":"The full soul loatheth an honeycomb; but to the hungry soul every bitter thing is sweet.","8":"As a bird that wandereth from her nest, so *is* a man that wandereth from his place.","9":"Ointment and perfume rejoice the heart: so *doth* the sweetness of a man's friend by hearty counsel.","10":"Thine own friend, and thy father's friend, forsake not; neither go into thy brother's house in the day of thy calamity: *for* better *is* a neighbour *that is* near than a brother far off.","11":"My son, be wise, and make my heart glad, that I may answer him that reproacheth","12":"A prudent *man* foreseeth the evil, *and* hideth himself; *but* the simple pass on, *and* are punished.","13":"Take his garment that is surety for a stranger, and take a pledge of him for a strange woman.","14":"He that blesseth his friend with a loud voice, rising early in the morning, it shall be counted a curse","15":"A continual dropping in a very rainy day and a contentious woman are alike.","16":"Whosoever hideth her hideth the wind, and the ointment of his right hand, *which* bewrayeth","17":"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.","18":"Whoso keepeth the fig tree shall eat the fruit thereof: so he that waiteth on his master shall be honoured.","19":"As in water face *answereth* to face, so the heart of man to man.","20":"Hell and destruction are never full; so the eyes of man are never satisfied.","21":"*As* the fining pot for silver, and the furnace for gold; so *is* a man to his praise.","22":"Though thou shouldest bray a fool in a mortar among wheat with a pestle, *yet* will not his foolishness depart","23":"Be thou diligent to know the state of thy flocks, *and* look well to thy herds.","24":"For riches *are* not for ever: and doth the crown *endure* to every generation?","25":"The hay appeareth, and the tender grass sheweth itself, and herbs of the mountains are gathered.","26":"The lambs *are* for thy clothing, and the goats *are* the price of the field.","27":"And *thou shalt have* goats' milk enough for thy food, for the food of thy household, and *for* the maintenance for thy maidens."}},"tsk":{"1":[{"kopje":"Beroem","refs":["Ps 95:7","Jes 56:12","Luk 12:19","Luk 12:20","2 Kor 6:2","Jak 4:13-16"]},{"kopje":"u","refs":["1 Sam 28:19"]}],"3":[{"kopje":" "wl wl-kjv\" data-code=\"H6310\">to</span> his praise.","22":"Though thou shouldest <span class=\"wl wl-kjv\" data-code=\"H3806\">bray</span> a <span class=\"wl wl-kjv\" data-code=\"H191\">fool</span> in a <span class=\"wl wl-kjv\" data-code=\"H4388\">mortar</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> <span class=\"wl wl-kjv\" data-code=\"H7383\">wheat</span> with a <span class=\"wl wl-kjv\" data-code=\"H5940\">pestle,</span> yet will not his <span class=\"wl wl-kjv\" data-code=\"H200\">foolishness</span> depart","23":"Be thou <span class=\"wl wl-kjv\" data-code=\"H3045\">diligent</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">state</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H7896\">look</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">well</span> to thy herds.","24":"For <span class=\"wl wl-kjv\" data-code=\"H2633\">riches</span> are not for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> and doth the <span class=\"wl wl-kjv\" data-code=\"H5145\">crown</span> endure to <span class=\"wl wl-kjv\" data-code=\"H1755\">every</span> generation?","25":"The <span class=\"wl wl-kjv\" data-code=\"H2682\">hay</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">appeareth,</span> and the tender <span class=\"wl wl-kjv\" data-code=\"H1877\">grass</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">sheweth</span> itself, and <span class=\"wl wl-kjv\" data-code=\"H6212\">herbs</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> are gathered.","26":"The <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> are for thy <span class=\"wl wl-kjv\" data-code=\"H3830\">clothing,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6260\">goats</span> are the <span class=\"wl wl-kjv\" data-code=\"H4242\">price</span> of the field.","27":"And thou shalt have <span class=\"wl wl-kjv\" data-code=\"H5795\">goats'</span> <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">enough</span> for thy <span class=\"wl wl-kjv\" data-code=\"H3899\">food,</span> for the <span class=\"wl wl-kjv\" data-code=\"H3899\">food</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H2416\">maintenance</span> for thy maidens."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de dag","tekst":"Te weten, niet alleen de dag van morgen, maar ook niet van alle toekomende; gelijk zelfs met het overige van den huidigen dag."},{"catchword":"baren","tekst":"Dat is, tevoorschijn brengen, waardoor hetgeen gij in het toekomende voorneemt, of wacht, zou mogen verhinderd worden. Vergelijk Jam 4:13-14 , enz."}],"3":[{"catchword":"zwaarder","tekst":"Dat is, onverdragelijker, te weten niet alleen omdat zij onbillijk en onrechtvaardig is, maar ook onmatig, ongetoomd en met wreedheid verenigd. Zie vs.4. Hebreeuws, daar is zwaarte van steen en gewicht van het zand."}],"4":[{"catchword":"overloping","tekst":"Te weten als de mens met zijn onstuimige en woedende gemoedsbewegingen niet anders dan als een vloed, zich geweldiglijk uitstort."},{"catchword":"wreedheid;","tekst":"Dat is, brengt wrede daden en werken voort."},{"catchword":"maar wie zal","tekst":"De zin is dat nijdigheid erger is dan toorn en grimmigheid, omdat zij dieper in het hart is, en ene verharding der boosheid daarmede vermengd is."}],"5":[{"catchword":"beter","tekst":"Dat is, heilzamer en meer te begeren."},{"catchword":"verborgene liefde","tekst":"Te weten, waardoor iemand zijnen naaste wel gunstig is en alle goed toewenst, maar evenwel hem, als het nodig is, niet bestraft om alzo zijn trouwe liefde te bewijzen."}],"6":[{"catchword":"wonden","tekst":"Dat is, berispingen, die met ernstige en harde woorden gedaan zijnde, als een wond in de ziel geven."},{"catchword":"getrouw;","tekst":"Dat is, zij komen voort uit een trouwe en gestadige liefde en dienen tot het welvaren en de behoudenis dergenen die ze krijgt. Vergelijk Psa 141:5 ."},{"catchword":"kussingen","tekst":"Versta, allerlei geveinsd bewijs van liefde."},{"catchword":"zijn af te bidden","tekst":"Dat is, men moet door ijverige en gedurige gebeden van God begeren dat Hij ons die niet late bejegenen, zowel omdat zij uit een vals hart voortkomen. Anders: veelvoudig."}],"7":[{"catchword":"ziel","tekst":"Dat is, een mens, of persoon. Alzo in het volgende. Zie Gen 12:5 , en de aantekening. Of versta, den lust, dien de mens tot de spijs heeft; gelijk Eze 7:19 ; zie de aantekening."},{"catchword":"vertreedt","tekst":"Dat is, veracht, heeft een aftrek, afkeer en walg daarvan."},{"catchword":"het honigzeem;","tekst":"Versta onder dezen naam alle aangename, lekkere en heerlijke spijs. Vergelijk boven Pro 24:13 ."}],"8":[{"catchword":"is, die","tekst":"Te weten, veel gevaar onderworpen en in gedurige onrust, totdat hij een nieuw nest heeft, hetwelk hij dikwijls kwalijk maken of bekomen kan."},{"catchword":"die omdoolt","tekst":"Te weten, lichtvaardiglijk, zonder nood en wettelijke beroeping."}],"9":[{"catchword":"Olie","tekst":"Vergelijk boven Pro 21:17 ."},{"catchword":"zoetheid","tekst":"Dat is, zijne vriendelijkheid, behulpzaamheid en lieflijke aanspraak."},{"catchword":"vanwege","tekst":"Dat is, uit oorzaak van den goeden raad, dien hij hem geeft voor zijne ziel, of die uit het goede hart van den vriend voortkomt. Anders: meer dan de raad zijner eigen ziel."}],"10":[{"catchword":"ga","tekst":"De reden is, omdat een vriend altijd liefheeft, boven Pro 17:17 , en bijzonder in den nood; maar tussen de broeders is dikwijls onenigheid, boven Pro 18:19 , voornamelijk in tegenspoed, boven Pro 19:7 ; daarom heeft een vriend veelmalen vastere liefde dan een broeder; boven Pro 18:24 . Sommigen verstaan het alzo, dat men een getrouwen nabuur moet in waarde houden, omdat hij nabij is, daar een broeder ver van de (function bouwHfdnav() {

  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

function bouwRijen() {

    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
