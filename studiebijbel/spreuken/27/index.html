 van Ahasveros waren, namelijk het volk van Mordechai, uit te roeien.", "Ps 22:7": "Maar ik ben een worm en geen man, een smaad van mensen, en veracht van het volk.", "1 Sam 23:17": "En hij zei tegen hem: Wees niet bang, want de hand van Saul, mijn vader, zal u niet vinden, maar u zult koning worden over Israël, en ik zal de tweede zijn na u; ook mijn vader Saul weet dat wel.", "Spr 26:4": "Antwoord de dwaas niet naar zijn dwaasheid, opdat u ook niet aan hem gelijk wordt.", "Jer 6:7": "Zoals een bornput zijn water opgeeft, zo geeft zij haar boosheid op; geweld en verstoring wordt in haar gehoord, weedom en plaging is voortdurend voor Mijn aangezicht.", "2 Tim 2:9-13": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden. Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid. Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven;", "Gen 26:14": "En hij had bezit aan schapen, en bezit aan runderen, en een groot gezin; zodat de Filistijnen hem benijdden.", "Job 6:7": "Mijn ziel weigert uw woorden aan te roeren; die zijn als mijn laffe voedsel.", "Ps 90:9": "Want al onze dagen gaan henen door Uw verbolgenheid; wij brengen onze jaren door als een gedachte.", "Ex 22:5": "Wanneer iemand een veld of een wijngaard laat afgrazen en hij zijn dier daarin drijft, zodat het in het veld van een ander weidt, moet hij het van het beste van zijn eigen veld en het beste van zijn eigen wijngaard teruggeven.", "Spr 23:30": "Bij hen die bij de wijn blijven hangen; bij hen die komen om gemengde drank op te zoeken.", "Job 37:19": "Onderricht ons, wat wij Hem zeggen zullen; want wij zullen niets ordentelijk kunnen voorstellen vanwege de duisternis.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Hebr 3:13": "Maar vermaan elkaar elke dag, zolang het heden genoemd wordt, opdat niemand van u verhard wordt door de misleiding van de zonde.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Spr 21:9": "Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.", "Pred 8:15-17": "Daarom prees ik de blijdschap, omdat de mens niets beters heeft onder de zon, dan te eten, en te drinken, en blijde te zijn; want dat zal hem bijblijven van zijn arbeid, de dagen van zijn leven, die God hem geeft onder de zon. Toen ik mijn hart erop richtte om wijsheid te kennen, en om de bezigheid te zien die op de aarde gebeurt, dat men zelfs overdag of 's nachts geen slaap ziet met zijn ogen; toen zag ik al het werk van God, dat de mens niet kan doorgronden, het werk dat onder de zon gebeurt, waarnaar een mens zoekt met inspanning, maar hij zal het niet doorgronden; ja, zelfs al zou een wijze zeggen dat hij het zou kennen, dan nog zal hij het niet kunnen doorgronden.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jes 63:19": "Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "Spr 23:26": "Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen behartigen.", "Gen 44:32": "Want uw knecht is borg gebleven voor deze jongen bij mijn vader, en zei: Als ik hem niet bij u terugbreng, zal ik alle dagen tegen mijn vader gezondigd hebben!", "Job 13:4": "Want zeker, u bent leugensmeders; u bent allemaal artsen van niets.", "Spr 10:10": "Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.", "Lev 6:2-7": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "Spr 6:12-14": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Jer 2:22-25": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE. Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait! Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Ef 6:5-9": "U dienstknechten, wees gehoorzaam aan uw heren naar het vlees, met vrees en beven, in eenvoud van uw hart, zoals aan Christus; niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte; terwijl u dient met goedwilligheid de Heere, en niet de mensen;", "1 Sam 24:14": "Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.", "Ps 49:17-19": "Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt; want hij zal bij zijn sterven niets meenemen, zijn eer zal hem niet achterna dalen. Hoewel hij zijn ziel in zijn leven zegent, en zij u loven, omdat u uzelf goed doet;", "Spr 15:9": "De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.", "Jes 59:12": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;", "Ps 144:8": "wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "Neh 6:11-13": "Maar ik zei: Zou een man als ik vluchten? En wie zou, in mijn positie, de tempel ingaan om zijn leven te redden? Ik ga er niet in. Want ik merkte dat God hem niet gestuurd had; hij had deze profetie tegen mij uitgesproken, omdat Tobia en Sanballat hem gehuurd hadden. Daarom was hij gehuurd, opdat ik bang zou worden en zo zou handelen en zondigen, zodat zij iets zouden hebben voor een kwaad gerucht, om mij te honen.", "1 Tim 3:4": "iemand die zijn eigen huis goed bestuurt en zijn kinderen in onderdanigheid houdt, met alle waardigheid;", "Job 4:19-21": "Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot. Van de morgen tot de avond worden zij vermorzeld; zonder dat men er acht op slaat, vergaan zij voor eeuwig. Verdwijnt hun uitnemendheid niet met hen? Zij sterven, maar niet in wijsheid.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Gen 2:21-24": "Toen deed de HEERE God een diepe slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot de plaats daarvan toe met vlees. En de HEERE God bouwde de rib, die Hij van Adam genomen had, tot een vrouw, en Hij bracht haar bij Adam. Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Spr 12:1": "Wie de tucht liefheeft, heeft de wetenschap lief; maar wie de bestraffing haat, is redeloos.", "Spr 13:11": "Goed, dat door ijdelheid gekomen is, zal verminderd worden; maar die met de hand verzamelt, zal het vermeerderen.", "Pred 8:2": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God.", "Spr 25:26": "De rechtvaardige, wankelend voor het aangezicht van de goddeloze, is een beroerde bron, en een verdorven springader.", "2 Sam 20:9": "En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen.", "Job 19:15": "Mijn huisgenoten en mijn dienstmaagden achten mij als een vreemde; een buitenlander ben ik in hun ogen.", "Ps 50:17-20": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit. Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers. Uw mond zet u in voor het kwade, en uw tong koppelt bedrog.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Luk 9:57-62": "En het gebeurde onderweg, terwijl zij reisden, dat iemand tegen Hem zei: Heere, ik zal U volgen waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels onder de hemel nesten; maar de Zoon des mensen heeft geen plaats om het hoofd neer te leggen. En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven.", "Rom 14:21": "Het is goed geen vlees te eten, en geen wijn te drinken, en niets waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Ps 53:2-6": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet. God heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Een ieder van hen is teruggekeerd, samen zijn zij stinkend geworden, er is niemand die goed doet, ook niet één.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Spr 15:23": "Een man heeft blijdschap in het antwoord van zijn mond; en hoe goed is een woord op zijn tijd!", "Spr 26:20": "Als er geen hout is, gaat het vuur uit; en als er geen roddelaar is, wordt het gekijf gestild.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Ps 123:2": "Zie, zoals de ogen van de knechten zijn op de hand van hun heren, zoals de ogen van de dienstmaagd zijn op de hand van haar meesteres, zo zijn onze ogen op de HEERE, onze God, totdat Hij ons genadig is.", "Jes 59:13": "het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.", "Spr 8:5": "Gij eenvoudigen! versta kloekzinnigheid, en gij dwazen! versta met het hart.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Spr 5:1": "Mijn zoon! Let op mijn wijsheid, neig uw oor tot mijn verstand;", "Gen 49:3": "Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Luk 11:11-13": "En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven? Of ook, als hij om een ei zou vragen, zal hij hem een schorpioen geven? Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Matt 18:15-17": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "1 Sam 18:7": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "2 Kor 12:4": "dat hij opgetrokken is geweest in het paradijs, en onuitsprekelijke woorden gehoord heeft, die het een mens niet geoorloofd is te spreken.", "Matt 8:19-22": "En er kwam een schriftgeleerde naar Hem toe, die tegen Hem zei: Meester, ik zal U volgen, waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels van de hemel nesten; maar de Zoon des mensen heeft niets waar Hij het hoofd kan neerleggen. En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "Spr 11:15": "Als iemand voor een vreemde borg geworden is, zal hij zeker daarvoor lijden; maar wie ervoor terugdeinst om vast toe te slaan, is zeker van zichzelf.", "Job 31:24": "Als ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: U bent mijn vertrouwen;", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "Ps 144:3": "O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?", "1 Kor 3:4": "Want als de een zegt: Ik ben van Paulus; en een ander: Ik ben van Apollos; bent u niet vleselijk?", "Spr 6:2": "dan bent u verstrikt door de woorden van uw mond, dan bent u gevangen door de woorden van uw mond.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Luk 12:58": "Want als u met uw tegenpartij naar de overheid gaat, doe dan onderweg moeite om van hem verlost te worden; anders zou hij u misschien voor de rechter slepen, en de rechter zou u aan de gerechtsdienaar overleveren, en de gerechtsdienaar zou u in de gevangenis werpen.", "Job 18:2-4": "Hoe lang duurt het nog voordat u een einde maakt aan uw woorden? Let op, en daarna zullen wij spreken. Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen? O u, die uw ziel verscheurt door uw toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots weggenomen worden uit haar plaats?", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Luk 17:33": "Wie zijn leven zal zoeken te behouden, zal het verliezen; en wie het zal verliezen, zal het in het leven behouden.", "Rom 14:19": "Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "1 Kor 8:8-13": "Het voedsel nu maakt ons bij God niet aangenaam; want of wij eten, wij hebben er geen voordeel van; en of wij niet eten, wij hebben er geen nadeel van. Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn. Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn?", "Spr 22:16": "Wie de arme verdrukt om zijn eigen bezit te vermeerderen, en wie aan de rijke geeft, komt zeker tot gebrek.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Spr 21:5": "De gedachten van de vlijtige zijn alleen tot overschot; maar van ieder die haastig is, alleen tot gebrek.", "Joz 1:18": "Elke man die uw mond opstandig zal zijn, en uw woorden niet horen zal in alles wat u hem gebieden zult, die zal gedood worden; wees alleen sterk en heb goede moed!", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Matt 24:46": "Gelukkig is die dienstknecht die zijn heer, als hij komt, zo bezig zal vinden.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Ezech 18:7": "En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "1 Sam 23:16": "Toen maakte Jonathan, de zoon van Saul, zich op, en ging naar David in het woud, en hij bemoedigde hem in God.", "Pred 5:5": "Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ef 6:4": "En u vaders, verwek uw kinderen niet tot toorn, maar voed hen op in de lering en vermaning van de Heere.", "1 Kor 2:1-3": "En ik, broeders, toen ik bij u kwam, kwam niet met voortreffelijkheid van woorden of van wijsheid, terwijl ik u de getuigenis van God verkondigde. Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd. En ik was bij u in zwakheid, en in vrees, en in veel beven.", "Ps 49:14": "Deze weg van hen is een dwaasheid van hen; toch hebben hun nakomelingen welbehagen in hun woorden. Sela.", "Pred 6:11": "Voorwaar, er zijn veel dingen die de ijdelheid vermeerderen; wat heeft de mens daar meer aan?", "Spr 24:1-34": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn. Want hun hart bedenkt verwoesting, en hun lippen spreken over moeite. Door wijsheid wordt een huis gebouwd, en door verstandigheid bevestigd;", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Jes 41:8-10": "Maar u, Israël, Mijn knecht! U, Jakob, die Ik uitgekozen heb! Het nageslacht van Abraham, die Mij liefheeft! U, die Ik gegrepen heb van de einden van de aarde, en uit haar voornaamste mannen geroepen heb; en tegen wie Ik zei: U bent Mijn knecht; u heb Ik uitverkoren, en Ik heb u niet verworpen. Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Luk 14:28-32": "Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken? Anders zou het kunnen gebeuren dat, als hij het fundament gelegd heeft en het niet kan afmaken, iedereen die het ziet hem begint te bespotten, en zegt: Deze man is begonnen te bouwen, en heeft het niet kunnen afmaken.", "Matt 7:6": "Geef het heilige niet aan de honden, en gooi uw parels niet voor de zwijnen; anders vertrappen ze die met hun poten, en verscheuren u nadat ze zich hebben omgekeerd.", "1 Sam 18:30": "Als de vorsten van de Filistijnen uittrokken, gebeurde het, zo dikwijls als zij uittrokken, dat David verstandiger was dan al de knechten van Saul; zodat zijn naam zeer geacht werd.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Ps 106:12": "Toen geloofden zij Zijn woorden; zij zongen Zijn lof.", "Micha 3:1": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten?", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Spr 19:7": "Al de broeders van de arme haten hem; hoeveel te meer gaan zijn vrienden ver van hem weg! Hij loopt hen achterna met woorden, die niets zijn.", "2 Sam 19:28": "Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?", "Ps 94:3-8": "Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen? Uitgieten? Hard spreken? Zullen alle werkers van de ongerechtigheid zich beroemen? O HEERE! Zij verbrijzelen Uw volk, en zij verdrukken Uw erfdeel.", "Ex 20:10": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Deut 23:24": "Wanneer u in de wijngaard van uw naaste komt, dan mag u druiven eten naar uw lust, tot verzadiging; maar in uw vat zult u er niets van doen.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Spr 24:21": "Mijn zoon! vrees de HEERE en de koning; vermeng u niet met hen, die naar verandering staan;", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Hand 1:7": "En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Job 35:7": "Als u rechtvaardig bent, wat geeft u Hem, of wat ontvangt Hij uit uw hand?", "Num 16:3": "En zij verzamelden zich tegen Mozes en tegen Aäron, en zeiden tegen hen: Het is te veel voor u, want deze hele vergadering, zij allen, zijn heilig, en de HEERE is in hun midden; waarom verheft u zich dan boven de gemeente van de HEERE?", "1 Sam 22:18": "Toen zei de koning tegen Doeg: Wend u om, en val de priesters aan. Toen wendde Doeg, de Edomiet, zich om, en hij viel de priesters aan, en doodde op die dag vijfentachtig mannen die de linnen priesterrok droegen.", "Joz 2:24": "En zij zeiden tegen Jozua: Zeker, de HEERE heeft dat hele land in onze handen gegeven; want ook alle inwoners van het land zijn voor ons vergaan van angst.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Job 26:6": "Het dodenrijk is naakt voor Hem, en geen bedekking is er voor het verderf.", "Deut 5:14": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Spr 6:1": "Mijn zoon! Als u voor uw naaste borg geworden bent, voor een vreemde uw hand toegeklapt hebt;", "Mark 9:33-37": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Hand 17:5": "Maar de Joden die ongehoorzaam waren, werden hierdoor jaloers, en namen enkele slechte mannen uit het gespuis van de markt tot zich, en zorgden dat er een volksoploop kwam en brachten de stad in opschudding; en zij vielen het huis van Jason aan en probeerden hen naar het volk te brengen.", "Ex 10:2": "En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.", "Job 4:4": "uw woorden hebben de struikelende opgericht, en de knieën die knikten hebt u vastgesteld;", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Spr 13:8": "Het rantsoen van ieders ziel is zijn rijkdom; maar de arme hoort het schelden niet.", "Joh 12:25": "Wie zijn leven liefheeft, zal het verliezen; en wie zijn leven haat in deze wereld, zal het bewaren tot het eeuwige leven.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Job 13:19": "Wie is hij die met mij twist? Want als ik nu zweeg, zou ik de geest geven.", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "Job 35:2": "Houdt u dat voor recht, dat u gezegd hebt: Mijn gerechtigheid is meer dan die van God?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Spr 7:27": "Haar huis, dat zijn wegen naar het graf, dalend naar de binnenkamers van de dood.", "Spr 16:14": "De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.", "Jak 5:9": "Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Spr 13:23": "Het ploegen van de armen geeft overvloed van voedsel; maar er is iemand die verteerd wordt door gebrek aan oordeel.", "Jes 50:9": "Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Spr 5:5": "Haar voeten dalen af naar de dood, haar treden houden het graf vast.", "Jes 15:6": "Want de wateren van Nimrim zullen enkel verwoesting zijn; want het gras is verdord, het tedere gras is vergaan, er is geen groen meer.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Spr 11:16": "Een aangename vrouw houdt de eer vast, zoals sterke mannen de rijkdom vasthouden.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Zef 1:18": "Ook hun zilver, ook hun goud zal hen niet kunnen redden op de dag van de verbolgenheid van de HEERE; maar door het vuur van het ijver van Hem zal dit hele land verteerd worden; want Hij zal een voleinding maken, zeker, een haastige, met alle inwoners van dit land.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Matt 9:10-13": "En het gebeurde, toen Hij aan tafel lag in het huis van Mattheüs, zie, veel tollenaars en zondaars kwamen en gingen mee aan tafel, met Jezus en Zijn discipelen. En de Farizeeën zagen dit en zeiden tegen Zijn discipelen: Waarom eet uw Meester met de tollenaars en de zondaars? Maar Jezus hoorde dat en zei tegen hen: Wie gezond zijn hebben de dokter niet nodig, maar wie ziek zijn.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Spr 29:9": "Een wijs man, die met een dwaas man een geschil voert, wordt of boos of belachen, en toch komt er geen rust.", "Hand 10:7": "En toen de engel die tot Cornelius sprak, weggegaan was, riep hij twee van zijn huisknechten, en een godvruchtige soldaat van hen die voortdurend bij hem waren;", "Pred 7:26-28": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden. Zie, dit heb ik gevonden, zegt de prediker, het ene bij het andere, om de verklaring te vinden; Waar mijn ziel nog naar zoekt, maar ik heb haar niet gevonden: één man uit duizend heb ik gevonden; maar een vrouw onder die allen heb ik niet gevonden.", "Spr 8:32": "Nu dan, kinderen! hoor naar Mij; want gelukkig zijn zij die Mijn wegen bewaren.", "Lev 25:15": "Naar het getal van de jaren, vanaf het jubeljaar, zult u van uw naaste kopen, en naar het getal van de jaren van de opbrengsten zal hij het aan u verkopen.", "Hagg 2:15": "Toen antwoordde Haggai en zei: Zo is dit volk, en zo is deze natie voor Mijn aangezicht, spreekt de HEERE, en zo is al het werk van hun handen; en wat zij daar offeren, dat is onrein.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Job 4:3": "Zie, u hebt velen onderwezen, en u hebt slappe handen gesterkt;", "Spr 30:32": "Als u dwaas gehandeld hebt door uzelf te verheffen, en als u kwaad bedacht hebt: de hand op de mond!", "Lev 25:2-12": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u in het land gekomen zult zijn, dat Ik u geef, dan zal dat land rusten, een sabbat voor de HEERE. Zes jaar zult u uw akker bezaaien, en zes jaar uw wijngaard snoeien, en de opbrengst daarvan inzamelen. Maar in het zevende jaar zal voor het land een sabbat van rust zijn, een sabbat voor de HEERE; uw akker zult u niet bezaaien en uw wijngaard niet snoeien.", "Ps 35:13": "Mij aangaande daarentegen, toen zij ziek waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weer in mijn boezem.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Spr 7:5": "Opdat zij u bewaren voor een vreemde vrouw, voor de onbekende, die met haar woorden vleit.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Jona 2:2": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "Jer 5:26-28": "Want onder Mijn volk worden goddelozen gevonden; ieder van hen loert, zoals de vogelvanger zich schikt; zij zetten een verderfelijke strik, zij vangen de mensen. Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden. Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Joh 9:39-41": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden. En dit hoorden enkelen van de Farizeeën die bij Hem waren, en zij zeiden tegen Hem: Zijn wij dan ook blind? Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Ps 104:14": "Hij doet het gras uitspruiten voor de dieren, en het gewas tot dienst van de mens, zodat brood uit de aarde voortkomt.", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "Gen 16:6-8": "En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht. En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur. En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Job 31:6": "Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten.", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Pred 2:10": "En al wat mijn ogen begeerden, dat onthield ik hun niet; ik weerhield mijn hart niet van enige blijdschap, maar mijn hart was blij vanwege al mijn arbeid; en dit was mijn deel van al mijn arbeid.", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "Deut 23:25": "Wanneer u in het staande koren van uw naaste komt, dan mag u de aren met uw hand afplukken; maar de sikkel zult u niet gebruiken over het staande koren van uw naaste.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Spr 21:20": "In de woning van de wijze is een gewenste schat, en olie; maar een dwaas mens verslindt dat.", "Tit 1:6": "Als iemand onberispelijk is, de man van één vrouw, gelovige kinderen heeft, die niet te beschuldigen zijn van overdaad, of ongehoorzaam zijn.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Luk 12:35-48": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Rom 12:10": "Heb elkaar hartelijk lief met broederlijke liefde; in eerbetoon de een de ander voorgaand.", "Spr 6:34": "Want jaloezie is de woede van een man; en op de dag van de wraak zal hij niet sparen.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Hand 5:17": "En de hogepriester stond op, en allen die met hem waren (dat was de sekte van de Sadduceeën), en werden vervuld met nijd;", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "Job 11:4-6": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen. Maar zeker, och, of God sprak, en Zijn lippen tegen u opende; En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Pred 7:24": "Wat ver weg is, en zeer diep, wie zal dat vinden?", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "Kol 3:2": "Bedenk de dingen die boven zijn, niet die op de aarde zijn.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Job 13:12": "Uw spreuken zijn als as, uw verweer is als een verweer van leem.", "1 Tim 6:17-19": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Ef 5:12": "Want wat heimelijk door hen gebeurt, is ook schandelijk om te noemen.", "Kol 3:20": "Kinderen, wees uw ouders gehoorzaam in alles, want dat is de Heere welgevallig.", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "2 Tess 1:8": "Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "Pred 11:4": "Wie op de wind let, die zal niet zaaien, en wie op de wolken ziet, die zal niet maaien.", "Spr 14:18": "De onnozelen erven dwaasheid; maar de kloekzinnigen zullen zich met kennis kronen.", "Deut 13:6-9": "Wanneer uw broer, de zoon van uw moeder, of uw zoon, of uw dochter, of de vrouw van uw schoot, of uw vriend, die als uw eigen ziel is, u heimelijk zal aanporren, en zegt: Laat ons gaan, en andere goden dienen, die u niet gekend hebt, u noch uw vaders; van de goden van de volken die rondom u zijn, dichtbij u, of ver van u, van het ene einde van de aarde tot aan het andere einde van de aarde; dan zult u hem niet ter wille zijn, en niet naar hem horen; ook zal uw oog hem niet ontzien, en u zult zich niet ontfermen, hem ook niet verbergen;", "Luk 12:37": "Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Jer 8:6": "Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Jes 28:4": "En de verwelkende bloem van zijn heerlijke sieraad, die op het hoofd van de zeer vruchtbare vallei is, zal zijn als een vroegrijpe vrucht vóór de zomer, die, wanneer iemand ze ziet, terwijl zij nog in zijn hand is, hij opslokt.", "Gen 47:9": "En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Pred 11:10": "Doe dan de toorn wijken uit uw hart, en doe het kwade weg van uw lichaam, want de jeugd en de jonge jaren zijn vergankelijk.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Ezech 20:16": "Omdat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart ging hun drekgoden achterna.", "Job 11:8": "Zij is als de hoogten van de hemelen, wat kunt u doen? Dieper dan het graf, wat kunt u weten?", "Hoogl 4:10": "Hoe mooi is uw uitnemende liefde, Mijn zuster, o bruid! Hoeveel beter is uw uitnemende liefde dan wijn, en de geur van uw oliën dan alle specerijen!", "Klaagl 5:8": "Knechten heersen over ons; er is niemand die ons uit hun hand rukt.", "Ezech 12:28": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Geen van Mijn woorden zal meer worden uitgesteld; het woord dat Ik gesproken heb, dat zal gebeuren, spreekt de Heere HEERE.", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "1 Kon 22:13": "De bode nu, die heengegaan was om Micha te roepen, sprak tegen hem en zei: Zie toch, de woorden van de profeten zijn eensgezind goed voor de koning; laat toch uw woord zijn als het woord van één van hen, en spreek het goede.", "Spr 3:31": "Wees niet jaloers op een man van het geweld, en kies geen van zijn wegen.", "Job 29:24": "Lachte ik hun toe, zij geloofden het niet; en het licht van mijn aangezicht deden zij niet neervallen.", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Hand 17:23": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u.", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Spr 26:24-26": "Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart. Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Ex 21:17": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Matt 13:21": "Doch hij heeft geen wortel in zichzelf, maar houdt maar even stand; en als er verdrukking of vervolging komt om het woord, dan struikelt hij meteen.", "Luk 1:79": "om te verschijnen aan hen die gezeten zijn in duisternis en schaduw van de dood, om onze voeten te richten op de weg van de vrede.", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "Openb 3:16": "Zo dan, omdat u lauw bent, en noch koud noch heet, zal Ik u uit Mijn mond spuwen.", "Deut 9:4-6": "Wanneer de HEERE, uw God, hen nu voor uw aangezicht zal hebben uitgestoten, spreek dan niet in uw hart en zeg: De HEERE heeft mij om mijn gerechtigheid ingebracht, om dit land te erven; want om de goddeloosheid van deze volken verdrijft de HEERE hen voor uw aangezicht uit de bezitting. Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft. Weet dan, dat de HEERE, uw God, u niet om uw gerechtigheid dit goede land geeft om dat te erven; want u bent een hardnekkig volk.", "1 Petr 4:3": "Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "Luk 8:5-15": "Een zaaier ging uit om zijn zaad te zaaien; en terwijl hij zaaide, viel het ene deel langs de weg en werd vertrapt, en de vogels van de hemel aten het op. En het andere deel viel op een rots, en toen het opgekomen was, verdorde het, omdat het geen vocht had. En het andere deel viel midden tussen de dorens, en de dorens groeiden mee op en verstikten het.", "Spr 29:22": "Een toornig man verwekt ruzie; en de driftige is overvloedig in overtreding.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "1 Tess 2:11": "Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten,", "Jer 31:1": "In die tijd, spreekt de HEERE, zal Ik voor alle geslachten van Israël tot een God zijn; en zij zullen Mij tot een volk zijn.", "Ef 2:12": "dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld.", "Hos 13:12": "Efraïms ongerechtigheid is samengebonden, zijn zonde is opgeslagen.", "Ezech 13:17-23": "En u, mensenkind, zet uw gezicht tegen de dochters van uw volk, die profeteren uit hun eigen hart, en profeteer tegen hen; En zeg: Zo zegt de Heere HEERE: Wee over die vrouwen, die kussens naaien voor alle oksels van de armen, en hoofddeksels maken voor het hoofd van elke lengte, om de zielen te vangen! Zult u de zielen van Mijn volk vangen, en zult u voor uzelf de zielen in leven houden? En zult u Mij ontheiligen bij Mijn volk, voor handvollen gerst en voor stukken brood, om zielen te doden die niet zouden sterven, en om zielen in leven te houden die niet zouden leven, door uw liegen tegen Mijn volk, dat de leugen hoort?", "Spr 10:23": "Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid te plegen.", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "1 Kor 6:1-7": "Durft iemand van u, die een zaak heeft tegen een ander, voor de onrechtvaardigen naar de rechter gaan, en niet voor de heiligen? Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen? Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Spr 12:19": "Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Job 5:2": "Want de dwaas brengt de toorn om, en de ijver doodt de eenvoudige.", "Luk 12:51-53": "Denkt u dat Ik gekomen ben om vrede te geven op de aarde? Nee, zeg Ik u, maar eerder verdeeldheid. Want van nu af aan zullen er vijf in één huis verdeeld zijn, drie tegen twee, en twee tegen drie. De vader zal tegen de zoon verdeeld zijn, en de zoon tegen de vader; de moeder tegen de dochter, en de dochter tegen de moeder; de schoonmoeder tegen haar schoondochter, en de schoondochter tegen haar schoonmoeder.", "Hand 24:25": "En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen.", "1 Sam 13:20": "Daarom moest heel Israël naar de Filistijnen aftrekken, om ieder zijn ploegijzer, of zijn spade, of zijn bijl, of zijn houweel te laten scherpen.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Jak 3:16": "Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Jer 13:10": "Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt.", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Amos 1:11": "Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Luk 14:17-24": "En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd. En een ander zei: Ik heb vijf span ossen gekocht, en ik ga erheen om ze te proberen; ik vraag u, houd mij voor verontschuldigd.", "Jer 3:5": "Zal Hij voor eeuwig Zijn toorn behouden? Zal Hij die voortdurend bewaren? Zie, u spreekt en doet die slechte dingen, en u zet door zoveel u kunt.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Jer 8:12": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Ezra 9:11": "die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid.", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Spr 23:17": "Laat uw hart niet jaloers zijn op de zondaars; maar wees de hele dag in de vreze van de HEERE.", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Rom 2:17-20": "Zie, u wordt een Jood genoemd en rust op de wet, en roemt in God, En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet; En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,", "Job 35:8": "Uw goddeloosheid zou een man treffen, gelijk u bent, en uw gerechtigheid een mensenkind ten goede komen.", "Jak 2:7": "Lasteren zij niet de goede naam die over u aangeroepen is?", "Hebr 11:24-26": "Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden; en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Deut 24:10-13": "Wanneer u aan uw naaste iets te leen geeft, zult u zijn huis niet binnengaan om zijn pand te pand te nemen; buiten zult u staan, en de man aan wie u geleend hebt, zal het pand naar buiten tot u brengen. Maar als hij een arme man is, zult u met zijn pand niet neerliggen.", "Gen 33:13": "Maar hij zei tegen hem: Mijn heer weet dat deze kinderen teer zijn, en dat ik zogende schapen en koeien bij mij heb; als men ze maar één dag te hard laat lopen, zal de hele kudde sterven.", "2 Kon 5:25": "Daarna kwam hij binnen, en ging voor zijn heer staan. En Elisa zei tegen hem: Waar kom je vandaan, Gehazi? En hij zei: Uw knecht is nergens heen geweest.", "Spr 9:9": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis.", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "Gen 49:4": "Snelle afloop als van water, u zult niet de voortreffelijkste zijn! Want u hebt het bed van uw vader beklommen; toen hebt u het geschonden; hij heeft mijn bed beklommen!", "1 Petr 4:12": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam;", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Spr 24:27": "Regel uw werk daarbuiten, en maak het voor u gereed op de akker, en bouw daarna uw huis.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "2 Kron 28:10": "Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.", "Spr 24:24": "Wie tegen de goddeloze zegt: U bent rechtvaardig; die zullen de volken vervloeken, de naties zullen hem verafschuwen.", "Matt 25:22": "En hij die de twee talenten ontvangen had, kwam ook, en zei: Heer, twee talenten hebt u mij gegeven; zie, twee andere talenten heb ik daarbij gewonnen.", "Ex 24:13": "Toen maakte Mozes zich op, met Jozua, zijn dienaar; en Mozes klom op de berg van God.", "Ex 32:8-10": "Zij zijn snel afgeweken van de weg die Ik hun geboden had; zij hebben zich een gegoten kalf gemaakt, zich daarvoor neergebogen, er offers aan gebracht, en gezegd: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd. Verder zei de HEERE tegen Mozes: Ik heb dit volk gezien, en zie, het is een hardnekkig volk! En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken."}, "noten": {"1": "SV: af te bidden (d.i. iets waar men zich met smeekbeden tegen moet verweren; hier: onbetrouwbaar, bedrieglijk)"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1984\">Beroem</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1984\">u</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4279\">niet</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4279\">over</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4279\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4279\">dag</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4279\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4279\">morgen</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H3045\">want</span> u <span class=\"wl\" data-l=\"L3\" data-code=\"H3045\">weet</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3117\">niet</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3117\">wat</span> <span class=\"wl\" const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>

  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
