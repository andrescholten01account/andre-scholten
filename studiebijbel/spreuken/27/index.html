", "Spr 14:4": "Als er geen ossen zijn, is de krib rein; maar door de kracht van de os is er veel inkomen.", "Spr 14:24": "De kroon van de wijzen is hun rijkdom; de dwaasheid van de dwazen is dwaasheid.", "Job 32:1": "Toen hielden de drie mannen op Job te antwoorden, omdat hij in zijn eigen ogen rechtvaardig was.", "Spr 15:20": "Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.", "Ps 37:8": "He. Laat af van toorn, en verlaat de woede; wind u niet op, zeker niet, om kwaad te doen.", "Ex 10:8-11": "Toen werden Mozes en Aäron weer bij Farao gebracht, en hij zei tegen hen: Ga, dien de HEERE, uw God! Maar wie zijn het die zullen gaan? En Mozes zei: Wij zullen gaan met onze jonge en met onze oude mensen; met onze zonen en met onze dochters, met onze schapen en met onze runderen zullen wij gaan; want wij hebben een feest van de HEERE. Toen zei hij tegen hen: Laat de HEERE zo met u zijn, zoals ik u en uw kleine kinderen zal laten gaan: kijk uit, want er is kwaad voor uw aangezicht!", "2 Sam 21:7": "Doch de koning spaarde Mefiboseth, de zoon van Jonathan, de zoon van Saul, om de eed van de HEERE, die tussen hen was, tussen David en tussen Jonathan, Sauls zoon.", "Job 13:25": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen?", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "1 Tim 6:5": "verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Joh 8:22": "De Joden zeiden dan: Zal Hij zichzelf soms doden, omdat Hij zegt: Waar Ik heenga, kunt u niet komen?", "2 Petr 2:18": "Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen;", "Ps 144:11": "Bevrijd mij en red mij van de hand van vreemden, wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is;", "Ex 12:26": "En het zal gebeuren, wanneer uw kinderen tegen u zullen zeggen: Wat betekent deze dienst voor u?", "Ps 73:4-12": "Want er zijn geen boeien tot hun dood toe, en hun kracht is fris. Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd. Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Job 18:3": "Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen?", "Mark 4:15-19": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was. En dezen zijn evenzo zij die op de rotsachtige plaatsen bezaaid worden; die, wanneer zij het Woord gehoord hebben, het meteen met vreugde ontvangen. En zij hebben geen wortel in zichzelf, maar houden het voor een tijd vol; daarna, wanneer er verdrukking of vervolging komt omwille van het Woord, worden zij meteen afvallig.", "2 Joh 1:4": "Ik ben zeer verblijd geweest, dat ik van uw kinderen gevonden heb die in de waarheid wandelen, zoals wij een gebod ontvangen hebben van de Vader.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "Klaagl 5:7": "Onze vaders hebben gezondigd, en zijn er niet meer, en wij dragen hun ongerechtigheden.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Matt 8:19": "En er kwam een schriftgeleerde naar Hem toe, die tegen Hem zei: Meester, ik zal U volgen, waar U ook heengaat.", "Spr 30:9": "Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Job 9:26": "Zij zijn voorbijgevaren met jachtschepen; zoals een arend naar het aas toevliegt.", "Spr 13:16": "Al wie verstandig is, handelt met kennis; maar een dwaas breidt dwaasheid uit.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Jes 56:12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Hand 8:21": "U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.", "Luk 7:36-50": "En een van de Farizeeën vroeg Hem of Hij met hem wilde eten; en Hij ging het huis van de Farizeeër binnen, en ging aanliggen. En zie, een vrouw in de stad, die een zondares was, kwam er, toen zij te weten kwam dat Hij in het huis van de Farizeeër aan tafel aanlag, met een albasten fles met zalf, en ging huilend achter Zijn voeten staan, en begon Zijn voeten nat te maken met tranen, en droogde ze af met het haar van haar hoofd, en kuste Zijn voeten, en zalfde ze met de zalf.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Spr 5:3": "Want de lippen van de vreemde vrouw druppen honingzeem, en haar gehemelte is gladder dan olie.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Deut 4:10": "Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;", "2 Sam 19:24": "Mefiboseth, Sauls zoon, kwam ook de koning tegemoet; en hij had zijn voeten niet verzorgd, noch zijn baard geknipt, noch zijn kleren gewassen, vanaf de dag dat de koning weggegaan was, tot de dag dat hij met vrede terugkwam.", "Job 21:27-29": "Zie, ik ken uw gedachten, en de boze plannen, waarmee u tegen mij geweld doet. Want u zult zeggen: Waar is het huis van de vorst, en waar is de tent van de woningen der goddelozen? Hebt u niet gevraagd aan de voorbijgaande op de weg, en kent u hun tekenen niet?", "1 Sam 18:8": "Toen ontstak Saul in grote woede, en dat woord was kwaad in zijn ogen, en hij zei: Zij hebben David tienduizend gegeven, doch mij hebben zij maar duizend gegeven; en zeker zal het koninkrijk nog voor hem zijn.", "Ex 23:1": "U zult geen vals gerucht verspreiden; en u zult uw hand niet bij de goddeloze leggen, om een getuige te zijn tot geweld.", "Spr 20:19": "Wie als een achterklapper rondgaat, openbaart het geheime; vermeng u dan niet met hem die met zijn lippen verlokt.", "1 Sam 20:3": "Toen zwoer David verder, en zei: Uw vader weet heel goed dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!", "Pred 8:3": "Haast u niet om van zijn aangezicht weg te gaan; blijf niet staan bij een kwade zaak; want al wat hem lust, doet hij.", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "Hos 6:5": "Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht.", "Spr 25:19": "Het vertrouwen op een trouweloze, op de dag van benauwdheid, is als een gebroken tand en een verstuikte voet.", "Spr 11:4": "Bezit doet geen nut ten dage van de verbolgenheid; maar de gerechtigheid redt van de dood.", "2 Tim 2:23-25": "En verwerp de dwaze en onverstandige vragen, wetend dat zij twisten voortbrengen. En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen; met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Ps 35:14": "Ik ging steeds als een vriend, als was hij mij een broeder geweest; ik ging gebukt in het zwart, als iemand die over zijn moeder treurt.", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "Spr 29:11": "Een dwaas laat zijn hele geest de vrije loop, maar de wijze weerhoudt die en houdt hem in.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Spr 31:10-31": "Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waarde gaat ver boven de robijnen. Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken. Gimel. Zij doet hem goed en geen kwaad, al de dagen van haar leven.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "1 Sam 11:10": "En de mannen van Jabes zeiden: Morgen zullen wij naar u uitgaan, en u zult met ons doen naar alles wat goed is in uw ogen.", "Spr 22:4": "Het loon van de nederigheid, met de vreze des HEEREN, is rijkdom, en eer, en leven.", "1 Sam 2:3-5": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan. De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord. Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Ps 78:5": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken;", "Pred 4:9-12": "Twee zijn beter dan een; want zij hebben een goede beloning voor hun moeite; Want als zij vallen, richt de een zijn metgezel op; maar wee de ene die gevallen is, want er is geen tweede om hem op te helpen. Ook, als twee samen liggen, hebben zij warmte; maar hoe zou iemand alleen warm worden?", "Jer 48:36": "Daarom zal Mijn hart over Moab klagen als de fluiten; ook zal Mijn hart over de mensen van Kir-heres klagen als de fluiten, omdat het overschot dat hij gemaakt had, verloren is.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Job 22:5": "Is uw boosheid niet groot, en is er geen einde aan uw ongerechtigheden?", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Jes 64:6": "Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Job 17:5": "Wie met vleierij zijn vrienden iets aanzegt, ook de ogen van zijn kinderen zullen versmachten.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Spr 19:22": "De wens van de mens is zijn weldadigheid; maar de arme is beter dan een leugenachtig man.", "Mark 12:38": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten;", "Jes 51:1": "Hoor naar Mij, u die de gerechtigheid najaagt, u die de HEERE zoekt! Kijk naar de rots waaruit u gehouwen bent, en naar de holte van de bornput waaruit u gegraven bent.", "Ex 22:26": "Als u de mantel van uw naaste als onderpand neemt, moet u die aan hem teruggeven voordat de zon ondergaat;", "Luk 14:10": "Maar wanneer u genodigd bent, ga dan de laatste plaats zitten; zodat, wanneer hij die u genodigd heeft komt, hij tegen u zegt: Vriend, kom hoger op. Dan zal het u eer zijn voor hen die met u aanzitten.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "2 Kon 5:2": "En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was.", "Deut 32:7": "Denk aan de dagen van vroeger; merk op de jaren van elk geslacht; vraag uw vader, die zal het u bekendmaken, uw ouderen, en zij zullen het u zeggen.", "Spr 26:18": "Zoals iemand die zich waanzinnig aanstelt, die vuurpijlen, pijlen en dodelijke dingen werpt;", "Job 6:14": "Aan hem die versmolten is, zou van zijn vriend weldadigheid gebeuren; of hij zou de vreze van de Almachtige verlaten.", "Pred 5:10": "Waar het goed zich vermeerdert, daar vermeerderen ook zij die het opeten; wat nut hebben dan de bezitters ervan, behalve het aanzien ervan met hun ogen?", "1 Tim 3:3": "niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "1 Kor 5:2": "En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden?", "Spr 5:1-23": "Mijn zoon! Let op mijn wijsheid, neig uw oor tot mijn verstand; Opdat u alle bedachtzaamheid behoudt, en uw lippen kennis bewaren. Want de lippen van de vreemde vrouw druppen honingzeem, en haar gehemelte is gladder dan olie.", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Ef 2:1-3": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden; waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid; onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Ps 116:11": "Ik zei in mijn haast: Alle mensen zijn leugenaars.", "Spr 23:16": "En mijn nieren zullen opspringen van vreugde, als uw lippen spreken wat recht is.", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Spr 30:10": "Belaster een knecht niet bij zijn heer, opdat hij u niet vloekt, en u schuldig wordt.", "Deut 22:10": "U zult niet ploegen met een os en een ezel tegelijk.", "Ps 12:7": "De woorden van de HEERE zijn reine woorden, zilver, gelouterd in een aarden smeltkroes, gezuiverd zevenmaal.", "Tit 2:6": "Vermaan de jonge mannen eveneens dat zij matig zijn.", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "Job 34:3": "Want het oor proeft de woorden, zoals het gehemelte het voedsel smaakt.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Spr 23:9": "Spreek niet ten aanhoren van een dwaas, want hij zou het verstand van uw woorden verachten.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "1 Tim 5:1": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders;", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Ps 139:6": "De kennis is mij te wonderbaar, ze is hoog, ik kan er niet bij.", "Pred 4:4": "Verder zag ik al de moeite en alle bekwaamheid van het werk, dat het de mens jaloezie van zijn naaste aanbrengt. Dat is ook vluchtigheid en najagen van de wind.", "Ps 9:13": "Want Hij zoekt de bloedstortingen, Hij gedenkt daarvan; Hij vergeet het geroep van de ellendigen niet.", "Tit 2:4": "Opdat zij de jonge vrouwen leren bezonnen te zijn, hun mannen lief te hebben, hun kinderen lief te hebben;", "Jak 4:10": "Verneder u voor de Heere, en Hij zal u verhogen.", "Pred 6:12": "Want wie weet wat goed is voor de mens in dit leven, gedurende het aantal dagen van het leven van zijn ijdelheid, dat hij doorbrengt als een schaduw? Want wie kan de mens aanzeggen wat na hem wezen zal onder de zon?", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Spr 20:14": "Het is slecht, het is slecht! zal de koper zeggen; maar als hij weggegaan is, dan zal hij zich beroemen.", "Ex 22:29": "Met het brengen van de opbrengst van uw oogst en van uw perskuip mag u niet talmen; de eerstgeborene van uw zonen moet u aan Mij geven.", "Ex 34:21": "Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.", "Spr 18:19": "Een broeder is moeilijker te winnen dan een sterke stad; en geschillen zijn als de grendel van een paleis.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Tit 3:1-3": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn; Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen. Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Job 7:6-10": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting. Bedenk, dat mijn leven een wind is; mijn oog zal niet terugkomen, om het goede te zien. Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn.", "Jak 1:22-25": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Spr 16:32": "Wie geduldig is, is beter dan de sterke; en wie heerst over zijn geest, dan wie een stad inneemt.", "Jes 47:7-9": "En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht. Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen. Toch zullen deze beide dingen u in een ogenblik overkomen, op één dag, de beroving van kinderen en weduwschap; volkomen zullen zij u overkomen, vanwege de veelheid van uw toverijen, vanwege de grote menigte van uw bezweringen.", "Deut 8:10-18": "Als u dan gegeten zult hebben, en verzadigd bent, dan zult u de HEERE, uw God, loven, om dat goede land dat Hij u gegeven zal hebben. Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont,", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Spr 26:6": "Hij snijdt zichzelf de voeten af, en drinkt geweld, wie boodschappen laat overbrengen door de hand van een dwaas.", "Spr 23:15-35": "Mijn zoon! als uw hart wijs is, zal mijn hart zich verblijden, ja, ik zelf. En mijn nieren zullen opspringen van vreugde, als uw lippen spreken wat recht is. Laat uw hart niet jaloers zijn op de zondaars; maar wees de hele dag in de vreze van de HEERE.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 12:6": "Want ook uw broeders en het huis van uw vader, ook díe handelen trouweloos tegen u; ook díe roepen u met volle stem achterna; geloof hen niet, wanneer zij vriendelijk tot u spreken.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ps 52:3-6": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Pred 9:4-6": "Want voor hem die zich bij alle levenden gevoegd heeft, is er hoop; want een levende hond is beter dan een dode leeuw. Want de levenden weten dat zij zullen sterven, maar de doden weten helemaal niets; zij hebben ook geen loon meer, maar hun gedachtenis is vergeten. Ook zijn hun liefde, hun haat en hun jaloezie al vergaan; en zij hebben geen deel meer in deze wereld, in alles wat er onder de zon gebeurt.", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Richt 9:14": "Toen zeiden alle bomen tegen de doornstruik: Kom u, wees koning over ons.", "Spr 30:8": "Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Gal 6:14": "Maar laat het ver van mij zijn dat ik zou roemen, anders dan in het kruis van onze Heere Jezus Christus; door Wie de wereld mij gekruisigd is, en ik de wereld.", "Jer 7:28": "Daarom zeg tot hen: Dit is het volk dat naar de stem van de HEERE, zijn God, niet hoort, en de tucht niet aanneemt; de waarheid is ondergegaan, en uitgeroeid uit hun mond.", "Spr 25:24": "Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Ex 13:14": "Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd.", "Luk 18:13": "En de tollenaar, die op een afstand stond, wilde zelfs zijn ogen niet opheffen naar de hemel, maar sloeg op zijn borst en zei: O God, wees mij, zondaar, genadig!", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Spr 30:16": "Het graf, de gesloten baarmoeder, de aarde die van water niet verzadigd wordt, en het vuur dat niet zegt: Het is genoeg!", "Jes 23:9": "De HEERE van de heerscharen heeft het besloten, om de hoogmoed van alle luister te ontheiligen, om alle heerlijksten van de aarde verachtelijk te maken.", "Klaagl 3:27": "Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Job 26:5": "De doden worden geboren van onder het water, en zijn inwoners.", "Gen 39:2-5": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte, vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand.", "Jes 16:2": "Anders zal het gebeuren, dat de dochters van Moab bij de veren van de Arnon zullen zijn, als een vogel die rondzwerft, uit het nest verjaagd.", "1 Sam 8:19": "Doch het volk weigerde naar Samuëls stem te horen; en zij zeiden: Nee, maar er zal een koning over ons zijn;", "Kol 3:22": "Dienstknechten, wees in alles gehoorzaam aan uw heren naar het vlees, niet met ogendiensten als mensenbehagers, maar met eenvoud van hart, terwijl u God vreest.", "Job 24:2-24": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "Ps 5:7": "U zult de leugensprekers verdoen; van de man van het bloed en van het bedrog heeft de HEERE een gruwel.", "Jak 3:14-16": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Ps 31:19": "Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Pred 2:18-21": "Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal. Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid. Daarom keerde ik mij om, om mijn hart te laten wanhopen over al de arbeid die ik onder de zon verricht heb.", "Hos 4:2": "Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Pred 6:7": "Al de arbeid van de mens is voor zijn mond; en toch wordt de begeerte niet vervuld.", "2 Kron 10:8": "Maar hij liet de raad van de oudsten los, die zij hem gegeven hadden; en hij hield raad met de jongemannen die met hem opgegroeid waren, die voor hem stonden.", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Jak 4:14": "U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.", "Job 14:2": "Hij komt op als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en houdt geen stand.", "1 Tim 6:1": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "1 Kor 4:10": "Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht.", "Spr 6:13": "hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers;", "Job 5:18": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.", "Gen 34:25": "En het gebeurde op de derde dag, toen zij in pijn waren, dat de twee zonen van Jakob, Simeon en Levi, broers van Dina, ieder zijn zwaard namen, en stout de stad binnenkwamen, en allen doodden die mannelijk waren.", "Luk 15:17": "En tot zichzelf gekomen, zei hij: Hoeveel dagloners van mijn vader hebben brood in overvloed, en ik kom om van honger!", "Spr 14:1": "Elke wijze vrouw bouwt haar huis; maar wie zeer dwaas is, breekt het met eigen handen af.", "Ef 4:28": "Wie gestolen heeft, moet niet meer stelen, maar moet liever arbeiden, terwijl hij met de handen doet wat goed is, opdat hij kan delen met hem die het nodig heeft.", "Spr 25:8": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben.", "Ezech 16:47": "Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.", "Spr 22:26": "Wees niet onder hen die in de hand klappen, onder hen die borg staan voor schulden.", "Ezech 18:12": "De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;", "Ex 18:10": "En Jethro zei: Gezegend zij de HEERE, Die u verlost heeft uit de hand van de Egyptenaren, en uit de hand van Farao; Die dit volk van onder de hand van de Egyptenaren verlost heeft!", "Ezech 34:22-24": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee. En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.", "Spr 3:1-3": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Ps 90:5": "U overstroomt hen; zij zijn gelijk een slaap; in de morgenstond zijn zij gelijk het gras, dat verandert;", "Jes 41:11": "Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan.", "Mark 8:35-37": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden. Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Pred 5:9": "Wie het geld liefheeft, wordt van het geld niet verzadigd; en wie de overvloed liefheeft, wordt van het inkomen niet verzadigd. Ook dit is nietigheid.", "Luk 17:7-9": "En wie van u die een dienstknecht heeft die ploegt of de dieren hoedt, zal tegen hem zeggen, als hij van de akker komt: Kom meteen aan tafel? Maar zal hij niet tegen hem zeggen: Maak klaar wat ik vanavond zal eten, omgord u en dien mij, totdat ik gegeten en gedronken heb; en daarna kunt u eten en drinken? Dankt hij die dienstknecht ervoor dat hij gedaan heeft wat hem bevolen was? Ik denk het niet.", "Ps 36:2-5": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen. Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is. De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Spr 30:33": "Want het karnen van melk brengt boter voort, en het knijpen van de neus brengt bloed voort, en het opjagen van de toorn brengt twist voort.", "2 Sam 10:12": "Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.", "Spr 13:17": "Een goddeloze bode zal in het kwaad vallen; maar een trouwe gezant is medicijn.", "Luk 11:43": "Wee u, Farizeeën, want u houdt van de voorste plaatsen in de synagogen, en van de begroetingen op de markten.", "Ps 109:2": "Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong.", "Spr 23:15": "Mijn zoon! als uw hart wijs is, zal mijn hart zich verblijden, ja, ik zelf.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Spr 26:17": "De voorbijganger die zich opwindt in een twist die hem niet aangaat, is als iemand die een hond bij de oren grijpt.", "Ps 6:6": "Want in de dood is aan U geen gedachtenis; wie zal U loven in het graf?", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Spr 12:24": "De hand van de vlijtigen zal heersen; maar de bedriegers zullen onder cijns wezen.", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "Spr 30:23": "Om een hatelijke vrouw, als zij getrouwd wordt; en een dienstmaagd, als zij erfgenaam wordt van haar vrouw.", "1 Kor 10:25-33": "Eet alles wat in de vleeshal verkocht wordt, zonder daarover vragen te stellen, omwille van het geweten; want de aarde is van de Heere, en al wat zij bevat. En als iemand van de ongelovigen u uitnodigt, en u besluit te gaan, eet dan alles wat u wordt voorgezet, zonder daarover vragen te stellen, omwille van het geweten.", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Spr 16:20": "Wie op het woord verstandig let, zal het goede vinden; en wie op de HEERE vertrouwt, is gelukkig.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Ezra 10:2-4": "Toen antwoordde Sechanja, de zoon van Jehiel, een van de zonen van Elam, en zei tegen Ezra: Wij hebben overtreden tegen onze God, en wij hebben vreemde vrouwen van de volken van het land bij ons laten wonen; maar nu is er hoop voor Israël wat dit betreft. Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het.", "Spr 10:5": "Wie in de zomer verzamelt, is een verstandig zoon; maar wie in de oogst vast slaapt, is een zoon die beschaamd maakt.", "Spr 6:12": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond;", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Hand 12:22": "En het volk riep hem toe: Dit is de stem van een god, en niet van een mens!", "Rom 11:20": "Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "Spr 21:6": "Te arbeiden om schatten met een valse tong, is een voortgedreven ijdelheid van hen die de dood zoeken.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "2 Tim 3:2-7": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede, verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "2 Sam 22:6": "Banden van het graf omringden mij; strikken van de dood bejegenden mij.", "Ps 63:12": "Maar de koning zal zich in God verblijden; ieder die bij Hem zweert, zal zich beroemen; want de mond van de leugensprekers zal gestopt worden.", "Spr 10:17": "Het pad naar het leven is voor hem die de tucht bewaart; maar wie de bestraffing verlaat, doet dwalen.", "Job 22:2": "Zal een man God voordelig zijn? Maar voor zichzelf zal de verstandige voordelig zijn.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Joh 13:14-16": "Als Ik dan, de Heere en de Meester, uw voeten gewassen heb, dan bent u ook verplicht, elkaars voeten te wassen. Want Ik heb u een voorbeeld gegeven, opdat u, zoals Ik u gedaan heb, ook zult doen. Voorwaar, voorwaar, Ik zeg u: Een dienstknecht is niet meer dan zijn heer, en ook een gezant niet meer dan wie hem gezonden heeft.", "Matt 6:1": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is.", "1 Petr 5:2": "Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed;", "Job 34:4": "Laat ons kiezen voor ons, wat recht is; laat ons kennen onder ons wat goed is.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Spr 1:8": "Mijn zoon! hoor de tucht van uw vader, en verlaat de leer van uw moeder niet;", "Ex 8:32": "Doch Farao verzwaarde zijn hart ook deze keer, en hij liet het volk niet trekken.", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Deut 6:10-12": "Als het dan gebeurd zal zijn, dat de HEERE, uw God, u zal hebben gebracht in dat land, dat Hij aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft u te zullen geven; grote en goede steden, die u niet gebouwd hebt, En huizen, vol van alle goeds, die u niet gevuld hebt, en uitgehouwen putten, die u niet uitgehouwen hebt, wijngaarden en olijfgaarden, die u niet geplant hebt, en u gegeten hebt en verzadigd bent; Zo let erop, dat u de HEERE niet vergeet, Die u uit Egypteland, uit het diensthuis heeft uitgeleid.", "Spr 11:28": "Wie op zijn rijkdom vertrouwt, die zal vallen; maar de rechtvaardigen zullen groenen als loof.", "1 Kor 4:7": "Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had?", "Spr 9:8": "Bestraf de spotter niet, opdat hij u niet haat; bestraf de wijze, en hij zal u liefhebben.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Spr 21:23": "Wie zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Spr 21:24": "Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.", "Deut 28:40": "Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Spr 18:15": "Het hart van de verstandigen verwerft kennis, en het oor van de wijzen zoekt kennis.", "Jak 4:2": "U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt.", "Matt 10:24": "De discipel staat niet boven de meester, en de dienstknecht niet boven zijn heer.", "Ezech 3:7": "Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.", "Spr 14:17": "Wie haastig is tot toorn, zal dwaasheid doen; en een man met schandelijke plannen zal gehaat worden.", "Jes 41:12": "U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.", "Hos 7:16": "Zij keren zich om, maar niet naar de Allerhoogste, zij zijn als een bedrieglijke boog; hun vorsten vallen door het zwaard, vanwege de woede van hun tong; dit zal hun bespotting zijn in het land Egypte.", "Num 35:16": "Maar als hij hem met een ijzeren voorwerp geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden.", "Jes 38:12": "Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever zijn weefsel; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Ps 37:11": "De zachtmoedigen daarentegen zullen de aarde erfelijk bezitten, en zich verlustigen over grote vrede.", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Luk 15:16": "En hij verlangde ernaar zijn buik te vullen met de schillen die de zwijnen aten; en niemand gaf hem die.", "Pred 7:5": "Het is beter te horen het bestraffen van de wijze, dan dat iemand het gezang van de dwazen hoort.", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "Spr 24:1": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn.", "Job 15:1-13": "Toen antwoordde Elifaz, de Themaniet, en zei: Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind? Bestraffend door woorden, die niet baten, en door redenen, waarmee hij geen voordeel doet?", "Matt 16:25": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Spr 26:28": "Een valse tong haat hen die zij verbrijzelt; en een gladde mond veroorzaakt val.", "2 Kron 28:9": "Daar nu was een profeet van de HEERE, wiens naam Oded was; die ging naar buiten, het leger tegemoet dat naar Samaria kwam, en zei tegen hen: Zie, door de grimmigheid van de HEERE, de God van uw vaderen, over Juda, heeft Hij hen in uw hand gegeven, en u hebt hen doodgeslagen in een toorn die tot aan de hemel raakt.", "1 Tess 3:3": "opdat niemand bewogen wordt door deze verdrukkingen; want u weet zelf dat wij hiertoe gesteld zijn.", "Spr 14:16": "De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.", "Job 19:16": "Ik riep mijn knecht, en hij antwoordde niet; ik smeekte met mijn mond tot hem.", "Jer 11:15": "Wat heeft Mijn beminde in Mijn huis te doen, terwijl zij die schandelijke daad met velen doet, en het heilige vlees van u geweken is? Wanneer u kwaad doet, dan springt u op van vreugde.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Ps 146:4": "Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen.", "2 Petr 2:12-19": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Spr 8:33": "Hoor de tucht, en word wijs, en verwerp die niet.", "Spr 23:25": "Laat uw vader zich verblijden, ook uw moeder; en laat zij zich verheugen, die u gebaard heeft.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Jak 4:1": "Waar komen strijd en ruzies onder u vandaan? Komen ze niet hieruit voort, namelijk uit uw lusten, die in uw leden strijd voeren?", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Luk 22:24-27": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn. En Hij zei tegen hen: De koningen van de volken heersen over hen; en zij die macht over hen hebben, worden weldoeners genoemd. Maar u niet zo; maar de meeste onder u moet worden als de minste, en wie voorganger is, als iemand die dient.", "1 Tim 5:8": "Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige.", "Job 16:18": "O aarde, bedek mijn bloed niet; en laat er voor mijn geroep geen plaats zijn.", "Luk 14:11": "Want ieder die zichzelf verhoogt, zal vernederd worden; en wie zichzelf vernedert, zal verhoogd worden.", "2 Petr 2:12-15": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Pred 8:7": "Want hij weet niet wat er gebeuren zal; want wie zal het hem bekendmaken, wanneer het zal gebeuren?", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "2 Tess 3:10-12": "Want ook toen wij bij u waren, hebben wij u dit bevolen: dat als iemand niet wil werken, hij ook niet moet eten. Want wij horen dat sommigen onder u ongeregeld wandelen, niet werkend, maar bezig met bemoeizucht. Doch zulke mensen bevelen en vermanen wij door onze Heere Jezus Christus, dat zij met rust werkend hun eigen brood eten.", "Lev 18:25": "Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt.", "Gal 5:15": "Maar als u elkaar bijt en verslindt, kijk dan uit dat u niet door elkaar verteerd wordt.", "Jer 6:15": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallende, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Num 21:5": "En het volk sprak tegen God en tegen Mozes: Waarom hebt u ons laten optrekken uit Egypte, opdat wij zouden sterven in de woestijn? Want hier is geen brood, ook geen water, en onze ziel walgt van dit zeer lichte brood.", "Spr 14:30": "Een gezond hart is het leven van het vlees; maar afgunst is verrotting van de beenderen.", "Amos 5:10": "Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.", "Ps 64:4-7": "Die hun tong scherpen als een zwaard, een bitter woord richten als hun pijl; Om in verborgen plaatsen de oprechte te schieten; haastig schieten zij naar hem, en vrezen niet. Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Spr 26:26": "Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.", "Spr 19:11": "Het verstand van de mens vertraagt zijn toorn; en zijn sieraad is een overtreding voorbij te gaan.", "Ezech 11:12": "En u zult weten dat Ik de HEERE ben, omdat u in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, maar naar de rechten van de heidenvolken die rondom u zijn, gedaan hebt.", "Hos 7:3": "Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "Micha 3:2": "Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen.", "1 Kor 9:13": "Weet u niet, dat wie de heilige dingen bedienen, van het heilige eten? En wie steeds bij het altaar zijn, met het altaar meedelen?", "Deut 15:15": "En u zult gedenken dat u een dienstknecht in Egypteland geweest bent, en dat de HEERE, uw God, u verlost heeft; daarom gebied ik u vandaag dit.", "Spr 19:6": "Velen smeken de gunst van de vorst af; en ieder is een vriend van hem die geschenken geeft.", "Matt 10:37": "Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard.", "Ruth 3:3": "Was u dan, en zalf u, en trek uw kleren aan, en ga naar de dorsvloer; maar maak u aan de man niet bekend, totdat hij klaar is met eten en drinken.", "Spr 20:29": "Het sieraad van de jongelingen is hun kracht, en de heerlijkheid van de ouden is de grijsheid.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Hand 23:23-35": "En hij riep twee van de hoofdmannen over honderd bij zich en zei: Maak tweehonderd soldaten gereed om naar Caesarea te trekken, en zeventig ruiters en tweehonderd schutters, tegen het derde uur van de nacht. En laat er rijdieren klaarstaan, zodat zij Paulus daarop kunnen zetten en hem veilig kunnen overbrengen naar de stadhouder Felix. En hij schreef een brief met de volgende inhoud:", "1 Sam 28:19": "En de HEERE zal ook Israël met u in de hand van de Filistijnen geven, en morgen zult u en uw zonen bij mij zijn; ook zal de HEERE het leger van Israël in de hand van de Filistijnen geven.", "Spr 17:17": "Een vriend heeft te allen tijde lief; en een broeder wordt geboren voor de tijd van benauwdheid.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "Jes 7:21": "En het zal op die dag gebeuren, dat iemand een koetje in leven zal houden, en twee schapen;", "Amos 3:3": "Zullen twee samen wandelen, tenzij zij bijeengekomen zijn?", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Spr 29:23": "De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.", "Jes 40:6": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld.", "Spr 1:1-33": "De spreuken van Salomo, de zoon van David, de koning van Israël, Om wijsheid en tucht te weten; om te verstaan redenen van het verstand; Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "Jes 47:7": "En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht.", "Pred 7:21": "Geef ook uw hart niet aan alle woorden die men spreekt, opdat u niet hoort dat uw knecht u vervloekt.", "1 Tim 6:4-11": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen. Maar de godsvrucht is, samen met tevredenheid, een grote winst.", "Ezech 16:56": "Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,", "Job 6:13": "Is dan mijn hulp niet in mij, en is de wijsheid uit mij verdreven?", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Spr 3:1-35": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Ezech 11:3": "Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Jer 9:5": "En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.", "Spr 31:1-3": "De woorden van koning Lemuël, de last, waarmee zijn moeder hem onderwees. Wat, o mijn zoon, en wat, o zoon van mijn buik? Ja, wat, o zoon van mijn geloften? Geef aan de vrouwen uw vermogen niet, en uw wegen niet aan hen die koningen te gronde richten.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Spr 23:5": "Zult u uw ogen laten vliegen op iets wat er niet is? Want het maakt zich zeker vleugels, als een arend, die naar de hemel vliegt.", "Ex 13:8": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Spr 4:11": "Ik onderwijs u in de weg van de wijsheid; ik doe u treden op de rechte paden.", "Mark 9:33-36": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Spr 15:11": "Het dodenrijk en het verderf liggen open voor de HEERE; hoeveel te meer de harten van de mensenkinderen?", "Job 21:34": "Hoe troost u mij dan met ijdelheid, terwijl in uw antwoorden ontrouw overblijft?", "Mark 3:25": "En als een huis tegen zichzelf verdeeld is, kan dat huis niet standhouden.", "2 Tim 3:6": "Want tot hen behoren zij die de huizen binnensluipen en de vrouwtjes gevangen nemen die met zonden beladen zijn en door allerlei begeerten gedreven worden,", "Ps 86:1": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig.", "1 Sam 17:28": "Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.", "Lev 20:9": "Als iemand zijn vader of zijn moeder vervloekt, zal hij zeker gedood worden; hij heeft zijn vader of zijn moeder vervloekt; zijn bloed is op hem!", "Ps 115:17": "De doden zullen de HEERE niet prijzen, evenmin wie in de stilte neergedaald zijn.", "Jer 8:8": "Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden.", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "Gen 4:16": "En Kaïn ging weg van het aangezicht van de HEERE; en hij woonde in het land Nod, ten oosten van Eden.", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Luk 16:19-25": "En er was een zeker rijk mens, en die was gekleed met purper en zeer fijn linnen, en leefde elke dag vrolijk en overvloedig. En er was een zekere bedelaar, met de naam Lazarus, die voor zijn poort lag, vol zweren; En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Ps 73:3": "Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.", "Nahum 3:1": "Wee de bloedstad, die helemaal vol leugen en verscheuring is! De roof houdt niet op.", "Num 11:8": "Het volk liep hier en daar, en verzamelde het, en maalde het met molens, of stampte het in vijzels, en kookte het in potten, en maakte er koeken van; en zijn smaak was als de smaak van de beste vochtigheid van de olie.", "Hos 9:1": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren.", "Job 20:13": "Al spaart hij het en laat het niet los, maar houdt het midden in zijn gehemelte binnen;", "Spr 2:12-15": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt; Van hen die de paden van de oprechtheid verlaten, om te gaan in de wegen van de duisternis; Die blij zijn met het doen van kwaad, zich verheugen in de verkeerdheden van de kwade;", "Spr 20:17": "Het brood van de leugen is de mens zoet; maar daarna zal zijn mond vol worden van zandsteentjes.", "Rom 8:8": "En zij die in het vlees zijn, kunnen God niet behagen.", "Ps 112:10": "Resch. De goddeloze zal het zien, en hij zal boos worden; Schin. hij zal met zijn tanden knarsen en wegkwijnen. Thau. de wens van de goddelozen zal vergaan.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Spr 11:14": "Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Spr 21:19": "Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.", "Spr 28:20": "Een geheel getrouw man zal overvloedig zijn in zegeningen; maar wie zich haast om rijk te worden, zal niet onschuldig blijven.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "1 Sam 18:15": "Toen Saul nu zag dat hij zich zeer voorzichtig gedroeg, vreesde hij voor zijn aangezicht.", "Jak 1:6-8": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt. Want laat die mens niet menen dat hij iets ontvangen zal van de Heere. Een dubbelhartig man is onstandvastig in al zijn wegen.", "1 Kor 7:21-24": "Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever. Want wie in de Heere geroepen is als dienstknecht, is een vrijgelatene van de Heere; net zo ook, wie vrij zijnde geroepen is, is een dienstknecht van Christus. U bent duur gekocht, word geen dienstknechten van mensen.", "Spr 29:5": "Een man die zijn naaste vleit, spreidt een net uit voor diens voeten.", "Spr 20:3": "Het is eer voor een man, om van twist af te blijven; maar iedere dwaas zal zich erin mengen.", "Mark 4:19": "en de zorgen van deze wereld, en de verleiding van de rijkdom, en de begeerten naar de andere dingen komen binnen en verstikken het Woord, en het wordt onvruchtbaar.", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Matt 23:29-31": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u bouwt de graven van de profeten op, en versiert de graftekens van de rechtvaardigen; en zegt: Als wij in de tijden van onze vaderen hadden geleefd, zouden wij geen deel met hen gehad hebben aan het bloed van de profeten. Zo getuigt u tegen uzelf, dat u kinderen bent van hen die de profeten gedood hebben.", "Ps 127:5": "Gelukkig is de man die zijn pijlkoker ermee gevuld heeft; zij zullen niet beschaamd worden als zij met de vijanden spreken zullen in de poort.", "1 Kor 3:18": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.", "Job 13:3": "Maar ik wil tot de Almachtige spreken, en ik ben erop belust mij te verdedigen voor God.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Rom 12:18": "Als het mogelijk is, houd voor zover het van u afhangt vrede met alle mensen.", "Matt 25:21": "En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.", "Pred 12:1": "Denk aan uw Schepper in de dagen van uw jeugd, voordat de kwade dagen komen en de jaren naderen waarvan u zult zeggen: Ik heb er geen vreugde in.", "Dan 3:19": "Toen werd Nebukadnezar vervuld van woede, en de uitdrukking van zijn gezicht veranderde tegen Sadrach, Mesach en Abed-nego; hij antwoordde en zei, dat men de oven zeven keer heter moest maken dan men die gewoonlijk heet maakte.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "Spr 24:6": "Want door wijze raadslagen zult u voor u de oorlog voeren, en in de veelheid van raadgevers is de overwinning.", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "Gal 4:16": "Ben ik dan uw vijand geworden, doordat ik u de waarheid vertel?", "Ps 62:5": "Zij overleggen slechts om hem van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.", "Luk 18:18-25": "En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God. U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Job 33:9": "Ik ben rein, zonder overtreding; ik ben zuiver, en heb geen misdaad.", "Spr 23:4": "Vermoei u niet om rijk te worden; zie af van uw eigen vernuft.", "2 Kor 2:16": "voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam?", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "Filem 1:19": "Ik, Paulus, heb het geschreven met mijn eigen hand, ik zal het betalen; opdat ik u niet zeg dat u ook uzelf aan mij schuldig bent.", "Lev 19:9": "Als u ook de oogst van uw land inoogst, zult u de hoek van uw veld niet helemaal afoogsten, en wat van uw oogst is blijven liggen, niet opzamelen.", "Gen 34:26": "Zij sloegen ook Hemor en zijn zoon Sichem dood met de scherpte van het zwaard; en zij namen Dina uit Sichems huis en gingen vandaar weg.", "Ps 90:6": "In de morgenstond bloeit het, en het verandert; 's avonds wordt het afgesneden, en het verdort.", "Ps 4:7": "Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "Spr 31:28": "Koph. Haar kinderen staan op, en prijzen haar gelukkig; ook haar man, en hij prijst haar, en zegt:", "Spr 19:28": "Een getuige van Belial bespot het recht; en de mond van de goddelozen slokt de ongerechtigheid in.", "Spr 7:17": "Ik heb mijn bed met mirre, aloë en kaneel geurig gemaakt;", "Ps 49:17": "Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt;", "Hos 7:8": "Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Ezech 35:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE: Ik zal ook handelen naar uw toorn en naar uw jaloezie, die u uit uw haat tegen hen hebt uitgevoerd; en Ik zal Mij aan hen bekendmaken, wanneer Ik u geoordeeld zal hebben.", "Rom 8:24-26": "Want wij zijn in hoop gered. De hoop nu, die gezien wordt, is geen hoop; want wat iemand ziet, waarom zou hij dat nog hopen? Maar als wij hopen wat wij niet zien, dan verwachten wij het met volharding. En evenzo komt ook de Geest onze zwakheden te hulp; want wij weten niet wat wij bidden moeten zoals het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchten.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Spr 19:9": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal vergaan.", "Ps 120:2-4": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong. Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen? Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Hand 13:10": "O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Spr 24:32": "Toen ik dat aanschouwde, nam ik het ter harte; ik zag het, en nam onderwijzing aan;", "Ps 37:12": "Zain. De goddeloze bedenkt listige plannen tegen de rechtvaardige, en knerst met zijn tanden over hem.", "Spr 2:1-22": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "1 Kon 22:6": "Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven.", "2 Sam 15:6-12": "En op die manier deed Absalom met heel Israël, die tot de koning kwamen voor een rechtszaak. Zo stal Absalom het hart van de mannen van Israël. Aan het einde van veertig jaren gebeurde het dat Absalom tegen de koning zei: Laat mij toch gaan, en mijn gelofte, die ik de HEERE beloofd heb, te Hebron inlossen. Want uw knecht heeft een gelofte gedaan, toen ik te Gesur in Syrië woonde, en zei: Als de HEERE mij werkelijk terug naar Jeruzalem zal brengen, dan zal ik de HEERE dienen.", "Ps 7:15-17": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren. Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft. Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "1 Kor 3:12": "En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Gen 24:31": "En hij zei: Kom binnen, gezegende van de HEERE! Waarom zou u buiten blijven staan? Want ik heb het huis gereedgemaakt, en de plaats voor de kamelen.", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Job 13:28": "En hij vergaat als een verrotting, als een kleed dat de mot opeet.", "Ps 21:7": "Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht.", "Luk 12:43": "Zalig is die dienstknecht, die zijn heer, als hij komt, zo bezig zal vinden.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "2 Kor 12:14": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.", "Matt 19:16-29": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Rom 11:18": "Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u.", "Spr 14:15": "De onnozele gelooft elk woord; maar de kloekzinnige let goed op zijn gang.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Pred 1:8": "Al deze dingen maken zo moe, dat niemand het zou kunnen uitspreken; het oog wordt niet verzadigd van zien, en het oor wordt niet vervuld van horen.", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Spr 19:19": "Die groot is van grimmigheid, zal straf dragen; want als u hem redt, zult u het nog moeten herhalen.", "Kol 3:9": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan,", "Jes 58:4": "Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Deut 5:13": "Zes dagen zult u arbeiden en al uw werk doen;", "Deut 1:12": "Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen?", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Spr 10:8": "Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Pred 6:1": "Er is een kwaad dat ik gezien heb onder de zon, en het komt veel voor onder de mensen:", "Est 3:6": "Doch hij vond het beneden zich om alleen aan Mordechai de hand te slaan (want men had hem het volk van Mordechai aangewezen); maar Haman zocht alle Joden die in het hele koninkrijk
