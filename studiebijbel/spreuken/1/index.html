"De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.","8":"Mijn zoon! hoor de tucht van uw vader, en verlaat de leer van uw moeder niet;","9":"Want zij zullen uw hoofd een aangenaam toevoegsel zijn, en ketenen aan uw hals.","10":"Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;","11":"Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak;","12":"Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;","13":"Alle kostelijk goed zullen wij vinden, onze huizen zullen wij met roof vullen.","14":"U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.","15":"Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.","16":"Want hun voeten lopen tot het kwade; en zij haasten zich om bloed te storten.","17":"Zeker, het net wordt tevergeefs gespreid voor de ogen van allerlei gevogelte;","18":"En deze loeren op hun eigen bloed, en verstoppen zich tegen hun eigen leven.","19":"Zo zijn de paden van ieder die hebzucht pleegt; zij zal het leven van haar meester wegnemen.","20":"De opperste Wijsheid roept overluid daarbuiten; Zij verheft Haar stem op de straten.","21":"Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;","22":"U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?","23":"Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.","24":"Omdat Ik geroepen heb, en u geweigerd hebt; Mijn hand uitgestrekt heb, en er niemand was die opmerkte;","25":"En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt;","26":"Zo zal Ik ook in uw verderf lachen; Ik zal spotten, wanneer uw vrees komt.","27":"Wanneer uw vrees komt als een verwoesting, en uw verderf aankomt als een wervelwind; wanneer benauwdheid en angst u overkomt;","28":"Dan zullen zij tot Mij roepen, maar Ik zal niet antwoorden; zij zullen Mij vroeg zoeken, maar zullen Mij niet vinden;","29":"Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.","30":"Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;","31":"Zo zullen zij eten van de vrucht van hun weg, en zich verzadigen met hun eigen plannen.","32":"Want de afkering van de eenvoudigen zal hen doden, en de voorspoed van de dwazen zal hen te gronde richten.","33":"Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vrees voor het kwaad."},"SV":{"1":"De spreuken van Salomo, den zoon van David, den koning van Israël,","2":"Om wijsheid en tucht te weten; om te verstaan redenen des verstands;","3":"Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en billijkheden;","4":"Om den slechten kloekzinnigheid te geven, den jongeling wetenschap en bedachtzaamheid.","5":"Die wijs *is*, zal horen, en zal in lere toenemen; en die verstandig *is* , zal wijzen raad bekomen;","6":"Om te verstaan een spreuk en de uitlegging, de woorden der wijzen en hun raadselen.","7":"De vrees des HEEREN is het beginsel der wetenschap; de dwazen verachten wijsheid en tucht.","8":"Mijn zoon! hoor de tucht uws vaders, en verlaat de leer uwer moeder niet;","9":"Want zij *zullen* uw hoofd een aangenaam toevoegsel *zijn*, en ketenen aan uw hals.","10":"Mijn zoon! indien de zondaars u aanlokken, bewillig niet;","11":"Indien zij zeggen: Ga met ons, laat ons loeren op bloed, ons versteken tegen den onschuldige, zonder oorzaak;","12":"Laat ons hen levend verslinden, als het graf; ja, geheel en al, gelijk die in den kuil nederdalen;","13":"Alle kostelijk goed zullen wij vinden, onze huizen zullen wij met roof vullen.","14":"Gij zult uw lot midden onder ons werpen; wij zullen allen een buidel hebben.","15":"Mijn zoon! wandel niet met hen op den weg; weer uw voet van hun pad.","16":"Want hun voeten lopen ten boze; en zij haasten zich om bloed te storten.","17":"Zekerlijk, het net wordt tevergeefs gespreid voor de ogen van allerlei gevogelte;","18":"En deze loeren op hun *eigen* bloed, en versteken zich tegen hun zielen.","19":"Zo zijn de paden van een iegelijk, die gierigheid pleegt; zij zal de ziel van haar meester vangen.","20":"De opperste Wijsheid roept overluid daarbuiten; Zij verheft Haar stem op de straten.","21":"Zij roept in het voorste der woelingen; aan de deuren der poorten spreekt Zij Haar redenen in de stad;","22":"Gij slechten! hoe lang zult gij de slechtigheid beminnen, en de spotters voor zich de spotternij begeren, en de zotten wetenschap haten?","23":"Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest ulieden overvloediglijk uitstorten; Ik zal Mijn woorden u bekend maken.","24":"Dewijl Ik geroepen heb, en gijlieden geweigerd hebt; Mijn hand uitgestrekt heb, en er niemand was, die opmerkte;","25":"En gij al Mijn raad verworpen, en Mijn bestraffing niet gewild hebt;","26":"Zo zal Ik ook in ulieder verderf lachen; Ik zal spotten, wanneer uw vreze komt.","27":"Wanneer uw vreze komt gelijk een verwoesting, en uw verderf aankomt als een wervelwind; wanneer u benauwdheid en angst overkomt;","28":"Dan zullen zij tot Mij roepen, maar Ik zal niet antwoorden; zij zullen Mij vroeg zoeken, maar zullen Mij niet vinden;","29":"Daarom, dat zij de wetenschap gehaat hebben, en de vreze des HEEREN niet hebben verkoren.","30":"Zij hebben in Mijn raad niet bewilligd; al Mijn bestraffingen hebben zij versmaad;","31":"Zo zullen zij eten van de vrucht van hun weg, en zich verzadigen met hun raadslagen.","32":"Want de afkering der slechten zal hen doden, en de voorspoed der zotten zal hen verderven.","33":"Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vreze des kwaads."},"KJV":{"1":"The proverbs of Solomon the son of David, king of Israel;","2":"To know wisdom and instruction; to perceive the words of understanding;","3":"To receive the instruction of wisdom, justice, and judgment, and equity;","4":"To give subtilty to the simple, to the young man knowledge and discretion.","5":"A wise *man* will hear, and will increase learning; and a man of understanding shall attain unto wise counsels:","6":"To understand a proverb, and the interpretation; the words of the wise, and their dark sayings.","7":"The fear of the LORD *is* the beginning of knowledge: *but* fools despise wisdom and instruction.","8":"My son, hear the instruction of thy father, and forsake not the law of thy mother:","9":"For they *shall be* an ornament of grace unto thy head, and chains about thy neck.","10":"My son, if sinners entice thee, consent","11":"If they say, Come with us, let us lay wait for blood, let us lurk privily for the innocent without cause:","12":"Let us swallow them up alive as the grave; and whole, as those that go down into the pit:","13":"We shall find all precious substance, we shall fill our houses with spoil:","14":"Cast in thy lot among us; let us all have one purse:","15":"My son, walk not thou in the way with them; refrain thy foot from their path:","16":"For their feet run to evil, and make haste to shed blood.","17":"Surely in vain the net is spread in the sight of any bird.","18":"And they lay wait for their *own* blood; they lurk privily for their *own* lives.","19":"So *are* the ways of every one that is greedy of gain; *which* taketh away the life of the owners","20":"Wisdom crieth without; she uttereth her voice in the streets:","21":"She crieth in the chief place of concourse, in the openings of the gates: in the city she uttereth her words,","22":"How long, ye simple ones, will ye love simplicity? and the scorners delight in their scorning, and fools hate knowledge?","23":"Turn you at my reproof: behold, I will pour out my spirit unto you, I will make known my words","24":"Because I have called, and ye refused; I have stretched out my hand, and no man regarded;","25":"But ye have set at nought all my counsel, and would none of my reproof:","26":"I also will laugh at your calamity; I will mock when your fear cometh;","27":"When your fear cometh as desolation, and your destruction cometh as a whirlwind; when distress and anguish cometh","28":"Then shall they call upon me, but I will not answer; they shall seek me early, but they shall not find","29":"For that they hated knowledge, and did not choose the fear of the LORD:","30":"They would none of my counsel: they despised all my reproof.","31":"Therefore shall they eat of the fruit of their own way, and be filled with their own devices.","32":"For the turning away of the simple shall slay them, and the prosperity of fools shall destroy","33":"But whoso hearkeneth unto me shall dwell safely, and shall be quiet from fear of evil."}},"tsk":{"1":[{"kopje":"spreuken","refs":["Spr 10:1","Spr 25:1","1 Kon 4:31","1 Kon 4:32","Pred 12:9","Joh 16:25"]},{"kopje":"Salomo","refs":["2 Sam 12:24","2 Sam 12:25","1 Kon 2:12","1 Kron 22:9","1 Kron 28:5","1 Kron 29:28"]}],"3":[{"kopje":"aan te nemen","refs":["Spr 2:1-9","Spr 8:10","Spr 8:11","Job 22:22"]},{"kopje":"recht","refs":["1 Kon 3:28"]}],"4":[{"kopje":"kloekzinnigheid","refs":["Spr 1:22","Spr 1:23","Spr 8:5","Spr 9:4-6","Ps 19:8","Ps 119:130","Jes 35:8"]},{"kopje":"de jongeling","refs":["Spr 7:7-24","Spr 8:17","Spr 8:32","Ps 34:12","Ps 119:9","Pred 11:9","Pred 11:10","Pred 12:1","2 Tim 2:22","Tit 2:6"]}],"5":[{"kopje":"wijs","refs":["Spr 9:9","Spr 12:1","Job 34:10","Job 34:16","Job 34:34","Ps 119:98-100","1 Kor 10:15"]},{"kopje":"die verstandig is","refs":["1 Sam 25:32","1 Sam 25:33","2 Kron 25:16"]}],"6":[{"kopje":"een spreuk","refs":["Matt 13:10-17","Matt 13:51","Matt 13:52","Mark 4:11","Mark 4:34","Hand 8:30","Hand 8:31"]},{"kopje":"de woorden","refs":["Pred 12:11"]},{"kopje":"raadsels","refs":["Ps 49:5","Ps 78:2","Matt 13:34","Matt 13:35","Hebr 5:14","2 Petr 3:16"]}],"7":[{"kopje":"vrees","refs":["Spr 9:10","Job 28:28","Ps 111 1004\">houses</span> with spoil:","14":"<span class=\"wl wl-kjv\" data-code=\"H5307\">Cast</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> us; let us all have <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> purse:","15":"My <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> not thou in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> with them; <span class=\"wl wl-kjv\" data-code=\"H4513\">refrain</span> thy <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> from their path:","16":"For their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and make <span class=\"wl wl-kjv\" data-code=\"H4116\">haste</span> to <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> blood.","17":"Surely in <span class=\"wl wl-kjv\" data-code=\"H2600\">vain</span> the <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> is <span class=\"wl wl-kjv\" data-code=\"H2219\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of any <span class=\"wl wl-kjv\" data-code=\"H1167\">bird.</span>","18":"And they lay <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> for their own <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> they lurk <span class=\"wl wl-kjv\" data-code=\"H6845\">privily</span> for their own lives.","19":"So are the <span class=\"wl wl-kjv\" data-code=\"H734\">ways</span> of every one that is <span class=\"wl wl-kjv\" data-code=\"H1214\">greedy</span> of <span class=\"wl wl-kjv\" data-code=\"H1215\">gain;</span> which taketh <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of the owners","20":"<span class=\"wl wl-kjv\" data-code=\"H2454\">Wisdom</span> <span class=\"wl wl-kjv\" data-code=\"H7442\">crieth</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without;</span> she <span class=\"wl wl-kjv\" data-code=\"H5414\">uttereth</span> her <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> in the streets:","21":"She <span class=\"wl wl-kjv\" data-code=\"H7121\">crieth</span> in the chief <span class=\"wl wl-kjv\" data-code=\"H7218\">place</span> of <span class=\"wl wl-kjv\" data-code=\"H1993\">concourse,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">openings</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates:</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> she <span class=\"wl wl-kjv\" data-code=\"H559\">uttereth</span> her words,","22":"How long, ye simple <span class=\"wl wl-kjv\" data-code=\"H6612\">ones,</span> will ye <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> <span class=\"wl wl-kjv\" data-code=\"H6612\">simplicity?</span> and the <span class=\"wl wl-kjv\" data-code=\"H3887\">scorners</span> <span class=\"wl wl-kjv\" data-code=\"H2530\">delight</span> in their <span class=\"wl wl-kjv\" data-code=\"H3944\">scorning,</span> and <span class=\"wl wl-kjv\" data-code=\"H3684\">fools</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> knowledge?","23":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Turn</span> you at my <span class=\"wl wl-kjv\" data-code=\"H8433\">reproof:</span> behold, I will pour <span class=\"wl wl-kjv\" data-code=\"H5042\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> unto you, I will make <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> my words","24":"Because I have <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3985\">refused;</span> I have stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and no man regarded;","25":"But ye have set at <span class=\"wl wl-kjv\" data-code=\"H6544\">nought</span> all my <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel,</span> and <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> none of my reproof:","26":"I also will <span class=\"wl wl-kjv\" data-code=\"H7832\">laugh</span> at your <span class=\"wl wl-kjv\" data-code=\"H343\">calamity;</span> I will <span class=\"wl wl-kjv\" data-code=\"H3932\">mock</span> when your <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> cometh;","27":"When your <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> as <span class=\"wl wl-kjv\" data-code=\"H7722\">desolation,</span> and your <span class=\"wl wl-kjv\" data-code=\"H343\">destruction</span> <span class=\"wl wl-kjv\" data-code=\"H857\">cometh</span> as a <span class=\"wl wl-kjv\" data-code=\"H5492\">whirlwind;</span> when <span class=\"wl wl-kjv\" data-code=\"H6869\">distress</span> and <span class=\"wl wl-kjv\" data-code=\"H6695\">anguish</span> cometh","28":"Then shall they <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> upon me, but I will not <span class=\"wl wl-kjv\" data-code=\"H6030\">answer;</span> they shall seek me <span class=\"wl wl-kjv\" data-code=\"H7836\">early,</span> but they shall not find","29":"For that they <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and did not <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of the LORD:","30":"They <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> none of my <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel:</span> they <span class=\"wl wl-kjv\" data-code=\"H5006\">despised</span> all my reproof.","31":"Therefore shall they <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of their own <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> with their own devices.","32":"For the turning <span class=\"wl wl-kjv\" data-code=\"H4878\">away</span> of the <span class=\"wl wl-kjv\" data-code=\"H6612\">simple</span> shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> them, and the <span class=\"wl wl-kjv\" data-code=\"H7962\">prosperity</span> of <span class=\"wl wl-kjv\" data-code=\"H3684\">fools</span> shall destroy","33":"But whoso <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkeneth</span> unto me shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H983\">safely,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H7599\">quiet</span> from <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of evil."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"spreuken van Sálomo,","tekst":"Zie van het Hebreeuwse woord 1Ki 4:32 ."}],"2":[{"catchword":"wijsheid","tekst":"Versta een vaste en grondige kennis van goddelijke en menselijke dingen, om zichzelven in geloof en leven wel te schikken. Vergelijk 1Ki 3:12 ."},{"catchword":"tucht","tekst":"Versta, het onderwijs, dat gegeven wordt om tot de wijsheid te geraken."},{"catchword":"redenen","tekst":"Of, redenen, die verstandiglijk voorgesteld zijn."},{"catchword":"des verstands;","tekst":"Dit houdt men te zijn de kloekheid en voorzichtigheid des geestes, waardoor de wijsheid tot het rechte gebruik wel wordt aangelegd. Vergelijk 1Ki 3:12 ."}],"3":[{"catchword":"goed verstand,","tekst":"Te weten, waardoor men kloekzinnig, wijs, vernuftig en voorzichtig kan worden in al hetgeen de mens in zijn doen of laten zou mogen voorvallen. Vergelijk onder, Pro 3:4 , en Pro 13:15 , en Pro 21:16 ."},{"catchword":"gerechtigheid,","tekst":"Versta, den gansen plicht, die wij God en onzen naasten schuldig zijn, naar uitwijzen van de eerste en tweede tafel."},{"catchword":"recht,","tekst":"Te weten, waardoor wij tegen onzen naaste doen wat wij schuldig zijn, achtervolgens het voorschrift van de tweede tafel eigenlijk."},{"catchword":"billijkheden;","tekst":"Die onderhouden moeten zijn in alle samenhandelingen en verschillen der mensen, naar den aard der liefde en den eis der zaak."}],"4":[{"catchword":"slechten","tekst":"Dit woord is somtijds in het kwade genomen voor degenen, die door hunne domheid lichtelijk geloven, zich lichtelijk laten omzetten en van het goede verleiden. Zie Job 5:2 . Alzo onder vs.22,23, en Pro 7:7 , en Pro 8:5 , en Pro 14:15 , Pro 14:18 . Somtijds is het Hebreeuwse woord in het goede genomen voor degenen, die leerzaam, onnozel, eenvoudig en rechtuit zijn, en lichtelijk van de bozen bedrogen en beschadigd zouden worden, tenware dat God op wien zij vertrouwen, hen gelijk een vader bewaarde; Psa 19:8 , en Psa 116:6 , onder, Pro 19:25 ; Mat 10:16 ."},{"catchword":"kloekzinnigheid","tekst":"Dit woord is hier in het goede genomen voor een kloek, wakker, fijn en scherp verstand, gelijk onder Pro 8:5 , Pro 8:12 , en Pro 19:25 . Elders is het genomen in het kwade voor arglistigheid en snode schalkheid, gelijk Exo 21:14 ; Jos 9:4 ; Job 5:12 , en Job 15:5 ."},{"catchword":"jongeling","tekst":"Zo in jaren als in verstand."},{"catchword":"wetenschap","tekst":"Versta, niet een blote kennis der dingen, die men weten moet, maar ook de redenen daarvan."},{"catchword":"bedachtzaamheid","tekst":"Dat is, een kloek en vernuftig bedenken, verenigd met zonderlinge voorzichtigheid. Alzo onder Pro 2:11 , en Pro 3:21 . Zie de aantekening Job 21:27 ."}],"5":[{"catchword":"in leer toenemen;","tekst":"Zie van het Hebreeuwse woord, overgezet leer, Job 11:4 . Of, zal geleerdheid vermeerderen, of in begrip toenemen. Vergelijk onder Pro 9:9 . Hebreeuws eigenlijk, leer toedoen."},{"catchword":"wijzen raad","tekst":"Hebreeuws, wijze reden, in het getal van velen. Zie van dit woord Job 37:12 ."}],"6":[{"catchword":"spreuk","tekst":"Zie boven, vs.1."},{"catchword":"de uitlegging,","tekst":"Te weten, van die spreuk. Anders: kunstige redenen; dat is, bekwame welsprekendheid om zijn woord wel te doen."},{"catchword":"raadselen","tekst":"Dat is, redenen, die een verborgen en diepen zin hebben. Zie Jdg 14:12 , en 1Ki 10:1 ."}],"7":[{"catchword":"beginsel","tekst":"Dat is, de grondslag en het fondament der ware wijsheid; te weten, om die te volle te verkrijgen; even gelijk in het bouwen van een huis het fondament het begin is van de overige bouwing, om die te voltrekken; zie Psa 111:10 ."},{"catchword":"de dwazen","tekst":"Versta door dezen meest de mensen, die, vele vals gevoelens ingedronken hebbende, den rechten weg der wijsheid en der vreze Gods niet volgen. Zie Job 5:2 ."}],"8":[{"catchword":"Mijn zoon","tekst":"Alzo noemt Salomo degenen, die zijne lering horen of lezen, om aan te tonen niet alleen, dat hij haar met een vaderlijk gemoed voortbrengt, maar ook dat zij die met een kinderlijke en gans gehoorzame toegenegenheid behoren te ontvangen. Alzo onder vs.10, 15, en Pro 2:1 , en Pro 3:1 , enz. vergelijk Jdg 17:10 ; 1Ki 20:35 , en 2Ki 2:12 ; Psa 34:12 ."},{"catchword":"de leer","tekst":"Of, wet, of onderwijzing. Alzo onder Pro 3:3 , en Pro 4:2 , en Pro 6:20 , Pro 6:23 , en Pro 7:2 ."}],"9":[{"catchword":"een aangenaam","tekst":"Hebreeuws, een toevoegsel der aangenaamheid; dat is, hetwelk u aangenaam en aanzienlijk maken zal. Alzo onder Pro 4:9 ."},{"catchword":"hals","tekst":"Hebreeuws, gorgel."}],"10":[{"catchword":"de zondaars","tekst":"Versta, grove en onbekeerde zondaars. Zie 1Sa 15:18 ."},{"catchword":"aanlokken,","tekst":"Of, verleiden willen; dat is, met schone woorden zullen zoeken te bepraten en te vervoeren; zie van het Hebreeuwse woord Jdg 14:15 ."}],"11":[{"catchword":"loeren op bloed,","tekst":"Te weten, om dat met doodslaan en moorden te vergieten; bloed, voor doodslag; zie Gen 37:26 ."},{"catchword":"versteken","tekst":"Dat is, lagen en leggen. Alzo Psa 56:7 , en onder vs.18."},{"catchword":"zonder oorzaak;","tekst":"Dat is, zonder dat hij het verdiend heeft. Alzo Psa 35:7 ."}],"12":[{"catchword":"levend verslinden,","tekst":"Dat is, zonder barmhartigheid; vergelijk Psa 124:3 ."},{"catchword":"als het graf;","tekst":"Dat is, gelijk het graf de dode lichamen verslindt. Vergelijk onder, Pro 27:20 , en Pro 30:16 ."},{"catchword":"die in den kuil","tekst":"Hebreeuws, de nederdalende des kuils. Alzo Gen 23:10 ; de ingangers zijner stadspoort; dat is, die de poort zijner stad ingingen, Psa 78:9 ; schutters van de boog; dat is, die met den boog schieten."}],"14":[{"catchword":"uw lot","tekst":"Dat is, den buit met ons helpen delen, hetwelk gemeenlijk geschiedt met loting, als ieder zijn deel daaruit begeert te trekken."},{"catchword":"wij zullen allen","tekst":"Dat is, allen roof zullen wij gemeen hebben en onder ons delen."}],"15":[{"catchword":"wandel","tekst":"Dat is, houd met hen gene gemeenschap, of verkeer niet met hen. Vergelijk de manier van spreken met 1Sa 25:15 ; Psa 1:1 ."},{"catchword":"voet","tekst":"Dat is, ga niet met hen in hun kwade wegen. Voorts kan men hierdoor verstaan aandoeningen, genegenheden, bewegingen; want gelijk de voeten het lichaam herwaarts en gindswaarts dragen, alzo wordt de geest des mensen door de genegenheden tot velerlei voornemen en werk gedreven. Vergelijk onder vs.16, en Pro 5:5 , en Pro 6:18 , enz."}],"16":[{"catchword":"ten boze;","tekst":"Dat is, om iemand kwaad of schade te doen."}],"17":[{"catchword":"het net","tekst":"De zin is: Gelijk een vogel tevergeefs het net uitgespannen ziet, overmits hij daarop niet let, maar zijne ogen alleen heeft op het aas, waarop hij vallende gevangen wordt, alzo letten de boosdoeners niet op het gevaar, waarin zij zichzelven steken, als zij om enig tijdelijk voordeel hunnen naaste beschadigen, maar vallen in de handen van de overheid, die hen naar hunne verdiensten straft, of worden van God anderszins geplaagd."},{"catchword":"tevergeefs","tekst":"Welverstaande, ten aanzien van het gevogelte, overmits het door de uitspanning van het net niet gewaarschuwd wordt van het gevaar, maar wordt door een gretigen lust alleen tot het aas gedreven. Sommigen duiden dit alzo, dat de vogels, als zij het net zien spreiden, daardoor gewaarschuwd worden en wegvliegen; maar dat de goddelozen zo dom zijn, dat zij hun eigen net bereiden, waarin zij gevangen zullen worden."},{"catchword":"allerlei","tekst":"Hebreeuws, van allen heer des vleugels; dat is, van allerlei gevogelte; of al wat vleugels heeft. Zie Gen 14:13 ."}],"18":[{"catchword":"loeren","tekst":"Te weten, zij, van welken gesproken is boven Pro 15:16 . De zin is dat zij hun eigen leven in het verderf brengen, mits te staan naar het leven van een ander. Vergelijk onder, Pro 8:36 , en de aantekening."},{"catchword":"versteken","tekst":"Zie boven vs.11."}],"19":[{"catchword":"paden","tekst":"Dat is, voornemen, daden en werken. Vergelijk Gen 6:12 , idem onder Pro 2:15 , en Pro 22:25 ."},{"catchword":"gierigheid","tekst":"Hebreeuws, gierigheid giert, of met gierigheid giert. Alzo onder Pro 15:27 ; Jer 6:13 ; Eze 22:27 ;; Hab 2:9 . Het Hebreeuwse woord is meest altijd in het kwade genomen voor vuil, gierig en oneerlijk gewin. Zie Gen 37:26 ; Exo 18:21 ; 1Sa 8:3 ; Psa 119:36 , onder Pro 28:16 ; Isa 56:11 ."},{"catchword":"zij zal de ziel","tekst":"Te weten, de gierigheid."},{"catchword":"haar meester","tekst":"Dat is, degene, die de gierigheid plegen. Zie van het woord Baäl, Gen 14:13 ."},{"catchword":"vangen","tekst":"Dat is, in het verderf brengen, gelijk een vogel doet het aas, daar hij naar vliegt, gevangen wordt en aan zijn dood komt."}],"20":[{"catchword":"opperste Wijsheid","tekst":"Hebreeuws, wijsheden; in het getal van velen, dat is, de hoogste, uitnemendste, of opperste wijsheid. Alzo onder Pro 9:1 , en Psa 49:4 , alzo wordt Job 40:10 een groot beest genoemd behemoth, dat is beesten, in het getal van velen. Dit geschiedt om enige zaken te vergroten, of te vermenigvuldigen. Anders: elke wijsheid, of menigerlei wijsheid, of [wijsheid] der wijsheden. Men kan hier door deze wijsheid verstaan, òf de wezenlijke wijsheid des Vaders, welke is de Zoon Gods, daarvan zie onder Pro 8 , òf de wijsheid begrepen in de Heilige Schrift, die alle wijsheid der mensen teboven gaat. Sommigen verstaan de wijsheid, die door Gods Woord en de werken der Goddelijke voorzienigheid geopenbaard wordt."},{"catchword":"roept","tekst":"Te weten, door de predikers van Gods Woord, of ook door de werken der schepping en regering aller dingen."},{"catchword":"verheft","tekst":"Hebreeuws, geeft, dat is, zij verheft hare stem en laat ze horen. Alzo Gen 45:2 , onder Pro 2:3 , en Pro 8:1 ."}],"21":[{"catchword":"in het voorste","tekst":"Hebreeuws, in het hoofd der woelingen. Versta, de plaatsen waar grote vergadering is van volk, en waarin ook veel gewoels."},{"catchword":"der poorten","tekst":"Waar het gericht gehouden werd, en dus grote bijeenkomst van volk was. Zie Gen 22:17 ."},{"catchword":"stad;","tekst":"Versta, elke stad van het land Israëls."}],"22":[{"catchword":"Gij slechten","tekst":"Dit zijn de woorden der wijsheid, die Salomo aldus sprekende invoert. Van het woord slechten, zie boven vs.4."},{"catchword":"de spotters","tekst":"Zie Psa 1:1 ."},{"catchword":"zotten","tekst":"Versta, niet narren en zinnelozen, die het redelijk gebruik van het menselijke verstand niet hebben, maar die beroofd zijn van de ware wijsheid, ten eeuwigen leven leidende, noch genegen zijn daarnaar te trachten, maar alleen met dit tijdelijke leven zich bekommeren."}],"23":[{"catchword":"Keert u","tekst":"Te weten, om dit aan te horen en na te volgen. Anders: bekeert u op mijne bestraffing; dat is, doet boete en betert u door kracht van mijne bestraffing. Versta, ene bestraffing, welke geschiedt door woorden van onderwijzing en vermaning. Alzo onder vs.25, 30."},{"catchword":"Mijn Geest","tekst":"Dat is, de kennis van mijn zin en wil. Zie het woord geest zeer in gelijken zin, dat is voor de gave des verstands genomen; Psa 76:13 , onder Pro 29:11 ; Joe 2:28 ."},{"catchword":"uitstorten;","tekst":"Eene manier van spreken, genomen van de fonteinen, uit welke het water met groten overvloed voortspringt. Zie van het Hebreeuwse woord Psa 19:3 . Het wordt gebruikt in het goede, gelijk hier en in de voorgemelde plaats; en in het kwade, gelijk onder Pro 15:2 , Pro 15:28 ."}],"24":[{"catchword":"uitgestrekt","tekst":"Te weten, om u tot bekering te nodigen. Zie gelijke wijze van spreken Isa 65:2 ."}],"25":[{"catchword":"verworpen,","tekst":"Het Hebreeuwse woord is in gelijken zin genomen, onder Pro 4:15 , en Pro 8:33 , en Pro 13:18 , en Pro 15:32 . Andres: Hebt [u van] mijn raad onttrokken, of ontbloot. Anders: Hebt mijn raad doen ophouden."}],"26":[{"catchword":"vreze","tekst":"Dat is, het kwaad en ongeluk, waarin gij zeer bevreesd en verslagen zult zijn, of waar gij voor vreest. Alzo in vs.27; zie Job 39:25 ."}],"27":[{"catchword":"verwoesting,","tekst":"Die zich wijd en breed met groot geruisch uitspreidt en geweldige schade doet. Zie van deze gelijkenis ook Psa 35:8 , en de aantekening onder Pro 3:25 ; Isa 10:3 , en Isa 47:11 ."},{"catchword":"als een wervelwind;","tekst":"Dat is, zeer snellijk, schrikkelijk en geweldiglijk. Zie van zulk ene gelijkenis ook Job 9:17 ."}],"28":[{"catchword":"vroeg zoeken,","tekst":"Dat is, met grote zorg en vlijtigheid zoeken. Zie Job 8:5 ."}],"29":[{"catchword":"de wetenschap","tekst":"Zie boven vs.4."}],"31":[{"catchword":"Zo zullen zij","tekst":"Of, daarom zullen zij eten, enz."},{"catchword":"eten","tekst":"Dat is, ontvangen en verkrijgen de straf of vergelding van hun boze werken. Zie Job 21:25 ."},{"catchword":"vrucht","tekst":"Dit woord is genomen voor allerlei kwaad of goed, dat ergens uit voortkomt; voor het kwaad, gelijk vs.31, Isa 10:12 ; Jer 6:19 ; Mic 7:13 ; Luk 6:43 ; voor het goed, onder Pro 8:19 , en Pro 31:31 ; Amo 6:12 ; Gal 5:22 ; Phi 1:11 ."},{"catchword":"zich verzadigen","tekst":"Dat is, een verdrietigen overvloed van plagen over zich brengen, veroorzaakt door hun ongezeggelijke en hardnekkige zinnen. Zie van deze manier van spreken Job 7:4 , en de aantekening."}],"32":[{"catchword":"afkering","tekst":"Te weten, waardoor zij zich afwenden van de lering en vermaning der wijsheid."},{"catchword":"zal hen doden,","tekst":"Te weten, de slechten; hetwelk geschiedt door middel van de overheid, of andere middelen en van God zelf."},{"catchword":"voorspoed","tekst":"Versta, die zij of andere bozen menigmaal in dit leven hebben, waardoor zij in hunne afwijking gestijfd worden."}],"33":[{"catchword":"zeker wonen,","tekst":"Hebreeuws, in, of met zekerheid; dat is, niet alleen zonder kwade bejegening, maar ook zonder vrees daarvan. Dezelfde manier van spreken is Lev 25:18 ; Deu 33:12 ; Isa 47:8 ; Jer 23:6 ; Eze 39:26 , enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Proverbs, [See the Hebrew word, 1 King.4.on verse 32.] of Salomon the son of David King of Israel:"}],"2":[{"catchword":null,"tekst":"To know wisdom, [Meaning a sure and grounded knowledge of Divine and Humane things how to order ones self aright, both in matter of faith and life. Compare 1 King 3.on verse 14.] and discipline; [meaning the instruction which is given, to attain unto wisdom] to understand the saying of understanding; [or, the words, or sayings, that are understandingly propounded. This understanding here spoken of is held to be the wisdom and prudence of the spirit, whereby wisdom is well managed, and employed to the right use or end. Compare 1 Kings 3.on verse 12.]"}],"3":[{"catchword":null,"tekst":"To receive the instruction of good understanding; [To wit, whereby a man be come judicious, wise, intelligent, and prudent in all that may befall him, concerning below, Chapter 3.4. and 13.15. and chapter 21.16.] Justice, [understand hereby, the whole duty which we owe unto God, and our neighbour according to the direction of the first and second Table] and Right, [to wit, whereby we do and perform unto our neighbour, that which we are bound to do and perform unto him, according to the prescript and direction of the second Table properly] and Equities. [which must be upheld and kept in all dealings and differences with men according to the nature of love, and according as the thing it self requireth.]"}],"4":[{"catchword":null,"tekst":"To give subtilty [This word here is taken in a good sence, for a quick, nimble, subtile, and sharp wit, or apprehension, as below, chap.8.verse 5.12. item, 19.25. Elsewhere it is taken in a bed sence, for craftiness, mischievousness, as Exo 21:14. Jos.9.4. Job 5:12. and 15.5.] to the simple, [this word is sometimes taken in a bad sence, for those who by reason of their dullness, stupidity and blockishness do easily believe, and suffer themselves easily to be turned aside, and to be missed out of the way that is good. See Job 5.on verse 2. So also v. Sometimes the Hebrew word is taken in a good sense, for those that are teachable, harmless, sincere, and down right, and would easily be deceived and hurt by the wicked, unless God, (in whom they trust) as a gracious Father, did keep and preserve them, Psa 19:8. and 11.6.6. below chapter 19.25. Mat 10:16.] to the young man [both in years and in understanding] knowledge of the things that ought to be known: but also of the grounds and reasons thereof] and discretion. [that is, a wise and serious, or judicious consideration. [that is, a wise and serious, or judicious consideration, accompanied with a singular prudence. So below, Chapter 2.11. and 3.21. See Job 21. The Annotat.on v.27.]"}],"5":[{"catchword":null,"tekst":"He that is wise will hear, and increase in learning; [See of the Hebrew word translated learning, Job chap.11.on verse 4. Or, will augment learning, or increase in apprehension. Compare below, chapter 9.9. Hebr. Properly add learning] and he that is of understanding, shall attain unto wise counsel: [Hebr. Wise counsels, in the plural number. See of this word, Job 37.on v.12.]"}],"6":[{"catchword":null,"tekst":"To understand a Proverb, [See above on verse 1.] and the interpretation] to wit, of the same Proverb. Others, skilful sayings; that is apt or fit eloquence, to utter a mans words well] the words of the wise, and their riddles. [that is, their sayings, which have a hidden and deep sense or meaning. See Judg.14.on v.1.2. and 1 Kings 10.on vers.1.]"}],"7":[{"catchword":null,"tekst":"The fear of the Lord is the beginning of knowledge: [that is, the ground and foundation of true wisdom, to wit, to obtain it fully; even as in the building of an house, the foundation is the beginning of the rest of the building, to finish and perfect it. See Psalm 11.on v.10. item, Job 28:28. Pro 9:10. Zech.12.15.] (but) fools [understand by those for the most part, men, that having drunk in false opinions, do not follow the right way of wisdom, and the fear of God. See Job 5.on v.2.] despise knowledge and instruction."}],"8":[{"catchword":null,"tekst":"My son, [So Salomon calleth all those that hear, or read his Doctrine, to shew that he doth not onely propound it with a fatherly mind and affection, but that they also ought to receive and entertain it with a child like and most obedient heart and inclination. So below, verse 10.15. and chap.2.1. and 3.1. etc. Compare Judg.17.on v.10. 1 Kings 2.on v.12. Psalm 34.on v.12.] hear the instruction of thy father, and forsake not the Dotrine [or Law, or Instruction. See below, Chapter 3.1. and 4.2. and 6.20.23. and 7.2.] of thy Mother."}],"9":[{"catchword":null,"tekst":"For they shall be an acceptable ornament, a gracious addition unto thine head, [Hebr. An addition of acceptableness, etc. That is, which shall make thee acceptable of thy mother: and respected. So below, chap.4.9.] and chains on thy neck: Hebr. Throat.]"}],"10":[{"catchword":null,"tekst":"My son, if the sinners [Meaning gross and impotent sinners. See 1 Sam.25.on verse 18.] entice thee, [or, would seduce thee; that is, shall seek to persuade and inveigle thee with fair words. See of the Hebrew word rendered here enticed, Judge 14.on verse 14. Consent thou not. [Compare Pro 4:24.]"}],"11":[{"catchword":null,"tekst":"If they say, Go with us, let us lurk for blood, [To wit, to shed it, by killing and murdering. Blood is used for killing, or murdering. See Gen.37. on verse 26.] (let us) hide our selves [that is, lie in wait, or, lay wait. So Psal.56. and below verse 18.] against the innocent, without cause: [that is, without his deserving. So Psa 35:7.]"}],"12":[{"catchword":null,"tekst":"Let us swallowed them up alive, [That is, without pity or compassion. Compare Psa 124:3.] as the grave, [that is, as the grave swalloweth up the dead bodies. Compare below chap.27.20. and 30.16.] yea whole and all, as these that go down into the pit: [Heb.the goers down of the pit. So Gen 23:10. the enterers in of his City gate; that is, those that entered in at the gate of his City. So Psa 78:9. shooters of the bow; that is, those that shoot with the bow.]"}],"13":[{"catchword":null,"tekst":"We shall find all precious substance, we shall fill our houses with spoil:"}],"14":[{"catchword":null,"tekst":"Thou shalt cast in thy lot in the midst among us, [That is, help to share the prey with us, which is commonly done by casting or drawing of lots, when every one desireth to draw out his share] we will all (of us) have it in common, and divide it amongst our selves.]"}],"15":[{"catchword":null,"tekst":"My son, walk not in the way them, [that is, keep no their company, nor converse with them. Compare the phrase, 1 Sam.25.15. Psa 1:1.] refrain thy foot from their path: [that is, go not with them in their wicked ways. Hereby may be also understood, the affections, inclinations, and motions of the mind or soul: For as the feet carry the body hither and thither; so is the spirit of a man led on and carried by the affections, to sundry devices and practises. Compare below verse 16. And 5.5. and 6.18, &c.]"}],"16":[{"catchword":null,"tekst":"For their feet run to evil; [That is, to do evil, or to hurt others] and they make haste to shed blood."}],"17":[{"catchword":null,"tekst":"Surely the net is spread in vain before the eyes of all manner of fowl. [Hebr. Of all Lord of the wing. That is, of all manner if fowl, or, all that hath wings. See Gen.14.on verse 13. The net spread in vain, etc. Meaning, in respect of the silly bird, because it taketh no warning by the spreading abroad of the net, to shun and avoid danger; but is onely carried by a greedy appetite and desire to the bait. Some apply this thus: that the birds when see the net spread, are thereby warned, and fly away, but the wicked are so dull and senseless, that they even spread their own nets wherein they shall be taken. But the sense of the proverb seemeth to be this: As a bird doth in vain see the net spread abroad, not heeding it, but having her eyes fixed onely upon the bait, and so by falling on its taken: so wicked men and evil doers regard not the danger, where into they put themselves, when for some temporal gain or profit, they hurt their neighbour, but fall into the hands of the Magistrate, who punisheth them according to their deservings, or else are punished some other way by God himself.]"}],"18":[{"catchword":null,"tekst":"And these [To wit, they, of whom is spoken above, verse 15,16.] lurk for their (own) blood, and hide themselves [see above on verse 11.] against their (own) souls. [the meaning is, that they bring their own lives to ruine and destruction, by seeking after the lives of others. Compare below chap.8.verse 36. And the Annot.]"}],"19":[{"catchword":null,"tekst":"So are the paths [that is, the intentions, purpose, deeds, and practises. Compare Gen.6.on ver.12. also below chap.2.15. and 22.25.] of every one, that practiseth covetousness: [Hebr. That covets covetousness, or, coveteth with covetousness. So below chap.15.27. Jer 6:13. Eze 22:27. Hab.2.9. The Hebrew word is for the most part taken in a bad sense, for filthy, covetous, and dishonest lucre or gain. See Gen 37:26. Exo 18:21. 1 Sam.8.3. Psa 119:36. below chap.28.16. Isa 56:11.] it [to wit, covetousness] will catch [that is, bring to destruction, as a bird is caught, and cometh to its death by the bait, after which it flyeth] the soul of the masters thereof. [that is, of those that study or practise covetousness. See of the word Baal, Gen.14.on verse 13.]"}],"20":[{"catchword":null,"tekst":"The Sepreme Wisdom [Hebr. Wisdom in the plural number, that is, the highest, most excellent, or supreme wisdom. So below chap.9.1. and Psa 49:4. so Job 40.verse 10. A great beast is called Behemot; that is, beasts in the plural number. This is done to aggravate, or to multiply things. Oth. Every wisdom, or, manifold wisdom, or, (wisdom) of wisdoms. By this wisdom may be understood, either the essential wisdom of the Father, which is the Son of God, whereof see below chap.8. or the wisdom contained in the holy Scripture, which far exceedeth all the wisdom of men. Some understand the wisdom, which is revealed by the Word of God, and by the works of Divine Providence] cryeth aloud without; [to wit, by the Preachers of the word of God, or also by the works of Creation, and upholding, and governing of all things] she lifteth up her voice [Hebr. Giveth, &c. That is, she lifteth up her voice, and causeth it to be heard. So Gen 45:2. below chap.2.3. and 8.1.] in the streets."}],"21":[{"catchword":null,"tekst":"She cryeth in the front of the stirs, [Hebr. In the head of the stirs. Understand the places where great concourse or assembling of people was, and wherein also was much stir anmd noise] at the doors of the gates [where judgement was kept, and consequently where were great meetings and gathereds of people together. See Gen.22. on verse 17.] she uttereth her sayings in the city. [Meaning every city in the land of Israel.]"}],"22":[{"catchword":null,"tekst":"Ye simple ones, [These are the words of wisdom, which Salomon bringeth in speaking after this manner. Of the word simple, see above on verse 4.] how long will ye love simplicity? And the scorners? And fools [understand not idiots, or naturals fools, senseless persons, that have not the common use of reason and understanding, as other men have; but such as are deprived of true wisdom, leading to everlasting life, neither are enclined or bent to seek and endeavour after it, but onely cumber and trouble themselves about the things pertaining to this temporal life] hate knowledge?"}],"23":[{"catchword":null,"tekst":"Turn you unto my reproof: [To wit, to hear and obey it, or to follow after it. Oth. Turn you at my reproof: that is, repent and amend your lives by virtue of my reproof. Understand such a reproof as is done by words of instruction and exhortation. So below ver.25.30.] I will abundantly pour out. [a phrase borrowed or taken from fountains, out of which water issueth, or gusheth forth in great abundance. See of the Hebrew word, Psal.19.on verse 3. It is used sometimes in a good sense, as here, and so in the forementioned place: and sometimes in a bad sense, as below, chap.15.2,28.] my spirit unto you; [that is, the knowledge of my mind and will. See the word spirit often taken in the like sense, that is, for the gift of understanding, Psalm 76.verse 13. Below chap.29.11. Joel 2.28.] I will make known my words unto you."}],"24":[{"catchword":null,"tekst":"Seeing I have called, and ye have refused; (I) have stretched out mine hand, [To wit, to invite you to repentance. See the like phrase Isa 65:2.] and there was no man that regarded: [Compare Isa 65:12. and 66.4. Jer 13:10.]"}],"25":[{"catchword":null,"tekst":"And ye have rejected [The Hebrew word is taken in the like sense, below chap.4.15. and 8.33. and 13.18. and 15.32.] all my counsel; [Oth. Have withdrawn your selves from, or, bereaved (your selves of) my counsel: Oth. Have caused my counsel to cease] and would not reproof:"}],"26":[{"catchword":null,"tekst":"Therefore I will also laugh at your destruction: I will mock when your fear [That is, the evil, and mischief, whereat ye shall be sore afraid and astonished: or, which ye exceedingly fear. So in the following verse. See Job 39.on verse 25.] cometh."}],"27":[{"catchword":null,"tekst":"When your fear cometh as a destruction, [Which spreadeth it self far and near with a great sound or noise, and doth exceeding much harm. See of this similitude also, Psa 35:8. and the annotations below, cha.3.25. Isa 10:3. and 47.11.] and thy destruction cometh as a whirlwind; [that is, very swiftly, terribly, and violently. See of such a kind of similitude also, Job 9.on verse 17.] when distress and anguish cometh upon you; [compare Job 27:9. and 35.12. Isa 1:15. Jer.11. verse 11. And 14.13. Eze 8:18. Mic 3:4.]"}],"28":[{"catchword":null,"tekst":"Then shall they cry unto me, but I will not answer: they shall seek me early, [That is, seek me with great care and diligence. See Job 8.on verse 5.] but (they) shall not find me:"}],"29":[{"catchword":null,"tekst":"Because they hated knowledge, [Of knowledge, [Of knowledge, see above on verse 4.] and did not choose the fear of the LORD."}],"30":[{"catchword":null,"tekst":"They consented not to my counsel: they despised all my reproof."}],"31":[{"catchword":null,"tekst":"So [Or, therefore] shall they eat of the fruit of their (own) way, [that is, receive, and get the punishment, or recompence of their wicked works. See Job 21.on verse 25. The word fruit, here used, is taken for all manner of, either evil, or good, that issueth or proceedeth from any thing. It&acirc;&euro;&trade;s taken for evil, as here; so Isa.10 12. Jer 6:19. Micha 7.verse 13. Lu.6.43. For good, below chap.8.19. and 31.31. Amos 6.12. Psa 5:22. Philip.1.11.] and satisfy the selves with their (own) counsels. [that is, bring a sad inundation of plagues upon themselves, occasioned by their obstinate and contumacious minds. See of this phrase Job 7:4. and the annot.]"}],"32":[{"catchword":null,"tekst":"For the turning away of the simple [To wit, whereby they turn away themselves from the teachings and instructions of wisdom] shall slay them, [or wit, the simple: which is done by means of the Magistrate, or other means yea by God himself] and the prosperity of fools [meaning which they, or other wicked men oftentimes have to devise: whereby they are hardened in their backsliding and course of sinning] shall destroy them."}],"33":[{"catchword":null,"tekst":"But whoso hearkeneth unto me, shall dwell safely: [Hebr. In, or, with safety: that is, not only without ill entertainment, but also without fear of it. The same phrase is also found, Lev.25.18. Deut.33.12. Isa 47:8. Jer 23:6. Eze 39:26, etc.] and he shall be quiet from fear of evil."}]}}};

(function bouwHfdnav() {
  const m = D.meta;

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');

function popupVerzenHtml(bron, start, eind) {

  const aantal = Math.min(totaal, 3);

  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }

  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
