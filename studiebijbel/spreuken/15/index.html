uis van de rechtvaardige is een grote schat; maar in de inkomst van de goddeloze is opschudding.","7":"De lippen van de wijzen zullen de wetenschap uitstrooien; maar het hart van de zotten niet zo.","8":"Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.","9":"De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.","10":"De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.","11":"Het dodenrijk en het verderf liggen open voor de HEERE; hoeveel te meer de harten van de mensenkinderen?","12":"De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.","13":"Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.","14":"Een verstandig hart zoekt de wetenschap; maar de mond van de zotten voedt zich met dwaasheid.","15":"Al de dagen van de bedrukte zijn kwaad; maar een vrolijk hart is een voortdurende maaltijd.","16":"Beter is weinig met de vreze van de HEERE, dan een grote schat met onrust erbij.","17":"Beter is een gerecht van groente, waar ook liefde is, dan een vetgemeste os met haat erbij.","18":"Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.","19":"De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.","20":"Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.","21":"De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.","22":"Plannen worden tenietgedaan als er geen overleg is; maar door veel raadgevers komen ze tot stand.","23":"Een man heeft blijdschap in het antwoord van zijn mond; en hoe goed is een woord op zijn tijd!","24":"De weg van het leven gaat voor de verstandige omhoog, opdat hij afwijkt van het dodenrijk beneden.","25":"Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.","26":"De gedachten van de boze zijn de HEERE een gruwel; maar de woorden van de reinen zijn lieflijke woorden.","27":"Wie hebzucht najaagt, brengt zijn huis in beroering; maar wie geschenken haat, zal leven.","28":"Het hart van de rechtvaardige bedenkt zich, om te antwoorden; maar de mond van de goddelozen stort overvloedig kwade dingen uit.","29":"De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.","30":"Het licht van de ogen verblijdt het hart; een goed bericht maakt de beenderen vet.","31":"Het oor dat de bestraffing van het leven hoort, zal te midden van de wijzen vernachten.","32":"Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.","33":"De vreze van de HEERE is de tucht van de wijsheid; en de nederigheid gaat vooraf aan de eer."},"SV":{"1":"Een zacht antwoord keert de grimmigheid af; maar een smartend woord doet den toorn oprijzen.","2":"De tong der wijzen maakt de wetenschap goed; maar de mond der zotten stort overvloediglijk dwaasheid uit.","3":"De ogen des HEEREN zijn in alle plaatsen, beschouwende de kwaden en de goeden.","4":"De medicijn der tong is een boom des levens; maar de verkeerdheid in dezelve is een breuk in den geest.","5":"Een dwaas zal de tucht zijns vaders versmaden; maar die de bestraffing waarneemt, zal kloekzinniglijk handelen.","6":"*In* het huis des rechtvaardigen is een grote schat; maar in des goddelozen inkomst is beroerte.","7":"De lippen der wijzen zullen de wetenschap uitstrooien; maar het hart der zotten niet alzo.","8":"Het offer der goddelozen is den HEERE een gruwel; maar het gebed der oprechten is Zijn welgevallen.","9":"De weg der goddelozen is den HEERE een gruwel; maar dien, die de gerechtigheid najaagt, zal Hij liefhebben.","10":"De tucht is onaangenaam voor dengene die het pad verlaat; *en* die de bestraffing haat, zal sterven.","11":"De hel en het verderf zijn voor den HEERE; hoeveel te meer de harten van des mensen kinderen?","12":"De spotter zal niet liefhebben, die hem bestraft; hij zal niet gaan tot de wijzen.","13":"Een vrolijk hart zal het aangezicht blijde maken; maar door de smart des harten wordt de geest verslagen.","14":"Een verstandig hart zal de wetenschap opzoeken; maar de mond der zotten zal met dwaasheid gevoed worden.","15":"Al de dagen des bedrukten zijn kwaad; maar een vrolijk hart is een gedurige maaltijd.","16":"Beter is weinig met de vreze des HEEREN, dan een grote schat, en onrust daarbij.","17":"Beter is een gerecht van groen moes, waar ook liefde is, dan een gemeste os, en haat daarbij.","18":"Een grimmig man zal gekijf verwekken; maar de lankmoedige zal den twist stillen.","19":"De weg des luiaards is als een doornheg; maar het pad der oprechten is welgebaand.","20":"Een wijs zoon zal den vader verblijden; maar een zot mens veracht zijn moeder.","21":"De dwaasheid is den verstandeloze blijdschap; maar een man van verstand zal recht wandelen.","22":"De gedachten worden vernietigd, als er geen raad is; maar door veelheid der raadslieden zal elkeen bestaan.","23":"Een man heeft blijdschap in het antwoord zijns monds; en hoe goed is een woord op zijn tijd!","24":"De weg des levens is den verstandige naar boven; opdat hij afwijke van de hel, beneden.","25":"Het huis der hovaardigen zal de HEERE afrukken; maar de landpale der weduwe zal Hij vastzetten.","26":"Des bozen gedachten zijn den HEERE een gruwel; maar der reinen zijn liefelijke redenen.","27":"Die gierigheid pleegt, beroert zijn huis; maar die geschenken haat, zal leven.","28":"Het hart des rechtvaardigen bedenkt zich, om te antwoorden; maar de mond der goddelozen zal overvloediglijk kwade dingen uitstorten.","29":"De HEERE is ver van de goddelozen; maar het gebed der rechtvaardigen zal Hij verhoren.","30":"Het licht der ogen verblijdt het hart; een goed gerucht maakt het gebeente vet.","31":"Het oor, dat de bestraffing des levens hoort, zal in het midden der wijzen vernachten.","32":"Die de tucht verwerpt, die versmaadt zijn ziel; maar die de bestraffing hoort, krijgt verstand.","33":"De vreze des HEEREN is de tucht der wijsheid; en de nederigheid *gaat* voor de eer."},"KJV":{"1":"A soft answer turneth away wrath: but grievous words stir up anger.","2":"The tongue of the wise useth knowledge aright: but the mouth of fools poureth out foolishness.","3":"The eyes of the LORD *are* in every place, beholding the evil and the good.","4":"A wholesome tongue *is* a tree of life: but perverseness therein *is* a breach in the spirit.","5":"A fool despiseth his father's instruction: but he that regardeth reproof is prudent.","6":"In the house of the righteous *is* much treasure: but in the revenues of the wicked is trouble.","7":"The lips of the wise disperse knowledge: but the heart of the foolish","8":"The sacrifice of the wicked *is* an abomination to the LORD: but the prayer of the upright *is* his delight.","9":"The way of the wicked *is* an abomination unto the LORD: but he loveth him that followeth after righteousness.","10":"Correction *is* grievous unto him that forsaketh the way: *and* he that hateth reproof shall die.","11":"Hell and destruction *are* before the LORD: how much more then the hearts of the children of men?","12":"A scorner loveth not one that reproveth him: neither will he go unto the wise.","13":"A merry heart maketh a cheerful countenance: but by sorrow of the heart the spirit is broken.","14":"The heart of him that hath understanding seeketh knowledge: but the mouth of fools feedeth on foolishness.","15":"All the days of the afflicted *are* evil: but he that is of a merry heart *hath* a continual feast.","16":"Better *is* little with the fear of the LORD than great treasure and trouble","17":"Better *is* a dinner of herbs where love is, than a stalled ox and hatred","18":"A wrathful man stirreth up strife: but *he that is* slow to anger appeaseth strife.","19":"The way of the slothful *man is* as an hedge of thorns: but the way of the righteous *is* made plain.","20":"A wise son maketh a glad father: but a foolish man despiseth his mother.","21":"Folly *is* joy to *him that is* destitute of wisdom: but a man of understanding walketh uprightly.","22":"Without counsel purposes are disappointed: but in the multitude of counsellors they are established.","23":"A man hath joy by the answer of his mouth: and a word *spoken* in due season, how good","24":"The way of life *is* above to the wise, that he may depart from hell beneath.","25":"The LORD will destroy the house of the proud: but he will establish the border of the widow.","26":"The thoughts of the wicked *are* an abomination to the LORD: but *the words* of the pure *are* pleasant words.","27":"He that is greedy of gain troubleth his own house; but he that hateth gifts shall live.","28":"The heart of the righteous studieth to answer: but the mouth of the wicked poureth out evil things.","29":"The LORD *is* far from the wicked: but he heareth the prayer of the righteous.","30":"The light of the eyes rejoiceth the heart: *and* a good report maketh the bones fat.","31":"The ear that heareth the reproof of life abideth among the wise.","32":"He that refuseth instruction despiseth his own soul: but he that heareth reproof getteth understanding.","33":"The fear of the LORD *is* the instruction of wisdom; and before honour *is* humility."}},"tsk":{"1":[{"kopje":"zacht","refs":["Spr 25:15","Richt 8:1-3","1 Sam 25:21-33"]},{"kopje":"smartend","refs":["Spr 15:18","Spr 10:12","Spr 28:25","Spr 29:22","Richt 12:3-6","1 Sam 25:10","1 Sam 25:11","1 Sam 25:21","1 Sam 25:22","2 Sam 19:43","1 Kon 12:13-16"]}],"2":[{"kopje":"tong","refs":["Spr 15:23","Spr 15:28","Spr 12:23","Spr 13:16","Spr 16:23","Spr 25:11","Spr 25:12","Ps 45:2","Pred 10:12","Pred 10:13","Jes 50:4"]},{"kopje":"stort overvloedig","refs":["Ps 59:8"]}],"4":[{"kopje":"medicijn","refs":["Spr 12:18","Spr 16:24","Mal 4:2"]},{"kopje":"een boom","refs":["Spr 3:18","Gen 3:22-24","1 Tim 6:3","Openb 2:7"]} -kjv\" data-code=\"H1366\">border</span> of the widow.","26":"The <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> are an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> but the words of the <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> are <span class=\"wl wl-kjv\" data-code=\"H5278\">pleasant</span> words.","27":"He that is <span class=\"wl wl-kjv\" data-code=\"H1214\">greedy</span> of <span class=\"wl wl-kjv\" data-code=\"H1215\">gain</span> <span class=\"wl wl-kjv\" data-code=\"H5916\">troubleth</span> his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> but he that <span class=\"wl wl-kjv\" data-code=\"H8130\">hateth</span> <span class=\"wl wl-kjv\" data-code=\"H4979\">gifts</span> shall live.","28":"The <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H1897\">studieth</span> to <span class=\"wl wl-kjv\" data-code=\"H6030\">answer:</span> but the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H5042\">poureth</span> out evil things.","29":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> from the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked:</span> but he <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> of the righteous.","30":"The <span class=\"wl wl-kjv\" data-code=\"H3974\">light</span> of the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiceth</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart:</span> and a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H8052\">report</span> <span class=\"wl wl-kjv\" data-code=\"H1878\">maketh</span> the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> fat.","31":"The <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> that <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> the <span class=\"wl wl-kjv\" data-code=\"H8433\">reproof</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">abideth</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> the wise.","32":"He that <span class=\"wl wl-kjv\" data-code=\"H6544\">refuseth</span> <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction</span> <span class=\"wl wl-kjv\" data-code=\"H3988\">despiseth</span> his own <span class=\"wl wl-kjv\" data-code=\"H5315\">soul:</span> but he that <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> <span class=\"wl wl-kjv\" data-code=\"H8433\">reproof</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">getteth</span> understanding.","33":"The <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is the <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction</span> of <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom;</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3519\">honour</span> is humility."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"antwoord","tekst":"Of, rede; alzo onder vs.23, en Pro 16:1 ; gelijk het woord Anah niet alleen betekent antwoorden, maar ook ene rede aanvangen. Zie Jdg 18:14 ."},{"catchword":"smartend","tekst":"Hebreeuws, een woord der smart, moeite, of pijn, dat is, smartelijk, moeilijk, pijnlijk en hard om te horen."}],"2":[{"catchword":"goed;","tekst":"Dat is, aangenaam, sierlijk, stichtelijk en nuttig, als ter bekwamer tijd en plaats, en op behoorlijke manier voortgebracht zijnde. Anders: de wetenschap versiert de tong der wijzen."},{"catchword":"stort","tekst":"Te weten, gelijk een fontein steeds met groten overvloed water uitgeeft. Zie van het Hebreeuwse woord boven Pro 1:23 ."}],"3":[{"catchword":"ogen","tekst":"Versta, de voorzienigheid Gods. Zie 2Ch 16:9 ."}],"4":[{"catchword":"De medicijn","tekst":"Of, de gezondheid der tong; dat is, de gezonde redenen en zaligmakende leer, rakende het geloof en den wandel, die door de tong voorgesteld wordt. Vergelijk boven Pro 12:18 ."},{"catchword":"boom","tekst":"Dat is, als een boom des levens, medebrengende het welvaren, niet alleen van het tijdelijke, maar ook van het eeuwige leven. Vergelijk boven Pro 3:18 ."},{"catchword":"in dezelve","tekst":"Te weten, in de tong; zie boven Pro 2:12 ."},{"catchword":"breuk","tekst":"Dat is, ene schade der ziel. Anders: ene verbreking door den wind; dat is een heftige verderving; gelijk de schepen door sterke winden in stukken gebroken worden; Psa 48:8 ; Jer 18:17 ."}],"5":[{"catchword":"bestraffing","tekst":"Te weten, zijns vaders."},{"catchword":"kloekzinniglijk","tekst":"Of, kloekzinnig worden. Alzo onder Pro 19:25 . Vergelijk 1Sa 23:22 ."}],"6":[{"catchword":"huis","tekst":"Versta, niet alleen zijne woning, maar ook zijne middelen, gelijk blijkt uit de tegenstelling. Vergelijk boven Pro 12:7 ."},{"catchword":"grote schat;","tekst":"Te weten omdat hij met het inwendig goed wel voorzien zijnde, zijne genoegzaamheid heeft in het uiterlijke, dat God hem verleent. Anders, sterkte, of vastigheid."},{"catchword":"beroerte","tekst":"Dat is, ongenoegzaamheid en onrust des geestes, omdat hij van het hemelse goed ledig is. Zie van het Hebreeuwse woord Gen 34:30 , en 1Ki 18:17 ."}],"7":[{"catchword":"wetenschap","tekst":"Dat is, de goede leer, die men weten moet en die den mens wijs, verstandig en wetende maakt. Alzo Num 24:16 ; Psa 119:66 ; onder Pro 22:17 ."},{"catchword":"uitstrooien;","tekst":"Dat is, voortbrengen om die anderen mede te delen."},{"catchword":"niet alzo","tekst":"Dat is, het zal de wetenschap niet uitstrooien. Anders: is niet recht, of [strooit] dat niet recht is."}],"8":[{"catchword":"den HEERE","tekst":"Hebreeuws, des Heeren gruwel. Alzo in vs.9. Zie boven Pro 3:32 ."}],"9":[{"catchword":"weg","tekst":"Dat is, voornemen, doen en laten. Zie Gen 6:12 ."}],"10":[{"catchword":"onaangenaam","tekst":"Hebreeuws, kwaad; dat is, onaangenaam, hard, moeilijk; hoewel zij in zichzelve zeer goed is. Alzo is het woord kwaad genomen, 1Ki 22:8 , 1Ki 22:18 , gelijk ook het woord goed betekent dat aangenaam en lieftallig is. Zie 1Ki 1:42 . Anders: een kwade tucht, [dat is, straf] is voor degenen, die het pad verlaten."},{"catchword":"pad","tekst":"Te weten, het goede en rechte pad. Zie boven, Pro 2:8 ."}],"11":[{"catchword":"De hel","tekst":"Vergelijk Job 26:6 , en zie de aantekening."},{"catchword":"voor den HEERE;","tekst":"Dat is, naakt en ontdekt voor zijne ogen; Heb 4:13 ."},{"catchword":"kinderen?","tekst":"Te weten, die hier op de aarde in het klare licht der zon verkeren. Dit wordt menselijkerwijze van God gezegd; want bij Hem zijn alle dingen even mogelijk en licht om te doen."}],"12":[{"catchword":"spotter","tekst":"Zie boven Pro 1:22 ."},{"catchword":"niet gaan","tekst":"Te weten, uit haat der bestraffing."}],"13":[{"catchword":"blijde maken;","tekst":"Hebreeuws, goed maken; dat is, blijde. Zie Jdg 16:25 , en 1Ki 21:7 ."},{"catchword":"de geest","tekst":"Versta, den moed, de courage en de kracht des harten. Alzo Gen 41:8 ; Jos 5:1 ; 1Sa 1:15 ; Psa 34:19 , onder Pro 17:22 ; Isa 61:3 . De zin is dat des mensen moed, die zich in het aangezicht pleegt te vertonen, door de droefheid des harten geveld en nedergeslagen, ja verbroken wordt."}],"14":[{"catchword":"dwaasheid","tekst":"Dat is, met valse gedachten en redenen."},{"catchword":"gevoed","tekst":"Dat is, zoekt niet alleen de dwaasheid, maar heeft daarin zulk een smaak, dat hij door haar, als door een aangename spijs, in zijne dwaasheid groeit en sterk wordt."}],"15":[{"catchword":"kwaad;","tekst":"Dat is, droevig en verdrietelijk. Zie Gen 40:7 ."},{"catchword":"vrolijk hart","tekst":"Hebreeuws, goed; dat is vrolijk. Zie boven vs.13."},{"catchword":"een gedurige","tekst":"Dat is, als een gestadig banket, hetwelk den mens aangenaam is, zich vermakende naar het lichaam met goede spijs en drank, en naar den geest met eerlijke en stichtelijke redenen."}],"16":[{"catchword":"onrust","tekst":"Of, beroerte, of kwelling; te weten, die voortkomt uit een kwade conscientie en een mistrouwen van de gunst des Heeren, en dienvolgens niet verenigd met de vreze Gods. Vergelijk onder Pro 16:8 ."}],"17":[{"catchword":"gerecht","tekst":"Het Hebreeuwse woord, hier overgezet gerecht, betekent eigenlijk teerkost, die men op de reis medeneemt, Jer 40:5 ; maar het wordt ook voor anderen kost genomen, 2Ki 25:30 ; Jer 52:34 , en vs.17."}],"18":[{"catchword":"grimmig man","tekst":"Hebreeuws, een man der grimmigheid, of der hittige toornigheid; dat is, die haast toornig is, of lichtelijk vergramd wordt; alzo onder Pro 22:24 , en Pro 29:22 ."}],"19":[{"catchword":"De weg","tekst":"Dat is, al hetgeen hij te doen, te beschikken en uit te richten heeft."},{"catchword":"als een doornheg;","tekst":"Want gelijk het zeer moeilijk en zwaar is, daar door te gaan, alzo maakt de luiaard zich wijs dat al hetgeen hem te doen staat, zo zwaar is als door distelen en doornen te gaan, en zoekt vervolgens alle verontschuldigingen om aan het werk niet te komen. Vergelijk onder Pro 26:13 ."},{"catchword":"oprechten","tekst":"Dezen worden gesteld tegen de luien, omdat de luien onordelijk wandelen en ijdelheid doen, 2Th 3:11 , ja op eens anders arbeid zoeken te leven en, tot armoede komende, zich tot ongerechtigheid begeven; Eph 4:28 ."},{"catchword":"wel gebaand","tekst":"Of, opgehoogd; dat is, effen, licht, gemakkelijk en zonder zwarigheid die den gaanden man enigen hinder of moeite zou mogen voorwerpen."}],"21":[{"catchword":"recht wandelen","tekst":"Hebreeuws, zal richten te wandelen; dat is zal zijn ganse leven, woorden en werken, doen en laten, schikken en sturen naar hetgeen goed en Gode aangenaam is. Zie boven Pro 3:6 ."}],"22":[{"catchword":"De gedachten","tekst":"Versta, de aanslagen, of hetgeen men voorgeeft aan te grijpen, voornamelijk daar wat aan gelegen is."},{"catchword":"door veelheid","tekst":"Vergelijk boven Pro 11:14 ."},{"catchword":"elkeen","tekst":"Te weten der voorgemelde gedachten."}],"23":[{"catchword":"Een man","tekst":"Te weten een wijs en verstandig man."},{"catchword":"antwoord","tekst":"Of, in de rede en het voorstel zijns monds. Vergelijk boven vs.1, en de aantekening. Hier wordt gesproken van hetgeen wijselijk en stichtelijk voortgebracht is; gelijk de volgende woorden uitwijzen."},{"catchword":"goed","tekst":"Dat is, eerlijk voor hem, die het spreekt, en voordelig of aangenaam voor degenen, die het horen."}],"24":[{"catchword":"des levens","tekst":"Dat is, die ten leven leidt; zie boven Pro 2:19 ."},{"catchword":"naar boven;","tekst":"Te weten, naar den hemel, alwaar het rechte leven en de ware gelukzaligheid alleen te vinden is; Phi 3:20 ; Col 3:1-2 ."},{"catchword":"hel,","tekst":"Dat is, van de verdoemenis en het eeuwig verderf."},{"catchword":"beneden","tekst":"Dat is, die onder, omlaag of nederwaarts zijn."}],"25":[{"catchword":"vastzetten","tekst":"Dat is, maken dat zij niet verzet of tot hunne schade verminderd zal worden; want de landpalen in die plaatsen waren niet door velden of grachten afgescheiden maar met palen, staken en stenen."}],"26":[{"catchword":"liefelijke","tekst":"Hebreeuws, de redenen der lieflijkheid; te weten, voortkomende van de wijzen en vromen. Versta, redenen, die niet dan tot eer en deugd strekkende, Gode behagen en de mensen stichten. Vergelijk onder Pro 16:24 , en de aantekening. Anders: de lieflijke redenen zijn rein; te weten, voor den Heere, die ze voor rein houdt en acht, omdat zij voortvloeien uit een hart, dat door het geloof gezuiverd is; Act 15:9 ."}],"27":[{"catchword":"gierigheid","tekst":"Hebreeuws, die gierigheid giert. Zie boven Pro 1:19 ."},{"catchword":"beroert","tekst":"Zie van de betekenis van dit woord 1Ki 18:17 ."},{"catchword":"die geschenken","tekst":"Vergelijk Exo 23:8 , en Deu 16:19 ."}],"28":[{"catchword":"bedenkt","tekst":"Dat is, giet niet onbedachtelijk uit al wat op de lippen komt, maar bedenkt tevoren rijpelijk wat goed en stichtelijk is omgesproken te worden."},{"catchword":"om te antwoorden;","tekst":"Dat is, om enige rede aan te vangen. Zie Jdg 18:14 ."},{"catchword":"kwade dingen","tekst":"Dat is, onstichtelijke en schadelijke."},{"catchword":"uitstorten","tekst":"Zie van het Hebreeuwse woord Psa 19:3 , en boven Pro 1:23 ."}],"29":[{"catchword":"is ver","tekst":"Te weten, met zijn genadige verhoring en vaderlijke hulp. Vergelijk Psa 10:1 , en Psa 22:2 . Daarentegen wordt God gezegd nabij te zijn dengene, dien Hij genadig is, dien Hij verhoort en helpt; Psa 34:19 , en Psa 145:18 ."}],"30":[{"catchword":"Het licht","tekst":"Dat is, dat door de klaarheid der ogen gezien wordt, als daar is de verscheidenheid der kleuren, de schoonheid der landouwen, de tegenwoordigheid dergenen, die wij liefhebben en die ons goeddoen, enz. Of versta, het vriendelijk gezicht van iemand, wien wij groot achten, gelijk onder Pro 16:15 ."},{"catchword":"gerucht","tekst":"Hebreeuws, horing; versta, een goede tijding, of eerlijken naam, die door het gehoor gevat wordt."},{"catchword":"maakt het gebeente","tekst":"Dat is, verfraait de inwendigste leden van zijn lichaam en verkwikt alzo ook de ziel. Vergelijk boven de aantekening Pro 12:4 ."},{"catchword":"vet","tekst":"Vergelijk boven Pro 11:25 ."}],"32":[{"catchword":"die versmaadt","tekst":"Vergelijk boven Pro 8:36 ."},{"catchword":"verstand","tekst":"Hebreeuws, een hart; dat is verstand en wijsheid. Zie Job 9:4 ."}],"33":[{"catchword":"tucht der wijsheid;","tekst":"Dat is het onderwijs, de vermaning en verbetering, die ter wijsheid leidt. Zie boven Pro 1:2 ."},{"catchword":"eer","tekst":"Te weten, zowel van het tegenwoordige leven als van het toekomende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A soft answer [Or, speech: So below verse 23. And 10.1. As the Verb Anah, signifieth not onely to answer, but also to begin a speech. See Judg. chapter 18.on verse 14.] turneth away wrath; [compare below ch.25.15.] but a smarting word [Hebr. A word of smart trouble, or pain; that is, smarting, troublesome, painful, and grievous to be heard] causeth anger to arise."}],"2":[{"catchword":null,"tekst":"The tongue of the wise maketh knowledge good: [That is, acceptable, beautiful, profitable, an useful, as being uttered in due time and place, and in a due and right manner. Oth. Knowledge adorneth the tongue of the wise] but the mouth of fools poureth out foolishness abundantly. [to wit, as a fountain giveth out water in great abundance. See of the Hebrew word rendered here pouring out abundantly, above chap.7.on verse 23. Compare above chap.12.23. and 13.16. and below verse 28.]"}],"3":[{"catchword":null,"tekst":"The eyes of the LORD [Understand the Providence of God. See 2 Chronicles 16.on verse 9.] are in all (or every) place, beholding the evil, and the good. [Compare Job 34:21. above chap.5.21. Jer 16:17. and 32.19.]"}],"4":[{"catchword":null,"tekst":"The physic of the tongue [Or, health of the tongue; that is, wholesome speeches; and soul-saving doctrine, concerning faith and life, which is propounded by the tongue. Compare above chap.12.on verse 18.] is a tree life: [that is, as a tree of life bringing with it the prosperity and happiness, not onely of temporal, but also of eternal life. Compare above chap.3.on verse 18. Also chap.12.18. and 13.14.] but perverseness therein [to wit, in the tongue. See above chapter 2.on verse 12.] is a breach in the spirit. [that is, is a loss or damage of the soul. Oth. A breaking by the wind; that is, vehement destruction: as ships are broken in function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {

    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {

  }

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

    }).join('');
}

        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
