rwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt.","10":"U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.","11":"Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten,","12":"en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.","13":"Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.","14":"Want u, broeders, bent navolgers geworden van de Gemeenten van God die in Judea zijn, in Christus Jezus; omdat ook u hetzelfde geleden hebt van uw eigen medeburgers, zoals zij van de Joden;","15":"die zowel de Heere Jezus gedood hebben als hun eigen profeten, en ons vervolgd hebben, en God niet behagen, en tegen alle mensen zijn;","16":"en ons verhinderen tot de heidenen te spreken, opdat zij behouden worden; zodat zij altijd de maat van hun zonden vol maken. En de toorn is over hen gekomen tot het einde.","17":"Maar wij, broeders, van u beroofd geweest voor een korte tijd, naar het gezicht, niet naar het hart, hebben ons des te meer ingespannen om uw gezicht te zien, met grote begeerte.","18":"Daarom hebben wij tot u willen komen (zeker ik, Paulus) een keer en opnieuw, maar de satan heeft ons verhinderd.","19":"Want wat is onze hoop, of blijdschap, of kroon van het roem? Bent u dat niet, voor onze Heere Jezus Christus bij Zijn komst?","20":"Want u bent onze heerlijkheid en blijdschap."},"SV":{"1":"Want gij weet zelven, broeders, onzen ingang tot u, dat die niet ijdel is geweest;","2":"Maar, hoewel wij te voren geleden hadden, en ook ons smaadheid aangedaan was, gelijk gij weet, te Filippi, zo hebben wij *nochtans* vrijmoedigheid gebruikt in onzen God, om het Evangelie van God tot u te spreken in veel strijds.","3":"Want onze vermaning is niet geweest uit verleiding, noch uit onreinigheid, noch met bedrog;","4":"Maar, gelijk wij van God beproefd zijn geweest, dat ons het Evangelie zou toebetrouwd worden, alzo spreken wij, niet als mensen behagende, maar Gode, Die onze harten beproeft.","5":"Want wij hebben nooit met pluimstrijkende woorden omgegaan, gelijk gij weet, noch met *enig* bedeksel van gierigheid; God is getuige!","6":"Noch zoekende eer uit mensen, noch van u, noch van anderen; hoewel wij *u* tot last konden zijn als Christus’ apostelen;","7":"Maar wij zijn vriendelijk geweest in het midden van u, gelijk als een voedster haar kinderen koestert;","8":"Alzo wij, tot u zeer genegen zijnde, hebben u gaarne willen mededelen niet alleen het Evangelie van God, maar ook onze eigen zielen, daarom dat gij ons lief geworden waart.","9":"Want gij gedenkt, broeders, onzen arbeid en moeite; want nacht en dag werkende, opdat wij niemand onder u zouden lastig zijn, hebben wij het Evangelie van God onder u gepredikt.","10":"Gij zijt getuigen, en God, hoe heilig, en rechtvaardig, en onberispelijk wij u, die gelooft, geweest zijn.","11":"Gelijk gij weet, hoe wij een iegelijk van u, als een vader zijn kinderen, vermaanden en vertroostten,","12":"En betuigden, dat gij zoudt wandelen, waardiglijk Gode, Die u roept tot Zijn Koninkrijk en heerlijkheid.","13":"Daarom danken wij ook God zonder ophouden, dat, als gij het Woord der prediking van God van ons ontvangen hebt, gij dat aangenomen hebt, niet *als* der mensen woord, maar ( gelijk het waarlijk is) *als* Gods Woord, dat ook werkt in u, die gelooft.","14":"Want gij, broeders, zijt navolgers geworden der Gemeenten Gods, die in Judea zijn, in Christus Jezus; dewijl ook gij hetzelfde geleden hebt van uw eigen medeburgers, gelijk als zij van de Joden;","15":"Welke ook gedood hebben den Heere Jezus, en hun eigen profeten; en ons hebben vervolgd, en Gode niet behagen, en allen mensen tegen zijn;","16":"En verhinderen ons te spreken tot de heidenen, dat zij zalig mochten worden; opdat zij te allen tijd hun zonden vervullen zouden. En de toorn is over hen gekomen tot het einde.","17":"Maar wij, broeders, van u beroofd geweest zijnde voor een kleine wijle tijds, naar het aangezicht, niet naar het hart, hebben ons te overvloediger benaarstigd, om uw aangezicht te zien, met grote begeerte.","18":"Daarom hebben wij tot u willen komen ( immers ik Paulus) eenmaal en andermaal, maar de satanas heeft ons belet.","19":"Want welke is onze hoop, of blijdschap, of kroon des roems? Zijt gij die ook niet voor onzen Heere Jezus Christus in Zijn toekomst?","20":"Want gij zijt onze heerlijkheid en blijdschap."},"KJV":{"1":"For yourselves, brethren, know our entrance in unto you, that it was not in vain:","2":"But even after that we had suffered before, and were shamefully entreated, as ye know, at Philippi, we were bold in our God to speak unto you the gospel of God with much contention.","3":"For our exhortation was not of deceit, nor of uncleanness, nor in guile:","4":"But as we were allowed of God to be put in trust with the gospel, even so we speak; not as pleasing men, but God, which trieth our hearts.","5":"For neither at any time used we flattering words, as ye know, nor a cloke of covetousness; God is witness:","6":"Nor of men sought we glory, neither of you, nor yet of others, when we might have been burdensome, as the apostles of Christ.","7":"But we were gentle among you, even as a nurse cherisheth her children:","8":"So being affectionately desirous of you, we were willing to have imparted unto you, not the gospel of God only, but also our own souls, because ye were dear unto us.","9":"For ye remember, brethren, our labour and travail: for labouring night and day, because we would ➔ not be chargeable unto any of you, we preached unto you the gospel of God.","10":"Ye are witnesses, and God also, how holily and justly and unblameably we behaved ourselves among you that believe:","11":"As ye know how we exhorted and comforted and charged every one of you, as a father doth his children,","12":"That ye would walk worthy of God, who hath called you unto his kingdom and glory.","13":"For this cause also thank we God without ceasing, because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.","14":"For ye, brethren, became followers of the churches of God which in Judaea are in Christ Jesus: for ye also have suffered like things of your own countrymen, even as they have of the Jews:","15":"Who both killed the Lord Jesus, and their own prophets, and have persecuted us; and they please not God, and are contrary to all men:","16":"Forbidding us to speak to the Gentiles that they might be saved, to fill up their sins alway: for the wrath is come upon them to the uttermost.","17":"But we, brethren, being taken from you for a short time in presence, not in heart, endeavoured the more abundantly to see your face with great desire.","18":"Wherefore we would have come unto you, even I Paul, once and again; but Satan hindered us.","19":"For what is our hope, or joy, or crown of rejoicing? Are not even ye in the presence of our Lord Jesus Christ at his coming?","20":"For ye are our glory and joy."}},"tsk":{"1":[{"kopje":"onze","refs":["1 Tess 2:13","1 Tess 1:3-10","2 Tess 3:1"]},{"kopje":"niet zonder vrucht","refs":["1 Tess 3:5","Job 39:19","Ps 73:13","Ps 127:1","Jes 49:4","Jes 65:23","Hab 2:13","1 Kor 15:2","1 Kor 15:10","1 Kor 15:58","2 Kor 6:1","Gal 2:2","Gal 4:11","Fil 2:16"]}],"2":[{"kopje":"smaad","refs":["Hand 5:41","Hand 16:12","Hand 16:22-24","Hand 16:37","2 Tim 1:12","Hebr 11:36","Hebr 11:37","Hebr 12:2","Hebr 12:3","1 Petr 2:14-16"]},{"kopje":"vrijmoedigheid","refs":["1 Tess 1:5","Hand 4:13","Hand 4:20","Hand 4:31","Hand 14:3","Hand 17:2","Hand 17:3","Ef 6:19","Ef 6:20"]},{"ko an> <span class=\"wl wl-kjv\" data-code=\"G1161\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G3709\">wrath</span> is <span class=\"wl wl-kjv\" data-code=\"G5348\">come</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> the <span class=\"wl wl-kjv\" data-code=\"G5056\">uttermost.</span>","17":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G2249\">we,</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> being <span class=\"wl wl-kjv\" data-code=\"G642\">taken</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">you</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">for</span> a <span class=\"wl wl-kjv\" data-code=\"G5610\">short</span> <span class=\"wl wl-kjv\" data-code=\"G2540\">time</span> in <span class=\"wl wl-kjv\" data-code=\"G4383\">presence,</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> in <span class=\"wl wl-kjv\" data-code=\"G2588\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"G4704\">endeavoured</span> the more <span class=\"wl wl-kjv\" data-code=\"G4056\">abundantly</span> to <span class=\"wl wl-kjv\" data-code=\"G1492\">see</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G4383\">face</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> <span class=\"wl wl-kjv\" data-code=\"G4183\">great</span> <span class=\"wl wl-kjv\" data-code=\"G1939\">desire.</span>","18":"<span class=\"wl wl-kjv\" data-code=\"G1352\">Wherefore</span> we <span class=\"wl wl-kjv\" data-code=\"G2309\">would</span> have <span class=\"wl wl-kjv\" data-code=\"G2064\">come</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you,</span> <span class=\"wl wl-kjv\" data-code=\"G3303\">even</span> <span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">once</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1364\">again;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">but</span> <span class=\"wl wl-kjv\" data-code=\"G4567\">Satan</span> <span class=\"wl wl-kjv\" data-code=\"G1465\">hindered</span> <span class=\"wl wl-kjv\" data-code=\"G2248\">us.</span>","19":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">what</span> is <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G1680\">hope,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> <span class=\"wl wl-kjv\" data-code=\"G5479\">joy,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> <span class=\"wl wl-kjv\" data-code=\"G4735\">crown</span> of <span class=\"wl wl-kjv\" data-code=\"G2746\">rejoicing?</span> Are <span class=\"wl wl-kjv\" data-code=\"G3780\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">even</span> <span class=\"wl wl-kjv\" data-code=\"G5210\">ye</span> in the <span class=\"wl wl-kjv\" data-code=\"G1715\">presence</span> of <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">at</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3952\">coming?</span>","20":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G5210\">ye</span> <span class=\"wl wl-kjv\" data-code=\"G2075\">are</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5479\">joy.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ingang","tekst":"Dat is, eerste komst tot u om het Evangelie onder u te prediken. Zie Act 17:1, Act 17:4."},{"catchword":"ijdel","tekst":"Dat is, zonder kracht of vrucht."}],"2":[{"catchword":"te Filippi","tekst":"Ook een voorname stad in Macedonië, gelijk Act 16:12 verklaard is. Wat Paulus nu daar gedaan en geleden heeft, zie ook aldaar."},{"catchword":"in onzen","tekst":"Dat is, door de hulp en bijstand van onzen God."},{"catchword":"in veel","tekst":"Namelijk die ons, zo van de hardnekkige Joden als van de onwetende heidenen aangedaan, werd."}],"3":[{"catchword":"onze","tekst":"Namelijk om u tot de gehoorzaamheid van het Evangelie van Christus te brengen."},{"catchword":"uit verleiding","tekst":"Namelijk gelijk van de zodanigen was, die de wet met het Evangelie vermengden, om den haat der Joden te ontgaan. Zie 2Co 11:13, enz.; Gal 5:11, en elders meer."},{"catchword":"uit onreinigheid","tekst":"Namelijk gelijk van dezulke was, die de heiden in hunne wellusten toegaven en pluimstreken. Zie 2Pe 2:13; Jud 1:10, enz."},{"catchword":"noch met","tekst":"Namelijk om van hun eer, of geld, of andere wereldse voordelen behendiglijk te trekken, gelijk 2Co 11:20 van sommigen wordt betuigd, en hierna vs.5,6 wordt verklaard."}],"4":[{"catchword":"beproefd","tekst":"Dat is, bekwaam gekeurd, of geacht zijn, dat is, proefbaar of bekwaam gemaakt zijn. Zie Act 9:15; 2Co 3:5, 2Co 3:6; Gal 1:15, Gal 1:16, enz."},{"catchword":"toebetrouwd","tekst":"Dat is, bevolen, of bij ons in bewaring gelegd worden, om hetzelve naar Gods wil aan anderen uit te delen. Zie 1Co 4:1, 1Co 4:2; 2Co 5:19; 1Ti 1:11."},{"catchword":"harten","tekst":"Het woord beproeven wordt hier een weinig anders genomen dan hiervoren, namelijk voor onderzoeken of kennen, gelijk de oprechtheid des gouds door vuur beproefd en gekeurd wordt."}],"5":[{"catchword":"met pluimstrijkende","tekst":"Gr. in rede van pluimstrijking; namelijk gelijk de bedriegers plegen om de harten der mensen aan zich te trekken, niets lerende dan wat zij weten hun aangenaam te zijn."},{"catchword":"bedeksel","tekst":"Dat is, om uit gierigheid, onder enigen anderen schijn of deksel, iets van u te begeren."}],"6":[{"catchword":"tot","tekst":"Dit nemen sommigen voor de autoriteit en het groot aanzien, die hij onder hen niet heeft willen gebruiken, maar veel meer vriendelijkheid en nederigheid als jegens tedere en gehoorzame kinderen, gelijk de volgende woorden mede brengen. Zie ook 1Co 4:21. Anderen nemen het voor de lastigheid van onderhoud en andere onkosten, die voor den apostel en zijn gevolg van node waren, gelijk hij hiervan ook uitdrukkelijk spreekt vs.9."}],"7":[{"catchword":"vriendelijk","tekst":"Of, zachtmoedig, goedertieren."}],"8":[{"catchword":"tot","tekst":"Gr. u zeer begerende."},{"catchword":"onze","tekst":"Dat is, ons leven; niet dat het Evangelie niet meerder is dan het leven, maar omdat het nog zwaarder is, en van meerder toegenegenheid, het leven voor iemand te stellen, dan het Evangelie mede te delen."},{"catchword":"lief","tekst":"Namelijk vanwege uwen ijver in het aannemen des Evangelies, en uwe geduldigheid in het lijden voor hetzelve."}],"9":[{"catchword":"werkende","tekst":"Namelijk met onze handen in het tentenmaken, om mij en de mijnen zonder uwe kosten te onderhouden, Act 18:3, waarvan zie de oorzaak 2Co 11:12."}],"10":[{"catchword":"geweest","tekst":"Dat is, ons opder u gedragen hebben."}],"12":[{"catchword":"waardiglijk","tekst":"Dat is, gelijk het betaamt dengenen die God kennen, gehoorzaam zijn en Zijnen naam belijden."}],"13":[{"catchword":"der prediking","tekst":"Gr. des gehoors; dat is, dat gij hebt horen prediken, en God door Zijne dienaren ons laat horen; een Hebreeuwse wijze van spreken. Zie Isa 53:1; Rom 10:16, Rom 10:17."},{"catchword":"ontvangen","tekst":"Namelijk met de uitwendige oren."},{"catchword":"aangenomen","tekst":"Namelijk met het hart en het geloof, gelijk Act 16:14."},{"catchword":"dat ook","tekst":"Of, die, namelijk God ook werkt; namelijk de verzekerheid van de vergeving uwer zonden, den vrijmoedigen toegang tot God door den Heiligen Geest, liefde tot God en uwen naaste, hoop der zaligheid, lijdzaamheid en dergelijke deugden."}],"14":[{"catchword":"in Christus","tekst":"Hiermede onderscheidt hij de ware gemeente der Joden van de andere synagogen onder de joden, die zich ook voor Gods volk hielden, hoewel zij de anderen hunnen broederen, die Christus beleden, vervolgden. Zie Act 12:1; Heb 10:32, enz."},{"catchword":"eigen","tekst":"Namelijk die van de Joden daartoe opgemaakt waren. Zie daarvan Act 17:5. Het Griekse woord betekent eigenlijk degenen die van één stam, volk of gilde zijn."}],"15":[{"catchword":"gedood","tekst":"Dat is, ter dood vervolgd hebben, en niet gerust voordat zij Hem door de handen der ongelovigen aan het kruis hebben doen ombrengen. Zie Act 2:23."},{"catchword":"eigen","tekst":"Dat is, die uit hun eigen volk tot hen bijzonder van God waren gezonden."},{"catchword":"vervolgd","tekst":"Het Griekse woord betekent iemand alzo vervolgen, dat hij door de vervolging verjaagd en uitgeworpen wordt."},{"catchword":"alle","tekst":"Namelijk die hunne zaligheid in Christus zoeken."}],"16":[{"catchword":"te spreken","tekst":"Namelijk het Evangelie van Christus, hetwelk alleen een kracht Gods ter zaligheid is; Rom 1:16."},{"catchword":"ten allen tijde","tekst":"Dat is, gelijk voor dezen aan Christus en Zijne profeten, ook nu aan Zijne apostelen en anderen uitgezondenen. Zie Act 7:51-52."},{"catchword":"vervullen","tekst":"De mensen worden gezegd hunne zonden, of de maat hunner zonden te vervullen, wanneer hun voor een tijd, door Gods lankmoedigheid, het voortgaan in de zonden niet wordt verhinderd, totdat zij op het hoogste zijn gekomen, en God die alsdan met zware straffen te huis zoekt. Zie Gen 15:16; Mat 23:32, enz."},{"catchword":"de toorn","tekst":"Namelijk Gods, die hen rechtvaardiglijk in hunnen zonden vanwege hunne ondankbaarheid verhardt; Rom 9:18, Rom 9:22; 2Th 2:11, 2Th 2:12."},{"catchword":"tot het einde","tekst":"Of, ten uitersten. Dit wordt van sommigen verstaan van de zwakheid der straf, of des toorns Gods, die God zodanigen mensen hiernamaals pleegt over den hals te zenden; van anderen. wel zo bekwamelijk, van de gedurigheid dezer straf, of van den toorn Gods, welke dit hardnekkig geslacht der Joden is overkomen kort na dien tijd, wanneer God hen met het merendeel der anderen uit alle gewesten te Jeruzalem vergaderd door de Romeinen voorbeeldig heeft gestraft, en alzo uitgeroeid, dat zij nog geen volk meer zijn, maar verstrooid blijven onder alle volken, en in het algemeen verhard zijn in hunnen ongelovigheid; hetwelk de profetie van Daniel, Dan 9:26, enz. en de woorden van Christus, Mat 23:38, Ziet, uw huis wordt u woest gelaten, ook schijnen te bevestigen, gelijk ook Mat 24:15; Luk 21:20, enz. Eenigen nemen dit woord einde voor het einde der wereld, alzo dat de toorn Gods van dit volk nimmermeer zou ophouden; doch dit strijdt tegen de belofte en voorzegging van den apostel Paulus, Rom 11:25, enz. mitsgaders 2Co 3:15, 2Co 3:16 en andere plaatsen, waar de toekomende bekering van het volk der joden tot Christus wordt geprofeteerd."}],"17":[{"catchword":"van","tekst":"Dat is, van uwe tegenwoordigheid."},{"catchword":"beroofd","tekst":"Het Griekse woord betekent eigenlijk zulk ene afscheiding, gelijk een vader, van zijn kinderen gescheiden zijnde, hen als wezen alleen laat."},{"catchword":"voor","tekst":"Of, op een uur tijds. Want Paulus heeft haastelijk door den joden vervolging van hen moeten scheiden. Zie Act 17:10."},{"catchword":"naar het aangezicht","tekst":"Dat is, naar de lichamelijke tegenwoordigheid."},{"catchword":"te zien","tekst":"Dat is, wederom te zien, of tot u te komen."},{"catchword":"met","tekst":"Gr. in vele begeerte."}],"18":[{"catchword":"eenmaal","tekst":"Dat is, meermalen, gelijk Phi 4:16."},{"catchword":"heeft","tekst":"Namelijk door andere vervolgingen en verhinderingen, of door nieuwe moeiten, die hij in andere gemeenten heeft verwekt, die onze tegenwoordigheid vereisten."}],"19":[{"catchword":"onze hoop","tekst":"Dat is, stof of oorzaak van hoop en blijdschap."},{"catchword":"kroon","tekst":"Dat is, heerlijke roem, gelijk vs.20 verklaart."},{"catchword":"Zijt","tekst":"Namelijk benevens andere gemeenten door mij tot Christus bekeerd, waarover ik in Christus mag roemen, en mij de eeuwige roem, blijdschap en heerlijkheid van God uit genade zal worden vergolden. Zie 2Ti 4:7."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For ye yourselves know, brethren, our entrance unto you [That is, first coming unto you to preach the Gospel among you. See Act. 17. ver. 1, 14.] That it was not in vain [that is, without power or fruit.]"}],"2":[{"catchword":null,"tekst":"But although we had suffered before, and disgrace was also done unto us, as ye know, at Philippi, [Also a principal City in Macedonia, as is declared Act. 16. 12. Now what Paul did and suffered there, see there also] [nevertheless] we used boldness in our God [that is, by the help and assistance of our God.] to speak unto you the Gospel of God in much conflict. [Namely, which was procured us as well by the stiff-necked Jews as the ignorant Gentiles?]"}],"3":[{"catchword":null,"tekst":"For our exhortation [Namely, to bring you to the obedience of the Gospel of Christ.] was not of seduction [namely, as theirs was who mingled the Law with the Gospel, to avoid the hatred of the Jews: See 2 Cor. 11. 13, etc. Gal. 5. 11. and in divers other places] nor of impurity, [namely, as theirs was who indulged and flattered the Gentiles in their voluptuousness. See 2 Pet. 2. 13. and Jud. Ver. 10, etc] nor with guile: [namely, cunningly to get honor, or money, or other worldly advantages from them, as is testified of some, 2 Cor. 11. 20. and is declared hereafter ver. 5, 6.]"}],"4":[{"catchword":null,"tekst":"But as we were approved of God [That is, were judged or esteemed fit; i.e. were made useful or fit. See Act. 9. 15. 2 Cor. 3. 5, 6. Gal. 1. 15, 16. etc] that the Gospel should be committed in trust to us [that is, commended, or put into our custody, to dispense the same unto others according to Gods will. See 1 Cor. 4. 1, 2. 2 Cor. 5. 19. 1 Tim. 2. 11.] So we speak, not as pleasing men, but God, who proveth our hearts. [The word proves is here taken a little otherwise then before: namely, for searching or knowing; as the truth of gold is tried and approved by fire.]"}],"5":[{"catchword":null,"tekst":"For we never dealt with flattering words, [Gr. In speech of flattery. Namely, as deceivers use to do to draw men&acirc;&euro;&trade;s hearts unto them, teaching nothing but what they know to be acceptable to them, teaching nothing but what they know to be acceptable to them.] Even as ye know, nor with [any] cover of covetousness: [that is out of covetousness to desire anything of you, under any other show or covering [God is witness."}],"6":[{"catchword":null,"tekst":"Nor seeking honor of men, nor of you nor of others: although we might be a burden unto you [This some take for the authority and great respect which he would not make use of among them, but much rather kindness and humility, as towards tender and obedient children, as the following words import. See 1 Cor. 4. 21 . Others take it for the burdensomeness of maintenance, and other charges which were necessary for the Apostle and his followers, which he expressly speaks of, ver. 9.] as the Apostles of Christ:"}],"7":[{"catchword":null,"tekst":"But we were friendly [Or meek, kind] in the midst of you, even as a nurse cherisheth her children:"}],"8":[{"catchword":null,"tekst":"So we being greatly inclined unto you [Gr. greatly desiring you.] would gladly have imparted unto you] not onely the Gospel of God, but also our own souls. [That is, our lives: not as if the Gospel were of less value to than our life, but because it is yet more difficult and shows greater affection to lay down one&acirc;&euro;&trade;s life for any other, then to impart the Gospel.] Because ye were endeared unto us [Namely, because of your zeal in receiving the Gospel, and your patience in suffering of the same.]"}],"9":[{"catchword":null,"tekst":"For ye remember, brethren, our labour and pains; for working night and day, [Namely, with our hands intent-making to maintain myself and mine without your cost, Acts 18. 3. The cause whereof see 2 Cor. 11. 12.] That we might be burdensome to no man among you, we preached among you the Gospel God."}],"10":[{"catchword":null,"tekst":"Ye are witnesses, and God, how holily, and righteously, and unblameably we have been to you that believe, [That is, we have carried ourselves among you."}],"11":[{"catchword":null,"tekst":"Even as ye know we exhorted and comforted every one of you, as a father his children."}],"12":[{"catchword":null,"tekst":"And testified that ye should walk worthy of God, [That is, as it becomes those who know God, obey him, and profess his name] who calleth you unto his kingdom and glory."}],"13":[{"catchword":null,"tekst":"Therefore also we thank God without ceasing, that as ye have received from us [Namely, with your outward ears] the word of the preaching God, [Gr. Of the hearing, i.e. which ye have heard preached, and God lets us hear by his Ministers. An Hebrew phrase. See Isa. 53. 1. Rom. 10. 16, 17] ye embraced it [namely, with the heart and faith, as Act. 16. 14.] not [as] the word of men, but (as it is in truth) [as] the word of God which also worketh in you that believe. [Or who, namely God, also worketh, namely, the assurance of the forgiveness of your sins, a bold access to God through the Holy Ghost, love to God and your neighbor, hope of salvation, patience, and the like virtues.]"}],"14":[{"catchword":null,"tekst":"For ye brethren became followers of the Churches of God which are in Judea // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
