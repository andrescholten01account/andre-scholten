a","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar broeders, over de tijden en de gelegenheden hebt u niet nodig dat men u schrijft.","2":"Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.","3":"Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere *vrouw* overkomen; en zij zullen het geenszins ontvluchten;","4":"Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.","5":"U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.","6":"Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.","7":"Want wie slapen, slapen 's nachts, en wie dronken zijn, zijn 's nachts dronken;","8":"Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.","9":"Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus.","10":"Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.","11":"Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.","12":"En wij bidden u, broeders, erken hen die onder u arbeiden, en uw voorstanders zijn in de Heere, en u vermanen;","13":"En acht hen zeer veel in liefde, om hun werk. Wees vreedzaam onder elkaar.","14":"En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.","15":"Zie erop toe dat niemand kwaad met kwaad vergeldt bij wie dan ook; maar jaag altijd het goede na, zowel tegenover elkaar als tegenover allen.","16":"Wees blij, altijd.","17":"Bid zonder ophouden.","18":"Dank *God* in alles; want dit is de wil van God in Christus Jezus over u.","19":"Blus de Geest niet uit.","20":"Veracht de profetieën niet.","21":"Beproef alle dingen; behoud het goede.","22":"Onthoud u van elke schijn van het kwaad.","23":"En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.","24":"Hij, Die u roept, is getrouw, Die het ook doen zal.","25":"Broeders, bid voor ons.","26":"Groet al de broeders met een heilige kus.","27":"Ik bezweer u bij de Heere, dat deze brief aan alle heilige broeders voorgelezen wordt.","28":"De genade van onze Heere Jezus Christus zij met u. Amen. *De* eerste *brief* aan de Thessalonicenzen werd geschreven vanuit Athene."},"SV":{"1":"Maar van de tijden en de gelegenheden, broeders! hebt gij niet van node, dat men u schrijve.","2":"Want gij weet zelven zeer wel, dat de dag des Heeren alzo zal komen, gelijk een dief in den nacht.","3":"Want wanneer zij zullen zeggen: Het is vrede, en zonder gevaar; dan zal een haastig verderf hun overkomen, gelijk de barensnood een bevruchte *vrouw*; en zij zullen het geenszins ontvlieden;","4":"Maar gij, broeders, gij zijt niet in duisternis, dat u die dag als een dief zou bevangen.","5":"Gij zijt allen kinderen des lichts, en kinderen des daags; wij zijn niet des nachts, noch der duisternis.","6":"Zo laat ons dan niet slapen, gelijk als de anderen, maar laat ons waken, en nuchteren zijn.","7":"Want die slapen, slapen des nachts, en die dronken zijn, zijn des nachts dronken;","8":"Maar wij, die des daags zijn, laat ons nuchteren zijn, aangedaan hebbende het borstwapen des geloofs en der liefde, en *tot* een helm, de hoop der zaligheid.","9":"Want God heeft ons niet gesteld tot toorn, maar tot verkrijging der zaligheid, door onzen Heere Jezus Christus.","10":"Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, te zamen met Hem leven zouden.","11":"Daarom vermaant elkander, en sticht de een den anderen, gelijk gij ook doet.","12":"En wij bidden u, broeders, erkent degenen, die onder u arbeiden, en uw voorstanders zijn in den Heere, en u vermanen;","13":"En acht hen zeer veel in liefde, om huns werks wil. Zijt vreedzaam onder elkander.","14":"En wij bidden u, broeders, vermaant de ongeregelden, vertroost de kleinmoedigen, ondersteunt de zwakken, zijt lankmoedig jegens allen.","15":"Ziet, dat niemand kwaad voor kwaad iemand vergelde; maar jaagt allen tijd het goede na, zo jegens elkander als jegens allen.","16":"Verblijdt u te allen tijd.","17":"Bidt zonder ophouden.","18":"Dankt *God* in alles; want dit is de wil van God in Christus Jezus over u.","19":"Blust den Geest niet uit.","20":"Veracht de profetieën niet.","21":"Beproeft alle dingen; behoudt het goede.","22":"Onthoudt u van allen schijn des kwaads.","23":"En de God des vredes Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam worde onberispelijk bewaard in de toekomst van onzen Heere Jezus Christus.","24":"Hij, Die u roept, is getrouw, Die het ook doen zal.","25":"Broeders, bidt voor ons.","26":"Groet al de broeders met een heiligen kus.","27":"Ik bezweer ulieden bij den Heere, dat deze zendbrief al den heiligen broederen gelezen worde.","28":"De genade van onzen Heere Jezus Christus zij met ulieden. Amen. *De* eerste *brief* aan de Thessalonicenzen werd geschreven vanuit Athene."},"KJV":{"1":"But of the times and the seasons, brethren, ye have no need that I write unto you.","2":"For yourselves know perfectly that the day of the Lord so cometh as a thief in the night.","3":"For when they shall say, Peace and safety; then sudden destruction cometh upon them, as travail upon a woman with child; and they shall ➔ not escape.","4":"But ye, brethren, are not in darkness, that that day should overtake you as a thief.","5":"Ye are all the children of light, and the children of the day: we are not of the night, nor of darkness.","6":"Therefore let us ➔ not sleep, as do others; but let us watch and be sober.","7":"For they that sleep sleep in the night; and they that be drunken are drunken in the night.","8":"But let ➔ us, who are of the day, be sober, putting on the breastplate of faith and love; and for an helmet, the hope of salvation.","9":"For God hath ➔ not appointed us to wrath, but to obtain salvation by our Lord Jesus Christ,","10":"Who died for us, that, whether we wake or sleep, we should live together with him.","11":"Wherefore comfort yourselves together, and edify one another, even as also ye do.","12":"And we beseech you, brethren, to know them which labour among you, and are over you in the Lord, and admonish you;","13":"And to esteem them very highly in love for their work's sake. And be at peace among yourselves.","14":"Now we exhort you, brethren, warn them that are unruly, comfort the feebleminded, support the weak, be patient toward all men.","15":"See that none render evil for evil unto any man; but ever follow that which is good, both among yourselves, and to all men.","16":"Rejoice evermore.","17":"Pray without ceasing.","18":"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","19":"Quench not the Spirit.","20":"Despise not prophesyings.","21":"Prove all things; hold fast that which is good.","22":"Abstain from all appearance of evil.","23":"And the very God of peace sanctify you wholly; and I pray God your whole spirit and soul and body be preserved blameless unto the coming of our Lord Jesus Christ.","24":"Faithful is he that calleth you, who also will do it.","25":"Brethren, pray for us.","26":"Greet all the brethren with an holy kiss.","27":"I charge you by the Lord that this epistle be read unto all the holy brethren.","28":"The grace of our Lord Jesus Christ be with you. Amen.[fn]"}},"tsk":{"1":[{"kopje":"de tijden","refs":["Matt 24:3","Matt 24:36","Mark 13:30-32","Hand 1:7"]},{"kopje":"u","refs":["1 Tess 4:9","2 Kor 9:1","Judas 1:3"]}],"2":[{"kopje":"weet","refs":["Jer 23:20"]},{"kopje":"de dag","refs":["Matt 24:42-44","Matt 25:13","Mark 13:34","Mark 13:35","Luk 12:39","Luk 12:40","2 Petr 3:10","Openb 3:3","Openb 16:15"]}],"3":[{"kopje":"vrede","refs":["Deut 29:19","Richt 18:27","Richt 18:28","Ps 10:11-13","Jes 21:4","Jes 56:12","Dan 5:3-6","Nahum 1:10","Matt 24:37-39","Luk 17:26-30","Luk 21:34","Luk 21:35"]},{"kopje":"dan","refs":["Ex 15:9","Ex 15:10","Joz 8:20-22","Richt 20:41","Richt 20:42","2 Kron 32:19-21","Ps 73:18-20","Spr 29:1","Jes 30:13","Luk 17:27-29","Luk 21:34","Luk 21:35","Hand 12:22","Hand 12:23","Hand 13:41","2 Tess 1:9","2 Petr 2:4","Openb 18:7","Openb 18:8"]},{"kopje":"zoals","refs":["Ps 48:7","Jes 43:6-9","Jes 21:3","Jer 4:31","Jer 6:24","Jer 13:21","Jer 22:23","Hos 13:13","Micha 4:9","Micha 4:10"]},{"kopje":"en zij","refs":["Matt 23:33","Hebr 2:3","Hebr 12:23"]}],"4":[{"kopje":"bent","refs":["Rom 13:11-13","Kol 1:13","1 Petr 2:9","1 Petr 2:10","1 Joh 2:8"]},{"kopje":"overvallen","refs":["Deut 19:6","Deut 28:15","Deut 28:45","Jer 42:16","Hos 10:9","Zach 1:6"]}],"6":[{"kopje":"laten wij niet slapen","refs":["Spr 19:15","Jes 56:10","Jona 1:6","Matt 13:25","Matt 25:5","Mark 14:37","Luk 22:46","Rom 13:11-14","1 Kor 15:34","Ef 5:14"]},{"kopje":"waken","refs":["Matt 24:42","Matt 25:13","Matt 26:38","Matt 26:40","Matt 26:41","Mark 13:34","Ma \" data-code=\"G4160\">do</span> it.","25":"<span class=\"wl wl-kjv\" data-code=\"G80\">Brethren,</span> <span class=\"wl wl-kjv\" data-code=\"G4336\">pray</span> <span class=\"wl wl-kjv\" data-code=\"G4012\">for</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">us.</span>","26":"<span class=\"wl wl-kjv\" data-code=\"G782\">Greet</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G80\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> an <span class=\"wl wl-kjv\" data-code=\"G40\">holy</span> <span class=\"wl wl-kjv\" data-code=\"G5370\">kiss.</span>","27":"I <span class=\"wl wl-kjv\" data-code=\"G3726\">charge</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> by the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> that this <span class=\"wl wl-kjv\" data-code=\"G1992\">epistle</span> be <span class=\"wl wl-kjv\" data-code=\"G314\">read</span> unto <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G40\">holy</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brethren.</span>","28":"The <span class=\"wl wl-kjv\" data-code=\"G5485\">grace</span> of <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> be <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">you.</span> <span class=\"wl wl-kjv\" data-code=\"G281\">Amen.</span>[fn]"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de gelegenheden,","tekst":"Namelijk der tijden; bij het eerste wordt verstaan het jaar, maand, of dag; bij het laatste wordt verstaan, of het licht, nacht, morgenstond of middernacht zal zijn, of dergelijke. Zie Mar 13:34, Mar 13:35; Act 1:7."}],"2":[{"catchword":"de dag","tekst":"Alzo wordt de laatste dag doorgaans genoemd, omdat alsdan Christus des nachts zal komen als een Heere, om te oordelen de levenden en de doden."},{"catchword":"zal","tekst":"Gr. komt. Zo spreken de profeten van toekomende dingen, alsof zij reeds tegenwoordig waren, om de zekerheid derzelve."},{"catchword":"gelijk","tekst":"Hieruit volgt niet dan Christus des nachts zal komen, gelijk sommigen menen; maar daarmede wordt geleerd dat Hij onverhoeds en onverwachts komen zal, namelijk ten aanzien van de wereldse mensen, gelijk het volgende verklaart; vs.3 want de godzaligen moeten daarnaar altijd verlangen, en daartegen op hunnen hoede zijn, gelijk hierna, vs.4, wordt betuigd. Zie ook Mat 24:42, enz."}],"3":[{"catchword":"zij","tekst":"Namelijk de wereldse en goddeloze mensen."},{"catchword":"zeggen","tekst":"Namelijk òf met woorden, òf tenminste in hun hart, gelijk Psa 14:1."},{"catchword":"zonder","tekst":"Gr. zekerheid, dat is, daar is geen ongeval te vrezen. Zie Mat 24:37, enz."},{"catchword":"een","tekst":"Of, onvoorziens; Luk 21:34."}],"4":[{"catchword":"in","tekst":"Dat is, in onwetendheid en zorgeloosheid, gelijk de anderen waarvan hij tevoren gesproken heeft."},{"catchword":"als","tekst":"Namelijk die onverwachts en in het duister pleegt te komen."}],"5":[{"catchword":"Gij","tekst":"Namelijk die in Christus gelooft."},{"catchword":"kinderen des lichts","tekst":"Dat is, met de ware kennis van Christus en van Zijn wil begaafd, en daaraan als kinderen hunnen vader gehoorzamen."}],"6":[{"catchword":"slapen","tekst":"Dat is, in vleselijke zorgeloosheid leven."},{"catchword":"waken","tekst":"Dat is, op onze hoede zijn, en met geestelijk zorg op Hem wachten."},{"catchword":"nuchteren","tekst":"Dit wordt gesteld niet tegen matig eten en drinken, maar tegen brasserij, dronkenschap en andere wereldse bezwaringen, gelijk Christus zelf verklaart Luk 21:34."}],"7":[{"catchword":"zijn des","tekst":"Dat is, plegen gemeenlijk des nachts dronken te zijn. Hij neemt hier enen reden van hetgeen meest placht te geschieden; want anders zijn er ook wel, die des morgens vroeg opstaan om sterken drank te drinken; Isa 5:11."}],"8":[{"catchword":"die","tekst":"Dat is, die kinderen des lichts zijn, gelijk hij vs.5 gesproken heeft."},{"catchword":"het borstwapen","tekst":"Dat is, voorzien zijnde met het geloof en de liefde, als met een borstwapen tegen aanvallen des Satans. Zie 1Pe 5:8, 1Pe 5:9."},{"catchword":"tot","tekst":"Dat is, als een helm. zie van deze gehele geestelijke wapenrusting eens Christens, Eph 6:11, enz."}],"9":[{"catchword":"gesteld","tekst":"Dat is, geordineerd, of geschikt, gelijk 1Pe 2:8."},{"catchword":"tot toorn","tekst":"Dat is, om te zijn vaten des toorns, of om een rechtvaardige straf en het verderf over ons te brengen. Zie Rom 9:22."},{"catchword":"verkrijging","tekst":"Het Griekse woord betekent eigenlijk veel doen omtrent ene zaak om die te verkrijgen, gelijk Act 20:28; 1Pe 2:9. Hoewel God ons ter zaligheid heeft uitverkoren, en Christus ons die heeft verworven, zo moeten wij evenwel zorgvuldig zijn, om de middelen te gebruiken, waardoor ons God ter zaligheid brengt. Zie Eph 2:10, en Phi 2:12."}],"10":[{"catchword":"slapen","tekst":"Dit woord slapen wordt hier niet genomen gelijk tevoren vs.6, want die in de zonden slapen, leven met Christus niet; maar wordt genomen òf voor de natuurlijken slaap des mensen, òf veeleer voor ontslapen of gestorven zijn. Want Christus is daartoe gestorven, opdat hetzij dat wij waken, dat is hier leven, of dat wij slapen, dat is gestorven zijn, wij met Christus zouden leven, namelijk hier een geestelijk leven, en hiernamaals een eeuwig en onvergankelijk leven in heerlijkheid. Zie dergelijke Rom 14:8, enz."}],"11":[{"catchword":"vermaant","tekst":"Of, vertroost; want het Griekse woord betekent beide."},{"catchword":"sticht","tekst":"Namelijk zo met goede exempelen, als met goede onderrichtingen."}],"12":[{"catchword":"erkent","tekst":"Namelijk voor zodanigen als zijn vanwege hun beroep zijn, en behoren gehouden te worden. Zie 1Co 16:18."},{"catchword":"arbeiden","tekst":"Namelijk in het woord en de leer, gelijk hij daar bijvoegt, 1Ti 5:17."},{"catchword":"voorstanders","tekst":"Namelijk nevens de leraars in de regering der gemeente en uitoefening der tucht, gelijk de apostel deze twee soorteen van ouderlingen ook klaarlijk onderscheidt, 1Ti 5:17."},{"catchword":"in","tekst":"Dat is, in het werk des Heeren, namelijk om die te onderscheiden van de werelse overheden, waar zij onder stonden."},{"catchword":"u vermanen","tekst":"Dit kan beiden worden verstaan, zo van de ouderlingen, die in het woord arbeiden, alsook van degenen, die alleen voorstanders zijn in de regering, welken de bijzonder vermaningen ook toekomnen nevens de leraars. Zie hiervan Rom 12:8; 1Co 12:28."}],"13":[{"catchword":"in","tekst":"Dat is, niet uit vrees of dwang, maar uit toegenegenheid."},{"catchword":"om","tekst":"Dat is, vanwege den dienst, dien zij u van Christus' wege doen, en tot bevordering van den dienst."}],"14":[{"catchword":"de ongeregelden","tekst":"Namelijk lediggangers en dergelijke, waarvan hij breder handelt 2Th 3:10, enz."},{"catchword":"ondersteunt","tekst":"Of, houdt staande de zwakken; namelijk in het geloof; gelijk Rom 15:1."}],"15":[{"catchword":"het goede","tekst":"Dat is, goeddadigheid, alzo dit hier wordt gesteld tegen wraakgierigheid."}],"16":[{"catchword":"Verblijdt","tekst":"Dat is, zijt altijd goedsmoeds en wel tevreden, zelfs in het midden van alle verdrukkingen; Rom 5:3; 2Co 6:10."}],"17":[{"catchword":"zonder","tekst":"Dat is, bij alle gelegenheden en al uwen nood."}],"18":[{"catchword":"in alles","tekst":"Dat is, zowel in tegenspoed als in voorspoed, u den wil des Heeren alzo gaarne onderwerpende. Zie Job 1:21; Mat 5:11, Mat 5:12."},{"catchword":"de wil","tekst":"Dat is, hetgeen God aangenaam is in Christus Jezus; Heb 13:21. Of, het welbehagen Gods over u. Zie 1Pe 3:17."}],"19":[{"catchword":"Blust","tekst":"Dit kan verstaan worden, òf van de verlichting en andere gaven des Geestes, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
