r waren twee vrouwen, dochters van één moeder.","3":"Deze hoereerden in Egypte; in hun jeugd hoereerden zij. Daar werden hun borsten gedrukt, en daar werden de tepels van hun maagdelijkheid betast.","4":"Hun namen nu waren: Ohola, de grootste, en Oholiba, haar zuster; en zij werden de Mijne, en baarden zonen en dochters. Dit waren hun namen: Samaria is Ohola, en Jeruzalem Oholiba.","5":"Ohola nu hoereerde, terwijl zij van Mij was; en zij werd verliefd op haar minnaars, op de Assyriërs, die dichtbij waren,","6":"Bekleed met hemelsblauw, vorsten en machthebbers, allemaal aantrekkelijke jonge mannen, ruiters, rijdend op paarden.","7":"Zo dreef zij haar hoererijen met hen, die allen de keur van de zonen van Assur waren; en met allen op wie zij verliefd was, met al hun drekgoden*, verontreinigde zij zich.","8":"Zij liet ook haar hoererijen niet varen, *meegebracht* uit Egypte; want zij hadden bij haar in haar jeugd gelegen, en zij hadden de tepels van haar maagdelijkheid betast, en zij hadden hun hoererij over haar uitgestort.","9":"Daarom gaf Ik haar over in de hand van haar minnaars, in de hand van de zonen van Assur, op wie zij verliefd was.","10":"Dezen ontdekten haar schaamte, haar zonen en haar dochters namen zij weg, maar haar doodden zij met het zwaard; en zij kreeg een naam onder de vrouwen, nadat men strafgerichten over haar had uitgevoerd.","11":"Toen haar zuster Oholiba *dit* zag, verdierf zij haar liefdesdrift nog meer dan zij, en haar hoererijen meer dan de hoererijen van haar zuster.","12":"Zij werd verliefd op de zonen van Assur, de vorsten en machthebbers, die dichtbij waren, bekleed met volmaakte pracht, ruiters, rijdend op paarden, allemaal aantrekkelijke jonge mannen.","13":"Toen zag Ik dat zij verontreinigd was; zij hadden beiden dezelfde weg.","14":"Ja, zij ging in haar hoererijen nog verder; want toen zij mannen afgebeeld zag op de wand, de beelden van de Chaldeeën, geschilderd met menie,","15":"Omgord met een gordel om hun heupen, met overvloedig geverfde *hoofddoeken* op hun hoofden, die er allen uitzagen als hoofdmannen, *naar* de gelijkenis van de zonen van Babel, van Chaldea, het land van hun geboorte,","16":"Werd zij op hen verliefd bij het zien met haar ogen, en zij zond boden naar hen, naar Chaldea.","17":"De zonen van Babel nu kwamen tot haar, in het bed van de liefde, en verontreinigden haar met hun hoererij; ook verontreinigde zij zich met hen; daarna werd haar ziel van hen afgekeerd.","18":"Zo ontdekte zij haar hoererijen, en ontdekte haar schaamte; toen werd Mijn ziel van haar afgekeerd, zoals Mijn ziel afgekeerd was van haar zuster.","19":"Toch vermenigvuldigde zij haar hoererijen, terwijl zij dacht aan de dagen van haar jeugd, toen zij gehoereerd had in het land Egypte.","20":"En zij werd verliefd op hun bijslapen, van wie het vlees is als het vlees van ezels, en van wie de vloed is als de vloed van paarden.","21":"Zo hebt u weer opgehaald de schandelijke daad van uw jeugd, toen die van Egypte uw tepels betastten, vanwege de borsten van uw jeugd.","22":"Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen.","23":"De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, *en* alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde *mannen*, die allen te paard rijden.","24":"Die zullen tegen u komen *met* karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.","25":"En Ik zal Mijn na-ijver tegen u inzetten, zodat zij in grimmigheid met u zullen handelen; zij zullen uw neus en uw oren afsnijden, en wat er van u overblijft zal door het zwaard vallen; zij zullen uw zonen en uw dochters wegnemen, en wat er van u overblijft zal door het vuur verteerd worden.","26":"Zij zullen u ook uw kleren uittrekken, en uw sierlijke sieraden wegnemen.","27":"Zo zal Ik uw schandelijkheid van u doen ophouden, alsook uw hoererij, *meegebracht* uit het land Egypte; en u zult uw ogen niet meer naar hen opheffen, en aan Egypte niet meer denken.","28":"Want zo zegt de Heere HEERE: Zie, Ik zal u overgeven in de hand van hen die u haat, in de hand van hen van wie uw ziel is afgekeerd.","29":"Die zullen met u handelen uit haat, en al uw arbeid wegnemen, en u naakt en bloot laten liggen, zodat de schaamte van uw hoererijen ontdekt wordt, alsook uw schandelijkheid en uw hoererijen.","30":"Deze dingen zal men u aandoen, omdat u de heidenvolken bent nagehoereerd, *en* omdat u zich met hun drekgoden verontreinigd hebt.","31":"In de weg van uw zuster hebt u gewandeld, daarom zal Ik haar beker in uw hand geven.","32":"Zo zegt de Heere HEERE: U zult de beker van uw zuster drinken, die diep en wijd is; u zult tot belaching en spot worden; *de* *beker* houdt veel in.","33":"Van dronkenschap en verdriet zult u vol worden; de beker van uw zuster Samaria is een beker van verwoesting en eenzaamheid.","34":"U zult hem drinken en uitzuigen, en zijn scherven zult u verbrijzelen, en uw borsten zult u afscheuren; want Ik heb het gesproken, spreekt de Heere HEERE.","35":"Daarom, zo zegt de Heere HEERE: Omdat u Mij vergeten hebt, en Mij achter uw rug geworpen hebt, daarom draagt u ook uw schandelijkheid en uw hoererijen.","36":"En de HEERE zei tegen mij: Mensenkind! Zou u Ohola en Oholiba recht geven? Nee, wijs hun hun gruwelen aan.","37":"Want zij hebben overspel gepleegd, en er is bloed aan hun handen; en zij hebben met hun drekgoden overspel gepleegd; daarbij hebben zij ook hun kinderen, die zij Mij gebaard hadden, voor hen *door het vuur* laten doorgaan, tot voedsel.","38":"Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.","39":"Want toen zij hun kinderen voor hun drekgoden geslacht hadden, kwamen zij op diezelfde dag in Mijn heiligdom, om dat te ontheiligen; en zie, zo hebben zij gedaan in het midden van Mijn huis.","40":"Dit ook: zij hebben gezonden naar mannen die van ver zouden komen; naar wie een bode gezonden was, en zie, zo kwamen zij, voor wie u zich waste, uw ogen zwart maakte, en u met sieraad tooide.","41":"En u zat op een prachtig bed, waarvoor een tafel klaargemaakt was, en waarop u Mijn reukwerk en Mijn olie had neergezet.","42":"Toen het rumoer van de menigte daarbij tot rust gekomen was, werden er mannen gehaald uit de menigte van mensen, *en* daar werden wijndrinkers aangevoerd uit de woestijn; die deden armbanden om hun handen, en een sierlijke kroon op hun hoofden.","43":"Toen zei Ik van haar, die *van* overspel oud en versleten was: Nu zullen zij hoereren, de hoererijen met deze *hoer*, en zij ook.","44":"En men ging tot haar in, zoals men ingaat tot een vrouw die een hoer is; zo gingen zij in tot Ohola en tot Oholiba, die schandelijke vrouwen.","45":"Rechtvaardige mannen dan, die zullen hen berechten *naar* het recht van overspeelsters, en *naar* het recht van vrouwen die bloed vergieten; want zij zijn overspeelsters, en bloed is aan hun handen.","46":"Want zo zegt de Heere HEERE: Ik zal een menigte tegen hen doen opkomen, en zal hen overgeven ter beangstiging en ten roof.","47":"En de menigte zal hen met stenen stenigen, en hen met hun zwaarden neerhouwen; hun zonen en hun dochters zullen zij doden, en hun huizen met vuur verbranden.","48":"Zo zal Ik de schandelijkheid uit het land doen ophouden, opdat alle vrouwen onderwezen worden zodat zij niet naar uw schandelijkheid handelen.","49":"Zo zullen zij uw schandelijkheid op u leggen, en u zult de zonden van uw drekgoden dragen; en u zult weten dat Ik de Heere HEERE ben."},"SV":{"1":"Verder geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind! daar waren twee vrouwen, dochteren van een moeder.","3":"Dezen hoereerden in Egypte; in haar jeugd hoereerden zij; daar werden haar borsten gedrukt, en daar werden de tepelen haars maagdoms betast.","4":"Haar namen nu waren: Ohola, de grootste, en Oholiba, haar zuster; en zij werden de Mijne, en baarden zonen en dochteren; dit waren haar namen: Samaria is Ohola, en Jeruzalem Oholiba.","5":"Ohola nu hoereerde, zijnde onder Mij; en zij werd verliefd op haar boelen, op de Assyriërs, die nabij waren;","6":"Bekleed met hemelsblauw, vorsten en overheden, altemaal gewenste jongelingen, ruiteren, rijdende op paarden.","7":"Alzo dreef zij haar hoererijen met dezelve, die allen de keure der kinderen van Assur waren; en met allen, op dewelke zij verliefd was, met al derzelver drekgoden, verontreinigde zij zich.","8":"Zij verliet ook haar hoererijen niet, *gebracht* uit Egypte; want zij hadden bij haar in haar jeugd gelegen, en zij hadden de tepelen haars maagdoms betast, en zij hadden hun hoererij over haar uitgestort.","9":"Daarom gaf Ik haar in de hand van haar boelen over, in de hand der kinderen van Assur, op dewelke zij verliefd was.","10":"Dezen ontdekten haar schaamte, haar zonen en haar dochteren namen zij weg, maar haar doodden zij met het zwaard; en zij kreeg een naam onder de vrouwen, nadat men gerichten over haar geoefend had.","11":"Als haar zuster, Oholiba, *dit* zag, zo verdierf zij haar minne nog meer dan zij, en haar hoererijen meer dan de hoererijen van haar zuster.","12":"Zij werd verliefd op de kinderen van Assur, de vorsten en overheden, die nabij waren, bekleed met volkomen sieraad, ruiteren, rijdende op paarden, altemaal gewenste jongelingen.","13":"Toen zag Ik, dat zij verontreinigd was; zij hadden beiden enerlei weg.","14":"Ja, zij deed tot haar hoererijen nog meer toe; want toen zij geschilderde mannen aan den wand zag, de beelden der Chaldeen, geschilderd met menie,","15":"Gegord met een gordel aan hun lenden, hebbende overvloedig geverfde *hoeden* op hun hoofden, die allen in het aanzien hoofdmannen waren, *naar* de gelijkenis der kinderen van Babel, van Chaldea, het land hunner geboorte;","16":"Zo werd zij op dezelve verliefd met het opzien van haar ogen, en zij zond boden tot hen, naar Chaldea.","17":"De kinderen van Babel nu kwamen tot haar in tot het leger der minne, en verontreinigden haar met hun hoererij; ook verontreinigde zij zich met hen; daarna werd haar ziel van hen afgetrokken.","18":"Alzo ontdekte zij haar hoererijen, en ontdekte haar schaamte; toen werd Mijn ziel van haar afgetrokken, gelijk als Mijn ziel was afgetrokken van haar zuster.","19":"Doch zij vermenigvuldigde haar hoererijen, gedenkende aan de dagen van haar jeugd, als zij gehoereerd had in het land van Egypte.","20":"En zij werd verliefd meer dan derzelver bijwijven, welker vlees is *als* het vlees der ezelen, en welker vloed is *als* de vloed der paarden.","21":"Alzo hebt gij weder opgehaald de schandelijke daad uwer jeugd, als die van Egypte uw tepelen betastten, vanwege de borsten uwer jeugd.","22":"Daarom, o Oholiba! alzo zegt de Heere HEERE: Zie, Ik zal uw boelen, van welke uw ziel is afgetrokken, tegen u verwekken, en Ik zal hen van rondom tegen u aanbrengen.","23":"De kinderen van Babel en alle Chaldeen, Pekod, en Soa, en Koa, *en* alle kinderen van Assur met hen; gewenste jongelingen, die allen vorsten en overheden zijn, hoofdmannen en vermaarde *lieden*, die allen te paard rijden.","24":"Die zullen tegen u komen *met* karren, wagenen en wielen, en met een vergadering van volken, rondassen, en schilden, en helmen; zij zullen zich rondom tegen u zetten; en Ik zal voor hun aangezicht het gericht stellen, en zij zullen u richten naar hun rechten.","25":"En Ik zal Mijn ijver tegen u zetten, dat zij in grimmigheid met u zullen handelen; zij zullen uw neus en uw oren afnemen, en het laatste van u zal door het zwaard vallen; zij zullen uw zonen en uw dochteren wegnemen, en het laatste van u zal door het vuur verteerd worden.","26":"Zij zullen u ook uw klederen uittrekken, en uw sieraadtuig wegnemen.","27":"Zo zal Ik uw schandelijkheid van u doen ophouden, mitsgaders uw hoererij, *gebracht* uit Egypteland; en gij zult uw ogen naar hen niet opheffen, en aan Egypte niet meer gedenken.","28":"Want alzo zegt de Heere HEERE: Zie, Ik zal u overgeven in de hand dergenen, die gij haat, in de hand dergenen, van dewelken uw ziel is afgetrokken.","29":"Die zullen met u handelen uit haat, en al uw arbeid wegnemen, en u naakt en bloot laten, dat uw hoerenschaamte ontdekt worde, mitsgaders uw schandelijkheid en uw hoererijen.","30":"Deze dingen zal men u doen, dewijl gij de heidenen nagehoereerd hebt, *en* omdat gij u met hun drekgoden verontreinigd hebt.","31":"In den weg uwer zuster hebt gij gewandeld, daarom zal Ik haar beker in uw hand geven.","32":"Alzo zegt de Heere HEERE: Gij zult den beker uwer zuster drinken, die diep en wijd is; gij zult tot belaching en spot worden; *de* *beker* houdt veel in.","33":"Van dronkenschap en jammer zult gij vol worden; de beker van uw zuster Samaria is een beker der verwoesting en der eenzaamheid.","34":"Gij zult hem drinken en uitzuigen, en zijn scherven zult gij brijzelen, en uw borsten zult gij afrukken; want Ik heb het gesproken, spreekt de Heere HEERE.","35":"Daarom, alzo zegt de Heere HEERE: Omdat gij Mijner vergeten, en Mij achter uw rug geworpen hebt, zo draagt gij ook uw schandelijkheid en uw hoererijen.","36":"En de HEERE zeide tot mij: Mensenkind! zoudt gij Ohola en Oholiba recht geven? Ja, vertoon haar haar gruwelen.","37":"Want zij hebben overspel gedaan, en er is bloed in haar handen; en zij hebben met haar drekgoden overspel gedaan; daartoe hebben zij ook haar kinderen, die zij Mij gebaard hadden, voor hen *door* *het* *vuur* laten doorgaan, tot spijze.","38":"Nog hebben zij Mij dit gedaan; zij hebben Mijn heiligdom ten zelven dage verontreinigd, en Mijn sabbatten ontheiligd.","39":"Want als zij hun kinderen hun drekgoden geslacht hadden, zo kwamen zij op dienzelven dag in Mijn heiligdom, om dat te ontheiligen; en ziet, alzo hebben zij gedaan in het midden van Mijn huis.","40":"Dit is er ook, dat zij gezonden hebben tot mannen, die van verre zouden komen; tot dewelken als een bode gezonden was, ziet, zo kwamen zij, voor dewelken gij u wiest, uw ogen blankettet en u met sieraad versierdet;","41":"En gij zat op een heerlijk bed, voor hetwelk een tafel toegericht was, en op hetwelk gij Mijn reukwerk en Mijn olie gezet hadt.","42":"Als nu het geruis der menigte daarop stil was, zo *zonden* *zij* tot mannen uit de menigte der mensen, *en* daar werden wijnzuipers aangebracht uit de woestijn; die deden armringen aan haar handen, en een sierlijke kroon op haar hoofden.","43":"Toen zeide Ik van deze, die *van* overspelerijen verouderd was: Nu zullen zij hoereren de hoererijen dezer *hoer*, en die *ook*.","44":"En men ging tot haar in, gelijk men ingaat tot een vrouw, die een hoer is; alzo gingen zij in tot Ohola en tot Oholiba, die schandelijke vrouwen.","45":"Rechtvaardige mannen dan, die zullen haar richten *naar* het recht der overspeelsters, en *naar* het recht der bloedvergietsters; want zij zijn overspeelsters, en bloed is in haar handen.","46":"Want alzo zegt de Heere HEERE: Ik zal een vergadering tegen haar doen opkomen, en zal ze ter beroering en ten roof overgeven.","47":"En de vergadering zal ze met stenen stenigen, en dezelve met hun zwaarden nederhouwen; haar zonen en haar dochteren zullen zij doden, en haar huizen met vuur verbranden.","48":"Alzo zal Ik de schandelijkheid uit het land doen ophouden; opdat alle vrouwen onderwezen worden, dat zij naar uw schandelijkheid niet doen.","49":"Alzo zullen zij uw schandelijkheid op u leggen, en gij zult de zonden uwer drekgoden dragen; en gijlieden zult weten, dat Ik de Heere HEERE ben."},"KJV":{"1":"The word of the LORD came again unto me, saying,","2":"Son of man, there were two women, the daughters of one mother:","3":"And they committed whoredoms in Egypt; they committed whoredoms in their youth: there were their breasts pressed, and there they bruised the teats of their virginity.","4":"And the names of them *were* Aholah the elder, and Aholibah her sister: and they were mine, and they bare sons and daughters. Thus *were* their names; Samaria *is* Aholah, and Jerusalem Aholibah.","5":"And Aholah played the harlot when she was mine; and she doted on her lovers, on the Assyrians *her* neighbours,","6":"*Which were* clothed with blue, captains and rulers, all of them desirable young men, horsemen riding upon horses.","7":"Thus she committed her whoredoms with them, with all them *that were* the chosen men of Assyria, and with all on whom she doted: with all their idols she defiled","8":"Neither left she her whoredoms *brought* from Egypt: for in her youth they lay with her, and they bruised the breasts of her virginity, and poured their whoredom","9":"Wherefore I have delivered her into the hand of her lovers, into the hand of the Assyrians, upon whom she doted.","10":"These discovered her nakedness: they took her sons and her daughters, and slew her with the sword: and she became famous among women; for they had executed judgment","11":"And when her sister Aholibah saw *this*, she was more corrupt in her inordinate love than she, and in her whoredoms more than her sister in *her* whoredoms.","12":"She doted upon the Assyrians *her* neighbours, captains and rulers clothed most gorgeously, horsemen riding upon horses, all of them desirable young men.","13":"Then I saw that she was defiled, *that* they *took* both one way,","14":"And *that* she increased her whoredoms: for when she saw men pourtrayed upon the wall, the images of the Chaldeans pourtrayed with vermilion,","15":"Girded with girdles upon their loins, exceeding in dyed attire upon their heads, all of them princes to look to, after the manner of the Babylonians of Chaldea, the land of their nativity:","16":"And as soon as she saw them with her eyes, she doted upon them, and sent messengers unto them into Chaldea.","17":"And the Babylonians came to her into the bed of love, and they defiled her with their whoredom, and she was polluted with them, and her mind was alienated","18":"So she discovered her whoredoms, and discovered her nakedness: then my mind was alienated from her, like as my mind was alienated from her sister.","19":"Yet she multiplied her whoredoms, in calling to remembrance the days of her youth, wherein she had played the harlot in the land of Egypt.","20":"For she doted upon their paramours, whose flesh *is as* the flesh of asses, and whose issue *is like* the issue of horses.","21":"Thus thou calledst to remembrance the lewdness of thy youth, in bruising thy teats by the Egyptians for the paps of thy youth.","22":"Therefore, O Aholibah, thus saith the Lord GOD; Behold, I will raise up thy lovers against thee, from whom thy mind is alienated, and I will bring them against thee on every side;","23":"The Babylonians, and all the Chaldeans, Pekod, and Shoa, and Koa, *and* all the Assyrians with them: all of them desirable young men, captains and rulers, great lords and renowned, all of them riding upon horses.","24":"And they shall come against thee with chariots, wagons, and wheels, and with an assembly of people, *which* shall set against thee buckler and shield and helmet round about: and I will set judgment before them, and they shall judge thee according to their judgments.","25":"And I will set my jealousy against thee, and they shall deal furiously with thee: they shall take away thy nose and thine ears; and thy remnant shall fall by the sword: they shall take thy sons and thy daughters; and thy residue shall be devoured by the fire.","26":"They shall also strip thee out of thy clothes, and take away thy fair jewels.","27":"Thus will I make thy lewdness to cease from thee, and thy whoredom *brought* from the land of Egypt: so that thou shalt not lift up thine eyes unto them, nor remember Egypt","28":"For thus saith the Lord GOD; Behold, I will deliver thee into the hand *of them* whom thou hatest, into the hand *of them* from whom thy mind is alienated:","29":"And they shall deal with thee hatefully, and shall take away all thy labour, and shall leave thee naked and bare: and the nakedness of thy whoredoms shall be discovered, both thy lewdness and thy whoredoms.","30":"I will do these *things* unto thee, because thou hast gone a whoring after the heathen, *and* because thou art polluted with their idols.","31":"Thou hast walked in the way of thy sister; therefore will I give her cup into thine hand.","32":"Thus saith the Lord GOD; Thou shalt drink of thy sister's cup deep and large: thou shalt be laughed to scorn and had in derision; it containeth much.","33":"Thou shalt be filled with drunkenness and sorrow, with the cup of astonishment and desolation, with the cup of thy sister Samaria.","34":"Thou shalt even drink it and suck *it* out, and thou shalt break the sherds thereof, and pluck off thine own breasts: for I have spoken *it*, saith the Lord GOD.","35":"Therefore thus saith the Lord GOD; Because thou hast forgotten me, and cast me behind thy back, therefore bear thou also thy lewdness and thy whoredoms.","36":"The LORD said moreover unto me; Son of man, wilt thou judge Aholah and Aholibah? yea, declare unto them their abominations;","37":"That they have committed adultery, and blood *is* in their hands, and with their idols have they committed adultery, and have also caused their sons, whom they bare unto me, to pass for them through *the fire*, to devour","38":"Moreover this they have done unto me: they have defiled my sanctuary in the same day, and have profaned my sabbaths.","39":"For when they had slain their children to their idols, then they came the same day into my sanctuary to profane it; and, lo, thus have they done in the midst of mine house.","40":"And furthermore, that ye have sent for men to come from far, unto whom a messenger *was* sent; and, lo, they came: for whom thou didst wash thyself, paintedst thy eyes, and deckedst thyself with ornaments,","41":"And satest upon a stately bed, and a table prepared before it, whereupon thou hast set mine incense and mine oil.","42":"And a voice of a multitude being at ease *was* with her: and with the men of the common sort *were* brought Sabeans from the wilderness, which put bracelets upon their hands, and beautiful crowns upon their heads.","43":"Then said I unto *her that was* old in adulteries, Will they now commit whoredoms","44":"Yet they went in unto her, as they go in unto a woman that playeth the harlot: so went they in unto Aholah and unto Aholibah, the lewd women.","45":"And the righteous men, they shall judge them after the manner of adulteresses, and after the manner of women that shed blood; because they *are* adulteresses, and blood *is* in their hands.","46":"For thus saith the Lord GOD; I will bring up a company upon them, and will give them to be removed and spoiled.","47":"And the company shall stone them with stones, and dispatch them with their swords; they shall slay their sons and their daughters, and burn up their houses with fire.","48":"Thus will I cause lewdness to cease out of the land, that all women may be taught not to do after your lewdness.","49":"And they shall recompense your lewdness upon you, and ye shall bear the sins of your idols: and ye shall know that I *am* the Lord GOD."}},"tsk":{"2":[{"kopje":"twee","refs":["Ezech 16:44","Ezech 16:46","Jer 3:7-10"]}],"3":[{"kopje":"in Egypte","refs":["Ezech 20:8","Lev 17:7","Deut 29:16","Joz 24:14"]},{"kopje":"in hun","refs":["Ezech 23:8","Ezech 23:19","Ezech 23:21","Ezech 16:22","Hos 2:14"]}],"4":[{"kopje":"de grootste","refs":["Ezech 16:40","1 Kon 12:20"]},{"kopje":"zij werden","refs":["Ezech 16:8","Ezech 16:20","Ex 19:5","Ex 19:6","Ps 45:12-17","Jer 2:2","Jer 2:3","Rom 7:4"]},{"kopje":"Ohola","refs":["1 Kon 12:26-33","Joh 4:22"]},{"kopje":"Oholiba","refs":["1 Kon 8:29","Ps 76:3","Ps 132:13","Ps 132:14"]}],"5":[{"kopje":"Ohola","refs":["1 Kon 14:9","1 Kon 14:16","1 Kon 15:26","1 Kon "koppeling_kjv":{"1":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came again unto me, saying,","2":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> there were <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> mother:","3":"And they committed <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredoms</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> they committed <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredoms</span> in their <span class=\"wl wl-kjv\" data-code=\"H5271\">youth:</span> there were their <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts</span> <span class=\"wl wl-kjv\" data-code=\"H4600\">pressed,</span> and there they <span class=\"wl wl-kjv\" data-code=\"H6213\">bruised</span> the <span class=\"wl wl-kjv\" data-code=\"H1717\">teats</span> of their virginity.","4":"And the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of them were <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">elder,</span> and <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah</span> her <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> and they were mine, and they <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters.</span> Thus were their <span class=\"wl wl-kjv\" data-code=\"H8034\">names;</span> <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> is <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> Aholibah.","5":"And <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> played the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> when she was <span class=\"wl wl-kjv\" data-code=\"H8478\">mine;</span> and she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> on her <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> on the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrians</span> her neighbours,","6":"Which were <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> with <span class=\"wl wl-kjv\" data-code=\"H8504\">blue,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H2531\">desirable</span> young <span class=\"wl wl-kjv\" data-code=\"H970\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon horses.","7":"Thus she <span class=\"wl wl-kjv\" data-code=\"H5414\">committed</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> with them, with all them that were the <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and with all on whom she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted:</span> with all their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> she defiled","8":"Neither <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> she her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> brought from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> for in her <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> they <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her, and they <span class=\"wl wl-kjv\" data-code=\"H6213\">bruised</span> the <span class=\"wl wl-kjv\" data-code=\"H1717\">breasts</span> of her <span class=\"wl wl-kjv\" data-code=\"H1331\">virginity,</span> and <span class=\"wl wl-kjv\" data-code=\"H8210\">poured</span> their whoredom","9":"Wherefore I have <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> her into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of her <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">Assyrians,</span> upon whom she doted.","10":"These <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> her with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and she became <span class=\"wl wl-kjv\" data-code=\"H8034\">famous</span> among <span class=\"wl wl-kjv\" data-code=\"H802\">women;</span> for they had <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> judgment","11":"And when her <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> this, she was more <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupt</span> in her inordinate <span class=\"wl wl-kjv\" data-code=\"H5691\">love</span> than she, and in her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> more than her <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> in her whoredoms.","12":"She <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">Assyrians</span> her <span class=\"wl wl-kjv\" data-code=\"H7138\">neighbours,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> most <span class=\"wl wl-kjv\" data-code=\"H4358\">gorgeously,</span> <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H2531\">desirable</span> young men.","13":"Then I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that she was <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled,</span> that they took <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> way,","14":"And that she <span class=\"wl wl-kjv\" data-code=\"H3254\">increased</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms:</span> for when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H2707\">pourtrayed</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> the <span class=\"wl wl-kjv\" data-code=\"H6754\">images</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans</span> <span class=\"wl wl-kjv\" data-code=\"H2710\">pourtrayed</span> with vermilion,","15":"<span class=\"wl wl-kjv\" data-code=\"H2289\">Girded</span> with <span class=\"wl wl-kjv\" data-code=\"H232\">girdles</span> upon their <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> <span class=\"wl wl-kjv\" data-code=\"H5628\">exceeding</span> in dyed <span class=\"wl wl-kjv\" data-code=\"H2871\">attire</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H7991\">princes</span> to look <span class=\"wl wl-kjv\" data-code=\"H4758\">to,</span> after the <span class=\"wl wl-kjv\" data-code=\"H1823\">manner</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">Babylonians</span> of <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea,</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their nativity:","16":"And as soon as she <span class=\"wl wl-kjv\" data-code=\"H4758\">saw</span> them with her <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> upon them, and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto them into Chaldea.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">Babylonians</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to her into the <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> of <span class=\"wl wl-kjv\" data-code=\"H1730\">love,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> her with their <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredom,</span> and she was <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> with them, and her <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> was alienated","18":"So she <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms,</span> and <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> then my <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> was <span class=\"wl wl-kjv\" data-code=\"H3363\">alienated</span> from her, like as my <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> was <span class=\"wl wl-kjv\" data-code=\"H5361\">alienated</span> from her sister.","19":"Yet she <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms,</span> in calling to <span class=\"wl wl-kjv\" data-code=\"H2142\">remembrance</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of her <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> wherein she had played the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","20":"For she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> upon their <span class=\"wl wl-kjv\" data-code=\"H6370\">paramours,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> is as the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and whose <span class=\"wl wl-kjv\" data-code=\"H2231\">issue</span> is like the <span class=\"wl wl-kjv\" data-code=\"H2231\">issue</span> of horses.","21":"Thus thou calledst to <span class=\"wl wl-kjv\" data-code=\"H6485\">remembrance</span> the <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> in <span class=\"wl wl-kjv\" data-code=\"H6213\">bruising</span> thy <span class=\"wl wl-kjv\" data-code=\"H1717\">teats</span> by the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> for the <span class=\"wl wl-kjv\" data-code=\"H7699\">paps</span> of thy youth.","22":"Therefore, O <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will raise <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers</span> against thee, from whom thy <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> is <span class=\"wl wl-kjv\" data-code=\"H5361\">alienated,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them against thee on every side;","23":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">Babylonians,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> <span class=\"wl wl-kjv\" data-code=\"H6489\">Pekod,</span> and <span class=\"wl wl-kjv\" data-code=\"H7772\">Shoa,</span> and <span class=\"wl wl-kjv\" data-code=\"H6970\">Koa,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1121\">Assyrians</span> with them: all of them <span class=\"wl wl-kjv\" data-code=\"H2531\">desirable</span> young <span class=\"wl wl-kjv\" data-code=\"H970\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> great <span class=\"wl wl-kjv\" data-code=\"H7991\">lords</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">renowned,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon horses.","24":"And they shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against thee with <span class=\"wl wl-kjv\" data-code=\"H2021\">chariots,</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">wagons,</span> and <span class=\"wl wl-kjv\" data-code=\"H1534\">wheels,</span> and with an <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> of <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> against thee <span class=\"wl wl-kjv\" data-code=\"H6793\">buckler</span> and <span class=\"wl wl-kjv\" data-code=\"H4043\">shield</span> and <span class=\"wl wl-kjv\" data-code=\"H6959\">helmet</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and they shall <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thee according to their judgments.","25":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> against thee, and they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> <span class=\"wl wl-kjv\" data-code=\"H2534\">furiously</span> with thee: they shall take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> and thine <span class=\"wl wl-kjv\" data-code=\"H241\">ears;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H319\">remnant</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H319\">residue</span> shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> by the fire.","26":"They shall also <span class=\"wl wl-kjv\" data-code=\"H6584\">strip</span> thee out of thy <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H8597\">fair</span> jewels.","27":"Thus will I make thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> from thee, and thy <span class=\"wl wl-kjv\" data-code=\"H2184\">whoredom</span> brought from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> so that thou shalt not lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> unto them, nor <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> Egypt","28":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them whom thou <span class=\"wl wl-kjv\" data-code=\"H8130\">hatest,</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them from whom thy <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> is alienated:","29":"And they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with thee <span class=\"wl wl-kjv\" data-code=\"H8135\">hatefully,</span> and shall take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> all thy <span class=\"wl wl-kjv\" data-code=\"H3018\">labour,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thee <span class=\"wl wl-kjv\" data-code=\"H5903\">naked</span> and <span class=\"wl wl-kjv\" data-code=\"H6181\">bare:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered,</span> both thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> and thy whoredoms.","30":"I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> these things unto thee, because thou hast gone a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and because thou art <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> with their idols.","31":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister;</span> therefore will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> her <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> into thine hand.","32":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister's</span> <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deep</span> and <span class=\"wl wl-kjv\" data-code=\"H7342\">large:</span> thou shalt be laughed to <span class=\"wl wl-kjv\" data-code=\"H6712\">scorn</span> and had in <span class=\"wl wl-kjv\" data-code=\"H3933\">derision;</span> it <span class=\"wl wl-kjv\" data-code=\"H3557\">containeth</span> much.","33":"Thou shalt be <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H7943\">drunkenness</span> and <span class=\"wl wl-kjv\" data-code=\"H3015\">sorrow,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment</span> and <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> Samaria.","34":"Thou shalt even <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> it and suck it <span class=\"wl wl-kjv\" data-code=\"H4680\">out,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H1633\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H2789\">sherds</span> thereof, and pluck <span class=\"wl wl-kjv\" data-code=\"H5423\">off</span> thine own <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","35":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thou hast <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> me, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> me <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> thy <span class=\"wl wl-kjv\" data-code=\"H1458\">back,</span> therefore <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> thou also thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> and thy whoredoms.","36":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover unto me; <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> and <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah?</span> yea, <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> unto them their abominations;","37":"That they have committed <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> is in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and with their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> have they committed <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> and have also caused their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> whom they <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto me, to pass for them <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the fire, to devour","38":"Moreover this they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto me: they have <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> in the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and have <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> my sabbaths.","39":"For when they had <span class=\"wl wl-kjv\" data-code=\"H7819\">slain</span> their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> to their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> then they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> into my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> to <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> it; and, lo, thus have they <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of mine house.","40":"And <span class=\"wl wl-kjv\" data-code=\"H637\">furthermore,</span> that ye have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> for <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from <span class=\"wl wl-kjv\" data-code=\"H4801\">far,</span> unto whom a <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> was <span class=\"wl wl-kjv\" data-code=\"H7971\">sent;</span> and, lo, they <span class=\"wl wl-kjv\" data-code=\"H935\">came:</span> for whom thou didst <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> thyself, <span class=\"wl wl-kjv\" data-code=\"H3583\">paintedst</span> thy <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H5710\">deckedst</span> thyself with ornaments,","41":"And <span class=\"wl wl-kjv\" data-code=\"H3427\">satest</span> upon a <span class=\"wl wl-kjv\" data-code=\"H3520\">stately</span> <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> <span class=\"wl wl-kjv\" data-code=\"H6186\">prepared</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> it, whereupon thou hast <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> mine <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> and mine oil.","42":"And a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> being at <span class=\"wl wl-kjv\" data-code=\"H7961\">ease</span> was with her: and with the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the common <span class=\"wl wl-kjv\" data-code=\"H7230\">sort</span> were <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H5436\">Sabeans</span> from the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> which <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> upon their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"H8597\">beautiful</span> <span class=\"wl wl-kjv\" data-code=\"H5850\">crowns</span> upon their heads.","43":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I unto her that was <span class=\"wl wl-kjv\" data-code=\"H1087\">old</span> in <span class=\"wl wl-kjv\" data-code=\"H5004\">adulteries,</span> Will they now <span class=\"wl wl-kjv\" data-code=\"H2181\">commit</span> whoredoms","44":"Yet they went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto her, as they go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that playeth the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot:</span> so went they <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> and unto <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah,</span> the <span class=\"wl wl-kjv\" data-code=\"H2154\">lewd</span> women.","45":"And the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> them after the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of <span class=\"wl wl-kjv\" data-code=\"H5003\">adulteresses,</span> and after the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of women that <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> because they are <span class=\"wl wl-kjv\" data-code=\"H5003\">adulteresses,</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> is in their hands.","46":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> upon them, and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them to be <span class=\"wl wl-kjv\" data-code=\"H2189\">removed</span> and spoiled.","47":"And the <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> shall <span class=\"wl wl-kjv\" data-code=\"H7275\">stone</span> them with <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H1254\">dispatch</span> them with their <span class=\"wl wl-kjv\" data-code=\"H2719\">swords;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and burn <span class=\"wl wl-kjv\" data-code=\"H8313\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> with fire.","48":"Thus will I cause <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that all <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> may be <span class=\"wl wl-kjv\" data-code=\"H3256\">taught</span> not to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> after your lewdness.","49":"And they shall <span class=\"wl wl-kjv\" data-code=\"H5414\">recompense</span> your <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> upon you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H2399\">sins</span> of your <span class=\"wl wl-kjv\" data-code=\"H1544\">idols:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"twee vrouwen,","tekst":"Versta, Juda en de tien stammen, beide afkomstig uit Israël. Vergelijk Jer 3:7-8 , Jer 3:10 , en boven Eze 16:44-45 ."}],"3":[{"catchword":"hoereerden in Egypte;","tekst":"Dat is, bedreven afgoderij. Zie Lev 17:7 , en boven Eze 20:8 , en onder vs.8, 19, enz."},{"catchword":"jeugd","tekst":"Als Ik hen eerst tot mijn volk aannam; zie Jer 2:2 ; Hos 2:2 , met de aantekening."},{"catchword":"betast","tekst":"Of, gehandeld. Hebreeuws, zij handelden, of betastten; dat is, men deed het, het werd gedaan. Hun afgodische handelingen worden alzo op verbloemde wijze verhaald. Alzo onder vs.8, enz. Anders: bedorven, of verbroken."}],"4":[{"catchword":"namen nu waren","tekst":"Versta, figuurlijke namen."},{"catchword":"Ohola,","tekst":"Dat is, hunne tent, of tabernakel; alzo noemt God de tien stammen, en Samaria [hunne hoofdstad, Isa 7:9 , gelijk volgt] omdat zij zich van Juda, Gods tempel en waren dienst hadden afgezonderd, en een godsdienst afzonderlijk op zichzelven aangesteld. Zie 1Ki 12:16 , 1Ki 12:28-29 , enz."},{"catchword":"grootste,","tekst":"Alzo worden de tien stammen genoemd vanwege hun macht en aanzien."},{"catchword":"Oholiba,","tekst":"Dat is, mijne tent [is] in, of onder haar. Alzo noemt God Jeruzalem en Judea, omdat zijn tempel en godsdienst aldaar waren, die Hij zelf had verordineerd."},{"catchword":"Mijne,","tekst":"Of, waren mijne. Hebreeuws, Mij, dat is, Ik trouw deze, of had ze getrouwd, en een huwelijksverbond met haar gemaakt. Zie boven Eze 16:8 , Eze 16:20 ; want deze namen geeft haar God van hetgeen onder het staande huwelijk gebeurd is."},{"catchword":"haar namen","tekst":"Versta, eigenlijke en niet figuurlijke namen."}],"5":[{"catchword":"onder Mij;","tekst":"Dat is, hoewel zij mijn getrouwde vrouw en onder mijn beheer was, zo werd zij mij nochtans ontrouw en boeleerde met anderen, in mijne plaats, gelijk het Hebreeuwse woord ook kan worden overgezet, doch niet zonder al zulke vervullling van den zin."},{"catchword":"boelen,","tekst":"De heidense volken, met wie zij verbond maakte en hunne afgoden aannam; zie vs.7, 30, enz."},{"catchword":"Assyriërs,","tekst":"Hebreeuws, Assur."},{"catchword":"nabij waren;","tekst":"Zie 2Ki 15:19 ; Isa 7:8 , Isa 7:17-18 ; Hos 8:9-10 , enz."}],"6":[{"catchword":"gewenste jongelingen,","tekst":"Hebreeuws, jongelingen der begeerte, of van den wens; dat is, begeerlijke, gewenste, en alzo, lieflijke, aangename, enz.; alzo vs.12, 23."}],"7":[{"catchword":"dreef zij haar hoererijen","tekst":"Hebreeuws eigenlijk, gaf, of overgaf zij hare hoererijen aan hen; dat is zij stelde zich als een onbeschaamde hoer."},{"catchword":"kinderen van Assur waren;","tekst":"Dat is, Assyriërs; zie boven Eze 16:26 ; alzo vs.23, en kinderen van Babel, vs.15, 23."},{"catchword":"met allen,","tekst":"Of, de woorden een weinig verzet zijnde, aldus: En zij verontreinigde zich met al derzelver drekgoden, en met allen, op welken zij verliefd was."}],"8":[{"catchword":"Egypte;","tekst":"Gelijk boven vs.3. Men kan dit voornamelijk duiden op de afgoderij van de gouden kalven, eerst in de woestijn, daarna te Dan en Bethel opgericht, en op de verbonden, met Egypte gemaakt; zie 2Ki 17:4 ."},{"catchword":"betast,","tekst":"Gelijk boven vs.3."}],"9":[{"catchword":"verliefd was","tekst":"En nochtans van dezelve naderhand was afgevallen; 2Ki 17:4 ."}],"10":[{"catchword":"ontdekten haar schaamte,","tekst":"Zie boven Eze 16:37 ."},{"catchword":"haar doodden zij met het zwaard;","tekst":"Het voornaamste lichaam van het volk; vergelijk onder vs.25."},{"catchword":"naam onder de vrouwen,","tekst":"Dat is, zij werd vermaard als een bijzonder voorbeeld en spiegel van Gods rechtvaardig oordeel, onder alle volken."},{"catchword":"gerichten over haar geoefend had","tekst":"Dat is, haar gestraft om hare trouweloosheid, tegen God en hare bondgenoten begaan."}],"11":[{"catchword":"Oholiba,","tekst":"Jeruzalem en Juda, gelijk boven vs.4."},{"catchword":"die,","tekst":"Zij maakten het erger dan Ohola; dat is, de tien stammen, zich niet spiegelende aan hun voorbeeld; vergelijk dit met Jer 3:8-11 , en boven Eze 16:47 , Eze 16:51 ."}],"12":[{"catchword":"Assur,","tekst":"Zie boven Eze 16:28 ."},{"catchword":"nabij waren,","tekst":"Gelijk boven vs.5."},{"catchword":"volkomen sieraad,","tekst":"Hebreeuws, volkomenheid; te weten van sieraad."},{"catchword":"gewenste jongelingen","tekst":"Gelijk boven vs.6."}],"13":[{"catchword":"hadden beiden enerlei weg","tekst":"Juda ging dezelfde gangen, die Israël gegaan was. Zie Gen 6:12 , onder vs.31."}],"14":[{"catchword":"geschilderde mannen","tekst":"Hebreeuws, mannen van het afgemaalde, of geschilderde, of gedrukte, gegraveerde; zie boven Eze 8:10 ."},{"catchword":"wand zag,","tekst":"Te weten in hun eigen land, gelijk de uitlandse schilderijen, inzonderheid van prachtige natiën overal plegen omgevoerd en nageschilderd te worden, om de nieuwsgierigheid en pracht van vele mensen te voldoen."},{"catchword":"menie,","tekst":"Zie Jer 22:14 ."}],"15":[{"catchword":"overvloedig geverfde hoeden","tekst":"Of, geverwde overvloedige, of zeer nederhangende, zwaaiende."},{"catchword":"land hunner geboorte;","tekst":"Vanwaar zij in Juda gevoerd waren, of immers gemaald, òf geschilderd naar het kleed, dat men in Babel droeg."}],"16":[{"catchword":"verliefd","tekst":"Gelijk onkuische vrouwen op vreemde prachtige schilderijen ontstoken en verzot worden, alzo ging het Juda met de schilderijen der Chaldeën. Zie een begin en vonk van zulks 2Ki 20:12-13 , enz., boven Eze 16:29 ."},{"catchword":"met het opzien van haar ogen,","tekst":"Dat is, zo haast als hij ze met ogen aanzag, ontbrandde zij met een heidense, vleselijke en afgodische toegenegenheid."}],"17":[{"catchword":"leger der minne,","tekst":"Dat is, om bij haar te slapen; dat is, verbond met haar te maken."},{"catchword":"hen","tekst":"ZIj vervreemde van de Chaldeën en week van hen af, lust krijgende tot Egypte. Zie vs.21."},{"catchword":"afgetrokken","tekst":"Of, week af, scheidde zich, begaf zich af van hen; [naar den aard van den onkuisen brand] alzo vs.18, 22, 28."}],"18":[{"catchword":"zuster","tekst":"Israël, of de tien stammen, boven genoemd Ohola."}],"19":[{"catchword":"als zij gehoereerd had","tekst":"Of, [in] welke, of, hoe."},{"catchword":"Egypte","tekst":"Gelijk boven vs.3."}],"20":[{"catchword":"derzelver bijwijven,","tekst":"Egyptenaars, dat is, zij gedroeg zich veel onmatiger en zotter dan andere volken, die vanouds met Egypte waren verenigd geweest. Sommigen verstaan hier de Babyloniërs en Chaldeën."},{"catchword":"welker vlees is","tekst":"Egyptenaars, [zie boven Eze 16:26 ] , die bovenmate zeer genegen en sterk waren tot lichamelijke en geestelijke hoererij."},{"catchword":"paarden","tekst":"Of, hengsten."}],"21":[{"catchword":"weder opgehaald","tekst":"Hebreeuws, bezocht; welk woord in onze taal somtijds ook in die betekenis gebruikt wordt, als men spreekt van dit of dat eens weder te bezoeken, beproeven, onderleggen."}],"22":[{"catchword":"boelen,","tekst":"Zie boven Eze 16:37 ."},{"catchword":"afgetrokken,","tekst":"Versta, van de Chaldeën, gelijk boven vs.17."}],"23":[{"catchword":"Pekod,","tekst":"Dit zijn namen van landen of omstreken, behorende onder Babel, en welker inwoners in het krijgsheir van de Babyloniërs mede gebruikt zijn tegen Juda en Jeruzalem; vergelijk wijders Jer 50:21 , met de aantekening. Sommigen houden het voor namen van vorsten of krijgsoversten."}],"24":[{"catchword":"karren,","tekst":"Of, strijdwagens, slagwagens, en dan het volgende woord rijwagens. In het Hebreeuws staan deze woorden allen in het enkelvoudig getal, kar, wagen, wiel, rondas, schild, helm, naar het gebruik van deze spraak."},{"catchword":"tegen u zetten;","tekst":"Dat is, u belegeren."},{"catchword":"gericht stellen,","tekst":"Dat is, Ik zal hun het recht voorleggen, dat zij over u gebruiken zullen; Ik zal hen gebruiken als uitvoerders van mijne gerichten over u, Ik zal hen alzo regeren, dat zij u uw verdiend loon zullen geven."},{"catchword":"rechten","tekst":"Of, wijze, gewoonte, manieren van doen; zoals wij afvalligen en meinedigen, idem overspeleressen, plegen te straffen; zie daarvan het volgende."}],"25":[{"catchword":"ijver tegen u zetten,","tekst":"Mijn ernstige en rechtvaardige wraak over uwe ontrouw, tegen mij begaan."},{"catchword":"afnemen,","tekst":"Of, wegdoen; dat is, afsnijden, gelijk de Egyptenaars de overspeleressen plachten te doen; waardoor verder verstaan wordt alle soorten van wreedheid, die de vijanden aan hen zouden bewijzen."},{"catchword":"het laatste van u","tekst":"Dat is, dat laatst van u overig is, uw overblijfsel. Anders: uw laatste zal zijn dat gij door het zwaar vallen zult; dat is, het einde, of, eindelijk zult gij, enz., alzo in het volgende."}],"27":[{"catchword":"ophouden,","tekst":"Vergelijk boven Eze 22:15 ."},{"catchword":"hen niet opheffen,","tekst":"Te weten de Egyptenaars."}],"29":[{"catchword":"arbeid wegnemen,","tekst":"Dat is, al wat gij met uwen arbeid verkregen hebt, al uw goed."}],"30":[{"catchword":"zal men u doen,","tekst":"Of, zal Ik u doen, zullen zij u doen, omdat het Hebreeuwse woord [gelijk elders] zonder bepaling van personen gesteld is."}],"31":[{"catchword":"weg uwer zuster hebt gij gewandeld,","tekst":"Gelijk boven vs.13."},{"catchword":"beker","tekst":"Den beker mijns toorns, dien zij gedronken heeft; dat is, Ik zal u met gelijke straffen straffen, dewijl gij gelijke zonden gedaan hebt. Zie Psa 11:6 , en Job 21:20 ; Jer 25:15 , enz."}],"32":[{"catchword":"belaching en spot worden;","tekst":"Gelijk degenen, die zich vol gezopen hebben, plegen te worden."},{"catchword":"veel in","tekst":"Hebreeuws, is veel in het houden, of om te houden; dat is, daar mag veel drank in, gelijk wij spreken."}],"33":[{"catchword":"jammer","tekst":"Het woord jammer of droefenis dient tot verklaring; alsof God zeide: Gij zult dronken en vol worden, maar het zal van droefenis en ellende zijn."},{"catchword":"de beker","tekst":"Anders: van, of met den beker, enz., [die] enz."}],"34":[{"catchword":"zijn scherven","tekst":"Gelijk de dronken mensen, als razende, toornig en ontsteld zijnde, de drinkvaten wel in stukken smijten; alzo zult gij u uitermate verdrietig en ontsteld bevinden over mijne straffen."},{"catchword":"borsten zult gij afrukken;","tekst":"Met welke gij geestelijken hoerdom gepleegd hebt; dat is, gij zult uzelf vanwege uwe zonden verfoeien, door het gevoel der schrikkelijke straffen, die u daarom overkomen."}],"35":[{"catchword":"rug geworpen hebt,","tekst":"Zie 1Ki 14:9 ."},{"catchword":"uw schandelijkheid","tekst":"Dat is, de straf derzelve, alzo onder vs.49."}],"36":[{"catchword":"Ohola en Oholiba","tekst":"Zie boven vs.4."},{"catchword":"recht geven?","tekst":"Zie boven Eze 20:4 , en Eze 22:2 ."}],"37":[{"catchword":"bloed in haar handen;","tekst":"Inzonderheid van haar eigen kinderen. Zie boven Eze 16:36 , en onder vs.45."},{"catchword":"Mij gebaard hadden,","tekst":"Als zijnde Abrahams zaad en mijne bondgenoten, idem, geboren, staande nog mijne huwelijk met hunlieden. Zie boven Eze 16:20 ."},{"catchword":"door het vuur","tekst": ve or borrowed names] were Ohala [that is their tent or terbanacle so God calleth the ten tribes and Samaria (their chief city, Isa 7:9. as followeth) because they had separated themselves from Juda, the temple and the true worship of God, and had set up a worship of their devising. See 1 Kings 12.16, 28, 29. c.] in greatest, [so are the ten tribes called by reason of their power and respect] and Oholiba [that is, my Tent (is) in, or among them. So God called Jerusalem and Juda, because his Temple and worship were there, which he had ordained himself] her sister: and they became mine, or had married them, and had made a matrimonial covenant with them. See above chapter 16.8,22. for God giveth them these names from that which happened during the time of the marriage, while that lasted] and sons and daughters: these were their names; [Meaning proper, and no fihurative names] Samaria is Ohola and Jerusalemoholiba."}],"5":[{"catchword":null,"tekst":"Now Ohola played the harlot, being under me [That is, though she was my married wife, and, was under my subjection, yet she proved unfaithful unto me, and kept company with others, instead of me; as the Hebrew word may be also rendred, but not without such filling up of the sense] and she doted on her suiters, [the heathenish nations, with whom sha entred into covenant, and embraced their idols. See verse 7, 30, c.] on the Assyrians [Heb. Assur] that were near: [see 2 Kings 15.19 and Isa 7:8, 17, 18. Hos. 8.9, 10, c.]"}],"6":[{"catchword":null,"tekst":"Clothed with skie-colour, princes and Rulers, all of thm desirable young men: [Heb. Young men of desire, or wish; that is, desirable, wished for, and consequently pleasant, gracious young men. So verse 12, 13.] horsemen riding upon horses."}],"7":[{"catchword":null,"tekst":"Thus she committed her whoredome with them, [Heb. Properly she gave, or delivered her whoredomes to them, that is, she behaved herself as a bold impudent strumpet] which were all the choise of the children redom: she also defiled her self with them after that her soul was drawn away from them [or turned away, separated herself, went away from them (the nature of the unchat woman) so verse 18.22, 28. she enstrangled her self from the Chaldeans, and departed from them, lusting after Egypt, verse 21.]"}],"18":[{"catchword":null,"tekst":"Thus she hath discovered whoredome, and discovered her shame: then my soul was drawn off from her, as my soul was drawn off from her sister. [Israel, or the ten tribes, called above Ohola]"}],"19":[{"catchword":null,"tekst":"Yet sh multiplied her whoredoms, remembering the dates of her youth, when [Or wherein, or how] she had played the harlot in the land of Egypt, [as above verse 3]"}],"20":[{"catchword":null,"tekst":"And she grew enanoured more then their concubins, [that is, th concubines of the Egyptians: the behavd her self much more immediately and more foolishly then other nations did that of time had been united with Egypt. Some understand here the Babylonians and Chaldeans] whose flesh is (as) the flesh asses, [to wit, the Egyptians flesh was such. (see above chapter 16.26.) who were exceeding bnt and inclined to corporal and spiritual whoredome] and whse issue is (like) th issue of horses. [or stone horses]"}],"21":[{"catchword":null,"tekst":"Thus thou hast fetcht up again [Heb. Visited: which word in our languageis sometimes also used in the same signification when speake of visiting, trying, examining this or that thing again ]the lewd fact of thy youth :when those of those of Egypt felt thy teats ,because of the paps of thy youth ."}],"22":[{"catchword":null,"tekst":"Therefore O Oholiba ,thus saith the Lord LORD behold ,I will raise up thy suiters [see above chap .16.37.]against thee ,from whom thy soul is drawn off :[meaning from the Chaldeans as above verse 17.]and I will bring them against thee from round about;"}],"23":[{"catchword":null,"tekst":"The children of Babel and all the Chaldeans ,Pekod,and Son,and Koa ,[these a re ."}],"26":[{"catchword":null,"tekst":"They shall also strip thee thy clothes and shall take away thy ornament instruments ."}],"27":[{"catchword":null,"tekst":"Thus I will make thy lewdness to cease from thee [compare above chap 22.15.] together with thy whoredom brought from the land of Egyprt and thou shalt lift up thine eyes unto them [to wit the Egyptians ]nor remember Egypt anymore ."}],"28":[{"catchword":null,"tekst":"For thus saith the Lord LORD behold I will deliver thee into the land of them whom thou hatest into into the hand of them from whom thy soul is drawn off."}],"29":[{"catchword":null,"tekst":"they shall deal ith thee out the hatred ,and take away all thy labour [that is all thou hast gotten by ty labour all thy estate ]and leave thee naked and bare ,that thy harlotry may be discovered together with thy lewdness and whoredom ."}],"30":[{"catchword":null,"tekst":"These things shall be done unto thee [or will I do unto thee or shall they do unto thee because the Hebrew word here as elsehere is put without limitation of person ] because thou hast gone a whoring after the heathen ,and necause thou hast defild thy self beore thir dung -gods ."}],"31":[{"catchword":null,"tekst":"thou hast walked in the way of thy sister :[as above verse 13.] therefore will I give her a cup into thine Hand [To wit, the cup of my wrath whereof she hath drunken. That is, I will punish thee with like punishment because thou hast committed like sins. See Psalms 11 on verse 6 and Job 21 on verse 20. Jer 25:15, c.]"}],"32":[{"catchword":null,"tekst":"Thus saith the Lord LORD, thou shalt drink thy sister&acirc;&euro;&trade;s cup which is deep and large: thou shalt become a laughing stock and a mocking; [as those that have drunk themselves drunk are wont be] (the cup) containeth much. [Heb. is much in containing, or to contain; that is, much drink may go into it, as we use to say."}],"33":[{"catchword":null,"tekst":"Thou shalt be fall of drunkenness and misery: [the word misery or sorrow serveth for exposition: as if God should say, thou shalt be drunken and fall, but it shall be with sorrow and misery] the cup of thy sister Samaria is a cup of desolation and of solitariness [others, of or with the cup, c (which), c.]"}],"34":[{"catchword":null,"tekst":"Thou shalt drink it, and suck (it) out, and thou shall break the sherds thereof to shivers, [As drunken men in their ager and madness break the drinking vessels in pieces, so shalt thou find thy self exceedingly vexed at my judgements] and thou shalt pluck of thine (own) breasts: [with which thou hast exercised spiritual whoredom. That is, thou shalt loath thy self because of thy sins, by feeling of the fear-full punishments that shall come upon thee for the same] for I have spoketh, saith the Lord LORD."}],"35":[{"catchword":null,"tekst":"Therefore thus saith the Lord LORD, because thou hast forgotten me and cast me behind thy back [see 1 King 14 on verse 9] therefore thou also thy lewdness and thy whoredoms. [That is, the punishment thereof. So below verse 49.]"}],"36":[{"catchword":null,"tekst":"And the LORD saith unto me, child of man, shouldeth give judgement [see above chap. 20 on verse 4 and 22.2] to Ohola and to Oholiba? [see above verse 4.] yea shew them their abominations."}],"37":[{"catchword":null,"tekst":"For they have committed adultery, and there is blood in their hands, [Especially the blood of their own children. See above chap. 16.36 and below verse 45.] and they have committed adultery with their dung-Gods: moreover they have caused their children whom they had born unto me, [as being Abraham&acirc;&euro;&trade;s seed, and in covenant with me, likewise born whiles my marriage with them yet lasted. See above chap. 16 on verse 20.] To pass before them (through the fire) [see above chap. 6.20,21,36,45 with the Annotat. Likewise chap. 20.31 for meat, [to wit, of the fire; that is, to be consumed by the fire. Compare above chap. 16.20 and 21.32. with the Annotat.]"}],"38":[{"catchword":null,"tekst":"Yet thy have done this uniform: [Or against me] they have defiled my sanctuary [others my sanctuaries: that is, the temple wherein was the holy place and the holy of holies] in the same day and prophaned my Sabbaths."}],"39":[{"catchword":null,"tekst":"For when they had slain to their dung-gods, [Or throated the, cut (their) throats, to, to the honour of their idols. See above chap. 16.20,35. With the Annotat. Also Isa. 57.5.] then they came the same day into my sanctuary [as if (forsooth) they were willing to tender ye some service and honour unto me. Compare 2 Kings 21.4,5. Jer 7:9,10 and 11.15 and above chap. 8.3,6 and below chap. 43.8] to prophane it: and lo, thus have they done in the midst of mine house. [see 2 Kings 21.4,c]"}],"40":[{"catchword":null,"tekst":"This is also (to be added) they sent unto me to come from far: [to make unlawful covenants with heathenish nations, for the alluring and entertaining, of whom God relateth in the words of the following, that they used the likes tricks, devices and practices as cunning base thumpers are wont to do. Compare Prov 7:16,17, c. unto whom when a messenger was sent, lo then they came from whom thou didst wast thy self, paintedth thine eyes, and adornedth thy self with ornaments."}],"41":[{"catchword":null,"tekst":"And thou satest upon a glorious bed, before which a table was prepared, and mine oil. [Which I had given thee, wherewith I as thy lawful husband had adowed and adorned thee, and which thou oughtest to have used to mine and glory. Compare Hos. 2.8,9 and above chapter 16.16,17,18,19.]"}],"42":[{"catchword":null,"tekst":"Now when the noise of the multitude was quiet upon it. [to wit, upon the aforesaid bed, that is, when these sisters had dispatched their covenant-affairrs with those great outlandish Lords, then (they sent) to wit, Ohola and Oholiba sent. This is here inserted to fill up the sense from verse 40] unto men of multitude of men, [that is, of the common people or of t // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
