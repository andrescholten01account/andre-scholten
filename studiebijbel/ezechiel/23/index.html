">pressed,</span> and there they <span class=\"wl wl-kjv\" data-code=\"H6213\">bruised</span> the <span class=\"wl wl-kjv\" data-code=\"H1717\">teats</span> of their virginity.", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of them were <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">elder,</span> and <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah</span> her <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> and they were mine, and they <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters.</span> Thus were their <span class=\"wl wl-kjv\" data-code=\"H8034\">names;</span> <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> is <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> Aholibah.", "5": "And <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> played the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> when she was <span class=\"wl wl-kjv\" data-code=\"H8478\">mine;</span> and she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> on her <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> on the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrians</span> her neighbours,", "6": "Which were <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> with <span class=\"wl wl-kjv\" data-code=\"H8504\">blue,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H2531\">desirable</span> young <span class=\"wl wl-kjv\" data-code=\"H970\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon horses.", "7": "Thus she <span class=\"wl wl-kjv\" data-code=\"H5414\">committed</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> with them, with all them that were the <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and with all on whom she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted:</span> with all their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> she defiled", "8": "Neither <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> she her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> brought from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> for in her <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> they <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her, and they <span class=\"wl wl-kjv\" data-code=\"H6213\">bruised</span> the <span class=\"wl wl-kjv\" data-code=\"H1717\">breasts</span> of her <span class=\"wl wl-kjv\" data-code=\"H1331\">virginity,</span> and <span class=\"wl wl-kjv\" data-code=\"H8210\">poured</span> their whoredom", "9": "Wherefore I have <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> her into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of her <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">Assyrians,</span> upon whom she doted.", "10": "These <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> her with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and she became <span class=\"wl wl-kjv\" data-code=\"H8034\">famous</span> among <span class=\"wl wl-kjv\" data-code=\"H802\">women;</span> for they had <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> judgment", "11": "And when her <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> this, she was more <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupt</span> in her inordinate <span class=\"wl wl-kjv\" data-code=\"H5691\">love</span> than she, and in her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> more than her <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> in her whoredoms.", "12": "She <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">Assyrians</span> her <span class=\"wl wl-kjv\" data-code=\"H7138\">neighbours,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> most <span class=\"wl wl-kjv\" data-code=\"H4358\">gorgeously,</span> <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H2531\">desirable</span> young men.", "13": "Then I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that she was <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled,</span> that they took <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> way,", "14": "And that she <span class=\"wl wl-kjv\" data-code=\"H3254\">increased</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms:</span> for when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H2707\">pourtrayed</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> the <span class=\"wl wl-kjv\" data-code=\"H6754\">images</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans</span> <span class=\"wl wl-kjv\" data-code=\"H2710\">pourtrayed</span> with vermilion,", "15": "<span class=\"wl wl-kjv\" data-code=\"H2289\">Girded</span> with <span class=\"wl wl-kjv\" data-code=\"H232\">girdles</span> upon their <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> <span class=\"wl wl-kjv\" data-code=\"H5628\">exceeding</span> in dyed <span class=\"wl wl-kjv\" data-code=\"H2871\">attire</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H7991\">princes</span> to look <span class=\"wl wl-kjv\" data-code=\"H4758\">to,</span> after the <span class=\"wl wl-kjv\" data-code=\"H1823\">manner</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">Babylonians</span> of <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea,</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their nativity:", "16": "And as soon as she <span class=\"wl wl-kjv\" data-code=\"H4758\">saw</span> them with her <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> upon them, and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto them into Chaldea.", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">Babylonians</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to her into the <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> of <span class=\"wl wl-kjv\" data-code=\"H1730\">love,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> her with their <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredom,</span> and she was <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> with them, and her <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> was alienated", "18": "So she <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms,</span> and <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> then my <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> was <span class=\"wl wl-kjv\" data-code=\"H3363\">alienated</span> from her, like as my <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> was <span class=\"wl wl-kjv\" data-code=\"H5361\">alienated</span> from her sister.", "19": "Yet she <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> her <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms,</span> in calling to <span class=\"wl wl-kjv\" data-code=\"H2142\">remembrance</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of her <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> wherein she had played the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.", "20": "For she <span class=\"wl wl-kjv\" data-code=\"H5689\">doted</span> upon their <span class=\"wl wl-kjv\" data-code=\"H6370\">paramours,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> is as the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and whose <span class=\"wl wl-kjv\" data-code=\"H2231\">issue</span> is like the <span class=\"wl wl-kjv\" data-code=\"H2231\">issue</span> of horses.", "21": "Thus thou calledst to <span class=\"wl wl-kjv\" data-code=\"H6485\">remembrance</span> the <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> in <span class=\"wl wl-kjv\" data-code=\"H6213\">bruising</span> thy <span class=\"wl wl-kjv\" data-code=\"H1717\">teats</span> by the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> for the <span class=\"wl wl-kjv\" data-code=\"H7699\">paps</span> of thy youth.", "22": "Therefore, O <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will raise <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers</span> against thee, from whom thy <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> is <span class=\"wl wl-kjv\" data-code=\"H5361\">alienated,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them against thee on every side;", "23": "The <span class=\"wl wl-kjv\" data-code=\"H1121\">Babylonians,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> <span class=\"wl wl-kjv\" data-code=\"H6489\">Pekod,</span> and <span class=\"wl wl-kjv\" data-code=\"H7772\">Shoa,</span> and <span class=\"wl wl-kjv\" data-code=\"H6970\">Koa,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1121\">Assyrians</span> with them: all of them <span class=\"wl wl-kjv\" data-code=\"H2531\">desirable</span> young <span class=\"wl wl-kjv\" data-code=\"H970\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captains</span> and <span class=\"wl wl-kjv\" data-code=\"H5461\">rulers,</span> great <span class=\"wl wl-kjv\" data-code=\"H7991\">lords</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">renowned,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> upon horses.", "24": "And they shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against thee with <span class=\"wl wl-kjv\" data-code=\"H2021\">chariots,</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">wagons,</span> and <span class=\"wl wl-kjv\" data-code=\"H1534\">wheels,</span> and with an <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> of <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> against thee <span class=\"wl wl-kjv\" data-code=\"H6793\">buckler</span> and <span class=\"wl wl-kjv\" data-code=\"H4043\">shield</span> and <span class=\"wl wl-kjv\" data-code=\"H6959\">helmet</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and they shall <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thee according to their judgments.", "25": "And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> against thee, and they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> <span class=\"wl wl-kjv\" data-code=\"H2534\">furiously</span> with thee: they shall take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> and thine <span class=\"wl wl-kjv\" data-code=\"H241\">ears;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H319\">remnant</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H319\">residue</span> shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> by the fire.", "26": "They shall also <span class=\"wl wl-kjv\" data-code=\"H6584\">strip</span> thee out of thy <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H8597\">fair</span> jewels.", "27": "Thus will I make thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> from thee, and thy <span class=\"wl wl-kjv\" data-code=\"H2184\">whoredom</span> brought from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> so that thou shalt not lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> unto them, nor <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> Egypt", "28": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them whom thou <span class=\"wl wl-kjv\" data-code=\"H8130\">hatest,</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of them from whom thy <span class=\"wl wl-kjv\" data-code=\"H5315\">mind</span> is alienated:", "29": "And they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with thee <span class=\"wl wl-kjv\" data-code=\"H8135\">hatefully,</span> and shall take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> all thy <span class=\"wl wl-kjv\" data-code=\"H3018\">labour,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thee <span class=\"wl wl-kjv\" data-code=\"H5903\">naked</span> and <span class=\"wl wl-kjv\" data-code=\"H6181\">bare:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered,</span> both thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> and thy whoredoms.", "30": "I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> these things unto thee, because thou hast gone a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and because thou art <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> with their idols.", "31": "Thou hast <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister;</span> therefore will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> her <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> into thine hand.", "32": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister's</span> <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deep</span> and <span class=\"wl wl-kjv\" data-code=\"H7342\">large:</span> thou shalt be laughed to <span class=\"wl wl-kjv\" data-code=\"H6712\">scorn</span> and had in <span class=\"wl wl-kjv\" data-code=\"H3933\">derision;</span> it <span class=\"wl wl-kjv\" data-code=\"H3557\">containeth</span> much.", "33": "Thou shalt be <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H7943\">drunkenness</span> and <span class=\"wl wl-kjv\" data-code=\"H3015\">sorrow,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment</span> and <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> Samaria.", "34": "Thou shalt even <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> it and suck it <span class=\"wl wl-kjv\" data-code=\"H4680\">out,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H1633\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H2789\">sherds</span> thereof, and pluck <span class=\"wl wl-kjv\" data-code=\"H5423\">off</span> thine own <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.", "35": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thou hast <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> me, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> me <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> thy <span class=\"wl wl-kjv\" data-code=\"H1458\">back,</span> therefore <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> thou also thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> and thy whoredoms.", "36": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover unto me; <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> and <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah?</span> yea, <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> unto them their abominations;", "37": "That they have committed <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> is in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and with their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> have they committed <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> and have also caused their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> whom they <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto me, to pass for them <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the fire, to devour", "38": "Moreover this they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto me: they have <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> in the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and have <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> my sabbaths.", "39": "For when they had <span class=\"wl wl-kjv\" data-code=\"H7819\">slain</span> their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> to their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> then they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> into my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> to <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> it; and, lo, thus have they <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of mine house.", "40": "And <span class=\"wl wl-kjv\" data-code=\"H637\">furthermore,</span> that ye have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> for <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from <span class=\"wl wl-kjv\" data-code=\"H4801\">far,</span> unto whom a <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> was <span class=\"wl wl-kjv\" data-code=\"H7971\">sent;</span> and, lo, they <span class=\"wl wl-kjv\" data-code=\"H935\">came:</span> for whom thou didst <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> thyself, <span class=\"wl wl-kjv\" data-code=\"H3583\">paintedst</span> thy <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H5710\">deckedst</span> thyself with ornaments,", "41": "And <span class=\"wl wl-kjv\" data-code=\"H3427\">satest</span> upon a <span class=\"wl wl-kjv\" data-code=\"H3520\">stately</span> <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> <span class=\"wl wl-kjv\" data-code=\"H6186\">prepared</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> it, whereupon thou hast <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> mine <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> and mine oil.", "42": "And a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> being at <span class=\"wl wl-kjv\" data-code=\"H7961\">ease</span> was with her: and with the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the common <span class=\"wl wl-kjv\" data-code=\"H7230\">sort</span> were <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H5436\">Sabeans</span> from the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> which <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> upon their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"H8597\">beautiful</span> <span class=\"wl wl-kjv\" data-code=\"H5850\">crowns</span> upon their heads.", "43": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I unto her that was <span class=\"wl wl-kjv\" data-code=\"H1087\">old</span> in <span class=\"wl wl-kjv\" data-code=\"H5004\">adulteries,</span> Will they now <span class=\"wl wl-kjv\" data-code=\"H2181\">commit</span> whoredoms", "44": "Yet they went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto her, as they go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that playeth the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot:</span> so went they <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto <span class=\"wl wl-kjv\" data-code=\"H170\">Aholah</span> and unto <span class=\"wl wl-kjv\" data-code=\"H172\">Aholibah,</span> the <span class=\"wl wl-kjv\" data-code=\"H2154\">lewd</span> women.", "45": "And the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> them after the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of <span class=\"wl wl-kjv\" data-code=\"H5003\">adulteresses,</span> and after the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of women that <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> because they are <span class=\"wl wl-kjv\" data-code=\"H5003\">adulteresses,</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> is in their hands.", "46": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> upon them, and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them to be <span class=\"wl wl-kjv\" data-code=\"H2189\">removed</span> and spoiled.", "47": "And the <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> shall <span class=\"wl wl-kjv\" data-code=\"H7275\">stone</span> them with <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H1254\">dispatch</span> them with their <span class=\"wl wl-kjv\" data-code=\"H2719\">swords;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and burn <span class=\"wl wl-kjv\" data-code=\"H8313\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> with fire.", "48": "Thus will I cause <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that all <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> may be <span class=\"wl wl-kjv\" data-code=\"H3256\">taught</span> not to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> after your lewdness.", "49": "And they shall <span class=\"wl wl-kjv\" data-code=\"H5414\">recompense</span> your <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> upon you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H2399\">sins</span> of your <span class=\"wl wl-kjv\" data-code=\"H1544\">idols:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
