afgoden zijn beschaamd, haar drekgoden zijn verpletterd!", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Ezech 21:8": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "2 Kon 20:17": "Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Gen 6:2": "dat Gods zonen de dochters der mensen aanzagen, dat zij mooi waren, en zij namen zich vrouwen uit allen die zij verkozen hadden.", "Jer 32:35": "En zij hebben de hoogten van Baäl gebouwd, die in het dal van de zoon van Hinnom zijn, om hun zonen en hun dochters voor de Molech door het vuur te laten gaan; wat Ik hun niet geboden heb, en wat niet in Mijn hart is opgekomen, dat zij deze gruwel zouden doen; om Juda te laten zondigen.", "Ezech 20:31": "Ja, met het offeren van uw gaven, met het door het vuur laten doorgaan van uw kinderen, bent u verontreinigd met al uw drekgoden tot op deze dag toe; en zou Ik door u gevraagd worden, o huis van Israël? Zo waarachtig als Ik leef, spreekt de Heere HEERE, zo Ik door u gevraagd word!", "2 Kron 12:1-12": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem. Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden), met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "Zef 1:7-18": "Zwijg voor het aangezicht van de Heere HEERE; want de dag van de HEERE is nabij; want de HEERE heeft een slachtoffer bereid, Hij heeft Zijn genode geheiligd. En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding. Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.", "Hos 6:10": "Ik zie een afschuwelijke zaak in het huis van Israël; daar is Efraïms hoererij, Israël is verontreinigd.", "Ezech 35:15": "Zoals u zich verblijd hebt over de erfenis van het huis van Israël, omdat die verwoest is, zo zal Ik aan u doen; het gebergte van Seir, en heel Edom, zal helemaal een verwoesting worden; en zij zullen weten, dat Ik de HEERE ben.", "Jer 7:14": "daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "2 Kon 20:14-17": "Toen kwam de profeet Jesaja naar de koning Hizkia, en zei tegen hem: Wat hebben die mannen gezegd, en waar zijn zij vandaan bij u gekomen? En Hizkia zei: Zij zijn uit een ver land gekomen, uit Babel. En hij zei: Wat hebben zij gezien in uw huis? En Hizkia zei: Zij hebben alles gezien wat in mijn huis is; er is geen ding in mijn schatten dat ik hun niet getoond heb. Toen zei Jesaja tegen Hizkia: Hoor het woord van de HEERE.", "Jer 25:8-38": "Daarom, zo zegt de HEERE van de heerscharen: Omdat u Mijn woorden niet hebt gehoord; Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Ps 119:37": "Wend mijn ogen af, dat zij geen ijdelheid zien; maak mij levend door Uw wegen.", "Matt 21:34": "Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen.", "Ezech 22:13-22": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is. Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen. En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Luk 9:62": "En Jezus zei tegen hem: Niemand die zijn hand aan de ploeg slaat en achterom kijkt, is geschikt voor het Koninkrijk van God.", "Jes 13:3": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Hand 7:51-53": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook. Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent. U, die de wet ontvangen hebt door bemiddeling van engelen, en die niet gehouden hebt!", "Mark 4:7": "En het andere viel tussen de dorens, en de dorens groeiden op, en verstikten het, en het gaf geen vrucht.", "Ps 106:39": "En zij verontreinigden zich door hun werken, en zij hebben gehoereerd door hun daden.", "Ezech 33:23": "Toen kwam het woord van de HEERE tot mij:", "Jes 30:1-17": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen; Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte. Want de sterkte van Farao zal u tot schaamte zijn, en die toevlucht onder de schaduw van Egypte tot schande.", "Ezech 22:18-22": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden. Daarom, zo zegt de Heere HEERE: Omdat u allen tot schuim geworden bent, zie, daarom zal Ik u in het midden van Jeruzalem verzamelen. Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Ezech 16:37": "daarom, zie, Ik zal al uw minnaars verzamelen, met wie u vermengd bent geweest, en allen die u liefgehad hebt, met allen die u gehaat hebt; en Ik zal hen van rondom tegen u verzamelen, en Ik zal voor hen uw naaktheid ontdekken, zodat zij uw hele naaktheid zullen zien.", "Jes 34:2-6": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Ezech 16:40": "Daarna zullen zij een menigte tegen u laten opkomen, en zij zullen u met stenen stenigen, en u met hun zwaarden doorsteken.", "Jer 22:8": "Dan zullen veel heidenvolken langs deze stad gaan, en zullen zeggen, ieder tegen zijn naaste: Waarom heeft de HEERE zo gedaan aan deze grote stad?", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Spr 6:34": "Want jaloezie is de woede van een man; en op de dag van de wraak zal hij niet sparen.", "Job 34:26": "Hij klopt hen samen als goddelozen, in een plaats, waar van het aanschouwer zijn;", "Jer 47:6": "O wee, u zwaard van de HEERE! Hoe lang zult u niet stil houden? Vaar in uw schede, rust en wees stil!", "Lev 26:2": "Mijn sabbatten zult u houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Jer 13:23": "Zal een Moorman zijn huid veranderen? Of een luipaard zijn vlekken? Zo zult u ook goed kunnen doen, u die geleerd hebt kwaad te doen.", "Ezech 26:7": "Want zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, de koning der koningen, van het noorden tegen Tyrus brengen, met paarden en met wagens, en met ruiters, en een leger, en veel volk.", "Ezech 3:20": "Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "1 Kon 9:6-9": "Maar als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden en Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt; Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken. En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "2 Kon 23:10": "Hij verontreinigde ook Thofeth, dat in het dal van de kinderen van Hinnom is, opdat niemand zijn zoon of zijn dochter voor de Molech door het vuur zou laten gaan.", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "Deut 27:22": "Vervloekt is hij die bij zijn zuster ligt, de dochter van zijn vader of de dochter van zijn moeder! En heel het volk zal zeggen: Amen.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Ezech 16:28-30": "Verder hebt u gehoereerd met de zonen van Assur, omdat u onverzadigbaar was; ja, ook toen u met hen gehoereerd had, was u nog niet verzadigd. Maar u hebt uw hoererij vermeerderd in het land van Kanaän tot in Chaldea; en daarmee bent u ook niet verzadigd geworden. Hoe zwak is uw hart (spreekt de Heere HEERE) dat u al deze dingen doet, het werk van een heersende hoerachtige vrouw!", "Jer 29:23": "Omdat zij een dwaasheid deden in Israël, en overspel bedreven met de vrouwen van hun naasten, en het woord leugenachtig spraken in Mijn Naam, wat Ik hun niet geboden had; en Ik ben Degene Die het weet, en een getuige daarvan, spreekt de HEERE.", "2 Kron 36:21": "Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren.", "2 Kon 3:26": "Doch toen de koning van de Moabieten zag dat de strijd hem te sterk werd, nam hij zevenhonderd man met zich mee, die het zwaard trokken, om door te breken naar de koning van Edom toe; maar zij konden het niet.", "Jes 22:21": "En Ik zal hem met uw gewaad bekleden, en Ik zal hem met uw gordel sterken, en uw heerschappij zal Ik in zijn hand geven; en hij zal voor de inwoners van Jeruzalem en voor het huis van Juda tot een vader zijn.", "Num 14:34": "Naar het getal van de dagen waarin u dat land verspied hebt, veertig dagen, elke dag voor elk jaar, zult u uw ongerechtigheden dragen, veertig jaar, en u zult Mijn tegenwerking ervaren.", "Ezech 30:20": "Ook gebeurde het in het elfde jaar, in de eerste maand, op de zevende van de maand, dat het woord van de HEERE tot mij kwam: het zei:", "1 Kon 12:20": "En het gebeurde, toen heel Israël hoorde dat Jerobeam teruggekomen was, dat zij heen zonden en hem in de vergadering riepen, en hem over heel Israël koning maakten; niemand volgde het huis van David, dan de stam van Juda alleen.", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "2 Kon 24:4": "Als ook om het onschuldige bloed dat hij vergoten had, zodat hij Jeruzalem met onschuldig bloed vervuld had; daarom wilde de HEERE niet vergeven.", "Matt 20:22": "Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Ezech 23:45-49": "Rechtvaardige mannen dan, die zullen hen berechten naar het recht van overspeelsters, en naar het recht van vrouwen die bloed vergieten; want zij zijn overspeelsters, en bloed is aan hun handen. Want zo zegt de Heere HEERE: Ik zal een menigte tegen hen doen opkomen, en zal hen overgeven ter beangstiging en ten roof. En de menigte zal hen met stenen stenigen, en hen met hun zwaarden neerhouwen; hun zonen en hun dochters zullen zij doden, en hun huizen met vuur verbranden.", "Jer 48:26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "Ezech 23:45-47": "Rechtvaardige mannen dan, die zullen hen berechten naar het recht van overspeelsters, en naar het recht van vrouwen die bloed vergieten; want zij zijn overspeelsters, en bloed is aan hun handen. Want zo zegt de Heere HEERE: Ik zal een menigte tegen hen doen opkomen, en zal hen overgeven ter beangstiging en ten roof. En de menigte zal hen met stenen stenigen, en hen met hun zwaarden neerhouwen; hun zonen en hun dochters zullen zij doden, en hun huizen met vuur verbranden.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Ezech 16:22": "Ook hebt u bij al uw gruwelen en uw hoererijen niet gedacht aan de dagen van uw jeugd, toen u naakt en bloot was, toen u vertrapt was in uw bloed.", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Jes 56:4-7": "Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond; Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden. En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "Lev 18:21": "En van uw nageslacht zult u niet geven, niet geven om voor de Molech door het vuur te doen gaan; en de Naam van uw God zult u niet ontheiligen; Ik ben de HEERE!", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Num 25:1-3": "Israël verbleef te Sittim, en het volk begon te hoereren met de dochters van de Moabieten. En zij nodigden het volk tot de offers van hun goden; en het volk at, en boog zich neer voor hun goden. Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Deut 32:16": "Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt.", "Spr 2:17": "Die de leidsman van haar jeugd verlaat, en het verbond van haar God vergeet;", "Job 8:12": "Als het nog in zijn groenheid is, hoewel het niet afgesneden wordt, verdort het toch eerder dan al het andere gras.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "Jer 19:4-7": "Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen. Want zij hebben de hoogten van Baäl gebouwd, om hun zonen met vuur te verbranden, aan Baäl tot brandoffers; wat Ik niet geboden heb, noch gesproken heb, noch in Mijn hart is opgekomen. Daarom, ziet, de dagen komen, spreekt de HEERE, dat deze plaats niet meer het Tofeth genoemd zal worden, of dal van de zoon van Hinnom, maar Moorddal.", "Joz 24:19": "Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.", "Openb 9:21": "En hebben zich ook niet bekeerd van hun doodslagen, noch van hun toverijen, noch van hun hoererij, noch van hun dieverijen.", "Lev 16:29-31": "En dit zal voor u een eeuwige inzetting zijn: u zult in de zevende maand, op de tiende van de maand, uzelf verootmoedigen, en geen enkel werk doen, of het nu een geboren Israëliet is of een vreemdeling die te midden van u verblijft. Want op die dag zal hij voor u verzoening doen, om u te reinigen; van al uw zonden zult u voor het aangezicht van de HEERE gereinigd worden. Dat zal voor u een sabbat van rust zijn, opdat u uzelf verootmoedigt; het is een eeuwige inzetting.", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Ps 106:6": "Wij hebben gezondigd, alsook onze vaderen, wij hebben verkeerd gedaan; wij hebben goddeloos gehandeld.", "Deut 27:20": "Vervloekt is hij die bij de vrouw van zijn vader ligt, omdat hij de slipt van zijn vader ontdekt heeft! En heel het volk zal zeggen: Amen.", "Jer 4:5-31": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden! Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang. De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.", "2 Kon 23:27": "En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.", "Neh 13:18": "Deden uw vaders niet zo, en bracht onze God niet al dit kwaad over ons en over deze stad? En u maakt de brandende toorn nog groter over Israël, door de sabbat te ontheiligen.", "Nahum 2:3": "De schilden van zijn helden zijn rood gemaakt, de dappere mannen zijn scharlakengekleurd; de wagens zijn in het vuur van de fakkels, ten dage als hij zich klaarmaakt; en de spiesen worden geschud.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Hos 3:1": "En de Heere zei tegen mij: Ga opnieuw heen, heb een vrouw lief, die, ook al is ze bemind door haar vriend, toch overspel doet; zoals de Heere de kinderen van Israël liefheeft, terwijl zij zich richten naar andere goden, en houden van de wijnkruiken.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Jer 34:20": "Ja, Ik zal hen overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken; en hun dode lichamen zullen voor het gevogelte van de hemel en het gedierte van de aarde tot voedsel zijn.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "Klaagl 2:15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "1 Kon 16:32": "En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had.", "Openb 17:16": "En de tien horens die u gezien hebt op het beest, die zullen de hoer haten, en zullen haar verwoest maken en naakt; en zij zullen haar vlees eten, en zullen haar met vuur verbranden.", "Jer 11:15": "Wat heeft Mijn beminde in Mijn huis te doen, terwijl zij die schandelijke daad met velen doet, en het heilige vlees van u geweken is? Wanneer u kwaad doet, dan springt u op van vreugde.", "Matt 23:35-38": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht. Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Ezech 16:39": "En Ik zal u in hun hand overgeven, en zij zullen uw verhoging afbreken, en uw hoge plaatsen omverwerpen, en u uw kleren uittrekken, en uw sierlijke juwelen nemen, en u naakt en bloot achterlaten.", "Lev 20:2-5": "U zult ook tegen de kinderen van Israël zeggen: Ieder van de kinderen van Israël, of van de vreemdelingen die als vreemdeling in Israël wonen, die van zijn nageslacht aan de Molech geeft, zal zeker gedood worden; het volk van het land zal hem met stenen stenigen. En Ik zal Mijn aangezicht tegen die man richten, en zal hem uit het midden van zijn volk uitroeien; want hij heeft van zijn nageslacht aan de Molech gegeven, om Mijn heiligdom te verontreinigen en Mijn heilige Naam te ontheiligen. En als het volk van het land hun ogen op enige manier verbergen zal voor die man, wanneer hij van zijn nageslacht aan de Molech geeft, zodat het hem niet doodt,", "Jer 1:11-16": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Ezech 20:4": "Zou u hun recht geven, zou u hun recht geven, o mensenkind? Maak hun de gruwelen van hun vaderen bekend;", "1 Sam 17:5": "En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantser aan; en het gewicht van het pantser was vijfduizend sikkel koper.", "Ex 34:13": "Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Jer 7:8-34": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Ezech 16:38-42": "Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver. En Ik zal u in hun hand overgeven, en zij zullen uw verhoging afbreken, en uw hoge plaatsen omverwerpen, en u uw kleren uittrekken, en uw sierlijke juwelen nemen, en u naakt en bloot achterlaten. Daarna zullen zij een menigte tegen u laten opkomen, en zij zullen u met stenen stenigen, en u met hun zwaarden doorsteken.", "Ezech 6:9": "Dan zullen wie van u ontkomen waren aan Mij denken onder de heidenvolken, waarheen zij gevankelijk zullen worden weggevoerd, omdat Ik verbroken ben door hun hoerachtige hart, dat van Mij afgeweken is, en door hun ogen, die hun drekgoden nahoereren; en zij zullen een walging aan zichzelf hebben over de slechte daden, die zij in al hun gruwelen gedaan hebben.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Ezech 23:31-34": "In de weg van uw zuster hebt u gewandeld, daarom zal Ik haar beker in uw hand geven. Zo zegt de Heere HEERE: U zult de beker van uw zuster drinken, die diep en wijd is; u zult tot belaching en spot worden; de beker houdt veel in. Van dronkenschap en verdriet zult u vol worden; de beker van uw zuster Samaria is een beker van verwoesting en eenzaamheid.", "Ex 32:19": "En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak.", "Dan 9:12": "En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze rechters, die ons berechtten, door over ons een groot kwaad te brengen, dat niet gebeurd is onder de hele hemel, zoals het aan Jeruzalem gebeurd is.", "Ezech 25:5": "En Ik zal Rabba tot een kameelstal maken, en de kinderen van Ammon tot een schaapskooi; en u zult weten dat Ik de HEERE ben.", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Jer 4:30": "Wat zult u dan doen, u die verwoest bent? Al kleedt u zich met scharlaken, al versiert u zich met gouden sieraad, al schuurt u uw ogen met blanketsel, toch zou u zich tevergeefs opmaken; de minnaars versmaden u, zij zullen uw leven zoeken.", "1 Kor 6:3": "Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Ezech 20:16": "Omdat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart ging hun drekgoden achterna.", "Nahum 2:4": "De wagens razen door de wijken, zij lopen heen en weer op de straten; hun verschijning is als die van fakkels, zij lopen door elkaar heen als de bliksems.", "Ezech 28:11": "Verder gebeurde het woord van de HEERE tot mij:", "Lev 26:31-39": "En Ik zal uw steden een woestijn maken, en uw heiligdommen verwoesten; en Ik zal uw liefelijke geur niet ruiken. Ja, Ik zal dat land verwoesten; zodat uw vijanden, die daarin zullen wonen, zich daarover ontzetten zullen. Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.", "Openb 2:4": "Maar Ik heb tegen u, dat u uw eerste liefde hebt verlaten.", "Ezech 12:17": "Daarna kwam het woord van de HEERE tot mij en Hij zei:", "Ezech 27:1": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "2 Kron 34:25": "Omdat zij Mij verlaten hebben, en aan andere goden reukoffers hebben gebracht, om Mij tot toorn te verwekken met alle werken van hun handen; daarom zal Mijn grimmigheid uitgegoten worden tegen deze plaats, en niet uitgeblust worden.", "Jes 3:17-24": "Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes, De reukdoosjes, en de kleine ketentjes, en de glinsterende kledingen,", "1 Kon 9:3": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn.", "2 Kon 7:7": "Daarom hadden zij zich klaargemaakt, en waren in de schemering gevlucht, en hadden hun tenten achtergelaten, en hun paarden, en hun ezels, het leger precies zoals het was; en waren gevlucht om hun leven te redden.", "Jer 20:5": "Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "Num 7:1": "En het gebeurde op de dag dat Mozes de tabernakel geheel had opgericht, en die gezalfd had, en die geheiligd had, en al zijn gereedschap, alsook het altaar en al zijn gereedschap, en hij ze gezalfd had, en die geheiligd had;", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Hos 2:4": "Want hun moeder hoereert, zij die hen ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn minnaars nagaan, die mij mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.", "Ezech 22:3": "En zeg: Zo zegt de Heere HEERE: O stad, die in haar midden bloed vergiet, zodat haar tijd komt, en die drekgoden tegen zichzelf maakt om zich te verontreinigen!", "Jer 49:5": "Zie, Ik zal vrees over u brengen, spreekt de Heere, de HEERE van de heerscharen, van allen die rondom u zijn, en u zult, ieder voor zich heen, weggedreven worden, en niemand zal hen die omzwerven bijeenbrengen.", "Ezech 22:1": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Deut 28:49-57": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan; Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge. En het zal de vrucht van uw vee, en de vrucht van uw land opeten, totdat u verdelgd zult zijn; het zal u geen koren, most of olie, aanwas van uw koeien of kudden van uw kleinvee overlaten, totdat het u vernietigt.", "Ezech 20:44": "Zo zult u weten dat Ik de HEERE ben, wanneer Ik met u gedaan zal hebben om Mijn Naam, niet naar uw slechte wegen, noch naar uw verdorven handelingen, o huis van Israël, spreekt de Heere HEERE.", "1 Kron 29:3": "En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb;", "Jer 22:9": "En zij zullen zeggen: Omdat zij het verbond van de HEERE, hun God, hebben verlaten, en zich voor andere goden hebben neergebogen, en die gediend.", "Amos 6:8": "De Heere HEERE heeft bij Zichzelf gezworen (spreekt de HEERE, de God van de heerscharen): Ik heb een afkeer van Jakobs hoogmoed, en Ik haat zijn paleizen; daarom zal Ik de stad en alles wat erin is overleveren.", "Ezech 26:10": "Vanwege de menigte van zijn paarden zal het stof van die u bedekken; uw muren zullen beven vanwege het gedruis van de ruiters, en de wielen, en de wagens, als hij door uw poorten zal intrekken, zoals door de ingangen van een doorgebroken stad.", "Ezech 7:4": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben.", "Ezech 23:7-49": "Zo dreef zij haar hoererijen met hen, die allen de keur van de zonen van Assur waren; en met allen op wie zij verliefd was, met al hun drekgoden, verontreinigde zij zich. Zij liet ook haar hoererijen niet varen, meegebracht uit Egypte; want zij hadden bij haar in haar jeugd gelegen, en zij hadden de tepels van haar maagdelijkheid betast, en zij hadden hun hoererij over haar uitgestort. Daarom gaf Ik haar over in de hand van haar minnaars, in de hand van de zonen van Assur, op wie zij verliefd was.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "2 Kron 36:17-19": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Micha 7:8": "Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn.", "2 Kon 21:6": "Ja, hij liet zijn zoon door het vuur gaan, en pleegde waarzeggerij en lette op vogelgeschrei; en hij stelde geestenbezweerders en waarzeggers aan; hij deed zeer veel kwaad in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Ezech 21:1": "Het woord van de HEERE kwam tot mij, en Hij zei:", "Ezech 16:11": "Ook versierde Ik u met sieraad, en deed armringen aan uw handen, en een keten om uw hals.", "Jer 7:8-11": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "2 Kron 24:23": "Daarom gebeurde het bij de jaarwisseling, dat het leger van Syrië tegen hem optrok, en zij kwamen tot Juda en Jeruzalem, en verdierven uit het volk alle leiders van het volk; en zij zonden al hun buit naar de koning van Damaskus.", "Jer 44:17": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "2 Petr 2:6": "en de steden Sodom en Gomorra tot as heeft laten verbranden en met een omkering veroordeeld heeft, en tot een voorbeeld gesteld heeft voor hen die goddeloos zouden leven;", "Ezech 29:17": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Ex 34:14": "(Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)", "Ezech 20:18": "Maar Ik zei tegen hun kinderen in de woestijn: Wandelt niet in de inzettingen van uw vaderen, en onderhoudt hun rechten niet, en verontreinigt u niet met hun drekgoden.", "Joh 8:4": "En zij zetten haar in het midden, en zeiden tegen Hem: Meester, deze vrouw is op heterdaad betrapt, terwijl zij overspel pleegde.", "Neh 13:17": "Zo twistte ik met de edelen van Juda, en zei tegen hen: Wat voor een slechte zaak is dit, die u doet, en waarmee u de sabbatdag ontheiligt?", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Ezech 23:22-25": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Job 31:1": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd?", "Deut 29:20": "De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Ezech 20:7": "En Ik zei tegen hen: Ieder werpt de verfoeisels van zijn ogen weg; en verontreinigt u niet met de drekgoden van Egypte; Ik, de HEERE, ben uw God.", "Jer 7:9": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,", "Jes 56:2": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "1 Sam 18:4": "En Jonathan deed zijn mantel af, die hij aan had, en gaf hem aan David, ook zijn kleren, ja, zelfs zijn zwaard, en zijn boog, en zijn gordel.", "2 Kon 17:3": "Tegen hem trok Salmaneser, koning van Assyrië, op; en Hosea werd zijn knecht, zodat hij hem een geschenk gaf.", "Jer 17:1-4": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren; Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels. Ik zal Mijn berg met het veld, uw vermogen en al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Ruth 3:3": "Was u dan, en zalf u, en trek uw kleren aan, en ga naar de dorsvloer; maar maak u aan de man niet bekend, totdat hij klaar is met eten en drinken.", "1 Kon 14:16": "En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.", "1 Petr 4:3": "Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "Ps 9:17": "De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.", "Zach 13:2": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen.", "Ex 40:9": "Dan zult u de zalfolie nemen en de tabernakel zalven, en alles wat daarin is; en u zult dezelf heiligen, met al zijn gereedschap, en het zal heilig zijn.", "Ezech 16:2": "Mensenkind, maak Jeruzalem haar gruwelen bekend,", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Ezech 16:15": "Maar u hebt vertrouwd op uw schoonheid, en hebt gehoereerd vanwege uw naam; ja, u hebt uw hoererijen uitgestort over ieder die voorbijkwam; voor hem was u.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Ezech 7:20": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld.", "Ex 20:8-11": "Gedenk de sabbatdag, dat u die heiligt. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Micha 3:10": "Zij bouwen Sion met bloed, en Jeruzalem met onrecht.", "2 Kon 3:27": "Toen nam hij zijn eerstgeboren zoon, die in zijn plaats koning zou worden, en offerde hem als brandoffer op de muur. Daaruit kwam een zeer grote toorn over Israël; daarom trokken zij van hem weg, en keerden terug naar hun land.", "Jer 51:7-9": "Babel was een gouden beker in de hand van de HEERE, die de hele aarde dronken maakte; de volken hebben van haar wijn gedronken, daarom zijn de volken dol geworden. Plotseling is Babel gevallen en verbroken; huil over haar, neem balsem voor haar pijn, misschien zal zij genezen worden. Wij hebben Babel gemeesterd, maar zij is niet genezen; verlaat haar dan, en laat ons ieder naar zijn land trekken; want haar oordeel reikt tot aan de hemel, en is verheven tot aan de bovenste wolken.", "Richt 7:12": "En de Midianieten, en Amalekieten, en al de mensen van het oosten, lagen in het dal, als een menigte sprinkhanen, en hun kamelen waren niet te tellen, als het zand dat aan de oever van de zee ligt, in menigte.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Lev 20:14": "En wanneer een man een vrouw en haar moeder neemt, is het een schandelijke daad; men zal hem, en hen, met vuur verbranden, zodat er geen schandelijke daad in uw midden is.", "2 Kon 20:13-15": "En Hizkia luisterde naar hen, en hij toonde hun zijn hele schathuis, het zilver en het goud, en de specerijen, en de beste olie, en zijn wapenhuis, en alles wat gevonden werd in zijn schatten; er was geen ding in zijn huis, of in zijn hele heerschappij, dat hij hun niet toonde. Toen kwam de profeet Jesaja naar de koning Hizkia, en zei tegen hem: Wat hebben die mannen gezegd, en waar zijn zij vandaan bij u gekomen? En Hizkia zei: Zij zijn uit een ver land gekomen, uit Babel. En hij zei: Wat hebben zij gezien in uw huis? En Hizkia zei: Zij hebben alles gezien wat in mijn huis is; er is geen ding in mijn schatten dat ik hun niet getoond heb.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Jer 25:15": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend;", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Hand 13:14": "En zij trokken van Perge het land door, en kwamen te Antiochië, een stad in Pisidië; en gingen op de dag van de sabbat de synagoge in, en gingen zitten.", "Jer 46:21": "Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn samen gevlucht, zij hebben niet gestaan; want de dag van hun verderf is over hen gekomen, de tijd van hun bezoeking.", "Lev 23:1-3": "Daarna sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden. Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.", "Zach 8:10": "Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Matt 5:13": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden.", "2 Kron 26:14": "En Uzzia bereidde voor hen, voor het gehele leger, schilden, en speren, en helmen, en pantsers, en bogen, zelfs tot de slingerstenen toe.", "Ezech 28:1": "Verder gebeurde het woord van de HEERE tot mij:", "Micha 6:7": "Zou de HEERE welgevallen hebben aan duizenden rammen, aan tienduizenden oliebeken? Zal ik mijn eerstgeborene geven voor mijn overtreding, de vrucht van mijn buik voor de zonde van mijn ziel?", "1 Kon 14:9": "maar kwaad gedaan hebt, meer dan allen die vóór u geweest zijn, en heengegaan bent, en u andere goden en gegoten beelden gemaakt hebt, om Mij tot toorn te verwekken, en Mij achter uw rug geworpen hebt;", "Jer 15:4": "En Ik zal hen overgeven tot een schrikbeeld voor alle koninkrijken van de aarde, vanwege Manasse, zoon van Jehizkia, koning van Juda, om wat hij in Jeruzalem gedaan heeft.", "Neh 9:13": "En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.", "Ezech 16:13-16": "Zo was u versierd met goud en zilver, en uw kleding was fijn linnen, en zijde, en geborduurd werk; u at meelbloem, en honing, en olie, en u was buitengewoon mooi, en u had voorspoed, zodat u een koninkrijk werd. Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE. Maar u hebt vertrouwd op uw schoonheid, en hebt gehoereerd vanwege uw naam; ja, u hebt uw hoererijen uitgestort over ieder die voorbijkwam; voor hem was u.", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Ps 118:24": "Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "Gen 3:6": "En de vrouw zag dat die boom goed was om van te eten, en dat hij een lust was voor de ogen, ja, een boom die begerenswaardig was om er verstandig van te worden; en zij nam van zijn vrucht en at; en zij gaf ook aan haar man, die bij haar was, en hij at.", "Ezech 8:1-18": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel. Toen zag ik, en zie, een gelijkenis, als de gedaante van vuur; van de gedaante van Zijn lenden en naar beneden was vuur; en van Zijn lenden en naar boven, als de gedaante van een glans, als de kleur van amber. En Hij stak de gelijkenis van een hand uit, en nam mij bij het haar van mijn hoofd; en de Geest voerde mij op tussen de aarde en de hemel, en bracht mij in visioenen van God naar Jeruzalem, tot de deur van de poort van de binnenste voorhof, die uitziet naar het noorden, waar de zitplaats was van een beeld van de ijver, dat tot ijver opwekt.", "Hos 2:2": "Anders zal Ik ze naakt uitkleden, en haar neerzetten als op de dag dat zij geboren werd; ja, Ik zal haar maken als een woestijn, en haar neerzetten als een dor land, en haar doden door dorst;", "Ezech 36:6": "Daarom profeteer van het land van Israël, en zeg tot de bergen en tot de heuvels, tot de stromen en tot de dalen: Zo zegt de Heere HEERE: Ziet, Ik heb in Mijn ijver en in Mijn grimmigheid gesproken, omdat u de smaad van de heidenen gedragen hebt;", "Lev 23:27-32": "Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God. Want elke ziel, die op diezelfde dag niet verootmoedigd zal zijn geweest, die zal uitgeroeid worden uit haar volk.", "Ezech 17:11": "Daarna kwam het woord van de HEERE tot mij en zei:", "Jer 8:12": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.", "Jer 23:27": "Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.", "2 Petr 2:14": "zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Luk 11:39-52": "En de Heere zei tegen hem: Nu, u Farizeeën, u reinigt de buitenkant van de drinkbeker en de schotel; maar uw binnenste is vol roofzucht en boosheid. Dwazen! Heeft Hij die de buitenkant gemaakt heeft, niet ook de binnenkant gemaakt? Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Ezech 33:21-29": "En het gebeurde in het twaalfde jaar van onze wegvoering, in de tiende maand, op de vijfde dag van de maand, dat er iemand tot mij kwam die uit Jeruzalem ontkomen was, en hij zei: De stad is ingenomen. Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom. Toen kwam het woord van de HEERE tot mij:", "Jer 11:12": "Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Ezech 12:8": "En 's morgens kwam het woord van de HEERE tot mij en Hij zei:", "1 Kon 14:22": "En Juda deed wat kwaad was in de ogen van de HEERE, en zij verwekten Hem tot ijver, meer dan al hun vaderen gedaan hadden, met hun zonden die zij zondigden.", "Jer 17:21": "Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem.", "Ezech 18:24": "Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en handelt naar al de gruwelen die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet aangerekend worden; door zijn overtreding, waardoor hij overtreden heeft, en door zijn zonde, die hij gezondigd heeft, daardoor zal hij sterven.", "Jer 48:35": "En Ik zal in Moab doen ophouden, spreekt de HEERE, hem die op de hoogte offert, en die aan zijn goden reukwerk brandt.", "Jes 57:9": "En u trekt met olie naar de koning, en u vermeerdert uw welriekende zalven; en u zendt uw gezanten ver weg, en vernedert u tot in het dodenrijk toe.", "Ezech 14:12": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Hand 13:44": "En op de volgende sabbat kwam bijna de hele stad samen om het Woord van God te horen.", "Ezech 16:20": "Verder hebt u uw zonen en uw dochters, die u Mij gebaard had, genomen, en hebt ze aan hen geofferd om verteerd te worden; is het iets kleins van uw hoererijen,", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "1 Kon 14:24": "Er waren ook schandjongens in het land; zij deden naar al de gruwelen van de heidenvolken, die de HEERE van voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "Ps 73:10": "Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,", "1 Petr 4:4": "waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;", "Joh 9:1-34": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af. En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden? Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Jer 47:3": "Vanwege het geluid van het geklater van de hoeven van zijn sterke paarden, vanwege het geraas van zijn wagens, en het bulderen van zijn raderen; de vaders zien niet om naar de kinderen, vanwege de slapheid van de handen;", "Ezech 44:16": "Die zullen in Mijn heiligdom naar binnen gaan, en die zullen tot Mijn tafel naderen om Mij te dienen, en zij zullen Mijn wacht in acht nemen.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Hos 13:6": "Daarna zijn zij, naarmate hun weide was, verzadigd geworden; toen zij verzadigd waren geworden, heeft hun hart zich verheven; daarom hebben zij Mij vergeten.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Ex 32:4": "En hij nam ze uit hun hand, bewerkte het met een graveerstift, en maakte er een gegoten kalf van. Toen zeiden zij: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd!", "1 Kor 5:1-13": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft. En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden? Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Joël 2:1-17": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij. Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten. Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen.", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "1 Kon 12:28": "Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.", "Deut 28:25-68": "De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde. En uw dode lichaam zal voedsel zijn voor alle vogels van de hemel, en voor de dieren van de aarde; en niemand zal ze verjagen. De HEERE zal u slaan met zweren van Egypte, en met gezwellen, en met droge schurft, en met huiduitslag, waarvan u niet zult kunnen genezen.", "2 Sam 14:25": "Nu was er in heel Israël geen man zo mooi als Absalom, zeer geprezen; van zijn voetzool af tot zijn hoofdschedel toe was er geen gebrek in hem.", "Gal 5:7": "U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn?", "Ps 44:21": "Als wij de Naam van onze God hadden vergeten, en onze handen tot een vreemde god uitgebreid,", "Ezech 16:19": "En Mijn brood, dat Ik u gaf, meelbloem en olie, en honing, waarmee Ik u voedde, dat hebt u ook voor hun gezichten gezet tot een liefelijke geur; zo is het gebeurd, spreekt de Heere HEERE.", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Joh 19:31": "De Joden dan, opdat de lichamen niet aan het kruis zouden blijven op de sabbat, omdat het de voorbereiding was (want die dag van de sabbat was een grote dag), vroegen Pilatus dat hun benen gebroken zouden worden, en zij weggenomen zouden worden.", "Ezech 16:29": "Maar u hebt uw hoererij vermeerderd in het land van Kanaän tot in Chaldea; en daarmee bent u ook niet verzadigd geworden.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "1 Petr 3:3": "Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Ezech 6:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Micha 5:10-13": "En Ik zal de steden van uw land uitroeien, en Ik zal al uw vestingen afbreken. En Ik zal de toverijen uit uw hand uitroeien, en u zult geen guichelaars meer hebben. En Ik zal uw gesneden beelden en uw opgerichte beelden uit uw midden uitroeien, zodat u zich niet meer zult neerbuigen voor het werk van uw handen.", "Jer 19:5": "Want zij hebben de hoogten van Baäl gebouwd, om hun zonen met vuur te verbranden, aan Baäl tot brandoffers; wat Ik niet geboden heb, noch gesproken heb, noch in Mijn hart is opgekomen.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Ps 45:12-17": "Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer. En de dochter van Tyrus, de rijken onder het volk, zullen uw gunst met een geschenk smeken. De Dochter van de Koning is geheel verheerlijkt van binnen; haar kleding is van gouden borduursel.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Klaagl 2:16": "Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Hos 5:3": "Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Ezech 16:17": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.", "Joh 18:28": "Zij leidden Jezus dan van Kajafas naar het gerechtsgebouw. En het was 's morgens vroeg; en zij zelf gingen niet naar binnen in het gerechtsgebouw, opdat zij niet verontreinigd zouden worden, maar opdat zij het pascha konden eten.", "Lev 8:10": "Toen nam Mozes de zalfolie, en zalfde de tabernakel, en alles wat daarin was, en heiligde ze.", "Jer 39:8": "En de Chaldeeën verbrandden het huis van de koning en de huizen van het volk met vuur; en zij braken de muren van Jeruzalem af.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Ezech 23:5-7": "Ohola nu hoereerde, terwijl zij van Mij was; en zij werd verliefd op haar minnaars, op de Assyriërs, die dichtbij waren, Bekleed met hemelsblauw, vorsten en machthebbers, allemaal aantrekkelijke jonge mannen, ruiters, rijdend op paarden. Zo dreef zij haar hoererijen met hen, die allen de keur van de zonen van Assur waren; en met allen op wie zij verliefd was, met al hun drekgoden, verontreinigde zij zich.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren."}, "noten": {"1": "Vers 7: SV: drekgoden. D.i.: mestgoden, een bewust minachtende benaming voor afgoden."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">Verder</span> kwam <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">HEERE</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">mij</span> en Hij zei:", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">Mensenkind</span>! Er <span class=\"wl\" data-l=\"L2\" dat
