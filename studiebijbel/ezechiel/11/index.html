van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.","2":"En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad.","3":"Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.","4":"Daarom, profeteer tegen hen; profeteer, o mensenkind!","5":"Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.","6":"U hebt uw gedoden in deze stad talrijk gemaakt, en u hebt de straten daarvan gevuld met de gedoden.","7":"Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan.","8":"U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE.","9":"Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.","10":"U zult door het zwaard vallen; in het gebied van Israël zal Ik u oordelen, en u zult weten dat Ik de HEERE ben.","11":"Deze stad zal u niet tot een pot zijn, en u zult in het midden daarvan niet tot vlees zijn; in het gebied van Israël zal Ik u oordelen.","12":"En u zult weten dat Ik de HEERE ben, omdat u in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, maar naar de rechten van de heidenvolken die rondom u zijn, gedaan hebt.","13":"Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?","14":"Toen kwam het woord van de HEERE tot mij, en Hij zei:","15":"Mensenkind, het zijn uw broeders, uw broeders, de mannen van uw familie, en het hele huis van Israël, ja, dat allemaal, tot wie de inwoners van Jeruzalem gezegd hebben: Blijf ver weg van de HEERE, dit land is ons tot een erfbezit gegeven.","16":"Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.","17":"Daarom, zeg: Zo zegt de Heere HEERE: Ja, Ik zal u verzamelen uit de volken, en Ik zal u bijeenbrengen uit de landen waarin u verstrooid bent, en Ik zal u het land van Israël geven.","18":"En zij zullen daarheen komen, en al de verfoeiselen daarvan en al de gruwelen daarvan van daar wegdoen.","19":"En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven;","20":"Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.","21":"Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.","22":"Toen tilden de cherubs hun vleugels op, en de raderen tegenover hen; en de heerlijkheid van de God van Israël was van boven over hen.","23":"En de heerlijkheid van de HEERE steeg op van het midden van de stad, en bleef staan op de berg die ten oosten van de stad is.","24":"Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.","25":"En ik sprak tot de weggevoerde gevangenen al de woorden van de HEERE, die Hij mij had laten zien."},"SV":{"1":"Toen hief mij de Geest op, en bracht mij tot de Oostpoort van het huis des HEEREN, dewelke ziet oostwaarts; en ziet, aan de deur der poort waren vijf en twintig mannen, en in het midden van hen zag ik Jaazanja, den zoon van Azzur, en Pelatja, den zoon van Benaja, vorsten des volks.","2":"En Hij zeide tot mij: Mensenkind, deze zijn de mannen, die ongerechtigheid bedenken, en die kwaden raad raden in deze stad.","3":"Die zeggen: Men moet geen huizen nabij bouwen; deze *stad* zou de pot, en wij het vlees zijn.","4":"Daarom profeteer tegen hen; profeteer, o mensenkind!","5":"Zo viel dan de Geest des HEEREN op mij, en Hij zeide tot mij: Zeg: Zo zegt de HEERE: Alzo zegt gijlieden, o huis Israëls! want Ik weet elkeen der dingen, die in uw geest opklimmen.","6":"Gij hebt uw verslagenen in deze stad vermenigvuldigd, en gij hebt derzelver straten met de verslagenen vervuld.","7":"Daarom, zo zegt de Heere HEERE: Uw verslagenen, die gij in het midden derzelve nedergelegd hebt, die zijn dat vlees, en deze *stad* is de pot; maar ulieden zal Ik uit het midden derzelve doen uitgaan.","8":"Gijlieden hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE.","9":"Ook zal Ik ulieden uit het midden derzelve doen uitgaan, en Ik zal u overgeven in de hand der vreemden; en Ik zal recht onder u doen.","10":"Gij zult door het zwaard vallen; in de landpale Israëls zal Ik u richten, en gij zult weten, dat Ik de HEERE ben.","11":"Deze *stad* zal ulieden niet tot een pot zijn, en gij zult in het midden derzelve *niet* tot vlees zijn; in de landpale Israëls zal Ik u richten.","12":"En gij zult weten, dat Ik de HEERE ben, omdat gij in Mijn inzettingen niet gewandeld, en Mijn rechten niet gedaan hebt, maar naar de rechten der heidenen, die rondom u zijn, gedaan hebt.","13":"Het geschiedde nu, als ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neder op mijn aangezicht, en riep met luider stem; en zeide: Ach, Heere HEERE! zult Gij gans een voleinding maken met het overblijfsel van Israël?","14":"Toen geschiedde het woord des HEEREN tot mij, zeggende:","15":"Mensenkind, het zijn uw broederen, uw broederen, de mannen uwer maagschap, en het ganse huis Israëls, *ja*, dat ganse, tot welke de inwoners van Jeruzalem gezegd hebben: Maakt u verre af van den HEERE, ditzelve land is ons tot een erfbezitting gegeven.","16":"Daarom zeg: Zo zegt de Heere HEERE: Hoewel Ik hen verre onder de heidenen weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, nochtans zal Ik hun een weinig *tijds* tot een heiligdom zijn, in de landen, waarin zij gekomen zijn.","17":"Daarom zeg: Alzo zegt de Heere HEERE: Ja, Ik zal ulieden vergaderen uit de volken, en Ik zal u verzamelen uit de landen, waarin gij verstrooid zijt, en Ik zal u het land Israëls geven.","18":"En zij zullen daarhenen komen, en al deszelfs verfoeiselen en al deszelfs gruwelen van daar wegdoen.","19":"En Ik zal hun enerlei hart geven, en zal een nieuwen geest in het binnenste van u geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een vlesen hart geven;","20":"Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren, en dezelve doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.","21":"Maar welker hart het hart hunner verfoeiselen en hunner gruwelen nawandelt, derzelver weg zal Ik op hun hoofd geven, spreekt de Heere HEERE.","22":"Toen hieven de cherubs hun vleugelen op, en de raderen tegenover hen; en de heerlijkheid des Gods van Israël was over hen van boven.","23":"En de heerlijkheid des HEEREN rees op van het midden der stad, en stond op den berg, die tegen het oosten der stad is.","24":"Daarna nam mij de Geest op, en bracht mij in gezicht door den Geest Gods in Chaldea tot de gevankelijk weggevoerden; en het gezicht, dat ik gezien had, voer van mij op.","25":"En ik sprak tot de gevankelijk weggevoerden al de woorden des HEEREN, die Hij mij had doen zien."},"KJV":{"1":"Moreover the spirit lifted me up, and brought me unto the east gate of the LORD'S house, which looketh eastward: and behold at the door of the gate five and twenty men; among whom I saw Jaazaniah the son of Azur, and Pelatiah the son of Benaiah, princes of the people.","2":"Then said he unto me, Son of man, these *are* the men that devise mischief, and give wicked counsel in this city:","3":"Which say, *It is* not near; let us build houses: this *city is* the caldron, and we *be* the flesh.","4":"Therefore prophesy against them, prophesy, O son of man.","5":"And the Spirit of the LORD fell upon me, and said unto me, Speak; Thus saith the LORD; Thus have ye said, O house of Israel: for I know the things that come into your mind,","6":"Ye have multiplied your slain in this city, and ye have filled the streets thereof with the slain.","7":"Therefore thus saith the Lord GOD; Your slain whom ye have laid in the midst of it, they *are* the flesh, and this *city is* the caldron: but I will bring you forth out of the midst","8":"Ye have feared the sword; and I will bring a sword upon you, saith the Lord GOD.","9":"And I will bring you out of the midst thereof, and deliver you into the hands of strangers, and will execute judgments","10":"Ye shall fall by the sword; I will judge you in the border of Israel; and ye shall know that I *am* the LORD.","11":"This *city* shall not be your caldron, neither shall ye be the flesh in the midst thereof; *but* I will judge you in the border of Israel:","12":"And ye shall know that I *am* the LORD: for ye have not walked in my statutes, neither executed my judgments, but have done after the manners of the heathen that *are* round about","13":"And it came to pass, when I prophesied, that Pelatiah the son of Benaiah died. Then fell I down upon my face, and cried with a loud voice, and said, Ah Lord GOD! wilt thou make a full end of the remnant of Israel?","14":"Again the word of the LORD came unto me, saying,","15":"Son of man, thy brethren, *even* thy brethren, the men of thy kindred, and all the house of Israel wholly, *are* they unto whom the inhabitants of Jerusalem have said, Get you far from the LORD: unto us is this land given in possession.","16":"Therefore say, Thus saith the Lord GOD; Although I have cast them far off among the heathen, and although I have scattered them among the countries, yet will I be to them as a little sanctuary in the countries where they shall come.","17":"Therefore say, Thus saith the Lord GOD; I will even gather you from the people, and assemble you out of the countries where ye have been scattered, and I will give you the land of Israel.","18":"And they shall come thither, and they shall take away all the detestable things thereof and all the abominations","19":"And I will give them one heart, and I will put a new spirit within you; and I will take the stony heart out of their flesh, and will give them an heart of flesh:","20":"That they may walk in my statutes, and keep mine ordinances, and do them: and they shall be my people, and I will be their God.","21":"But *as for them* whose heart walketh after the heart of their detestable things and their abominations, I will recompense their way upon their own heads, saith the Lord GOD.","22":"Then did the cherubims lift up their wings, and the wheels beside them; and the glory of the God of Israel *was* over them above.","23":"And the glory of the LORD went up from the midst of the city, and stood upon the mountain which *is* on the east side of the city.","24":"Afterwards the spirit took me up, and brought me in a vision by the Spirit of God into Chaldea, to them of the captivity. So the vision that I had seen went up","25":"Then I spake unto them of the captivity all the things that the LORD had shewed"}},"tsk":{"1":[{"kopje":"de Geest","refs":["Ezech 11:24","Ezech 3:12","Ezech 3:14","Ezech 8:3","Ezech 37:1","Ezech 40:1","Ezech 40:2","Ezech 41:1","1 Kon 18:12","2 Kon 2:16","Hand 8:39","2 Kor 12:1-4","Openb 1:10"]},{"kopje":"de Oostpoort","refs":["Ezech 10:19","Ezech 43:4"]},{"kopje":"zie","refs":["Ezech 8:16"]},{"kopje":"Jaazanja","refs":["2 Kon 25:23"]},{"kopje":"Pelatja","refs":["Ezech 11:13","Ezech 22:27","Jes 1:10","Jes 1:23","Hos 5:10"]}],"3":[{"kopje":"Men moet "Onderscheid dezen van een anderen Jaäzanja, den zoon van Safan, boven Eze 8:11 ."},{"catchword":"Pelatja,","tekst":"Die ook te onderscheiden is van anderen van dezen naam; 1Ch 3:21 , en 1Ch 4:42 ."},{"catchword":"vorsten des volks","tekst":"Dat is, voortreffelijke personen, die in de regering des lands uitstekende, bij het volk aanzienlijk waren, en dienvolgens een voorbeeld der godvruchtigheid allen billijk moesten geweest zijn; vergelijk Exo 3:16 ; Lev 4:15 ; 2Ki 23:1 , en de aantekening."}],"2":[{"catchword":"Hij zeide tot mij","tekst":"Te weten de Geest, die hem voerde. Waaruit blijkt dat het woord niet van den wind moet verstaan worden. Anderen verstaan door dezen sprekenden persoon den Heere, die zich over de cherubim vertoonde, boven Eze 10:19 ."},{"catchword":"raden in deze stad","tekst":"Te weten van de stad niet over te geven in der Chaldeën hand, tegen den raad van den profeet Jeremia, maar die te beschermen."}],"3":[{"catchword":"nabij bouwen;","tekst":"Te weten nabij de stad, dat is, in de voorstad."},{"catchword":"deze stad","tekst":"Dat is, Jeruzalem."},{"catchword":"zou","tekst":"Dat is, de Chaldeën, komende om deze stad te belegeren, zouden in de huizen der voorstad bekwamelijk mogen wonen, en als een vuur, de stad als een pot zijnde, doen zieden, en ons, die daarin zouden zijn, als het vlees door honger verteren, vergelijk onder Eze 24:3 , enz. Zij spotten met de profetie van Jer 1:13 , die zij met hun raad zoeken te schande en leugenachtig te maken. Anders, [ons verderf] is niet nabij, laat ons huizen bouwen; te weten om hier te blijven wonen, en zo zij deze stad de pot en wij het vlees. Want wij zijn het vlees in den pot, wij moeten daarin blijven, zodat Jeremia tegen zichzelven profeteert als hij ons spreekt van weggevoerd te zullen worden."},{"catchword":"de pot,","tekst":"Te weten waarvan Jeremia geprofeteerd heeft, Jer 1 ."}],"5":[{"catchword":"viel dan de Geest des HEEREN op mij,","tekst":"Zie boven Eze 1:3 ."},{"catchword":"Hij zeide tot mij","tekst":"Zie boven vs.2."},{"catchword":"Alzo zegt gijlieden","tekst":"Te weten gelijk recht tevoren, vs.3, verhaald is."},{"catchword":"Israëls","tekst":"Dat is, Juda. Zie 2Ch 15:17 en 2Ch 21:2 met de aantekening."},{"catchword":"der dingen,","tekst":"Hebreeuws, de opklimmingen uws geestes; dat is, dat in de gedachten uws harten opkomt. Zie van gelijke manier van spreken Jer 7:31 ."}],"6":[{"catchword":"Gij hebt","tekst":"Te weten vorsten en regeerders der stad, van wie zie boven vs.1."},{"catchword":"uw verslagenen","tekst":"Dat is, die gij door allerlei soort van ongerechtigheid in de stad verdrukt hebt. Vergelijk boven Eze 7:23 , en Eze 9:9 ."}],"7":[{"catchword":"Uw verslagenen,","tekst":"Dat de Joden zeiden tot bespotting van de woorden van Jeremia, keert Ezechiël tegen hen, alsof hij zeide: Zeker is de stad Jeruzalem de pot, maar het vlees daarin ziedende, zijn degenen, die gij daarin wredelijk verdrukt hebt, om welker oorzaak en al uw goddeloosheden, Gods toorn u en uws gelijken nog gruwelijker verslinden zal."},{"catchword":"van haar","tekst":"Te weten de stad Jeruzalem. Anders: zal hij, zal men, doen uitgaan. Versta, den vijand."},{"catchword":"doen uitgaan","tekst":"Namelijk door middel der Chaldeën, die hen gevankelijk nemen en naar hunne verdiensten straffen zouden. Zie de vier volgende verzen."}],"8":[{"catchword":"zwaard gevreesd;","tekst":"Dat is, de oorlog. Zie Lev 26:6 ."}],"9":[{"catchword":"der vreemden;","tekst":"Namelijk, der Chaldeën."},{"catchword":"recht onder u doen","tekst":"Zie boven Eze 5:8 ."}],"10":[{"catchword":"door het zwaard vallen;","tekst":"Dat is door den oorlog omkomen. Zie Lev 26:7 ."},{"catchword":"landpale Israëls","tekst":"Namelijk in Ribla. Zie van deze stad 2Ki 23:33 , en 2Ki 25:6 . Zij lag in het land van Hamath, hetwelk benoorden was aan de grenzen van Palestina; Num 34:8 ; Jos 13:5 ."},{"catchword":"richten,","tekst":"Dat is, straffen; vergelijk Gen 15:14 ; alzo hier in vs.11."}],"11":[{"catchword":"een pot zijn,","tekst":"Te weten om daarin te zieden, dat is daarin te blijven, en uw meeste straf, dit leven aangaande, te dragen."},{"catchword":"niet tot vlees zijn;","tekst":"Dit woord moet hier uit het voorgaande lid weder bijgesteld zijn."},{"catchword":"in de landpale Israëls","tekst":"Gelijk boven in vs.10."},{"catchword":"zal Ik u richten","tekst":"Zie de vervulling hiervan 2Ki 25:21 ; Jer 52:10 ."}],"12":[{"catchword":"rechten der heidenen,","tekst":"Of, wijzen. Versta hun afgodische rechten, die God hun verboden had, enigszins na te volgen; Lev 18:3 , en Lev 20:23 ; Deu 12:29-30 , en Deu 18:14 ; boven Eze 5:7 , worden de Joden bestraft omdat zij naar de rechten der heidenen niet leefden. Doch zie daarvan de aantekening aldaar."}],"13":[{"catchword":"profeteerde,","tekst":"Het schijnt dat dit profeteren van Ezechiël en het sterven van Pelatja eerst in het gezicht geschied is, en daarna inderdaad, alzo dat Ezechiël den Israëlieten, die in Chaldea waren, dadelijk verkondigd heeft wat hij gezien en in den geest gedaan had, en dat de dood van Pelatja dan ook dadelijk geschied is, tot de bevestiging dezer voorzegging."},{"catchword":"viel ik neder op mijn aangezicht,","tekst":"Te weten uit verslagenheid en om voor het overblijfsel van het volk te bidden; vergelijk Num 14:5 ."},{"catchword":"luider stem;","tekst":"Hebreeuws, groter."},{"catchword":"zult Gij gans een voleinding maken","tekst":"De profeet ziet niet eigenlijk in deze klacht op Pelatja, die een goddeloos mens was, maar op de weinigen, die nog overig waren, denkende, indien de Heere zo voortging, dat Hij haast een einde zou maken, daar Hij nochtans beloofd had een overblijfsel te behouden. Zie van deze manier van spreken Jer 4:27 ."}],"15":[{"catchword":"het zijn","tekst":"Versta, degenen, die met Jojachin door den raad van Jeremia als ballingen in Chaldea verhuisd waren; 2Ki 24:12 , enz."},{"catchword":"broederen, uw","tekst":"Dat is, uwe bloedvrienden en nabestaanden; zie Gen 24:27 ."},{"catchword":"broederen, de mannen","tekst":"Deze herhaling geschied om den ijver Gods en de gewichtigheid der zaak uit te drukken."},{"catchword":"uwer maagschap,","tekst":"Hebreeuws, uwer lossing; dat is, die uit kracht van hunne maagschap het recht hebben om uwe goederen te lossen, en dus uw nabestaanden bloedvrienden zijn. Zie Lev 25:25 ."},{"catchword":"ganse, tot welke de inwoners van Jeruzalem","tekst":"Te weten dat waarin Chaldea was, meest behorende tot den stam van Juda."},{"catchword":"gezegd hebben","tekst":"Te weten hen bespottende, omdat zij hun vaderland verlaten hadden en als ballingen in Chaldea woonden; daar zij nog andere bezaten, en gebruikten het land, dat God hunnen vaderen tot een erfelijk goed gegeven had."},{"catchword":"Maakt u verre af van den HEERE,","tekst":"Alsof zij zeiden: Wij zijn alleen Gods volk, die zijn land, dat Hij onzen vaderen gegeven heeft, bewonen. Wij hebben met u, die van ons gescheiden zijt, niet te doen, en gij zult geen deel met ons hebben in dit land, dat gij verlaten hebt."}],"16":[{"catchword":"Ik hen verre onder de heidenen weggedaan heb,","tekst":"Te weten die Hij in vs.15 des profeten broeders en het huis van Israël genoemd had; alzo in het volgende."},{"catchword":"weinig tijds","tekst":"Of, Ik ben hun een weinig [tijds] tot een heiligdom geworden. Anders: Ik zal hen tot een klein heiligdom zijn; te weten inplaats van den zichtbaren tempel in Jeruzalem, die een teken was van mijne tegenwoordigheid, zal Ik nu hun voor een kleinen tijd bij zijn, zonder dat uitwendige teken, met mijn Geest en genade onder hen wonende, hunne gebeden verhorende en hen beschermende. Anders: een heiligdom der weinigheid, dat is, van weinigen. Vergelijk Isa 8:14 ."},{"catchword":"in de landen,","tekst":"Te weten van Chaldea en anderen, waarin zij verstrooid zijn."}],"17":[{"catchword":"Ik zal ulieden vergaderen uit de volken,","tekst":"Hetwelk vervuld is als de Joden wedergekomen zijn uit de Babylonische gevangenschap naar hun vaderland, en nog volmaakter als de Heere Christus zijne gemeente door den dienst der apostelen uit alle volken vergaderd heeft."},{"catchword":"Ik zal u het land Israëls geven","tekst":"Te weten na de gevangenschap van zeventig jaren."}],"18":[{"catchword":"verfoeiselen","tekst":"Dat is, afgoden, die men verfoeien en waarvan men een gruwel moet hebben."}],"19":[{"catchword":"enerlei","tekst":"Dat is, hetwelk niet dubbel of vals is, maar oprecht, ongeveinsd, mij alleen aanhangende, en niet verdeeld tussen mij en de afgoden. Zie wijders Jer 32:39 , met de aantekening."},{"catchword":"hart geven,","tekst":"Dat is, wil, genegenheid, beweging. Zo is het woord hart meest genomen als het bij het woord geest gesteld wordt; hetwelk dan betekent den zin, het verstand en de gedachten des mensen; Psa 51:12 ; onder Eze 18:31 , en Eze 36:26 ."},{"catchword":"nieuwen geest in het binnenste van u geven;","tekst":"Dat is, andere zinnen en gedachten dan tevoren in u waren. Versta ene verandering van den geest, niet in wezen, maar in hoedanigheden en krachten. Vergelijk de voor aangewezen plaatsen, idem Rom 7:6 , en Rom 12:2 ; 2Co 4:13 ; Eph 4:23 ; Col 3:10 ."},{"catchword":"het stenen hart","tekst":"Hebreeuws, het hart des steens; dat is een stenen, of stenig hart. Het hart van den onherboren mens wordt hier bij een steen vergeleken, ten aanzien van zijn natuurlijke hardheid. De gelijkenis bestaat voorts hierin, dat, gelijk een steen uit zijne natuur de kracht niet heeft om zich in vlees te veranderen, ook alzo een onherboren mens uit zijn eigen onherboren natuur de kracht niet heeft om zich tot God te bekeren; maar gelijk God uit stenen Abrahams kinderen kan verwekken, Mat 3:9 ; zo kan Hij ook steenachtige harten door zijn heiligmakenden Geest vermurwen."},{"catchword":"hun vlees","tekst":"Dat is, hun lichaam, waarin de ziel woont. Zie Job 12:10 ."},{"catchword":"wegnemen,","tekst":"Te weten mits uit de ziel de kwade hoedanigheden en krachten, waarmede zij door hun bedorven natuur mij wederstaan, uit te roeien en van hen door den Geest der wedergeboorte weg te doen, opdat zij mij niet meer wederstreven."},{"catchword":"vlesen hart geven;","tekst":"Hebreeuws, een hart des vleesches, dat is, een hart van vlees. Het hart van een herboren mens wordt hier bij vlees vergeleken, hetwelk niet hard is als een steen, maar buigzaam en gedwee is, en zich gewilliglijk van Gods Geest laat leiden. Zodanig is het hart van den mens, nadat God het stenen hart weggenomen en een nieuw hart gegeven heeft."}],"20":[{"catchword":"Opdat zij wandelen in Mijn inzettingen,","tekst":"Hij zegt niet: opdat zij kunnen, of mogen wandelen, enz. maar Hij spreekt van de dadelijke gehoorzaamheid, die de wedergeborenen tegen God bewijzen."},{"catchword":"bewaren,","tekst":"Dit woord ziet op de zekere volstandigheid dergenen, die tot God waarlijk bekeerd zijn."},{"catchword":"en zij zullen Mij tot een volk zijn,","tekst":"Zie Lev 26:12 ."},{"catchword":"tot een God zijn","tekst":"Zie Gen 17:7 , en Lev 18:2 ."}],"21":[{"catchword":"Maar welker hart","tekst":"Anders: maar aangaande die, wier hart het hart hunner verfoeiselen en hunne gruwelen nawandelt."},{"catchword":"het hart","tekst":"Dat is, hetwelk zij menen dat hunne afgoden begeren en wensen."},{"catchword":"verfoeiselen en hunner gruwelen","tekst":"Dat is, afgoden."},{"catchword":"nawandelt,","tekst":"Vergelijk 1Ki 11:5 ."},{"catchword":"op hun hoofd geven,","tekst":"Zie boven Eze 9:10 ."}],"22":[{"catchword":"cherubs","tekst":"Zie boven Eze 1:5 , op het woord dieren."},{"catchword":"hun vleugelen op,","tekst":"Te weten waarmede zij vlogen; zie boven Eze 1:6 ."},{"catchword":"raderen tegenover hen;","tekst":"Zie boven Eze 1:15 ."},{"catchword":"heerlijkheid des Gods van Israël","tekst":"Zie boven Eze 1:28 ; alzo in vs.23."}],"23":[{"catchword":"rees op van het midden der stad,","tekst":"Vergelijk boven Eze 10:4 ."},{"catchword":"stond op den berg,","tekst":"Dat is, bleef of ging staan, stelde zich op den berg. Versta den Olijfberg, van welken zie 2Sa 15:30 ; Zec 14:4 ; Mat 24:3 ."}],"24":[{"catchword":"door den Geest Gods","tekst":"Dat is, dat mij van den Geest Gods gewezen was. Vergelijk boven Eze 4:4 . De zin is, dat dit hem al geschied is in het gezicht zijns geestes en niet dadelijk in zijn lichaam, hetwelk nu vast in Chaldea bleEf."},{"catchword":"de gevankelijk weggevoerden;","tekst":"Hebreeuws, gevankelijke wegvoering. Alzo in vs.25. Zie boven Eze 1:1 ."},{"catchword":"van mij op","tekst":"Dat is, hield op, of verdween."}],"25":[{"catchword":"woorden des HEEREN,","tekst":"Of, zaken, dingen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then the spirit lift me up [meaning the spirit of God that sheweth him this vision see above chap 8 on vers 3 ]and brought me to the east-gates of the Lords house [ see above chap 10 on vers 19 ] which looketh east ward and behold at the door of the gate were five and twenty men [it is conceived that they were then very same that were mentioned above chap8.16 however this is the most certain that they were men of great account among the people and especially those whose names are hereafter expressed .They come here out of the house of the Lord from the idol service which they had performed to the sun and discourse together about fortifying the city as followeth ]and in the midst of them I saw Jaasania the son of Azzur [this is to be distinguished from another Jaasania the son of Saphan above chap8.11] and Pelatia the son of Benaja [this Pelatia is also to be distinguish ed from another of this name 1 Chron3.21 and 4.42 ] princes of the people [that is most honourable and excellent persons that being in place of government and authority were greatly respected by people and consequently ought to have been examples of piety unto them compare Exod 3.16 Levit 4.15 2Ki 23:1 and annotations. ]"}],"2":[{"catchword":null,"tekst":"And he said unto me [he to wit the spirit that carried him whence it appeareth that the word must not be understood of the wind others understand by this speaking person the Lord that shewed himself over the Cherubims above chap 10 .19 ] these are the men that devise iniquity and that counsel evil in this city [to wit not to deliver up the city into the hand of the Chaldeans against the counsel of the prophet Jeremia but to defend it against them .]"}],"3":[{"catchword":null,"tekst":"Which say a man ought not to build houses nearby [to wit near the city that is in the suburbs ] this city [that is Jerusalem ]should be the pot [to wit whereof Jeremia prophesized Jerem 1.13 see above chap 1 on vers 3 ]and we the flesh [that is the Chaldeans coming to besiege this city might conveniently dwell in the houses of the suburbs and as a fire cause the city being as a pot to seethe and consume us that should be in it as the flesh by famine compare below chap 24.47c they scoff at Jeremias prophecy Jerem 1.13 which they by their counsel go about to discredit and to prove it to be a false and lying prophecy others our destruction is not near let us build houses to wit the tarry and dwell here and so let this city be the pot and we the flesh for if we be the flesh in the pot we must stay in it so that Jeremia prophecieth himself when he telleth us that we shall be carried away .]"}],"4":[{"catchword":null,"tekst":"Therefore prophesie against them prophesie o child of man ."}],"5":[{"catchword":null,"tekst":"So then the spirit of the Lord fell upon me [see above chap 1 on vers 3 ]and he said unto me [see above on vers 2] say thus saith the Lord thus do ye say [to wit as is related immediately before vers 3 ]o house of Israel [that is Juda see 2 Chron 15 .17 and 21.2 with the annotate ]for I know every one of the things that ascendnto your spirit [Heb the ascensions of your spirit whatsoever ascendeth into the thought of your heart see of the like phrase Jerem 7.31.]"}],"6":[{"catchword":null,"tekst":"Ye [to wit princesses and rulers of the city of whom see above on vers 1]have multiplied your slain in this city [that is those whom you have opposed in the city by all manner of injustice compare above chap 7.23 and 9.9 ]and you have filled the street with the slain ."}],"7":[{"catchword":null,"tekst":"Therefore thus saith the Lord LORD your slain whom ye have laid down in the midst of it they are that flesh and this city is the pot and I will cause you to go forth out of the midst of it [to wit Jerusalem namely by means of the Chaldeans that should take them captive and punish them according to their deserts see the four following verses others be shall or they shall cause you to go forth meaning the enemy .That which the Jews spake in derision of Jeremiahs words the same doth Ezekiel retort against them as if he had said the city of Jerusalem is indeed the pot but the flesh that boils in it are those whom ye have cruelly oppressed in it for which cause and all your impieties Gods wrath shall devour you and such as you are yet more fearful and hitherto is hath done .]"}],"8":[{"catchword":null,"tekst":"Ye have feared the sword that is war see Levit 26] and I will bring the sword upon you saith the Lord LORD."}],"9":[{"catchword":null,"tekst":"And I will cause you to go forth out of the midst thereof and I will deliver you into the hand of strangers [namely of the Chaldeans ]and I will do judgment among you [see above on vers 8.]"}],"10":[{"catchword":null,"tekst":"They shall fall by the sword that is perish by war see Levit 26 on vers 7 ]I will judge you [that is punish you ompare Genes 15 on vers 14 so here in the next vers] in the borders of Israel [namely in Ribla see of this city 2 Kings 23 on vers33 and 25.6 it lay in the land of Hamath which was by north on the border of Palestina Numb 33 Jos 13.5 ]and ye shall know that I am the Lord ."}],"11":[{"catchword":null,"tekst":"This city shall not be your pot [to wit seeth in it that is to stay in it and to bear your greatest punishment touching this life ]and ye shall not [this word must here be added again from the former clause be the flesh in the midst thereof therefore I will judge you in the board of Israel [as above in the fore going 5 verse see the fulfilling hereof 2 Kings 25.21 Jerem 52.10.]"}],"12":[{"catchword":null,"tekst":"And ye shall know that I am the Lord because ye have not walked in my statutes neither done my judgments but have done according to the rules or manner of the heathen that are round about you meaning the idolatious law and customs of the heathen which God had forbidden his people in any wise to follow Levit 18.3 and 20.23 Deut 12.9,30 and 18 .14 above chap 5 on vers 7 the Jews are reproved because they lived not according to the judgments or laws of the heathen but see thereof the annotate there."}],"13":[{"catchword":null,"tekst":"Now it came to pass when I prophesied that Pelatia the son of died [it seemeth that this prophesying of Ezekiel and the dying of Pelatia happened in that vision and afterwards indeed so that Ezekiel actually declared unto the Israelites that were in Chaldea that which he had seen and done in the spirit and that the death of Pelatia then also happened actually for confirmation of his prophecy ]then fell I down upon my face [to wit through astonishment and to pray for the remnant of the people compare Numb 14 on vers5]and cried with aloud [Heb great ] vice and said ah Lord LORD wilt thou utterly make a full end of the remnant of Israel ?[the prophet in this complaint doth not properly look at Pelatia that was a wicked man but at a few that yet were left conceiving that if the Lord should so go on he would suddenly make an end whereas he had promised to reserve a remnant see of this phrase Jerem 4 on vers 27 .]"}],"14":[{"catchword":null,"tekst":"Then the word of the Lord came unto me saying ."}],"15":[{"catchword":null,"tekst":"Child of man they are [meaning those that with Jojachin by Jeremiahs counsel had removed as exile into Chaldea 2 Kings 24.12 & c ]thy brethren [that is thy kinsmen or neer of kin see Gen 24 on vers 27] thy brethren [this repetition is made or express the zeal of God and the weightiness of the matter ] the man of thy kindred ,[ Heb of redemption that is those by virtue of their kindred had right to redeem thy goods and consequently are thy nearest kinsmen see Levit 25.25] and all the house of Israel yea all that [to wit that was there in Chaldea for he most past belonging to the tribe of Juda ]unto whom the inhabitants of Jerusalem have said [to wit mocking them because they had left their own country and dwell like banished men in Chaldea whereas they on the other side still possessed and enjoyed the land which God had given unto their fathers for an inheritance as followeth ]get you far away from the Lord this same land is given unto us for an hereditary possession [as if they had said we only are Gods people that inhabit his land which he gave unto our fathers . We have nothing to do with you that are gone away from us and ye shall have no share with us in this land which ye shall forsaken .]"}],"16":[{"catchword":null,"tekst":"Therefore say thus saith the Lord LORD although I have removed them [to wit those whom he had in the former verse called the prophets brethren and the house of Israel so in the sequel ]far off among the heathen and although I have scattered them in the lands yet I will be to them a little while a sanctuary [or I am to them a little while a sanctuary to wit instead of the visible temple in Jerusalem which was a token of my presence I will be a little while with them without that outward token dwelling among them by my spirit and grace hearing their prayers and protecting them .Others a sanctuary of fewness that is a few compare Isa 8.14 .] in the land into which they are come [to wit the land of Chaldea and other countrys wherein are scattered .]"}],"17":[{"catchword":null,"tekst":"Therefore say thus saith the Lord yea I will gather you from the nations and I will assembly you out of the land wherein ye scattered [which was fulfilled when the Jews came back out of the Babylonian captivity into their own country and yet more fully when our saviour Christ gathered his church out of all nations by the ministry of the apostles ]and I will give you the land of Israel [to wit after the captivity of seventy years .]"}],"18":[{"catchword":null,"tekst":"And they shall come hither and take away all the detestations thereof and all the abominations thereof [that is the idols which man ought to detest and abominate ]from thence ."}],"19":[{"catchword":null,"tekst":"And I will give them one kind of a heart [that is such as is not double of false but is upright unfeigned cleaving only unto me and not divided between me and idols. See further Jerem 32.39with the annotate .By heart here is meant inclination motion .So is the word heart for the most part taken when it is place by the word spirit which then signifieth the mind understanding and thoughts of man Psal 51.12 below chap 18.31 and 36.26 ] and will give a new spirit in the innermost part of you [ that is another mind and other thoughts then were in you before .Meaning a change of the spirit not in substance and essence but in qualities and powers compare the fore-quoted places likewise Rom7.6 and 12.2 Cor4.13 Eph 4.23 Col 30.10.] and I will take away the stony heart [Heb the heart of stone that is a stony heart the heart of unregenerate man is here likened to a stone in regard of its natural hardness .The resemble consisteth also herein that a stone of its own nature hath not power to change or to turn itself into flesh so neither hath an unregenerate man by his own unregenerate nature power to turn unto God but as God is able even of stones to raise up children unto Abraham Matth 3.9 so can he also soften his heart by his saving and sanctifying spirit ] out of their flesh [ that is out of their body wherein the soul dwelleth see Job 12 on vers 10 and this I will do saith God by rooting out of the soul by rooting qualities power and faculties wherewith through their own corrupt nature they oppose me and by taking them away from them by the spirit of regeneration that they may no more rebel against me ]and will give them a fleshy heart [Heb an heart of flesh that is a fleshy heart the heart of a regenerate man is here resembled to flesh which is not hard like a stone but is flexible soft and suffereth itself willingly to be led by Gods spirit such is the heart of man after God hath taken away the stony heart and hath given a new heart .]"}],"20":[{"catchword":null,"tekst":"That they walk in my statutes [ he saith not that they may be able or may have power to walk &c but he speaketh of actually obedience which the regenerate yield unto God ] and keep my judgments [the word keep hath respect to the certain perseverance of those that are truly converted unto God ]and do them and they shall be a people unto me [see Levit 26 on vers 12 ] and I will be a God unto them [ See Gen 17 on vers 7 and Levit 18 on vers 2 compare Jerem 24.7 and 30.22 and 31.1 and 33.38 .]"}],"21":[{"catchword":null,"tekst":"But whose heart walketh after the heart of their detestations and their abominations [that is idols of walking after idols compare 1 Kings 11 on vers 5 after the heart that is which they conceive that their idols do wish and desire .Others but as for them whose heart walketh after the heart of their detestations and abominations ] I will render their way upon their head [see above chap9.10 compare Jerem 9.10 ]saith the Lord ."}],"22":[{"catchword":null,"tekst":"Then did the Cherubims see above chap 1.6 upon the word beasts ]lift up their wings [to wit wherewith they flew see above chap 1 on vers 6 ] and the wheels [see above chap 1 on vers 15]over against them and the glory of God of Israel [see above chap 1 on vers 28 so in the next vers ] was over them from above ."}],"23":[{"catchword":null,"tekst":"And the glory of the Lord went up from the midst of the city [see above chap 10 on vers 4 ] and stood upon the mountains [that is stayed or went and stood or set itself upon the mountain meaning the mountain of Olives whereof see 2 Sam 15.30 Zach 14.4 Matth 24.3 ]which is towards the east of the city ."}],"24":[{"catchword":null,"tekst":"Afterward the spirit took me up and brought me in vision by the spirit of God into Chaldea [that is in a vision that was shewed me by the spirit of God compare above chap 4 on vers 4 ] the meaning is that all this happened to him in the vision of his spirit not really in his body which still remained in Chaldea ] to them that were carried away captive [Heb captive carrying away so in the next vers see above chap 1 on vers 1 ] and the vision that I had seen went up from me [that is ceased or vanished away. ]"}],"25":[{"catchword":null,"tekst":"And spake unto them that they were all carried away captive all the words [or matters ]things of the Lord which he had caused me to see ."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;

      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
