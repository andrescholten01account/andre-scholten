 alle windrichtingen verstrooid worden; en u zult weten dat Ik, de HEERE, dit gesproken heb.", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Ps 80:2-20": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend. Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing. O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "2 Kon 6:25": "En er kwam grote honger in Samaria; want zie, zij belegerden de stad, totdat een ezelskop voor tachtig zilverstukken werd verkocht, en een vierde deel van een kab duivenmest voor vijf zilverstukken.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Num 14:43": "Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Ezech 48:21": "En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend meetrieten van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.", "Ezech 45:3": "Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Jer 21:13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Ezech 8:18": "Daarom zal Ik ook handelen in grimmigheid, Mijn oog zal niet ontzien, en Ik zal niet sparen; al roepen zij voor Mijn oren met luide stem, toch zal Ik hen niet horen.", "Klaagl 5:18": "Om de berg Sion, die verwoest is, waar de vossen op lopen.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Ezech 4:17": "Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen.", "Ezech 11:1-21": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk. En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad. Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Ezech 36:6": "Daarom profeteer van het land van Israël, en zeg tot de bergen en tot de heuvels, tot de stromen en tot de dalen: Zo zegt de Heere HEERE: Ziet, Ik heb in Mijn ijver en in Mijn grimmigheid gesproken, omdat u de smaad van de heidenen gedragen hebt;", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Luk 11:39-52": "En de Heere zei tegen hem: Nu, u Farizeeën, u reinigt de buitenkant van de drinkbeker en de schotel; maar uw binnenste is vol roofzucht en boosheid. Dwazen! Heeft Hij die de buitenkant gemaakt heeft, niet ook de binnenkant gemaakt? Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Hos 1:1-9": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "1 Kon 9:8": "En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Luk 18:11": "De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Jer 2:27": "Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "Lev 26:22": "Want Ik zal onder u zenden het gedierte van het veld, dat u van uw kinderen zal beroven, en uw vee zal uitroeien, en u zal verminderen; en uw wegen zullen woest worden.", "Jer 50:4-7": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken. Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten. Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Rom 2:17-29": "Zie, u wordt een Jood genoemd en rust op de wet, en roemt in God, En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet; En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Jer 7:9-11": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen? Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Hos 1:2-9": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon. En de Heere zei tegen hem: Noem zijn naam Jizreël, want nog een korte tijd, en Ik zal de bloedschuld van Jizreël bezoeken over het huis van Jehu, en Ik zal het koninkrijk van het huis van Israël doen ophouden.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Ps 107:39": "Daarna verminderen zij, en komen ten onder, door verdrukking, kwaad en droefenis.", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Jes 65:5": "Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Klaagl 5:5": "Wij worden vervolgd, met een juk op onze nek; zijn wij moe, men laat ons geen rust.", "Jer 19:1": "Zo zegt de HEERE: Ga heen en koop een pottenbakkerskruik, en neem tot u van de oudsten van het volk, en van de oudsten van de priesters.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Jer 27:3": "En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Hab 3:11": "De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Job 15:34": "Want de vergadering van de huichelaars wordt eenzaam, en het vuur verteert de tenten van de geschenken.", "Klaagl 2:5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "Ezech 21:9": "Mensenkind, profeteer en zeg: Zo zegt de HEERE: Zeg: Het zwaard, het zwaard is gescherpt, en ook gepolijst.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ezech 35:10-15": "Omdat u zegt: Die twee volken en die twee landen zullen van mij worden, en wij zullen ze in bezit nemen, ofschoon de HEERE daar was; Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE: Ik zal ook handelen naar uw toorn en naar uw jaloezie, die u uit uw haat tegen hen hebt uitgevoerd; en Ik zal Mij aan hen bekendmaken, wanneer Ik u geoordeeld zal hebben. En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "1 Petr 2:16": "Als vrijen, en niet de vrijheid gebruikend als een dekmantel voor de slechtheid, maar als dienstknechten van God.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Hos 4:10": "En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Ps 44:12": "U geeft ons over als schapen ten voedsel, en U verstrooit ons onder de heidenvolken.", "Hos 6:4-11": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat. Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht. Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Klaagl 1:4": "Daleth. De wegen van Sion treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelf is in bitterheid.", "Ezech 30:12": "En Ik zal de rivieren tot droogte maken, en het land verkopen in de hand van de bozen; en Ik zal het land met alles wat erin is verwoesten door de hand van vreemden: Ik, de HEERE, heb het gesproken.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "2 Kon 18:12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Joh 7:35": "De Joden zeiden dan tegen elkaar: Waar zal Deze heengaan, dat wij Hem niet zullen vinden? Zal Hij naar de verstrooide Grieken gaan, en de Grieken leren?", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "2 Kon 21:9-11": "Maar zij luisterden niet; want Manasse deed hen dwalen, zodat zij erger deden dan de heidenvolken, die de HEERE voor de kinderen van Israël weggevaagd had. Toen sprak de HEERE door de dienst van Zijn dienaren, de profeten, en zei: Omdat Manasse, de koning van Juda, deze gruwelen gedaan heeft, erger doend dan alles wat de Amorieten gedaan hebben die vóór hem geweest zijn, ja, ook Juda door zijn drekgoden heeft doen zondigen;", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "Amos 9:3": "En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Jer 52:16": "Maar van de armsten van het land liet Nebuzaradan, de leider van de lijfwacht, enigen over tot wijngaardeniers en tot akkerlieden.", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Ps 79:4": "Wij zijn onze buren tot smaad geworden; een spot en schimp voor hen die rondom ons zijn.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Amos 5:17": "Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE.", "Deut 8:15": "Die u geleid heeft in die grote en angstaanjagende woestijn, waar vurige slangen, en schorpioenen, en droogte waren, waar geen water was; Die u water uit de keiharde rots liet komen;", "Hos 7:14": "Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun bedden; om koren en most verzamelen zij zich, maar zij weerstreven Mij.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Jer 5:3": "HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "Lev 26:32": "Ja, Ik zal dat land verwoesten; zodat uw vijanden, die daarin zullen wonen, zich daarover ontzetten zullen.", "Ezech 14:17": "Of als Ik het zwaard breng over datzelfde land, en zeg: Zwaard! ga door dat land, zodat Ik daaruit mensen en beesten uitroei;", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">En</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3947\">u</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">mensenkind</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H3947\">neem</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3947\">een</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2299\">scherp</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2719\">mes</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H2719\">een</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8593\">scheermes</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8593\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1532\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1532\">barbiers</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3947\">zult</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2299\">u</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3947\">nemen</span>, en dat <span class=\"wl\" data-l=\"L10\" data-code=\"H3976\">zult</span> u over <span class=\"wl\" data-l=\"L8\" data-code=\"H7218\">uw</span> <span e=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee a <span class=\"wl wl-kjv\" data-code=\"H2299\">sharp</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">knife,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee a <span class=\"wl wl-kjv\" data-code=\"H1532\">barber's</span> <span class=\"wl wl-kjv\" data-code=\"H8593\">razor,</span> and cause it to <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> and upon thy <span class=\"wl wl-kjv\" data-code=\"H2206\">beard:</span> then <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee <span class=\"wl wl-kjv\" data-code=\"H3976\">balances</span> to <span class=\"wl wl-kjv\" data-code=\"H4948\">weigh,</span> and divide", "2": "Thou shalt <span class=\"wl wl-kjv\" data-code=\"H1197\">burn</span> with <span class=\"wl wl-kjv\" data-code=\"H217\">fire</span> a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> it with a <span class=\"wl wl-kjv\" data-code=\"H2719\">knife:</span> and a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> in the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind;</span> and I will draw <span class=\"wl wl-kjv\" data-code=\"H7324\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> after", "3": "Thou shalt also <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thereof a <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> in <span class=\"wl wl-kjv\" data-code=\"H4557\">number,</span> and <span class=\"wl wl-kjv\" data-code=\"H6696\">bind</span> them in thy skirts.", "4": "Then take of them <span class=\"wl wl-kjv\" data-code=\"H3947\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> them in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> for thereof shall a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.", "5": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> This is <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> I have <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> and <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> that are round about", "6": "And she hath <span class=\"wl wl-kjv\" data-code=\"H4784\">changed</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> into <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness</span> more than the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> more than the <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> her: for they have <span class=\"wl wl-kjv\" data-code=\"H3988\">refused</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> they have not walked", "7": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because ye <span class=\"wl wl-kjv\" data-code=\"H1995\">multiplied</span> more than the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> you, and have not <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> neither have <span class=\"wl wl-kjv\" data-code=\"H6213\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> neither have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round about", "8": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I, even I, am against thee, and will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the nations.", "9": "And I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in thee that which I have not <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> and whereunto I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> any more the like, <span class=\"wl wl-kjv\" data-code=\"H3282\">because</span> of all thine abominations.", "10": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee, and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> in thee, and the whole <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of thee will I <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> into all the winds.", "11": "Wherefore, as I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Surely, because thou hast <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> with all thy detestable <span class=\"wl wl-kjv\" data-code=\"H8251\">things,</span> and with all thine <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations,</span> therefore will I also <span class=\"wl wl-kjv\" data-code=\"H1639\">diminish</span> thee; neither shall mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> <span class=\"wl wl-kjv\" data-code=\"H2347\">spare,</span> neither will I have any pity.", "12": "A third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> of thee shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> with the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> shall they be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee: and a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee; and I will <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> into all the <span class=\"wl wl-kjv\" data-code=\"H7307\">winds,</span> and I will draw <span class=\"wl wl-kjv\" data-code=\"H7324\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> after", "13": "Thus shall mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> be <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished,</span> and I will cause my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> upon them, and I will be <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it in my <span class=\"wl wl-kjv\" data-code=\"H7068\">zeal,</span> when I have <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished</span> my fury", "14": "Moreover I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H2723\">waste,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee, in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all that pass by.", "15": "So it shall be a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> and a <span class=\"wl wl-kjv\" data-code=\"H1422\">taunt,</span> an <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction</span> and an <span class=\"wl wl-kjv\" data-code=\"H4923\">astonishment</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee, when I shall <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> in thee in <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> and in <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> and in <span class=\"wl wl-kjv\" data-code=\"H2534\">furious</span> <span class=\"wl wl-kjv\" data-code=\"H8433\">rebukes.</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have spoken", "16": "When I shall <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> upon them the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> of <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> which shall be for their <span class=\"wl wl-kjv\" data-code=\"H4889\">destruction,</span> and which I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> you: and I will <span class=\"wl wl-kjv\" data-code=\"H3254\">increase</span> the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> upon you, and will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> your <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> of bread:", "17": "So will I <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> upon you <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7921\">bereave</span> thee; and <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> thee; and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon thee. I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have spoken"}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
