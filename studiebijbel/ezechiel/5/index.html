men, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die *haren* verdelen.","2":"Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken.","3":"U zult ook een klein aantal daarvan nemen, en in uw slippen binden.","4":"En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.","5":"Zo zegt de Heere HEERE: Dit is Jeruzalem, die Ik in het midden van de heidenvolken gezet heb, met landen rondom haar heen.","6":"Toch heeft zij Mijn rechten veranderd in goddeloosheid, erger dan de heidenvolken, en Mijn inzettingen erger dan de landen die rondom haar zijn; want zij hebben Mijn rechten verworpen, en in Mijn inzettingen hebben zij niet gewandeld.","7":"Daarom zegt de Heere HEERE zo: Omdat u meer gedaan hebt dan de heidenvolken die rondom u zijn, in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, ja zelfs naar de rechten van de heidenvolken die rondom u zijn niet gedaan hebt;","8":"Daarom zegt de Heere HEERE zo: Zie, Ik *wil* tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken.","9":"En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen.","10":"Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.","11":"Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!","12":"Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.","13":"Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.","14":"Daarbij zal Ik u tot woestheid en tot smaad zetten onder de heidenvolken die rondom u zijn, voor de ogen van ieder die voorbijgaat.","15":"Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb *het* gesproken!","16":"Wanneer Ik de boze pijlen van de honger tegen hen uitzenden zal, die tot verderf zullen zijn, die Ik uitzenden zal om u te verderven; zo zal Ik de honger over u vermeerderen, en u de staf van het brood breken.","17":"Ja, honger en boos gedierte, die u van kinderen zullen beroven, zal Ik over u zenden; ook zal pest en bloed onder u omgaan; en het zwaard zal Ik over u brengen; Ik, de HEERE, heb *het* gesproken!"},"SV":{"1":"En gij, mensenkind, neem u een scherp mes, een scheermes der barbieren zult gij u nemen, hetwelk gij zult laten gaan over uw hoofd en over uw baard; daarna zult gij u een weegschaal nemen, en die *haren* delen.","2":"Een derde deel zult gij in het midden der stad met vuur verbranden, nadat de dagen der belegering vervuld worden; dan zult gij een derde deel nemen, slaande met een zwaard rondom hetzelve, en een derde deel zult gij in den wind strooien; want Ik zal het zwaard achter hen uittrekken.","3":"Gij zult ook weinige in getal daarvan nemen, en in uw slippen binden.","4":"En nog zult gij van die nemen, en die werpen in het midden des vuurs, en zult ze verbranden met vuur; daaruit zal voortkomen een vuur tegen het gehele huis van Israël.","5":"Alzo zegt de Heere HEERE: Dit is Jeruzalem, welke Ik in het midden der heidenen gezet heb, en landen rondom haar henen.","6":"Doch zij heeft Mijn rechten veranderd in goddeloosheid meer dan de heidenen, en Mijn inzettingen meer dan de landen, die rondom haar zijn; want zij hebben Mijn rechten verworpen, en in Mijn inzettingen hebben zij niet gewandeld.","7":"Daarom zegt de Heere HEERE alzo: Dewijl gijlieden dies meer gemaakt hebt dan de heidenen, die rondom u zijn, in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, zelfs naar de rechten der heidenen, die rondom u zijn, niet gedaan hebt;","8":"Daarom zegt de Heere HEERE alzo: Ziet, Ik *wil* aan u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenen.","9":"En Ik zal onder u doen, hetgeen Ik niet gedaan heb, en desgelijks Ik voortaan niet doen zal, om al uwer gruwelen wil.","10":"Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaderen eten; en Ik zal gerichten onder u oefenen, en zal al uw overblijfsel in alle winden verstrooien.","11":"Daarom *zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE (omdat gij Mijn heiligdom verontreinigd hebt met al uw verfoeiselen, en met al uw gruwelen), zo Ik ook niet daarom *u* verminderen, en Mijn oog *u* niet verschonen zal, en Ik ook niet zal sparen!","12":"Een derde deel van u zal van de pestilentie sterven, en zal door honger in het midden van u te niet worden; en een derde deel zal in het zwaard vallen rondom u; en een derde deel zal Ik in alle winden verstrooien, en Ik zal het zwaard achter hen uittrekken.","13":"Alzo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen doen rusten, en Mij troosten; en zij zullen weten, dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.","14":"Daartoe zal Ik u ter woestheid en ter smaadheid zetten onder de heidenen, die rondom u zijn, voor de ogen van al degene, die voorbijgaat.","15":"Zo zal de smaadheid en hoon een onderwijs en ontzetting den heidenen zijn, die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb *het* gesproken!","16":"Wanneer Ik de boze pijlen des hongers tegen hen uitzenden zal, die ten verderve zijn zullen, die Ik uitzenden zal om u te verderven; zo zal Ik den honger over u vermeerderen, en u den staf des broods breken.","17":"Ja, honger en boos gedierte, die u van kinderen beroven zullen, zal Ik over u zenden; ook zal pestilentie en bloed onder u omgaan; en het zwaard zal Ik over u brengen; Ik, de HEERE, heb *het* gesproken!"},"KJV":{"1":"And thou, son of man, take thee a sharp knife, take thee a barber's razor, and cause *it* to pass upon thine head and upon thy beard: then take thee balances to weigh, and divide","2":"Thou shalt burn with fire a third part in the midst of the city, when the days of the siege are fulfilled: and thou shalt take a third part, *and* smite about it with a knife: and a third part thou shalt scatter in the wind; and I will draw out a sword after","3":"Thou shalt also take thereof a few in number, and bind them in thy skirts.","4":"Then take of them again, and cast them into the midst of the fire, and burn them in the fire; *for* thereof shall a fire come forth into all the house of Israel.","5":"Thus saith the Lord GOD; This *is* Jerusalem: I have set it in the midst of the nations and countries *that are* round about","6":"And she hath changed my judgments into wickedness more than the nations, and my statutes more than the countries that *are* round about her: for they have refused my judgments and my statutes, they have not walked","7":"Therefore thus saith the Lord GOD; Because ye multiplied more than the nations that *are* round about you, *and* have not walked in my statutes, neither have kept my judgments, neither have done according to the judgments of the nations that *are* round about","8":"Therefore thus saith the Lord GOD; Behold, I, even I, *am* against thee, and will execute judgments in the midst of thee in the sight of the nations.","9":"And I will do in thee that which I have not done, and whereunto I will not do any more the like, because of all thine abominations.","10":"Therefore the fathers shall eat the sons in the midst of thee, and the sons shall eat their fathers; and I will execute judgments in thee, and the whole remnant of thee will I scatter into all the winds.","11":"Wherefore, *as* I live, saith the Lord GOD; Surely, because thou hast defiled my sanctuary with all thy detestable things, and with all thine abominations, therefore will I also diminish *thee*; neither shall mine eye spare, neither will I have any pity.","12":"A third part of thee shall die with the pestilence, and with famine shall they be consumed in the midst of thee: and a third part shall fall by the sword round about thee; and I will scatter a third part into all the winds, and I will draw out a sword after","13":"Thus shall mine anger be accomplished, and I will cause my fury to rest upon them, and I will be comforted: and they shall know that I the LORD have spoken *it* in my zeal, when I have accomplished my fury","14":"Moreover I will make thee waste, and a reproach among the nations that *are* round about thee, in the sight of all that pass by.","15":"So it shall be a reproach and a taunt, an instruction and an astonishment unto the nations that *are* round about thee, when I shall execute judgments in thee in anger and in fury and in furious rebukes. I the LORD have spoken","16":"When I shall send upon them the evil arrows of famine, which shall be for *their* destruction, *and* which I will send to destroy you: and I will increase the famine upon you, and will break your staff of bread:","17":"So will I send upon you famine and evil beasts, and they shall bereave thee; and pestilence and blood shall pass through thee; and I will bring the sword upon thee. I the LORD have spoken"}},"tsk":{"1":[{"kopje":"nemen","refs":["Ezech 44:20","Lev 21:5","Jes 7:20"]},{"kopje":"daarna","refs":["Dan 5:27"]}],"2":[{"kopje":"verbranden","refs":["Ezech 5:12","Jer 9:21","Jer 9:22","Jer 15:2","Jer 24:10","Jer 38:2"]},{"kopje":"de stad","refs":["Ezech 4:1-8"]},{"kopje":"zal Ik uittrekken","refs":["Ezech 5:12","Ezech 12:14","Lev 26:33","Jer 9:16","Amos 9:2","Amos 9:3"]}],"3":[{"kopje":"een klein aantal","refs":["2 Kon 25:12","Jer 39:10","Jer 40:6","Jer 52:16","Matt 7:14","Luk 13:23","Luk 13:24","1 Petr 4:18"]}],"4":[{"kopje":"nemen","refs":["2 Kon 25:25","Jer 41:1","Jer 44:30","Jer 52:30"]},{"kopje":"zal een vuur","refs":["Jer 4:4","Jer 48:45"]}],"5":[{"kopje":"Dit","refs":["Ezech 4:1","Jer 6:6","Luk 22:19","Luk 22:20","1 Kor 10:4"]},{"kopje":"Ik gezet heb","refs":["Ezech 16:14","Deut 4:6","Micha 5:6","Matt 5:14"]}],"6":[{"kopje":"heeft zij","refs":["Ezech 16:47","Deut 32:15-21","2 Kon 17:8-20","Ps 106:20","Rom 1:23-25","1 Kor 5:1","Judas 1:4"]},{"kopje":"want zij","refs":["Neh 9:16","Neh 9:17","Ps 78:10","Jer 5:3","Jer 8:5","Jer 9:6","Jer 11:10","Zach 7:11"]}],"7":[{"kopje":"niet gedaan hebt","refs":["Ezech 5:11","Ezech 16:47","Ezech 16:48","Ezech 16:54","2 Kon 21:9-11","2 Kron 33:9","Jer 2:10","Jer 2:11"]}],"8":[{"kopje":"ja Ik","refs":["Ezech 15:7","Ezech 21:3","Ezech 26:3","Ezech 28:22","Ezech 35:3","Ezech 39:1","Lev 26:17-46","Deut 29:20","Jer 21:5","Jer 21:13","Klaagl 2:5","Klaagl 3:3","Zach 14:2","Zach 14:3","Matt 22:7"]},{"kopje":"in het","refs":["Ezech 25:2-6","Ezech 26:2","Ezech 29:6","Ezech 29:7","Ezech 35:10-15","Deut 29:23-28","1 Kon 9:8","1 Kon 9:9","Jer 22:8","Jer 22:9","Jer 24:9","Jer 50:7","Klaagl 2:15-17"]}],"9":[{"kopje":"wat","refs":["Klaagl 4:6","Klaagl 4:9","Dan 9:12","Amos 3:2","Matt 24:21"]}],"10":[{"kopje":"de vaders","refs":["Lev 26:29","Deut 28:53-57","Deut 28:64","2 Kon 6:29","Jes 9:19","Jes 49:26","Jer 19:9","Klaagl 2:20","Klaagl 4:10"]},{"kopje":"al knife,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee a <span class=\"wl wl-kjv\" data-code=\"H1532\">barber's</span> <span class=\"wl wl-kjv\" data-code=\"H8593\">razor,</span> and cause it to <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> and upon thy <span class=\"wl wl-kjv\" data-code=\"H2206\">beard:</span> then <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee <span class=\"wl wl-kjv\" data-code=\"H3976\">balances</span> to <span class=\"wl wl-kjv\" data-code=\"H4948\">weigh,</span> and divide","2":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H1197\">burn</span> with <span class=\"wl wl-kjv\" data-code=\"H217\">fire</span> a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> it with a <span class=\"wl wl-kjv\" data-code=\"H2719\">knife:</span> and a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> in the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind;</span> and I will draw <span class=\"wl wl-kjv\" data-code=\"H7324\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> after","3":"Thou shalt also <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thereof a <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> in <span class=\"wl wl-kjv\" data-code=\"H4557\">number,</span> and <span class=\"wl wl-kjv\" data-code=\"H6696\">bind</span> them in thy skirts.","4":"Then take of them <span class=\"wl wl-kjv\" data-code=\"H3947\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> them in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> for thereof shall a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","5":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> This is <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> I have <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> and <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> that are round about","6":"And she hath <span class=\"wl wl-kjv\" data-code=\"H4784\">changed</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> into <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness</span> more than the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> more than the <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> her: for they have <span class=\"wl wl-kjv\" data-code=\"H3988\">refused</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> they have not walked","7":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because ye <span class=\"wl wl-kjv\" data-code=\"H1995\">multiplied</span> more than the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> you, and have not <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> neither have <span class=\"wl wl-kjv\" data-code=\"H6213\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> neither have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round about","8":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I, even I, am against thee, and will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the nations.","9":"And I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in thee that which I have not <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> and whereunto I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> any more the like, <span class=\"wl wl-kjv\" data-code=\"H3282\">because</span> of all thine abominations.","10":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee, and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> in thee, and the whole <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of thee will I <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> into all the winds.","11":"Wherefore, as I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Surely, because thou hast <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> with all thy detestable <span class=\"wl wl-kjv\" data-code=\"H8251\">things,</span> and with all thine <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations,</span> therefore will I also <span class=\"wl wl-kjv\" data-code=\"H1639\">diminish</span> thee; neither shall mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> <span class=\"wl wl-kjv\" data-code=\"H2347\">spare,</span> neither will I have any pity.","12":"A third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> of thee shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> with the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> shall they be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee: and a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee; and I will <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> into all the <span class=\"wl wl-kjv\" data-code=\"H7307\">winds,</span> and I will draw <span class=\"wl wl-kjv\" data-code=\"H7324\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> after","13":"Thus shall mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> be <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished,</span> and I will cause my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> upon them, and I will be <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it in my <span class=\"wl wl-kjv\" data-code=\"H7068\">zeal,</span> when I have <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished</span> my fury","14":"Moreover I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H2723\">waste,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee, in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all that pass by.","15":"So it shall be a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> and a <span class=\"wl wl-kjv\" data-code=\"H1422\">taunt,</span> an <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction</span> and an <span class=\"wl wl-kjv\" data-code=\"H4923\">astonishment</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> thee, when I shall <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> in thee in <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> and in <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> and in <span class=\"wl wl-kjv\" data-code=\"H2534\">furious</span> <span class=\"wl wl-kjv\" data-code=\"H8433\">rebukes.</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have spoken","16":"When I shall <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> upon them the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> of <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> which shall be for their <span class=\"wl wl-kjv\" data-code=\"H4889\">destruction,</span> and which I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> you: and I will <span class=\"wl wl-kjv\" data-code=\"H3254\">increase</span> the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> upon you, and will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> your <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> of bread:","17":"So will I <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> upon you <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7921\">bereave</span> thee; and <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> thee; and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon thee. I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have spoken"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"mes,","tekst":"Het Hebreeuwse woord is voor een mes genomen Jos 5:2 ."},{"catchword":"een scheermes","tekst":"Dit betekent hier de vijanden der Joden, die God rechtvaardiglijk gebruikte, om door middel derzelven zijn volk te straffen. Vergelijk Isa 7:20 ."},{"catchword":"der barbieren zult gij u nemen,","tekst":"Dat is, hetwelk de barbiers gebruiken als zij iemand scheren."},{"catchword":"hetwelk gij zult laten gaan over uw hoofd en over uw baard;","tekst":"Dat is, gij zult daarmede het haar van uw hoofd en uw baard laten afscheren; zie dezelfde manier van spreken Num 6:5 , en Num 8:7 , en vergelijk Jdg 13:5 . Versta nu door het haar van den baard de burgers en inwoners van Jeruzalem, die in zeer groot getal waren, en door de afschering daarvan de uitroeiing van die burgers."},{"catchword":"weegschaal nemen","tekst":"Als een teken van Gods rechtvaardigheid."},{"catchword":"delen","tekst":"Vergelijk vs.1 met vs.12."}],"2":[{"catchword":"Een derde deel","tekst":"Te weten in drie gelijke delen, betekenende dat de Joden door verscheidene soorten van straffen zouden uitgeroeid worden en omkomen. Zo wie de ene ontkwam, die zou in de andere vervallen. Vergelijk Isa 24:18 ; Jer 15:2 ."},{"catchword":"der stad","tekst":"Te weten van de stad Jeruzalem, alzo hij die op een tichelsteen afgemaald had, boven Eze 4:1 ; daarop nu zou hij dit droevig schouwspel met de verklaring daarvan, het volk dat in Chaldea woonde, waar de profeet was, vertonen."},{"catchword":"vuur verbranden,","tekst":"Hetwelk betekende al de straffen, waardoor een derde deel des volks, gedurende de belegering, in de stad zou omkomen, als door honger, kommer, pest, geschut en dergelijke plagen en ellenden genomen, Job 15:34 ; alzo onder vs.4."},{"catchword":"nadat de dagen der belegering vervuld worden;","tekst":"Dat is, gij zult dat derde deel niet alles tegelijk verbranden, maar nu en dan tot het einde der belegering. Anders: als de dagen der belegering zullen vervuld zijn."},{"catchword":"slaande met een zwaard","tekst":"Hiermede wordt betekend dat een ander deel der Joden buiten de stad door den vijand verdaan zou worden, te weten als zij tegen hem zouden uitvallen, of ook de vlucht nemende, in zijne handen geraken; 2Ki 25:4 ."},{"catchword":"hetzelve,","tekst":"Te weten derde deel van het haar."},{"catchword":"in den wind strooien;","tekst":"Versta door deze het overige derde deel der Joden, dat ten dele in de omliggende landen verstrooid is, ten dele gevankelijk gevoerd naar Ribla en Babel, 2Ki 25:11 , 2Ki 25:20-21 ."},{"catchword":"zwaard","tekst":"Te weten der vijanden, hetwelk de gevluchte en gevangen Joden hier en daar achtervolgen, plagen en verslinden zou. Hebreeuws, achter hen ledig maken. Alzo Exo 15:9 ; Lev 26:33 , onder vs.12, en Eze 12:14 ."}],"3":[{"catchword":"daarvan nemen,","tekst":"Te weten van het laatste derde deel."},{"catchword":"uw slippen binden","tekst":"Tot een teken dat een zeer klein getal der geringste en eenvoudigste Joden in het land overblijven zou, die Nebuzaradan daar laten zou tot wijngaardeniers en akkerlieden; 2Ki 25:12 ; Jer 52:16 ."}],"4":[{"catchword":"van die nemen,","tekst":"Te weten van die weinige overgeblevenen."},{"catchword":"werpen in het midden des vuurs,","tekst":"Hetwelk betekende dat van de overgeblevenen onder de regering van Gedalia nog velen ellendiglijk omkomen zouden en verstrooid worden; 2Ki 25:25-26 ; Jer 41:3 ."},{"catchword":"vuur tegen","tekst":"Versta, het vuur der ellenden en plagen. Zie boven vs.2, alzo in het voorgaande van vs.4."},{"catchword":"het gehele huis van Israël","tekst":"Te weten dat het gehele overblijfsel van Juda en Israël daaronder vermengd, waar ze ook zijn, ten uiterste toe plagen en verderven zal. Zie Jer 42:16 , en Jer 44:27-28 ."}],"5":[{"catchword":"Dit is Jeruzalem,","tekst":"Te weten de stad, die de profeet op den tichelsteen afgebeeld had, boven Eze 4:1 . En het was de stad, die in Judea was, zelve niet, maar het teken daarvan en de afbeelding. Zie van deze manier van spreken, waardoor het teken den naam draagt van het betekende, Gen 17:10 ."},{"catchword":"welke Ik in het midden der heidenen","tekst":"Dat is, Ik heb haar meer weldaden bewezen dan aan enige andere steden onder de heidenen, opdat zij deze tot een voorbeeld van deugd en eerbaarheid wezen zou. Vergelijk Deu 4:6-8 ; Psa 48:2-3 , enz., en Psa 87:1-3 , enz."},{"catchword":"landen","tekst":"Dat is, heidense landen en volken, die zij moest voorlichten in het goede. Of, en der landen, die rondom haar zijn."}],"6":[{"catchword":"meer dan de heidenen,","tekst":"Zie 2Ki 21:9 . Vergelijk 2Ch 33:9 ; Jer 2:10 ; zie ook op het einde van vs.7."},{"catchword":"niet gewandeld","tekst":"Wat het zij in de wet of inzettingen des Heeren te wandelen, zie 2Ch 6:16 ."}],"7":[{"catchword":"dies meer gemaakt hebt","tekst":"Te weten met zondigen en overtreden. Hebreeuws, om uw vermenigvuldigen; dat is, omdat gij vermenigvuldigt, te weten in zonden, of vermenigvuldigd wordt in zonden. Anderen verstaan deze vermenigvuldiging van hun grote menigte en geweldigen rijkdom, waarin zij de omliggende heidenen overtroffen, en evenwel tegen God ondankbaar waren. Vergelijk Deu 32:15 ."},{"catchword":"rechten der heidenen,","tekst":"Die niet toelieten dat men zijn goden en godsdienst lichtvaardig veranderen zou, Jer 2:10-11 . Men kan dit ook van de natuurlijke en burgerlijke wetten verstaan [die van God in de harten van alle mensen zijn ingeschreven, Rom 1:32 , en Rom 2:15 ] , die vele heidenen beter dan de Joden onderhouden hebben. Onder deze is ook, dat men zijn woord en belofte, die men houden mag, moet houden, hetwelk de Joden niet gedaan hebben; 2Ki 24:1 , 2Ki 24:20 ."}],"8":[{"catchword":"Ik wil","tekst":"Te weten om u te verderven. Anders: Ik [kom] tegen u; gelijk Rev 2:5 , Rev 2:16 , en Rev 3:3 ."},{"catchword":"u,","tekst":"Namelijk, o gij stad Jeruzalem."},{"catchword":"ja Ik,","tekst":"Dit verhaal dient tot verzekering en verzwaring van de straf, die voorzegd wordt."},{"catchword":"gerichten","tekst":"Dat is, straffen onder u uitvoeren; alzo Psa 119:84 , onder Eze 11:9 , en Eze 25:11 . Vergelijk 2Ch 20:12 , en de aantekening."},{"catchword":"die heidenen","tekst":"Te weten, die gij in boosheid teboven gaat, wien gij met uw doen ergernis gegeven hebt en die, uwe vijanden zijnde, zich verheugen zullen in uw verderf."}],"9":[{"catchword":"doen,","tekst":"Dat is, zulke straffen zenden, die Ik hier tevoren niet gezonden heb."},{"catchword":"uwer gruwelen wil","tekst":"Te weten van afgoderij en andere boosheden tegen de eerste en tweede tafel, alsook tegen de ceremoniele en burgerlijke wetten."}],"10":[{"catchword":"kinderen eten in het midden van u,","tekst":"Te weten uit oorzaak van hun groten honger en gebrek van leeftocht. Zie het dreigement Gods hiervan Lev 26:29 ; Deu 28:53 , en de vervulling Lam 2:20 , en Lam 4:10 ."},{"catchword":"uw overblijfsel","tekst":"Zie boven vs.2."},{"catchword":"alle winden verstrooien","tekst":"Dat is, in alle delen der wereld. Alzo Jer 49:32 , Jer 49:36 ; onder Eze 12:14 , en Eze 17:21 , en Eze 37:9 ; Zec 2:6 ."}],"11":[{"catchword":"leef,","tekst":"Vergelijk Num 14:28 ; Rth 3:13 ; 1Sa 14:39 , 1Sa 14:45 , en 1Sa 19:6 ; 2Sa 22:47 ; Jer 46:18 ."},{"catchword":"heiligdom","tekst":"Dat is, den tempel, waarin de godsdienst geschiedde."},{"catchword":"verfoeiselen,","tekst":"Te weten de grofste afgoderij in den godsdienst, en boosheden in het leven."},{"catchword":"oog","tekst":"Overmits de ogen getuigen zijn van het hart, zo wordt hun toegeschreven hetgeen het hart toekomt. Alzo wordt het oog hier gezegd niet te verschonen, dat is, geen medelijden te hebben en niet genadig te zijn. Zie ook Deu 7:16 , en Deu 13:8 ; 1Sa 24:11 , onder Eze 7:4 , en Eze 16:5 ."},{"catchword":"u","tekst":"Dit woord is hier ingevoegd uit het volgende Eze 7:4 ."},{"catchword":"sparen","tekst":"Zie Num 14:23 ; Deu 1:35 ."}],"12":[{"catchword":"Een derde deel","tekst":"Zie bredere verklaring vandit vs. boven vs.2."},{"catchword":"in het midden van u te niet worden;","tekst":"Dat is, in uw belegerde stad Jeruzalem."},{"catchword":"in het zwaard vallen","tekst":"Te weten der Chaldeën, die buiten de stad zullen zijn en haar belegeren. Zie van deze manier van spreken, Lev 26:7 ."},{"catchword":"alle winden verstrooien,","tekst":"Vergelijk boven vs.10, en de aantekening."},{"catchword":"het zwaard achter hen","tekst":"Zie boven vs.2."},{"catchword":"uittrekken","tekst":"Hebreeuws, ledig maken, gelijk boven vs.2."}],"13":[{"catchword":"zal Mijn toorn volbracht worden,","tekst":"Dat is, mijne dreigementen, die Ik in mijn rechtvaardige gramschap door mijne profeten uitgesproken had, zullen alzo vervuld worden. Vergelijk de manier van spreken met Isa 10:25 ; Lam 4:11 , onder Eze 7:8 , alzo in het einde van vs.13."},{"catchword":"op hen doen rusten,","tekst":"Dat is, mijn moed aan hen koelen en mijne toornigheid zo aan hen verzadigen en genoeg doen, dat Ik gerust zal zijn, ziende hen zo deerlijk door mijne straf gesteld, dat Ik niet zal behoeven deze te vernieuwen, Nah 1:9 . Dit is menselijkerwijze van God gesproken, alzo onder Eze 16:42 , en Eze 21:17 , en Eze 24:13 ."},{"catchword":"troosten;","tekst":"Dat is, mij wreken en in de verklaring mijner gerechtigheid mijn moed koelen en mij vermaken. Het is menselijkerwijze van God gesproken. Alzo Isa 1:24 ."},{"catchword":"weten,","tekst":"Dat is, metterdaad bevinden, en met hunne schande en schade gewaar worden. Zie Job 5:24 , idem onder Eze 6:7 , Eze 6:10 , enz."},{"catchword":"ijver gesproken heb,","tekst":"Versta, heftige en jaloerse toornigheid, als van een man, die verongelijkt is van zijne vrouw. Alzo Psa 79:5 ; Pro 6:34 ; Isa 59:17 , onder Eze 16:42 , en Eze 38:19 ."}],"14":[{"catchword":"Ik u ter woestheid","tekst":"Zie Gods dreigement hiervan Lev 26:31 , en de vervulling, Lam 2:2 , enz."},{"catchword":"smaadheid zetten","tekst":"Te weten waardoor gij veracht, gelasterd en verfoeid zult wezen van de omliggende volken, als zij zeggen zullen dat gij waardig zijt geweest zo behandeld te worden, om den wil uwer grote zonden en gruwelen."}],"15":[{"catchword":"onderwijs en ontzetting","tekst":"Te weten waardoor de heidenen zal kunnen geleerd worden welk een groot kwaad de zonde is, en hoe vreeslijk het is vanwege haar in Gods handen te vallen."},{"catchword":"gerichten in toorn,","tekst":"Dat is, rechtvaardige straffen uitvoeren; alzo onder Eze 25:11 ."},{"catchword":"in grimmige straffen oefenen zal;","tekst":"Hebreeuws, in bestraffingen der grimmigheid."}],"16":[{"catchword":"boze pijlen des hongers","tekst":"Versta, alle plagen en geselen, waardoor dure tijd en honger veroorzaakt wordt. Zij worden boos genaamd, omdat zij dodelijk zouden wonden en het verderf medebrengen, gelijk de volgende woorden verklaren. Zie Deu 32:23 ."},{"catchword":"u den staf des broods breken","tekst":"Zie Lev 26:26 , en boven Eze 4:16 ."}],"17":[{"catchword":"boos gedierte,","tekst":"Zie Lev 26:22 ."},{"catchword":"bloed onder u omgaan;","tekst":"Dat is, doodslagen en moorderijen. Zie Gen 37:26 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And thou child of man take thee a sharp knife Jos 5.2 thou shalt take thee barbers of razor :[ that is which barbers use when they shave a man this signifieth here the enemies of the Jews which God just made use of to punish his people by .compare Isa 7.20 ] which thou shalt cause to pass upon thine head and upon thine beard :[that is thou shalt cause the hair of thine head and thy beard to be shaved off therewith see the same phrase Numb 6.5 and 8.7 and compare Judg 13.5understand hereby the hair of the head and beard the citizens and inhabitants of Jerusalem which were very many in number and by the shaving off of the hair the cutting off of those citizens ]then thou shalt thee a balance [as a token of Gods justice ]and divide those hairs .[compare this verse with the twelfth vers following . ]"}],"2":[{"catchword":null,"tekst":"A third part[ the hair divided into three equal parts signified that the Jews should be destroyed and perish by divers forts of judgments he that escaped the one should fall into other compare Isa 24.18 Jerem 15.2 ] thou shalt burn with fire[ which signifieth all the judgments whereby all the third part of the people during the siege should die into the city as namely by hunger sorrow pestilence ,shot, and the like plagues .see the word of fire taken for plagues and calamities Job 15 on vers 34 so below vers 4] in the midst of the city[ to wit of the city of Jerusalem he having portrayed it upon a tile above chap 4 .1 he was now tom shew upon the said tile this sad spectacle with the interpretation thereof unto he people that dwelt unto Chaldea were the prophet was]after the days of the siege are fulfilled that is thou shalt not burn the whole third part at once but now a little and then a little till the be ended .Others when the days of the siege shall be fulfilled ] then shalt thou take a third part smiling about it [ to wit the third part of the hair ]with a sword [ hereby is signified that another third part of the Jews without the city should be destroyed by the enemy ,to wit, when they should break out upon him or else taking flight should fall unto his hands 2 Kings 25.4 ]and a third part thou shalt scatter in the wind ;[understand by this third part the remaining third part of the Jews which was partly scattered into the countrys round about partly carried away captive to Ribla and Babel 2 Kings 25.11,20,21 ] for I will draw out the sword after them [To wit the sword of enemies which shall here and there pursue after plague and devour the fugitive and captive Jews .Heb empty the sword after them so Exod 15.9 Levit 26.33 below vers12 and chap 12 vers 14. ]"}],"3":[{"catchword":null,"tekst":"Thou shalt also take thereof [to wit of the last third part] a few number and binde them in thy skirts [ to signifie that a very small number of the poorest and meanest Jews should remain in the land, whom Nebuzaradan should leave there for vine dressers and husbandman 2 Kings 25.12 .Jerem 52.16 .]"}],"4":[{"catchword":null,"tekst":"And thou shalt yet take of them ,[to wit of those few that are left ] and cast them into the midst of the fire and shalt burn them with fire :[which signified that yet many of them that were left under the government of Gedeliah should miserable perish and shall be feattered abroad 2 kings 25.25, 26 Jerem 41.3 ]there from shall a fire [meaning the fire of miseries and plague see on above vers 2 so in the sequel of this vers ] come forth against all the house of Israel .[to wit a fire which shall utterly plague and destroy the whole remnant of Juda and Israel mingled among them and where so ever they be see Jerem 42.16 and 44.27 ,28 .]"}],"5":[{"catchword":null,"tekst":"thus saith the Lord LORD :this is Jerusalem [ to wit the city which the prophet had portrayed upon the tile above chap 4 .1 it was not the city it was not the city itself that was in Juda but the token and portrasture thereof see of this phrase whereby the token beareth the name of this thing betokened Gen 17 on vers 10 ]which I have in the midst of the heathen [that s I have shewed her more favor then I have done to any other cities among the heathen that she might be unto them an example of virtue and honestly compare Duet 4,6,7,8. Psal 48.2,3 & and 87 .1,2,3 &c]and lands round about her .[that is heathenish lands and nations before whom she ought to have shined in goodness or ,and of the lands that are round about her. ]"}],"6":[{"catchword":null,"tekst":"But she hath changed my judgments into wickedness more than the heathen and my statutes more than the lands that are round about her :[see 2 Kings 21 on vers 9 and 2 Chrons 32.9 Jerem 2.10 see also in the end of the next vers ] for thy have rejected my judgment and into my statutes have they not walked [what it is to walk in the law or statutes have of the Lord see 2Chron 6 on vers 16 ]"}],"7":[{"catchword":null,"tekst":"Therefore thus faith the lord Lord ;Because ye have made it so much the more then the heathen that are round about you ,[To wit ,by finning and transgressing .Heb. for your multiplying ;&c.that is , because ye multiply, to wit ,in fin ;or are multiplied in fin .Others understand this multiplication of their great store and abundant riches ,wherein they surpassed the heathen round about ,and yet notwithstanding were unthankful to toward God ,as followeth Compare Deut .32.15.] have not walked in my statues ,and have kept my judgments ,yea have not done according to the judgments of the heathen that are round about .[Which suffered not any rashly to change their Gods and their Religion ;Jer 2:10.This may also be understood of the natural and civil laws which are by God written in the hearts of all men ,Rom 1:32and 2.15.which many heathen better kept and observed then the Jews did .Among these laws this is one ,that a man ought to keep his word and his promise ,to wit such one may kept which the Jews did not ,2Ki 24:1.and 20. ]"}],"8":[{"catchword":null,"tekst":"Therefore thus faith the lord Lord ;Behold ,I will be upon thee , [namely O thou city of Jerusalem ;to wit ;to destroy thee .Others ,l come against thee :as Revel.2.5,16and 3.3 ] yea 1:[this repetition tendeth to the assurance and aggravation of the punishment that is foretold ]for l will exercise judgment in midst of thee [that is ,execute punishments upon thee .So Psal .119.84. below chap .11.9and 25.11.Compare 2chron . 20.12. and the Annotat.] before the eyes of those heathen .To wit whom thou exceedest in wickedness ,to whom thou by thy doings has given offence and who being thine enemies ,will rejoice at thy destruction.]"}],"9":[{"catchword":null, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
