t kan worden; en zij zullen hen in Tofeth begraven, omdat er geen andere plaats zal zijn om te begraven.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Jes 3:1": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water;", "Ezech 13:15": "Zo zal Ik Mijn grimmigheid tegen de wand voleindigen, en tegen hen die hem pleisteren met loze kalk; en Ik zal tegen u zeggen: Die wand is er niet meer, en zij die hem pleisterden, zijn er niet meer;", "Jer 38:2": "Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Zach 13:6": "En als iemand tegen hem zegt: Wat zijn deze wonden in uw handen? dan zal hij zeggen: Het zijn de wonden waarmee ik geslagen ben, in het huis van mijn liefhebbers.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Jer 2:11": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Dan 5:27": "TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden.", "Matt 7:14": "Want de poort is nauw, en de weg is smal, die naar het leven leidt, en weinigen zijn er die hem vinden.", "Ezech 8:16": "En Hij bracht mij tot de binnenste voorhof van het huis van de HEERE; en zie, aan de deur van de tempel van de HEERE, tussen het voorhuis en het altaar, waren ongeveer vijfentwintig mannen; hun achterste lichaamsdelen waren naar de tempel van de HEERE, en hun gezichten naar het oosten, en zij bogen zich neer naar het oosten voor de zon.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Hos 9:4": "Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "Ezech 26:14": "Ja, Ik zal u maken tot een gladde steenrots; u zult zijn tot uitspreiding van de netten, u zult niet meer gebouwd worden; want Ik, de HEERE, heb het gesproken, spreekt de Heere HEERE.", "Ps 38:3": "Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald.", "Num 11:1": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren.", "Jer 50:17": "Israël is een verjaagd lam, dat de leeuwen weggejaagd hebben; de eerste die hem heeft opgegeten, was de koning van Assur, en deze, de laatste, Nebukadrezar, de koning van Babel, heeft hem de beenderen verbrijzeld.", "Ezech 24:1-24": "Verder kwam het woord van de HEERE tot mij, in het negende jaar, in de tiende maand, op de tiende dag van de maand, en Hij zei: Mensenkind! Schrijf voor uzelf de naam van de dag op, van deze dag zelf; de koning van Babel heeft zich tegen Jeruzalem gelegerd, op deze dag zelf. En gebruik een gelijkenis tegenover dat opstandige huis, en zeg tegen hen: Zo zegt de Heere HEERE: Zet een pot toe, zet hem toe, en giet er ook water in.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Mark 7:6-8": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij. Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen; Want u laat het gebod van God los, en houdt vast aan de overleveringen van mensen, namelijk het wassen van kannen en drinkbekers; en vele andere dergelijke dingen doet u.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Ezech 29:7": "Toen zij u bij uw hand grepen, werd u gebroken, en spleet u al hun zijden; en toen zij op u leunden, werd u verbroken, en liet u al hun lenden stilstaan.", "Luk 14:35": "Het is niet meer geschikt voor het land, en ook niet voor de mesthoop; men gooit het weg. Wie oren heeft om te horen, laat hij horen.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Num 24:8": "God heeft hem uit Egypte uitgevoerd; zijn kracht is als die van een eenhoorn; hij zal de heidenvolken, zijn vijanden, verteren, en hun beenderen breken, en met zijn pijlen doorschieten.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "2 Kron 33:4": "En hij bouwde altaren in het huis van de HEERE, waarvan de HEERE gezegd had: Te Jeruzalem zal Mijn Naam zijn tot in eeuwigheid.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ezech 29:15": "En het zal nederiger zijn dan de andere koninkrijken, en zich niet meer verheffen boven de heidenvolken; want Ik zal hen verminderen, zodat zij niet zullen heersen over de heidenvolken.", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "2 Kon 21:12-15": "Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant. En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Spr 25:18": "Een man die tegen zijn naaste een valse getuigenis spreekt, is een hamer, en zwaard, en scherpe pijl.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Job 31:6": "Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten.", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Ezech 21:17": "En Ik Zelf zal ook Mijn hand tegen Mijn hand slaan, en Mijn grimmigheid doen rusten; Ik, de HEERE, heb het gesproken.", "Jak 2:14-26": "Wat voor nut heeft het, mijn broeders, als iemand zegt dat hij het geloof heeft, maar hij heeft de werken niet? Kan dat geloof hem zaligmaken? Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel; en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?", "Openb 6:5-8": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand. En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet. En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!", "1 Kor 10:4": "en zij hebben allen dezelfde geestelijke drank gedronken; want zij dronken uit de geestelijke steenrots die hen volgde; en die steenrots was Christus.", "Jes 1:11-15": "Waartoe zal Mij de veelheid van uw slachtoffers zijn? zegt de HEERE; Ik ben zat van de brandoffers van de rammen, en het vet van de vette dieren, en heb geen lust aan het bloed van de stieren, noch van de lammeren, noch van de bokken. Wanneer u voor Mijn aangezicht komt te verschijnen, wie heeft dat van uw hand geëist, dat u Mijn voorhoven zou betreden? Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Jer 18:11-17": "Nu dan, spreek nu tot de mannen van Juda en tot de inwoners van Jeruzalem, en zeg: Zo zegt de HEERE: Zie, Ik formeer een kwaad tegen u, en denk tegen u een gedachte; bekeer u dan nu, ieder van zijn boze weg, en maak uw wegen en uw daden goed. Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt. Daarom, zo zegt de HEERE: Vraag nu onder de heidenvolken; wie heeft zoiets gehoord? De jonkvrouw Israël doet een zeer afschuwelijke zaak.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "Ezech 12:3-7": "Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn. U zult dan uw gereedschap bij dag voor hun ogen naar buiten brengen, als het gereedschap van hen die vertrekken; daarna zult u in de avond uitgaan voor hun ogen, zoals zij uitgaan die vertrekken. Graaf u een gat door de wand voor hun ogen, en breng daardoor uw gereedschap naar buiten.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Ezech 22:15": "En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Matt 7:21-23": "Niet ieder die tegen Mij zegt: Heere, Heere! zal ingaan in het Koninkrijk der hemelen, maar wie de wil doet van Mijn Vader, Die in de hemelen is. Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan? En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Ezech 8:5": "En Hij zei tegen mij: Mensenkind, hef nu uw ogen op naar de weg van het noorden; en ik hief mijn ogen op naar de weg van het noorden, en zie, tegen het noorden aan de poort van het altaar was dit beeld van de ijver, in de ingang.", "Jer 11:9-17": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Ezech 14:19": "Of als Ik de pest in datzelfde land zend, en Mijn grimmigheid daarover met bloed uitgiet, om daaruit mensen en beesten uit te roeien;", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Matt 6:1": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "Dan 11:36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Matt 25:3": "Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Rom 9:6": "Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.", "Joël 3:3": "En zij hebben het lot geworpen over Mijn volk, en een jongetje gegeven voor een hoer, en een meisje verkocht voor wijn, om die te drinken.", "Jer 5:1-31": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Hebr 6:13": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren,", "Jer 2:19": "Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen.", "Jer 22:8": "Dan zullen veel heidenvolken langs deze stad gaan, en zullen zeggen, ieder tegen zijn naaste: Waarom heeft de HEERE zo gedaan aan deze grote stad?", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Hos 8:13": "Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.", "Matt 7:5": "Huichelaar! Haal eerst de balk uit uw eigen oog, en dan zult u goed genoeg zien om de splinter uit het oog van uw broeder te halen.", "1 Joh 2:19": "Zij zijn uit ons weggegaan, maar zij waren niet uit ons; want als zij uit ons geweest waren, dan zouden zij bij ons gebleven zijn; maar dit is gebeurd, opdat zij openbaar zouden worden, dat zij niet allen uit ons zijn.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Mark 8:15": "En Hij gebood hun: Kijk uit, wees op uw hoede voor het zuurdeeg van de Farizeeën, en voor het zuurdeeg van Herodes.", "Ezech 25:17": "En Ik zal grote wraak met grimmige straffen onder hen voltrekken; en zij zullen weten dat Ik de HEERE ben, wanneer Ik Mijn wraak aan hen zal hebben voltrokken.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Jer 2:5-34": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden? En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde? En Ik bracht u in een vruchtbaar land, om de vrucht ervan en het goede ervan te eten; maar toen u daarin kwam, verontreinigde u Mijn land, en maakte u Mijn erfenis tot een gruwel.", "Jes 7:20": "Op die dag zal de Heere door een gehuurd scheermes, dat aan de andere kant van de rivier is, door de koning van Assyrië, het hoofd afscheren, en het haar van de voeten; ja, het zal ook de baard helemaal wegnemen.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Jer 6:6": "Want zo zegt de HEERE van de heerscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.", "Luk 12:54-56": "En Hij zei ook tegen de menigten: Wanneer u een wolk ziet opkomen vanuit het westen, zegt u meteen: Er komt regen; en zo gebeurt het. En wanneer u de zuidenwind ziet waaien, zegt u: Er zal hitte komen; en het gebeurt. Huichelaars, het aanzien van de aarde en de hemel weet u te beoordelen; hoe komt het dan dat u deze tijd niet weet te beoordelen?", "Matt 24:7": "Want het ene volk zal tegen het andere volk opstaan, en het ene koninkrijk tegen het andere koninkrijk; en er zullen hongersnoden zijn, en pestilentiën, en aardbevingen op verschillende plaatsen.", "Deut 28:64": "En de HEERE zal u verstrooien onder alle volken, van het ene einde van de aarde tot het andere einde van de aarde; en daar zult u andere goden dienen die u niet gekend hebt, noch uw vaderen, hout en steen.", "Ezech 37:14": "En Ik zal Mijn Geest in u geven, en u zult leven, en Ik zal u in uw land zetten; en u zult weten dat Ik, de HEERE, dit gesproken en gedaan heb, spreekt de HEERE.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Jer 9:1-3": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk. Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop. En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Hos 7:16": "Zij keren zich om, maar niet naar de Allerhoogste, zij zijn als een bedrieglijke boog; hun vorsten vallen door het zwaard, vanwege de woede van hun tong; dit zal hun bespotting zijn in het land Egypte.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Jak 1:22-24": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "2 Kon 18:1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 26:19": "zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Jer 41:1": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Jes 66:16": "Want met vuur, en met Zijn zwaard zal de HEERE oordelen over alle vlees; en de verslagenen van de HEERE zullen talrijk zijn.", "Jes 63:17": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "Luk 22:20": "Net zo ook de drinkbeker na de maaltijd, en zei: Deze drinkbeker is het nieuwe testament in Mijn bloed, dat voor u vergoten wordt.", "Num 32:10": "Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Zach 7:14": "Maar Ik heb hen weggestormd onder alle heidenvolken die zij niet kenden; en het land werd achter hen verwoest, zodat niemand er doorheen trok of terugkeerde; want zij maakten het begerenswaardige land tot een verwoesting.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Jer 24:10": "En Ik zal onder hen zenden het zwaard, de honger en de pest, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had.", "Luk 6:46": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg?", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Hos 4:16": "Want Israël is koppig, als een koppige koe; nu zal de Heere hen weiden, als een lam in de ruimte.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Ps 120:4": "Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Klaagl 4:6": "Vau. En de ongerechtigheid van de dochter van mijn volk is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, zonder dat er handen naar haar uitgestoken werden.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "Jer 3:10": "En zelfs bij dit alles heeft haar trouweloze zuster Juda zich niet met haar hele hart tot Mij bekeerd, maar slechts in schijn, spreekt de HEERE.", "Ezech 16:54": "Opdat u uw schande draagt, en te schande gemaakt wordt, om alles wat u gedaan hebt, wanneer u hen troosten zult.", "Dan 9:12": "En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze rechters, die ons berechtten, door over ons een groot kwaad te brengen, dat niet gebeurd is onder de hele hemel, zoals het aan Jeruzalem gebeurd is.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Jes 9:12-20": "Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet. Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Jer 44:6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.", "Lev 26:33": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.", "Ps 52:4": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Hebr 3:11": "Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Jer 15:2": "En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!", "Amos 5:21-27": "Ik haat, Ik verafschuw uw feesten, en Ik kan uw verbodsdagen niet rieken. Want al offert u Mij brandoffers, alsook uw spijsoffers, Ik heb er toch geen welgevallen aan; en het dankoffer van uw vette beesten wil Ik niet aanzien. Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Deut 28:23": "En uw hemel, die boven uw hoofd is, zal koper zijn, en de aarde, die onder u is, zal ijzer zijn.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Jer 25:38": "Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Ex 23:29": "Ik zal hen niet in één jaar van voor uw aangezicht wegjagen, opdat het land niet woest wordt, en de wilde dieren van het veld niet te veel worden en u bedreigen.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Ps 106:20": "En zij veranderden hun Eer in de gedaante van een os, die gras eet.", "Jer 39:10": "Maar van het volk dat arm was, dat niets had, liet Nebuzaradan, de aanvoerder van de lijfwacht, sommigen achter in het land van Juda; en hij gaf hun op die dag wijngaarden en akkers.", "Openb 2:9": "Ik weet uw werken, en verdrukking, en armoede (maar u bent rijk), en de lastering van hen die zeggen dat zij Joden zijn, en zijn het niet, maar zijn een synagoge van de satan.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Zach 7:5": "Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast?", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "2 Kron 7:20": "Dan zal Ik hen uitrukken uit Mijn land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen, en zal het tot een spreekwoord en spotrede onder alle volken maken.", "Num 11:33": "Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Lev 26:31": "En Ik zal uw steden een woestijn maken, en uw heiligdommen verwoesten; en Ik zal uw liefelijke geur niet ruiken.", "Jer 6:20": "Waartoe zal dan de wierook voor Mij uit Scheba komen, en de beste kalmus uit ver land? Uw brandoffers zijn Mij niet behagelijk, en uw slachtoffers zijn Mij niet zoet.", "Job 27:13-18": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Jer 22:9": "En zij zullen zeggen: Omdat zij het verbond van de HEERE, hun God, hebben verlaten, en zich voor andere goden hebben neergebogen, en die gediend.", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Ezech 6:8": "Ik zal dan nog een overblijfsel laten over, doordat u er enigen zult hebben, die het zwaard ontkomen onder de heidenvolken, wanneer u in de landen verstrooid wordt.", "Deut 28:26": "En uw dode lichaam zal voedsel zijn voor alle vogels van de hemel, en voor de dieren van de aarde; en niemand zal ze verjagen.", "Klaagl 4:10": "Jod. De handen van barmhartige vrouwen hebben hun eigen kinderen gekookt; zij zijn hun tot voedsel geworden bij de ondergang van de dochter van mijn volk.", "Rom 1:23-25": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren. Daarom heeft God hen ook overgegeven in de begeerten van hun harten tot onreinheid, om hun lichamen onder elkaar te onteren; als degenen die de waarheid van God veranderd hebben in de leugen, en het schepsel geëerd en gediend hebben boven de Schepper, Die te prijzen is tot in eeuwigheid, amen.", "Ezech 7:4": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Openb 2:1-6": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt: Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden; En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Jer 42:20-22": "Zeker, u hebt uzelf misleid; want u hebt mij tot de HEERE, uw God, gezonden, en gezegd: Bid voor ons tot de HEERE, onze God, en maak ons alles bekend wat de HEERE, onze God, zal zeggen, en wij zullen het doen. Nu heb ik het u heden bekendgemaakt; maar u hebt niet geluisterd naar de stem van de HEERE, van uw God, noch naar al hetgeen waarmee Hij mij tot u gezonden heeft. Zo weet nu zeker, dat u door het zwaard, door de honger en door de pestilentie zult sterven, op de plaats waar u naartoe wilde gaan om daar als vreemdelingen te wonen.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Ezech 23:47": "En de menigte zal hen met stenen stenigen, en hen met hun zwaarden neerhouwen; hun zonen en hun dochters zullen zij doden, en hun huizen met vuur verbranden.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Rom 2:3": "En denkt u dit, o mens, die hen oordeelt die zulke dingen doen, en dat zelf ook doet, dat u het oordeel van God zult ontvluchten?", "Deut 32:42": "Ik zal Mijn pijlen dronken maken van bloed, en Mijn zwaard zal vlees eten; van het bloed van de verslagene en van de gevangene, vanaf het begin zullen er wraken van de vijand zijn.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "2 Petr 2:17": "Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Hand 2:5": "En er waren Joden die in Jeruzalem woonden, godvruchtige mannen, uit alle volken die er onder de hemel zijn.", "Ezech 16:48": "Zo waar Ik leef, spreekt de Heere HEERE, Sodom, uw zuster, heeft niet gedaan, zij en haar dochters niet, zoals u gedaan hebt, u en uw dochters!", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Kol 3:6": "Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Hagg 1:11": "Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over de most, en over de olie, en over wat de aardbodem zou voortbrengen; ook over de mensen, en over de dieren, en over alle arbeid van de handen.", "Deut 29:20": "De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Spr 11:9": "De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.", "Ezech 21:6": "Maar u, mensenkind, zucht; zucht voor hun ogen met verbreking van de lenden en met bitterheid.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Ps 106:29": "En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ezech 22:18": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Ezech 5:5-17": "Zo zegt de Heere HEERE: Dit is Jeruzalem, die Ik in het midden van de heidenvolken gezet heb, met landen rondom haar heen. Toch heeft zij Mijn rechten veranderd in goddeloosheid, erger dan de heidenvolken, en Mijn inzettingen erger dan de landen die rondom haar zijn; want zij hebben Mijn rechten verworpen, en in Mijn inzettingen hebben zij niet gewandeld. Daarom zegt de Heere HEERE zo: Omdat u meer gedaan hebt dan de heidenvolken die rondom u zijn, in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, ja zelfs naar de rechten van de heidenvolken die rondom u zijn niet gedaan hebt;", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Deut 32:15-21": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil. Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt. Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "1 Sam 21:13": "Daarom veranderde hij zijn gelaat voor hun ogen, en hij deed zichzelf gek voor onder hun handen; en hij krabbelde op de deuren van de poort, en hij liet zijn kwijl in zijn baard aflopen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Ps 57:5": "Mijn ziel is te midden van leeuwen, ik lig tussen mensen die vuur spuwen, mensenkinderen, wier tanden speren en pijlen zijn, en hun tong een scherp zwaard.", "2 Kor 5:12": "Want wij prijzen onszelf bij u niet opnieuw aan, maar wij geven u aanleiding om over ons te roemen, opdat u iets zou hebben tegen hen die roemen op het uiterlijk en niet op het hart.", "Ezech 21:7": "En het zal gebeuren, als zij tegen u zeggen: Waarom zucht u? dat u zult zeggen: Om het gerucht, want het komt! En alle hart zal wegsmelten, en alle handen zullen verslappen, en alle geest zal terugkrimpen, en alle knieën zullen wegvloeien als water; zie, het komt, en het zal gebeuren, spreekt de Heere HEERE.", "Jes 49:26": "En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob.", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Lev 21:5": "Zij zullen op hun hoofd geen kaalheid maken, en zullen de hoek van hun baard niet afscheren, en in hun vlees zullen zij geen sneden snijden.", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Jer 10:19-22": "O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal! Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht. Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "2 Kon 6:28": "Verder zei de koning tegen haar: Wat is er met u? En zij zei: Deze vrouw heeft tegen mij gezegd: Geef uw zoon, dat wij hem vandaag eten, en morgen zullen wij mijn zoon eten.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Ezech 7:20": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Zach 2:6": "Hoi, hoi, vlucht toch uit het Noorderland, spreekt de HEERE; want Ik heb u uitgebreid naar de vier winden van de hemel, spreekt de HEERE.", "Ezech 36:19": "En Ik verstrooide hen onder de heidenen, en zij werden verspreid in de landen; Ik oordeelde ze naar hun weg en naar hun handelingen.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Jer 42:16": "dan zal het gebeuren dat het zwaard waar u voor vreest, u daar in Egypteland zal achterhalen; en de honger waar u voor bezorgd bent, zal u daar in Egypte op de hielen zitten, en daar zult u sterven.", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Klaagl 4:9": "Teth. De gevallenen door het zwaard hebben het beter dan de gevallenen door de honger; want die kwijnen weg, als doorstoken, omdat er geen vruchten van de velden zijn.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Jes 43:22-28": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël! Mij hebt u niet gebracht het kleinvee van uw brandoffers, en met uw slachtoffers hebt u Mij niet geëerd; Ik heb u Mij niet doen dienen met spijsoffer, en Ik heb u niet vermoeid met wierook. Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Deut 28:24": "De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.", "Joël 3:2": "dan zal Ik alle heidenvolken verzamelen, en zal hen afvoeren naar het dal van Josafat; en Ik zal daar met hen richten, vanwege Mijn volk en Mijn erfdeel Israël, dat zij onder de heidenvolken hebben verstrooid, en Mijn land hebben verdeeld.", "Ezech 14:21": "Want zo zegt de Heere HEERE: Hoeveel te meer als Ik Mijn vier zware oordelen, het zwaard, en de honger, en het boze gedierte, en de pest gezonden zal hebben tegen Jeruzalem, om daaruit mensen en beesten uit te roeien!", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Jer 44:27": "Zie, Ik zal over hen waken ten kwade en niet ten goede; en alle mannen van Juda die in Egypteland zijn, zullen door het zwaard en door de honger verteerd worden, totdat zij ten einde zijn.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Matt 16:3": "en 's morgens: Vandaag onweer; want de hemel is somber rood. Huichelaars! Het uiterlijk van de hemel weet u wel te onderscheiden, maar kunt u de tekenen van de tijden niet onderscheiden?", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Hagg 1:10": "Daarom onthouden de hemelen zich boven u van dauw, en het land onthoudt zijn vruchten.", "Hos 9:1-17": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren. De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen. Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Openb 6:8": "En ik zag, en zie, een vaal paard, en die daarop zat, zijn naam was de dood; en de hel volgde hem na. En hun werd macht gegeven om te doden tot het vierde deel van de aarde, met zwaard, en met honger, en met de dood, en door de wilde beesten van de aarde.", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Jes 20:2-4": "In dezelfde tijd sprak de HEERE, door de dienst van Jesaja, de zoon van Amoz, en Hij zei: Ga heen, en maak de zak van uw lendenen los, en doe uw schoenen van uw voeten. En hij deed zo, en liep naakt en barrevoets. Toen zei de HEERE: Zoals Mijn knecht Jesaja naakt en barrevoets rondloopt, drie jaren, tot een teken en wonder over Egypte en over Morenland; zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Ps 45:6": "Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Ezech 17:21": "Daartoe zullen al zijn vluchtelingen met al zijn troepen door het zwaard vallen, en de overgeblevenen zullen naar
