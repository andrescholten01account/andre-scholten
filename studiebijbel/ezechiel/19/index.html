rd gezien door zijn hoogte, met de menigte van zijn takken.", "12": "Maar hij werd in grimmigheid uitgerukt, en ter aarde geworpen, en de oostenwind heeft zijn vrucht verdroogd; zijn sterke takken zijn afgebroken en verdroogd; het vuur heeft ze verteerd.", "13": "En nu is hij geplant in een woestijn, in een dor en dorstig land.", "14": "Daarbij is een vuur uitgegaan uit een tak van zijn ranken, dat zijn vrucht verteerd heeft; zodat er aan hem geen sterke tak meer is tot een scepter, om te heersen. Dit is een weeklage, en is tot een weeklage geworden."}, "SV": {"1": "Verder, hef gij een weeklage op over de vorsten van Israël,", "2": "En zeg: Wat was uw moeder? Een leeuwin, onder de leeuwen nederliggende; zij bracht haar welpen op in het midden der jonge leeuwen.", "3": "Zij toog nu een van haar welpen op; het werd een jonge leeuw, die leerde roof te roven, hij at mensen op.", "4": "Dit hoorden de volken van hem, hij werd gegrepen in hun groeve; en zij brachten hem met haken naar Egypteland.", "5": "Zij nu ziende, dat zij in hope was geweest, *doch* haar verwachting verloren was, zo nam zij een *ander* van haar welpen, hetwelk zij *tot* een jongen leeuw stelde.", "6": "Deze wandelde steeds onder de leeuwen, werd een jonge leeuw, en leerde roof te roven, hij at mensen op.", "7": "Hij bekende zijn weduwen, en hij verwoestte hun steden; zodat het land en zijn volheid ontzet werd van de stem zijner brulling.", "8": "Toen begaven zich de volken tegen hem rondom uit de landschappen, en zij spreidden hun net over hem uit; in hun groeve werd hij gegrepen.", "9": "En zij stelden hem in gesloten bewaring met haken, opdat zij hem brachten tot den koning van Babel; zij brachten hem in vestingen, opdat zijn stem niet meer gehoord wierde op de bergen Israëls.", "10": "Uw moeder was als een wijnstok in uw stilheid, geplant bij wateren; hij was vruchtbaar en vol ranken vanwege vele wateren.", "11": "En hij had sterke roeden tot scepteren der heersers, en de stam van elke *roede* werd hoog tussen de dichte takken; en hij werd gezien door zijn hoogte, met de menigte zijner takken.", "12": "Maar hij werd door grimmigheid uitgerukt, *en* ter aarde geworpen, en de oostenwind heeft zijn vrucht verdroogd; zijn sterke roeden zijn afgebroken en zijn verdroogd; het vuur heeft ze verteerd.", "13": "En nu is hij geplant in een woestijn, in een dor en dorstig land.", "14": "Daartoe is een vuur uitgegaan uit een roede zijner ranken, *dat* zijn vrucht verteerd heeft; zodat aan hem geen sterke roede is *tot* een scepter, om te heersen. Dit is een weeklage, en is tot een weeklage geworden."}, "KJV": {"1": "Moreover take thou up a lamentation for the princes of Israel,", "2": "And say, What *is* thy mother? A lioness: she lay down among lions, she nourished her whelps among young lions.", "3": "And she brought up one of her whelps: it became a young lion, and it learned to catch the prey; it devoured men.", "4": "The nations also heard of him; he was taken in their pit, and they brought him with chains unto the land of Egypt.", "5": "Now when she saw that she had waited, *and* her hope was lost, then she took another of her whelps, *and* made him a young lion.", "6": "And he went up and down among the lions, he became a young lion, and learned to catch the prey, *and* devoured men.", "7": "And he knew their desolate palaces, and he laid waste their cities; and the land was desolate, and the fulness thereof, by the noise of his roaring.", "8": "Then the nations set against him on every side from the provinces, and spread their net over him: he was taken in their pit.", "9": "And they put him in ward in chains, and brought him to the king of Babylon: they brought him into holds, that his voice should no more be heard upon the mountains of Israel.", "10": "Thy mother *is* like a vine in thy blood, planted by the waters: she was fruitful and full of branches by reason of many waters.", "11": "And she had strong rods for the sceptres of them that bare rule, and her stature was exalted among the thick branches, and she appeared in her height with the multitude of her branches.", "12": "But she was plucked up in fury, she was cast down to the ground, and the east wind dried up her fruit: her strong rods were broken and withered; the fire consumed", "13": "And now she *is* planted in the wilderness, in a dry and thirsty ground.", "14": "And fire is gone out of a rod of her branches, *which* hath devoured her fruit, so that she hath no strong rod *to be* a sceptre to rule. This *is* a lamentation, and shall be for a lamentation."}}, "tsk": {"1": [{"kopje": "hef", "refs": ["Ezech 19:14", "Ezech 2:10", "Ezech 26:17", "Ezech 27:2", "Ezech 32:16", "Ezech 32:18", "Jer 9:1", "Jer 9:10", "Jer 9:17", "Jer 9:18", "Jer 13:17", "Jer 13:18"]}, {"kopje": "de vorsten", "refs": ["2 Kon 23:29", "2 Kon 23:30", "2 Kon 23:34", "2 Kon 24:6", "2 Kon 24:12", "2 Kon 25:5-7", "2 Kron 35:25", "2 Kron 36:3", "2 Kron 36:6", "2 Kron 36:10", "Jer 22:10-12", "Jer 22:18", "Jer 22:19", "Jer 22:28", "Jer 22:30", "Jer 24:1", "Jer 24:8", "Jer 52:10", "Jer 52:11", "Jer 52:25-27", "Klaagl 4:20", "Klaagl 5:12"]}], "2": [{"kopje": "Een leeuwin", "refs": ["Nahum 2:11", "Nahum 2:12", "Zef 3:1-4"]}, {"kopje": "jonge leeuwen", "refs": ["Job 4:11", "Ps 58:7", "Jes 5:29", "Jes 11:6-9", "Zach 11:3"]}], "3": [{"kopje": "het werd", "refs": ["Ezech 19:6", "2 Kon 23:31", "2 Kon 23:32", "2 Kron 36:1", "2 Kron 36:2"]}], "4": [{"kopje": "werd", "refs": ["2 Kon 23:31", "2 Kon 23:33", "2 Kon 23:34", "2 Kron 36:4", "2 Kron 36:6", "Jer 22:11", "Jer 22:12", "Jer 22:18"]}], "5": [{"kopje": "een ander", "refs": ["Ezech 19:3", "2 Kon 23:34-37"]}], "6": [{"kopje": "liep", "refs": ["2 Kon 24:1-7", "2 Kron 36:5", "Jer 22:13-17", "Jer 26:1-24", "Jer 36:1-32"]}, {"kopje": "werd", "refs": ["Ezech 19:3"]}], "7": [{"kopje": "zodat het land", "refs": ["Ezech 22:25", "Spr 19:12", "Spr 28:3", "Spr 28:15", "Spr 28:16"]}, {"kopje": "al wat er in was", "refs": ["Ezech 12:19", "Ezech 30:12", "Amos 6:8", "M null}, {"disp": "Ezech 19:10-14", "href": "../../ezechiel/19/#v10", "ref": "Ezech 19:10-14", "svLabel": null}], "kinderen": []}]}, {"topic": "Vine", "href": "../../nave/v/#t-vine", "kinderen": [{"label": "Parables of", "href": "../../nave/v/?hl=Ezek.19.10#i21335", "refs": [{"disp": "Ps 80:8-14", "href": "../../psalmen/80/#v9", "ref": "Ps 80:9-15", "svLabel": "SV 9"}, {"disp": "Ezech 17:6-10", "href": "../../ezechiel/17/#v6", "ref": "Ezech 17:6-10", "svLabel": null}, {"disp": "Ezech 19:10-14", "href": "../../ezechiel/19/#v10", "ref": "Ezech 19:10-14", "svLabel": null}], "kinderen": []}]}]}, "12": {"nave": [{"topic": "Wind", "href": "../../nave/w/#t-wind", "kinderen": [{"label": "East", "href": "../../nave/w/?hl=Ezek.19.12#i21959", "refs": [], "kinderen": [{"label": "In the valley of the Euphrates River", "href": "../../nave/w/?hl=Ezek.19.12#i21961", "refs": [{"disp": "Ezech 19:12", "href": "../../ezechiel/19/#v12", "ref": "Ezech 19:12", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Jer 36:30": "Daarom zegt de HEERE zo van Jojakim, de koning van Juda: Hij zal niemand hebben die op de troon van David zit; en zijn dode lichaam zal weggeworpen worden, overdag in de hitte, en 's nachts in de vorst.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "2 Kon 23:33": "Doch Farao Necho liet hem gevangenzetten te Ribla in het land van Hamath, opdat hij te Jeruzalem niet regeren zou; en hij legde het land een boete op van honderd talenten van het zilver en een talent van het goud.", "Jer 4:11": "In die tijd zal tegen dit volk en tegen Jeruzalem gezegd worden: Een dorre wind van de hoge plaatsen in de woestijn, op de weg naar de dochter van Mijn volk; niet om te wannen, of om te zuiveren.", "Ezech 15:6-8": "Daarom, zo zegt de Heere HEERE: Zoals het hout van de wijnstok is onder het hout van het woud, dat Ik aan het vuur overgeef, opdat het verteerd wordt, zo zal Ik de inwoners van Jeruzalem overgeven. Want Ik zal Mijn aangezicht tegen hen zetten; als zij van het ene vuur uitgaan, zal het andere vuur hen verteren; en u zult weten, dat Ik de HEERE ben, als Ik Mijn aangezicht tegen hen gesteld zal hebben. En Ik zal het land woest maken, omdat zij zwaar overtreden hebben, spreekt de Heere HEERE.", "Num 24:7": "Er zal water uit zijn emmers vloeien, en zijn nageslacht zal in veel water zijn; en zijn koning zal boven Agag verheven worden, en zijn koninkrijk zal verhoogd worden.", "2 Kon 25:6": "Zij dan grepen de koning, en voerden hem op naar de koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem.", "Jer 52:27-31": "En de koning van Babel sloeg hen en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd. Dit is het volk dat Nebukadrezar gevankelijk heeft weggevoerd: in het zevende jaar, drieduizend drieëntwintig Joden; In het achttiende jaar van Nebukadrezar voerde hij gevankelijk weg achthonderdtweeëndertig zielen uit Jeruzalem;", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Ezech 19:1-9": "Verder, hef u een weeklage op over de vorsten van Israël, en zeg: Wat was uw moeder? Een leeuwin, die onder de leeuwen neerlag; zij bracht haar welpen groot te midden van de jonge leeuwen. Zij trok een van haar welpen groot; het werd een jonge leeuw, die leerde roof te roven, hij at mensen op.", "2 Kon 23:34": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Jer 4:12": "Er zal Mij een wind komen, die hun te sterk zal zijn. Nu zal Ik ook een oordeel tegen hen uitspreken.", "Joh 19:15": "Maar zij riepen: Weg met Hem, weg met Hem, kruisig Hem! Pilatus zei tegen hen: Zal ik uw Koning kruisigen? De overpriesters antwoordden: Wij hebben geen koning dan de keizer.", "Ezech 17:6-10": "En het sproot uit, en werd een welig uitlopende wijnstok, doch nederig van stam, terwijl hij met zijn takken naar hem toe keek, omdat zijn wortels onder hem waren. Zo werd hij tot een wijnstok, die ranken voortbracht en scheuten uitwierp. Nog was er een grote arend, groot van vleugels en overvloedig van veren; en zie, deze wijnstok voegde zijn wortels naar hem toe, en wierp zijn takken naar hem uit, opdat hij hem bevochtigen zou vanuit de bedden van zijn planting. Hij was in een goede landouw bij veel water geplant, om takken te maken en vrucht te dragen, opdat hij tot een heerlijke wijnstok worden mocht.", "Jes 5:29": "Hun gebrul zal zijn als van een oude leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen grommen, en de prooi grijpen en wegvoeren; en er zal niemand zijn die redt.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "2 Kon 24:14-16": "En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land. Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel; En alle sterke mannen, tot zevenduizend, en timmerlieden en smeden, tot duizend, en alle helden, die geoefend waren voor de oorlog; dezen bracht de koning van Babel gevangen naar Babel.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Ezech 20:47": "En zeg tegen het zuiderwoud: Hoor het woord van de HEERE: Zo zegt de Heere HEERE: Zie, Ik zal een vuur in u aansteken, dat in u elke groene boom en elke dorre boom zal verteren; de vlammende vlam zal niet uitgeblust worden, maar daardoor zullen alle aangezichten verbrand worden, van het zuiden tot het noorden toe.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Ezech 17:5-10": "Hij nam ook van het zaad van het land, en legde het in een zaadakker; hij nam het, hij zette het bij veel water met grote zorgvuldigheid. En het sproot uit, en werd een welig uitlopende wijnstok, doch nederig van stam, terwijl hij met zijn takken naar hem toe keek, omdat zijn wortels onder hem waren. Zo werd hij tot een wijnstok, die ranken voortbracht en scheuten uitwierp. Nog was er een grote arend, groot van vleugels en overvloedig van veren; en zie, deze wijnstok voegde zijn wortels naar hem toe, en wierp zijn takken naar hem uit, opdat hij hem bevochtigen zou vanuit de bedden van zijn planting.", "Ezech 31:3": "Zie, Assur was een ceder op de Libanon, mooi van takken, met schaduwrijk loof, en hoog van stam, en zijn top reikte tot tussen de dichte takken.", "2 Kon 23:31": "Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.", "Hos 2:4": "Want hun moeder hoereert, zij die hen ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn minnaars nagaan, die mij mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.", "Ezra 4:20": "Ook zijn er machtige koningen geweest over Jeruzalem, die geheerst hebben over alles aan de andere kant van de rivier; en aan hen is cijns, oude belasting en tol gegeven.", "Ps 89:41-46": "Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest. Gij hebt de rechterhand van zijn wederpartijders verhoogd; Gij hebt al zijn vijanden verblijd.", "Deut 8:9": "Een land waarin u brood zult eten zonder gebrek, waarin u niets ontbreken zal; een land waarvan de stenen ijzer zijn, en uit welks bergen u koper zult uithouwen.", "Ps 110:2": "De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden.", "Amos 6:8": "De Heere HEERE heeft bij Zichzelf gezworen (spreekt de HEERE, de God van de heerscharen): Ik heb een afkeer van Jakobs hoogmoed, en Ik haat zijn paleizen; daarom zal Ik de stad en alles wat erin is overleveren.", "Matt 21:33-41": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Jer 22:10": "Ween niet over de dode, en beklaag hem niet; ween vrij over hem die weggegaan is, want hij zal nooit meer terugkomen om het land van zijn geboorte te zien.", "Jer 52:25-27": "En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en zeven mannen uit degenen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de leider van de schrijvers van het leger, die het volk van het land voor de oorlog opschreef, en zestig mannen van het volk van het land, die in het midden van de stad gevonden werden. Toen Nebuzaradan, de leider van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel in Ribla. En de koning van Babel sloeg hen en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Ps 80:16": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!", "Hos 2:1": "Twist tegen uw moeder, twist, omdat zij Mijn vrouw niet is, en Ik haar Man niet ben; en laat ze haar hoererijen van haar gezicht, en haar overspelerijen van tussen haar borsten wegdoen.", "2 Kon 25:5-7": "Doch het leger van de Chaldeeën jaagde de koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en heel zijn leger raakte van bij hem verstrooid. Zij dan grepen de koning, en voerden hem op naar de koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem. En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "2 Kon 23:32": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaderen gedaan hadden.", "2 Kon 23:29": "In zijn dagen trok Farao Necho, de koning van Egypte, op tegen de koning van Assyrië, naar de rivier de Frath; en koning Josia trok hem tegemoet, en Necho doodde hem te Megiddo, toen hij hem gezien had.", "Ezech 17:20": "En Ik zal Mijn net over hem uitspreiden, zodat hij gegrepen zal worden in Mijn jachtnet; en Ik zal hem naar Babel laten brengen, en zal daar met hem in het gericht gaan over zijn overtreding, waarmee hij tegen Mij overtreden heeft.", "Ezech 6:2": "Mensenkind, richt uw gezicht tegen de bergen van Israël, en profeteer tegen hen;", "Ezech 36:1": "En u, mensenkind! Profeteer tot de bergen van Israël, en zeg: Bergen van Israël! Hoort het woord van de HEERE.", "Jer 52:11": "En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; zo bracht de koning van Babel hem naar Babel, en stelde hem in de gevangenis, tot de dag van zijn dood toe.", "Jer 22:12": "Maar op de plaats waarheen zij hem gevangen hebben weggevoerd, zal hij sterven, en dit land zal hij niet meer zien.", "2 Kon 24:6": "En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats.", "Jer 9:10": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan!", "2 Kon 23:34-37": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar. En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven. Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en de naam van zijn moeder was Zebudda, een dochter van Pedaja, van Ruma.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Num 24:17": "Ik zal hem zien, maar nu niet; ik zal hem aanschouwen, maar niet van dichtbij. Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen; die zal de gebieden van de Moabieten verslaan, en al de kinderen van Seth verstoren.", "Ezech 17:10": "Ja zie, zal hij, geplant zijnde, gedijen? Zal hij niet, als de oostenwind hem aanraakt, helemaal verdrogen? Op de bedden waar hij groeide zal hij verdrogen.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Jer 9:17": "Zo zegt de HEERE van de heerscharen: Let hierop, en roept klaagvrouwen, dat zij komen; en zendt heen naar de wijze vrouwen, dat zij komen.", "2 Kron 36:10": "En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem.", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Hos 13:15": "Want hij zal vrucht voortbrengen onder de broeders; toch zal er een oostenwind komen, een wind van de Heere, opkomend uit de woestijn; en zijn bron zal uitdrogen, die zal de schat van alle kostbare voorwerpen roven.", "Ezech 26:17": "En zij zullen een klaaglied over u opheffen, en tot u zeggen: Hoe bent u uit de zeeën vergaan, u welbewoonde, u beroemde stad, die sterk geweest is ter zee, zij en haar inwoners; die hun schrik gaven aan allen die in haar woonden!", "Hos 3:4": "Want de kinderen van Israël zullen veel dagen blijven zitten, zonder koning, en zonder vorst, en zonder offer, en zonder opgericht beeld, en zonder efod en terafim.", "Ps 80:18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Ezech 21:10": "Het is gescherpt, opdat het een slachting slacht; het is gepolijst, opdat het glinstert; zullen wij dan vrolijk zijn? Het is de roede van Mijn Zoon, die alle hout omzet.", "Ps 63:2": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water.", "Ezech 15:2-8": "Mensenkind, wat is het hout van de wijnstok meer dan alle hout, of de wijnrank meer dan dat onder het hout van een woud is? Wordt daarvan hout genomen, om een stuk werk te maken? Neemt men daarvan een pin, om er enig vat aan te hangen? Zie, het wordt aan het vuur overgegeven, opdat het verteerd wordt; het vuur verteert beide einden ervan, en het middelste ervan wordt verbrand; zou het deugen tot een stuk van het werk?", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Num 24:7-9": "Er zal water uit zijn emmers vloeien, en zijn nageslacht zal in veel water zijn; en zijn koning zal boven Agag verheven worden, en zijn koninkrijk zal verhoogd worden. God heeft hem uit Egypte uitgevoerd; zijn kracht is als die van een eenhoorn; hij zal de heidenvolken, zijn vijanden, verteren, en hun beenderen breken, en met zijn pijlen doorschieten. Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "Ezech 21:13": "Als er beproeving was, wat was het dan? Zou er dan ook geen roede zijn die alles omzet, spreekt de Heere HEERE.", "Ps 79:7": "Want men heeft Jakob opgegeten, en zij hebben zijn liefelijke woning verwoest.", "Ezech 22:25": "De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Ezech 32:18": "Mensenkind! Weeklaag over de menigte van Egypte, en laat haar neerdalen, (haar en de dochters van de prachtige heidenvolken) naar de onderste plaatsen van de aarde, bij hen die in het kuil zijn neergedaald.", "Klaagl 5:12": "De vorsten zijn door hun hand opgehangen; de gezichten van de oudsten zijn niet geëerd geweest.", "Dan 4:20": "De boom, die u gezien hebt, die groot en sterk geworden was, en wiens hoogte tot aan de hemel reikte, en die over het hele aardrijk gezien werd;", "Jes 5:6": "En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "Ezech 19:10-14": "Uw moeder was als een wijnstok in uw bloed, geplant bij water; hij was vruchtbaar en vol ranken vanwege veel water. En hij had sterke takken tot scepters voor heersers, en de stam van elke tak werd hoog tussen de dichte takken; en hij werd gezien door zijn hoogte, met de menigte van zijn takken. Maar hij werd in grimmigheid uitgerukt, en ter aarde geworpen, en de oostenwind heeft zijn vrucht verdroogd; zijn sterke takken zijn afgebroken en verdroogd; het vuur heeft ze verteerd.", "2 Kron 36:2": "Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem.", "Gen 42:19": "Als u eerlijke mensen bent, laat dan één van uw broers gebonden blijven in het huis waar u gevangen zit; en gaat u heen, breng het koren voor de honger van uw huizen.", "2 Kon 24:1-6": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem. En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten. Zeker gebeurde dit op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "2 Kon 23:30": "En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader.", "Ps 89:26-30": "En Ik zal zijn hand in de zee zetten, en zijn rechterhand in de rivieren. Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil! Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "2 Kon 24:20": "Want het gebeurde, vanwege de toorn van de HEERE tegen Jeruzalem en tegen Juda, totdat Hij hen van Zijn aangezicht weggeworpen had. En Zedekia kwam in opstand tegen de koning van Babel.", "Jes 5:1-4": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Micha 1:2": "Hoort, u volken allemaal! Merk op, u aarde, alsook van die volheid! De Heere HEERE nu zal tot een getuige zijn tegen u, de Heere uit de tempel van Zijn heiligheid.", "Neh 9:37": "En het vermeerdert zijn opbrengst voor de koningen, die U over ons gesteld hebt, om onze zonden; en zij heersen over onze lichamen en over onze dieren, naar hun welgevallen; zo zijn wij in grote benauwdheid.", "Ezech 21:25-27": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid; Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is. Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "Jes 27:11": "Als haar takken verdord zijn, zullen ze afgebroken worden, en de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.", "Ezech 2:10": "En Hij spreidde die voor mijn gezicht uit; en zij was beschreven vóór en achter; en daarin waren klaagliederen geschreven, en gezucht, en wee.", "Ezech 17:6": "En het sproot uit, en werd een welig uitlopende wijnstok, doch nederig van stam, terwijl hij met zijn takken naar hem toe keek, omdat zijn wortels onder hem waren. Zo werd hij tot een wijnstok, die ranken voortbracht en scheuten uitwierp.", "Rom 9:2-4": "dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees; die Israëlieten zijn, van wie de aanneming tot kinderen is, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloften;", "Jes 11:6-9": "En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven. De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os. En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "Jer 22:13-17": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft! Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie. Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Ezech 20:48": "En alle vlees zal zien dat Ik, de HEERE, dat heb aangestoken; het zal niet uitgeblust worden.", "Jer 22:19": "Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem.", "Ps 58:7": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE!", "Ps 80:17": "Hij is met vuur verbrand; hij is afgehouwen; zij komen om van het schelden van Uw aangezicht.", "Jer 22:18": "Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit!", "Jer 24:1": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht.", "2 Kron 36:13": "Daarbij werd hij ook afvallig tegen koning Nebukadnezar, die hem bij God had beëdigd; en hij verhardde zijn nek, en verstokte zijn hart, zodat hij zich niet bekeerde tot de HEERE, de God van Israël.", "Mark 6:17": "Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had.", "Klaagl 4:20": "Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; van wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!", "Spr 28:15": "De goddeloze, heersend over een arm volk, is een brullende leeuw, en een beer, die heen en weer rondloopt.", "2 Kron 36:3": "Want de koning van Egypte zette hem af te Jeruzalem, en hij legde het land een boete op van honderd talenten zilver en een talent goud.", "Ps 80:9-15": "U hebt een wijnstok uit Egypte overgebracht, hebt de heidenen verdreven, en hebt hem geplant; U hebt de plaats voor hem bereid, en zijn wortels doen inwortelen, zodat hij het land vervuld heeft. De bergen zijn met zijn schaduw bedekt geweest, en zijn ranken waren als cederbomen van God.", "Spr 28:3": "Een arme man, die de geringen verdrukt, is een wegvagende regen, zodat er geen brood is.", "Jer 9:18": "En zich haasten, en een klaagzang over ons aanheffen, zodat onze ogen van tranen neerdalen, en onze oogleden van water druipen.", "Jer 24:8": "En zoals de slechte vijgen, die vanwege de slechtheid niet gegeten kunnen worden (want zo zegt de HEERE), zo zal Ik Zedekia, de koning van Juda, maken, alsook zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in het land Egypte wonen;", "Dan 4:11": "De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde;", "2 Kon 24:12": "Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "Ezech 32:16": "Dat is het klaaglied, en dat zullen zij klagend zingen; de dochters van de heidenvolken zullen het klagend zingen; zij zullen het klagend zingen over Egypte en over haar hele menigte, spreekt de Heere HEERE.", "Jer 22:11": "Want zo zegt de HEERE van Sallum, de zoon van Josia, koning van Juda, die in de plaats van zijn vader Josia regeerde, die uit deze plaats is weggegaan: Hij zal daar nooit meer terugkomen.", "Hos 2:2": "Anders zal Ik ze naakt uitkleden, en haar neerzetten als op de dag dat zij geboren werd; ja, Ik zal haar maken als een woestijn, en haar neerzetten als een dor land, en haar doden door dorst;", "Joh 15:1-5": "Ik ben de ware Wijnstok, en Mijn Vader is de Landman. Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt. U bent nu rein om het woord dat Ik tot u gesproken heb.", "Num 24:6": "Als beken breiden zij zich uit, als tuinen aan de rivieren; als sandelbomen die de HEERE geplant heeft, als cederbomen aan het water.", "Jer 22:10-12": "Ween niet over de dode, en beklaag hem niet; ween vrij over hem die weggegaan is, want hij zal nooit meer terugkomen om het land van zijn geboorte te zien. Want zo zegt de HEERE van Sallum, de zoon van Josia, koning van Juda, die in de plaats van zijn vader Josia regeerde, die uit deze plaats is weggegaan: Hij zal daar nooit meer terugkomen. Maar op de plaats waarheen zij hem gevangen hebben weggevoerd, zal hij sterven, en dit land zal hij niet meer zien.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "2 Kron 36:6": "Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "2 Kron 36:5": "Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Jer 38:23": "Zij zullen dan al uw vrouwen en al uw zonen naar de Chaldeeën uitvoeren; ook zult u zelf uit hun hand niet ontkomen; maar u zult door de hand van de koning van Babel gegrepen worden, en u zult deze stad met vuur verbranden.", "Ezech 12:19": "En u zult tegen het volk van het land zeggen: Zo zegt de Heere HEERE, over de inwoners van Jeruzalem, in het land Israël: Zij zullen hun brood met bezorgdheid eten, en hun water zullen zij met ontzetting drinken, omdat hun land woest zal worden en zijn overvloed zal verliezen, vanwege het geweld van allen die daarin wonen;", "Zach 11:3": "Er is een stem van het gehuil van de herders, omdat hun heerlijkheid verwoest is; een stem van het gebrul van de jonge leeuwen, omdat de hoogmoed van de Jordaan verwoest is.", "Zef 3:1-4": "Wee de smerige, en de bevlekte, de onderdrukkende stad! Zij hoort niet naar de stem; zij neemt de tucht niet aan; zij vertrouwt niet op de HEERE; tot haar God nadert zij niet. Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "2 Kon 24:1-7": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem. En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten. Zeker gebeurde dit op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "Ps 80:13": "Waarom hebt U zijn muren doorgebroken, zodat allen die de weg voorbijgaan, hem plukken?", "Ezra 5:11": "En zij hebben ons zo'n antwoord teruggegeven en zeiden: Wij zijn knechten van de God van de hemel en van de aarde, en wij bouwen het huis dat vele jaren voor dezen gebouwd is geweest; want een groot koning van Israël had het gebouwd en voltooid.", "Jer 36:1-32": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam: Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag. Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "Job 4:11": "De oude leeuw vergaat, omdat er geen prooi is, en de jongen van een oude leeuwin worden verstrooid.", "Deut 8:7": "Want de HEERE, uw God, brengt u in een goed land, een land van waterbeken, bronnen en diepe wateren, die in dalen en op bergen ontspringen;", "Ezech 17:18-20": "Want hij heeft de eed veracht, door het verbond te breken, terwijl hij, zie, zijn hand gegeven had; omdat hij al deze dingen gedaan heeft, zal hij niet ontkomen. Daarom, zo zegt de Heere HEERE: Zo waarachtig als Ik leef, Ik zal Mijn eed, die hij veracht heeft, en Mijn verbond, dat hij gebroken heeft, op zijn hoofd geven! En Ik zal Mijn net over hem uitspreiden, zodat hij gegrepen zal worden in Mijn jachtnet; en Ik zal hem naar Babel laten brengen, en zal daar met hem in het gericht gaan over zijn overtreding, waarmee hij tegen Mij overtreden heeft.", "Jer 22:28": "Is dan deze man Chonia een veracht, verbrijzeld afgodsbeeld? Of is hij een vat waaraan men geen lust heeft? Waarom zijn hij en zijn nageslacht weggeworpen, ja, weggeworpen in een land dat zij niet kennen?", "Jer 26:1-24": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei: Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af. Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Ezech 27:2": "U dan, mensenkind! Hef een klaaglied op over Tyrus;", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Ps 80:14": "Het zwijn uit het woud heeft hem uitgewroet, en het wild van het veld heeft hem afgeweid.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Dan 4:21": "En wiens loof mooi, en wiens vruchten veel waren, en waaraan voedsel was voor allen, onder wie het gedierte van het veld woonde, en in wiens takken de vogels van de hemel nestelden;", "Deut 28:47": "Omdat u de HEERE, uw God, niet gediend hebt met vreugde en blijdschap van hart, vanwege de overvloed van alles;", "Nahum 2:12": "De leeuw, die genoeg roofde voor zijn welpen, en worgde voor zijn oude leeuwinnen, die zijn holen vervulde met roof, en zijn woningen met het geroofde.", "Ezech 30:12": "En Ik zal de rivieren tot droogte maken, en het land verkopen in de hand van de bozen; en Ik zal het land met alles wat erin is verwoesten door de hand van vreemden: Ik, de HEERE, heb het gesproken.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Ezech 15:2": "Mensenkind, wat is het hout van de wijnstok meer dan alle hout, of de wijnrank meer dan dat onder het hout van een woud is?", "Spr 28:16": "Een vorst, die alle verstand mist, is ook zeer onderdrukkend; maar wie de hebzucht haat, zal de dagen verlengen.", "Ezech 12:13": "Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven.", "Ps 80:9-12": "U hebt een wijnstok uit Egypte overgebracht, hebt de heidenen verdreven, en hebt hem geplant; U hebt de plaats voor hem bereid, en zijn wortels doen inwortelen, zodat hij het land vervuld heeft. De bergen zijn met zijn schaduw bedekt geweest, en zijn ranken waren als cederbomen van God.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Jer 22:25-27": "En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën. En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven. En naar het land waar zij met heel hun ziel naar verlangen om daar terug te komen, daarheen zullen zij niet terugkomen.", "Deut 28:48": "Zo zult u uw vijanden, die de HEERE tegen u zenden zal, dienen, in honger en in dorst, en in naaktheid, en in gebrek aan alles; en Hij zal een ijzeren juk op uw hals leggen, totdat Hij u verdelgt.", "Jer 52:10": "En de koning van Babel slachtte de zonen van Zedekia voor zijn ogen; en hij slachtte ook al de vorsten van Juda te Ribla.", "Jer 13:18": "Zeg tegen de koning en tegen de koningin: Vernedert u, gaat zitten; want uw hele hoofdsieraad, de kroon van uw heerlijkheid, is neergedaald.", "Hos 10:3": "Want nu zullen zij zeggen: Wij hebben geen koning; want wij hebben de Heere niet gevreesd; wat zou een koning dan voor ons doen?", "Nahum 2:11": "Waar is nu de woning van de leeuwen, en die weide van de jonge leeuwen? Waar de leeuw, de oude leeuw, en het leeuwenwelp wandelde, en er was niemand die hen schrik aanjoeg.", "2 Kon 25:7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Ezech 15:4": "Zie, het wordt aan het vuur overgegeven, opdat het verteerd wordt; het vuur verteert beide einden ervan, en het middelste ervan wordt verbrand; zou het deugen tot een stuk van het werk?", "2 Kron 36:1": "Toen nam het volk van het land Joahaz, de zoon van Josia, en zij maakten hem koning in de plaats van zijn vader, te Jeruzalem.", "2 Kron 36:4": "En de koning van Egypte maakte zijn broer Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broer Joahaz nam Necho mee, en bracht hem naar Egypte.", "Jer 22:30": "Zo zegt de HEERE: Schrijf deze man op als kinderloos, een man die niet voorspoedig zal zijn in zijn dagen; want niemand van zijn nageslacht zal voorspoedig zijn, zittend op de troon van David, en nog heersend in Juda.", "Spr 19:12": "De gramschap van de koning is als het gebrul van een jonge leeuw; maar zijn welgevallen is als dauw op het gras."}, "noten": {"1": "SV: hij bekende. D.i.: hij had gemeenschap met (in de zin van: hij maakte zich meester van / doorzocht) zijn weduwen; de leeuw kende hun holen/burchten."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5375\">Verder</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H5375\">hef</span> u <span class=\"wl\" data-l=\"L2\" data-code=\"H7015\">een</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7015\">weeklage</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7015\">op</span> over <span class=\"wl\" data-l=\"L3\" data-code=\"H5387\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5387\">vorsten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5387\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">Israël</span>,", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H559\">zeg</span>: <span class=\"wl\" data-l=\"L2\" data-code=\"H517\">Wat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H517\">was</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H517\">uw</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H517\">moeder</span>? <span class=\"wl\" data-l=\"L2\" data-code= /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.

async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],

).join('');

function paneelInhoud(n, tab) {

    let h = '<div class="verg-kop">Vertalingen</div>';

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

  }

    const engels = D.tsk_kjv[n];

  }

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

  const knoop = nd => {

    const kids = nd.kinderen && nd.kinderen.length ?

}

    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
