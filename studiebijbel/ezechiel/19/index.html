 was uw moeder? Een leeuwin, onder de leeuwen nederliggende; zij bracht haar welpen op in het midden der jonge leeuwen.","3":"Zij toog nu een van haar welpen op; het werd een jonge leeuw, die leerde roof te roven, hij at mensen op.","4":"Dit hoorden de volken van hem, hij werd gegrepen in hun groeve; en zij brachten hem met haken naar Egypteland.","5":"Zij nu ziende, dat zij in hope was geweest, *doch* haar verwachting verloren was, zo nam zij een *ander* van haar welpen, hetwelk zij *tot* een jongen leeuw stelde.","6":"Deze wandelde steeds onder de leeuwen, werd een jonge leeuw, en leerde roof te roven, hij at mensen op.","7":"Hij bekende zijn weduwen, en hij verwoestte hun steden; zodat het land en zijn volheid ontzet werd van de stem zijner brulling.","8":"Toen begaven zich de volken tegen hem rondom uit de landschappen, en zij spreidden hun net over hem uit; in hun groeve werd hij gegrepen.","9":"En zij stelden hem in gesloten bewaring met haken, opdat zij hem brachten tot den koning van Babel; zij brachten hem in vestingen, opdat zijn stem niet meer gehoord wierde op de bergen Israëls.","10":"Uw moeder was als een wijnstok in uw stilheid, geplant bij wateren; hij was vruchtbaar en vol ranken vanwege vele wateren.","11":"En hij had sterke roeden tot scepteren der heersers, en de stam van elke *roede* werd hoog tussen de dichte takken; en hij werd gezien door zijn hoogte, met de menigte zijner takken.","12":"Maar hij werd door grimmigheid uitgerukt, *en* ter aarde geworpen, en de oostenwind heeft zijn vrucht verdroogd; zijn sterke roeden zijn afgebroken en zijn verdroogd; het vuur heeft ze verteerd.","13":"En nu is hij geplant in een woestijn, in een dor en dorstig land.","14":"Daartoe is een vuur uitgegaan uit een roede zijner ranken, *dat* zijn vrucht verteerd heeft; zodat aan hem geen sterke roede is *tot* een scepter, om te heersen. Dit is een weeklage, en is tot een weeklage geworden."},"KJV":{"1":"Moreover take thou up a lamentation for the princes of Israel,","2":"And say, What *is* thy mother? A lioness: she lay down among lions, she nourished her whelps among young lions.","3":"And she brought up one of her whelps: it became a young lion, and it learned to catch the prey; it devoured men.","4":"The nations also heard of him; he was taken in their pit, and they brought him with chains unto the land of Egypt.","5":"Now when she saw that she had waited, *and* her hope was lost, then she took another of her whelps, *and* made him a young lion.","6":"And he went up and down among the lions, he became a young lion, and learned to catch the prey, *and* devoured men.","7":"And he knew their desolate palaces, and he laid waste their cities; and the land was desolate, and the fulness thereof, by the noise of his roaring.","8":"Then the nations set against him on every side from the provinces, and spread their net over him: he was taken in their pit.","9":"And they put him in ward in chains, and brought him to the king of Babylon: they brought him into holds, that his voice should no more be heard upon the mountains of Israel.","10":"Thy mother *is* like a vine in thy blood, planted by the waters: she was fruitful and full of branches by reason of many waters.","11":"And she had strong rods for the sceptres of them that bare rule, and her stature was exalted among the thick branches, and she appeared in her height with the multitude of her branches.","12":"But she was plucked up in fury, she was cast down to the ground, and the east wind dried up her fruit: her strong rods were broken and withered; the fire consumed","13":"And now she *is* planted in the wilderness, in a dry and thirsty ground.","14":"And fire is gone out of a rod of her branches, *which* hath devoured her fruit, so that she hath no strong rod *to be* a sceptre to rule. This *is* a lamentation, and shall be for a lamentation."}},"tsk":{"1":[{"kopje":"hef","refs":["Ezech 19:14","Ezech 2:10","Ezech 26:17","Ezech 27:2","Ezech 32:16","Ezech 32:18","Jer 9:1","Jer ode=\"H7015\">een</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H7015\">weeklage</span> geworden."},"koppeling_kjv":{"1":"Moreover take thou <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H7015\">lamentation</span> for the <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> of Israel,","2":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> What is thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother?</span> A <span class=\"wl wl-kjv\" data-code=\"H3833\">lioness:</span> she lay <span class=\"wl wl-kjv\" data-code=\"H7257\">down</span> among <span class=\"wl wl-kjv\" data-code=\"H738\">lions,</span> she <span class=\"wl wl-kjv\" data-code=\"H7235\">nourished</span> her <span class=\"wl wl-kjv\" data-code=\"H1482\">whelps</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> young lions.","3":"And she brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of her <span class=\"wl wl-kjv\" data-code=\"H1482\">whelps:</span> it became a young <span class=\"wl wl-kjv\" data-code=\"H3715\">lion,</span> and it <span class=\"wl wl-kjv\" data-code=\"H3925\">learned</span> to <span class=\"wl wl-kjv\" data-code=\"H2963\">catch</span> the <span class=\"wl wl-kjv\" data-code=\"H2964\">prey;</span> it <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> men.","4":"The <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> also <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of him; he was <span class=\"wl wl-kjv\" data-code=\"H8610\">taken</span> in their <span class=\"wl wl-kjv\" data-code=\"H7845\">pit,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him with <span class=\"wl wl-kjv\" data-code=\"H2397\">chains</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","5":"Now when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that she had <span class=\"wl wl-kjv\" data-code=\"H3176\">waited,</span> and her <span class=\"wl wl-kjv\" data-code=\"H8615\">hope</span> was <span class=\"wl wl-kjv\" data-code=\"H6\">lost,</span> then she <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> of her <span class=\"wl wl-kjv\" data-code=\"H1482\">whelps,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> him a young lion.","6":"And he went up and <span class=\"wl wl-kjv\" data-code=\"H1980\">down</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H738\">lions,</span> he became a young <span class=\"wl wl-kjv\" data-code=\"H3715\">lion,</span> and <span class=\"wl wl-kjv\" data-code=\"H3925\">learned</span> to <span class=\"wl wl-kjv\" data-code=\"H2963\">catch</span> the <span class=\"wl wl-kjv\" data-code=\"H2964\">prey,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> men.","7":"And he <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> their desolate <span class=\"wl wl-kjv\" data-code=\"H490\">palaces,</span> and he laid <span class=\"wl wl-kjv\" data-code=\"H2717\">waste</span> their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities;</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> was <span class=\"wl wl-kjv\" data-code=\"H3456\">desolate,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4393\">fulness</span> thereof, by the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of his roaring.","8":"Then the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> against him on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side</span> from the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> their <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> over him: he was <span class=\"wl wl-kjv\" data-code=\"H8610\">taken</span> in their pit.","9":"And they <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> him in <span class=\"wl wl-kjv\" data-code=\"H5474\">ward</span> in <span class=\"wl wl-kjv\" data-code=\"H2397\">chains,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon:</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him into <span class=\"wl wl-kjv\" data-code=\"H4685\">holds,</span> that his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> should no more be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of Israel.","10":"Thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> is like a <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> <span class=\"wl wl-kjv\" data-code=\"H8362\">planted</span> by the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters:</span> she was <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful</span> and full of <span class=\"wl wl-kjv\" data-code=\"H6058\">branches</span> by reason of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> waters.","11":"And she had <span class=\"wl wl-kjv\" data-code=\"H5797\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4294\">rods</span> for the <span class=\"wl wl-kjv\" data-code=\"H7626\">sceptres</span> of them that bare <span class=\"wl wl-kjv\" data-code=\"H4910\">rule,</span> and her <span class=\"wl wl-kjv\" data-code=\"H6967\">stature</span> was <span class=\"wl wl-kjv\" data-code=\"H1361\">exalted</span> among the thick <span class=\"wl wl-kjv\" data-code=\"H5688\">branches,</span> and she <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> in her <span class=\"wl wl-kjv\" data-code=\"H1363\">height</span> with the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of her branches.","12":"But she was plucked <span class=\"wl wl-kjv\" data-code=\"H5428\">up</span> in <span class=\"wl wl-kjv\" data-code=\"H2534\">fury,</span> she was cast <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6921\">east</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up</span> her <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit:</span> her <span class=\"wl wl-kjv\" data-code=\"H5797\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4294\">rods</span> were <span class=\"wl wl-kjv\" data-code=\"H6561\">broken</span> and <span class=\"wl wl-kjv\" data-code=\"H3001\">withered;</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> consumed","13":"And now she is <span class=\"wl wl-kjv\" data-code=\"H8362\">planted</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> in a <span class=\"wl wl-kjv\" data-code=\"H6723\">dry</span> and <span class=\"wl wl-kjv\" data-code=\"H6772\">thirsty</span> ground.","14":"And <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> is gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of a <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> of her <span class=\"wl wl-kjv\" data-code=\"H905\">branches,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> her <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit,</span> so that she hath no <span class=\"wl wl-kjv\" data-code=\"H5797\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> to be a <span class=\"wl wl-kjv\" data-code=\"H7626\">sceptre</span> to <span class=\"wl wl-kjv\" data-code=\"H4910\">rule.</span> This is a <span class=\"wl wl-kjv\" data-code=\"H7015\">lamentation,</span> and shall be for a lamentation."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
