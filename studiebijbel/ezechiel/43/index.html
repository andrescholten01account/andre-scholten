.","2":"En zie, de heerlijkheid van de God van Israël kwam van de weg naar het oosten; en Zijn stem was als het geruis van veel water, en de aarde werd verlicht van Zijn heerlijkheid.","3":"En zo was de gedaante van het gezicht dat ik zag, gelijk het gezicht dat ik gezien had toen ik kwam om de stad te verderven; en het waren gezichten als het gezicht dat ik gezien had aan de rivier Chebar; en ik viel op mijn aangezicht.","4":"En de heerlijkheid van de HEERE kwam in het huis, *door* de weg van de poort die de weg naar het oosten ziet.","5":"En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.","6":"En ik hoorde Een, Die met mij sprak, uit het huis; en de man was bij mij, staande.","7":"En Hij zei tegen mij: Mensenkind! *dit* is de plaats van Mijn troon, en de plaats van de zolen van Mijn voeten, waar Ik wonen zal in het midden van de kinderen van Israël, in eeuwigheid; en zij van het huis van Israël zullen Mijn heilige Naam niet meer verontreinigen, zij noch hun koningen, met hun hoererij en met de dode lichamen van hun koningen, *op* hun hoogten;","8":"Als zij hun drempel stelden aan Mijn drempel, en hun post naast Mijn post, zodat er *maar* een wand tussen Mij en tussen hen was, en verontreinigden Mijn heilige Naam met hun gruwelen die zij deden; daarom heb Ik ze verteerd in Mijn toorn.","9":"Nu zullen zij hun hoererij en de dode lichamen van hun koningen ver van Mij wegdoen; en Ik zal in het midden van hen wonen in eeuwigheid.","10":"U, mensenkind, wijs het huis van Israël dit huis, opdat zij schaamrood worden vanwege hun ongerechtigheden, en laat ze het patroon afmeten.","11":"En indien zij schaamrood worden vanwege alles wat zij gedaan hebben, maak hun dan bekend de vorm van het huis, en zijn gestalte, en zijn uitgangen, en zijn ingangen, en al zijn vormen, en al zijn ordinantiën, ja, al zijn vormen en al zijn wetten; en schrijf het voor hun ogen, opdat zij zijn hele vorm en al zijn ordinantiën bewaren, en die doen.","12":"Dit is de wet van het huis: op de top van de berg zal zijn hele grens, rondom heen, een allerheiligst gebied zijn; zie, dit is de wet van het huis.","13":"En dit zijn de maten van het altaar naar de ellen, waarbij de el een el en een handbreed is; de voet van een el, en een el de breedte; en zijn rand aan zijn zoom rondom een span; en dit is de rug van het altaar.","14":"Van de voet nu *op* de aarde tot aan de onderste rand, twee ellen; en de breedte een el; en van de kleinste rand tot aan de grootste rand, vier ellen, en de breedte een el.","15":"En de Harel vier ellen; en van de Ariël verder opwaarts, de vier hoorns.","16":"De Ariël nu, twaalf ellen de lengte, met twaalf ellen breedte, vierkant aan zijn vier zijden.","17":"En de rand veertien ellen de lengte, met veertien ellen breedte, aan zijn vier zijden, en de zoom rondom, de helft van een el; en de voet daaraan, een el rondom; en zijn trappen ziende naar het oosten.","18":"En Hij zei tegen mij: Mensenkind! zo zegt de Heere HEERE: Dit zijn de ordinantiën van het altaar, ten dage dat men het zal maken, om brandoffers daarop te offeren, en om bloed daarop te sprenkelen.","19":"En u zult aan de Levitische priesters, die uit het nageslacht van Zadok zijn, die tot Mij naderen (spreekt de Heere HEERE), om Mij te dienen, geven een var, een jong rund, tot een zondoffer.","20":"En u zult van diens bloed nemen, en het doen aan zijn vier hoorns, en aan de vier hoeken van de rand, en aan de zoom rondom; zo zult u het ontzondigen[1], en het verzoenen.","21":"Daarna zult u de var van het zondoffer nemen; en hij zal hem verbranden op een bestelde plaats van het huis, buiten het heiligdom.","22":"En op de tweede dag zult u een volkomen geitenbok offeren tot een zondoffer; en zij zullen het altaar ontzondigen, zoals zij het ontzondigd hebben met de var.","23":"Als u een einde zult gemaakt hebben van het ontzondigen, *dan* zult u een var, een volkomen jong rund, offeren, en een volkomen ram van de kudde.","24":"En u zult ze offeren voor het aangezicht van de HEERE; en de priesters zullen zout daarop werpen, en zullen ze offeren *tot* brandoffer aan de HEERE.","25":"Zeven dagen zult u dagelijks een bok van het zondoffer bereiden; ook zullen zij een var, een jong rund, en een ram van de kudde, *beide* volkomen bereiden.","26":"Zeven dagen zullen zij het altaar verzoenen, en het reinigen, en zijn handen vullen.","27":"Als zij nu deze dagen zullen voleind hebben, dan zal het op de achtste dag en vervolgens gebeuren, dat de priesters uw brandoffers en uw dankoffers op het altaar zullen bereiden; en Ik zal een welgevallen aan u hebben, spreekt de Heere HEERE."},"SV":{"1":"Toen leidde hij mij tot de poort, de poort, die den weg naar het oosten zag.","2":"En ziet, de heerlijkheid des Gods van Israël kwam van den weg naar het oosten; en Zijn stem was als het geruis van vele wateren, en de aarde werd verlicht van Zijn heerlijkheid.","3":"En alzo was de gedaante van het gezicht, dat ik zag, gelijk het gezicht, dat ik gezien had, toen ik kwam, om de stad te verderven; en het waren gezichten, als het gezicht, dat ik gezien had aan de rivier Chebar; en ik viel op mijn aangezicht.","4":"En de heerlijkheid des HEEREN kwam in het huis, *door* den weg der poort, die den weg naar het oosten zag.","5":"En de Geest nam mij op, en bracht mij in het binnenste voorhof; en ziet, de heerlijkheid des HEEREN had het huis vervuld.","6":"En ik hoorde Een, Die met mij sprak, uit het huis; en de man was bij mij, staande.","7":"En Hij zeide tot mij: Mensenkind! *dit* is de plaats Mijns troons, en de plaats der zolen Mijner voeten, alwaar Ik wonen zal in het midden der kinderen Israëls, in eeuwigheid; en die van het huis Israëls zullen Mijn heiligen Naam niet meer verontreinigen, zij noch hun koningen, met hun hoererij en met de dode lichamen hunner koningen, *op* hun hoogten;","8":"Als zij hun dorpel stelden aan Mijn dorpel, en hun post nevens Mijn post, dat er *maar* een wand tussen Mij en tussen hen was, en verontreinigden Mijn heiligen Naam met hun gruwelen, die zij deden; waarom Ik ze verteerd heb in Mijn toorn.","9":"Nu zullen zij hun hoererij en de dode lichamen hunner koningen verre van Mij wegdoen; en Ik zal in het midden van hen wonen in eeuwigheid.","10":"Gij mensenkind; wijs den huize Israëls dit huis, opdat zij schaamrood worden vanwege hun ongerechtigheden, en laat ze het patroon afmeten.","11":"En indien zij schaamrood worden vanwege alles, wat zij gedaan hebben, zo maak hun bekend den vorm van het huis, en zijn gestaltenis, en zijn uitgangen, en zijn ingangen, en al zijn vormen, en al zijn ordinantien, ja, al zijn vormen en al zijn wetten; en schrijf het voor hun ogen, opdat zij zijn gansen vorm en al zijn ordinantien bewaren, en dezelve doen.","12":"Dit is de wet van het huis: op de hoogte des bergs zal zijn ganse grens, rondom henen, een heiligheid der heiligheden zijn; ziet, dit is de wet van het huis.","13":"En dit zijn de maten des altaars naar de ellen, zijnde de el een el en een handbreed; de boezem van een el, en een el de breedte; en zijn einde aan zijn rand rondom een span; en dit is de rug des altaars.","14":"Van den boezem nu *op* de aarde tot aan het onderste afzetsel, twee ellen; en de breedte een el; en van het kleinste afzetsel tot aan het grootste afzetsel, vier ellen, en de breedte een el.","15":"En de Harel vier ellen; en van den Ariël voorts opwaarts, de vier hoornen.","16":"De Ariël nu, twaalf *ellen* de lengte, met twaalf *ellen* breedte, vierkant aan zijn vier zijden.","17":"En het afzetsel veertien *ellen* de lengte, met veertien *ellen* breedte, aan zijn vier zijden, en de rand rondom hetzelve, de helft ener el; en de boezem daaraan, een el rondom; en zijn trappen ziende naar het oosten.","18":"En Hij zeide tot mij: Mensenkind! zo zegt de Heere HEERE: Dit zijn de ordinantien des altaars, ten dage als men het zal maken, om brandoffer daarop te offeren, en om bloed daarop te sprengen.","19":"En gij zult aan de Levietische priesteren, dewelke uit het zaad van Zadok zijn, die tot Mij naderen ( spreekt de Heere HEERE), om Mij te dienen, geven een var, een jong rund, ten zondoffer.","20":"En gij zult van deszelfs bloed nemen, en doen het aan zijn vier hoornen, en aan de vier hoeken der afzetsels, en aan den rand rondom; alzo zult gij het ontzondigen, en het verzoenen.","21":"Daarna zult gij den var des zondoffers nemen; en hij zal hem verbranden in een bestelde plaats van het huis buiten het heiligdom.","22":"En op den tweeden dag zult gij een volkomen geitenbok offeren ten zondoffer; en zij zullen het altaar ontzondigen, gelijk als zij *dat* ontzondigd hebben met den var.","23":"Als gij een einde zult gemaakt hebben van het ontzondigen, *dan* zult gij een var, een volkomen jong rund, offeren, en een volkomen ram van de kudde.","24":"En gij zult ze offeren voor het aangezicht des HEEREN; en de priesteren zullen zout daarop werpen, en zullen ze offeren *ten* brandoffer den HEERE.","25":"Zeven dagen zult gij dagelijks een bok des zondoffers bereiden; ook zullen zij een var, een jong rund, en een ram van de kudde, *beide* volkomen bereiden.","26":"Zeven dagen zullen zij het altaar verzoenen, en het reinigen, en zijn handen vullen.","27":"Als zij nu deze dagen zullen voleind hebben, dan zal het op den achtsten dag en voortaan geschieden, dat de priesters uw brandofferen en uw dankofferen op het altaar zullen bereiden; en Ik zal een welgevallen aan ulieden hebben, spreekt de Heere HEERE."},"KJV":{"1":"Afterward he brought me to the gate, *even* the gate that looketh toward the east:","2":"And, behold, the glory of the God of Israel came from the way of the east: and his voice *was* like a noise of many waters: and the earth shined with his glory.","3":"And *it was* according to the appearance of the vision which I saw, *even* according to the vision that I saw when I came to destroy the city: and the visions *were* like the vision that I saw by the river Chebar; and I fell upon my face.","4":"And the glory of the LORD came into the house by the way of the gate whose prospect *is* toward the east.","5":"So the spirit took me up, and brought me into the inner court; and, behold, the glory of the LORD filled the house.","6":"And I heard *him* speaking unto me out of the house; and the man stood by me.","7":"And he said unto me, Son of man, the place of my throne, and the place of the soles of my feet, where I will dwell in the midst of the children of Israel for ever, and my holy name, shall the house of Israel no more defile, *neither* they, nor their kings, by their whoredom, nor by the carcases of their kings in their high places.","8":"In their setting of their threshold by my thresholds, and their post by my posts, and the wall between me and them, they have even defiled my holy name by their abominations that they have committed: wherefore I have consumed them in mine anger.","9":"Now let them put away their whoredom, and the carcases of their kings, far from me, and I will dwell in the midst of them for ever.","10":"Thou son of man, shew the house to the house of Israel, that they may be ashamed of their iniquities: and let them measure the pattern.","11":"And if they be ashamed of all that they have done, shew them the form of the house, and the fashion thereof, and the goings out thereof, and the comings in thereof, and all the forms thereof, and all the ordinances thereof, and all the forms thereof, and all the laws thereof: and write *it* in their sight, that they may keep the whole form thereof, and all the ordinances thereof, and do","12":"This *is* the law of the house; Upon the top of the mountain the whole limit thereof round about *shall be* most holy. Behold, this *is* the law of the house.","13":"And these *are* the measures of the altar after the cubits: The cubit *is* a cubit and an hand breadth; even the bottom *shall be* a cubit, and the breadth a cubit, and the border thereof by the edge thereof round about *shall be* a span: and this *shall be* the higher place of the altar.","14":"And from the bottom *upon* the ground *even* to the lower settle *shall be* two cubits, and the breadth one cubit; and from the lesser settle *even* to the greater settle *shall be* four cubits, and the breadth *one* cubit.","15":"So the altar *shall be* four cubits; and from the altar and upward *shall be* four horns.","16":"And the altar *shall be* twelve *cubits* long, twelve broad, square in the four squares","17":"And the settle *shall be* fourteen *cubits* long and fourteen broad in the four squares thereof; and the border about it *shall be* half a cubit; and the bottom thereof *shall be* a cubit about; and his stairs shall look toward the east.","18":"And he said unto me, Son of man, thus saith the Lord GOD; These *are* the ordinances of the altar in the day when they shall make it, to offer burnt offerings thereon, and to sprinkle blood","19":"And thou shalt give to the priests the Levites that be of the seed of Zadok, which approach unto me, to minister unto me, saith the Lord GOD, a young bullock for a sin offering.","20":"And thou shalt take of the blood thereof, and put *it* on the four horns of it, and on the four corners of the settle, and upon the border round about: thus shalt thou cleanse and purge","21":"Thou shalt take the bullock also of the sin offering, and he shall burn it in the appointed place of the house, without the sanctuary.","22":"And on the second day thou shalt offer a kid of the goats without blemish for a sin offering; and they shall cleanse the altar, as they did cleanse *it* with the bullock.","23":"When thou hast made an end of cleansing *it*, thou shalt offer a young bullock without blemish, and a ram out of the flock without blemish.","24":"And thou shalt offer them before the LORD, and the priests shall cast salt upon them, and they shall offer them up *for* a burnt offering unto the LORD.","25":"Seven days shalt thou prepare every day a goat *for* a sin offering: \" data-code=\"H2930\">defile,</span> neither they, nor their <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> by their <span class=\"wl wl-kjv\" data-code=\"H2184\">whoredom,</span> nor by the <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> of their <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> in their high places.","8":"In their <span class=\"wl wl-kjv\" data-code=\"H5414\">setting</span> of their <span class=\"wl wl-kjv\" data-code=\"H5592\">threshold</span> by my <span class=\"wl wl-kjv\" data-code=\"H5592\">thresholds,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4201\">post</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> my <span class=\"wl wl-kjv\" data-code=\"H4201\">posts,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> between me and them, they have even <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> by their <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> that they have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed:</span> wherefore I have <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> them in mine anger.","9":"Now let them put <span class=\"wl wl-kjv\" data-code=\"H7368\">away</span> their <span class=\"wl wl-kjv\" data-code=\"H2184\">whoredom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> of their <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, and I will <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them for ever.","10":"Thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that they may be <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed</span> of their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities:</span> and let them <span class=\"wl wl-kjv\" data-code=\"H4058\">measure</span> the pattern.","11":"And if they be <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed</span> of all that they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">shew</span> them the <span class=\"wl wl-kjv\" data-code=\"H6699\">form</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8498\">fashion</span> thereof, and the goings <span class=\"wl wl-kjv\" data-code=\"H4161\">out</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H4126\">comings</span> in thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H6699\">forms</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinances</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H6699\">forms</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H8451\">laws</span> thereof: and <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> it in their <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the whole <span class=\"wl wl-kjv\" data-code=\"H6699\">form</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinances</span> thereof, and do","12":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> Upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> the whole <span class=\"wl wl-kjv\" data-code=\"H1366\">limit</span> thereof round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy.</span> Behold, this is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the house.","13":"And these are the <span class=\"wl wl-kjv\" data-code=\"H4060\">measures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> after the <span class=\"wl wl-kjv\" data-code=\"H520\">cubits:</span> The <span class=\"wl wl-kjv\" data-code=\"H520\">cubit</span> is a <span class=\"wl wl-kjv\" data-code=\"H520\">cubit</span> and an hand <span class=\"wl wl-kjv\" data-code=\"H2948\">breadth;</span> even the <span class=\"wl wl-kjv\" data-code=\"H2436\">bottom</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H520\">cubit,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth</span> a <span class=\"wl wl-kjv\" data-code=\"H520\">cubit,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> thereof by the <span class=\"wl wl-kjv\" data-code=\"H8193\">edge</span> thereof round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> shall be <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H2239\">span:</span> and this shall be the higher <span class=\"wl wl-kjv\" data-code=\"H1354\">place</span> of the altar.","14":"And from the <span class=\"wl wl-kjv\" data-code=\"H2436\">bottom</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> even to the <span class=\"wl wl-kjv\" data-code=\"H8481\">lower</span> <span class=\"wl wl-kjv\" data-code=\"H5835\">settle</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubit;</span> and from the <span class=\"wl wl-kjv\" data-code=\"H6996\">lesser</span> <span class=\"wl wl-kjv\" data-code=\"H5835\">settle</span> even to the <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> <span class=\"wl wl-kjv\" data-code=\"H5835\">settle</span> shall be <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth</span> one cubit.","15":"So the <span class=\"wl wl-kjv\" data-code=\"H741\">altar</span> shall be <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits;</span> and from the <span class=\"wl wl-kjv\" data-code=\"H741\">altar</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward</span> shall be <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> horns.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H741\">altar</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> cubits <span class=\"wl wl-kjv\" data-code=\"H753\">long,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H7341\">broad,</span> <span class=\"wl wl-kjv\" data-code=\"H7251\">square</span> in the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> squares","17":"And the <span class=\"wl wl-kjv\" data-code=\"H5835\">settle</span> shall be <span class=\"wl wl-kjv\" data-code=\"H702\">fourteen</span> cubits <span class=\"wl wl-kjv\" data-code=\"H753\">long</span> and <span class=\"wl wl-kjv\" data-code=\"H702\">fourteen</span> <span class=\"wl wl-kjv\" data-code=\"H7341\">broad</span> in the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7253\">squares</span> thereof; and the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> a <span class=\"wl wl-kjv\" data-code=\"H520\">cubit;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2436\">bottom</span> thereof shall be a <span class=\"wl wl-kjv\" data-code=\"H520\">cubit</span> <span class=\"wl wl-kjv\" data-code=\"H5439\">about;</span> and his <span class=\"wl wl-kjv\" data-code=\"H4609\">stairs</span> shall <span class=\"wl wl-kjv\" data-code=\"H6437\">look</span> toward the east.","18":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> These are the <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinances</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when they shall <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> it, to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> thereon, and to <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkle</span> blood","19":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> that be of the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok,</span> which <span class=\"wl wl-kjv\" data-code=\"H7138\">approach</span> unto me, to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> for a sin offering.","20":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> it on the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of it, and on the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H6438\">corners</span> of the <span class=\"wl wl-kjv\" data-code=\"H5835\">settle,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:</span> thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H2398\">cleanse</span> and purge","21":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> also of the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> it in the appointed <span class=\"wl wl-kjv\" data-code=\"H4662\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the sanctuary.","22":"And on the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H8163\">kid</span> of the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2398\">cleanse</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> as they did <span class=\"wl wl-kjv\" data-code=\"H2398\">cleanse</span> it with the bullock.","23":"When thou hast made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H2398\">cleansing</span> it, thou shalt <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish,</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> without blemish.","24":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H4417\">salt</span> upon them, and they shall offer them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> unto the LORD.","25":"<span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> every <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> a <span class=\"wl wl-kjv\" data-code=\"H8163\">goat</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering:</span> they shall also <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> without blemish.","26":"<span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shall they <span class=\"wl wl-kjv\" data-code=\"H3722\">purge</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> and <span class=\"wl wl-kjv\" data-code=\"H2891\">purify</span> it; and they shall consecrate <span class=\"wl wl-kjv\" data-code=\"H4390\">themselves.</span>","27":"And when these <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H3615\">expired,</span> it shall be, that upon the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and so <span class=\"wl wl-kjv\" data-code=\"H1973\">forward,</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> your burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and your peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7521\">accept</span> you, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"heerlijkheid des Gods van Israël","tekst":"Die tevoren uit den tempel was verhuisd; zie boven Eze 1:28 , en Eze 10:4 , Eze 10:18-19 , met de aantekening, en vergelijk Mal 3:1 ."},{"catchword":"stem was als het geruis","tekst":"Of, geluid, gedruis."},{"catchword":"vele wateren,","tekst":"Of, grote; vergelijk boven Eze 1:24 , waar de majesteit Gods, als een rechter, zich vertoonde, gelijk hier integendeel tot een teken van genade en weldadigheid, als die wederkwam om in zijn huis te wonen, en dat volkomenlijk te herstellen en te zegenen; zie het volgende."},{"catchword":"verlicht van Zijn heerlijkheid","tekst":"Hebreeuws, gaf licht, of, blonk; vergelijk Rev 18:1 , en Rev 21:23 , en zie Isa 60:19-20 , enz.; Mat 4:16 ; Act 13:47 ; 2Co 3:18 , en 2Co 4:6 , enz. Eenigen verstaan dat het licht gesteld wordt tegen de wolk van het Oude Testament. Zie 1Ki 8:10-12 ."}],"3":[{"catchword":"alzo was de gedaante van het gezicht,","tekst":"Of, het was als de gedaante van het gezicht."},{"catchword":"verderven;","tekst":"Dat is, toen mij God zond om het verderf van Jeruzalem in zijnen naam te verkondigen, waarop het verderf zekerlijk zou volgen. Zie boven Eze 9 , Eze 10 , en vergelijk Jer 1:10 . De profeet wil zeggen dat dezelfde God zich hier openbaarde in genade, die zich daar vertoond had in grote verbolgenheid."},{"catchword":"viel op mijn aangezicht","tekst":"Zie boven Eze 1:28 ; alzo onder Eze 44:4 ."}],"4":[{"catchword":"huis,","tekst":"Dat is, den tempel."},{"catchword":"zag","tekst":"Hebreeuws, welker aangezicht was van den weg, enz., gelijk hij door de oostpoort uit den vorigen ouden tempel gescheiden was, [zie boven Eze 10:19 ] , om daarna in den nieuwen te gaan wonen. Zie 2Co 5:17 ; Rev 21:5 ; idem Hag 2:7-9 ; ook kan de Christelijke lezer vergelijken Luk 1:78-79 ."}],"5":[{"catchword":"Geest nam mij op,","tekst":"Zie boven Eze 2:2 , en Eze 3:12 , en Eze 8:3 , met de aantekening."},{"catchword":"vervuld","tekst":"Vergelijk Exo 40:34-35 ; 1Ki 8:10-11 ; Isa 6:1 , en Isa 24:23 , en Isa 35:2 , en Isa 60:1-2 , en Isa 66:18-19 ; onder Eze 44:4 ; Hab 2:14 ; Hag 2:8 , Hag 2:10 ; Zec 2:5 ; Mat 17:5 ; Joh 1:14 , en Joh 12:41 ; 1Co 15:28 ; 2Th 1:10 ; 2Pe 1:16-18 ; Rev 15:8 , en Rev 21:23 , en Rev 22:5 ."}],"6":[{"catchword":"Een,","tekst":"Namelijk den HEERE, wiens heerlijkheid den tempel vervulde, in het voorgaande vs., en die in het volgende vs. tot den profeet spreekt. Vergelijk boven Eze 1:28 , en Eze 2:1 ."},{"catchword":"de man was bij mij staande","tekst":"Anders, een man. Zie boven Eze 40:3 ."}],"7":[{"catchword":"Hij zeide tot mij","tekst":"De HEERE, die uit het huis met mij sprak, gelijk in het voorgaande vs. gezegd is."},{"catchword":"plaats der zolen Mijner voeten,","tekst":"Vergelijk Lev 26:11-12 ; Isa 60:13 , en zie Joh 14:23 ; 1Co 3:16-17 , en 1Co 6:19 ; Rev 21:3 , en Rev 22:3 , enz."},{"catchword":"eeuwigheid;","tekst":"Zie Jer 31:32-33 , Jer 31:36 , en Jer 32:40 , en Jer 33:20-21 , Jer 33:25-26 , enz."},{"catchword":"die van het huis Israëls","tekst":"Hebreeuws, het huis Israëls zullen, enz., het geheel is: Door de genadige inwoning van mijn Heiligen Geest zal Ik maken dat mijn geestelijk Israël, [dat is, mijne kerk], mij heilig zal dienen en vreemd zijn van alles, wat daartegen strijdt, inzonderheid alle afgoderij, waarvan enige soorten in het volgende worden verhaald, uit de gruwelen, die Gods volk in Kanaän bedreven had. Dit kan men wel enigszins duiden [met sommigen] op den tijd van Ezra en Nehemia na de verlossing uit Babel [hoewel die mannen Gods met veel grove verkeerdheden van het volk steeds hebben moeten strijden, en de Joden naderhand van tijd tot tijd schrikkelijker zijn vervallen, gelijk bij de komst van Christus gebleken is]; maar het ziet alles voornamelijk op den tijd van den Messias en de uitzending van zijnen Geest, en zal volkomenlijk worden vervuld in het andere leven, in het hemels Kanaän, Rev 21:27 , en Rev 22:3 , enz."},{"catchword":"heiligen Naam niet meer verontreinigen,","tekst":"Hebreeuws, naam mijner heiligheid; alzo in het volgende."},{"catchword":"hoererij","tekst":"Dat is, afgoderij, alle bijgeloof, eigenwillige menselijke vonden en inzettingen in den godsdienst. Zie Lev 17:7 , en Lev 20:5 ."},{"catchword":"dode lichamen","tekst":"Dat is, gelijk enigen menen, met de lichamen van enige gestorven koningen, die omtrent den tempel begraven waren. Anderen verstaan de lichamen der mensen, die zij ter ere hunner afgoden geslacht en geofferd hebben, welke afgoden zij, op heidense wijze, hunne koningen plachten te noemen, inzonderheid dien Molech, of Milcom, of Malcam, of Melech, enz. die daarvan den naam had, want Melech betekent koning; zie Lev 18:21 ; Jer 48:7 , en Jer 49:1 ; Amo 1:15 en Amo 5:26 , met de aantekening. Sommigen nemen het van de afgoden zelf, die met recht dode lichamen genoemd worden, omdat zij geen leven hebben, en als een aas voor God stinken; zie Lev 26:30 ; Jer 15:18 , met de aantekening."},{"catchword":"op hun hoogten;","tekst":"Of, [en] hunne hoogten, zulks dat de hoogten [gelijk dikwijls] voor een bijzondere soort van afgoderij genomen worden."}],"8":[{"catchword":"hun dorpel stelden aan Mijn dorpel,","tekst":"Dat is, onbeschaamd in mijn huis invoerden en bedreven allerlei afgoderij, bijgeloof en menselijke inzettingen, willende alzo mij en den duivel samen dienen, tempel aan of in tempel bouwen, als tot mijn spijt. Vergelijk hiermede boven Eze 8 , en inzonderheid Eze 8:7-10 , enz., en wijders 2Ki 16:14 , en 2Ki 21:7 , en boven Eze 23:39 ."},{"catchword":"wand tussen Mij en tussen hen was,","tekst":"Zie boven Eze 8:8-9 . Anders: en [stelden] een wand tussen mij en tussen hen; dat is, scheidden zich van mij af door hunne gruwelen; zie Isa 59:2 ."}],"9":[{"catchword":"Nu zullen zij hun hoererij","tekst":"Ten tijde van den nieuwen tempel, als Ik mijn volk de voorzegde genade zal bewijzen door den Messias."},{"catchword":"dode lichamen","tekst":"Gelijk boven vs.7."}],"10":[{"catchword":"dit huis,","tekst":"Dat is, het gezicht van de gedaante van dit huis, en maak hun bekend het oogmerk en de verklaring van die. Zie boven Eze 40:4 ."},{"catchword":"schaamrood worden","tekst":"Door betrachting van hunne onwaardigheid [gelijk volgt], en deze mijn grote onverdiende onbegrijpelijke genade, die Ik mijn volk beloof en zo zekerlijk in het toekomende zal bewijzen, als Ik u dit nieuwe gebouw heb vertoond, en zij het model daarvan door u zullen ontvangen, en uit alles klaarlijk kunnen merken dat het niet uw verzinsel, maar mijn werk is."},{"catchword":"bestek afmeten","tekst":"Of, de gestaltenis, hebbende zijn behoorlijke proportie, fatsoen, of vorm, maat, enz. [vergelijk 2Ch 24:13 ] , zoals gij het nu gezien hebt."}],"11":[{"catchword":"zo maak hun bekend","tekst":"De verborgenheid des Heeren is voor degenen die Hem vrezen, om hun die bekend te maken, Psa 25:14 ; maar niet voor de honden en varkens, Mat 7:6 ."},{"catchword":"schrijf het voor hun ogen,","tekst":"Dat is, maal of teken het hun af en beschrijf het, opdat zij door ware bekering levende stenen van dit gebouw en mijn geestelijk huis mede mogen zoeken te zijn, enz.; zie Eph 2:20-22 , en 1Pe 2:4-5 ."}],"12":[{"catchword":"hoogte des bergs zal zijn ganse grens,","tekst":"Hebreeuws, hoofd. Sommigen houden dat God aldus wijst op het Jeruzalem, dat boven is, Gal 4:26 ; vergelijk Psa 15:1 ; Mat 5:14 ; Heb 12:22 ."},{"catchword":"heiligheid der heiligheden zijn;","tekst":"Dat is, zeer heilig, een zeer heilige plaats, omdat nu de heerlijkheid des Heeren alles geheiligd, of de Vader en de Zoon door den Heiligen Geest aldaar hunne woning zullen hebben genomen, heiligende alle uitverkorenen, doch de strijdende aanvankelijk, bij trappen en maten, maar de triomferende volkomenlijk."}],"13":[{"catchword":"altaars,","tekst":"Versta, het brandofferaltaar, afbeeldende den Heere Christus, met zijn enig zoenoffer, waarmede alle gelovigen in de vier hoeken der wereld gemeenschap hebben; idem, in en op welken zij hun geestelijke offeranden Gode opofferen. Zie Heb 13:10 , en 1Pe 2:5 ."},{"catchword":"ellen,","tekst":"Zie boven Eze 40:5 ."},{"catchword":"boezem","tekst":"Of, schoot; dat is, voet of bodem, die onder rondom ging, en alles, wat daarop rustte, als in zijn schoot ontving, vestigde en ondersteunde. Zie vs.14 en vs.17."},{"catchword":"el, en een el","tekst":"Versta, in hoogte."},{"catchword":"breedte;","tekst":"Dat is, dikte."},{"catchword":"einde","tekst":"Hebreeuws, grens; dat is, het uiterste van dezen boezem."},{"catchword":"rand rondom een span;","tekst":"Hebreeuws, lip."},{"catchword":"rug des altaars","tekst":"Dat is, het onderste deel, het steunsel van al de rest, als wanneer iemand op den rug ligt."}],"14":[{"catchword":"afzetsel,","tekst":"Dat is, uitstekende, rondom gaande en als uitspringende lijst. Hebreeuws, behulp."}],"15":[{"catchword":"Harel vier ellen;","tekst":"Dat is, de haardstede, rooster, of plaats, boven op het altaar, waar het hout en de offeranden gelegd en verbrand werden, genoemd Harel, dat is, Gods berg, vanwege de hoogte [gelijk enigen menen] omdat men bij trappen daarop ging, onder vs.17, en Ariël, dat is, Gods leeuw, omdat hij de offeranden verteerde, gelijk een sterke leeuw alles verslindt wat hem voorkomt. Zie Isa 29:1 , en vergelijk Exo 27:4 , met de aantekening. Alzo is ons altaar [de Heere Christus ] in der waarheid als een berg Gods, waar alle gelovige Joden en heidenen uit alle hoeken der wereld hunne toevlucht nemen en opgaan, en de leeuw Gods, uit Juda, die alles, wat ons vijandelijk is, verteert; zie Isa 2:2-3 , en Isa 60:7 , en Isa 63:1 , enz.; Rev 5:5 ."},{"catchword":"hoornen","tekst":"Vergelijk Exo 27:2 , met de aantekening."}],"16":[{"catchword":"zijden","tekst":"Hebreeuws, vier vierzijden, of vier vierhoeken, of vierkantigheden; gelijk boven Eze 1:8 , zie aldaar. Alzo in vs.17."}],"17":[{"catchword":"afzetsel veertien ellen de lengte,","tekst":"Of, [elk] afzetsel."},{"catchword":"boezem daaraan,","tekst":"Gelijk boven vs.13."}],"18":[{"catchword":"des altaars,","tekst":"Die het altaar aangaan, die men in de making en bediening daarvan moest onderhouden."}],"19":[{"catchword":"Zadok zijn,","tekst":"Zie boven Eze 40:46 , en onder Eze 44:15 , enz."},{"catchword":"jong rund, ten zondoffer","tekst":"Hebreeuws, een zoon des runds; alzo in het volgende."}],"20":[{"catchword":"ontzondigen, en het verzoenen","tekst":"Dewijl noch altaar, noch offerande, enige ceremoniele reinheid van zichzelven hadden, noch den onreinen aanbrengen konden, zo moest eerst alles door bloed daartoe gereinigd en ingewijd worden, afbeeldende de geestelijke reiniging onzer conscientiën, godsdiensten en van de hemelse dingen, door het dierbaar bloed van onzen Heere Christus, tot welks toepassing of toeëigening de dienstknechten van Christus, als zijne instrumenten, ons dienstig zijn door de zuivere predikatie van het heilige Evangelie van den gekruisigden Christus en de bediening der heilige sacramenten, gebeden, enz., gelijk de Levietische priesters deden in het ceremoniëel; zie Heb 9:9 tot Heb 9:24 toe; 2Co 3:6 , en 2Co 4:5 , 2Co 4:7 ; Gal 3:1 , enz.; vergelijk boven Eze 40:49 ."}],"21":[{"catchword":"bestelde plaats van het huis","tekst":"Of, bevolene."},{"catchword":"buiten het heiligdom","tekst":"Vergelijk Heb 13:11-12 ."}],"24":[{"catchword":"zout daarop werpen,","tekst":"Vergelijk Lev 2:13 ; Num 18:19 ; 2Ch 13:5 ; voorts Mat 5:13 ; Mar 9:49-50 ; Col 4:6 ."}],"25":[{"catchword":"zullen zij een var,","tekst":"Anders: gelijk zij, enz. zullen bereid hebben."}],"26":[{"catchword":"handen vullen","tekst":"Dat is, hem inwijden of heiligen, tot het heilig gebruik. Vergelijk Lev 7:37 , en Lev 8:33 , enz. Anders: zij zullen [een iegelijk] zijne handen vullen; dat is zichzelven heiligen, en tot het offeren op het altaar inwijden."}],"27":[{"catchword":"uw brandofferen en uw dankofferen op het altaar zullen bereiden;","tekst":"Zie boven Eze 40:39 , en hier boven vs.20."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then he led me to the gate, the gate that looked the way towards the east."}],"2":[{"catchword":null,"tekst":"And behold the glory of the God of Israel [Which was before removed from the Temple. See above chapter 1.28 and 10.4,18,19. With the Annotat. And compare Mal 3:1] came from the way toward the east: and his voice [or found, noise] was like the noise of many waters, [or great waters, compare above chapter 1.24. where the majesty of God appeared like the majesty of a judge: as here on the contrary was a token of grace and mercy, when the glory of God returned to dwell in his own, and to restore it fully and perfectly, and to bless it. See the sequel] and the earth was enlightened [Hebrews gave light, or (hind] with his glory. [Compare Rev. 18.1 and 21, 23 and see Isa 60:19,20 c. Mat 4:16. Act 13:47. 2 Corinthians 3.18. and 4.6 c. Some conceive that light is here opposed to the cloud of the Old Testament. See 1 kings 8.10, 11, 12.]"}],"3":[{"catchword":null,"tekst":"And so was the appearance of the vision [Or it was as the appearance of the vision] that I saw, as the vision that I had seen, when I came to destroy the city; [that is, when God sent me to declare in his name the destruction of Jerusalem, whereupon the destruction would certainly follow. See above chapter 9.10 & compare Jeremiah 1 on verse 10. The prophet doth intimate, that the same God did here manifest himself in grace and favor, which had there showed himself in great wrath & indignation] and there were uniforms like the uniform that I had seen by the river ch bar: and I fell upon my face. [See above chapter 1 on verse 28. so blow chapter 44.4.]"}],"4":[{"catchword":null,"tekst":"And the glory of the LORD came into the house: [That is, the Temple] (by) the way of the gate, that looked the way towards the east. [Hebrews whole face was the way, c. as it was departed through the east-gate out of the former old Temple, (see above chapter 10.19.) to go afterwards and dwell in the new. See 2 Corinthians 5.17. Rev 21:5. Also, Haggai 2.7, 8, 9. The Christian reader may also compare Luke1.78, 79.]"}],"5":[{"catchword":null,"tekst":"And the spirit took me up [see chapter 2.22. and 3.12 and 8.3. with the Annotat.] and brought me into the innermost court: and behold, the glory of the Lord had filled the house. [Compare below chapter 44.4. and Exodus40.34,35.1. 1 Kings8.10.11. Jeremiah6.1 and 24.23 and 35.2 and 16.1,2. and 66.18,19. Hbak.2.14. Haggai2.7, 9. Zacchariah2.5. Matthew17.5. Job1.14 and 6.12,13. 1 Corinthians16.28.2. 2 Thessalonians1.10. 2Pe 1:16,17,18. Revelation15.8. and 21.23. and 22.5.]"}],"6":[{"catchword":null,"tekst":"And I heard one that spoke with me out of the house: [namely, the Lord, whose glory filled the temple, in the former verse: and who speaketh unto the prophet in the next verse. Compare above chapter 1.28 and 2.1] and the man [Others, a man. See above chapter 40 on verse 3.] Was standing by me?"}],"7":[{"catchword":null,"tekst":"And he [The Lord that talked with me out of the house, as is said in the former verse] said unto me; child of man (this) this is the place of my throne, and the place of the soles of my feet, were I will dwell in the midst of the children of Israel, [Compare Leviticus26.11,12. Isa 60:13 and see Job 14:23. 1 Corinthians3.16, 17 and 6.19. Rev 21:3 and 22.3, c.] forever. [see Jer 31:32,33,36 and 32.40 and 33.20,21,25,26, c.] And those of the house of Israel shall defile no more [Hebrews the house of Israel shall defile no more [Hebrews the house of Israel defile, c. the verb in the plural number] my holy name [Hebrews the name of holiness: so in the sequel] they, no Kings by their wheredome, [that is, idolatry, all kind of superstitions, wil-worship, humane inventions, and traditions in the service of God. See Leviticus17. On verse 7 and 20 on verse 5.] And by the dead bodies of their kings, [that is (as some conceive) by the bodies of some deceased kings that were buried about the temple. Others understand hereby the bodies of those men whom they had slain and sacrificed by the honor of their idols, which idols they in a hethenish way were wont to call their kings, especially that same Molec, or Milcom, or Malcam, or Melech, c. that had the name thence. For Melech signifieth King. See Lev 18:21. Jeremiah48.7. and 1.15 and 5.26. with the Annotat.. Some understand it of the idols themselves, which are justly called dead bodies, because they are without life, and like a filthy rotten carcafe stink before God. See Lev 26:30 and Jeremiah16.18. With the Annotat.] (On) their high places: [or, (and) their high // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)

  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

    const id = `u-${b.key}-${n}`;

    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
