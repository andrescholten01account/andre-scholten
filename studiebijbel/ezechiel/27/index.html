johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "2": "U dan, mensenkind! Hef een klaaglied op over Tyrus;", "3": "En zeg tegen Tyrus, die daar woont aan de ingangen van de zee, handelend met de volken in veel eilanden: Zo zegt de Heere HEERE: O Tyrus! u zegt: Ik ben volmaakt in schoonheid.", "4": "Uw grenzen zijn in het hart van de zeeën; uw bouwers hebben uw schoonheid volkomen gemaakt.", "5": "Zij hebben al uw scheepsplanken *uit* dennenbomen van Senir gebouwd; zij hebben ceders van de Libanon gehaald, om masten voor u te maken.", "6": "Zij hebben uw riemen *uit* eiken van Basan gemaakt; uw dekken hebben zij gemaakt *van* welbewerkt ivoor, uit de eilanden van de Chittieten.", "7": "Fijn linnen met stiksel uit Egypte was uw uitgespreide zeil, dat het u tot een zeil zou zijn; hemelsblauw en purper, uit de eilanden van Elisa, was uw dek.", "8": "De inwoners van Sidon en Arvad waren uw roeiers; uw wijzen, o Tyrus! die in u waren, die waren uw schippers.", "9": "De oudsten van Gebal en haar wijzen waren in u, zij verbeterden uw breuken; alle schepen van de zee en hun zeelieden waren in u, om onderlinge handel met u te drijven.", "10": "Perzen, en Lydiërs, en Puteeërs waren in uw leger, uw krijgslieden; schild en helm hingen zij in u op, die maakten uw sieraad.", "11": "De kinderen van Arvad en uw leger waren rondom op uw muren, en de Gammadieten waren op uw torens; hun schilden hingen zij rondom aan uw muren; die maakten uw schoonheid volkomen.", "12": "Tarsis dreef koophandel met u vanwege de veelheid van allerlei goed; met zilver, ijzer, tin, en lood handelden zij *op* uw markten.", "13": "Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u.", "14": "Uit het huis van Togarma leverden zij paarden, en ruiters, en muilezels *op* uw markten.", "15": "De kinderen van Dedan waren uw kooplieden; veel eilanden waren de koophandel van uw hand; hoornen van ivoor en ebbenhout gaven zij u terug *tot* een geschenk.", "16": "Syrië dreef koophandel met u, vanwege de veelheid van uw werken; met smaragden, purper, en gestikt werk, en zijde, en Ramoth, en Cadkod, handelden zij op uw markten.", "17": "Juda en het land Israël waren uw kooplieden; met tarwe van Minnit en Pannag, en honing, en olie, en balsem, dreven zij onderlinge handel met u.", "18": "Damaskus dreef koophandel met u, om de veelheid van uw werken, vanwege de veelheid van allerlei goed; met wijn van Chelbon en witte wol.", "19": "Ook leverden Dan en Javan, de omreizer, op uw markten; glad ijzer, kassie en kalmoes was in uw onderlinge koophandel.", "20": "Dedan handelde met u met kostbaar gewaad voor wagens.", "21": "Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u.", "22": "De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij *op* uw markten.", "23": "Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur *en* Kilmad, handelden met u.", "24": "Die waren uw kooplieden met allerlei sieraden, met pakken van hemelsblauw en gestikt werk, en met schatkisten van mooie kleren; gebonden met koorden, en in ceder gepakt, onder uw koopwaar.", "25": "De schepen van Tarsis zongen van u, *vanwege* de onderlinge koophandel met u; en u was vervuld, en zeer verheerlijkt in het hart van de zeeën.", "26": "Die u roeien, hebben u in groot water gevoerd; de oostenwind heeft u verbroken in het hart van de zeeën.", "27": "Uw goed, en uw marktwaren, uw onderlinge koophandel, uw zeelieden, en uw schippers; die uw breuken verbeteren, en die onderlinge handel met u drijven, en al uw krijgslieden, die in u zijn, zelfs met heel uw gemeente, die in het midden van u is, zullen vallen in het hart van de zeeën, ten dage van uw val.", "28": "Van het geluid van het geschreeuw van uw schippers zullen de voorsteden beven.", "29": "En allen, die de riem hanteren, zeelieden, *en* alle schippers van de zee, zullen uit hun schepen naar beneden klimmen; op het land zullen zij staan blijven.", "30": "En zij zullen hun stem over u laten horen, en bitter schreeuwen; en zij zullen stof op hun hoofden werpen, zij zullen zich wentelen in de as.", "31": "En zij zullen zich over u helemaal kaal maken, en zakken aangorden; en zullen over u wenen met bitterheid van ziel, *en* bitter rouwklaagt.", "32": "En zij zullen in hun gekerm een klaaglied over u opheffen, en over u weeklagen, en zeggen: Wie is geweest als Tyrus, als de uitgeroeide in het midden van de zee?", "33": "Toen uw marktwaren uit de zeeën voortkwamen, hebt u veel volken verzadigd; met de veelheid van uw goederen en uw onderlinge koophandel, hebt u de koningen van de aarde rijk gemaakt.", "34": "Ten tijde dat u uit de zeeën verbroken bent in de diepte van de wateren, zijn uw onderlinge koophandel en heel uw gemeente in het midden van u gevallen.", "35": "Alle inwoners van de eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbijsterd van gezicht.", "36": "De handelaars onder de volken fluiten u uit; u bent een grote schrik geworden, en zult er niet *meer* zijn tot in eeuwigheid."}, "SV": {"1": "Wijders geschiedde des HEEREN woord tot mij, zeggende:", "2": "Gij dan, mensenkind! hef een klaaglied op over Tyrus;", "3": "En zeg tot Tyrus, die daar woont aan de ingangen der zee, handelende met de volken in vele eilanden: Zo zegt de Heere HEERE: O Tyrus! gij zegt: Ik ben volmaakt in schoonheid.", "4": "Uw landpalen zijn in het hart der zeeën; uw bouwers hebben uw schoonheid volkomen gemaakt.", "5": "Zij hebben al uw denningen *uit* dennebomen van Senir gebouwd; zij hebben cederen van den Libanon gehaald, om masten voor u te maken.", "6": "Zij hebben uw riemen *uit* eiken van Basan gemaakt; uw berderen hebben zij gemaakt *uw* welbetreden elpenbeen, uit de eilanden der Chittieten.", "7": "Fijn linnen met stiksel uit Egypte was uw uitbreidsel, dat het u tot een zeil ware; hemelsblauw en purper, uit de eilanden van Elisa, was uw deksel.", "8": "De inwoners van Sidon en Arvad waren uw roeiers; uw wijzen, o Tyrus! *die* in u waren, die waren uw schippers.", "9": "De oudsten van Gebal en haar wijzen waren in u, verbeterende uw breuken; alle schepen der zee en haar zeelieden waren in u, om onderlingen handel met u te drijven.", "10": "Perzen, en Lydiers, en Puteers waren in uw heir, uw krijgslieden; schild en helm hingen zij in u op, die maakten uw sieraad.", "11": "De kinderen van Arvad en uw heir waren rondom op uw muren, en de Gammadieten waren op uw torens; hun schilden hingen zij rondom aan uw muren; die maakten uw schoonheid volkomen.", "12": "Tarsis dreef koophandel met u vanwege de veelheid van allerlei goed; met zilver, ijzer, tin, en lood handelden zij *op* uw markten.", "13": "Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlingen handel met u.", "14": "Uit het huis van Togarma leverden zij paarden, en ruiteren, en muilezels *op* uw markten.", "15": "De kinderen van Dedan waren uw kooplieden; vele eilanden waren de koophandel uwer hand; hoornen van elpenbeen en ebbenhout gaven zij u weder *tot* een verering.", "16": "Syrië dreef koophandel met u, vanwege de veelheid uwer werken; met smaragden, purper, en gestikt werk, en zijde, en Ramoth, en Cadkod, handelden zij op uw markten.", "17": "Juda en het land Israëls waren uw kooplieden; met tarwe van Minnit en Pannag, en honig, en olie, en balsem, dreven zij onderlingen handel met u.", "18": "Damaskus dreef koophandel met u, om de veelheid uwer werken, vanwege de veelheid van allerlei goed; met wijn van Chelbon en witte wol.", "19": "Ook leverden Dan en Javan, de omreizer, op uw markten; glad ijzer, kassie en kalmus was in uw onderlingen koophandel.", "20": "Dedan handelde met u met kostelijk gewand tot wagens.", "21": "Arabië en alle vorsten van Kedar waren de kooplieden uwer hand; met lammeren, en rammen, en bokken, daarmede handelden zij met u.", "22": "De kooplieden van Scheba en Raema waren uw kooplieden; met alle hoofdspecerij, en met alle kostelijk gesteente en goud, handelden zij *op* uw markten.", "23": "Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur *en* Kilmad, handelden met u.", "24": "Die waren uw kooplieden met volkomen sieradien, met pakken van hemelsblauw en gestikt werk, en met schatkisten van schone klederen; gebonden met koorden, en in ceder gepakt, onder uw koopmanschap.", "25": "De schepen van Tarsis zongen van u, *vanwege* den onderlingen koophandel met u; en gij waart vervuld, en zeer verheerlijkt in het hart der zeeën.", "26": "Die u roeien, hebben u in grote wateren gevoerd; de oostenwind heeft u verbroken in het hart der zeeën.", "27": "Uw goed, en uw marktwaren, uw onderlinge koophandel, uw zeelieden, en uw schippers; die uw breuken verbeteren, en die onderlingen handel met u drijven, en al uw krijgslieden, die in u zijn, zelfs met uw ganse gemeente, die in het midden van u is, zullen vallen in het hart der zeeën, ten dage van uw val.", "28": "Van het geluid des geschreeuws uwer schippers zullen de voorsteden beven.", "29": "En allen, die den riem handelen, zeelieden, *en* alle schippers van de zee, zullen uit hun schepen nederklimmen; op het land zullen zij staan blijven.", "30": "En zij zullen hun stem over u laten horen, en bitterlijk schreeuwen; en zij zullen stof op hun hoofden werpen, zij zullen zich wentelen in de as.", "31": "En zij zullen zich over u gans kaal maken, en zakken aangorden; en zullen over u wenen met bitterheid der ziel, *en* bittere rouwklage.", "32": "En zij zullen in hun gekerm een klaaglied over u opheffen, en over u weeklagen, *zeggende*: Wie is geweest als Tyrus, als de uitgeroeide in het midden der zee?", "33": "Als uw marktwaren uit de zeeën voortkwamen, hebt gij vele volken verzadigd; met de veelheid uwer goederen en uw onderlingen koophandel, hebt gij de koningen der aarde rijk gemaakt.", "34": "Ten tijde, dat gij uit de zeeën verbroken zijt in de diepte der wateren, zijn uw onderlinge koophandel en uw ganse gemeente in het midden van u gevallen.", "35": "Alle inwoners der eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbaasd van aangezicht.", "36": "De handelaars onder de volken fluiten u aan; gij zijt een grote schrik geworden, en zult er niet *meer* zijn tot in eeuwigheid."}, "KJV": {"1": "The word of the LORD came again unto me, saying,", "2": "Now, thou son of man, take up a lamentation for Tyrus;", "3": "And say unto Tyrus, O thou that art situate at the entry of the sea, *which art* a merchant of the people for many isles, Thus saith the Lord GOD; O Tyrus, thou hast said, I *am* of perfect beauty.", "4": "Thy borders *are* in the midst of the seas, thy builders have perfected thy beauty.", "5": "They have made all thy *ship* boards of fir trees of Senir: they have taken cedars from Lebanon to make masts", "6": "*Of* the oaks of Bashan have they made thine oars; the company of the Ashurites have made thy benches *of* ivory, *brought* out of the isles of Chittim.", "7": "Fine linen with broidered work from Egypt was that which thou spreadest forth to be thy sail; blue and purple from the isles of Elishah was that which covered", "8": "The inhabitants of Zidon and Arvad were thy mariners: thy wise *men*, O Tyrus, *that* were in thee, were thy pilots.", "9": "The ancients of Gebal and the wise *men* thereof were in thee thy calkers: all the ships of the sea with their mariners were in thee to occupy thy merchandise.", "10": "They of Persia and of Lud and of Phut were in thine army, thy men of war: they hanged the shield and helmet in thee; they set forth thy comeliness.", "11": "The men of Arvad with thine army *were* upon thy walls round about, and the Gammadims were in thy towers: they hanged their shields upon thy walls round about; they have made thy beauty perfect.", "12": "Tarshish *was* thy merchant by reason of the multitude of all *kind of* riches; with silver, iron, tin, and lead, they traded in thy fairs.", "13": "Javan, Tubal, and Meshech, they *were* thy merchants: they traded the persons of men and vessels of brass in thy market.", "14": "They of the house of Togarmah traded in thy fairs with horses and horsemen and mules.", "15": "The men of Dedan *were* thy merchants; many isles *were* the merchandise of thine hand: they brought thee *for* a present horns of ivory and ebony.", "16": "Syria *was* thy merchant by reason of the multitude of the wares of thy making: they occupied in thy fairs with emeralds, purple, and broidered work, and fine linen, and coral, and agate.", "17": "Judah, and the land of Israel, they *were* thy merchants: they traded in thy market wheat of Minnith, and Pannag, and honey, and oil, and balm.", "18": "Damascus *was* thy merchant in the multitude of the wares of thy making, for the multitude of all riches; in the wine of Helbon, and white wool.", "19": "Dan also and Javan going to and fro occupied in thy fairs: bright iron, cassia, and calamus, were in thy market.", "20": "Dedan *was* thy merchant in precious clothes for chariots.", "21": "Arabia, and all the princes of Kedar, they occupied with thee in lambs, and rams, and goats: in these *were they* thy merchants.", "22": "The merchants of Sheba and Raamah, they *were* thy merchants: they occupied in thy fairs with chief of all spices, and with all precious stones, and gold.", "23": "Haran, and Canneh, and Eden, the merchants of Sheba, Asshur, *and* Chilmad, *were* thy merchants.", "24": "These *were* thy merchants in all sorts *of things*, in blue clothes, and broidered work, and in chests of rich apparel, bound with cords, and made of cedar, among thy merchandise.", "25": "The ships of Tarshish did sing of thee in thy market: and thou wast replenished, and made very glorious in the midst of the seas.", "26": "Thy rowers have brought thee into great waters: the east wind hath broken thee in the midst of the seas.", "27": "Thy riches, and thy fairs, thy merchandise, thy mariners, and thy pilots, thy calkers, and the occupiers of thy merchandise, and all thy men of war, that *are* in thee, and in all thy company which *is* in the midst of thee, shall fall into the midst of the seas in the day of thy ruin.", "28": "The suburbs shall shake at the sound of the cry of thy pilots.", "29": "And all that handle the oar, the mariners, *and* all the pilots of the sea, shall come down from their ships, they shall stand upon the land;", "30": "And shall cause their voice to be heard against thee, and shall cry bitterly, and shall cast up dust upon their heads, they shall wallow themselves in the ashes:", "31": "And they shall make themselves utterly bald for thee, and gird them with sackcloth, and they shall weep for thee with bitterness of heart *and* bitter wailing.", "32": "And in their wailing they shall take up a lamentation for thee, and lament over thee, *saying*, What *city is* like Tyrus, like the destroyed in the midst of the sea?", "33": "When thy wares went forth out of the seas, thou filledst many people; thou didst enrich the kings of the earth with the multitude of thy riches and of thy merchandise.", "34": "In the time *when* thou shalt be broken by the seas in the depths of the waters thy merchandise and all thy company in the midst of thee shall fall.", "35": "All the inhabitants of the isles shall be astonished at thee, and their kings shall be
