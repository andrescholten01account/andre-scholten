geplant heeft;", "Ps 37:36": "Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Jona 3:6": "Want dit woord bereikte de koning van Nineve, en hij stond op van zijn troon, en deed zijn heerlijke overkleed van zich af; en hij bedekte zich met een zak, en zat neer in de as.", "Gen 49:13": "Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.", "1 Kon 10:28": "En de paarden die Salomo had, kwamen uit Egypte; en wat het linnen garen betreft, de kooplieden van de koning namen het linnen garen voor een vaste prijs.", "Deut 8:8": "Een land van tarwe en gerst, en wijnstokken, en vijgenbomen, en granaatappels; een land van olierijke olijfbomen, en van honing;", "Ps 72:15": "En hij zal leven; en men zal hem geven van het goud van Scheba, en men zal voortdurend voor hem bidden; de hele dag zal men hem zegenen.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Ezech 31:1": "Het gebeurde ook in het elfde jaar, in de derde maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam:", "Gen 28:5": "Zo zond Izak Jakob weg, zodat hij naar Paddan-aram trok, naar Laban, de zoon van Bethuel, de Syriër, de broer van Rebekka, de moeder van Jakob en Ezau.", "Jes 60:9": "Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "1 Kon 5:18": "En de bouwlieden van Salomo, en de bouwlieden van Hiram, en de Giblieten behieuwen ze, en bereidden het hout toe, en de stenen, om dat huis te bouwen.", "Openb 4:3": "En Hij Die daarop zat, zag er uit als de steen jaspis en sardius; en een regenboog was rondom de troon, die er uitzag als een smaragd.", "2 Sam 8:5": "En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "Gen 2:8": "Ook had de HEERE God een hof geplant in Eden, tegen het oosten, en Hij zette daar de mens, die Hij gevormd had.", "Hoogl 4:8": "Bij Mij vanaf de Libanon, o bruid! Kom bij Mij vanaf de Libanon; kijk vanaf de top van Amana, vanaf de top van Senir en van Hermon, vanaf de woningen van de leeuwinnen, vanaf de bergen van de luipaarden.", "Ezech 24:15": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "Ps 29:5": "De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Ezech 28:17-19": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken. Vanwege de veelheid van uw ongerechtigheden, door het onrecht van uw koophandel, hebt u uw heiligdommen ontheiligd; daarom heb Ik een vuur uit uw midden doen voortkomen, dat u heeft verteerd, en Ik heb u tot as gemaakt op de aarde, voor de ogen van allen die u zien. Allen die u kennen onder de volken, zijn ontzet over u; u bent een grote schrik geworden, en zult er niet meer zijn, tot in eeuwigheid.", "Gen 11:31": "En Terah nam Abram, zijn zoon, en Lot, Harans zoon, de zoon van zijn zoon, en Sarai, zijn schoondochter, de vrouw van zijn zoon Abram, en zij trokken met hen uit Ur der Chaldeeën, om naar het land Kanaän te gaan; en zij kwamen tot Haran, en woonden daar.", "Jes 10:9": "Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus?", "Richt 10:6": "Toen gingen de Israëlieten opnieuw doen wat slecht was in de ogen van de HEERE: zij dienden de Baäls en de Astartes, de goden van Syrië, de goden van Sidon, de goden van Moab, de goden van de Ammonieten, alsook de goden van de Filistijnen; zij verlieten de HEERE en dienden Hem niet meer.", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Gen 10:22": "Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram.", "Neh 3:32": "En tussen de bovenzaal van het punt tot de Schaapspoort toe, verbeterden de goudsmeden en de kruideniers.", "Jer 10:9": "Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.", "Ezech 26:19": "Want zo zegt de Heere HEERE: Als Ik u zal stellen tot een verwoeste stad, gelijk de steden die niet bewoond worden; als Ik een afgrond over u zal doen opkomen, en het grote water u zal overdekken.", "Joël 3:6": "En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "Ezech 28:3": "Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "1 Kron 1:17": "De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech.", "Ezech 30:1": "Verder gebeurde het woord van de HEERE tot mij: het zei:", "Neh 2:2": "Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd,", "Openb 18:23": "En het licht van de lamp zal in u niet meer schijnen; en de stem van een bruidegom en van een bruid zal in u niet meer gehoord worden; want uw kooplieden waren de groten van de aarde, want door uw toverij zijn alle volken misleid geweest.", "Jes 7:2": "Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind.", "Gen 10:4": "En de zonen van Javan zijn: Elisa, en Tarsis; de Chittieten en Dodanieten.", "Jona 1:5": "Toen werden de zeelieden bang, en riepen ieder tot zijn god, en wierpen de vaten die in het schip waren in de zee, om het daarvan te verlichten; maar Jona was neergegaan aan de zijkant van het schip, en lag neer, en was in een diepe slaap gevallen.", "Ezech 33:1": "En het woord van de HEERE kwam tot mij:", "Dan 1:15": "Aan het einde van de tien dagen nu zag men dat hun gedaanten er beter uitzagen, en zij vetter waren van vlees dan alle jongemannen die het voedsel van de koning aten.", "Jer 19:8": "En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen.", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "Openb 18:9-19": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien; Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen. En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt;", "Gen 41:57": "En alle landen kwamen naar Egypte, naar Jozef, om te kopen; want de honger was sterk in alle landen.", "1 Sam 6:11": "En zij zetten de ark van de HEERE op de wagen, en het koffertje met de gouden muizen en de beelden van hun gezwellen.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Ezech 27:7-9": "Fijn linnen met stiksel uit Egypte was uw uitgespreide zeil, dat het u tot een zeil zou zijn; hemelsblauw en purper, uit de eilanden van Elisa, was uw dek. De inwoners van Sidon en Arvad waren uw roeiers; uw wijzen, o Tyrus! die in u waren, die waren uw schippers. De oudsten van Gebal en haar wijzen waren in u, zij verbeterden uw breuken; alle schepen van de zee en hun zeelieden waren in u, om onderlinge handel met u te drijven.", "Richt 5:17": "Gilead bleef aan de andere zijde van de Jordaan; en Dan, waarom onthield hij zich in schepen! Aser zat aan de zeehaven, en bleef in zijn gescheurde plaatsen.", "Jes 23:1-6": "De last van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt. Zwijg, u inwoners van het eiland! U, die de kooplieden van Sidon, die over zee voeren, rijk maakten, En wiens inkomsten het zaad van Sichor was over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken.", "2 Kron 9:1-12": "En toen de koningin van Scheba het gerucht van Salomo hoorde, kwam zij naar Jeruzalem, om Salomo met raadsels op de proef te stellen, met een zeer groot leger, en kamelen die specerijen droegen, en veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat in haar hart was. En Salomo verklaarde haar al haar vragen; en er was niets voor Salomo verborgen, dat hij haar niet verklaarde. Toen de koningin van Scheba de wijsheid van Salomo zag, en het huis dat hij gebouwd had,", "Ezech 28:7": "Daarom zie, Ik zal vreemden over u brengen, de meest tirannieke van de heidenvolken; die zullen hun zwaarden trekken tegen de schoonheid van uw wijsheid, en zullen uw glans ontheiligen.", "Openb 18:19": "En zij wierpen stof op hun hoofden, en riepen, wenend en rouw bedrijvend, en zeiden: Wee, wee, de grote stad, waarin allen die schepen op de zee hadden, rijk geworden zijn van haar kostbaarheid; want zij is in één uur verwoest.", "Joz 13:5": "Daarbij het land van de Giblieten, en de hele Libanon naar de opgang van de zon toe, van Baäl-gad af, onder aan de berg Hermon, tot aan de ingang van Hamath toe.", "Spr 11:4": "Bezit doet geen nut ten dage van de verbolgenheid; maar de gerechtigheid redt van de dood.", "2 Kron 9:10": "Verder brachten ook de knechten van Huram, en de knechten van Salomo, die goud uit Ofir haalden, algummimhout en edelgesteente.", "Jes 19:9": "En de werkers in het fijne vlas zullen beschaamd worden, ook de wevers van de witte stof.", "Ezech 7:18": "Ook zullen zij zakken aangorden, gruwen zal hen bedekken, en over alle gezichten zal schaamte zijn, en op al hun hoofden kaalheid.", "Gen 12:4": "En Abram ging heen, zoals de HEERE tegen hem gesproken had; en Lot ging met hem mee; en Abram was vijfenzeventig jaar oud, toen hij uit Haran vertrok.", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Gen 10:13": "En Mitsraïm verwekte de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,", "Klaagl 2:10": "Jod. De oudsten van de dochter van Sion zitten op de aarde, zij zwijgen stil, zij werpen stof op hun hoofd, zij hebben zakken aangegord; de jonge dochters van Jeruzalem laten hun hoofd ter aarde hangen.", "Jes 33:23": "Uw touwen zijn slap geworden, zij zullen hun mast niet goed stijf kunnen houden, zij zullen het zeil niet kunnen uitspannen; dan zal de roof van een overvloedige buit uitgedeeld worden, zelfs zullen de lammen de roof roven.", "Ezech 26:4": "Die zullen de muren van Tyrus verderven, en haar torens afbreken; ja, Ik zal haar stof van haar wegvagen, en zal haar tot een gladde steenrots maken.", "Ezech 17:1": "En het woord van de HEERE kwam tot mij en zei:", "Hand 27:14": "Maar niet lang daarna sloeg er tegen het schip een stormwind op, genaamd Euroklydon.", "Ezech 28:4": "Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Gen 10:3": "En de zonen van Gomer zijn: Askenaz, en Rifath, en Togarma.", "Zach 9:3": "En Tyrus heeft zich sterkten gebouwd, en zilver verzameld als stof, en fijn goud als slijk van de straten;", "Deut 14:1": "U bent kinderen van de HEERE, uw God. U zult uzelf niet snijden, en geen kaalheid maken tussen uw ogen, over een dode.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Ezech 4:3": "Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "Ezech 27:32-36": "En zij zullen in hun gekerm een klaaglied over u opheffen, en over u weeklagen, en zeggen: Wie is geweest als Tyrus, als de uitgeroeide in het midden van de zee? Toen uw marktwaren uit de zeeën voortkwamen, hebt u veel volken verzadigd; met de veelheid van uw goederen en uw onderlinge koophandel, hebt u de koningen van de aarde rijk gemaakt. Ten tijde dat u uit de zeeën verbroken bent in de diepte van de wateren, zijn uw onderlinge koophandel en heel uw gemeente in het midden van u gevallen.", "Ps 72:10": "De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "Dan 5:6": "Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.", "Ex 15:14": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Nahum 3:16": "U hebt meer handelaars dan er sterren aan de hemel zijn; de kevers zullen invallen, en ervandaan vliegen.", "Hoogl 4:13": "Uw scheuten zijn een paradijs van granaatappels, met edele vruchten, cyprus met nardus;", "Ezech 25:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Ezech 28:20": "Verder gebeurde het woord van de HEERE tot mij:", "Amos 8:6": "Zodat wij de armen voor geld mogen kopen, en de nooddruftige om een paar schoenen; en dan zullen wij het kaf van het koren verkopen.", "Richt 18:29": "En zij noemden de naam van de stad Dan, naar de naam van hun vader Dan, die aan Israël geboren was; hoewel de naam van deze stad voorheen Lais was.", "Jes 66:19": "En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.", "Num 24:22": "Toch zal Kaïn verteerd worden, totdat Assur u gevankelijk zal wegvoeren!", "Jes 23:3-8": "En wiens inkomsten het zaad van Sichor was over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken. Word beschaamd, o Sidon! Want de zee spreekt, ja, de sterkte van de zee, en zegt: Ik heb geen weeën gehad, ik heb ook niet gebaard, en ik heb geen jongemannen groot gemaakt, en geen jonge meisjes opgevoed. Zoals het geweest is bij de tijding over Egypte, zo zal men ook in pijn zijn, als men over Tyrus horen zal.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Jer 2:10": "Want ga over naar de eilanden van de Chittiërs, en zie toe, en zend naar Kedar, en let er goed op; en zie, of zoiets is gebeurd?", "Ps 50:2": "Uit Sion, de volkomenheid van de schoonheid, verschijnt God blinkend.", "Gen 10:18": "En de Arvadiet, en de Tsemariet, en de Hamathiet; en daarna zijn de huisgezinnen van de Kanaänieten verspreid.", "Jes 23:6": "Vaar over naar Tarsis, huil, u inwoners van het eiland!", "Gen 39:17": "Toen sprak zij tot hem met diezelfde woorden, en zei: De Hebreeuwse knecht die u ons hebt binnengebracht, is bij mij gekomen, om met mij te spotten.", "Ezech 34:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Nahum 3:9": "Morenland en Egypte waren haar macht, en er was geen einde; Put en Lybea waren tot uw hulp.", "Hoogl 4:14": "Nardus en saffraan, kalmus en kaneel, met allerlei bomen van wierook, mirre en aloë, alsook alle voornaamste specerijen.", "Ezech 39:1": "Verder, mensenkind! Profeteer tegen Gog en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Gog, hoofdvorst van Mesech en Tubal!", "Jer 51:8": "Plotseling is Babel gevallen en verbroken; huil over haar, neem balsem voor haar pijn, misschien zal zij genezen worden.", "Jes 37:12": "Hebben de goden van de volken die mijn vaders vernietigd hebben, die gered — Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telassar waren?", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Ezech 7:1": "Daarna kwam het woord van de HEERE tot mij, en Hij zei:", "Ezech 29:1": "In het tiende jaar, in de tiende maand, op de twaalfde dag van de maand, kwam het woord van de HEERE tot mij. Hij zei:", "Openb 18:3": "Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.", "Zach 11:2": "Huil, u dennen! Omdat de ceders gevallen zijn, omdat die heerlijke bomen verwoest zijn; huil, u eiken van Basan! Omdat het sterke woud neergevallen is.", "Jer 8:22": "Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Hoogl 5:14": "Zijn handen zijn als gouden ringen, gevuld met turkoois; Zijn buik is als blinkend ivoor, overtrokken met saffieren.", "Ezech 15:1": "En het woord van de HEERE kwam tot mij:", "Ezech 27:21-36": "Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u. De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij op uw markten. Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur en Kilmad, handelden met u.", "Ezech 26:1": "En het gebeurde in het elfde jaar, op de eerste van de maand, dat het woord van de HEERE tot mij kwam en zei:", "2 Sam 2:9": "en maakte hem koning over Gilead, en over de Aschurieten, en over Jizreël, en over Efraïm, en over Benjamin, en over heel Israël.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "Ezech 20:45": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jes 60:7": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.", "Ezech 26:16": "En alle vorsten van de zee zullen afdalen van hun tronen, en hun mantels van zich doen, en hun gestikte klederen uittrekken; met sidderingen zullen zij bekleed worden, op de aarde zullen zij neerzitten, en elk ogenblik sidderen, en over u ontzet zijn;", "2 Kron 2:10": "En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.", "Ezech 35:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Gen 37:25": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen.", "Ezech 26:2": "Mensenkind! Omdat Tyrus van Jeruzalem gezegd heeft: Heah! Zij is verbroken, de poort van de volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!", "Num 24:24": "En de schepen van de kust van de Chitteeërs zullen Assur plagen, zij zullen ook Heber plagen; en ook hij zal voor altijd ten verderve zijn.", "Jer 25:23": "Dedan, en Tema, en Buz, en allen, die aan de hoeken kortgeschoren zijn;", "Matt 13:45": "Opnieuw, het Koninkrijk der hemelen is gelijk aan een koopman, die mooie parels zoekt;", "Jes 2:13": "En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Ezech 24:20": "En ik zei tegen hen: Het woord van de HEERE is tot mij gekomen, en Hij zei:", "Ps 83:8": "Gebal, en Ammon, en Amalek, Palestina met de inwoners van Tyrus.", "Deut 3:9": "(De Sidoniërs noemen Hermon Sirjon; maar de Amorieten noemen hem Senir.)", "2 Kron 2:14": "de zoon van een vrouw uit de dochters van Dan, en wiens vader een man van Tyrus geweest is, die weet te werken in goud, en in zilver, in koper, in ijzer, in stenen, en in hout, in purper, in hemelsblauw, en in fijn linnen, en in karmozijn, en om alle graveersels te graveren, en om elke vernuftige vinding te bedenken die hem voorgelegd zal worden, samen met uw wijzen, en de wijzen van mijn heer, uw vader David.", "Ezech 11:14": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Openb 18:17-24": "En alle stuurlieden, en al het volk op de schepen, en scheepslui, en allen die op zee handel drijven, stonden van verre; En riepen, toen zij de rook van haar brand zagen, en zeiden: Wat stad was aan deze grote stad gelijk? En zij wierpen stof op hun hoofden, en riepen, wenend en rouw bedrijvend, en zeiden: Wee, wee, de grote stad, waarin allen die schepen op de zee hadden, rijk geworden zijn van haar kostbaarheid; want zij is in één uur verwoest.", "Ezech 28:5": "Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.", "Ezech 13:1": "En het woord van de HEERE gebeurde tot mij, en zei:", "1 Kon 10:2": "En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was.", "Micha 1:8": "Hierom zal ik misbaar bedrijven en huilen; ik zal beroofd en naakt gaan; ik zal misbaar maken als de draken, en treuren als de jonge struisen.", "Ps 93:3": "De rivieren verheffen, o HEERE! de rivieren verheffen hun bruisen; de rivieren verheffen hun golfslag.", "Hand 2:11": "Kretenzers en Arabieren, wij horen hen in onze talen de grote werken van God spreken.", "Jer 48:37": "Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.", "Ezech 12:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Matt 11:16": "Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen,", "Jes 7:18": "Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn.", "Ezech 32:17": "Verder gebeurde het in het twaalfde jaar, op de vijftiende dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Ezech 32:1": "Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Klaagl 2:13": "Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Ezech 16:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "1 Kon 5:6": "Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs.", "Hand 9:2": "en vroeg hem om brieven aan de synagogen in Damaskus, opdat hij, als hij daar iemand zou vinden die van die weg was, zowel mannen als vrouwen, hen gebonden naar Jeruzalem zou brengen.", "Ezech 22:17": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Ezech 38:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "Ex 25:4": "En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar.", "2 Kron 8:18": "En Huram zond hem, door de hand van zijn knechten, schepen, alsook knechten die de zee kenden; en zij gingen met de knechten van Salomo naar Ofir, en zij haalden vandaar vierhonderdvijftig talenten goud, die zij naar koning Salomo brachten.", "Spr 7:16": "Ik heb mijn bed met tapijtsieraad bedekt, met uitgehouwen werken, met fijn linnen van Egypte;", "Zach 9:5": "Askelon zal het zien, en zal vrezen; evenzo Gaza, en zal grote smart hebben, alsook Ekron, omdat hetgeen waar zij op zagen, hen te schande heeft gemaakt; en de koning van Gaza zal vergaan, en Askelon zal niet bewoond worden.", "Jes 23:1-14": "De last van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt. Zwijg, u inwoners van het eiland! U, die de kooplieden van Sidon, die over zee voeren, rijk maakten, En wiens inkomsten het zaad van Sichor was over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken.", "Nahum 3:8": "Bent u beter dan No, de volkrijke, gelegen in de rivieren? die rondom heen water heeft, waarvan de voormuur de zee is, haar muur is van de zee.", "Est 7:4": "Want wij zijn verkocht, ik en mijn volk, om ons te verdelgen, te doden en om te brengen. Als wij nog tot knechten en tot dienstmaagden waren verkocht, zou ik gezwegen hebben, ofschoon de onderdrukker de schade van de koning geenszins zou kunnen vergoeden.", "Jes 23:2": "Zwijg, u inwoners van het eiland! U, die de kooplieden van Sidon, die over zee voeren, rijk maakten,", "Ezech 27:27-29": "Uw goed, en uw marktwaren, uw onderlinge koophandel, uw zeelieden, en uw schippers; die uw breuken verbeteren, en die onderlinge handel met u drijven, en al uw krijgslieden, die in u zijn, zelfs met heel uw gemeente, die in het midden van u is, zullen vallen in het hart van de zeeën, ten dage van uw val. Van het geluid van het geschreeuw van uw schippers zullen de voorsteden beven. En allen, die de riem hanteren, zeelieden, en alle schippers van de zee, zullen uit hun schepen naar beneden klimmen; op het land zullen zij staan blijven.", "Ezech 28:2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "Jes 23:9": "De HEERE van de heerscharen heeft het besloten, om de hoogmoed van alle luister te ontheiligen, om alle heerlijksten van de aarde verachtelijk te maken.", "Gen 15:2": "Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?", "Ezech 24:1": "Verder kwam het woord van de HEERE tot mij, in het negende jaar, in de tiende maand, op de tiende dag van de maand, en Hij zei:", "Ezech 28:16": "Door de veelheid van uw koophandel hebben zij het midden van u met geweld vervuld, en u hebt gezondigd; daarom zal Ik u ontheiligen van de berg van God, en zal Ik u, beschermende cherub, wegvagen uit het midden van de vurige stenen!", "Gen 23:16": "En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.", "Ezech 21:18": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "Ezech 27:5-7": "Zij hebben al uw scheepsplanken uit dennenbomen van Senir gebouwd; zij hebben ceders van de Libanon gehaald, om masten voor u te maken. Zij hebben uw riemen uit eiken van Basan gemaakt; uw dekken hebben zij gemaakt van welbewerkt ivoor, uit de eilanden van de Chittieten. Fijn linnen met stiksel uit Egypte was uw uitgespreide zeil, dat het u tot een zeil zou zijn; hemelsblauw en purper, uit de eilanden van Elisa, was uw dek.", "Ezech 7:13": "Want de verkoper zal tot het verkochte niet terugkeren, ook al zouden zij nog onder de levenden zijn; omdat het visioen aangaande de gehele menigte van het land niet zal terugkeren; en niemand zal door zijn ongerechtigheid zijn leven sterken.", "Hoogl 1:5": "Ik ben zwart, doch liefelijk, jullie dochters van Jeruzalem, zoals de tenten van Kedar, zoals de gordijnen van Salomo.", "Ps 48:8": "Met een oostenwind verbreekt U de schepen van Tharsis.", "Jer 46:11": "Ga heen op naar Gilead, en haal balsem, jonkvrouw, dochter van Egypte! Tevergeefs vermenigvuldigt u de medicijnen, er is geen genezing voor u.", "2 Kron 2:13": "Zo zend ik u nu een wijze man, kloek van verstand, Huram Abi;", "Ezech 29:18": "Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft.", "Gen 43:11": "Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem, en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen.", "1 Kron 1:29": "Dit zijn hun geboorten: de eerstgeborene van Ismaël was Nebajoth, en Kedar, en Adbeel, en Mibsam,", "Hand 7:4": "Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont.", "Ezech 12:21": "Opnieuw kwam het woord van de HEERE tot mij en Hij zei:", "1 Kon 11:24": "tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus.", "Hand 27:41": "Maar zij liepen vast op een plaats waar de zee aan beide zijden kwam, en zetten het schip daarop vast; en het voorschip bleef onbeweeglijk vastzitten, maar het achterschip brak stuk door het geweld van de golven.", "Jer 25:34": "Huil, herders! en schreeuw, en wentel u in de as, heerlijke leiders van de kudde! Want uw dagen zijn vervuld, dat men slachten zal, en van uw verstrooiingen; dan zult u vervallen als een kostelijk vat.", "Hoogl 4:4": "Uw hals is als de toren van David, die gebouwd is tot ophanging van wapentuig, waar duizend rondassen aan hangen, allemaal schilden van de helden.", "Jes 23:8": "Wie heeft dit besloten tegen Tyrus, de stad die anderen kroont, wier kooplieden vorsten zijn, wier handelaars de heerlijkste van het land zijn?", "Ezech 17:4": "Hij plukte de top van zijn jonge takjes af, en bracht hem in een land van koophandel; hij zette hem in een stad van kooplieden.", "Openb 17:15": "En hij zei tegen mij: De wateren die u gezien hebt, waar de hoer zit, zijn volken en menigten en naties en talen.", "Ezech 38:6": "Gomer en al zijn benden, en het huis van Togarma, aan de zijden van het noorden, en al zijn benden; veel volken met u.", "Ps 45:9": "Al Uw kleren zijn mirre, en aloë, en kassie; uit de ivoren paleizen, van waar zij U verblijden.", "1 Kon 22:49": "En Josafat maakte schepen van Tharsis, om naar Ofir te gaan voor goud; maar zij gingen niet, want de schepen werden gebroken bij Ezeon-Geber.", "Ex 30:24": "Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin.", "1 Kon 10:15": "behalve wat er binnenkwam van de kramers, en van de handel van de kruideniers, en van alle koningen van Arabië, en van de bestuurders van dat land.", "Gen 25:13": "En dit zijn de namen van de zonen van Ismaël, met hun namen naar hun geboorten. De eerstgeborene van Ismaël, Nebajoth; daarna Kedar, en Adbeël, en Mibsam,", "Ezech 32:26": "Daar is Mesech, en Tubal, met haar hele menigte; rondom hem zijn haar graven; zij zijn allen onbesneden, verslagenen door het zwaard, omdat zij hun schrik gegeven hebben in het land van de levenden.", "Ezech 22:23": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Ezech 27:12-25": "Tarsis dreef koophandel met u vanwege de veelheid van allerlei goed; met zilver, ijzer, tin, en lood handelden zij op uw markten. Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u. Uit het huis van Togarma leverden zij paarden, en ruiters, en muilezels op uw markten.", "Ex 30:23": "Neem u de beste specerijen: de zuiverste mirre, vijfhonderd sikkels, en geurige kaneel, half zoveel, namelijk tweehonderdvijftig sikkels, ook geurige kalmoes, tweehonderdvijftig sikkels;", "Job 40:25": "Zullen de metgezellen over hem een maaltijd bereiden? Zullen zij hem delen onder de kooplieden?", "Ezech 26:15-18": "Zo zegt de Heere HEERE tot Tyrus: Zullen niet de eilanden beven van het geluid van uw val, als de dodelijk verwonde zal kermen, wanneer men in het midden van u schrikkelijk zal moorden? En alle vorsten van de zee zullen afdalen van hun tronen, en hun mantels van zich doen, en hun gestikte klederen uittrekken; met sidderingen zullen zij bekleed worden, op de aarde zullen zij neerzitten, en elk ogenblik sidderen, en over u ontzet zijn; En zij zullen een klaaglied over u opheffen, en tot u zeggen: Hoe bent u uit de zeeën vergaan, u welbewoonde, u beroemde stad, die sterk geweest is ter zee, zij en haar inwoners; die hun schrik gaven aan allen die in haar woonden!", "Jer 18:16": "Om hun land te maken tot een verschrikking, tot eeuwige aanfluitingen; ieder die daar voorbijgaat, zal ontzet zijn, en met zijn hoofd schudden.", "Hoogl 7:4": "Uw hals is als een ivoren toren, uw ogen zijn als de vijvers te Hesbon, bij de poort van Bath-rabbim; uw neus is als de toren van Libanon, die uitziet naar Damascus.", "Ezech 7:12": "De tijd is gekomen, de dag is genaderd; de koper zij niet blij, en de verkoper klaagt niet; want een brandende toorn is over de gehele menigte van het land.", "Openb 18:11": "En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt;", "Job 28:18": "De Ramoth en Gabisch zullen niet gedacht worden; want de trek van de wijsheid is meer dan die van Robijnen.", "Dan 5:28": "PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "2 Kon 19:23": "Door uw boden hebt u de Heere gehoond, en gezegd: Ik heb met de menigte van mijn wagens de hoogten van de bergen beklommen, de flanken van de Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennenbomen omhakken; en ik zal komen tot in zijn verste herberg, in het woud van zijn mooie veld.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Ezech 18:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "2 Kron 9:21": "Want de schepen van de koning voeren naar Tharsis, met de knechten van Huram; eens in de drie jaar kwamen de schepen van Tharsis binnen, met goud, en zilver, ivoor, en apen, en pauwen.", "Ezech 38:3": "en zeg: Zo zegt de Heere HEERE: Zie, Ik wil aan u, o Gog, gij hoofdvorst van Mesech en Tubal!", "Ezech 37:15": "Verder gebeurde het dat het woord van de HEERE tot mij kwam:", "Ezech 23:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "2 Sam 15:8": "Want uw knecht heeft een gelofte gedaan, toen ik te Gesur in Syrië woonde, en zei: Als de HEERE mij werkelijk terug naar Jeruzalem zal brengen, dan zal ik de HEERE dienen.", "Jes 14:8": "Ook verheugen de dennen zich over u, en de ceders van Libanon, en zeggen: Sinds u daar neerligt, komt niemand tegen ons op die ons afhouwt.", "Ezech 36:16": "Verder gebeurde het: het woord van de HEERE kwam tot mij, en Hij zei:", "Jes 23:14": "Huil, u schepen van Tarsis! Want uw sterkte is verwoest.", "Gen 25:3": "En Joksan verwekte Seba en Dedan; en de zonen van Dedan waren de Assurieten, en Letusieten, en Leummieten.", "1 Sam 1:18": "En zij zei: Laat uw dienstmaagd genade vinden in uw ogen! Zo ging die vrouw haars weegs; en zij at, en haar gezicht was niet meer zo bedroefd.", "Ezech 27:12-36": "Tarsis dreef koophandel met u vanwege de veelheid van allerlei goed; met zilver, ijzer, tin, en lood handelden zij op uw markten. Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u. Uit het huis van Togarma leverden zij paarden, en ruiters, en muilezels op uw markten.", "Ezech 31:16": "Van het geluid van zijn val deed Ik de heidenvolken beven, toen Ik hem naar het rijk van de dood liet neerdalen, met hen die in de kuil neerdalen; en alle bomen van Eden, de keur en het beste van Libanon, alle bomen die water drinken, troostten zich in het onderste van de aarde.", "Openb 18:12-15": "Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen; En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen. En de vrucht van het verlangen van uw ziel is van u weggegaan; en alles wat lekker en heerlijk was, is van u weggegaan; en u zult het nooit meer vinden.", "1 Kon 9:26-28": "De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan de oever van de Schelfzee, in het land van Edom. En Hiram zond met die schepen zijn knechten, scheepslieden, kenners van de zee, met de knechten van Salomo. En zij kwamen te Ofir, en haalden daar goud vandaan, vierhonderdtwintig talenten, en brachten het naar de koning Salomo.", "Ezech 26:17": "En zij zullen een klaaglied over u opheffen, en tot u zeggen: Hoe bent u uit de zeeën vergaan, u welbewoonde, u beroemde stad, die sterk geweest is ter zee, zij en haar inwoners; die hun schrik gaven aan allen die in haar woonden!", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Deut 33:28": "Israël dan zal zeker alleen wonen, en Jakobs oog zal zijn op een land van koren en most; ja, zijn hemel zal van dauw druipen.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Micha 1:16": "Maak u kaal en scheer u, om uw troetelkinderen; verwijd uw kaalheid, als de arend, omdat zij gevankelijk van u zijn weggevoerd.", "Est 4:1-4": "Toen Mordechai wist wat er allemaal gebeurd was, verscheurde hij zijn kleren en trok een zak met as aan; en hij ging door het midden van de stad, en riep met een luid en bitter geroep. En hij kwam tot vóór de poort van de koning; want niemand mocht bij de poort van de koning naar binnen gaan, gekleed in een zak. En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.", "Gen 10:10": "En het begin van zijn rijk was Babel, en Erech, en Accad, en Calne, in het land Sinear.", "Ezech 26:14": "Ja, Ik zal u maken tot een gladde steenrots; u zult zijn tot uitspreiding van de netten, u zult niet meer gebouwd worden; want Ik, de HEERE, heb het gesproken, spreekt de Heere HEERE.", "1 Kon 5:11": "En Salomo gaf Hiram twintigduizend kor tarwe, tot voedsel van zijn huis, en twintig kor gestoten olie; dit gaf Salomo aan Hiram jaar op jaar.", "Ezech 38:2": "Mensenkind! Richt uw gezicht tegen Gog, het land van Magog, de hoofdvorst van Mesech en Tubal, en profeteer tegen hem,", "Job 2:8": "En hij nam zich een potscherf om zich daarmee te schrapen, en hij zat neer in het midden van de as.", "Jes 2:16": "En tegen alle schepen van Tarsis, en tegen alle gewenste schilderijen.", "2 Kron 2:8": "Zend mij ook cederen, dennen, en algummimhout uit Libanon; want ik weet dat uw knechten het hout van Libanon weten te houwen; en zie, mijn knechten zullen met uw knechten zijn.", "2 Kon 2:8": "Toen nam Elia zijn mantel, en wond hem samen, en sloeg het water, en het werd naar de ene en de andere kant verdeeld; en zij beiden gingen er door op het droge.", "Ezech 28:18": "Vanwege de veelheid van uw ongerechtigheden, door het onrecht van uw koophandel, hebt u uw heiligdommen ontheiligd; daarom heb Ik een vuur uit uw midden doen voortkomen, dat u heeft verteerd, en Ik heb u tot as gemaakt op de aarde, voor de ogen van allen die u zien.", "1 Kron 1:11": "En Mitsraïm verwekte de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,", "Job 1:15": "Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Jer 6:26": "O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige zoon, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.", "Ezech 25:13": "Daarom, zo zegt de Heere HEERE: Ik zal ook Mijn hand uitstrekken tegen Edom, en Ik zal mens en dier uit haar uitroeien; en Ik zal haar tot een woestenij maken, vanaf Teman; en zij zullen tot Dedan toe door het zwaard vallen.", "Ezech 21:8": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "Jes 16:9": "Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd;", "Amos 1:5": "En Ik zal de grendel van Damaskus verbreken, en zal de inwoner uitroeien uit Bikeat-aven, en hem die de scepter houdt, uit Beth-eden; en het volk van Syrië zal als gevangenen worden weggevoerd naar Kir, zegt de HEERE.", "Ezech 28:16-18": "Door de veelheid van uw koophandel hebben zij het midden van u met geweld vervuld, en u hebt gezondigd; daarom zal Ik u ontheiligen van de berg van God, en zal Ik u, beschermende cherub, wegvagen uit het midden van de vurige stenen! Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken. Vanwege de veelheid van uw ongerechtigheden, door het onrecht van uw koophandel, hebt u uw heiligdommen ontheiligd; daarom heb Ik een vuur uit uw midden doen voortkomen, dat u heeft verteerd, en Ik heb u tot as gemaakt op de aarde, voor de ogen van allen die u zien.", "Joël 3:3": "En zij hebben het lot geworpen over Mijn volk, en een jongetje gegeven voor een hoer, en een meisje verkocht voor wijn, om die te drinken.", "Jes 23:3": "En wiens inkomsten het zaad van Sichor was over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken.", "Ezech 33:23": "Toen kwam het woord van de HEERE tot mij:", "Joz 11:8": "En de HEERE gaf hen in de hand van Israël, en zij versloegen hen, en achtervolgden hen tot aan groot Sidon toe, en tot Misrefoth-maim, en tot het dal Mizpa tegen het oosten; en zij versloegen hen, totdat zij niemand van hen lieten overblijven.", "Dan 10:20": "Toen zei Hij: Weet u waarom Ik tot u gekomen ben? Doch nu zal Ik terugkeren om te strijden tegen de vorst der Perzen; en wanneer Ik zal zijn weggegaan, zie, dan zal de vorst van Griekenland komen.", "Deut 28:68": "En de HEERE zal u met schepen laten terugkeren naar Egypte, langs een weg waarvan ik u gezegd heb: U zult die niet meer zien; en daar zult u zich aan uw vijanden willen verkopen als slaven en slavinnen; maar er zal geen koper zijn.", "Gen 10:15": "En Kanaän verwekte Sidon, zijn eerstgeborene, en Heth,", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Richt 9:51": "Maar er was een sterke toren midden in de stad; daarheen vluchtten alle mannen en vrouwen, en alle burgers van de stad, en zij sloten zich voor zichzelf op; en zij klommen op het dak van de toren.", "Jes 7:20": "Op die dag zal de Heere door een gehuurd scheermes, dat aan de andere kant van de rivier is, door de koning van Assyrië, het hoofd afscheren, en het haar van de voeten; ja, het zal ook de baard helemaal wegnemen.", "1 Sam 6:15": "En de Levieten haalden de ark van de HEERE eraf en het koffertje dat erbij was, waarin de gouden kleinoden waren, en zetten ze op die grote steen; en de mensen van Beth-Semes brachten brandoffers en slachtten slachtoffers voor de HEERE, op diezelfde dag.", "Hoogl 3:6": "Wie is zij, die daar opkomt uit de woestijn, als rookpilaren, berookt met mirre en wierook, en met allerlei poeder van de kruidenier?", "Dan 8:21": "Die harige bok nu, is de koning van Griekenland; en de grote hoorn die tussen zijn ogen is, is de eerste koning.", "2 Kon 19:12": "Hebben de goden van de volken die mijn vaders vernietigd hebben, hen gered — zoals Gozan, en Haran, en Rezef, en de kinderen van Eden die in Telasser waren?", "Neh 3:31": "Na hem verbeterde Malchia, de zoon van het goudsmid, tot aan het huis van de Nethinim en van de kruideniers, tegenover de poort van Mifkad, en tot de bovenzaal van het punt.", "1 Kron 1:8": "De kinderen van Cham waren Cusch en Mitsraïm, Put, en Kanaän.", "Ezech 38:13": "Scheba, en Dedan, en de kooplieden van Tarsis, en al hun jonge leeuwen zullen tegen u zeggen: Komt u, om buit te buiten? Hebt u uw verzameling verzameld, om roof te roven? Om zilver en goud weg te voeren, om vee en have weg te nemen, om een grote buit te buiten?", "Jer 46:9": "Trekt op, paarden! En raast, wagens! En laat de helden uittrekken: de Moren, en de Puteeërs, die het schild hanteren, en de Lydiërs, die de boog hanteren en spannen.", "Ezech 30:20": "Ook gebeurde het in het elfde jaar, in de eerste maand, op de zevende van de maand, dat het woord van de HEERE tot mij kwam: het zei:", "1 Kon 10:1": "En toen de koningin van Scheba het gerucht van Salomo hoorde, aangaande de Naam van de HEERE, kwam zij om hem met raadsels te toetsen.", "1 Kron 1:7": "En de kinderen van Javan waren Elisa en Tharsisa, de Chittieten en Dodanieten.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Ps 83:9": "Ook heeft Assur zich bij hen gevoegd; zij zijn de kinderen van Lot tot steun geweest. Sela.", "Nahum 2:3": "De schilden van zijn helden zijn rood gemaakt, de dappere mannen zijn scharlakengekleurd; de wagens zijn in het vuur van de fakkels, ten dage als hij zich klaarmaakt; en de spiesen worden geschud.", "Zach 9:2-4": "En ook zal Hij Hamath ermee grenzen; Tyrus en Sidon, hoewel zij zeer wijs is; En Tyrus heeft zich sterkten gebouwd, en zilver verzameld als stof, en fijn goud als slijk van de straten; Zie, de Heere zal haar uit het bezit stoten, en Hij zal haar vesting in de zee verslaan; en zij zal met vuur verteerd worden.", "Klaagl 2:15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "Ezech 28:13": "U was in Eden, de hof van God; alle kostelijke stenen waren uw bedekking: sardisstenen, topazen en diamanten, turkooizen, sardonyxstenen en jaspisstenen, saffieren, robijnen en smaragden, en goud; het werk van uw trommels en uw pijpen was bij u; op de dag dat u geschapen werd, waren zij gereed.", "Jes 21:16": "Want zo heeft de Heere tegen mij gezegd: Nog binnen een jaar, zoals de jaren van een dagloner zijn, zal de heerlijkheid van Kedar ten onder gaan.", "2 Kron 9:14": "Behalve wat de kramers en de kooplieden inbrachten; ook brachten alle koningen van Arabië, en de vorsten van dat land, goud en zilver aan Salomo.", "Gen 32:22": "En hij stond in diezelfde nacht op, en nam zijn twee vrouwen, en zijn twee dienstmeisjes, en zijn elf kinderen, en trok over de doorwaadbare plaats van de Jabbok.", "Ezech 27:29-36": "En allen, die de riem hanteren, zeelieden, en alle schippers van de zee, zullen uit hun schepen naar beneden klimmen; op het land zullen zij staan blijven. En zij zullen hun stem over u laten horen, en bitter schreeuwen; en zij zullen stof op hun hoofden werpen, zij zullen zich wentelen in de as. En zij zullen zich over u helemaal kaal maken, en zakken aangorden; en zullen over u wenen met bitterheid van ziel, en bitter rouwklaagt.", "Ezech 28:11": "Verder gebeurde het woord van de HEERE tot mij:", "Ezech 32:10": "En Ik zal maken dat veel volken zich over u ontzetten, en hun koningen zullen de haren over u te berge staan, als Ik Mijn zwaard voor hun aangezicht zwaai; en zij zullen elk ogenblik sidderen, ieder voor zijn eigen leven, op de dag van uw val.", "1 Kon 10:1-13": "En toen de koningin van Scheba het gerucht van Salomo hoorde, aangaande de Naam van de HEERE, kwam zij om hem met raadsels te toetsen. En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was. En Salomo verklaarde haar al haar woorden; er was geen ding voor de koning verborgen, dat hij haar niet verklaarde.", "Ezech 12:17": "Daarna kwam het woord van de HEERE tot mij en Hij zei:", "Ezech 26:12": "En zij zullen uw vermogen roven, en uw koopwaren plunderen, en uw muren afbreken, en uw kostelijke huizen omwerpen; en uw stenen, en uw hout, en uw stof zullen zij in het midden van het water werpen.", "Jer 47:5": "Kaalheid is op Gaza gekomen; Askelon is uitgeroeid, met het overblijfsel van hun dal; hoe lang zult u uzelf insnijdingen maken?", "Neh 13:20": "Toen overnachtten de kramers en de verkopers van allerlei koopwaren buiten voor Jeruzalem, een of twee keer.", "Jes 54:12": "En uw glasvensters zal Ik van kristal maken, en uw poorten van robijnstenen, en uw hele grens van aangename stenen.", "Ezech 22:1": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Jer 6:20": "Waartoe zal dan de wierook voor Mij uit Scheba komen, en de beste kalmus uit ver land? Uw brandoffers zijn Mij niet behagelijk, en uw slachtoffers zijn Mij niet zoet.", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "Ezech 26:10": "Vanwege de menigte van zijn paarden zal het stof van die u bedekken; uw muren zullen beven vanwege het gedruis van de ruiters, en de wielen, en de wagens, als hij door uw poorten zal intrekken, zoals door de ingangen van een doorgebroken stad.", "Pred 7:3": "Het treuren is beter dan het lachen; want door de droefheid van het aangezicht wordt het hart gebeterd.", "Gen 10:2": "De zonen van Jafeth zijn: Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Thiras.", "Neh 2:3": "en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Ezech 21:1": "Het woord van de HEERE kwam tot mij, en Hij zei:", "1 Kon 10:10": "En zij gaf de koning honderdtwintig talenten goud, en zeer veel specerijen, en kostbaar gesteente; zoveel specerijen als de koningin van Scheba de koning Salomo gaf, is er nooit meer in zulke hoeveelheid gekomen.", "Jer 49:8": "Vlucht, keer u om, woon in diepe plaatsen, inwoners van Dedan! want Ik heb Ezaus verderf over hem gebracht, de tijd waarop Ik hem bezocht heb.", "Jes 33:21": "Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren.", "1 Kron 1:16": "En de Arvadieten, en de Zemarieten, en de Hamathieten.", "1 Kron 1:5": "De kinderen van Jafeth waren Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Tiras.", "Ex 28:19": "En de derde rij, een Hyacint, Agaat en Amethist.", "Ezech 29:17": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Openb 18:11-24": "En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt; Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen; En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "2 Kron 20:36": "En hij verbond zich met hem om schepen te maken, om naar Tharsis te gaan; en zij maakten de schepen in Ezeon-Geber.", "Jes 22:4": "Daarom zeg ik: Wend uw blik van mij af; laat mij bitter wenen; dring er niet op aan om mij te troosten over de verwoesting van de dochters van mijn volk.", "Hand 12:20": "En Herodes was zeer verbolgen op de Tyriërs en Sidoniërs; maar zij kwamen eensgezind naar hem toe, en nadat zij Blastus, de kamerheer van de koning, hadden overreed, vroegen zij om vrede, omdat hun land werd bevoorraad vanuit het land van de koning.", "Ezech 22:18": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.", "Openb 18:11-15": "En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt; Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen; En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "1 Kron 1:9": "En de kinderen van Cusch waren Seba, en Havila, en Sabta, en Raema, en Sabtecha; en de kinderen van Raema waren Scheba en Dedan.", "1 Kon 10:22": "Want de koning had op zee schepen van Tharsis, samen met de schepen van Hiram; deze schepen van Tharsis kwamen eens in de drie jaar binnen, met goud, en zilver, ivoor, en apen, en pauwen.", "Openb 18:12": "Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen;", "Lev 21:5": "Zij zullen op hun hoofd geen kaalheid maken, en zullen de hoek van hun baard niet afscheren, en in hun vlees zullen zij geen sneden snijden.", "Ezech 27:21-24": "Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u. De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij op uw markten. Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur en Kilmad, handelden met u.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Hos 12:8": "In de hand van de koopman is een bedrieglijke weegschaal, hij houdt ervan te verdrukken;", "Ezech 30:5": "Morenland, en Put, en Lud, en heel de gemengde hoop, en Cub, en de kinderen van het land van het verbond zullen met hen vallen door het zwaard.", "Gen 10:7": "En de zonen van Cusch zijn: Seba en Havila, en Sabta, en Raema, en Sabtecha. En de zonen van Raema zijn: Scheba en Dedan.", "2 Kron 9:9": "En zij gaf de koning honderdtwintig talenten goud, en specerijen in zeer grote hoeveelheid, en kostbaar gesteente; en er is nooit meer zulke specerij geweest als de koningin van Scheba aan koning Salomo gaf.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Hand 27:30": "Maar toen de scheepslieden probeerden uit het schip te vluchten en de boot neerlieten in de zee, onder het voorwendsel alsof zij uit het voorschip de ankers zouden uitbrengen,", "Ps 92:13": "De rechtvaardige zal groeien als een palmboom; hij zal groeien als een cederboom op de Libanon.", "Ezech 26:21": "Maar u zal Ik tot een grote schrik stellen, en u zult er niet meer zijn; als u gezocht wordt, zo zult u niet meer gevonden worden in eeuwigheid, spreekt de Heere HEERE.", "Jer 49:23": "Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een slecht gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten.", "Gen 10:6": "En de zonen van Cham zijn: Cusch en Mitsraïm, en Put, en Kanaän.", "Ezech 28:1": "Verder gebeurde het woord van de HEERE tot mij:", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Gal 4:25": "want Hagar is de berg Sinaï in Arabië, en komt overeen met het huidige Jeruzalem, dat met haar kinderen in dienstbaarheid is.", "Num 31:22": "Alleen het goud en het zilver, het koper, het ijzer, het tin en het lood;", "Ezech 27:13-25": "Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u. Uit het huis van Togarma leverden zij paarden, en ruiters, en muilezels op uw markten. De kinderen van Dedan waren uw kooplieden; veel eilanden waren de koophandel van uw hand; hoornen van ivoor en ebbenhout gaven zij u terug tot een geschenk.", "Gen 11:32": "En de dagen van Terah waren tweehonderd en vijf jaar, en Terah stierf te Haran.", "Ezech 26:5": "Zij zal in het midden van de zee zijn tot uitspreiding van netten; want Ik heb het gesproken, spreekt de Heere HEERE; en zij zal de heidenvolken ten roof worden.", "Jer 25:24": "En alle koningen van Arabië; en alle koningen van de gemengde volksmassa, die in de woestijn wonen;", "Jer 10:17": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting!", "Ezech 17:11": "Daarna kwam het woord van de HEERE tot mij en zei:", "2 Kron 2:15": "Zo laat mijn heer nu aan zijn knechten de tarwe en de gerst, de olie en de wijn zenden, waarover hij gesproken heeft.", "Jes 47:15": "Zo zullen zij u zijn, met wie u gearbeid hebt, uw handelaars van uw jeugd af aan; ieder zal zijns weegs dwalen, niemand zal u verlossen.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "Ezech 38:5": "Perzen, Moren en Puteeërs met hen, die allemaal schild en helm voeren;", "Ezech 28:12-17": "Mensenkind! Hef een klaaglied aan over de koning van Tyrus, en zeg tegen hem: Zo zegt de Heere HEERE: U, verzegelaar van de som, vol van wijsheid en volmaakt in schoonheid! U was in Eden, de hof van God; alle kostelijke stenen waren uw bedekking: sardisstenen, topazen en diamanten, turkooizen, sardonyxstenen en jaspisstenen, saffieren, robijnen en smaragden, en goud; het werk van uw trommels en uw pijpen was bij u; op de dag dat u geschapen werd, waren zij gereed. U was een gezalfde, beschermende cherub; en Ik had u zo gezet; u was op de heilige berg van God; u wandelde in het midden van de vurige stenen.", "1 Kon 5:9": "Mijn knechten zullen het afbrengen van de Libanon naar de zee; en ik zal het op vlotten over de zee laten voeren, tot die plaats, die u aan mij zult ontbieden, en zal het daar los maken, en u zult het wegnemen; u zult ook mijn wil doen, dat u mijn huis voedsel geeft.", "1 Kon 9:27": "En Hiram zond met die schepen zijn knechten, scheepslieden, kenners van de zee, met de knechten van Salomo.", "1 Kon 9:8": "En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "1 Kron 5:23": "De kinderen nu van de halve stam van Manasse woonden in dat land. Zij werden talrijker, van Basan tot aan Baäl-Hermon, en Senir, en de berg Hermon.", "Ezech 12:8": "En 's morgens kwam het woord van de HEERE tot mij en Hij zei:", "Ezech 14:12": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Ezech 28:8": "Naar de groeve zullen zij u doen neerdalen; en u zult sterven de dood van een verslagene, in het hart van de zeeën.", "1 Kon 11:25": "En hij was Israëls tegenstander al de dagen van Salomo, naast het kwaad dat Hadad deed; want hij had een afkeer van Israël, en hij regeerde over Syrië.", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "Gen 37:36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht.", "1 Kron 1:6": "En de kinderen van Gomer waren Askenaz, en Difath, en Thogarma.", "1 Sam 4:12": "Toen liep er een Benjaminiet uit de slagorde, en kwam dezelfde dag in Silo aan; zijn kleren waren gescheurd, en er was aarde op zijn hoofd.", "Job 42:6": "Daarom verfoei ik mij, en ik heb berouw in stof en as.", "1 Kon 5:1": "En Hiram, de koning van Tyrus, zond zijn knechten naar Salomo (want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in de plaats van zijn vader), omdat Hiram David altijd bemind had.", "Jer 16:6": "Zodat groten en kleinen in dit land zullen sterven, zij zullen niet begraven worden; en men zal hen niet beklagen, noch zichzelf insnijden, noch zich kaal maken om hen.", "Openb 18:13": "En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "Openb 18:18": "En riepen, toen zij de rook van haar brand zagen, en zeiden: Wat stad was aan deze grote stad gelijk?", "Jes 42:10": "Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners.", "Micha 1:10": "Verkondigt het niet te Gath, weent zo jammerlijk niet; wentel u in het stof, in het huis van Afra.", "Dan 11:2": "En nu, ik zal u de waarheid bekendmaken; zie, er zullen nog drie koningen in Perzië opstaan, en de vierde zal veel rijker worden dan al de anderen; en nadat hij door zijn rijkdom sterk geworden is, zal hij hen allen opstoken tegen het koninkrijk van Griekenland.", "Ezech 6:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "1 Kon 10:29": "En een wagen kwam op en ging uit Egypte weg voor zeshonderd sikkel van het zilver, en een paard voor honderdvijftig; en zo voerden zij die uit door hun toedoen, voor alle koningen van de Hethieten, en voor de koningen van Syrië.", "1 Kron 1:32": "De kinderen nu van Ketura, Abrahams bijvrouw: zij baarde Zimram, en Joksan, en Medan, en Midian, en Isbak, en Suah. En de kinderen van Joksan waren Scheba en Dedan.", "2 Kron 17:11": "En van de Filistijnen brachten zij Josafat geschenken met het opgelegde geld; ook brachten de Arabieren hem klein vee, zevenduizend en zevenhonderd rammen, en zevenduizend en zevenhonderd bokken.", "1 Sam 6:8": "Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt.", "Amos 6:2": "Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied?"}, "noten": {}, "koppeling": {"1": "Verde
