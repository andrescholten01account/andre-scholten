"H3220\">seas,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1129\">builders</span> have <span class=\"wl wl-kjv\" data-code=\"H3634\">perfected</span> thy beauty.", "5": "They have <span class=\"wl wl-kjv\" data-code=\"H1129\">made</span> all thy ship <span class=\"wl wl-kjv\" data-code=\"H3871\">boards</span> of fir <span class=\"wl wl-kjv\" data-code=\"H1265\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H8149\">Senir:</span> they have <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H730\">cedars</span> from <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> masts", "6": "Of the <span class=\"wl wl-kjv\" data-code=\"H437\">oaks</span> of <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan</span> have they <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thine <span class=\"wl wl-kjv\" data-code=\"H4880\">oars;</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">company</span> of the <span class=\"wl wl-kjv\" data-code=\"H839\">Ashurites</span> have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thy <span class=\"wl wl-kjv\" data-code=\"H7175\">benches</span> of <span class=\"wl wl-kjv\" data-code=\"H8127\">ivory,</span> brought out of the <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> of Chittim.", "7": "Fine <span class=\"wl wl-kjv\" data-code=\"H8336\">linen</span> with broidered <span class=\"wl wl-kjv\" data-code=\"H7553\">work</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> was that which thou spreadest <span class=\"wl wl-kjv\" data-code=\"H4666\">forth</span> to be thy <span class=\"wl wl-kjv\" data-code=\"H5251\">sail;</span> <span class=\"wl wl-kjv\" data-code=\"H8504\">blue</span> and <span class=\"wl wl-kjv\" data-code=\"H713\">purple</span> from the <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> of <span class=\"wl wl-kjv\" data-code=\"H473\">Elishah</span> was that which covered", "8": "The <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon</span> and <span class=\"wl wl-kjv\" data-code=\"H719\">Arvad</span> were thy <span class=\"wl wl-kjv\" data-code=\"H7751\">mariners:</span> thy <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men, O <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> that were in thee, were thy pilots.", "9": "The <span class=\"wl wl-kjv\" data-code=\"H2205\">ancients</span> of <span class=\"wl wl-kjv\" data-code=\"H1380\">Gebal</span> and the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men thereof were in thee thy <span class=\"wl wl-kjv\" data-code=\"H919\">calkers:</span> all the <span class=\"wl wl-kjv\" data-code=\"H591\">ships</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> with their <span class=\"wl wl-kjv\" data-code=\"H4419\">mariners</span> were in thee to <span class=\"wl wl-kjv\" data-code=\"H6148\">occupy</span> thy merchandise.", "10": "They of <span class=\"wl wl-kjv\" data-code=\"H6539\">Persia</span> and of <span class=\"wl wl-kjv\" data-code=\"H3865\">Lud</span> and of <span class=\"wl wl-kjv\" data-code=\"H6316\">Phut</span> were in thine <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> thy <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> they <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> the <span class=\"wl wl-kjv\" data-code=\"H4043\">shield</span> and <span class=\"wl wl-kjv\" data-code=\"H3553\">helmet</span> in thee; they set <span class=\"wl wl-kjv\" data-code=\"H5414\">forth</span> thy comeliness.", "11": "The <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H719\">Arvad</span> with thine <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> were upon thy <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1575\">Gammadims</span> were in thy <span class=\"wl wl-kjv\" data-code=\"H4026\">towers:</span> they <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> their <span class=\"wl wl-kjv\" data-code=\"H7982\">shields</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about;</span> they have <span class=\"wl wl-kjv\" data-code=\"H3634\">made</span> thy <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty</span> perfect.", "12": "<span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish</span> was thy <span class=\"wl wl-kjv\" data-code=\"H5503\">merchant</span> by reason of the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of all kind of <span class=\"wl wl-kjv\" data-code=\"H1952\">riches;</span> with <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> <span class=\"wl wl-kjv\" data-code=\"H913\">tin,</span> and <span class=\"wl wl-kjv\" data-code=\"H5777\">lead,</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">traded</span> in thy fairs.", "13": "<span class=\"wl wl-kjv\" data-code=\"H3120\">Javan,</span> <span class=\"wl wl-kjv\" data-code=\"H8422\">Tubal,</span> and <span class=\"wl wl-kjv\" data-code=\"H4902\">Meshech,</span> they were thy <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants:</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">traded</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">persons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> in thy market.", "14": "They of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H8425\">Togarmah</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">traded</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5801\">fairs</span> with <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> and mules.", "15": "The <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1719\">Dedan</span> were thy <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants;</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> were the <span class=\"wl wl-kjv\" data-code=\"H5506\">merchandise</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> they <span class=\"wl wl-kjv\" data-code=\"H7725\">brought</span> thee for a <span class=\"wl wl-kjv\" data-code=\"H814\">present</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of <span class=\"wl wl-kjv\" data-code=\"H8127\">ivory</span> and ebony.", "16": "<span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> was thy <span class=\"wl wl-kjv\" data-code=\"H5503\">merchant</span> by reason of the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of the wares of thy <span class=\"wl wl-kjv\" data-code=\"H4639\">making:</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">occupied</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5801\">fairs</span> with <span class=\"wl wl-kjv\" data-code=\"H5306\">emeralds,</span> <span class=\"wl wl-kjv\" data-code=\"H713\">purple,</span> and broidered <span class=\"wl wl-kjv\" data-code=\"H7553\">work,</span> and fine <span class=\"wl wl-kjv\" data-code=\"H948\">linen,</span> and <span class=\"wl wl-kjv\" data-code=\"H7215\">coral,</span> and agate.", "17": "<span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> they were thy <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants:</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">traded</span> in thy <span class=\"wl wl-kjv\" data-code=\"H4627\">market</span> <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> of <span class=\"wl wl-kjv\" data-code=\"H4511\">Minnith,</span> and <span class=\"wl wl-kjv\" data-code=\"H6436\">Pannag,</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> and <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and balm.", "18": "<span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus</span> was thy <span class=\"wl wl-kjv\" data-code=\"H5503\">merchant</span> in the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of the wares of thy <span class=\"wl wl-kjv\" data-code=\"H4639\">making,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of all <span class=\"wl wl-kjv\" data-code=\"H1952\">riches;</span> in the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> of <span class=\"wl wl-kjv\" data-code=\"H2463\">Helbon,</span> and <span class=\"wl wl-kjv\" data-code=\"H6713\">white</span> wool.", "19": "<span class=\"wl wl-kjv\" data-code=\"H2051\">Dan</span> also and <span class=\"wl wl-kjv\" data-code=\"H3120\">Javan</span> going to and <span class=\"wl wl-kjv\" data-code=\"H235\">fro</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">occupied</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5801\">fairs:</span> <span class=\"wl wl-kjv\" data-code=\"H6219\">bright</span> <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> <span class=\"wl wl-kjv\" data-code=\"H6916\">cassia,</span> and <span class=\"wl wl-kjv\" data-code=\"H7070\">calamus,</span> were in thy market.", "20": "<span class=\"wl wl-kjv\" data-code=\"H1719\">Dedan</span> was thy <span class=\"wl wl-kjv\" data-code=\"H7402\">merchant</span> in <span class=\"wl wl-kjv\" data-code=\"H2667\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> for chariots.", "21": "<span class=\"wl wl-kjv\" data-code=\"H6152\">Arabia,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar,</span> they <span class=\"wl wl-kjv\" data-code=\"H5503\">occupied</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">thee</span> in <span class=\"wl wl-kjv\" data-code=\"H3733\">lambs,</span> and <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> and <span class=\"wl wl-kjv\" data-code=\"H6260\">goats:</span> in these were they thy merchants.", "22": "The <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> and <span class=\"wl wl-kjv\" data-code=\"H7484\">Raamah,</span> they were thy <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants:</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">occupied</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5801\">fairs</span> with <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of all <span class=\"wl wl-kjv\" data-code=\"H1314\">spices,</span> and with all <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and gold.", "23": "<span class=\"wl wl-kjv\" data-code=\"H2771\">Haran,</span> and <span class=\"wl wl-kjv\" data-code=\"H3656\">Canneh,</span> and <span class=\"wl wl-kjv\" data-code=\"H5729\">Eden,</span> the <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba,</span> <span class=\"wl wl-kjv\" data-code=\"H804\">Asshur,</span> and <span class=\"wl wl-kjv\" data-code=\"H3638\">Chilmad,</span> were thy merchants.", "24": "These were thy <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants</span> in all <span class=\"wl wl-kjv\" data-code=\"H4360\">sorts</span> of things, in <span class=\"wl wl-kjv\" data-code=\"H8504\">blue</span> <span class=\"wl wl-kjv\" data-code=\"H1545\">clothes,</span> and broidered <span class=\"wl wl-kjv\" data-code=\"H7553\">work,</span> and in <span class=\"wl wl-kjv\" data-code=\"H1595\">chests</span> of rich <span class=\"wl wl-kjv\" data-code=\"H1264\">apparel,</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">bound</span> with <span class=\"wl wl-kjv\" data-code=\"H2256\">cords,</span> and made of <span class=\"wl wl-kjv\" data-code=\"H729\">cedar,</span> among thy merchandise.", "25": "The <span class=\"wl wl-kjv\" data-code=\"H591\">ships</span> of <span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish</span> did <span class=\"wl wl-kjv\" data-code=\"H7788\">sing</span> of thee in thy <span class=\"wl wl-kjv\" data-code=\"H4627\">market:</span> and thou wast <span class=\"wl wl-kjv\" data-code=\"H4390\">replenished,</span> and made <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">glorious</span> in the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the seas.", "26": "Thy <span class=\"wl wl-kjv\" data-code=\"H7751\">rowers</span> have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> thee into <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters:</span> the <span class=\"wl wl-kjv\" data-code=\"H6921\">east</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> hath <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the seas.", "27": "Thy <span class=\"wl wl-kjv\" data-code=\"H1952\">riches,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5801\">fairs,</span> thy <span class=\"wl wl-kjv\" data-code=\"H4627\">merchandise,</span> thy <span class=\"wl wl-kjv\" data-code=\"H4419\">mariners,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2259\">pilots,</span> thy <span class=\"wl wl-kjv\" data-code=\"H919\">calkers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6148\">occupiers</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4627\">merchandise,</span> and all thy <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> that are in thee, and in all thy <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee, shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> into the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thy ruin.", "28": "The <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs</span> shall <span class=\"wl wl-kjv\" data-code=\"H7493\">shake</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> of thy pilots.", "29": "And all that <span class=\"wl wl-kjv\" data-code=\"H8610\">handle</span> the <span class=\"wl wl-kjv\" data-code=\"H4880\">oar,</span> the <span class=\"wl wl-kjv\" data-code=\"H4419\">mariners,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2259\">pilots</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from their <span class=\"wl wl-kjv\" data-code=\"H591\">ships,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> upon the land;", "30": "And shall cause their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> to be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> against thee, and shall <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> <span class=\"wl wl-kjv\" data-code=\"H4751\">bitterly,</span> and shall cast <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> upon their <span class=\"wl /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
