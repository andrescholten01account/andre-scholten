nkind! Hef een klaaglied op over Tyrus;","3":"En zeg tegen Tyrus, die daar woont aan de ingangen van de zee, handelend met de volken in veel eilanden: Zo zegt de Heere HEERE: O Tyrus! u zegt: Ik ben volmaakt in schoonheid.","4":"Uw grenzen zijn in het hart van de zeeën; uw bouwers hebben uw schoonheid volkomen gemaakt.","5":"Zij hebben al uw scheepsplanken *uit* dennenbomen van Senir gebouwd; zij hebben ceders van de Libanon gehaald, om masten voor u te maken.","6":"Zij hebben uw riemen *uit* eiken van Basan gemaakt; uw dekken hebben zij gemaakt *van* welbewerkt ivoor, uit de eilanden van de Chittieten.","7":"Fijn linnen met stiksel uit Egypte was uw uitgespreide zeil, dat het u tot een zeil zou zijn; hemelsblauw en purper, uit de eilanden van Elisa, was uw dek.","8":"De inwoners van Sidon en Arvad waren uw roeiers; uw wijzen, o Tyrus! die in u waren, die waren uw schippers.","9":"De oudsten van Gebal en haar wijzen waren in u, zij verbeterden uw breuken; alle schepen van de zee en hun zeelieden waren in u, om onderlinge handel met u te drijven.","10":"Perzen, en Lydiërs, en Puteeërs waren in uw leger, uw krijgslieden; schild en helm hingen zij in u op, die maakten uw sieraad.","11":"De kinderen van Arvad en uw leger waren rondom op uw muren, en de Gammadieten waren op uw torens; hun schilden hingen zij rondom aan uw muren; die maakten uw schoonheid volkomen.","12":"Tarsis dreef koophandel met u vanwege de veelheid van allerlei goed; met zilver, ijzer, tin, en lood handelden zij *op* uw markten.","13":"Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u.","14":"Uit het huis van Togarma leverden zij paarden, en ruiters, en muilezels *op* uw markten.","15":"De kinderen van Dedan waren uw kooplieden; veel eilanden waren de koophandel van uw hand; hoornen van ivoor en ebbenhout gaven zij u terug *tot* een geschenk.","16":"Syrië dreef koophandel met u, vanwege de veelheid van uw werken; met smaragden, purper, en gestikt werk, en zijde, en Ramoth, en Cadkod, handelden zij op uw markten.","17":"Juda en het land Israël waren uw kooplieden; met tarwe van Minnit en Pannag, en honing, en olie, en balsem, dreven zij onderlinge handel met u.","18":"Damaskus dreef koophandel met u, om de veelheid van uw werken, vanwege de veelheid van allerlei goed; met wijn van Chelbon en witte wol.","19":"Ook leverden Dan en Javan, de omreizer, op uw markten; glad ijzer, kassie en kalmoes was in uw onderlinge koophandel.","20":"Dedan handelde met u met kostbaar gewaad voor wagens.","21":"Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u.","22":"De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij *op* uw markten.","23":"Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur *en* Kilmad, handelden met u.","24":"Die waren uw kooplieden met allerlei sieraden, met pakken van hemelsblauw en gestikt werk, en met schatkisten van mooie kleren; gebonden met koorden, en in ceder gepakt, onder uw koopwaar.","25":"De schepen van Tarsis zongen van u, *vanwege* de onderlinge koophandel met u; en u was vervuld, en zeer verheerlijkt in het hart van de zeeën.","26":"Die u roeien, hebben u in groot water gevoerd; de oostenwind heeft u verbroken in het hart van de zeeën.","27":"Uw goed, en uw marktwaren, uw onderlinge koophandel, uw zeelieden, en uw schippers; die uw breuken verbeteren, en die onderlinge handel met u drijven, en al uw krijgslieden, die in u zijn, zelfs met heel uw gemeente, die in het midden van u is, zullen vallen in het hart van de zeeën, ten dage van uw val.","28":"Van het geluid van het geschreeuw van uw schippers zullen de voorsteden beven.","29":"En allen, die de riem hanteren, zeelieden, *en* alle schippers van de zee, zullen uit hun schepen naar beneden klimmen; op het land zullen zij staan blijven.","30":"En zij zullen hun stem over u laten horen, en bitter schreeuwen; en zij zullen stof op hun hoofden werpen, zij zullen zich wentelen in de as.","31":"En zij zullen zich over u helemaal kaal maken, en zakken aangorden; en zullen over u wenen met bitterheid van ziel, *en* bitter rouwklaagt.","32":"En zij zullen in hun gekerm een klaaglied over u opheffen, en over u weeklagen, en zeggen: Wie is geweest als Tyrus, als de uitgeroeide in het midden van de zee?","33":"Toen uw marktwaren uit de zeeën voortkwamen, hebt u veel volken verzadigd; met de veelheid van uw goederen en uw onderlinge koophandel, hebt u de koningen van de aarde rijk gemaakt.","34":"Ten tijde dat u uit de zeeën verbroken bent in de diepte van de wateren, zijn uw onderlinge koophandel en heel uw gemeente in het midden van u gevallen.","35":"Alle inwoners van de eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbijsterd van gezicht.","36":"De handelaars onder de volken fluiten u uit; u bent een grote schrik geworden, en zult er niet *meer* zijn tot in eeuwigheid."},"SV":{"1":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","2":"Gij dan, mensenkind! hef een klaaglied op over Tyrus;","3":"En zeg tot Tyrus, die daar woont aan de ingangen der zee, handelende met de volken in vele eilanden: Zo zegt de Heere HEERE: O Tyrus! gij zegt: Ik ben volmaakt in schoonheid.","4":"Uw landpalen zijn in het hart der zeeën; uw bouwers hebben uw schoonheid volkomen gemaakt.","5":"Zij hebben al uw denningen *uit* dennebomen van Senir gebouwd; zij hebben cederen van den Libanon gehaald, om masten voor u te maken.","6":"Zij hebben uw riemen *uit* eiken van Basan gemaakt; uw berderen hebben zij gemaakt *uw* welbetreden elpenbeen, uit de eilanden der Chittieten.","7":"Fijn linnen met stiksel uit Egypte was uw uitbreidsel, dat het u tot een zeil ware; hemelsblauw en purper, uit de eilanden van Elisa, was uw deksel.","8":"De inwoners van Sidon en Arvad waren uw roeiers; uw wijzen, o Tyrus! *die* in u waren, die waren uw schippers.","9":"De oudsten van Gebal en haar wijzen waren in u, verbeterende uw breuken; alle schepen der zee en haar zeelieden waren in u, om onderlingen handel met u te drijven.","10":"Perzen, en Lydiers, en Puteers waren in uw heir, uw krijgslieden; schild en helm hingen zij in u op, die maakten uw sieraad.","11":"De kinderen van Arvad en uw heir waren rondom op uw muren, en de Gammadieten waren op uw torens; hun schilden hingen zij rondom aan uw muren; die maakten uw schoonheid volkomen.","12":"Tarsis dreef koophandel met u vanwege de veelheid van allerlei goed; met zilver, ijzer, tin, en lood handelden zij *op* uw markten.","13":"Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlingen handel met u.","14":"Uit het huis van Togarma leverden zij paarden, en ruiteren, en muilezels *op* uw markten.","15":"De kinderen van Dedan waren uw kooplieden; vele eilanden waren de koophandel uwer hand; hoornen van elpenbeen en ebbenhout gaven zij u weder *tot* een verering.","16":"Syrië dreef koophandel met u, vanwege de veelheid uwer werken; met smaragden, purper, en gestikt werk, en zijde, en Ramoth, en Cadkod, handelden zij op uw markten.","17":"Juda en het land Israëls waren uw kooplieden; met tarwe van Minnit en Pannag, en honig, en olie, en balsem, dreven zij onderlingen handel met u.","18":"Damaskus dreef koophandel met u, om de veelheid uwer werken, vanwege de veelheid van allerlei goed; met wijn van Chelbon en witte wol.","19":"Ook leverden Dan en Javan, de omreizer, op uw markten; glad ijzer, kassie en kalmus was in uw onderlingen koophandel.","20":"Dedan handelde met u met kostelijk gewand tot wagens.","21":"Arabië en alle vorsten van Kedar waren de kooplieden uwer hand; met lammeren, en rammen, en bokken, daarmede handelden zij met u.","22":"De kooplieden van Scheba en Raema waren uw kooplieden; met alle hoofdspecerij, en met alle kostelijk gesteente en goud, handelden zij *op* uw markten.","23":"Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur *en* Kilmad, handelden met u.","24":"Die waren uw kooplieden met volkomen sieradien, met pakken van hemelsblauw en gestikt werk, en met schatkisten van schone klederen; gebonden met koorden, en in ceder gepakt, onder uw koopmanschap.","25":"De schepen van Tarsis zongen van u, *vanwege* den onderlingen koophandel met u; en gij waart vervuld, en zeer verheerlijkt in het hart der zeeën.","26":"Die u roeien, hebben u in grote wateren gevoerd; de oostenwind heeft u verbroken in het hart der zeeën.","27":"Uw goed, en uw marktwaren, uw onderlinge koophandel, uw zeelieden, en uw schippers; die uw breuken verbeteren, en die onderlingen handel met u drijven, en al uw krijgslieden, die in u zijn, zelfs met uw ganse gemeente, die in het midden van u is, zullen vallen in het hart der zeeën, ten dage van uw val.","28":"Van het geluid des geschreeuws uwer schippers zullen de voorsteden beven.","29":"En allen, die den riem handelen, zeelieden, *en* alle schippers van de zee, zullen uit hun schepen nederklimmen; op het land zullen zij staan blijven.","30":"En zij zullen hun stem over u laten horen, en bitterlijk schreeuwen; en zij zullen stof op hun hoofden werpen, zij zullen zich wentelen in de as.","31":"En zij zullen zich over u gans kaal maken, en zakken aangorden; en zullen over u wenen met bitterheid der ziel, *en* bittere rouwklage.","32":"En zij zullen in hun gekerm een klaaglied over u opheffen, en over u weeklagen, *zeggende*: Wie is geweest als Tyrus, als de uitgeroeide in het midden der zee?","33":"Als uw marktwaren uit de zeeën voortkwamen, hebt gij vele volken verzadigd; met de veelheid uwer goederen en uw onderlingen koophandel, hebt gij de koningen der aarde rijk gemaakt.","34":"Ten tijde, dat gij uit de zeeën verbroken zijt in de diepte der wateren, zijn uw onderlinge koophandel en uw ganse gemeente in het midden van u gevallen.","35":"Alle inwoners der eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbaasd van aangezicht.","36":"De handelaars onder de volken fluiten u aan; gij zijt een grote schrik geworden, en zult er niet *meer* zijn tot in eeuwigheid."},"KJV":{"1":"The word of the LORD came again unto me, saying,","2":"Now, thou son of man, take up a lamentation for Tyrus;","3":"And say unto Tyrus, O thou that art situate at the entry of the sea, *which art* a merchant of the people for many isles, Thus saith the Lord GOD; O Tyrus, thou hast said, I *am* of perfect beauty.","4":"Thy borders *are* in the midst of the seas, thy builders have perfected thy beauty.","5":"They have made all thy *ship* boards of fir trees of Senir: they have taken cedars from Lebanon to make masts","6":"*Of* the oaks of Bashan have they made thine oars; the company of the Ashurites have made thy benches *of* ivory, *brought* out of the isles of Chittim.","7":"Fine linen with broidered work from Egypt was that which thou spreadest forth to be thy sail; blue and purple from the isles of Elishah was that which covered","8":"The inhabitants of Zidon and Arvad were thy mariners: thy wise *men*, O Tyrus, *that* were in thee, were thy pilots.","9":"The ancients of Gebal and the wise *men* thereof were in thee thy calkers: all the ships of the sea with their mariners were in thee to occupy thy merchandise.","10":"They of Persia and of Lud and of Phut were in thine army, thy men of war: they hanged the shield and helmet in thee; they set forth thy comeliness.","11":"The men of Arvad with thine army *were* upon thy walls round about, and the Gammadims were in thy towers: they hanged their shields upon thy walls round about; they have made thy beauty perfect.","12":"Tarshish *was* thy merchant by reason of the multitude of all *kind of* riches; with silver, iron, tin, and lead, they traded in thy fairs.","13":"Javan, Tubal, and Meshech, they *were* thy merchants: they traded the persons of men and vessels of brass in thy market.","14":"They of the house of Togarmah traded in thy fairs with horses and horsemen and mules.","15":"The men of Dedan *were* thy merchants; many isles *were* the merchandise of thine hand: they brought thee *for* a present horns of ivory and ebony.","16":"Syria *was* thy merchant by reason of the multitude of the wares of thy making: they occupied in thy fairs with emeralds, purple, and broidered work, and fine linen, and coral, and agate.","17":"Judah, and the land of Israel, they *were* thy merchants: they traded in thy market wheat of Minnith, and Pannag, and honey, and oil, and balm.","18":"Damascus *was* thy merchant in the multitude of the wares of thy making, for the multitude of all riches; in the wine of Helbon, and white wool.","19":"Dan also and Javan going to and fro occupied in thy fairs: bright iron, cassia, and calamus, were in thy market.","20":"Dedan *was* thy merchant in precious clothes for chariots.","21":"Arabia, and all the princes of Kedar, they occupied with thee in lambs, and rams, and goats: in these *were they* thy merchants.","22":"The merchants of Sheba and Raamah, they *were* thy merchants: they occupied in thy fairs with chief of all spices, and with all precious stones, and gold.","23":"Haran, and Canneh, and Eden, the merchants of Sheba, Asshur, *and* Chilmad, *were* thy merchants.","24":"These *were* thy merchants in all sorts *of things*, in blue clothes, and broidered work, and in chests of rich apparel, bound with cords, and made of cedar, among thy merchandise.","25":"The ships of Tarshish did sing of thee in thy market: and thou wast replenished, and made very glorious in the midst of the seas.","26":"Thy rowers have brought thee into great waters: the east wind hath broken thee in the midst of the seas.","27":"Thy riches, and thy fairs, thy merchandise, thy mariners, and thy pilots, thy calkers, and the occupiers of thy merchandise, and all thy men of war, that *are* in thee, and in all thy company which *is* in the midst of thee, shall fall into the midst of the seas in the day of thy ruin.","28":"The suburbs shall shake at the sound of the cry of thy pilots.","29":"And all that handle the oar, the mariners, *and* all the pilots of the sea, shall come down from their ships, they shall stand upon the land;","30":"And shall cause their voice to be heard against thee, and shall cry bitterly, and shall cast up dust upon their heads, they shall wallow themselves in the ashes:","31":"And they shall make themselves utterly bald for thee, and gird them with sackcloth, and they shall weep for thee with bitterness of heart *and* bitter wailing.","32":"And in their wailing they shall take up a lamentation for thee, and lament over thee, *saying*, What *city is* like Tyrus, like the destroyed in the midst of the sea?","33":"When thy wares went forth out of the seas, thou filledst many people; thou didst enrich the kings of the earth with the multitude of thy riches and of thy merchandise.","34":"In the time *when* thou shalt be broken by the seas in the depths of the waters thy merchandise and all thy company in the midst of thee shall fall.","35":"All the inhabitants of the isles shall be astonished at thee, and their kings shall be sore afraid, they shall be troubled in *their* countenance.","36":"The merchants among the people shall hiss at thee; thou shalt be a terror, and never *shalt be* any more."}},"tsk":{"3":[{"kopje":"O Tyrus","refs":["Ezech 27:4","Ezech 27:25","Ezech 26:17","Ezech 28:2","Ezech 28:3","Jes 23:2"]},{"kopje":"handelend","refs":["Ezech 27:12-36","Jes 23:3","Jes 23:8","Jes 23:11","Openb 18:3","Openb 18:11-15"]},{"kopje":"Ik ben","refs":["Ezech 27:4","Ezech 27:10","Ezech 27:11","Ezech 28:12-17","Ps 50:2","Jes 23:9"]}],"4":[{"kopje":"hart","refs":["Ezech 26:5"]}],"5":[{"kopje":"van Senir","refs":["Deut 3:9","Hoogl 4:8"]},{"kopje":"ceders","refs":["1 Kon 5:1","1 Kon 5:6","Ps 29:5","Ps 92:13","Ps 104:16","Jes 14:8"]}],"6":[{"kopje":"eiken","refs":["Jes 2:13","Zach 11:2"]},{"kopje":"eilanden","refs":["Gen 10:4","Num 24:24","Jer 2:10"]}], "H7481\">troubled</span> in their countenance.","36":"The <span class=\"wl wl-kjv\" data-code=\"H5503\">merchants</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> at thee; thou shalt be a <span class=\"wl wl-kjv\" data-code=\"H1091\">terror,</span> and never shalt be any <span class=\"wl wl-kjv\" data-code=\"H5704\">more.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"3":[{"catchword":"de ingangen der zee,","tekst":"Dat is, waar men uit de zee aanvaart, en waar de zee rondom aanstaat. Zie 1Ki 5:1 ."},{"catchword":"handelende","tekst":"Of, die de voornaamste is onder de volken in het handelen, of koophandel drijven. Hebreeuws eigenlijk, de handelaren der volken."},{"catchword":"eilanden","tekst":"Zie Psa 72:10 ."}],"4":[{"catchword":"hart der zeeën;","tekst":"Dat is, in het midden, [gelijk vs.32], of recht in de zee; vergelijk Deu 4:11 ; alzo onder vs.25-27, en Eze 28:2 , Eze 28:8 ."}],"5":[{"catchword":"denningen","tekst":"Hebreeuws, twee tafelen, waardoor de overloop der schepen of scheeps denning [gelijk men zegt] verstaan wordt. Het Hebreeuwse woord staat in het getal van tweeën, gelijk de overloop der schepen veel in tweeën gedeeld is, afgaande aan beide zijden."},{"catchword":"Senir gebouwd;","tekst":"Wassende op dat gebergte; zie Deu 3:9 ."},{"catchword":"cederen van den Libanon","tekst":"Hebreeuws, ceder; zie Jdg 9:15 ."},{"catchword":"gehaald,","tekst":"Hebreeuws, genomen; dat is genomen en gebracht of gehaald. Zie Gen 12:15 , en Jer 37:17 ."},{"catchword":"masten voor u te maken","tekst":"Hebreeuws, mastboom."}],"6":[{"catchword":"uw berderen","tekst":"Hebreeuws, uw berd, of bank, of men zou het kunnen overzetten bankwerk."},{"catchword":"welbetreden","tekst":"Hebreeuws, ene dochter der treden, of gangen; dat is, hetwelk lang in de aarde gelegen, en waar men, vervolgens, lang over gegaan heeft, dat voor het rechte elpenbeen gehouden wordt, Plin.lib.8, cap.3; zie van deze manier van spreken Job 5:7 ; Isa 5:1 . Anders: uwe [scheeps] banken, [waarop men roeide, of waar de reizigers op zaten tot pracht] hebben die van de vereniging der Assyriërs [of, Aschurieten, zie 2Sa 2:9 met de aantekening] gemaakt van elpenbeen, enz., omdat de Hebreeuwse woorden Aschur en Asschur elkander zeer nakomen."},{"catchword":"elpenbeen,","tekst":"Zie 1Ki 10:18 ."},{"catchword":"Chittieten","tekst":"Zie Gen 10:4 . Sommigen verstaan de natiën, die westwaarts van Palestina gelegen waren."}],"7":[{"catchword":"Fijn linnen","tekst":"Zie Gen 41:42 ."},{"catchword":"stiksel uit Egypte","tekst":"Of borduursel."},{"catchword":"zeil ware;","tekst":"Of, vaan, vlag."},{"catchword":"hemelsblauw en purper,","tekst":"Dat is, klederen van die kleur."},{"catchword":"Elisa,","tekst":"Zie Gen 10:4 ."}],"8":[{"catchword":"Sidon","tekst":"Zie Gen 10:15 ."},{"catchword":"Arvad","tekst":"Zie Gen 10:18 . Alzo vs.11."},{"catchword":"wijzen,","tekst":"Die kloek, ervaren en bedreven waren in de zeevaart; alzo vs.9."},{"catchword":"schippers","tekst":"Of, matrozen, stuurlieden; alzo in het volgende."}],"9":[{"catchword":"Gebal","tekst":"Zie 1Ki 5:18 ."},{"catchword":"breuken;","tekst":"Hebreeuws, breuk, spleet, scheur; dat is, om uw kostelijke gebouwen en huizen te verbeteren. Of, gelijk sommigen, om de gaten te stoppen, de schepen te herstellen of te breeuwen."},{"catchword":"onderlingen handel","tekst":"Hebreeuws, om uwe menging te mengen, dat is, om zich met u in koophandel te begeven. De Hebreeuwse woorden, zijnde van eenen oorsprong, worden gebruikt van trafiek, koopmanschap, iets met elkander te verhandelen, contracteren, borg worden, enz., alzo in het volgende."}],"10":[{"catchword":"Lydiërs,","tekst":"Zie Gen 10:13 . Hebreeuws, Lud en Put."},{"catchword":"Puteërs","tekst":"Zie Gen 10:6 ."},{"catchword":"krijgslieden;","tekst":"Die gij zo voor uw garnizoen als anderszins tot hulp van vrienden, vrees van vijanden, en tot pracht, in uw dienst zeer statelijk onderhieldt."},{"catchword":"hingen zij in u op,","tekst":"Tot pronk en sieraad, gelijk men nog hedendaags met schone wapenen doet."},{"catchword":"maakten uw sieraad","tekst":"Of, brachten uw sieraad aan. Hebreeuws eigenlijk, gaven, hebben gegeven; dat is, zij maakten u sierlijk, versierden u, dienden tot uw sieraad."}],"11":[{"catchword":"Gammadieten","tekst":"Dezen worden bij sommigen gesteld in den omtrek van Fenicië, of zekere stad aldaar, genaamd Gammale, met verwisseling van de letter d in een l. [Zie Plin.lib.2.h.91 ], niet ver van Tyrus, noordwaarts. Hebreeuws, Gammadim. Sommigen gissen dat het komt van het woord Gomed, Jdg 3:16 , betekenende een el, of kubiek, elleboog, waarvan deze den naam zouden hebben gehad, als kloeke schutters, of wachters, garden, die de vestingen bewaarden, zijnde sterk van ellebogen, armen en vuisten, en alzo tot zulks bekwaam en dienstig."},{"catchword":"torens;","tekst":"Dat is, stadssterkten en vestingen."}],"12":[{"catchword":"Tarsis","tekst":"Zie Gen 10:4 ."},{"catchword":"dreef koophandel","tekst":"Of, was alzo uwe handelares. Alzo vs.16, 18."},{"catchword":"allerlei goed;","tekst":"Hebreeuws, alle; dat is, allerlei rijkdom, have, goederen, gelijk vs.33, alzo vs.18, 22."},{"catchword":"handelden zij","tekst":"Of, stelden zich in, begaven zich, vervoegden zich. Hebreeuws, gaven, of hebben zij gegeven. En zo dikwijls in het volgende."},{"catchword":"op uw markten","tekst":"Dit is hier ingevoegd uit vs.16, 19. Alzo in het volgende vs.14."}],"13":[{"catchword":"Javan, Tubal en Mesech","tekst":"Dat is, de nakomelingen van deze drie. Zie Gen 10:2 ."},{"catchword":"kooplieden;","tekst":"Of, kramers, handelsreizigers, veehandelaars."},{"catchword":"mensenzielen","tekst":"Dat is, personen of mensen. Zie Gen 12:5 , en Rev 18:13 . Versta, om die tot slaven te verkopen, of anderszins te verhandelen."}],"14":[{"catchword":"huis","tekst":"Dat is, geslacht of volk."},{"catchword":"Togarma","tekst":"Zie Gen 10:3 ."},{"catchword":"leverden zij paarden,","tekst":"Of, brachten zij, handelden zij [met] enz. gelijk vs.12, enz."}],"15":[{"catchword":"De kinderen","tekst":"Dat is, nakomelingen."},{"catchword":"Dedan","tekst":"Zie Gen 10:7 ; Jer 25:23 ."},{"catchword":"hand;","tekst":"Dat is, die gij tot uw koophandel en trafiek aan de hand hadt, of met welken gij handelt in kopen en verkopen, waarin het hand geven, of kloppen in de hand, het toeslaan van den koop, gebruikelijk was, als ook in andere onderhandelingen; vergelijk onder vs.21."},{"catchword":"gaven zij u weder","tekst":"Of, brachten. Hebreeuws, brachten zij weder uwe verering; dat is, u tot ene verering; of [gelijk sommigen] in betaling."}],"16":[{"catchword":"Syrië","tekst":"Hebreeuws, Aram; zie Gen 10:22 . Versta de Syriërs."},{"catchword":"werken;","tekst":"Of, maakselen; dat is, allerlei koopwaar, die in u bereid werd om te verhandelen. Alzo vs.18."},{"catchword":"gestikt werk,","tekst":"Of, geborduurd, borduursel."},{"catchword":"Ramoth,","tekst":"Zie Job 28:18 ."},{"catchword":"Cadkod,","tekst":"Zie Isa 54:12 ."}],"17":[{"catchword":"Juda en het land Israëls","tekst":"Vergelijk 1Ki 5:9 ; Act 12:20 ."},{"catchword":"Minnit","tekst":"Zie Jdg 11:33 ."},{"catchword":"Pannag,","tekst":"Dat sommigen houden voor balsem, anderen voor Fenicië."},{"catchword":"balsem,","tekst":"Zie Gen 37:25 ; Jer 8:22 ."}],"18":[{"catchword":"Damaskus","tekst":"Zie Gen 14:15 ; 2Sa 8:5 ."},{"catchword":"om de veelheid","tekst":"Of, met, in."},{"catchword":"werken,","tekst":"Gelijk vs.16."},{"catchword":"allerlei goed;","tekst":"Gelijk boven vs.12."},{"catchword":"Chelbon","tekst":"Dat sommigen houden voor Chalibon in Syrië."}],"19":[{"catchword":"leverden","tekst":"Of, handelden, gelijk vs.12."},{"catchword":"Dan","tekst":"Nakomelingen van Dan, wonende te Dan, aan het gebergte van Libanon; zie Jdg 18:29 ."},{"catchword":"Javan,","tekst":"Zie Gen 10:2 ."},{"catchword":"omreizer,","tekst":"Hebreeuws, Muzzal; dat is, die gedaan dat is, gedreven is om te reizen, af en aan, die omgejaagd, omgedreven wordt; te weten door begeerte aan gewin, gelijk kooplieden en kramers. Sommigen houden het voor een eigen naam ener natie."}],"20":[{"catchword":"Dedan handelde met u","tekst":"Dat is, de nakomelingen van Dedan; zie Gen 25:3 ."},{"catchword":"kostelijk gewand","tekst":"Hebreeuws, klederen der vrijheid; dat is, die vrije personen en geen knechten of slaven gebruiken, dat is, sierlijke, kostelijke."},{"catchword":"wagens","tekst":"Of, rijtuig, zadeltuig."}],"21":[{"catchword":"Arabië","tekst":"Dat is, de Arabieren."},{"catchword":"Kedar","tekst":"Zie Gen 25:13 ; Jer 2:10 ."},{"catchword":"hand;","tekst":"Zie boven vs.15."}],"22":[{"catchword":"Scheba en Raëma","tekst":"Zie van deze beide Gen 10:7 ."},{"catchword":"alle hoofdspecerij,","tekst":"Dat is, allerlei voornaamste en uitnemende specerijen. Alzo in het volgende. Vergelijk boven vs.12."}],"23":[{"catchword":"Haran,","tekst":"Zie Gen 11:31 ."},{"catchword":"Kanne,","tekst":"Dat sommigen houden voor Kalne, Gen 10:10 ."},{"catchword":"Eden,","tekst":"Zie Gen 2:8 ."},{"catchword":"Scheba,","tekst":"Sommigen houden dit voor Seba in woest Arabië, aan Mesopotamië. Zie Job 1:15 ."},{"catchword":"Assur en","tekst":"Dat is, de Assyriërs. Zie Gen 10:22 ."},{"catchword":"Kilmad,","tekst":"Dit houden sommigen voor een landschap in het bovenste van Medië, tussen Assyrië en Parthië gelegen."}],"24":[{"catchword":"volkomen sieradiën,","tekst":"Zie boven Eze 23:12 . Of, allerlei sortering, of in het gros. Hebreeuws, volkomenheden, volmaaktheden."},{"catchword":"pakken van hemelsblauw","tekst":"Of, balen, gevouwen stukken. Hebreeuws alsof men zeide: vouwselen, inwindselen. Anders: mantels, rokken, tabbaarden."},{"catchword":"gestikt werk,","tekst":"Of, geborduurd."},{"catchword":"schatkisten van schone klederen;","tekst":"Of, koffers."},{"catchword":"ceder gepakt,","tekst":"Hebreeuws, gecederd; dat is, in cederen kisten gedaan, gelegd, of ingemaakt. Of, van cederen gemaakte kisten, cederkisten."},{"catchword":"onder uw koopmanschap","tekst":"Of, op uwe beurs."}],"25":[{"catchword":"schepen","tekst":"Dat is, het zeevarende volk, of de passagiers."},{"catchword":"Tarsis","tekst":"De stad Tharsis, of de Oceaan. Zie 1Ki 10:22 ."},{"catchword":"vanwege","tekst":"Of, [op] uwe markten."},{"catchword":"vervuld,","tekst":"Te weten met allerlei rijkdom."},{"catchword":"hart der zeeën","tekst":"Gelijk boven vs.4, en in het volgende."}],"26":[{"catchword":"roeien,","tekst":"Dat is, uwe regenten, koningen en vorsten, die uwe leidslieden zijn, gelijk de roeiers in de schepen."},{"catchword":"grote wateren gevoerd;","tekst":"Of, geweldige; dat is, in groot gevaar en nood van schipbreuk. Vergelijk 2Sa 22:17 . Of, gij zijt tot zulk ene hoogte opgeklommen, dat uw val des te zwaarder zal zijn, waartoe gij de aanleiding hebt gegeven door uw grote pracht, gelijk schepen, in zware ruime wateren met hoge zeilen gevoerd, te lichter van den storm worden getroffen en verbroken."},{"catchword":"oostenwind","tekst":"Zie Exo 10:13 ; Job 27:21 ; Psa 48:8 , en boven Eze 17:10 ."}],"28":[{"catchword":"voorsteden beven","tekst":"Anders: gedreven baren der zee."}],"30":[{"catchword":"stof op hun hoofden","tekst":"Zie 2Sa 1:2 ."},{"catchword":"werpen,","tekst":"Hebreeuws, doen opkomen, opbrengen, opwerpen."},{"catchword":"wentelen in de as","tekst":"Gelijk Jer 6:26 ."}],"31":[{"catchword":"gans kaal maken,","tekst":"Hebreeuws eigenlijk, kaalheid, of zich [met] kaalheid kaal maken. Zie Jer 16:6 ."},{"catchword":"zakken aangorden;","tekst":"Zie Gen 37:34 ."},{"catchword":"bitterheid der ziel,","tekst":"Dat is, bittere droefheid des harten."}],"32":[{"catchword":"in hun gekerm","tekst":"Anders, hunne kinderen zullen, enz."},{"catchword":"uitgeroeide","tekst":"Te weten, stad."}],"35":[{"catchword":"eilanden","tekst":"Vergelijk boven Eze 26:15 ."},{"catchword":"staan de haren te berge,","tekst":"Gelijk onder Eze 32:10 ."},{"catchword":"aangezicht","tekst":"Tonende grote verschriktheid in hun gelaat."}],"36":[{"catchword":"u aan;","tekst":"Of, over u. Zie 1Ki 9:8 ; Jer 18:16 ."},{"catchword":"grote schrik geworden,","tekst":"Hebreeuws, verschrikkingen; alzo onder Eze 28:19 ."},{"catchword":"meer zijn tot in eeuwigheid","tekst":"Vergelijk boven Eze 26:14 , met de aantekening."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Furthermore, the word of the LORD came unto me saying:"}],"2":[{"catchword":null,"tekst":"Thou then child of man, take up a lamentation for Tyrus;"}],"3":[{"catchword":null,"tekst":"And say unto Tyrus that dwelleth at the entries of the sea, [That is, whereunto they sail from the sea, and whereupon the sea beateth on every side. See 1 Kings 5 on verse 1.] dealing with the nations [or which is the chiefest among the nations in dealing or exercising merchandise. Heb. Properly the dealer of the nations] in my isles: [see Psalms 72 on verse 10] thus saith the Lord LORD; o Tyrus, thou sayest I am perfect in beauty."}],"4":[{"catchword":null,"tekst":"Thy borders are in the heart of the sea: [that is, in the midst, (as verse 32) or directly in the sea. Compare Deuteronomy 4 on verse 11. so below verse 25,26,27. and chapter 28.2,8.] thy builders have perfected thy beauty."}],"5":[{"catchword":null,"tekst":"They have built all thy baths [Heb. Two tables, whereby is meant the hatches of a ship. The Hebrew word is used in the dual number, as hatches of ships are frequently divided into twain, going flopping down on both side] (of) fir-trees of senir: [growing on that mountain. See Deu 3:9] thy have fetcht] Heb. Taken, that is, taken and brought or fetcht. See Genesis 12 on verse 15 and Jeremiah 37 on verse 17.] cedars [Heb. Cedar. See Judges 9 on verse 15] from Libanon to make mast [Heb. Mast-tree] for thee."}],"6":[{"catchword":null,"tekst":"They have made thine oars (of) the oaks of Basan: thy boards [Heb. Thy board, or bench; or we may render it, bench-work] have they made (of) well trodden ivory, [Heb. A daughter of steps, or goings; that is, which hath layen long in the ground, and where consequently men have long gone over, which counted the right ivory, Plin, lib 8. cap. 3. see of this phrase Job 5 on verse 7. Isaiah 5 on verse 1. others, thy (ships) benches (whereon they rowed, or whereon the passengers set, for pomp) have those of the company of the Assyrians. See 2 Samuel 2.9 with the Annotat.) made of ivory,c. because the Hebrew word Aschur and Aschar are very like one another. See of the word ivory, 1 Kings 10 on verse 18.] from the isles of the chittites. [See Genesis 10 on verse 4. some understand by these the nations that lay westward from Palestina]"}],"7":[{"catchword":null,"tekst":"Fine linen [see Genesis 41 on verse 42.] with needle-work [or broidered work] from Egypt was thy spreading forth, to be a sail [or ensign, flag] for thee: skie-color, [that is, garments of this color] and purple from the isles of Elisa, [see genesis 10 on verse 4.] was thy covering."}],"8":[{"catchword":null,"tekst":"The inhabitants of Zidon [see genesis 10 on verse15] and Arvad [see Genesis 10 on verse 18 also verse 11.] where thy rowers: thy wise men, [that were expert, skilful and well versed in navigation, so verse 9.] O tyrus (that) were in thee they thy ship-masters. [or pilots, steermen. So in the sequel]"}],"9":[{"catchword":null,"tekst":"The oldest of Gebal [see 1 Kings 5 on verse 18] and the wise men thereof were in thee, mending thy breaches: [Heb. Breach, split, rent. That is, to repair thy costly buildings and houses: or as some, to stop the holes, to tallow the ships] all the ships of the sea and their sea men were in thee to drive a mutual trade with thee [Heb. To mix thy mixture; that is, to traffick with thee. The Hebrew word being of one root, and used of trading,, trafficking, dealing with one another for any commodity to contract together, to be surety for one another, &c. so in the sequel]"}],"10":[{"catchword":null,"tekst":"Persians and Lydians, [see Genesis 10 on verse 13.] and puteans, see Genesis 10 on verse 6. Heb. Lud and Put] were in thine army, thy shoulders: thy shoulders: [whom thou as well as thy own garrison, as otherwise to help thy friends, and to aw thine enemies, and for pomp, didst most stately maintain in thy service] they hanged up the shield and helmet in thee:] [for pomp and ornament, as is also yet practiced at this day; their fair and beautiful weapons] those thy made thine ornaments, [or brought thine ornament. Heb. Properly gave, have given, that is, they made thee comely, adorned thee, served for thy ornament or beauty]"}],"11":[{"catchword":null,"tekst":"The children of Arvad and thine army were upon thy walls round about, and the Gemmadites [These are placed some in a country of Phoenicia, or a certain city there called Gammale, by changing the letter d into an l, (see Pli. Lib. 2 chapter 93.) not far from Tyrus, northward. Heb. Gammadin. Some guess that it cometh from the word Gomed, Jud 3:16. signifying an ell or cubit, elbow, from whence also these people had their name as being expect archers, watchmen, guards, that kept the forts, being strong in their elbows, arms and hands and so fit and serviceable for that use, as followeth] were upon their towers: [that is, city-forts and strong holds] they hanged their shields upon thy walls round about; they made thy beauty perfect."}],"12":[{"catchword":null,"tekst":"Tharsis [see genesis 10 on verse 4.] traded with thee: [or was thy dealer. So verse 16.18.] by reason of the maltitude of all kinds of goods; [Heb. All, c. That is, all manner of riches, substance, goods: as verse 33. so verse 18.22] with silver, iron, tin and lead they traded [or set themselves, composed themselves. Heb. They gave or have given. And so often in the sequel] (in) [this word is here inserted from verse 16 and 19. so in the 1 verse following] thy fairs."}],"13":[{"catchword":null,"tekst":"Javan, Tubal andMesich, [that is, theposterity of these three. See Genesis 10 on verse 2.] they were thy merchants: [or traders, factors, dealers] they draw a mutual trade with thee with the souls of men, [that is, the persons or men themselves. See Genesis 12 on verse 5 and Rev 18:13 meaning to sell them for slaves, or otherwise to trade with them] and copper vessels."}],"14":[{"catchword":null,"tekst":"Of the house [That is, family or people] of Togarma, [see Genesis 10 on verse 3.] they delivered [or they brought and horsemen and mules in (thy) fairs."}],"15":[{"catchword":null,"tekst":"The children [That is, the posterity] of Dedan [See Genesis 10 on verse 7. Jeremiah 25 on verse 23.] were thy merchants; many isles were isles were the merchandise of thine hand, [that is, which thou hadth for thy merchandise and wares ready at hand, or wherewith thou didst trade in buying and selling, wherein the giving of the hand or striking of hands was a thing usual in concluding or making up of the bargain; as also in other mutual translations. Compare below verse 21.] They gave thee again (for) a present [or brought, c. Heb. They brought again thy present; that is, thee for a present: or (as some) in payment] horns of ivory and ebony-wood."}],"16":[{"catchword":null,"tekst":"Syria [Heb. Aram. See Genesis 10 on verse 22. Meaning the Syrians] traded with thee because of the multitude of thy works: [or makings; that is, all manner of wares that are made in thee to traffique or trade withal. So verse 18.] with Emeraulds, purple and needlework, [or broidered work] and silk, and Ramoth, [see Job 28 on verse 18] and Cadkod; [see Isa 54:12.] on thy markets did they trade."}],"17":[{"catchword":null,"tekst":"Juda and the land of Isaiah they were thy merchants; [Compare 1 Kings 5.9. Act 12:20] they drave a mutual trade with thee with wheat of Mimmith, [See Jud 11:33.] and Pannag, [which some conceive to be balm, others, Phenira] hony and oil and balm. [compare 1 Kings 5.9. Act 12:20. Of Balm see Gen 37:25 and Jer 8:22.]"}],"18":[{"catchword":null,"tekst":"Damascus [see Genesis 14 on verse 15 and Samuel 8 on verse 5] traded with thee for [Or, within] the multitude of thy works, [as above verse 16.] because of the maltitude of all manner of goos, [as above verse 12.] with wine of Chalboa, [wich someone conceive to be Charlibon in Syrian] and white wooll."}],"19":[{"catchword":null,"tekst":"Dan [The prosperity of Dan, dwelling at Dan, by mount Libanon, see Jud 18:29] also and Jaavan, [see Genesis 10 on verse 2.] the traveler [Heb. Muzzal; that is, he is done, that is, is driven to travel to and fro, he that is chafed about, driven about, to wit, out of a desire of gain, as merchants and traders are. Some conceive it to be the proper name of a nation] delivered [or, traders, as verse 12.] in thy markets; smooth iron, Cassia and Calamus was in thy mutual merchandise."}],"20":[{"catchword":null,"tekst":"Dedan [That is, pofterity of Dedan. See Gen 25:3] dealt with thee with precious vesture [Heb. Clothes of liberty, or freedom, that is, which free men, and not servants or bond-men use; that is rich, costly apparel] for charets: [Or, riding-furniture, faddle-furniture]"}],"21":[{"catchword":null,"tekst":"Arabia, [That is, the Arabians] and all the Prince of Kedar, [so Genesis 23 on verse 13. Jeremiah 2 on verse 10.] they were the merchants of thine hand; [see above verse 15.] with lams and rams and goats, therewith did they trade with thee."}],"22":[{"catchword":null,"tekst":"the merchants of Scheba and Raama, [see of these two, Genesis 10 on verse 7.] they were thy merchants: they escaped in the markets with all head-spices, [That is, all sorts of the chiefest and most excellent spices. So in the sequel. Compare above verse 12.] and with a ll precious stones and gold."}],"23":[{"catchword":null,"tekst":"Haran, [see Genesis 11 on verse 31.] and Canna, [some conceive this to be Calne, Gen 10:10] and Eden, [see Genesis 2 on verse 8] the merchants of Scheba, [some hold this to be Seka in desert Arabia, by Mesopotamia. See Job 1 on verse 15.] Assur, [That is the Assyrians. See Genesis // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

    }).join('');
}
function bijbeluitlegHtml(n) {

        if (kortCw) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    } else {

  const refChips = refs => {

    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?

      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);

  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
