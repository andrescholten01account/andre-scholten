w gezicht tegen Jeruzalem, en drup tegen de heiligdommen, en profeteer tegen het land van Israël;","3":"En zeg tegen het land van Israël: Zo zegt de HEERE: Zie, Ik zál tegen u, en Ik zal Mijn zwaard uit zijn schede trekken; en Ik zal van u uitroeien de rechtvaardige en de goddeloze.","4":"Omdat Ik dan van u zal uitroeien de rechtvaardige en de goddeloze, daarom zal Mijn zwaard uit zijn schede uitgaan tegen alle vlees, van het zuiden tot het noorden.","5":"En alle vlees zal weten dat Ik, de HEERE, Mijn zwaard uit zijn schede getrokken heb; het zal niet meer terugkeren.","6":"Maar u, mensenkind, zucht; zucht voor hun ogen met verbreking van de lenden en met bitterheid.","7":"En het zal gebeuren, als zij tegen u zeggen: Waarom zucht u? dat u zult zeggen: Om het gerucht, want het komt! En alle hart zal wegsmelten, en alle handen zullen verslappen, en alle geest zal terugkrimpen, en alle knieën zullen wegvloeien als water; zie, het komt, en het zal gebeuren, spreekt de Heere HEERE.","8":"Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:","9":"Mensenkind, profeteer en zeg: Zo zegt de HEERE: Zeg: Het zwaard, het zwaard is gescherpt, en ook gepolijst.","10":"Het is gescherpt, opdat het een slachting slacht; het is gepolijst, opdat het glinstert; zullen wij dan vrolijk zijn? Het is de roede van Mijn Zoon, die alle hout omzet.","11":"En Hij heeft het gegeven om gepolijst te worden, opdat men het met de hand kan hanteren; dat zwaard is gescherpt, en dat is gepolijst, om het in de hand van de doodslager te geven.","12":"Schreeuw en huil, o mensenkind, want het zal zijn tegen Mijn volk, het zal zijn tegen al de vorsten van Israël; verschrikkingen zullen vanwege het zwaard bij Mijn volk zijn; klop daarom op de heup.","13":"Als er beproeving was, wat was het dan? Zou er dan ook geen roede zijn die alles omzet, spreekt de Heere HEERE.","14":"Daarom, u, mensenkind, profeteer, en sla hand tegen hand; want het zwaard zal verdubbeld worden ten derden male, het is het zwaard van hen die verslagen zullen worden; het is het zwaard van de groten, die verslagen zullen worden, dat tot in hun binnenste kamers zal doordringen.","15":"Ik heb de punt van het zwaard gezet tegen al hun poorten, opdat het hart wegsmelt, en de aanstoten zich vermenigvuldigen; ach, het is gemaakt opdat het glinstert, het is ingewikkeld om te slachten.","16":"Houd u bijeen, o zwaard! Keer u naar rechts; schik u, keer u naar links, waarheen uw gezicht gesteld is.","17":"En Ik Zelf zal ook Mijn hand tegen Mijn hand slaan, en Mijn grimmigheid doen rusten; Ik, de HEERE, heb het gesproken.","18":"Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:","19":"U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.","20":"U zult een weg voorstellen, waardoor het zwaard zal binnenkomen tegen Rabba van de kinderen van Ammon, of tegen Juda, tot de versterkte stad Jeruzalem.","21":"Want de koning van Babel zal staan bij de wegsplitsing, aan het hoofd van de twee wegen, om waarzeggerij te gebruiken; hij zal zijn pijlen slijpen; hij zal de terafim raadplegen, hij zal de lever bekijken.","22":"De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen.","23":"Dit zal in hun ogen als een nutteloze waarzeggerij zijn, omdat zij met eden beëdigd zijn onder hen; maar hij zal aan de ongerechtigheid denken, opdat zij gegrepen worden.","24":"Daarom zegt de Heere HEERE zo: Omdat u uw ongerechtigheid laat gedenken, doordat uw overtredingen ontdekt worden, zodat uw zonden gezien worden in al uw handelingen; omdat aan u gedacht wordt, zult u met de hand gegrepen worden.","25":"En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid;","26":"Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.","27":"Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.","28":"En u, mensenkind, profeteer en zeg: Zo zegt de Heere HEERE over de kinderen van Ammon, en over hun smaad; zo zeg: Het zwaard, het zwaard is uitgetrokken, het is ter slachting gepolijst om te verslinden, om te glinsteren;","29":"Terwijl zij voor u nutteloze dingen zien, terwijl zij u leugen voorzeggen, om u op de halzen te leggen van hen die van de goddelozen verslagen zijn, wier dag gekomen was in de tijd van de uiterste ongerechtigheid.","30":"Keer uw zwaard terug in zijn schede! Op de plaats waar u geschapen bent, in het land van uw oorsprong, zal Ik u richten.","31":"En Ik zal over u Mijn gramschap uitgieten, Ik zal tegen u door het vuur van Mijn verbolgenheid blazen; en Ik zal u overgeven in de hand van woeste mensen, meesters in het verderf.","32":"U zult voedsel zijn voor het vuur, uw bloed zal zijn in het midden van het land; aan u zal niet meer gedacht worden; want Ik, de HEERE, heb het gesproken."},"SV":{"1":"En des HEEREN woord geschiedde tot mij, zeggende:","2":"Mensenkind! zet uw aangezicht tegen Jeruzalem, en drup tegen de heiligdommen, en profeteer tegen het land van Israël;","3":"En zeg tot het land van Israël: Alzo zegt de HEERE: Ziet, Ik *wil* aan u, en Ik zal Mijn zwaard uit zijn schede trekken; en Ik zal van u uitroeien den rechtvaardige en den goddeloze.","4":"Omdat Ik *dan* van u uitroeien zal den rechtvaardige en den goddeloze, daarom zal Mijn zwaard uit zijn schede uitgaan tegen alle vlees, van het zuiden *tot* het noorden.","5":"En alle vlees zal weten, dat Ik, de HEERE, Mijn zwaard uit zijn schede getrokken heb; het zal niet meer wederkeren.","6":"Maar gij, mensenkind, zucht; zucht voor hun ogen met verbreking der lenden en met bitterheid.","7":"En het zal geschieden, als zij tot u zeggen zullen: Waarom zucht gij, dat gij zeggen zult: Om het gerucht, want het komt! en alle hart zal versmelten, en alle handen zullen verslappen, en alle geest zal inkrimpen, en alle knieën *als* water henenvlieten; ziet, het komt, en het zal geschieden, spreekt de Heere HEERE.","8":"Wederom geschiedde des HEEREN woord tot mij, zeggende:","9":"Mensenkind, profeteer en zeg: Alzo zegt de HEERE: Zeg: Het zwaard, het zwaard is gescherpt, en ook geveegd.","10":"Het is gescherpt, opdat het een slachting slachte; het is geveegd, opdat het een glinster hebbe; of wij *dan* zullen vrolijk zijn? het is de roede Mijns Zoons, die alle hout versmaadt.","11":"En Hij heeft hetzelve te vegen gegeven, opdat men het met de hand handelen zou; dat zwaard is gescherpt, en dat is geveegd, om hetzelve in de hand des doodslagers te geven.","12":"Schreeuw en huil, o mensenkind, want hetzelve zal zijn tegen Mijn volk, het zal zijn tegen al de vorsten van Israël; verschrikkingen zullen vanwege het zwaard bij Mijn volk zijn; daarom klop op de heup.","13":"Als er beproeving was, wat was het toen? Zou er dan ook geen versmadende roede zijn, spreekt de Heere HEERE.","14":"Daarom gij, mensenkind, profeteer, en sla hand tegen hand; want het zwaard zal verdubbeld worden ten derden male, het is het zwaard dergenen, die verslagen zullen worden; het is het zwaard der groten, die verslagen zullen worden, dat tot hen in de binnenste kameren indringen zal.","15":"Ik heb de punt des zwaards gezet tegen al hun poorten, opdat het hart versmelte, en de aanstoten vermenigvuldigen; ach, het is toegemaakt, opdat het glinstere, het is ingewonden om te slachten.","16":"Houd u bijeen, o *zwaard*! keer u rechtsom, schik u, keer u linksom, waarhenen uw aangezicht gesteld is.","17":"En Ik Zelf zal ook Mijn hand tegen Mijn hand slaan, en Mijn grimmigheid doen rusten; Ik, de HEERE, heb het gesproken.","18":"Wederom geschiedde des HEEREN woord tot mij, zeggende:","19":"Gij nu, mensenkind, stel u twee wegen voor, waardoor het zwaard des konings van Babel komt; uit een land zullen zij beide voortkomen; en kies een zijde, kies ze aan het hoofd van den weg der stad.","20":"Gij zult een weg voorstellen, waardoor het zwaard inkomen zal tegen Rabba der kinderen Ammons, of tegen Juda, tot de vaste *stad* Jeruzalem.","21":"Want de koning van Babel zal aan de wegscheiding staan, aan het hoofd van de twee wegen, om waarzegging te gebruiken; hij zal zijn pijlen slijpen; hij zal de terafim vragen, hij zal de lever bezien.","22":"De waarzegging zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen te stellen, om den mond te openen in het doodslaan, om de stem op te heffen met gejuich, om stormrammen te stellen tegen de poorten, om sterkten op te werpen, om bolwerken te bouwen.","23":"Dit zal hun in hun ogen als een ijdel waarzeggen zijn, *omdat* *zij* met eden beedigd zijn onder hen; maar hij zal der ongerechtigheid gedenken, opdat zij gegrepen worden.","24":"Daarom zegt de Heere HEERE alzo: Omdat gijlieden uwer ongerechtigheid doet gedenken, doordien uw overtredingen ontdekt worden, zodat uw zonden gezien worden in al uw handelingen; omdat uwer gedacht wordt, zult gij met de hand gegrepen worden.","25":"En gij, o onheilig, goddeloos vorst van Israël, wiens dag komen zal, ten tijde der uiterste ongerechtigheid;","26":"Alzo zegt de Heere HEERE: Doe dien hoed weg, en hef dien kroon af, deze zal dezelfde niet wezen; Ik zal verhogen dien, die nederig is, en vernederen dien, die hoog is.","27":"Ik zal die *kroon* omgekeerd, omgekeerd, omgekeerd stellen; ja, zij zal niet zijn, totdat hij kome, die *daartoe* recht heeft, en *dien* Ik geven zal.","28":"En gij, mensenkind, profeteer en zeg: Alzo zegt de Heere HEERE, van de kinderen Ammons, en van hun smading; zo zeg: Het zwaard, het zwaard is uitgetrokken, het is ter slachting geveegd om te verdoen, om te glinsteren;","29":"Terwijl zij u ijdelheid zien, terwijl zij u leugen voorzeggen, om u op de halzen te stellen dergenen, die van de goddelozen verslagen zijn, welker dag gekomen was ten tijde der uiterste ongerechtigheid.","30":"Keer *uw* *zwaard* weder in zijn schede! In de plaats, waar gij geschapen zijt, in het land uwer woningen zal Ik u richten.","31":"En Ik zal over u Mijn gramschap uitgieten, Ik zal tegen u door het vuur Mijner verbolgenheid blazen; en Ik zal u overgeven in de hand van brandende mensen, smeders des verderfs.","32":"Het vuur zult gij tot spijze zijn, uw bloed zal zijn in het midden des lands; uwer zal niet gedacht worden; want Ik, de HEERE, heb het gesproken."},"KJV":{"1":"And the word of the LORD came unto me, saying,","2":"Son of man, set thy face toward Jerusalem, and drop *thy word* toward the holy places, and prophesy against the land of Israel,","3":"And say to the land of Israel, Thus saith the LORD; Behold, I *am* against thee, and will draw forth my sword out of his sheath, and will cut off from thee the righteous and the wicked.","4":"Seeing then that I will cut off from thee the righteous and the wicked, therefore shall my sword go forth out of his sheath against all flesh from the south to the north:","5":"That all flesh may know that I the LORD have drawn forth my sword out of his sheath: it shall not return","6":"Sigh therefore, thou son of man, with the breaking of *thy* loins; and with bitterness sigh before their eyes.","7":"And it shall be, when they say unto thee, Wherefore sighest thou? that thou shalt answer, For the tidings; because it cometh: and every heart shall melt, and all hands shall be feeble, and every spirit shall faint, and all knees shall be weak *as* water: behold, it cometh, and shall be brought to pass, saith the Lord GOD.","8":"Again the word of the LORD came unto me, saying,","9":"Son of man, prophesy, and say, Thus saith the LORD; Say, A sword, a sword is sharpened, and also furbished:","10":"It is sharpened to make a sore slaughter; it is furbished that it may glitter: should we then make mirth? it contemneth the rod of my son, *as* every tree.","11":"And he hath given it to be furbished, that it may be handled: this sword is sharpened, and it is furbished, to give it into the hand of the slayer.","12":"Cry and howl, son of man: for it shall be upon my people, it *shall be* upon all the princes of Israel: terrors by reason of the sword shall be upon my people: smite therefore upon *thy* thigh.","13":"Because *it is* a trial, and what if *the sword* contemn even the rod? it shall be no *more*, saith the Lord GOD.","14":"Thou therefore, son of man, prophesy, and smite *thine* hands together, and let the sword be doubled the third time, the sword of the slain: it *is* the sword of the great *men that are* slain, which entereth into their privy chambers.","15":"I have set the point of the sword against all their gates, that *their* heart may faint, and *their* ruins be multiplied: ah! *it is* made bright, *it is* wrapped up for the slaughter.","16":"Go thee one way or other, *either* on the right hand, *or* on the left, whithersoever thy face *is* set.","17":"I will also smite mine hands together, and I will cause my fury to rest: I the LORD have said","18":"The word of the LORD came unto me again, saying,","19":"Also, thou son of man, appoint thee two ways, that the sword of the king of Babylon may come: both twain shall come forth out of one land: and choose thou a place, choose *it* at the head of the way to the city.","20":"Appoint a way, that the sword may come to Rabbath of the Ammonites, and to Judah in Jerusalem the defenced.","21":"For the king of Babylon stood at the parting of the way, at the head of the two ways, to use divination: he made *his* arrows bright, he consulted with images, he looked in the liver.","22":"At his right hand was the divination for Jerusalem, to appoint captains, to open the mouth in the slaughter, to lift up the voice with shouting, to appoint *battering* rams against the gates, to cast a mount, *and* to build a fort.","23":"And it shall be unto them as a false divination in their sight, to them that have sworn oaths: but he will call to remembrance the iniquity, that they may be taken.","24":"Therefore thus saith the Lord GOD; Because ye have made your iniquity to be remembered, in that your transgressions are discovered, so that in all your doings your sins do appear; because, *I say*, that ye are come to remembrance, ye shall be taken with the hand.","25":"And thou, profane wicked prince of Israel, whose day is come, when iniquity *shall have* an end,","26":"Thus saith the Lord GOD; Remove the diadem, and take off the crown: this *shall* not *be* the same: exalt *him that is* low, and abase *him that is* high.","27":"I will overturn, overturn, overturn, it: and it shall be no *more*, until he come whose right it is; and I will give","28":"And thou, son of man, prophesy and say, Thus saith the Lord GOD concerning the Ammonites, and concerning their reproach; even say thou, The sword, the sword *is* drawn: for the slaughter *it is* furbished, to consume because of the glittering:","29":"Whiles they see vanity unto thee, whiles they divine a lie unto thee, to bring thee upon the necks of *them that are* slain, of the wicked, whose day is come, when their iniquity *shall have* an end.","30":"Shall I cause *it* to return into his sheath? I will judge thee in the place where thou wast created, in the land of thy nativity.","31":"And I will pour out mine indignation upon thee, I will blow against thee in the fire of my wrath, and deliver thee into the hand of brutish men, *and* skilful to destroy.","32":"Thou shalt be for fuel to the fire; thy blood shall be in the midst of the land; thou shalt be no *more* remembered: for I the LORD have spoken"}},"tsk":{"2":[{"kopje":"Zet","refs":["Ezech 4:3","Ezech 4:7","Ezech 20:46","Ezech 25:2","Ezech 28:21","Ezech 29:2","Ezech 38:2","Ef 6:19"]},{"kopje":"en drup","refs":["Deut 32:2","Amos 7:1 ght</span> it is; and I will give","28":"And thou, <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1121\">Ammonites,</span> and concerning their <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach;</span> even <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thou, The <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> is <span class=\"wl wl-kjv\" data-code=\"H6605\">drawn:</span> for the <span class=\"wl wl-kjv\" data-code=\"H2874\">slaughter</span> it is <span class=\"wl wl-kjv\" data-code=\"H4803\">furbished,</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">consume</span> because of the glittering:","29":"Whiles they <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity</span> unto thee, whiles they <span class=\"wl wl-kjv\" data-code=\"H7080\">divine</span> a <span class=\"wl wl-kjv\" data-code=\"H3577\">lie</span> unto thee, to <span class=\"wl wl-kjv\" data-code=\"H5414\">bring</span> thee upon the <span class=\"wl wl-kjv\" data-code=\"H6677\">necks</span> of them that are <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">when</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> shall have an end.","30":"Shall I cause it to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into his <span class=\"wl wl-kjv\" data-code=\"H8593\">sheath?</span> I will <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where thou wast <span class=\"wl wl-kjv\" data-code=\"H1254\">created,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of thy nativity.","31":"And I will pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> mine <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> upon thee, I will <span class=\"wl wl-kjv\" data-code=\"H6315\">blow</span> against thee in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of my <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1197\">brutish</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H2796\">skilful</span> to destroy.","32":"Thou shalt be for <span class=\"wl wl-kjv\" data-code=\"H402\">fuel</span> to the <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> thou shalt be no more <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered:</span> for I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have spoken"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"zet uw aangezicht tegen Jeruzalem,","tekst":"Zie boven Eze 20:46 ."},{"catchword":"drup tegen","tekst":"Dat is, stel leer, straf en vermaning voor. Zie Deu 32:2 ."},{"catchword":"de heiligdommen,","tekst":"Versta, den tempel des Heeren, over welken de Joden alzo roemden en pochten, alsof hij niet had kunnen uitgeroeid worden, Jer 7:4 . Het getal van velen wordt gebruikt, omdat deze tempel verscheidene delen had; zie Lev 26:31 ."},{"catchword":"land van Israël;","tekst":"Versta, het land van Juda, hetwelk een deel was van het land Kanaän, dat de Heere den Israëlieten tot hun erfdeel beloofd had. Zie boven Eze 6:2 ."}],"3":[{"catchword":"Ik wil aan u,","tekst":"Alsof de Heere zeide: De Babyloniërs hebben het niet alleen tegen u, maar Ik zelf ben uwe wederpartij, bereid om u te verderven; zie boven Eze 13:8 ."},{"catchword":"zwaard uit zijn schede trekken;","tekst":"Menselijkerwijze van God gesproken, gelijk ook Lev 26:33 . Zwaard voor de straf van den oorlog, Lev 26:6 . Somtijds schijnt het nog andere straffen te begrijpen, gelijk Job 19:29 ; gelijk de oorlog ene zee van alle plagen is; zie ook Psa 22:21 ."},{"catchword":"rechtvaardige en den goddeloze","tekst":"Versta, den rechtvaardige in schijn, en niet in waarheid, gelijk boven Eze 3:20 , zie de aantekening. Of den rechtvaardige in vergelijking met den goddeloze, die onrechtvaardiger is. Die minder goddeloos is, wordt gerechtvaardigd van dengene, die goddelozer is; dat is, rechtvaardiger geacht ten aanzien van hem; zie boven Eze 16:51-52 . Zo men het woord rechtvaardig verstaan wil van den waren vrome, zo wordt hij met den goddeloze gestraft, omdat hij bij denzelven blijft, hoewel de vrome niet vergaat gelijk de goddeloze; vergelijk Rev 18:4 ."}],"4":[{"catchword":"tegen alle vlees,","tekst":"Zie boven Eze 20:47-48 ."}],"5":[{"catchword":"niet meer wederkeren","tekst":"Dat is, niet weder in de schede gestoken worden; dat is niet ophouden te verderven, voordat het mijn volle wraak zal uitgevoerd hebben."}],"6":[{"catchword":"zucht; zucht","tekst":"Te weten om af te beelden het gekerm en gehuil, dat de Joden zouden maken, als zij de tijding krijgen zouden van de aankomst der Chaldeën."},{"catchword":"hun ogen","tekst":"Te weten van het volk, bij hetwelk gij woont. Want de daad van den profeet moest de gemeente een zeker voorteken zijn van de straffen, die over de Joden in Judea en Chaldea komen zouden."},{"catchword":"verbreking der lenden","tekst":"Dat is, met zulke zware ophaling van den adem uit de diepte van het lijf en met zodanigen gang en wringing der leden, alsof hem de lenden verbroken waren."},{"catchword":"met bitterheid","tekst":"Dat is, met zeer innerlijke smartende droefheid. Vergelijk 2Ki 4:27 ."}],"7":[{"catchword":"gerucht,","tekst":"Dat is, de zekere tijding van de komst der Chaldeën, om u te verderven."},{"catchword":"zal versmelten,","tekst":"Te weten door vrees. Zie Deu 1:28 en Jos 2:11 ."},{"catchword":"zullen verslappen,","tekst":"Door verbaasdheid en ontsteltenis; zie 2Sa 4:1 ."},{"catchword":"geest","tekst":"Dat is, moed; zie Pro 15:13 ."},{"catchword":"inkrimpen,","tekst":"Dat is, door het gevoel zijner ellenden benauwd, geperst en geprand zijn. Het tegendeel is als het hart zich wijd uitbreidt; Psa 119:32 ."},{"catchword":"henenvlieten;","tekst":"Hebreeuws, heengaan; dat is, hunne kracht verliezen. Zie boven Eze 7:17 ."},{"catchword":"komt,","tekst":"Te weten het gerucht, recht tevoren vermeld."}],"9":[{"catchword":"Het zwaard,","tekst":"Versta door het zwaard de plaag van den oorlog. Zie Lev 26:6 ."},{"catchword":"het zwaard is","tekst":"Het woord is verdubbeld om de grootheid en zekerheid der zaak, die verhaald wordt, mitsgaders de beweging desgenen, die het verhaal doet, uit te drukken, alsook om dengenen, wien het verhaal aangaat, tot hartelijke beweging te verwekken; vergelijk 2Ki 4:19 ; Isa 26:5 ; Jer 4:19 , en onder vs.28."},{"catchword":"gescherpt,","tekst":"Te weten om te straffen en te verderven."},{"catchword":"geveegd","tekst":"Dat is, schoon, net en sierlijk gemaakt."}],"10":[{"catchword":"een slachting slachte;","tekst":"Versta hierdoor de doding en vermoording der Joden door het zwaard en de wapens der Chaldeën. Het Hebreeuwse woord is ook zo genomen Psa 37:14 ; Isa 34:6 ; Jer 25:34 . Anders betekent het de slachting der beesten tot spijs en voeding van de mensen, Gen 43:16 ; Pro 9:2 , zie de aantekening."},{"catchword":"een glinster hebbe;","tekst":"Dat is bekwaam is om te verschrikken en te vermoorden; vergelijk Deu 32:41 ; Job 20:25 , en de aantekening."},{"catchword":"of wij dan zullen vrolijk zijn?","tekst":"Sommigen nemen dit voor de woorden van den profeet tot de Joden, met welke hij reden geeft waarom men moest zuchten, gelijk hem belast was, boven vs.6; namelijk omdat er geen oorzaak was van blijdschap, maar wel van zwaar zuchten. Hebreeuws, of wij zullen vrolijk zijn."},{"catchword":"het is","tekst":"Te weten het voorgemelde zwaard. Dit zijn de woorden Gods tot den profeet."},{"catchword":"de roede","tekst":"Dat is, de gesel, of straf; zie Job 9:34 ."},{"catchword":"Mijns Zoons,","tekst":"Dat is, waar Ik mijn zoon mede kastijd, te weten mijn volk Israël, hetwelk zo genaamd wordt ten aanzien van het verbond der genade; zie Exo 4:22 , en de aantekening. Of versta den natuurlijken en eeuwigen Zoon Gods, door wien de Vader zijne oordelen uitvoert; Psa 2:7-9 , Psa 2:12 ."},{"catchword":"die","tekst":"Te weten roede."},{"catchword":"alle hout","tekst":"Sommigen, alle geboomte; dat is alle mensen, die in Juda overig waren, hogen en lagen, vorsten en de gemeente; zie onder vs.12."},{"catchword":"versmaadt","tekst":"Dat is, zo sterk en taai is, dat zij tegen geen hout, hoe hard dat ook zij, met slaan wordt gebroken. Anders: de stam van mijn zoon versmaadt alle hout; dat is, mijn volk vraagt naar geen vaderlijke kastijding, daarom zal Ik met het zwaard straffen."}],"11":[{"catchword":"Hij heeft","tekst":"Namelijk God."},{"catchword":"hetzelve te vegen gegeven,","tekst":"Te weten zwaard."},{"catchword":"des doodslagers te geven","tekst":"Dat is, van den koning van Babel en zijn heirleger."}],"12":[{"catchword":"hetzelve zal zijn","tekst":"Te weten dat gescherpt en geveegd zwaard."},{"catchword":"tegen Mijn volk,","tekst":"Te weten om dat te verdelgen en uit te roeien."},{"catchword":"verschrikkingen","tekst":"Anders: zij, te weten de voorgemelde vorsten, zullen in het zwaard nedergestoten worden met mijn volk; dat is, zullen in het zwaard vallen en door den oorlog omkomen."},{"catchword":"klop op de heup","tekst":"Te weten tot een teken van grote droefheid; zie Jer 31:19 ."}],"13":[{"catchword":"beproeving was,","tekst":"Te weten waardoor Ik mijn volk hier tevoren beproefd heb door de Chaldeën en andere vijanden, die hen zeer geplaagd hebben; 2Ki 23:33 , en 2Ki 24:1 , enz.; 2Ch 36:3 , enz. Anders: indien het ene beproeving ware, wat zou het zijn? en zou hij [evenwel] niet een versmadende stam zijn?"},{"catchword":"wat was het toen?","tekst":"Dat is, wat heeft het geholpen, te weten tot verbetering van mijn volk? Hij wil zeggen, niet met al."},{"catchword":"Zou er dan","tekst":"Anders: zou het dan [te weten mijn volk] ook [onder] de versmadende roede niet zijn!"},{"catchword":"ook geen","tekst":"Te weten naardien het volk zich hoe langer hoe erger aanstelt."},{"catchword":"versmadende roede","tekst":"Zie boven vs.10."},{"catchword":"zijn,","tekst":"Door welke zij naar behoren gestraft worden."}],"14":[{"catchword":"sla hand tegen hand;","tekst":"Dat is, sla de handen samen, te weten tot een teken van ontsteltenis en droefheid over de moedwillige verkeerdheid der Joden en hun verschrikkelijken ondergang. Alzo boven Eze 6:11 . Zie de aantekening. Het kan ook zijn dat den profeet dit handklappen bevolen wordt, om te betekenen hoe de Chaldeën elkander ophitsen zouden om de Joden aan te vallen. Vergelijk vs.17, en onder Eze 22:13 ."},{"catchword":"ten derden male,","tekst":"Dat is, dikwijls gebruikt worden om de Joden te verderven. Of versta dit van drie grote slachtingen, die de Chaldeën onder de Joden gedaan hebben. Zie van de eerste, 2Ki 25:5-7 ; Jer 52:8-11 , van de tweede, 2Ki 25:8-10 , enz.; Jer 52:12-14 , enz. en van de derde, die na den dood van Gedalia onder de Joden, die in Egypte gevlucht waren, van de Chaldeën ook gedaan is. Zie Jer 41 , Jer 42 , Jer 43 , Jer 44 , Jer 45 , Jer 46 ."},{"catchword":"dergenen,","tekst":"Dat is, hetwelk vele mensen verslaan of ombrengen zal."},{"catchword":"groten,","tekst":"Dat is, waarmede niet alleen geringe en gemene lieden, maar ook heren en vorsten verslagen zullen worden. Zie van het woord groten, aldus genomen, 2Ki 5:1 , en 2Ki 10:6 , en de aantekening."},{"catchword":"tot hen in de binnenste kameren","tekst":"Dat is, tot degenen, die zich in de verborgenste plaatsen versteken zullen om het zwaard te ontgaan; vergelijk 1Ki 20:30 , en 1Ki 22:25 . Hebreeuws, da tot hen in het binnenste inkameren zal, of is inkamerende."}],"15":[{"catchword":"punt des zwaards","tekst":"Of, scherpte, of glans. Anderen vertalen het woord schrik, slachting, of geroep. Het wordt alleen hier gevonden."},{"catchword":"hun poorten,","tekst":"Dat is, tegen hunne steden, sterkten, welke hier in voortijden bestonden in hunne poorten; zie Gen 22:17 ."},{"catchword":"versmelte,","tekst":"Dat is, door angst en vrees verga, en alle kracht verlieze. Alzo Jos 2:9 , Jos 2:24 ; Job 30:22 ."},{"catchword":"de aanstoten vermenigvuldigen;","tekst":"Dat is, gelegenheden van vallen, waarin zij zich storten en verderven zullen, zoekende wel de gevaren te ontkomen, en hun leven te behouden; maar zouden zich van het ene ongeluk in het andere vinden; vergelijk boven Eze 7:19 ."},{"catchword":"ach,","tekst":"Dit zijn de woorden van den profeet, beklagende de ellende van zijn volk."},{"catchword":"het is toegemaakt,","tekst":"Te weten het zwaard."},{"catchword":"opdat het glinstere,","tekst":"Hebreeuws, ter glinstering; dat is, opdat het bekwaam zij om de moedwillige Joden te verschrikken en te verderven; vergelijk boven vs.10, en onder vs.28."},{"catchword":"is ingewonden om te slachten","tekst":"Dat is, weggelegd om hetzelve ter slachting gereed te hebben. Anders: gescherpt."}],"16":[{"catchword":"Houd u bijeen,","tekst":"Hebreeuws, houd u bijeen, ga ter rechterhand, schik u, ga ter linkerhand; zie van deze manier van spreken Psa 45:5 . De Heere spreekt hier het zwaard toe, alsof het de krijgsman ware, die het gebruiken moest. Zie Job 14:7 . Hij beveelt het dat het zich voege en samen verenige met de andere zwaarden of krijgslieden zijner bende, om met enen moed en kracht den vijand op het lijf te vallen, hetzij ter rechter-of ter linkerhand."},{"catchword":"waarhenen","tekst":"Dat is, tot welk deel of oord van Judea het zou mogen wezen dat gij gelast zijt om daar moorderij en verwoesting aan te richten. Spaar niets noch iemand."}],"17":[{"catchword":"slaan,","tekst":"Te weten om den Chaldeën moed te geven, hen aan te hitsen en op te jagen tot het verderven en uitroeien der Joodse natie; zie boven de aantekening vs.14. Versta dat dit zo blijken zou door de uitkomst der zaak, dat het doen der Chaldeën met Gods rechtvaardigen wil overeenkwam."},{"catchword":"Mijn grimmigheid","tekst":"Dat is mijn moed aan u koelen en mijn toorn aan u verzadigen; vergelijk boven Eze 5:13 ."}],"19":[{"catchword":"stel u","tekst":"Te weten op een tafereel af te malen en uit te drukken, gelijk boven Eze 4:1-2 ."},{"catchword":"twee wegen voor,","tekst":"Te weten beide voortkomende uit het land van Babylonië, waarvan de ene was ter rechterhand, om in Judea te komen, de andere ter linkerhand, om te komen in het land der Ammonieten. Nebukadnezar nu beraadslaagde welk land hij in dezen tocht eerst aantasten zou, hetwelk hier met deze twee wegen betekend wordt."},{"catchword":"een land","tekst":"Te weten Babylonië. Of, uit eens land; dat is, van den koning van Babel."},{"catchword":"zijde,","tekst":"Hebreeuws, hand; zie Pro 8:3 , en de aantekening. Versta, vanwaar de koning van Babel in het Joodse land invallen zou."},{"catchword":"aan het hoofd van den weg","tekst":"Dat is, aan het begin van den tweeweg, te weten aan den weg, die naar de stad Jeruzalem loopt. Het is ene profetie, dat Nebukadnezar eerst het Joodse land zou zien aan zich te brengen, om daarna de Ammonieten te overweldigen."}],"20":[{"catchword":"Rabba der kinderen Ammons,","tekst":"Zie 2Sa 11:1 ."}],"21":[{"catchword":"zal aan de","tekst":"Te weten als hij met een heirleger uit zijn land zuidwaarts optrekken zal om een krijgstocht te doen. In het Hebreeuws wordt de verleden tijd gebruikt: heeft gestaan, om te tonen de zekerheid van dit verhaal, alsof het alrede geschied ware."},{"catchword":"wegscheiding","tekst":"Hebreeuws, moeder van den weg. Versta, een tweesprong, of tweeweg, die in twee wegen verdeeld wordt. De wegscheiding is ene moeder der wegen genaamd, omdat daaruit andere wegen voortkomen, gelijk uit ene moeder kinderen."},{"catchword":"staan,","tekst":"Te weten, gelijk een die twijfelt welken weg hij ingaan zal, namelijk die ter rechterhand ligt, of die ligt ter linkerhand."},{"catchword":"het hoofd van de twee wegen,","tekst":"Dat is, het begin, den ingang; zie boven Eze 16:25 , en de aantekening."},{"catchword":"waarzegging te gebruiken;","tekst":"Hebreeuws, waarzegging te waarzeggen; dat is waarzegging te gebruiken, of met waarzegging om te gaan; zie van het woord waarzegging, Pro 16:10 . De zin is dat hij de kunst zijner afgodische waarzegging zou in het werk stellen, om te zien welken weg hij ingaan zou."},{"catchword":"slijpen;","tekst":"Te weten ten einde dat ze hem, als hij die naar zijn bijgelovige manier gebruikt zou hebben, te verstaan mochten geven welken weg hij kiezen zou. Anderen vertalen het woord pijlen, messen, welke geveegd en genet werden, als men vele offeranden daarmede gedaan had, uit welke de heidenen hunne waarzeggingen maakten."},{"catchword":"terafim","tekst":"Zie Gen 31:19 ."},{"catchword":"vragen,","tekst":"Te weten om raad."},{"catchword":"lever bezien","tekst":"Te weten van hun geslachte beesten. Uit de gestaltenis nu der lever oordeelden zij naar hun afgodische bijgelovigheid, wat hun te doen of te laten stond."}],"22":[{"catchword":"op Jeruzalem,","tekst":"Dat is, de waarzegging zal uitwijzen dat Nebukadnezar de rechterhand moest kiezen, om Jeruzalem eerst te belegeren."},{"catchword":"hoofdmannen","tekst":"Het Hebreeuwse woord is alzo genomen 2Ki 11:5 ; maar in het volgende van vs.22 betekent het stormrammen, gelijk ook boven Eze 4:2 ."},{"catchword":"te stellen,","tekst":"Dat is, de belegering tegen Jeruzalem aan te grijpen en te ordineren."},{"catchword":"den mond te openen","tekst":"Dat is, met groot geroep de krijgslieden tot het vermoorden en verderven der Joden aan te drijven, of tot opening van enig gat in den muur, waardoor zij mochten inbreken. Het volgende woord gejuich kan ook overgezet worden een gebroken geklank."},{"catchword":"de stem op te heffen","tekst":"Dat is, met een vreeslijk veldgeschrei de vijanden te verschrikken en de stad aan te vallen."},{"catchword":"stormrammen te stellen tegen de poorten,","tekst":"Zie boven Eze 4:2 ."}],"23":[{"catchword":"Dit zal","tekst":"Dat is, deze uwe profetie."},{"catchword":"hun","tekst":"Te weten den Joden."},{"catchword":"in hun ogen","tekst":"Dat is, in hun oordeel; zie Job 18:3 ."},{"catchword":"ijdel waarzeggen zijn,","tekst":"Hebreeuws, een waarzeggen der ijdelheid, of leugen; vergelijk onder vs.29."},{"catchword":"onder hen;","tekst":"Namelijk de Joden met de Egyptenaars, of ook andere omliggende volken, die den Joden met den eed beloofd hadden, dat zij hen tegen de Chaldeën beschermen zouden. Sommigen verstaan het van den eed met welken zij aan den koning van Babel verplicht waren; uit het volgende."},{"catchword":"hij zal der","tekst":"Namelijk de koning van Babel."},{"catchword":"ongerechtigheid gedenken,","tekst":"Versta, de ontrouw en meinedigheid, die de koning Zedekia in het breken van het verbond, gemaakt met Nebukadnezar, bewezen had."},{"catchword":"opdat zij","tekst":"Namelijk de Joden in Jeruzalem wonende en daaronder behorende."},{"catchword":"gegrepen worden","tekst":"Of gevangen, of ingenomen worden; dat is door wapenen overwonnen, overweldigd en gevankelijk weggevoerd worden."}],"24":[{"catchword":"doet gedenken,","tekst":"Te weten mij en den koning van Babylonië doet gij ze gedenken, door in uwe meinedigheid moedwilliglijk en openbaar voort te gaan, en daarin u te versterken door nieuwe verbonden, die gij met andere volken tegen den koning van Babel hebt opgericht."},{"catchword":"hand gegrepen worden","tekst":"Te weten van Nebukadnezar, dat is door zijn machtig heirleger."}],"25":[{"catchword":"o onheilig,","tekst":"Hij meent Zedekia den koning van Juda."},{"catchword":"goddeloos vorst van Israël,","tekst":"Te weten door afgoderij tegen God, meinedigheid, tegen den koning Nebukadnezar, wreedheid tegen zijne onderzaten, enz."},{"catchword":"dag komen zal,","tekst":"Te weten van uw straf en ondergang. Zie Job 18:20 , en de aantekening, en Psa 37:13 ; idem, hieronder vs.29."},{"catchword":"tijde der uiterste ongerechtigheid;","tekst":"Dat is, als de ongerechtigheid op het hoogste gekomen en vol zal zijn, Gen 15:16 . Hebreeuws, ten tijde der ongerechtigheid van het einde, of van het uiterste; dat is de uiterste of eindelijke ongerechtigheid; of men kan met sommigen door ongerechtigheid verstaan [gelijk elders] de straf der ongerechtigheid en van het einde; dat is die een einde met hen zal uitmaken. Alzo onder vs.29, en Eze 35:5 ."}],"26":[{"catchword":"weg,","tekst":"Te weten van uw hoofd; zie van dezen hoed Exo 28:4 ."},{"catchword":"dezelfde niet wezen;","tekst":"dat is, uw kroon niet meer wezen, dat is, gij zult niet meer koning zijn."},{"catchword":"nederig is,","tekst":"Versta, den koning Jojachin, die in de Babylonische gevangenschap was, van wiens verhoging zie 2Ki 25:27 , enz."},{"catchword":"die hoog is","tekst":"Dat is, Zedekia, die nu wel koning was, maar haast zou gevangen, verblind en weggevoerd worden. Zie 2Ki 25:6-7 ."}],"27":[{"catchword":"die kroon","tekst":"Te weten die kroon, van welke in vs.26 gemeld is."},{"catchword":"omgekeerd, omgekeerd, omgekeerd stellen;","tekst":"Dat is gans uitroeien, omwerpen en verderven. Hetzelfde wordt driemalen herhaald om de zekerheid van het verhaal en den /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
