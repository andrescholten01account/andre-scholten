en</span> made their <span class=\"wl wl-kjv\" data-code=\"H7077\">nests</span> in his <span class=\"wl wl-kjv\" data-code=\"H5589\">boughs,</span> and under his <span class=\"wl wl-kjv\" data-code=\"H6288\">branches</span> did all the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> bring forth their <span class=\"wl wl-kjv\" data-code=\"H3205\">young,</span> and under his <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> all <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> nations.", "7": "Thus was he <span class=\"wl wl-kjv\" data-code=\"H3302\">fair</span> in his <span class=\"wl wl-kjv\" data-code=\"H1433\">greatness,</span> in the <span class=\"wl wl-kjv\" data-code=\"H753\">length</span> of his <span class=\"wl wl-kjv\" data-code=\"H1808\">branches:</span> for his <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> was by <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> waters.", "8": "The <span class=\"wl wl-kjv\" data-code=\"H730\">cedars</span> in the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> could not <span class=\"wl wl-kjv\" data-code=\"H6004\">hide</span> him: the fir <span class=\"wl wl-kjv\" data-code=\"H1265\">trees</span> were not <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> his <span class=\"wl wl-kjv\" data-code=\"H5589\">boughs,</span> and the chesnut <span class=\"wl wl-kjv\" data-code=\"H6196\">trees</span> were not like his <span class=\"wl wl-kjv\" data-code=\"H6288\">branches;</span> nor any <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> in the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> unto him in his beauty.", "9": "I have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> by the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of his <span class=\"wl wl-kjv\" data-code=\"H1808\">branches:</span> so that all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden,</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> envied", "10": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thou hast lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up</span> thyself in <span class=\"wl wl-kjv\" data-code=\"H6967\">height,</span> and he hath shot <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H6788\">top</span> among the thick <span class=\"wl wl-kjv\" data-code=\"H5688\">boughs,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> is lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> in his height;", "11": "I have therefore <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> him into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H410\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with him: I have driven him <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> for his wickedness.", "12": "And <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers,</span> the <span class=\"wl wl-kjv\" data-code=\"H6184\">terrible</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> have cut him <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5203\">left</span> him: upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> and in all the <span class=\"wl wl-kjv\" data-code=\"H1516\">valleys</span> his <span class=\"wl wl-kjv\" data-code=\"H1808\">branches</span> are <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6288\">boughs</span> are <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> by all the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from his <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow,</span> and have left", "13": "Upon his <span class=\"wl wl-kjv\" data-code=\"H4658\">ruin</span> shall all the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">remain,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall be upon his branches:", "14": "To the end that none of all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> by the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H1361\">exalt</span> themselves for their <span class=\"wl wl-kjv\" data-code=\"H6967\">height,</span> neither shoot <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6788\">top</span> among the thick <span class=\"wl wl-kjv\" data-code=\"H5688\">boughs,</span> neither their <span class=\"wl wl-kjv\" data-code=\"H352\">trees</span> stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in their <span class=\"wl wl-kjv\" data-code=\"H1363\">height,</span> all that <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> for they are all <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> unto <span class=\"wl wl-kjv\" data-code=\"H4194\">death,</span> to the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the pit.", "15": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> In the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> I caused a <span class=\"wl wl-kjv\" data-code=\"H56\">mourning:</span> I <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H8415\">deep</span> for him, and I <span class=\"wl wl-kjv\" data-code=\"H4513\">restrained</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">floods</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were <span class=\"wl wl-kjv\" data-code=\"H3607\">stayed:</span> and I caused <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> to <span class=\"wl wl-kjv\" data-code=\"H6937\">mourn</span> for him, and all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> fainted", "16": "I made the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> to <span class=\"wl wl-kjv\" data-code=\"H7493\">shake</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of his <span class=\"wl wl-kjv\" data-code=\"H4658\">fall,</span> when I cast him <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7585\">hell</span> with them that <span class=\"wl wl-kjv\" data-code=\"H3381\">descend</span> into the <span class=\"wl wl-kjv\" data-code=\"H953\">pit:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden,</span> the <span class=\"wl wl-kjv\" data-code=\"H4005\">choice</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">best</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> all that <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted</span> in the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the earth.", "17": "They also went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into <span class=\"wl wl-kjv\" data-code=\"H7585\">hell</span> with him unto them that be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and they that were his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> under his <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the heathen.", "18": "To whom art thou thus <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> in <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> and in <span class=\"wl wl-kjv\" data-code=\"H1433\">greatness</span> among the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden?</span> yet shalt thou be brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden</span> unto the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> with them that be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span> This is <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
