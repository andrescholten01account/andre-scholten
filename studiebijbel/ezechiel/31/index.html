w* stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte;", "11": "daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, *zodat* die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid.", "12": "En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "13": "Alle vogels van de hemel woonden op zijn omgevallen stam, en alle dieren van het veld waren op zijn scheuten;", "14": "opdat geen waterrijke bomen zich verheffen over hun stam, en hun top niet opsteken boven het midden van de dichte takken, en geen *bomen*, die water drinken, op zichzelf staan vanwege hun hoogte; want zij zijn allen overgegeven aan de dood, aan het onderste van de aarde, in het midden van de mensenkinderen, bij hen die in de kuil neerdalen.", "15": "Zo zegt de Heere HEERE: Op de dag dat hij naar het rijk van de dood neerdaalde, bracht Ik een rouw teweeg; Ik bedekte om zijn wil de afgrond, en hield de stromen daarvan tegen, en het vele water werd ingehouden; en Ik liet om zijn wil de Libanon treuren, en al het geboomte van het veld kwijnde om zijn wil weg.", "16": "Van het geluid van zijn val deed Ik de heidenvolken beven, toen Ik hem naar het rijk van de dood liet neerdalen, met hen die in de kuil neerdalen; en alle bomen van Eden, de keur en het beste van Libanon, alle *bomen* die water drinken, troostten zich in het onderste van de aarde.", "17": "Die daalden ook met hem neer naar het rijk van de dood, tot de verslagenen door het zwaard; en zij die zijn arm geweest waren, *die* onder zijn schaduw in het midden van de heidenvolken gezeten hadden.", "18": "Aan wie bent u zo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, u zult neergevoerd worden met de bomen van Eden, tot het onderste van de aarde; in het midden van de onbesnedenen zult u liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn hele menigte, spreekt de Heere HEERE."}, "SV": {"1": "Het gebeurde ook in het elfde jaar, in de derde *maand*, op den eersten der maand, *dat* des HEEREN woord tot mij geschiedde, zeggende:", "2": "Mensenkind! zeg tot Farao, den koning van Egypte, en tot zijn menigte: Wien zijt gij gelijk in uw grootheid?", "3": "Zie, Assur was een ceder op den Libanon, schoon van takken, schaduwachtig van loof, en hoog van stam, en zijn top was tussen dichte takken.", "4": "De wateren maakten hem groot, de afgrond maakte hem hoog; die ging met zijn stromen rondom zijn planting, en zond zijn waterleidingen uit tot alle bomen des velds.", "5": "Daarom werd zijn stam hoger dan alle bomen des velds; en zijn takjes werden menigvuldig, en zijn scheuten lang, vanwege de grote wateren, als hij uitschoot.", "6": "Alle vogelen des hemels nestelden op zijn takjes, en alle dieren des velds teelden onder zijn scheuten; en alle grote volken zaten onder zijn schaduw.", "7": "Alzo was hij schoon in zijn grootheid *en* in de lengte zijner takken, omdat zijn wortel aan grote wateren was.", "8": "De cederen in Gods hof verduisterden hem niet, de dennebomen waren zijn takken niet gelijk, en de kastanjebomen waren niet gelijk zijn scheuten; geen boom in Gods hof was hem gelijk in zijn schoonheid.", "9": "Ik had hem *zo* schoon gemaakt door de veelheid zijner takken, dat alle bomen van Eden, die in Gods hof waren, hem benijdden.", "10": "Daarom, zo zegt de Heere HEERE: Omdat gij u verheven hebt over *uw* stam, ja, hij stak zijn top op boven het midden der dichte takken, en zijn hart verhief zich over zijn hoogte;", "11": "Daarom gaf Ik hem in de hand van den machtigste der heidenen, *dat* die hem rechtschapen zou behandelen; Ik dreef hem uit om zijn goddeloosheid.", "12": "En vreemden, de tirannigste der heidenen, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle stromen des lands; en alle volken der aarde gingen af uit zijn schaduw, en verlieten hem.", "13": "Alle vogelen des hemels woonden op zijn omgevallen stam, en alle dieren des velds waren op zijn scheuten;", "14": "Opdat zich geen waterrijke bomen verheffen over hun stam, en hun top niet opsteken boven het midden der dichte takken, en geen *bomen*, die water drinken, op zichzelven staan vanwege hun hoogte; want zij zijn allen overgegeven ter dood, tot het onderste der aarde, in het midden der mensenkinderen, tot degenen, die in den kuil nederdalen.", "15": "Zo zegt de Heere HEERE: Ten dage, als hij ter helle nederdaalde, maakte Ik een treuren; Ik bedekte om zijnentwil den afgrond, en weerde de stromen van dien, en de grote wateren werden geschut; en Ik maakte den Libanon om zijnentwil zwart, en al het geboomte des velds was om zijnentwil bewonden.", "16": "Van het geluid zijns vals deed Ik de heidenen beven, als Ik hem ter helle deed nederdalen, met degenen, die in den kuil nederdalen; en alle bomen van Eden, de keur en het beste van Libanon, alle *bomen*, die water drinken, troostten zich in het onderste der aarde.", "17": "Diezelve daalden ook met hem neder ter helle, tot de verslagenen van het zwaard; en die zijn arm geweest waren, *die* onder zijn schaduw in het midden der heidenen gezeten hadden.", "18": "Wien zijt gij alzo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, gij zult nedergevoerd worden met de bomen van Eden, tot het onderste der aarde; in het midden der onbesnedenen zult gij liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn ganse menigte, spreekt de Heere HEERE."}, "KJV": {"1": "And it came to pass in the eleventh year, in the third *month*, in the first *day* of the month, *that* the word of the LORD came unto me, saying,", "2": "Son of man, speak unto Pharaoh king of Egypt, and to his multitude; Whom art thou like in thy greatness?", "3": "Behold, the Assyrian *was* a cedar in Lebanon with fair branches, and with a shadowing shroud, and of an high stature; and his top was among the thick boughs.", "4": "The waters made him great, the deep set him up on high with her rivers running round about his plants, and sent out her little rivers unto all the trees of the field.", "5": "Therefore his height was exalted above all the trees of the field, and his boughs were multiplied, and his branches became long because of the multitude of waters, when he shot forth.", "6": "All the fowls of heaven made their nests in his boughs, and under his branches did all the beasts of the field bring forth their young, and under his shadow dwelt all great nations.", "7": "Thus was he fair in his greatness, in the length of his branches: for his root was by great waters.", "8": "The cedars in the garden of God could not hide him: the fir trees were not like his boughs, and the chesnut trees were not like his branches; nor any tree in the garden of God was like unto him in his beauty.", "9": "I have made him fair by the multitude of his branches: so that all the trees of Eden, that *were* in the garden of God, envied", "10": "Therefore thus saith the Lord GOD; Because thou hast lifted up thyself in height, and he hath shot up his top among the thick boughs, and his heart is lifted up in his height;", "11": "I have therefore delivered him into the hand of the mighty one of the heathen; he shall surely deal with him: I have driven him out for his wickedness.", "12": "And strangers, the terrible of the nations, have cut him off, and have left him: upon the mountains and in all the valleys his branches are fallen, and his boughs are broken by all the rivers of the land; and all the people of the earth are gone down from his shadow, and have left", "13": "Upon his ruin shall all the fowls of the heaven remain, and all the beasts of the field shall be upon his branches:", "14": "To the end that none of all the trees by the waters exalt themselves for their height, neither shoot up their top among the thick boughs, neither their trees stand up in their height, all that drink water: for they are all delivered unto death, to the nether parts of the earth, in the midst of the children of men, with them that go down to the pit.", "15": "Thus saith the Lord GOD; In the day when he went down to the grave I caused a mourning: I covered the deep for him, and I restrained the floods thereof, and the great waters were stayed: and I caused Lebanon to mourn for him, and all the trees of the field fainted", "16": "I made the nations to shake at the sound of his fall, when I cast him down to hell with them that descend into the pit: and all the trees of Eden, the choice and best of Lebanon, all that drink water, shall be comforted in the nether parts of the earth.", "17": "They also went down into hell with him unto *them that be* slain with the sword; and *they that were* his arm, *that* dwelt under his shadow in the midst of the heathen.", "18": "To whom art thou thus like in glory and in greatness among the trees of Eden? yet shalt thou be brought down with the trees of Eden unto the nether parts of the earth: thou shalt lie in the midst of the uncircumcised with *them that be* slain by the sword. This *is* Pharaoh and all his multitude, saith the Lord GOD."}}, "tsk": {"1": [{"kopje": "in het elfde", "refs": ["Ezech 1:2", "Ezech 30:20", "Jer 52:5", "Jer 52:6"]}], "2": [{"kopje": "Zeg", "refs": ["Jer 1:5", "Jer 1:17", "Openb 10:11"]}, {"kopje": "tegen zijn", "refs": ["Ezech 29:19", "Ezech 30:10", "Nahum 3:8-10"]}, {"kopje": "Aan wie", "refs": ["Ezech 31:18", "Jes 14:13", "Jes 14:14"]}], "3": [{"kopje": "Assur", "refs": ["Nahum 3:1-19", "Zef 2:13"]}, {"kopje": "een ceder", "refs": ["Ezech 17:3", "Ezech 17:4", "Ezech 17:22", "Jes 10:33", "Jes 10:34", "Jes 37:24", "Dan 4:10", "Dan 4:20-23", "Zach 11:2"]}, {"kopje": "hoog van stam", "refs": ["Ezech 31:6", "Richt 9:15", "Dan 4:12"]}], "4": [{"kopje":
