van de maand, dat het woord van de HEERE tot mij kwam:","2":"Mensenkind! Zeg tegen Farao, de koning van Egypte, en tegen zijn menigte: Aan wie bent u gelijk in uw grootheid?","3":"Zie, Assur was een ceder op de Libanon, mooi van takken, met schaduwrijk loof, en hoog van stam, en zijn top reikte tot tussen de dichte takken.","4":"Het water maakte hem groot, de afgrond maakte hem hoog; die ging met zijn stromen rondom zijn planting, en zond zijn waterleidingen uit tot alle bomen van het veld.","5":"Daarom werd zijn stam hoger dan alle bomen van het veld; en zijn takjes werden talrijk, en zijn scheuten lang, vanwege het vele water, toen hij uitschoot.","6":"Alle vogels van de hemel nestelden op zijn takjes, en alle dieren van het veld kregen jongen onder zijn scheuten; en alle grote volken zaten onder zijn schaduw.","7":"Zo was hij mooi in zijn grootheid *en* in de lengte van zijn takken, omdat zijn wortel bij veel water was.","8":"De ceders in Gods hof konden hem niet overtreffen*, de dennenbomen waren zijn takken niet gelijk, en de kastanjebomen waren niet gelijk aan zijn scheuten; geen boom in Gods hof was hem gelijk in zijn schoonheid.","9":"Ik had hem *zo* mooi gemaakt door de veelheid van zijn takken, dat alle bomen van Eden, die in Gods hof waren, hem benijdden.","10":"Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over *uw* stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte;","11":"daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, *zodat* die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid.","12":"En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.","13":"Alle vogels van de hemel woonden op zijn omgevallen stam, en alle dieren van het veld waren op zijn scheuten;","14":"opdat geen waterrijke bomen zich verheffen over hun stam, en hun top niet opsteken boven het midden van de dichte takken, en geen *bomen*, die water drinken, op zichzelf staan vanwege hun hoogte; want zij zijn allen overgegeven aan de dood, aan het onderste van de aarde, in het midden van de mensenkinderen, bij hen die in de kuil neerdalen.","15":"Zo zegt de Heere HEERE: Op de dag dat hij naar het rijk van de dood neerdaalde, bracht Ik een rouw teweeg; Ik bedekte om zijn wil de afgrond, en hield de stromen daarvan tegen, en het vele water werd ingehouden; en Ik liet om zijn wil de Libanon treuren, en al het geboomte van het veld kwijnde om zijn wil weg.","16":"Van het geluid van zijn val deed Ik de heidenvolken beven, toen Ik hem naar het rijk van de dood liet neerdalen, met hen die in de kuil neerdalen; en alle bomen van Eden, de keur en het beste van Libanon, alle *bomen* die water drinken, troostten zich in het onderste van de aarde.","17":"Die daalden ook met hem neer naar het rijk van de dood, tot de verslagenen door het zwaard; en zij die zijn arm geweest waren, *die* onder zijn schaduw in het midden van de heidenvolken gezeten hadden.","18":"Aan wie bent u zo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, u zult neergevoerd worden met de bomen van Eden, tot het onderste van de aarde; in het midden van de onbesnedenen zult u liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn hele menigte, spreekt de Heere HEERE."},"SV":{"1":"Het gebeurde ook in het elfde jaar, in de derde *maand*, op den eersten der maand, *dat* des HEEREN woord tot mij geschiedde, zeggende:","2":"Mensenkind! zeg tot Farao, den koning van Egypte, en tot zijn menigte: Wien zijt gij gelijk in uw grootheid?","3":"Zie, Assur was een ceder op den Libanon, schoon van takken, schaduwachtig van loof, en hoog van stam, en zijn top was tussen dichte takken.","4":"De wateren maakten hem groot, de afgrond maakte hem hoog; die ging met zijn stromen rondom zijn planting, en zond zijn waterleidingen uit tot alle bomen des velds.","5":"Daarom werd zijn stam hoger dan alle bomen des velds; en zijn takjes werden menigvuldig, en zijn scheuten lang, vanwege de grote wateren, als hij uitschoot.","6":"Alle vogelen des hemels nestelden op zijn takjes, en alle dieren des velds teelden onder zijn scheuten; en alle grote volken zaten onder zijn schaduw.","7":"Alzo was hij schoon in zijn grootheid *en* in de lengte zijner takken, omdat zijn wortel aan grote wateren was.","8":"De cederen in Gods hof verduisterden hem niet, de dennebomen waren zijn takken niet gelijk, en de kastanjebomen waren niet gelijk zijn scheuten; geen boom in Gods hof was hem gelijk in zijn schoonheid.","9":"Ik had hem *zo* schoon gemaakt door de veelheid zijner takken, dat alle bomen van Eden, die in Gods hof waren, hem benijdden.","10":"Daarom, zo zegt de Heere HEERE: Omdat gij u verheven hebt over *uw* stam, ja, hij stak zijn top op boven het midden der dichte takken, en zijn hart verhief zich over zijn hoogte;","11":"Daarom gaf Ik hem in de hand van den machtigste der heidenen, *dat* die hem rechtschapen zou behandelen; Ik dreef hem uit om zijn goddeloosheid.","12":"En vreemden, de tirannigste der heidenen, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle stromen des lands; en alle volken der aarde gingen af uit zijn schaduw, en verlieten hem.","13":"Alle vogelen des hemels woonden op zijn omgevallen stam, en alle dieren des velds waren op zijn scheuten;","14":"Opdat zich geen waterrijke bomen verheffen over hun stam, en hun top niet opsteken boven het midden der dichte takken, en geen *bomen*, die water drinken, op zichzelven staan vanwege hun hoogte; want zij zijn allen overgegeven ter dood, tot het onderste der aarde, in het midden der mensenkinderen, tot degenen, die in den kuil nederdalen.","15":"Zo zegt de Heere HEERE: Ten dage, als hij ter helle nederdaalde, maakte Ik een treuren; Ik bedekte om zijnentwil den afgrond, en weerde de stromen van dien, en de grote wateren werden geschut; en Ik maakte den Libanon om zijnentwil zwart, en al het geboomte des velds was om zijnentwil bewonden.","16":"Van het geluid zijns vals deed Ik de heidenen beven, als Ik hem ter helle deed nederdalen, met degenen, die in den kuil nederdalen; en alle bomen van Eden, de keur en het beste van Libanon, alle *bomen*, die water drinken, troostten zich in het onderste der aarde.","17":"Diezelve daalden ook met hem neder ter helle, tot de verslagenen van het zwaard; en die zijn arm geweest waren, *die* onder zijn schaduw in het midden der heidenen gezeten hadden.","18":"Wien zijt gij alzo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, gij zult nedergevoerd worden met de bomen van Eden, tot het onderste der aarde; in het midden der onbesnedenen zult gij liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn ganse menigte, spreekt de Heere HEERE."},"KJV":{"1":"And it came to pass in the eleventh year, in the third *month*, in the first *day* of the month, *that* the word of the LORD came unto me, saying,","2":"Son of man, speak unto Pharaoh king of Egypt, and to his multitude; Whom art thou like in thy greatness?","3":"Behold, the Assyrian *was* a cedar in Lebanon with fair branches, and with a shadowing shroud, and of an high stature; and his top was among the thick boughs.","4":"The waters made him great, the deep set him up on high with her rivers running round about his plants, and sent out her little rivers unto all the trees of the field.","5":"Therefore his height was exalted above all the trees of the field, and his boughs were multiplied, and his branches became long because of the multitude of waters, when he shot forth.","6":"All the fowls of heaven made their nests in his boughs, and under his branches did all the beasts of the field bring forth their young, and under his shadow dwelt all great nations.","7":"Thus was he fair in his greatness, in the length of his branches: for his root was by great waters.","8":"The cedars in the garden of God could not hide him: the fir trees were not like his boughs, and the chesnut trees were not like his branches; nor any tree in the garden of God was like unto him in his beauty.","9":"I have made him fair by the multitude of his branches: so that all the trees of Eden, that *were* in the garden of God, envied","10":"Therefore thus saith the Lord GOD; Because thou hast lifted up thyself in height, and he hath shot up his top among the thick boughs, and his heart is lifted up in his height;","11":"I have therefore delivered him into the hand of the mighty one of the heathen; he shall surely deal with him: I have driven him out for his wickedness.","12":"And strangers, the terrible of the nations, have cut him off, and have left him: upon the mountains and in all the valleys his branches are fallen, and his boughs are broken by all the rivers of the land; and all the people of the earth are gone down from his shadow, and have left","13":"Upon his ruin shall all the fowls of the heaven remain, and all the beasts of the field shall be upon his branches:","14":"To the end that none of all the trees by the waters exalt themselves for their height, neither shoot up their top among the thick boughs, neither their trees stand up in their height, all that drink water: for they are all delivered unto death, to the nether parts of the earth, in the midst of the children of men, with them that go down to the pit.","15":"Thus saith the Lord GOD; In the day when he went down to the grave I caused a mourning: I covered the deep for him, and I restrained the floods thereof, and the great waters were stayed: and I caused Lebanon to mourn for him, and all the trees of the field fainted","16":"I made the nations to shake at the sound of his fall, when I cast him down to hell with them that descend into the pit: and all the trees of Eden, the choice and best of Lebanon, all that drink water, shall be comforted in the nether parts of the earth.","17":"They also went down into hell with him unto *them that be* slain with the sword; and *they that were* his arm, *that* dwelt under his shadow in the midst of the heathen.","18":"To whom art thou thus like in glory and in greatness among the trees of Eden? yet shalt thou be brought down with the trees of Eden unto the nether parts of the earth: thou shalt lie in the midst of the uncircumcised with *them that be* slain by the sword. This *is* Pharaoh and all his multitude, saith the Lord GOD."}},"tsk":{"1":[{"kopje":"in het elfde","refs":["Ezech 1:2","Ezech 30:20","Jer 52:5","Jer 52:6"]}],"2":[{"kopje":"Zeg","refs":["Jer 1:5","Jer 1:17","Openb 10:11"]},{"kopje":"tegen zijn","refs":["Ezech 29:19","Ezech 30:10","Nahum 3:8-10"]},{"kopje":"Aan wie","refs":["Ezech 31:18","Jes 14:13","Jes 14:14"]}],"3":[{"kopje":"Assur","refs":["Nahum 3:1-19","Zef 2:13"]},{"kopje":"een ceder","refs":["Ezech 17:3","Ezech 17:4","Ezech 17:22","Jes 10:33","Jes 10:34","Jes 37:24","Dan 4:10","Dan 4:20-23","Zach 11:2"]},{"kopje":"hoog van stam","refs":["Ezech 31:6","Richt 9:15","Dan 4:12"]}],"4":[{"kopje":"water","refs":["Ezech 17:5","Ezech 17:8","Spr 14:28","Jer 51:36","Openb 17:1","Openb 17:15"]}],"5":[{"kopje":"stam hoger","refs":["Ps 37:35","Ps 37:36","Jes 10:8-14","Jes 36:4","Jes 36:18","Jes 36:19","Jes 37:11-13","Dan 4:11"]}],"8":[{"kopje":"ceders","refs":["Ezech 28:13","Gen 2:8","Gen 13:10","Ps 80:11","Jes 51:3"]},{"kopje":"geen boom","refs":["Ps 37:35","Jes 10:7-14","Jes 36:4-18","Jes 37:11-13"]}],"9":[{"kopje":"gemaakt","refs":["Ezech 16:14","Ex 9:16","Ps 75:7","Ps 75:8","Dan 2:21","Dan 2:37","Dan 2:38","Dan 4:22-25","Dan 5:20-23"]},{"kopje":"alle bomen","refs":["Ezech 17:22","Ezech 17:24","Richt 9:8-20","Ps 96:12","Ps 96:13","Jes 55:12","Zach 11:2"]},{"kopje":"benijdden","refs":["Gen 26:14","Gen 37:11","1 Sam 18:15","Spr 27:4","Pred 4:4","Jak 4:5","Jak 4:6"]}],"10 wl wl-kjv\" data-code=\"H1808\">branches</span> are <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6288\">boughs</span> are <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> by all the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from his <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow,</span> and have left","13":"Upon his <span class=\"wl wl-kjv\" data-code=\"H4658\">ruin</span> shall all the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">remain,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall be upon his branches:","14":"To the end that none of all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> by the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H1361\">exalt</span> themselves for their <span class=\"wl wl-kjv\" data-code=\"H6967\">height,</span> neither shoot <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6788\">top</span> among the thick <span class=\"wl wl-kjv\" data-code=\"H5688\">boughs,</span> neither their <span class=\"wl wl-kjv\" data-code=\"H352\">trees</span> stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in their <span class=\"wl wl-kjv\" data-code=\"H1363\">height,</span> all that <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> for they are all <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> unto <span class=\"wl wl-kjv\" data-code=\"H4194\">death,</span> to the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the pit.","15":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> In the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> I caused a <span class=\"wl wl-kjv\" data-code=\"H56\">mourning:</span> I <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H8415\">deep</span> for him, and I <span class=\"wl wl-kjv\" data-code=\"H4513\">restrained</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">floods</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were <span class=\"wl wl-kjv\" data-code=\"H3607\">stayed:</span> and I caused <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> to <span class=\"wl wl-kjv\" data-code=\"H6937\">mourn</span> for him, and all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> fainted","16":"I made the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> to <span class=\"wl wl-kjv\" data-code=\"H7493\">shake</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of his <span class=\"wl wl-kjv\" data-code=\"H4658\">fall,</span> when I cast him <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7585\">hell</span> with them that <span class=\"wl wl-kjv\" data-code=\"H3381\">descend</span> into the <span class=\"wl wl-kjv\" data-code=\"H953\">pit:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden,</span> the <span class=\"wl wl-kjv\" data-code=\"H4005\">choice</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">best</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> all that <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted</span> in the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the earth.","17":"They also went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into <span class=\"wl wl-kjv\" data-code=\"H7585\">hell</span> with him unto them that be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and they that were his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> under his <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the heathen.","18":"To whom art thou thus <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> in <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> and in <span class=\"wl wl-kjv\" data-code=\"H1433\">greatness</span> among the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden?</span> yet shalt thou be brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden</span> unto the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> with them that be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span> This is <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"elfde jaar,","tekst":"Na de wegvoering van Jojachin; zie boven Eze 1:2 , enz."}],"2":[{"catchword":"menigte","tekst":"Dat is, al zijn volk."},{"catchword":"Wien zijt gij gelijk","tekst":"Alsof God zeide: Beeldt gij u in dat er uws gelijke nooit geweest is en dat u derhalve niets kan deren? Let eens op den groten monarch van Assyrië, hoe die gevaren is, en maakt uwe rekening; vergelijk Isa 23:13 ."}],"3":[{"catchword":"Assur","tekst":"Dat is, de koning van Assyrië."},{"catchword":"een ceder op den Libanon,","tekst":"Dat is, was gelijk een cederboom; door deze ganse figuurlijke rede wordt beduid de grootheid, heerlijkheid en macht der Assyrische monarchie. Zie Jdg 9:15 ; vergelijk Psa 80:11 ; boven Eze 17:3 , Eze 17:22-23 ; Dan 4:10 , enz."},{"catchword":"schaduwachtig van loof,","tekst":"Of, schaduwende, schaduw makende, [met zijne] struiken, of takken; idem een schaduwmakend woud, of bos, alzo het Hebreeuwse woord de betekenis heeft van woud en struiken, takken, of loof."},{"catchword":"stam,","tekst":"Gelijk boven Eze 17:6 ."}],"4":[{"catchword":"wateren","tekst":"Dat is, de gelegenheid en toevloeiing, die Ik hem beschikte van alles wat tot wasdom van zijn staat mocht dienen; vergelijk boven Eze 17:5 , Eze 17:8 , en Eze 19:10 , enz. en onder vs.5, 7."},{"catchword":"maakten hem groot,","tekst":"Of, brachten, kweekten hem op."},{"catchword":"de afgrond maakte hem hoog;","tekst":"Dat is, diepe wateren, grote diepten."},{"catchword":"die ging met zijn stromen rondom","tekst":"Afgrond, of diepte."},{"catchword":"planting,","tekst":"Gelijk boven Eze 17:7 ."},{"catchword":"zond zijn waterleidingen uit","tekst":"Dat is, deelde van zijn overvloed anderen koningen mede, die minder waren dan hij, en door hem welvoeren."}],"5":[{"catchword":"grote wateren,","tekst":"Zie vs.4."},{"catchword":"uitschoot","tekst":"Zijne scheuten uitwierp en zich uitbreidde. Vergelijk boven Eze 17:6 ; of, als hij uitbotte, botten kreeg."}],"6":[{"catchword":"Alle vogelen des hemels","tekst":"Hebreeuws, alle vogels nestelden, en zo alle dieren wierpen jongen, of teelden: dat is, allerlei, of vele volken waren onder zijn gebied en heerschappij; alzo Dan 4:12 ."},{"catchword":"schaduw","tekst":"Beschutting, of protectie nemende tot hem hunne toevlucht; vergelijk Psa 91:1 ; alzo onder vs.17."}],"8":[{"catchword":"cederen","tekst":"Dat is, de andere koningen en prinsen, hoewel ook groot en heerlijk zijnde, gelijk de cederen van een paradijs, gelijk het eerste was, konden zijn glans niet verdonkeren of verbergen; gelijk de zon het schijnsel van andere sterren bij dag verduistert, alzo verduisterde hij allen glans van anderen. Vergelijk boven Eze 28:13 , en onder vs.9, 16."},{"catchword":"geen boom in Gods hof","tekst":"Hebreeuws, alle boom was niet, enz., dat is, geen boom was, enz. Zie 1Ki 11:34 ; alzo onder vs.14."}],"10":[{"catchword":"gij u verheven hebt","tekst":"Dit kan men nemen voor ene aanspraak aan den Assyriër, van welken God terstond [gelijk elders] weder spreekt in den derden persoon; of als een afgebroken rede tot Farao, waarvan de voltrekking volgt onder vs.18. Alsof God zeide: O // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
