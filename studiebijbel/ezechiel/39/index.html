Zie, Ik zál u, o Gog, hoofdvorst van Mesech en Tubal!","2":"En Ik zal u omkeren, en een zesde deel van u overlaten, en Ik zal u optrekken uit de zijden van het noorden, en Ik zal u brengen op de bergen van Israël.","3":"Maar Ik zal uw boog uit uw linkerhand slaan, en Ik zal uw pijlen uit uw rechterhand doen vallen.","4":"Op de bergen van Israël zult u vallen, u en al uw benden, en de volken die met u zijn; Ik heb u aan de roofvogels, aan het gevogelte van elke vleugel, en aan de dieren van het veld tot voedsel gegeven.","5":"Op het open veld zult u vallen; want Ik heb het gesproken, spreekt de Heere HEERE.","6":"En Ik zal een vuur zenden in Magog, en onder hen die veilig op de eilanden wonen; en zij zullen weten dat Ik de HEERE ben.","7":"En Ik zal Mijn heilige Naam bekendmaken te midden van Mijn volk Israël, en Ik zal Mijn heilige Naam niet meer laten ontheiligen; en de heidenen zullen weten dat Ik de HEERE ben, de Heilige in Israël.","8":"Zie, het komt en het zal gebeuren, spreekt de Heere HEERE; dit is de dag waarvan Ik gesproken heb.","9":"En de inwoners van de steden van Israël zullen uitgaan, en *vuur* stoken en de wapens verbranden, zowel schilden als rondassen, bogen en pijlen, zowel handstokken als speren; en zij zullen daarvan vuur stoken, zeven jaar lang;","10":"zodat zij geen hout van het veld zullen dragen, en ook niet in de wouden zullen hakken, maar van de wapens vuur zullen stoken; en zij zullen beroven wie hen beroofd hadden, en plunderen wie hen geplunderd hadden, spreekt de Heere HEERE.","11":"En op die dag zal het gebeuren dat Ik aan Gog daar een graf zal geven in Israël, het dal van de doorgangers ten oosten van de zee; en dat zal de doorgangers de neus stoppen; en daar zullen zij Gog begraven en zijn hele menigte, en zij zullen het noemen: Het dal van Gogs menigte.","12":"Het huis van Israël nu zal hen begraven, om het land te reinigen, zeven maanden lang.","13":"Ja, heel het volk van het land zal begraven, en het zal hun tot een naam zijn, op de dag dat Ik verheerlijkt zal zijn, spreekt de Heere HEERE.","14":"Ook zullen zij mannen aanwijzen die voortdurend door het land trekken, *en* doodgravers met de doorgangers, *om* *te* *begraven* wie er op de aardbodem zijn overgebleven, om dit te reinigen; aan het einde van zeven maanden zullen zij onderzoek doen.","15":"En deze doorgangers zullen door het land trekken, en *als iemand* een mensenbeen ziet, zal hij daarbij een merkteken oprichten, totdat de doodgravers het hebben begraven in het dal van Gogs menigte.","16":"Ook zo zal de naam van de stad Hamona zijn. Zo zullen zij het land reinigen.","17":"U dan, mensenkind! Zo zegt de Heere HEERE: Zeg tegen het gevogelte van elke vleugel, en tegen alle dieren van het veld: Verzamel u, en kom aan, verzamel u van rondom, bij Mijn slachtoffer dat Ik voor u geslacht heb, een groot slachtoffer, op de bergen van Israël, en eet vlees, en drink bloed.","18":"Het vlees van de helden zult u eten, en het bloed van de vorsten van de aarde drinken; van rammen, van lammeren, en bokken, *en* stieren, die allemaal gemest zijn van Basan.","19":"En u zult het vet eten tot verzadiging toe, en bloed drinken tot dronkenschap toe; van Mijn slachtoffer, dat Ik voor u geslacht heb.","20":"En u zult verzadigd worden aan Mijn tafel van paarden en wagenpaarden, van helden en alle krijgslieden, spreekt de Heere HEERE.","21":"En Ik zal Mijn eer tonen onder de heidenen; en alle heidenen zullen Mijn oordeel zien dat Ik gedaan heb, en Mijn hand die Ik op hen gelegd heb.","22":"En zij die van het huis van Israël zijn, zullen weten dat Ik, de HEERE, hun God ben, vanaf die dag en voortaan.","23":"En de heidenen zullen weten dat zij die van het huis van Israël zijn, gevankelijk zijn weggevoerd om hun ongerechtigheid, omdat zij tegen Mij hadden overtreden, en dat Ik Mijn aangezicht voor hen verborgen heb, en hen heb overgegeven in de hand van hun tegenstanders, zodat zij allemaal door het zwaard gevallen zijn;","24":"Naar hun onreinheid en naar hun overtredingen heb Ik met hen gehandeld, en Ik heb Mijn aangezicht voor hen verborgen.","25":"Daarom zegt de Heere HEERE zo: Nu zal Ik de gevangenen van Jakob terugbrengen, en Ik zal Mij ontfermen over heel het huis van Israël, en Ik zal ijveren voor Mijn heilige Naam;","26":"wanneer zij hun schande zullen gedragen hebben, en al hun overtreding waarmee zij tegen Mij hebben overtreden, toen zij veilig in hun land woonden, en er niemand was die hen schrik aanjoeg.","27":"Wanneer Ik hen zal hebben teruggebracht uit de volken, en hen zal hebben verzameld uit de landen van hun vijanden, en Ik aan hen geheiligd zal zijn voor de ogen van veel heidenen;","28":"dan zullen zij weten dat Ik, de HEERE, hun God ben, omdat Ik hen gevankelijk heb laten wegvoeren onder de heidenen, maar hen weer verzameld heb in hun land, en daar niemand van hen meer heb overgelaten.","29":"En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE."},"SV":{"1":"Voorts, gij mensenkind! profeteer tegen Gog, en zeg: Zo zegt de Heere HEERE: Zie, Ik *wil* aan u, o Gog, hoofdvorst van Mesech en Tubal!","2":"En Ik zal u omwenden, en een zeshaak in u slaan, en u optrekken uit de zijden van het noorden, en Ik zal u brengen op de bergen Israëls.","3":"Maar Ik zal uw boog uit uw linkerhand slaan, en Ik zal uw pijlen uit uw rechterhand doen vallen.","4":"Op de bergen Israëls zult gij vallen, gij en al uw benden, en de volken, die met u zijn; Ik heb u aan de roofvogelen, aan het gevogelte van allen vleugel, en aan het gedierte des velds ter spijze gegeven.","5":"Op het open veld zult gij vallen; want Ik heb het gesproken, spreekt de Heere HEERE.","6":"En Ik zal een vuur zenden in Magog, en onder degenen, die in de eilanden zeker wonen; en zij zullen weten, dat Ik de HEERE ben.","7":"En Ik zal Mijn heiligen Naam in het midden van Mijn volk Israël bekend maken, en zal Mijn heiligen Naam niet meer laten ontheiligen; en de heidenen zullen weten, dat Ik de HEERE ben, de Heilige in Israël.","8":"Ziet, het komt en zal geschieden, spreekt de Heere HEERE; dit is de dag, *van* welken Ik gesproken heb.","9":"En de inwoners der steden Israëls zullen uitgaan, en *vuur* stoken en branden van de wapenen, zo *van* schilden als rondassen, van bogen en van pijlen, zo van handstokken als van spiesen; en zij zullen daarvan vuur stoken zeven jaren;","10":"Zodat zij geen hout uit het veld zullen dragen, noch uit de wouden houwen, maar van de wapenen vuur stoken; en zij zullen beroven degenen, die hen beroofd hadden, en plunderen, die hen geplunderd hadden, spreekt de Heere HEERE.","11":"En het zal te dien dage geschieden, dat Ik aan Gog aldaar een grafstede in Israël zal geven, het dal der doorgangers naar het oosten der zee; en datzelve zal den doorgangers *den* *neus* stoppen; en aldaar zullen zij begraven Gog en zijn ganse menigte, en zullen het noemen: Het dal van Gogs menigte.","12":"Het huis Israëls nu zal hen begraven, om het land te reinigen, zeven maanden *lang*.","13":"Ja, al het volk des lands zal begraven, en het zal hun tot een naam zijn, ten dage als Ik zal verheerlijkt zijn, spreekt de Heere HEERE.","14":"Ook zullen zij mannen uitscheiden, die gestadig door het land doorgaan, *en* doodgravers met de doorgangers, *om* *te* *begraven* degenen, die op den aardbodem zijn overgelaten, om dien te reinigen; ten einde van zeven maanden zullen zij onderzoek doen.","15":"En deze doorgangers zullen door het land doorgaan, en *als* *iemand* een mensenbeen ziet, zo zal hij een merkteken daarbij oprichten; totdat de doodgravers hetzelve zullen hebben begraven in het dal van Gogs menigte.","16":"Ook zo zal de naam der stad Hamona zijn. Alzo zullen zij het land reinigen.","17":"Gij dan, mensenkind! zo zegt de Heere HEERE: Zeg tot het gevogelte van allen vleugel, en tot al het gedierte des velds: Vergadert u, en komt aan, verzamelt u van rondom, tot Mijn slachtoffer, dat Ik voor u geslacht heb, een groot slachtoffer, op de bergen Israëls, en eet vlees, en drinkt bloed.","18":"Het vlees der helden zult gij eten, en het bloed van de vorsten der aarde drinken; der rammen, der lammeren, en bokken, *en* varren, die altemaal gemesten van Basan zijn.","19":"En gij zult het vette eten tot verzadiging toe, en bloed drinken tot dronkenschap toe; van Mijn slachtoffer, dat Ik voor u geslacht heb.","20":"En gij zult verzadigd worden aan Mijn tafel van *rij* paarden en wagen *paarden*, van helden en alle krijgslieden, spreekt de Heere HEERE.","21":"En Ik zal Mijn eer zetten onder de heidenen; en alle heidenen zullen Mijn oordeel zien, dat Ik gedaan heb, en Mijn hand, die Ik aan hen gelegd heb.","22":"En die van het huis Israëls zullen weten, dat Ik, de HEERE, hunlieder God ben, van dien dag af en voortaan.","23":"En de heidenen zullen weten, dat die van het huis Israëls gevankelijk zijn weggevoerd om hun ongerechtigheid, omdat zij tegen Mij hadden overtreden, en dat Ik Mijn aangezicht voor hen verborgen heb, en heb ze overgegeven in de hand hunner wederpartijders, zodat zij altemaal door het zwaard gevallen zijn;","24":"Naar hun onreinigheid en naar hun overtredingen heb Ik met hen gehandeld, en Ik heb Mijn aangezicht voor hen verborgen.","25":"Daarom zo zegt de Heere HEERE: Nu zal Ik Jakobs gevangenen wederbrengen, en zal Mij ontfermen over het ganse huis Israëls, en Ik zal ijveren over Mijn heiligen Naam;","26":"Als zij hun schande zullen gedragen hebben, en al hun overtreding, *met* dewelke zij tegen Mij hebben overtreden, toen zij in hun land zeker woonden, en er niemand was, die hen verschrikte.","27":"Als Ik hen zal hebben wedergebracht uit de volken, en hen vergaderd zal hebben uit de landen hunner vijanden, en Ik aan hen geheiligd zal zijn voor de ogen van vele heidenen;","28":"Dan zullen zij weten, dat Ik, de HEERE, hunlieder God ben, dewijl Ik ze gevankelijk heb doen wegvoeren onder de heidenen, maar heb ze *weder* verzameld in hun land, en heb aldaar niemand van hen meer overgelaten.","29":"En Ik zal Mijn aangezicht voor hen niet meer verbergen, wanneer Ik Mijn Geest over het huis Israëls zal hebben uitgegoten, spreekt de Heere HEERE."},"KJV":{"1":"Therefore, thou son of man, prophesy against Gog, and say, Thus saith the Lord GOD; Behold, I *am* against thee, O Gog, the chief prince of Meshech and Tubal:","2":"And I will turn thee back, and leave but the sixth part of thee, and will cause thee to come up from the north parts, and will bring thee upon the mountains of Israel:","3":"And I will smite thy bow out of thy left hand, and will cause thine arrows to fall out of thy right hand.","4":"Thou shalt fall upon the mountains of Israel, thou, and all thy bands, and the people that *is* with thee: I will give thee unto the ravenous birds of every sort, and *to* the beasts of the field to be devoured.","5":"Thou shalt fall upon the open field: for I have spoken *it*, saith the Lord GOD.","6":"And I will send a fire on Magog, and among them that dwell carelessly in the isles: and they shall know that I *am* the LORD.","7":"So will I make my holy name known in the midst of my people Israel; and I will not *let them* pollute my holy name any more: and the heathen shall know that I *am* the LORD, the Holy One in Israel.","8":"Behold, it is come, and it is done, saith the Lord GOD; this *is* the day whereof I have spoken.","9":"And they that dwell in the cities of Israel shall go forth, and shall set on fire and burn the weapons, both the shields and the bucklers, the bows and the arrows, and the handstaves, and the spears, and they shall burn them with fire seven years:","10":"So that they shall take no wood out of the field, neither cut down *any* out of the forests; for they shall burn the weapons with fire: and they shall spoil those that spoiled them, and rob those that robbed them, saith the Lord GOD.","11":"And it shall come to pass in that day, *that* I will give unto Gog a place there of graves in Israel, the valley of the passengers on the east of the sea: and it shall stop the *noses* of the passengers: and there shall they bury Gog and all his multitude: and they shall call *it* The valley of Hamongog.","12":"And seven months shall the house of Israel be burying of them, that they may cleanse the land.","13":"Yea, all the people of the land shall bury *them*; and it shall be to them a renown the day that I shall be glorified, saith the Lord GOD.","14":"And they shall sever out men of continual employment, passing through the land to bury with the passengers those that remain upon the face of the earth, to cleanse it: after the end of seven months shall they search.","15":"And the passengers *that* pass through the land, when *any* seeth a man's bone, then shall he set up a sign by it, till the buriers have buried it in the valley of Hamongog.","16":"And also the name of the city *shall be* Hamonah. Thus shall they cleanse the land.","17":"And, thou son of man, thus saith the Lord GOD; Speak unto every feathered fowl, and to every beast of the field, Assemble yourselves, and come; gather yourselves on every side to my sacrifice that I do sacrifice for you, *even* a great sacrifice upon the mountains of Israel, that ye may eat flesh, and drink blood.","18":"Ye shall eat the flesh of the mighty, and drink the blood of the princes of the earth, of rams, of lambs, and of goats, of bullocks, all of them fatlings of Bashan.","19":"And ye shall eat fat till ye be full, and drink blood till ye be drunken, of my sacrifice which I have sacrificed","20":"Thus ye shall be filled at my table with horses and chariots, with mighty men, and with all men of war, saith the Lord GOD.","21":"And I will set my glory among the heathen, and all the heathen shall see my judgment that I have executed, and my hand that I have laid","22":"So the house of Israel shall know that I *am* the LORD their God from that day and forward.","23":"And the heathen shall know that the house of Israel went into captivity for their -kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I am against thee, O <span class=\"wl wl-kjv\" data-code=\"H1463\">Gog,</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> of <span class=\"wl wl-kjv\" data-code=\"H4902\">Meshech</span> and Tubal:","2":"And I will turn thee <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and leave but the sixth <span class=\"wl wl-kjv\" data-code=\"H8338\">part</span> of thee, and will cause thee to come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> <span class=\"wl wl-kjv\" data-code=\"H3411\">parts,</span> and will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> thee upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of Israel:","3":"And I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thy <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H8040\">left</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and will cause thine <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> hand.","4":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> thou, and all thy <span class=\"wl wl-kjv\" data-code=\"H102\">bands,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that is with thee: I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee unto the <span class=\"wl wl-kjv\" data-code=\"H5861\">ravenous</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">birds</span> of every <span class=\"wl wl-kjv\" data-code=\"H3671\">sort,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> to be devoured.","5":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">open</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","6":"And I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> on <span class=\"wl wl-kjv\" data-code=\"H4031\">Magog,</span> and among them that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H983\">carelessly</span> in the <span class=\"wl wl-kjv\" data-code=\"H339\">isles:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","7":"So will I make my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and I will not let them <span class=\"wl wl-kjv\" data-code=\"H2490\">pollute</span> my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> any more: and the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> in Israel.","8":"Behold, it is <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and it is <span class=\"wl wl-kjv\" data-code=\"H1961\">done,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> this is the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> whereof I have spoken.","9":"And they that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H1197\">set</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> and <span class=\"wl wl-kjv\" data-code=\"H5400\">burn</span> the <span class=\"wl wl-kjv\" data-code=\"H5402\">weapons,</span> both the <span class=\"wl wl-kjv\" data-code=\"H4043\">shields</span> and the <span class=\"wl wl-kjv\" data-code=\"H6793\">bucklers,</span> the <span class=\"wl wl-kjv\" data-code=\"H7198\">bows</span> and the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3027\">handstaves,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7420\">spears,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H1197\">burn</span> them with <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> years:","10":"So that they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> no <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> neither cut <span class=\"wl wl-kjv\" data-code=\"H2404\">down</span> any out of the <span class=\"wl wl-kjv\" data-code=\"H3293\">forests;</span> for they shall <span class=\"wl wl-kjv\" data-code=\"H1197\">burn</span> the <span class=\"wl wl-kjv\" data-code=\"H5402\">weapons</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7997\">spoil</span> those that <span class=\"wl wl-kjv\" data-code=\"H7997\">spoiled</span> them, and <span class=\"wl wl-kjv\" data-code=\"H962\">rob</span> those that <span class=\"wl wl-kjv\" data-code=\"H962\">robbed</span> them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","11":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto <span class=\"wl wl-kjv\" data-code=\"H1463\">Gog</span> a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> there of <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of the <span class=\"wl wl-kjv\" data-code=\"H5674\">passengers</span> on the <span class=\"wl wl-kjv\" data-code=\"H6926\">east</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H2629\">stop</span> the noses of the <span class=\"wl wl-kjv\" data-code=\"H5674\">passengers:</span> and there shall they <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> <span class=\"wl wl-kjv\" data-code=\"H1463\">Gog</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> it The <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of Hamongog.","12":"And <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months</span> shall the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be <span class=\"wl wl-kjv\" data-code=\"H6912\">burying</span> of them, that they may <span class=\"wl wl-kjv\" data-code=\"H2891\">cleanse</span> the land.","13":"Yea, all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> them; and it shall be to them a <span class=\"wl wl-kjv\" data-code=\"H8034\">renown</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I shall be <span class=\"wl wl-kjv\" data-code=\"H3513\">glorified,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","14":"And they shall sever <span class=\"wl wl-kjv\" data-code=\"H914\">out</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of continual <span class=\"wl wl-kjv\" data-code=\"H8548\">employment,</span> passing <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> with the <span class=\"wl wl-kjv\" data-code=\"H5674\">passengers</span> those that <span class=\"wl wl-kjv\" data-code=\"H3498\">remain</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> to <span class=\"wl wl-kjv\" data-code=\"H2891\">cleanse</span> it: after the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months</span> shall they search.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H5674\">passengers</span> that pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> when any <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">bone,</span> then shall he set <span class=\"wl wl-kjv\" data-code=\"H1129\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H6725\">sign</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> it, till the <span class=\"wl wl-kjv\" data-code=\"H6912\">buriers</span> have <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> it in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of Hamongog.","16":"And also the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1997\">Hamonah.</span> Thus shall they <span class=\"wl wl-kjv\" data-code=\"H2891\">cleanse</span> the land.","17":"And, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> unto every <span class=\"wl wl-kjv\" data-code=\"H3671\">feathered</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">fowl,</span> and to every <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">Assemble</span> yourselves, and <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> yourselves on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side</span> to my <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> that I do <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> for you, even a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> blood.","18":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> of <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> of <span class=\"wl wl-kjv\" data-code=\"H3733\">lambs,</span> and of <span class=\"wl wl-kjv\" data-code=\"H6260\">goats,</span> of <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H4806\">fatlings</span> of Bashan.","19":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> till ye be <span class=\"wl wl-kjv\" data-code=\"H7654\">full,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> till ye be <span class=\"wl wl-kjv\" data-code=\"H7943\">drunken,</span> of my <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> which I have sacrificed","20":"Thus ye shall be <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> at my <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> with <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> with mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men,</span> and with all <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","21":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> that I have <span class=\"wl wl-kjv\" data-code=\"H6213\">executed,</span> and my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> that I have laid","22":"So the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> and forward.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went into <span class=\"wl wl-kjv\" data-code=\"H1540\">captivity</span> for their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity:</span> because they <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed</span> against me, therefore <span class=\"wl wl-kjv\" data-code=\"H5641\">hid</span> I my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> from them, and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of their <span class=\"wl wl-kjv\" data-code=\"H6862\">enemies:</span> so <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> they all by the sword.","24":"According to their <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> and according to their <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> have I <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H5641\">hid</span> my face","25":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Now will I bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon the whole <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and will be <span class=\"wl wl-kjv\" data-code=\"H7065\">jealous</span> for my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> name;","26":"After that they have <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> their <span class=\"wl wl-kjv\" data-code=\"H3639\">shame,</span> and all their <span class=\"wl wl-kjv\" data-code=\"H4604\">trespasses</span> whereby they have <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed</span> against me, when they <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> <span class=\"wl wl-kjv\" data-code=\"H983\">safely</span> in their <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> and none made them afraid.","27":"When I have brought them <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> from the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> them out of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies'</span> <span class=\"wl wl-kjv\" data-code=\"H776\">lands,</span> and am <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> in them in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> nations;","28":"Then shall they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which caused them to be led into <span class=\"wl wl-kjv\" data-code=\"H1540\">captivity</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen:</span> but I have <span class=\"wl wl-kjv\" data-code=\"H3664\">gathered</span> them unto their own <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> and have left","29":"Neither will I <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> any more from them: for I have poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"wil aan u, o Gog,","tekst":"Zie boven Eze 38:2-3 ."}],"2":[{"catchword":"omwenden,","tekst":"Gelijk boven Eze 38:4 ."},{"catchword":"zeshaak in u slaan,","tekst":"Hebreeuws eigenlijk alsof men zeide: Ik zal u zessen, dat verscheidenlijk wordt overgezet. Hetgeen hier in den tekst gesteld is, is genomen uit vergelijking met Eze 38:4 ; waar God zeide: Ik zal u omwenden en haken in uwe kaken, of kieuwen doen. Waarop Hij hier schijnt te willen zeggen: Ik zal u als met zes haken, of een zeshakigen haak, alzo vasthouden, voeren en omleiden naar mijnen wil, dat gij mij niet zult ontkomen, of buiten den cirkel mijner regering springen, maar uwe straf ontvangen ter plaatse, waarheen Ik u, als een veroordeelden misdadiger, zal voeren; gelijk men bij de heidenen wel gewoon was den misdadiger met een ingeslagen haak te voeren of voort te trekken. Sommigen vertalen het: Ik zal u zesvoudig straffen, te weten met de zes plagen, die Eze 38:22 verhaald zijn. Anders: Ik zal maar het zesde deel van u, of een deel van zessen overlaten, of, bij zessen slaan; of, Ik zal u zo behandelen, gelijk men den zesden [idem, tienden, twintigsten, enz.] van de gevangenis in den oorlog wel placht te doen, dat is, doden, enz."}],"3":[{"catchword":"boog uit uw linkerhand slaan,","tekst":"Dat is, Ik zal u alle krijgsmacht en moed benemen, uwe wapenen verijdelen, of u als ontwapenen, en alzo voor uwen vijand vellen."}],"4":[{"catchword":"vallen,","tekst":"Of, liggen, gelijk elders."},{"catchword":"roofvogelen,","tekst":"Hebreeuws, roofvogel."},{"catchword":"allen vleugel,","tekst":"Dat is, allerlei, gelijk onder vs.17."}],"5":[{"catchword":"open veld zult gij vallen;","tekst":"Hebreeuws, aangezicht des velds."}],"6":[{"catchword":"vuur zenden in Magog,","tekst":"Van den oorlog, de plagen en ellenden, voortkomende uit het vuur van mijn toorn, boven Eze 38:18-19 . Zie Amo 1:4 , enz."},{"catchword":"eilanden zeker wonen;","tekst":"Zie Psa 72:10 ."}],"7":[{"catchword":"heiligen Naam","tekst":"Hebreeuws, naam mijner heiligheid, alzo in het volgende, dat is, mijzelven met mijne macht, gerechtigheid, goedheid, heerlijkheid, enz."},{"catchword":"ontheiligen;","tekst":"Zie Lev 18:21 ; boven Eze 20:9 ."}],"8":[{"catchword":"het komt en zal geschieden,","tekst":"Zekerlijk, zonder feil, zal dit alles vervuld worden."}],"9":[{"catchword":"uitgaan,","tekst":"Om den buit der verslagenen te verzamelen."},{"catchword":"vuur stoken en branden","tekst":"Dit is hier ingevoegd uit het (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
