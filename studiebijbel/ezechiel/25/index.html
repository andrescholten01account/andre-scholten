in het eikendal; en stelden de slagorde tegen de Filistijnen op. De Filistijnen nu stonden aan een berg aan de ene kant, en de Israëlieten stonden aan een berg aan de andere kant; en de vallei was tussen hen.", "Ezech 16:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ezech 14:7": "Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Num 32:38": "en Nebo, en Baäl-Meon, waarvan de naam veranderd was, en Sibma; en zij noemden de steden die zij bouwden met andere namen.", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Richt 6:33": "Alle Midianieten nu, en Amalekieten, en de mensen uit het oosten, waren bijeengebracht, en zij trokken over, en legerden zich in het dal van Jizreël.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Ps 140:3": "Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ezech 22:17": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Ezech 38:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "1 Kor 10:11": "En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.", "2 Kon 23:13": "De hoogten ook, die vooraan bij Jeruzalem waren, die aan de rechterhand van de berg Mashith lagen, die Salomo, de koning van Israël, gebouwd had voor Astoreth, het verfoeisel van de Sidoniërs, en voor Kamos, het verfoeisel van de Moabieten, en voor Milchom, de gruwel van de kinderen van Ammon, verontreinigde de koning.", "Jes 37:20": "Nu dan, HEERE, onze God, verlos ons uit zijn hand, zodat alle koninkrijken van de aarde weten dat U alleen de HEERE bent.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "Ezech 25:12-14": "Zo zegt de Heere HEERE: Omdat Edom met louter wraakgierigheid gehandeld heeft tegen het huis van Juda, en zij zich zeer schuldig gemaakt hebben doordat zij zich op hen gewroken hebben: Daarom, zo zegt de Heere HEERE: Ik zal ook Mijn hand uitstrekken tegen Edom, en Ik zal mens en dier uit haar uitroeien; en Ik zal haar tot een woestenij maken, vanaf Teman; en zij zullen tot Dedan toe door het zwaard vallen. En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE.", "1 Kon 16:2-13": "Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat. Wie van Baësa in de stad sterft, zullen de honden opeten, en wie van hem in het veld sterft, zullen de vogels van de hemel opeten.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Ezech 21:20": "U zult een weg voorstellen, waardoor het zwaard zal binnenkomen tegen Rabba van de kinderen van Ammon, of tegen Juda, tot de versterkte stad Jeruzalem.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Jer 48:23": "En over Kirjathaïm, en over Beth-gamul, en over Beth-meon,", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Jes 10:9-11": "Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus? Zoals mijn hand de koninkrijken van de afgoden gevonden heeft, ofschoon hun gesneden beelden beter zijn dan die van Jeruzalem, en dan die van Samaria; zou ik, zoals ik gedaan heb aan Samaria en aan haar afgoden, niet zo kunnen doen aan Jeruzalem en aan haar afgoden?", "Ezech 25:2-7": "Mensenkind! Zet uw gezicht tegen de kinderen van Ammon, en profeteer tegen hen; En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen; Daarom, zie, Ik zal u overgeven aan die van het oosten tot een bezitting, zodat zij hun burchten in u zetten, en hun woningen in u plaatsen; die zullen uw vruchten eten, en die zullen uw melk drinken.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Jes 16:14": "Maar nu spreekt de HEERE en zegt: Binnen drie jaar (zoals de jaren van het huurling), dan zal de eer van Moab veracht worden, met heel die grote menigte; en het overblijfsel zal klein, weinig, machteloos zijn.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Ezech 35:3": "En zeg ertegen: Zo zegt de Heere HEERE: Zie, Ik heb het tegen u, o gebergte Seir! En Ik zal Mijn hand tegen u uitstrekken, en zal u maken tot een verwoesting en een verlatenheid.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Jes 64:1": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Num 23:7": "Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Jer 48:27": "Want is Israël u niet tot bespotting geweest? Was hij onder de dieven gevonden, dat u zich zo bewoog, van de tijd af dat uw woorden over hem gingen?", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Job 27:23": "Ieder zal over hem met zijn handen klappen, en over hem fluiten uit zijn plaats.", "Ezech 30:19": "Zo zal Ik gerichten voltrekken in Egypte; en zij zullen weten dat Ik de HEERE ben.", "Ezech 24:1": "Verder kwam het woord van de HEERE tot mij, in het negende jaar, in de tiende maand, op de tiende dag van de maand, en Hij zei:", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Joh 18:22": "En toen Hij dit zei, gaf een van de dienaars die daarbij stond Jezus een klap in het gezicht en zei: Antwoordt U zo de hogepriester?", "Ps 28:3": "Trek mij niet weg met de goddelozen, en met de werkers van de ongerechtigheid, die van vrede spreken met hun naasten, maar kwaad is er in hun hart.", "Ezech 21:18": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Ezech 12:16": "Toch zal Ik van hen weinige mensen laten overblijven van het zwaard, van de honger en van de pest; opdat zij al hun gruwelen vertellen onder de heidenvolken, waarheen zij komen zullen, en zij zullen weten dat Ik de HEERE ben.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Gen 27:37-40": "Toen antwoordde Izak, en zei tegen Ezau: Zie, ik heb hem tot een heer over u gesteld, en al zijn broers heb ik hem tot knechten gegeven; en ik heb hem met koren en most ondersteund; wat zal ik dan nu voor u doen, mijn zoon? En Ezau zei tegen zijn vader: Hebt u maar deze ene zegen, mijn vader? Zegen mij, ook mij, mijn vader! En Ezau verhief zijn stem, en weende. Toen antwoordde zijn vader Izak en zei tegen hem: Zie, de vettigheden van de aarde zullen uw woningen zijn, en van de dauw van de hemel van boven af zult u gezegend zijn.", "Spr 10:12": "Haat verwekt ruzies; maar de liefde bedekt alle overtredingen.", "Matt 26:52": "Toen zei Jezus tegen hem: Steek uw zwaard terug op zijn plaats; want allen die het zwaard nemen, zullen door het zwaard omkomen.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Joël 3:19": "Egypte zal tot een verwoesting worden, en Edom zal worden tot een woeste wildernis, om het geweld, gedaan aan de kinderen van Juda, in wier land zij onschuldig bloed vergoten hebben.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Jer 33:5": "Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.", "Jer 17:4": "Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.", "Spr 4:16": "Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Richt 16:31": "Toen kwamen zijn broers naar beneden, en het hele huis van zijn vader, en namen hem op, en brachten hem omhoog, en begroeven hem tussen Zora en Esthaol, in het graf van zijn vader Manoach; hij had Israël twintig jaar geleid.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Mal 1:2-5": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad, en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn. Ofschoon Edom zei: Wij zijn arm geworden, maar wij zullen de verwoeste plaatsen weer opbouwen; zo zegt de HEERE van de heerscharen: Zullen zij bouwen, dan zal Ik afbreken; en men zal hen noemen: Gebied van de goddeloosheid, en een volk, op wie de HEERE toornig is tot in eeuwigheid.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "1 Kor 5:8": "Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ezech 26:3": "Daarom, zo zegt de Heere HEERE: Zie, Ik wil aan u, o Tyrus! En Ik zal veel heidenvolken tegen u doen opkomen, alsof Ik de zee met haar golven deed opkomen.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Jer 20:10": "Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "Spr 4:17": "Want zij eten brood van goddeloosheid, en drinken wijn van enkel geweld.", "Ezech 30:25": "Ja, Ik zal de armen van de koning van Babel sterken, maar Farao's armen zullen daarheen vallen; en zij zullen weten dat Ik de HEERE ben, als Ik Mijn zwaard in de hand van de koning van Babel zal hebben gegeven, en hij dat over Egypteland zal hebben uitgestrekt.", "Jer 21:5": "En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "Amos 2:11": "En Ik heb sommigen uit uw zonen tot profeten verwekt, en uit uw jongelingen tot nazireeërs; is dit niet zo, kinderen van Israël? spreekt de HEERE.", "Ezech 12:21": "Opnieuw kwam het woord van de HEERE tot mij en Hij zei:", "Ezech 20:46": "Mensenkind, richt uw aangezicht naar de weg van het zuiden, en druppel tegen het zuiden; en profeteer tegen het woud van het veld in het zuiden.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "Ezech 32:29": "Daar is Edom, haar koningen en al haar vorsten, die met hun macht gelegd zijn bij de verslagenen van het zwaard; die liggen met de onbesnedenen en met hen die in het kuil zijn neergedaald.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Num 32:13": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "1 Sam 30:14-16": "Wij waren binnengevallen in het zuiden van de Cherethieten, en in het gebied dat aan Juda toebehoort, en in het zuiden van Kaleb; en wij hebben Ziklag met vuur verbrand. Toen zei David tegen hem: Zou u mij naar beneden kunnen leiden naar deze bende? Hij dan zei: Zweer mij bij God, dat u mij niet zult doden, en dat u mij niet zult overleveren in de hand van mijn heer! Dan zal ik u naar deze bende leiden. En hij leidde hem naar beneden, en zie, zij lagen verspreid over het hele land, etend, en drinkend, en dansend, vanwege al de grote buit die zij genomen hadden uit het land van de Filistijnen, en uit het land van Juda.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Jes 32:8": "Maar een milddadige bedenkt milddadige dingen, en staat op door milddadige dingen.", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "Ps 59:7": "Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad.", "1 Sam 4:1": "Het woord van Samuël kwam tot heel Israël. En Israël trok uit, de Filistijnen tegemoet ten strijde, en legerde zich bij Eben-haëzer, maar de Filistijnen legerden zich bij Afek.", "Ps 38:20": "Maar mijn vijanden leven, worden machtig; en die mij om valse redenen haten, worden groot in aantal.", "Ezech 22:23": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Ezech 25:15-17": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen. En Ik zal grote wraak met grimmige straffen onder hen voltrekken; en zij zullen weten dat Ik de HEERE ben, wanneer Ik Mijn wraak aan hen zal hebben voltrokken.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Ezech 14:13": "Mensenkind, als een land tegen Mij zondigt door zwaar te overtreden, dan zal Ik Mijn hand daartegen uitstrekken, en de staf van het brood daarvan breken, en een honger daarin zenden, zodat Ik daaruit mensen en beesten uitroei;", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "Ezech 18:18": "Zijn vader, omdat hij met onderdrukking onderdrukt heeft, het goed van zijn broeder geroofd heeft, en gedaan heeft wat niet goed was te midden van zijn volk; zie, hij zal sterven in zijn ongerechtigheid.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Hab 3:3": "God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "2 Sam 8:18": "Er was ook Benaja, zoon van Jojada, met de Krethi en de Plethi; maar Davids zonen waren prinsen.", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Ps 56:6": "De hele dag verdraaien zij mijn woorden; al hun gedachten zijn tegen mij ten kwade.", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "2 Sam 20:23": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Num 12:9": "Zo ontstak de toorn van de HEERE tegen hen, en Hij ging weg.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Jer 48:1-47": "Tegen Moab zegt de HEERE van de heerscharen, de God van Israël, zo: Wee over Nebo, want zij is verwoest; Kirjathaïm is beschaamd, zij is ingenomen; de stad van het hoge vertrek is beschaamd en verschrikt. Moabs roem van Hesbon is er niet meer; zij hebben kwaad tegen haar bedacht en gezegd: Komt, laten we haar uitroeien, zodat zij geen volk meer is; ook u, o Madmen! zult neergehouwen worden, het zwaard zal achter u aan gaan. Er is een stem van geroep uit Horonaïm; verwoesting en een grote breuk!", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Ezech 6:7": "En de gesneuvelden zullen in uw midden liggen, zodat u weet dat Ik de HEERE ben.", "Ezech 18:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "Joz 13:19": "En Kirjathaim, en Sibma, en Zeret-hassahar, op de berg van het dal,", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ezech 37:15": "Verder gebeurde het dat het woord van de HEERE tot mij kwam:", "Ps 140:2-5": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Amos 1:6-8": "Zo zegt de HEERE: Om drie overtredingen van Gaza, en om vier zal Ik dat niet afwenden; omdat zij Mijn volk als gevangenen hebben weggevoerd, met een volledige wegvoering, om aan Edom over te leveren. Daarom zal Ik een vuur zenden in de muur van Gaza, dat zal haar paleizen verteren. En Ik zal de inwoner uitroeien uit Asdod, en hem die de scepter houdt, uit Askelon; en Ik zal Mijn hand keren tegen Ekron, en het overblijfsel van de Filistijnen zal vergaan, zegt de Heere HEERE.", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Ezech 23:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Nahum 1:2-4": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden. De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg.", "Klaagl 4:4": "Daleth. De tong van het zuigeling kleeft aan zijn gehemelte van dorst; de kinderen vragen om brood, er is niemand die het hun uitdeelt.", "Zach 9:5-7": "Askelon zal het zien, en zal vrezen; evenzo Gaza, en zal grote smart hebben, alsook Ekron, omdat hetgeen waar zij op zagen, hen te schande heeft gemaakt; en de koning van Gaza zal vergaan, en Askelon zal niet bewoond worden. En de bastaard zal te Asdod wonen, en Ik zal de hoogmoed van de Filistijnen uitroeien. En Ik zal zijn bloed uit zijn mond wegdoen, en zijn afschuwelijkheden van tussen zijn tanden; zo zal hij ook voor onze God overblijven; ja, hij zal zijn als een vorst in Juda, en Ekron als de Jebusiet.", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "1 Kron 7:21": "En zijn zoon was Zabad; en zijn zoon Suthelah, en Ezer, en Elad. En de mannen van Gath, die in dat land geboren waren, doodden hen, omdat zij afgekomen waren om hun vee weg te nemen.", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "Ezech 27:20": "Dedan handelde met u met kostbaar gewaad voor wagens.", "Ezech 36:16": "Verder gebeurde het: het woord van de HEERE kwam tot mij, en Hij zei:", "Deut 27:18": "Vervloekt is hij die een blinde op de weg laat dwalen! En heel het volk zal zeggen: Amen.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Deut 28:51": "En het zal de vrucht van uw vee, en de vrucht van uw land opeten, totdat u verdelgd zult zijn; het zal u geen koren, most of olie, aanwas van uw koeien of kudden van uw kleinvee overlaten, totdat het u vernietigt.", "Richt 14:1": "En Simson ging af naar Thimnath, en zag daar een vrouw uit de dochters van de Filistijnen,", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Micha 2:1": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Ezech 29:8": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal het zwaard over u brengen, en Ik zal uit u mens en dier uitroeien.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Ps 57:7": "Zij hebben een net klaargezet voor mijn voeten, mijn ziel was neergebukt; zij hebben een kuil voor mij gegraven; zij zijn er zelf middenin gevallen. Sela.", "Obadja 1:10-16": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid. Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen. U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Jer 49:1-6": "Tegen de kinderen van Ammon zegt de HEERE zo: Heeft Israël dan geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en waarom woont zijn volk in zijn steden? Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE. Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Num 11:1": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Ezech 25:1-11": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Zet uw gezicht tegen de kinderen van Ammon, en profeteer tegen hen; En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen;", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Neh 4:3": "En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Ps 10:7-10": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht. Hij zit in de hinderlaag bij de hoeven, in verborgen plaatsen doodt hij de onschuldige; zijn ogen verbergen zich tegen de arme. Hij legt lagen in een verborgen plaats, zoals een leeuw in zijn hol; hij legt lagen om de ellendige te roven; hij rooft de ellendige als hij hem trekt in zijn net.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Ezech 21:2": "Mensenkind! Zet uw gezicht tegen Jeruzalem, en drup tegen de heiligdommen, en profeteer tegen het land van Israël;", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Amos 1:14": "Daarom zal Ik een vuur aansteken in de muur van Rabba, dat zal haar paleizen verteren; met gejuich op de dag van de strijd, met een storm op de dag van de wervelwind.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "Jes 17:2": "De steden van Aroer zullen verlaten worden; ze zullen er zijn voor de kudden, die daar zullen neerliggen, en niemand zal ze schrik aanjagen.", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Spr 24:18": "Opdat de HEERE het niet ziet, en het kwaad is in Zijn ogen en Hij Zijn toorn van hem afkeert.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Ezech 21:8": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "Jer 47:1-7": "Het woord van de HEERE dat gebeurde tot de profeet Jeremia, tegen de Filistijnen; voordat Farao Gaza sloeg. Zo zegt de HEERE: Zie, er komt water op van het noorden, en het zal worden tot een overlopende beek, en zal overlopen het land en de volheid ervan, de stad en wie daarin wonen; en de mensen zullen schreeuwen, en alle inwoners van het land zullen huilen; Vanwege het geluid van het geklater van de hoeven van zijn sterke paarden, vanwege het geraas van zijn wagens, en het bulderen van zijn raderen; de vaders zien niet om naar de kinderen, vanwege de slapheid van de handen;", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Spr 6:14-16": "in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie. Daarom zal zijn ondergang snel komen; plotseling zal hij verbroken worden, zonder dat er genezing is. Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Ezech 35:15": "Zoals u zich verblijd hebt over de erfenis van het huis van Israël, omdat die verwoest is, zo zal Ik aan u doen; het gebergte van Seir, en heel Edom, zal helemaal een verwoesting worden; en zij zullen weten, dat Ik de HEERE ben.", "Ps 109:2-5": "Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak. Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Hab 1:5-9": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt. Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit.", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "1 Kor 9:7": "Wie dient ooit in de krijgsdienst op eigen kosten? Wie plant een wijngaard, en eet niet van zijn vrucht? Of wie hoedt een kudde, en eet niet van de melk van de kudde?", "Jes 9:10": "Want de HEERE zal Rezins tegenstanders tegen hem opheffen, en Hij zal zijn vijanden samen verenigen:", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Jer 49:7-22": "Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden? Vlucht, keer u om, woon in diepe plaatsen, inwoners van Dedan! want Ik heb Ezaus verderf over hem gebracht, de tijd waarop Ik hem bezocht heb. Als er wijnoogsters tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Als er dieven bij nacht gekomen waren, zouden zij niet verwoest hebben zoveel hun genoeg was?", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Ezech 33:23": "Toen kwam het woord van de HEERE tot mij:", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Luk 6:29": "Wie u op de ene wang slaat, biedt hem ook de andere aan; en wie u de mantel afneemt, weerhoud hem niet ook uw hemd te nemen.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Ezech 14:9": "Als nu een profeet overreed is en iets gesproken heeft, Ik, de HEERE, heb die profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Pred 7:26": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.", "Ps 102:9": "Mijn vijanden smaden mij de hele dag; die tegen mij razen, zweren bij mij.", "1 Sam 13:1": "Saul was een jaar koning geweest, en in het tweede jaar dat hij over Israël regeerde,", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "2 Kron 28:17": "Bovendien waren ook de Edomieten gekomen, en hadden Juda geslagen en gevangenen weggevoerd.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Zef 2:4-7": "Want Gaza zal verlaten zijn, en Askelon zal tot een verwoesting worden; Asdod zal men op de middag verdrijven, en Ekron zal uitgeworteld worden. Wee de inwoners van de kuststreek van de zee, het volk van de Cheretieten! Het woord van de HEERE zal tegen u zijn, gij Kanaän, land van de Filistijnen! En Ik zal u verdoen, zodat er geen inwoner zal zijn. En de kuststreek van de zee zal worden tot weiden, uitgegraven putten voor herders, en kooien voor kudden.", "Spr 14:17": "Wie haastig is tot toorn, zal dwaasheid doen; en een man met schandelijke plannen zal gehaat worden.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Ezech 38:13": "Scheba, en Dedan, en de kooplieden van Tarsis, en al hun jonge leeuwen zullen tegen u zeggen: Komt u, om buit te buiten? Hebt u uw verzameling verzameld, om roof te roven? Om zilver en goud weg te voeren, om vee en have weg te nemen, om een grote buit te buiten?", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Deut 27:17": "Vervloekt is hij die het gebied van zijn naaste verlegt! En heel het volk zal zeggen: Amen.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Amos 2:12": "Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Ezech 30:20": "Ook gebeurde het in het elfde jaar, in de eerste maand, op de zevende van de maand, dat het woord van de HEERE tot mij kwam: het zei:", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Jer 48:26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.", "Ps 119:150": "Die kwade praktijken najagen, genaken mij, zij wijken ver van Uw wet.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 30:14": "Een geslacht wiens tanden zwaarden zijn, en wiens baktanden messen zijn, om de ellendigen van de aarde en de behoeftigen onder de mensen te verslinden.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "Ezech 5:8": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Ps 69:27": "Want zij vervolgen hem die U geslagen hebt; en maken een praat van de smart van Uw verwonden.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Dan 4:24-26": "Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal: Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Ezech 7:24": "Daarom zal Ik de kwaadste van de heidenvolken doen komen, die hun huizen erfelijk zullen bezitten, en Ik zal de hoogmoed van de sterken doen ophouden, en die hen heiligen, zullen ontheiligd worden.", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Ps 59:14": "Verteer hen in grimmigheid; verteer hen, zodat zij er niet meer zijn, en laat hen weten dat God Heerser is in Jakob, ja, tot aan de einden van de aarde. Sela.", "Job 31:30": "(Ook heb ik mijn gehemelte niet toegelaten te zondigen, door een vloek zijn ziel te begeren).", "Jer 27:1-11": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia: Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Num 32:10": "Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:", "Ps 55:11": "Dag en nacht gaan zij er omheen op haar muren; en ongerechtigheid en overlast is binnen in haar.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Num 24:18": "En Edom zal een erfelijk bezit zijn; en Seir zal voor zijn vijanden een erfelijk bezit zijn; doch Israël zal met kracht handelen.", "Zef 2:5-15": "Wee de inwoners van de kuststreek van de zee, het volk van de Cheretieten! Het woord van de HEERE zal tegen u zijn, gij Kanaän, land van de Filistijnen! En Ik zal u verdoen, zodat er geen inwoner zal zijn. En de kuststreek van de zee zal worden tot weiden, uitgegraven putten voor herders, en kooien voor kudden. En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Jes 14:29-31": "Verheug u niet, u helemaal Palestina! dat de roede die u sloeg, gebroken is; want uit de wortel van de slang zal een basilisk voortkomen, en haar vrucht zal een vurige vliegende draak zijn. En de eerstgeborenen van de armen zullen weiden, en de behoeftigen zullen zeker neerliggen; uw wortel daarentegen zal Ik door de honger doden, en uw overblijfsel zal hij ombrengen. Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "Klaagl 2:15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Ezech 21:28-32": "En u, mensenkind, profeteer en zeg: Zo zegt de Heere HEERE over de kinderen van Ammon, en over hun smaad; zo zeg: Het zwaard, het zwaard is uitgetrokken, het is ter slachting gepolijst om te verslinden, om te glinsteren; Terwijl zij voor u nutteloze dingen zien, terwijl zij u leugen voorzeggen, om u op de halzen te leggen van hen die van de goddelozen verslagen zijn, wier dag gekomen was in de tijd van de uiterste ongerechtigheid. Keer uw zwaard terug in zijn schede! Op de plaats waar u geschapen bent, in het land van uw oorsprong, zal Ik u richten.", "Ezech 25:2-10": "Mensenkind! Zet uw gezicht tegen de kinderen van Ammon, en profeteer tegen hen; En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen; Daarom, zie, Ik zal u overgeven aan die van het oosten tot een bezitting, zodat zij hun burchten in u zetten, en hun woningen in u plaatsen; die zullen uw vruchten eten, en die zullen uw melk drinken.", "2 Kon 6:22": "Doch hij zei: U zult hen niet doden; zou u ook doden wie u met uw zwaard en met uw boog gevangen had? Zet hun brood en water voor, dat zij eten en drinken, en naar hun heer trekken.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "Klaagl 4:21": "Schin. Wees vrolijk, en verblijd u, dochter van Edom, die in het land Uz woont! toch zal de beker ook naar u toe komen, u zult dronken worden, en zich ontbloten.", "Zef 2:8-11": "Ik heb de beschimping van Moab gehoord, en de scheldwoorden van de kinderen van Ammon, waarmee zij Mijn volk beschimpt hebben, en zich groot gemaakt hebben tegen hun grondgebied. Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten. Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "2 Sam 8:1-18": "En het gebeurde daarna, dat David de Filistijnen sloeg en bracht hen ten onder; en David nam Meteg-Amma uit de hand van de Filistijnen. Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken. David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath.", "Jer 44:6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.", "Lev 26:33": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Ezech 28:11": "Verder gebeurde het woord van de HEERE tot mij:", "Hebr 3:11": "Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Richt 8:10": "Zebah nu en Tsalmuna waren in Karkor, en hun legers met hen, ongeveer vijftienduizend man, alles wat er over was van het hele leger van de mensen uit het oosten; en de gesneuvelden waren honderdtwintigduizend man, die het zwaard hanteerden.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Jer 25:38": "Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "2 Kron 28:18": "Daartoe waren de Filistijnen ingevallen in de steden van het laagland en het zuiden van Juda, en hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho met haar bijbehorende plaatsen, en Timna met haar bijbehorende plaatsen, en Gimzo met haar bijbehorende plaatsen; en zij woonden daar
