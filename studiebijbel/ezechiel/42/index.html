johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Daarna bracht hij mij uit naar de buitenste voorhof; de weg naar het noorden; en hij bracht mij tot de kamers, die tegenover de afgesneden plaats, en die tegenover het gebouw tegen het noorden waren.", "2": "Voor aan de lengte van de honderd el *naar* de deur van het noorden; en de breedte was vijftig el.", "3": "Tegenover de twintig *el*, die de binnenste voorhof had, en tegenover het plaveisel, dat de buitenste voorhof had, *was* galerij tegen galerij, in drie *rijen*.", "4": "En voor de kamers was een wandelpad van tien el de breedte; naar binnen toe, *en* een weg van één el; en de deuren daarvan waren tegen het noorden.", "5": "De bovenste kamers nu waren nauwer (omdat de galerijen meer wegnamen dan die), dan de onderste en dan de middelste van het gebouw.", "6": "Want ze waren wel van drie *rijen*, maar hadden geen pilaren zoals de pilaren van de voorhoven; daarom waren ze smaller dan de onderste en dan de middelste, van de grond af.", "7": "De muur nu, die naar buiten tegenover de kamers was, de weg naar de buitenste voorhof, voor aan de kamers, de lengte daarvan was vijftig el.", "8": "Want de lengte van de kamers, die de buitenste voorhof had, was vijftig el; en zie, voor aan de tempel waren honderd el.", "9": "Van onder deze kamers nu was de ingang van het oosten, zoals iemand daarin ingaat, vanuit de buitenste voorhof.", "10": "Aan de breedte van de muur van de voorhof, de weg naar het oosten, voor aan de afgesneden plaats, en voor aan het gebouw, waren kamers.", "11": "En de weg voor die kamers langs was net zo van uiterlijk als de kamers, die de weg naar het noorden waren, naar hun lengte, zo ook *naar* hun breedte; en al hun uitgangen waren ook naar hun manier van inrichting en naar hun deuren.", "12": "En net als de deuren van de kamers, die de weg naar het zuiden waren, was er een deur aan het begin van de weg, de weg voor aan de rechte muur, de weg naar het oosten, zoals men daar ingaat.", "13": "Toen zei hij tegen mij: De kamers van het noorden, *en* de kamers van het zuiden, die voor aan de afgesneden plaats zijn, dat zijn heilige kamers, waarin de priesters, die tot de HEERE naderen, de allerheiligste dingen zullen eten; daar zullen zij de allerheiligste dingen neerleggen, en het spijsoffer, en het zondoffer, en het schuldoffer, want de plaats is heilig.", "14": "Als de priesters ingegaan zullen zijn, dan zullen zij uit het heiligdom niet weer uitgaan naar de buitenste voorhof, maar daar hun kleren neerleggen, waarin zij gediend hebben, want die zijn heilig; en zij zullen andere kleren aantrekken, en naderen tot wat voor het volk is.", "15": "Toen hij nu de maten van het binnenste huis geëindigd had, bracht hij mij naar buiten, de weg naar de poort, die de weg naar het oosten uitzag, en hij mat het rondom.", "16": "Hij mat de oostzijde met het meetriet; vijfhonderd rieten, met het meetriet, rondom.", "17": "Hij mat de noordzijde, vijfhonderd rieten, met het meetriet, rondom.", "18": "De zuidzijde mat hij, vijfhonderd rieten, met het meetriet.", "19": "Hij ging om naar de westzijde, *en* hij mat vijfhonderd rieten, met het meetriet.", "20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd *rieten*, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige."}, "SV": {"1": "Daarna bracht hij mij uit tot het buitenste voorhof; den weg naar den weg van het noorden; en hij bracht mij tot de kameren, die tegenover de afgesneden plaats, en die tegenover het gebouw tegen het noorden waren:", "2": "Voor aan de lengte van de honderd ellen *naar* de deur van het noorden; en de breedte was vijftig ellen.", "3": "Tegenover de twintig *ellen*, die het binnenste voorhof had, en tegenover het plaveisel, dat het buitenste voorhof had, *was* galerij tegen galerij, in drie *rijen*.", "4": "En voor de kameren was een wandeling van tien ellen de breedte; naar binnen toe, *en* een weg van een el; en de deuren van dezelve waren tegen het noorden.", "5": "De bovenste kameren nu waren nauwer (omdat de galerijen hoger waren dan dezelve), dan de onderste en dan de middelste des gebouws.", "6": "Want zij waren wel van drie *rijen*, maar hadden geen pilaren gelijk de pilaren der voorhoven; daarom waren zij benauwder dan de onderste en dan de middelste van de aarde af.", "7": "De muur nu, die naar buiten tegenover de kameren was, den weg naar het buitenste voorhof, voor aan de kameren, de lengte van dien was vijftig ellen.", "8": "Want de lengte der kameren, die het buitenste voorhof had, was vijftig ellen; en ziet, voor aan den tempel waren honderd ellen.", "9": "Van onder deze kameren nu was de ingang van het oosten, als iemand tot dezelve ingaat, uit het buitenste voorhof.", "10": "Aan de breedte van den muur des voorhofs, den weg naar het oosten, voor aan de afgesneden plaats, en voor aan het gebouw, waren kameren.", "11": "En de weg voor dezelve henen was als de gedaante der kameren, die den weg naar het noorden waren, naar derzelver lengte, alzo *naar* derzelver breedte; en al haar uitgangen waren ook naar derzelver wijzen en naar derzelver deuren.", "12": "En gelijk de deuren der kameren, die den weg naar het zuiden waren, was er een deur in het hoofd van den weg, den weg voor aan den rechten muur, den weg naar het oosten, als men daar ingaat.", "13": "Toen zeide hij tot mij: De kameren van het noorden, *en* de kameren van het zuiden, die voor aan de afgesneden plaats zijn, dat zijn heilige kameren, waarin de priesters, die tot den HEERE naderen, die allerheiligste dingen zullen eten; aldaar zullen zij de allerheiligste dingen henenleggen, en het spijsoffer, en het zondoffer, en het schuldoffer, want de plaats is heilig.", "14": "Als de priesters ingegaan zullen zijn, zo zullen zij uit het heiligdom niet *weder* uitgaan in het buitenste voorhof, maar aldaar hun klederen henenleggen, in dewelke zij gediend hebben, want die zijn een heiligheid; en zij zullen andere klederen aantrekken , en naderen tot hetgeen voor het volk is.", "15": "Als hij nu de maten van het binnenste huis geëindigd had, zo bracht hij mij uit, den weg naar de poort, die den weg naar het oosten zag, en hij mat ze rondom henen.", "16": "Hij mat de oostzijde met het meetriet; vijfhonderd rieten, met het meetriet, rondom.", "17": "Hij mat de noordzijde, vijfhonderd rieten, met het meetriet, rondom.", "18": "De zuidzijde mat hij, vijfhonderd rieten, met het meetriet.", "19": "Hij ging om naar de westzijde, *en* hij mat vijfhonderd rieten, met het meetriet.", "20": "Hij mat het aan de vier zijden; het had een muur rondom henen, de lengte was vijfhonderd *rieten*, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en onheilige."}, "KJV": {"1": "Then he brought me forth into the utter court, the way toward the north: and he brought me into the chamber that *was* over against the separate place, and which *was* before the building toward the north.", "2": "Before the length of an hundred cubits *was* the north door, and the breadth *was* fifty cubits.", "3": "Over against the twenty *cubits* which *were* for the inner court, and over against the pavement which *was* for the utter court, *was* gallery against gallery in three", "4": "And before the chambers *was* a walk of ten cubits breadth inward, a way of one cubit; and their doors toward the north.", "5": "Now the upper chambers *were* shorter: for the galleries were higher than these, than the lower, and than the middlemost of the building.", "6": "For they *were* in three *stories*, but had not pillars as the pillars of the courts: therefore *the building* was straitened more than the lowest and the middlemost from the ground.", "7": "And the wall that *was* without over against the chambers, toward the utter court on the forepart of the chambers, the length thereof *was* fifty cubits.", "8": "For the length of the chambers that *were* in the utter court *was* fifty cubits: and, lo, before the temple *were* an hundred cubits.", "9": "And from under these chambers *was* the entry on the east side, as one goeth into them from the utter court.", "10": "The chambers *were* in the thickness of the wall of the court toward the east, over against the separate place, and over against the building.", "11": "And the way before them *was* like the appearance of the chambers which *were* toward the north, as long as they, *and* as broad as they: and all their goings out *were* both according to their fashions, and according to their doors.", "12": "And according to the doors of the chambers that *were* toward the south *was* a door in the head of the way, *even* the way directly before the wall toward the east, as one entereth", "13": "Then said he unto me, The north chambers *and* the south chambers, which *are* before the separate place, they *be* holy chambers, where the priests that approach unto the LORD shall eat the most holy things: there shall they lay the most holy things, and the meat offering, and the sin offering, and the trespass offering; for the place *is* holy.", "14": "When the priests enter therein, then shall they not go out of the holy *place* into the utter court, but there they shall lay their garments wherein they minister; for they *are* holy; and shall put on other garments, and shall approach to *those things* which *are* for the people.", "15": "Now when he had made an end of measuring the inner house, he brought me forth toward the gate whose prospect *is* toward the east, and measured it round about.", "16": "He measured the east side with the measuring reed, five hundred reeds, with the measuring reed round about.", "17": "He measured the north side, five hundred reeds, with the measuring reed round about.", "18": "He measured the south side, five hundred reeds, with the measuring reed.", "19": "He turned about to the west side, *and* measured five hundred reeds with the measuring reed.", "20": "He measured it by the four sides: it had a wall round about, five hundred *reeds* long, and five hundred broad, to make a separation between the sanctuary and the profane place."}}, "tsk": {"1": [{"kopje": "bracht hij", "refs": ["Ezech 40:2", "Ezech 40:3", "Ezech 40:24", "Ezech 41:1"]}, {"kopje": "de buitenste voorhof", "refs": ["Ezech 40:20", "Openb 11:2"]}, {"kopje": "kamers", "refs": ["Ezech 42:13", "Ezech 42:14", "Ezech 42:4", "Ezech 41:9", "Ezech 41:12-15"]}], "2": [{"kopje": "Voor", "refs": ["Ezech 42:2"]}], "3": [{"kopje": "de twintig el", "refs": ["Ezech 41:10"]}, {"kopje": "het plaveisel", "refs": ["Ezech 40:17", "Ezech 40:18", "2 Kron 7:3"]}, {"kopje": "galerij tegen", "refs": ["Ezech 41:15", "Ezech 41:16", "Hoogl 1:17", "Hoogl 7:5"]}], "4": [{"kopje": "een wandelpad", "refs": ["Ezech 42:11"]}, {"kopje": "een weg", "refs": ["Matt 7:14", "Luk 13:24"]}], "5": [{"kopje": "waren nauwer", "refs": ["Ezech 41:7"]}, {"kopje": "dan de onderste en dan de middelste van het gebouw", "refs": ["Ezech 42:6"]}], "8": [{"kopje": "voor aan", "refs": ["Ezech 42:11", "Ezech 42:12", "Ezech 42:8"]}], "9": [{"kopje": "Van onder", "refs": ["Ezech 46:19"]}], "10": [{"kopje": "de breedte", "refs": ["Ezech 41:12"]}, {"kopje": "voor aan", "refs": ["Ezech 42:1", "Ezech 42:13", "Ezech 41:13-15"]}], "12": [{"kopje": "was er een deur", "refs": ["Ezech 42:9"]}], "13": [{"kopje": "dat zijn heilige", "refs": ["Ex 29:31", "Lev 6:14-16", "Lev 6:26", "Lev 7:6", "Lev 10:13", "Lev 10:14", "Lev 10:17", "Lev 24:9", "Num 18:9"]}, {"kopje": "naderen", "refs": ["E huis was omsingeld opwaarts naar boven, rondom het huis heen; daarom was de breedte van het huis naar boven; en zo ging het onderste op naar het bovenste, door het middelste.", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Ezech 48:15": "Maar de vijfduizend, dat is wat overgelaten is in de breedte, voor aan de vijfentwintigduizend, dat zal onheilig zijn, voor de stad, tot bewoning en tot voorsteden; en de stad zal in het midden daarvan zijn.", "Rom 13:14": "Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "Num 18:9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "Num 18:10": "Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.", "Ezech 41:2-5": "En de breedte van de deur, tien ellen, en de zijden van de deur, vijf ellen van deze, en vijf ellen van de andere zijde; ook mat hij de lengte daarvan, veertig ellen, en de breedte twintig ellen. Daarna ging hij naar binnen, en mat de post van de deur, twee ellen; en de deur zes ellen, en de breedte van de deur zeven ellen. Ook mat hij de lengte daarvan, twintig ellen, en de breedte twintig ellen, voor aan de tempel; en hij zei tegen mij: Dit is het allerheiligste.", "Lev 7:6": "Al wie mannelijk is onder de priesters mag dat eten; op de heilige plaats zal het gegeten worden; het is allerheiligst.", "2 Kron 35:5": "En sta in het heiligdom, naar de onderscheiding van de vaderlijke huizen, voor uw broeders, het volk, en naar de afdeling van de vaderlijke huizen van de Levieten;", "Ezech 40:20": "Aangaande de poort die naar het noorden keek, bij de buitenste voorhof: hij mat de lengte ervan en de breedte ervan.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Rom 3:22": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid.", "Ezech 40:18": "Het plaveisel nu lag aan de zijde van de poorten, langs de lengte van de poorten; dit was het lagere plaveisel.", "Num 1:10": "Van de kinderen van Jozef: van Efraïm, Elisama, de zoon van Ammihud; van Manasse, Gamaliël, de zoon van Pedazur.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Lev 8:33-35": "Ook zult u uit de deur van de tent der samenkomst, zeven dagen lang, niet weggaan, tot aan de dag dat de dagen van uw vuloffer vervuld worden; want zeven dagen zal men uw handen vullen. Zoals men gedaan heeft op deze dag, heeft de HEERE geboden te doen, om voor u verzoening te doen. U zult dan bij de deur van de tent der samenkomst blijven, dag en nacht, zeven dagen, en de wacht van de HEERE waarnemen, opdat u niet sterft; want zo is het mij geboden.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Num 1:9": "Van Zebulon, Eliab, de zoon van Helon.", "Lev 10:14": "Ook de beweegborst en de hefschouder moet u eten in een reine plaats, u, en uw zonen, en uw dochters met u; want als uw bescheiden deel, en het bescheiden deel van uw zonen, zijn zij uit de dankoffers van de kinderen van Israël gegeven.", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "Openb 11:1": "En mij werd een rietstok gegeven, een meetroede gelijk; en de engel stond en zei: Sta op, en meet de tempel van God en het altaar, en hen die daarin aanbidden.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Ezech 46:19": "Daarna bracht hij mij door de ingang, die aan de zijkant van de poort was, naar de heilige kamers, die aan de priesters toebehoren, die naar het noorden lagen; en zie, daar was een plaats aan beide zijden, naar het westen.", "Lev 21:22": "Het voedsel van zijn God, van de allerheiligste dingen, en van de heilige dingen, zal hij mogen eten;", "Ex 38:24": "Al het goud dat verwerkt is voor het werk, in het hele werk van het heiligdom, namelijk het goud van het beweegoffer, was negenentwintig talenten en zevenhonderddertig sikkels, naar de sikkel van het heiligdom.", "Lev 10:3": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Ezech 22:26": "Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "Hoogl 7:5": "Uw hoofd op u is als Karmel, en het haar van uw hoofd als purper; de koning is als gebonden op de galerijen.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Luk 16:26": "En boven dit alles, tussen ons en u is een grote kloof gevestigd, zodat wie van hier naar u toe wil overgaan, dat niet zou kunnen, en ook zij die daar zijn, van daar naar ons toe niet kunnen overkomen.", "Ezech 40:2": "In visioenen van God bracht Hij mij naar het land Israël, en Hij zette mij op een zeer hoge berg; en daarop was als een gebouw van een stad, tegen het zuiden.", "Ezech 41:12": "Verder, van het gebouw dat voor aan de afgesneden plaats was, in de hoek van de weg naar het westen, was de breedte zeventig ellen, en van de wand van het gebouw was de breedte vijf ellen rondom heen, en de lengte daarvan negentig ellen.", "Zach 2:1": "Opnieuw hief ik mijn ogen op, en ik zag; en zie, er was een man, en in zijn hand was een meetsnoer.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "Pred 8:10": "Zo heb ik ook gezien dat de goddelozen begraven werden, en degenen die kwamen en uit de heilige plaats gingen, werden vergeten in die stad, waarin zij zo gehandeld hadden. Dit is ook vluchtigheid.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Openb 21:16": "En de stad lag vierkant, en haar lengte was zo groot als haar breedte. En hij mat de stad met de rietstok op twaalfduizend stadiën; de lengte, en de breedte, en de hoogte daarvan waren gelijk.", "Lev 14:13": "Daarna zal hij dat lam slachten op de plaats waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, evenals het zondoffer, is voor de priester; het is allerheiligst.", "Lev 2:10": "En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Lev 10:10": "En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Lev 10:13": "Daarom moet u dat eten in de heilige plaats, omdat het uw bescheiden deel en het bescheiden deel van uw zonen uit de vuuroffers van de HEERE is; want zo is mij geboden.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Lev 8:7": "Daar deed hij hem het onderkleed aan, en gordde hem met de gordel, en trok hem de mantel aan; en deed hij hem de efod aan, en gordde die met de kunstige band van de efod, en bond hem daarmee vast.", "Hoogl 2:9": "Mijn Liefste is gelijk een ree, of een jong van de herten; zie, Hij staat achter onze muur, kijkend uit de vensters, blinkend door de traliën.", "Ezech 41:1": "Verder bracht hij mij tot de tempel; en hij mat de posten, zes ellen de breedte van deze zijde, en zes ellen de breedte van de andere zijde, de breedte van de tent.", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Ezech 44:23": "En zij zullen Mijn volk onderscheid leren tussen het heilige en het onheilige, en hun het onderscheid bekend maken tussen het onreine en het reine.", "Openb 21:15": "En hij die met mij sprak, had een gouden rietstok, opdat hij de stad zou meten, en haar poorten, en haar muur.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Matt 7:14": "Want de poort is nauw, en de weg is smal, die naar het leven leidt, en weinigen zijn er die hem vinden.", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Ezech 40:3-8": "Toen Hij mij daarheen gebracht had, zie, er was een man, wiens verschijning was als de verschijning van koper; en in zijn hand was een linnen snoer en een meetriet; en hij stond in de poort. En die man sprak tot mij: Mensenkind! zie met uw ogen, en hoor met uw oren, en zet uw hart op alles wat ik u zal laten zien; want om u dit te laten zien, bent u hierheen gebracht; verkondig daarna aan het huis van Israël alles wat u ziet. En zie, er was een muur buiten om het huis heen, rondom, en in de hand van de man was een meetriet van zes ellen, elke el een el en een handbreed; en hij mat de breedte van het gebouw: één riet, en de hoogte: één riet.", "Num 16:5": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "Ezech 45:4": "Dat zal een heilige plaats van het land zijn; ze zal zijn voor de priesters die het heiligdom bedienen, die naderen om de HEERE te dienen; en het zal hun een plaats zijn tot huizen, en een heilige plaats voor het heiligdom.", "Hand 6:13": "en zetten valse getuigen in, die zeiden: Deze man houdt niet op lasterlijke woorden te spreken tegen deze heilige plaats en de wet.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Zach 3:4": "Toen antwoordde Hij, en sprak tot hen die voor Zijn aangezicht stonden: Doe deze vuile kleren van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u stellen (extra) kleren aandoen.", "Lev 6:16": "En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Ezech 40:46": "Maar de kamer, waarvan de voorkant de weg naar het noorden ligt, is voor de priesters die de wacht van het altaar waarnemen; dat zijn de kinderen van Zadok, die uit de kinderen van Levi tot de HEERE naderen om Hem te dienen.", "Ezech 40:5": "En zie, er was een muur buiten om het huis heen, rondom, en in de hand van de man was een meetriet van zes ellen, elke el een el en een handbreed; en hij mat de breedte van het gebouw: één riet, en de hoogte: één riet.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Ezech 40:3": "Toen Hij mij daarheen gebracht had, zie, er was een man, wiens verschijning was als de verschijning van koper; en in zijn hand was een linnen snoer en een meetriet; en hij stond in de poort.", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Ex 28:29": "Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Lev 10:17": "Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE.", "Lev 8:13": "Ook liet Mozes de zonen van Aäron naderbij komen, en trok hun onderkleren aan, en gordde hen met een gordel, en bond hun mutsen om, zoals de HEERE Mozes geboden had.", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "Lev 16:2-24": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel. Hiermee zal Aäron het heilige binnengaan: met een jonge stier als zondoffer, en een ram als brandoffer. Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Ezech 41:8": "En ik zag de hoogte van het huis, rondom heen. De fundamenten van de zijkamers waren een vol riet, zes ellen, de el tot aan de oksel toe gerekend.", "Lev 6:29": "Al wie mannelijk is onder de priesters, zal daarvan eten; het is allerheiligst.", "Ezech 44:19": "En als zij naar buiten gaan naar het buitenste voorhof, namelijk naar het buitenste voorhof tot het volk, zullen zij hun kleren waarin zij gediend hebben uittrekken, en die neerleggen in de heilige kamers; en zullen andere kleren aantrekken, opdat zij het volk niet heiligen met hun kleren.", "Ezech 45:1": "Wanneer u dan het land door het lot laat toevallen als erfenis, zult u een hefoffer aan de HEERE brengen, als een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend meetrieten, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn.", "Ezech 48:21": "En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend meetrieten van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.", "Ezech 45:3": "Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Ezra 9:8": "En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "1 Kon 8:8": "Daarna schoven zij de draagstokken verder naar buiten, zodat de uiteinden van de draagstokken gezien werden vanuit het heiligdom, vóór het binnenste heiligdom, maar buiten werden zij niet gezien; en zij zijn daar tot op deze dag.", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "1 Kron 23:32": "En dat zij de wacht van de tent der samenkomst zouden waarnemen, en de wacht van het heiligdom, en de wacht van de zonen van Aäron, hun broeders, in de dienst van het huis van de HEERE.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Ezech 41:9": "De breedte van de wand die tot de zijkamers behoorde naar buiten toe, was vijf ellen; en wat leeg gelaten was, was de plaats van de zijkamers die aan het huis waren.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Luk 9:62": "En Jezus zei tegen hem: Niemand die zijn hand aan de ploeg slaat en achterom kijkt, is geschikt voor het Koninkrijk van God.", "Lev 6:17": "Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.", "Ezech 40:6-16": "Toen kwam hij bij de poort die naar het oosten keek, en hij ging de trappen ervan op, en mat de drempel van de poort: één riet de breedte, en de andere drempel: één riet de breedte. En elk kamertje was één riet de lengte en één riet de breedte; en tussen de kamertjes was vijf ellen; en de drempel van de poort, bij het voorhuis van de poort aan de binnenkant, was één riet. Ook mat hij het voorhuis van de poort aan de binnenkant: één riet.", "Ezech 45:2": "Hiervan zal voor het heiligdom zijn vijfhonderd bij vijfhonderd, vierkant rondom; en het zal vijftig el hebben als buitenruimte rondom.", "Ezech 41:4": "Ook mat hij de lengte daarvan, twintig ellen, en de breedte twintig ellen, voor aan de tempel; en hij zei tegen mij: Dit is het allerheiligste.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Lev 7:1": "Dit is nu de wet van het schuldoffer: het is allerheiligst.", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "Num 18:7": "Maar u, en uw zonen met u, zullen uw priesterambt waarnemen in alle zaken van het altaar, en in wat binnen het voorhangsel is; dat zult u bedienen; uw priesterambt geef Ik u tot een dienst van een geschenk; en de vreemde die nadert, zal gedood worden.", "Lev 6:25": "Spreek tot Aäron en tot zijn zonen en zeg: Dit is de wet van het zondoffer: op de plaats waar het brandoffer geslacht wordt, zal het zondoffer voor het aangezicht van de HEERE geslacht worden; het is allerheiligst.", "Ezech 41:12-15": "Verder, van het gebouw dat voor aan de afgesneden plaats was, in de hoek van de weg naar het westen, was de breedte zeventig ellen, en van de wand van het gebouw was de breedte vijf ellen rondom heen, en de lengte daarvan negentig ellen. Verder mat hij het huis, de lengte honderd ellen; ook de afgesneden plaats en het gebouw, en de wanden daarvan, de lengte honderd ellen. En de breedte van het voorste deel van het huis, en van de afgesneden plaats tegen het oosten, honderd ellen.", "Lev 6:26": "De priester die het voor de zonde offert, zal het eten; in de heilige plaats zal het gegeten worden, in de voorhof van de tent der samenkomst.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Openb 11:2": "En laat het voorhof erbuiten, dat van buiten de tempel is, en meet dat niet, want het is aan de heidenen gegeven; en zij zullen de heilige stad vertrappen, tweeënveertig maanden.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Ex 29:31": "U zult de ram van de vulling nemen, en u zult zijn vlees in de heilige plaats koken.", "Hand 21:28": "En riepen: Israëlitische mannen, kom te hulp! Dit is de man die overal iedereen leert tegen het volk, en de wet, en deze plaats; en bovendien heeft hij ook Grieken de tempel binnengebracht, en heeft deze heilige plaats ontheiligd.", "Ezech 48:20": "Het hele hefoffer zal zijn van vijfentwintigduizend meetrieten, met vijfentwintigduizend; vierkant zult u het heilig hefoffer offeren, met de bezitting van de stad.", "Ezech 41:15": "Ook mat hij de lengte van het gebouw voor aan de afgesneden plaats die daarachter was, en de galerijen daarvan van deze en van de andere zijde, honderd ellen; met de binnenste tempel, en de voorhuizen van de voorhof.", "Ezech 41:10": "En tussen de kamers was een breedte van twintig ellen, rondom het huis, rondom heen.", "Openb 21:12-17": "En zij had een grote en hoge muur, en had twaalf poorten, en bij de poorten twaalf engelen, en namen daarop geschreven, welke zijn de namen van de twaalf geslachten van de kinderen van Israël. Vanuit het oosten waren drie poorten, vanuit het noorden drie poorten, vanuit het zuiden drie poorten, en vanuit het westen drie poorten. En de muur van de stad had twaalf fundamenten, en daarop de namen van de twaalf apostelen van het Lam.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "Gal 3:27": "Want zovelen als u in Christus gedoopt zijt, hebt u Christus aangedaan.", "Ezech 40:17": "Verder bracht hij mij naar de buitenste voorhof, en zie, er waren kamers, en een plaveisel, dat gemaakt was in de voorhof rondom; dertig kamers waren er op het plaveisel.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Ezech 42:16-19": "Hij mat de oostzijde met het meetriet; vijfhonderd rieten, met het meetriet, rondom. Hij mat de noordzijde, vijfhonderd rieten, met het meetriet, rondom. De zuidzijde mat hij, vijfhonderd rieten, met het meetriet.", "Hebr 9:12": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.", "Openb 21:10-27": "En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal. En zij had een grote en hoge muur, en had twaalf poorten, en bij de poorten twaalf engelen, en namen daarop geschreven, welke zijn de namen van de twaalf geslachten van de kinderen van Israël.", "Ezech 40:24": "Daarna leidde hij mij de weg naar het zuiden; en zie, er was een poort de weg naar het zuiden; en hij mat de posten ervan en de voorhuizen ervan, volgens deze maten.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Ex 29:4-9": "Dan zult u Aäron en zijn zonen laten naderen bij de deur van de tent van de samenkomst; en u zult hen met water wassen. Daarna zult u de kleren nemen, en Aäron de rok, en de mantel van de efod, en de efod, en de borstlap laten aandoen; en u zult hem omgorden met de kunstige riem van de efod. En u zult de hoed op zijn hoofd zetten; de kroon van heiligheid zult u aan de hoed zetten.", "Jes 60:18": "Er zal geen geweld meer gehoord worden in uw land, verwoesting noch verbreking in uw gebied; maar uw muren zult u Heil noemen, en uw poorten Lof.", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Neh 13:5": "En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters.", "Lev 2:3": "Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Ps 24:3": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid?", "Ex 28:40-43": "Voor de zonen van Aäron zult u ook rokken maken, en u zult voor hen gordels maken; ook zult u voor hen mutsen maken, tot heerlijkheid en sieraad. En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen. Maak hun ook linnen onderbroeken, om het vlees van de schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.", "Deut 21:5": "Dan zullen de priesters, de kinderen van Levi, toetreden; want de HEERE, uw God, heeft hen uitgekozen om Hem te dienen, en om in de Naam van de HEERE te zegenen, en naar hun oordeel zal elke twist en elke aanklacht worden afgehandeld.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Ezech 41:13-15": "Verder mat hij het huis, de lengte honderd ellen; ook de afgesneden plaats en het gebouw, en de wanden daarvan, de lengte honderd ellen. En de breedte van het voorste deel van het huis, en van de afgesneden plaats tegen het oosten, honderd ellen. Ook mat hij de lengte van het gebouw voor aan de afgesneden plaats die daarachter was, en de galerijen daarvan van deze en van de andere zijde, honderd ellen; met de binnenste tempel, en de voorhuizen van de voorhof.", "Lev 6:14-16": "Dit is nu de wet van het spijsoffer: een van de zonen van Aäron zal dat voor het aangezicht van de HEERE offeren, voor het altaar. En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE. En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Jes 61:10": "Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden.", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Lev 6:14": "Dit is nu de wet van het spijsoffer: een van de zonen van Aäron zal dat voor het aangezicht van de HEERE offeren, voor het altaar.", "Micha 7:11": "Ten dage dat Hij uw muren zal herbouwen, te dien dage zal het besluit ver heengaan.", "Zach 3:5": "Daarom zeg Ik: Laat ze een reine hoed op zijn hoofd zetten. En zij zetten die reine hoed op zijn hoofd, en zij trokken hem kleren aan; en de Engel van de HEERE stond daarbij.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "Lev 24:9": "En het zal voor Aäron en zijn zonen zijn, die het op de heilige plaats zullen eten; want het is voor hem allerheiligst uit de vuuroffers van de HEERE, een eeuwige inzetting.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Hebr 9:25": "ook niet opdat Hij Zichzelf dikwijls zou opofferen, zoals de hogepriester elk jaar het heiligdom binnengaat met vreemd bloed;", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Ezech 41:16": "De dorpels, en de gesloten ve /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
