en; en hij bracht mij tot de kamers, die tegenover de afgesneden plaats, en die tegenover het gebouw tegen het noorden waren.","2":"Voor aan de lengte van de honderd el *naar* de deur van het noorden; en de breedte was vijftig el.","3":"Tegenover de twintig *el*, die de binnenste voorhof had, en tegenover het plaveisel, dat de buitenste voorhof had, *was* galerij tegen galerij, in drie *rijen*.","4":"En voor de kamers was een wandelpad van tien el de breedte; naar binnen toe, *en* een weg van één el; en de deuren daarvan waren tegen het noorden.","5":"De bovenste kamers nu waren nauwer (omdat de galerijen meer wegnamen dan die), dan de onderste en dan de middelste van het gebouw.","6":"Want ze waren wel van drie *rijen*, maar hadden geen pilaren zoals de pilaren van de voorhoven; daarom waren ze smaller dan de onderste en dan de middelste, van de grond af.","7":"De muur nu, die naar buiten tegenover de kamers was, de weg naar de buitenste voorhof, voor aan de kamers, de lengte daarvan was vijftig el.","8":"Want de lengte van de kamers, die de buitenste voorhof had, was vijftig el; en zie, voor aan de tempel waren honderd el.","9":"Van onder deze kamers nu was de ingang van het oosten, zoals iemand daarin ingaat, vanuit de buitenste voorhof.","10":"Aan de breedte van de muur van de voorhof, de weg naar het oosten, voor aan de afgesneden plaats, en voor aan het gebouw, waren kamers.","11":"En de weg voor die kamers langs was net zo van uiterlijk als de kamers, die de weg naar het noorden waren, naar hun lengte, zo ook *naar* hun breedte; en al hun uitgangen waren ook naar hun manier van inrichting en naar hun deuren.","12":"En net als de deuren van de kamers, die de weg naar het zuiden waren, was er een deur aan het begin van de weg, de weg voor aan de rechte muur, de weg naar het oosten, zoals men daar ingaat.","13":"Toen zei hij tegen mij: De kamers van het noorden, *en* de kamers van het zuiden, die voor aan de afgesneden plaats zijn, dat zijn heilige kamers, waarin de priesters, die tot de HEERE naderen, de allerheiligste dingen zullen eten; daar zullen zij de allerheiligste dingen neerleggen, en het spijsoffer, en het zondoffer, en het schuldoffer, want de plaats is heilig.","14":"Als de priesters ingegaan zullen zijn, dan zullen zij uit het heiligdom niet weer uitgaan naar de buitenste voorhof, maar daar hun kleren neerleggen, waarin zij gediend hebben, want die zijn heilig; en zij zullen andere kleren aantrekken, en naderen tot wat voor het volk is.","15":"Toen hij nu de maten van het binnenste huis geëindigd had, bracht hij mij naar buiten, de weg naar de poort, die de weg naar het oosten uitzag, en hij mat het rondom.","16":"Hij mat de oostzijde met het meetriet; vijfhonderd rieten, met het meetriet, rondom.","17":"Hij mat de noordzijde, vijfhonderd rieten, met het meetriet, rondom.","18":"De zuidzijde mat hij, vijfhonderd rieten, met het meetriet.","19":"Hij ging om naar de westzijde, *en* hij mat vijfhonderd rieten, met het meetriet.","20":"Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd *rieten*, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige."},"SV":{"1":"Daarna bracht hij mij uit tot het buitenste voorhof; den weg naar den weg van het noorden; en hij bracht mij tot de kameren, die tegenover de afgesneden plaats, en die tegenover het gebouw tegen het noorden waren:","2":"Voor aan de lengte van de honderd ellen *naar* de deur van het noorden; en de breedte was vijftig ellen.","3":"Tegenover de twintig *ellen*, die het binnenste voorhof had, en tegenover het plaveisel, dat het buitenste voorhof had, *was* galerij tegen galerij, in drie *rijen*.","4":"En voor de kameren was een wandeling van tien ellen de breedte; naar binnen toe, *en* een weg van een el; en de deuren van dezelve waren tegen het noorden.","5":"De bovenste kameren nu waren nauwer (omdat de galerijen hoger waren dan dezelve), dan de onderste en dan de middelste des gebouws.","6":"Want zij waren wel van drie *rijen*, maar hadden geen pilaren gelijk de pilaren der voorhoven; daarom waren zij benauwder dan de onderste en dan de middelste van de aarde af.","7":"De muur nu, die naar buiten tegenover de kameren was, den weg naar het buitenste voorhof, voor aan de kameren, de lengte van dien was vijftig ellen.","8":"Want de lengte der kameren, die het buitenste voorhof had, was vijftig ellen; en ziet, voor aan den tempel waren honderd ellen.","9":"Van onder deze kameren nu was de ingang van het oosten, als iemand tot dezelve ingaat, uit het buitenste voorhof.","10":"Aan de breedte van den muur des voorhofs, den weg naar het oosten, voor aan de afgesneden plaats, en voor aan het gebouw, waren kameren.","11":"En de weg voor dezelve henen was als de gedaante der kameren, die den weg naar het noorden waren, naar derzelver lengte, alzo *naar* derzelver breedte; en al haar uitgangen waren ook naar derzelver wijzen en naar derzelver deuren.","12":"En gelijk de deuren der kameren, die den weg naar het zuiden waren, was er een deur in het hoofd van den weg, den weg voor aan den rechten muur, den weg naar het oosten, als men daar ingaat.","13":"Toen zeide hij tot mij: De kameren van het noorden, *en* de kameren van het zuiden, die voor aan de afgesneden plaats zijn, dat zijn heilige kameren, waarin de priesters, die tot den HEERE naderen, die allerheiligste dingen zullen eten; aldaar zullen zij de allerheiligste dingen henenleggen, en het spijsoffer, en het zondoffer, en het schuldoffer, want de plaats is heilig.","14":"Als de priesters ingegaan zullen zijn, zo zullen zij uit het heiligdom niet *weder* uitgaan in het buitenste voorhof, maar aldaar hun klederen henenleggen, in dewelke zij gediend hebben, want die zijn een heiligheid; en zij zullen andere klederen aantrekken , en naderen tot hetgeen voor het volk is.","15":"Als hij nu de maten van het binnenste huis geëindigd had, zo bracht hij mij uit, den weg naar de poort, die den weg naar het oosten zag, en hij mat ze rondom henen.","16":"Hij mat de oostzijde met het meetriet; vijfhonderd rieten, met het meetriet, rondom.","17":"Hij mat de noordzijde, vijfhonderd rieten, met het meetriet, rondom.","18":"De zuidzijde mat hij, vijfhonderd rieten, met het meetriet.","19":"Hij ging om naar de westzijde, *en* hij mat vijfhonderd rieten, met het meetriet.","20":"Hij mat het aan de vier zijden; het had een muur rondom henen, de lengte was vijfhonderd *rieten*, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en onheilige."},"KJV":{"1":"Then he brought me forth into the utter court, the way toward the north: and he brought me into the chamber that *was* over against the separate place, and which *was* before the building toward the north.","2":"Before the length of an hundred cubits *was* the north door, and the breadth *was* fifty cubits.","3":"Over against the twenty *cubits* which *were* for the inner court, and over against the pavement which *was* for the utter court, *was* gallery against gallery in three","4":"And before the chambers *was* a walk of ten cubits breadth inward, a way of one cubit; and their doors toward the north.","5":"Now the upper chambers *were* shorter: for the galleries were higher than these, than the lower, and than the middlemost of the building.","6":"For they *were* in three *stories*, but had not pillars as the pillars of the courts: therefore *the building* was straitened more than the lowest and the middlemost from the ground.","7":"And the wall that *was* without over against the chambers, toward the utter court on the forepart of the chambers, the length thereof *was* fifty cubits.","8":"For the length of the chambers that *were* in the utter court *was* fifty cubits: and, lo, before the temple *were* an hundred cubits.","9":"And from under these chambers *was* the entry on the east side, as one goeth into them from the utter court.","10":"The chambers *were* in the thickness of the wall of the court toward the east, over against the separate place, and over against the building.","11":"And the way before them *was* like the appearance of the chambers which *were* toward the north, as long as they, *and* as broad as they: and all their goings out *were* both according to their fashions, and according to their doors.","12":"And according to the doors of the chambers that *were* toward the south *was* a door in the head of the way, *even* the way directly before the wall toward the east, as one entereth","13":"Then said he unto me, The north chambers *and* the south chambers, which *are* before the separate place, they *be* holy chambers, where the priests that approach unto the LORD shall eat the most holy things: there shall they lay the most holy things, and the meat offering, and the sin offering, and the trespass offering; for the place *is* holy.","14":"When the priests enter therein, then shall they not go out of the holy *place* into the utter court, but there they shall lay their garments wherein they minister; for they *are* holy; and shall put on other garments, and shall approach to *those things* which *are* for the people.","15":"Now when he had made an end of measuring the inner house, he brought me forth toward the gate whose prospect *is* toward the east, and measured it round about.","16":"He measured the east side with the measuring reed, five hundred reeds, with the measuring reed round about.","17":"He measured the north side, five hundred reeds, with the measuring reed round about.","18":"He measured the south side, five hundred reeds, with the measuring reed.","19":"He turned about to the west side, *and* measured five hundred reeds with the measuring reed.","20":"He measured it by the four sides: it had a wall round about, five hundred *reeds* long, and five hundred broad, to make a separation between the sanctuary and the profane place."}},"tsk":{"1":[{"kopje":"bracht hij","refs":["Ezech 40:2","Ezech 40:3","Ezech 40:24","Ezech 41:1"]},{"kopje":"de buitens function refUrl(ref) {

  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {

        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
