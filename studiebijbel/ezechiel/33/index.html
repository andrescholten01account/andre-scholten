<style>

  /* verzen — tabsmodus (één kolom) */

  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }

  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

kinderen van uw volk, en zeg tegen hen: Wanneer Ik het zwaard over een land breng, en het volk van het land een man uit hun gebied neemt en hem voor zichzelf tot een wachter stelt;","3":"En hij het zwaard over het land ziet komen, en op de bazuin blaast en het volk waarschuwt;","4":"En iemand het geluid van de bazuin hoort, *wel* hoort, maar zich niet laat waarschuwen, en het zwaard komt en neemt hem weg, dan is zijn bloed op zijn eigen hoofd.","5":"Hij hoorde het geluid van de bazuin, maar liet zich niet waarschuwen, zijn bloed is op hem; maar wie zich laat waarschuwen, behoudt zijn leven.","6":"Wanneer daarentegen de wachter het zwaard ziet komen, en niet op de bazuin blaast, zodat het volk niet gewaarschuwd wordt; en het zwaard komt en neemt iemand van hen weg, dan is die *wel* om zijn eigen ongerechtigheid weggenomen, maar zijn bloed zal Ik van de hand van de wachter eisen.","7":"U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen.","8":"Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.","9":"Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.","10":"Daarom, mensenkind! Zeg tegen het huis van Israël: U spreekt zo en zegt: Omdat onze overtredingen en onze zonden op ons zijn, en wij daarin wegkwijnen, hoe zouden wij dan leven?","11":"Zeg tegen hen: *Zo waarachtig als* Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?","12":"U dan, o mensenkind! Zeg tegen de kinderen van uw volk: De gerechtigheid van de rechtvaardige zal hem niet redden op de dag van zijn overtreding; en wat de goddeloosheid van de goddeloze betreft, hij zal er niet om vallen op de dag dat hij zich van zijn goddeloosheid bekeert; en de rechtvaardige zal niet kunnen leven door *zijn gerechtigheid*, op de dag dat hij zondigt.","13":"Als Ik tegen de rechtvaardige zeg dat hij zeker zal leven, en hij op zijn gerechtigheid vertrouwt en onrecht doet, dan zal aan al zijn gerechtigheden niet meer gedacht worden, maar in zijn onrecht, dat hij doet, daarin zal hij sterven.","14":"Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet;","15":"Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.","16":"Aan al zijn zonden die hij gezondigd heeft, zal niet meer gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zeker leven.","17":"Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is.","18":"Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven.","19":"En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.","20":"Toch zegt u: De weg van de Heere is niet recht; Ik zal u richten, ieder naar zijn wegen, o huis van Israël!","21":"En het gebeurde in het twaalfde jaar van onze wegvoering, in de tiende maand, op de vijfde dag van de maand, dat er iemand tot mij kwam die uit Jeruzalem ontkomen was, en hij zei: De stad is ingenomen.","22":"Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.","23":"Toen kwam het woord van de HEERE tot mij:","24":"Mensenkind! De inwoners van die verwoeste plaatsen in het land van Israël zeggen: Abraham was maar één man, en bezat dit land erfelijk; maar wij zijn met velen; het land is ons gegeven tot erfelijk bezit.","25":"Daarom, zeg tegen hen: Zo zegt de Heere HEERE: U eet *vlees* met het bloed, en heft uw ogen op naar uw drekgoden, en vergiet bloed; en zou u het land dan erfelijk bezitten?","26":"U vertrouwt op uw zwaard; u doet gruwelijke dingen, en ieder van u verontreinigt de vrouw van zijn naaste; en zou u het land dan erfelijk bezitten?","27":"Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: *Zo waarachtig als* Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!","28":"Want Ik zal het land tot een verwoesting en een schrik maken, en aan de trots van zijn kracht zal een einde komen; en de bergen van Israël zullen woest zijn, zodat niemand er meer doorheen trekt.","29":"Dan zullen zij weten dat Ik de HEERE ben, wanneer Ik het land tot een verwoesting en een schrik gemaakt heb, om al hun gruwelen die zij gedaan hebben.","30":"En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.","31":"En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht *als* Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, *maar* hun hart gaat hun hebzucht na.","32":"En zie, u bent voor hen als een liefdeslied, *als* iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.","33":"Maar wanneer dat komt (zie, het zal komen!) dan zullen zij weten dat er een profeet in hun midden geweest is."},"SV":{"1":"En des HEEREN woord geschiedde tot mij, zeggende:","2":"Mensenkind! spreek tot de kinderen uws volks, en zeg tot hen: Wanneer Ik het zwaard over enig land breng, en het volk des lands een man uit hun einden nemen, en dien voor zich tot een wachter stellen;","3":"En hij het zwaard ziet komen over het land, en blaast met de bazuin, en waarschuwt het volk;","4":"En een, die het geluid der bazuin hoort, *wel* hoort, maar zich niet laat waarschuwen; en het zwaard komt, en neemt hem weg, diens bloed is op zijn hoofd.","5":"Hij hoorde het geluid der bazuin, maar liet zich niet waarschuwen, zijn bloed is op hem; maar hij, die zich laat waarschuwen, behoudt zijn ziel.","6":"Wanneer daarentegen de wachter het zwaard ziet komen, en blaast niet met de bazuin, zodat het volk niet is gewaarschuwd; en het zwaard komt, en neemt een ziel uit hen weg; die is *wel* in zijn ongerechtigheid weggenomen, maar zijn bloed zal Ik van des hand des wachters eisen.","7":"Gij nu, o mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult gij het woord uit Mijn mond horen, en hen van Mijnentwege waarschuwen.","8":"Als Ik tot den goddeloze zeg: O goddeloze, gij zult den dood sterven! en gij spreekt niet, om den goddeloze van zijn weg af te manen; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.","9":"Maar als gij den goddeloze van zijn weg afmaant, dat hij zich van dien bekere, en hij zich van zijn weg niet bekeert, zo zal hij in zijn ongerechtigheid sterven; maar gij hebt uw ziel bevrijd.","10":"Daarom, gij mensenkind! zeg tot het huis Israëls: Gijlieden spreekt aldus, zeggende: Dewijl onze overtredingen en onze zonden op ons zijn, en wij in dezelve versmachten, hoe zouden wij dan leven?","11":"Zeg tot hen: *Zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zo Ik lust heb in den dood des goddelozen! maar daarin *heb* *Ik* *lust*, dat de goddeloze zich bekere van zijn weg en leve. Bekeert u, bekeert u van uw boze wegen, want waarom zoudt gij sterven, o huis Israëls?","12":"Gij dan, o mensenkind! zeg tot de kinderen uws volks: De gerechtigheid des rechtvaardigen zal hem niet redden ten dage zijner overtreding; en aangaande de goddeloosheid des goddelozen, hij zal om dezelve niet vallen, ten dage als hij zich van zijn goddeloosheid bekeert; en de rechtvaardige zal niet kunnen leven door dezelve *zijn* *gerechtigheid*, ten dage als hij zondigt.","13":"Als Ik tot den rechtvaardige zeg, dat hij zekerlijk leven zal, en hij op zijn gerechtigheid vertrouwt, en onrecht doet, zo zullen al zijn gerechtigheden niet gedacht worden, maar in zijn onrecht, dat hij doet, daarin zal hij sterven.","14":"Als Ik ook tot den goddeloze zeg: Gij zult den dood sterven! en hij zich van zijn zonde bekeert, en recht en gerechtigheid doet;","15":"Geeft de goddeloze het pand weder, betaalt hij het geroofde, wandelt hij in de inzettingen des levens, zodat hij geen onrecht doet; hij zal zekerlijk leven, hij zal niet sterven.","16":"Al zijn zonden, die hij gezondigd heeft, zullen hem niet gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zekerlijk leven.","17":"Nog zeggen de kinderen uws volks: De weg des Heeren is niet recht; daar toch hun eigen weg niet recht is.","18":"Als de rechtvaardige afkeert van zijn gerechtigheid, en doet onrecht, zo zal hij daarin sterven.","19":"En als de goddeloze zich bekeert van zijn goddeloosheid, en doet recht en gerechtigheid, zo zal hij daarin leven.","20":"Nog zegt gij: De weg des Heeren is niet recht; Ik zal ulieden richten, een ieder naar zijn wegen, o huis Israëls!","21":"En het geschiedde in het twaalfde jaar onzer gevankelijke wegvoering, in de tiende *maand*, op den vijfden der maand, *dat* *er* een tot mij kwam, die van Jeruzalem ontkomen was, zeggende: De stad is geslagen.","22":"Nu was de hand des HEEREN op mij geweest des avonds, eer die ontkomene kwam, en had mijn mond opengedaan, totdat hij des morgens tot mij kwam. Alzo werd mijn mond opengedaan, en ik was niet meer stom.","23":"Toen geschiedde des HEEREN woord tot mij, zeggende:","24":"Mensenkind! de inwoners van die woeste plaatsen in het land Israëls spreken, zeggende: Abraham was een enig *man*, en bezat dit land erfelijk; maar onzer zijn velen; het land is ons gegeven tot een erfelijke bezitting.","25":"Daarom zeg tot hen: Zo zegt de Heere HEERE: Gij eet *vlees* met het bloed, en heft uw ogen op tot uw drekgoden, en vergiet bloed; en zoudt gij het land erfelijk bezitten?","26":"Gij staat op ulieder zwaard; gij doet gruwel, en verontreinigt, een ieder de huisvrouw zijns naasten; en zoudt gij het land erfelijk bezitten?","27":"Alzo zult gij tot hen zeggen: De Heere HEERE zegt alzo: *Zo* *waarachtig* *als* Ik leef, indien niet, die in die woeste plaatsen zijn, door het zwaard zullen vallen, en *zo* Ik *niet* dien, die in het open veld is, het wild gedierte overgeve, dat het hem vrete, en die in de vestingen en in de spelonken zijn, door de pestilentie zullen sterven!","28":"Want Ik zal het land *tot* een verwoesting en een schrik stellen, en de hovaardij zijner sterkte zal ophouden; en de bergen Israëls zullen woest zijn, dat er niemand overga.","29":"Dan zullen zij weten, dat Ik de HEERE ben, als Ik het land *tot* een verwoesting en een schrik zal gesteld hebben, om al hun gruwelen, die zij gedaan hebben.","30":"En gij, o mensenkind! de kinderen uws volks spreken steeds van u bij de wanden en in de deuren der huizen; en de een spreekt met den ander, een iegelijk met zijn broeder, zeggende: Komt toch en hoort, wat het woord zij, dat van den HEERE voortkomt.","31":"En zij komen tot u, gelijk het volk pleegt te komen, en zitten voor uw aangezicht *als* Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij maken liefkozingen met hun mond, *maar* hun hart wandelt hun gierigheid na.","32":"En ziet, gij zijt hun als een lied der minnen, *als* een, die schoon van stem is, of die wel speelt; daarom horen zij uw woorden, maar zij doen ze niet.","33":"Maar als dat komt (zie, het zal komen!) dan zullen zij weten, dat er een profeet in het midden van hen geweest is."},"KJV":{"1":"Again the word of the LORD came unto me, saying,","2":"Son of man, speak to the children of thy people, and say unto them, When I bring the sword upon a land, if the people of the land take a man of their coasts, and set him for their watchman:","3":"If when he seeth the sword come upon the land, he blow the trumpet, and warn the people;","4":"Then whosoever heareth the sound of the trumpet, and taketh not warning; if the sword come, and take him away, his blood shall be upon his own head.","5":"He heard the sound of the trumpet, and took not warning; his blood shall be upon him. But he that taketh warning shall deliver his soul.","6":"But if the watchman see the sword come, and blow not the trumpet, and the people be not warned; if the sword come, and take *any* person from among them, he is taken away in his iniquity; but his blood will I require at the watchman's hand.","7":"So thou, O son of man, I have set thee a watchman unto the house of Israel; therefore thou shalt hear the word at my mouth, and warn","8":"When I say unto the wicked, O wicked *man*, thou shalt surely die; if thou dost not speak to warn the wicked from his way, that wicked *man* shall die in his iniquity; but his blood will I require at thine hand.","9":"Nevertheless, if thou warn the wicked of his way to turn from it; if he do not turn from his way, he shall die in his iniquity; but thou hast delivered thy soul.","10":"Therefore, O thou son of man, speak unto the house of Israel; Thus ye speak, saying, If our transgressions and our sins *be* upon us, and we pine away in them, how should we then live?","11":"Say unto them, *As* I live, saith the Lord GOD, I have no pleasure in the death of the wicked; but that the wicked turn from his way and live: turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?","12":"Therefore, thou son of man, say unto the children of thy people, The righteousness of the righteous shall not deliver him in the day of his transgression: as for the wickedness of the wicked, he shall not fall thereby in the day that he turneth from his wickedness; neither shall the righteous be able to live for his *righteousness* in the day that he sinneth.","13":"When I shall say to the righteous, *that* he shall surely live; if he trust to his own righteousness, and commit iniquity, all his righteousnesses shall not be remembered; but for his iniquity that he hath committed, he shall die","14":"Again, when I say unto the wicked, Thou shalt surely die; if he turn from his sin, and do that which is lawful and right;","15":"*If* the wicked restore the pledge, give again that he had robbed, walk in the statutes of life, without committing iniquity; he shall surely live, he shall not die.","16":"None of his sins that he hath committed shall be mentioned unto him: he hath done that which is lawful and right; he shall surely live.","17":"Yet the children of thy people say, The way of the Lord is not equal: but as for them, their way is not equal.","18":"When the righteous turneth from his righteousness, and committeth iniquity, he shall even die","19":"But if the wicked turn from his wickedness, and do that which is lawful and right, he shall live","20":"Yet ye say, The way of the Lord is not equal. O ye house of Israel, I will judge you every one after his ways.","21":"And it came to pass in the twelfth year of our captivity, in the tenth *month*, in the fifth *day* of the month, *that* one that had escaped out of Jerusalem came unto me, saying, The city is smitten.","22":"Now the hand of the LORD was upon me in the evening, afore he that was escaped came; and had opened my mouth, until he came to me in the morning; and my mouth was opened, and I was no more dumb.","23":"Then the word of the LORD came unto me, saying,","24":"Son of man, they that inhabit those wastes of the land of Israel speak, saying, Abraham was one, and he inherited the land: but we *are* many; the land is given us for inheritance.","25":"Wherefore say unto them, Thus saith the Lord GOD; Ye eat with the blood, and lift up your eyes toward your idols, and shed blood: and shall ye possess the land?","26":"Ye stand upon your sword, ye work abomination, and ye defile every one his neighbour's wife: and shall ye possess the land?","27":"Say thou thus unto them, Thus saith the Lord GOD; *As* I live, surely they that *are* in the wastes shall fall by the sword, and him that *is* in the open field will I give to the beasts to be devoured, and they that *be* in the forts and in the caves shall die of the pestilence.","28":"For I will lay the land most desolate, and the pomp of her strength shall cease; and the mountains of Israel shall be desolate, that none shall pass through.","29":"Then shall they know that I *am* the LORD, when I have laid the land most desolate because of all their abominations which they have committed.","30":"Also, thou son of man, the children of thy people still are talking against thee by the walls and in the doors of the houses, and speak one to another, every one to his brother, saying, Come, I pray you, and hear what is the word that cometh forth from the LORD.","31":"And they come unto thee as the people cometh, and they sit before thee *as* my people, and they hear thy words, but they will not do them: for with their mouth they shew much love, *but* their heart goeth after their covetousness.","32":"And, lo, thou *art* unto them as a very lovely song of one that hath a pleasant voice, and can play well on an instrument: for they hear thy words, but they do","33":"And when this cometh to pass, (lo, it will come,) then shall they know that a prophet hath been among"}},"tsk":{"2":[{"kopje":"Spreek","refs":["Ezech 33:17","Ezech 33:30","Ezech 3:11","Ezech 3:27"]},{"kopje":"Wanneer Ik het zwaard over een land breng","refs":["Ezech 6:3","Ezech 11:8","Ezech 14:17","Ezech 14:21","Ezech 21:9-16","Lev 26:2 jv\" data-code=\"H2094\">warning;</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be upon him. But he that taketh <span class=\"wl wl-kjv\" data-code=\"H2094\">warning</span> shall <span class=\"wl wl-kjv\" data-code=\"H4422\">deliver</span> his soul.","6":"But if the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> not the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> be not <span class=\"wl wl-kjv\" data-code=\"H2094\">warned;</span> if the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> any <span class=\"wl wl-kjv\" data-code=\"H5315\">person</span> from among them, he is taken <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> in his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> but his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> will I <span class=\"wl wl-kjv\" data-code=\"H1875\">require</span> at the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman's</span> hand.","7":"So thou, O <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thee a <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> therefore thou shalt <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> at my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and warn","8":"When I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> O <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> man, thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> if thou dost not <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> to <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> from his <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> man shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> but his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> will I <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> at thine hand.","9":"Nevertheless, if thou <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> of his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from it; if he do not <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from his <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> but thou hast <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> thy soul.","10":"Therefore, O thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> Thus ye <span class=\"wl wl-kjv\" data-code=\"H559\">speak,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If our <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> and our <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> be upon us, and we pine <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> in them, how should we then live?","11":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> unto them, As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> I have no <span class=\"wl wl-kjv\" data-code=\"H2654\">pleasure</span> in the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked;</span> but that the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> and <span class=\"wl wl-kjv\" data-code=\"H2421\">live:</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> ye, <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> ye from your <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">ways;</span> for why will ye <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel?","12":"Therefore, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> The <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> shall not <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> him in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression:</span> as for the <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> he shall not <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> thereby in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H7725\">turneth</span> from his <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness;</span> neither shall the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> for his righteousness in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he sinneth.","13":"When I shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous,</span> that he shall <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live;</span> if he <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> to his own <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> all his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousnesses</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered;</span> but for his <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">committed,</span> he shall die","14":"Again, when I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> if he <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which is <span class=\"wl wl-kjv\" data-code=\"H4941\">lawful</span> and right;","15":"If the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> the <span class=\"wl wl-kjv\" data-code=\"H2258\">pledge,</span> give <span class=\"wl wl-kjv\" data-code=\"H7999\">again</span> that he had <span class=\"wl wl-kjv\" data-code=\"H1500\">robbed,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> in the <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> without <span class=\"wl wl-kjv\" data-code=\"H6213\">committing</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> he shall not die.","16":"None of his <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H2398\">committed</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2142\">mentioned</span> unto him: he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which is <span class=\"wl wl-kjv\" data-code=\"H4941\">lawful</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">right;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> live.","17":"Yet the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> is not <span class=\"wl wl-kjv\" data-code=\"H8505\">equal:</span> but as for them, their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> is not equal.","18":"When the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turneth</span> from his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">committeth</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> he shall even die","19":"But if the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from his <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which is <span class=\"wl wl-kjv\" data-code=\"H4941\">lawful</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">right,</span> he shall live","20":"Yet ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> is not <span class=\"wl wl-kjv\" data-code=\"H8505\">equal.</span> O ye <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> I will <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> you every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> after his ways.","21":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of our <span class=\"wl wl-kjv\" data-code=\"H1546\">captivity,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth</span> month, in the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that one that had <span class=\"wl wl-kjv\" data-code=\"H6412\">escaped</span> out of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> is smitten.","22":"Now the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was upon me in the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">afore</span> he that was <span class=\"wl wl-kjv\" data-code=\"H6412\">escaped</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came;</span> and had <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> until he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to me in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning;</span> and my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> was <span class=\"wl wl-kjv\" data-code=\"H6605\">opened,</span> and I was no more dumb.","23":"Then the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","24":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> they that <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabit</span> those <span class=\"wl wl-kjv\" data-code=\"H2723\">wastes</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">speak,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> was <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3423\">inherited</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> but we are <span class=\"wl wl-kjv\" data-code=\"H7227\">many;</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> us for inheritance.","25":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> toward your <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> and <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> and shall ye <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the land?","26":"Ye <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> upon your <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> ye <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> and shall ye <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the land?","27":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> thou thus unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> surely they that are in the <span class=\"wl wl-kjv\" data-code=\"H2723\">wastes</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and him that is in the <span class=\"wl wl-kjv\" data-code=\"H6440\">open</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> to be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured,</span> and they that be in the <span class=\"wl wl-kjv\" data-code=\"H4679\">forts</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4631\">caves</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> of the pestilence.","28":"For I will <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H4923\">most</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1347\">pomp</span> of her <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> shall <span class=\"wl wl-kjv\" data-code=\"H7673\">cease;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> that none shall pass through.","29":"Then shall they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when I have <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H4923\">most</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> because of all their <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> which they have committed.","30":"Also, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> still are <span class=\"wl wl-kjv\" data-code=\"H1696\">talking</span> <span class=\"wl wl-kjv\" data-code=\"H681\">against</span> thee by the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls</span> and in the <span class=\"wl wl-kjv\" data-code=\"H6607\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H2297\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">another,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Come,</span> I pray you, and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> what is the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from the LORD.","31":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee as the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3996\">cometh,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee as my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thy <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> but they will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them: for with their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> they <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> much <span class=\"wl wl-kjv\" data-code=\"H5690\">love,</span> but their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their covetousness.","32":"And, lo, thou art unto them as a very <span class=\"wl wl-kjv\" data-code=\"H5690\">lovely</span> <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> of one that hath a <span class=\"wl wl-kjv\" data-code=\"H3303\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and can play <span class=\"wl wl-kjv\" data-code=\"H2895\">well</span> on an <span class=\"wl wl-kjv\" data-code=\"H5059\">instrument:</span> for they <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thy <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> but they do","33":"And when this cometh to <span class=\"wl wl-kjv\" data-code=\"H935\">pass,</span> (lo, it will <span class=\"wl wl-kjv\" data-code=\"H935\">come,)</span> then shall they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> hath been among"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"kinderen uws volks,","tekst":"Zie boven Eze 3:11 ."},{"catchword":"Wanneer Ik","tekst":"Hebreeuws, een land, wanneer Ik het zwaar over, tegen, of in hetzelve zal brengen."},{"catchword":"zwaard over enig land breng,","tekst":"Dat is, oorlog, vijandelijken inval, met den aankleve van dien, door mijn rechtvaardig oordeel toeschik."},{"catchword":"einden nemen,","tekst":"Dat is, slechtelijk zoveel als uit, of onder hen, of uit hunne frontieren, uiterste grenzen, waar de wachter gemeenlijk gesteld worden om op alle aankomsten te letten. Zie verscheiden gebruik dezer manier van spreken Gen 47:2 ; Jdg 18:2 ; 1Ki 12:31 ; idem Gen 19:4 ; Isa 56:11 , in de aantekening."}],"3":[{"catchword":"komen over het land,","tekst":"Hebreeuws, komende."}],"4":[{"catchword":"op zijn hoofd","tekst":"Dat is, hij is de oorzaak en draagt de schuld van zijn eigen verderf. Vergelijk Lev 20:9 , met de aantekening, en zo in het volgende."}],"5":[{"catchword":"ziel","tekst":"Dat is, leven, of persoon, zichzelven. Zie Gen 12:5 , en Gen 19:17 , met de aantekening."}],"6":[{"catchword":"ziel uit hen weg;","tekst":"Dat is, een persoon, of iemand, gelijk boven."},{"catchword":"die is wel","tekst":"Ik heb hem wel door mijn verborgen regering deze straf rechtvaardig toegeschikt, maar dat zal den trouwelozen wachter niet ontschuldigen."},{"catchword":"bloed zal Ik","tekst":"Gelijk boven Eze 3:18 ."}],"7":[{"catchword":"Ik heb u tot een wachter gesteld","tekst":"Vergelijk deze plaats met boven Eze 3:17 , enz. en zie de aantekening aldaar."}],"8":[{"catchword":"eisen","tekst":"Of, zoeken."}],"10":[{"catchword":"op ons zijn,","tekst":"Dat is, wij dragen de straffen van dien; vergelijk boven Eze 32:27 ; zie Lev 5:1 ."},{"catchword":"versmachten,","tekst":"Volgens Gods dreigementen; vergelijk boven Eze 24:23 ; zie aldaar."},{"catchword":"leven?","tekst":"Gelijk Gij ons belooft, maar [willen zij zeggen] wij bevinden het tegendeel inderdaad; alzo murmureerden zij over Gods plagen, zonder te letten op hunne bekering, waarop de beloften van het leven gingen."}],"11":[{"catchword":"zo Ik lust heb","tekst":"Een afgebroken rede in het eedzweren gebruikelijk; zie Num 14:23 ."},{"catchword":"dood des goddelozen","tekst":"Gelijk gij meent en klaagt dat Ik belust ben om u te doden, ofschoon gij u van uwe boosheid bekeerdet, alsof het evenveel bij mij is of gij u bekeert of niet, hoe gij het ook maakt, wel of kwalijk, gij moet er evenzeer aan, gelijk goddelozen murmureerders en huichelaars plegen te spreken; vergelijk boven Eze 18:23 , met de aantekening."},{"catchword":"Bekeert u, bekeert u van uw boze wegen,","tekst":"Dat is de zaak [wil God zeggen] daar schort het u, dat gij al in uwe goddeloosheid blijft, en evenwel tegen mijne plagen murmureert, in plaats dat gij u moest bekeren."},{"catchword":"waarom zoudt gij sterven, o huis Israëls?","tekst":"Alsof God zeide: Hoe blijft gij zo dwaas, dat gij uw eigen verderf u op den hals haalt door uwe onbekeerlijkheid? Zo gij zo wilt voortgaan, kan u toch niets anders overkomen dan dat gij in uwe verkeerdheid moet sterven en bederven. Bedenkt dit toch eens terdege, tot uw eigen best."}],"12":[{"catchword":"rechtvaardigen","tekst":"Zie boven Eze 3:20 , en Eze 18:24 , met de aantekening."},{"catchword":"hem niet redden","tekst":"Den voorzegden genoemden en gehouden rechtvaardige."},{"catchword":"overtreding;","tekst":"Of, zijns afvals."},{"catchword":"vallen,","tekst":"Dat is, omkomen door mijne straffen, waarvan hier eigenlijk gesproken wordt; zie Gen 14:10 ."},{"catchword":"Gerechtigheid","tekst":"] Vermeld vs.12."}],"13":[{"catchword":"zekerlijk leven zal,","tekst":"Hebreeuws, levende leven; onder voorwaarde van oprechtheid en volharding tot het einde."}],"14":[{"catchword":"den dood sterven","tekst":"Hebreeuws, stervende sterven; zo gij u niet bekeert."}],"15":[{"catchword":"pand weder,","tekst":"Gelijk boven Eze 18:7 ."},{"catchword":"betaalt hij het geroofde,","tekst":"Zie Exo 22:1 , Exo 22:4 ; Lev 6:2 , Lev 6:4 ; Num 5:6-7 ."},{"catchword":"zekerlijk leven,","tekst":"Hebreeuws, levende leven. Alzo in vs.16."}],"16":[{"catchword":"hem niet gedacht worden;","tekst":"Zie Psa 79:8 ."}],"17":[{"catchword":"Nog zeggen de kinderen uws volks","tekst":"Vergelijk boven Eze 18:25 , met de aantekening."}],"20":[{"catchword":"Ik zal ulieden richten,","tekst":"Dit is een kort en bondig goddelijk besluit van dit gehele dispuut tussen God en zijn onboetvaardig murmurerende volk."}],"21":[{"catchword":"onzer gevankelijke wegvoering,","tekst":"Met Jojachin of Jechonia. Vergelijk boven Eze 1:2 , en Eze 24:1 , en onder Eze 40:1 ; Jer 29:10 , met de aantekening."},{"catchword":"tiende maand,","tekst":"In het kerkelijk jaar genoemd Tebeth, passende op onzen December en Januari; nadat Jeruzalem op den negenden van de vierde maand van het vorige jaar door den koning van Babel, in het negentiende jaar zijner regering, was gewonnen, en zijn overste Nebuzaradan op den zevenden van de vijfde maand daar binnen was getogen; 2Ki 25:3 , 2Ki 25:8 ; Jer 39:2 ."},{"catchword":"tot mij kwam,","tekst":"Volgens Gods voorzegging, boven Eze 24:26 ."},{"catchword":"stad is geslagen","tekst":"Jeruzalem is ingenomen en verwoest, en velen der inwoners zijn omgebracht; alzo 1Sa 30:1 ; 2Sa 15:14 ; 2Ki 3:19 ; 1Ch 20:1 , en onder Eze 40:1 ; vergelijk Jer 43:11 , en Jer 46:13 , en Jer 47:1 , enz."}],"22":[{"catchword":"hand des HEEREN op mij geweest des avonds,","tekst":"Zie boven Eze 1:3 ."},{"catchword":"hij des morgens","tekst":"De voorzegde boodschapper."},{"catchword":"stom","tekst":"Gelijk hem ook van den Heere was voorzegd, boven Eze 24:27 ; vergelijk Eze 3:26 , met de aantekening."}],"24":[{"catchword":"inwoners van die woeste plaatsen","tekst":"Die overgebleven zijn in het verwoeste Kanaän, nadat Jeruzalem verheerd, het meeste volk weggevoerd en het land verwoest was door de Babyloniërs."},{"catchword":"enig man,","tekst":"Alsof zij zeiden: God heeft Abraham dit land niet beloofd om zijnentwil, want hij had zo groot land niet van node, en heeft het ook nooit geheel bewoond, maar om zijne kinderen en nakomelingen, die wij nu zijn. [Vergelijk Isa 51:2 ; Joh 8:33 , enz.] En of wij nu wel minder zijn in getal dan tevoren, evenwel zijn wij de rechte erfgenamen en zullen er wil inblijven. Zo vertwijfeld hardnekkig waren deze mensen, niettegenstaande zij Gods straffende hand voor ogen zagen."}],"25":[{"catchword":"Gij eet vlees","tekst":"Of, zoudt gij, enz. of omdat gij bloed eet, en zo in de volgende woorden."},{"catchword":"bloed,","tekst":"Tegen de wet; Gen 9:4 ; Lev 7:26 , en Lev 17:10 , en Lev 19:26 ; Deu 12:16 ."},{"catchword":"heft uw ogen op tot uw drekgoden,","tekst":"Zie boven Eze 18:6 ."},{"catchword":"en zoudt gij het land erfelijk bezitten?","tekst":"Geenszins, wil God zeggen: Ik heb u het land beloofd met voorwaarde van gehoorzaamheid, maar uwe ongehoorzaamheid is openbaar, gelijk het voorgaande en volgende uitwijst."}],"26":[{"catchword":"staat op ulieder zwaard;","tekst":"Of, hebt gestaan; dat is, vertrouwd op uwe strijdbaarheid, menende u daardoor in het land staande te houden; of gij zijt steeds gereed met uwe zwaarden, als degenen, die hunne naasten geweld willen aandoen; vergelijk de manier van spreken met boven Eze 31:14 ."},{"catchword":"verontreinigt,","tekst":"Door onkuischheid en overspel."}],"27":[{"catchword":"Zo waarachtig als Ik leef,","tekst":"Manier van eedzweren, gelijk boven vs.11."},{"catchword":"open veld is,","tekst":"Hebreeuws, aangezicht des velds."},{"catchword":"spelonken zijn,","tekst":"Waar zij zich menen te bergen en te verzekeren; zie Jdg 6:2 , met de aantekening."}],"28":[{"catchword":"verwoesting en een schrik stellen,","tekst":"Of, tot de uiterste, of tot enkel verwoesting, of ontzetting. Of tot verwoestingen, of ja verwoesting; alzo het Hebreeuwse woord de betekenis heeft van verwoesten, en zich ontzetten, schrikken; alzo onder Eze 35:3 , Eze 35:7 ."},{"catchword":"bergen Israëls","tekst":"Israëls bergachtig land."}],"30":[{"catchword":"wanden en in de deuren der huizen;","tekst":"Gelijk naburen, aan de wanden der huizen en in de deuren, met elkander een praatje plegen te houden."}],"31":[{"catchword":"pleegt te komen,","tekst":"Met menigte in de heilige vergaderingen om Gods woord te horen. Hebreeuws, gelijk de inkomst des volks."},{"catchword":"zitten voor uw aangezicht","tekst":"Vergelijk boven Eze 8:1 ."},{"catchword":"maken liefkozingen met hun mond,","tekst":"Dat is, zij vleien u, roemende uwe profetieën met huichelachtige gemaakte gebaren, vanwege derzelver sierlijkheid, alsof zij zeiden: Ei, o, hoe schoon, hoe fraai spreekt hij, enz. Anders: zij maken dezelve [woorden] lieflijk met hunnen mond; dat is, zij bekennen met den mond dat uwe woorden lieflijk zijn, maar enz., de zin op een uitkomende."}],"32":[{"catchword":"lied der minnen,","tekst":"Of, boelenlied, dat lieflijk luidt, of vol lieflijkheid is."},{"catchword":"speelt;","tekst":"Op instrumenten van muziek, gelijk Psa 33:3 ."}],"33":[{"catchword":"komt (zie, het zal komen)","tekst":"Dat gij hun van mijnentwege hebt geprofeteerd."},{"catchword":"profeet","tekst":"Een waarachtig profeet van God gezonden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the word of the lord came unto me saying:"}],"2":[{"catchword":null,"tekst":"Child of man, speak unto the children of thy people, [see above chapter 3 on verse 11] and say unto them: when I bring the sword [that is, in my just judgement send war, hostile invasion, with all the consequents or concomitants thereof] upon any land; [Heb. A land, when I shall bring the sword upon, against, or, into it] and the people of the land take man out of their ends, [that is, plainly as much as out of or from among them; or out of their frontiers, uttermost borders, where the watchmen are commonly set, to heed all comings or approaches of the enemy. See the diverse use of this phrase Gens. 47.2. Judg. 18.2. 1 Kings 12.31. Also Gen 19:4. Isa 56:11. With the Annotat.] And set him for a watchman for them:"}],"3":[{"catchword":null,"tekst":"And he seeth the sword come [Heb. coming] upon the land, and bloweth with the trumpet and warneth the people:"}],"4":[{"catchword":null,"tekst":"And one that beareth the sound of the trumpet, heareth (indeed), but taketh no warning; and the sword cometh, and taketh him away: his blood is upon his (own) head. [That is, he is the cause of his own destruction; or is guilty of his own destruction. Compare Lev. 20.9. With the Annotat and so in the sequel]"}],"5":[{"catchword":null,"tekst":"He heard the sound of the trumpet, but took no warning, his blood is upon him; but he that taketh warning, saveth his soul. [That is, life, or person, himself. See Gen 12:5 and 19.17 with the Annotat.]"}],"6":[{"catchword":null,"tekst":"On the contrary, when the watchman seeth the sword come, and bloweth not will the trumpet, so that the people is not warned; and the sword cometh, and taketh away a soul [That is, a person or some one, as above] from among them: he is (indeed) taken away in his iniquity, but his blood will I require all the watchman&acirc;&euro;&trade;s hand. [As above chapter 3.18. I indeed by my secret providence have justly sent this punishment upon him; but that shall not excuse this unfaithful watchman]"}],"7":[{"catchword":null,"tekst":"Now thou, o child man, I have set thee for a watchman over the house of Israel: therefore thou shalt hear the word at my mouth, and warn them from me. Compare this place with above chapter 3.17, c. and see the Annotat, there]"}],"8":[{"catchword":null,"tekst":"When I say unto the wicked, o wicked man, thou shalt die the death, and thou speak not, to warn the wicked from his way: that wicked man shall die in his iniquity, but his blood will I require [or, seek] at thine hand."}],"9":[{"catchword":null,"tekst":"But when thou warneth the wicked from his way, that he might turn from it, and he turneth not from his way: then shall he die in his iniquity, but thou hast delivered thy soul."}],"10":[{"catchword":null,"tekst":"Therefore, thou child of man, say unto the house of Israel; thus ye speak, saying, seeing our transgressions and our sins are upon us, [That is, we bear the punishment thereof. Compare above chap. 32.27. And see Levit. 5 on verse 1] and we languish in them, [According to Gods threatnings. Compare above chapter 24.23. See there] how should we then live? [As thou dist promise us we shall: but (as if they should say) we find the contrary indeed. This they murmured at the plagues of God, without minding their repentance and upon condition whereof promises of life were made]"}],"11":[{"catchword":null,"tekst":"Say unto them, (as true as) I live, saith the Lord LORD, if I have pleasure in the death of the wicked! [An abrupt kind of speech usual in oaths. See Numb. 14. On verse 23. As ye conceive and complain, that I take delight in killing you, though ye should turn from your wickedness; as if it were all one to me, whether ye did repent, or not; ye behave your selves, whether well, or ill, ye are sure notwithstanding to suffer; as wicked murmurets and hypocrites are wont to speak. Compare above chapter 18.23. With the Annotat.] But therein (have I pleasure) that the wicked turn from his way, and live: Turn ye turn ye from your evil ways, [as if God should say, that is the thing therein ye are wanting, that ye all continue in your wickedness, and yet murmur against my plagues, whereas ye ought to repent and turn from your sins] for why should ye die, o house of Israel? [As if he should say, how is it that ye continue so sottish, as that ye bring your own destruction upon your selves by your impenitency? If ye will go on as ye have begun nothing else can betide you, but that you must needs dye and perish in your perversness; think upon this seriously, for your own good.]"}],"12":[{"catchword":null,"tekst":"Thou then, o child of man, say unto the children thy people, the righteousness of the righteous [see above chapter 3.20 and 18.24. with Annotat.] shall not deliver him [the aforesaid righteous man that is onely so in name and in account, but not in deed and in truth] in the day of his transgression; [or, of his backsliding] and as for the wickedness of the wicked, he shall not fall [that is, perish through my judgements, whereof here is properly spoken. See Genesis 14 on verse 10] for it in the day when he turneth from his wickedness: neither shall the righteous be able to live by that (his righteousness) [mentioned verse 12] in the day when he sinneth]"}],"13":[{"catchword":null,"tekst":"When I say unto the righteous, that he shall surely live [Heb. Living live; [Upon condition of sincerity and perseverance unto the end] and he trusteth in his own righteousness, and th year of his reign, and his chief captain Nebuzaradan had entered into it on the seventh day of the fifth moneth, 2 Kings 25.3,8. Jermiah 39.2.] on the fifth (day) of the moneth (that) one that had escaped out of Jerusalem came unto me, [according to God&acirc;&euro;&trade;s prediction, above chapter 24.26.] saying, the city is smitten. [Jerusalem is taken and destroyed and many of the inhabitants are slain. So 1 Sam. 30.1. 2 Sam 15.14. 2 Kings 9.13. 1 Chron. 20.1. And below chap. 40.1. compare Jer 43:11 and 46.13. And 47.1, c.]"}],"22":[{"catchword":null,"tekst":"Now the hand of the LORD had been upon me [see above chapter 1 on verse 3. in the evening before that escaped one came, and had opened my mouth until he [the foresaid messenger, or bringer of tidings] came to me in the morning: for my mouth was opened, and I was no more dumb. [As was also foretold by God, above chapter 24.26. Compare chapter 3.26. With the Annotat.]"}],"23":[{"catchword":null,"tekst":"Then the word of the LORD came unto me, saying:"}],"24":[{"catchword":null,"tekst":"Child of man, the inhabitants of those wast places in the land of Israel [To wit, the inhabitants left in desolate Canaan, after Jerusalem was destroyed, the greatest part of the people carried away captive, & the land laid waste by the Babylonians] speak, saying; Abraham was but a single (man), possessed this land hereditary: but we are many; the land is given to us for an hereditary possession. [as if they had said, God did not promise this land unto Abraham for himself alone, for he had no need of such a great land as this is, neither did he ever inhabit it wholly himself, but for his children and posterity, which we are: (Compare Isa 51:2. Job 8:33, c) and though we be now fewer in number then formerly, yet we were the right heirs, and shall indeed continue in it. So obstinate were these men, though saw the punishment hand God before their eyes]"}],"25":[{"catchword":null,"tekst":"Therefore, say unto them; thus saith the // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }

      }).join('');

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

}

    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
