ord van de HEERE tot mij kwam en zei:","2":"Mensenkind! Omdat Tyrus van Jeruzalem gezegd heeft: Heah! Zij is verbroken, de poort van de volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!","3":"Daarom, zo zegt de Heere HEERE: Zie, Ik *wil* aan u, o Tyrus! En Ik zal veel heidenvolken tegen u doen opkomen, alsof Ik de zee met haar golven deed opkomen.","4":"Die zullen de muren van Tyrus verderven, en haar torens afbreken; ja, Ik zal haar stof van haar wegvagen, en zal haar tot een gladde steenrots maken.","5":"Zij zal in het midden van de zee zijn *tot* uitspreiding van netten; want Ik heb het gesproken, spreekt de Heere HEERE; en zij zal de heidenvolken ten roof worden.","6":"En haar dochters, die in het veld zijn, zullen met het zwaard gedood worden; en zij zullen weten dat Ik de HEERE ben.","7":"Want zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, de koning der koningen, van het noorden tegen Tyrus brengen, met paarden en met wagens, en met ruiters, en een leger, en veel volk.","8":"Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen.","9":"En hij zal muurbrekers tegen uw muren stellen, en uw torens met zijn zwaarden afbreken.","10":"Vanwege de menigte van zijn paarden zal het stof van die u bedekken; uw muren zullen beven vanwege het gedruis van de ruiters, en de wielen, en de wagens, als hij door uw poorten zal intrekken, zoals *door* de ingangen van een doorgebroken stad.","11":"Hij zal met de hoeven van zijn paarden al uw straten vertreden; uw volk zal hij met het zwaard doden, en elk van de kolommen van uw sterkten zal ter aarde neerstorten.","12":"En zij zullen uw vermogen roven, en uw koopwaren plunderen, en uw muren afbreken, en uw kostelijke huizen omwerpen; en uw stenen, en uw hout, en uw stof zullen zij in het midden van het water werpen.","13":"Zo zal Ik het gedreun van uw liederen doen ophouden, en het geschal van uw harpen zal niet meer gehoord worden.","14":"Ja, Ik zal u maken tot een gladde steenrots; u zult zijn *tot* uitspreiding van de netten, u zult niet meer gebouwd worden; want Ik, de HEERE, heb het gesproken, spreekt de Heere HEERE.","15":"Zo zegt de Heere HEERE tot Tyrus: Zullen niet de eilanden beven van het geluid van uw val, als de dodelijk verwonde zal kermen, wanneer men in het midden van u schrikkelijk zal moorden?","16":"En alle vorsten van de zee zullen afdalen van hun tronen, en hun mantels van zich doen, en hun gestikte klederen uittrekken; met sidderingen zullen zij bekleed worden, op de aarde zullen zij neerzitten, en elk ogenblik sidderen, en over u ontzet zijn;","17":"En zij zullen een klaaglied over u opheffen, en tot u zeggen: Hoe bent u uit de zeeën vergaan, u welbewoonde, u beroemde stad, die sterk geweest is ter zee, zij en haar inwoners; die hun schrik gaven aan allen die in haar woonden!","18":"Nu zullen de eilanden sidderen ten dage van uw val; ja, de eilanden die in de zee zijn, zullen beroerd worden vanwege uw uitgang.","19":"Want zo zegt de Heere HEERE: Als Ik u zal stellen *tot* een verwoeste stad, gelijk de steden die niet bewoond worden; als Ik een afgrond over u zal doen opkomen, en het grote water u zal overdekken.","20":"Dan zal Ik u doen neerdalen met degenen die in de kuil neerdalen tot het oude volk, en zal u doen neerliggen in de onderste plaatsen van de aarde, in de woeste plaatsen, *die* van oudsher geweest zijn, met degenen die in de kuil neerdalen, opdat u niet bewoond wordt; en Ik zal het sieraad herstellen in het land van de levenden.","21":"*Maar* u zal Ik tot een grote schrik stellen, en u zult er niet *meer* zijn; als u gezocht wordt, zo zult u niet meer gevonden worden in eeuwigheid, spreekt de Heere HEERE."},"SV":{"1":"En het gebeurde in het elfde jaar, op den eersten der maand, *dat* des HEEREN woord tot mij geschiedde, zeggende:","2":"Mensenkind! daarom dat Tyrus van Jeruzalem gezegd heeft: Heah! zij is verbroken, de poort der volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!","3":"Daarom, alzo zegt de Heere HEERE: Ziet, Ik *wil* aan u, o Tyrus! en Ik zal vele heidenen tegen u doen opkomen, alsof Ik de zee met haar golven deed opkomen.","4":"Die zullen de muren van Tyrus verderven, en haar torens afbreken; ja, Ik zal haar stof van haar wegvagen, en zal haar tot een gladde steenrots maken.","5":"Zij zal in het midden der zee zijn *tot* uitspreiding van netten; want Ik heb het gesproken, spreekt de Heere HEERE; en zij zal den heidenen ten roof worden.","6":"En haar dochteren, die in het veld zijn, zullen met het zwaard gedood worden; en zij zullen weten, dat Ik de HEERE ben.","7":"Want alzo zegt de Heere HEERE: Ziet, Ik zal Nebukadrezar, den koning van Babel, den koning der koningen, van het noorden tegen Tyrus brengen, met paarden en met wagenen, en met ruiteren, en *krijgs* vergaderingen, en veel volks.","8":"Hij zal uw dochteren op het veld met het zwaard doden, en hij zal sterkten tegen u maken, en een wal tegen u opwerpen, en rondassen tegen u opheffen.","9":"En hij zal muurbrekers tegen uw muren stellen, en uw torens met zijn zwaarden afbreken.","10":"Vanwege de menigte zijner paarden zal u derzelver stof bedekken; uw muren zullen beven vanwege het gedruis der ruiteren, en wielen, en wagenen, als hij door uw poorten zal intrekken, gelijk *door* de ingangen ener doorgebrokene stad.","11":"Hij zal met de hoeven zijner paarden al uw straten vertreden; uw volk zal hij met het zwaard doden, en elk een van de kolommen uwer sterkten zal ter aarde nederstorten.","12":"En zij zullen uw vermogen roven, en uw koopmanswaren plunderen, en uw muren afbreken, en uw kostelijke huizen omwerpen; en uw stenen, en uw hout, en uw stof zullen zij in het midden der wateren werpen.","13":"Zo zal Ik het gedeun uwer liederen doen ophouden, en het geklank uwer harpen zal niet meer gehoord worden.","14":"Ja, Ik zal u maken tot een gladde steenrots; gij zult zijn *tot* uitspreiding der netten, gij zult niet meer gebouwd worden; want Ik, de HEERE, heb het gesproken, spreekt de Heere HEERE.","15":"Alzo zegt de Heere HEERE tot Tyrus: Zullen niet de eilanden van het geluid uws vals beven, als de dodelijk verwonde zal kermen, wanneer men in het midden van u schrikkelijk zal moorden?","16":"En alle vorsten der zee zullen afdalen van hun tronen, en hun mantels van zich doen, en hun gestikte klederen uittrekken; met sidderingen zullen zij bekleed worden, op de aarde zullen zij nederzitten, en telken ogenblik sidderen, en over u ontzet zijn;","17":"En zij zullen een klaaglied over u opheffen, en tot u zeggen: Hoe zijt gij uit de zeeën vergaan, gij welbewoonde, gij beroemde stad, die sterk geweest is ter zee, zij en haar inwoners; die hunlieder schrik gaven aan allen, die in haar woonden!","18":"Nu zullen de eilanden sidderen ten dage uws vals; ja, de eilanden, die in de zee zijn, zullen beroerd worden vanwege uw uitgang.","19":"Want alzo zegt de Heere HEERE: Als Ik u zal stellen *tot* een verwoeste stad, gelijk de steden, die niet bewoond worden; als Ik een afgrond over u zal doen opkomen, en de grote wateren u zullen overdekken.","20":"Dan zal Ik u doen nederdalen met degenen die in den kuil nederdalen tot het oude volk, en zal u doen nederliggen in de onderste plaatsen der aarde, in de woeste plaatsen, *die* van ouds geweest zijn, met degenen, die in den kuil nederdalen, opdat gij niet bewoond wordt; en Ik zal het sieraad herstellen in het land der levenden.","21":"*Maar* u zal Ik tot een groten schrik stellen, en gij zult er niet *meer* zijn; als gij gezocht wordt, zo zult gij niet meer gevonden worden in eeuwigheid, spreekt de Heere HEERE."},"KJV":{"1":"And it came to pass in the eleventh year, in the first *day* of the month, *that* the word of the LORD came unto me, saying,","2":"Son of man, because that Tyrus hath said against Jerusalem, Aha, she is broken *that was* the gates of the people: she is turned unto me: I shall be replenished, *now* she is laid waste:","3":"Therefore thus saith the Lord GOD; Behold, I *am* against thee, O Tyrus, and will cause many nations to come up against thee, as the sea causeth his waves to come up.","4":"And they shall destroy the walls of Tyrus, and break down her towers: I will also scrape her dust from her, and make her like the top of a rock.","5":"It shall be *a place for* the spreading of nets in the midst of the sea: for I have spoken *it*, saith the Lord GOD: and it shall become a spoil to the nations.","6":"And her daughters which *are* in the field shall be slain by the sword; and they shall know that I *am* the LORD.","7":"For thus saith the Lord GOD; Behold, I will bring upon Tyrus Nebuchadrezzar king of Babylon, a king of kings, from the north, with horses, and with chariots, and with horsemen, and companies, and much people.","8":"He shall slay with the sword thy daughters in the field: and he shall make a fort against thee, and cast a mount against thee, and lift up the buckler","9":"And he shall set engines of war against thy walls, and with his axes he shall break down thy towers.","10":"By reason of the abundance of his horses their dust shall cover thee: thy walls shall shake at the noise of the horsemen, and of the wheels, and of the chariots, when he shall enter into thy gates, as men enter into a city wherein is made a breach.","11":"With the hoofs of his horses shall he tread down all thy streets: he shall slay thy people by the sword, and thy strong garrisons shall go down to the ground.","12":"And they shall make a spoil of thy riches, and make a prey of thy merchandise: and they shall break down thy walls, and destroy thy pleasant houses: and they shall lay thy stones and thy timber and thy dust in the midst of the water.","13":"And I will cause the noise of thy songs to cease; and the sound of thy harps shall be no more heard.","14":"And I will make thee like the top of a rock: thou shalt be *a place* to spread nets upon; thou shalt be built no more: for I the LORD have spoken *it*, saith the Lord GOD.","15":"Thus saith the Lord GOD to Tyrus; Shall not the isles shake at the sound of thy fall, when the wounded cry, when the slaughter is made in the midst","16":"Then all the princes of the sea shall come down from their thrones, and lay away their robes, and put off their broidered garments: they shall clothe themselves with trembling; they shall sit upon the ground, and shall tremble at *every* moment, and be astonished","17":"And they shall take up a lamentation for thee, and say to thee, How art thou destroyed, *that wast* inhabited of seafaring men, the renowned city, which wast strong in the sea, she and her inhabitants, which cause their terror *to be* on all that haunt","18":"Now shall the isles tremble in the day of thy fall; yea, the isles that *are* in the sea shall be troubled at thy departure.","19":"For thus saith the Lord GOD; When I shall make thee a desolate city, like the cities that are not inhabited; when I shall bring up the deep upon thee, and great waters shall cover","20":"When I shall bring thee down with them that descend into the pit, with the people of old time, and shall set thee in the low parts of the earth, in places desolate of old, with them that go down to the pit, that thou be not inhabited; and I shall set glory in the land of the living;","21":"I will make thee a terror, and thou *shalt be* no *more*: though thou be sought for, yet shalt thou never be found again, saith the Lord GOD."}},"tsk":{"2":[{"kopje":"Tyrus","refs":["Ezech 27:1","Ezech 28:26","Joz 19:29","Ps 83:8","Jes 23:1-18","Jer 25:22","Jer 27:3","Jer 47:4","Joël 3:4","Amos 1:9","Amos 1:10","Zach 9:2-4"]},{"kopje":"Heah","refs":["Ezech 25:2","Ezech 25:3","Ezech 25:6","Ezech 36:2","Ps 35:21","Ps 40:16","Ps 70:4","Ps 83:3-5"]},{"kopje":"de poort","refs":["Klaagl 1:1","Hand 2:5-10"]},{"kopje":"zij is","refs":["Ezech 25:10","Jer 49:1"]}],"3":[{"kopje":"Zie","refs":["Ezech 26:3-6","Jes 23:15-17","Ps 45:13","Ps <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> her like the <span class=\"wl wl-kjv\" data-code=\"H6706\">top</span> of a rock.","5":"It shall be a place for the <span class=\"wl wl-kjv\" data-code=\"H4894\">spreading</span> of <span class=\"wl wl-kjv\" data-code=\"H2764\">nets</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD:</span> and it shall become a <span class=\"wl wl-kjv\" data-code=\"H957\">spoil</span> to the nations.","6":"And her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> which are in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","7":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus</span> <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> with <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and with <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and <span class=\"wl wl-kjv\" data-code=\"H6951\">companies,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> people.","8":"He shall <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1785\">fort</span> against thee, and <span class=\"wl wl-kjv\" data-code=\"H8210\">cast</span> a <span class=\"wl wl-kjv\" data-code=\"H5550\">mount</span> against thee, and lift <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the buckler","9":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H4239\">engines</span> of <span class=\"wl wl-kjv\" data-code=\"H6904\">war</span> against thy <span class=\"wl wl-kjv\" data-code=\"H2346\">walls,</span> and with his <span class=\"wl wl-kjv\" data-code=\"H2719\">axes</span> he shall break <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> thy towers.","10":"By reason of the <span class=\"wl wl-kjv\" data-code=\"H8229\">abundance</span> of his <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> their <span class=\"wl wl-kjv\" data-code=\"H80\">dust</span> shall <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> thee: thy <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> shall <span class=\"wl wl-kjv\" data-code=\"H7493\">shake</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1534\">wheels,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> when he shall <span class=\ /span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4658\">fall;</span> yea, the <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> shall be <span class=\"wl wl-kjv\" data-code=\"H926\">troubled</span> at thy departure.","19":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> When I shall <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H2717\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> like the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that are not <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited;</span> when I shall bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8415\">deep</span> upon thee, and <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> shall cover","20":"When I shall bring thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with them that <span class=\"wl wl-kjv\" data-code=\"H3381\">descend</span> into the <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> with the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of old <span class=\"wl wl-kjv\" data-code=\"H5769\">time,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> thee in the low <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> in places <span class=\"wl wl-kjv\" data-code=\"H2723\">desolate</span> of <span class=\"wl wl-kjv\" data-code=\"H5769\">old,</span> with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> that thou be not <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited;</span> and I shall <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6643\">glory</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the living;","21":"I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H1091\">terror,</span> and thou shalt be no more: though thou be sought <span class=\"wl wl-kjv\" data-code=\"H1245\">for,</span> yet shalt thou <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> again, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"elfde jaar,","tekst":"Na de gevankelijke wegvoering van den koning Jechonia. Zie boven Eze 24:1 ."},{"catchword":"maand,","tekst":"Welke maand dit geweest zij, is onzeker. Uit vs.2 kan men het houden voor de eerste maand na het innemen van Jeruzalem, hetwelk geschiedde op den negenden vande vierde maand, in het elfde jaar van den koning Zedekia; Jer 52:6 ."}],"2":[{"catchword":"Tyrus van Jeruzalem gezegd heeft","tekst":"Dat is, inwoners der stad Tyrus. Hebreeuws, Tsor. Zie Jos 19:29 ; 1Ki 5:1 , en wijders Psa 83:8 , en Psa 87:4 ; Isa 23:1 , enz.; Jer 47:4 ; Joe 3:4 , enz.; Amo 1:9-10 ; Zec 9:2-3 ; Mat 11:21-22 ."},{"catchword":"Heah","tekst":"Gelijk boven Eze 25:3 ."},{"catchword":"poort der volken;","tekst":"Hebreeuws, deuren; dat is, waar de volken van alle kanten introkken, om hun koophandel te drijven. Vergelijk Isa 23:3 , en onder Eze 27:3 ."},{"catchword":"zij is tot mij omgewend;","tekst":"Dat is, hun handel zal nu tot mij komen."},{"catchword":"vervuld worden,","tekst":"Met koopmanschap en rijkdom."},{"catchword":"zij is verwoest","tekst":"Alsof zij zeiden: Het is met hen gedaan; of, [nu, dewijl] zij verwoest is."}],"3":[{"catchword":"wil aan u,","tekst":"Gelijk boven Eze 13:8 ."},{"catchword":"alsof Ik de zee","tekst":"Vergelijk onder vs.19. Anders: gelijk de zee zich verheft met hare golven; zulks waren de Tyriërs gewoon te zien, als gelegen zijnde in de zee."}],"4":[{"catchword":"Die zullen de muren van Tyrus verderven,","tekst":"Heidenen, of volken; zie vs.7."},{"catchword":"stof van haar wegvagen,","tekst":"Als wanneer men het stof van een steenklip wegveegt, zodat men de blote klip kan zien, die tevoren met stof bedekt of bestoven was. Aldus heeft het God beliefd de verwoesting van de stad Tyrus met verbloemde woorden zeer levendig af te beelden."},{"catchword":"gladde steenrots maken","tekst":"Hebreeuws, stellen tot gladdigheid ener steenrots. Vergelijk boven Eze 24:7 . Dit ziet op de gelegenheid der stad, die op ene steenrots gebouwd was, en daarvan den naam Tsor [dat is, rots] had. God wil zeggen dat Hij het gebouw als stof zal doen verstuiven, dat er niets dan de gladde, kale, blote rots gezien worde, waarop de prachtige stad gebouwd was. Alzo vs.14."}],"5":[{"catchword":"midden der zee zijn","tekst":"Want Tyrus lag rondom in de zee, van het vasteland afgezonderd; zie 1Ki 5:1 , en onder vs.17, en Eze 27:34 , en Eze 28:2 ."},{"catchword":"netten;","tekst":"Of, visgaren, want; zij zal als een blote waard zijn, waar de vissers hunne netten zullen uitspreiden om te drogen."}],"6":[{"catchword":"dochteren,","tekst":"Dat is, de steden en dorpen, die onder hen behoren; dat is de inwoners van die. Zie 2Ki 19:21 ; alzo vs.8."}],"7":[{"catchword":"koning der koningen,","tekst":"Dien monarch, den grootsten en machtigsten der aardse koningen; vergelijk Gen 9:25 , en Son 1:1 , en zie Dan 2:37 ."}],"8":[{"catchword":"dochteren op het veld","tekst":"Gelijk vs.6."},{"catchword":"sterkten tegen u maken,","tekst":"Gelijk boven Eze 4:2 ; zie van het Hebreeuwse woord 2Ki 25:1 ."},{"catchword":"wal tegen u opwerpen,","tekst":"Zie 2Sa 20:15 ."},{"catchword":"rondassen","tekst":"Dat is, tegen u strijden, of soldaten met rondassen, of rondassiers, op en tegen u doen aanvallen; want de schilden worden in het strijden opgeheven, of opgelicht, om zich daarmede tegen den vijand te bedekken."}],"9":[{"catchword":"muurbrekers tegen uw muren stellen,","tekst":"Hebreeuws, zulk een krijgsinstrument, dat verdelgt wat voor, of tegen zich is."},{"catchword":"zwaarden afbreken","tekst":"Of, houwmessen, hakmessen, van den koning Nebukadnezar."}],"10":[{"catchword":"zijner paarden","tekst":"Van Nebukadnezar."},{"catchword":"wielen, en wagenen,","tekst":"Of, raderen."},{"catchword":"gelijk door","tekst":"Of, gelijk men pleegt in te trekken in een doorgebroken, of gespleten, verscheurde stad; dat is, welker poorten zo verdorven en open zullen zijn door het geweld der belegeraars, dat zij er ruim genoeg en bij menigten, als door grote bressen, kunnen doortrekken; of, gelijk men stormenderhand door de gemaakte bressen invalt, zo zal hij tot u intrekken en alles ombrengen, zie vs.15; de bressen zullen hem in plaats van poorten zijn."}],"11":[{"catchword":"hoeven zijner paarden","tekst":"Hebreeuws, klauw."},{"catchword":"elk een van de kolommen","tekst":"Hebreeuws, de kolommen, of pilaren uwer sterkte [waardoor het schijnt dat sterke torens of andere vestingen verstaan worden, die zij tot tegenweer hadden opgericht] zullen nederdalen, te gronde gaan; dat is, elkeen van dien. Sommigen verstaan het van de prachtige beelden, triumftekenen, enz. tot ene vertoning hunner grootheid opgericht."}],"12":[{"catchword":"kostelijke huizen omwerpen;","tekst":"Hebreeuws, huizen uwer begeerte; dat is, kostelijke, gewenste, lieflijke."},{"catchword":"werpen","tekst":"Hebreeuws, leggen, stellen."}],"13":[{"catchword":"liederen doen ophouden,","tekst":"Dat is, al uwe vrolijkheid zal uit zijn. Zie Isa 24:8 ; Jer 7:34 , en Jer 16:9 ."},{"catchword":"harpen","tekst":"Anders: cithers."}],"14":[{"catchword":"gladde steenrots;","tekst":"Zie boven vs.4,5."},{"catchword":"niet meer gebouwd worden;","tekst":"Dat is, niet als tevoren; gij zult nimmermeer wederkomen tot uw vorigen wereldlijken bloei, staat en heerlijkheid, en metttertijd gans vergaan; vergelijk Isa 23:15 , Isa 23:17 , en onder vs.21, en Eze 27:36 ; idem Ezr 3:7 ; Neh 13:16 ; Mat 15:21 ; Mar 7:24 ; Act 12:20 , en Act 21:3 , Act 21:7 . Men houdt dat zij onder den koning Cyrus wat weder gerezen is, en ten tijde van Alexander de Grote is het zeker dat zij van vermogen was, als hij haar zeven maanden belegerde en innam; maar ten huidigen dage betuigen velen dat er nauwelijks enige overblijfselen van de herbouwde stad Palae-Tyrus gezien worden; niettemin heeft zij geestelijke beloften gehad voor de uitverkorenen onder den Messias, Psa 97:4 ; Isa 23:18 . God [wien alles van eeuwigheid bekend is] voegt hier [gelijk elders dikwijls] het begin en het einde tezamen."}],"15":[{"catchword":"Zullen niet","tekst":"Voorzeker ja, wil de Heere zeggen."},{"catchword":"eilanden van het geluid","tekst":"Dat is, inwoners over zee, die met u gehandeld hebben en van u verrijkt zijn; vergelijk onder Eze 27:35 , en zie Psa 72:10 ."},{"catchword":"dodelijk verwonde","tekst":"Vergelijk onder Eze 30:24 ."},{"catchword":"kermen,","tekst":"Of, huilen, zuchten."},{"catchword":"schrikkelijk zal moorden?","tekst":"Hebreeuws, doding, of [met] doding doden; dat is, een moord aanrichten, alles vermoorden."}],"16":[{"catchword":"zee zullen","tekst":"Die aan de zee wonen, met u gehandeld en op u gesteund hebben; vergelijk onder Eze 27:35 ."},{"catchword":"afdalen van hun tronen,","tekst":"Tot een teken van ontzetting en rouw, idem, vrees voor hun eigen staat, door uw voorbeeld."},{"catchword":"gestikte klederen","tekst":"Of, geborduurde. Hebreeuws, hun stiksels, of borduursels."}],"17":[{"catchword":"Hoe zijt gij","tekst":"Eene vraag, die voortkwam uit verwondering en deernis."},{"catchword":"uit de zeeën vergaan,","tekst":"Waar gij rondom in laagt, vergelijk onder Eze 27:3-4 . Anders: gij die bewo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
