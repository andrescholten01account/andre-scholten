icht uw gezicht tegen het gebergte Seir, en profeteer ertegen,","3":"En zeg ertegen: Zo zegt de Heere HEERE: Zie, Ik heb het tegen u, o gebergte Seir! En Ik zal Mijn hand tegen u uitstrekken, en zal u maken *tot* een verwoesting en een verlatenheid.","4":"Ik zal uw steden maken *tot* een woestenij, en u zult een verwoesting worden, en u zult weten, dat Ik de HEERE ben.","5":"Omdat u een eeuwige vijandschap hebt, en de kinderen van Israël hebt laten omkomen door het geweld van het zwaard, ten tijde van hun ondergang, ten tijde van hun uiterste ongerechtigheid;","6":"Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker tot bloed bestemmen, en het bloed zal u achtervolgen; omdat u het bloed niet hebt gehaat, zal het bloed u ook achtervolgen.","7":"En Ik zal het gebergte Seir tot de uiterste verwoesting maken; en Ik zal daaruit uitroeien wie erdoorheen trekt, en wie terugkeert.","8":"En Ik zal zijn bergen met zijn gesneuvelden vullen; op uw heuvels, en in uw dalen, en in al uw stromen zullen de gesneuvelden van het zwaard liggen.","9":"*Tot* eeuwige verwoestingen zal Ik u maken, en uw steden zullen niet bewoond worden; zo zult u weten, dat Ik de HEERE ben.","10":"Omdat u zegt: Die twee volken en die twee landen zullen van mij worden, en wij zullen ze in bezit nemen, ofschoon de HEERE daar was;","11":"Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE: Ik zal ook handelen naar uw toorn en naar uw jaloezie, die u uit uw haat tegen hen hebt uitgevoerd; en Ik zal Mij aan hen bekendmaken, wanneer Ik u geoordeeld zal hebben.","12":"En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven.","13":"Zo hebt u zich met uw mond tegen Mij groot gemaakt, en uw woorden tegen Mij vermenigvuldigd; Ik heb het gehoord.","14":"Zo zegt de Heere HEERE: Zoals het hele land zich verblijdt, zo zal Ik u de verwoesting aandoen.","15":"Zoals u zich verblijd hebt over de erfenis van het huis van Israël, omdat die verwoest is, zo zal Ik aan u doen; het gebergte van Seir, en heel Edom, zal helemaal een verwoesting worden; en zij zullen weten, dat Ik de HEERE ben."},"SV":{"1":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind! zet uw aangezicht tegen het gebergte Seir, en profeteer tegen hetzelve,","3":"En zeg tot hetzelve: Alzo zegt de Heere HEERE: Zie, Ik *wil* aan u, o gebergte Seir! en Ik zal Mijn hand tegen u uitstrekken, en zal u stellen *tot* een verwoesting en een strik.","4":"Ik zal uw steden stellen *tot* eenzaamheid, en gij zult een verwoesting worden, en zult weten, dat Ik de HEERE ben.","5":"Omdat gij een eeuwige vijandschap hebt, en hebt de kinderen Israëls doen wegvloeien door het geweld des zwaards, ten tijde huns verderfs, ten tijde der uiterste ongerechtigheid;","6":"Daarom, *zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker ten bloede bereiden, en het bloed zal u vervolgen; alzo gij het bloed niet hebt gehaat, zal u het bloed ook vervolgen.","7":"En Ik zal het gebergte Seir tot de uiterste verwoesting stellen; en Ik zal uit hetzelve uitroeien dien, die er doorgaat, en dien, die wederkeert.","8":"En Ik zal zijn bergen met zijn verslagenen vervullen; uw heuvelen, en uw dalen, en al uw stromen, in dezelve zullen de verslagenen van het zwaard liggen.","9":"*Tot* eeuwige verwoestingen zal Ik u stellen, en uw steden zullen niet bewoond worden ; alzo zult gij weten, dat Ik de HEERE ben.","10":"Omdat gij zegt: Die twee volken en die twee landen zullen mij geworden, en wij zullen ze erfelijk bezitten, ofschoon de HEERE daar ware;","11":"Daarom, *zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE: Ik zal ook handelen naar uw toorn en naar uw nijdigheid, die gij uit uw haat tegen hen hebt te werk gesteld; en Ik zal bij hen bekend worden, wanneer Ik u zal gericht hebben.","12":"En gij zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die gij tegen de bergen Israëls gesproken hebt, zeggende: Zij zijn verwoest , zij zijn ons ter spijze gegeven.","13":"Alzo hebt gij u met uw mond tegen Mij groot gemaakt, en uw woorden tegen Mij vermenigvuldigd; Ik heb het gehoord.","14":"Alzo zegt de Heere HEERE: Gelijk het ganse land verblijd is, *alzo* zal Ik u de verwoesting aandoen.","15":"Gelijk gij u verblijd hebt over de erfenis van het huis Israëls, omdat zij verwoest is, alzo zal Ik aan u doen; het gebergte van Seir, en gans Edom, zal geheel een verwoesting worden; en zij zullen weten, dat Ik de HEERE ben."},"KJV":{"1":"Moreover the word of the LORD came unto me, saying,","2":"Son of man, set thy face against mount Seir, and prophesy","3":"And say unto it, Thus saith the Lord GOD; Behold, O mount Seir, I *am* against thee, and I will stretch out mine hand against thee, and I will make thee most desolate.","4":"I will lay thy cities waste, and thou shalt be desolate, and thou shalt know that I *am* the LORD.","5":"Because thou hast had a perpetual hatred, and hast shed *the blood of* the children of Israel by the force of the sword in the time of their calamity, in the time *that their* iniquity *had* an end:","6":"Therefore, *as* I live, saith the Lord GOD, I will prepare thee unto blood, and blood shall pursue thee: sith thou hast not hated blood, even blood shall pursue","7":"Thus will I make mount Seir most desolate, and cut off from it him that passeth out and him that returneth.","8":"And I will fill his mountains with his slain *men*: in thy hills, and in thy valleys, and in all thy rivers, shall they fall that are slain with the sword.","9":"I will make thee perpetual desolations, and thy cities shall not return: and ye shall know that I *am* the LORD.","10":"Because thou hast said, These two nations and these two countries shall be mine, and we will possess it; whereas the LORD","11":"Therefore, *as* I live, saith the Lord GOD, I will even do according to thine anger, and according to thine envy which thou hast used out of thy hatred against them; and I will make myself known among them, when I have judged","12":"And thou shalt know that I *am* the LORD, *and that* I have heard all thy blasphemies which thou hast spoken against the mountains of Israel, saying, They are laid desolate, they are given us to consume.","13":"Thus with your mouth ye have boasted against me, and have multiplied your words against me: I have heard","14":"Thus saith the Lord GOD; When the whole earth rejoiceth, I will make thee desolate.","15":"As thou didst rejoice at the inheritance of the house of Israel, because it was desolate, so will I do unto thee: thou shalt be desolate, O mount Seir, and all Idumea, *even* all of it: and they shall know that I *am* the LORD."}},"tsk":{"2":[{"kopje":"Richt","refs":["Ezech 6:2","Ezech 20:46","Ezech 21:2","Ezech 25:2","Jes 50:7","Ef 6:19"]},{"kopje":"gebergte","refs":["Ezech 25:8","Gen 32:3","Gen 36:8","Gen 36:9","Deut 2:5","Joz 24:4","2 Kron 20:10","2 Kron 20:22","2 Kron 20:23","2 Kron 25:11-14"]},{"kopje":"en profeteer","refs":["Ezech 25:12-14","Ezech 32:29","Ps 83:4-19","Jes 34:1-17","Jes 63:1-6","Jer 9:25","Jer 9:26","Jer 49:7-22","Klaagl 4:21","Klaagl 4:22","Amos 1:11","Amos 1:12","Obadja 1:1","Obadja 1:10-14"]}],"3":[{"kopje":"Zie, Ik heb het","refs":["Ezech 5:8","Ezech 21:3","Ezech 29:3","Ezech 29:10","Jer 21:13","Nahum 2:13","Nahum 3:5"]},{"kopje":"En Ik zal Mijn hand","refs":["Ezech 6:14","Jer 6:12","Jer 15:6","Jer 51:25"]},{"kopje":"verlatenheid","refs":["Ezech 35:7","Ezech 5:15"]}],"4":[{"kopje":"maken","refs":["Ezech 35:9","Ezech 6:6","Joël 3:19","Mal 1:3","Mal 1:4"]},{"kopje":"en u","refs":["Ezech 35:9","Ezech 35:12","Ezech 6:7","Ex 9:14","Ex 14:4"]}],"5":[{"kopje":"u een eeuwige vijandschap hebt","refs":["Ezech 35:12","Ezech 25:12","Gen 27:41","Gen 27:42","Ps 137:7","Amos 1:11","Obadja 1:10-16"]},{"kopje":"eeuwige vijandschap","refs":["Ezech 25:15"]},{"kopje":"geweld","refs":["Jer 18:21"]},{"kopje":"ten tijde van hun","refs":["Ezech 21:25"," s=\"wl wl-kjv\" data-code=\"H518\">sith</span> thou hast not <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> even <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall pursue","7":"Thus will I <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">most</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from it him that passeth <span class=\"wl wl-kjv\" data-code=\"H5674\">out</span> and him that returneth.","8":"And I will <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> his <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> with his <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> men: in thy <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> and in thy <span class=\"wl wl-kjv\" data-code=\"H1516\">valleys,</span> and in all thy <span class=\"wl wl-kjv\" data-code=\"H650\">rivers,</span> shall they <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> that are <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with the sword.","9":"I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">desolations,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","10":"Because thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> These <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> and these <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> shall be mine, and we will <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it; whereas the LORD","11":"Therefore, as I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> I will even <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to thine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and according to thine <span class=\"wl wl-kjv\" data-code=\"H7068\">envy</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">used</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H8135\">hatred</span> against them; and I will make myself <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> among them, when I have judged","12":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and that I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> all thy <span class=\"wl wl-kjv\" data-code=\"H5007\">blasphemies</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> against the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> They are laid <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> they are <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> us to consume.","13":"Thus with your <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> ye have <span class=\"wl wl-kjv\" data-code=\"H1431\">boasted</span> against me, and have <span class=\"wl wl-kjv\" data-code=\"H6280\">multiplied</span> your <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> against me: I have heard","14":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> When the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiceth,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> thee desolate.","15":"As thou didst <span class=\"wl wl-kjv\" data-code=\"H8057\">rejoice</span> at the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> because it was <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> so will I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto thee: thou shalt be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> O <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> and all <span class=\"wl wl-kjv\" data-code=\"H123\">Idumea,</span> even all of it: and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"zet uw aangezicht","tekst":"Zie boven Eze 6:2 ."},{"catchword":"het gebergte Seïr,","tekst":"Het bergachtige land der Edomieten, Ezau's nakomelingen. Zie boven Eze 25:8 , Eze 25:12 , enz."}],"3":[{"catchword":"wil aan u,","tekst":"Gelijk boven Eze 13:8 ."},{"catchword":"hand tegen u uitstrekken,","tekst":"Zie boven Eze 14:9 ."},{"catchword":"en een schrik","tekst":"Of, tel de uiterste verwoesting, of ontzetting, of verwoesting en verwoesting, gelijk boven Eze 33:28 , en hier onder vs.7."}],"5":[{"catchword":"eeuwige vijandschap hebt,","tekst":"Hebreeuws, vijandschap der eeuwigheid; te weten tegen mijn volk; vergelijk boven Eze 25:12 , enz.; Amo 1:11 ."},{"catchword":"wegvloeien","tekst":"Of, gestort; dat is, hun bloed, als water door moorderijen vergoten, doen wegvloeien; vergelijk Psa 63:11 , en Jer 18:21 , met de aantekening."},{"catchword":"het geweld des zwaards,","tekst":"Hebreeuws, de handen des zwaards. Zie Job 5:20 ."},{"catchword":"verderfs,","tekst":"Of, ondergangs, door de Chaldeën, die de Edomieten geholpen of aangehitst hebben om Jeruzalem in den grond uit te roeien. Zie Psa 137:7 ."},{"catchword":"uiterste ongerechtigheid;","tekst":"Hebreeuws, ongerechtigheid van het einde, of des uitersten; zie boven Eze 21:25 ."}],"6":[{"catchword":"bloede bereiden,","tekst":"Dat is, om gedood of vermoord te worden; zie Gen 4:10 , en boven Eze 16:36 , en Eze 21:32 . Of, Ik zal u tot bloed maken; dat is, u alzo toerichten, dat het land vol van uw eigen bloed, en [om zo te spreken] niet dan louter bloed zal zijn."},{"catchword":"bloed zal u vervolgen;","tekst":"Dat is, doodslag en moord, en voorts de doodslagers. Of, het bloed zal u navolgen, als overal gestort zijnde en vloeiende."},{"catchword":"bloed niet hebt gehaat,","tekst":"Dat is, moord en doodslag van mijn volk met lust hebt aangezien en bevorderd."}],"7":[{"catchword":"uiterste verwoesting stellen;","tekst":"Of, enkel verwoesting, gelijk vs.3, hoewel de Hebreeuwse woorden [zijnde van een oorsprong] een weinig verschillen."},{"catchword":"dien,","tekst":"Ik zal het zo woest maken, dat er niemand wonen noch in of uitgaan zal."}],"8":[{"catchword":"uw heuvelen,","tekst":"O Edom."},{"catchword":"in dezelve","tekst":"Of, op bij."},{"catchword":"liggen","tekst":"Gelijk boven Eze 6:6 ."}],"9":[{"catchword":"eeuwige verwoestingen","tekst":"Hebreeuws, verwoestingen der eeuwigheid."},{"catchword":"bewoond worden;","tekst":"Anders: wederkeren. De zin is, dat zij niet herbouwd zullen worden om te bewonen."}],"10":[{"catchword":"twee volken","tekst":"Juda en de tien stammen."},{"catchword":"wij zullen ze erfelijk bezitten,","tekst":"Zie onder Eze 36:5 ."},{"catchword":"ofschoon de HEERE daar ware;","tekst":"Of, ofschoon de HEERE daar geweest is; dat is gewoond heeft. De zin is: Over God, overal, [gelijk goddeloze vijanden spreken] zij zullen voor ons zijn, wij zijn er nu de naasten toe, niemand zal het ons kunnen ontnemen. Anders: waar de Heere geweest is, verstaande dit van Juda, waar des Heeren tempel geweest was; vergelijk onder Eze 36:2 , met de aantekening."}],"11":[{"catchword":"die gij uit uw haat","tekst":"Of, gelijk gij met, of tegen hen gehandeld hebt."},{"catchword":"hen bekend worden,","tekst":"Bij mijn volk, die alsdan zullen bevinden dat Ik hun vriend ben, als Ik hunne doodvijanden zal hebben uitgeroeid."},{"catchword":"gericht hebben","tekst":"Dat is, gestraft."}],"12":[{"catchword":"dat Ik, de HEERE,","tekst":"Of, dat Ik de HEERE [ben, en dat] Ik, enz."},{"catchword":"spijze gegeven","tekst":"Zie Deu 31:17 ."}],"13":[{"catchword":"groot gemaakt,","tekst":"Dat is, stout en trots tegen mij gesproken, mij met pochen en snorken als bespot. Zie van deze manier van spreken Psa 35:26 ."},{"catchword":"vermenigvuldigd;","tekst":"Dat is, veel gesnaters tegen mij gevoerd. Het Hebreeuwse woord athar of gnathar heeft de betekenis van menigte, of overvloed van woorden, of zaken, meest in het goede, wanneer het genomen wordt van veel smeken, en ernstig of heftig hebben; [waarin menigte van woorden gebruikt wordt] of overvloed van allerlei zegen. Zie Gen 25:21 ; Exo 8:8 , enz.; Jer 33:6 ; maar hier van de trotse snaters en gesnaps, gelijk wanneer iemand [gelijk men zegt] de vlag voert. Alzo is het boven Eze 8:11 gebruikt van den overvloed van het afgodische reukwerk."}],"14":[{"catchword":"Gelijk het ganse land verblijd is,","tekst":"Gelijk het ganse land der Edomieten zich verheugd heeft over Israëls verwoesting, alzo zal Ik hun ganse land daarom ook weder verwoesten. Zie vs.15. Anders: als de ganse aarde verblijd is [dan] zal Ik, enz.; dat is, als er overal blijdschap zal wezen over de weldaden, die Ik mijn volk zal bewijzen, voornamelijk door den Messias, dan zult gij geplaagd en verwoest zijn."},{"catchword":"alzo","tekst":"Dit woord is hier tot aanvulling van den zin ingevoegd uit vs.15."}],"15":[{"catchword":"Gelijk gij u verblijd hebt","tekst":"Hebreeuws, naar uwe blijdschap. Vergelijk boven vs.11, en elders dikwijls."},{"catchword":"erfenis van het huis Israëls,","tekst":"Over de verwoesting van het land Kanaän, dat Ik Israël [en niet u] ten erve gegeven heb."},{"catchword":"gans Edom,","tekst":"Gelijk het ganse land Edom over Israëls ellende gejuicht heeft, gelijk in vs.14 gezegd is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover the word of the LORD came unto me, saying:"}],"2":[{"catchword":null,"tekst":"Child of man, set thy face against mount Seir: [see of this phrase above chap. 6 on verse 2. By mount Seir is meant the hilly country of the Edomites, the posterity of Esau. See above chap. 25.8,12, c.] and prophesy against it."}],"3":[{"catchword":null,"tekst":"And say unto it, thus saith the Lord LORD; behold I (will be) upon thee, [As above chapter 13.8.] O mount Seir: and I wil stretch out mine hand against thee, see above chapter 14 on verse 9.] And I will make thee a desolation and a terrour [or, utter desolation, or astonishment and desolation, as above chapter 33.28. and here below verse 7.]"}],"4":[{"catchword":null,"tekst":"I will make thy cities solitariness, and thou shalt become a desolation: and shall know that I am Lord, LORD."}],"5":[{"catchword":null,"tekst":"Because thou hast an everlasting enmity, [Heb. Enmity of eternity, to wit, against my people. Compare above chap. 25.12, c. Amos 1.11.] And hast caused the children of Israel to flow [or shed; that is, poured out their blood like water by murderings, and caused to flow away. Compare Psa 63:11 and Jer 18:21. With the Annotat.] See Job 5 on verse 20] in the time of their destruction, [or ruine by the Chaldeans whom the Edomites helped, and stirred up to destroy Jerusalem to the very foundation. See Psa 137:7.] in the time of the uttermost iniquity: [Heb. Iniquity of the end, or of the uttermost. See above chapter 21 on verse 25.]"}],"6":[{"catchword":null,"tekst":"Therefore (as time as) I live, saith the Lord LORD, I will assuredly prepare thee unto blood, [that is, to be killed or murdered. See Gen. 4 on verse 10. and above chap. 16.36 and 21.32 or I will make thee (to be) blood, that is, I will so order thee, that the land shall be full of thine own blood, and shall (in a Manner) be nothing but pure blood] and blood [That is, slaughter and murder, and consequently slayers and murderers] shall pursue thee: [Or, blood shall flow thee, as being shed and flowing every where] sith thou bast not hated blood, [that is, hast with delight beheld, yea and helped forward the murder and slaughter of my people] blood shall also pursue thee."}],"7":[{"catchword":null,"tekst":"And I will make mount Seir utter desolation, [or meer desolation, as verse 3. though the Hebrew words (being of one root) do a little differ] and I will cut off from it him that passeth out, and him that entreth. [I will make it so desolate, that no man shall inhabit, neither go in nor out there]"}],"8":[{"catchword":null,"tekst":"And I will fill his mountains with his slain men: thy hills, [O Edom] and thy valleys, and all thy streams, in [or upon, by] them shall they that are slain by the sword lie. [As above chap. 6.7.]"}],"9":[{"catchword":null,"tekst":"I will make thee everlasting desolations, [Heb. Desolation of eternity] and thy cities shall not be inhabited: [Others return. The meaning is, that they shall not be built again to be inhabited] and ye shall know that that I am LORD."}],"10":[{"catchword":null,"tekst":"Because thou sayeth, those two nations, [Juda and the ten tribes] and those two lands shall be mine, and we will possess them hereditarily, [see below chapter 36.5] though the LORD hath been there. That is, hath dwelt there. The meaning is, every where, whether God will or no, (as wicked enemies use to speak) they shall be for us, we are now the next, none shall be able to alienate them from us. Others, when the Lord hath been, understanding this of Juda, where the temple of the Lord had been. Compare below chap. 36.2. With the Annotat.]"}],"11":[{"catchword":null,"tekst":"Therefore (as true as) I live, saith the Lord LORD, I will also deal according unto thine anger and according to thy envy which thou hast exercised out of thine hatred against them: [Or as thou hast dealt with, or against them] and I will acknowledged among them, when I shall have judged [that is, punished] thee [that is, I shall be known among my people, who shall find that I am their friend when I shall have cut off their deadly enemies.]"}],"12":[{"catchword":null,"tekst":"And thou shall know that I the LORD have heard all thy blasphemies, [Or, that I (am) the lord, &c.] which thou hast spoken against the mountains of Israel, saying, they are laid waste, (that) they are given to us for meat. [See Deut. 31 on verse 17.]"}],"13":[{"catchword":null,"tekst":"Thus with your mouth you have magnified yourselves against me, [that is, spoken stoutly and proudly against me, as it were daring me with boasting and bragging language. See of this phrase Psalms 35 on verse 26] and (have) multiplied your words against me: [that is, ye have used much prating against me. The Hebrew Athar, or Gnathar signifieth multitude or abundance of words or things, for the most part in a good sense, when it is taken for much entreting and earnest, or servant praying, wherein a multitude of words is used or abundance of all manner of blessings. See Gen. 25.21. Exod. 8.8. c. Jer 33:6. But here of the proud Edomites it is taken in a bad sense, for much prattling and prating. So it is used above for abundance of Idolatrous incense] I have heard it."}],"14":[{"catchword":null,"tekst":"Thus saith the Lord LORD, as the whole land joyceth, (so) [this article is here inserted to fill up the sense from the following verse] will make thee desolate. [As the whole land of the Edomites rejoiced at Israel&acirc;&euro;&trade;s desolation, so will I also for it make their whole land again desolate? See the next verse. Others, when the whole earth rejoyceth, (then) will I, &c. that is, when there shall be ever where joy and gladness for the mercies that I will bestow on my people, principally by the Messiah, then shalt thou be plagued and be made desolate.]"}],"15":[{"catchword":null,"tekst":"As thou didst rejoice [Heb. According to thy joy. Compare above verse 11. and elsewhere often] at the inheritance of the house of Israel, because it was made desolate; [that is, didst rejoice at the desolation of the land of Canaan, which I gave unto Israel (and not unto thee) for an inheritance] so will I do unto thee: Mount Seir, and all Edom, shall be wholly a desolation: [as the whole land of Edom shouted at Israel&acirc;&euro;&trade;s calamity, as is said in the former verse] and they shall know that I am the LORD."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  document.getElementById('hfdnav').innerHTML =

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
