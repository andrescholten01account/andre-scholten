de water uit van onder de drempel van het huis naar het oosten; want de voorkant van het huis lag naar het oosten, en het water daalde af van onderen, uit de rechterzijde van het huis, ten zuiden van het altaar.","2":"En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde.","3":"Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels.","4":"Toen mat hij nog duizend el, en liet mij door het water gaan, en het water kwam tot aan de knieën; en hij mat nog duizend, en liet mij gaan, en het water kwam tot aan de lenden.","5":"Vervolgens mat hij nog duizend, en het was een beek waar ik niet doorheen kon gaan; want het water was hoog geworden, water om in te zwemmen, een beek waar men niet doorheen kon gaan.","6":"En hij zei tegen mij: Hebt u dit gezien, mensenkind? Toen bracht hij mij, en liet mij terugkeren naar de oever van de beek.","7":"Toen ik terugkeerde, zie, zo stonden er aan de oever van de beek heel veel bomen, aan deze en aan de andere kant.","8":"Toen zei hij tegen mij: Dit water stroomt uit naar het oostelijke gebied, en daalt af in het vlakke veld; daarna komt het in de zee; wanneer het in de zee is uitgekomen, wordt het water gezond.","9":"Ja, het zal gebeuren dat elk levend wezen dat er wemelt, zal leven, overal waarheen een van de twee beken zal komen; en daar zal heel veel vis zijn, omdat dit water daarheen zal zijn gekomen, en het zal gezond worden, en alles zal leven, waarheen deze beek zal komen.","10":"Ook zal het gebeuren dat er vissers bij zullen staan, van En-Gedi tot En-Eglaim toe; daar zullen plaatsen zijn om netten uit te spreiden; de vis zal naar zijn soort zijn als de vis van de grote zee, heel talrijk.","11":"Maar de modderige plaatsen en moerassen ervan zullen niet gezond worden, ze zijn aan het zout overgegeven.","12":"Aan de beek nu, aan de oever ervan, zal aan deze en aan de andere kant allerlei voedselgebomente opgroeien, waarvan het blad niet zal afvallen, en de vrucht ervan niet zal vergaan; het zal elke maand nieuwe vruchten voortbrengen, want het water ervan stroomt uit het heiligdom; en de vrucht ervan zal tot voedsel zijn, en het blad ervan tot genezing.","13":"Zo zegt de Heere HEERE: Dit zal het gebied zijn, waarnaar u het land in bezit zult nemen, naar de twaalf stammen van Israël: Jozef *twee* delen.","14":"En u zult het erven, de een evenals de ander; *over* dit land heb Ik Mijn hand opgeheven, dat Ik het aan uw vaderen zou geven; en dit land zal u ten deel vallen als erfenis.","15":"Dit nu zal het gebied van het land zijn: aan de noordkant, vanaf de grote zee, de weg van Hethlon, waar men komt bij Zedad.","16":"Hamath, Berotha, Sibraim, dat tussen het gebied van Damaskus en het gebied van Hamath ligt; Hazar-Hattichon, dat bij het gebied van Havran ligt.","17":"Zo zal het gebied vanaf de zee zijn: Hazar-Enon, het gebied van Damaskus, en het noorden noordwaarts, en het gebied van Hamath; en dat zal de noordkant zijn.","18":"De oostkant nu zult u meten van tussen Havran en tussen Damaskus en tussen Gilead en tussen het land van Israël, langs de Jordaan, vanaf het gebied tot de Oostzee toe; en dat zal de oostkant zijn.","19":"En de zuidkant, zuidwaarts vanaf Thamar tot aan het twistwater van Kades, vervolgens langs de beek tot aan de grote zee; en dat zal de zuidkant zuidwaarts zijn.","20":"En de westkant, de grote zee, vanaf het gebied tot waar men recht tegenover Hamath komt; dat zal de westkant zijn.","21":"Dit land nu zult u onder elkaar verdelen naar de stammen van Israël.","22":"Maar het zal gebeuren dat u het door loting zult laten toevallen als erfenis, voor u en voor de vreemdelingen die in uw midden wonen, die in uw midden kinderen zullen krijgen; en zij zullen voor u zijn als een geboren inwoner onder de kinderen van Israël; zij zullen met u in erfenis vallen, in het midden van de stammen van Israël.","23":"Ook zal het gebeuren dat u, in de stam waarbij de vreemdeling woont, hem daar zijn erfenis zult geven, spreekt de Heere HEERE."},"SV":{"1":"Daarna bracht hij mij weder tot de deur van het huis, en ziet, er vloten wateren uit, van onder den dorpel des huizes naar het oosten; want het voorste deel van het huis was *in* het oosten, en de wateren daalden af van onderen, uit de rechterzijde des huizes, van het zuiden des altaars.","2":"En hij bracht mij uit *door* den weg van de noorderpoort, en voerde mij om *door* den weg van buiten, tot de buitenpoort, den weg, die naar het oosten ziet; en ziet, de wateren sprongen uit de rechterzijde.","3":"Als *nu* die man *naar* het oosten uitging, zo was er een meetsnoer in zijn hand; en hij mat duizend ellen, en deed mij door de wateren doorgaan, *en* de wateren raakten tot aan de enkelen.","4":"Toen mat hij *nog* duizend *ellen*, en deed mij door de wateren doorgaan, *en* de wateren raakten tot aan de knieën; en hij mat *nog* duizend, en deed mij doorgaan, *en* de wateren raakten tot aan de lenden.","5":"Voorts mat hij *nog* duizend, *en* het was een beek, waar ik niet kon doorgaan; want de wateren waren hoge wateren, waar men door zwemmen moest, een beek, waar men niet kon doorgaan.","6":"En hij zeide tot mij: Hebt gij het gezien, mensenkind? Toen voerde hij mij, en bracht mij weder tot aan den oever der beek.","7":"Als ik wederkeerde, ziet, zo was er aan den oever der beek zeer veel geboomte, van deze en van gene zijde.","8":"Toen zeide hij tot mij: Deze wateren vlieten uit naar het voorste Galilea, en dalen af in het vlakke veld; daarna komen zij in de zee; in de zee uitgebracht zijnde, zo worden de wateren gezond.","9":"Ja, het zal geschieden, *dat* alle levende ziel, die er wemelt, overal, waarhenen een der twee beken zal komen, leven zal, en daar zal zeer veel vis zijn, omdat deze wateren daarhenen zullen gekomen zijn, en zij zullen gezond worden, en het zal leven, alles, waarhenen deze beek zal komen.","10":"Ook zal het geschieden, dat er vissers aan dezelve zullen staan , van En-gedi aan tot En-eglaim toe; daar zullen *plaatsen* zijn *tot* uitspreiding der netten; haar vis zal naar zijn aard wezen als de vis van de grote zee, zeer menigvuldig.","11":"Doch haar modderige plaatsen en haar moerassen zullen niet gezond worden, zij zijn tot zout overgegeven.","12":"Aan de beek nu, aan haar oever, zal van deze en van gene zijde opgaan allerlei spijsgeboomte, welks blad niet zal afvallen, noch de vrucht daarvan vergaan; in zijn maanden zal het nieuwe vruchten voortbrengen; want zijn wateren vlieten uit het heiligdom; en zijn vrucht zal zijn tot spijze, en zijn blad tot heling.","13":"Alzo zegt de Heere HEERE: Dit zal de landpale zijn, *naar* dewelke gij het land ten erve zult nemen, naar de twaalf stammen Israëls: Jozef *twee* snoeren.","14":"En gij zult dat erven, de een zowel als de ander; *over* hetwelk Ik Mijn hand heb opgeheven, dat Ik het uw vaderen zou geven; en ditzelve land zal ulieden in erfenis vallen.","15":"Dit nu zal de landpale des lands zijn: aan den noorderhoek, van de grote zee af, den weg van Hethlon, waar men komt te Zedad.","16":"Hamath, Berotha, Sibraim, dat tussen de landpale van Damaskus en tussen de landpale van Hamath is; Hazar Hattichon, dat aan de landpale van Havran is.","17":"Alzo zal de landpale van de zee af zijn, Hazar-enon, de landpale van Damaskus, en het noorden noordwaarts, en de landpale van Hamath; en *dat* zal de noorderhoek zijn.","18":"Den oosterhoek nu zult gijlieden meten van tussen Havran, en van tussen Damaskus, en van tussen Gilead, en van tussen het land Israëls aan den Jordaan, van de landpale af tot de Oostzee toe; en *dat* zal de oosterhoek zijn.","19":"En den zuiderhoek zuidwaarts van Thamar af, tot aan het twistwater van Kades, *voorts* naar de beek henen, tot aan de grote zee; en *dat* zal de zuiderhoek zuidwaarts zijn.","20":"En den westerhoek, de grote zee, van de landpale af tot daar men recht tegenover Hamath komt; dat zal de westerhoek zijn.","21":"Ditzelve land nu zult gij ulieden uitdelen naar de stammen Israëls.","22":"Maar het zal geschieden, dat gij hetzelve zult doen vallen in erfenis voor ulieden, en voor de vreemdelingen, die in het midden van u verkeren, die kinderen in het midden van u zullen gewonnen hebben; en zij zullen ulieden zijn, als een inboorling onder de kinderen Israëls; zij zullen met ulieden in erfenis vallen, in het midden der stammen Israëls.","23":"Ook zal het geschieden, in den stam, bij welken de vreemdeling verkeert, aldaar zult gij *hem* zijn erfenis geven, spreekt de Heere HEERE."},"KJV":{"1":"Afterward he brought me again unto the door of the house; and, behold, waters issued out from under the threshold of the house eastward: for the forefront of the house *stood toward* the east, and the waters came down from under from the right side of the house, at the south *side* of the altar.","2":"Then brought he me out of the way of the gate northward, and led me about the way without unto the utter gate by the way that looketh eastward; and, behold, there ran out waters on the right side.","3":"And when the man that had the line in his hand went forth eastward, he measured a thousand cubits, and he brought me through the waters; the waters *were* to the ankles.","4":"Again he measured a thousand, and brought me through the waters; the waters *were* to the knees. Again he measured a thousand, and brought me through; the waters *were* to the loins.","5":"Afterward he measured a thousand; *and it was* a river that I could not pass over: for the waters were risen, waters to swim in, a river that could not be passed over.","6":"And he said unto me, Son of man, hast thou seen *this*? Then he brought me, and caused me to return to the brink of the river.","7":"Now when I had returned, behold, at the bank of the river *were* very many trees","8":"Then said he unto me, These waters issue out toward the east country, and go down into the desert, and go into the sea: *which being* brought forth into the sea, the waters shall be healed.","9":"And it shall come to pass, *that* every thing that liveth, which moveth, whithersoever the rivers shall come, shall live: and there shall be a very great multitude of fish, because these waters shall come thither: for they shall be healed; and every thing shall live whither the river cometh.","10":"And it shall come to pass, *that* the fishers shall stand upon it from Engedi even unto Eneglaim; they shall be a *place* to spread forth nets; their fish shall be according to their kinds, as the fish of the great sea, exceeding many.","11":"But the miry places thereof and the marishes thereof shall not be healed; they shall be given to salt.","12":"And by the river upon the bank thereof, on this side and on that side, shall grow all trees for meat, whose leaf shall not fade, neither shall the fruit thereof be consumed: it shall bring forth new fruit according to his months, because their waters they issued out of the sanctuary: and the fruit thereof shall be for meat, and the leaf thereof for medicine.","13":"Thus saith the Lord GOD; This *shall be* the border, whereby ye shall inherit the land according to the twelve tribes of Israel: Joseph *shall have two* portions.","14":"And ye shall inherit it, one as well as another: *concerning* the which I lifted up mine hand to give it unto your fathers: and this land shall fall unto you for inheritance.","15":"And this *shall be* the border of the land toward the north side, from the great sea, the way of Hethlon, as men go to Zedad;","16":"Hamath, Berothah, Sibraim, which *is* between the border of Damascus and the border of Hamath; Hazarhatticon, which *is* by the coast of Hauran.","17":"And the border from the sea shall be Hazarenan, the border of Damascus, and the north northward, and the border of Hamath. And *this is* the north side.","18":"And the east side ye shall measure from Hauran, and from Damascus, and from Gilead, and from the land of Israel *by* Jordan, from the border unto the east sea. And *this is* the east side.","19":"And the south side southward, from Tamar *even* to the waters of strife *in* Kadesh, the river to the great sea. And *this is* the south side southward.","20":"The west side also *shall be* the great sea from the border, till a man come over against Hamath. This *is* the west side.","21":"So shall ye divide this land unto you according to the tribes of Israel.","22":"And it shall come to pass, *that* ye shall divide it by lot for an inheritance unto you, and to the strangers that sojourn among you, which shall beget children among you: and they shall be unto you as born in the country among the children of Israel; they shall have inheritance with you among the tribes of Israel.","23":"And it shall come to pass, *that* in what tribe the stranger sojourneth, there shall ye give *him* his inheritance, saith the Lord GOD."}},"tsk":{"1":[{"kopje":"de deur","refs":["Ezech 41:2","Ezech 41:23-26"]},{"kopje":"stroomde water","refs":["Ps 46:5","Jes 30:25","Jes 55:1","Jer 2:13","Joël 3:18","Zach 13:1","Zach 14:8","Joh 7:37-39","Openb 22:1","Openb 22:17"]},{"kopje":"van onder de drempel","refs":["Ezech 47:12","Jes 2:3"]}],"2":[{"kopje":"noordpoort","refs":["Ezech 44:2","Ezech 44:4"]}],"3":[{"kopje":"die man","refs":["Ezech 40:3","Zach 2:1","Openb 11:1","Openb 21:15"]},{"kopje":"het water kwam tot aan de enkels","refs":["Luk 24:49","Hand 2:4","Hand 2:33","Hand 10:45","Hand 10:46","Hand 11:16-18"]}],"4":[{"kopje":"het water kwam tot aan de knieën","refs":["Hand 19:10-20","Rom 15:19","Kol 1:6"]}],"5":[{"kopje":"water om in te zwemmen","refs":["Jes 11:9","Dan 2:34","Dan 2:35","Hab 2:14","Matt 13:31","Matt 13:32","Openb 7:9","Openb 11:15","Openb 20:2-4"]}],"6":[{"kopje":"hebt u","refs":["Ezech 8:17","Ezech 40:4","Ezech 44:5","Jer 1:11-13","Zach 4:2","Zach 5:2","Matt 13:51"]}],"7":[{"kopje":"oever","refs":["1 Kon 9:26","2 Kon kjv\" data-code=\"H1870\">way</span> that <span class=\"wl wl-kjv\" data-code=\"H6437\">looketh</span> <span class=\"wl wl-kjv\" data-code=\"H6921\">eastward;</span> and, behold, there ran <span class=\"wl wl-kjv\" data-code=\"H6379\">out</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> on the <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> side.","3":"And when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that had the <span class=\"wl wl-kjv\" data-code=\"H6957\">line</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H6921\">eastward,</span> he <span class=\"wl wl-kjv\" data-code=\"H4058\">measured</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits,</span> and he brought me <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters;</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were to the ankles.","4":"Again he <span class=\"wl wl-kjv\" data-code=\"H4058\">measured</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and brought me <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters;</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were to the <span class=\"wl wl-kjv\" data-code=\"H1290\">knees.</span> Again he <span class=\"wl wl-kjv\" data-code=\"H4058\">measured</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and brought me <span class=\"wl wl-kjv\" data-code=\"H5674\">through;</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were to the loins.","5":"Afterward he <span class=\"wl wl-kjv\" data-code=\"H4058\">measured</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand;</span> and it was a <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> that I <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were <span class=\"wl wl-kjv\" data-code=\"H1342\">risen,</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> to swim <span class=\"wl wl-kjv\" data-code=\"H7813\">in,</span> a <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> that could not be passed over.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> this? Then he <span class=\"wl wl-kjv\" data-code=\"H3212\">brought</span> me, and caused me to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to the <span class=\"wl wl-kjv\" data-code=\"H8193\">brink</span> of the river.","7":"Now when I had <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> behold, at the <span class=\"wl wl-kjv\" data-code=\"H8193\">bank</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> trees","8":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto me, These <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> issue <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> toward the <span class=\"wl wl-kjv\" data-code=\"H6930\">east</span> <span class=\"wl wl-kjv\" data-code=\"H1552\">country,</span> and go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the <span class=\"wl wl-kjv\" data-code=\"H6160\">desert,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> which being brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> shall be healed.","9":"And it shall come to pass, that every <span class=\"wl wl-kjv\" data-code=\"H5315\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> which <span class=\"wl wl-kjv\" data-code=\"H8317\">moveth,</span> whithersoever the <span class=\"wl wl-kjv\" data-code=\"H5158\">rivers</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live:</span> and there shall be a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> multitude of <span class=\"wl wl-kjv\" data-code=\"H1710\">fish,</span> because these <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> thither: for they shall be <span class=\"wl wl-kjv\" data-code=\"H7495\">healed;</span> and every thing shall <span class=\"wl wl-kjv\" data-code=\"H2425\">live</span> whither the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> cometh.","10":"And it shall come to pass, that the <span class=\"wl wl-kjv\" data-code=\"H1728\">fishers</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> upon it from <span class=\"wl wl-kjv\" data-code=\"H5872\">Engedi</span> even unto <span class=\"wl wl-kjv\" data-code=\"H5882\">Eneglaim;</span> they shall be a place to spread <span class=\"wl wl-kjv\" data-code=\"H4894\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2764\">nets;</span> their <span class=\"wl wl-kjv\" data-code=\"H1710\">fish</span> shall be according to their <span class=\"wl wl-kjv\" data-code=\"H4327\">kinds,</span> as the <span class=\"wl wl-kjv\" data-code=\"H1710\">fish</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">grea ar of burnt-offering that before the holy place: of which see above chapter 43.13, c. a type of our Lord Jesus Christ, and his only sacrifice upon the cross: where he merited for such the gifts of the Holy Ghost, which he sendeth to us from the father; typified (as some conceive) by the water that flowed forth out of his side, Job 19:34, 35.]"}],"2":[{"catchword":null,"tekst":"And he brought me out (by) the way of north-gate and carried me about (by) the way without unto the outer-gate, the way that looketh toward the east: and behold the waters sprang out of the right side."}],"3":[{"catchword":null,"tekst":"(Now) when that man went forth (toward) the east, there was then a measuring line in his hand: and he measured a thousand ells, and caused me to pass through the waters, (and) the waters reached unto the ankles, [Heb. (they were) waters of the ankles; and so in the sequel, waters of the knee waters of the loins, typifying the progress, course and increase of the revelation of the gospel together with the divers measures of the gifts of the holy ghost in this life, and the perfection thereof in the life to come.]"}],"4":[{"catchword":null,"tekst":"Then he measured (yet), and caused me to go through waters, and the waters reached unto the knees: and he measured (yet) a thousand, and caused me to go through, c the waters reached unto the loins."}],"5":[{"catchword":null,"tekst":"Moreover, he measured (yet) a thousand, and it was a brook where I could not pas through: for the waters were high waters, where one was sain to swim through; [Heb. waters of swimming] a brook were one could not pass through."}],"6":[{"catchword":null,"tekst":"And he said unto me; child of man, hast thou seen it? [That is, heeded all; whereby the prophet was instructed diligently to heed or mind all things] then he caused me, and brought me again to the brink [Heb. lip. And so in the next verse] of the brook."}],"7":[{"catchword":null,"tekst":"When I returned, behold there were then at the /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
