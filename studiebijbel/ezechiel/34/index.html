Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden?","3":"U eet het vette, en bekleedt u met de wol, u slacht het gemeste, *maar* de schapen weidt u niet.","4":"De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.","5":"Zo zijn zij verstrooid, omdat er geen herder is; en zij zijn al het wilde gedierte van het veld tot voedsel geworden, omdat zij verstrooid waren.","6":"Mijn schapen dolen op alle bergen en op elke hoge heuvel, ja, Mijn schapen zijn verstrooid over de hele aardbodem; en er is niemand, die ernaar vraagt, en niemand, die ze zoekt.","7":"Daarom, u herders! Hoor het woord van de HEERE!","8":"*Zo waarachtig als* Ik leef, spreekt de Heere HEERE, zeker! Omdat Mijn schapen geworden zijn tot een roof, en Mijn schapen al het wilde gedierte van het veld tot voedsel geworden zijn, omdat er geen herder is, en Mijn herders naar Mijn schapen niet vragen; en de herders weiden zichzelf, maar Mijn schapen weiden zij niet;","9":"Daarom, u herders! Hoor het woord van de HEERE!","10":"Zo zegt de Heere HEERE: Zie, Ik *heb het* tegen de herders, en zal Mijn schapen van hun hand eisen, en zal ze van het weiden van de schapen doen ophouden, zodat de herders zichzelf niet meer zullen weiden; en Ik zal Mijn schapen uit hun mond rukken, zodat zij hun niet *meer* tot voedsel zullen zijn.","11":"Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken.","12":"Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid.","13":"En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.","14":"Op een goede weide zal Ik ze weiden, en op de hoge bergen van Israël zal hun kooi zijn; daar zullen zij neerliggen in een goede kooi, en zullen weiden *in* een vette weide, op de bergen van Israël.","15":"Ik zal Mijn schapen weiden, en Ik zal ze laten neerliggen, spreekt de Heere HEERE.","16":"Het verlorene zal Ik zoeken, en het weggedrevene zal Ik terugbrengen, en het gebrokene zal Ik verbinden, en het zieke zal Ik sterken; maar het vette en het sterke zal Ik verdelgen, Ik zal ze weiden met oordeel.","17":"Want u, o Mijn schapen! De Heere HEERE zegt zo: Zie, Ik zal richten tussen klein vee en klein vee, tussen de rammen en de bokken.","18":"Is het u te weinig, dat u de goede weide afweidt? Zult u ook nog het overige van uw weide met uw voeten vertrappen? En zult u het diepe water drinken, en het overgelatene met uw voeten vermodderen?","19":"Mijn schapen dan, zullen zij afweiden, wat met uw voeten vertrapt is, en drinken, wat met uw voeten vermodderd is?","20":"Daarom zegt de Heere HEERE zo tegen hen: Zie, Ik, ja, Ik zal richten tussen het vette klein vee, en tussen het magere klein vee.","21":"Omdat u al de zwakken met de zijde en met de schouder verdringt, en met uw hoorns stoot, totdat u ze naar buiten toe verstrooid hebt;","22":"Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.","23":"En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, *namelijk* Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.","24":"En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.","25":"En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.","26":"Want Ik zal hen, en de plaatsen rondom Mijn heuvel, stellen *tot* een zegen; en Ik zal de plasregen doen neerdalen op zijn tijd, plasregens van zegen zullen er zijn.","27":"En het geboomte van het veld zal zijn vrucht geven, en het land zal zijn opbrengst geven, en zij zullen zeker zijn in hun land; en zullen weten, dat Ik de HEERE ben, als Ik de disselbomen van hun juk zal hebben verbroken, en hen gered heb uit de hand van hen die zich door hen deden dienen.","28":"En zij zullen de heidenen niet meer tot een roof zijn, en het wilde gedierte van de aarde zal ze niet *meer* verslinden; maar zij zullen zeker wonen, en er zal niemand zijn, die ze verschrikt.","29":"En Ik zal hun een plant van naam doen opkomen; en zij zullen niet meer weggeraapt worden door honger in het land, en de smaad van de heidenen niet meer dragen.","30":"Maar zij zullen weten, dat Ik, de HEERE, hun God, met hen ben, en dat zij Mijn volk zijn, het huis van Israël, spreekt de Heere HEERE.","31":"U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; *maar* Ik ben uw God, spreekt de Heere HEERE."},"SV":{"1":"En des HEEREN woord geschiedde tot mij, zeggende:","2":"Mensenkind! profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Alzo zegt de Heere HEERE: Wee den herderen Israëls, die zichzelven weiden! zullen niet de herders de schapen weiden?","3":"Gij eet het vette, en bekleedt u met de wol, gij slacht het gemeste, *maar* de schapen weidt gij niet.","4":"De zwakke sterkt gij niet, en het kranke heelt gij niet, en het gebrokene verbindt gij niet, en het weggedrevene brengt gij niet weder, en het verlorene zoekt gij niet; maar gij heerst over hen met strengheid en met hardigheid.","5":"Alzo zijn zij verstrooid, omdat er geen herder is; en zij zijn al het wild gedierte des velds tot spijze geworden, dewijl zij verstrooid waren.","6":"Mijn schapen dolen op alle bergen en op allen hogen heuvel, ja, Mijn schapen zijn verstrooid op den gansen aardbodem; en er is niemand, die er naar vraagt, en niemand, die ze zoekt.","7":"Daarom, gij herders! hoort des HEEREN woord!","8":"*Zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zo *Ik* niet! Omdat Mijn schapen geworden zijn tot een roof, en Mijn schapen al het wild gedierte des velds tot spijze geworden zijn, omdat er geen herder is, en Mijn herders naar Mijn schapen niet vragen; en de herders weiden zichzelven, maar Mijn schapen weiden zij niet;","9":"Daarom, gij herders! hoort des HEEREN woord!","10":"Alzo zegt de Heere HEERE: Ziet, Ik *wil* aan de herders, en zal Mijn schapen van hun hand eisen, en zal ze van het weiden der schapen doen ophouden, zodat de herders zichzelven niet meer zullen weiden; en Ik zal Mijn schapen uit hun mond rukken, zodat zij hun niet *meer* tot spijze zullen zijn.","11":"Want zo zegt de Heere HEERE: Ziet, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken.","12":"Gelijk een herder zijn kudde opzoekt, ten dage als hij in het midden zijner verspreide schapen is, alzo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarhenen zij verstrooid zijn, ten dage der wolke en der donkerheid.","13":"En Ik zal ze uitvoeren van de volken, en zal ze vergaderen uit de landen, en brengen ze in hun land; en Ik zal ze weiden op de bergen Israëls, bij de stromen en in alle bewoonbare plaatsen des lands.","14":"Op een goede weide zal Ik ze weiden, en op de hoge bergen Israëls zal hun kooi zijn; aldaar zullen zij nederliggen in een goede kooi, en zullen weiden *in* een vette weide, op de bergen Israëls.","15":"Ik zal Mijn schapen weiden, en Ik zal ze legeren, spreekt de Heere HEERE.","16":"Het verlorene zal Ik zoeken, en het weggedrevene zal Ik wederbrengen, en het gebrokene zal Ik verbinden, en het kranke zal Ik sterken; maar het vette en het sterke zal Ik verdelgen, Ik zal ze weiden met oordeel.","17":"Want gij, o Mijn schapen! de Heere HEERE zegt alzo: Ziet, Ik zal richten tussen klein vee en klein vee, tussen de rammen en de bokken.","18":"Is het u te weinig, dat gij de goede weide afweidt? Zult gij nog het overige uwer weide met uw voeten vertreden? En zult gij de bezonkene wateren drinken, en de overgelatene met uw voeten vermodderen?","19":"Mijn schapen dan, zullen zij afweiden, wat met uw voeten vertreden is, en drinken, wat met uw voeten vermodderd is?","20":"Daarom zegt de Heere HEERE alzo tot hen: Ziet Ik, ja, Ik zal richten tussen het vette klein vee, en tussen het magere klein vee.","21":"Omdat gij al de zwakken met de zijde en met den schouder verdringt, en met uw hoornen stoot, totdat gij dezelve naar buiten toe verstrooid hebt;","22":"Daarom zal Ik Mijn schapen verlossen, dat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.","23":"En Ik zal een enigen Herder over hen verwekken, en Hij zal hen weiden, *namelijk* Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.","24":"En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn in het midden van hen, Ik, de HEERE, heb het gesproken.","25":"En Ik zal een verbond des vredes met hen maken, en zal het boos gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.","26":"Want Ik zal dezelve, en de plaatsen rondom Mijn heuvel, stellen *tot* een zegen; en Ik zal den plasregen doen nederdalen op zijn tijd, plasregens van zegen zullen er zijn.","27":"En het geboomte des velds zal zijn vrucht geven, en het land zal zijn inkomst geven, en zij zullen zeker zijn in hun land; en zullen weten, dat Ik de HEERE ben, als Ik de disselbomen huns juks zal hebben verbroken, en hen gerukt uit de hand dergenen, die zich van hen deden dienen.","28":"En zij zullen den heidenen niet meer ten roof zijn, en het wild gedierte der aarde zal ze niet *meer* vreten; maar zij zullen zeker wonen, en er zal niemand zijn, die ze verschrikke.","29":"En Ik zal hun een plant van naam verwekken; en zij zullen niet meer weggeraapt worden door honger in het land, en den smaad der heidenen niet meer dragen.","30":"Maar zij zullen weten, dat Ik, de HEERE, hun God, met hen ben, en dat zij Mijn volk zijn, het huis Israëls, spreekt de Heere HEERE.","31":"Gij nu, o Mijn schapen, schapen Mijner weide! gij zijt mensen; *maar* Ik ben uw God, spreekt de Heere HEERE."},"KJV":{"1":"And the word of the LORD came unto me, saying,","2":"Son of man, prophesy against the shepherds of Israel, prophesy, and say unto them, Thus saith the Lord GOD unto the shepherds; Woe *be* to the shepherds of Israel that do feed themselves! should not the shepherds feed the flocks?","3":"Ye eat the fat, and ye clothe you with the wool, ye kill them that are fed: *but* ye feed not the flock.","4":"The diseased have ye not strengthened, neither have ye healed that which was sick, neither have ye bound up *that which was* broken, neither have ye brought again that which was driven away, neither have ye sought that which was lost; but with force and with cruelty have ye ruled","5":"And they were scattered, because *there is* no shepherd: and they became meat to all the beasts of the field, when they were scattered.","6":"My sheep wandered through all the mountains, and upon every high hill: yea, my flock was scattered upon all the face of the earth, and none did search or seek","7":"Therefore, ye shepherds, hear the word of the LORD;","8":"*As* I live, saith the Lord GOD, surely because my flock became a prey, and my flock became meat to every beast of the field, because *there was* no shepherd, neither did my shepherds search for my flock, but the shepherds fed themselves, and fed not my flock;","9":"Therefore, O ye shepherds, hear the word of the LORD;","10":"Thus saith the Lord GOD; Behold, I *am* against the shepherds; and I will require my flock at their hand, and cause them to cease from feeding the flock; neither shall the shepherds feed themselves any more; for I will deliver my flock from their mouth, that they may not be meat","11":"For thus saith the Lord GOD; Behold, I, *even* I, will both search my sheep, and seek them out.","12":"As a shepherd seeketh out his flock in the day that he is among his sheep *that are* scattered; so will I seek out my sheep, and will deliver them out of all places where they have been scattered in the cloudy and dark day.","13":"And I will bring them out from the people, and gather them from the countries, and will bring them to their own land, and feed them upon the mountains of Israel by the rivers, and in all the inhabited places of the country.","14":"I will feed them in a good pasture, and upon the high mountains of Israel shall their fold be: there shall they lie in a good fold, and *in* a fat pasture shall they feed upon the mountains of Israel.","15":"I will feed my flock, and I will cause them to lie down, saith the Lord GOD.","16":"I will seek that which was lost, and bring again that which was driven away, and will bind up *that which was* broken, and will strengthen that which was sick: but I will destroy the fat and the strong; I will feed them with judgment.","17":"And *as for* you, O my flock, thus saith the Lord GOD; Behold, I judge between cattle and cattle, between the rams and the he goats.","18":"*Seemeth it* a small thing unto you to have eaten up the good pasture, but ye must tread down with your feet the residue of your pastures? and to have drunk of the deep waters, but ye must foul the residue with your feet?","19":"And *as for* my flock, they eat that which ye have trodden with your feet; and they drink that which ye have fouled with your feet.","20":"Therefore thus saith the Lord GOD unto them; Behold, I, *even* I, will judge between the fat cattle and between the lean cattle.","21":"Because ye have thrust with side and with shoulder, and pushed all the diseased with your horns, till ye have scattered them abroad;","22":"Therefore will I save my flock, and they shall no more be a prey; and I will judge between cattle and cattle.","23":"And I will set up one shepherd over them, and he shall feed them, *even* my servant David; he shall feed them, and he shall be their shepherd.","24":"And I the LORD will be their God, and my servant David a prince among them; I the LORD have spoken","25":"And I will make with them a covenant of peace, and will cause the evil beasts to cease out of the land: and they shall dwell safely in the wilderness, and sleep in the woods.","26":"And I will make them and the places round about my hill a blessing; and I will cause the shower to come down in his season; there shall be showers of blessing.","27":"And the tree of the field shall yield her fruit, and the earth shall yield her increase, and they shall be safe in their land, and shall know that I *am* the LORD, when I have broken the bands of their yoke, and delivered them out of the hand of those that served","28":"And they shall no more be a prey to the heathen, neither shall the beast of the land devour them; but they shall dwell safely, and none shall make *them* afraid.","29":"And I will raise up for them a plant of renown, and they shall be no more consumed with hunger in the land, neither bear the shame of the heathen","30":"Thus shall they know that I the LORD their God *am* with them, and *that* they, *even* the house of Israel, *are* my people, saith the Lord GOD.","31":"And ye my flock, the flock of my pasture, *are* men, *and* I *am* your God, saith the Lord GOD."}},"tsk":{"2":[{"kopje":"de herders","refs":["Ezech 33:24","Jer 2:8","Jer 3:15","Jer 10:21","Jer 12:10","Joh 10:1","Joh 10:2","Joh 10:12"]},{"kopje":"Wee","refs":["Ezech 34:8-10","Ezech 13:19","Jer 23:1","Micha 3:1-3","Micha 3:11","Micha 3:12","Zef 3:3","Zef 3:4","Zach 11:17","Matt 24:48-51","Luk 12:42-46","Luk 20:46","Luk 20:47","Rom 16:18","2 Petr 2:3"]},{"kopje":"weiden","refs":["2 Sam 5:2","Ps 78:71","Ps 78:72","Jes 40:11","Joh 21:15-17","Hand 20:26","Hand 20:29","1 Petr 5:2-4"]}],"3":[{"kopje":"eet","refs":["Jes 56:11","Jes 56: -code=\"H2022\">mountains,</span> and upon every <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> <span class=\"wl wl-kjv\" data-code=\"H1389\">hill:</span> yea, my <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> was <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> upon all the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and none did <span class=\"wl wl-kjv\" data-code=\"H1875\">search</span> or seek","7":"Therefore, ye <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the LORD;","8":"As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> surely because my <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> became a <span class=\"wl wl-kjv\" data-code=\"H957\">prey,</span> and my <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> became <span class=\"wl wl-kjv\" data-code=\"H402\">meat</span> to every <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> because there was no <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd,</span> neither did my <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">search</span> for my <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> but the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">fed</span> themselves, and <span class=\"wl wl-kjv\" data-code=\"H7462\">fed</span> not my flock;","9":"Therefore, O ye <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds,</span> <span class=\"wl w gt."}],"6":[{"catchword":"op den gansen aardbodem;","tekst":"Of, in het ganse land."}],"8":[{"catchword":"zo Ik niet","tekst":"Dit is een bijzonderlijke afgebroken rede, in het eedzweren gebruikelijk [gelijk elders dikwijls] die men aanvullen moet uit vs.10. Alsof de Heere zeide: Zo Ik hen niet straffe! Mij niet tegen hen stelle enz. Zie Num 14:23 . Zulks is ook in onze taal [en andere] zeer gebruikelijk bij goede en kwade mensen. Zo ik dit of dat doe, zo ik dit of dat niet doe, enz. zo moet, enz. vergelijk ook Gen 14:23 , enz."}],"10":[{"catchword":"wil aan de herders,","tekst":"Zie boven Eze 13:8 ."},{"catchword":"eisen,","tekst":"Gelijk boven Eze 3:18 . Zie Gen 42:22 ."},{"catchword":"ophouden,","tekst":"Dat is, Ik zal hen van hun staaf afzetten, omdat zij slechts den bloten naam, maar niet de daad van herders hebben."}],"12":[{"catchword":"Gelijk een herder zijn kudde opzoekt,","tekst":"Hebreeuws, naar de opzoeking van een herder, gelijk elders."},{"catchword":"ten dage","tekst":"Ten tijde als de kudde jammerlijk verstrooid is, en Hij komt om bezoeking te doen en te zien wie er ontbreekt en waar zij mogen zijn, om dezelve weder bijeen te brengen."},{"catchword":"dage der wolke en der donkerheid","tekst":"Dat is, ten tijde der droevige ellenden, waarmede Ik hen rechtvaardiglijk bezocht heb. Vergelijk Joe 2:2 , met de aantekening."}],"13":[{"catchword":"land;","tekst":"Lichamelijk uit Babel, enz. in het land Kanaän en geestelijk tot mijne kerk door den Messias, enz."}],"14":[{"catchword":"hoge bergen Israëls","tekst":"Hebreeuws, op de bergen der hoogten van Israël."}],"16":[{"catchword":"vette en het sterke zal Ik verdelgen,","tekst":"Dat is, die door hun rijkdom en macht weelderig en dartel zijn geworden, rebellerende tegen mij [gelijk Deu 32:15 ] , en hunne broeders onderdrukkende. Vergelijk de manier van spreken met Psa 22:30 ; Isa 5:17 , en Isa 10:16 ; Amo 4:1 , met de aantekening, enz."},{"catchword":"oordeel","tekst":"Of, Ik zal ze recht, bescheidenlijk weiden. Vergelijk Jer 10:24 ."}],"17":[{"catchword":"klein vee en klein vee,","tekst":"Versta, van schapen of geiten. Zie Num 15:11 ; Deu 14:4 , en Deu 17:1 , enz. De mening is: Ik zal de oprechte gelovigen van de huichelaars, die in mijne kerk zijn, onderscheiden, en hen van het geweld der valse broeders verlossen. Alzo onder vs.22. Vergelijk boven vs.10, hfdst.37, 38; Mat 25:32 , enz."}],"18":[{"catchword":"bezonkene wateren drinken,","tekst":"Hebreeuws, de zinking, of het gezonkene der wateren; dat is, klare wateren, welker vuiligheid neergezet en op den grond gezonken is; vergelijk boven Eze 32:14 ."},{"catchword":"overgelatene","tekst":"Als gij genoeg gedronken hebt van het klare water, dan de rest vuil maken voor een ander; alsof de Heere zeide: Het is onverdragelijk dat gij, mijnen zegen zo overvloediglijk genietende, daarmede nog niet vergenoegd zijt, maar moet daarenboven uwen armen en zwakken medebroeders het weinige, dat voor hen zou zijn, bederven en onnut maken."}],"19":[{"catchword":"Mijn schapen dan,","tekst":"Met verfoeiing van de onbillijkheid gesproken."},{"catchword":"wat met uw voeten vertreden is,","tekst":"Hebreeuws, de vertreding uwer voeten. Idem, de vermoddering uwer voeten."}],"20":[{"catchword":"tot hen","tekst":"Of, van."},{"catchword":"vette klein vee,","tekst":"Zie boven vs.16."}],"21":[{"catchword":"verdringt,","tekst":"Hebreeuws, stoot; dat is, kwetst met drukken en dringen, dat zij bij u niet kunnen duren."}],"23":[{"catchword":"knecht David;","tekst":"Den Messias, onzen Heere Jezus Christus, Davids Zoon naar het vlees, en des Vaders knecht naar zijn Middelaarsambt. Zie Isa 42:1 , en wijders 2Sa 22:51 ; Jer 23:5 , en Jer 30:9 , en vergelijk Isa 40:11 , onder Eze 37:24 ; Joh 10:11 , enz.; Heb 13:20 ; 1Pe 2:25 , en 1Pe 5:4 ."}],"24":[{"catchword":"God zijn;","tekst":"Dat is, Heiland. Zie Gen 17:7 ; Lev 18:2 , en dat door zijnen Zoon, dien Hij ons tot een profeet, priester en koning gegeven heeft."},{"catchword":"Vorst zijn","tekst":"Of, prins. Vergelijk Jos 5:14-15 ; Isa 9:5 ; Act 5:31 ."},{"catchword":"midden van hen,","tekst":"Vergelijk Mat 18:20 , en Mat 28:20 ; Rev 1:13 ."}],"25":[{"catchword":"verbond","tekst":"Zie Jer 31:31 ."},{"catchword":"vredes met hen maken,","tekst":"Zie Gen 37:14 ; Jdg 6:24 , en vergelijk Isa 11:6 , Isa 11:9 , en Isa 35:9 ; Jer 33:6 , Jer 33:9 , onder Eze 37:26 ; Hos 2:18 ."},{"catchword":"zeker wonen in de woestijn,","tekst":"Hebreeuws, in zekerheid, of vertrouwen, gelijk vs.27,28, en elders dikwijls."}],"26":[{"catchword":"dezelve,","tekst":"Te weten woestijn en wouden, waarin mijne schapen legeren, waarop het voorgaande en volgende schijnt te zien; of dezelve, te weten schapen."},{"catchword":"zegen;","tekst":"Dat is, met mijn goddelijken zegen zo overvloediglijk begenadigen, dat zij als louter zegen en een voorbeeld daarvan zullen zijn. Vergelijk Gen 12:2 , met de aantekening. De geestelijke zegeningen worden hier door lichamelijke afgebeeld. Vergelijk Joe 2:23 ."}],"27":[{"catchword":"inkomst geven,","tekst":"Vergelijk Lev 26:4 ."},{"catchword":"disselbomen","tekst":"Zie Jer 27:2 , en versta hier het geestelijke juk der slavernij onder den Satan en de zonde."},{"catchword":"deden dienen","tekst":"Of, die hen dwongen te dienen; zie Jer 22:13 , en Jer 25:14 , met de aantekening."}],"29":[{"catchword":"plant","tekst":"Den Heere Jezus Christus; vergelijk Jer 23:5 , met de aantekening."},{"catchword":"naam verwekken;","tekst":"Dat is, vermaarde, beroemde. Vergelijk de manier van spreken met Gen 6:4 . Of, een plant tot enen naam; dat is, die tot een naam [dat is, roem] zal zijn. Vergelijk Deu 26:19 ; Jer 33:9 , en onder Eze 39:13 , met de aantekening."},{"catchword":"weggeraapt worden","tekst":"Hebreeuws eigenlijk, verzameld; zie van zulk een gebruik van het Hebreeuwse woord Psa 26:9 . Anders: verteerd."},{"catchword":"smaad der heidenen","tekst":"Of, schande, schaamroodheid, die u van de heidenen is aangedaan; vergelijk onder Eze 36:6-7 , Eze 36:15 ."}],"30":[{"catchword":"met hen ben,","tekst":"Zie Gen 21:22 ."},{"catchword":"dat zij Mijn volk zijn,","tekst":"Versta, [uit het voorgaande] zij [de schapen] zullen weten dat zij mijn volk zijn; zie Deu 7:6 ."},{"catchword":"huis Israëls,","tekst":"Mijn ware kerk; zie Gal 6:16 , enz."}],"31":[{"catchword":"mensen;","tekst":"Opdat de grote ongelijkheid, die daar is tussen dien groten God en ons nietige mensen, ons niet afschrikke, noch de conscientie en bevinding van ons onvermogen ons versaagd make, zo verzekert ons God hier met een zeer lieflijke aanspraak, dat Hij, niettegenstaande zulks alles, dat beloofde genadewerk aan zijne schapen zal voltrekken, alsof Hij zeide: Weest getroost en goedsmoeds, gij mijn lieve schaapjes, Ik ben en blijf uw Heiland. Vergelijk Joh 10:28-29 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the word of the Lord came unto me, saying:"}],"2":[{"catchword":null,"tekst":"Child of man, prophesy against the shepherds of Israel: prophesy and say unto them, unto the shepherds; [the Ecclesiastical and political governours of my people. Compare this ensuing prophesy with Jeremiah chapter 23] thus saith the Lord LORD; Wo unto the shepherds of Israel that feed themselves should not the shepherd feed the sheep? [Ought they not (being contented with a convenient maintenance) principal to mind their own flock? As if God should say, surely they ought wholly so to do]"}],"3":[{"catchword":null,"tekst":"To eat the fat, [as from the sheep they cometh milk, butter, cheese, &c. compare Zach 11, 16] and clothe you with the wooll, ye kill [see of the Hebrew word Gen. 31 on verse 54. The fatted (cattel), (but) ye feed not the sheep."}],"4":[{"catchword":null,"tekst":"Ye strengthen not the weak, [Meaning sheep and so in the sequel] neither do you heal that which is sick neither do ye bind up that which was broken, neither do ye bring again that which was driven away, neither do ye seek that which was lost: [Heb. decaying, perishing; that is, that which wandreth, goeth astray and is the danger of perishing. Compare Deut. 26 on verse 5.] But ye rule over them with severity and with hardness and cruelty. Compare 1 Peter 5.3 also Exo 1:13,14 and below 27. Jer 22:13, c.]"}],"5":[{"catchword":null,"tekst":"So they are scattered because there is no shepherd: to feed them, and to provide for them a right: neither spiritual shepherd to feed them with found and wholesome doctrines; no corporal shepherd, to feed them with their fatherly and kind government: but all was clean contrary: whereby the people became utterly corrupt in faith and life, and so incurred God&acirc;&euro;&trade;s fore displeasure, and consequently were mostly pitifully plagued with all kind of miseries: for all which the wicked shepherds were most of all guilty, as followeth] and they are become meat to all the wild beasts of the field, seeing they were scattered."}],"6":[{"catchword":null,"tekst":"My sheep wonder upon all the mountains; and upon every high hill: yea my sheep are scattered upon the whole earth; [Or into all the land] and there is none that careth for them or any that seeketh them."}],"7":[{"catchword":null,"tekst":"Therefore ye shepherds hear the word of the LORD:"}],"8":[{"catchword":null,"tekst":"(As true as) I live, saith the Lord LORD: if (i) not! [This is a special abrupt kind of speech, very usual in oaths, (as elsewhere often) which must be supplied from verse 10. As if the Lord should say: if I don&acirc;&euro;&trade;t punish them! If do not set my self against them! , c. see Numb 14 on verse 13 the same is likewise very usual in our own language (and in other languages also) both among good and bad men: if I do this o that: if I do this or that, c. then let me, c. Compare also Genes. 14 on verse 23, c.] Because my sheep have become a prey and my sheep are become meat to all wild beasts of the field, because there is no shepherd; and my shepherds care not for my sheep: and the shepherds feed themselves, but they feed not my sheep:"}],"9":[{"catchword":null,"tekst":"Therefore you shepherds hear the word of the Lord:"}],"10":[{"catchword":null,"tekst":"Thus saith the Lord LORD; behold, I (will be) upon the shepherds, [see of this phrase above chapter 13.8] and will require my sheep at their hand, [as above chapter 33.18. see Genesis 42 on verse 22] and will cause them to cease from feeding the sheep. [That is, I will depose them from their office, because they have the bear name of shepherds, but are not such indeed and in truth] so that the shepherds shall no more feed themselves: and I will pluck my sheep out of their mouth so that they shall not be (any more) meat unto them."}],"11":[{"catchword":null,"tekst":"For thus saith the Lord LORD, behold I, yea, I will care for my sheep, and I will seek out."}],"12":[{"catchword":null,"tekst":"As a shepherd seeketh out his flock [Heb. according to the seeking of a shepherd, as elsewhere] in the day when he is in the midst of his dispersed sheep; [all such time as the flock is pitifully scattered, and he cometh to visit, and to see what is wanting, and they might be, to bring them again together] so will I seek out my sheep: and I will deliver them out of all places whither they are scattered in the day of the cloud and of darkness [that is, in the time of grievous miseries, wherewith I have visited them justly. Compare Joel 2.2. With the Annotat.]"}],"13":[{"catchword":null,"tekst":"And I will bring them out to the people, and I will gather them from the land, bring them into their (own) land: [Corporally, from Babel, c into the land of Canaan, and spiritually, to my church by the Messiah, c] and I will feed them upon the mountain of Israel, by the streams, and in all the inhabitable places of the land."}],"14":[{"catchword":null,"tekst":"I will feed them upon a good pasture, and upon the high mountains of Israel [Heb. upon the mountains of the height of Israel] shall their fold be; there shalt they lie down in a good fold, and shall feed (in) a fat pasture upon the mountain of Israel."}],"15":[{"catchword":null,"tekst":"I will feed my sheep, and I will cause them to lie down, saith the Lord LORD."}],"16":[{"catchword":null,"tekst":"I will seek that which was lost, and I will bring again that was driven away, and I will bind up that which was broken, and I will strengthen that which was sick, but I will destroy the fat and strong: [That is, those that by their riches and strength are grown luxurious and wanton, rebelling against me, (as Duet. 32.15.) and oppressing their brethren. Compare the phrase with Psa 22:30. Isa 5:17. and 10.16. Amos 4.1. With the Annotat, c] I will feed them with judgement. [Or I will feed them aright, discreetly. Compare Jeremiah 10 on verse 24]"}],"17":[{"catchword":null,"tekst":"For ye, O my shepherds saith the Lord LORD: behold I will judge between small cattel and small cattel, [Meaning of sheep or goats. See Num 15:11. Deut. 14.4 and 17.1, c.] between the rams and the he-goats. [the meaning is, I will distinguish true believers&acirc;&euro;&trade; from hypocrites that are in my church, and I will deliver them from my power and violence of false brethren. So below verse 22. Compare above chapter 20.37,38. Mat 25:32, c.]"}],"18":[{"catchword":null,"tekst":"Is it too little for you that you eat up the good pasture? Will ye besides tread down with your feet the residue of your pastures? And I will ye drink the waters that are sunk, [Heb. the sinning, or that which is sunk of the waters, that is, the clear waters, whose mud is settled and sunk down to the bottom. Compare above chapter 32.14.] and soul the residue with your feet? [When ye have drunk enough pure and clear water your selves, when to soul the rest for others? As if the Lord should say, it&acirc;&euro;&trade;s a thing intolerable that ye enjoying and blessing in such great plenty as ye do, yet are not contented therewith, but ye must needs also spoil and wast that little reminder that should be for your poor and weak brethren."}],"19":[{"catchword":null,"tekst":"My sheep then shall they eat that which is trodden down with your feet and drink that which is souled with your feet? [It is spoken with detestation of the injustice of the thing. [Heb. the treading down of your feet, also the fouling of your feet]"}],"20":[{"catchword":null,"tekst":"Therefore thus saith the Lord LORD unto [Or of] them: behold I, yea I will judge between the fat small cattel and between the lean small cattel. [See above verse 17]"}],"21":[{"catchword":null,"tekst":"Because ye thrust [Heb. push] with the side and with the shoulder and push with the horns all the weak ones, till ye have scattered them abroad: [that is, hurting them by pushing and crushing the, so that they are not able to subsist near you]"}],"22":[{"catchword":null,"tekst":"Therefore I will deliver my sheep that they shall be no more a prey: and I will judge between small cattel and small cattel."}],"23":[{"catchword":null,"tekst":"And I will raise up one onely shepherd over them, and he shall fees them, (namely) my servant David. [The Messiah, the Lord Jesus Christ, the son of David according the flesh, and the father&acirc;&euro;&trade;s servant according to his office of Mediatourship. See Isaiah 42 on verse 1 and further, 2 Samuel 22 on verse 51. Jeremiah 23. On verse 5 and 30.9 and compare Isa 40:11 below chapter 37.24. Job 10:11, c. Heb. 13.20. 1 Peter 2.25 and 5.4] he shall feed them, and he shall be a shepherd unto them."}],"24":[{"catchword":null,"tekst":"And I the LORD will be a God unto them; [That is, their Saviour. See Genesis 17 on verse 7. Leviticus 18 on verse 2 and that by his son, whom he hath given unto us to be our priest, prophet and king] and my servant David shall be a prince [Compare Jos 5:14,15. Isa 9:5. Act 5:31.] in the midst of them: [Compare Mat 18:20 and 28.20. Rev 1:13.] I the LORD have spoken it."}],"25":[{"catchword":null,"tekst":"And I will make the covenant of peace with them, [see Jer 31:31. see also Genseis 37 on verse 14 and Judges 6 on verse 24 and compare Isa 11:6,9 and 35.9 below chapter 37.26. Hos. 2.18.] And will cause the evil beasts to cease out of the land: and they shall dwell safely [Heb. in safety or confidence, as verse 27, 28 and elsewhere often] in the wilderness, and sleep in the woods."}],"26":[{"catchword":null,"tekst":"For I will make them, [To wit, the wilderness and woods wherein my sheep lie down, unto which the foregoing and the following words seem to have respect. Or them, wit, my sheep] and the places round about mine hill, a blessing: [that is, so abundantly grace them with my divine blessing, that they shall be as it were a pure blessing, and a pattern thereof. Compare Gen 12:4 with the Annotat.. Spiritual blessings are here represented by corporal. Compare Joel 2 on verse 23.] I will cause the showre to come down in his season; there shal be showers of blessing."}],"27":[{"catchword":null,"tekst":"And the trees of the field shal yield her fruit, and the land shal yield her increase; [Compare Lev. 26.4] and they shall be safe in their land, and shall know that I am Lord LORD, when I shal have broken the daughter-trees of their yoke. [see Jereemiah 27 on verse 2 and understand here the spiritual yoke of bondage under sin and satan] and plucked them out of the hands of those that caused themselves to be served of them [Or that compelled them to serve. See Jer 22:13 and 25.14 with the Annotat.]"}],"28":[{"catchword":null,"tekst":"And they shall no more be a prey to the heathen, neither shall the wild beasts of the earth devour them any more: but shall dwell safely and there shal be none to make them afraid."}],"29":[{"catchword":null,"tekst":"And I will raise up for them a plant [The Lord Jesus Christ. Compare Jer 23:5. With the Annotat.] Of name: [That is, a famous, a renowned plant. Compare the phrase with Gen 6:4 or a plant for a name, that is, which shall be for a name, that is, for renown of glory. Compare Deut. 26.9. Jer 33:9 and chapter 39.13. With the Annotat.] And they shall be no more taken away [Heb. properly gathered. See of such use of the Hebrews word. Psalms 26 on verse 9. Others consumed] by hunger in the land, neither hear the reproach of the heathen [or shame, blushing, which is done to you by the heathen] any more."}],"30":[{"catchword":null,"tekst":"But they shall know that I the LORD their God am with them: [See Genesis 21 on verse 22.] and that they are my people, [Understand (from the former words) they (the sheep) shall know that they are my people. See Deut. 7 on verse 6] the hose of Israel, [my true church. See Gal. 6.16, c.] saith the Lord LORD."}],"31":[{"catchword":null,"tekst":"Now ye O my sheep of my pasture, ye are men; (but) I am your God, saith the Lord LORD. [That the great inequality that is between the great God and us poor empty vain men might not frighten us, not the conscience and experience of our on impotency make us afraid, God assureth us here by a gracious and loving speech, that he notwithstanding all this will perfect the promised work of grace in his sheep; as if he had said, be comforted be of good chear, ye my beloved sheep, I am and continue for ever your Saviour. Compare Job 10:28, 29.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
