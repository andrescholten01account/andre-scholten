enken aan uw slechte wegen en uw handelingen, die niet goed waren; en u zult een walging van uzelf hebben over uw ongerechtigheden en over uw gruwelen.", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "Ps 107:23-31": "Die met schepen ter zee afvaren, handel drijvend op grote wateren; Die zien de werken van de HEERE, en Zijn wonderwerken in de diepte. Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Jer 15:2": "En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Jes 27:13": "En het zal op die dag gebeuren, dat er met een grote bazuin geblazen zal worden; dan zullen zij komen die verloren dreigden te gaan in het land van Assur, en de weggejaagden in het land van Egypte; en zij zullen de HEERE aanbidden op de heilige berg te Jeruzalem.", "Openb 2:9": "Ik weet uw werken, en verdrukking, en armoede (maar u bent rijk), en de lastering van hen die zeggen dat zij Joden zijn, en zijn het niet, maar zijn een synagoge van de satan.", "Ezech 12:17": "Daarna kwam het woord van de HEERE tot mij en Hij zei:", "Ezech 27:1": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "Zach 7:5": "Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast?", "Ezech 29:16": "En het zal voor het huis van Israël niet meer tot een vertrouwen zijn, dat hen aan de ongerechtigheid doet denken, wanneer zij naar hen omzien; maar zij zullen weten dat Ik de Heere HEERE ben.", "Jer 6:15": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallende, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "Jes 29:18-24": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien. En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen. Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Jer 44:16-18": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen. Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad. Maar vanaf het moment dat wij opgehouden zijn wierook te branden voor de koningin van de hemel, en haar drankoffers te offeren, hebben wij van alles gebrek gehad, en zijn wij door het zwaard en door de honger verteerd.", "Ezech 18:30-32": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden. Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël? Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Spr 28:9": "Wie zijn oor afwendt van het horen van de wet, diens gebed zelfs zal een gruwel zijn.", "Rom 2:3": "En denkt u dit, o mens, die hen oordeelt die zulke dingen doen, en dat zelf ook doet, dat u het oordeel van God zult ontvluchten?", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Ezech 20:7": "En Ik zei tegen hen: Ieder werpt de verfoeisels van zijn ogen weg; en verontreinigt u niet met de drekgoden van Egypte; Ik, de HEERE, ben uw God.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "2 Petr 2:1-22": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "2 Kor 1:4-6": "Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden. Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig. Maar hetzij dat wij verdrukt worden, het is tot uw vertroosting en zaligheid, die gewerkt wordt in het volharden in datzelfde lijden, dat wij ook lijden; hetzij dat wij vertroost worden, het is tot uw vertroosting en zaligheid;", "Jes 9:14": "(De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)", "Dan 9:10-12": "En wij hebben naar de stem van de HEERE, onze God, niet geluisterd, om in Zijn wetten te wandelen, die Hij ons gegeven heeft door de hand van Zijn knechten, de profeten. Maar heel Israël heeft Uw wet overtreden, door af te wijken, zodat zij Uw stem niet gehoorzaamden; daarom is over ons uitgestort die vloek en die eed, die geschreven is in de wet van Mozes, de knecht van God, omdat wij tegen Hem gezondigd hebben. En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze rechters, die ons berechtten, door over ons een groot kwaad te brengen, dat niet gebeurd is onder de hele hemel, zoals het aan Jeruzalem gebeurd is.", "Ezech 22:25": "De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Ezech 25:11": "Ik zal ook in Moab strafgerichten voltrekken; en zij zullen weten dat Ik de HEERE ben.", "Jes 37:31": "Want wie ontkomen is, die overgebleven is van het huis van Juda, zal opnieuw naar beneden wortelen, en het zal naar boven vrucht dragen.", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Klaagl 4:9": "Teth. De gevallenen door het zwaard hebben het beter dan de gevallenen door de honger; want die kwijnen weg, als doorstoken, omdat er geen vruchten van de velden zijn.", "Deut 28:24": "De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Matt 23:3": "daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet.", "1 Tim 4:1-3": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Mal 2:11-13": "Juda handelt trouweloos, en er wordt een gruwel gedaan in Israël en in Jeruzalem; want Juda ontheiligt de heiligheid van de HEERE, die Hij liefheeft; want hij heeft de dochter van een vreemde god getrouwd. De HEERE zal de man die dit doet, uitroeien uit de tenten van Jakob, hem die waakt en hem die antwoordt, en die de HEERE van de heerscharen een spijsoffer brengt. Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "Joh 10:8": "Allen die vóór Mij zijn gekomen, zijn dieven en rovers; maar de schapen hebben hen niet gehoord.", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Ezech 30:26": "En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen; zo zullen zij weten dat Ik de HEERE ben.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Luk 11:39-52": "En de Heere zei tegen hem: Nu, u Farizeeën, u reinigt de buitenkant van de drinkbeker en de schotel; maar uw binnenste is vol roofzucht en boosheid. Dwazen! Heeft Hij die de buitenkant gemaakt heeft, niet ook de binnenkant gemaakt? Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "Num 16:46-50": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen. En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk. En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Luk 18:11": "De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Jer 44:28": "Maar wie van het zwaard ontkomen, zullen uit Egypteland terugkeren in het land van Juda, weinig in aantal; en het hele overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, zal weten wiens woord stand zal houden, het Mijne of het hunne.", "Ezech 12:8": "En 's morgens kwam het woord van de HEERE tot mij en Hij zei:", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Hos 8:5-14": "Uw kalf, Samaria! heeft u verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinheid niet verdragen? Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria. Want zij hebben wind gezaaid, en zullen een wervelwind maaien; het zal geen staand koren hebben, de opbrengst zal geen meel opleveren; en als het toch iets opleverde, zullen vreemden het verslinden.", "Amos 4:6": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Ezech 8:6-18": "En Hij zei tegen mij: Mensenkind, ziet u wel wat zij doen, de grote gruwelen die het huis van Israël hier doet, zodat Ik ver van Mijn heiligdom wegga? Maar u zult nog meer grote gruwelen zien. Zo bracht Hij mij tot de deur van het voorhof. Toen zag ik, en zie, er was een gat in de wand. En Hij zei tegen mij: Mensenkind, graaf nu in die wand. En ik groef in die wand, en zie, daar was een deur.", "Jak 3:13": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "1 Petr 2:16": "Als vrijen, en niet de vrijheid gebruikend als een dekmantel voor de slechtheid, maar als dienstknechten van God.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Richt 11:27": "Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!", "Zach 10:3": "Tegen de herders was Mijn toorn ontstoken, en over de bokken heb Ik bezoeking gedaan; maar de HEERE van de heerscharen³ zal Zijn kudde bezoeken, het huis van Juda, en Hij zal hen stellen als het paard van Zijn majesteit in de strijd.", "Ezech 39:22": "En zij die van het huis van Israël zijn, zullen weten dat Ik, de HEERE, hun God ben, vanaf die dag en voortaan.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Openb 8:4": "En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Fil 1:29": "Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "Deut 8:15": "Die u geleid heeft in die grote en angstaanjagende woestijn, waar vurige slangen, en schorpioenen, en droogte waren, waar geen water was; Die u water uit de keiharde rots liet komen;", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Hand 22:3": "Ik ben een Joodse man, geboren te Tarsen in Cilicië, maar opgevoed in deze stad, aan de voeten van Gamaliël onderwezen naar de nauwkeurigste wijze van de wet van de vaderen, en ik was een ijveraar voor God, zoals u allen heden bent.", "Hos 7:14": "Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun bedden; om koren en most verzamelen zij zich, maar zij weerstreven Mij.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "Job 4:17": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Openb 7:5": "Uit het geslacht van Juda waren twaalfduizend verzegeld; uit het geslacht van Ruben waren twaalfduizend verzegeld; uit het geslacht van Gad waren twaalfduizend verzegeld;", "Amos 4:12": "Daarom zal Ik u zo doen, Israël! Omdat Ik u dan dit doen zal, maak u dan gereed, Israël, om uw God te ontmoeten.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Micha 1:1-9": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem. Hoort, u volken allemaal! Merk op, u aarde, alsook van die volheid! De Heere HEERE nu zal tot een getuige zijn tegen u, de Heere uit de tempel van Zijn heiligheid. Want ziet, de HEERE gaat uit van Zijn plaats, en Hij zal neerdalen en treden op de hoogten van de aarde.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Mark 1:4": "Johannes doopte in de woestijn en predikte de doop van bekering tot vergeving van de zonden.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "Jes 64:2": "Zoals een smeltvuur brandt, en het vuur het water doet opborrelen, om Uw Naam aan Uw tegenstanders bekend te maken! Laat zo de heidenen voor Uw aangezicht beven.", "Jes 9:15": "Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Micha 5:6": "En het overblijfsel van Jakob zal zijn in het midden van veel volken, als een dauw van de HEERE, als druppels op het gras, dat naar geen man wacht, en op geen mensenkinderen hoopt.", "Ezech 31:1": "Het gebeurde ook in het elfde jaar, in de derde maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam:", "Lev 26:25": "Want Ik zal een zwaard over u brengen, dat de wraak van het verbond wreken zal, zodat u in uw steden verzameld wordt; dan zal Ik de pest in uw midden zenden, en u zult in de hand van de vijand overgegeven worden.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Jer 23:1": "Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "1 Kron 21:12": "Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.", "Luk 14:34": "Het zout is goed; maar als het zout smakeloos geworden is, waarmee zal het smakelijk gemaakt worden?", "Jer 3:14-18": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Num 5:31": "En de man zal van de ongerechtigheid onschuldig zijn; maar die vrouw zal haar ongerechtigheid dragen.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "1 Tess 1:8": "Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ezech 24:15": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Jer 18:13-15": "Daarom, zo zegt de HEERE: Vraag nu onder de heidenvolken; wie heeft zoiets gehoord? De jonkvrouw Israël doet een zeer afschuwelijke zaak. Zal men ook om een rotssteen van het veld de sneeuw van Libanon verlaten? Zullen ook de vreemde, koude, vlietende wateren verlaten worden? Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is;", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Jer 29:11": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "1 Kor 3:6-9": "Ik heb geplant, Apollos heeft nat gemaakt; maar God heeft de groei gegeven. Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft. En hij die plant en hij die nat maakt, zijn één; maar ieder zal zijn loon ontvangen naar zijn arbeid.", "Hebr 8:10": "Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Jer 3:12-14": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden. Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE. Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Ezech 22:4": "Door uw bloed dat u vergoten hebt, bent u schuldig geworden, en met uw drekgoden die u gemaakt hebt, hebt u zich verontreinigd, en hebt u uw dagen doen naderen en bent u tot uw jaren gekomen; daarom heb Ik u aan de heidenvolken overgegeven tot een smaad, en aan alle landen tot een spot.", "Hos 2:1-4": "Twist tegen uw moeder, twist, omdat zij Mijn vrouw niet is, en Ik haar Man niet ben; en laat ze haar hoererijen van haar gezicht, en haar overspelerijen van tussen haar borsten wegdoen. Anders zal Ik ze naakt uitkleden, en haar neerzetten als op de dag dat zij geboren werd; ja, Ik zal haar maken als een woestijn, en haar neerzetten als een dor land, en haar doden door dorst; En Ik zal Mij niet ontfermen over haar kinderen, omdat zij kinderen van de hoererijen zijn.", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Ezech 38:22": "En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn.", "Ezech 16:60-63": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten. Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond. Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "Deut 28:37": "En u zult tot een schrik, tot een spreekwoord en tot een spotlied worden, onder al de volken waarheen de HEERE u leiden zal.", "2 Petr 2:1-3": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Jer 2:9": "Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Jes 66:4": "Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde.", "Job 1:5": "Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt. Zo deed Job al die dagen.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Openb 19:19-21": "En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers. En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt. En de overigen werden gedood met het zwaard van Hem Die op het paard zat, dat uit Zijn mond ging; en alle vogels werden verzadigd van hun vlees.", "Klaagl 2:14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "Matt 20:20-27": "Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets. En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk. Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Gal 1:6-8": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie; terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien. Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Job 1:8": "En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want er is niemand op de aarde zoals hij, een man oprecht en vroom, godvrezend en afwijkend van het kwaad.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Joël 2:15-18": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "2 Tess 1:5": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt;", "Ps 105:16": "Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Ezech 44:8": "En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.", "Jer 37:9": "Zo zegt de HEERE: Bedrieg uzelf niet door te zeggen: De Chaldeeën zullen zeker van ons wegtrekken; want zij zullen niet wegtrekken.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Ps 57:11": "Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Jes 30:22": "En u zult voor onrein houden het deksel van uw zilveren gesneden beelden, en het overtreksel van uw gouden gegoten beelden; u zult ze wegwerpen als een maanstondig kleed, en tegen elk daarvan zeggen: Ga weg!", "Matt 25:34-46": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Jer 2:11-13": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE. Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Num 14:29": "Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Job 11:13-15": "Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit. Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen. Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Luk 13:13-17": "En Hij legde haar de handen op; en zij werd meteen weer recht, en verheerlijkte God. En de leider van de synagoge nam het kwalijk dat Jezus op de sabbat genezen had, en antwoordde en zei tegen de menigte: Er zijn zes dagen waarop men moet werken; kom dan op die dagen en laat u genezen, en niet op de dag van de sabbat. De Heere dan antwoordde hem en zei: Huichelaar, maakt niet ieder van u op de sabbat zijn os of ezel los van de kribbe, en leidt hem weg om hem te laten drinken?", "Ex 14:31": "Ook zag Israël de grote hand die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde de HEERE, en geloofde in de HEERE, en in Mozes, Zijn dienaar.", "Jer 5:1": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn.", "Openb 3:1": "En schrijf aan de engel van de gemeente die in Sardis is: Dit zegt Hij Die de zeven Geesten van God heeft, en de zeven sterren: Ik ken uw werken, dat u de naam hebt dat u leeft, en u bent dood.", "Jer 25:9": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "Ezech 14:19-21": "Of als Ik de pest in datzelfde land zend, en Mijn grimmigheid daarover met bloed uitgiet, om daaruit mensen en beesten uit te roeien; Ofschoon Noach, Daniël en Job in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, als zij een zoon of een dochter zouden willen bevrijden, zouden zij alleen hun eigen ziel door hun gerechtigheid bevrijden. Want zo zegt de Heere HEERE: Hoeveel te meer als Ik Mijn vier zware oordelen, het zwaard, en de honger, en het boze gedierte, en de pest gezonden zal hebben tegen Jeruzalem, om daaruit mensen en beesten uit te roeien!", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "Ezech 28:20": "Verder gebeurde het woord van de HEERE tot mij:", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "Zach 11:17": "Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden.", "Jes 49:13-23": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Job 27:8-10": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Matt 16:12": "Toen begrepen zij dat Hij niet gezegd had dat zij zich moesten wachten voor de zuurdesem van het brood, maar voor de leer van de Farizeeën en Sadduceeën.", "Jer 23:2": "Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Neh 9:17-20": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Ezech 34:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "1 Kon 8:33-50": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Hand 10:38": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Hebr 5:8": "Hoewel Hij de Zoon was, heeft Hij toch gehoorzaamheid geleerd uit wat Hij geleden heeft.", "Ezech 22:28": "Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Ps 50:4": "Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Neh 1:8": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien.", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Rom 14:13": "Laten wij elkaar dan niet meer oordelen; maar oordeelt dit liever, namelijk dat u de broeder geen aanstoot of ergernis geeft.", "Zach 10:5-12": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden. En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren. En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "Luk 21:16": "En u zult overgeleverd worden, ook door ouders, en broers, en verwanten, en vrienden; en zij zullen sommigen van u doden.", "Ezech 20:45": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Ps 145:9": "Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Jer 13:27": "Uw overspelen en uw hunkeringen, de schandelijkheid van uw hoererij, op heuvels, in het veld; Ik heb uw gruwelen gezien; wee u, Jeruzalem! Zult u niet rein worden? Hoe lang nog hierna?", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Ezech 11:14": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Jes 65:9": "En Ik zal nageslacht uit Jakob voortbrengen, en uit Juda een erfbezitter van Mijn bergen; en Mijn uitverkorenen zullen het erfelijk bezitten, en Mijn knechten zullen daar wonen.", "Job 42:8": "Daarom neemt nu voor u zeven jonge stieren en zeven rammen, en gaat heen naar Mijn knecht Job, en offert een brandoffer voor u, en laat Mijn knecht Job voor u bidden; want zeker, Ik zal zijn aangezicht aannemen, opdat Ik aan u niet doe naar uw dwaasheid; want u hebt niet recht van Mij gesproken, zoals Mijn knecht Job.", "Deut 13:11": "Opdat heel Israël het hoort en vreest, en niet meer voortvaart om te doen naar dit boze stuk in uw midden.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Jer 4:27": "Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken);", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Ezech 30:8": "En zij zullen weten dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben aangestoken, en al zijn helpers zullen verbroken worden.", "Tit 3:2": "Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen.", "Job 36:14": "Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.", "Amos 4:6-9": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Ezra 9:7-14": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Ezech 23:49": "Zo zullen zij uw schandelijkheid op u leggen, en u zult de zonden van uw drekgoden dragen; en u zult weten dat Ik de Heere HEERE ben.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Matt 23:2-33": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes; daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet. Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Tit 3:8": "Dit is een betrouwbaar woord, en ik wil dat u deze dingen met ernst bevestigt, opdat zij die aan God geloven, er zorg voor dragen goede werken voor te staan; deze dingen zijn goed en nuttig voor de mensen.", "Gen 7:1": "Daarna zei de HEERE tegen Noach: Ga u, en heel uw huis in de ark; want u heb Ik gezien als rechtvaardige voor Mijn aangezicht in dit geslacht.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Jer 13:9-27": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem. Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt. Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Ex 20:10": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "2 Sam 24:15": "Toen gaf de HEERE een pestilentie in Israël, van de morgen af tot de vastgestelde tijd toe; en er stierven van het volk, van Dan tot Ber-seba toe, zeventigduizend man.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Matt 22:18": "Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef?", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Ezech 17:18-20": "Want hij heeft de eed veracht, door het verbond te breken, terwijl hij, zie, zijn hand gegeven had; omdat hij al deze dingen gedaan heeft, zal hij niet ontkomen. Daarom, zo zegt de Heere HEERE: Zo waarachtig als Ik leef, Ik zal Mijn eed, die hij veracht heeft, en Mijn verbond, dat hij gebroken heeft, op zijn hoofd geven! En Ik zal Mijn net over hem uitspreiden, zodat hij gegrepen zal worden in Mijn jachtnet; en Ik zal hem naar Babel laten brengen, en zal daar met hem in het gericht gaan over zijn overtreding, waarmee hij tegen Mij overtreden heeft.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Jes 55:7-9": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig. Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE. Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "Matt 3:8-10": "Breng dan vruchten voort die bij de bekering passen. En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken. En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Ezech 12:21": "Opnieuw kwam het woord van de HEERE tot mij en Hij zei:", "Ps 119:71": "Het is mij goed, dat ik verdrukt ben geweest, opdat ik Uw inzettingen leerde.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Deut 17:2-5": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb; En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Luk 10:25": "En zie, een wetgeleerde stond op, om Hem op de proef te stellen, en zei: Meester, wat moet ik doen om het eeuwige leven te beërven?", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Jer 21:10": "Want Ik heb Mijn gezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Deut 24:13": "U zult hem dat pand zeker teruggeven, als de zon ondergaat, zodat hij in zijn kleed neerligt, en u zegent; en het zal u gerechtigheid zijn voor het aangezicht van de HEERE, uw God.", "Tit 1:10-14": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn; hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin. Iemand uit hen, hun eigen profeet, heeft gezegd: De Kretenzers zijn altijd leugenachtig, kwade beesten, luie buiken.", "Jer 2:32": "Vergeet ook een jonkvrouw haar versiersel, of een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.", "Hos 8:2": "Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.", "Ex 25:17": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Ezech 6:7": "En de gesneuvelden zullen in uw midden liggen, zodat u weet dat Ik de HEERE ben.", "Amos 5:16-20": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben. Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE. Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Ezech 18:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Zach 11:8": "En ik heb drie herders in één maand afgesneden; want mijn ziel was verdrietig over hen geworden, en ook had hun ziel een walg van mij.", "Zach 1:17": "Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Micha 5:11-13": "En Ik zal de toverijen uit uw hand uitroeien, en u zult geen guichelaars meer hebben. En Ik zal uw gesneden beelden en uw opgerichte beelden uit uw midden uitroeien, zodat u zich niet meer zult neerbuigen voor het werk van uw handen. Verder zal Ik uw bossen uit uw midden uitroeien, en Ik zal uw steden verdelgen.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Num 14:18-20": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Jer 3:11": "Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Hand 20:29": "Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.", "Mark 9:33-35": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Zach 7:13": "Daarom is het gebeurd, zoals Hij geroepen had en zij niet gehoord hebben, dat zij ook riepen, maar Ik niet hoorde, zegt de HEERE van de heerscharen;", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Jer 23:14-16": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land. Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Hos 4:8-13": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid. Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden. En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Matt 18:23-27": "Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Mark 7:6-8": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij. Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen; Want u laat het gebod van God los, en houdt vast aan de overleveringen van mensen, namelijk het wassen van kannen en drinkbekers; en vele andere dergelijke dingen doet u.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Luk 14:35": "Het is niet meer geschikt voor het land, en ook niet voor de mesthoop; men gooit het weg. Wie oren heeft om te horen, laat hij horen.", "Jer 3:21-25": "Er is een stem gehoord op de hoge plaatsen, geween en smekingen van de kinderen van Israël, omdat zij hun weg verdraaid hebben, en de HEERE, hun God, vergeten hebben. Keer terug, afkerige kinderen! Ik zal uw afkeringen genezen. Zie, hier zijn wij, wij komen tot U, want U bent de HEERE, onze God! Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Jer 23:11": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.", "Mark 10:17": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven?", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Job 22:23": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jak 5:16": "Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel.", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Openb 6:5-8": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand. En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet. En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!", "Kol 2:19": "En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei.", "Ezech 33:19": "En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Hebr 12:6-11": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt. Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt? Maar als u zonder kastijding bent, waaraan allen deel gekregen hebben, dan bent u dus bastaarden, en geen zonen.", "Job 33:16-30": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding; Opdat Hij de mens afwendt van zijn werk, en van de man de hoogmoed verbergt; Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Matt 25:3": "Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Ezech 33:23": "Toen kwam het woord van de HEERE tot mij:", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Ezech 18:30": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden.", "Jer 4:3-18": "Want zo zegt de HEERE tegen de mannen van Juda en tegen Jeruzalem: Braak voor uzelf een braakland, en zaai niet onder de doornen. Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden. Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!", "Hos 8:13": "Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.", "Matt 7:5": "Huichelaar! Haal eerst de balk uit uw eigen oog, en dan zult u goed genoeg zien om de splinter uit het oog van uw broeder te halen.", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Hos 4:3": "Daarom zal het land treuren, en ieder die daarin woont, kwijnen weg, met de dieren van het veld, en met de vogels van de hemel; ja, ook de vissen van de zee zullen weggeraapt worden.", "Jer 47:6": "O wee, u zwaard van de HEERE! Hoe lang zult u niet stil houden? Vaar in uw schede, rust en wees stil!", "Openb 16:5-7": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt; Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard. En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Jak 1:22-24": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "1 Joh 3:7": "Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Ezech 30:20": "Ook gebeurde het in het elfde jaar, in de eerste maand, op de zevende van de maand, dat het woord van de HEERE tot mij kwam: het zei:", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "Gen 18:26-32": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen. En
