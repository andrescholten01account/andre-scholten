 voor mijn aangezicht zitten.","2":"Toen kwam het woord van de HEERE tot mij en Hij zei:","3":"Mensenkind, deze mannen hebben hun drekgoden[1] in hun hart opgezet, en hebben de aanstoot van hun ongerechtigheid recht voor hun aangezicht gezet; zou Ik dan werkelijk door hen geraadpleegd worden?","4":"Daarom, spreek met hen en zeg tegen hen: Zo zegt de Heere HEERE: Ieder man uit het huis van Israël die de drekgoden in zijn hart opzet, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet, Ik, de HEERE, zal hem antwoorden als hij komt, naar de veelheid van zijn drekgoden;","5":"Opdat Ik het huis van Israël in hun hart grijp, omdat zij allen door hun drekgoden van Mij vervreemd zijn.","6":"Daarom, zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Bekeer u, en keer u af van uw drekgoden, en keer uw aangezichten af van al uw gruwelen.","7":"Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;","8":"En Ik zal Mijn aangezicht tegen die man zetten, en zal hem stellen tot een teken en tot een spreekwoord, en zal hem uitroeien uit het midden van Mijn volk; en u zult weten dat Ik de HEERE ben.","9":"Als nu een profeet overreed is en iets gesproken heeft, Ik, de HEERE, heb die profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.","10":"En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;","11":"Opdat het huis van Israël niet meer van achter Mij afdwaalt, en zij zich niet meer verontreinigen met al hun overtredingen; dan zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn, spreekt de Heere HEERE.","12":"Verder kwam het woord van de HEERE tot mij en Hij zei:","13":"Mensenkind, als een land tegen Mij zondigt door zwaar te overtreden, dan zal Ik Mijn hand daartegen uitstrekken, en de staf van het brood daarvan breken, en een honger daarin zenden, zodat Ik daaruit mensen en beesten uitroei;","14":"Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden daarvan zouden zijn, zouden zij door hun gerechtigheid alleen hun eigen ziel bevrijden, spreekt de Heere HEERE.","15":"Als Ik het boze gedierte door het land laat gaan, en dat het van kinderen berooft, zodat het woest wordt, zodat niemand erdoorheen gaat vanwege het gedierte;","16":"Al waren die drie mannen in het midden daarvan, zo waarachtig als Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochters bevrijden, zij zelf alleen zouden bevrijd worden, maar het land zou woest worden.","17":"Of als Ik het zwaard breng over datzelfde land, en zeg: Zwaard! ga door dat land, zodat Ik daaruit mensen en beesten uitroei;","18":"Ofschoon die drie mannen in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochters bevrijden, maar zij zelf alleen zouden bevrijd worden.","19":"Of als Ik de pest in datzelfde land zend, en Mijn grimmigheid daarover met bloed uitgiet, om daaruit mensen en beesten uit te roeien;","20":"Ofschoon Noach, Daniël en Job in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, als zij een zoon of een dochter zouden willen bevrijden, zouden zij alleen hun eigen ziel door hun gerechtigheid bevrijden.","21":"Want zo zegt de Heere HEERE: Hoeveel te meer als Ik Mijn vier zware oordelen, het zwaard, en de honger, en het boze gedierte, en de pest gezonden zal hebben tegen Jeruzalem, om daaruit mensen en beesten uit te roeien!","22":"Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.","23":"Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE."},"SV":{"1":"Daarna kwamen tot mij mannen uit de oudsten van Israël, en zaten neder voor mijn aangezicht.","2":"Toen geschiedde des HEEREN woord tot mij, zeggende:","3":"Mensenkind, deze mannen hebben hun drekgoden in hun hart opgezet, en hebben den aanstoot hunner ongerechtigheid recht voor hun aangezichten gesteld; word Ik dan ernstiglijk van hen gevraagd?","4":"Daarom spreek met hen, en zeg tot hen: Alzo zegt de Heere HEERE: Een ieder man uit het huis Israëls, die de drekgoden in zijn hart opzet, en den aanstoot zijner ongerechtigheid recht voor zijn aangezicht stelt, en komt tot den profeet, Ik, de HEERE zal hem, als hij komt, antwoorden naar de menigte zijner drekgoden;","5":"Opdat Ik het huis Israëls in hun hart grijpe, dewijl zij allen door hun drekgoden van Mij vervreemd zijn.","6":"Daarom zeg tot het huis Israëls: Alzo zegt de Heere HEERE: Bekeert u, en keert u af van uw drekgoden, en keert uw aangezichten af van al uw gruwelen.","7":"Want ieder man uit het huis Israëls, en uit den vreemdeling, die in Israël verkeert, die zich van achter Mij afscheidt, en zet zijn drekgoden op in zijn hart, en stelt den aanstoot zijner ongerechtigheid recht voor zijn aangezicht, en komt tot den profeet, om Mij door hem te vragen; Ik ben de HEERE, hem zal geantwoord worden door Mij;","8":"En Ik zal Mijn aangezicht tegen dienzelven man zetten, en zal hem stellen tot een teken en tot spreekwoorden, en zal hem uitroeien uit het midden Mijns volks; en gijlieden zult weten, dat Ik de HEERE ben.","9":"Als nu een profeet overreed zal zijn, en iets gesproken zal hebben, Ik, de HEERE, heb dienzelven profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.","10":"En zij zullen hun ongerechtigheid dragen; gelijk de ongerechtigheid des vragers zal zijn; alzo zal zijn de ongerechtigheid des profeten;","11":"Opdat het huis Israëls niet meer van achter Mij afdwale, en zij zich niet meer verontreinigen met al hun overtredingen; alsdan zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn, spreekt de Heere HEERE.","12":"Verder geschiedde des HEEREN woord tot mij, zeggende:","13":"Mensenkind, als een land tegen Mij gezondigd zal hebben, zwaarlijk overtredende, zo zal Ik Mijn hand daartegen uitstrekken, en zal hetzelve den staf des broods breken, en een honger daarin zenden, dat Ik daaruit mensen en beesten uitroeie;","14":"Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden deszelven waren, zij zouden door hun gerechtigheid *alleen* hun ziel bevrijden, spreekt de Heere HEERE.","15":"Zo Ik het boos gedierte make door het land door te gaan, hetwelk dat van kinderen berove, zodat het woest worde, dat er niemand doorga, vanwege het gedierte;","16":"Die drie mannen in het midden deszelven zijnde, zo *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zo zij zonen, en zo zij dochteren bevrijden zouden, zij zelven alleen zouden bevrijd worden, maar het land zou woest worden.","17":"Of *als* Ik het zwaard brenge over datzelve land, en zegge: Zwaard! ga door, door dat land, zodat Ik daarvan uitroeie mensen en beesten;","18":"Ofschoon die drie mannen in het midden deszelven waren, zo *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochteren bevrijden, maar zij zelven alleen zouden bevrijd worden.","19":"Of *als* Ik de pestilentie in datzelve land zende, en Mijn grimmigheid daarover met bloed uitgiete, om daarvan mensen en beesten uit te roeien;","20":"Ofschoon Noach, Daniël en Job in het midden deszelven waren, *zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zo zij een zoon, *of* zo zij een dochter zouden bevrijden, zij zouden *alleen* hun ziel door hun gerechtigheid bevrijden.","21":"Want alzo zegt de Heere HEERE: Hoeveel te meer als Ik mijn vier boze gerichten, het zwaard, en den honger, en het boze gedierte, en de pestilentie gezonden zal hebben tegen Jeruzalem, om daaruit mensen en beesten uit te roeien!","22":"Doch ziet, daarin zullen ontkomenen overblijven, die uitgevoerd zullen worden, zonen en dochteren; ziet, zij zullen tot ulieden uitkomen, en gij zult hun weg zien, en hun handelingen; en gij zult vertroost worden over het kwaad, dat Ik over Jeruzalem gebracht zal hebben, *ja*, al wat Ik zal gebracht hebben over haar.","23":"Zo zullen zij u vertroosten, als gij hun weg en hun handelingen zien zult; en gij zult weten, dat Ik niet zonder oorzaak gedaan heb, al wat Ik in haar gedaan heb, spreekt de Heere HEERE."},"KJV":{"1":"Then came certain of the elders of Israel unto me, and sat before","2":"And the word of the LORD came unto me, saying,","3":"Son of man, these men have set up their idols in their heart, and put the stumblingblock of their iniquity before their face: should I be enquired of at all","4":"Therefore speak unto them, and say unto them, Thus saith the Lord GOD; Every man of the house of Israel that setteth up his idols in his heart, and putteth the stumblingblock of his iniquity before his face, and cometh to the prophet; I the LORD will answer him that cometh according to the multitude of his idols;","5":"That I may take the house of Israel in their own heart, because they are all estranged from me through their idols.","6":"Therefore say unto the house of Israel, Thus saith the Lord GOD; Repent, and turn *yourselves* from your idols; and turn away your faces from all your abominations.","7":"For every one of the house of Israel, or of the stranger that sojourneth in Israel, which separateth himself from me, and setteth up his idols in his heart, and putteth the stumblingblock of his iniquity before his face, and cometh to a prophet to enquire of him concerning me; I the LORD will answer","8":"And I will set my face against that man, and will make him a sign and a proverb, and I will cut him off from the midst of my people; and ye shall know that I *am* the LORD.","9":"And if the prophet be deceived when he hath spoken a thing, I the LORD have deceived that prophet, and I will stretch out my hand upon him, and will destroy him from the midst of my people Israel.","10":"And they shall bear the punishment of their iniquity: the punishment of the prophet shall be even as the punishment of him that seeketh","11":"That the house of Israel may go no more astray from me, neither be polluted any more with all their transgressions; but that they may be my people, and I may be their God, saith the Lord GOD.","12":"The word of the LORD came again to me, saying,","13":"Son of man, when the land sinneth against me by trespassing grievously, then will I stretch out mine hand upon it, and will break the staff of the bread thereof, and will send famine upon it, and will cut off man and beast","14":"Though these three men, Noah, Daniel, and Job, were in it, they should deliver *but* their own souls by their righteousness, saith the Lord GOD.","15":"If I cause noisome beasts to pass through the land, and they spoil it, so that it be desolate, that no man may pass through because of the beasts:","16":"*Though* these three men *were* in it, *as* I live, saith the Lord GOD, they shall deliver neither sons nor daughters; they only shall be delivered, but the land shall be desolate.","17":"Or *if* I bring a sword upon that land, and say, Sword, go through the land; so that I cut off man and beast","18":"Though these three men *were* in it, *as* I live, saith the Lord GOD, they shall deliver neither sons nor daughters, but they only shall be delivered","19":"Or *if* I send a pestilence into that land, and pour out my fury upon it in blood, to cut off from it man and beast:","20":"Though Noah, Daniel, and Job, *were* in it, *as* I live, saith the Lord GOD, they shall deliver neither son nor daughter; they shall *but* deliver their own souls by their righteousness.","21":"For thus saith the Lord GOD; How much more when I send my four sore judgments upon Jerusalem, the sword, and the famine, and the noisome beast, and the pestilence, to cut off from it man and beast?","22":"Yet, behold, therein shall be left a remnant that shall be brought forth, *both* sons and daughters: behold, they shall come forth unto you, and ye shall see their way and their doings: and ye shall be comforted concerning the evil that I have brought upon Jerusalem, *even* concerning all that I have brought","23":"And they shall comfort you, when ye see their ways and their doings: and ye shall know that I have not done without cause all that I have done in it, saith the Lord GOD."}},"tsk":{"1":[{"kopje":"mannen","refs":["Ezech 8:1","Ezech 20:1","2 Kon 6:32","Hand 4:5","Hand 4:8"]},{"kopje":"en zij gingen zitten","refs":["Ezech 33:31","Jes 29:13","Luk 10:39","Hand 22:3"]}],"3":[{"kopje":"deze mannen","refs":["Ezech 14:4","Ezech 14:7","Ezech 6:9","Ezech 11:21","Ezech 20:16","Ezech 36:25","Jer 17:1","Jer 17:2","Jer 17:9","Ef 5:5"]},{"kopje":"en hebben opgezet","refs":["Ezech 3:20","Ezech 7:19","Ezech 44:12","Jer 44:16-18","Zef 1:3","1 Petr 2:8","Openb 2:14"]},{"kopje":"zou","refs":["Ezech 20:3","1 Sam 28:6","2 Kon 3:13","Ps 66:18","Ps 101:3","Spr 15:8","Spr 15:29","Spr 21:27","Spr 28:9","Jes 1:15","Jes 33:15","Jer 7:8-11","Jer 11:11","Jer 42:20","Jer 42:21","Zach 7:13","Luk 20:8"]}],"4":[{"kopje":"spreek","refs":["Ezech 2:7","Ezech 3:4","Ezech 3:17-21"]},{"kopje":"Ik, de HEERE","refs":["Ezech 14:7","1 Kon 21:20-25","2 Kon 1:16","Jes 3:11","Jes 66:4"]}],"5":[{"kopje":"Ik","refs":["Ezech 14:9","Ezech 14:10","Hos 10:2","Zach 7:11-14","2 Tess 2:9-11"]},{"kopje":"vervreemd","refs":["Deut 32:15","Deut 32:16","Jes 1:4","Jer 2:5","Jer 2:11-13","Jer 2:31","Jer 2:32","Zach 11:8","Rom 1:21-23","Rom 1:28","Rom 1:30","Rom 8:7","Gal 6:7","Ef 4:18","Kol 1:21","Hebr 3: e <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> How much more when I <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> my <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> upon <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">noisome</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from it <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and beast?","22":"Yet, behold, therein shall be <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> a <span class=\"wl wl-kjv\" data-code=\"H6413\">remnant</span> that shall be brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> both <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> behold, they shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> unto you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> and their <span class=\"wl wl-kjv\" data-code=\"H5949\">doings:</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> upon <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> even concerning all that I have brought","23":"And they shall <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> you, when ye <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> and their <span class=\"wl wl-kjv\" data-code=\"H5949\">doings:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I have not <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> without <span class=\"wl wl-kjv\" data-code=\"H2600\">cause</span> all that I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"oudsten van Israël,","tekst":"Dat is, regeerders en hoofden der gemeente, die in Chaldea woonden; zie Exo 3:16 , en Lev 4:15 ."},{"catchword":"zaten neder voor mijn aangezicht","tekst":"Te weten om door de profeet God raad te vragen van den toekomenden stand van zijn volk, zowel in Jeruzalem als daar in Chaldea; zie het volgende vs.3; vergelijk boven Eze 8:1 , en onder Eze 20:1 ."}],"3":[{"catchword":"opgezet,","tekst":"Dat is, hebben zij in hun gemoed de hoogste plaats gegeven [gelijk zij ook buiten het hart op hoogten plegen opgericht te worden] zodat zij hen boven alle andere dingen, ja ook boven mij hoogachten en vereren; alzo in het volgende."},{"catchword":"den aanstoot","tekst":"Versta, de afgoden. Want als zij dezen voor hunne aangezichten oprichtten tegen Gods bevel, zo zijn zij hun een oorzaak geweest van veelszins tegen God te zondigen en tot vele gruwelen te vervallen; alzo in het volgende. Idem alzo worden de afgoden een strik genaamd; Exo 23:33 ; Deu 7:16 ; Jdg 2:3 ."},{"catchword":"ernstiglijk van hen gevraagd?","tekst":"Hebreeuws, gevraagd zijnde gevraagd; dat is, met ernst of oprecht. Hij wil zeggen: Neen. Dit kan tezamen niet bestaan, dat men de afgoden zou aanhangen, en evenwel de waren God om raad vragen. Anders: zou Ik enigszins van hen gevraagd worden? Dat is, Ik begeer van zulk een volk niet gevraagd te zijn. De Heere werd om raad gevraagd gewoonlijk door den hogepriester met den efod bekleed zijnde. Zie Num 27:21 , en de aantekening. Jdg 1:1 , of door een profeet, 1Sa 23:2 , 1Sa 23:6 , en 1Sa 28:6 ; 2Sa 2:1 ; 2Ch 18:7 ."}],"4":[{"catchword":"Een ieder man","tekst":"Hebreeuws, man, man; dat is, een ieder. Zie Lev 15:2 ; alzo onder vs.7."},{"catchword":"Israëls,","tekst":"Dat is, Juda. Zie boven Eze 6:2 . Versta, de Joden, die daar in Chaldea woonden."},{"catchword":"komt tot den profeet,","tekst":"Te weten om door hem God raad te vragen."},{"catchword":"zal hem,","tekst":"Of, heb hem geantwoord."},{"catchword":"als hij komt,","tekst":"Anders: in dien [tijd]."},{"catchword":"naar de menigte zijner drekgoden;","tekst":"Dat is, Ik zal hen antwoorden, niet wat zij gaarne houden zouden, maar gelijk hun grote en menigerlei afgoderij verdiend heeft. Anders: van de menigte zijner drekgoden; dat is, Ik zal hen anders niet antwoorden, dan wat aangaat eensdeels de menigvuldigheid hunner afgoderij, anderdeels de straffen, die zij daardoor verdiend hebben."}],"5":[{"catchword":"in hun hart grijpe,","tekst":"Dat is, Ik zal hen zo antwoorden, dat Ik in het licht brengen zal wat in hun hart verborgen was. Want zij willen zich als godvruchtigen uitgeven, als zij komen om mij raad te vragen, maar Ik zal met mijne antwoorden ontdekken de goddeloosheid, die in hun hart schuilt."}],"6":[{"catchword":"aangezichten af","tekst":"Versta onder dit woord ook de harten, zonder welker afkering de aangezichten kwalijk afgekeerd kunnen worden. Dit is het tegendeel van den aanstoot recht voor zijn aangezicht te stellen, boven vs.3."},{"catchword":"al uw gruwelen","tekst":"Dat is, niet alleen van uwe afgoderij en zonden, begaan tegen de eerste tafel, maar ook van al uwe schelmerijen, bedreven tegen de tweede tafel der wet."}],"7":[{"catchword":"ieder man uit het huis Israëls,","tekst":"Hebreeuws, man man, gelijk boven vs.4."},{"catchword":"den vreemdeling,","tekst":"Dat is, den Jodengenoot, die zodanig geworden was, òf te voren in Judea, òf daarna in Chaldea, hebbende aangenomen den godsdienst der Joden, met de onderhouding van zijne ceremoniën. Zie van zulke vreemdelingen Lev 17:8 , en Lev 25:35 ."},{"catchword":"stelt den aanstoot","tekst":"Zie boven vs.4."},{"catchword":"om Mij door hem te vragen;","tekst":"Anders: om aan, of van hem mij aangaande te vragen."},{"catchword":"door Mij;","tekst":"Dat is, niet alleen door den profeet, dien hij vraagt, maar door of van mijzelven, die hem antwoorden zal, niet zozeer met woorden als met slagen en straffen, gelijk de volgende woorden uitwijzen."}],"8":[{"catchword":"zal Mijn aangezicht","tekst":"Zie Lev 17:10 ."},{"catchword":"een teken","tekst":"Te weten van mijn rechtvaardige wraak tegen de huichelaars. Want Ik zal met die in het straffen zo vreeslijk en zeldzaam omgaan, dat een ieder daarover verschrikt zal zijn als over een openbaar teken mijner wraak, een ieder door mij voorgesteld tot zijne waarschuwing. Vergelijk Deu 28:46 . Anders: zal hem verwoesten tot een teken; dat is, dat hij tot een teken zij, enz."},{"catchword":"tot spreekwoorden,","tekst":"Zie Deu 28:37 ; Job 17:6 ; zie ook 1Ki 9:7-8 ; 2Ch 7:20-21 ; Psa 44:14-15 , en Psa 69:12 ; Jer 24:9 ; Hab 2:6 ."},{"catchword":"uitroeien","tekst":"Zie Lev 20:3 ."}],"9":[{"catchword":"overreed zal zijn,","tekst":"Te weten van de huichelaars, die hun raad vragen en begeren dat hun wat goeds geprofeteerd worde. Zie van het Hebreeuwse woord Jdg 14:15 ."},{"catchword":"iets gesproken zal hebben,","tekst":"Te weten dat de vrager gaarne hoort, maar vals is."},{"catchword":"overreed,","tekst":"Te weten niet met den profeet enig kwaad in te geven, maar met de huichelarij des vragers door den profeten lichtvaardigheid en gierigheid, die van den profeet en den satan komen, rechtvaardiglijk te straffen; vergelijk 2Sa 11:12 ; 1Ki 12:15 en 1Ki 22:22 ; Jer 4:10 met de aantekening; idem 2Th 2:11-12 ."},{"catchword":"Mijn hand","tekst":"Te weten tegen dien profeet, om hem te straffen; alzo Exo 7:5 , Isa 5:25 ; Jer 15:6 ; onder vs.13 en Eze 25:7 , enz."}],"10":[{"catchword":"hun ongerechtigheid dragen;","tekst":"Het Hebreeuwse woord betekent hier de straf, die door de ongerechtigheid en misdaad verdiend is. Zie Lev 5:1 ."}],"11":[{"catchword":"overtredingen;","tekst":"Welke meermalen onreinheden in de Heilige Schrift genoemd worden, gelijk Ezr 9:11 , onder Eze 24:13 , en Eze 36:17 , en Eze 39:24 ; 1Th 4:7 ; Jam 1:21 ."},{"catchword":"tot een volk zijn,","tekst":"Zie Lev 26:12 ."},{"catchword":"tot een God zijn,","tekst":"Zie Gen 17:7 ."}],"13":[{"catchword":"zwaarlijk overtredende,","tekst":"Hebreeuws, overtreding overtredende; dat is overtreding begaande."},{"catchword":"den staf des broods breken,","tekst":"Zie Lev 26:26 ."}],"14":[{"catchword":"Noach, Daniël en Job,","tekst":"Hij noemt deze drie personen, omdat zij Hem onder anderen aangenaam geweest waren en grote weldaden van Hem ontvangen hadden. Vergelijk Jer 15:1 ."},{"catchword":"hun gerechtigheid","tekst":"Te weten aangezien en gewaardeerd in den Middelaar Christus, wiens volmaakte gerechtigheid de onvolmaaktheid, die in aller vromen gerechtigheid is, wegneemt of toedekt, zodat zij met zegening uit genade beloond wordt."},{"catchword":"alleen","tekst":"Dat dit woord hier ingevoegd moet zijn, is af te nemen uit vs.16, 18."},{"catchword":"ziel bevrijden,","tekst":"Dat is hun leven uit het algemeen verderf des lands vrijhouden."}],"15":[{"catchword":"het boos gedierte","tekst":"Deze plaag wordt het zondige volk gedreigd, Lev 26:22 , boven Eze 5:17 , en dadelijk toegezonden; 2Ki 17:25 ."},{"catchword":"dat er niemand doorga,","tekst":"Hebreeuws, zonder doorganger."}],"16":[{"catchword":"bevrijden zouden,","tekst":"Versta, dat zij hen niet redden zouden; gelijk de volgende woorden uitwijzen; en vergelijk vs.18."},{"catchword":"zij zelven alleen","tekst":"Hier wordt gesproken van een onwederroepelijk vonnis Gods over de gruwelijke hardnekkigheid en ondankbaarheid van het volk, en dat naar zijn rechtvaardig oordeel; zie onder vs.23."}],"17":[{"catchword":"het zwaard brenge","tekst":"Dat is, de oorlog; zie Lev 26:6 ."},{"catchword":"Zwaard, ga door,","tekst":"God spreekt de levenloze en onvernuftige schepselen toe alsof zij leefden en verstand hadden, om te tonen zijne almogendheid en de heerschappij, die Hij over alle dingen heeft, en dat er niets geschiedt in enige dingen, hoe groot of klein zij mogen zijn, bij geval, maar alles door zijn alomtegenwoordige voorzienigheid; vergelijk Deu 4:26 ."}],"19":[{"catchword":"met bloed","tekst":"Dat is, met het doden en ombrengen van vele mensen en beesten. Want bloed wordt voor doding, doodslag, moord dikwijls genomen; zie Gen 37:26 . Zie van de slachting, die God door zijnen engel gedaan heeft, 2Sa 24:15-16 ."},{"catchword":"uitgiete,","tekst":"Zie boven Eze 7:8 ."}],"20":[{"catchword":"zouden bevrijden,","tekst":"Hij wil zeggen: Neen zij; zie boven vs.16."},{"catchword":"door hun gerechtigheid bevrijden","tekst":"Zie boven vs.14."}],"21":[{"catchword":"Hoeveel te meer","tekst":"De zin is: Indien de voorgenoemde mannen in het leven zijnde, als Ik een land maar met ene plaag straf, zichzelven alleen van de straf zouden kunnen vrijhouden, hoeveel te meer zouden zij voor zichzelven alleen dat kunnen doen, als God vier plagen over Jeruzalem tevens zenden zou. Anders: hoeveel temin, te weten zouden zij het volk kunnen bevrijden, wanneer God vier plagen over hen zendt."},{"catchword":"boze gerichten,","tekst":"Of, oordelen; dat is, straffen of plagen; zie Exo 6:5 , en Exo 7:4 , en de aantekening; vergelijk 2Ch 20:12 . Boos of kwaad worden zij genaamd, omdat zij den mens zwaar, pijnlijk en zeer schadelijk vallen; zie ook van vier soorten der plagen, genaamd geslachten, hoewel van deze ten dele onderscheiden, Jer 15:3 ."}],"22":[{"catchword":"daarin zullen","tekst":"Dat is, in Jeruzalem."},{"catchword":"ontkomenen overblijven,","tekst":"Hebreeuws, ene ontkoming; dat is, die het verderf van de vier voorgemelde plagen ontkomen zullen. Ontkoming, voor ontkomenen, gelijk 2Ki 19:30 ; 1Ch 4:43 ; alzo het overblijfsel voor overgeblevenen, 2Ch 36:20 ; gevangenis voor gevangenen, Num 31:12 ."},{"catchword":"ulieden","tekst":"Die hier in Chaldea woont."},{"catchword":"uitkomen,","tekst":"Te weten uit Jeruzalem en Judea, herwaarts naar Babel gevankelijk gevoerd zijnde."},{"catchword":"weg zien,","tekst":"Dat is, manier van doen, zeden, leven en wandel; waaruit gij zult kunnen bemerken wat het voor een volk is, namelijk, gans verkeerd en verdorven."},{"catchword":"vertroost worden over het kwaad,","tekst":"Te weten niet met woorden, die gij van hen horen zult, maar met de ellende, boosheid en smaadheid, die gij aanzien zult. Want gij zult daaruit bemerken dat God meer dan reden heeft gehad, om hen aldus te straffen, zodat gij u over zijne oordelen tevreden zult houden."}],"23":[{"catchword":"in haar gedaan heb,","tekst":"Of, aan, met, of tegen haar, te weten Jeruzalem."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then came unto me man of the eldest of Israel [that is rulers and the heads of congregation that dwelt in Chaldea see Exod 3 on vers 16 and Levit 4 on vers 15 ]and sate down before my face [to ask the counsel of God concerning the future condition of the people both in Jerusalem and there in Chaldea see the following third vers compare above chap 8 vers 1 and below chap 20.1. ]"}],"2":[{"catchword":null,"tekst":"Then came the word of the Lord saying :"}],"3":[{"catchword":null,"tekst":"Child of man these men have set up their dung &acirc;&euro;&ldquo;gods in their heart [that is they have given them the highest place in their mind as they were wont also without the heart set up in high places so that they esteem and honour them on highly above all others things yea even above myself so in the sequel ] and they have put the stumbling block in their iniquity here is meant their idols for when they set up these before their faces contrary to Gods commands they were an occasion unto them for sinning many ways against Gods and of falling into many abominations so in the sequel thus idols are called a snare Exod 23.33 Deut 7.16 Judg 2.3 [am I then earnestly inquired by them ? [Heb being inquired of inquired of ;that is earnestly or uprightly required of As if he should say no These tings cannot stand together that a man should adhere unto idols and yet now withstanding ask counsel of true God .Others should I be inquired of at all by them ? that is I desire not to be inquired of by such a people The Lord was ordinarily inquired of by the high Priest being clothed with the Ephod see Numb 27.21 and the annotate Judg 1 on vers 1 or by a prophet 1 Sam 23 on vers 2 and 6 and 28 .6 2Sam 2 .1 2 Chrons 11.7.]"}],"4":[{"catchword":null,"tekst":"Therefore speak then and say unto them thus saith the Lord LORD every man [Heb man that is every man see Levit 15 on vers 2 so below vers 7] of the house of Israel [ that is Juda see above chap 6 on vers 2 meaning the Jews that dwelt in Chaldea ]that setteth up dung-gods in his heart and putteth the stumbling-block of his iniquity directly before his face and cometh to the prophet [to wit to ask counsel of God by him ]when he cometh [others in that time ] according to the multitudes of his dung-gods that is I will answer them not according to that which they would fain hear but as their great and manifold idolatry hath deserved others of or concerning the multitudes of their dung-gods that is I will answer them nothing else but that which concerneth the punishments which they have thereby deserved. ]"}],"5":[{"catchword":null,"tekst":"That I may take the house of Israel in their own heart [that is I will so answer them as that I will bring them to light that which was hid in their heart for they will pretend themselves to be godly people when they come to ask counsel of me but I will by my answer discover the wickedness that lurketh in their hearts ] because they are all estranged from me through their dung-gods."}],"6":[{"catchword":null,"tekst":"Therefore say unto the house of Israel thus saith the Lord LORD repent and turn yourselves from your dung-gods and turn your face away from all your abominations [that is nor only from your idolatry and fins committed against the first table but also from all your vallanies committed against the second table of the law understand here under the word faces the heart also without whose turning away the faces the also can hardly be turned away this is contrary to te putting of a stumbling-block before ones face above vers 3.]"}],"7":[{"catchword":null,"tekst":"For every man [Heb man as above vers 4] of the house of Israel and of the stranger [that is the proselyte that was become such having either before in Juda or afterwards in Chaldea embraced the Jews religion with the observation of their ceremonies see of such strangers Levit 17.8 and 25.35 ]that sojourneth in Israel which seperateth himself from after me and setteth up his dung-god in his heart and putteth the stumbling &acirc;&euro;&ldquo;block of his iniquity directly before his face [see above on vers 4] and cometh to the prophet to enquire by him of me [others to enquire of him concerning me ] I am the Lord shall be answered to him by me [that is not only by the prophet whom he enquireth but by or of myself who will answer him not so much by words as by plagues and punishment as the following words shew ]"}],"8":[{"catchword":null,"tekst":"And I will set my face against that man [see Levit 17 on vers 10 ]and will make him a token [to wit of my just vengeance against hypocrites for I will in the punishing such deal so fearfully and strangely with them that every one shall be frightened threat as at a public token of my vengeance propounded to everyone by me for his warning compare Deut 28.46 others I will lay him waste for a token that is that he may be a token ]and for proverbs [see Deut 28 on vers 37 also Job 17 on vers 6 see also 1 Kings 9.7.8 2 Chrons 7.21 ,22 Psal 44.14 ,15 and 69.12 Jerem 24.9 Habak 2.6 ]and I will cut him off from the midst of my people [see Levit 20 on vers 3] and ye shall know that I am the Lord ."}],"9":[{"catchword":null,"tekst":"Now when a prophet shall be persuaded [to wit by the hypocrites who ask counsel of them and desire them to prophesie some good thing unto them see of Hebrew word Judges 14 on vers 15 ] and shall have spoken something [to wit which the enquirer would fain hear but is false ] I the Lord have persuaded the prophet [to wit not by inspiring any evil into the prophet but by justly punishing the enquirers hypocrisie by the prophets lightness and covetousness that proceed from the prophet and from Satan compare 2 Sam 12.12 1Ki 12:15 and 22 .22 Jerem 4.10 with the annotate also 2 Thessa 2.11,12] and I will stretch out mine hand against him [to wit against the prophet to punish him so Exod 7.5, Isa 5.25 Jerem 15.6 below vers 13 and chap 25.7 & c ] and will destroy him from the midst of my people Israel ."}],"10":[{"catchword":null,"tekst":"And they shall bear their iniquity [the Hebrew word here signifieth the punishment which is deserved by the iniquity and offence see Levit 5 on vers 1 ]as the iniquity of the inquirer shall be so shall the iniquity of the prophet be :"}],"11":[{"catchword":null,"tekst":"That the house of Israel may go no more astray from after me and that they may no more pollute them selves with all transgression [which are frequently called pollution in scriptures as Ezra 9 .11 below chap 24.13 and 36.17 and 39.24 1 Thessa 4.7 Jas 1:1 ]then shall they be a people unto me [see Levit 26 on vers 12 ] and I will be a God unto them [see Genes 17 on vers 7 ] saith the Lord."}],"12":[{"catchword":null,"tekst":"Moreover the word of the Lord came to me saying :"}],"13":[{"catchword":null,"tekst":"Child of man when a land shall have sinned against me transgression grievously [Heb transgression that is committing transgression ] then will I stretch out mine hand against it and will break her staff of bread [see Levit 26 on vers 26 ] and send a famine into it to cut off men from beast from it :"}],"14":[{"catchword":null,"tekst":"Though these three men ,Noah ,Daniel ,and Job were in the midst of it [he nameth these three person because they amongst others were accepted of him and had received great mercies from him compare Jerem 1. 15] they should deliver only their own lives from the common destruction of the land that the word only must be here inserted may be gathered from the following 16 and 18 verses ]by their righteousness [ to wit considered and valued in the mediatour Christ whose perfect righteousness taketh away the imperfection that is in the righteousness of all the godly so that it is of free grace rewarded with a blessing ]saith the Lord LORD."}],"15":[{"catchword":null,"tekst":"If I cause evil beast to pass through the lands [this plague is threatened to a sinful people Levit 26.22 above chap 5.17 and was actually sent upon them 2Ki 17:25 ]which bereave it of children so that it become desolate that no man may pass through it [ Heb without goer through] because of the beasts ."}],"16":[{"catchword":null,"tekst":"These three man being in the midst of it as true as I live saith the Lord LORD if they should deliver sons and if they should deliver daughters [meaning that they should not deliver them as the following words shew and compare the following 18 vers ]they only should deliver themselves but the land should be desolate [here is spoken of an irrevocable sentence of God passed upon the abominable obstinacy and thankfulness of the people and that according to righteous judgments see below vers 23.]"}],"17":[{"catchword":null,"tekst":"Or when I bring the sword [that is war see Levit 26 on vers6 ]upon that land and say sword go through the land so that I cut off men and beasts from it [God speaketh to the liveless and brute creatures as if they had life and understanding to shew his omnipotency and the dominion that he hath over all things and nothing cometh to pass in any things how great or small soever they may be by chance and all by his omnipresent providence compare Deut 4 on vers 26. ]"}],"18":[{"catchword":null,"tekst":"Through those three men where in the midst of it as true as I live saith the Lord LORD they should not deliver sons nor daughters but they only shall be delivered by themselves ."}],"19":[{"catchword":null,"tekst":"Or when I send the pestilence into that land and pour out my fury upon it[ see above chap 7 on vers 8 with bloud [that is by killing and slaying many men and beasts as followeth for bloud is often taken for killing slaughter murder see Genes 37 on vers 26 see of the slaughter which God made by his angel 2Sam 24.15,16]to cut off from it men and beasts :"}],"20":[{"catchword":null,"tekst":"Through Noah ,Daniel and Job were in the midst of it as true as I live saith the Lord LORD if they should deliver a son or if they should deliver a daughter [implying that they shall not see above vers 16 ]they should deliver only their own soul by their righteousness [see above vers 14]"}],"21":[{"catchword":null,"tekst":"For thus saith the Lord LORD how much more when I shall have sent my four evil judgments [that is punishments or plagues see Exod 6.5 and 7.5 and the annotate compare 2 Chrons 20 .12 they are called evil or wicked because they are grievous painful and very hurtful unto men see also of four forts of plagues called kindness though in part distinct from these in this vers Jerem 5.3 ]the sword and the famine and the evil beast and the pestilence against Jerusalem to cut off men and beast from it ? [the meaning is if the afore-named men being alive when I do punish a land but with one plagues should be able to save themselves alone from the punishment how much should they be able to do it for themselves alone when I shall send four plagues at once upon Jerusalem ? others how much less to wit should they be able to deliver the people when God sendeth four plagues upon them ?]"}],"22":[{"catchword":null,"tekst":"Yet behold therein[ that is in Jerusalem ] shall be left escaped ones [Heb an escaping that is such as shall escape the destruction by the four forementioned plagues from escaping from escaping ones as 2 Kings 10.30 1 Chrons 4.43 so the remnant of the remaining ones or such as are left 2Chron 36.20 captivity for captive Numb 31.12 ]that shall be carried forth sons and daughters behold theyshall come forth [to wit out of Jerusalem and Judea be carried hither to Babel ]unto you that dwell here in Chaldean and ye shall see their way and their dealing that is their course of life and the manner of their conversation whereby ye shall be able to perceive what kind of people they are namely exceeding perverse and corrupt ]and ye shall be comforted concerning the evil that shall have brought upon Jerusalem yea concerning all I shall have brought upon it [ye shall be comforted to wit not with word that ye shall hear of them but with the misery wickedness and reproach which ye shall behold for ye shall thereby perceive that God hath had very great cause punish them in the manner so that ye shall rest contented and satisfied with his judgments as followeth .]"}],"23":[{"catchword":null,"tekst":"So they shall comfort you when ye shall see their way and their dealings and ye shall know that I have not done without cause all that I have done in it [or to with or against it to wit Jerusalem ]saith the Lord LORD ."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
