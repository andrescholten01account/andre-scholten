 kwam het woord van de HEERE tot mij. Hij zei:","2":"Mensenkind! Richt uw gezicht tegen Farao, de koning van Egypte, en profeteer tegen hem, en tegen heel Egypte.","3":"Spreek en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Farao, koning van Egypte! die grote zeedraak, die in het midden van zijn rivieren ligt; die zegt: Mijn rivier is van mij, en ik heb die voor mijzelf gemaakt.","4":"Maar Ik zal haken in uw kaken doen, en de vis van uw rivieren aan uw schubben doen kleven; en Ik zal u uit het midden van uw rivieren optrekken, en alle vis van uw rivieren zal aan uw schubben kleven.","5":"En Ik zal u in de woestijn achterlaten, u en alle vis van uw rivieren; op het open veld zult u vallen; u zult niet verzameld noch bijeengebracht worden; aan de dieren van de aarde en aan de vogels van de hemel heb Ik u tot voedsel gegeven.","6":"En alle inwoners van Egypte zullen weten dat Ik de HEERE ben, omdat zij voor het huis van Israël een rietstok geweest zijn.","7":"Toen zij u bij uw hand grepen, werd u gebroken, en spleet u al hun zijden; en toen zij op u leunden, werd u verbroken, en liet u al hun lenden stilstaan.","8":"Daarom, zo zegt de Heere HEERE: Zie, Ik zal het zwaard over u brengen, en Ik zal uit u mens en dier uitroeien.","9":"En Egypteland zal worden tot een wildernis en woestheid, en zij zullen weten dat Ik de HEERE ben; omdat hij zegt: De rivier is van mij, en ik heb die gemaakt.","10":"Daarom, zie, Ik zál u en uw rivieren; en Ik zal Egypteland stellen tot woeste, verlaten eenzaamheden, van de toren van Syene af tot aan de grens van Morenland.","11":"Geen mensenvoet zal erdoor trekken, en geen dierenvoet zal erdoor trekken, en het zal veertig jaar onbewoond zijn.","12":"Want Ik zal Egypteland tot een verwoesting stellen te midden van de verwoeste landen, en zijn steden zullen een woestheid zijn te midden van de verwoeste steden, veertig jaar; en Ik zal de Egyptenaren verstrooien onder de heidenvolken, en zal hen verspreiden in de landen.","13":"Maar zo zegt de Heere HEERE: Aan het einde van veertig jaar zal Ik de Egyptenaren verzamelen uit de volken waarheen zij verstrooid zijn.","14":"En Ik zal de gevangenschap van de Egyptenaren omkeren, en hen terugbrengen in het land van Pathros, in het land van hun koophandel; en daar zullen zij een nederig koninkrijk zijn.","15":"En het zal nederiger zijn dan de andere koninkrijken, en zich niet meer verheffen boven de heidenvolken; want Ik zal hen verminderen, zodat zij niet zullen heersen over de heidenvolken.","16":"En het zal voor het huis van Israël niet meer tot een vertrouwen zijn, dat hen aan de ongerechtigheid doet denken, wanneer zij naar hen omzien; maar zij zullen weten dat Ik de Heere HEERE ben.","17":"Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:","18":"Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft.","19":"Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.","20":"Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.","21":"Op die dag zal Ik de hoorn van het huis van Israël doen uitspruiten, en Ik zal u opening van de mond geven te midden van hen; en zij zullen weten dat Ik de HEERE ben."},"SV":{"1":"In het tiende jaar, in de tiende *maand*, op den twaalfden der maand, geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind! zet uw aangezicht tegen Farao, den koning van Egypte, en profeteer tegen hem, en tegen het ganse Egypte.","3":"Spreek en zeg: Zo zegt de Heere HEERE: Zie, Ik *wil* aan u, o Farao, koning van Egypte! dien groten zeedraak, die in het midden zijner rivieren ligt; die daar zegt: Mijn rivier is de mijne, en ik heb *die* voor mij gemaakt.","4":"Maar Ik zal haken in uw kaken doen, en den vis uwer rivieren aan uw schubben doen kleven; en Ik zal u uit het midden uwer rivieren optrekken, en al de vis uwer rivieren zal aan uw schubben kleven.","5":"En Ik zal u verlaten in de woestijn, u en al den vis uwer rivieren; op het open veld zult gij vallen; gij zult niet verzameld noch vergaderd worden; aan het gedierte der aarde en aan het gevogelte des hemels heb Ik u ter spijze gegeven.","6":"En al de inwoners van Egypte zullen weten, dat Ik de HEERE ben, omdat zij den huize Israëls een rietstaf geweest zijn.","7":"Als zij u bij uw hand grepen, zo werdt gij gebroken, en spleet hun alle zijden; en als zij op u leunden, zo werdt gij verbroken, en liet alle lenden op zichzelven staan.","8":"Daarom zo zegt de Heere HEERE: Zie, Ik zal het zwaard over u brengen, en Ik zal uit u mens en beest uitroeien.","9":"En Egypteland zal worden tot een wildernis en woestheid, en zij zullen weten, dat Ik de HEERE ben; omdat hij zegt: De rivier is mijn, en ik heb *die* gemaakt.","10":"Daarom, zie, Ik *wil* aan u en aan uw rivier; en Ik zal Egypteland stellen tot woeste wilde eenzaamheden, van den toren van Syene af, tot aan de landpale van Morenland.","11":"Geen mensenvoet zal door hetzelve doorgaan, en geen beestenvoet zal door hetzelve doorgaan, en het zal veertig jaren onbewoond zijn.","12":"Want Ik zal Egypteland stellen *tot* een verwoesting in het midden der verwoeste landen, en zijn steden zullen een woestheid zijn in het midden der verwoeste steden, veertig jaren; en Ik zal de Egyptenaars verstrooien onder de heidenen, en zal hen verspreiden in de landen.","13":"Maar zo zegt de Heere HEERE: Ten einde van veertig jaren zal Ik de Egyptenaars vergaderen uit de volken, waarhenen zij verstrooid zijn geworden.","14":"En Ik zal de gevangenis der Egyptenaren wenden, en hen wederbrengen in het land van Pathros, in het land huns koophandels; en aldaar zullen zij een nederig koninkrijk zijn.","15":"En het zal nederiger zijn dan de *andere* koninkrijken, en zich niet meer verheffen boven de heidenen; want Ik zal hen verminderen, dat zij niet zullen heersen over de heidenen.","16":"En het zal den huize Israëls niet meer zijn tot een vertrouwen, dat der ongerechtigheid doet gedenken, wanneer zij naar henlieden omzien; maar zij zullen weten, dat Ik de Heere HEERE ben.","17":"Voorts gebeurde het in het zeven en twintigste jaar, in de eerste *maand*, op den eersten der maand, *dat* het woord des HEEREN tot mij geschiedde, zeggende:","18":"Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn heir een groten dienst doen dienen tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn uitgeplukt; en noch hij, noch zijn heir heeft loon gehad vanwege Tyrus, voor den dienst, dien hij tegen haar gediend heeft.","19":"Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, den koning van Babel, Egypteland geven; en hij zal deszelfs menigte wegvoeren, en deszelfs buit buiten, en deszelfs roof roven, en het zal het loon zijn voor zijn heir.","20":"*Tot* zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewrocht hebben, spreekt de Heere HEERE.","21":"Te dien dage zal Ik den hoorn van het huis Israëls doen uitspruiten, en u opening des monds geven in het midden van hen; en zij zullen weten, dat Ik de HEERE ben."},"KJV":{"1":"In the tenth year, in the tenth *month*, in the twelfth *day* of the month, the word of the LORD came unto me, saying,","2":"Son of man, set thy face against Pharaoh king of Egypt, and prophesy against him, and against all Egypt:","3":"Speak, and say, Thus saith the Lord GOD; Behold, I *am* against thee, Pharaoh king of Egypt, the great dragon that lieth in the midst of his rivers, which hath said, My river *is* mine own, and I have made","4":"But I will put hooks in thy jaws, and I will cause the fish of thy rivers to stick unto thy scales, and I will bring thee up out of the midst of thy rivers, and all the fish of thy rivers shall stick unto thy scales.","5":"And I will leave thee *thrown* into the wilderness, thee and all the fish of thy rivers: thou shalt fall upon the open fields; thou shalt not be brought together, nor gathered: I have given thee for meat to the beasts of the field and to the fowls of the heaven.","6":"And all the inhabitants of Egypt shall know that I *am* the LORD, because they have been a staff of reed to the house of Israel.","7":"When they took hold of thee by thy hand, thou didst break, and rend all their shoulder: and when they leaned upon thee, thou brakest, and madest all their loins to be at a stand.","8":"Therefore thus saith the Lord GOD; Behold, I will bring a sword upon thee, and cut off man and beast","9":"And the land of Egypt shall be desolate and waste; and they shall know that I *am* the LORD: because he hath said, The river *is* mine, and I have made","10":"Behold, therefore I *am* against thee, and against thy rivers, and I will make the land of Egypt utterly waste *and* desolate, from the tower of Syene even unto the border of Ethiopia.","11":"No foot of man shall pass through it, nor foot of beast shall pass through it, neither shall it be inhabited forty years.","12":"And I will make the land of Egypt desolate in the midst of the countries *that are* desolate, and her cities among the cities *that are* laid waste shall be desolate forty years: and I will scatter the Egyptians among the nations, and will disperse them through the countries.","13":"Yet thus saith the Lord GOD; At the end of forty years will I gather the Egyptians from the people whither they were scattered:","14":"And I will bring again the captivity of Egypt, and will cause them to return *into* the land of Pathros, into the land of their habitation; and they shall be there a base kingdom.","15":"It shall be the basest of the kingdoms; neither shall it exalt itself any more above the nations: for I will diminish them, that they shall no more rule over the nations.","16":"And it shall be no more the confidence of the house of Israel, which bringeth *their* iniquity to remembrance, when they shall look after them: but they shall know that I *am* the Lord GOD.","17":"And it came to pass in the seven and twentieth year, in the first *month*, in the first *day* of the month, the word of the LORD came unto me, saying,","18":"Son of man, Nebuchadrezzar king of Babylon caused his army to serve a great service against Tyrus: every head *was* made bald, and every shoulder *was* peeled: yet had he no wages, nor his army, for Tyrus, for the service that he had served","19":"Therefore thus saith the Lord GOD; Behold, I will give the land of Egypt unto Nebuchadrezzar king of Babylon; and he shall take her multitude, and take her spoil, and take her prey; and it shall be the wages for his army.","20":"I have given him the land of Egypt *for* his labour wherewith he served against it, because they wrought for me, saith the Lord GOD.","21":"In that day will I cause the horn of the house of Israel to bud forth, and I will give thee the opening of the mouth in the midst of them; and they shall know that I *am* the LORD."}},"tsk":{"2":[{"kopje":"Richt","refs":["Ezech 6:2","Ezech 20:46","Ezech 21:2","Ezech 25:2","Ezech 28:21","Ezech 28:22"]},{"kopje":"Farao","refs":["Jer 44:30"]},{"kopje":"en tegen heel","refs":["Ezech 30:1","Ezech 32:32","Jes 18:1","Jes 19:17","Jes 20:1-6","Jer 9:25","Jer 9:26","Jer 25:18","Jer 25:19","Jer 43:8-13","Jer 46:2-16","Joël 3:19","Zach 14:18","Zach 14:19"]}],"3":[{"kopje":"Ik zál u","refs":["Ezech 29:10","Ezech 28:22","Ps 76:8","Jer 44:30","Nahum 1:6"]},{"kopje":"die grote","refs":["Ezech 32:2","Ps 74:13","Ps 74:14","Jes 27:1","Jes 51:9","Openb 12:3","Openb 12:4","Openb 12:16","Openb 12:17","Openb 13:2","Openb 13:4","Openb 13:11","Ope  Egypt:","3":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I am against thee, <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8577\">dragon</span> that <span class=\"wl wl-kjv\" data-code=\"H7257\">lieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of his <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H2975\">river</span> is mine own, and I have made","4":"But I will <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H2397\">hooks</span> in thy <span class=\"wl wl-kjv\" data-code=\"H3895\">jaws,</span> and I will cause the <span class=\"wl wl-kjv\" data-code=\"H1710\">fish</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers</span> to <span class=\"wl wl-kjv\" data-code=\"H1692\">stick</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H7193\">scales,</span> and I will bring thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1710\">fish</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers</span> shall <span class=\"wl wl-kjv\" data-code=\"H1692\">stick</span> unto thy scales.","5":"And I will <span class=\"wl wl-kjv\" data-code=\"H5203\">leave</span> thee 4975\">loins</span> to be at a stand.","8":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon thee, and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and beast","9":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> and <span class=\"wl wl-kjv\" data-code=\"H2723\">waste;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H2975\">river</span> is mine, and I have made","10":"Behold, therefore I am against thee, and against thy <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H2721\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H2723\">waste</span> and <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> from the <span class=\"wl wl-kjv\" data-code=\"H4024\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H5482\">Syene</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> of Ethiopia.","11":"No <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</sp -code=\"H6908\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> from the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> whither they were scattered:","14":"And I will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and will cause them to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H6624\">Pathros,</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H4351\">habitation;</span> and they shall be there a <span class=\"wl wl-kjv\" data-code=\"H8217\">base</span> kingdom.","15":"It shall be the <span class=\"wl wl-kjv\" data-code=\"H8217\">basest</span> of the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms;</span> neither shall it <span class=\"wl wl-kjv\" data-code=\"H5375\">exalt</span> itself any more above the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H4591\">diminish</span> them, that they shall no more <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> over the nations.","16":"And it shall be no more the <span class=\"wl wl-kjv\" data-code=\"H4009\">confidence</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H2142\">bringeth</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> to <span class=\"wl wl-kjv\" data-code=\"H2142\">remembrance,</span> when they shall <span class=\"wl wl-kjv\" data-code=\"H6437\">look</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them: but they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that l-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> her <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> and <span class=\"wl wl-kjv\" data-code=\"H7997\">take</span> her <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H962\">take</span> her <span class=\"wl wl-kjv\" data-code=\"H957\">prey;</span> and it shall be the <span class=\"wl wl-kjv\" data-code=\"H7939\">wages</span> for his army.","20":"I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> for his <span class=\"wl wl-kjv\" data-code=\"H6468\">labour</span> wherewith he <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> against it, because they <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> for me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","21":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> will I <span class=\"wl wl-kjv\" data-code=\"H6779\">cause</span> the <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to bud <span class=\"wl wl-kjv\" data-code=\"H6779\">forth,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H6610\">opening</span> of the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them; and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"tiende jaar,","tekst":"Na de gevankelijke wegvoering van Jechonia of Jojachin. Vergelijk boven Eze 1:2 , en onder Eze 33:21 , enz."},{"catchword":"tiende maand,","tekst":"In het kerkelijk jaar genoemd Tebeth, in het burgerlijk Tamus."}],"2":[{"catchword":"zet uw aangezicht","tekst":"Zie boven Eze 6:2 ."},{"catchword":"Faraö,","tekst":"Dezen houden sommigen geweest te zijn Farao Hofra. Zie Jer 44:30 , met de aantekening. Uit welke plaats afgenomen wordt dat hij schijnt geleefd te hebben ten tijde als de Joden, na Jeruzalems verwoesting door Nebukadnezar, vluchtten in Egypte. Anders was Farao een algemene naam der koningen van Egypte. Zie Gen 12:15 ."}],"3":[{"catchword":"Ik wil aan u,","tekst":"Gelijk boven Eze 28:22 . Alzo onder vs.10, en Eze 30:22 , enz."},{"catchword":"zeedraak,","tekst":"Zie Psa 74:13-14 ; Isa 27:1 ; en Isa 51:9 , en onder Eze 32:2 . Sommigen verstaan hier een krokodil."},{"catchword":"rivieren ligt;","tekst":"Versta, de verscheidene armen en stromen van de grote en vermaarde rivier de Nijl, waardoor hij meende zo verzekerd te zijn, dat geen vijand, ja zelfs geen god [gelijk Herodot. lib.2, schrijft] hem uit zijn rijk kon verdrijven."},{"catchword":"rivier is de mijne,","tekst":"Nijl, daarover heb ik alleen te gebieden, zij is alleen tot mijn voordeel en verzekering; niemand anders heeft er gezag over, of kan haar mij benemen of ontwenden."},{"catchword":"gemaakt","tekst":"Alzo geordineerd en verdeeld, tot gerief en sterkte van mijn koninkrijk."}],"4":[{"catchword":"haken in uw kaken doen,","tekst":"Vergelijk Amo 4:2 ."},{"catchword":"vis uwer rivieren","tekst":"Dat is, uwe onderdanen zal Ik met u uittrekken [gelijk de kleine vissen hangen aan de schubben van zulke grote] en u tezamen ter plaatse voeren en trekken, waar gij zult varen, als volgt: Ik zal mijn oordeel eensdeels door de Cyreners [gelijk sommigen uit Herodot,lib.2"}],"5":[{"catchword":"vallen;","tekst":"Dat is, geslagen worden en omkomen. Zie Gen 14:10 . Of vallen voor liggen; gelijk elders."},{"catchword":"verzameld noch vergaderd worden;","tekst":"Ter begrafenis, alzo elders."},{"catchword":"aan het gedierte der aarde","tekst":"Vergelijk Psa 74:14 , enz."}],"6":[{"catchword":"rietstaf geweest zijn","tekst":"Hen opruiende tot rebellie tegen de Chaldeën, met belofte van grote hulp, die zij niet hebben gehouden. Zie 2Ki 18:21 ."}],"7":[{"catchword":"gebroken,","tekst":"Of, gekrookt; hen niet alleen niet ondersteunende, maar ook kwetsende en steunende."},{"catchword":"zijden;","tekst":"Hebreeuws, zijde; of de ganse zijde. Anders: schouder; hier wordt van lenen, of leunen en steunen gesproken."},{"catchword":"liet alle lenden op zichzelven staan","tekst":"Hebreeuws, deedt hun alle lenden staan; dat is, gij verliet hen, liet hen staan op zichzelven, en bestaan zo zij het best konden, zonder hen te helpen of te ondersteunen, tegen uw beloften en hunne hoop of verwachting. Of aldus: En zoudt gij hun alle lenden doen slaan? dat is, staande of overeind houden."}],"8":[{"catchword":"zwaard over u brengen,","tekst":"Vijandelijken oorlog, moord en verwoesting."}],"9":[{"catchword":"hij zegt","tekst":"Farao."},{"catchword":"De rivier is mijn,","tekst":"Gelijk boven vs.3."}],"10":[{"catchword":"wil aan u en aan uw rivier;","tekst":"Gelijk boven vs.3."},{"catchword":"woeste wilde eenzaamheden,","tekst":"Hebreeuws, woestheden der woestheid, der eenzaamheid, of wildernis, dat is, ten uiterste woest maken."},{"catchword":"toren","tekst":"Hebreeuws, Migdol; dat sommigen voor de stad Migdol, waarvan zie Jer 44:1 , en Jer 46:14 ."},{"catchword":"Syene af,","tekst":"Hebreeuws, Seveneh; dat is, van het ene einde des lands tot het andere, gelijk enigen dit verklaren. Doch Syene was een vermaarde stad in Egypte, gelegen juist onder den Kreeftscirkel, of tropicus Cancri, Plin.lib.2"},{"catchword":"Morenland","tekst":"Hebreeuws, Cusch. Zie Gen 2:13 , en Gen 10:6 . Dat Morenland aan Egypte grenst, wordt gehouden buiten twijfel. Zie Isa 18:1-2 , en vergelijk onder Eze 30:4 ."}],"11":[{"catchword":"onbewoond zijn","tekst":"Zie van het Hebreeuwse woord Jer 17:6 ."}],"12":[{"catchword":"midden der verwoeste landen,","tekst":"Dat is, in zulken staat als andere verwoeste landen en steden plegen te zijn, alzo onder Eze 30:7 ."},{"catchword":"verspreiden in de landen","tekst":"Of, wannen, verschudden. Alzo onder Eze 30:23 ."}],"13":[{"catchword":"veertig jaren","tekst":"Na deze verwoesting, als de monarchie der Babyloniërs naar het einde zal gaan."}],"14":[{"catchword":"Pathros,","tekst":"Zie Gen 10:14 ."},{"catchword":"koophandels;","tekst":"Dat is, daar zij hunnen handel plegen te drijven met kopen en verkopen. Anders, verkering, woning. De zin is: Hun vaderland."},{"catchword":"nederig koninkrijk zijn","tekst":"Onder de monarchie der Perzen. Vergelijk boven Eze 17:14 ."}],"16":[{"catchword":"ongerechtigheid doet gedenken,","tekst":"Die zij in het handelen met de Egyptenaars begaan, en aderszins vanouds af vandaar gehaald hebben. Zie boven Eze 21:24 , met de aantekening, en wijders Eze 18:22 , Eze 18:24 , en Eze 23:19-21 ."},{"catchword":"henlieden omzien;","tekst":"Of, als zij naar hen omzagen; te weten naar de Egyptenaars; niet op mij, maar op Egypte vertrouwende, en alzo van mij afwijkende; waardoor zij mij oorzaak zouden geven om het een met het ander tezamen hunlieden te gedenken en te straffen. Zie Gen 8:1 ."}],"17":[{"catchword":"zeven en twintigste jaar,","tekst":"Zie vs.1."},{"catchword":"eerste maand,","tekst":"Nisan, in het kerkelijk jaar; Thisri in het burgerlijke."}],"18":[{"catchword":"Tyrus;","tekst":"Zie boven Eze 26 , Eze 27 , Eze 28 ."},{"catchword":"hoofden","tekst":"Hebreeuws, hoofdzijde."},{"catchword":"kaal geworden,","tekst":"Dat is, zijn krijgsvolk is bloot, berooid, vermoeid en uitgemergeld geworden door de belegering van Tyrus, als hebbende geduurd, naar het vermelden van de oude historiën [ Joseph. cont. App. lib.1, ] dertien jaar lang."},{"catchword":"alle zijden zijn uitgeplukt;","tekst":"Of, alle schouders zijn gestroopt, door het dragen van lasten."}],"19":[{"catchword":"deszelfs","tekst":"Van Egypteland."},{"catchword":"menigte wegvoeren,","tekst":"Of, gemene volk, of overvloed, rijkdom; ziet van het Hebreeuwse woord Psa 37:16 ; Jer 46:25 ; alzo onder Eze 30:4 , Eze 30:10 , Eze 30:15 , en Eze 31:2 , Eze 31:18 ; en Eze 32:12 , Eze 32:16 , enz."}],"20":[{"catchword":"arbeidsloon,","tekst":"Vergelijk Jer 22:3 ."},{"catchword":"haar gediend heeft,","tekst":"De stad Tyrus."},{"catchword":"voor Mij","tekst":"Niet dat het oogmerk van Nebukadnezar en zijn krijgsvolk geweest is, den waren God van Israël in dezen te gehoorzamen [die boos genoemd worden, onder Eze 30:12 ] , maar omdat God hen door zijn verborgen regering tot uitvoering van dit zijn oordeel gebruikt heeft als tot zijn dienst; zie Jer 25:9 . Hoewel het zou kunnen wezen dat Nebukadnezar van Ezechiëls profetie [als in Babylonië geschied zijnde] vernomen hebbende door Gods bestuur, zijn voornemen te stijver vervolgd hebbe. Vergelijk Jer 40:2-3 ."},{"catchword":"gearbeid hebben,","tekst":"Zie van zulk een gebruik van het Hebreeuwse woord Rth 2:19 ; Pro 31:13 ."}],"21":[{"catchword":"hoorn van het huis Israëls","tekst":"Dat is, de eer en het aanzien mijner kerk, wederom [als een kruid uit de aarde] doen rijzen in het midden der gevangenschap, zulks dat gij vrijuit van mij en mijne werken, zelfs in Babel, zult durven spreken en mijnen lof verbreiden; waartoe God ontwijfelijk gebruikt heeft zo de vervulling van zulke profetieën als de aangenaamheid, hoogheid en vermaardheid van Daniël en de zijnen. Zie Dan 2:46 , en Dan 3:29 , en Dan 4:37 , en Dan 5:29 . Of, men kan het // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

}

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
