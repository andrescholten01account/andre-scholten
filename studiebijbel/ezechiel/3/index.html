 spreek tot het huis Israëls.","2":"Toen opende ik mijn mond, en Hij gaf mij die rol te eten.","3":"En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.","4":"En Hij zei tot mij: Mensenkind, ga heen, kom tot het huis Israëls, en spreek tot hen met Mijn woorden.","5":"Want u bent niet gezonden tot een volk, diep van spraak en zwaar van tong, *maar* tot het huis Israëls;","6":"Niet tot veel volken, diep van spraak en zwaar van tong, van wie u de woorden niet kunt verstaan; zouden zij niet, als Ik u tot hen gezonden had, naar u geluisterd hebben?","7":"Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.","8":"Zie, Ik heb uw gezicht stijf gemaakt tegen hun gezichten, en uw voorhoofd stijf tegen hun voorhoofd.","9":"Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en wees niet ontzet voor hun gezichten, omdat zij een opstandig huis zijn.","10":"Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.","11":"En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen.","12":"Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!","13":"En *ik* *hoorde* het geluid van de vleugels van de dieren, die de een de ander raakten, en het geluid van de raderen tegenover hen; en het geluid van een groot ruisen.","14":"Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.","15":"En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.","16":"Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:","17":"Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.","18":"Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.","19":"Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.","20":"Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.","21":"Doch als u de rechtvaardige waarschuwt, opdat de rechtvaardige niet zondigt, en hij niet zondigt, zal hij zeker leven, omdat hij gewaarschuwd is; en u hebt uw ziel bevrijd.","22":"En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.","23":"En ik maakte mij op, en ging uit naar de vallei, en zie, de heerlijkheid van de HEERE stond daar, gelijk de heerlijkheid, die ik gezien had bij de rivier Chebar; en ik viel op mijn gezicht.","24":"Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.","25":"Want wat u aangaat, mensenkind, zie, zij zullen dikke touwen aan u leggen, en zij zullen u daarmee binden; daarom zult u niet uitgaan in het midden van hen.","26":"En Ik zal uw tong aan uw gehemelte doen kleven, zodat u stom worden zult, en hun niet zult zijn tot een bestraffende man; want zij zijn een opstandig huis.","27":"Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis."},"SV":{"1":"Daarna zeide Hij tot mij: Mensenkind, eet, wat gij vinden zult; eet deze rol, en ga, spreek tot het huis Israëls.","2":"Toen opende ik mijn mond, en Hij gaf mij die rol te eten.","3":"En Hij zeide tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honig, vanwege de zoetigheid.","4":"En Hij zeide tot mij: Mensenkind, ga henen, kom tot het huis Israëls, en spreek tot hen met Mijn woorden.","5":"Want gij zijt niet gezonden tot een volk, diep van spraak en zwaar van tong, *maar* tot het huis Israëls;","6":"Niet tot vele volken, diep van spraak en zwaar van tong, welker woorden gij niet kunt verstaan; zouden zij niet, zo Ik u tot hen gezonden had, naar u gehoord hebben?","7":"Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het ganse huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.","8":"Ziet, Ik heb uw aangezicht stijf gemaakt tegen hun aangezichten, en uw voorhoofd stijf tegen hun voorhoofd.","9":"Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en ontzet u niet voor hun aangezichten, omdat zij een wederspannig huis zijn.","10":"Verder zeide Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.","11":"En ga henen, kom tot de weggevoerden, tot de kinderen uws volks, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen.","12":"Toen nam de Geest mij op, en ik hoorde achter mij een stem van grote ruising, *zeggende*: Geloofd zij de heerlijkheid des HEEREN uit Zijn plaats!","13":"En *ik* *hoorde* het geluid van der dieren vleugelen, die de een den ander raakten, en het geluid der raderen tegenover hen; en het geluid ener grote ruising.","14":"Toen hief de Geest mij op, en nam mij weg, en ik ging henen, bitterlijk bedroefd door de hitte mijns geestes; maar de hand des HEEREN was sterk op mij.","15":"En ik kwam tot de weggevoerden te Tel-abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.","16":"Het gebeurde nu ten einde van zeven dagen, dat het woord des HEEREN tot mij geschiedde, zeggende:","17":"Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult gij het woord uit Mijn mond horen, en hen van Mijnentwege waarschuwen.","18":"Als Ik tot den goddeloze zeg: Gij zult den dood sterven, en gij waarschuwt hem niet, en spreekt niet, om den goddeloze van zijn goddelozen weg te waarschuwen, opdat gij hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.","19":"Doch als gij den goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddelozen weg niet bekeert, hij zal in zijn ongerechtigheid sterven; maar gij hebt uw ziel bevrijd.","20":"Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn aangezicht leg, hij zal sterven; omdat gij hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.","21":"Doch als gij den rechtvaardige waarschuwt, opdat de rechtvaardige niet zondige, en hij niet zondigt; hij zal zekerlijk leven, omdat hij gewaarschuwd is; en gij hebt uw ziel bevrijd.","22":"En de hand des HEEREN was daar op mij, en Hij zeide tot mij: Maak u op, ga uit in de vallei, en Ik zal daar met u spreken.","23":"En ik maakte mij op, en ging uit in de vallei, en ziet, de heerlijkheid des HEEREN stond aldaar, gelijk de heerlijkheid, die ik gezien had bij de rivier Chebar; en ik viel op mijn aangezicht.","24":"Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en Hij zeide tot mij: Ga, besluit u binnen in uw huis.","25":"Want u aangaande, mensenkind, ziet, zij zouden dikke touwen aan u leggen, en zij zouden u daarmede binden; daarom zult gij niet uitgaan in het midden van hen.","26":"En Ik zal uw tong aan uw gehemelte doen kleven, dat gij stom worden zult, en zult hun niet zijn tot een bestraffenden man; want zij zijn een wederspannig huis.","27":"Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en gij zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, die hore, en wie het laat, die late het; want zij zijn een wederspannig huis."},"KJV":{"1":"Moreover he said unto me, Son of man, eat that thou findest; eat this roll, and go speak unto the house of Israel.","2":"So I opened my mouth, and he caused me to eat that roll.","3":"And he said unto me, Son of man, cause thy belly to eat, and fill thy bowels with this roll that I give thee. Then did I eat *it*; and it was in my mouth as honey for sweetness.","4":"And he said unto me, Son of man, go, get thee unto the house of Israel, and speak with my words","5":"For thou *art* not sent to a people of a strange speech and of an hard language, *but* to the house of Israel;","6":"Not to many people of a strange speech and of an hard language, whose words thou canst not understand. Surely, had I sent thee to them, they would have hearkened","7":"But the house of Israel will not hearken unto thee; for they will not hearken unto me: for all the house of Israel *are* impudent and hardhearted.","8":"Behold, I have made thy face strong against their faces, and thy forehead strong against their foreheads.","9":"As an adamant harder than flint have I made thy forehead: fear them not, neither be dismayed at their looks, though they *be* a rebellious house.","10":"Moreover he said unto me, Son of man, all my words that I shall speak unto thee receive in thine heart, and hear with thine ears.","11":"And go, get thee to them of the captivity, unto the children of thy people, and speak unto them, and tell them, Thus saith the Lord GOD; whether they will hear, or whether they will forbear.","12":"Then the spirit took me up, and I heard behind me a voice of a great rushing, *saying*, Blessed *be* the glory of the LORD from his place.","13":"*I heard* also the noise of the wings of the living creatures that touched one another, and the noise of the wheels over against them, and a noise of a great rushing.","14":"So the spirit lifted me up, and took me away, and I went in bitterness, in the heat of my spirit; but the hand of the LORD was strong","15":"Then I came to them of the captivity at Telabib, that dwelt by the river of Chebar, and I sat where they sat, and remained there astonished among them seven days.","16":"And it came to pass at the end of seven days, that the word of the LORD came unto me, saying,","17":"Son of man, I have made thee a watchman unto the house of Israel: therefore hear the word at my mouth, and give them warning","18":"When I say unto the wicked, Thou shalt surely die; and thou givest him not warning, nor speakest to warn the wicked from his wicked way, to save his life; the same wicked *man* shall die in his iniquity; but his blood will I require at thine hand.","19":"Yet if thou warn the wicked, and he turn not from his wickedness, nor from his wicked way, he shall die in his iniquity; but thou hast delivered thy soul.","20":"Again, When a righteous *man* doth turn from his righteousness, and commit iniquity, and I lay a stumblingblock before him, he shall die: because thou hast not given him warning, he shall die in his sin, and his righteousness which he hath done shall not be remembered; but his blood will I require at thine hand.","21":"Nevertheless if thou warn the righteous *man*, that the righteous sin not, and he doth not sin, he shall surely live, because he is warned; also thou hast delivered thy soul.","22":"And the hand of the LORD was there upon me; and he said unto me, Arise, go forth into the plain, and I will there talk","23":"Then I arose, and went forth into the plain: and, behold, the glory of the LORD stood there, as the glory which I saw by the river of Chebar: and I fell on my face.","24":"Then the spirit entered into me, and set me upon my feet, and spake with me, and said unto me, Go, shut thyself within thine house.","25":"But thou, O son of man, behold, they shall put bands upon thee, and shall bind thee with them, and thou shalt not go out among","26":"And I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover: for they *are* a rebellious house.","27":"But when I speak with thee, I will open thy mouth, and thou shalt say unto them, Thus saith the Lord GOD; He that heareth, let him hear; and he that forbeareth, let him forbear: for they *are* a rebellious house."}},"tsk":{"1":[{"kopje":"eet","refs":["Ezech 3:10","Ezech 2:8","Ezech 2:9","1 Tim 4:15","Openb 10:9","Openb 10:10"]},{"kopje":"ga","refs":["Ezech 3:11","Ezech 3:15","Ezech 3:17-21","Ezech 2:3","Jer 24:1-7"]}],"3":[{"kopje":"en vul","refs":["Ezech 2:10","Job 32:18","Job 32:19","Jer 6:11","Jer 20:9","Joh 7:38","Kol 3:16"]},{"kopje":"Toen","refs":["Ps 119:11","Jer 15:16","Joh 6:53-63"]},{"kopje":"het was","refs":["Job 23:12","Ps 19:11","Ps 119:97","Ps 119:103","Spr 2:10","Spr 2:11","Openb 10:9","Openb 10:10"]}],"5":[{"kopje":"u","refs":["Jona 1:2","Jona 3:2-4","Hand 26:17","Hand 26:18"]},{"kopje":"diep van spraak en zwaar van tong","refs":["Ezech 3:6","Ps 81:6","Jes 33:19"]}],"6":[{"kopje":"diep van spraak en zwaar van tong","refs":["Jona 3:5-10","Matt 11:20-24","Matt 12:41","Matt 12:42","Luk 11:30-32","Hand 27:28","Rom 9:30-33"]}],"7":[{"kopje":"Israëls wil","refs":["1 Sam 8:7","Jer 25:3","Jer 25:4","Jer 44:4","Jer 44:5","Jer 44:16","Luk 10: wl\" data-l=\"L10\" data-code=\"H4805\">zijn</span> een opstandig <span class=\"wl\" data-l=\"L11\" data-code=\"H1004\">huis</span>."},"koppeling_kjv":{"1":"Moreover he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> that thou <span class=\"wl wl-kjv\" data-code=\"H4672\">findest;</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> this <span class=\"wl wl-kjv\" data-code=\"H4039\">roll,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","2":"So I <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and he caused me to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> that roll.","3":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> cause thy <span class=\"wl wl-kjv\" data-code=\"H990\">belly</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> thy <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> with this <span class=\"wl wl-kjv\" data-code=\"H4039\">roll</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee. Then did I <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; and it was in my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> as <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> for sweetness.","4":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">get</span> thee unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with my words","5":"For thou art not <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of a <span class=\"wl wl-kjv\" data-code=\"H6012\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">speech</span> and of an <span class=\"wl wl-kjv\" data-code=\"H3515\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">language,</span> but to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel;","6":"Not to <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of a <span class=\"wl wl-kjv\" data-code=\"H6012\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">speech</span> and of an <span class=\"wl wl-kjv\" data-code=\"H3515\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">language,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> thou canst not <span class=\"wl wl-kjv\" data-code=\"H8085\">understand.</span> Surely, had I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> thee to them, they would have hearkened","7":"But the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H14\">will</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto thee; for they <span class=\"wl wl-kjv\" data-code=\"H14\">will</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me: for all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are <span class=\"wl wl-kjv\" data-code=\"H2389\">impudent</span> and <span class=\"wl wl-kjv\" data-code=\"H7186\">hardhearted.</span>","8":"Behold, I have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead</span> <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> their foreheads.","9":"As an <span class=\"wl wl-kjv\" data-code=\"H8068\">adamant</span> <span class=\"wl wl-kjv\" data-code=\"H2389\">harder</span> than <span class=\"wl wl-kjv\" data-code=\"H6864\">flint</span> have I <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thy <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead:</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> them not, neither be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> at their <span class=\"wl wl-kjv\" data-code=\"H6440\">looks,</span> though they be a <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellious</span> house.","10":"Moreover he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> all my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that I shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> with thine ears.","11":"And <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">get</span> thee to them of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> whether they will <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> or whether they will forbear.","12":"Then the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> took me <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> me a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7494\">rushing,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> from his place.","13":"I heard also the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> of the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures</span> that <span class=\"wl wl-kjv\" data-code=\"H5401\">touched</span> <span class=\"wl wl-kjv\" data-code=\"H802\">one</span> <span class=\"wl wl-kjv\" data-code=\"H269\">another,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H212\">wheels</span> over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> them, and a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> rushing.","14":"So the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> lifted me <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and took me <span class=\"wl wl-kjv\" data-code=\"H3947\">away,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> in <span class=\"wl wl-kjv\" data-code=\"H4751\">bitterness,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2534\">heat</span> of my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was strong","15":"Then I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to them of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> at <span class=\"wl wl-kjv\" data-code=\"H8512\">Telabib,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H3529\">Chebar,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> where they <span class=\"wl wl-kjv\" data-code=\"H3427\">sat,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">remained</span> there <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days.","16":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","17":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee a <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> at my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and give them warning","18":"When I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> and thou givest him not <span class=\"wl wl-kjv\" data-code=\"H2094\">warning,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1696\">speakest</span> to <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> from his <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> to save his <span class=\"wl wl-kjv\" data-code=\"H2421\">life;</span> the same <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> man shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> but his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> will I <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> at thine hand.","19":"Yet if thou <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> not from his <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness,</span> nor from his <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> but thou hast <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> thy soul.","20":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Again,</span> When a <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> man doth <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from his <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> a <span class=\"wl wl-kjv\" data-code=\"H4383\">stumblingblock</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> because thou hast not given him <span class=\"wl wl-kjv\" data-code=\"H2094\">warning,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered;</span> but his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> will I <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> at thine hand.","21":"Nevertheless if thou <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> man, that the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> not, and he doth not <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> because he is <span class=\"wl wl-kjv\" data-code=\"H2094\">warned;</span> also thou hast <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> thy soul.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was there upon me; and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H1237\">plain,</span> and I will there talk","23":"Then I <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H1237\">plain:</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> there, as the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> which I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H3529\">Chebar:</span> and I <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on my face.","24":"Then the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into me, and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> me upon my <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H935\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> thyself <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> thine house.","25":"But thou, O <span class=\"wl wl-k t","tekst":"Versta, ene stijfte, voortkomende niet uit de verkeerde natuur, die in een wrevelig gemoed bestaat en zich vertoont in een onbeschaamd aangezicht, maar uit Christus' Geest, bestaande in een vast vertrouwen op Gods genadige hulp, verenigd met wakkerheid in het werk en kloekmoedigheid in het uiterlijk gelaat."}],"9":[{"catchword":"diamant,","tekst":"Zie van het Hebreeuwse woord schamir, hetwelk velen diamant overzetten; Jer 17:1 ."},{"catchword":"omdat zij een wederspannig huis zijn","tekst":"De Heere geeft reden, waarom Hij zijnen profeet met sterkte voorzien had, opdat hij niet zou vrezen, te weten omdat hij met een zeer moedwillig volk te doen had, hetwelk met een onversaagde kloekmoedigheid bejegend moest worden. Anders: hoewel zij een wederspannig huis zijn. Alzo zou de reden uitgedrukt zijn, waarom de profeet zich zou mogen ontsteld vinden. Hebreeuws, een huis der wederspannigheid; alzo in het volgende."}],"11":[{"catchword":"weggevoerden,","tekst":"Hebreeuws, wegvoering; zie boven Eze 1:1 ."},{"catchword":"kinderen","tekst":"Dat is, tot uw volk en natie, namelijk de weggevoerde Joden; vergelijk Gen 23:11 ; 2Ch 35:5 , enz."},{"catchword":"uws volks,","tekst":"God noemt de Israëlieten niet zijn volk, omdat zij Hem wederspannig waren, maar Ezechiëls volk, dat is, die van zijn natie waren; vergelijk Exo 32:7 ."},{"catchword":"hetzij dat zij horen zullen,","tekst":"Zie boven Eze 2:5 ."}],"12":[{"catchword":"Geest mij op,","tekst":"Zie boven Eze 2:2 ."},{"catchword":"een stem van grote ruising,","tekst":"Te weten gemaakt door de dieren, engelen, of cherubim; zie vs.13."},{"catchword":"Geloofd zij de heerlijkheid","tekst":"Vergelijk Isa 6:3 ; Luk 2:13-14 ; Rev 4:8 ."},{"catchword":"des HEEREN","tekst":"Die boven op den troon zat; zie boven Eze 1:26 . De zin is dat zijne heerlijkheid niet zou verminderd worden door de verwoesting der stad Jeruzalem en van den tempel, maar veelmeer verheven door de bewijzingen zijner gerechtigheid tegen de afvallige Joden."},{"catchword":"uit Zijn plaats","tekst":"Te weten verhuizende en scheidende. Versta door deze plaats Jeruzalem en voornamelijk den tempel, dien God tot zijne woning, als een teken zijner tegenwoordigheid onder dat volk verkoren had; 1Ki 8:13 ; 2Ch 6:2 ; Psa 132:13-14 . Deze plaats zou God voor een tijdlang verlaten; Hos 5:15 ; Mic 1:3 ."}],"13":[{"catchword":"hoorde","tekst":"Dit woord is hier ingevoegd uit vs.12."},{"catchword":"het geluid van der dieren vleugelen,","tekst":"Hebreeuws, stem; alzo in het volgende. Dit was een teken dat de heilige engelen met een heerlijk geluid van toestemming de oordelen des oppersten Rechters vereerd en grootgemaakt hebben."},{"catchword":"de een den ander","tekst":"Hebreeuws, de vrouw aan hare zuster; dat is, de een den ander. Zie boven Eze 1:9 ."},{"catchword":"raakten,","tekst":"Hebreeuws, kusten; dat is, aanstieten, aanraakten, of aanroerden."},{"catchword":"het geluid der raderen","tekst":"Hiermede was te verstaan gegeven dat de ondergang der Joden haastelijk komen, en daartoe zeer verschrikkelijk wezen zou."},{"catchword":"hen;","tekst":"Te weten de dieren, of de vleugelen der dieren."}],"14":[{"catchword":"Geest mij op,","tekst":"Te weten de Heilige Geest. Zie boven Eze 1:12 , en Eze 2:2 ."},{"catchword":"nam mij weg,","tekst":"Te weten uit de plaats, in welke hij het gezicht zag, tot de woning der gevangenen. Met het gezicht van zijn geest kon ook wel geschieden de vervoering van zijn lichaam."},{"catchword":"bitterlijk bedroefd","tekst":"Hebreeuws, bitter, dat is innerlijk zeer bedroefd. Zie 2Ki 4:27 ."},{"catchword":"door de hitte","tekst":"Dat is, door de hittige ontsteltenis en verdrietigheid van mijn gemoed, veroorzaakt in mij omdat ik tot dezen profetischen dienst beroepen werd en zo verschrikkelijke dingen verkondigen moest. Ezechiël bekent zijne zwakheid. Zie gelijke voorbeelden van zwakheid in Mozes; Exo 3:11 , enz., en Exo 4:1 , Exo 4:10 ; in Jeremia, Jer 1:6 ."},{"catchword":"geestes;","tekst":"Versta den eigen wil, genegenheid en drijving van den profeet, die hier tegen de kracht van den Heiligen Geest gesteld wordt. Zie 2Ki 19:7 ."},{"catchword":"de hand des HEEREN was sterk op mij","tekst":"Versta de kracht des Heeren, die den tegenstand van Ezechiëls zwakke natuur heeft overwonnen. Anderen verstaan den Geest der profetie gelijk boven Eze 1:3 . Zie de aantekening."}],"15":[{"catchword":"weggevoerden","tekst":"Hebreeuws, de wegvoering. Zie boven Eze 1:1 ."},{"catchword":"Tel-abib,","tekst":"De woorden betekenen een hoop van groene aren. Vergelijk Exo 9:31 ; Lev 2:14 . Dat is, van nieuwe vruchten. Doch Tel Abib wordt hier genomen voor een landstreek alzo genaamd, gelegen in Mesopotamië omtrent de rivier Eufraat. Zie Ezr 2:59 ."},{"catchword":"Chebar woonden,","tekst":"Zie boven Eze 1:1 ."},{"catchword":"en ik bleef waar zij woonden;","tekst":"Anders: en [aan] Haescher, waar zij woonden. Aldus is Haescher de naam ener andere rivier, genaamd bij de landbeschrijvers Saocora, tussen welke en de rivier Chebar de landstreek Tel Abib zou gelegen zijn."},{"catchword":"bleef daar","tekst":"Het Hebreeuwse woord betekent dikwijls niet alleen wonen, maar ook blijven. Zie 2Ch 32:10 ."},{"catchword":"verbaasd","tekst":"Te weten over de schrikkelijke oordelen Gods, die over de Israëlieten zouden vallen, en die ik moest verkondigen."},{"catchword":"in het midden van hen","tekst":"Onder hen."},{"catchword":"zeven dagen","tekst":"Zolang zat hij stil zonder iets te openbaren, òf omdat hij als bedwelmd zijnde, niet wist hoe hij zijn dienst aanvangen zou, òf omdat hij een schroom daarvan had, òf omdat hij nader en breder bevel van God verwachtte."}],"17":[{"catchword":"wachter gesteld","tekst":"Zo worden de profeten en andere bedienaars van het Goddelijke Woord genaamd, omdat zij van God gesteld zijn om zijn volk te waarschuwen van alle gevaren, voortkomende uit valse leer of ergerlijken wandel. Zie Isa 21:11 , en Isa 52:8 , en Isa 56:10-11 ; Jer 6:17 , onder Eze 33:2 ; Act 20:28-29 . Het is ene gelijkenis, genomen van de wachters, die op hoge torens of elders gesteld worden om de inwoners der plaats te waarschuwen tegen de aankomst der vijanden of enig ander onraad, ten einde zij daartegen op hunne hoede zouden wezen. Zie 1Sa 14:16 ; 2Sa 13:34 ; 2Sa 18:24 ; 2Ki 9:17 ."},{"catchword":"van Mijnentwege","tekst":"Hebreeuws, van, of uit mij; dat is, van mijnentwege, uit mijnen naam, last en bevel."},{"catchword":"waarschuwen","tekst":"Zie van dit woord Psa 19:12 ."}],"18":[{"catchword":"den dood sterven,","tekst":"Hebreeuws, stervende zult gij sterven. Vergelijk Gen 2:17 , en Gen 3:4 , met de aantekening."},{"catchword":"goddelozen weg te waarschuwen,","tekst":"Zie Pro 2:12 ."},{"catchword":"hem in het leven behoudt;","tekst":"Te weten, niet als God, de enige werkmeester, door zijn eigen kracht, maar als zijn instrument door de bediening van zijn woord, hetwelk de kracht Gods genaamd wordt; 1Co 1:18 . Zie 1Co 3:5-9 . Alzo worden de dienaars van God gezegd velen te rechtvaardigen. Dan 12:3 ; vissers der mensen te zijn, Mat 4:19 ; een licht en zaligheid der heidenen; Act 13:47 ; de ogen der mensen te openen om zich van de duisternis tot het licht te bekeren, enz., Act 26:18 ; zichzelven en die hen horen te behouden, 1Ti 4:16 ; de ziel van den dood te behouden en menigte der zonden te bedekken, Jam 5:20 ; vergelijk Eze 1:10 ."},{"catchword":"in zijn ongerechtigheid sterven,","tekst":"Dat is, om zijne ongerechtigheid; vergelijk Lev 15:13 , onder vs.19,20, en Eze 18:24 ."},{"catchword":"bloed","tekst":"Zie Gen 42:22 ."}],"19":[{"catchword":"bevrijd","tekst":"Te weten van mijne wraak en straf, die anders over u zou gekomen zijn; gelijk onder vs.21."}],"20":[{"catchword":"rechtvaardige","tekst":"Te weten in den schijn voor de mensen, niet in de waarheid voor God. Alzo is het woord rechtvaardig genomen Pro 18:17 , onder Eze 18:24 , Eze 18:26 , en Eze 33:13 ; Mat 9:13 ; Luk 18:9 , Luk 18:14 . Idem, geloof voor een schijngeloof, Luk 8:13 ; Act 8:13 , en liefde voor schijnliefde, 1Jo 3:18 ; en kinderen van het koninkrijk voor degenen, die schenen zodanigen te zijn; Mat 8:12 ."},{"catchword":"gerechtigheid afkeert,","tekst":"Dat is, schijngerechtigheid, te weten die den uitwendigen luister daarvan heeft, maar niet den verborgen wortel; alzo onder Eze 18:24 , Eze 18:26 , en Eze 33:13 ; Mat 5:20 ."},{"catchword":"aanstoot","tekst":"Dit wordt God gezegd te doen, niet met den mens eigenlijk tot de zonde te bewegen en aan te drijven, maar door hem in den weg zijner ongerechtigheid te laten, ja aan zijn bozen vrijen wil over te geven, en de gelegenheden te laten voorkomen, waardoor hij zichzelven in het verderf brengt. Anders: zo zal Ik een aanstoot voor zijn aangezicht leggen; [dat is, hem om zijne zonde straffen] hij zal sterven."},{"catchword":"in zijn zonde sterven,","tekst":"Dat is, om zijne zonde; zie boven vs.18."},{"catchword":"zullen niet gedacht worden;","tekst":"Dat is, zullen in gene rekening komen, noch God bewegen om hem van de straf vrij te houden; alzo onder Eze 18:24 , en Eze 33:13 ."}],"21":[{"catchword":"hij niet zondigt;","tekst":"Versta dit van de heersende zonde, en waaraan de mens geen oprecht berouw heeft, 1Jo 3:6 , 1Jo 3:9 ; want de ware rechtvaardigen zondigen ook; maar hebben berouw daarvan; Ecc 7:20 ; Joh 8:7 ; 1Jo 1:8 ."},{"catchword":"zekerlijk leven,","tekst":"Hebreeuws, levende leven; alzo onder Eze 18:28 ."},{"catchword":"gewaarschuwd is;","tekst":"Te weten dadelijk, metterdaad, krachtiglijk, werkelijk, en mitsdien zich voor gewaarschuwd houdende, de waarschuwing aannemende, of zich latende waarschuwen, de rechte vrucht der waarschuwing door Gods genade verkrijgende, waardoor hij het gevaar ontgaat en behouden wordt."}],"22":[{"catchword":"was","tekst":"Of, kwam. Zie boven Eze 1:3 ."},{"catchword":"daar op mij,","tekst":"Te weten te Tel-Abib. Zie daarvan boven vs.15."},{"catchword":"vallei,","tekst":"Het Hebreeuwse woord betekent een laag veld, dat tussen de bergen ligt en van dezelve schijnt afgesneded (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
