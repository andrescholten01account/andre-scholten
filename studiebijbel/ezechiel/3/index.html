oorden het goud komt; maar bij God is een geweldige majesteit!", "Jer 30:12-15": "Want zo zegt de HEERE: Uw breuk is dodelijk, uw plaag is smartelijk. Er is niemand die uw zaak behartigt, aangaande het gezwel; u hebt geen heelpleisters. Al uw minnaars hebben u vergeten, zij vragen niet naar u; want Ik heb u geslagen met de plaag van een vijand, met de kastijding van iemand wrede; om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn.", "Hand 20:28-31": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed. Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen. En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "Matt 13:57": "En zij namen aanstoot aan Hem. Maar Jezus zei tegen hen: Een profeet is niet ongeëerd, behalve in zijn vaderstad en in zijn huis.", "1 Kron 16:24": "Vertelt Zijn eer onder de heidenen, Zijn wonderwerken onder alle volken.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "Rom 9:32": "Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "Hab 1:3": "Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Ef 4:17-19": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed. Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart; Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 8:4": "En zie, de heerlijkheid van de God van Israël was daar, naar de gedaante die ik in de vallei gezien had.", "Spr 30:6": "Voeg niets toe aan Zijn woorden, opdat Hij u niet bestraft, en u leugenachtig wordt bevonden.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "2 Tess 2:3": "Laat niemand u op enige manier verleiden; want die dag komt niet, tenzij eerst de afval gekomen is, en de mens van de zonde geopenbaard wordt, de zoon van het verderf;", "Ezech 2:6-8": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis. Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig. Doch u, mensenkind, hoor wat Ik tot u spreek; wees u niet opstandig, zoals dat opstandige huis; open uw mond, en eet, wat Ik u geef.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Jes 5:18-25": "Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen! Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen! Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Ezech 20:14": "Maar Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, voor wier ogen Ik hen uitleidde.", "Ef 4:11": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars;", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Mark 7:13": "Zo maakt u Gods woord krachteloos door uw overlevering, die u heeft ingesteld; en vele dergelijke dingen doet u.", "Ezech 23:35": "Daarom, zo zegt de Heere HEERE: Omdat u Mij vergeten hebt, en Mij achter uw rug geworpen hebt, daarom draagt u ook uw schandelijkheid en uw hoererijen.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Ezech 22:1": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Joh 4:1": "Toen de Heere dan begreep dat de Farizeeën gehoord hadden dat Jezus meer discipelen maakte en doopte dan Johannes,", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ezech 20:44": "Zo zult u weten dat Ik de HEERE ben, wanneer Ik met u gedaan zal hebben om Mijn Naam, niet naar uw slechte wegen, noch naar uw verdorven handelingen, o huis van Israël, spreekt de Heere HEERE.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Luk 6:47": "Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt.", "Job 2:13": "Zo zaten zij met hem op de grond, zeven dagen en zeven nachten; en niemand sprak een woord tegen hem, want zij zagen dat de smart zeer groot was.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Gal 1:10": "Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.", "Matt 15:3": "Maar Hij antwoordde en zei tegen hen: Waarom overtreedt u ook het gebod van God, door uw overlevering?", "Gal 1:12": "Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Ezech 21:1": "Het woord van de HEERE kwam tot mij, en Hij zei:", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Ezech 1:4": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur.", "Ps 147:15": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "1 Tim 1:11": "Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.", "Matt 24:10": "En dan zullen er velen ten val komen, en zullen elkaar overleveren, en elkaar haten.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Hand 8:23": "Want ik zie dat u bent in een geheel bittere gal en in de samenknoping van ongerechtigheid.", "Ps 49:21": "De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.", "Spr 2:12-19": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt; Van hen die de paden van de oprechtheid verlaten, om te gaan in de wegen van de duisternis; Die blij zijn met het doen van kwaad, zich verheugen in de verkeerdheden van de kwade;", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Hebr 12:18-21": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer, En tot het geschal van de bazuin, en de stem van de woorden; waarbij zij die het hoorden, baden dat het woord tot hen niet meer gesproken zou worden. (Want zij konden niet dragen wat er geboden werd: Zelfs als een dier de berg aanraakt, zal het gestenigd of met een pijl doorschoten worden.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Jona 3:2-4": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek. Toen maakte Jona zich op, en ging naar Nineve, naar het woord van de HEERE. Nineve nu was een grote stad van God, van drie dagreizen. En Jona begon in de stad te gaan, een dagreis; en hij predikte, en zei: Nog veertig dagen, dan zal Nineve worden omgekeerd.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "2 Kron 19:2-4": "En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u. Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken. Josafat nu woonde in Jeruzalem; en hij trok opnieuw uit onder het volk, van Berseba af tot het gebergte van Efraïm toe, en bracht hen terug tot de HEERE, de God van hun vaderen.", "Jer 44:16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "Ezech 37:18": "En wanneer de kinderen van uw volk tot u zullen spreken en zeggen: Wilt u ons niet duidelijk maken wat u met deze dingen bedoelt?", "Hoogl 5:7": "De wachters die in de stad rondgingen, vonden mij, zij sloegen mij, zij verwondden mij; de wachters op de muren namen mijn sluier van mij af.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "Ezech 33:17": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Gen 13:13": "En de mannen van Sodom waren slecht, en grote zondaars tegen de HEERE.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Deut 9:24": "Opstandig bent u geweest tegen de HEERE, vanaf de dag dat ik u gekend heb.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Lev 10:8-11": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Jes 6:3": "En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Ps 36:4": "De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Matt 5:13": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "2 Tess 2:15": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief.", "Ezech 10:4": "Toen hief de heerlijkheid van de HEERE zich omhoog van boven de cherub, naar de drempel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van de glans van de heerlijkheid van de HEERE.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "1 Kor 2:8": "Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Ef 4:18": "Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart;", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Jes 21:11": "De last van Duma. Men roept tot mij uit Seïr: Wachter! wat is er van de nacht? Wachter! wat is er van de nacht?", "Lev 5:4-19": "Of als een mens zal hebben gezworen, onbedacht met zijn lippen uitsprekend om kwaad te doen of om goed te doen, wat de mens ook onbedacht uitspreekt in een eed; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij aan een van die dingen schuldig. Het zal dan gebeuren, als hij aan een van die dingen schuldig is, dat hij zal belijden waarin hij gezondigd heeft; En hij zal zijn schuldoffer aan de HEERE brengen voor zijn zonde die hij gezondigd heeft: een wijfje van het kleinvee, een lam of een jonge geit, als zondoffer; en de priester zal voor hem verzoening doen vanwege zijn zonde.", "Ezech 36:23": "Want Ik zal Mijn grote Naam heiligen, die onder de heidenen ontheiligd is, die u in het midden van hen ontheiligd hebt; en de heidenen zullen weten dat Ik de HEERE ben, spreekt de Heere HEERE, als Ik aan u voor hun ogen zal geheiligd zijn.", "2 Tim 1:6-13": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Ezech 33:2": "Mensenkind! Spreek tot de kinderen van uw volk, en zeg tegen hen: Wanneer Ik het zwaard over een land breng, en het volk van het land een man uit hun gebied neemt en hem voor zichzelf tot een wachter stelt;", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Job 32:18": "Want ik ben vol woorden; de geest in mijn binnenste benauwt mij.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ps 97:9": "Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.", "Hebr 10:27": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Jes 62:3": "En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Mark 10:43-45": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn. En wie van u de eerste wil worden, die zal ieders dienstknecht zijn. Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven als losprijs voor velen.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Pred 3:18": "Ik zei in mijn hart over de toestand van de mensenkinderen, dat God hen zal aantonen, en dat zij zullen zien, dat zij als de dieren zijn aan zichzelf.", "Jes 6:1-5": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ezech 6:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "1 Tess 5:20": "Veracht de profetieën niet.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Mark 13:34": "Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;", "Dan 12:9": "En Hij zei: Ga heen, Daniël! want deze woorden zijn toegesloten en verzegeld tot de tijd van het einde.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Ezech 10:18": "Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Jer 8:9": "De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Job 37:5": "God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.", "Deut 4:12": "Zo sprak de HEERE tot u uit het midden van het vuur; u hoorde de stem van de woorden, maar u zag geen gelijkenis, alleen de stem.", "Jes 65:11-16": "Maar u, verlaters van de HEERE, u, vergeters van de berg van Mijn heiligheid, u, aanrichters van een tafel voor die bende, en u, opvullers van het drank voor dat getal! Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Hebr 4:1": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Matt 18:6": "Maar wie een van deze kleinen die in Mij geloven, doet struikelen, voor hem zou het beter zijn dat een molensteen aan zijn hals gehangen werd en dat hij in de diepte van de zee verzonken werd.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Luk 16:17": "En het is lichter dat de hemel en de aarde voorbijgaan, dan dat één tittel van de wet valt.", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "Jes 60:19-21": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid. Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen. En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Gen 42:22": "En Ruben antwoordde hun en zei: Heb ik het niet tegen u gezegd toen ik zei: Zondig niet tegen deze jongen! Maar u hoorde niet; en ook zijn bloed, zie, het wordt opgeëist!", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Job 15:20-35": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Gal 1:11": "Maar ik maak u bekend, broeders, dat het Evangelie dat door mij verkondigd is, niet naar de mens is.", "Ezech 10:9-19": "Toen zag ik, en zie, vier raderen waren bij de cherubs; één rad was bij elke cherub; en de gedaante van de raderen was als de kleur van een turkooissteen. En wat hun gedaanten betreft, die vier hadden allemaal dezelfde gelijkenis, alsof er een rad in het midden van een rad was. Als zij gingen, gingen zij naar hun vier zijden; zij keerden zich niet om als zij gingen; maar naar de plaats waar het hoofd heen keek, daar volgden zij naar; zij keerden zich niet om als zij gingen.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Jes 33:10": "Nu zal Ik opstaan, zegt de HEERE, nu zal Ik verhoogd worden, nu zal Ik verheven worden.", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "1 Kor 7:6": "Maar dit zeg ik als toegeving, niet als bevel.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Matt 10:11-13": "En in welke stad of dorp u ook ingaat, onderzoekt wie daarin waardig is; en blijft daar, totdat u vertrekt. En als u het huis ingaat, groet het dan. En als dat huis waardig is, laat uw vrede dan over dat huis komen; maar als het niet waardig is, laat uw vrede dan naar u terugkeren.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "2 Kron 15:2-4": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten. Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet. Maar toen zij zich in hun nood bekeerden tot de HEERE, de God van Israël, en Hem zochten, werd Hij door hen gevonden.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "Ex 24:17": "En het aanzien van de heerlijkheid van de HEERE was als een verterend vuur, op de top van die berg, in de ogen van de kinderen Israëls.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Spr 1:30": "Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Joh 14:13": "En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.", "Ezech 30:1": "Verder gebeurde het woord van de HEERE tot mij: het zei:", "Ezech 1:28": "Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Spr 1:29": "Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.", "Jes 21:12": "De wachter zei: De morgenstond is gekomen, en het is nog nacht; als u wilt vragen, vraag; keer terug, kom.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Jes 49:3": "En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "1 Tess 5:12": "En wij bidden u, broeders, erken hen die onder u arbeiden, en uw voorstanders zijn in de Heere, en u vermanen;", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Job 13:11": "Zal Zijn hoogheid u niet verschrikken, en Zijn schrik over u vallen?", "Jes 63:14": "Zoals een dier dat afgaat in de valleien, heeft de Geest van de HEERE hun rust gegeven. Zo hebt U Uw volk geleid, opdat U Uzelf een heerlijke Naam zou maken.", "Jer 20:7-9": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij. Want zo vaak ik spreek, roep ik uit, roep ik geweld en verwoesting; omdat het woord van de HEERE mij de hele dag tot smaad en spot is. Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Jes 5:11": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft!", "Ezech 1:24": "En toen zij gingen, hoorde ik het geruis van hun vleugels, als het geruis van veel water, als de stem van de Almachtige, als het geluid van spreken, als het gedreun van een leger; als zij stonden, lieten zij hun vleugels neer.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "2 Tess 3:4": "En wij vertrouwen van u in de Heere, dat u wat wij u bevelen, ook doet, en doen zult.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "1 Joh 2:12": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Joh 15:27": "En u zult ook getuigen, want u bent van het begin met Mij geweest.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "1 Tess 5:7": "Want wie slapen, slapen 's nachts, en wie dronken zijn, zijn 's nachts dronken;", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Deut 32:32": "Want hun wijnstok is uit de wijnstok van Sodom, en uit de velden van Gomorra; hun wijndruiven zijn vergiftige wijndruiven; zij hebben bittere druiventrossen.", "2 Tess 2:9-12": "hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden. En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Gen 9:5": "En zeker, Ik zal uw bloed, het bloed van uw zielen, opeisen; van de hand van elk dier zal Ik het opeisen; ook van de hand van de mens, van de hand van ieders broeder zal Ik de ziel van de mens opeisen.", "Rom 4:23": "Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Ezech 18:13": "Uitleent op woeker, en overwinst neemt; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal zeker gedood worden; zijn bloed zal op hem zijn!", "Jes 60:2": "Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Jer 44:4": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opstaand en zendend, om te zeggen: Doe toch deze gruwelijke zaak niet, die Ik haat.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Openb 10:9": "En ik ging heen naar de engel, en zei tegen hem: Geef mij dat boekje. En hij zei tegen mij: Neem het en eet het op; en het zal uw buik bitter maken, maar in uw mond zal het zoet zijn als honing.", "Ps 72:18": "Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Gal 2:11-13": "En toen Petrus in Antiochië gekomen was, weerstond ik hem recht in het gezicht, omdat hij te bestraffen was. Want voordat sommigen van Jakobus gekomen waren, at hij samen met de heidenen; maar toen zij gekomen waren, trok hij zich terug en zonderde zichzelf af, uit vrees voor hen die uit de besnijdenis waren. En ook de andere Joden veinsden met hem mee; zodat ook Barnabas werd meegesleept door hun veinzerij.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "2 Kron 25:15": "Toen ontstak de toorn van de HEERE tegen Amazia; en Hij zond tot hem een profeet, die tegen hem zei: Waarom hebt u de goden van dat volk gezocht, die hun eigen volk niet gered hebben uit uw hand?", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ezech 4:1-4": "En u, mensenkind, neem u een tichelsteen, leg die voor uw aangezicht en teken daarop de stad Jeruzalem. En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom. Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Jer 1:17": "U dan, omgord uw lendenen, en maak u op, en spreek tot hen alles wat Ik u gebieden zal; wees niet verslagen voor hun aangezicht, opdat Ik u niet versla voor hun aangezicht.", "Joh 4:9": "Toen zei de Samaritaanse vrouw tegen Hem: Hoe kunt U, die een Jood bent, van mij te drinken vragen, die een Samaritaanse vrouw ben? Want de Joden gaan niet met de Samaritanen om.", "Ef 3:3-5": "Dat Hij mij door openbaring deze verborgenheid heeft bekendgemaakt (zoals ik met weinig woorden eerder geschreven heb; waaraan u, als u dit leest, mijn inzicht in deze verborgenheid van Christus kunt bemerken), die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Ps 119:151-153": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid. Van oudsher heb ik geweten van Uw getuigenissen, dat U ze in eeuwigheid gegrond hebt. Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Mal 2:17": "U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "Joh 5:42": "maar Ik ken u, dat u de liefde van God niet in uzelf hebt.", "Joh 8:50": "Maar Ik zoek Mijn eer niet; er is Iemand Die haar zoekt en oordeelt.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Matt 18:18": "Voorwaar, Ik zeg u: alles wat u op de aarde bindt, zal in de hemel gebonden zijn; en alles wat u op de aarde ontbindt, zal in de hemel ontbonden zijn.", "Ps 119:92": "Indien Uw wet niet was geweest al mijn vermaking, was ik in mijn druk al lang vergaan.", "Jer 44:5": "Maar zij hebben niet gehoord, noch hun oor geneigd, om zich van hun slechtheid te bekeren, zodat zij aan andere goden geen wierook meer zouden branden.", "Rom 9:4": "die Israëlieten zijn, van wie de aanneming tot kinderen is, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloften;", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 8:9-13": "Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn. Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn? En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?", "2 Kor 7:12": "Hoewel ik dan aan u geschreven heb, was dat niet om diegene die onrecht gedaan had, en ook niet om diegene die onrecht gedaan was, maar opdat onze vlijtigheid voor u bij u openbaar zou worden, in de tegenwoordigheid van God.", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "1 Sam 4:22": "En zij zei: De eer is gevankelijk weggevoerd uit Israël, want de ark van God is genomen.", "Ezech 29:1": "In het tiende jaar, in de tiende maand, op de twaalfde dag van de maand, kwam het woord van de HEERE tot mij. Hij zei:", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Openb 22:18": "Want ik betuig aan ieder die de woorden van de profetie van dit boek hoort: Als iemand iets aan deze dingen toevoegt, zal God hem de plagen toevoegen die in dit boek geschreven zijn.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "2 Tim 2:1-26": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is; en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Joh 2:7": "Broeders! Ik schrijf u geen nieuw gebod, maar een oud gebod, dat u vanaf het begin gehad hebt; dit oude gebod is het woord, dat u vanaf het begin gehoord hebt.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ezech 33:1-9": "En het woord van de HEERE kwam tot mij: Mensenkind! Spreek tot de kinderen van uw volk, en zeg tegen hen: Wanneer Ik het zwaard over een land breng, en het volk van het land een man uit hun gebied neemt en hem voor zichzelf tot een wachter stelt; En hij het zwaard over het land ziet komen, en op de bazuin blaast en het volk waarschuwt;", "Ezech 35:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "2 Tim 1:8": "Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Ex 13:9": "En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ezech 3:17-21": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.", "Ezech 24:20": "En ik zei tegen hen: Het woord van de HEERE is tot mij gekomen, en Hij zei:", "Mark 13:31": "De hemel en de aarde zullen voorbijgaan; maar Mijn woorden zullen geenszins voorbijgaan.", "Jes 33:19": "U zult niet meer dat stuurse volk zien, het volk, dat zo diep van spraak is, dat men het niet horen kan, met een belachelijke tong, die men niet verstaan kan.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal men des te meer eisen.", "Ezech 2:9": "Toen zag ik, en zie, er was een hand naar mij uitgestoken; en zie, daarin was de rol van een boek.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Jes 1:4-6": "Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts. Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat. Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Deut 32:33": "Hun wijn is vurig drakenvenijn, en een wreed adderenvergif.", "Jer 22:21": "Ik sprak u aan in uw grote voorspoed, maar u zei: Ik zal niet horen. Dit is uw weg vanaf uw jeugd, dat u naar Mijn stem niet hebt geluisterd.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "2 Tim 4:10": "Want Demas heeft mij verlaten, omdat hij de tegenwoordige wereld heeft liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.", "Job 15:16": "Hoeveel te meer is een man gruwelijk en stinkend, die het onrecht indrinkt als water?", "Jes 55:9": "Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ef 4:19": "Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.", "Luk 21:15": "Want Ik zal u mond en wijsheid geven, die al uw tegenstanders niet zullen kunnen tegenspreken, noch weerstaan.", "Ezech 32:17": "Verder gebeurde het in het twaalfde jaar, op de vijftiende dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Ps 119:127-131": "Daarom heb ik Uw geboden lief, meer dan goud, ja, meer dan het fijnste goud. Daarom heb ik al Uw bevelen, van alles, voor recht gehouden; maar elk vals pad heb ik gehaat. Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Ezech 32:1": "Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Ezech 16:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Lev 4:1-35": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Als een mens gezondigd zal hebben door afdwaling tegen een van de geboden van de HEERE, wat niet gedaan zou mogen worden, en tegen een daarvan gedaan zal hebben; Als de priester die gezalfd is, zal gezondigd hebben tot schuld van het volk, dan zal hij voor zijn zonde die hij gezondigd heeft, een var offeren, een volkomen jong rund, de HEERE tot zondoffer.", "Ps 10:3": "Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.", "Ezech 33:4": "En iemand het geluid van de bazuin hoort, wel hoort, maar zich niet laat waarschuwen, en het zwaard komt en neemt hem weg, dan is zijn bloed op zijn eigen hoofd.", "Luk 15:7": "Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "1 Tim 3:1-16": "Dit is een betrouwbaar woord: als iemand ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Jer 23:4": "En Ik zal herders over hen doen opstaan, die ze weiden zullen; en zij zullen niet meer vrezen, noch verschrikt worden, noch gemist worden, spreekt de HEERE.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Ezech 10:15": "En die cherubs hieven zich omhoog; dit was hetzelfde dier dat ik bij de rivier de Chebar gezien had.", "1 Kor 4:1": "Zo houdt men ons voor, ieder mens: als dienaars van Christus, en uitdelers van de verborgenheden van God.", "Deut 32:15-30": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil. Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt. Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Jes 26:15": "U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; maar U hebt hen tot alle einden van het aardrijk ver weggedaan.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Luk 17:32": "Denk aan de vrouw van Lot.", "Jer 17:23": "Maar zij hebben niet gehoord, en hun oor niet geneigd; maar zij hebben hun nek verhard, om niet te horen, en om de tucht niet aan te nemen.", "Ps 19:12": "Ook wordt Uw knecht daardoor klaar vermaand; in het houden ervan is grote loon.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Gen 3:4": "Toen zei de slang tegen de vrouw: U zult zeker niet sterven;", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "2 Kron 15:3": "Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet.", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Ezech 21:18": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "Joh 4:44": "want Jezus heeft Zelf getuigd dat een profeet in zijn eigen vaderland geen eer heeft.", "Hebr 6:4-8": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest, en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw, en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Joh 15:20-24": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren. Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft. Als Ik niet gekomen was, en tot hen gesproken had, hadden zij geen zonde; maar nu hebben zij geen voorwendsel voor hun zonde.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Jes 3:9": "Het gelaat van hun aangezicht getuigt tegen hen, en hun zonden spreken zij vrij uit, net als Sodom; zij verbergen ze niet. Wee hun ziel; want zij doen zichzelf kwaad.", "Job 38:7": "Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.", "Ex 33:23": "En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "2 Tim 4:4": "en zij zullen hun oren van de waarheid afkeren, en zich wenden tot fabels.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Deut 5:25": "Maar nu, waarom zouden wij sterven? Want dit grote vuur zou ons verteren; als wij nog langer de stem van de HEERE, onze God, blijven horen, zouden wij sterven.", "Rom 1:14": "Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar.", "Ps 119:96-100": "In alle volmaaktheid heb ik een einde gezien; maar Uw gebod is zeer wijd. Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag. Zij maakt mij door Uw geboden wijzer, dan mijn vijanden zijn, want zij is in eeuwigheid bij mij.", "Ezech 10:5": "En het geruis van de vleugels van de cherubs werd gehoord tot het uiterste voorhof, als de stem van de Almachtige God, wanneer Hij spreekt.", "2 Kor 2:15-17": "Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan; voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam? Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Ps 59:7": "Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad.", "Ezech 2:6": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis.", "2 Petr 2:20": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Hand 3:14": "Maar u hebt de Heilige en Rechtvaardige verloochend, en gevraagd dat u een moordenaar geschonken zou worden;", "Gal 4:11": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het
