8\">bowels</span> with this <span class=\"wl wl-kjv\" data-code=\"H4039\">roll</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee. Then did I <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; and it was in my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> as <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> for sweetness.", "4": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">get</span> thee unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with my words", "5": "For thou art not <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of a <span class=\"wl wl-kjv\" data-code=\"H6012\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">speech</span> and of an <span class=\"wl wl-kjv\" data-code=\"H3515\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">language,</span> but to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel;", "6": "Not to <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of a <span class=\"wl wl-kjv\" data-code=\"H6012\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">speech</span> and of an <span class=\"wl wl-kjv\" data-code=\"H3515\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">language,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> thou canst not <span class=\"wl wl-kjv\" data-code=\"H8085\">understand.</span> Surely, had I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> thee to them, they would have hearkened", "7": "But the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H14\">will</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto thee; for they <span class=\"wl wl-kjv\" data-code=\"H14\">will</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me: for all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are <span class=\"wl wl-kjv\" data-code=\"H2389\">impudent</span> and <span class=\"wl wl-kjv\" data-code=\"H7186\">hardhearted.</span>", "8": "Behold, I have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead</span> <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> their foreheads.", "9": "As an <span class=\"wl wl-kjv\" data-code=\"H8068\">adamant</span> <span class=\"wl wl-kjv\" data-code=\"H2389\">harder</span> than <span class=\"wl wl-kjv\" data-code=\"H6864\">flint</span> have I <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thy <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead:</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> them not, neither be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> at their <span class=\"wl wl-kjv\" data-code=\"H6440\">looks,</span> though they be a <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellious</span> house.", "10": "Moreover he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> all my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that I shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> with thine ears.", "11": "And <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">get</span> thee to them of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> whether they will <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> or whether they will forbear.", "12": "Then the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> took me <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> me a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7494\">rushing,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> from his place.", "13": "I heard also the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> of the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures</span> that <span class=\"wl wl-kjv\" data-code=\"H5401\">touched</span> <span class=\"wl wl-kjv\" data-code=\"H802\">one</span> <span class=\"wl wl-kjv\" data-code=\"H269\">another,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H212\">wheels</span> over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> them, and a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> rushing.", "14": "So the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> lifted me <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and took me <span class=\"wl wl-kjv\" data-code=\"H3947\">away,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> in <span class=\"wl wl-kjv\" data-code=\"H4751\">bitterness,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2534\">heat</span> of my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was strong", "15": "Then I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to them of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> at <span class=\"wl wl-kjv\" data-code=\"H8512\">Telabib,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H3529\">Chebar,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> where they <span class=\"wl wl-kjv\" data-code=\"H3427\">sat,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">remained</span> there <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> them <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days.", "16": "And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,", "17": "<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee a <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> at my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and give them warning", "18": "When I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> and thou givest him not <span class=\"wl wl-kjv\" data-code=\"H2094\">warning,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1696\">speakest</span> to <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> from his <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> to save his <span class=\"wl wl-kjv\" data-code=\"H2421\">life;</span> the same <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> man shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> but his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> will I <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> at thine hand.", "19": "Yet if thou <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> not from his <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness,</span> nor from his <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> but thou hast <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> thy soul.", "20": "<span class=\"wl wl-kjv\" data-code=\"H7725\">Again,</span> When a <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> man doth <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from his <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> a <span class=\"wl wl-kjv\" data-code=\"H4383\">stumblingblock</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> because thou hast not given him <span class=\"wl wl-kjv\" data-code=\"H2094\">warning,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered;</span> but his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> will I <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> at thine hand.", "21": "Nevertheless if thou <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> man, that the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> not, and he doth not <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> because he is <span class=\"wl wl-kjv\" data-code=\"H2094\">warned;</span> also thou hast <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> thy soul.", "22": "And the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was there upon me; and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H1237\">plain,</span> and I will there talk", "23": "Then I <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H1237\">plain:</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> there, as the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> which I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H3529\">Chebar:</span> and I <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on my face.", "24": "Then the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into me, and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> me upon my <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H935\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> thyself <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> thine house.", "25": "But thou, O <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> behold, they shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">bands</span> upon thee, and shall <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> thee with them, and thou shalt not go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> among", "26": "And I will make thy <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleave</span> to the roof of thy <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth,</span> that thou shalt be <span class=\"wl wl-kjv\" data-code=\"H481\">dumb,</span> and shalt not be to them a <span class=\"wl wl-kjv\" data-code=\"H376\">reprover:</span> for they are a <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellious</span> house.", "27": "But when I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H854\">with</span> thee, I will <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> He that <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth,</span> let him <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> and he that <span class=\"wl wl-kjv\" data-code=\"H2310\">forbeareth,</span> let him <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear:</span> for they are a <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellious</span> house."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
