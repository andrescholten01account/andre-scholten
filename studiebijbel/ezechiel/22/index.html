d, zou u de bloedstad recht geven? Zou u haar recht geven? Ja, maak haar al haar gruwelen bekend.","3":"En zeg: Zo zegt de Heere HEERE: O stad, die in haar midden bloed vergiet, zodat haar tijd komt, en die drekgoden[1] tegen zichzelf maakt om zich te verontreinigen!","4":"Door uw bloed dat u vergoten hebt, bent u schuldig geworden, en met uw drekgoden die u gemaakt hebt, hebt u zich verontreinigd, en hebt u uw dagen doen naderen en bent u tot uw jaren gekomen; daarom heb Ik u aan de heidenvolken overgegeven *tot* een smaad, en aan alle landen *tot* een spot.","5":"Wie dichtbij en veraf van u zijn, zullen u bespotten, u onreine van naam en vol van onrust!","6":"Zie, de vorsten van Israël zijn in u geweest, ieder naar zijn kracht, om bloed te vergieten.","7":"Vader en moeder hebben zij in u licht geacht; met de vreemdeling hebben zij in uw midden door verdrukking gehandeld; zij hebben in u de wees en de weduwe verdrukt.","8":"Mijn heilige dingen hebt u veracht, en Mijn sabbatten hebt u ontheiligd.","9":"Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.","10":"Men heeft de schaamte van de vader in u ontdekt; wie onrein was door afzondering, hebben zij in u verkracht.","11":"Daarbij heeft de een gruwel gedaan met de vrouw van zijn naaste, en een ander heeft de vrouw van zijn zoon met schandelijkheid verontreinigd; nog een ander heeft in u zijn zuster, de dochter van zijn vader, verkracht.","12":"Zij hebben geschenken in u genomen om bloed te vergieten; woeker en overwinst hebt u genomen, en u hebt door verdrukking gierigheid gepleegd tegenover uw naaste, en Mij vergeten, spreekt de Heere HEERE.","13":"Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is.","14":"Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.","15":"En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.","16":"Zo zult u in uzelf ontheiligd zijn[2] voor de ogen van de heidenvolken; en u zult weten dat Ik de HEERE ben.","17":"Verder kwam het woord van de HEERE tot mij; Hij zei:","18":"Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.","19":"Daarom, zo zegt de Heere HEERE: Omdat u allen tot schuim geworden bent, zie, daarom zal Ik u in het midden van Jeruzalem verzamelen.","20":"*Zoals* zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.","21":"Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.","22":"Zoals het zilver in het midden van de oven gesmolten wordt, zo zult u in het midden ervan smelten; en u zult weten dat Ik, de HEERE, Mijn grimmigheid over u uitgegoten heb.","23":"Verder kwam het woord van de HEERE tot mij; Hij zei:","24":"Mensenkind, zeg tegen haar: U bent een land dat niet gereinigd is, *dat* zijn plasregen niet *gehad heeft* op de dag van de gramschap.","25":"De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden.","26":"Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.","27":"Haar vorsten zijn in haar midden als wolven die een prooi roven, om bloed te vergieten en om zielen te verderven, opdat zij gierigheid zouden plegen.","28":"Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.","29":"Het volk van het land pleegt enkel verdrukking en bedrijft enkel roverij, ook onderdrukken zij de ellendige en de arme, en de vreemdeling verdrukken zij zonder recht.","30":"Ik zocht nu onder hen een man die de muur zou kunnen toemuren, en voor Mijn aangezicht in de brest zou kunnen staan voor het land, zodat Ik het niet zou hoeven te verderven; maar Ik vond niemand.","31":"Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE."},"SV":{"1":"Voorts geschiedde des HEEREN woord tot mij, zeggende:","2":"Gij nu, mensenkind, zoudt gij der bloedstad recht geven? Zoudt gij haar recht geven? Ja, maak haar bekend al haar gruwelen.","3":"En zeg: Alzo zegt de Heere HEERE: O stad, die in haar midden bloed vergiet, opdat haar tijd kome, en drekgoden tegen zichzelve maakt, om zich te verontreinigen!","4":"Door uw bloed, dat gij vergoten hebt, zijt gij schuldig geworden, en met uw drekgoden, die gij gemaakt hebt, hebt gij u verontreinigd, en hebt uw dagen doen naderen, en zijt tot uw jaren gekomen; daarom heb Ik u den heidenen overgegeven *tot* een smaad, en allen landen *tot* een spot.","5":"Die nabij en verre van u zijn, zullen u bespotten, gij onreine van naam en vol van onrust!","6":"Ziet, de vorsten Israëls zijn in u geweest, een ieder naar zijn kracht, om bloed te vergieten.","7":"Vader en moeder hebben zij in u licht geacht; met den vreemdeling hebben zij in het midden van u door verdrukking gehandeld; zij hebben in u den wees en de weduwe verdrukt.","8":"Mijn heilige dingen hebt gij veracht, en Mijn sabbatten hebt gij ontheiligd.","9":"Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in het midden van u gedaan.","10":"Men heeft de schaamte des vaders in u ontdekt; die onrein was door afzondering, hebben zij in u verkracht.","11":"Daartoe heeft de een gruwel gedaan met zijns naasten huisvrouw, en een ander heeft zijns zoons vrouw met schandelijkheid verontreinigd; nog een ander heeft in u zijn zuster, zijns vaders dochter; verkracht.","12":"Zij hebben geschenken in u genomen, om bloed te vergieten; woeker en overwinst hebt gij genomen, en gij hebt gierigheid gepleegd aan uw naaste door verdrukking; maar gij hebt Mijner vergeten, spreekt de Heere HEERE.","13":"Ziet dan, Ik heb Mijn hand geslagen, om uw gierigheid, die gij bedreven hebt, en om uw bloed, die in het midden van u geweest zijn.","14":"Zal uw hart bestaan? zullen uw handen sterk zijn, in de dagen, als Ik met u handelen zal? Ik, de HEERE, heb het gesproken, en zal het doen.","15":"En Ik zal u verstrooien onder de heidenen, en u verspreiden in de landen, en uw ontreinigheid uit u verteren.","16":"Zo zult gij in u ontheiligd zijn voor de ogen der heidenen; en gij zult weten, dat Ik de HEERE ben.","17":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","18":"Mensenkind, die van het huis Israëls zijn Mij tot schuim geworden; zij zijn allen koper, of tin, of ijzer, of lood, in het midden des ovens; zilverschuim zijn zij geworden.","19":"Daarom, alzo zegt de Heere HEERE: Omdat gijlieden allen tot schuim geworden zijt, daarom ziet, Ik zal u in het midden van Jeruzalem vergaderen.","20":"*Gelijk* zilver, of koper, of ijzer, of lood, of tin in het midden eens ovens vergaderd wordt, om het vuur daarover op te blazen, opdat men het smelte; alzo zal Ik ulieden vergaderen in Mijn toorn, en in Mijn grimmigheid daar laten, en smelten.","21":"Ja, Ik zal u bijeenbrengen, en zal op u blazen in het vuur Mijner verbolgenheid, dat gij in het midden van haar zult gesmolten worden.","22":"Gelijk het zilver in het midden des ovens gesmolten wordt, alzo zult gijlieden in het midden van haar gesmolten worden; en gij zult weten, dat Ik, de HEERE, Mijn grimmigheid over u uitgegoten heb.","23":"Voorts geschiedde des HEEREN woord tot mij, zeggende:","24":"Mensenkind, zeg tot haar; Gij zijt een land, dat niet gereinigd is, *dat* zijn plasregen niet *heeft* *gehad* ten dage der gramschap.","25":"De verbintenis harer profeten is in het midden van haar als een brullende leeuw, die een roof rooft; zij eten de zielen op, den schat en het kostelijke nemen zij weg; haar weduwen vermenigvuldigen zij in het midden van haar.","26":"Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en *het* *verschil* tussen het onreine en reine geven zij niet te kennen; daartoe verbergen zij hun ogen van Mijn sabbatten; ja, Ik word in het midden van hen ontheiligd.","27":"Haar vorsten zijn in het midden van haar als wolven, die een roof roven, om bloed te vergieten, *en* om zielen te verderven; opdat zij gierigheid zouden plegen.","28":"Haar profeten nu pleisteren hen met loze kalk; ziende ijdelheid en hun leugen voorzeggende, zeggende: Alzo zegt de Heere HEERE! en de HEERE heeft niet gesproken.","29":"Het volk des lands pleegt enkel verdrukking, en bedrijft enkel roverij, ook onderdrukken zij den ellendige en nooddruftige, en den vreemdeling verdrukken zij zonder recht.","30":"Ik zocht nu een man uit hen, die den muur mocht toemuren, en voor Mijn aangezicht in de bresse staan voor het land, opdat Ik het niet mocht verderven; maar Ik vond niemand.","31":"Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur Mijner verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE."},"KJV":{"1":"Moreover the word of the LORD came unto me, saying,","2":"Now, thou son of man, wilt thou judge, wilt thou judge the bloody city? yea, thou shalt shew her all her abominations.","3":"Then say thou, Thus saith the Lord GOD, The city sheddeth blood in the midst of it, that her time may come, and maketh idols against herself to defile","4":"Thou art become guilty in thy blood that thou hast shed; and hast defiled thyself in thine idols which thou hast made; and thou hast caused thy days to draw near, and art come *even* unto thy years: therefore have I made thee a reproach unto the heathen, and a mocking to all countries.","5":"*Those that be* near, and *those that be* far from thee, shall mock thee, *which art* infamous *and* much vexed.","6":"Behold, the princes of Israel, every one were in thee to their power to shed blood.","7":"In thee have they set light by father and mother: in the midst of thee have they dealt by oppression with the stranger: in thee have they vexed the fatherless and the widow.","8":"Thou hast despised mine holy things, and hast profaned my sabbaths.","9":"In thee are men that carry tales to shed blood: and in thee they eat upon the mountains: in the midst of thee they commit lewdness.","10":"In thee have they discovered their fathers' nakedness: in thee have they humbled her that was set apart for pollution.","11":"And one hath committed abomination with his neighbour's wife; and another hath lewdly defiled his daughter in law; and another in thee hath humbled his sister, his father's daughter.","12":"In thee have they taken gifts to shed blood; thou hast taken usury and increase, and thou hast greedily gained of thy neighbours by extortion, and hast forgotten me, saith the Lord GOD.","13":"Behold, therefore I have smitten mine hand at thy dishonest gain which thou hast made, and at thy blood which hath been in the midst","14":"Can thine heart endure, or can thine hands be strong, in the days that I shall deal with thee? I the LORD have spoken *it*, and will do","15":"And I will scatter thee among the heathen, and disperse thee in the countries, and will consume thy filthiness","16":"And thou shalt take thine inheritance in thyself in the sight of the heathen, and thou shalt know that I *am* the LORD.","17":"And the word of the LORD came unto me, saying,","18":"Son of man, the house of Israel is to me become dross: all they *are* brass, and tin, and iron, and lead, in the midst of the furnace; they are *even* the dross of silver.","19":"Therefore thus saith the Lord GOD; Because ye are all become dross, behold, therefore I will gather you into the midst of Jerusalem.","20":"*As* they gather silver, and brass, and iron, and lead, and tin, into the midst of the furnace, to blow the fire upon it, to melt *it*; so will I gather *you* in mine anger and in my fury, and I will leave *you there*, and melt","21":"Yea, I will gather you, and blow upon you in the fire of my wrath, and ye shall be melted in the midst","22":"As silver is melted in the midst of the furnace, so shall ye be melted in the midst thereof; and ye shall know that I the LORD have poured out my fury","23":"And the word of the LORD came unto me, saying,","24":"Son of man, say unto her, Thou *art* the land that is not cleansed, nor rained upon in the day of indignation.","25":"*There is* a conspiracy of her prophets in the midst thereof, like a roaring lion ravening the prey; they have devoured souls; they have taken the treasure and precious things; they have made her many widows in the midst","26":"Her priests have violated my law, and have profaned mine holy things: they have put no difference between the holy and profane, neither have they shewed *difference* between the unclean and the clean, and have hid their eyes from my sabbaths, and I am profaned among","27":"Her princes in the midst thereof *are* like wolves ravening the prey, to shed blood, *and* to destroy souls, to get dishonest gain.","28":"And her prophets have daubed them with untempered *morter*, seeing vanity, and divining lies unto them, saying, Thus saith the Lord GOD, when the LORD hath not spoken.","29":"The people of the land have used oppression, and exercised robbery, and have vexed the poor and n -kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","2":"Now, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H8199\">judge,</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">bloody</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city?</span> yea, thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">shew</span> her all her abominations.","3":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thou, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> The <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H8210\">sheddeth</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of it, that her <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> may <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> against herself to defile","4":"Thou art become <span class=\"wl wl-kjv\" data-code=\"H816\">guilty</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H8210\">shed;</span> and hast <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> thyself in thine <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">made;</span> and thou hast caused thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> to draw <span class=\"wl wl-kjv\" data-code=\"H7126\">near,</span> and art <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> even unto thy <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> therefore have I <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7048\">mocking</span> to all countries.","5":"Those that be <span class=\"wl wl-kjv\" data-code=\"H7138\">near,</span> and those that be <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> from thee, shall <span class=\"wl wl-kjv\" data-code=\"H7046\">mock</span> thee, which art <span class=\"wl wl-kjv\" data-code=\"H2931\">infamous</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> vexed.","6":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> were in thee to their <span class=\"wl wl-kjv\" data-code=\"H2220\">power</span> to <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> blood.","7":"In thee have they set <span class=\"wl wl-kjv\" data-code=\"H7043\">light</span> by <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and <span class=\"wl wl-kjv\" data-code=\"H517\">mother:</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee have they <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> by <span class=\"wl wl-kjv\" data-code=\"H6233\">oppression</span> with the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger:</span> in thee have they <span class=\"wl wl-kjv\" data-code=\"H3238\">vexed</span> the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless</span> and the widow.","8":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> mine holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> my sabbaths.","9":"In thee are <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that carry <span class=\"wl wl-kjv\" data-code=\"H7400\">tales</span> to <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> and in thee they <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains:</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee they <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> lewdness.","10":"In thee have they <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> in thee have they <span class=\"wl wl-kjv\" data-code=\"H6031\">humbled</span> her that was set <span class=\"wl wl-kjv\" data-code=\"H5079\">apart</span> for pollution.","11":"And <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> with his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> and <span class=\"wl wl-kjv\" data-code=\"H376\">another</span> hath <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdly</span> <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> his daughter in <span class=\"wl wl-kjv\" data-code=\"H3618\">law;</span> and <span class=\"wl wl-kjv\" data-code=\"H376\">another</span> in thee hath <span class=\"wl wl-kjv\" data-code=\"H6031\">humbled</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> daughter.","12":"In thee have they <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H7810\">gifts</span> to <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5392\">usury</span> and <span class=\"wl wl-kjv\" data-code=\"H8636\">increase,</span> and thou hast greedily <span class=\"wl wl-kjv\" data-code=\"H1214\">gained</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbours</span> by <span class=\"wl wl-kjv\" data-code=\"H6233\">extortion,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","13":"Behold, therefore I have <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> mine <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> at thy dishonest <span class=\"wl wl-kjv\" data-code=\"H1215\">gain</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and at thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> which hath been in the midst","14":"Can thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">endure,</span> or can thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that I shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with thee? I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, and will do","15":"And I will <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> thee among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2219\">disperse</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> and will <span class=\"wl wl-kjv\" data-co // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

    if (b.modus === 'genummerd') {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {

            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
