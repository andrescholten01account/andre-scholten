 woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.","3":"Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn.","4":"U zult dan uw gereedschap bij dag voor hun ogen naar buiten brengen, als het gereedschap van hen die vertrekken; daarna zult u in de avond uitgaan voor hun ogen, zoals zij uitgaan die vertrekken.","5":"Graaf u een gat door de wand voor hun ogen, en breng daardoor *uw* *gereedschap* naar buiten.","6":"Voor hun ogen zult u het op de schouders dragen, in het donker zult u het naar buiten brengen; uw gezicht zult u bedekken, zodat u het land niet ziet; want Ik heb u het huis van Israël tot een wonderteken gegeven.","7":"En ik deed zo, zoals mij bevolen was; ik bracht mijn gereedschap naar buiten bij dag, als het gereedschap van hen die vertrekken; daarna groef ik in de avond met de hand een gat door de wand; ik bracht het naar buiten in het donker, *en* ik droeg het op de schouder voor hun ogen.","8":"En 's morgens kwam het woord van de HEERE tot mij en Hij zei:","9":"Mensenkind, heeft het huis van Israël, het opstandige huis, niet tegen u gezegd: Wat doet u?","10":"Zeg tegen hen: Zo zegt de Heere HEERE: Deze last is *tegen* de vorst te Jeruzalem, en het hele huis van Israël, dat in hun midden is.","11":"Zeg: Ik ben uw wonderteken; zoals ik gedaan heb, zo zal hun gedaan worden; zij zullen door wegvoering in de gevangenis heengaan.","12":"En de vorst, die in hun midden is, zal *het* *gereedschap* op de schouder dragen in het donker, en hij zal uitgaan; zij zullen door de wand graven, om *hem* daardoor naar buiten te brengen; hij zal zijn gezicht bedekken, zodat hij met het oog de aarde niet ziet.","13":"Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven.","14":"En allen die rondom hem zijn *tot* zijn hulp, en al zijn troepen zal Ik naar alle windrichtingen verstrooien; en Ik zal het zwaard achter hen trekken.","15":"Zo zullen zij weten dat Ik de HEERE ben, wanneer Ik hen onder de heidenvolken verspreid en hen in de landen verstrooi.","16":"Toch zal Ik van hen weinige mensen laten overblijven van het zwaard, van de honger en van de pest; opdat zij al hun gruwelen vertellen onder de heidenvolken, waarheen zij komen zullen, en zij zullen weten dat Ik de HEERE ben.","17":"Daarna kwam het woord van de HEERE tot mij en Hij zei:","18":"Mensenkind, u zult uw brood eten met beven, en uw water zult u met angst en bezorgdheid drinken.","19":"En u zult tegen het volk van het land zeggen: Zo zegt de Heere HEERE, over de inwoners van Jeruzalem, in het land Israël: Zij zullen hun brood met bezorgdheid eten, en hun water zullen zij met ontzetting drinken, omdat hun land woest zal worden en zijn overvloed zal verliezen, vanwege het geweld van allen die daarin wonen;","20":"En de bewoonde steden zullen woest worden, en het land zal een wildernis zijn; en u zult weten dat Ik de HEERE ben.","21":"Opnieuw kwam het woord van de HEERE tot mij en Hij zei:","22":"Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?","23":"Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen.","24":"Want er zal geen leeg visioen meer zijn, noch vleiende waarzegging, in het midden van het huis van Israël.","25":"Want Ik ben de HEERE, Ik zal spreken; het woord dat Ik zal spreken, zal gebeuren, *de* *tijd* zal niet meer worden uitgesteld; want in uw dagen, o opstandig huis, zal Ik een woord spreken, en het doen, spreekt de Heere HEERE.","26":"Verder kwam het woord van de HEERE tot mij en Hij zei:","27":"Mensenkind, zie, zij van het huis van Israël zeggen: Het visioen dat hij ziet, is voor vele dagen later, en hij profeteert over tijden die ver weg zijn.","28":"Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Geen van Mijn woorden zal meer worden uitgesteld; het woord dat Ik gesproken heb, dat zal gebeuren, spreekt de Heere HEERE."},"SV":{"1":"Verder geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind! gij woont in het midden van een wederspannig huis, dewelke ogen hebben om te zien, en niet zien, oren hebben om te horen, en niet horen, want zij zijn een wederspannig huis.","3":"Daarom gij, mensenkind, maak u gereedschap van vertrekking; en vertrek bij dag voor hun ogen; en gij zult vertrekken van uw plaats tot een andere plaats voor hun ogen; misschien zullen zij het merken, hoewel zij een wederspannig huis zijn.","4":"Gij zult dan uw gereedschap bij dag voor hun ogen uitbrengen, als het gereedschap dergenen, die vertrekken; daarna zult gij in den avond uitgaan voor hun ogen, gelijk zij uitgaan, die vertrekken.","5":"Doorgraaf u den wand voor hun ogen, en breng daardoor *uw* *gereedschap* uit.","6":"Voor hun ogen zult gij het op de schouders dragen, in donker zult gij het uitbrengen; uw aangezicht zult gij bedekken, dat gij het land niet ziet; want Ik heb u den huize Israëls tot een wonderteken gegeven.","7":"En ik deed alzo, gelijk als mij bevolen was; ik bracht mijn gereedschap uit bij dag, als het gereedschap dergenen, die vertrekken; daarna in den avond doorgroef ik mij den wand met de hand; ik bracht het uit in donker, *en* ik droeg het op den schouder voor hun ogen.","8":"En des morgens geschiedde het woord des HEEREN tot mij, zeggende:","9":"Mensenkind, heeft niet het huis Israëls, het wederspannig huis, tot u gezegd: Wat doet gij?","10":"Zeg tot hen: Alzo zegt de Heere HEERE: Deze last is *tegen* den vorst te Jeruzalem, en het ganse huis Israëls, dat in het midden van hen is.","11":"Zeg: Ik ben ulieder wonderteken; gelijk als ik gedaan heb, alzo zal hun gedaan worden; zij zullen door wegvoering in de gevangenis heengaan.","12":"En de vorst, die in het midden van hen is, zal *het* *gereedschap* op den schouder dragen in donker, en hij zal uitgaan; zij zullen door den wand graven, om *hem* daardoor uit te brengen; hij zal zijn aangezicht bedekken, opdat hij met het oog de aarde niet zie.","13":"Ik zal ook Mijn net over hem uitspreiden, dat hij in Mijn jachtgaren gegrepen worde; en Ik zal hem brengen in Babylonië, het land der Chaldeen; ook zal hij dat niet zien, hoewel hij daar sterven zal.","14":"En allen, die rondom hem zijn *tot* zijn hulp, en al zijn benden zal Ik in alle winden verstrooien; en Ik zal het zwaard achter hen uittrekken.","15":"Alzo zullen zij weten, dat Ik de HEERE ben, wanneer Ik hen onder de heidenen verspreiden en hen in de landen verstrooien zal.","16":"Doch Ik zal van hen weinige lieden doen overblijven van het zwaard, van den honger en van de pestilentie; opdat zij al hun gruwelen vertellen onder de heidenen, waarhenen zij komen zullen, en zij zullen weten, dat Ik de HEERE ben.","17":"Daarna geschiedde het woord des HEEREN tot mij, zeggende:","18":"Mensenkind, gij zult uw brood eten met beven, en uw water zult gij met beroerte en met kommer drinken.","19":"En gij zult tot het volk des lands zeggen: Alzo zegt de Heere HEERE, van de inwoners van Jeruzalem, in het land Israëls: Zij zullen hun brood met kommer eten, en hun water zullen zij met verbaasdheid drinken, omdat hun land woest zal worden van zijn volheid, vanwege het geweld van al degenen, die daarin wonen;","20":"En de bewoonde steden zullen woest worden, en het land zal een wildernis zijn; en gij zult weten, dat Ik de HEERE ben.","21":"Wederom geschiedde het woord des HEEREN tot mij, zeggende:","22":"Mensenkind, wat is dit voor een spreekwoord, *dat* gijlieden hebt in het land Israëls, zeggende: de dagen zullen verlengd worden, en al het gezicht zal vergaan?","23":"Daarom zeg tot hen: Alzo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, dat zij het niet meer ten spreekwoord gebruiken zullen in Israël. Maar spreek tot hen: De dagen zijn nabij gekomen, en het woord van ieder gezicht.","24":"Want geen ijdel gezicht zal er meer wezen, noch vleiende waarzegging, in het midden van het huis Israëls.","25":"Want Ik ben de HEERE, Ik zal spreken; het woord, dat Ik zal spreken, zal gedaan worden, *de* *tijd* zal niet meer uitgesteld worden; want in uw dagen, o wederspannig huis, zal Ik een woord spreken, en hetzelve doen, spreekt de Heere HEERE.","26":"Verder geschiedde het woord des HEEREN tot mij, zeggende:","27":"Mensenkind, zie, die van het huis Israëls zeggen: Het gezicht dat hij ziet, is voor vele dagen, en hij profeteert van tijden, die verre zijn.","28":"Daarom zeg tot hen: Alzo zegt de Heere HEERE: Geen Mijner woorden zullen meer uitgesteld worden; het woord, hetwelk Ik gesproken heb, dat zal gedaan worden, spreekt de Heere HEERE."},"KJV":{"1":"The word of the LORD also came unto me, saying,","2":"Son of man, thou dwellest in the midst of a rebellious house, which have eyes to see, and see not; they have ears to hear, and hear not: for they *are* a rebellious house.","3":"Therefore, thou son of man, prepare thee stuff for removing, and remove by day in their sight; and thou shalt remove from thy place to another place in their sight: it may be they will consider, though they *be* a rebellious house.","4":"Then shalt thou bring forth thy stuff by day in their sight, as stuff for removing: and thou shalt go forth at even in their sight, as they that go forth into captivity.","5":"Dig thou through the wall in their sight, and carry out","6":"In their sight shalt thou bear *it* upon *thy* shoulders, *and* carry *it* forth in the twilight: thou shalt cover thy face, that thou see not the ground: for I have set thee *for* a sign unto the house of Israel.","7":"And I did so as I was commanded: I brought forth my stuff by day, as stuff for captivity, and in the even I digged through the wall with mine hand; I brought *it* forth in the twilight, *and* I bare *it* upon *my* shoulder in their sight.","8":"And in the morning came the word of the LORD unto me, saying,","9":"Son of man, hath not the house of Israel, the rebellious house, said unto thee, What doest","10":"Say thou unto them, Thus saith the Lord GOD; This burden *concerneth* the prince in Jerusalem, and all the house of Israel that *are* among","11":"Say, I *am* your sign: like as I have done, so shall it be done unto them: they shall remove *and* go into captivity.","12":"And the prince that *is* among them shall bear upon *his* shoulder in the twilight, and shall go forth: they shall dig through the wall to carry out thereby: he shall cover his face, that he see not the ground with *his* eyes.","13":"My net also will I spread upon him, and he shall be taken in my snare: and I will bring him to Babylon *to* the land of the Chaldeans; yet shall he not see it, though he shall die","14":"And I will scatter toward every wind all that *are* about him to help him, and all his bands; and I will draw out the sword after","15":"And they shall know that I *am* the LORD, when I shall scatter them among the nations, and disperse them in the countries.","16":"But I will leave a few men of them from the sword, from the famine, and from the pestilence; that they may declare all their abominations among the heathen whither they come; and they shall know that I *am* the LORD.","17":"Moreover the word of the LORD came to me, saying,","18":"Son of man, eat thy bread with quaking, and drink thy water with trembling and with carefulness;","19":"And say unto the people of the land, Thus saith the Lord GOD of the inhabitants of Jerusalem, *and* of the land of Israel; They shall eat their bread with carefulness, and drink their water with astonishment, that her land may be desolate from all that is therein, because of the violence of all them that dwell","20":"And the cities that are inhabited shall be laid waste, and the land shall be desolate; and ye shall know that I *am* the LORD.","21":"And the word of the LORD came unto me, saying,","22":"Son of man, what *is* that proverb *that* ye have in the land of Israel, saying, The days are prolonged, and every vision faileth?","23":"Tell them therefore, Thus saith the Lord GOD; I will make this proverb to cease, and they shall no more use it as a proverb in Israel; but say unto them, The days are at hand, and the effect of every vision.","24":"For there shall be no more any vain vision nor flattering divination within the house of Israel.","25":"For I *am* the LORD: I will speak, and the word that I shall speak shall come to pass; it shall be no more prolonged: for in your days, O rebellious house, will I say the word, and will perform it, saith the Lord GOD.","26":"Again the word of the LORD came to me, saying,","27":"Son of man, behold, *they of* the house of Israel say, The vision that he seeth *is* for many days *to come*, and he prophesieth of the times *that are* far","28":"Therefore say unto them, Thus saith the Lord GOD; There shall none of my words be prolonged any more, but the word which I have spoken shall be done, saith the Lord GOD."}},"tsk":{"2":[{"kopje":"U","refs":["Ezech 2:3","Ezech 2:6-8","Ezech 3:9","Ezech 3:26","Ezech 3:27","Ezech 17:12","Ezech 24:3","Ezech 44:6","Deut 9:7","Deut 9:24","Deut 31:27","Ps 78:40","Jes 1:23","Jes 30:1","Jes 30:9","Jes 65:2","Jer 4:17","Jer 5:23","Jer 9:1-6","Dan 9:5-9","Hand 7:51","Hand 7:52"]},{"kopje":"dat","refs":["Deut 29:4","Jes 6:9","Jes 6:10","Jes 29:9-12","Jes 42:19","Jes 42:20","Jer 5:21","Matt 13:13","Matt 13:14","Mark 4:12","Mark 8:17","Mark 8:18","Luk 8:10","Joh 9:39-41","Joh 12:40","Hand 28:26","Hand 28:27","Rom 11:7","Rom 11:8","2 Kor 3:14","2 Kor 4:3","2 Kor 4:4","Ef 4:18","2 Tess 2:10","2 Tess 2:11"]},{"kopje":"want","refs":["E wl wl-kjv\" data-code=\"H2219\">scatter</span> toward every <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> all that are <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him to <span class=\"wl wl-kjv\" data-code=\"H5828\">help</span> him, and all his <span class=\"wl wl-kjv\" data-code=\"H102\">bands;</span> and I will draw <span class=\"wl wl-kjv\" data-code=\"H7324\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> after","15":"And they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when I shall <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> them among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and <span class=\"wl wl-kjv\" data-code=\"H2219\">disperse</span> them in the countries.","16":"But I will <span class=\"wl wl-kjv\" data-code=\"H3498\">leave</span> a <span class=\"wl wl-kjv\" data-code=\"H4557\">few</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of them from the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> from the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence;</span> that they may <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> all their <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> whither they <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","17":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to me, saying,","18":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thy <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> with <span class=\"wl wl-kjv\" data-code=\"H7494\">quaking,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> thy <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> with <span class=\"wl wl-kjv\" data-code=\"H7269\">trembling</span> and with carefulness;","19":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> They shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> with <span class=\"wl wl-kjv\" data-code=\"H1674\">carefulness,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> their <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> with <span class=\"wl wl-kjv\" data-code=\"H8078\">astonishment,</span> that her <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> may be <span class=\"wl wl-kjv\" data-code=\"H3456\">desolate</span> from all that is <span class=\"wl wl-kjv\" data-code=\"H4393\">therein,</span> because of the <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> of all them that dwell","20":"And the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that are <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited</span> shall be laid <span class=\"wl wl-kjv\" data-code=\"H2717\">waste,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","22":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> what is that <span class=\"wl wl-kjv\" data-code=\"H4912\">proverb</span> that ye have in the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H748\">prolonged,</span> and every <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> faileth?","23":"<span class=\"wl wl-kjv\" data-code=\"H559\">Tell</span> them therefore, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will make this <span class=\"wl wl-kjv\" data-code=\"H4912\">proverb</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease,</span> and they shall no more use it as a <span class=\"wl wl-kjv\" data-code=\"H4911\">proverb</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> but <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are at <span class=\"wl wl-kjv\" data-code=\"H7126\">hand,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">effect</span> of every vision.","24":"For there shall be no more any <span class=\"wl wl-kjv\" data-code=\"H7723\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> nor <span class=\"wl wl-kjv\" data-code=\"H2509\">flattering</span> <span class=\"wl wl-kjv\" data-code=\"H4738\">divination</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","25":"For I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> I will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that I shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> shall come to <span class=\"wl wl-kjv\" data-code=\"H6213\">pass;</span> it shall be no more <span class=\"wl wl-kjv\" data-code=\"H4900\">prolonged:</span> for in your <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> O <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellious</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> will I <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6213\">perform</span> it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","26":"Again the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to me, saying,","27":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> behold, they of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> that he <span class=\"wl wl-kjv\" data-code=\"H2372\">seeth</span> is for <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> to come, and he <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesieth</span> of the <span class=\"wl wl-kjv\" data-code=\"H6256\">times</span> that are far","28":"Therefore <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> There shall none of my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> be <span class=\"wl wl-kjv\" data-code=\"H4900\">prolonged</span> any more, but the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"woont in het midden","tekst":"Te weten in Chaldea onder de Joden, die met den koning Jojachin uit hun vaderland in Babylonië weggevoerd waren, onder wie, hoewel God de zijnen had, boven Eze 11:16-17 , enz.; nochtans blijkt uit deze plaats, dat velen hunner ongelovigen en moedwilligen waren."},{"catchword":"een wederspannig huis,","tekst":"Zie boven Eze 2:5 ; alzo in het volgende."},{"catchword":"niet zien,","tekst":"Te weten inwendiglijk door den geest, om te bemerken welke straffen zij zelf geleden hebben en anderen nog te verwachten stonden, ten einde zij zich bekeren zouden. Vergelijk Isa 6:9 , en Isa 42:18 ."},{"catchword":"niet horen,","tekst":"Dat is, niet geloven of gehoorzaam zijn, naar al de vermaningen en dreigementen, die God door zijne profeten hun gedaan heeft."}],"3":[{"catchword":"Daarom gij,","tekst":"Omdat zij niet willen zien of horen, zal Ik hun nog een ander teken voorhouden."},{"catchword":"gereedschap van vertrekking;","tekst":"Te weten een maaltje of koffertje, staf, reismantel, schoenen of ander reistuig. Vergelijk Mat 10:9-10 . Anderen verstaan het huisraad, als bedden, bulsters, stoelen, tafels, kisten, kostbaarheden, enz."},{"catchword":"voor hun ogen;","tekst":"Dat is, alzo dat zij het met hunne ogen aanschouwen. Want de Heere wilde dezen weggevoerden, door hetgeen de profeet openbaar doen zou, een zeker teken geven van hetgeen zekerlijk die van Juda en Jeruzalem in korten tijd wedervaren zou, overmits zij niet geloofden dat het kwalijk met hen zou gaan, ja hoopten haast daarheen weder te keren, Jer 28:3 , scheldende den profeet Jeremia, door wiens vermaning zij zich in Chaldea hadden laten wegvoeren."},{"catchword":"van uw plaats","tekst":"Te weten waar gij woont."},{"catchword":"andere plaats voor hun ogen;","tekst":"Te weten daar gij in die stad niet gewoond hebt; en dat om u alleszins te schikken naar de wijze van doen dergenen, die waarlijk verhuizen en vele woningen plegen te doorlopen, hetwelk het volk tot een teken moest zijn, dat de koning Zedekia met de zijnen haast zouden moeten verhuizen uit Juda en Jeruzalem en gevankelijk weggevoerd worden naar Babel."},{"catchword":"misschien zullen zij","tekst":"Hij gebruikt dit woord om den profeet in twijfeling te laten van de vruchtbare uitkomst van dit teken, opdat hij leren zou tevreden te zijn met alleen zijn bevel na te komen. Het schijnt ook dat Hij in den profeet wat goede hoop wil opwekken om hem tot naarstigheid op te scherpen."},{"catchword":"merken,","tekst":"Te weten hoe Ik hen om hunne wederspannigheid straffen wil."},{"catchword":"hoewel zij een wederspannig huis zijn","tekst":"Dat is, niettegenstaande zij zeer moedwillig en ongehoorzaam zijn, zodat er niet veel betering van is te verwachten, nochtans zal Ik dit zichtbare teken hun voorstellen tot hunne meerdere overtuiging. Anders: omdat zij een wederspannig huis zijn. Alzo zou God de reden aanwijzen, om welke van der Joden bekering niet veel te verwachten was. Of, mogelijk zullen zij zien; dat is, in hun hart overtuigd worden, dat zij een wederspannig huis zijn; naardien zulke straffen hun volk zullen overkomen, en zij door de hunne in welke zij staken nog niet gebeterd werden."}],"4":[{"catchword":"gereedschap","tekst":"Te weten waarvan in vs.3 gesproken is."},{"catchword":"als het gereedschap dergenen,","tekst":"Hebreeuws, als het gereedschap der vertrekking; dat is, dat men medeneemt in het vertrekken, verhuizen, of verreizen."},{"catchword":"den avond uitgaan voor hun ogen,","tekst":"Het schijnt dat den profeet gelast is eerst zijn gereedschap uit te brengen in een plaats voor zijn huis binnen den muur zijnde, en daarna den muur door te breken en in donker met hetzelve weg te gaan, tot een teken dat de Joden heimelijk zouden zoeken te ontkomen, en dat de koning Zedekia met zijne krijgslieden des nachts trekken en vluchten zou, gelijk ook geschied is, 2Ki 25:4 ; Jer 39:4 , en Jer 52:7 . Avond is hier voor den nacht genomen; zie Job 7:4 ."},{"catchword":"gelijk zij uitgaan,","tekst":"Hebreeuws, naar de uitgangen der vertrekking; dat is, naar de wijze van het uitgaan dergenen, die enige reis aannemen."}],"5":[{"catchword":"Doorgraaf u den wand voor hun ogen,","tekst":"Te weten om te betekenen dat de koning Zedekia de muren der stad zou laten breken, om door de breuk met zijne krijgslieden uit het gevaar te komen. Zie de vervulling 2Ki 25:4 ; Jer 52:7 ."},{"catchword":"uw gereedschap uit","tekst":"Dit is hier ingevoegd uit vs.4, en uit het volgende vs.7."}],"6":[{"catchword":"Voor hun ogen","tekst":"Zie boven vs.3."},{"catchword":"uw aangezicht zult gij bedekken,","tekst":"Dit betekent dat de koning Zedekia zo snellijk en verslagen zou vluchten om de handen der Chaldeën te ontkomen, dat hij het land door hetwelk hij vluchtte, kwalijk zou zien. Daarna dat Zedekia zijn gezicht benomen zou worden door de verblinding zijner ogen, alzo dat hij het land van Babel niet zou zien. Zie de vervulling, 2Ki 25:7 ; Jer 39:7 , en Jer 52:11 . Ook is bedekking van het aangezicht een teken geweest van schande en droefheid, die men alrede heeft, en van zwarigheid, die te verwachten is. Vergelijk 2Sa 15:30 ; Est 7:8 ; Jer 14:3 ."},{"catchword":"wonderteken gegeven","tekst":"Te weten om te betekenen wat toekomende was, namelijk de ondergang van den koning Zedekia en van de stad Jeruzalem. Alzo onder vs.11, Eze 24:24 . Vergelijk Psa 71:7 , met de aantekening."}],"7":[{"catchword":"dergenen,","tekst":"Hebreeuws, der vertrekking."},{"catchword":"met de hand;","tekst":"Dat is, niet met enige ijzeren instrumenten en openbaar geweld, maar als met een diefelijke behendigheid en stilheid, tot een teken dat de koning Zedekia met zijn gezelschap heimelijk zou zoeken de handen der Chaldeën te ontvlieden. Zie 2Ki 25:4 ."},{"catchword":"het uit in donker,","tekst":"Te weten het reisgereedschap."}],"9":[{"catchword":"Wat doet gij?","tekst":"Dat is, wat wil het zijn, dat gij aldus op een vreemde manier in haast verhuist?"}],"10":[{"catchword":"Deze last","tekst":"Dat is, deze profetie, die u door het teken mijner verhuizing voorgesteld wordt. Zie 2Ki 9:25 . Of aldus: Deze last is [tegen] den vorst, tegen Jeruzalem, enz."},{"catchword":"vorst te Jeruzalem,","tekst":"Dat is, de koning Zedekia. De zin is dat de last, dien hij op zijne schouders droeg, een teken was van den last der grote ellenden, die in het kort over den koning, zijne heren en het ganse volk komen zouden."},{"catchword":"dat in het midden van hen is","tekst":"Te weten de Joden, die binnen Jeruzalem woonden, of de stad Jeruzalem, in welke Joden en Israëlieten vergaderd waren."}],"11":[{"catchword":"wonderteken;","tekst":"Zie boven vs.6."},{"catchword":"gedaan heb,","tekst":"Te weten met dit gereedschap aldus te dragen om te verhuizen."},{"catchword":"hun gedaan worden;","tekst":"Namelijk den koning van Juda en zijn volk."},{"catchword":"wegvoering","tekst":"Of vertrekking."},{"catchword":"heengaan","tekst":"Te weten naar Babel. Zie de vervulling hiervan 2Ki 25 ."}],"12":[{"catchword":"vorst,","tekst":"Namelijk de koning Zedekia, van wien in vs.10 gesproken is."},{"catchword":"hen is,","tekst":"Dat is, van die van Jeruzalem en gans Juda."},{"catchword":"het gereedschap","tekst":"Te weten die ter verreizing nodig is, gelijk boven vs.4."},{"catchword":"in het donker,","tekst":"Vergelijk boven vs.4, 6,7."},{"catchword":"wand graven,","tekst":"Dat is, muur; vergelijk boven vs.5."},{"catchword":"aangezicht bedekken,","tekst":"Vergelijk boven vs.6."}],"13":[{"catchword":"uitspreiden,","tekst":"Te weten door de Chaldeeuws krijgslieden, die hem in de vlucht zijnde najagen en vangen zullen. Zie van de vervulling 2Ki 25:5-6 , en van de manier van spreken Job 19:6 ."},{"catchword":"niet zien,","tekst":"Te weten omdat door een geveld oordeel de ogen tevoren hem zullen verblind worden; 2Ki 25:7 ."}],"14":[{"catchword":"allen,","tekst":"Te weten die den koning Zedekia in zijne vlucht vergezelschapten. Zie de vervulling hiervan 2Ki 25:5 . Versta ook de Egyptenaars, die den koning tevoren in de belegering te hulp gekomen waren; Jer 37:5 ; idem die na den dood van Gedalia in Egypte gevlucht waren; Jer 42:16-18 , en Jer 43:5-7 , enz."},{"catchword":"benden","tekst":"Het woord betekent eigenlijk vleugelen, en hier benden en scharen van krijgsvolk. Alzo onder Eze 17:21 , en Eze 39:4 ."},{"catchword":"alle winden verstrooien;","tekst":"Zie boven Eze 5:10 ."},{"catchword":"het zwaard achter hen uittrekken","tekst":"Zie boven Eze 5:2 ."}],"15":[{"catchword":"zij weten,","tekst":"Zie boven Eze 5:13 ."},{"catchword":"dat Ik de HEERE ben,","tekst":"Zie boven Eze 6:7 ."}],"16":[{"catchword":"hen","tekst":"Te weten van de Joden en andere Israëlieten, die in Jeruzalem en daar buiten onder elkander vermengd waren."},{"catchword":"weinige lieden","tekst":"Hebreeuws, lieden van getal; dat is weinige lieden, die men lichtelijk tellenkan; zie Gen 34:30 ."},{"catchword":"hun gruwelen","tekst":"Tegen de eerste en de tweede tafel. Zie van dezelve 2Ki 16:3-4 , enz. en 2Ki 21:2-3 , enz.; 2Ch 33:2-3 , enz. en 2Ch 36:14 , 2Ch 36:16 ."},{"catchword":"vertellen onder de heidenen,","tekst":"Te weten niet slechts alleen met woorden, maar ook metterdaad hunner verstrooiing in alle omliggende landen, waardoor zij als op een toneel gesteld zouden worden tot een openbaar bewijs van Gods werk tegen de zonde."},{"catchword":"zij zullen weten,","tekst":"Te weten niet alleen de Joden, bevindende metterdaad dat Ik waarachtig, rechtvaardig en een vijand der zonden ben, maar ook de heidenen, onderricht zijnde van de Joden en ziende de rechtvaardige plagen, waarmede God hunne zonden strafte."}],"18":[{"catchword":"gij zult uw brood eten met beven,","tekst":"Te weten om te betekenen de benauwdheid, vrees en verslagenheid, waartoe de Joden in Jeruzalem en overal in het land gebracht zouden worden; vergelijk boven Eze 4:16 ."}],"19":[{"catchword":"des lands zeggen","tekst":"Namelijk van Chaldea. Hij verstaat de Joden en Israëlieten, die daar als gevangenen woonden. Dezen was het zeer voordelig te horen, hoe het nog met Jeruzalem gaan zou. Want het was hun leed, verleid zijnde door de valse profeten, dat zij door den raad van Jeremia hun vaderland verlaten en zich hunnen vijanden overgegeven hadden."},{"catchword":"met kommer eten,","tekst":"Dat is, zeer bekommerd, verslagen en verbaasd zijnde over de onverwachte en vreeslijke ellenden, die hen tevens zullen overvallen."},{"catchword":"omdat","tekst":"Dat is, opdat zij daaruit verstaan mochten dat niet alleen de stad belegerd, maar ook het ganse land verwoest zou worden."},{"catchword":"hun land","tekst":"Versta, het land van Jeruzalem, te weten waarin deze stad gelegen was, en waarover zij heersten."},{"catchword":"van zijn volheid,","tekst":"Dat is, van hetgeen waar het vol van is, alzo Psa 24:1 . Versta, allerlei overvloed en rijkdom, die van den vijand weggenomen zou worden."}],"22":[{"catchword":"spreekwoord,","tekst":"Het Hebreeuwse woord betekent hier een algemeen zeggen, met weinige woorden veel betekenende, en het merendeel der lieden zo bekend, dat het hun met de eerste gelegenheid straks op de tong komt. Zie 1Sa 10:12 , en 1Sa 24:14 , en onder Eze 18:2 ."},{"catchword":"gijlieden hebt","tekst":"Te weten, die onder u met mijne dreigementen den spot houden."},{"catchword":"gezicht zal vergaan?","tekst":"De zin van dit spreekwoord is dat zij met de voorzeggingen der profeten, rakende hun ondergang, niet te doen hadden, overmits God naar zijne lankmoedigheid den tijd van de aankomst hun verderfs, dien de profeten kort maakten, verlengen zou, of dat hunne profetieën nimmermeer waarachtig zouden bevonden worden."}],"23":[{"catchword":"De dagen zijn nabij gekomen,","tekst":"Dat is, de tijd van hun ondergang."},{"catchword":"het woord","tekst":"Dat is, de profetie van hunne uitroeiïng door de Chaldeën."},{"catchword":"ieder gezicht","tekst":"Dat is, den inhoud, de uitvoering van elke profetie, rakende uw voorzegd verderf."}],"24":[{"catchword":"ijdel gezicht zal er meer wezen,","tekst":"Dat is, valse en leugenachtige voorzegging. Alzo Lam 2:14 , onder Eze 13:6-7 ; Zec 10:2 , ijdelheid voor valsheid. Zie Job 31:5 ."},{"catchword":"vleiende waarzegging,","tekst":"Hebreeuws, gladde, of desgenen die glad is; te weten van mond, door vleiïng en schoonspreken. Vergelijk Pro 5:3 , en Pro 26:28 , en de aantekening. Hij spreekt van de valse profeten, die de ware profeten tegenspraken en het volk met zoete en aangename voorzeggingen in hun ongeloof en kwaad leven voedden. Anders, slibberige; dat is twijfelachtige."}],"25":[{"catchword":"zal niet meer","tekst":"Want de belegering van Jeruzalem door Nebukadnezar is kort daarna gevolgd."},{"catchword":"uitgesteld worden;","tekst":"Hebreeuws eigenlijk, vertrokken, of vertogen."},{"catchword":"uw dagen,","tekst":"Dat is, in uw leven."}],"27":[{"catchword":"voor vele dagen,","tekst":"Dat is, voor langen tijd, eer het vervuld zal worden, zodat de straf op onze dagen niet aankomen zal. Zij loochenen niet openbaar de waarheid der profetie, maar om zichzelven in slaap te wiegen, stellen zij die lang uit."},{"catchword":"hij profeteert van tijden,","tekst":"Zij mene // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {

  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {

// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
