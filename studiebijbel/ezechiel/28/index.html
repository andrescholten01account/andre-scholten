n de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.","3":"Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten* voor u verborgen.","4":"Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.","5":"Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.","6":"Daarom zegt de Heere HEERE zo: Omdat u uw hart gesteld hebt als het hart van God,","7":"Daarom zie, Ik zal vreemden over u brengen, de meest tirannieke van de heidenvolken; die zullen hun zwaarden trekken tegen de schoonheid van uw wijsheid, en zullen uw glans ontheiligen.","8":"Naar de groeve zullen zij u doen neerdalen; en u zult sterven de dood van een verslagene, in het hart van de zeeën.","9":"Zult u dan nog, voor het aangezicht van hem die u doodslaat, zeggen: Ik ben God? terwijl u een mens bent en geen God, in de hand van hem die u verslaat?","10":"U zult de dood van de onbesnedenen sterven, door de hand van vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.","11":"Verder gebeurde het woord van de HEERE tot mij:","12":"Mensenkind! Hef een klaaglied aan over de koning van Tyrus, en zeg tegen hem: Zo zegt de Heere HEERE: U, verzegelaar van de som, vol van wijsheid en volmaakt in schoonheid!","13":"U was in Eden, de hof van God; alle kostelijke stenen waren uw bedekking: sardisstenen, topazen en diamanten, turkooizen, sardonyxstenen en jaspisstenen, saffieren, robijnen en smaragden, en goud; het werk van uw trommels en uw pijpen was bij u; op de dag dat u geschapen werd, waren zij gereed.","14":"U was een gezalfde, beschermende cherub; en Ik had u zo gezet; u was op de heilige berg van God; u wandelde in het midden van de vurige stenen.","15":"U was volkomen in uw wegen, vanaf de dag dat u geschapen bent, totdat er ongerechtigheid in u gevonden is.","16":"Door de veelheid van uw koophandel hebben zij het midden van u met geweld vervuld, en u hebt gezondigd; daarom zal Ik u ontheiligen van de berg van God, en zal Ik u, beschermende cherub, wegvagen uit het midden van de vurige stenen!","17":"Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.","18":"Vanwege de veelheid van uw ongerechtigheden, door het onrecht van uw koophandel, hebt u uw heiligdommen ontheiligd; daarom heb Ik een vuur uit uw midden doen voortkomen, dat u heeft verteerd, en Ik heb u tot as gemaakt op de aarde, voor de ogen van allen die u zien.","19":"Allen die u kennen onder de volken, zijn ontzet over u; u bent een grote schrik geworden, en zult er niet meer zijn, tot in eeuwigheid.","20":"Verder gebeurde het woord van de HEERE tot mij:","21":"Mensenkind! Zet uw aangezicht tegen Sidon, en profeteer tegen haar,","22":"En zeg: Zo zegt de Heere HEERE: Zie, Ik zál tegen u zijn, o Sidon! en Ik zal in uw midden verheerlijkt worden; en zij zullen weten dat Ik de HEERE ben, wanneer Ik gerichten in haar zal hebben geoefend, en in haar geheiligd zal zijn.","23":"Want Ik zal de pest in haar zenden, en bloed op haar straten, en de verslagenen zullen vallen in haar midden, door het zwaard dat van rondom tegen haar zal zijn; en zij zullen weten dat Ik de HEERE ben.","24":"En het huis van Israël zal geen pijnlijke doorn meer hebben, en geen pijn veroorzakende distel, van allen die rondom hen zijn, die hen beroven; en zij zullen weten dat Ik de Heere HEERE ben.","25":"Zo zegt de Heere HEERE: Wanneer Ik het huis van Israël verzameld zal hebben uit de volken onder wie zij verstrooid zijn, en Ik onder hen voor de ogen van de heidenvolken geheiligd zal zijn, dan zullen zij in hun land wonen, dat Ik aan Mijn knecht, aan Jakob, gegeven heb.","26":"En zij zullen daarin zeker wonen, en huizen bouwen, en wijngaarden planten; ja, zij zullen zeker wonen; wanneer Ik gerichten zal hebben geoefend tegen allen die hen beroofd hebben, van degenen die rondom hen zijn; en zij zullen weten dat Ik, de HEERE, hun God ben."},"SV":{"1":"Voorts geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind! zeg tot den vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en zegt: Ik ben God, ik zit in Godes stoel, in het hart der zeeën! daar gij een mens en geen God zijt, stelt gij nochtans uw hart, als Gods hart.","3":"Zie, gij zijt wijzer dan Daniël; zij hebben niets toegeslotens voor u verborgen.","4":"Door uw wijsheid en door uw verstand, hebt gij vermogen voor u verkregen; ja, gij hebt goud en zilver verkregen in uw schatten.","5":"Door de grootheid uwer wijsheid in uw koophandel hebt gij uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.","6":"Daarom zegt de Heere HEERE alzo: Omdat gij uw hart gesteld hebt als Gods hart;","7":"Daarom zie, Ik zal vreemden over u brengen, de tirannigste der heidenen; die zullen hun zwaarden uittrekken over de schoonheid uwer wijsheid, en zullen uw glans ontheiligen.","8":"Ter groeve zullen zij u doen nederdalen; en gij zult sterven den dood eens verslagenen in het hart der zeeën.","9":"Zult gij *dan* enigszins, voor het aangezicht uws doodslagers, zeggen: Ik ben God? daar gij een mens zijt en geen God, in de hand desgenen, die u verslaat?","10":"Gij zult den dood der onbesnedenen sterven; door de hand der vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.","11":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","12":"Mensenkind! hef een klaaglied op over den koning van Tyrus, en zeg tot hem: Zo zegt de Heere HEERE: Gij verzegelaar der som, vol van wijsheid en volmaakt in schoonheid!","13":"Gij waart in Eden, Gods hof; alle kostelijk gesteente was uw deksel, sardisstenen, topazen en diamanten, turkooizen, sardonixstenen en jaspisstenen, saffieren, robijnen, en smaragden, en goud; het werk uwer trommelen en uwer pijpen was bij u; ten dage als gij geschapen werdt, waren zij bereid.","14":"Gij waart een gezalfde, overdekkende cherub; en Ik had u *alzo* gezet; gij waart op Gods heiligen berg; gij wandeldet in het midden der vurige stenen.","15":"Gij waart volkomen in uw wegen, van den dag af, dat gij geschapen zijt, totdat er ongerechtigheid in u gevonden is.","16":"Door de veelheid uws koophandels hebben zij het midden van u met geweld vervuld, en gij hebt gezondigd; daarom zal Ik u ontheiligen van Gods berg, en zal u, gij overdekkende cherub! verdoen uit het midden der vurige stenen!","17":"Uw hart verheft zich over uw schoonheid; gij hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde henengeworpen, Ik heb u voor het aangezicht der koningen gesteld, om op u te zien.","18":"Vanwege de veelheid uwer ongerechtigheden, door het onrecht uws koophandels, hebt gij uw heiligdommen ontheiligd; daarom heb Ik een vuur uit het midden van u doen voortkomen, dat u heeft verteerd, en Ik heb u gemaakt tot as op de aarde, voor de ogen van al degenen, die u zien.","19":"Allen, die u kennen onder de volken, zijn over u ontzet; gij zijt een grote schrik geworden, en zult er niet *meer* zijn tot in eeuwigheid.","20":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","21":"Mensenkind! zet uw aangezicht tegen Sidon, en profeteer tegen haar,","22":"En zeg: Zo zegt de Heere HEERE: Zie, Ik *wil* aan u, o Sidon! en zal in het midden van u verheerlijkt worden; en zij zullen weten, dat Ik de HEERE ben, als Ik gerichten in haar zal hebben geoefend, en in haar geheiligd zal zijn.","23":"Want Ik zal de pestilentie in haar zenden, en bloed op haar straten, en de verslagenen zullen vallen in het midden van haar, door het zwaard, *dat* tegen haar zal zijn van rondom; en zij zullen weten, dat Ik de HEERE ben.","24":"En het huis Israëls zal geen smartenden doorn noch wee doende distel meer hebben, van allen, die rondom hen zijn, die henlieden beroven; en zij zullen weten, dat Ik de Heere HEERE ben.","25":"Alzo zegt de Heere HEERE: Als Ik het huis Israëls zal vergaderd hebben uit de volken, onder dewelke zij verstrooid zijn, en Ik onder hen voor de ogen der heidenen zal geheiligd zijn, dan zullen zij in hun land wonen, dat Ik aan Mijn knecht, aan Jakob gegeven heb.","26":"En zij zullen daarin zeker wonen, en huizen bouwen, en wijngaarden planten; ja, zij zullen zeker wonen; als Ik gerichten zal hebben geoefend tegen allen, die henlieden beroofd hebben, van degenen, die rondom hen zijn; en zij zullen weten dat Ik, de HEERE, hunlieder God ben."},"KJV":{"1":"The word of the LORD came again unto me, saying,","2":"Son of man, say unto the prince of Tyrus, Thus saith the Lord GOD; Because thine heart *is* lifted up, and thou hast said, I *am* a God, I sit *in* the seat of God, in the midst of the seas; yet thou *art* a man, and not God, though thou set thine heart as the heart of God:","3":"Behold, thou *art* wiser than Daniel; there is no secret that they can hide","4":"With thy wisdom and with thine understanding thou hast gotten thee riches, and hast gotten gold and silver into thy treasures:","5":"By thy great wisdom *and* by thy traffick hast thou increased thy riches, and thine heart is lifted up because of thy riches:","6":"Therefore thus saith the Lord GOD; Because thou hast set thine heart as the heart of God;","7":"Behold, therefore I will bring strangers upon thee, the terrible of the nations: and they shall draw their swords against the beauty of thy wisdom, and they shall defile thy brightness.","8":"They shall bring thee down to the pit, and thou shalt die the deaths of *them that are* slain in the midst of the seas.","9":"Wilt thou yet say before him that slayeth thee, I *am* God? but thou *shalt be* a man, and no God, in the hand of him that slayeth","10":"Thou shalt die the deaths of the uncircumcised by the hand of strangers: for I have spoken *it*, saith the Lord GOD.","11":"Moreover the word of the LORD came unto me, saying,","12":"Son of man, take up a lamentation upon the king of Tyrus, and say unto him, Thus saith the Lord GOD; Thou sealest up the sum, full of wisdom, and perfect in beauty.","13":"Thou hast been in Eden the garden of God; every precious stone *was* thy covering, the sardius, topaz, and the diamond, the beryl, the onyx, and the jasper, the sapphire, the emerald, and the carbuncle, and gold: the workmanship of thy tabrets and of thy pipes was prepared in thee in the day that thou wast created.","14":"Thou *art* the anointed cherub that covereth; and I have set thee *so*: thou wast upon the holy mountain of God; thou hast walked up and down in the midst of the stones of fire.","15":"Thou *wast* perfect in thy ways from the day that thou wast created, till iniquity was found","16":"By the multitude of thy merchandise they have filled the midst of thee with violence, and thou hast sinned: therefore I will cast thee as profane out of the mountain of God: and I will destroy thee, O covering cherub, from the midst of the stones of fire.","17":"Thine heart was lifted up because of thy beauty, thou hast corrupted thy wisdom by reason of thy brightness: I will cast thee to the ground, I will lay thee before kings, that they may behold","18":"Thou hast defiled thy sanctuaries by the multitude of thine iniquities, by the iniquity of thy traffick; therefore will I bring forth a fire from the midst of thee, it shall devour thee, and I will bring thee to ashes upon the earth in the sight of all them that behold","19":"All they that know thee among the people shall be astonished at thee: thou shalt be a terror, and never *shalt* thou *be* any more.","20":"Again the word of the LORD came unto me, saying,","21":"Son of man, set thy face against Zidon, and prophesy","22":"And say, Thus saith the Lord GOD; Behold, I *am* against thee, O Zidon; and I will be glorified in the midst of thee: and they shall know that I *am* the LORD, when I shall have executed judgments in her, and shall be sanctified","23":"For I will send into her pestilence, and blood into her streets; and the wounded shall be judged in the midst of her by the sword upon her on every side; and they shall know that I *am* the LORD.","24":"And there shall be no more a pricking brier unto the house of Israel, nor *any* grieving thorn of all *that are* round about them, that despised them; and they shall know that I *am* the Lord GOD.","25":"Thus saith the Lord GOD; When I shall have gathered the house of Israel from the people among whom they are scattered, and shall be sanctified in them in the sight of the heathen, then shall they dwell in their land that I have given to my servant Jacob.","26":"And they shall dwell safely therein, and shall build houses, and plant vineyards; yea, they shall dwell with confidence, when I have executed judgments upon all those that despise them round about them; and they shall know that I *am* the LORD their God."}},"tsk":{"2":[{"kopje":"Omdat","refs":["Ezech 28:5","Ezech 28:17","Ezech 31:10","Deut 8:14","2 Kron 26:16","Spr 16:18","Spr 18:12","Jes 2:12","Dan 5:22","Dan 5:23","Hab 2:4","1 Tim 3:6","1 Petr 5:5"]},{"kopje":"Ik ben","refs":["Ezech 28:6","Ezech 28:9","Gen 3:5","Hand 12:22","Hand 12:23","Openb 17:3"]},{"kopje":"ik zit","refs":["Ezech 28:12-14","Jes 14:13","Jes 14:14","Dan 4:30","Dan 4:31","2 Tess 2:4"]},{"kopje":"in het hart","refs":["Ezech 27:3","Ezech 27:4","Ezech 27:26","Ezech 27:27"]},{"kopje":"terwijl","refs":["Ezech 28:9","Ps 9:21","Ps 72:6","Ps 72:7","Jes 31:3"]},{"kopje":"stelt u","refs":["Ezech 28:6","2 Tess 2:4"]}],"3":[{"kopje":"u bent","refs":["Dan 1:20","Dan 2:48","Dan 5:11","Dan 5:12","Zach 9:2","Zach 9:3"]},{"kopje":"niets","refs":["1 Kon 4:29-32","1 Kon 10:3","Job 15:8","Ps 25:14","Dan 2:22","Dan 2:27","Dan 2:28","Dan 2:47","Dan 5:12"]}],"5":[{"kopje":"uw wijsheid","refs":["Spr 26:12","Jes 5:21","Rom 12:16"]},{"kopje":"en","refs":["Ezech 27:12-36","Ps 62:11 =\"wl\" data-l=\"L9\" data-code=\"H7590\">die</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5439\">rondom</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">hen</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">zijn</span>; <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">en</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">zij</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">zullen</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3045\">weten</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H430\">dat</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8201\">Ik</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H8201\">de</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H430\">HEERE</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H430\">hun</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H430\">ben</span>."},"koppeling_kjv":{"1":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came again unto me, saying,","2":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5057\">prince</span> of <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up,</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am a <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> I <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> in the <span class=\"wl wl-kjv\" data-code=\"H4186\">seat</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas;</span> yet thou art a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and not <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> though thou <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> as the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of God:","3":"Behold, thou art <span class=\"wl wl-kjv\" data-code=\"H2450\">wiser</span> than <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel;</span> there is no <span class=\"wl wl-kjv\" data-code=\"H5640\">secret</span> that they can hide","4":"With thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and with thine <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> thee <span class=\"wl wl-kjv\" data-code=\"H2428\">riches,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> into thy treasures:","5":"By thy <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and by thy <span class=\"wl wl-kjv\" data-code=\"H7404\">traffick</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> thy <span class=\"wl wl-kjv\" data-code=\"H2428\">riches,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> is lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up</span> because of thy riches:","6":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> as the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of God;","7":"Behold, therefore I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> upon thee, the <span class=\"wl wl-kjv\" data-code=\"H6184\">terrible</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7324\">draw</span> their <span class=\"wl wl-kjv\" data-code=\"H2719\">swords</span> against the <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2490\">defile</span> thy brightness.","8":"They shall bring thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7845\">pit,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> the <span class=\"wl wl-kjv\" data-code=\"H4463\">deaths</span> of them that are <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> in the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the seas.","9":"Wilt thou <span class=\"wl wl-kjv\" data-code=\"H559\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him that <span class=\"wl wl-kjv\" data-code=\"H2026\">slayeth</span> thee, I am <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span> but thou shalt be a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and no <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of him that slayeth","10":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> the <span class=\"wl wl-kjv\" data-code=\"H4194\">deaths</span> of the <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","11":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","12":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> take <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H7015\">lamentation</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Thou sealest <span class=\"wl wl-kjv\" data-code=\"H2856\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8508\">sum,</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H3632\">perfect</span> in beauty.","13":"Thou hast been in <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden</span> the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> every <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> was thy <span class=\"wl wl-kjv\" data-code=\"H4540\">covering,</span> the <span class=\"wl wl-kjv\" data-code=\"H124\">sardius,</span> <span class=\"wl wl-kjv\" data-code=\"H6357\">topaz,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3095\">diamond,</span> the <span class=\"wl wl-kjv\" data-code=\"H8658\">beryl,</span> the <span class=\"wl wl-kjv\" data-code=\"H7718\">onyx,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3471\">jasper,</span> the <span class=\"wl wl-kjv\" data-code=\"H5601\">sapphire,</span> the <span class=\"wl wl-kjv\" data-code=\"H5306\">emerald,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1304\">carbuncle,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold:</span> the <span class=\"wl wl-kjv\" data-code=\"H4399\">workmanship</span> of thy <span class=\"wl wl-kjv\" data-code=\"H8596\">tabrets</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H5345\">pipes</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> in thee in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou wast created.","14":"Thou art the <span class=\"wl wl-kjv\" data-code=\"H4473\">anointed</span> <span class=\"wl wl-kjv\" data-code=\"H3742\">cherub</span> that <span class=\"wl wl-kjv\" data-code=\"H5526\">covereth;</span> and I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thee so: thou wast upon the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> thou hast walked up and <span class=\"wl wl-kjv\" data-code=\"H1980\">down</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of fire.","15":"Thou wast <span class=\"wl wl-kjv\" data-code=\"H8549\">perfect</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou wast <span class=\"wl wl-kjv\" data-code=\"H1254\">created,</span> till <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> was found","16":"By the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7404\">merchandise</span> they have <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee with <span class=\"wl wl-kjv\" data-code=\"H2555\">violence,</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned:</span> therefore I will cast thee as <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H5526\">covering</span> <span class=\"wl wl-kjv\" data-code=\"H3742\">cherub,</span> from the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of fire.","17":"Thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> was lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up</span> because of thy <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupted</span> thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> by reason <span class=\"wl wl-kjv\" data-code=\"H5921\">of</span> thy <span class=\"wl wl-kjv\" data-code=\"H3314\">brightness:</span> I will <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> thee to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> thee <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> that they may behold","18":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H2490\">defiled</span> thy <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuaries</span> by the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities,</span> by the <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7404\">traffick;</span> therefore will I bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> from the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee, it shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> thee, and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">bring</span> thee to <span class=\"wl wl-kjv\" data-code=\"H665\">ashes</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all them that behold","19":"All they that <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thee among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished</span> at thee: thou shalt be a <span class=\"wl wl-kjv\" data-code=\"H1091\">terror,</span> and <span class=\"wl wl-kjv\" data-code=\"H369\">never</span> shalt thou be any <span class=\"wl wl-kjv\" data-code=\"H5704\">more.</span>","20":"Again the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","21":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> against <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon,</span> and prophesy","22":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I am against thee, O <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon;</span> and I will be <span class=\"wl wl-kjv\" data-code=\"H3513\">glorified</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of thee: and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when I shall have <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> in her, and shall be sanctified","23":"For I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> into her <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> into her <span class=\"wl wl-kjv\" data-code=\"H2351\">streets;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2491\">wounded</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5307\">judged</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of her by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon her on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","24":"And there shall be no more a <span class=\"wl wl-kjv\" data-code=\"H3992\">pricking</span> <span class=\"wl wl-kjv\" data-code=\"H5544\">brier</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> nor any <span class=\"wl wl-kjv\" data-code=\"H3510\">grieving</span> <span class=\"wl wl-kjv\" data-code=\"H6975\">thorn</span> of all that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> them, that <span class=\"wl wl-kjv\" data-code=\"H7590\">despised</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","25":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> When I shall have <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> among whom they are <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> in them in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> then shall they <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in their <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> that I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> Jacob.","26":"And they shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H983\">safely</span> therein, and shall <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> and <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards;</span> yea, they shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> with <span class=\"wl wl-kjv\" data-code=\"H983\">confidence,</span> when I have <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> upon all those that <span class=\"wl wl-kjv\" data-code=\"H7590\">despise</span> them round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their God."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"vorst van Tyrus","tekst":"Versta, den koning, gelijk onder vs.12, en zie 1Sa 6:21 ; 2Ki 20:5 ."},{"catchword":"zegt","tekst":"Of, gij gezegd hebt, of zegt; te weten bij uzelven, dat is denkt, maakt u wijs."},{"catchword":"god,","tekst":"U toeëigenende de wijsheid, macht en majesteit, die den enigen waren God alleen toekomt."},{"catchword":"stoel,","tekst":"Als in een hemelrijk, waar mij geen vijand kon deren, noch enige heerlijkheid ontbreekt."},{"catchword":"hart der zeeën","tekst":"Zie boven Eze 27:4 ; alzo vs.8."},{"catchword":"stelt gij nochtans uw hart,","tekst":"Gij vergelijkt u met wijsheid, enz. met God."}],"3":[{"catchword":"wijzer dan Daniël;","tekst":"Versta in uwen zin, en alzo in het volgende; of bespottenderwijze gesproken. Het schijnt dat er in Babel [waar Ezechiël geprofeteerd heeft] zulk een spreekwoord gebruikt is, van Daniëls wijsheid genomen, die aldaar vermaard was. Zie Dan 1:17 , enz."},{"catchword":"zij hebben niets toegeslotens","tekst":"Dat is, men heeft niets, enz., of daar is niets, enz."},{"catchword":"verborgen","tekst":"Of, verduisterd."}],"4":[{"catchword":"verkregen;","tekst":"Hebreeuws, gemaakt; alzo in het volgende."},{"catchword":"schatten","tekst":"Of, schatkamers."}],"7":[{"catchword":"vreemden over u brengen,","tekst":"De Babyloniërs, boven Eze 26:7 ; onder Eze 29:20 ."},{"catchword":"tirannigste der heidenen;","tekst":"Of, verschrikkelijkste, gruwzaamste, wreedste. Alzo onder Eze 30:11 , en Eze 31:12 , en Eze 32:12 ."},{"catchword":"uittrekken","tekst":"Hebreeuws, ledigen, omdat de schede in het uittrekken van het zwaard geledigd wordt; alzo onder Eze 30:11 ."},{"catchword":"schoonheid uwer wijsheid,","tekst":"Dat is, uw bloeiend koninkrijk en staat, welker heerlijkheid gij uwe wijsheid toeschrijft; of tegen u, die gij u zo schoon en wijs houdt."},{"catchword":"ontheiligen","tekst":"Dat is, verontreinigen, als een onheilig en vuil ding behandelen mits u dodende en in den kuil smijtende, gelijk volgt; alzo vs.16. Zie boven Eze 7:21 ."}],"8":[{"catchword":"dood eens verslagenen","tekst":"Hebreeuws in het veelvoudig getal, doden, of dodingen [gelijk Isa 53:9 ] . De zin is: Zij zullen u een geweldigen dood aandoen, zelfs in uwe stad, die met wateren omsingeld is, waarop gij u vertrouwt."},{"catchword":"hart der zeeën","tekst":"Gelijk boven vs.2."}],"9":[{"catchword":"enigszins,","tekst":"Hebreeuws, zeggende zeggen."},{"catchword":"aangezicht uws doodslagers,","tekst":"Als gij uwe onmacht en nietigheid metterdaad zult bevinden, zijnde in de macht van uw vijand."}],"10":[{"catchword":"dood der onbesnedenen sterven;","tekst":"Hebreeuws, doden, [in het getal van velen gelijk vs.8] der onbesnedenen; dat is, als de goddelozen, onheiligen en bij God verachten sterven, dat van zijn volk niet zijn. Zie 1Sa 17:26 ; Jdg 15:18 ; idem onder Eze 31:18 , en Eze 32:19 , Eze 32:21 , Eze 32:25 , Eze 32:27 , enz. Sommigen gissen dat dit zou mogen zien op de ordinantie van Gods volk, hebbende bevel van uit te roeien onder hen, die zich niet wilden laten besnijden; Gen 17:14 ."}],"12":[{"catchword":"tot hem","tekst":"Of, van hem."},{"catchword":"som,","tekst":"Dat is, van het getelde of gewogene, dat is, [gelijk sommigen verstaan] die het opperste gezag hebt over den gansen groten koophandel van Tyrus. Of, [gelijk anderen] die een maat, patroon, beeld of prent zijt van een volkomenlijk bloeienden staat. Of, zonder enig gebrek, waar niets aan feilt, gelijk aan ene som, die wel geteld en verzegeld is."}],"13":[{"catchword":"waart in Eden,","tekst":"Woondet en hieldt hof in een uitermate pleizierige plaats, als in een lusthof of paradijs. Zie Gen 2:8 , en Gen 13:10 , en onder Eze 31:8-9 , en Eze 36:35 ."},{"catchword":"alle kostelijk gesteente","tekst":"Dat is, allerlei."},{"catchword":"deksel,","tekst":"Dat is, uwe klederen waren daarmede alzo versierd, alsof gij met enkel kostelijk gesteente gekleed waart."},{"catchword":"sardisstenen,","tekst":"Of, robijnen."},{"catchword":"diamanten,","tekst":"Of, arbonkelen."},{"catchword":"sardonixstenen","tekst":"Zie Gen 2:12 ."},{"catchword":"robijnen,","tekst":"Of, karbonkelen."},{"catchword":"het werk uwer trommelen","tekst":"Van kindsbeen aan hebt gij in alle vrolijkheid en dartelheid geleefd; men heeft u alle pleizier en sier aangedaan, waartoe het trommelende, pijpenwerk diende."},{"catchword":"geschapen werdt,","tekst":"Dat is, geboren, en door Gods almacht, goedheid en wijsheid uit moeders lichaam eerst tevoorschijn werd gebracht. Vergelijk Gen 1:1 . Alzo vs.15, en boven Eze 21:30 ."}],"14":[{"catchword":"Gij waart","tekst":"Dat is, gij waart te vergelijken in uiterlijke kostelijkheid en heerlijkheid bij hetgeen op mijnen berg Zion in den tempel zeer kostelijk en heerlijk was; namelijk, de gouden cherubim en het priesterlijk gewaad. Dit past bekwamelijk op dit gansche vs. Anderen duiden het op de cherubim, die het paradijs bewaarden, [omdat in het voorgaande van Eden en Gods hof gesproken is] met welke deze kohing als gezalfd, dat is, verordineerd en gesteld [gelijk volgt] tot een beschermer van zijn rijk is vergeleken."},{"catchword":"gezalfde,","tekst":"Want hetgeen in den tabernakel was, werd gezalfd met de heilige olie; Exo 30:26 , enz."},{"catchword":"overdekkende","tekst":"Te weten de ark, met zijne vleugelen, Exo 25:20 ."},{"catchword":"cherub;","tekst":"Zie Gen 3:24 ."},{"catchword":"gezet;","tekst":"Of, gemaakt; dat is, Ik had u met zulke heerlijkheid begaafd."},{"catchword":"Gods heiligen berg;","tekst":"Hebreeuws, op den berg der heiligheid Gods; dat is als, of gelijk enz. Versta Zion."},{"catchword":"vurige stenen","tekst":"Hebreeuws, stenen des vuurs; dat is, overal, waar gij op en neer gingt in uw paleis, blonk het van glinsterende kostelijke stenen: of, gij wandeldet in klederen, die daarmede versierd waren, en als vuurstralen van zich gaven; gelijk de hogepriester blonk met de gesteenten, die in den priesterlijken borstlap waren; Exo 28:15 , enz."}],"15":[{"catchword":"volkomen","tekst":"Dat is, u ontbrak niets aan pracht en heerlijkheid."},{"catchword":"wegen,","tekst":"Dat is, wezen, voornemen en doen; zie Gen 6:12 ."},{"catchword":"geschapen zijt,","tekst":"Gelijk boven vs.13."},{"catchword":"ongerechtigheid","tekst":"Anders: grote ongerechtigheid, om uit te drukken dat het Hebreeuwse woord, betekenende ongerechtigheid, verkeerdheid, ondeugd, enz. een letter meer heeft dan gewoon; vergelijk Psa 3:3 ."},{"catchword":"gevonden is","tekst":"Dat is, klaarlijk gebleken en ontdekt, en gij als op de daad betrapt en achterhaald zijt; vergelijk Psa 36:3 ; Jer 2:26 , enz. met de aantekening."}],"16":[{"catchword":"veelheid uws koophandels","tekst":"Of, grootheid."},{"catchword":"zij het","tekst":"Te weten die met u gehandeld hebben."},{"catchword":"midden van u","tekst":"Dat is, uw hart, of het midden van uw stad."},{"catchword":"geweld","tekst":"Dat gij genegen zijt geworden tot allerlei overlast, of dat gij vergaderd hebt grote schatten, door geweld verkregen."},{"catchword":"vervuld,","tekst":"Anders: zijn zij [in het] midden van u vol van, enz."},{"catchword":"ontheiligen","tekst":"Als onrein en onheilig verstoten; vergelijk vs.7."},{"catchword":"Gods berg,","tekst":"Van de heerlijkheid, door welke gij met mijnen berg [boven vs.14] waart te vergelijken, verachtelijk verworpen."},{"catchword":"overdekkende cherub","tekst":"Gelijk vs.14."},{"catchword":"uit het midden der vurige stenen","tekst":"Dat gij van al uwe pracht zult ontbloot zijn, vs.14."}],"17":[{"catchword":"bedorven,","tekst":"Uwe hoogheid en heerlijkheid heeft uwe wijsheid doen vergaan en u verdwaasd."},{"catchword":"heb u op de aarde henengeworpen,","tekst":"Dat is, Ik zal het zekerlijk doen, profetischerwijze gesproken, en alzo in het volgende."},{"catchword":"om op u te zien","tekst":"Dat is, tot een schouwspel of spectakel van mijn rechtvaardig en wonderlijk oordeel over u, over wiens pracht en vermogen zich ieder tevoren verwonderde, gelijk in het volgende verklaard wordt."}],"18":[{"catchword":"heiligdommen ontheiligd;","tekst":"Dat is, uw paleis en koninklijken troon, [die Gode behoren geheiligd te worden en die gij met Gods woning en troon vergeleekt, vs.2], hebt gij onheilig, veil en profaan gemaakt."},{"catchword":"vuur uit het midden","tekst":"Van mijn toorn, door u en de uwen veroorzaakt, of der plagen en ellenden; zie Job 22:20 , en boven Eze 20:47 , en onder Eze 30:8 ."},{"catchword":"as op de aarde,","tekst":"Dat is, zal u tot de uiterste nietigheid brengen; zie Job 16:15 , enz."}],"19":[{"catchword":"grote schrik geworden,","tekst":"Gelijk boven Eze 27:36 ."}],"21":[{"catchword":"zet uw aangezicht","tekst":"Zie boven Eze 6:2 ."},{"catchword":"Sidon,","tekst":"Ook aan de Middellandse zee, of de zee van Fenicië, gelegen noordwaarts van Tyrus af. Zie Gen 10:15 ."}],"22":[{"catchword":"wil aan u, o Sidon","tekst":"Zie boven Eze 13:8 ; Jer 21:13 ."},{"catchword":"verheerlijkt worden;","tekst":"Door mijne oordelen en straffen, [gelijk volgt] oorzaak geven van geëerd en geroemd te zijn."},{"catchword":"haar zal hebben","tekst":"Sidon."},{"catchword":"geoefend,","tekst":"Hebreeuws, gedaan; alzo vs.26, en Eze 30:19 , enz.; zie boven Eze 5:8 ."},{"catchword":"geheiligd zal zijn","tekst":"Mijne gerechtigheid, heiligheid en macht onder hen zal bewezen hebben. Alzo vs.25, en Eze 36:23 , en Eze 38:16 ."}],"23":[{"catchword":"zullen vallen in het midden van haar,","tekst":"Anders: gericht worden."}],"24":[{"catchword":"smartenden doorn","tekst":"Of, stekende; dat is, de omliggende vijanden zullen hen niet meer kwellen en beschadigen."},{"catchword":"van allen,","tekst":"Of, uit alle plaatsen, die rondom hen zijn."},{"catchword":"beroven;","tekst":"Of, versmaden; alzo vs.26, vergelijk boven Eze 16:57 ."}],"25":[{"catchword":"Alzo zegt de Heere HEERE","tekst":"Deze profetie kan wel enigszins geduid worden op de verlossing uit Babel, maar hare vervulling behoort tot het geestelijk koninkrijk van den Messias, en is gesteld [gelijk elders dikwijls] naar den stijl van het Oude Testament. Vergelijk Jer 32:37-39 , enz."},{"catchword":"geheiligd zijn,","tekst":"Gelijk vs.22."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover, the word of the Lord came unto me saying:"}],"2":[{"catchword":null,"tekst":"Child of man, say unto the prince of Tyrus, [Meaning the King of Tyrus as above verse 12, and see 2 Samuel 6.21 and 2 Kings 20.5.] Thus saith the Lord LORD; because thy heart lifteth up it self and saith, [or, thou sadist, or, sayest; to with, with thy self; that is thinkest, perfwadest thy self] I am God, [Attribution to thy self the wisdom, power, majesty which belongeth to the onely true God] as I sit in God&acirc;&euro;&trade;s seat, [as in such a kingdom, where no enemy can annoy me, nor any glory is lacking unto me] in the heart of the seas: [see above chapter 27.4. so verse 8] whereas thou art a man, and not a God, yet thou settlest thine heart as the heart of God. [thou comparest thy self in wisdom, &c. with God"}],"3":[{"catchword":null,"tekst":"Behold, thou art wiser than Daniel: [Meaning in thine own conceit; and so the sequel: or it is spoken ironically. It seemeth that there was such a proverb used in Babel, (where Ezekiel prophesied) taken fron Daniel&acirc;&euro;&trade;s wisdom, which was famous there. See Daniel 1. 17, &c.] They have hid [Or, darkened] no closed thing from thee. [Or, men have hid no closed thing, &c. or, or no closed thing hath been, &c.]"}],"4":[{"catchword":null,"tekst":"By thy wisdom, and by thine understanding thou hast gotten [Heb. Made. So in the sequel] for thee wealth; yea thou hast gotten gold and silver into thy treasures. [or, treasures.]"}],"5":[{"catchword":null,"tekst":"By the greatness of thy wisdom in thy traffickast thou increased thy wealth: and thy // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {

}
document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
