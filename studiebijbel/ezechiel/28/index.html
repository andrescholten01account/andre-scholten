 dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "Ps 49:21": "De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.", "Ps 9:17": "De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.", "Openb 18:12": "Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen;", "2 Kon 14:9": "Maar Joas, de koning van Israël, zond naar Amazia, de koning van Juda, en zei: De distel die op de Libanon staat, zond naar de ceder die op de Libanon staat, en zei: Geef uw dochter aan mijn zoon tot vrouw; maar het wilde dier van het veld, dat op de Libanon was, kwam voorbij en vertrapte de distel.", "Ex 40:9": "Dan zult u de zalfolie nemen en de tabernakel zalven, en alles wat daarin is; en u zult dezelf heiligen, met al zijn gereedschap, en het zal heilig zijn.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Jer 22:13-19": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft! Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie. Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Ezech 16:15": "Maar u hebt vertrouwd op uw schoonheid, en hebt gehoereerd vanwege uw naam; ja, u hebt uw hoererijen uitgestort over ieder die voorbijkwam; voor hem was u.", "Ezech 25:11": "Ik zal ook in Moab strafgerichten voltrekken; en zij zullen weten dat Ik de HEERE ben.", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Hos 12:8": "In de hand van de koopman is een bedrieglijke weegschaal, hij houdt ervan te verdrukken;", "Ezech 20:40": "Want op Mijn heilige berg, op de hoge berg van Israël, spreekt de Heere HEERE, daar zal Mij het hele huis van Israël in het land dienen, zij allen; daar zal Ik welgevallen aan hen hebben, en daar zal Ik uw hefoffers eisen, en de eerstelingen van uw heffingen met al uw geheiligde dingen.", "Richt 2:3": "Daarom heb Ik ook gezegd: Ik zal hen voor uw aangezicht niet verdrijven; maar zij zullen u aan de zijden zijn, en hun goden zullen u tot een strik zijn.", "Joël 3:7": "Zie, Ik zal hen opwekken uit de plaats waarheen u ze hebt verkocht; en Ik zal uw vergelding op uw hoofd terugbrengen.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Hos 1:11": "En de kinderen van Juda en de kinderen van Israël zullen bijeengebracht worden, en zich één hoofd stellen, en uit het land optrekken; want de dag van Jizreël zal groot zijn.", "Lev 25:18": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Jes 46:6": "Zij verkwisten het goud uit de beurs, en wegen het zilver met de weegschaal; zij huren een goudsmid, en die maakt het tot een god, zij knielen neer, ook buigen zij zich daarvoor.", "Ezech 22:6": "Zie, de vorsten van Israël zijn in u geweest, ieder naar zijn kracht, om bloed te vergieten.", "Jes 55:13": "Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, dat niet uitgeroeid zal worden.", "Jer 16:4": "Zij zullen pijnlijke doden sterven, zij zullen niet beklaagd en niet begraven worden, zij zullen tot mest op de aardbodem zijn, en zij zullen door het zwaard en door de honger verteerd worden, en hun dode lichamen zullen voedsel zijn voor de vogels van de hemel en voor de dieren van de aarde.", "Spr 29:23": "De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Ezech 34:7-10": "Daarom, u herders! Hoor het woord van de HEERE! Zo waarachtig als Ik leef, spreekt de Heere HEERE, zeker! Omdat Mijn schapen geworden zijn tot een roof, en Mijn schapen al het wilde gedierte van het veld tot voedsel geworden zijn, omdat er geen herder is, en Mijn herders naar Mijn schapen niet vragen; en de herders weiden zichzelf, maar Mijn schapen weiden zij niet; Daarom, u herders! Hoor het woord van de HEERE!", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Deut 27:19": "Vervloekt is hij die het recht van de vreemdeling, van de wees en van de weduwe buigt! En heel het volk zal zeggen: Amen.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Ex 29:46": "En zij zullen weten, dat Ik de HEERE hun God ben, Die hen uit het land Egypte uitgevoerd heb, opdat Ik in het midden van hen wonen zou; Ik ben de HEERE, hun God.", "Ezech 27:26": "Die u roeien, hebben u in groot water gevoerd; de oostenwind heeft u verbroken in het hart van de zeeën.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Ezech 16:56": "Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Ezech 39:10": "zodat zij geen hout van het veld zullen dragen, en ook niet in de wouden zullen hakken, maar van de wapens vuur zullen stoken; en zij zullen beroven wie hen beroofd hadden, en plunderen wie hen geplunderd hadden, spreekt de Heere HEERE.", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "2 Petr 2:4-6": "Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht; en de steden Sodom en Gomorra tot as heeft laten verbranden en met een omkering veroordeeld heeft, en tot een voorbeeld gesteld heeft voor hen die goddeloos zouden leven;", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Ps 62:11": "Vertrouw niet op onderdrukking, en word niet ijdel door roverij; als het vermogen overvloedig toeneemt, zet er het hart niet op.", "Ezech 26:21": "Maar u zal Ik tot een grote schrik stellen, en u zult er niet meer zijn; als u gezocht wordt, zo zult u niet meer gevonden worden in eeuwigheid, spreekt de Heere HEERE.", "Rom 15:28": "Als ik dan dit volbracht heb, en hun deze vrucht verzegeld zal hebben, zal ik door uw stad naar Spanje afreizen.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "Jer 31:4": "Ik zal u weer bouwen, en u zult gebouwd worden, o jonkvrouw Israël! U zult weer versierd zijn met uw tamboerijnen, en uitgaan met de rei van de spelende mensen.", "Micha 3:9-11": "Hoor nu dit, hoofden van het huis van Jakob, en leiders van het huis van Israël! die van het gericht een gruwel hebben, en alles wat recht is verdraaien; Zij bouwen Sion met bloed, en Jeruzalem met onrecht. Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Jer 21:13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "Jes 25:3": "Daarom zal een machtig volk U eren, de stad van de tirannische volken zal U vrezen.", "Ezech 27:22": "De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij op uw markten.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Jes 37:26": "Hebt u niet gehoord dat Ik dit lang tevoren gedaan heb, en dat Ik het van de oude dagen af gevormd heb? Nu heb Ik dat laten gebeuren, dat u de vaste steden zou verwoesten tot puinhopen.", "Spr 30:13": "Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;", "Zef 1:9": "Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Luk 6:24": "Maar wee u, rijken, want u hebt uw troost al gehad.", "Mark 12:39": "en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden;", "Jer 9:26": "Over Egypte, en over Juda, en over Edom, en over de kinderen van Ammon, en over Moab, en over allen die aan de hoeken kortgeknipt zijn, die in de woestijn wonen; want alle heidenen hebben de voorhuid, maar het hele huis van Israël heeft de voorhuid van het hart.", "Nahum 3:5": "Zie, Ik wil tegen u, spreekt de HEERE van de heerscharen, en Ik zal uw zomen ontdekken boven uw aangezicht, en Ik zal de heidenen uw naaktheid, en de koninkrijken uw schande wijzen.", "Job 18:14": "Zijn vertrouwen zal uit zijn tent uitgerukt worden; dat zal hem doen treden tot de koning der verschrikkingen.", "Micha 7:4": "De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.", "Ezech 36:23": "Want Ik zal Mijn grote Naam heiligen, die onder de heidenen ontheiligd is, die u in het midden van hen ontheiligd hebt; en de heidenen zullen weten dat Ik de HEERE ben, spreekt de Heere HEERE, als Ik aan u voor hun ogen zal geheiligd zijn.", "Job 40:4-7": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen? Versier u nu met voortreffelijkheid en hoogheid, en bekleed u met majesteit en heerlijkheid! Strooi de verbolgenheden van uw toorn uit, en zie ieder hoogmoedige, en verneder hem!", "Ezech 17:11": "Daarna kwam het woord van de HEERE tot mij en zei:", "Spr 17:26": "Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.", "Ezech 45:9": "Zo zegt de Heere HEERE: Het is genoeg voor u, vorsten van Israël! Doe geweld en verwoesting weg, en doe recht en gerechtigheid; neem uw uitstotingen weg van Mijn volk, spreekt de Heere HEERE.", "Amos 1:10": "Daarom zal Ik een vuur zenden in de muur van Tyrus, dat zal haar paleizen verteren.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Lev 25:19": "En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen.", "Job 28:16": "Zij kan niet geschat worden tegen fijn goud van Ofir, tegen de kostelijke Schoham, en de Saffier.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Ezech 21:30": "Keer uw zwaard terug in zijn schede! Op de plaats waar u geschapen bent, in het land van uw oorsprong, zal Ik u richten.", "Micha 2:2": "En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Ezra 8:25-28": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Ezech 12:8": "En 's morgens kwam het woord van de HEERE tot mij en Hij zei:", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Ezech 14:12": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Gen 4:16": "En Kaïn ging weg van het aangezicht van de HEERE; en hij woonde in het land Nod, ten oosten van Eden.", "Jes 21:17": "En het overgebleven aantal van de schutters, de helden van de Kedarenen, zal minder worden, want de HEERE, de God van Israël, heeft het gesproken.", "Ps 73:3": "Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.", "Gen 6:5": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was.", "Joël 2:3": "Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen.", "Matt 19:23": "En Jezus zei tegen Zijn discipelen: Voorwaar, Ik zeg u, dat een rijke moeilijk in het Koninkrijk der hemelen zal ingaan.", "Jes 51:3": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang.", "Hand 21:3": "En toen wij Cyprus in het gezicht kregen en dat aan de linkerhand lieten liggen, voeren wij naar Syrië en kwamen aan te Tyrus; want daar zou het schip zijn lading lossen.", "Jes 2:12": "Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt;", "Hos 12:9": "Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; in al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn.", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Gen 3:5": "Maar God weet dat, op de dag dat u daarvan eet, uw ogen geopend zullen worden, en u als God zult zijn, kennend het goed en het kwaad.", "Jer 27:3": "En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Hos 13:6": "Daarna zijn zij, naarmate hun weide was, verzadigd geworden; toen zij verzadigd waren geworden, heeft hun hart zich verheven; daarom hebben zij Mij vergeten.", "Ezech 44:9": "Zo zegt de Heere HEERE: Geen vreemde, onbesneden van hart en onbesneden van vlees, zal in Mijn heiligdom naar binnen gaan, van enige vreemde die te midden van de kinderen van Israël is.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Pred 4:13": "Beter is een arme en wijze jongeman, dan een oude en dwaze koning, die niet meer weet zich te laten vermanen.", "Dan 5:23-30": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt. Toen is dat deel van de hand van Hem gezonden, en is dit schrift getekend. Dit nu is het schrift dat daar getekend is: MENE, MENE, TEKEL, UPHARSIN.", "Ezech 27:2": "U dan, mensenkind! Hef een klaaglied op over Tyrus;", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "Ezech 30:6": "Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hoogmoed van zijn sterkte zal neerdalen; van de toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.", "Jer 6:10": "Tot wie zal ik spreken en betuigen, dat zij het horen? Ziet, hun oor is onbesneden, zodat zij niet kunnen toeluisteren; ziet, het woord van de HEERE is hun tot een smaad, zij hebben er geen lust in.", "Gen 2:11": "De naam van de eerste rivier is Pison; dat is het, dat het hele land van Havila omstroomt, waar het goud is.", "Job 40:6": "Strooi de verbolgenheden van uw toorn uit, en zie ieder hoogmoedige, en verneder hem!", "Ezech 28:12-14": "Mensenkind! Hef een klaaglied aan over de koning van Tyrus, en zeg tegen hem: Zo zegt de Heere HEERE: U, verzegelaar van de som, vol van wijsheid en volmaakt in schoonheid! U was in Eden, de hof van God; alle kostelijke stenen waren uw bedekking: sardisstenen, topazen en diamanten, turkooizen, sardonyxstenen en jaspisstenen, saffieren, robijnen en smaragden, en goud; het werk van uw trommels en uw pijpen was bij u; op de dag dat u geschapen werd, waren zij gereed. U was een gezalfde, beschermende cherub; en Ik had u zo gezet; u was op de heilige berg van God; u wandelde in het midden van de vurige stenen.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Luk 12:15-21": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen. En Hij vertelde hun een gelijkenis: Het land van een rijke man had veel opgebracht; en hij overlegde bij zichzelf en zei: Wat zal ik doen, want ik heb geen plaats waar ik mijn vruchten kan verzamelen.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "1 Tim 6:9": "Maar zij die rijk willen worden, vallen in verzoeking en in een valstrik, en in veel dwaze en schadelijke begeerten, die de mensen doen wegzinken in verderf en ondergang.", "Ezech 6:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Mark 10:43": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Gen 1:26": "En God zei: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en laten zij heersen over de vissen van de zee, en over het gevogelte van de hemel, en over het vee, en over de hele aarde, en over al de kruipende dieren die op de aarde kruipen.", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "Jer 27:11": "Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Ezech 29:10": "Daarom, zie, Ik zál u en uw rivieren; en Ik zal Egypteland stellen tot woeste, verlaten eenzaamheden, van de toren van Syene af tot aan de grens van Morenland.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt."}, "noten": {"3": "SV: toegeslo pan class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up,</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am a <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> I <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> in the <span class=\"wl wl-kjv\" data-code=\"H4186\">seat</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas;</span> yet thou art a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and not <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> though thou <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> as the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of God:", "3": "Behold, thou art <span class=\"wl wl-kjv\" data-code=\"H2450\">wiser</span> than <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel;</span> there is no <span class=\"wl wl-kjv\" data-code=\"H5640\">secret</span> that they can hide", "4": "With thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and with thine <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> thee <span class=\"wl wl-kjv\" data-code=\"H2428\">riches,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> into thy treasures:", "5": "By thy <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and by thy <span class=\"wl wl-kjv\" data-code=\"H7404\">traffick</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> thy <span class=\"wl wl-kjv\" data-code=\"H2428\">riches,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> is lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up</span> because of thy riches:", "6": "Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> as the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of God;", "7": "Behold, therefore I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> upon thee, the <span class=\"wl wl-kjv\" data-code=\"H6184\">terrible</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7324\">draw</span> their <span class=\"wl wl-kjv\" data-code=\"H2719\">swords</span> against the <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2490\">defile</span> thy brightness.", "8": "They shall bring thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7845\">pit,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> the <span class=\"wl wl-kjv\" data-code=\"H4463\">deaths</span> of them that are <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> in the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of the seas.", "9": "Wilt thou <span class=\"wl wl-kjv\" d /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}

    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
