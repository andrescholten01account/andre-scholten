johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Verder gebeurde het woord van de HEERE tot mij:", "2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "3": "Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten* voor u verborgen.", "4": "Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "5": "Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.", "6": "Daarom zegt de Heere HEERE zo: Omdat u uw hart gesteld hebt als het hart van God,", "7": "Daarom zie, Ik zal vreemden over u brengen, de meest tirannieke van de heidenvolken; die zullen hun zwaarden trekken tegen de schoonheid van uw wijsheid, en zullen uw glans ontheiligen.", "8": "Naar de groeve zullen zij u doen neerdalen; en u zult sterven de dood van een verslagene, in het hart van de zeeën.", "9": "Zult u dan nog, voor het aangezicht van hem die u doodslaat, zeggen: Ik ben God? terwijl u een mens bent en geen God, in de hand van hem die u verslaat?", "10": "U zult de dood van de onbesnedenen sterven, door de hand van vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.", "11": "Verder gebeurde het woord van de HEERE tot mij:", "12": "Mensenkind! Hef een klaaglied aan over de koning van Tyrus, en zeg tegen hem: Zo zegt de Heere HEERE: U, verzegelaar van de som, vol van wijsheid en volmaakt in schoonheid!", "13": "U was in Eden, de hof van God; alle kostelijke stenen waren uw bedekking: sardisstenen, topazen en diamanten, turkooizen, sardonyxstenen en jaspisstenen, saffieren, robijnen en smaragden, en goud; het werk van uw trommels en uw pijpen was bij u; op de dag dat u geschapen werd, waren zij gereed.", "14": "U was een gezalfde, beschermende cherub; en Ik had u zo gezet; u was op de heilige berg van God; u wandelde in het midden van de vurige stenen.", "15": "U was volkomen in uw wegen, vanaf de dag dat u geschapen bent, totdat er ongerechtigheid in u gevonden is.", "16": "Door de veelheid van uw koophandel hebben zij het midden van u met geweld vervuld, en u hebt gezondigd; daarom zal Ik u ontheiligen van de berg van God, en zal Ik u, beschermende cherub, wegvagen uit het midden van de vurige stenen!", "17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "18": "Vanwege de veelheid van uw ongerechtigheden, door het onrecht van uw koophandel, hebt u uw heiligdommen ontheiligd; daarom heb Ik een vuur uit uw midden doen voortkomen, dat u heeft verteerd, en Ik heb u tot as gemaakt op de aarde, voor de ogen van allen die u zien.", "19": "Allen die u kennen onder de volken, zijn ontzet over u; u bent een grote schrik geworden, en zult er niet meer zijn, tot in eeuwigheid.", "20": "Verder gebeurde het woord van de HEERE tot mij:", "21": "Mensenkind! Zet uw aangezicht tegen Sidon, en profeteer tegen haar,", "22": "En zeg: Zo zegt de Heere HEERE: Zie, Ik zál tegen u zijn, o Sidon! en Ik zal in uw midden verheerlijkt worden; en zij zullen weten dat Ik de HEERE ben, wanneer Ik gerichten in haar zal hebben geoefend, en in haar geheiligd zal zijn.", "23": "Want Ik zal de pest in haar zenden, en bloed op haar straten, en de verslagenen zullen vallen in haar midden, door het zwaard dat van rondom tegen haar zal zijn; en zij zullen weten dat Ik de HEERE ben.", "24": "En het huis van Israël zal geen pijnlijke doorn meer hebben, en geen pijn veroorzakende distel, van allen die rondom hen zijn, die hen beroven; en zij zullen weten dat Ik de Heere HEERE ben.", "25": "Zo zegt de Heere HEERE: Wanneer Ik het huis van Israël verzameld zal hebben uit de volken onder wie zij verstrooid zijn, en Ik onder hen voor de ogen van de heidenvolken geheiligd zal zijn, dan zullen zij in hun land wonen, dat Ik aan Mijn knecht, aan Jakob, gegeven heb.", "26": "En zij zullen daarin zeker wonen, en huizen bouwen, en wijngaarden planten; ja, zij zullen zeker wonen; wanneer Ik gerichten zal hebben geoefend tegen allen die hen beroofd hebben, van degenen die rondom hen zijn; en zij zullen weten dat Ik, de HEERE, hun God ben."}, "SV": {"1": "Voorts geschiedde des HEEREN woord tot mij, zeggende:", "2": "Mensenkind! zeg tot den vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en zegt: Ik ben God, ik zit in Godes stoel, in het hart der zeeën! daar gij een mens en geen God zijt, stelt gij nochtans uw hart, als Gods hart.", "3": "Zie, gij zijt wijzer dan Daniël; zij hebben niets toegeslotens voor u verborgen.", "4": "Door uw wijsheid en door uw verstand, hebt gij vermogen voor u verkregen; ja, gij hebt goud en zilver verkregen in uw schatten.", "5": "Door de grootheid uwer wijsheid in uw koophandel hebt gij uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.", "6": "Daarom zegt de Heere HEERE alzo: Omdat gij uw hart gesteld hebt als Gods hart;", "7": "Daarom zie, Ik zal vreemden over u brengen, de tirannigste der heidenen; die zullen hun zwaarden uittrekken over de schoonheid uwer wijsheid, en zullen uw glans ontheiligen.", "8": "Ter groeve zullen zij u doen nederdalen; en gij zult sterven den dood eens verslagenen in het hart der zeeën.", "9": "Zult gij *dan* enigszins, voor het aangezicht uws doodslagers, zeggen: Ik ben God? daar gij een mens zijt en geen God, in de hand desgenen, die u verslaat?", "10": "Gij zult den dood der onbesnedenen sterven; door de hand der vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.", "11": "Wijders geschiedde des HEEREN woord tot mij, zeggende:", "12": "Mensenkind! hef een klaaglied op over den koning van Tyrus, en zeg tot hem: Zo zegt de Heere HEERE: Gij verzegelaar der som, vol van wijsheid en volmaakt in schoonheid!", "13": "Gij waart in Eden, Gods hof; alle kostelijk gesteente was uw deksel, sardisstenen, topazen en diamanten, turkooizen, sardonixstenen en jaspisstenen, saffieren, robijnen, en smaragden, en goud; het werk uwer trommelen en uwer pijpen was bij u; ten dage als gij geschapen werdt, waren zij bereid.", "14": "Gij waart een gezalfde, overdekkende cherub; en Ik had u *alzo* gezet; gij waart op Gods heiligen berg; gij wandeldet in het midden der vurige stenen.", "15": "Gij waart volkomen in uw wegen, van den dag af, dat gij geschapen zijt, totdat er ongerechtigheid in u gevonden is.", "16": "Door de veelheid uws koophandels hebben zij het midden van u met geweld vervuld, en gij hebt gezondigd; daarom zal Ik u ontheiligen van Gods berg, en zal u, gij overdekkende cherub! verdoen uit het midden der vurige stenen!", "17": "Uw hart verheft zich over uw schoonheid; gij hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde henengeworpen, Ik heb u voor het aangezicht der koningen gesteld, om op u te zien.", "18": "Vanwege de veelheid uwer ongerechtigheden, door het onrecht uws koophandels, hebt gij uw heiligdommen ontheiligd; daarom heb Ik een vuur uit het midden van u doen voortkomen, dat u heeft verteerd, en Ik heb u gemaakt tot as op de aarde, voor de ogen van al degenen, die u zien.", "19": "Allen, die u kennen onder de volken, zijn over u ontzet; gij zijt een grote schrik geworden, en zult er niet *meer* zijn tot in eeuwigheid.", "20": "Wijders geschiedde des HEEREN woord tot mij, zeggende:", "21": "Mensenkind! zet uw aangezicht tegen Sidon, en profeteer tegen haar,", "22": "En zeg: Zo zegt de Heere HEERE: Zie, Ik *wil* aan u, o Sidon! en zal in het midden van u verheerlijkt worden; en zij zullen weten, dat Ik de HEERE ben, als Ik gerichten in haar zal hebben geoefend, en in haar geheiligd zal zijn.", "23": "Want Ik zal de pestilentie in haar zenden, en bloed op haar straten, en de verslagenen zullen vallen in het midden van haar, door het zwaard, *dat* tegen haar zal zijn van rondom; en zij zullen weten, dat Ik de HEERE ben.", "24": "En het huis Israëls zal geen smartenden doorn noch wee doende distel meer hebben, van allen, die rondom hen zijn, die henlieden beroven; en zij zullen weten, dat Ik de Heere HEERE ben.", "25": "Alzo zegt de Heere HEERE: Als Ik het huis Israëls zal vergaderd hebben uit de volken, onder dewelke zij verstrooid zijn, en Ik onder hen voor de ogen der heidenen zal geheiligd zijn, dan zullen zij in hun land wonen, dat Ik aan Mijn knecht, aan Jakob gegeven heb.", "26": "En zij zullen daarin zeker wonen, en huizen bouwen, en wijngaarden planten; ja, zij zullen zeker wonen; als Ik gerichten zal hebben geoefend tegen allen, die henlieden beroofd hebben, van degenen, die rondom hen zijn; en zij zullen weten dat Ik, de HEERE, hunlieder God ben."}, "KJV": {"1": "The word of the LORD came again unto me, saying,", "2": "Son of man, say unto the prince of Tyrus, Thus saith the Lord GOD; Because thine heart *is* lifted up, and thou hast said, I *am* a God, I sit *in* the seat of God, in the midst of the seas; yet thou *art* a man, and not God, though thou set thine heart as the heart of God:", "3": "Behold, thou *art* wiser than Daniel; there is no secret that they can hide", "4": "With thy wisdom and with thine understanding thou hast gotten thee riches, and hast gotten gold and silver into thy treasures:", "5": "By thy great wisdom *and* by thy traffick hast thou increased thy riches, and thine heart is lifted up because of thy riches:", "6": "Therefore thus saith the Lord GOD; Because thou hast set thine heart as the heart of God;", "7": "Behold, therefore I will bring strangers upon thee, the terrible of the nations: and they shall draw their swords against the beauty of thy wisdom, and they shall defile thy brightness.", "8": "They shall bring thee down to the pit, and thou shalt die the deaths of *them that are* slain in the midst of the seas.", "9": "Wilt thou yet say before him that slayeth thee, I *am* God? but thou *shalt be* a man, and no God, in the hand of him that slayeth", "10": "Thou shalt die the deaths of the uncircumcised by the hand of strangers: for I have spoken *it*, saith the Lord GOD.", "11": "Moreover the word of the LORD came unto me, saying,", "12": "Son of man, take up a lamentation upon the king of Tyrus, and say unto him, Thus saith the Lord GOD; Thou sealest up the sum, full of wisdom, and perfect in beauty.", "13": "Thou hast been in Eden the garden of God; every precious stone *was* thy covering, the sardius, topaz, and the diamond, the beryl, the onyx, and the jasper, the sapphire, the emerald, and the carbuncle, and gold: the workmanship of thy tabrets and of thy pipes was prepared in thee in the day that thou wast created.", "14": "Thou *art* the anointed cherub that covereth; and I have set thee *so*: thou wast upon the holy mountain of God; thou hast walked up and down in the midst of the stones of fire.", "15": "Thou *wast* perfect in thy ways from the day that thou wast created, till iniquity was found", "16": "By the multitude of thy merchandise they have filled the midst of thee with violence, and thou hast sinned: therefore I will cast thee as profane out of the mountain of God: and I will destroy thee, O covering cherub, from the midst of the stones of fire.", "17": "Thine heart was lifted up because of thy beauty, thou hast corrupted thy wisdom by reason of thy brightness: I will cast thee to the ground, I will lay thee before kings, that they may behold", "18": "Thou hast defiled thy sanctuaries by the multitude of thine iniquities, by the iniquity of thy traffick; therefore will I bring forth a fire from the midst of thee, it shall devour thee, and I will bring thee to ashes upon the earth in the sight of all them that behold", "19": "All they that know thee among the people shall be astonished at thee: thou shalt be a terror, and never *shalt* thou *be* any more.", "20": "Again the word of the LORD came unto me, saying,", "21": "Son of man, set thy face against Zidon, and prophesy", "22": "And say, Thus saith the Lord GOD; Behold, I *am* against thee, O Zidon; and I will be glorified in the midst of thee: and they shall know that I *am* the LORD, when I shall have executed judgments in her, and shall be sanctified", "23": "For I will send into her pestilence, and blood into her streets; and the wounded shall be judged in the midst of her by the sword upon her on every side; and they shall know that I *am* the LORD.", "24": "And there shall be no more a pricking brier unto the house of Israel, nor *any* grieving thorn of all *that are* round about them, that despised them; and they shall know that I *am* the Lord GOD.", "25": "Thus saith the Lord GOD; When I shall have gathered the house of Israel from the people among whom they are scattered, and shall be sanctified in them in the sight of the heathen, then shall they dwell in their land that I have given to my servant Jacob.", "26": "And they shall dwell safely therein, and shall build houses, and plant vineyards; yea, they shall dwell with confidence, when I have executed judgments upon all those that despise them round about them; and they shall know that I *am* the LORD their God."}}, "tsk": {"2": [{"kopje": "Omdat", "refs": ["Ezech 28:5", "Ezech 28:17", "Ezech 31:10", "Deut 8:14", "2 Kron 26:16", "Spr 16:18", "Spr 18:12", "Jes 2:12", "Dan 5:22", "Dan 5:23", "Hab 2:4", "1 Tim 3:6", "1 Pe deren": []}]}]}, {"topic": "Houses", "href": "../../torrey/h/#t-houses", "kinderen": [{"label": "Illustrative", "href": "../../torrey/h/?hl=Ezek.28.26#i9426", "refs": [], "kinderen": [{"label": "(Building of,) of great prosperity", "href": "../../torrey/h/?hl=Ezek.28.26#i9434", "refs": [{"disp": "Jes 65:21", "href": "../../jesaja/65/#v21", "ref": "Jes 65:21", "svLabel": null}, {"disp": "Ezech 28:26", "href": "../../ezechiel/28/#v26", "ref": "Ezech 28:26", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"1 Kor 3:18": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.", "1 Sam 8:10-18": "Samuël nu zei al de woorden van de HEERE aan het volk, dat een koning van hem begeerde. En hij zei: Dit zal de wijze van de koning zijn, die over u regeren zal: hij zal uw zonen nemen, en hen voor zichzelf aanstellen, voor zijn wagen en tot zijn ruiters, zodat zij voor zijn wagen uit zullen lopen; en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "Neh 9:34-37": "En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, waarmee U tegen hen getuigde. Want zij hebben U niet gediend in hun koninkrijk, en in Uw overvloedige goed, dat U hun gaf, en in dat wijde en dat vette land, dat U voor hun aangezicht gegeven had; en zij hebben zich niet bekeerd van hun slechte werken. Zie, wij zijn heden knechten; ja, het land, dat U onze vaderen gegeven hebt, om de vrucht daarvan, en het goede daarvan te eten, zie, daarin zijn wij knechten.", "Ps 37:36": "Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Zef 2:9": "Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten.", "Gen 49:13": "Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.", "Jak 3:13-18": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid. Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels.", "Ps 94:20": "Zou de troon van het onrecht zich met U verbinden, die moeite verzint bij wet?", "Jer 8:9": "De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Ezech 35:1-15": "Verder kwam het woord van de HEERE tot mij en Hij zei: Mensenkind! Richt uw gezicht tegen het gebergte Seir, en profeteer ertegen, En zeg ertegen: Zo zegt de Heere HEERE: Zie, Ik heb het tegen u, o gebergte Seir! En Ik zal Mijn hand tegen u uitstrekken, en zal u maken tot een verwoesting en een verlatenheid.", "Ezech 36:22": "Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.", "Ezech 28:12-19": "Mensenkind! Hef een klaaglied aan over de koning van Tyrus, en zeg tegen hem: Zo zegt de Heere HEERE: U, verzegelaar van de som, vol van wijsheid en volmaakt in schoonheid! U was in Eden, de hof van God; alle kostelijke stenen waren uw bedekking: sardisstenen, topazen en diamanten, turkooizen, sardonyxstenen en jaspisstenen, saffieren, robijnen en smaragden, en goud; het werk van uw trommels en uw pijpen was bij u; op de dag dat u geschapen werd, waren zij gereed. U was een gezalfde, beschermende cherub; en Ik had u zo gezet; u was op de heilige berg van God; u wandelde in het midden van de vurige stenen.", "Jes 3:15": "Wat bezielt u, dat u Mijn volk verbrijzelt, en de aangezichten van de ellendigen vermaalt? spreekt de Heere, HEERE van de heerscharen.", "Jes 14:12-15": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Jer 25:12": "Maar het zal gebeuren, als de zeventig jaren vervuld zijn, dan zal Ik over de koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken, alsook over het land van de Chaldeeën, en zal dat stellen tot eeuwige verwoestingen.", "Ezech 32:30": "Daar zijn de geweldigen van het noorden, zij allen, en alle Sidoniërs, die met de verslagenen zijn neergedaald, beschaamd vanwege hun schrik die uit hun macht voortkwam, en zij liggen onbesneden bij de verslagenen van het zwaard, en dragen hun schande met hen die in het kuil zijn neergedaald.", "Jes 27:12": "En het zal op die dag gebeuren, dat de HEERE zal dorsen, van de stroom van de rivier af tot aan de rivier van Egypte; maar u zult opgeraapt worden, één voor één, o kinderen van Israël!", "Ex 28:17-20": "En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij. En de tweede rij van een Smaragd, een Saffier, en een Diamant. En de derde rij, een Hyacint, Agaat en Amethist.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Hab 2:5-13": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Gen 3:24": "En Hij verdreef de mens; en Hij plaatste cherubs ten oosten van de hof van Eden, en een vlammend zwaard, dat heen en weer keerde, om de weg naar de boom van het leven te bewaken.", "Deut 8:14": "Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Ezech 31:1": "Het gebeurde ook in het elfde jaar, in de derde maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam:", "Dan 5:22": "En u, Belsazar, zijn zoon! U hebt uw hart niet vernederd, hoewel u dit alles goed geweten hebt.", "Jer 29:5": "Bouwt huizen en woont daarin, en plant tuinen en eet de vrucht daarvan;", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Klaagl 1:8": "Cheth. Jeruzalem heeft zwaar gezondigd, daarom is zij als een afgezonderde vrouw geworden; allen, die haar eerden, achten haar onwaard, omdat zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Ezech 28:2-6": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God. Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen. Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Job 20:11": "Zijn beenderen zullen vol zijn van zijn zonden uit zijn jeugd; die zullen met hem in het stof neerliggen.", "Ps 88:6": "Afgezonderd onder de doden, zoals de verslagenen die in het graf liggen, die U niet meer gedenkt, en zij zijn afgesneden van Uw hand.", "Ezech 39:1-3": "Verder, mensenkind! Profeteer tegen Gog en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Gog, hoofdvorst van Mesech en Tubal! En Ik zal u omkeren, en een zesde deel van u overlaten, en Ik zal u optrekken uit de zijden van het noorden, en Ik zal u brengen op de bergen van Israël. Maar Ik zal uw boog uit uw linkerhand slaan, en Ik zal uw pijlen uit uw rechterhand doen vallen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Joh 2:16": "En Hij zei tegen hen die de duiven verkochten: Neem deze dingen hier weg; maak het huis van Mijn Vader niet tot een huis van koophandel.", "Ezech 28:15-17": "U was volkomen in uw wegen, vanaf de dag dat u geschapen bent, totdat er ongerechtigheid in u gevonden is. Door de veelheid van uw koophandel hebben zij het midden van u met geweld vervuld, en u hebt gezondigd; daarom zal Ik u ontheiligen van de berg van God, en zal Ik u, beschermende cherub, wegvagen uit het midden van de vurige stenen! Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Ezech 36:28": "En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Ps 49:11": "Want hij ziet dat de wijzen sterven, dat samen een dwaas en een onverstandig mens omkomen, en hun bezit aan anderen nalaten.", "Gen 6:6": "Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart.", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Jes 60:9": "Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Jes 38:17": "Zie, in vrede is mij de bitterheid bitter geweest; maar Gij hebt mijn ziel liefdevol omhelsd, zodat zij niet in de groeve van de vertering kwam; want Gij hebt al mijn zonden achter Uw rug geworpen.", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Deut 28:50": "Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge.", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "Job 17:16": "Zij zullen mee naar beneden gaan met de grendels van het graf, als er rust samen in het stof zal zijn.", "Ezech 31:8": "De ceders in Gods hof konden hem niet overtreffen, de dennenbomen waren zijn takken niet gelijk, en de kastanjebomen waren niet gelijk aan zijn scheuten; geen boom in Gods hof was hem gelijk in zijn schoonheid.", "Gen 2:8": "Ook had de HEERE God een hof geplant in Eden, tegen het oosten, en Hij zette daar de mens, die Hij gevormd had.", "Ezech 29:3": "Spreek en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Farao, koning van Egypte! die grote zeedraak, die in het midden van zijn rivieren ligt; die zegt: Mijn rivier is van mij, en ik heb die voor mijzelf gemaakt.", "Ezech 39:13": "Ja, heel het volk van het land zal begraven, en het zal hun tot een naam zijn, op de dag dat Ik verheerlijkt zal zijn, spreekt de Heere HEERE.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Ezech 19:14": "Daarbij is een vuur uitgegaan uit een tak van zijn ranken, dat zijn vrucht verteerd heeft; zodat er aan hem geen sterke tak meer is tot een scepter, om te heersen. Dit is een weeklage, en is tot een weeklage geworden.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Matt 10:9": "Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "Jes 14:14": "Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "Dan 2:22": "Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.", "Jes 14:15": "Ja, in het rijk van de dood zult u neergestoten worden, aan de zijden van de kuil!", "Jes 14:4-20": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Ps 21:13": "Want U zult hen zetten tot een doelwit; met Uw pezen zult U het op hun aangezicht toeleggen.", "Ezech 24:15": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Job 27:8": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken?", "Jer 27:3-11": "En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda. En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen: Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Job 18:3": "Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen?", "Ps 94:21": "Zij rotten samen tegen de ziel van de rechtvaardige, en zij veroordelen onschuldig bloed.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Jes 65:21": "En zij zullen huizen bouwen en bewonen, en zij zullen wijngaarden planten, en daarvan de vrucht eten.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Jer 16:3": "Want zo zegt de HEERE van de zonen en van de dochters, die in deze plaats geboren worden; en van hun moeders, die hen baren, en van hun vaders, die hen verwekken in dit land:", "Openb 18:16": "En zeggen: Wee, wee, de grote stad, die bekleed was met fijn linnen, en purper, en scharlaken, en versierd met goud, en met kostbaar gesteente, en met parels; want in één uur is zo'n grote rijkdom verwoest.", "Ezech 29:2": "Mensenkind! Richt uw gezicht tegen Farao, de koning van Egypte, en profeteer tegen hem, en tegen heel Egypte.", "Jes 14:12": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte!", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ps 49:17": "Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt;", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "Hab 2:8": "Omdat u veel heidenvolken beroofd hebt, zo zullen alle overgebleven volken u beroven; vanwege het bloed van de mensen, en het geweld aan het land, de stad, en alle inwoners daarvan.", "Spr 11:7": "Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Spr 30:9": "Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Hab 2:17": "Want het geweld dat tegen Libanon begaan is, zal u bedekken, en de verwoesting van de dieren zal u verschrikken, vanwege het bloed van de mensen, en het geweld in het land, de stad, en aan alle inwoners daarvan.", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Jes 10:13": "Omdat hij gezegd heeft: Door de kracht van mijn hand heb ik het gedaan, en door mijn wijsheid, want ik ben verstandig; en ik heb de landpalen van de volken weggenomen, en heb hun voorraad geroofd, en heb als een geweldige de inwoners doen neerdalen;", "Joël 3:6": "En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "Dan 4:29-31": "Want aan het einde van twaalf maanden, toen hij op het koninklijk paleis van Babel wandelde, Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid! Dit woord was nog in de mond van de koning, toen er een stem uit de hemel viel: U, koning Nebukadnezar, wordt gezegd: Het koninkrijk is van u weggegaan.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Ezech 19:1": "Verder, hef u een weeklage op over de vorsten van Israël,", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Amos 3:10": "Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting.", "Ps 82:2": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela.", "Job 35:9": "Vanwege de grootheid van hun onderdrukking doen zij de onderdrukten roepen; zij schreeuwen vanwege de arm van de groten.", "Lev 18:24-28": "Verontreinig u niet met enige van deze dingen; want de heidenen, die Ik van voor uw ogen uitwerp, zijn met dit alles verontreinigd; Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt. Maar u zult Mijn inzettingen en Mijn rechten onderhouden, en van al die gruwelen niets doen, inboorling noch vreemdeling, die te midden van u als vreemdeling verkeert.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Ezech 30:1": "Verder gebeurde het woord van de HEERE tot mij: het zei:", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Spr 30:21": "Om drie dingen beeft de aarde, ja, om vier, die zij niet kan dragen:", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "Deut 6:12": "Zo let erop, dat u de HEERE niet vergeet, Die u uit Egypteland, uit het diensthuis heeft uitgeleid.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Deut 30:3": "En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Spr 28:28": "Als de goddelozen opkomen, verbergt de mens zich; maar als zij omkomen, worden de rechtvaardigen talrijker.", "Jak 2:9": "maar als u de persoon aanneemt, doet u zonde, en wordt u door de wet als overtreders bestraft.", "Ezech 33:1": "En het woord van de HEERE kwam tot mij:", "Hand 6:3": "Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "Ezech 32:12": "Ik zal uw menigte vellen door de zwaarden van de helden, die allemaal samen de meest tirannieke van de heidenvolken zijn; die zullen de hoogmoed van Egypte verstoren, en haar hele menigte zal verdelgd worden.", "Ezech 28:14-16": "U was een gezalfde, beschermende cherub; en Ik had u zo gezet; u was op de heilige berg van God; u wandelde in het midden van de vurige stenen. U was volkomen in uw wegen, vanaf de dag dat u geschapen bent, totdat er ongerechtigheid in u gevonden is. Door de veelheid van uw koophandel hebben zij het midden van u met geweld vervuld, en u hebt gezondigd; daarom zal Ik u ontheiligen van de berg van God, en zal Ik u, beschermende cherub, wegvagen uit het midden van de vurige stenen!", "2 Kron 28:19": "Want de HEERE vernederde Juda, om Achaz, de koning van Israël; want hij had Juda losgelaten van de HEERE, zodat het geheel zwaar overtrad tegen de HEERE.", "Spr 6:25": "Begeer haar schoonheid niet in uw hart, en laat u door haar niet vangen met haar oogleden.", "Ezech 38:22": "En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn.", "Jer 30:16": "Daarom, allen die u opeten, zullen opgegeten worden, en al uw tegenstanders, zij allen zullen in gevangenschap gaan; en die u beroven, zullen tot beroving zijn, en allen die u plunderen, zal Ik tot plundering overgeven.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Spr 28:15": "De goddeloze, heersend over een arm volk, is een brullende leeuw, en een beer, die heen en weer rondloopt.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Jes 3:8": "Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.", "Ps 58:2": "Spreekt u werkelijk gerechtigheid, gij vergadering? Oordeelt u wat recht is, mensenkinderen?", "Ezech 27:36": "De handelaars onder de volken fluiten u uit; u bent een grote schrik geworden, en zult er niet meer zijn tot in eeuwigheid.", "1 Kon 10:11": "Verder brachten ook de schepen van Hiram, die goud uit Ofir haalden, uit Ofir zeer veel almuggimhout en kostbaar gesteente.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "Ezech 26:6": "En haar dochters, die in het veld zijn, zullen met het zwaard gedood worden; en zij zullen weten dat Ik de HEERE ben.", "Jer 46:1": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "Gen 2:8-17": "Ook had de HEERE God een hof geplant in Eden, tegen het oosten, en Hij zette daar de mens, die Hij gevormd had. En de HEERE God had alle bomen uit de aardbodem laten opkomen, begeerlijk voor het gezicht, en goed tot voedsel; en de boom van het leven in het midden van de hof, en de boom van de kennis van goed en kwaad. En een rivier stroomde voort uit Eden, om deze hof te bewateren; en werd vandaar verdeeld, en werd tot vier hoofden.", "Spr 17:15": "Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Ezech 34:2-4": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Spr 30:22": "Om een knecht, als hij regeert; en een dwaas, als hij verzadigd is met brood;", "Jer 9:25": "Zie, de dagen komen, spreekt de HEERE, dat Ik straf zal doen over alle besnedenen, samen met degenen die de voorhuid hebben;", "Lev 26:45": "Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!", "Kol 1:9": "Daarom houden ook wij, vanaf de dag dat wij het gehoord hebben, niet op voor u te bidden en te vragen dat u vervuld mag worden met de kennis van Zijn wil, in alle wijsheid en geestelijk verstand;", "Jes 30:33": "Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Jer 31:5": "U zult weer wijngaarden planten op de bergen van Samaria; de planters zullen planten, en de vrucht genieten.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Rom 7:9": "En zonder de wet leefde ik eertijds; maar toen het gebod kwam, werd de zonde weer levend, en ik stierf.", "Jer 5:27-29": "Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden. Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet. Zou Ik hierom geen straf brengen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk als dit is?", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Gen 1:31": "En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag.", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Jes 65:22": "Zij zullen niet bouwen, zodat een ander het bewoont; zij zullen niet planten, zodat een ander het eet, want de dagen van Mijn volk zullen zijn als de dagen van een boom, en Mijn uitverkorenen zullen het werk van hun handen verslijten.", "Luk 19:45": "En toen Hij de tempel binnengegaan was, begon Hij hen die daar verkochten en kochten eruit te drijven,", "Jak 1:9-11": "Maar de broeder die nederig is, moet roemen in zijn hoogheid. En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan. Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "Spr 18:23": "De arme spreekt smekingen; maar de rijke antwoordt harde dingen.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Job 31:25": "Als ik blijde ben geweest, omdat mijn vermogen groot was, en omdat mijn hand geweldig veel verkregen had;", "Gen 28:14": "En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Jes 40:23": "Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid.", "Job 27:13-23": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "1 Sam 2:3-5": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan. De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord. Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "Ezech 11:9": "Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "Ezech 17:1": "En het woord van de HEERE kwam tot mij en zei:", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Jer 51:63": "En het zal gebeuren, als u deze rol geheel gelezen hebt, dat u er een steen aan zult binden, en hem zult werpen in het midden van de Eufraat;", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Gen 3:23": "Zo stuurde de HEERE God hem weg uit de hof van Eden, om de aardbodem te bewerken, waaruit hij genomen was.", "Ps 75:6-8": "Verhoog uw hoorn niet omhoog; spreek niet met stijve hals. Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn; Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Zach 9:3": "En Tyrus heeft zich sterkten gebouwd, en zilver verzameld als stof, en fijn goud als slijk van de straten;", "2 Kron 32:23-25": "En velen brachten geschenken naar Jeruzalem voor de HEERE, en kostbaarheden voor Jehizkia, de koning van Juda, zodat hij daarna in de ogen van alle heidenvolken hoog aangeschreven stond. In die dagen werd Jehizkia ziek, tot aan het sterven toe, en hij bad tot de HEERE, Die tot hem sprak en hem een wonderteken gaf. Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn.", "Gen 13:10": "En Lot hief zijn ogen op, en zag de hele vlakte van de Jordaan, dat die overal goed bevochtigd was; voordat de HEERE Sodom en Gomorra verwoest had, was zij als de hof van de HEERE, als het land Egypte, tot waar men bij Zoar komt.", "Gen 24:35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Ps 49:20": "zo zal zij toch komen tot het geslacht van haar vaderen; tot in eeuwigheid zullen zij het licht niet zien.", "Ezech 36:36-38": "Dan zullen de heidenen die in de plaatsen rondom u overgelaten zijn, weten dat Ik, de HEERE, de verstoorde plaatsen bebouw, en het verwoeste beplant. Ik, de HEERE, heb het gesproken en zal het doen. Zo zegt de Heere HEERE: Daarenboven zal Ik hierom door het huis van Israël vertrouwd worden, dat Ik het hun doe; Ik zal ze vermenigvuldigen met mensen, als schapen. Zoals de geheiligde schapen, zoals de schapen van Jeruzalem op hun vastgestelde feesttijden, zo zullen de eenzame steden vol zijn van mensenkudden; en zij zullen weten dat Ik de HEERE ben.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "Ezech 27:32-36": "En zij zullen in hun gekerm een klaaglied over u opheffen, en over u weeklagen, en zeggen: Wie is geweest als Tyrus, als de uitgeroeide in het midden van de zee? Toen uw marktwaren uit de zeeën voortkwamen, hebt u veel volken verzadigd; met de veelheid van uw goederen en uw onderlinge koophandel, hebt u de koningen van de aarde rijk gemaakt. Ten tijde dat u uit de zeeën verbroken bent in de diepte van de wateren, zijn uw onderlinge koophandel en heel uw gemeente in het midden van u gevallen.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Ex 28:18": "En de tweede rij van een Smaragd, een Saffier, en een Diamant.", "1 Sam 25:38": "En het gebeurde ongeveer tien dagen later, dat de HEERE Nabal sloeg, zodat hij stierf.", "Ezech 16:41": "Zij zullen ook uw huizen met vuur verbranden, en oordelen tegen u uitvoeren voor de ogen van veel vrouwen; en Ik zal u doen ophouden een hoer te zijn, en u zult ook geen hoerenloon meer geven.", "Jer 25:9": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.", "Jes 19:11-13": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen? Waar zijn nu uw wijzen? Laat zij u nu te kennen geven of vernemen, wat de HEERE van de heerscharen beraadslaagd heeft tegen Egypte. De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, tot de uiterste hoek van zijn stammen.", "Ezech 21:3": "En zeg tegen het land van Israël: Zo zegt de HEERE: Zie, Ik zál tegen u, en Ik zal Mijn zwaard uit zijn schede trekken; en Ik zal van u uitroeien de rechtvaardige en de goddeloze.", "Job 18:18": "Men zal hem stoten van het licht in de duisternis, en men zal hem uit de wereld verjagen.", "Ezech 27:4": "Uw grenzen zijn in het hart van de zeeën; uw bouwers hebben uw schoonheid volkomen gemaakt.", "Gen 2:12": "En het goud van dit land is goed; daar is ook bedolah, en de steen sardonix.", "Ezech 27:8": "De inwoners van Sidon en Arvad waren uw roeiers; uw wijzen, o Tyrus! die in u waren, die waren uw schippers.", "Jes 5:16": "Doch de HEERE van de heerscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Mark 12:38": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten;", "Pred 4:14": "Want de een komt uit de gevangenis om koning te worden; terwijl ook iemand die in zijn koninkrijk geboren is, verarmt.", "Amos 4:2": "De Heere HEERE heeft gezworen bij Zijn heiligheid, dat er, zie, dagen over u zullen komen, dat men u zal optrekken met haken, en uw nakomelingen met visangels.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Ezech 25:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Ezech 27:27": "Uw goed, en uw marktwaren, uw onderlinge koophandel, uw zeelieden, en uw schippers; die uw breuken verbeteren, en die onderlinge handel met u drijven, en al uw krijgslieden, die in u zijn, zelfs met heel uw gemeente, die in het midden van u is, zullen vallen in het hart van de zeeën, ten dage van uw val.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Jer 5:29": "Zou Ik hierom geen straf brengen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk als dit is?", "2 Kor 10:12": "Want wij durven onszelf niet rekenen tot of vergelijken met sommigen, die zichzelf prijzen; maar zij begrijpen niet, dat zij zichzelf met zichzelf meten, en zichzelf met zichzelf vergelijken.", "Hab 1:6-8": "Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit. Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Deut 6:11": "En huizen, vol van alle goeds, die u niet gevuld hebt, en uitgehouwen putten, die u niet uitgehouwen hebt, wijngaarden en olijfgaarden, die u niet geplant hebt, en u gegeten hebt en verzadigd bent;", "Ezech 27:35": "Alle inwoners van de eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbijsterd van gezicht.", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "1 Kor 5:2": "En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden?", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Mark 10:17-27": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ezech 28:21-23": "Mensenkind! Zet uw aangezicht tegen Sidon, en profeteer tegen haar, En zeg: Zo zegt de Heere HEERE: Zie, Ik zál tegen u zijn, o Sidon! en Ik zal in uw midden verheerlijkt worden; en zij zullen weten dat Ik de HEERE ben, wanneer Ik gerichten in haar zal hebben geoefend, en in haar geheiligd zal zijn. Want Ik zal de pest in haar zenden, en bloed op haar straten, en de verslagenen zullen vallen in haar midden, door het zwaard dat van rondom tegen haar zal zijn; en zij zullen weten dat Ik de HEERE ben.", "Deut 33:18": "En van Zebulon zei hij: Verheug u, Zebulon! over uw uittocht, en Issaschar! over uw tenten.", "Hos 10:7": "De koning van Samaria is afgehouwen, als schuim op het water.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Jer 12:14": "Zo zegt de HEERE: Aangaande al Mijn boosaardige naburen, die Mijn erfenis aanroeren, die Ik aan Mijn volk Israël erfelijk gegeven heb; zie, Ik zal hen uit hun land uitrukken, maar het huis van Juda zal Ik uit hun midden uitrukken.", "Dan 4:31": "Dit woord was nog in de mond van de koning, toen er een stem uit de hemel viel: U, koning Nebukadnezar, wordt gezegd: Het koninkrijk is van u weggegaan.", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Jes 3:12": "De drijvers van Mijn volk zijn kinderen, en vrouwen heersen over hen. O Mijn volk! die u leiden, verleiden u, en de weg van uw paden slokken zij in.", "Gen 6:11": "Maar de aarde was verdorven voor het aangezicht van God; en de aarde was vervuld met geweld.", "Ezech 32:18-30": "Mensenkind! Weeklaag over de menigte van Egypte, en laat haar neerdalen, (haar en de dochters van de prachtige heidenvolken) naar de onderste plaatsen van de aarde, bij hen die in het kuil zijn neergedaald. Boven wie bent u zo liefelijk! Daal neer, en leg u bij de onbesnedenen. In het midden van de verslagenen van het zwaard zullen zij vallen; zij is aan het zwaard overgegeven; trek haar weg met haar hele menigte.", "Jes 23:18": "En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben.", "Deut 28:49": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan;", "Gen 13:2": "En Abram was zeer rijk, in vee, in zilver, en in goud.", "Ezech 34:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Luk 2:40": "En het Kindje groeide op, en werd gesterkt in de geest, en vervuld met wijsheid; en de genade van God was op Hem.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "Neh 5:7-9": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen. En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord. Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden?", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Job 21:18": "Dat zij worden als stro voor de wind, en als kaf, dat de wervelwind wegsteelt;", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Ezech 44:7": "Omdat u vreemden hebt binnengebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, namelijk Mijn huis; toen u Mijn brood, het vette en het bloed offerde, en zij Mijn verbond verbraken, naast al uw gruwelen.", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Jer 48:15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "2 Kron 21:6": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.", "Ezech 31:10": "Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over uw stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte;", "Jes 54:11": "U verdrukte, door onweer voortgedrevene, ongetrooste! Zie, Ik zal uw stenen helemaal sierlijk leggen, en Ik zal u op saffieren grondvesten.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Ezech 31:18": "Aan wie bent u zo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, u zult neergevoerd worden met de bomen van Eden, tot het onderste van de aarde; in het midden van de onbesnedenen zult u liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn hele menigte, spreekt de Heere HEERE.", "Ezech 7:1": "Daarna kwam het woord van de HEERE tot mij, en Hij zei:", "Ezech 8:17": "Toen zei Hij tegen mij: Hebt u, mensenkind, dat gezien? Is het iets gerings voor het huis van Juda om deze gruwelen te doen, die zij hier doen? Terwijl zij het land met geweld vervuld hebben, keren zij zich om, om Mij te vertoornen; want zie, zij houden de wijnrank aan hun neus.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Ezech 29:1": "In het tiende jaar, in de tiende maand, op de twaalfde dag van de maand, kwam het woord van de HEERE tot mij. Hij zei:", "Zach 1:15": "En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Num 33:55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "Job 24:22": "Ook trekt hij de machtigen mee door zijn kracht; staat hij op, dan is niemand zeker van zijn leven.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Ps 52:3-9": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Spr 31:14-18": "He. Zij is als de schepen van een koopman; zij laat haar brood van verre komen. Vau. En zij staat op als het nog nacht is, en geeft haar huis voedsel, en haar dienstmaagden het vastgestelde deel. Zain. Zij denkt na over een akker, en verwerft die; van de vrucht van haar handen plant zij een wijngaard.", "Openb 17:4": "En de vrouw was bekleed met purper en scharlaken, en versierd met goud en kostbaar gesteente en parels, en had in haar hand een gouden drinkbeker, vol van gruwelen en van de onreinheid van haar hoererij.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Hos 5:10": "De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.", "Rom 11:17-21": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Joh 11:51": "En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "Ezech 15:1": "En het woord van de HEERE kwam tot mij:", "Ps 76:13": "Die de geest van de vorsten als druiven afsnijdt; Die de koningen van de aarde vreselijk is.", "Jer 23:8": "Maar: Zo waarachtig als de HEERE leeft, Die het nageslacht van het huis van Israël heeft opgevoerd, en Die het heeft aangebracht uit het land van het noorden, en uit al de landen waarheen Ik ze gedreven had! Want zij zullen wonen in hun land.", "Ezech 26:1": "En het gebeurde in het elfde jaar, op de eerste van de maand, dat het woord van de HEERE tot mij kwam en zei:", "Jak 4:13": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Jer 51:64": "En zult zeggen: Zo zal Babel zinken, en niet meer opkomen, vanwege het kwaad dat Ik over haar zal brengen, en zij zullen moe worden. Tot hiertoe zijn de woorden van Jeremia.", "Ezech 20:45": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Pred 5:13": "Of die rijkdom zelf gaat verloren door een moeilijke bezigheid; en hij verwekt een zoon, en er is helemaal niets in zijn hand.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Job 13:5": "Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen.", "Joh 8:24": "Ik heb u dan gezegd, dat u in uw zonden zult sterven; want als u niet gelooft dat Ik Die ben, zult u in uw zonden sterven.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "Ezech 35:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "Ezech 24:20": "En ik zei tegen hen: Het woord van de HEERE is tot mij gekomen, en Hij zei:", "Jes 14:13": "En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden.", "Ezech 11:14": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Ezech 23:48": "Zo zal Ik de schandelijkheid uit het land doen ophouden, opdat alle vrouwen onderwezen worden zodat zij niet naar uw schandelijkheid handelen.", "Jes 26:14": "Zij die dood zijn, zullen niet opnieuw leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.", "Ezech 27:3": "En zeg tegen Tyrus, die daar woont aan de ingangen van de zee, handelend met de volken in veel eilanden: Zo zegt de Heere HEERE: O Tyrus! u zegt: Ik ben volmaakt in schoonheid.", "Dan 5:18-23": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven; En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij. Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.", "Ezech 13:1": "En het woord van de HEERE gebeurde tot mij, en zei:", "Pred 10:5-7": "Er is nog een kwaad dat ik gezien heb onder de zon, als een dwaling die van het aangezicht van de leider voortkomt. Een dwaas wordt gezet in grote hoogheden, maar de rijken zitten in de laagte. Ik heb knechten te paard gezien, en vorsten die als knechten op de aarde gingen.", "2 Sam 5:11": "En Hiram, de koning van Tyrus, zond boden naar David, en cederhout, en timmerlieden, en metselaars; en zij bouwden David een huis.", "Jer 29:6": "Neemt vrouwen, en verwekt zonen en dochters, en neemt vrouwen voor uw zonen, en geeft uw dochters aan mannen, zodat zij zonen en dochters baren; en wordt daar talrijker, en wordt niet minder.", "Amos 6:12": "Zullen paarden ook rennen op een steenrots? Zal men daarop ook met runderen ploegen? Want u hebt het recht in gal veranderd, en de vrucht van de gerechtigheid in alsem.", "Ezech 28:3-5": "Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen. Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten. Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.", "Jes 5:6": "En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "Job 31:24": "Als ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: U bent mijn vertrouwen;", "Ezech 34:13": "En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Jes 59:14": "Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "Ezech 27:33": "Toen uw marktwaren uit de zeeën voortkwamen, hebt u veel volken verzadigd; met de veelheid van uw goederen en uw onderlinge koophandel, hebt u de koningen van de aarde rijk gemaakt.", "Ezech 12:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Jer 25:22": "En alle koningen van Tyrus, en alle koningen van Sidon; en de koningen van de eilanden, die aan de andere kant van de zee zijn.", "Ezech 32:17": "Verder gebeurde het in het twaalfde jaar, op de vijftiende dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Spr 21:4": "Hoogheid van de ogen, en trotsheid van het hart, en de ploeging van de goddelozen, zijn zonde.", "Joël 3:4-8": "En ook, wat hebt u met Mij te maken, Tyrus en Sidon, en alle gebieden van Palestina! Wilt u Mij iets vergelden? Maar als u Mij iets wilt vergelden, zal Ik zeer snel, heel haastig, uw vergelding op uw eigen hoofd terugbrengen. Omdat u Mijn zilver en Mijn goud hebt weggenomen, en Mijn beste kostbaarheden in uw tempels hebt gebracht. En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "2 Kron 9:20-22": "Ook waren alle drinkvaten van koning Salomo van goud, en alle vaten van het huis van het woud van de Libanon waren van zuiver goud; het zilver werd in de dagen van Salomo nergens voor gerekend. Want de schepen van de koning voeren naar Tharsis, met de knechten van Huram; eens in de drie jaar kwamen de schepen van Tharsis binnen, met goud, en zilver, ivoor, en apen, en pauwen. Zo werd koning Salomo groter dan alle koningen van de aarde in rijkdom en wijsheid.", "Ezech 28:3-6": "Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen. Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten. Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.", "Ezech 32:1": "Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Hand 5:3-10": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land? Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God. En Ananias, deze woorden horend, viel neer en gaf de geest. En er kwam grote vrees over allen die dit hoorden.", "Job 36:14": "Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.", "Ezech 16:49": "Zie, dit was de ongerechtigheid van uw zuster Sodom: hoogmoed, verzadiging van brood, en zorgeloze rust had zij en haar dochters; maar zij versterkte de hand van de arme en de behoeftige niet.", "Zef 2:8": "Ik heb de beschimping van Moab gehoord, en de scheldwoorden van de kinderen van Ammon, waarmee zij Mijn volk beschimpt hebben, en zich groot gemaakt hebben tegen hun grondgebied.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedach
