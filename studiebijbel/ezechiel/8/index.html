d, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.","2":"Toen zag ik, en zie, een gelijkenis, als de gedaante van vuur; van de gedaante van Zijn lenden en naar beneden was vuur; en van Zijn lenden en naar boven, als de gedaante van een glans, als de kleur van amber.","3":"En Hij stak de gelijkenis van een hand uit, en nam mij bij het haar van mijn hoofd; en de Geest voerde mij op tussen de aarde en de hemel, en bracht mij in visioenen[1] van God naar Jeruzalem, tot de deur van de poort van de binnenste *voorhof*, die uitziet naar het noorden, waar de zitplaats was van een beeld van de ijver, dat tot ijver opwekt.","4":"En zie, de heerlijkheid van de God van Israël was daar, naar de gedaante die ik in de vallei gezien had.","5":"En Hij zei tegen mij: Mensenkind, hef nu uw ogen op naar de weg van het noorden; en ik hief mijn ogen op naar de weg van het noorden, en zie, tegen het noorden aan de poort van het altaar was dit beeld van de ijver, in de ingang.","6":"En Hij zei tegen mij: Mensenkind, ziet u wel wat zij doen, de grote gruwelen die het huis van Israël hier doet, zodat Ik ver van Mijn heiligdom wegga? Maar u zult nog meer grote gruwelen zien.","7":"Zo bracht Hij mij tot de deur van het voorhof. Toen zag ik, en zie, er was een gat in de wand.","8":"En Hij zei tegen mij: Mensenkind, graaf nu in die wand. En ik groef in die wand, en zie, daar was een deur.","9":"Toen zei Hij tegen mij: Ga naar binnen, en zie de boze gruwelen die zij hier doen.","10":"Zo ging ik naar binnen, en ik zag, en zie, er was elke afbeelding van kruipende dieren en verfoeilijke beesten, en van alle drekgoden[2] van het huis van Israël, helemaal rondom op de wand geschilderd.","11":"En zeventig mannen uit de oudsten van het huis van Israël, met Jaazanja, de zoon van Safan, die in hun midden stond, stonden voor hun aangezicht; en ieder had zijn rookvat in zijn hand, en een dikke wolk van het reukwerk steeg op.","12":"Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.","13":"En Hij zei tegen mij: U zult nog meer grote gruwelen zien die zij doen.","14":"En Hij bracht mij tot de deur van de poort van het huis van de HEERE, die naar het noorden is, en zie, daar zaten vrouwen die Tammuz beweenden.","15":"En Hij zei tegen mij: Hebt u, mensenkind, dat gezien? U zult nog grotere gruwelen zien dan deze.","16":"En Hij bracht mij tot de binnenste voorhof van het huis van de HEERE; en zie, *aan* de deur van de tempel van de HEERE, tussen het voorhuis en het altaar, waren ongeveer vijfentwintig mannen; hun achterste *lichaamsdelen* waren naar de tempel van de HEERE, en hun gezichten naar het oosten, en zij bogen zich neer naar het oosten voor de zon.","17":"Toen zei Hij tegen mij: Hebt u, mensenkind, dat gezien? Is het iets gerings voor het huis van Juda om deze gruwelen te doen, die zij hier doen? Terwijl zij het land met geweld vervuld hebben, keren zij zich om, om Mij te vertoornen; want zie, zij houden de wijnrank aan hun neus.","18":"Daarom zal Ik ook handelen in grimmigheid, Mijn oog zal niet ontzien, en Ik zal niet sparen; al roepen zij voor Mijn oren met luide stem, toch zal Ik hen niet horen."},"SV":{"1":"Het geschiedde nu in het zesde jaar, in de zesde *maand*, op den vijfden der maand, als ik in mijn huis zat, en de oudsten van Juda voor mijn aangezicht zaten, dat de hand des Heeren HEEREN daar over mij viel.","2":"Toen zag ik, en ziet, een gelijkenis, als de gedaante van vuur; van de gedaante Zijner lenden en nederwaarts was vuur; en van Zijn lenden en opwaarts, als de gedaante ener klaarheid, als de verf van Hasmal.","3":"En Hij stak de gelijkenis ener hand uit, en nam mij bij het haar mijns hoofds; en de Geest voerde mij op tussen de aarde en tussen den hemel, en bracht mij in de gezichten Gods te Jeruzalem, tot de deur der poort van het binnenste *voorhof*, dewelke ziet naar het noorden, alwaar de zitplaats was van een beeld der ijvering, dat tot ijver verwekt.","4":"En ziet, de heerlijkheid des Gods van Israël was aldaar, naar de gedaante, die ik in de vallei gezien had.","5":"En Hij zeide tot mij: Mensenkind, hef nu uw ogen op naar den weg van het noorden; en ik hief mijn ogen op naar den weg van het noorden, en ziet, tegen het noorden aan de poort van het altaar was dit beeld der ijvering, in den ingang.","6":"En Hij zeide tot mij: Mensenkind, ziet gij wel, wat zij doen, de grote gruwelen, die het huis Israëls hier doet, opdat Ik van Mijn heiligdom verre wegga? Doch gij zult nog wederom grote gruwelen zien.","7":"Zo bracht Hij mij tot de deur van het voorhof. Toen zag ik, en ziet, er was een hol in den wand.","8":"En Hij zeide tot mij: Mensenkind, graaf nu in dien wand. En ik groef in dien wand, en ziet, daar was een deur.","9":"Toen zeide Hij tot mij: Ga in, en zie de boze gruwelen, die zij hier doen.","10":"Zo ging ik in, en ik zag, en ziet, er was alle beeltenis van kruipende dieren en verfoeilijke beesten, en van alle drekgoden van het huis Israëls, geheel rondom aan den wand gemaald.","11":"En zeventig mannen uit de oudsten van het huis Israëls, met Jaazanja, den zoon van Safan, staande in het midden van hen, stonden voor hun aangezichten; en een ieder *had* zijn rookvat in zijn hand, en een overvloedige wolk des reukwerks ging op.","12":"Toen zeide Hij tot mij: Hebt gij gezien, mensenkind, wat de oudsten van het huis Israëls doen in de duisternis, een ieder in zijn gebeelde binnenkameren? want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.","13":"En Hij zeide tot mij: Gij zult nog wederom grote gruwelen zien, die zij doen.","14":"En Hij bracht mij tot de deur der poort van het huis des HEEREN, die naar het noorden is, en ziet, daar zaten vrouwen, bewenende den Thammuz.","15":"En Hij zeide tot mij: Hebt gij, mensenkind, *dat* gezien? Gij zult nog wederom grotere gruwelen zien dan deze.","16":"En Hij bracht mij tot het binnenste voorhof van het huis des HEEREN; en ziet, *aan* de deur van den tempel des HEEREN, tussen het voorhuis en tussen het altaar, waren omtrent vijf en twintig mannen; hun achterste *leden* waren naar den tempel des HEEREN, en hun aangezichten naar het oosten, en deze bogen zich neder naar het oosten voor de zon.","17":"Toen zeide Hij tot mij: Hebt gij, mensenkind, *dat* gezien? Is er iets lichter geacht bij het huis van Juda, dan deze gruwelen te doen, die zij hier doen? Als zij het land met geweld vervuld hebben, zo keren zij zich, om Mij te vertoornen; want zie, zij steken de wijnranken aan hun neus.","18":"Daarom zal Ik ook handelen in grimmigheid, Mijn oog zal niet verschonen, en Ik zal niet sparen; hoewel zij voor Mijn oren met luider stem roepen, nochtans zal Ik hen niet horen."},"KJV":{"1":"And it came to pass in the sixth year, in the sixth *month*, in the fifth *day* of the month, *as* I sat in mine house, and the elders of Judah sat before me, that the hand of the Lord GOD fell","2":"Then I beheld, and lo a likeness as the appearance of fire: from the appearance of his loins even downward, fire; and from his loins even upward, as the appearance of brightness, as the colour of amber.","3":"And he put forth the form of an hand, and took me by a lock of mine head; and the spirit lifted me up between the earth and the heaven, and brought me in the visions of God to Jerusalem, to the door of the inner gate that looketh toward the north; where *was* the seat of the image of jealousy, which provoketh to jealousy.","4":"And, behold, the glory of the God of Israel *was* there, according to the vision that I saw in the plain.","5":"Then said he unto me, Son of man, lift up thine eyes now the way toward the north. So I lifted up mine eyes the way toward the north, and behold northward at the gate of the altar this image of jealousy in the entry.","6":"He said furthermore unto me, Son of man, seest thou what they do? *even* the great abominations that the house of Israel committeth here, that I should go far off from my sanctuary? but turn thee yet again, *and* thou shalt see greater abominations.","7":"And he brought me to the door of the court; and when I looked, behold a hole in the wall.","8":"Then said he unto me, Son of man, dig now in the wall: and when I had digged in the wall, behold a door.","9":"And he said unto me, Go in, and behold the wicked abominations that they do","10":"So I went in and saw; and behold every form of creeping things, and abominable beasts, and all the idols of the house of Israel, pourtrayed upon the wall round about.","11":"And there stood before them seventy men of the ancients of the house of Israel, and in the midst of them stood Jaazaniah the son of Shaphan, with every man his censer in his hand; and a thick cloud of incense went up.","12":"Then said he unto me, Son of man, hast thou seen what the ancients of the house of Israel do in the dark, every man in the chambers of his imagery? for they say, The LORD seeth us not; the LORD hath forsaken the earth.","13":"He said also unto me, Turn thee yet again, *and* thou shalt see greater abominations that they do.","14":"Then he brought me to the door of the gate of the LORD'S house which *was* toward the north; and, behold, there sat women weeping for Tammuz.","15":"Then said he unto me, Hast thou seen *this*, O son of man? turn thee yet again, *and* thou shalt see greater abominations","16":"And he brought me into the inner court of the LORD'S house, and, behold, at the door of the temple of the LORD, between the porch and the altar, *were* about five and twenty men, with their backs toward the temple of the LORD, and their faces toward the east; and they worshipped the sun toward the east.","17":"Then he said unto me, Hast thou seen *this*, O son of man? Is it a light thing to the house of Judah that they commit the abominations which they commit here? for they have filled the land with violence, and have returned to provoke me to anger: and, lo, they put the branch to their nose.","18":"Therefore will I also deal in fury: mine eye shall not spare, neither will I have pity: and though they cry in mine ears with a loud voice, *yet* will I not hear"}},"tsk":{"1":[{"kopje":"in het zesde jaar","refs":["Ezech 1:2","Ezech 20:1","Ezech 24:1","Ezech 26:1","Ezech 29:1","Ezech 29:17","Ezech 31:1","Ezech 32:17","Ezech 40:1"]},{"kopje":"en de","refs":["Ezech 14:1","Ezech 14:4","Ezech 20:1","Ezech 33:31","Mal 2:7","Hand 20:33"]},{"kopje":"dat de","refs":["Ezech 1:3","Ezech 3:12","Ezech 3:14","Ezech 3:22","Ezech 37:1"]}],"2":[{"kopje":"zag ik","refs":["Ezech 1:4","Ezech 1:26","Ezech 1:27","Dan 7:9","Dan 7:10","Openb 1:14","Openb 1:15"]}],"3":[{"kopje":"stak","refs":["Ezech 2:9","Dan 5:5","Dan 10:10","Dan 10:18"]},{"kopje":"de Geest","refs":["Ezech 3:14","Ezech 11:1","Ezech 11:24","Ezech 40:2","1 Kon 18:12","2 Kon 2:16","Hand 8:39","2 Kor 12:2-4","Openb 1:10-20","Openb 4:2-11"]},{"kopje":"tot de deur","refs":["Ezech 8:5","2 Kon 16:14"]},{"kopje":"het beeld","refs":["Ezech 5:11","Ezech 7:20","2 Kon 21:7","Jer 7:30","Jer 32:34"]},{"kopje":"opwekt","refs":["Ex 20:5","Ex 34:14","Deut 4:24","Deut 5:9","Deut 6:15","Deut 32:16","Deut 32:21","Joz 24:19","Ps 78:58","1 Kor 10:21","1 Kor 10:22"]}],"5":[{"kopje":"hef","refs":["Jer 3:2","Zach 5:5-11"]},{"kopje":"tegen het","refs":["Ezech 8:3","Ps 48:3"]}],"6":[{"kopje":"ziet u","refs":["Ezech 8:12","Ezech 8:17","Jer 3:6","Jer 7:17"]},{"kopje":"zodat","refs":["Ezech 8:9","Ezech 8:17","Ezech 5:11","Ezech 7:20-22","Ezech 23:38","Ezech 23:39","2 Kon 23:4-6","Spr 5:14","Jer 7:30","Jer 23:11","Jer 32:34"]},{"kopje":"Ik","refs":["Ezech 10:19","Ezech 11:22","Deut 31:16-18","2 Kron 36:14-17","Ps 78:60","Jer 26:6","Klaagl 2:6","Klaagl 2:7"]},{"kopje":"meer grote","refs":["Ezech 8:11","Ezech 8:14","Ezech 8:16"]}],"9":[{"kopje":"die zij","refs":["Ezech 20:8"]}],"10":[{"kopje":"elke","refs":["Ex 20:4","Lev 1 963\">voice,</span> yet will I not hear"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zesde jaar,","tekst":"Te weten na de wegvoering van Jojachin. Zie boven Eze 1:2 ."},{"catchword":"zesde maand,","tekst":"Genaamd bij de Hebreën Elul. Zie Neh 6:15 en de aantekening."},{"catchword":"mijn huis zat,","tekst":"Te weten in Babylonië of Mesopotamië, onder de weggevoerde Joden."},{"catchword":"oudsten van Juda","tekst":"Dat is, de regeerders der Joden; zie Exo 3:16 , en Lev 4:15 , en de aantekening. Eenigen verstaan degenen, die in Jeruzalem woonachtig waren; anderen, die daar onder de weggevoerden woonden; vergelijk onder Eze 14:1 , en Eze 20:1 ."},{"catchword":"zaten,","tekst":"Te weten om enig bericht, raad, onderwijs of troost over den staat van het land Juda en Gods kerk van den profeet te mogen ontvangen; vergelijk Exo 3:16 ; 2Ki 6:32 , en de aantekening."},{"catchword":"de hand des Heeren HEEREN daar over mij viel","tekst":"Zie boven Eze 1:3 ."}],"2":[{"catchword":"zag ik,","tekst":"Te weten in den geest en in optrekking der zinnen; zie van de profetische gezichten Gen 15:1 en Gen 46:2 ."},{"catchword":"gelijkenis,","tekst":"Te weten van den vorm eens mensen."},{"catchword":"vuur;","tekst":"Hetwelk betekende Gods wraak en rechtvaardige gramschap, die ontstoken was tegen de goddeloosheid. Vergelijk Deu 4:24 ."},{"catchword":"ener klaarheid,","tekst":"Betekende Gods majesteit en aangename vriendelijkheid jegens degenen, die met gelovigen eerbied zijn woord ontvangen; zie boven Eze 1:28 ."},{"catchword":"van Hasmal","tekst":"Zie boven Eze 1:4 ."}],"3":[{"catchword":"Hij stak de gelijkenis ener hand uit,","tekst":"Te weten welke gelijkenis en gedaante beschreven is in vs.2."},{"catchword":"het haar mijns hoofds;","tekst":"Of, haarlokken."},{"catchword":"Geest","tekst":"Dat is de Heilige Geest, die hem dit gezicht vertoonden. Zie boven Eze 1:12 ."},{"catchword":"voerde mij op","tekst":"Dat is geschied in den geest, niet in het lichaam, door optrekking der zinnen en niet door verandering der plaatsen. Want de profeet verklaart zichzelven terstond, zeggende: In de gezichten Gods. Vergelijk onder Eze 11:24 ."},{"catchword":"in de gezichten Gods te Jeruzalem,","tekst":"Te weten die God door zijn Geest in mijne zinnen wrocht. Alzo boven Eze 1:1 , en onder Eze 40:2 ."},{"catchword":"voorhof ,","tekst":"Dit woord is in den Hebreeuwsen tekst uitgedrukt, onder Eze 10:3 . Zie van dit voorhof 1Ki 6:36 . Sommigen verstaan dit van het binnenste deel des groten voorhofs, anders genaamd het voorhof des volks; anderen van den ingang des groten voorhofs."},{"catchword":"een beeld","tekst":"Men houdt dit beeld het beeld van Baäl geweest te zijn, die Achaz een altaar opgericht had. 2Ki 16:1 , enz. hetwelk Hizkia daarna verstoord maar Manasse weder opgericht heeft; 2Ki 21:3 . Is daarna weder afgebroken van Josia, en herstel van Joahaz en zijne broeders."},{"catchword":"ijvering,","tekst":"Zo genaamd omdat de afgodendienst, daaraan van de Joden gedaan, God tot ijver verwekte, dat is vergramde en tergde, overmits de eer en de dienst, die zijn volk Hem alleen, als den enigen bruidegom deszelven schuldig was, dezen afgoden toegedragen werd. Zie Exo 20:5 en Lev 20:5 ."},{"catchword":"tot ijver verwekt","tekst":"Namelijk den Heere. Het is menselijkerwijze gesproken. Zie Deu 4:24 ."}],"4":[{"catchword":"de heerlijkheid des Gods van Israël was aldaar,","tekst":"Zie boven Eze 1:28 ."},{"catchword":"vallei gezien had","tekst":"Zie boven Eze 3:23 ."}],"5":[{"catchword":"Hij zeide tot mij","tekst":"Te weten de Geest, van welken gesproken is boven vs.3."},{"catchword":"uw ogen op","tekst":"Te weten de ogen des geestes, niet des lichaams. Want Ezechiël was binnen Jeruzalem, niet naar het lichaam, maar in de optrekking der zinnen."},{"catchword":"naar den weg van het noorden;","tekst":"Hebreeuws, den weg naar het noorden, of noordwaarts."},{"catchword":"aan de poort van het altaar","tekst":"Versta, de poort des tempels, bij welke het koperen altaar [and hing was counted lighter by the Jews though these abominations committed against the first table were of all others the most grievous and most displeasing to God but there was no commandment so great but the Jews counted it a light thing a transgress against it ]when they have filled the land with violence [that is with oppression of the innocent and poor which is done either in public by judgment or in private by all manner of wrong and injury ]then they return themselves to provoke me to anger [to wit by idolatry whereby they provoke me to jealousy and prophane my temple ]for lo they put the vine branches [or boughs or graffs the Hebrew word is so taken Numb 13.4 and below chap 15.2 ]to their nose [to wit to honor of the fun whom they worship because they cherisheth and ripeneth the fruits this place is diversly expounded. ]"}],"18":[{"catchword":null,"tekst":"therefore I will also deal in fury mine eye shall not pity neither will I spare [so above chap 5.11 & 7.4 ]though they cry before mine ears with a loud voice yet I will not hear them [to wit because their prayers shalt not proceed from a true and lively faith nor be joined with true repentance but only wrung from them by a sense of present misery and feeling and fear of great punishment without any firm resolution of true amendment compare Prov 1.28 Isa 1.15 Jerem 11.11.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const popupCache = {};

  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
