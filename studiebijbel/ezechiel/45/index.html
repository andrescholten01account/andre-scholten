 hefoffer aan de HEERE brengen, *als* een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend *meetrieten*, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn.","2":"Hiervan zal voor het heiligdom zijn vijfhonderd bij vijfhonderd, vierkant rondom; en het zal vijftig el hebben *als* buitenruimte rondom.","3":"Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, *met* het heilige der heiligen.","4":"Dat zal een heilige plaats van het land zijn; ze zal zijn voor de priesters die het heiligdom bedienen, die naderen om de HEERE te dienen; en het zal hun een plaats zijn tot huizen, en een heilige plaats voor het heiligdom.","5":"Verder zullen de Levieten, de dienaars van het huis, ook de lengte hebben van vijfentwintigduizend, en de breedte van tienduizend, hun tot een bezitting, *voor* twintig kamers.","6":"En *tot* bezitting van de stad zult u geven de breedte van vijfduizend en de lengte van vijfentwintigduizend, tegenover het heilige hefoffer; voor het hele huis van Israël zal het zijn.","7":"De vorst nu zal *zijn* *deel* hebben van deze en van gene zijde van het heilige hefoffer en van de bezitting van de stad, vóór het heilige hefoffer, en vóór de bezitting van de stad; van de westkant westwaarts, en van de oostkant oostwaarts; en de lengte zal zijn tegenover een van de delen, van de westgrens tot aan de oostgrens toe.","8":"Dit land aangaande, het zal hem tot een bezitting zijn in Israël; en Mijn vorsten zullen Mijn volk niet meer verdrukken, maar het huis van Israël het land laten, naar hun stammen.","9":"Zo zegt de Heere HEERE: Het is genoeg voor u, vorsten van Israël! Doe geweld en verwoesting weg, en doe recht en gerechtigheid; neem uw uitstotingen weg van Mijn volk, spreekt de Heere HEERE.","10":"Een eerlijke weegschaal, en een eerlijke efa, en een eerlijke bath zult u hebben.","11":"Een efa en een bath zullen van dezelfde maat zijn, zodat een bath het tiende deel van een homer bevat; ook een efa het tiende deel van een homer; de maat daarvan zal zijn naar de homer.","12":"En de sikkel zal zijn van twintig gera; twintig sikkels, vijfentwintig sikkels en vijftien sikkels, zal u een pond zijn.","13":"Dit is het hefoffer dat u brengen zult: het zesde deel van een efa van een homer tarwe; ook zult u het zesde deel van een efa geven van een homer gerst.","14":"Aangaande de inzetting van olie, van een bath olie: *u zult offeren* het tiende deel van een bath uit een kor, *dat* een homer is van tien bath, want tien bath zijn een homer.","15":"Verder een lam uit de kudde, uit de tweehonderd, uit het waterrijke land van Israël, tot spijsoffer, en tot brandoffer, en tot dankoffers, om verzoening over hen te doen, spreekt de Heere HEERE.","16":"Al het volk van het land zal in dit hefoffer bijdragen, voor de vorst in Israël.","17":"En het zal de vorst opgelegd zijn te *offeren* de brandoffers, en het spijsoffer, en het drankoffer, op de feesten, en op de nieuwe manen, en op de sabbatten, op alle vaste hoogtijden van het huis van Israël; hij zal het zondoffer, en het spijsoffer, en het brandoffer, en de dankoffers klaarmaken, om verzoening te doen voor het huis van Israël.","18":"Zo zegt de Heere HEERE: In de eerste *maand*, op de eerste van de maand, zult u een gaaf jong rund nemen; en u zult het heiligdom ontzondigen.","19":"En de priester zal van het bloed van het zondoffer nemen, en het doen aan de posten van het huis, en aan de vier hoeken van het afzetsel van het altaar, en aan de posten van de poorten van het binnenste voorhof.","20":"Zo zult u ook doen op de zevende dag van die maand; vanwege wie afdwaalt, en vanwege wie eenvoudig is; zo zult u het huis verzoenen.","21":"In de eerste *maand*, op de veertiende dag van de maand, zal het pascha voor u zijn; een feest van zeven dagen, ongezuurde broden zal men eten.","22":"En de vorst zal op diezelfde dag voor zichzelf, en voor heel het volk van het land, een var als zondoffer klaarmaken.","23":"En de zeven dagen van het feest zal hij een brandoffer aan de HEERE klaarmaken, van zeven varren en zeven rammen, *die* gaaf zijn, dagelijks, de zeven dagen *lang*, en een zondoffer van een geitenbok, dagelijks.","24":"Ook zal hij een spijsoffer klaarmaken, een efa bij een var, en een efa bij een ram; en een hin olie bij een efa.","25":"In de zevende *maand*, op de vijftiende dag van de maand, zal hij op het feest hetzelfde doen, zeven dagen *lang*; net als het zondoffer, net als het brandoffer, en net als het spijsoffer, en net als de olie."},"SV":{"1":"Als gijlieden nu het land zult doen vallen in erfenis, zo zult gij een hefoffer den HEERE offeren, *tot* een heilige plaats, van het land; de lengte zal zijn de lengte van vijf en twintig duizend *meetrieten*, en de breedte tien duizend; dat zal in zijn gehele grenzen rondom heilig zijn.","2":"Hiervan zullen tot het heiligdom zijn vijfhonderd met vijfhonderd, vierkant rondom; en het zal vijftig ellen hebben *tot* een buitenruim rondom.","3":"Alzo zult gij meten van deze maat, de lengte van vijf en twintig duizend, en de breedte van tien duizend en daarin zal het heiligdom zijn *met* het heilige der heiligen.","4":"Dat zal een heilige plaats zijn van het land; zij zal zijn voor de priesteren, die het heiligdom bedienen, die naderen om den HEERE te dienen; en het zal hun een plaats zijn tot huizen, en een heilige plaats voor het heiligdom.","5":"Voorts zullen de Levieten, die dienaars des huizes, ook de lengte hebben van vijf en twintig duizend, en de breedte van tien duizend, hunlieden tot een bezitting, *voor* twintig kameren.","6":"En *tot* bezitting van de stad zult gij geven de breedte van vijf duizend en de lengte van vijf en twintig duizend, tegenover het heilig hefoffer; voor het ganse huis Israëls zal het zijn.","7":"De vorst nu zal *zijn* *deel* hebben van deze en van gene zijde des heiligen hefoffers en der bezitting der stad, voor aan het heilig hefoffer, en voor aan de bezitting der stad; van den westerhoek westwaarts, en van den oosterhoek oostwaarts; en de lengte zal zijn tegenover een der delen, van de westergrens tot de oostergrens toe.","8":"Dit land aangaande, het zal hem tot een bezitting zijn in Israël; en Mijn vorsten zullen Mijn volk niet meer verdrukken, maar den huize Israëls het land laten, naar hun stammen.","9":"Alzo zegt de Heere HEERE: Het is te veel voor u, gij vorsten Israëls! doet geweld en verstoring weg, en doet recht en gerechtigheid; neemt uw uitstotingen op van Mijn volk, spreekt de Heere HEERE.","10":"Een rechte waag, en een rechte efa, en een rechte bath zult gijlieden hebben.","11":"Een efa en een bath zullen van enerlei mate zijn, dat een bath het tiende deel van een homer houde; ook een efa het tiende deel van een homer; de mate daarvan zal zijn naar den homer.","12":"En de sikkel zal zijn van twintig gera; twintig sikkelen, vijf en twintig sikkelen en vijftien sikkelen, zal ulieden een pond zijn.","13":"Dit is het hefoffer, dat gijlieden offeren zult: het zesde deel van een efa van een homer tarwe; ook zult gij het zesde deel van een efa geven van een homer gerst.","14":"Aangaande de inzetting van olie, van een bath olie; *gij* *zult* *offeren* het tiende deel van een bath uit een kor, *hetwelk* is een homer van tien bath, want tien bath zijn een homer.","15":"Voorts een lam uit de kudde, uit de tweehonderd, uit het waterrijke land van Israël, tot spijsoffer, en tot brandoffer, en tot dankofferen om verzoening over hen te doen, spreekt de Heere HEERE.","16":"Al het volk des lands zal in dit hefoffer zijn, voor den vorst in Israël.","17":"En het zal den vorst opleggen te *offeren* de brandofferen, en het spijsoffer, en het drankoffer, op de feesten, en op de nieuwe maanden, en op de sabbatten, op alle gezette hoogtijden van het huis Israëls; hij zal het zondoffer, en het spijsoffer, en het brandoffer, en de dankofferen doen, om verzoening te doen voor het huis Israëls.","18":"Alzo zegt de Heere HEERE: In de eerste *maand*, op den eersten der maand, zult gij een volkomen var, een jong rund, nemen; en gij zult het heiligdom ontzondigen.","19":"En de priester zal van het bloed des zondoffers nemen, en doen het aan de posten des huizes, en aan de vier hoeken van het afzetsel des altaars, en aan de posten der poorten van het binnenste voorhof.","20":"Alzo zult gij ook doen op den zevenden in die maand; vanwege den afdwalende, en vanwege den slechte; alzo zult gijlieden het huis verzoenen.","21":"In de eerste *maand*, op den veertienden dag der maand, zal ulieden het pascha zijn; een feest van zeven dagen, ongezuurde broden zal men eten.","22":"En de vorst zal op denzelven dag voor zichzelven, en voor al het volk des lands, bereiden een var des zondoffers.","23":"En de zeven dagen van het feest zal hij een brandoffer den HEERE bereiden, van zeven varren en zeven rammen, *die* volkomen zijn, dagelijks, de zeven dagen *lang*, en een zondoffer van een geitenbok, dagelijks.","24":"Ook zal hij een spijsoffer bereiden, een efa tot een var, en een efa tot een ram; en een hin olie tot een efa.","25":"In de zevende *maand*, op den vijftienden dag der maand zal hij op het feest desgelijks doen, zeven dagen *lang*; gelijk het zondoffer, gelijk het brandoffer, en gelijk het spijsoffer, en gelijk de olie."},"KJV":{"1":"Moreover, when ye shall divide by lot the land for inheritance, ye shall offer an oblation unto the LORD, an holy portion of the land: the length *shall be* the length of five and twenty thousand *reeds*, and the breadth *shall be* ten thousand. This *shall be* holy in all the borders thereof round about.","2":"Of this there shall be for the sanctuary five hundred *in length*, with five hundred *in breadth*, square round about; and fifty cubits round about for the suburbs","3":"And of this measure shalt thou measure the length of five and twenty thousand, and the breadth of ten thousand: and in it shall be the sanctuary *and* the most holy","4":"The holy *portion* of the land shall be for the priests the ministers of the sanctuary, which shall come near to minister unto the LORD: and it shall be a place for their houses, and an holy place for the sanctuary.","5":"And the five and twenty thousand of length, and the ten thousand of breadth, shall also the Levites, the ministers of the house, have for themselves, for a possession for twenty chambers.","6":"And ye shall appoint the possession of the city five thousand broad, and five and twenty thousand long, over against the oblation of the holy *portion*: it shall be for the whole house of Israel.","7":"And a *portion shall be* for the prince on the one side and on the other side of the oblation of the holy *portion*, and of the possession of the city, before the oblation of the holy *portion*, and before the possession of the city, from the west side westward, and from the east side eastward: and the length *shall be* over against one of the portions, from the west border unto the east border.","8":"In the land shall be his possession in Israel: and my princes shall no more oppress my people; and *the rest of* the land shall they give to the house of Israel according to their tribes.","9":"Thus saith the Lord GOD; Let it suffice you, O princes of Israel: remove violence and spoil, and execute judgment and justice, take away your exactions from my people, saith the Lord GOD.","10":"Ye shall have just balances, and a just ephah, and a just bath.","11":"The ephah and the bath shall be of one measure, that the bath may contain the tenth part of an homer, and the ephah the tenth part of an homer: the measure thereof shall be after the homer.","12":"And the shekel *shall be* twenty gerahs: twenty shekels, five and twenty shekels, fifteen shekels, shall be your maneh.","13":"This *is* the oblation that ye shall offer; the sixth part of an ephah of an homer of wheat, and ye shall give the sixth part of an ephah of an homer of barley:","14":"Concerning the ordinance of oil, the bath of oil, *ye shall offer* the tenth part of a bath out of the cor, *which is* an homer of ten baths; for ten baths *are* an homer:","15":"And one lamb out of the flock, out of two hundred, out of the fat pastures of Israel; for a meat offering, and for a burnt offering, and for peace offerings, to make reconciliation for them, saith the Lord GOD.","16":"All the people of the land shall give this oblation for the prince in Israel.","17":"And it shall be the prince's part *to give* burnt offerings, and meat offerings, and drink offerings, in the feasts, and in the new moons, and in the sabbaths, in all solemnities of the house of Israel: he shall prepare the sin offering, and the meat offering, and the burnt offering, and the peace offerings, to make reconciliation for the house of Israel.","18":"Thus saith the Lord GOD; In the first *month*, in the first *day* of the month, thou shalt take a young bullock without blemish, and cleanse the sanctuary:","19":"And the priest shall take of the blood of the sin offering, and put *it* upon the posts of the house, and upon the four corners of the settle of the altar, and upon the posts of the gate of the inner court.","20":"And so thou shalt do the seventh *day* of the month for every one that erreth, and for *him that is* simple: so shall ye reconcile the house.","21":"In the first *month*, in the fourteenth day of the month, ye shall have the passover, a feast of seven days; unleavened bread shall be eaten.","22":"And upon that day shall the prince prepare for himself and for all the people of the land a bullock *for* a sin offering.","23":"And seven days of the feast he shall prepare a burnt offering to the LORD, seven bullocks and seven rams without blemish daily the seven days; and a kid of the goats daily *for* a sin offering.","24":"And he shall prepare a meat offering of an ephah for a bullock, and an ephah for a ram, and an hin of oil for an ephah.","25":"In the seventh *month*, in the fifteenth day of the mo 35\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> of <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth,</span> shall also the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> the <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> have for themselves, for a <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> for <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> chambers.","6":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">appoint</span> the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7341\">broad,</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H753\">long,</span> over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H8641\">oblation</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> portion: it shall be for the whole <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","7":"And a portion shall be for the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> on the one side and on the other side of the <span class=\"wl wl-kjv\" data-code=\"H8641\">oblation</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> portion, and of the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H8641\">oblation</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> portion, and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3220\">west</span> <span class=\"wl wl-kjv\" data-code=\"H6285\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">westward,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H6924\">east</span> <span class=\"wl wl-kjv\" data-code=\"H6285\">side</span> <span class=\"wl wl-kjv\" data-code=\"H6921\">eastward:</span> and the <span class=\"wl wl-kjv\" data-code=\"H753\">length</span> shall be over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H2506\">portions,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3220\">west</span> <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6921\">east</span> border.","8":"In the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be his <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and my <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> shall no more <span class=\"wl wl-kjv\" data-code=\"H3238\">oppress</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and the rest of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall they <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> according to their tribes.","9":"Thus <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Let it <span class=\"wl wl-kjv\" data-code=\"H7227\">suffice</span> you, O <span class=\"wl wl-kjv\" data-code=\"H5387\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">remove</span> <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> and <span class=\"wl wl-kjv\" data-code=\"H7701\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">justice,</span> take <span class=\"wl wl-kjv\" data-code=\"H7311\">away</span> your <span class=\"wl wl-kjv\" data-code=\"H1646\">exactions</span> from my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","10":"Ye shall have <span class=\"wl wl-kjv\" data-code=\"H6664\">just</span> <span class=\"wl wl-kjv\" data-code=\"H3976\">balances,</span> and a <span class=\"wl wl-kjv\" data-code=\"H6664\">just</span> <span class=\"wl wl-kjv\" data-code=\"H374\">ephah,</span> and a <span class=\"wl wl-kjv\" data-code=\"H6664\">just</span> bath.","11":"The <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> and the <span class=\"wl wl-kjv\" data-code=\"H1324\">bath</span> shall be of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8506\">measure,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1324\">bath</span> may <span class=\"wl wl-kjv\" data-code=\"H5375\">contain</span> the tenth <span class=\"wl wl-kjv\" data-code=\"H4643\">part</span> of an <span class=\"wl wl-kjv\" data-code=\"H2563\">homer,</span> and the <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> the tenth <span class=\"wl wl-kjv\" data-code=\"H6224\">part</span> of an <span class=\"wl wl-kjv\" data-code=\"H2563\">homer:</span> the <span class=\"wl wl-kjv\" data-code=\"H4971\">measure</span> thereof shall be after the homer.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H1626\">gerahs:</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels,</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels,</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteen</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels,</span> shall be your maneh.","13":"This is the <span class=\"wl wl-kjv\" data-code=\"H8641\">oblation</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H7311\">offer;</span> the sixth <span class=\"wl wl-kjv\" data-code=\"H8345\">part</span> of an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> of an <span class=\"wl wl-kjv\" data-code=\"H2563\">homer</span> of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat,</span> and ye shall give the sixth <span class=\"wl wl-kjv\" data-code=\"H8341\">part</span> of an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> of an <span class=\"wl wl-kjv\" data-code=\"H2563\">homer</span> of barley:","14":"Concerning the <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinance</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> the <span class=\"wl wl-kjv\" data-code=\"H1324\">bath</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> ye shall offer the tenth <span class=\"wl wl-kjv\" data-code=\"H4643\">part</span> of a <span class=\"wl wl-kjv\" data-code=\"H1324\">bath</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3734\">cor,</span> which is an <span class=\"wl wl-kjv\" data-code=\"H2563\">homer</span> of <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1324\">baths;</span> for <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1324\">baths</span> are an homer:","15":"And <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> out of two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> out of the fat <span class=\"wl wl-kjv\" data-code=\"H4945\">pastures</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> for a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and for peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> to make <span class=\"wl wl-kjv\" data-code=\"H3722\">reconciliation</span> for them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","16":"All the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall give this <span class=\"wl wl-kjv\" data-code=\"H8641\">oblation</span> for the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> in Israel.","17":"And it shall be the prince's <span class=\"wl wl-kjv\" data-code=\"H5387\">part</span> to give burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offerings,</span> and drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2282\">feasts,</span> and in the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moons,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> in all <span class=\"wl wl-kjv\" data-code=\"H4150\">solemnities</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and the peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> to make <span class=\"wl wl-kjv\" data-code=\"H3722\">reconciliation</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","18":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> In the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> month, in the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish,</span> and <span class=\"wl wl-kjv\" data-code=\"H2398\">cleanse</span> the sanctuary:","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H4201\">posts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H6438\">corners</span> of the <span class=\"wl wl-kjv\" data-code=\"H5835\">settle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H4201\">posts</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H6442\">inner</span> court.","20":"And so thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seventh</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> for every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> that <span class=\"wl wl-kjv\" data-code=\"H7686\">erreth,</span> and for him that is <span class=\"wl wl-kjv\" data-code=\"H6612\">simple:</span> so shall ye <span class=\"wl wl-kjv\" data-code=\"H3722\">reconcile</span> the house.","21":"In the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> month, in the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> ye shall have the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover,</span> a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of <span class=\"wl wl-kjv\" data-code=\"H7620\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread</span> shall be eaten.","22":"And upon that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> for himself and for all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> for a sin offering.","23":"And <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H352\">rams</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> and a <span class=\"wl wl-kjv\" data-code=\"H8163\">kid</span> of the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> for a sin offering.","24":"And he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> of an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> for a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> for a <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and an <span class=\"wl wl-kjv\" data-code=\"H1969\">hin</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> for an ephah.","25":"In the <span class=\"wl wl-kjv\" data-code=\"H7651\">seventh</span> month, in the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> the like in the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of the <span class=\"wl wl-kjv\" data-code=\"H7637\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> according to the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> according to the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and according to the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and according to the oil."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gijlieden nu het land","tekst":"Dewijl niet alleen de vorige tempel verbrand, maar ook de stad en het ganse land verwoest en het volk Gods weggevoerd was, en in het voorgaande van den nieuwen tempel gehandeld is, zo wordt nu in het volgende gesproken van het land en volk, met hun vorst; afbeeldende een gehele en volkomen herstelling van deze geestelijke republiek onder den Messias."},{"catchword":"zult doen vallen in erfenis,","tekst":"Dat is, door het vallen of werpen van het lot zult delen onder u; zie Psa 16:5-6 , met de aantekening, alzo onder Eze 46:14 , Eze 46:22 , en Eze 48:29 ; in allen gevallen zie de manier van spreken op de loting, hoewel het lot noch hier noch in het volgende uitdrukkelijk vermeld wordt. Het is aanmerkelijk dat de stammen hunne landpalen niet bij loting, gelijk in het boek Jozua, maar door Gods bijzondere ordinantie in Eze 48 worden toegelegd; vergelijk Mat 25:34 ."},{"catchword":"hefoffer den HEERE offeren,","tekst":"Of gave. Hebreeuws, ene heffing heffen, waarmede gezien wordt op de hefoffers der wet, die van de rest als opgeheven of opgenomen en den Heere opgedragen en geheiligd werden."},{"catchword":"heilige plaats,","tekst":"Te weten, afzonderende dezelve van de rest des lands tot een heilig gebruik; of, men kan [met sommigen] deze woorden voegen bij het woord offeren aldus: Gij zult den Heere offeren van het land een heilig deel, alzo vs.4. Hebreeuws, ene heiligheid."},{"catchword":"meetrieten ,","tekst":"Dit ingevoegde woord genomen uit boven Eze 42:15-20 , en hier vs.2, waar naar de eerste maat der rieten, de ellen in het bijzonder gespecificeerd worden, voor het ledig, of de vrije buitenruimte."},{"catchword":"in zijn gehele grenzen rondom","tekst":"Dat is, zo wijd en ver als het reikt."},{"catchword":"heilig zijn","tekst":"Hebreeuws, ene heiligheid. Zie boven Eze 43:12 ."}],"2":[{"catchword":"Hiervan","tekst":"Deze stof, die hier begonnen en vs.9 afgebroken is, wordt in Eze 48:8 , enz. vervolgd. Men kan het in het geheel bekwamelijk aldus met sommigen verstaan dat dit afgezonderd gedeelte des lands, van vijf en twintig duizend in lengte en breedte, en zo voorts, aan zijne vier hoeken, verder is afgedeeld in drie delen; de eerste tien duizend in breedte, voor het heiligdom met zijn buitenruimte en de woningen der priesters; de tweede tien duizend voor de Levieten; de overschietende vijf duizend voor de stad; en wat er voorts oostwaarts en westwaarts, tussen de zuidelijke grenzen van Juda en de noordelijke grenzen van Benjamin overschoot, voor de dienaars der stad [onder Eze 48:18-19 ] , en wijders voornamelijk voor den vorst; waarop in het volgende dient gelet."},{"catchword":"zullen tot het heiligdom zijn","tekst":"Hebreeuws, zal."},{"catchword":"met vijfhonderd,","tekst":"Of, door, bij; dat is, [naar sommiger gevoelen] vijfhonderd rieten in lengte, met gelijke vijfhonderd in breedte; of vijfhonderd overeenkomende met andere vijfhonderd in het vierkant rondom gemeten; vergelijk onder Eze 48:20 ."},{"catchword":"buitenruim rondom","tekst":"Zie van het Hebreeuwse woord [dat anderszins voorstad wordt overgezet, als er van steden gesproken wordt] boven Eze 36:5 ."}],"3":[{"catchword":"van deze maat,","tekst":"Dat is, met of naar deze maat."},{"catchword":"heilige der heiligen","tekst":"Hebreeuws, heiligheid der heiligheden; zie Exo 26:33-34 ; Lev 4:6 , met de aantekening."}],"4":[{"catchword":"heilige plaats zijn van het land;","tekst":"Gelijk vs.1."}],"5":[{"catchword":"de lengte hebben","tekst":"Zie onder Eze 48:13 ."}],"6":[{"catchword":"stad zult gij geven","tekst":"Die niet genoemd wordt. Zie boven Eze 40:2 ."},{"catchword":"heilig hefoffer;","tekst":"Hebreeuws, hefoffer der heiligheid; waarvan boven vs.1, alzo in het volgende."}],"7":[{"catchword":"vorst nu zal zijn deel hebben","tekst":"Door dezen vorst, van welken in dit hfdst. en het volgende, Eze 46 , veel wordt gesproken, verstaan sommigen [gelijk boven Eze 44:3 ] , den hogepriester, of onzen Heere Christus den Messias zelf, die niet alleen in zijn huis woont en dat met zijne heerlijkheid vervult, maar ook rondom hetzelve zich [om zo te spreken] legert, om dat als koning te beschermen, en die als onze hogepriester en borg al onze schuld op zich genomen hebbende, voor dezelve [alsof het zijn eigen ware] betaald, en zichzelven voor ons [alsof het was voor zichzelven, omdat Hij in onze plaats stond] vrijwillig opgeofferd heeft; idem die niet alleen een koning of vorst is, maar ook een broeder en medegenoot der gelovigen, die Hij zijne medeërfgenamen maakt, zijnde steeds in het midden van hen en met hen, tot aan de voleinding der wereld, biddende voor hen als hun Middelaar, hebbende alleen de macht en het recht zijns weegs in en uit te gaan, zijn leven te laten en weder te nemen, de poort van het heiligdom te openen en te sluiten, enz. Anderen verstaan hier een aardsen Christelijken vorst of regent, en daardoor wijders alle Christelijke regenten en"},{"catchword":"vorst nu zal zijn deel hebben","tekst":"overheden, die God zijne kerk in het Nieuwe Testament, naar verscheidene profetieën van het Oude Testament, zou verlenen, welker eerste en voornaamste zorg meot wezen voor den welstand van Gods kerk, die zij met hunne beschutting als omringen moeten, in de oefening van den waren godsdienst en de achting van den kerkedienst het volk met hun voorbeeld voorgaan, ook zich in dezen houden en gedragen als broeders, medegenoten en medeleden der kerk; voorts recht en gerechtigheid aanstellen en handhaven, alle onrecht, overlast, tirannie en geweld afschaffen en den onderdanen een gerust en stil leven verzorgen, totdat de volmaakte gerechtigheid, heiligheid en vrede in het andere leven daarop volgen."},{"catchword":"voor aan het heilig hefoffer,","tekst":"Hebreeuws, voor, of tegen het aangezicht, zo in het volgende."},{"catchword":"westerhoek westwaarts,","tekst":"Hebreeuws, hoek der zee, naar de zee toe, alzo in het volgende, zee voor het westen."}],"8":[{"catchword":"Dit land aangaande,","tekst":"Anders, hij zal het in het land hebben tot, enz., of, van het land zal hij [dit] hebben, enz."},{"catchword":"verdrukken,","tekst":"Vergelijk Psa 72:2 , Psa 72:4 , Psa 72:14 ; Isa 11:3-5 , enz., en Isa 29:18-20 , en Isa 42:1 , Isa 42:3-4 , en Isa 60:17-18 ; Zep 3:13 ."},{"catchword":"laten, naar hun stammen","tekst":"Hebreeuws eigenlijk, geven."}],"9":[{"catchword":"Het is te veel voor u,","tekst":"Zie boven Eze 44:6 . Sommigen verstaan dit alsof God zeide: Gij hebt land, meer dan genoeg voor u, aan hetgeen Ik u toegelegd heb, daarom enz. Anderen houden het voor een verbloemde bestraffing van de overleden koningen van Juda, tot wie God spreekt alsof zij tegenwoordig waren; of van de antichristische kerkelijke en burgerlijke tirannen, die Gods volk zeer lang zouden plagen."},{"catchword":"uitstortingen op van Mijn volk,","tekst":"Dat gij hen uit het hunne verdrijft en uitstoot, trekkende dat aan u; zulk een overlast zult gij van hen wegnemen, hen daarvan ontlasten. Zie gelijke manier van spreken Isa 57:14 ."}],"10":[{"catchword":"rechte waag,","tekst":"Hebreeuws, waag, of weegschalen der gerechtigheid, en alzo in het volgende; gelijk Lev 19:35-36 ."},{"catchword":"efa,","tekst":"Zie Lev 5:11 ."},{"catchword":"bath zult gijlieden hebben","tekst":"Zie 1Ki 7:26 ."}],"11":[{"catchword":"zullen","tekst":"Hebreeuws, zal."},{"catchword":"enerlei mate zijn,","tekst":"Een efa in droge en een bath in natte waren."},{"catchword":"homer houdt;","tekst":"De grootste maat van droge waren. Anders ook genoemd kor. Zie 1Ki 4:22 , en onder vs.14."},{"catchword":"homer","tekst":"Als zijnde de grootste maat, naar welke de anderen moesten geregeld zijn."}],"12":[{"catchword":"sikkel zal zijn van twintig","tekst":"Zie Gen 23:15 , en Gen 24:22 ."},{"catchword":"gera;","tekst":"Zie Lev 27:25 . Het is bij ons zoveel [gelijk het sommigen bekwamelijk op onze munt gepast hebben] als een halve braspenning, van welke twintig een oordje rijksdaalders maken, zoveel als een algemene of burgerlijke sikkel bedroeg, van welken hier gesproken wordt."},{"catchword":"pond zijn","tekst":"Hebreeuws, maneh, dat is mina. Zie 1Ki 10:17 ; 2Ch 9:16 ; Ezr 2:69 , met de aantekening. De zin is, dat zestig sikkels een pond of mina van goud of zilver zouden maken. Dit wordt gehouden, bij sommigen, voor een nieuwe ordinantie, dewijl de oude mina maar vijftig sikkelen van het heiligdom en honderd algemene hield; maar hier staat van zestig sikkelen, hetwelk zoveel meer zou moeten zijn in het heilige en burgerlijke. Eenigen menen dat er zodanige drie verscheidene soorten van munt zouden geweest zijn, die tezamen een pond of mijne zou maken. God wil zeggen dat de gerechtigheid in alles strikt en op het nauwste zal worden onderhouden."}],"13":[{"catchword":"hefoffer,","tekst":"Of, de offeranden die, enz. Hebreeuws, de heffing die gij zult heffen. Dit verstaan sommigen van hetgeen het volk het ganse jaar door zou opbrengen tot de gewone offeranden des tempels. [Anderen duiden het op de inwijding des tempels]. Van de offeranden in het algemeen, zie boven Eze 40:39 ."},{"catchword":"zesde deel van een efa","tekst":"Hebreeuws alsof men zeide: zessen; dat is het zesde deel geven; gelijk vertienen, het tiende deel geven."}],"14":[{"catchword":"kor,","tekst":"Zie boven vs.11."}],"15":[{"catchword":"waterrijke land van Israël,","tekst":"Dat is, uit het beste en vetste weiden. Anders: boven den wijn, of den drank van Israël; dat is, dien Israël zou opbrengen tot drankoffers; vergelijk vs.17."}],"16":[{"catchword":"in dit hefoffer zijn,","tekst":"Of, zullen tot dit hefoffer, [waarvan in het voorgaande gesproken] [gehouden, of verplicht zijn]."},{"catchword":"voor den vorst in Israël","tekst":"Of, om den wil van den vorst. Sommigen verstaan het alzo, dat zij met deze contributie vervullen zouden hetgeen anders de vorst zou doen. VergelijK 2Ch 31:3 , met de aantekening. Anders: met den vorst; idem, tot den vorst toe, zulks dat de vorst daartoe niet gehouden is, als wiens bijzondere offeranden in het volgende verhaald worden. Men zou het ook kunnen nemen als een inhoud of titel van het volgende, en daarbij voegen aldus: Aangaande den vorst in Israël, of van den vorst, enz.; [gelijk zulke titels bij de profeten gevonden worden], die zal doen gelijk volgt."}],"17":[{"catchword":"opliggen te offeren de brandofferen,","tekst":"Hebreeuws, op den vorst zal zijn; dat is, het zal zijn plicht zijn."},{"catchword":"op alle gezette hoogtijden van het huis Israëls;","tekst":"Of, in alle gezette bijeenkomsten."},{"catchword":"doen,","tekst":"Of, bereiden; dat is geven, aanbrengen, laten toemaken."}],"18":[{"catchword":"Alzo zegt de Heere HEERE","tekst":"De volgende nieuwe ordinantie hebben enigen wel aangemerkt, dat Mozes nergens tevoren gegeven was, gelijk ook buiten dat, het onderscheid dat er is tussen verscheidene nieuwe offeranden en ceremoniën, die hier worden vermeld, en de oude voorgaande, uit de verlijking klaarlijk kan worden afgeleid, tot een teken van de afschaffing der ceremoniën en van het vorige priesterdom door de komst en het enig volkomen offer van den Messias, dat hier door vele offeranden wordt afgebeeld naar den stijl van het Oude Testament en den eis van dien tijd, als de klaarheid des lichts en de tijd der herstelling nog niet gekomen was. Zie Gal 3:23-25 , en Gal 4:1-3 ; idem Heb 9:8 , Heb 9:10 ."},{"catchword":"jong rund, nemen;","tekst":"Hebreeuws, kind, of zoon van een rund."}],"19":[{"catchword":"posten des huizes,","tekst":"Hebreeuws, post, en zo in het volgende."}],"20":[{"catchword":"vanwege den afdwalende,","tekst":"Dat is, voor zodanigen, die door enige afdwaling, of slechtheid, onwetendheid, onverstand, het huis des Heeren mogen hebben ontsticht of verontreinigd, maar niet door moedwil en met opgeheven hand, afbeeldende deze ordinantie, hoe men den zwakken gevallen boetvaardigen zal te hulp komen en oprichten, door middel van een welgeregelde en Christelijke tucht; vergelijk Mat 16:19 , en Mat 18:18 , Mat 18:21 , enz.; Joh 20:23 ; Rom 14:4 , Rom 14:10 , Rom 14:13 ; Gal 6:1 , enz.; Jam 5:19-20 ; 1Jo 5:16 , enz."}],"21":[{"catchword":"zal men eten","tekst":"Hebreeuws, zal gegeten worden."}],"22":[{"catchword":"des zondoffers","tekst":"Een var tot een zondoffer. Hebreeuws, een var der zonde; dat is, des zondoffers, gelijk doorgaans in deze stof. Zie Lev 4:3 ."}],"24":[{"catchword":"hin olie tot een efa","tekst":"Zie Lev 19:36 ."}],"25":[{"catchword":"feest","tekst":"Versta, het feest der loofhutten, of tabernakelen. Merk, dat aan het pinksterfeest hier niet gedacht wordt; vergelijk Zec 14:16 , Zec 14:19 ."},{"catchword":"desgelijks doen,","tekst":"Hebreeuws, naar, of gelijk die; dat is, zoals hij op het voorgaande feest gedaan zal hebben met al deze offeranden, die tevoren verhaald zijn en hier kortelijk worden aangeroerd."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now, when ye shall cause the land to fall for inheritance, [that is, shall by the falling or casting of the lot divide the land among you. See Psa 16:5,6 with the Annotat. So below chapter 47.14,22. and 48.29. in every caf&Atilde;&copy; fee the phrase in the casting or drawing of lots; though the lot be not expressly mentioned here, nor in the sequel. And it is worthy observation, that the tribes had their borders assigned to them not by casting of lots, as in the book of Joshua, but the express ordinances of God, in c. 48. compare Matthew25.34.] then shall ye offer a heave-offering unto the Lord, [or, gifts, &c. Heb. Heave a heaving: whereby respect is had to the heave-offering of the law, that were (as it were) lifted up, or taken up from the rest, and were presented and consecrated unto the Lord] (for) a holy place of the land; [to wit, separating it from the rest of the land for a holy life. Or, we may (with some) joy these words to the word offering, thus, ye shall offer unto the Lord a holy portion of the land: so verse 4. Heb. A holiness. Forasmuch as not onely the former temple was burnt, but also the city and all the land laid waist. And the people of God carried away captive, and in the former chapters is treated of the new temple; therefore now in the sequel here mention is made of the land and the people with their prince, representing a full and perfect restauration of this spiritual common-wealth under the Messiah] the length shall be the length of the five and twenty thousand (measuring reeds), and the breadth thousand: [This that is here inserted is taken from above chapter 42.15,16,17,18,19,20 and here the next verse; where after the first measure of the reeds, the ells in particular are specified, for the empty, or free outward space] that shall be holy [Heb. A holiness. See above chapter 43.12.] In the whole border thereof round about. [That is, as wide and as far as it reacheth]"}],"2":[{"catchword":null,"tekst":"At this (there) shall be [Heb. Shall be, in the singular number] for the sanctuary five hundred with five hundred square round about: [Or, by, &c. that is, (according to the opinion of some) five hundred reeds in length, with like five hundred reeds in length, with like five hundred in breadth: Or five hundred answering to other five hundred measured in the square round about. Compare below chapter 48.20.] And it shall have fifty ells for an outer space round about. [see of the Hebrew word rendered here space, (which otherwise is rendered suburbs, when there is mention made of cities) above chapter 36 on verse 5. this matter that is begun here, and broken off verse 9 is prosecuted in chapter 48 on verse 8, c. we may in general sitly understand it (with some) thus: that this separate portion of the land of five and twenty thousand reeds in the length and breadth, and so forth in four square, was further divided into three parts; the first ten thousand in breadth, for the sanctuary with its outwards space, and the habitations of the priests: the second ten thousand for the Levites, the remaining five thousand for the city: and which remained eastward and westward, between the south-borders of Juda and the north-borders of Benjamin, for the offices or ministers of the city, (chapter 48.18,19.) and besides chiefly for the prince: which is to be heeded in the sequel]"}],"3":[{"catchword":null,"tekst":"So of this measure [that is, with, according to this measure] shalt thou measure the length of five and twenty thousand? And the breadth of ten thousand: and in it shall be the sanctuary, (with) the holy of holies. [Heb. Holiness of holiness. See Exo 26:33,34 Lev 4:6. With Annotat.]"}],"4":[{"catchword":null,"tekst":"That shall be a holy place of the land; [as verse 1 it shall be for the priests which ministers in the sanctuary, which come near to minister unto the Lord: and it shall be unto them a place for houses, and a holy place for the sanctuary."}],"5":[{"catchword":null,"tekst":"Moreover, the Levites, the ministers of the house, shalt have the length of five and twenty thouse, and the breadth of ten thousand, [see below chapter 48.13.] for a possession into themselves (for) twenty chambers."}],"6":[{"catchword":null,"tekst":"And (for) the possession of the city [Which is not named. See above chapter 40. On verse on verse 2.] Ye shall give the breadth of five thousand, and the length of five and twenty thousand, over against the holy heave-offering: [Heb. Heave-offering of holiness: whereof above verse 1. so in the sequel] it shall be for the whole house of Israel."}],"7":[{"catchword":null,"tekst":"Now the Prince shall have (his portion) on this (side) and on that side of the holy heave-offering, and of the possessi // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

    if (!lijst || !lijst.length) return '';

        if (kortCw) {

    } else {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
