 de koning van Babel.", "11": "Hij, en zijn volk met hem, de meest gewelddadige van de heidenvolken zullen aangevoerd worden, om het land te verderven; en zij zullen hun zwaarden tegen Egypte trekken, en het land met verslagenen vullen.", "12": "En Ik zal de rivieren tot droogte maken, en het land verkopen in de hand van de bozen; en Ik zal het land met alles wat erin is verwoesten door de hand van vreemden: Ik, de HEERE, heb het gesproken.", "13": "Zo zegt de Heere HEERE: Ik zal ook de drekgoden[1] verdelgen, en de nietige afgoden doen ophouden uit Nof; en er zal geen vorst meer zijn uit Egypteland; en Ik zal een vrees in Egypteland leggen.", "14": "En Ik zal Pathros verwoesten, en een vuur aansteken in Zoan; en Ik zal gerichten voltrekken in No.", "15": "En Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien.", "16": "En Ik zal een vuur in Egypte aansteken; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.", "17": "De jongemannen van Aven en Pibeseth zullen door het zwaard vallen, en de dochters zullen in de gevangenschap gaan.", "18": "En te Tachpanhes zal de dag verduisterd worden, als Ik het juk van Egypte daar zal verbreken, en de hoogmoed van zijn sterkte in haar zal ophouden; haar zal een wolk bedekken, en haar dochters zullen in de gevangenschap gaan.", "19": "Zo zal Ik gerichten voltrekken in Egypte; en zij zullen weten dat Ik de HEERE ben.", "20": "Ook gebeurde het in het elfde jaar, in de eerste maand, op de zevende van de maand, dat het woord van de HEERE tot mij kwam: het zei:", "21": "Mensenkind! Ik heb de arm van Farao, de koning van Egypte, gebroken; en zie, hij zal niet verbonden worden om te genezen, door er pleisters op te leggen, door er een windsel om te doen, om hem te verbinden, om hem sterk te maken, zodat hij het zwaard kan vasthouden.", "22": "Daarom zegt de Heere HEERE zo: Zie, Ik keer Mij tegen Farao, de koning van Egypte, en zal zijn armen breken, zowel de sterke als de gebroken arm; en Ik zal het zwaard uit zijn hand doen vallen.", "23": "En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen.", "24": "En Ik zal de armen van de koning van Babel sterken, en Mijn zwaard in zijn hand geven; maar Farao's armen zal Ik breken, zodat hij voor zijn aangezicht zal kermen, zoals een dodelijk gewonde kermt.", "25": "Ja, Ik zal de armen van de koning van Babel sterken, maar Farao's armen zullen daarheen vallen; en zij zullen weten dat Ik de HEERE ben, als Ik Mijn zwaard in de hand van de koning van Babel zal hebben gegeven, en hij dat over Egypteland zal hebben uitgestrekt.", "26": "En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen; zo zullen zij weten dat Ik de HEERE ben."}, "SV": {"1": "Wijders geschiedde des HEEREN woord tot mij, zeggende:", "2": "Mensenkind! profeteer, en zeg: Zo zegt de Heere HEERE: Huilt: Ach die dag!", "3": "Want de dag is nabij, ja, de dag des HEEREN is nabij, een wolkige dag, het zal der heidenen tijd zijn.", "4": "En het zwaard zal komen in Egypte, en er zal grote smart zijn in Morenland, als de verslagenen zullen vallen in Egypte; want zij zullen derzelver menigte wegnemen, en haar fondamenten zullen verbroken worden.", "5": "Morenland, en Put, en Lud, en al de gemengde hoop, en Cub, en de kinderen van het land des verbonds zullen met hen vallen door het zwaard.", "6": "Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hovaardij harer sterkte zal nederdalen; van den toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.", "7": "En zij zullen verwoest worden in het midden der verwoeste landen; en haar steden zullen zijn in het midden der verwoeste steden.", "8": "En zij zullen weten, dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben gelegd, en al haar helpers zullen verbroken worden.", "9": "Te dien dage zullen er boden van voor Mijn aangezicht in schepen uitvaren, om het zorgeloze Morenland te verschrikken; en er zal grote smart bij hen zijn, als in den dag van Egypte; want ziet, het komt aan!", "10": "Zo zegt de Heere HEERE: Ja, Ik zal de menigte van Egypte doen ophouden, door de hand van Nebukadrezar, den koning van Babel.", "11": "Hij, en zijn volk met hem, de tirannigste der heidenen zullen aangevoerd worden, om het land te verderven; en zij zullen hun zwaarden tegen Egypte uittrekken, en het land met verslagenen vervullen.", "12": "En Ik zal de rivieren *tot* droogte maken, en het land verkopen in de hand der bozen; en Ik zal het land met zijn volheid verwoesten door de hand der vreemden: Ik, de HEERE, heb het gesproken.", "13": "Zo zegt de Heere HEERE: Ik zal ook de drekgoden verdoen, en de nietige afgoden doen ophouden uit Nof; en er zal geen vorst meer zijn uit Egypteland; en Ik zal een vreze in Egypteland stellen.", "14": "En Ik zal Pathros verwoesten, en een vuur leggen in Zoan; en Ik zal gerichten oefenen in No.", "15": "En Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien.", "16": "En Ik zal een vuur in Egypte leggen; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.", "17": "De jongelingen van Aven en Pibeseth zullen door het zwaard vallen, en de *dochters* zullen gaan in de gevangenis.", "18": "En te Tachpanhes zal de dag verduisterd worden , als Ik het juk van Egypte aldaar zal verbreken, en de hovaardij harer sterkte in haar zal ophouden; haar zal een wolk bedekken, en haar dochters zullen gaan in de gevangenis.", "19": "Alzo zal Ik gerichten oefenen in Egypte; en zij zullen weten, dat Ik de HEERE ben.", "20": "Ook gebeurde het in het elfde jaar, in de eerste *maand*, op den zevenden der maand, *dat* het woord des HEEREN tot mij geschiedde, zeggende:", "21": "Mensenkind! Ik heb den arm van Farao, den koning van Egypte, verbroken; en ziet, hij zal niet verbonden worden, met pleisters op te leggen, met een windeldoek aan te doen, om dien te verbinden, om dien te sterken, dat hij het zwaard houde.", "22": "Daarom zegt de Heere HEERE alzo: Ziet, Ik *wil* aan Farao, den koning van Egypte, en zal zijn armen verbreken, *beide* den sterken en den verbrokenen; en Ik zal het zwaard uit zijn hand doen vallen.", "23": "En Ik zal de Egyptenaars verstrooien onder de heidenen, en zal hen verspreiden in de landen.", "24": "En Ik zal de armen des konings van Babel sterken, en Mijn zwaard in zijn hand geven; maar Farao’s armen zal Ik verbreken, dat hij voor zijn aangezicht zal kermen, gelijk een dodelijk verwonde kermt.", "25": "Ja, Ik zal de armen des konings van Babel sterken, maar Farao’s armen zullen daarhenen vallen; en zij zullen weten, dat Ik de HEERE ben, als Ik Mijn zwaard in de hand des konings van Babel zal hebben gegeven, en hij datzelve over Egypteland zal hebben uitgestrekt.", "26": "En Ik zal de Egyptenaars verstrooien onder de heidenen, en zal hen verspreiden in de landen; alzo zullen zij weten, dat Ik de HEERE ben."}, "KJV": {"1": "The word of the LORD came again unto me, saying,", "2": "Son of man, prophesy and say, Thus saith the Lord GOD; Howl ye, Woe worth the day!", "3": "For the day *is* near, even the day of the LORD *is* near, a cloudy day; it shall be the time of the heathen.", "4": "And the sword shall come upon Egypt, and great pain shall be in Ethiopia, when the slain shall fall in Egypt, and they shall take away her multitude, and her foundations shall be broken down.", "5": "Ethiopia, and Libya, and Lydia, and all the mingled people, and Chub, and the men of the land that is in league, shall fall with them by the sword.", "6": "Thus saith the LORD; They also that uphold Egypt shall fall; and the pride of her power shall come down: from the tower of Syene shall they fall in it by the sword, saith the Lord GOD.", "7": "And they shall be desolate in the midst of the countries *that are* desolate, and her cities shall be in the midst of the cities *that are* wasted.", "8": "And they shall know that I *am* the LORD, when I have set a fire in Egypt, and *when* all her helpers shall be destroyed.", "9": "In that day shall messengers go forth from me in ships to make the careless Ethiopians afraid, and great pain shall come upon them, as in the day of Egypt: for, lo, it cometh.", "10": "Thus saith the Lord GOD; I will also make the multitude of Egypt to cease by the hand of Nebuchadrezzar king of Babylon.", "11": "He and his people with him, the terrible of the nations, shall be brought to destroy the land: and they shall draw their swords against Egypt, and fill the land with the slain.", "12": "And I will make the rivers dry, and sell the land into the hand of the wicked: and I will make the land waste, and all that is therein, by the hand of strangers: I the LORD have spoken", "13": "Thus saith the Lord GOD; I will also destroy the idols, and I will cause *their* images to cease out of Noph; and there shall be no more a prince of the land of Egypt: and I will put a fear in the land of Egypt.", "14": "And I will make Pathros desolate, and will set fire in Zoan, and will execute judgments in No.", "15": "And I will pour my fury upon Sin, the strength of Egypt; and I will cut off the multitude of No.", "16": "And I will set fire in Egypt: Sin shall have great pain, and No shall be rent asunder, and Noph *shall have* distresses daily.", "17": "The young men of Aven and of Pibeseth shall fall by the sword: and these *cities* shall go into captivity.", "18": "At Tehaphnehes also the day shall be darkened, when I shall break there the yokes of Egypt: and the pomp of her strength shall cease in her: as for her, a cloud shall cover her, and her daughters shall go into captivity.", "19": "Thus will I execute judgments in Egypt: and they shall know that I *am* the LORD.", "20": "And it came to pass in the eleventh year, in the first *month*, in the seventh *day* of the month, *that* the word of the LORD came unto me, saying,", "21": "Son of man, I have broken the arm of Pharaoh king of Egypt; and, lo, it shall not be bound up to be healed, to put a roller to bind it, to make it strong to hold the sword.", "22": "Therefore thus saith the Lord GOD; Behold, I *am* against Pharaoh king of Egypt, and will break his arms, the strong, and that which was broken; and I will cause the sword to fall out of his hand.", "23": "And I will scatter the Egyptians among the nations, and will disperse them through the countries.", "24": "And I will strengthen the arms of the king of Babylon, and put my sword in his hand: but I will break Pharaoh's arms, and he shall groan before him with the groanings of a deadly wounded", "25": "But I will strengthen the arms of the king of Babylon, and the arms of Pharaoh shall fall down; and they shall know that I *am* the LORD, when I shall put my sword into the hand of the king of Babylon, and he shall stretch it out upon the land of Egypt.", "26": "And I will scatter the Egyptians among the nations, and disperse them among the countries; and they shall know that I *am* the LORD."}}, "tsk": {"2": [{"kopje": "Huil", "refs": ["Ezech 21:12", "Jes 13:6", "Jes 14:31", "Jes 15:2", "Jes 16:7", "Jes 23:1", "Jes 23:6", "Jes 65:14", "Jer 4:8", "Jer 47:2", "Joël 1:5", "Joël 1:11", "Zef 1:11", "Zach 11:2", "Jak 5:1", "Openb 18:10"]}], "3": [{"kopje": "de dag is", "refs": ["Ezech 7:7", "Ezech 7:12", "Ps 37:13", "Obadja 1:15", "Joël 2:1", "Zef 1:7", "Zef 1:14", "Matt 24:33", "Fil 4:5", "Jak 5:9", "Openb 6:17"]}, {"kopje": "wolkige", "refs": ["Ezech 30:18", "Ezech 32:7", "Ezech 34:12", "Ex 14:20", "Ex 14:24", "Jes 19:1", "Joël 2:1", "Joël 2:2", "Amos 5:16-20"]}, {"kopje": "de tijd", "refs": ["Ezech 29:12", "Ps 110:6", "Ps 149:7-9", "Jes 24:21-23", "Jes 34:2-17", "Jer 25:15-29", "Joël 3:11-14", "Zef 3:6", "Zef 3:7", "Zach 14:3-19", "Openb 19:13-21"]}], "4": [{"kopje": "het zwaard", "refs": ["Ezech 29:8", "Jes 19:2", "Jer 50:35-37"]}, {"kopje": "smart", "refs": ["Ez  "svLabel": null}, {"disp": "1 Kor 10:6", "href": "../../1-korinthe/10/#v6", "ref": "1 Kor 10:6", "svLabel": null}, {"disp": "1 Kor 10:11", "href": "../../1-korinthe/10/#v11", "ref": "1 Kor 10:11", "svLabel": null}, {"disp": "Openb 2:23", "href": "../../openbaring/2/#v23", "ref": "Openb 2:23", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ezech 33:29": "Dan zullen zij weten dat Ik de HEERE ben, wanneer Ik het land tot een verwoesting en een schrik gemaakt heb, om al hun gruwelen die zij gedaan hebben.", "1 Kor 3:18": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Amos 1:7": "Daarom zal Ik een vuur zenden in de muur van Gaza, dat zal haar paleizen verteren.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Jes 64:2": "Zoals een smeltvuur brandt, en het vuur het water doet opborrelen, om Uw Naam aan Uw tegenstanders bekend te maken! Laat zo de heidenen voor Uw aangezicht beven.", "Jes 13:10": "Want de sterren van de hemel en zijn sterrenbeelden zullen hun licht niet laten schijnen; de zon zal verduisterd worden wanneer zij opgaat, en de maan zal haar licht niet laten schijnen.", "Amos 1:4": "Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren.", "Ps 78:43": "Hoe Hij Zijn tekenen stelde in Egypte, en Zijn wonderen in het veld van Zoan;", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Jes 18:1": "Wee het land dat schaduwachtig is aan de grenzen, dat aan de kant van de rivieren van Morenland ligt;", "Ezech 30:14-16": "En Ik zal Pathros verwoesten, en een vuur aansteken in Zoan; en Ik zal gerichten voltrekken in No. En Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien. En Ik zal een vuur in Egypte aansteken; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.", "Ezech 31:1": "Het gebeurde ook in het elfde jaar, in de derde maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam:", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Jes 23:1": "De last van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt.", "Matt 24:33": "Zo ook u, wanneer u al deze dingen zult zien, weet dan dat het nabij is, voor de deur.", "Ps 20:9": "Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven.", "Jer 37:7": "Zo zegt de HEERE, de God van Israël: Zo zult u zeggen tegen de koning van Juda, die u naar Mij gestuurd heeft om Mij te raadplegen: Zie, het leger van Farao, dat u ter hulp is uitgetrokken, zal terugkeren naar zijn land, naar Egypte;", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Joël 3:11-14": "Verzamel u en kom aan, alle volken van rondom, en verzamel u! (O HEERE, laat Uw helden daarheen neerdalen!) De heidenvolken zullen zich opmaken en optrekken naar het dal van Josafat; want daar zal Ik zitten om te richten alle heidenvolken van rondom. Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot.", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Deut 28:50": "Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge.", "Spr 23:4": "Vermoei u niet om rijk te worden; zie af van uw eigen vernuft.", "Ezech 29:3": "Spreek en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Farao, koning van Egypte! die grote zeedraak, die in het midden van zijn rivieren ligt; die zegt: Mijn rivier is van mij, en ik heb die voor mijzelf gemaakt.", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "1 Kor 10:6": "En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "Ezech 24:15": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Ps 149:7-9": "om wraak te doen over de heidenvolken, en bestraffingen over de volken, om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien, om het geschreven recht over hen te voltrekken. Dit zal de eer van al Zijn gunstgenoten zijn. Halleluja!", "Job 18:3": "Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen?", "Deut 29:18": "Dat onder u niet iemand is, man of vrouw, of gezin, of stam, die zijn hart heden afwendt van de HEERE, onze God, om de goden van deze volken te gaan dienen; dat onder u niet een wortel is, die gal en alsem draagt;", "Jes 13:6": "Huil, want de dag van de HEERE is nabij; hij komt als een verwoesting van de Almachtige.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Jer 27:6-8": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken. En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Amos 1:12": "Daarom zal Ik een vuur zenden in Teman, dat zal de paleizen van Bozra verteren.", "Nahum 1:4": "Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Num 31:15": "En Mozes zei tegen hen: Hebt u dan alle vrouwen laten leven?", "Jes 56:12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Ezech 14:8": "En Ik zal Mijn aangezicht tegen die man zetten, en zal hem stellen tot een teken en tot een spreekwoord, en zal hem uitroeien uit het midden van Mijn volk; en u zult weten dat Ik de HEERE ben.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Ezech 33:1": "En het woord van de HEERE kwam tot mij:", "Ezech 32:12": "Ik zal uw menigte vellen door de zwaarden van de helden, die allemaal samen de meest tirannieke van de heidenvolken zijn; die zullen de hoogmoed van Egypte verstoren, en haar hele menigte zal verdelgd worden.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "Hand 2:10": "En Frygië en Pamfylië, Egypte en de delen van Libië bij Cyrene, en Romeinen die hier wonen, zowel Joden als Jodengenoten,", "Ezech 38:22": "En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Num 31:35": "En van de mensen, de zielen uit de vrouwen die geen gemeenschap met een man hadden gehad, waren alle zielen tezamen tweeëndertigduizend.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "Zach 10:12": "En Ik zal hen sterken in de HEERE, en in Zijn Naam zullen zij wandelen, spreekt de HEERE.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "Ezech 32:7": "En als Ik u zal uitblussen, zal Ik de hemel bedekken en zijn sterren zwart maken; Ik zal de zon met wolken bedekken, en de maan zal haar licht niet laten schijnen.", "Ezech 26:6": "En haar dochters, die in het veld zijn, zullen met het zwaard gedood worden; en zij zullen weten dat Ik de HEERE ben.", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Rom 9:17": "Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "Ezech 28:7": "Daarom zie, Ik zal vreemden over u brengen, de meest tirannieke van de heidenvolken; die zullen hun zwaarden trekken tegen de schoonheid van uw wijsheid, en zullen uw glans ontheiligen.", "Klaagl 2:22": "Thau. Gij hebt mijn verschrikkingen van rondom geroepen, als tot een dag van een gezet hoogtijd; en er is niemand aan de dag van de toorn van de HEERE ontkomen of overgebleven; die ik op de handen gedragen en opgevoed heb, die heeft mijn vijand omgebracht.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Hos 9:6": "Want zie, zij gaan weg vanwege de verwoesting; Egypte zal ze verzamelen, Memfis zal ze begraven; hun begeerlijke plaatsen voor hun zilver zullen door netels bezet worden, doornen zullen in hun tenten zijn.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Ezech 39:11-20": "En op die dag zal het gebeuren dat Ik aan Gog daar een graf zal geven in Israël, het dal van de doorgangers ten oosten van de zee; en dat zal de doorgangers de neus stoppen; en daar zullen zij Gog begraven en zijn hele menigte, en zij zullen het noemen: Het dal van Gogs menigte. Het huis van Israël nu zal hen begraven, om het land te reinigen, zeven maanden lang. Ja, heel het volk van het land zal begraven, en het zal hun tot een naam zijn, op de dag dat Ik verheerlijkt zal zijn, spreekt de Heere HEERE.", "Jes 20:3": "Toen zei de HEERE: Zoals Mijn knecht Jesaja naakt en barrevoets rondloopt, drie jaren, tot een teken en wonder over Egypte en over Morenland;", "Jes 19:4": "En Ik zal de Egyptenaars overleveren in de hand van harde heren, en een strenge koning zal over hen heersen, spreekt de Heere HEERE van de heerscharen.", "Jer 43:13": "En hij zal de opgerichte beelden van Beth-semes, dat in Egypteland is, verbreken; en hij zal de huizen van de goden van Egypte met vuur verbranden.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "1 Sam 2:3-5": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan. De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord. Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Ezech 17:1": "En het woord van de HEERE kwam tot mij en zei:", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "Joël 1:11": "De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst van het veld is vergaan.", "Ezech 33:33": "Maar wanneer dat komt (zie, het zal komen!) dan zullen zij weten dat er een profeet in hun midden geweest is.", "Ezech 13:10": "Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk.", "Jer 50:15": "Juich over haar rondom, zij heeft haar hand gegeven; haar fundamenten zijn gevallen, haar muren zijn afgebroken; want dat is de wraak van de HEERE, wreek u aan haar, doe haar zoals zij gedaan heeft!", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jer 49:31": "Maak u op, trek op tegen het volk dat rust heeft, dat in zekerheid woont, spreekt de HEERE; dat geen deuren noch grendel heeft, dat alleen woont.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Ex 14:31": "Ook zag Israël de grote hand die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde de HEERE, en geloofde in de HEERE, en in Mozes, Zijn dienaar.", "Ezech 34:16": "Het verlorene zal Ik zoeken, en het weggedrevene zal Ik terugbrengen, en het gebrokene zal Ik verbinden, en het zieke zal Ik sterken; maar het vette en het sterke zal Ik verdelgen, Ik zal ze weiden met oordeel.", "Jer 46:14": "Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Jer 43:9": "Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen;", "Ezech 32:11": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.", "Zef 1:14": "De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Mark 12:38": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten;", "Amos 4:2": "De Heere HEERE heeft gezworen bij Zijn heiligheid, dat er, zie, dagen over u zullen komen, dat men u zal optrekken met haken, en uw nakomelingen met visangels.", "Nahum 3:16": "U hebt meer handelaars dan er sterren aan de hemel zijn; de kevers zullen invallen, en ervandaan vliegen.", "Jes 21:1-10": "De last die rust op de woestijn aan de zee. Zoals wervelwinden in het zuiden voorbijtrekken, zo komt het uit de woestijn, uit een schrikwekkend land. Een hard visioen is mij bekendgemaakt: die trouweloze handelt trouweloos, en die verwoester verwoest; trek op, o Elam! beleger het, o Media! Ik heb al haar gezucht doen ophouden. Daarom zijn mijn lendenen vol grote pijn, weeën hebben mij aangegrepen, zoals de weeën van een barende vrouw; ik krom mij van wat ik hoor, ik word ontsteld van wat ik zie.", "Ezech 25:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Jer 46:5": "Waarom zie Ik, dat zij versaagd en achterwaarts gedreven zijn? Zelfs hun helden zijn verslagen, en nemen de vlucht, en zien niet om; er is schrik van rondom, spreekt de HEERE.", "Ezech 28:20": "Verder gebeurde het woord van de HEERE tot mij:", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "Jes 66:19": "En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.", "2 Kor 10:12": "Want wij durven onszelf niet rekenen tot of vergelijken met sommigen, die zichzelf prijzen; maar zij begrijpen niet, dat zij zichzelf met zichzelf meten, en zichzelf met zichzelf vergelijken.", "Ezech 21:19": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ezech 28:10": "U zult de dood van de onbesnedenen sterven, door de hand van vreemden; want Ik heb het gesproken, spreekt de Heere HEERE.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "Ezech 27:35": "Alle inwoners van de eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbijsterd van gezicht.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Jer 51:20-23": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven. En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter. En door u zal Ik in stukken slaan de man en de vrouw; en door u zal Ik in stukken slaan de oude en de jonge; en door u zal Ik in stukken slaan de jongeling en de jonkvrouw.", "Zef 1:11": "Huil, inwoners van de laagte! Want al het volk van koophandel is uitgeroeid, alle zilverdragers zijn uitgeroeid.", "1 Kor 5:2": "En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden?", "Jes 28:18": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden.", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "Num 31:17": "Nu dan, dood alles wat mannelijk is onder de kinderen; en dood elke vrouw die door gemeenschap met een man, een man heeft gekend.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Jes 14:4-26": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Ezech 29:14": "En Ik zal de gevangenschap van de Egyptenaren omkeren, en hen terugbrengen in het land van Pathros, in het land van hun koophandel; en daar zullen zij een nederig koninkrijk zijn.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Jes 23:6": "Vaar over naar Tarsis, huil, u inwoners van het eiland!", "Num 13:22": "En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaar eerder gebouwd dan Zoan in Egypte.", "Ezech 34:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Nahum 3:9": "Morenland en Egypte waren haar macht, en er was geen einde; Put en Lybea waren tot uw hulp.", "Ezech 6:13": "Dan zult u weten dat Ik de HEERE ben, als hun gesneuvelden in het midden van hun drekgoden rondom hun altaren zullen liggen op alle hoge heuvels, op alle toppen van de bergen, en onder elke groene boom, en onder elke dichte eik, de plaats waar zij aan al hun drekgoden een liefelijke reuk brachten.", "Hab 1:6-9": "Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit. Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Ezech 30:4-9": "En het zwaard zal komen in Egypte, en er zal grote smart zijn in Morenland, als de verslagenen zullen vallen in Egypte; want zij zullen zijn menigte wegnemen, en zijn fundamenten zullen worden afgebroken. Morenland, en Put, en Lud, en heel de gemengde hoop, en Cub, en de kinderen van het land van het verbond zullen met hen vallen door het zwaard. Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hoogmoed van zijn sterkte zal neerdalen; van de toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.", "Jer 51:8": "Plotseling is Babel gevallen en verbroken; huil over haar, neem balsem voor haar pijn, misschien zal zij genezen worden.", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Jer 48:15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "Job 24:12": "Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.", "Jer 46:19": "Maak voor u gereedschap van de gevankelijke wegvoering, inwoonster, dochter van Egypte! Want Nof zal tot verwoesting worden, en zal verbrand worden, dat er niemand in woont.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "Ezech 31:18": "Aan wie bent u zo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, u zult neergevoerd worden met de bomen van Eden, tot het onderste van de aarde; in het midden van de onbesnedenen zult u liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn hele menigte, spreekt de Heere HEERE.", "Ezech 7:1": "Daarna kwam het woord van de HEERE tot mij, en Hij zei:", "Ezech 29:1": "In het tiende jaar, in de tiende maand, op de twaalfde dag van de maand, kwam het woord van de HEERE tot mij. Hij zei:", "Ezech 30:21-26": "Mensenkind! Ik heb de arm van Farao, de koning van Egypte, gebroken; en zie, hij zal niet verbonden worden om te genezen, door er pleisters op te leggen, door er een windsel om te doen, om hem te verbinden, om hem sterk te maken, zodat hij het zwaard kan vasthouden. Daarom zegt de Heere HEERE zo: Zie, Ik keer Mij tegen Farao, de koning van Egypte, en zal zijn armen breken, zowel de sterke als de gebroken arm; en Ik zal het zwaard uit zijn hand doen vallen. En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Jes 10:27": "En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Zach 11:2": "Huil, u dennen! Omdat de ceders gevallen zijn, omdat die heerlijke bomen verwoest zijn; huil, u eiken van Basan! Omdat het sterke woud neergevallen is.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Rom 11:17-21": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Jes 14:4-6": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "Ezech 15:1": "En het woord van de HEERE kwam tot mij:", "Ezech 26:1": "En het gebeurde in het elfde jaar, op de eerste van de maand, dat het woord van de HEERE tot mij kwam en zei:", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Jes 19:16": "Op die dag zullen de Egyptenaars zijn als de vrouwen; en zij zullen beven en vrezen vanwege de beweging van de hand van de HEERE van de heerscharen, die Hij tegen hen bewegen zal.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Jes 18:1-6": "Wee het land dat schaduwachtig is aan de grenzen, dat aan de kant van de rivieren van Morenland ligt; Dat gezanten stuurt over de zee, in schepen van biezen op het water! Ga heen, u snelle boden! Naar een volk dat lang en glad is, naar een volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven. Allen, u bewoners van de wereld en u inwoners van de aarde! Als men de banier zal oprichten op de bergen, zult u het zien, en als de bazuin zal blazen, zult u het horen.", "Ezech 20:45": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Job 13:5": "Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen.", "Ezech 26:16": "En alle vorsten van de zee zullen afdalen van hun tronen, en hun mantels van zich doen, en hun gestikte klederen uittrekken; met sidderingen zullen zij bekleed worden, op de aarde zullen zij neerzitten, en elk ogenblik sidderen, en over u ontzet zijn;", "Ezech 32:4-6": "Dan zal Ik u achterlaten op het land, Ik zal u wegwerpen op het open veld; en Ik zal al het gevogelte van de hemel op u laten wonen, en het gedierte van de hele aarde van u verzadigen. En Ik zal uw vlees op de bergen leggen, en de dalen vullen met uw hoogheid. En Ik zal het land waarin u zwemt, met uw bloed drenken tot aan de bergen; en de stromen zullen vol worden van u.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Jes 19:1-15": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste. Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk. En de geest van de Egyptenaren zal uitgeledigd worden in hun binnenste, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en de bezweerders, en de waarzeggers, en de duivelskunstenaars.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Ezech 35:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Joh 13:38": "Jezus antwoordde hem: Zult u uw leven voor Mij geven? Voorwaar, voorwaar, Ik zeg u: De haan zal niet kraaien, totdat u Mij driemaal verloochend zult hebben.", "Jes 34:8": "Want het zal zijn de dag van de wraak van de HEERE, een jaar van vergeldingen, om de rechtszaak van Sion.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "Ezech 24:20": "En ik zei tegen hen: Het woord van de HEERE is tot mij gekomen, en Hij zei:", "Ezech 11:14": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Obadja 1:15": "Want de dag van de HEERE is nabij, over alle heidenvolken; zoals u gedaan hebt, zal u gedaan worden; uw vergelding zal op uw eigen hoofd terugkeren.", "Jer 46:25": "De HEERE van de heerscharen, de God van Israël, zegt: Ziet, Ik zal bezoeking doen over de menigte van No, en over Farao, en over Egypte, en over haar goden, en over haar koningen, ja, over Farao, en over hen die op hem vertrouwen.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Ezech 13:1": "En het woord van de HEERE gebeurde tot mij, en zei:", "Joël 1:5": "Word wakker, dronkaards! En huil, en jammer, alle wijnzuipers! Om de nieuwe wijn, omdat hij van uw mond is afgesneden.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Hos 10:13": "U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.", "Zef 2:11": "Vreselijk zal de HEERE tegen hen zijn, want Hij zal al de goden van de aarde doen uitteren; en ieder uit zijn plaats zal Hem aanbidden, alle eilanden van de heidenvolken.", "Ezech 12:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Richt 2:14": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij gaf hen in de hand van rovers, die hen beroofden; en Hij verkocht hen in de hand van hun vijanden rondom; en zij konden niet meer standhouden voor het aangezicht van hun vijanden.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Ezech 32:17": "Verder gebeurde het in het twaalfde jaar, op de vijftiende dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Spr 21:4": "Hoogheid van de ogen, en trotsheid van het hart, en de ploeging van de goddelozen, zijn zonde.", "Ezech 32:1": "Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Jak 5:1": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen.", "1 Petr 5:3": "ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Jer 34:3": "En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen.", "Ezech 21:3-5": "En zeg tegen het land van Israël: Zo zegt de HEERE: Zie, Ik zál tegen u, en Ik zal Mijn zwaard uit zijn schede trekken; en Ik zal van u uitroeien de rechtvaardige en de goddeloze. Omdat Ik dan van u zal uitroeien de rechtvaardige en de goddeloze, daarom zal Mijn zwaard uit zijn schede uitgaan tegen alle vlees, van het zuiden tot het noorden. En alle vlees zal weten dat Ik, de HEERE, Mijn zwaard uit zijn schede getrokken heb; het zal niet meer terugkeren.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Jer 47:2": "Zo zegt de HEERE: Zie, er komt water op van het noorden, en het zal worden tot een overlopende beek, en zal overlopen het land en de volheid ervan, de stad en wie daarin wonen; en de mensen zullen schreeuwen, en alle inwoners van het land zullen huilen;", "Ex 14:18": "En de Egyptenaren zullen weten dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagens en aan zijn ruiters.", "Zach 2:7-9": "Hoi, Sion! ontkom, u die woont bij de dochter van Babel! Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan. Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Ezech 29:6": "En alle inwoners van Egypte zullen weten dat Ik de HEERE ben, omdat zij voor het huis van Israël een rietstok geweest zijn.", "Jer 44:30": "Zo zegt de HEERE: Zie, Ik zal farao Hofra, de koning van Egypte, geven in de hand van zijn vijanden, en in de hand van hen die zijn ziel zoeken, zoals Ik Zedekia, de koning van Juda, gegeven heb in de hand van Nebukadrezar, de koning van Babel, zijn vijand, die ook zijn ziel zocht.", "Ezech 16:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Ezech 14:7": "Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;", "Amos 2:2": "Daarom zal Ik een vuur in Moab zenden, dat zal de paleizen van Kerioth verteren; en Moab zal sterven met groot gedruis, met gejuich, met geluid van de bazuin.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Ps 75:5-7": "Ik heb gezegd tot de onzinnigen: Wees niet onzinnig; en tot de goddelozen: Verhoog de hoorn niet. Verhoog uw hoorn niet omhoog; spreek niet met stijve hals. Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Ps 110:6": "Hij zal recht doen onder de heidenen; Hij zal het vol dode lichamen maken; Hij zal hem verslaan die het hoofd is over een groot land.", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Ezech 22:17": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Ezech 38:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "1 Kor 10:11": "En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.", "Jes 18:2": "Dat gezanten stuurt over de zee, in schepen van biezen op het water! Ga heen, u snelle boden! Naar een volk dat lang en glad is, naar een volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven.", "Luk 14:9": "en zou hij die u en hem genodigd heeft, komen en tegen u zeggen: Geef deze plaats; en dan zou u met schaamte de laatste plaats moeten innemen.", "Ex 15:14-16": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen. Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten! Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Jer 46:26": "En Ik zal hen geven in de hand van hen die hun ziel zoeken, en in de hand van Nebukadrezar, de koning van Babel, en in de hand van zijn knechten. Maar daarna zal het bewoond worden als in de dagen van ouds, spreekt de HEERE.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Richt 9:14": "Toen zeiden alle bomen tegen de doornstruik: Kom u, wees koning over ons.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "Jes 64:1": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;", "Ezech 13:11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Nahum 3:8": "Bent u beter dan No, de volkrijke, gelegen in de rivieren? die rondom heen water heeft, waarvan de voormuur de zee is, haar muur is van de zee.", "Jer 48:11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Jes 23:9": "De HEERE van de heerscharen heeft het besloten, om de hoogmoed van alle luister te ontheiligen, om alle heerlijksten van de aarde verachtelijk te maken.", "Ps 18:40": "Want U omgordde mij met kracht ten strijde; U deed onder mij nederbukken die tegen mij opstonden.", "Ezech 24:1": "Verder kwam het woord van de HEERE tot mij, in het negende jaar, in de tiende maand, op de tiende dag van de maand, en Hij zei:", "Jer 46:10": "Maar deze dag is van de Heere, de HEERE van de heerscharen, een dag van wraak, dat Hij zich wreekt van Zijn tegenstanders, en het zwaard zal verslinden, en verzadigd, en dronken worden van hun bloed; want de Heere, HEERE van de heerscharen, heeft een slachtoffer in het land van het noorden, aan de rivier Frath.", "Jes 24:4": "Het land treurt, het verwelkt; het aardrijk kwijnt weg, het verwelkt; de hoogsten van het volk van het land kwijnen weg.", "Ezech 21:18": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Jer 43:7-9": "en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes. Toen kwam het woord van de HEERE tot Jeremia te Tachpanhes, en Hij zei: Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen;", "Ezech 12:16": "Toch zal Ik van hen weinige mensen laten overblijven van het zwaard, van de honger en van de pest; opdat zij al hun gruwelen vertellen onder de heidenvolken, waarheen zij komen zullen, en zij zullen weten dat Ik de HEERE ben.", "Ps 48:8": "Met een oostenwind verbreekt U de schepen van Tharsis.", "Jer 46:11": "Ga heen op naar Gilead, en haal balsem, jonkvrouw, dochter van Egypte! Tevergeefs vermenigvuldigt u de medicijnen, er is geen genezing voor u.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Openb 16:12": "En de zesde engel goot zijn schaal uit op de grote rivier, de Eufraat; en zijn water droogde uit, zodat de weg van de koningen die uit het oosten komen, gereed zou worden gemaakt.", "Hab 1:5-11": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt. Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit.", "Richt 18:7": "Toen gingen die vijf mannen heen, en kwamen bij Lais; en zij zagen het volk dat daar te midden woonde, levend in zekerheid, naar de gewoonte van de Sidoniërs, rustig en zorgeloos; en er was geen machthebber die iemand om enige zaak schande aandeed in dat land; ook waren zij ver van de Sidoniërs, en hadden met niemand iets te maken.", "Num 31:18": "Maar laat al de kinderen van vrouwelijk geslacht, die geen gemeenschap met een man hebben gehad, voor u leven.", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Jer 50:35-37": "Het zwaard zal zijn over de Chaldeeën, spreekt de HEERE; en over de inwoners van Babel, en over haar vorsten, en over haar wijzen. Het zwaard zal zijn over de leugenaars, zodat zij dwaas worden; het zwaard zal zijn over haar helden, zodat zij versagen; Het zwaard zal zijn over zijn paarden en over zijn wagens, en over de hele gemengde menigte die in hun midden is, zodat zij worden als vrouwen; het zwaard zal zijn over haar schatten, zodat zij geplunderd worden.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Jes 45:1": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden:", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Ezech 12:21": "Opnieuw kwam het woord van de HEERE tot mij en Hij zei:", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Jer 14:13": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.", "Ezech 29:5": "En Ik zal u in de woestijn achterlaten, u en alle vis van uw rivieren; op het open veld zult u vallen; u zult niet verzameld noch bijeengebracht worden; aan de dieren van de aarde en aan de vogels van de hemel heb Ik u tot voedsel gegeven.", "Hab 3:7": "Ik zag de tenten van Kusan onder de ellende; de gordijnen van het land Midian schudden.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "1 Kor 4:10": "Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Jak 5:9": "Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.", "Ezech 22:23": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Jes 1:6": "Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "2 Kon 24:7": "De koning van Egypte trok voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier de Eufraat, alles ingenomen wat van de koning van Egypte was.", "Zach 10:11": "En Hij zal door de zee gaan, die benauwt, en Hij zal de golven in de zee slaan, en alle diepten van de rivieren zullen opdrogen; dan zal de hoogmoed van Assur neergeworpen worden, en de scepter van Egypte zal wegwijken.", "Ezech 38:11": "en zult zeggen: Ik zal optrekken naar dat dorpland, ik zal komen tot hen die in rust zijn, die veilig wonen, die allemaal wonen zonder muur, en geen grendel of deuren hebben.", "Jes 14:31": "Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "Luk 17:26-30": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Jes 19:2": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.", "Hos 7:9-16": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet. Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles. Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.", "Ezech 35:8": "En Ik zal zijn bergen met zijn gesneuvelden vullen; op uw heuvels, en in uw dalen, en in al uw stromen zullen de gesneuvelden van het zwaard liggen.", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Ex 18:10": "En Jethro zei: Gezegend zij de HEERE, Die u verlost heeft uit de hand van de Egyptenaren, en uit de hand van Farao; Die dit volk van onder de hand van de Egyptenaren verlost heeft!", "Jes 23:5": "Zoals het geweest is bij de tijding over Egypte, zo zal men ook in pijn zijn, als men over Tyrus horen zal.", "Ezech 7:12": "De tijd is gekomen, de dag is genaderd; de koper zij niet blij, en de verkoper klaagt niet; want een brandende toorn is over de gehele menigte van het land.", "Zef 1:8": "En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Ex 10:15": "Want zij bedekten het oppervlak van het hele land, zodat het land verduisterd werd; en zij aten al het groen van het land op, en alle vruchten van de bomen die de hagel had overgelaten; en er bleef niets groens over aan de bomen, noch aan het groen van het veld, in het hele Egypteland.", "Jer 46:13-19": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan. Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is. Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Jak 4:13-15": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Jes 16:7": "Daarom zal Moab over Moab huilen, allemaal zullen zij huilen; over de fundamenten van Kir-hareseth zult u zuchten, zeker, zij zijn gebroken.", "Jer 2:18": "En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?", "Ezech 26:15": "Zo zegt de Heere HEERE tot Tyrus: Zullen niet de eilanden beven van het geluid van uw val, als de dodelijk verwonde zal kermen, wanneer men in het midden van u schrikkelijk zal moorden?", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Zef 1:18": "Ook hun zilver, ook hun goud zal hen niet kunnen redden op de dag van de verbolgenheid van de HEERE; maar door het vuur van het ijver van Hem zal dit hele land verteerd worden; want Hij zal een voleinding maken, zeker, een haastige, met alle inwoners van dit land.", "Fil 4:5": "Uw vriendelijkheid moet bij alle mensen bekend zijn. De Heere is nabij.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Spr 18:11": "Het bezit van de rijke is de stad van zijn sterkte, en als een hoge muur in zijn eigen inbeelding.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Amos 5:16-20": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben. Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE. Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Amos 5:18": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Ezech 18:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jes 20:4": "zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande.", "Jes 10:5": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand!", "Ezech 30:14-18": "En Ik zal Pathros verwoesten, en een vuur aansteken in Zoan; en Ik zal gerichten voltrekken in No. En Ik zal Mijn grimmigheid uitgieten over Sin, de
