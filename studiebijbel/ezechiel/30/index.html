d! Profeteer, en zeg: Zo zegt de Heere HEERE: Huil: Ach, die dag!","3":"Want de dag is dichtbij, ja, de dag van de HEERE is dichtbij, een wolkige dag, het zal de tijd van de heidenvolken zijn.","4":"En het zwaard zal komen in Egypte, en er zal grote smart zijn in Morenland, als de verslagenen zullen vallen in Egypte; want zij zullen zijn menigte wegnemen, en zijn fundamenten zullen worden afgebroken.","5":"Morenland, en Put, en Lud, en heel de gemengde hoop, en Cub, en de kinderen van het land van het verbond zullen met hen vallen door het zwaard.","6":"Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hoogmoed van zijn sterkte zal neerdalen; van de toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.","7":"En zij zullen verwoest worden te midden van de verwoeste landen; en zijn steden zullen zijn te midden van de verwoeste steden.","8":"En zij zullen weten dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben aangestoken, en al zijn helpers zullen verbroken worden.","9":"Op die dag zullen er boden van voor Mijn aangezicht in schepen uitvaren, om het zorgeloze Morenland te verschrikken; en er zal grote smart bij hen zijn, zoals op de dag van Egypte; want zie, het komt eraan!","10":"Zo zegt de Heere HEERE: Ja, Ik zal de menigte van Egypte doen ophouden, door de hand van Nebukadrezar, de koning van Babel.","11":"Hij, en zijn volk met hem, de meest gewelddadige van de heidenvolken zullen aangevoerd worden, om het land te verderven; en zij zullen hun zwaarden tegen Egypte trekken, en het land met verslagenen vullen.","12":"En Ik zal de rivieren tot droogte maken, en het land verkopen in de hand van de bozen; en Ik zal het land met alles wat erin is verwoesten door de hand van vreemden: Ik, de HEERE, heb het gesproken.","13":"Zo zegt de Heere HEERE: Ik zal ook de drekgoden[1] verdelgen, en de nietige afgoden doen ophouden uit Nof; en er zal geen vorst meer zijn uit Egypteland; en Ik zal een vrees in Egypteland leggen.","14":"En Ik zal Pathros verwoesten, en een vuur aansteken in Zoan; en Ik zal gerichten voltrekken in No.","15":"En Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien.","16":"En Ik zal een vuur in Egypte aansteken; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.","17":"De jongemannen van Aven en Pibeseth zullen door het zwaard vallen, en de dochters zullen in de gevangenschap gaan.","18":"En te Tachpanhes zal de dag verduisterd worden, als Ik het juk van Egypte daar zal verbreken, en de hoogmoed van zijn sterkte in haar zal ophouden; haar zal een wolk bedekken, en haar dochters zullen in de gevangenschap gaan.","19":"Zo zal Ik gerichten voltrekken in Egypte; en zij zullen weten dat Ik de HEERE ben.","20":"Ook gebeurde het in het elfde jaar, in de eerste maand, op de zevende van de maand, dat het woord van de HEERE tot mij kwam: het zei:","21":"Mensenkind! Ik heb de arm van Farao, de koning van Egypte, gebroken; en zie, hij zal niet verbonden worden om te genezen, door er pleisters op te leggen, door er een windsel om te doen, om hem te verbinden, om hem sterk te maken, zodat hij het zwaard kan vasthouden.","22":"Daarom zegt de Heere HEERE zo: Zie, Ik keer Mij tegen Farao, de koning van Egypte, en zal zijn armen breken, zowel de sterke als de gebroken arm; en Ik zal het zwaard uit zijn hand doen vallen.","23":"En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen.","24":"En Ik zal de armen van de koning van Babel sterken, en Mijn zwaard in zijn hand geven; maar Farao's armen zal Ik breken, zodat hij voor zijn aangezicht zal kermen, zoals een dodelijk gewonde kermt.","25":"Ja, Ik zal de armen van de koning van Babel sterken, maar Farao's armen zullen daarheen vallen; en zij zullen weten dat Ik de HEERE ben, als Ik Mijn zwaard in de hand van de koning van Babel zal hebben gegeven, en hij dat over Egypteland zal hebben uitgestrekt.","26":"En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen; zo zullen zij weten dat Ik de HEERE ben."},"SV":{"1":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind! profeteer, en zeg: Zo zegt de Heere HEERE: Huilt: Ach die dag!","3":"Want de dag is nabij, ja, de dag des HEEREN is nabij, een wolkige dag, het zal der heidenen tijd zijn.","4":"En het zwaard zal komen in Egypte, en er zal grote smart zijn in Morenland, als de verslagenen zullen vallen in Egypte; want zij zullen derzelver menigte wegnemen, en haar fondamenten zullen verbroken worden.","5":"Morenland, en Put, en Lud, en al de gemengde hoop, en Cub, en de kinderen van het land des verbonds zullen met hen vallen door het zwaard.","6":"Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hovaardij harer sterkte zal nederdalen; van den toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.","7":"En zij zullen verwoest worden in het midden der verwoeste landen; en haar steden zullen zijn in het midden der verwoeste steden.","8":"En zij zullen weten, dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben gelegd, en al haar helpers zullen verbroken worden.","9":"Te dien dage zullen er boden van voor Mijn aangezicht in schepen uitvaren, om het zorgeloze Morenland te verschrikken; en er zal grote smart bij hen zijn, als in den dag van Egypte; want ziet, het komt aan!","10":"Zo zegt de Heere HEERE: Ja, Ik zal de menigte van Egypte doen ophouden, door de hand van Nebukadrezar, den koning van Babel.","11":"Hij, en zijn volk met hem, de tirannigste der heidenen zullen aangevoerd worden, om het land te verderven; en zij zullen hun zwaarden tegen Egypte uittrekken, en het land met verslagenen vervullen.","12":"En Ik zal de rivieren *tot* droogte maken, en het land verkopen in de hand der bozen; en Ik zal het land met zijn volheid verwoesten door de hand der vreemden: Ik, de HEERE, heb het gesproken.","13":"Zo zegt de Heere HEERE: Ik zal ook de drekgoden verdoen, en de nietige afgoden doen ophouden uit Nof; en er zal geen vorst meer zijn uit Egypteland; en Ik zal een vreze in Egypteland stellen.","14":"En Ik zal Pathros verwoesten, en een vuur leggen in Zoan; en Ik zal gerichten oefenen in No.","15":"En Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien.","16":"En Ik zal een vuur in Egypte leggen; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.","17":"De jongelingen van Aven en Pibeseth zullen door het zwaard vallen, en de *dochters* zullen gaan in de gevangenis.","18":"En te Tachpanhes zal de dag verduisterd worden , als Ik het juk van Egypte aldaar zal verbreken, en de hovaardij harer sterkte in haar zal ophouden; haar zal een wolk bedekken, en haar dochters zullen gaan in de gevangenis.","19":"Alzo zal Ik gerichten oefenen in Egypte; en zij zullen weten, dat Ik de HEERE ben.","20":"Ook gebeurde het in het elfde jaar, in de eerste *maand*, op den zevenden der maand, *dat* het woord des HEEREN tot mij geschiedde, zeggende:","21":"Mensenkind! Ik heb den arm van Farao, den koning van Egypte, verbroken; en ziet, hij zal niet verbonden worden, met pleisters op te leggen, met een windeldoek aan te doen, om dien te verbinden, om dien te sterken, dat hij het zwaard houde.","22":"Daarom zegt de Heere HEERE alzo: Ziet, Ik *wil* aan Farao, den koning van Egypte, en zal zijn armen verbreken, *beide* den sterken en den verbrokenen; en Ik zal het zwaard uit zijn hand doen vallen.","23":"En Ik zal de Egyptenaars verstrooien onder de heidenen, en zal hen verspreiden in de landen.","24":"En Ik zal de armen des konings van Babel sterken, en Mijn zwaard in zijn hand geven; maar Farao’s armen zal Ik verbreken, dat hij voor zijn aangezicht zal kermen, gelijk een dodelijk verwonde kermt.","25":"Ja, Ik zal de armen des konings van Babel sterken, maar Farao’s armen zullen daarhenen vallen; en zij zullen weten, dat Ik de HEERE ben, als Ik Mijn zwaard in de hand des konings van Babel zal hebben gegeven, en hij datzelve over Egypteland zal hebben uitgestrekt.","26":"En Ik zal de Egyptenaars verstrooien onder de heidenen, en zal hen verspreiden in de landen; alzo zullen zij weten, dat Ik de HEERE ben."},"KJV":{"1":"The word of the LORD came again unto me, saying,","2":"Son of man, prophesy and say, Thus saith the Lord GOD; Howl ye, Woe worth the day!","3":"For the day *is* near, even the day of the LORD *is* near, a cloudy day; it shall be the time of the heathen.","4":"And the sword shall come upon Egypt, and great pain shall be in Ethiopia, when the slain shall fall in Egypt, and they shall take away her multitude, and her foundations shall be broken down.","5":"Ethiopia, and Libya, and Lydia, and all the mingled people, and Chub, and the men of the land that is in league, shall fall with them by the sword.","6":"Thus saith the LORD; They also that uphold Egypt shall fall; and the pride of her power shall come down: from the tower of Syene shall they fall in it by the sword, saith the Lord GOD.","7":"And they shall be desolate in the midst of the countries *that are* desolate, and her cities shall be in the midst of the cities *that are* wasted.","8":"And they shall know that I *am* the LORD, when I have set a fire in Egypt, and *when* all her helpers shall be destroyed.","9":"In that day shall messengers go forth from me in ships to make the careless Ethiopians afraid, and great pain shall come upon them, as in the day of Egypt: for, lo, it cometh.","10":"Thus saith the Lord GOD; I will also make the multitude of Egypt to cease by the hand of Nebuchadrezzar king of Babylon.","11":"He and his people with him, the terrible of the nations, shall be brought to destroy the land: and they shall draw their swords against Egypt, and fill the land with the slain.","12":"And I will make the rivers dry, and sell the land into the hand of the wicked: and I will make the land waste, and all that is therein, by the hand of strangers: I the LORD have spoken","13":"Thus saith the Lord GOD; I will also destroy the idols, and I will cause *their* images to cease out of Noph; and there shall be no more a prince of the land of Egypt: and I will put a fear in the land of Egypt.","14":"And I will make Pathros desolate, and will set fire in Zoan, and will execute judgments in No.","15":"And I will pour my fury upon Sin, the strength of Egypt; and I will cut off the multitude of No.","16":"And I will set fire in Egypt: Sin shall have great pain, and No shall be rent asunder, and Noph *shall have* distresses daily.","17":"The young men of Aven and of Pibeseth shall fall by the sword: and these *cities* shall go into captivity.","18":"At Tehaphnehes also the day shall be darkened, when I shall break there the yokes of Egypt: and the pomp of her strength shall cease in her: as for her, a cloud shall cover her, and her daughters shall go into captivity.","19":"Thus will I execute judgments in Egypt: and they shall know that I *am* the LORD.","20":"And it came to pass in the eleventh year, in the first *month*, in the seventh *day* of the month, *that* the word of the LORD came unto me, saying,","21":"Son of man, I have broken the arm of Pharaoh king of Egypt; and, lo, it shall not be bound up to be healed, to put a roller to bind it, to make it strong to hold the sword.","22":"Therefore thus saith the Lord GOD; Behold, I *am* against Pharaoh king of Egypt, and will break his arms, the strong, and that which was broken; and I will cause the sword to fall out of his hand.","23":"And I will scatter the Egyptians among the nations, and will disperse them through the countries.","24":"And I will strengthen the arms of the king of Babylon, and put my sword in his hand: but I will break Pharaoh's arms, and he shall groan before him with the groanings of a deadly wounded","25":"But I will strengthen the arms of the king of Babylon, and the arms of Pharaoh shall fall down; and they shall know that I *am* the LORD, when I shall put my sword into the hand of the king of Babylon, and he shall stretch it out upon the land of Egypt.","26":"And I will scatter the Egyptians among the nations, and disperse them among the countries; and they shall know that I *am* the LORD."}},"tsk":{"2":[{"kopje":"Huil","refs":["Ezech 21:12","Jes 13:6","Jes 14:31","Jes 15:2","Jes 16:7","Jes 23:1","Jes 23:6","Jes 65:14","Jer 4:8","Jer 47:2","Joël 1:5","Joël 1:11","Zef 1:11","Zach 11:2","Jak 5:1","Openb 18:10"]}],"3":[{"kopje":"de dag is","refs":["Ezech 7:7","Ezech 7:12","Ps 37:13","Obadja 1:15","Joël 2:1","Zef 1:7","Zef 1:14","Matt 24:33","Fil 4:5","Jak 5:9","Openb 6:17"]},{"kopje":"wolkige","refs":["Ezech 30:18","Ezech 32:7","Ezech 34:12","Ex 14:20","Ex 14:24","Jes 19:1","Joël 2:1","Joël 2:2","Amos 5:16-20"]},{"kopje":"de tijd","refs":["Ezech 29:12","Ps 110:6","Ps 149:7-9","Jes 24:21-23","Jes 34:2-17","Jer 25:15-29","Joël 3:11-14","Zef 3:6","Zef 3:7","Zach 14:3-19","Openb 19:13-21"]}],"4":[{"kopje":"het zwaard","refs":["Ezech 29:8","Jes 19:2","Jer 50:35-37"]},{"kopje":"smart","refs":["Ezech 30:9","Ex 15:14-16","Ps 48:7","Ps 48:8","Jes 19:16","Jes 19:17","Openb 18:9","Openb 18:10"]},{"kopje":"want zij","refs":["Ezech 30:10","Ezech 29:12","Ezech 29:19"]},{"kopje":"en zijn","refs":["Jes 16:7","Jer 50:15"]}],"5":[{"kopje":"Morenland","refs":["Jes 18:1","Jes 20:4","Jer 46:9","Nahum 3:8","Nahum 3:9"]},{"kopje":"Put","refs":["Ezech 27:10"]},{"kopje":"heel de","refs":["Jer 25:20","Jer 25:24","Jer 50:37"]},{"kopje":"die zullen met hen vallen","refs":["Jer 44:27"]}],"6":[{"kopje":"Ja, zij zullen vallen","refs":["Job 9:13","Jes 20:3-6","Jes 31:3","Nahum 3:9"]},{"kopje":"van de toren van Syene af","refs":["Ezech 29:10"]}],"8":[{"kopje":"zullen weten","refs":["Ezech 28:24","Ezech 28:26","Ezech 29:6","Ezech 29:9","Ezech 29:16","Ps 58:12"]},{"kopje":"als Ik","refs":["Ezech 30:14","Ezech 30:16","Ezech 22:31","Deut 32:22","Jes 42:25","Kl ouring people, that were in a strait strict and fellowship with the Egyptian, some understand the Jews, that had formerly inhabited the land of Canaan, which was given them by God&acirc;&euro;&trade;s covenant, and fled into Egypt and it may be had served the king of Egypt in his war against his enemy. See Jer 43:17 and 44.27. And compare the phrase children of the land, with Job 1:3 and chapter 16.28 and see the Annotat. There] shall fall with them [The Egyptians] by the sword."}],"6":[{"catchword":null,"tekst":"Thou saith the LORD, yea shall fall that support Egypt; [That is, all her helpers, as verse 8] and the pride [Or brightness, pomp, highness; also Excellency, eminency. So below verse 18.] of her [Egypt&acirc;&euro;&trade;s]power shall come down: from the tower of schene [see above chapter 29 on verse 10] shall they fall in it [in Egypt] by the sword saith the Lord LORD."}],"7":[{"catchword":null,"tekst":"And they shall desolate in the midst of a desolate countreyes: [See above chap. 29.12] and their cities shall be in the midst of desolate cities."}],"8":[{"catchword":null,"tekst":"And they shall know that I am LORD, when I shall have laid a fire in Egypt [to wit, a fire of war, miseries and plagues, (see above chap. 28 on verse 18. and Job 15 on verse 24. Jerem. 49.27. Amos 1.4,c.) Whereby Egypt shall be consumed. So below verse 14.16] and all her helpers shall be broken in pieces."}],"9":[{"catchword":null,"tekst":"In that day shall there messengers go forth from before my face in ships, to make careless Ethiopia. [Heb. Casch of security, or confidence; to wit, that secure and careless Ethiopia, that is, the Ethiopians] afraid: [That is, I will order the matter so as that the news of the chaldeans in rode or falling into Egypt shall be carried over into Ethiopia. God speaketh here as a judge sitting upon his judgement-seat in Egypt, and governing this whole business [and there shall be great pain among them, [to wit, among the Ethiopians; as above verse 4 eb. Elilim; that is, meer nothing. See Levit. 19 on verse 4.] To cease out of Noph: [See Isa. 19.13. Jerm. 44 on verse 1. and below ver. 16.] And there shall be no more a prince out of the land of Egypt, and I will put a fear in the land of Egypt."}],"14":[{"catchword":null,"tekst":"And I will make Pathrons [see Genesis 10 on verse 14. Jer. 44.1 & above chap. 29.14.] Desolate, lay a fire in Zoan, [See Numb. 13 on verse 22. Psalms 78 on verse 12.] and I will exercise judgement in No. [See Jer. 46 on verse 25]"}],"15":[{"catchword":null,"tekst":"And I will pore out my fury [See Job 18. on verse 21. Psalms 79 on verse 6.] Upon sin, [some hold this to be Pelusium, in the uttermost borders of Egypt, agreeing with the names of the wilderness of sin, and of mount Sinai] the strength of Egypt, and I will cut off the multitude of No. [Compare Jer 46:25.]"}],"16":[{"catchword":null,"tekst":"And I will lay a fire in Egypt; Sin shall have very great pain, [Heb. As if one should say, shall suffering pain suffer pain] and No shall be split, [Heb. shall be to be split] and Noph shall be daily sore distressed. [Heb. (shall be) daily, or by day, in the day-time distress,. Others, by daily distressers.]"}],"17":[{"catchword":null,"tekst":"The young men of Even. [That is, held to be on, which some conceive to be Heliopolis, that is, the city of the sun, see Gen. 41.45.] And Pi-Besseth [that is held to be Bubastic or Bubastus, where the Idol Diana was worshipped] shall fall by the sword, and the (daughters) [this word is here inserted from the opposition. Heb. They. Others, these (cities) shall c. that is, the inhabitants of these cities, or the dependent adjoining cities and villages, as in the next verse] shall go into captivity."}],"18":[{"catchword":null,"tekst":"And at Tachpanhes [Heb. Here Thechappannes. See Jerem. 2.16 And 43.7,8. With the Annotat.] The day shall be darkened, [or withheld, hindered] when I shall break there the yoke of Egypt [or axletrees, cords, wherewith or wh /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */

  bijbel.className = '';

    rij.className = 'vers'; rij.id = 'v' + n;

    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
