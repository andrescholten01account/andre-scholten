sterkte van Egypte; en Ik zal de menigte van No uitroeien. En Ik zal een vuur in Egypte aansteken; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.", "Spr 20:6": "Elk van de menigte van de mensen roept zijn eigen weldadigheid uit; maar wie zal een echt trouwe man vinden?", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Ezech 37:15": "Verder gebeurde het dat het woord van de HEERE tot mij kwam:", "Luk 22:34": "Maar Hij zei: Ik zeg u, Petrus, de haan zal vandaag niet kraaien, voordat u driemaal geloochend zult hebben dat u Mij kent.", "Num 31:9": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.", "Ex 14:20": "En zij kwam tussen het leger van de Egyptenaren en tussen het leger van Israël; en de wolk was tegelijk duisternis en verlichtte de nacht; zodat de een tot de ander niet naderde de hele nacht.", "Ezech 7:7": "De morgenstond is tot u gekomen, o inwoner van het land, de tijd is gekomen, de dag van de opschudding is nabij, en er is geen weerklank van de bergen.", "Ezech 31:12": "En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Ezech 23:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Jes 16:6": "Wij hebben gehoord van de hoogmoed van Moab, hij is zeer hoogmoedig; zijn hoogmoed, en zijn hoogmoed, en zijn woede, zijn niet zoals zijn grootspraak.", "Ezech 32:9": "Verder zal Ik het hart van veel volken verdrietig maken, als Ik uw verbreking onder de heidenvolken breng, in de landen die u niet gekend hebt.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Ezech 36:16": "Verder gebeurde het: het woord van de HEERE kwam tot mij, en Hij zei:", "Luk 11:43": "Wee u, Farizeeën, want u houdt van de voorste plaatsen in de synagogen, en van de begroetingen op de markten.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Jer 43:10": "en zeg tegen hen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal iemand heenzenden, en Nebukadrezar, de koning van Babel, Mijn dienaar, halen, en Ik zal zijn troon zetten boven op deze stenen, die Ik verborgen heb; en hij zal zijn koninklijke tent daarover spannen.", "Openb 18:21": "En een sterke engel hief een steen op als een grote molensteen, en wierp die in de zee, en zei: Zo zal de grote stad Babylon met geweld neergeworpen worden, en zal niet meer gevonden worden.", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Jes 3:16-26": "Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren. Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,", "Jer 48:25": "Moabs hoorn is afgesneden, en zijn arm verbroken, spreekt de HEERE.", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "Gen 41:45": "En Farao noemde Jozef Zafnath-Paaneah, en gaf hem Asnath, de dochter van Potifera, priester van On, tot vrouw; en Jozef trok door het land van Egypte.", "Zef 2:15": "Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Ezech 38:16": "en u zult optrekken tegen Mijn volk Israël, als een wolk, om het land te bedekken; in het laatste van de dagen zal het gebeuren; dan zal Ik u aanbrengen tegen Mijn land, opdat de heidenen Mij kennen, als Ik aan u, o Gog! voor hun ogen geheiligd zal worden.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Jes 34:3-7": "En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom. Want Mijn zwaard is dronken geworden in de hemel; zie, het zal ten oordeel neerdalen op Edom, en op het volk dat Ik met de ban geslagen heb.", "Jer 48:7": "Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Ezech 29:8": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal het zwaard over u brengen, en Ik zal uit u mens en dier uitroeien.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Openb 19:13-21": "En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God. En de legers in de hemel volgden Hem op witte paarden, gekleed met wit en rein fijn linnen. En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Jer 50:38": "Droogte zal zijn over haar water, zodat het uitdroogt; want het is een land van gesneden beelden, en zij razen naar de schrikwekkende afgoden.", "Jes 47:8": "Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Ezech 29:7": "Toen zij u bij uw hand grepen, werd u gebroken, en spleet u al hun zijden; en toen zij op u leunden, werd u verbroken, en liet u al hun lenden stilstaan.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Jes 45:5": "Ik ben de HEERE, en niemand meer, buiten Mij is er geen God; Ik zal u gorden, hoewel u Mij niet kent.", "Jes 19:17": "En het land Juda zal voor de Egyptenaren tot een schrik zijn; zo wie het vermelden zal, die zal in zichzelf bevreesd zijn vanwege de raad van de HEERE van de heerscharen, die Hij tegen hen beraadslaagd heeft.", "Ezech 29:15": "En het zal nederiger zijn dan de andere koninkrijken, en zich niet meer verheffen boven de heidenvolken; want Ik zal hen verminderen, zodat zij niet zullen heersen over de heidenvolken.", "Nahum 1:5": "De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Ezech 32:15": "Als Ik Egypteland tot een verwoesting gesteld zal hebben, en het land van zijn volheid woest zal zijn geworden, als Ik geslagen zal hebben allen die daarin wonen; dan zullen zij weten dat Ik de HEERE ben.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Ps 78:12": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan.", "Jer 46:20-26": "Egypte is een zeer mooie vaars; de slachter komt, hij komt van het noorden. Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn samen gevlucht, zij hebben niet gestaan; want de dag van hun verderf is over hen gekomen, de tijd van hun bezoeking. Haar stem zal gaan als van een slang; want zij zullen met krijgsmacht daarheen trekken, en tot haar met bijlen komen, gelijk houthouwers.", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Jes 43:3": "Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "Jes 46:1": "Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide beesten.", "Amos 1:14": "Daarom zal Ik een vuur aansteken in de muur van Rabba, dat zal haar paleizen verteren; met gejuich op de dag van de strijd, met een storm op de dag van de wervelwind.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Deut 29:19": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst.", "Jes 19:13": "De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, tot de uiterste hoek van zijn stammen.", "Jer 46:24": "De dochter van Egypte is beschaamd; zij is gegeven in de hand van het volk van het noorden.", "Spr 10:17": "Het pad naar het leven is voor hem die de tucht bewaart; maar wie de bestraffing verlaat, doet dwalen.", "Jes 9:3": "Want het juk van hun last, en de stok van hun schouders, en de staf van hem die hen dreef, hebt U verbroken, zoals op de dag van de Midianieten;", "Ezech 21:8": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Jer 51:9": "Wij hebben Babel gemeesterd, maar zij is niet genezen; verlaat haar dan, en laat ons ieder naar zijn land trekken; want haar oordeel reikt tot aan de hemel, en is verheven tot aan de bovenste wolken.", "Ps 18:33": "Het is God, die mij met kracht omgordt; en Hij heeft mijn weg volkomen gemaakt.", "Jes 24:21-23": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem. En zij zullen bijeengebracht worden, zoals gevangenen in een put, en zij zullen opgesloten worden in een gevangenis, maar na veel dagen weer bezocht worden. En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Ezech 29:8-12": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal het zwaard over u brengen, en Ik zal uit u mens en dier uitroeien. En Egypteland zal worden tot een wildernis en woestheid, en zij zullen weten dat Ik de HEERE ben; omdat hij zegt: De rivier is van mij, en ik heb die gemaakt. Daarom, zie, Ik zál u en uw rivieren; en Ik zal Egypteland stellen tot woeste, verlaten eenzaamheden, van de toren van Syene af tot aan de grens van Morenland.", "Jes 20:5": "En zij zullen verschrikken en beschaamd zijn over de Moren, op wie zij hun hoop hadden gevestigd, en over de Egyptenaars, hun roem.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Ezech 32:18-32": "Mensenkind! Weeklaag over de menigte van Egypte, en laat haar neerdalen, (haar en de dochters van de prachtige heidenvolken) naar de onderste plaatsen van de aarde, bij hen die in het kuil zijn neergedaald. Boven wie bent u zo liefelijk! Daal neer, en leg u bij de onbesnedenen. In het midden van de verslagenen van het zwaard zullen zij vallen; zij is aan het zwaard overgegeven; trek haar weg met haar hele menigte.", "Ezech 29:4": "Maar Ik zal haken in uw kaken doen, en de vis van uw rivieren aan uw schubben doen kleven; en Ik zal u uit het midden van uw rivieren optrekken, en alle vis van uw rivieren zal aan uw schubben kleven.", "Ezech 33:23": "Toen kwam het woord van de HEERE tot mij:", "Spr 21:24": "Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Jes 47:4-10": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël. Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Jes 46:2": "Samen zijn zij neergebogen, zij zijn gekromd, zij hebben de last niet kunnen redden, maar zijzelf zijn in de gevangenis gegaan.", "Job 32:9-13": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet. Daarom zeg ik: Luister naar mij; ik zal mijn mening ook tonen. Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "2 Kon 14:10": "U hebt de Edomieten inderdaad geslagen, daarom heeft uw hart u verheven; heb de eer, en blijf in uw huis; want waarom zou u zich in het kwade mengen, zodat u zou vallen, u en Juda met u?", "Ezech 28:2-9": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God. Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen. Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Ezech 39:4": "Op de bergen van Israël zult u vallen, u en al uw benden, en de volken die met u zijn; Ik heb u aan de roofvogels, aan het gevogelte van elke vleugel, en aan de dieren van het veld tot voedsel gegeven.", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "2 Kon 18:21": "Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Amos 6:1-7": "Wee de geruste mensen in Sion, en degenen die zeker zijn op de berg van Samaria! Zij zijn de voornaamste van de eerstelingen der volken, en tot hen komen die van het huis van Israël. Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied? U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt.", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "Ezech 29:12-15": "Want Ik zal Egypteland tot een verwoesting stellen te midden van de verwoeste landen, en zijn steden zullen een woestheid zijn te midden van de verwoeste steden, veertig jaar; en Ik zal de Egyptenaren verstrooien onder de heidenvolken, en zal hen verspreiden in de landen. Maar zo zegt de Heere HEERE: Aan het einde van veertig jaar zal Ik de Egyptenaren verzamelen uit de volken waarheen zij verstrooid zijn. En Ik zal de gevangenschap van de Egyptenaren omkeren, en hen terugbrengen in het land van Pathros, in het land van hun koophandel; en daar zullen zij een nederig koninkrijk zijn.", "Jer 46:9": "Trekt op, paarden! En raast, wagens! En laat de helden uittrekken: de Moren, en de Puteeërs, die het schild hanteren, en de Lydiërs, die de boog hanteren en spannen.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Ezech 31:10-14": "Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over uw stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte; daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, zodat die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid. En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "Jer 50:37": "Het zwaard zal zijn over zijn paarden en over zijn wagens, en over de hele gemengde menigte die in hun midden is, zodat zij worden als vrouwen; het zwaard zal zijn over haar schatten, zodat zij geplunderd worden.", "Jer 46:13-26": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan. Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is. Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Jer 25:15-29": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Jer 2:16": "Ook hebben de kinderen van Nof en Tachpanhes u de schedel afgeweid.", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Dan 4:24-26": "Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal: Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Ps 30:7": "Ik zei wel in mijn voorspoed: Ik zal nooit wankelen.", "Job 15:1-13": "Toen antwoordde Elifaz, de Themaniet, en zei: Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind? Bestraffend door woorden, die niet baten, en door redenen, waarmee hij geen voordeel doet?", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "Ps 59:14": "Verteer hen in grimmigheid; verteer hen, zodat zij er niet meer zijn, en laat hen weten dat God Heerser is in Jakob, ja, tot aan de einden van de aarde. Sela.", "Jer 27:1-11": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia: Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Openb 16:1": "En ik hoorde een grote stem uit de tempel, die tegen de zeven engelen zei: Ga heen, en giet de zeven schalen van de toorn van God uit op de aarde.", "Jer 12:5": "Als u loopt met de voetgangers, zo maken zij u moe; hoe zult u zich dan meten met de paarden? Als u alleen vertrouwt in een land van vrede, hoe zult u het dan maken in de verheffing van de Jordaan?", "Matt 25:5": "Toen de bruidegom uitbleef, werden zij allemaal slaperig, en vielen in slaap.", "Jer 46:21-25": "Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn samen gevlucht, zij hebben niet gestaan; want de dag van hun verderf is over hen gekomen, de tijd van hun bezoeking. Haar stem zal gaan als van een slang; want zij zullen met krijgsmacht daarheen trekken, en tot haar met bijlen komen, gelijk houthouwers. Zij hebben haar woud afgehouwen, spreekt de HEERE, hoewel het niet te onderzoeken is; want zij zijn meer dan de sprinkhanen, zodat men hen niet tellen kan.", "Jer 42:12": "En Ik zal u barmhartigheid geven, dat hij zich over u erbarmt, en u weer in uw land brengt.", "Jes 20:2-6": "In dezelfde tijd sprak de HEERE, door de dienst van Jesaja, de zoon van Amoz, en Hij zei: Ga heen, en maak de zak van uw lendenen los, en doe uw schoenen van uw voeten. En hij deed zo, en liep naakt en barrevoets. Toen zei de HEERE: Zoals Mijn knecht Jesaja naakt en barrevoets rondloopt, drie jaren, tot een teken en wonder over Egypte en over Morenland; zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande.", "Spr 14:16": "De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.", "Deut 32:41": "Als Ik Mijn glinsterend zwaard scherp, en Mijn hand grijpt naar het gericht, zo zal Ik wraak op Mijn tegenpartijen doen wederkeren, en Mijn haters vergelden.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Zef 1:17": "En Ik zal de mensen bang maken, zodat zij zullen gaan als de blinden; want zij hebben tegen de HEERE gezondigd; en hun bloed zal vergoten worden als stof, en hun vlees zal worden als drek.", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Spr 12:15": "De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.", "Ezech 25:5": "En Ik zal Rabba tot een kameelstal maken, en de kinderen van Ammon tot een schaapskooi; en u zult weten dat Ik de HEERE ben.", "Ezech 29:17-20": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei: Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft. Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Ezech 28:11": "Verder gebeurde het woord van de HEERE tot mij:", "Ezech 32:10": "En Ik zal maken dat veel volken zich over u ontzetten, en hun koningen zullen de haren over u te berge staan, als Ik Mijn zwaard voor hun aangezicht zwaai; en zij zullen elk ogenblik sidderen, ieder voor zijn eigen leven, op de dag van uw val.", "Zef 3:6": "Ik heb de heidenen uitgeroeid, hun hoeken zijn verwoest, Ik heb hun straten eenzaam gemaakt, zodat niemand daardoor gaat; hun steden zijn verstoord, zodat er niemand is, dat er geen inwoner is.", "Matt 23:6-8": "En zij houden van de belangrijkste plaats bij de maaltijden, en de voorste stoelen in de synagogen; ook de begroetingen op de markten, en om door de mensen genoemd te worden: Rabbi, Rabbi! Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders.", "Ezech 12:17": "Daarna kwam het woord van de HEERE tot mij en Hij zei:", "Ezech 27:1": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "Zef 3:11": "Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Ezech 29:16": "En het zal voor het huis van Israël niet meer tot een vertrouwen zijn, dat hen aan de ongerechtigheid doet denken, wanneer zij naar hen omzien; maar zij zullen weten dat Ik de Heere HEERE ben.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Jer 25:12-14": "Maar het zal gebeuren, als de zeventig jaren vervuld zijn, dan zal Ik over de koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken, alsook over het land van de Chaldeeën, en zal dat stellen tot eeuwige verwoestingen. En Ik zal over dat land brengen al Mijn woorden, die Ik daarover gesproken heb; al wat in dit boek geschreven is, wat Jeremia geprofeteerd heeft over al deze volken. Want van hen zullen zich laten dienen, die ook machtige volken en grote koningen zijn; zo zal Ik hun vergelden naar hun doen, en naar het werk van hun handen.", "Ps 44:7": "Want ik vertrouw niet op mijn boog, en mijn zwaard zal mij niet verlossen.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Jes 14:25": "Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt.", "Jer 49:5": "Zie, Ik zal vrees over u brengen, spreekt de Heere, de HEERE van de heerscharen, van allen die rondom u zijn, en u zult, ieder voor zich heen, weggedreven worden, en niemand zal hen die omzwerven bijeenbrengen.", "Ezech 22:1": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Jer 43:12": "En Ik zal een vuur aansteken in de huizen van de goden van Egypte, en hij zal ze verbranden, en gevankelijk wegvoeren; en hij zal Egypteland aantrekken, zoals een herder zijn kleed aantrekt, en hij zal vandaar in vrede uittrekken.", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Jes 20:3-6": "Toen zei de HEERE: Zoals Mijn knecht Jesaja naakt en barrevoets rondloopt, drie jaren, tot een teken en wonder over Egypte en over Morenland; zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande. En zij zullen verschrikken en beschaamd zijn over de Moren, op wie zij hun hoop hadden gevestigd, en over de Egyptenaars, hun roem.", "Zef 1:7": "Zwijg voor het aangezicht van de Heere HEERE; want de dag van de HEERE is nabij; want de HEERE heeft een slachtoffer bereid, Hij heeft Zijn genode geheiligd.", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Jer 46:1-12": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen. Tegen Egypte; tegen het leger van Farao Necho, koning van Egypte, dat aan de rivier Frath, bij Karchemis was, dat Nebukadrezar, de koning van Babel, sloeg, in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda. Rust het schild en de rondas toe, en nadert tot de strijd!", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Jes 19:4-10": "En Ik zal de Egyptenaars overleveren in de hand van harde heren, en een strenge koning zal over hen heersen, spreekt de Heere HEERE van de heerscharen. En zij zullen het water uit de zee doen vergaan, en de rivier zal verzijpen en verdrogen. Zij zullen ook de rivieren ver terugdrijven, zij zullen ze uithozen, en de opgedamde stromen opdrogen; het riet en het schilf zullen verwelken.", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Ezech 38:23": "Zo zal Ik Mij groot maken, en Mij heiligen, en bekend worden voor de ogen van veel heidenen; en zij zullen weten dat Ik de HEERE ben.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Job 29:18": "En ik zei: Ik zal in mijn nest de geest geven, en ik zal de dagen vermenigvuldigen als het zand.", "Jes 30:5": "Hij zal hen allen beschaamd maken door een volk dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaad zijn zal.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Ezech 21:1": "Het woord van de HEERE kwam tot mij, en Hij zei:", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Rom 2:3": "En denkt u dit, o mens, die hen oordeelt die zulke dingen doen, en dat zelf ook doet, dat u het oordeel van God zult ontvluchten?", "Deut 32:42": "Ik zal Mijn pijlen dronken maken van bloed, en Mijn zwaard zal vlees eten; van het bloed van de verslagene en van de gevangene, vanaf het begin zullen er wraken van de vijand zijn.", "Ezech 28:24": "En het huis van Israël zal geen pijnlijke doorn meer hebben, en geen pijn veroorzakende distel, van allen die rondom hen zijn, die hen beroven; en zij zullen weten dat Ik de Heere HEERE ben.", "Lev 10:3": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Ezech 39:21": "En Ik zal Mijn eer tonen onder de heidenen; en alle heidenen zullen Mijn oordeel zien dat Ik gedaan heb, en Mijn hand die Ik op hen gelegd heb.", "Luk 20:45-47": "En terwijl al het volk luisterde, zei Hij tegen Zijn discipelen: Wacht u voor de Schriftgeleerden, die graag rondlopen in lange gewaden, en die de begroetingen op de markten graag hebben, en de voorste plaatsen in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Ezech 29:17": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Hos 10:11": "Omdat Efraïm een vaars is, gewend om graag te dorsen, ben Ik over de schoonheid van haar hals heengegaan; Ik zal Efraïm laten rijden, Juda zal ploegen, Jakob zal voor zich eggen.", "Zef 2:12": "Ook u, Moren! zult de verslagenen van Mijn zwaard zijn.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Ex 14:17": "En Ik, zie, Ik zal het hart van de Egyptenaren verstokken, zodat zij achter hen aan daarin gaan; en Ik zal verheerlijkt worden aan Farao en aan zijn hele leger, aan zijn wagens en aan zijn ruiters.", "Jer 49:28-30": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten. Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom! Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Mark 10:24": "En de discipelen waren verbaasd over deze woorden van Hem. Maar Jezus antwoordde weer en zei tegen hen: Kinderen, hoe moeilijk is het voor hen die op rijkdom vertrouwen, om het Koninkrijk van God binnen te gaan!", "Jer 30:13": "Er is niemand die uw zaak behartigt, aangaande het gezwel; u hebt geen heelpleisters.", "Jes 34:2-17": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Ex 12:12": "Want Ik zal in deze nacht door Egypteland gaan, en alle eerstgeborenen in Egypteland slaan, van de mensen af tot de dieren toe; en Ik zal gerichten oefenen aan al de goden van de Egyptenaren, Ik, de HEERE!", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ps 49:7": "Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen;", "Ps 9:17": "De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.", "2 Kon 14:9": "Maar Joas, de koning van Israël, zond naar Amazia, de koning van Juda, en zei: De distel die op de Libanon staat, zond naar de ceder die op de Libanon staat, en zei: Geef uw dochter aan mijn zoon tot vrouw; maar het wilde dier van het veld, dat op de Libanon was, kwam voorbij en vertrapte de distel.", "Zach 13:2": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen.", "Ezech 25:11": "Ik zal ook in Moab strafgerichten voltrekken; en zij zullen weten dat Ik de HEERE ben.", "Zef 2:2": "Voordat het besluit vrucht draagt (zoals kaf gaat de dag voorbij), voordat de gloed van de toorn van de HEERE over u komt; voordat de dag van de toorn van de HEERE over u komt.", "Dan 2:21-38": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben. Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem. Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Job 9:13": "God zal Zijn toorn niet afkeren; onder Hem worden de hoogmoedige helpers gebogen.", "Jer 6:14": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.", "Zef 3:7": "Ik zei: Zeker zult u Mij vrezen, u zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; alles waarmee Ik haar bezocht heb¹, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.", "Spr 29:23": "De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.", "Jer 44:27": "Zie, Ik zal over hen waken ten kwade en niet ten goede; en alle mannen van Juda die in Egypteland zijn, zullen door het zwaard en door de honger verteerd worden, totdat zij ten einde zijn.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Ezech 29:21": "Op die dag zal Ik de hoorn van het huis van Israël doen uitspruiten, en Ik zal u opening van de mond geven te midden van hen; en zij zullen weten dat Ik de HEERE ben.", "Jes 47:7": "En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "Dan 5:25-29": "Dit nu is het schrift dat daar getekend is: MENE, MENE, TEKEL, UPHARSIN. Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden.", "Ezech 16:56": "Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Dan 11:42": "En hij zal zijn hand aan de landen leggen, ook het land van Egypte zal niet ontkomen.", "Openb 14:20": "En de wijnpersbak werd buiten de stad getreden, en er is bloed uit de wijnpersbak gekomen, tot aan de tomen van de paarden, over een afstand van duizend zeshonderd stadiën.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Ezech 11:10-12": "U zult door het zwaard vallen; in het gebied van Israël zal Ik u oordelen, en u zult weten dat Ik de HEERE ben. Deze stad zal u niet tot een pot zijn, en u zult in het midden daarvan niet tot vlees zijn; in het gebied van Israël zal Ik u oordelen. En u zult weten dat Ik de HEERE ben, omdat u in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, maar naar de rechten van de heidenvolken die rondom u zijn, gedaan hebt.", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Zach 14:3-19": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd. En Zijn voeten zullen op die dag staan op de Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten en naar het westen, zodat er een zeer grote vallei zal zijn; en de ene helft van de berg zal wijken naar het noorden, en de helft daarvan naar het zuiden. Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Zach 14:1": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem!", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Ezech 27:10": "Perzen, en Lydiërs, en Puteeërs waren in uw leger, uw krijgslieden; schild en helm hingen zij in u op, die maakten uw sieraad.", "Ezech 34:12": "Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jer 21:13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Ezech 28:1": "Verder gebeurde het woord van de HEERE tot mij:", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Spr 30:13": "Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;", "Jer 44:1": "Het woord dat tot Jeremia gebeurde over al de Joden die in Egypteland woonden, die te Migdol woonden, en te Tachpanhes, en te Nof, en in het land Pathros, en hij zei:", "Mark 12:39": "en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden;", "Ps 37:13": "De Heere belacht hem, want Hij ziet dat zijn dag komt.", "Jer 25:24": "En alle koningen van Arabië; en alle koningen van de gemengde volksmassa, die in de woestijn wonen;", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Ezech 17:11": "Daarna kwam het woord van de HEERE tot mij en zei:", "Amos 1:10": "Daarom zal Ik een vuur zenden in de muur van Tyrus, dat zal haar paleizen verteren.", "Jer 51:52": "Daarom zie, de dagen komen, spreekt de HEERE, dat Ik bezoeking doen zal over haar gesneden beelden; en de dodelijk gewonde zal kermen in haar hele land.", "Ezech 38:5": "Perzen, Moren en Puteeërs met hen, die allemaal schild en helm voeren;", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Ezech 12:8": "En 's morgens kwam het woord van de HEERE tot mij en Hij zei:", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Dan 4:10-26": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot. De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde; Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.", "Jer 25:20": "En de hele gemengde volksmassa, en alle koningen van het land van Uz; en alle koningen van het land van de Filistijnen, en Askelon, en Gaza, en Ekron, en het overblijfsel van Asdod;", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Ezech 14:12": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Zach 11:3": "Er is een stem van het gehuil van de herders, omdat hun heerlijkheid verwoest is; een stem van het gebrul van de jonge leeuwen, omdat de hoogmoed van de Jordaan verwoest is.", "Ps 83:17-19": "Maak hun gezicht vol schande, opdat zij, o HEERE, Uw Naam zoeken. Laat hen beschaamd en verschrikt worden tot in eeuwigheid, en laat hen schaamrood worden, en omkomen; opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Jer 28:14": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Ik heb een ijzeren juk gedaan aan de hals van al deze volken, om Nebukadnezar, de koning van Babel, te dienen, en zij zullen hem dienen; ja, Ik heb hem ook het gedierte van het veld gegeven.", "Dan 4:34": "Aan het einde van deze dagen nu, hief ik, Nebukadnezar, mijn ogen op naar de hemel, want mijn verstand kwam weer in mij; en ik loofde de Allerhoogste, en ik prees en verheerlijkte de Eeuwiglevende, omdat Zijn heerschappij een eeuwige heerschappij is, en Zijn Koninkrijk is van geslacht tot geslacht;", "Ezech 32:11-16": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen. Ik zal uw menigte vellen door de zwaarden van de helden, die allemaal samen de meest tirannieke van de heidenvolken zijn; die zullen de hoogmoed van Egypte verstoren, en haar hele menigte zal verdelgd worden. En Ik zal haar dieren wegvagen van bij het vele water; en geen mensenvoet zal het meer beroeren, en geen dierenklauwen zullen het beroeren.", "Jes 2:12": "Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt;", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Ezech 30:13-16": "Zo zegt de Heere HEERE: Ik zal ook de drekgoden verdelgen, en de nietige afgoden doen ophouden uit Nof; en er zal geen vorst meer zijn uit Egypteland; en Ik zal een vrees in Egypteland leggen. En Ik zal Pathros verwoesten, en een vuur aansteken in Zoan; en Ik zal gerichten voltrekken in No. En Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien.", "Jes 30:4": "Wanneer zijn vorsten in Zoan zullen zijn geweest, en zijn gezanten tot dichtbij Chanes zullen zijn gekomen;", "Ezech 29:12": "Want Ik zal Egypteland tot een verwoesting stellen te midden van de verwoeste landen, en zijn steden zullen een woestheid zijn te midden van de verwoeste steden, veertig jaar; en Ik zal de Egyptenaren verstrooien onder de heidenvolken, en zal hen verspreiden in de landen.", "Joël 3:15": "De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Luk 22:33": "En hij zei tegen Hem: Heere, ik ben bereid, met U ook in de gevangenis en in de dood te gaan.", "Ezech 28:26": "En zij zullen daarin zeker wonen, en huizen bouwen, en wijngaarden planten; ja, zij zullen zeker wonen; wanneer Ik gerichten zal hebben geoefend tegen allen die hen beroofd hebben, van degenen die rondom hen zijn; en zij zullen weten dat Ik, de HEERE, hun God ben.", "Ezech 21:12": "Schreeuw en huil, o mensenkind, want het zal zijn tegen Mijn volk, het zal zijn tegen al de vorsten van Israël; verschrikkingen zullen vanwege het zwaard bij Mijn volk zijn; klop daarom op de heup.", "Deut 29:22-28": "Dan zal het navolgende geslacht zeggen, uw kinderen, die na u opstaan zullen, en de vreemde, die uit een ver land komen zal, als zij de plagen van dit land zullen zien en de ziekten waarmee de HEERE het gekweld heeft; Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid; En alle volken zullen zeggen: Waarom heeft de HEERE dit land zo aangedaan? Wat betekent de gloed van deze grote toorn?", "Ezech 39:22": "En zij die van het huis van Israël zijn, zullen weten dat Ik, de HEERE, hun God ben, vanaf die dag en voortaan.", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Jes 19:11": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen?", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Jer 51:36": "Daarom, zo zegt de HEERE: Zie, Ik zal uw twist twisten, en uw wraak wreken; en Ik zal haar zee droogmaken, en haar springader opdrogen.", "Ezech 6:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Mark 10:43": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Ezech 29:9": "En Egypteland zal worden tot een wildernis en woestheid, en zij zullen weten dat Ik de HEERE ben; omdat hij zegt: De rivier is van mij, en ik heb die gemaakt.", "Ps 48:7": "Beving greep hen daar aan, smart als van een barende vrouw.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Ezech 39:6": "En Ik zal een vuur zenden in Magog, en onder hen die veilig op de eilanden wonen; en zij zullen weten dat Ik de HEERE ben.", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "Jer 49:21": "De aarde heeft gebeefd van het geluid van hun val, van het geroep, waarvan het geluid gehoord is bij de Schelfzee.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Ezech 29:10": "Daarom, zie, Ik zál u en uw rivieren; en Ik zal Egypteland stellen tot woeste, verlaten eenzaamheden, van de toren van Syene af tot aan de grens van Morenland.", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt."}, "noten": {"1": "D.i. mestgoden, afgoden"}, "koppeling": {"1": "Verder gebeurde <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">HEERE</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">tot</span> <span clas span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and great <span class=\"wl wl-kjv\" data-code=\"H2479\">pain</span> shall be in <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia,</span> when the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and they shall take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> her <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> and her <span class=\"wl wl-kjv\" data-code=\"H3247\">foundations</span> shall be broken down.", "5": "<span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia,</span> and <span class=\"wl wl-kjv\" data-code=\"H6316\">Libya,</span> and <span class=\"wl wl-kjv\" data-code=\"H3865\">Lydia,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6153\">mingled</span> people, and <span class=\"wl wl-kjv\" data-code=\"H3552\">Chub,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that is in <span class=\"wl wl-kjv\" data-code=\"H1285\">league,</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> with them by the sword.", "6": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> They also that <span class=\"wl wl-kjv\" data-code=\"H5564\">uphold</span> <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of her <span class=\"wl wl-kjv\" data-code=\"H5797\">power</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3381\">down:</span> from the <span class=\"wl wl-kjv\" data-code=\"H4024\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H5482\">Syene</span> shall they <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in it by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.", "7": "And they shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> that are <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that are wasted.", "8": "And they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and when all her <span class=\"wl wl-kjv\" data-code=\"H5826\">helpers</span> shall be destroyed.", "9": "In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">me</span> in <span class=\"wl wl-kjv\" data-code=\"H6716\">ships</span> to make the <span class=\"wl wl-kjv\" data-code=\"H983\">careless</span> <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopians</span> <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid,</span> and great <span class=\"wl wl-kjv\" data-code=\"H2479\">pain</span> shall come upon them, as in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> for, lo, it cometh.", "10": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will also make the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Babylon.", "11": "He and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with him, the <span class=\"wl wl-kjv\" data-code=\"H6184\">terrible</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7324\">draw</span> their <span class=\"wl wl-kjv\" data-code=\"H2719\">swords</span> against <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> with the slain.", "12": "And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers</span> <span class=\"wl wl-kjv\" data-code=\"H2724\">dry,</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked:</span> and I will make the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8074\">waste,</span> and all that is <span class=\"wl wl-kjv\" data-code=\"H4393\">therein,</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers:</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have spoken", "13": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will also <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> and I will cause their <span class=\"wl wl-kjv\" data-code=\"H457\">images</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> out of <span class=\"wl wl-kjv\" data-code=\"H5297\">Noph;</span> and there shall be no more a <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.", "14": "And I will make <span class=\"wl wl-kjv\" data-code=\"H6624\">Pathros</span> <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in <span class=\"wl wl-kjv\" data-code=\"H6814\">Zoan,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> in No.", "15": "And I will <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> upon <span class=\"wl wl-kjv\" data-code=\"H5512\">Sin,</span> the <span class=\"wl wl-kjv\" data-code=\"H4581\">strength</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> and I will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of No.", "16": "And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> <span class=\"wl wl-kjv\" data-code=\"H5512\">Sin</span> shall have <span class=\"wl wl-kjv\" data-code=\"H2342\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2342\">pain,</span> and <span class=\"wl wl-kjv\" data-code=\"H4996\">No</span> shall be rent <span class=\"wl wl-kjv\" data-code=\"H1234\">asunder,</span> and <span class=\"wl wl-kjv\" data-code=\"H5297\">Noph</span> shall have <span class=\"wl wl-kjv\" data-code=\"H6862\">distresses</span> daily.", "17": "The young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H206\">Aven</span> and of <span class=\"wl wl-kjv\" data-code=\"H6364\">Pibeseth</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and these cities shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into captivity.", "18": "At <span class=\"wl wl-kjv\" data-code=\"H8471\">Tehaphnehes</span> also the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2821\">darkened,</span> when I shall <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> there the <span class=\"wl wl-kjv\" data-code=\"H4133\">yokes</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1347\">pomp</span> of her <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> shall <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> in <span class=\"wl wl-kjv\" data-code=\"H1931\">her:</span> as for her, a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> shall <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> her, and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into captivity.", "19": "Thus will I <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.", "20": "And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H259\">eleventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> month, in the <span class=\"wl wl-kjv\" data-code=\"H7651\">seventh</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,", "21": "<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> I have <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> and, lo, it shall not be bound <span class=\"wl wl-kjv\" data-code=\"H2280\">up</span> to be <span class=\"wl wl-kjv\" data-code=\"H7499\">healed,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H2848\">roller</span> to <span class=\"wl wl-kjv\" data-code=\"H2280\">bind</span> it, to make it <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> to <span class=\"wl wl-kjv\" data-code=\"H8610\">hold</span> the sword.", "22": "Therefore thus <span class=\ ded", "25": "But I will <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> shall fall <span class=\"wl wl-kjv\" data-code=\"H5307\">down;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when I shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and he shall stretch it <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.", "26": "And I will <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and <span class=\"wl wl-kjv\" data-code=\"H2219\">disperse</span> them among the <span class=\"wl wl-kjv\" data-code=\"H776\">countries;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
