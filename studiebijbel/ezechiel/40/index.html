am": "Romeinen", "href": "../../romeinen/1/"}, {"naam": "1 Korinthe", "href": "../../1-korinthe/1/"}, {"naam": "2 Korinthe", "href": "../../2-korinthe/1/"}, {"naam": "Galaten", "href": "../../galaten/1/"}, {"naam": "Efeze", "href": "../../efeze/1/"}, {"naam": "Filippenzen", "href": "../../filippenzen/1/"}, {"naam": "Kolossenzen", "href": "../../kolossenzen/1/"}, {"naam": "1 Thessalonicenzen", "href": "../../1-thessalonicenzen/1/"}, {"naam": "2 Thessalonicenzen", "href": "../../2-thessalonicenzen/1/"}, {"naam": "1 Timotheüs", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "2": "In visioenen van God bracht Hij mij naar het land Israël, en Hij zette mij op een zeer hoge berg; en daarop was als een gebouw van een stad, tegen het zuiden.", "3": "Toen Hij mij daarheen gebracht had, zie, er was een man, wiens verschijning was als de verschijning van koper; en in zijn hand was een linnen snoer en een meetriet; en hij stond in de poort.", "4": "En die man sprak tot mij: Mensenkind! zie met uw ogen, en hoor met uw oren, en zet uw hart op alles wat ik u zal laten zien; want om u dit te laten zien, bent u hierheen gebracht; verkondig daarna aan het huis van Israël alles wat u ziet.", "5": "En zie, er was een muur buiten om het huis heen, rondom, en in de hand van de man was een meetriet van zes ellen, elke el een el en een handbreed; en hij mat de breedte van het gebouw: één riet, en de hoogte: één riet.", "6": "Toen kwam hij bij de poort die naar het oosten keek, en hij ging de trappen ervan op, en mat de drempel van de poort: één riet de breedte, en de andere drempel: één riet de breedte.", "7": "En elk kamertje was één riet de lengte en één riet de breedte; en tussen de kamertjes was vijf ellen; en de drempel van de poort, bij het voorhuis van de poort aan de binnenkant, was één riet.", "8": "Ook mat hij het voorhuis van de poort aan de binnenkant: één riet.", "9": "Toen mat hij het andere voorhuis van de poort: acht ellen, en de posten ervan: twee ellen; en het voorhuis van de poort was aan de binnenkant.", "10": "En de kamertjes van de poort, de weg naar het oosten, waren drie aan deze en drie aan die kant; die drie hadden allemaal dezelfde maat; ook hadden de posten aan beide kanten dezelfde maat.", "11": "Verder mat hij de breedte van de deuropening van de poort: tien ellen; de lengte van de poort: dertien ellen.", "12": "En er was een afscheiding vóór de kamertjes, van één el aan deze kant, en een afscheiding van één el aan die kant; en elk kamertje: zes ellen aan deze, en zes ellen aan die kant.", "13": "Toen mat hij de poort, van het dak van het ene kamertje af tot aan het dak van het andere; de breedte was vijfentwintig ellen; deur tegenover deur.", "14": "Ook maakte hij posten van zestig ellen, namelijk tot de post van de voorhof, rondom de poort heen.", "15": "En van de voorkant van de ingangspoort tot aan de voorkant van het voorhuis van de binnenpoort was vijftig ellen.", "16": "En er waren smalle vensters bij de kamertjes en bij hun posten, naar binnen toe, in de poort, rondom; en zo ook bij de voorhuizen; de vensters waren rondom naar binnen toe, en bij de posten waren palmbomen.", "17": "Verder bracht hij mij naar de buitenste voorhof, en zie, er waren kamers, en een plaveisel, dat gemaakt was in de voorhof rondom; dertig kamers waren er op het plaveisel.", "18": "Het plaveisel nu lag aan de zijde van de poorten, langs de lengte van de poorten; dit was het lagere plaveisel.", "19": "En hij mat de breedte, vanaf de voorkant van de lagere poort tot de voorkant van de binnenste voorhof, aan de buitenkant: honderd ellen, oostwaarts en noordwaarts.", "20": "Aangaande de poort die naar het noorden keek, bij de buitenste voorhof: hij mat de lengte ervan en de breedte ervan.", "21": "En de kamertjes ervan, drie aan deze en drie aan die kant; en de posten ervan en de voorhuizen ervan waren volgens de maat van de eerste poort; vijftig ellen de lengte, en de breedte vijfentwintig ellen.", "22": "En de vensters ervan, en de voorhuizen ervan, en de palmbomen ervan, waren volgens de maat van de poort die naar het oosten keek; en men ging daarin op met zeven trappen, en de voorhuizen ervan waren aan de voorkant.", "23": "De poort van de binnenste voorhof lag nu tegenover de poort van het noorden en van het oosten; en hij mat van poort tot poort: honderd ellen.", "24": "Daarna leidde hij mij de weg naar het zuiden; en zie, er was een poort de weg naar het zuiden; en hij mat de posten ervan en de voorhuizen ervan, volgens deze maten.", "25": "En die had vensters, ook bij de voorhuizen, rondom, net als deze vensters; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.", "26": "En de opgangen ervan waren van zeven trappen, en de voorhuizen ervan lagen aan de voorkant; en die had palmbomen, één aan deze en één aan die kant, bij de posten.", "27": "Ook was er een poort in de binnenste voorhof, de weg naar het zuiden; en hij mat van poort tot poort, de weg naar het zuiden: honderd ellen.", "28": "Verder bracht hij mij door de zuiderpoort naar de binnenvoorhof; en hij mat de zuiderpoort volgens deze maten.", "29": "En de kamertjes ervan, en de posten ervan, en de voorhuizen ervan, waren volgens deze maten; en die had vensters, ook bij de voorhuizen, rondom; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.", "30": "En er waren voorhuizen rondom; de lengte was vijfentwintig ellen, en de breedte vijf ellen.", "31": "En de voorhuizen ervan lagen aan de buitenste voorhof, ook waren er palmbomen bij de posten ervan, en de opgangen ervan waren van acht trappen.", "32": "Daarna bracht hij mij naar de binnenste voorhof, de weg naar het oosten; en hij mat de poort volgens deze maten;", "33": "Ook de kamertjes ervan, en de posten ervan, en de voorhuizen ervan, volgens deze maten; en die had ook vensters bij de voorhuizen, rondom; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.", "34": "En de voorhuizen ervan lagen aan de buitenste voorhof; ook waren er palmbomen bij de posten ervan, aan deze en aan die kant; en de opgangen ervan waren van acht trappen.", "35": "Daarna bracht hij mij naar de noorderpoort; en hij mat volgens deze maten.", "36": "De kamertjes ervan, de posten ervan en de voorhuizen ervan; ook had die vensters, rondom; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.", "37": "En de posten ervan lagen aan de buitenste voorhof; ook waren er palmbomen bij de posten ervan, aan deze en aan die kant; en de opgangen ervan waren van acht trappen.", "38": "De kamers ervan nu, en de deuren ervan, waren bij de posten van de poorten; daar waste men het brandoffer.", "39": "En in het voorhuis van de poort waren twee tafels aan deze, en twee tafels aan die kant, om daarop te slachten het brandoffer, en het zondoffer, en het schuldoffer.", "40": "Ook waren er aan de buitenkant van de opgang, bij de deur van de noorderpoort, twee tafels; en aan de andere kant, die bij het voorhuis van de poort was, twee tafels.", "41": "Vier tafels aan deze, en vier tafels aan die kant, bij de zijkant van de poort: acht tafels, waarop men slachtte.", "42": "Maar de vier tafels voor het brandoffer waren van gehouwen steen, de lengte één el en een halve, en de breedte één el en een halve, en de hoogte één el; daarop nu legde men het gereedschap, waarmee men het brandoffer en het slachtoffer slachtte.", "43": "De haakjes nu waren één handbreed *dik*, stevig bevestigd in het huis, rondom; en op de tafels lag het offervlees.", "44": "En buiten de binnenste poort waren de kamers van de zangers, in de binnenste voorhof, die aan de kant van de noorderpoort was; en de voorkant ervan lag de weg naar het zuiden; één was er aan de kant van de oostpoort, kijkend de weg naar het noorden.", "45": "En hij sprak tot mij: Deze kamer, waarvan de voorkant de weg naar het zuiden ligt, is voor de priesters die de wacht van het huis waarnemen.", "46": "Maar de kamer, waarvan de voorkant de weg naar het noorden ligt, is voor de priesters die de wacht van het altaar waarnemen; dat zijn de kinderen van Zadok, die uit de kinderen van Levi tot de HEERE naderen om Hem te dienen.", "47": "En hij mat de voorhof: de lengte honderd ellen, en de breedte honderd ellen, vierkant; en het altaar was aan de voorkant van het huis.", "48": "Toen bracht hij mij naar het voorhuis van het huis, en hij mat elke post van het voorhuis: vijf ellen aan deze, en vijf ellen aan die kant; en de breedte van de poort: drie ellen aan deze, en drie ellen aan die kant.", "49": "De lengte van het voorhuis: twintig ellen, en de breedte: elf ellen; en het had trappen waarlangs men daarin opging; ook waren er pilaren bij de posten, één aan deze, en één aan die kant."}, "SV": {"1": "In het vijf en twintigste jaar onzer gevankelijke wegvoering, in het begin des jaars, op den tienden der maand, in het veertiende jaar, nadat de stad geslagen was; even op dienzelfden dag, was de hand des HEEREN op mij, en Hij bracht mij derwaarts.", "2": "In de gezichten Gods bracht Hij mij in het land Israëls, en Hij zette mij op een zeer hogen berg; en aan denzelven was als een gebouw ener stad tegen het zuiden.", "3": "Als Hij mij daarhenen gebracht had, ziet, zo was er een man, wiens gedaante was als de gedaante van koper; en in zijn hand was een linnen snoer, en een meetriet; en hij stond in de poort.", "4": "En die man sprak tot mij: Mensenkind! zie met uw ogen, en hoor met uw oren, en zet uw hart op alles, wat ik u zal doen zien; want, opdat ik u zou doen zien, zijt gij herwaarts gebracht; verkondig *daarna* den huize Israëls alles, wat gij ziet.", "5": "En ziet, er was een muur buiten aan het huis, rondom henen, en in des mans hand was een meetriet van zes ellen, *elke* *el* van een el en een handbreed, en hij mat de breedte des gebouws een riet, en de hoogte een riet.", "6": "Toen kwam hij tot de poort, welke zag den weg naar het oosten, en hij ging bij derzelver trappen op, en mat den dorpel der poort een riet de breedte, en den anderen dorpel een riet de breedte.", "7": "En *elk* kamertje een riet de lengte, en een riet de breedte; en tussen de kamertjes vijf ellen; en den dorpel der poort, bij het voorhuis der poort van binnen, een riet.", "8": "Ook mat hij het voorhuis der poort van binnen, een riet.", "9": "Toen mat hij het *andere* voorhuis der poort, acht ellen, en haar posten twee ellen; en het voorhuis der poort was van binnen.", "10": "En de kamertjes der poort, den weg naar het oosten, waren drie van deze, en drie van gene zijde; die drie hadden enerlei maat; ook hadden de posten, van deze en van gene zijde, enerlei maat.", "11": "Voorts mat hij de wijdte der deur van de poort tien ellen; de lengte der poort dertien ellen.", "12": "En er was een ruim voor aan de kamertjes, van een el *van* *deze*, en een ruim van een el van gene zijde; en *elk* kamertje zes ellen van deze, en zes ellen van gene zijde.", "13": "Toen mat hij de poort van het dak van het ene kamertje af tot aan het dak van een ander; de breedte was vijf en twintig ellen; deur was tegenover deur.", "14": "Ook maakte hij posten van zestig ellen, namelijk tot den post des voorhofs, rondom de poort henen.", "15": "En van het voorste deel der poort des ingangs, tot aan het voorste deel van het voorhuis van de binnenpoort, waren vijftig ellen.", "16": "En er waren gesloten vensters aan de kamertjes, en aan hun posten inwaarts in de poort rondom henen; alzo ook aan de voorhuizen; de vensters nu waren rondom henen inwaarts, en aan de posten waren palmbomen.", "17": "Voorts bracht hij mij in het buitenste voorhof, en ziet, er waren kameren, en een plaveisel, dat gemaakt was in het voorhof rondom henen, dertig kameren waren er op het plaveisel.", "18": "Het plaveisel nu was aan de zijde van de poorten, tegenover de lengte van de poorten; *dit* was het benedenste plaveisel.", "19": "En hij mat de breedte, van het voorste deel der benedenste poort af, voor aan het binnenste voorhof, van buiten, honderd ellen, oostwaarts en noordwaarts.", "20": "Aangaande de poort nu, die den weg naar het noorden zag, aan het buitenste voorhof, hij mat derzelver lengte en derzelver breedte.", "21": "En haar kamertjes, drie van deze en drie van gene zijde; en haar posten en haar voorhuizen waren naar de maat der eerste poort; vijftig ellen haar lengte, en de breedte van vijf en twintig ellen.", "22": "En haar vensters, en haar voorhuizen, en haar palmbomen, waren naar de maat der poort, die den weg naar het oosten zag; en men ging daarin op met zeven trappen, en haar voorhuizen waren voor aan dezelve.", "23": "De poort nu van het binnenste voorhof was tegenover de poort van het noorden en van het oosten; en hij mat van poort tot poort honderd ellen.", "24": "Daarna voerde hij mij den weg naar het zuiden; en ziet, er was een poort den weg naar het zuiden; en hij mat derzelver posten, en derzelver voorhuizen, naar deze maten.", "25": "En zij had vensteren, ook aan haar voorhuizen, rondom henen, gelijk deze vensteren; de lengte was vijftig ellen, en de breedte vijf en twintig ellen.", "26": "En haar opgangen waren van zeven trappen, en haar voorhuizen waren voor aan dezelve; en zij had palmbomen, een van deze, en een van gene zijde aan haar posten.", "27": "Ook was er een poort in het binnenste voorhof, den weg naar het zuiden; en hij mat van poort tot poort, den weg naar het zuiden, honderd ellen.", "28": "Voorts bracht hij mij door de zuiderpoort tot het binnenvoorhof; en hij mat de zuiderpoort naar deze maten.", "29": "En haar kamertjes, en haar posten, en haar voorhuizen waren naar deze maten; en zij had vensteren, ook in haar voorhuizen, rondom henen; de lengte was vijftig ellen, en de breedte vijf en twintig ellen.", "30": "En er waren voorhuizen rondom henen; de lengte was vijf en twintig ellen, en de breedte vijf ellen.", "31": "En haar voorhuizen waren aan het buitenste voorhof, ook waren er palmbomen aan haar posten, en haar opgangen waren van acht trappen.", "32": "Daarna bracht hij mij tot het binnenste voorhof, den weg naar het oosten; en hij mat de poort, naar deze maten;", "33": "Ook haar kamertjes, en haar posten, en haar voorhuizen naar deze maten; en zij had vensteren ook aan haar voorhuizen, rondom henen; de lengte was vijftig ellen, en de breedte vijf en twintig ellen.", "34": "En haar voorhuizen waren aan het buitenste voorhof; ook waren er palmbomen aan haar posten, van deze en van gene zijde; en haar opgangen waren van acht trappen.", "35": "Daarna bracht hij mij tot de noorderpoort; en hij mat naar deze maten.", "36": "Haar kamertjes, haar posten en haar voorhuizen; ook had zij vensteren rondom henen; de lengte was vijftig ellen en de breedte vijf en twintig ellen.", "37": "En haar posten waren aan het buitenste voorhof; ook waren er palmbomen aan haar posten, van deze en van gene zijde; en haar opgangen waren van acht trappen.", "38": "Haar kameren nu en haar deuren waren bij de posten der poorten; aldaar wies men het brandoffer.", "39": "En in het voorhuis der poort waren twee tafelen van deze, en twee tafelen van gene zijde, om daarop te slachten het brandoffer, en het zondoffer, en het schuldoffer.", "40": "Ook waren er aan de zijde van buiten des opgangs, aan de deur der noorderpoort, twee tafelen; en aan de andere zijde, die aan het voorhuis der poort was, twee tafelen.", "41": "Vier tafelen van deze, en vier tafelen van gene zijde, aan de zijde der poort, acht tafelen, waarop men slachtte.", "42": "Maar de vier tafelen voor het brandoffer waren van gehouwen stenen, de lengte een el en een halve, en de breedte een el en een halve, en de hoogte een el; op dezelve nu leide men het gereedschap henen, waarmede men het brandoffer en slachtoffer slachtte.", "43": "De haardstenen nu waren een handbreed *dik*, ordentelijk geschikt in het huis rondom henen; en op de tafelen was het offervlees.", "44": "En van buiten de binnenste poort waren de kameren der zangers, in het binnenste voorhof, dat aan de zijde van de noorderpoort was; en het voorste deel derzelve was den weg naar het zuiden; een was er aan de zijde van de oostpoort, ziende den weg naar het noorden.", "45": "En hij sprak tot mij: Deze kamer, welker voorste deel den weg naar het zuiden is, is voor de priesteren, die de wacht des huizes waarnemen.", "46": "Maar de kamer, welker voorste deel den weg naar het noorden is, is voor de priesteren, die de wacht des altaars waarnemen; dat zijn de kinderen van Zadok, die uit de kinderen van Levi tot den HEERE naderen, om Hem te dienen.", "47": "En hij mat het voorhof: de lengte honderd ellen, en de breedte honderd ellen, vierkant; en het altaar was voor aan het huis.", "48": "Toen bracht hij mij tot het voorhuis des huizes, en hij mat *elken* post van het voorhuis, vijf ellen van deze, en vijf ellen van gene zijde; en de breedte der poort, drie ellen van deze, en drie ellen van gene zijde.", "49": "De lengte van het voorhuis twintig ellen, en de breedte elf ellen; en het was met trappen, *bij* dewelke men daarin opging; ook waren er pilaren aan de posten, een van deze, en een van gene zijde."}, "KJV": {"1": "In the five and twentieth year of our captivity, in the beginning of the year, in the tenth *day* of the month, in the fourteenth year after that the city was smitten, in the selfsame day the hand of the LORD was upon me, and brought", "2": "In the visions of God brought he me into the land of Israel, and set me upon a very high mountain, by which *was* as the frame of a city on the south.", "3": "And he brought me thither, and, behold, *there was* a man, whose appearance *was* like the appearance of brass, with a line of flax in his hand, and a measuring reed; and he stood in the gate.", "4": "And the man said unto me, Son of man, behold with thine eyes, and hear with thine ears, and set thine heart upon all that I shall shew thee; for to the intent that I might shew *them* unto thee *art* thou brought hither: declare all that thou seest to the house of Israel.", "5": "And behold a wall on the outside of the house round about, and in the man's hand a measuring reed of six cubits *long* by the cubit and an hand breadth: so he measured the breadth of the building, one reed; and the height, one reed.", "6": "Then came he unto the gate which looketh toward the east, and went up the stairs thereof, and measured the threshold of the gate, *which was* one reed broad; and the other threshold *of the gate, which was* one reed broad.", "7": "And *every* little chamber *was* one reed long, and one reed broad; and between the little chambers *were* five cubits; and the threshold of the gate by the porch of the gate within *was* one reed.", "8": "He measured also the porch of the gate within, one reed.", "9": "Then measured he the porch of the gate, eight cubits; and the posts thereof, two cubits; and the porch of the gate *was* inward.", "10": "And the little chambers of the gate eastward *were* three on this side, and three on that side; they three *were* of one measure: and the posts had one measure", "11": "And he measured the breadth of the entry of the gate, ten cubits; *and* the length of the gate, thirteen cubits.", "12": "The space also before the little chambers *was* one cubit *on this side*, and the space *was* one cubit on that side: and the little chambers *were* six cubits on this side, and six cubits", "13": "He measured then the gate from the roof of *one* little chamber to the roof of another: the breadth *was* five and twenty cubits, door against door.", "14": "He made also posts of threescore cubits, even unto the post of the court round about the gate.", "15": "And from the face of the gate of the entrance unto the face of the porch of the inner gate *were* fifty cubits.", "16": "And *there were* narrow windows to the little chambers, and to their posts within the gate round about, and likewise to the arches: and windows *were* round about inward: and upon *each* post *were* palm trees.", "17": "Then brought he me into the outward court, and, lo, *there were* chambers, and a pavement made for the court round about: thirty chambers *were* upon the pavement.", "18": "And the pavement by the side of the gates over against the length of the gates *was* the lower pavement.", "19": "Then he measured the breadth from the forefront of the lower gate unto the forefront of the inner court without, an hundred cubits eastward and northward.", "20": "And the gate of the outward court that looked toward the north, he measured the length thereof, and the breadth", "21": "And the little chambers thereof *were* three on this side and three on that side; and the posts thereof and the arches thereof were after the measure of the first gate: the length thereof *was* fifty cubits, and the breadth five and twenty cubits.", "22": "And their windows, and their arches, and their palm trees, *were* after the measure of the gate that looketh toward the east; and they went up unto it by seven steps; and the arches thereof *were* before", "23": "And the gate of the inner court *was* over against the gate toward the north, and toward the east; and he measured from gate to gate an hundred cubits.", "24": "After that he brought me toward the south, and behold a gate toward the south: and he measured the posts thereof and the arches thereof according to these measures.", "25": "And *there were* windows in it and in the arches thereof round about, like those windows: the length *was* fifty cubits, and the breadth five and twenty cubits.", "26": "And *there were* seven steps to go up to it, and the arches thereof *were* before them: and it had palm trees, one on this side, and another on that side, upon the posts", "27": "And *there was* a gate in the inner court toward the south: and he measured from gate to gate toward the south an hundred cubits.", "28": "And he brought me to the inner court by the south gate: and he measured the south gate according to these measures;", "29": "And the little chambers thereof, and the posts thereof, and the arches thereof, according to these measures: and *there were* windows in it and in the arches thereof round about: *it was* fifty cubits long, and five and twenty cubits broad.", "30": "And the arches round about *were* five and twenty cubits long, and five cubits broad.", "31": "And the arches thereof *were* toward the utter court; and palm trees *were* upon the posts thereof: and the going up to it *had* eight steps.", "32": "And he brought me into the inner court toward the east: and he measured the gate according to these measures.", "33": "And the little chambers thereof, and the posts thereof, and the arches thereof, *were* according to these measures: and *there were* windows therein and in the arches thereof round about: *it was* fifty cubits long, and five and twenty cubits broad.", "34": "And the arches thereof *were* toward the outward court; and palm trees *were* upon the posts thereof, on this side, and on that side: and the going up to it *had* eight steps.", "35": "And he brought me to the north gate, and measured *it* according to these measures;", "36": "The little chambers thereof, the posts thereof, and the arches thereof, and the windows to it round about: the length *was* fifty cubits, and the breadth five and twenty cubits.", "37": "And the posts thereof *were* toward the utter court; and palm trees *were* upon the posts thereof, on this side, and on that side: and the going up to it *had* eight steps.", "38": "And the chambers and the entries thereof *were* by the posts of the gates, where they washed the burnt offering.", "39": "And in the porch of the gate *were* two tables on this side, and two tables on that side, to slay thereon the burnt offering and the sin offering and the trespass offering.", "40": "And at the side without, as one goeth up to the entry of the north gate, *were* two tables; and on the other side, which *was* at the porch of the gate, *were* two tables.", "41": "Four tables *were* on this side, and four tables on that side, by the side of the gate; eight tables, whereupon they slew", "42": "And the four tables *were* of hewn stone for the burnt offering, of a cubit and an half long, and a cubit and an half broad, and one cubit high: whereupon also they laid the instruments wherewith they slew the burnt offering and the sacrifice.", "43": "And within *were* hooks, an hand broad, fastened round about: and upon the tables *was* the flesh of the offering.", "44": "And without the inner gate *were* the chambers of the singers in the inner court, which *was* at the side of the north gate; and their prospect *was* toward the south: one at the side of the east gate *having* the prospect toward the north.", "45": "And he said unto me, This chamber, whose prospect *is* toward the south, *is* for the priests, the keepers of the charge of the house.", "46": "And the chamber whose prospect *is* toward the north *is* for the priests, the keepers of the charge of the altar: these *are* the sons of Zadok among the sons of Levi, which come near to the LORD to minister", "47": "So he measured the court, an hundred cubits long, and an hundred cubits broad, foursquare; and the altar *that was* before the house.", "48": "And he brought me to the porch of the house, and measured *each* post of the porch, five cubits on this side, and five cubits on that side: and the breadth of the gate *was* three cubits on this side, and three cubits", "49": "The length of the porch *was* twenty cubits, and the breadth eleven cubits; and *he brought me* by the steps whereby they went up to it: and *there were* pillars by the posts, one on this side, and another"}}, "tsk": {"1": [{"kopje": "In het vijfentwintigste", "refs": ["Ezech 1:2", "Ezech 8:1", "Ezech 29:17", "Ezech 32:1", "Ezech 32:17"]}, {"kopje": "nadat", "refs": ["Ezech 33:21", "2 Kon 25:1-30", "Jer 39:1-1  "href": "../../nave/p/?hl=Ezek.40.45#i16329", "refs": [], "kinderen": [{"label": "Chambers for, in the temple area", "href": "../../nave/p/?hl=Ezek.40.45#i16340", "refs": [{"disp": "Ezech 40:45", "href": "../../ezechiel/40/#v45", "ref": "Ezech 40:45", "svLabel": null}, {"disp": "Ezech 40:46", "href": "../../ezechiel/40/#v46", "ref": "Ezech 40:46", "svLabel": null}], "kinderen": []}]}]}]}, "46": {"nave": [{"topic": "Priest", "href": "../../nave/p/#t-priest", "kinderen": [{"label": "The Time Of Moses", "href": "../../nave/p/?hl=Ezek.40.46#i16329", "refs": [], "kinderen": [{"label": "Chambers for, in the temple area", "href": "../../nave/p/?hl=Ezek.40.46#i16340", "refs": [{"disp": "Ezech 40:45", "href": "../../ezechiel/40/#v45", "ref": "Ezech 40:45", "svLabel": null}, {"disp": "Ezech 40:46", "href": "../../ezechiel/40/#v46", "ref": "Ezech 40:46", "svLabel": null}], "kinderen": []}]}]}]}, "48": {"nave": [{"topic": "Temple", "href": "../../nave/t/#t-temple", "kinderen": [{"label": "Ezekiel' S Vision Of", "href": "../../nave/t/?hl=Ezek.40.48#i20306", "refs": [{"disp": "Ezech 37:26", "href": "../../ezechiel/37/#v26", "ref": "Ezech 37:26", "svLabel": null}, {"disp": "Ezech 37:28", "href": "../../ezechiel/37/#v28", "ref": "Ezech 37:28", "svLabel": null}, {"disp": "Ezech 40:48", "href": "../../ezechiel/40/#v48", "ref": "Ezech 40:48", "svLabel": null}], "kinderen": []}]}, {"topic": "Vision", "href": "../../nave/v/#t-vision", "kinderen": [{"label": "Of Ezekiel", "href": "../../nave/v/?hl=Ezek.40.48#i21396", "refs": [], "kinderen": [{"label": "Of the city and temple", "href": "../../nave/v/?hl=Ezek.40.48#i21401", "refs": [{"disp": "Ezech 40:48", "href": "../../ezechiel/40/#v48", "ref": "Ezech 40:48", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Ezech 46:9": "Maar als het volk van het land voor het aangezicht van de HEERE komt, op de vastgestelde feesten, dan zal wie door de weg van de noorderpoort binnengaat om te aanbidden, door de weg van de zuiderpoort weer uitgaan; en wie door de weg van de zuiderpoort binnengaat, zal door de weg van de noorderpoort weer uitgaan; hij zal niet terugkeren door de weg van de poort waardoor hij binnengekomen is, maar recht voor zich uit naar buiten gaan.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Ex 12:41": "En het gebeurde aan het einde van de vierhonderd en dertig jaren, op diezelfde dag gebeurde het, dat alle legers van de HEERE uit Egypteland gegaan zijn.", "Lev 1:3-17": "Als zijn offerande een brandoffer van runderen is, zal hij een volkomen mannetje offeren; aan de deur van de tent van de samenkomst zal hij dat offeren, naar zijn welgevallen, voor het aangezicht van de HEERE. En hij zal zijn hand op het hoofd van het brandoffer leggen, opdat het voor hem aangenaam is, om hem te verzoenen. Daarna zal hij het jonge rund slachten voor het aangezicht van de HEERE; en de zonen van Aäron, de priesters, zullen het bloed offeren, en het bloed sprengen rondom dat altaar, dat voor de deur van de tent van de samenkomst is.", "Ezech 10:18": "Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "1 Kon 6:4": "En hij maakte vensters aan het huis met gesloten traliewerk.", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Lev 7:2": "In de plaats waar zij het brandoffer slachten, zullen zij het schuldoffer slachten; en men zal het bloed ervan rondom op het altaar sprenkelen.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "1 Kron 16:41-43": "En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid. Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort. Zo ging het hele volk heen, ieder naar zijn huis; en David keerde zich om, om zijn huis te gaan zegenen.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Est 1:16": "Toen zei Memuchan voor het aangezicht van de koning en de vorsten: De koningin Vasthi heeft niet alleen tegen de koning misdaan, maar ook tegen alle vorsten, en tegen alle volken die in alle landschappen van de koning Ahasveros zijn.", "Neh 3:29": "Daarna verbeterde Zadok, de zoon van Immer, tegenover zijn huis. En na hem verbeterde Semaja, de zoon van Sechanja, de bewaarder van de Oostpoort.", "Lev 1:6": "Dan zal hij het brandoffer de huid aftrekken, en het in zijn stukken delen.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Gal 4:26": "Maar het Jeruzalem dat boven is, is vrij, en dat is onze aller moeder.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Lev 14:13": "Daarna zal hij dat lam slachten op de plaats waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, evenals het zondoffer, is voor de priester; het is allerheiligst.", "Hand 20:27": "Want ik heb niet nagelaten u heel de raad van God te verkondigen.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Dan 10:6": "En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "1 Kron 25:1-31": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.", "Joz 2:21": "Zij nu zei: Het is zo, naar uw woorden. Toen liet zij hen gaan; en zij gingen weg; en zij bond het scharlaken snoer aan het venster.", "Ezech 40:28-31": "Verder bracht hij mij door de zuiderpoort naar de binnenvoorhof; en hij mat de zuiderpoort volgens deze maten. En de kamertjes ervan, en de posten ervan, en de voorhuizen ervan, waren volgens deze maten; en die had vensters, ook bij de voorhuizen, rondom; de lengte was vijftig ellen, en de breedte vijfentwintig ellen. En er waren voorhuizen rondom; de lengte was vijfentwintig ellen, en de breedte vijf ellen.", "1 Kon 6:32": "De twee deuren waren ook van olijfhout; en hij graveerde daarop graveringen van cherubs, en van palmbomen, en van open bloemen, die hij met goud overtrok; ook trok hij goud over de cherubs en over de palmbomen.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "2 Kor 12:1-7": "Het is voor mij zeker niet nuttig om te roemen; want ik zal komen tot gezichten en openbaringen van de Heere. Ik ken een mens in Christus, van veertien jaar geleden (of het gebeurd is in het lichaam, weet ik niet, of buiten het lichaam, weet ik niet, God weet het) die opgetrokken is geweest tot in de derde hemel. En ik ken zo'n mens (of het in het lichaam, of buiten het lichaam gebeurd is, weet ik niet, God weet het),", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Ezech 47:2": "En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "2 Kron 4:5": "Haar dikte nu was een hand breed, en haar rand als het werk van de rand van een beker of een leliebloem, met een inhoud van vele bath; zij hield drie duizend.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "1 Kor 13:12": "Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Ezech 41:11": "De deuren nu van de zijkamers waren naar de leeggelaten plaats toe, de ene deur de weg naar het noorden, en de andere deur naar het zuiden; en de breedte van de leeggelaten plaats was vijf ellen rondom heen.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Ezech 41:8": "En ik zag de hoogte van het huis, rondom heen. De fundamenten van de zijkamers waren een vol riet, zes ellen, de el tot aan de oksel toe gerekend.", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "Jer 31:39": "En het meetsnoer zal verder daarnaast uitgaan tot aan de heuvel Gareb, en zich naar Goath omwenden.", "Ex 38:9-12": "Hij maakte ook de voorhof, aan de zuidkant zuidwaarts; de behangsels voor de voorhof waren van fijn getweernd linnen, honderd ellen lang. Hun twintig pilaren en de twintig voeten daarvan waren van koper; de haken van deze pilaren en hun banden waren van zilver. En aan de noordkant honderd ellen, hun twintig pilaren en de twintig voeten daarvan waren van koper; de haken van de pilaren en de banden daarvan waren van zilver.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Jer 52:1-34": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, van Libna. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had. Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Dan 7:1": "In het eerste jaar van Belsazar, de koning van Babel, zag Daniël een droom, en gezichten van zijn hoofd, op zijn bed; toen schreef hij die droom, en hij vertelde de hoofdsom van de zaken.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Joh 5:2": "En er is te Jeruzalem, bij de Schaapspoort, een badwater, dat in het Hebreeuws Bethesda genoemd wordt, met vijf zalen.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "Mal 2:4-7": "Dan zult u weten dat Ik dit gebod tot u gezonden heb, opdat Mijn verbond met Levi blijft bestaan, zegt de HEERE van de heerscharen. Mijn verbond met hem was het leven en de vrede; en Ik gaf hem die tot een vrees, en hij vreesde Mij, en hij werd om Mijn Naam bevreesd. De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Ezech 43:1": "Toen leidde hij mij tot de poort, de poort die de weg naar het oosten ziet.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "Openb 11:2": "En laat het voorhof erbuiten, dat van buiten de tempel is, en meet dat niet, want het is aan de heidenen gegeven; en zij zullen de heilige stad vertrappen, tweeënveertig maanden.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Hand 20:9": "En een zekere jongeman, met de naam Eutychus, zat in het venster en werd door een diepe slaap overvallen. Terwijl Paulus lang doorsprak, viel hij door de slaap naar beneden van de derde verdieping, en werd dood opgeraapt.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Jer 52:17-23": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel. Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed. En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Neh 13:9": "Vervolgens gaf ik bevel, en zij reinigden de kamers; en ik bracht daar de vaten van het huis van God weer in, met het spijsoffer en de wierook.", "Ezech 41:15": "Ook mat hij de lengte van het gebouw voor aan de afgesneden plaats die daarachter was, en de galerijen daarvan van deze en van de andere zijde, honderd ellen; met de binnenste tempel, en de voorhuizen van de voorhof.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Ezech 41:22": "De hoogte van het houten altaar was drie ellen, en zijn lengte twee ellen, en het had zijn hoeken; en zijn lengte en zijn wanden waren van hout. En hij sprak tot mij: Dit is de tafel die voor het aangezicht van de HEERE zal zijn.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Num 3:32": "De aanvoerder nu van de aanvoerders van Levi zal zijn Eleazar, de zoon van Aäron, de priester; zijn opzicht zal zijn over degenen, die de wacht van het heiligdom waarnemen.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Ezech 41:16": "De dorpels, en de gesloten vensters en de galerijen rondom die drie verdiepingen, tegenover de dorpel, waren beschoten met hout rondom heen, en van de grond tot aan de vensters; de vensters waren bedekt;", "Openb 11:1": "En mij werd een rietstok gegeven, een meetroede gelijk; en de engel stond en zei: Sta op, en meet de tempel van God en het altaar, en hen die daarin aanbidden.", "Ezech 43:8": "Als zij hun drempel stelden aan Mijn drempel, en hun post naast Mijn post, zodat er maar een wand tussen Mij en tussen hen was, en verontreinigden Mijn heilige Naam met hun gruwelen die zij deden; daarom heb Ik ze verteerd in Mijn toorn.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "1 Kon 6:5": "En rondom aan de wand van het huis bouwde hij kamers, aan de wanden van het huis rondom, zowel van de tempel als van het binnenste heiligdom¹. Zo maakte hij zijkamers rondom.", "Ezech 1:2": "Op de vijfde dag van die maand (dit was het vijfde jaar van de wegvoering van koning Jojachin),", "Ezech 1:7": "En hun voeten waren rechte voeten, en hun voetzolen waren gelijk de voetzool van een kalf, en glinsterden als de kleur van glad koper.", "Mal 1:12": "Maar u ontheiligt die, als u zegt: De tafel van de HEERE is verontreinigd, en haar inkomst, haar voedsel, is verachtelijk.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Ezech 17:23": "op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen.", "Lev 8:21": "Doch het ingewand en de schenkels waste hij met water; en Mozes stak die hele ram aan op het altaar; het was een brandoffer tot een liefelijke reuk, een vuuroffer was het voor de HEERE, zoals de HEERE Mozes geboden had.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Ezech 46:1": "Zo zegt de Heere HEERE: De poort van het binnenste voorhof, die naar het oosten kijkt, moet de zes werkdagen gesloten zijn; maar op de sabbatdag moet zij geopend worden; ook moet zij geopend worden op de dag van de nieuwe maan.", "Openb 21:12": "En zij had een grote en hoge muur, en had twaalf poorten, en bij de poorten twaalf engelen, en namen daarop geschreven, welke zijn de namen van de twaalf geslachten van de kinderen van Israël.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "1 Kron 9:18": "Ook tot nu toe, aan de poort van de koning oostwaarts, waren dezen de poortwachters onder de legers van de kinderen van Levi.", "1 Kon 6:3": "En het voorhuis, vooraan de tempel van dat huis, was in zijn lengte twintig ellen, overeenkomstig de breedte van het huis, tien ellen in zijn breedte, vooraan het huis.", "Hand 2:17": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Ex 37:12": "Hij maakte er ook een lijst omheen, een hand breed; en hij maakte een gouden krans rondom die lijst.", "Jer 52:21": "Aangaande de pilaren, achttien el was de hoogte van één pilaar, en een draad van twaalf el omving hem; en zijn dikte was vier vingers, en hij was hol.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Gen 26:8": "En het gebeurde, toen hij daar al lange tijd geweest was, dat Abimelech, de koning van de Filistijnen, uit het venster keek, en hij zag dat Izak met Rebekka, zijn vrouw, aan het vrijen was.", "Openb 21:16": "En de stad lag vierkant, en haar lengte was zo groot als haar breedte. En hij mat de stad met de rietstok op twaalfduizend stadiën; de lengte, en de breedte, en de hoogte daarvan waren gelijk.", "Hoogl 7:7": "Deze uw lengte is te vergelijken bij een palmboom, en uw borsten bij druiventrossen.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Ex 35:17": "De behangsels van de voorhof, zijn pilaren en zijn voeten; en het deksel van de poort van de voorhof;", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Lev 4:2": "Spreek tot de kinderen van Israël en zeg: Als een mens gezondigd zal hebben door afdwaling tegen een van de geboden van de HEERE, wat niet gedaan zou mogen worden, en tegen een daarvan gedaan zal hebben;", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "1 Kor 11:23": "Want ik heb van de Heere ontvangen, wat ik ook u overgegeven heb, dat de Heere Jezus in de nacht waarin Hij verraden werd, het brood nam;", "2 Kron 31:11": "Toen zei Hizkia dat men kamers aan het huis van de HEERE gereed zou maken; en zij maakten ze gereed.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Jes 14:13": "En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Ezech 48:11": "Het zal zijn voor de priesters, die geheiligd zijn uit de kinderen van Zadok, die Mijn wacht waargenomen hebben; die niet gedwaald hebben, zoals de kinderen van Israël dwaalden; zoals de andere Levieten gedwaald hebben.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Ex 25:25": "U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Num 16:5": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.", "Lev 6:13": "Het vuur zal voortdurend op het altaar brandend gehouden worden; het zal niet uitgeblust worden.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Ezech 32:17": "Verder gebeurde het in het twaalfde jaar, op de vijftiende dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Lev 6:16": "En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Ezech 32:1": "Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Ezech 43:19": "En u zult aan de Levitische priesters, die uit het nageslacht van Zadok zijn, die tot Mij naderen (spreekt de Heere HEERE), om Mij te dienen, geven een var, een jong rund, tot een zondoffer.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "1 Kon 7:26": "Haar dikte nu was een handbreed, en haar rand was gemaakt als de rand van een beker, met leliebloemen; zij hield tweeduizend bath.", "Ezech 46:2": "En de vorst zal binnengaan door de weg van het voorhuis van die poort van buiten, en zal staan bij de post van de poort; en de priesters zullen zijn brandoffers en zijn dankoffers bereiden, en hij zal aanbidden bij de drempel van de poort, en daarna uitgaan; maar de poort zal niet gesloten worden tot de avond.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Jes 48:2": "Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen is Zijn Naam.", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "Openb 21:10-23": "En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal. En zij had een grote en hoge muur, en had twaalf poorten, en bij de poorten twaalf engelen, en namen daarop geschreven, welke zijn de namen van de twaalf geslachten van de kinderen van Israël.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Deut 3:11": "Want Og, de koning van Bazan, was als enige van de overgeblevenen van de reuzen overgebleven; zie, zijn bed, een bed van ijzer, staat dat niet in Rabba van de kinderen van Ammon? Negen el is zijn lengte, en vier el zijn breedte, naar de elleboogsmaat van een man.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Ezech 45:19": "En de priester zal van het bloed van het zondoffer nemen, en het doen aan de posten van het huis, en aan de vier hoeken van het afzetsel van het altaar, en aan de posten van de poorten van het binnenste voorhof.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "1 Kor 10:16-21": "De drinkbeker der dankzegging, die wij zegenen met dankzegging, is die niet een gemeenschap met het bloed van Christus? Het brood dat wij breken, is dat niet een gemeenschap met het lichaam van Christus? Want er is één brood, en zo zijn wij, hoewel velen, één lichaam, omdat wij allen deel hebben aan dat ene brood. Kijk naar Israël, dat naar het vlees is; hebben zij die de offers eten geen gemeenschap met het altaar?", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "1 Kon 6:35": "En hij graveerde ze met cherubs, en palmbomen, en open bloemen, die hij met goud overtrok, precies passend op het gesneden werk.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Ezech 46:12": "En als de vorst een vrijwillig offer zal brengen, een brandoffer of dankoffers als een vrijwillig offer voor de HEERE, dan zal men hem de poort openen die naar het oosten kijkt; en hij zal zijn brandoffer en zijn dankoffers brengen, zoals hij dat gedaan zal hebben op de sabbatdag; en als hij weer naar buiten gaat, zal men de poort sluiten, nadat hij naar buiten gegaan is.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Ezech 41:18": "En het was gemaakt met cherubs en palmbomen, zodat er een palmboom was tussen cherub en cherub, en elke cherub had twee gezichten;", "Ezech 41:10": "En tussen de kamers was een breedte van twintig ellen, rondom het huis, rondom heen.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Lev 8:35": "U zult dan bij de deur van de tent der samenkomst blijven, dag en nacht, zeven dagen, en de wacht van de HEERE waarnemen, opdat u niet sterft; want zo is het mij geboden.", "Jes 53:10": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.", "Ezech 45:5": "Verder zullen de Levieten, de dienaars van het huis, ook de lengte hebben van vijfentwintigduizend, en de breedte van tienduizend, hun tot een bezitting, voor twintig kamers.", "Ezech 40:16-36": "En er waren smalle vensters bij de kamertjes en bij hun posten, naar binnen toe, in de poort, rondom; en zo ook bij de voorhuizen; de vensters waren rondom naar binnen toe, en bij de posten waren palmbomen. Verder bracht hij mij naar de buitenste voorhof, en zie, er waren kamers, en een plaveisel, dat gemaakt was in de voorhof rondom; dertig kamers waren er op het plaveisel. Het plaveisel nu lag aan de zijde van de poorten, langs de lengte van de poorten; dit was het lagere plaveisel.", "Ezech 41:25": "En aan diezelve, namelijk aan de deuren van de tempel, waren cherubs en palmbomen gemaakt, net zoals er aan de wanden gemaakt waren; en het hout aan het voorste deel van het voorhuis, aan de buitenkant, was dik.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Neh 13:5": "En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters.", "Ezech 41:21": "De posten van de tempel waren vierkant; en wat betreft het voorste deel van het heiligdom, de ene vorm was als de andere vorm.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "1 Kron 6:49": "Aäron nu en zijn zonen brachten reukwerk op het altaar van het brandoffer, en op het reukaltaar, aangesteld voor al het werk van het heilige der heiligen, en om voor Israël verzoening te doen, naar alles wat Mozes, de knecht van God, geboden had.", "Lev 1:9": "Maar zijn ingewand en zijn schenkels zal men met water wassen; en de priester zal dat alles aansteken op het altaar; het is een brandoffer, een vuuroffer, tot een liefelijke reuk voor de HEERE.", "1 Kron 28:6": "En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.", "2 Kon 25:1-30": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Ps 39:6": "Zie, U hebt mijn dagen een handbreed lang gemaakt, en mijn levensduur is als niets voor U; zeker, ieder mens, hoe vast hij ook staat, is enkel ijdelheid. Sela.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Ezech 10:5": "En het geruis van de vleugels van de cherubs werd gehoord tot het uiterste voorhof, als de stem van de Almachtige God, wanneer Hij spreekt.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "Micha 4:1": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de
