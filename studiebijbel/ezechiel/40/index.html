aar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.","2":"In visioenen van God bracht Hij mij naar het land Israël, en Hij zette mij op een zeer hoge berg; en daarop was als een gebouw van een stad, tegen het zuiden.","3":"Toen Hij mij daarheen gebracht had, zie, er was een man, wiens verschijning was als de verschijning van koper; en in zijn hand was een linnen snoer en een meetriet; en hij stond in de poort.","4":"En die man sprak tot mij: Mensenkind! zie met uw ogen, en hoor met uw oren, en zet uw hart op alles wat ik u zal laten zien; want om u dit te laten zien, bent u hierheen gebracht; verkondig daarna aan het huis van Israël alles wat u ziet.","5":"En zie, er was een muur buiten om het huis heen, rondom, en in de hand van de man was een meetriet van zes ellen, elke el een el en een handbreed; en hij mat de breedte van het gebouw: één riet, en de hoogte: één riet.","6":"Toen kwam hij bij de poort die naar het oosten keek, en hij ging de trappen ervan op, en mat de drempel van de poort: één riet de breedte, en de andere drempel: één riet de breedte.","7":"En elk kamertje was één riet de lengte en één riet de breedte; en tussen de kamertjes was vijf ellen; en de drempel van de poort, bij het voorhuis van de poort aan de binnenkant, was één riet.","8":"Ook mat hij het voorhuis van de poort aan de binnenkant: één riet.","9":"Toen mat hij het andere voorhuis van de poort: acht ellen, en de posten ervan: twee ellen; en het voorhuis van de poort was aan de binnenkant.","10":"En de kamertjes van de poort, de weg naar het oosten, waren drie aan deze en drie aan die kant; die drie hadden allemaal dezelfde maat; ook hadden de posten aan beide kanten dezelfde maat.","11":"Verder mat hij de breedte van de deuropening van de poort: tien ellen; de lengte van de poort: dertien ellen.","12":"En er was een afscheiding vóór de kamertjes, van één el aan deze kant, en een afscheiding van één el aan die kant; en elk kamertje: zes ellen aan deze, en zes ellen aan die kant.","13":"Toen mat hij de poort, van het dak van het ene kamertje af tot aan het dak van het andere; de breedte was vijfentwintig ellen; deur tegenover deur.","14":"Ook maakte hij posten van zestig ellen, namelijk tot de post van de voorhof, rondom de poort heen.","15":"En van de voorkant van de ingangspoort tot aan de voorkant van het voorhuis van de binnenpoort was vijftig ellen.","16":"En er waren smalle vensters bij de kamertjes en bij hun posten, naar binnen toe, in de poort, rondom; en zo ook bij de voorhuizen; de vensters waren rondom naar binnen toe, en bij de posten waren palmbomen.","17":"Verder bracht hij mij naar de buitenste voorhof, en zie, er waren kamers, en een plaveisel, dat gemaakt was in de voorhof rondom; dertig kamers waren er op het plaveisel.","18":"Het plaveisel nu lag aan de zijde van de poorten, langs de lengte van de poorten; dit was het lagere plaveisel.","19":"En hij mat de breedte, vanaf de voorkant van de lagere poort tot de voorkant van de binnenste voorhof, aan de buitenkant: honderd ellen, oostwaarts en noordwaarts.","20":"Aangaande de poort die naar het noorden keek, bij de buitenste voorhof: hij mat de lengte ervan en de breedte ervan.","21":"En de kamertjes ervan, drie aan deze en drie aan die kant; en de posten ervan en de voorhuizen ervan waren volgens de maat van de eerste poort; vijftig ellen de lengte, en de breedte vijfentwintig ellen.","22":"En de vensters ervan, en de voorhuizen ervan, en de palmbomen ervan, waren volgens de maat van de poort die naar het oosten keek; en men ging daarin op met zeven trappen, en de voorhuizen ervan waren aan de voorkant.","23":"De poort van de binnenste voorhof lag nu tegenover de poort van het noorden en van het oosten; en hij mat van poort tot poort: honderd ellen.","24":"Daarna leidde hij mij de weg naar het zuiden; en zie, er was een poort de weg naar het zuiden; en hij mat de posten ervan en de voorhuizen ervan, volgens deze maten.","25":"En die had vensters, ook bij de voorhuizen, rondom, net als deze vensters; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.","26":"En de opgangen ervan waren van zeven trappen, en de voorhuizen ervan lagen aan de voorkant; en die had palmbomen, één aan deze en één aan die kant, bij de posten.","27":"Ook was er een poort in de binnenste voorhof, de weg naar het zuiden; en hij mat van poort tot poort, de weg naar het zuiden: honderd ellen.","28":"Verder bracht hij mij door de zuiderpoort naar de binnenvoorhof; en hij mat de zuiderpoort volgens deze maten.","29":"En de kamertjes ervan, en de posten ervan, en de voorhuizen ervan, waren volgens deze maten; en die had vensters, ook bij de voorhuizen, rondom; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.","30":"En er waren voorhuizen rondom; de lengte was vijfentwintig ellen, en de breedte vijf ellen.","31":"En de voorhuizen ervan lagen aan de buitenste voorhof, ook waren er palmbomen bij de posten ervan, en de opgangen ervan waren van acht trappen.","32":"Daarna bracht hij mij naar de binnenste voorhof, de weg naar het oosten; en hij mat de poort volgens deze maten;","33":"Ook de kamertjes ervan, en de posten ervan, en de voorhuizen ervan, volgens deze maten; en die had ook vensters bij de voorhuizen, rondom; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.","34":"En de voorhuizen ervan lagen aan de buitenste voorhof; ook waren er palmbomen bij de posten ervan, aan deze en aan die kant; en de opgangen ervan waren van acht trappen.","35":"Daarna bracht hij mij naar de noorderpoort; en hij mat volgens deze maten.","36":"De kamertjes ervan, de posten ervan en de voorhuizen ervan; ook had die vensters, rondom; de lengte was vijftig ellen, en de breedte vijfentwintig ellen.","37":"En de posten ervan lagen aan de buitenste voorhof; ook waren er palmbomen bij de posten ervan, aan deze en aan die kant; en de opgangen ervan waren van acht trappen.","38":"De kamers ervan nu, en de deuren ervan, waren bij de posten van de poorten; daar waste men het brandoffer.","39":"En in het voorhuis van de poort waren twee tafels aan deze, en twee tafels aan die kant, om daarop te slachten het brandoffer, en het zondoffer, en het schuldoffer.","40":"Ook waren er aan de buitenkant van de opgang, bij de deur van de noorderpoort, twee tafels; en aan de andere kant, die bij het voorhuis van de poort was, twee tafels.","41":"Vier tafels aan deze, en vier tafels aan die kant, bij de zijkant van de poort: acht tafels, waarop men slachtte.","42":"Maar de vier tafels voor het brandoffer waren van gehouwen steen, de lengte één el en een halve, en de breedte één el en een halve, en de hoogte één el; daarop nu legde men het gereedschap, waarmee men het brandoffer en het slachtoffer slachtte.","43":"De haakjes nu waren één handbreed *dik*, stevig bevestigd in het huis, rondom; en op de tafels lag het offervlees.","44":"En buiten de binnenste poort waren de kamers van de zangers, in de binnenste voorhof, die aan de kant van de noorderpoort was; en de voorkant ervan lag de weg naar het zuiden; één was er aan de kant van de oostpoort, kijkend de weg naar het noorden.","45":"En hij sprak tot mij: Deze kamer, waarvan de voorkant de weg naar het zuiden ligt, is voor de priesters die de wacht van het huis waarnemen.","46":"Maar de kamer, waarvan de voorkant de weg naar het noorden ligt, is voor de priesters die de wacht van het altaar waarnemen; dat zijn de kinderen van Zadok, die uit de kinderen van Levi tot de HEERE naderen om Hem te dienen.","47":"En hij mat de voorhof: de lengte honderd ellen, en de breedte honderd ellen, vierkant; en het altaar was aan de voorkant van het huis.","48":"Toen bracht hij mij naar het voorhuis van het huis, en hij mat elke post van het voorhuis: vijf ellen aan deze, en vijf ellen aan die kant; en de breedte van de poort: drie ellen aan deze, en drie ellen aan die kant.","49":"De lengte van het voorhuis: twintig ellen, en de breedte: elf ellen; en het had trappen waarlangs men daarin opging; ook waren er pilaren bij de posten, één aan deze, en één aan die kant."},"SV":{"1":"In het vijf en twintigste jaar onzer gevankelijke wegvoering, in het begin des jaars, op den tienden der maand, in het veertiende jaar, nadat de stad geslagen was; even op dienzelfden dag, was de hand des HEEREN op mij, en Hij bracht mij derwaarts.","2":"In de gezichten Gods bracht Hij mij in het land Israëls, en Hij zette mij op een zeer hogen berg; en aan denzelven was als een gebouw ener stad tegen het zuiden.","3":"Als Hij mij daarhenen gebracht had, ziet, zo was er een man, wiens gedaante was als de gedaante van koper; en in zijn hand was een linnen snoer, en een meetriet; en hij stond in de poort.","4":"En die man sprak tot mij: Mensenkind! zie met uw ogen, en hoor met uw oren, en zet uw hart op alles, wat ik u zal doen zien; want, opdat ik u zou doen zien, zijt gij herwaarts gebracht; verkondig *daarna* den huize Israëls alles, wat gij ziet.","5":"En ziet, er was een muur buiten aan het huis, rondom henen, en in des mans hand was een meetriet van zes ellen, *elke* *el* van een el en een handbreed, en hij mat de breedte des gebouws een riet, en de hoogte een riet.","6":"Toen kwam hij tot de poort, welke zag den weg naar het oosten, en hij ging bij derzelver trappen op, en mat den dorpel der poort een riet de breedte, en den anderen dorpel een riet de breedte.","7":"En *elk* kamertje een riet de lengte, en een riet de breedte; en tussen de kamertjes vijf ellen; en den dorpel der poort, bij het voorhuis der poort van binnen, een riet.","8":"Ook mat hij het voorhuis der poort van binnen, een riet.","9":"Toen mat hij het *andere* voorhuis der poort, acht ellen, en haar posten twee ellen; en het voorhuis der poort was van binnen.","10":"En de kamertjes der poort, den weg naar het oosten, waren drie van deze, en drie van gene zijde; die drie hadden enerlei maat; ook hadden de posten, van deze en van gene zijde, enerlei maat.","11":"Voorts mat hij de wijdte der deur van de poort tien ellen; de lengte der poort dertien ellen.","12":"En er was een ruim voor aan de kamertjes, van een el *van* *deze*, en een ruim van een el van gene zijde; en *elk* kamertje zes ellen van deze, en zes ellen van gene zijde.","13":"Toen mat hij de poort van het dak van het ene kamertje af tot aan het dak van een ander; de breedte was vijf en twintig ellen; deur was tegenover deur.","14":"Ook maakte hij posten van zestig ellen, namelijk tot den post des voorhofs, rondom de poort henen.","15":"En van het voorste deel der poort des ingangs, tot aan het voorste deel van het voorhuis van de binnenpoort, waren vijftig ellen.","16":"En er waren gesloten vensters aan de kamertjes, en aan hun posten inwaarts in de poort rondom henen; alzo ook aan de voorhuizen; de vensters nu waren rondom henen inwaarts, en aan de posten waren palmbomen.","17":"Voorts bracht hij mij in het buitenste voorhof, en ziet, er waren kameren, en een plaveisel, dat gemaakt was in het voorhof rondom henen, dertig kameren waren er op het plaveisel.","18":"Het plaveisel nu was aan de zijde van de poorten, tegenover de lengte van de poorten; *dit* was het benedenste plaveisel.","19":"En hij mat de breedte, van het voorste deel der benedenste poort af, voor aan het binnenste voorhof, van buiten, honderd ellen, oostwaarts en noordwaarts.","20":"Aangaande de poort nu, die den weg naar het noorden zag, aan het buitenste voorhof, hij mat derzelver lengte en derzelver breedte.","21":"En haar kamertjes, drie van deze en drie van gene zijde; en haar posten en haar voorhuizen waren naar de maat der eerste poort; vijftig ellen haar lengte, en de breedte van vijf en twintig ellen.","22":"En haar vensters, en haar voorhuizen, en haar palmbomen, waren naar de maat der poort, die den weg naar het oosten zag; en men ging daarin op met zeven trappen, en haar voorhuizen waren voor aan dezelve.","23":"De poort nu van het binnenste voorhof was tegenover de poort van het noorden en van het oosten; en hij mat van poort tot poort honderd ellen.","24":"Daarna voerde hij mij den weg naar het zuiden; en ziet, er was een poort den weg naar het zuiden; en hij mat derzelver posten, en derzelver voorhuizen, naar deze maten.","25":"En zij had vensteren, ook aan haar voorhuizen, rondom henen, gelijk deze vensteren; de lengte was vijftig ellen, en de breedte vijf en twintig ellen.","26":"En haar opgangen waren van zeven trappen, en haar voorhuizen waren voor aan dezelve; en zij had palmbomen, een van deze, en een van gene zijde aan haar posten.","27":"Ook was er een poort in het binnenste voorhof, den weg naar het zuiden; en hij mat van poort tot poort, den weg naar het zuiden, honderd ellen.","28":"Voorts bracht hij mij door de zuiderpoort tot het binnenvoorhof; en hij mat de zuiderpoort naar deze maten.","29":"En haar kamertjes, en haar posten, en haar voorhuizen waren naar deze maten; en zij had vensteren, ook in haar voorhuizen, rondom henen; de lengte was vijftig ellen, en de breedte vijf en twintig ellen.","30":"En er waren voorhuizen rondom henen; de lengte was vijf en twintig ellen, en de breedte vijf ellen.","31":"En haar voorhuizen waren aan het buitenste voorhof, ook waren er palmbomen aan haar posten, en haar opgangen waren van acht trappen.","32":"Daarna bracht hij mij tot het binnenste voorhof, den weg naar het oosten; en hij mat de poort, naar deze maten;","33":"Ook haar kamertjes, en haar posten, en haar voorhuizen naar deze maten; en zij had vensteren ook aan haar voorhuizen, rondom henen; de lengte was vijftig ellen, en de breedte vijf en twintig ellen.","34":"En haar voorhuizen waren aan het buitenste voorhof; ook waren er palmbomen aan haar posten, van deze en van gene zijde; en haar opgangen waren van acht trappen.","35":"Daarna bracht hij mij tot de noorderpoort; en hij mat naar deze maten.","36":"Haar kamertjes, haar posten en haar voorhuizen; ook had zij vensteren rondom henen; de lengte was vijftig ellen en de breedte vijf en twintig ellen.","37":"En haar posten waren aan het buitenste voorhof; ook waren er palmbomen aan haar posten, van deze en van gene zijde; en haar opgangen waren van acht trappen.","38":"Haar kameren nu en haar deuren waren bij de posten der poorten; aldaar wies men het brandoffer.","39":"En in het voorhuis der poort waren twee tafelen van deze, en twee tafelen van gene zijde, om daarop te slachten het brandoffer, en het zondoffer, en het schuldoffer.","40":"Ook waren er aan de zijde van buiten des opgangs, aan de deur der noorderpoort, twee tafelen; en aan de andere zijde, die aan het voorhuis der poort was, twee tafelen.","41":"Vier tafelen van deze, en vier tafelen van gene zijde, aan de zijde der poort, acht tafelen, waarop men slachtte.","42":"Maar de vier tafelen voor het brandoffer waren van gehouwen stenen, de lengte een el en een halve, en de breedte een el en een halve, en de hoogte een el; op dezelve nu leide men het gereedschap henen, waarmede men het brandoffer en slachtoffer slachtte.","43":"De haardstenen nu waren een handbreed *dik*, ordentelijk geschikt in het huis rondom henen; en op de tafelen was het offervlees.","44":"En van buiten de binnenste poort waren de kameren der zangers, in het binnenste voorhof, dat aan de zijde van de noorderpoort was; en het voorste deel derzelve was den weg naar het zuiden; een was er aan de zijde van de oostpoort, ziende den weg naar het noorden.","45":"En hij sprak tot mij: Deze kamer, welker voorste deel den weg naar het zuiden is, is voor de priesteren, die de wacht des huizes waarnemen.","46":"Maar de kamer, welker voorste deel den weg naar het noorden is, is voor de priesteren, die de wacht des altaars waarnemen; dat zijn de kinderen van Zadok, die uit de kinderen van Levi tot den HEERE naderen, om Hem te dienen.","47":"En hij mat het voorhof: de lengte honderd ellen, en de breedte honderd ellen, vierkant; en het altaar was voor aan het huis.","48":"Toen bracht hij mij tot het voorhuis des huizes, en hij mat *elken* post van het voorhuis, vijf ellen van deze, en vijf ellen van gene zijde; en de breedte der poort, drie ellen van deze, en drie ellen van gene zijde.","49":"De lengte van het voorhuis twintig ellen, en de breedte elf ellen; en het was met trappen, *bij* dewelke men daarin opging; ook waren er pilaren aan de posten, een van deze, en een van gene zijde."},"KJV":{"1":"In the five and twentieth year of our captivity, in the beginning of the year, in the tenth *day* of the month, in the fourteenth year after that the city was smitten, in the selfsame day the hand of the LORD was upon me, and brought","2":"In the visions of God brought he me into the land of Israel, and set me upon a very high mountain, by which *was* as the frame of a city on the south.","3":"And he brought me thither, and, behold, *there was* a man, whose appearance *was* like the appearance of brass, with a line of flax in his hand, and a measuring reed; and he stood in the gate.","4":"And the man said unto me, Son of man, behold with thine eyes, and hear with thine ears, and set thine heart upon all that I shall shew thee; for to the intent that I might shew *them* unto thee *art* thou brought hither: declare all that thou seest to the house of Israel.","5":"And behold a wall on the outside of the house round about, and in the man's hand a measuring reed of six cubits *long* by the cubit and an hand breadth: so he measured the breadth of the building, one reed; and the height, one reed.","6":"Then came he unto the gate which looketh toward the east, and went up the stairs thereof, and measured the threshold of the gate, *which was* one reed broad; and the other threshold *of the gate, which was* one reed broad.","7":"And *every* little chamber *was* one reed long, and one reed broad; and between the little chambers *were* five cubits; and the threshold of the gate by the porch of the gate within *was* one reed.","8":"He measured also the porch of the gate within, one reed.","9":"Then measured he the porch of the gate, eight cubits; and the posts thereof, two cubits; and the porch of the gate *was* inward.","10":"And the little chambers of the gate eastward *were* three on this side, and three on that side; they three *were* of one measure: and the posts had one measure","11":"And he measured the breadth of the entry of the gate, ten cubits; *and* the length of the gate, thirteen cubits.","12":"The space also before the little chambers *was* one cubit *on this side*, and the space *was* one cubit on that side: and the little chambers *were* six cubits on this side, and six cubits","13":"He measured then the gate from the roof of *one* little chamber to the roof of another: the breadth *was* five and twenty cubits, door against door.","14":"He made also posts of threescore cubits, even unto the post of the court round about the gate.","15":"And from the face of the gate of the entrance unto the face of the porch of the inner gate *were* fifty cubits.","16":"And *there were* narrow windows to the little chambers, and to their posts within the gate round about, and likewise to the arches: and windows *were* round about inward: and upon *each* post *were* palm trees.","17":"Then brought he me into the outward court, and, lo, *there were* chambers, and a pavement made for the court round about: thirty chambers *were* upon the pavement.","18":"And the pavement by the side of the gates over against the length of the gates *was* the lower pavement.","19":"Then he measured the breadth from the forefront of the lower gate unto the forefront of the inner court without, an hundred cubits eastward and northward.","20":"And the gate of the outward court that looked toward the north, he measured the length thereof, and the breadth","21":"And the little chambers thereof *were* three on this side and three on that side; and the posts thereof and the arches thereof were after the measure of the first gate: the length thereof *was* fifty cubits, and the breadth five and twenty cubits.","22":"And their windows, and their arches, and their palm trees, *were* after the measure of the gate that looketh toward the east; and they went up unto it by seven steps; and the arches thereof *were* before","23":"And the gate of the inner court *was* over against the gate toward the north, and toward the east; and he measured from gate to gate an hundred cubits.","24":"After that he brought me toward the south, and behold a gate toward the south: and he measured the posts thereof and the arches thereof according to these measures.","25":"And *there were* windows in it and in the arches thereof round about, like those windows: the length *was* fifty cubits, and the breadth five and twenty cubits.","26":"And *there were* seven steps to go up to it, and the arches thereof *were* before them: and it had palm trees, one on this side, and another on that side, upon the posts","27":"And *there was* a gate in the inner court toward the south: and he measured from gate to gate toward the south an hundred cubits.","28":"And he brought me to the inner court by the south gate: and he measured the south gate according to these measures;","29":"And the little chambers thereof, and the posts thereof, and the arches thereof, according to these measures: and *there were* windows in it and in the arches thereof round about: *it was* fifty cubits long, and five and twenty cubits broad.","30":"And the arches round about *were* five and twenty cubits long, and five cubits broad.","31":"And the arches thereof *were* toward the utter court; and palm trees *were* upon the posts thereof: and the going up to it *had* eight steps.","32":"And he brought me into the inner court toward the east: and he measured the gate according to these measures.","33":"And the little chambers thereof, and the posts thereof, and the arches thereof, *were* according to these measures: and *there were* windows therein and in the arches thereof round about: *it was* fifty cubits long, and five and twenty cubits broad.","34":"And the arches thereof *were* toward the outward court; and palm trees *were* upon the posts thereof, on this side, and on that side: and the going up to it *had* eight steps.","35":"And he brought me to the north gate, and measured *it* according to these measures;","36":"The little chambers thereof, the posts thereof, and the arches thereof, and the windows to it round about: the length *was* fifty cubits, and the breadth five and twenty cubits.","37":"And the posts thereof *were* toward the utter court; and palm trees *were* upon the posts thereof, on this side, and on that side: and the going up to it *had* eight steps.","38":"And the chambers and the entries thereof *were* by the posts of the gates, where they washed the burnt offering.","39":"And in the porch of the gate *were* two tables on this side, and two tables on that side, to slay thereon the burnt offering and the sin offering and the trespass offering.","40":"And at the side without, as one goeth up to the entry of the north gate, *were* two tables; and on the other side, which *was* at the porch of the gate, *were* two tables.","41":"Four tables *were* on this side, and four tables on that side, by the side of the gate; eight tables, whereupon they slew","42":"And the four tables *were* of hewn stone for the burnt offering, of a cubit and an half long, and a cubit and an half broad, and one cubit high: whereupon also they laid the instruments wherewith they slew the burnt offering and the sacrifice.","43":"And within *were* hooks, an hand broad, fastened round about: and upon the tables *was* the flesh of the offering.","44":"And without the inner gate *were* the chambers of the singers in the inner court, which *was* at the side of the north gate; and their prospect *was* toward the south: one at the side of the east gate *having* the prospect toward the north.","45":"And he said unto me, This chamber, whose prospect *is* toward the south, *is* for the priests, the keepers of the charge of the house.","46":"And the chamber whose prospect *is* toward the north *is* for the priests, the keepers of the charge of the altar: these *are* the sons of Zadok among the sons of Levi, which come near to the LORD to minister","47":"So he measured the court, an hundred cubits long, and an hundred cubits broad, foursquare; and the altar *that was* before the house.","48":"And he brought me to the porch of the house, and measured *each* post of the porch, five cubits on this side, and five cubits on that side: and the breadth of the gate *was* three cubits on this side, and three cubits","49":"The length of the porch *was* twenty cubits, and the breadth eleven cubits; and *he brought me* by the steps whereby they went up to it: and *there were* pillars by the posts, one on this side, and another"}},"tsk":{"1":[{"kopje":"In het vijfentwintigste","refs":["Ezech 1:2","Ezech 8:1","Ezech 29:17","Ezech 32:1","Ezech 32:17"]},{"kopje":"nadat","refs":["Ezech 33:21","2 Kon 25:1-30","Jer 39:1-18","Jer 52:1-34"]},{"kopje":"diezelfde","refs":["Ex 12:41"]},{"kopje":"hand","refs":["Ezech 1:3","Ezech 3:14","Ezech 3:22","Ezech 11:24","Ezech 37:1","Openb 1:10"]}],"2":[{"kopje":"In visioenen","refs":["Ezech 1:1","Ezech 8:3","Dan 7:1","Dan 7:7","Hand 2:17","Hand 16:9","2 Kor 12:1-7"]},{"kopje":"een zeer","refs":["Ezech 17:22","Ezech 17:23","Jes 2:2","Jes 2:3","Dan 2:34","Dan 2:35","Micha 4:1","Openb 21:10"]},{"kopje":"als een","refs":["Ezech 48:30-35","Gal 4:26","Openb 21:10-23"]},{"kopje":"gebouw","refs":["1 Kron 28:12","1 Kron 28:19"]},{"kopje":"tegen het zuiden","refs":["Jes 48:2","Jes 14:13"]}],"3":[{"kopje":"wiens","refs":["Ezech 1:7","Ezech 1:27","Dan 10:5","Dan 10:6","Openb 1:15"]},{"kopje":"in","refs":["Ezech 47:3","Jes 8:20","Jes 28:17","Zach 2:1","Zach 2:2","Openb 11:1","Openb 21:15"]}],"4":[{"kopje":"zie","refs":["Ezech 2:7","Ezech 2:8","Ezech 3:17","Ezech 43:10","Ezech 44:5","Matt 10:27","Matt 13:9","Mat weten in het land Israël; versta in een gezicht, gelijk volgt."}],"2":[{"catchword":"gezichten Gods","tekst":"Zie boven Eze 1:1 , en Eze 8:3 ."},{"catchword":"Hij mij in het land Israëls,","tekst":"De Heere."},{"catchword":"Hij zette mij op een zeer hogen","tekst":"Vergelijk Rev 21:10 . Zie van het Hebreeuwse woord boven Eze 37:1 ."},{"catchword":"berg;","tekst":"Het is aanmerkelijk dat noch berg, noch stad, zo hier als in het volgende, genoemd wordt, maar alleen door het woord als, bedektelijk, als met den vinger, op Zion of Maria, en Jeruzalem gewezen, hetwelk dienen kon om onze gedachten te meer van het aardse Zion en Jeruzalem af te trekken, en te leiden tot het hemelse en geestelijke, te weten Gods ker, onze aller moeder, Gal 4:26 , welker naam zal zijn: de HEERE is aldaar; onder Eze 48:35 . Tot gelijk einde kon strekken het onderscheid, dat er is tussen dit ganse gebouw en de voorgaanden tempel van Salomo en den anderen, die na de wederkomst uit Babel gebouwd is. Waarom ook nergens in Ezra, Nehemia, Haggaï en Zacharia gevonden wordt dat men in de wederopbouwing van den tempel of der stad zich zou hebben geschikt naar dit verborgen gezicht, hetwelk zelfs verscheidene Joodse rabbijnen moeten bekennen te zien op den tijd van den Messias."},{"catchword":"zuiden","tekst":"Ezechiël, staande in het noorden, [waar de tempel geweest was. Zie Psa 48:3 ] , zag ene stad voor zich in het zuiden."}],"3":[{"catchword":"daarhenen gebracht had,","tekst":"Of, had doen ingaan, ingebracht had."},{"catchword":"man,","tekst":"Men kan hierdoor, met de meeste uitleggers, verstaan den Heere Christus, als den oppersten stichter van zijn huis, die hier niet verschijnt in schrikkelijke majesteit, als een rechter, maar lieflijk als een bouwmeester; of immers een engel, dien het den Zoon Gods geliefd heeft daartoe te gebruiken. Vergelijk boven Eze 1:26 , en Eze 9:2 , en Eze 10:2 ; Zec 6:12 , enz.; Rev 11:1 ; idem onder Eze 43:6 , alwaar het schijnt dat dezen man onderscheiden wordt van den Heere sprekende uit den tempel."},{"catchword":"koper;","tekst":"Of, staal, zijnde schoon en net, hard en duurzaam. Vergelijk Rev 1:15 ; idem boven Eze 1:7 , en wijders Psa 45:3 , en Psa 102:27-28 , doch hier niet als een brandende hasmal, boven Eze 1:4 , Eze 1:27 ."},{"catchword":"hand","tekst":"Als hebbende het beleid en de bediening van dit geestelijk gebouw."},{"catchword":"linnen snoer,","tekst":"Als een landmeter; want toen placht men met snoeren of koorden het land af te meten en te delen. Zie onder Eze 47:3 , Eze 47:13 , met de aantekening, en vergelijk Rev 21:15 ; Zec 2:1 wordt het genoemd een meetsnoer."},{"catchword":"meetriet;","tekst":"Gelijk een bouwmeester, om dit nieuwe gebouw juist af te meten, dat men te dien einde veel met rieten [zijnde daartoe zeer bekwaam] gewoon was te doen, waarvoor wij het woord meetroede zouden kunnen gebruiken. Zie Rev 11:1 . Alzo moet Gods huis naar zijn raad en woord gesticht en gericht worden, als naar de enige regelmaat en het souvereine richtsnoer aller stichting; zie hierop de manier van spreken Isa 28:10 ; Gal 6:16 ; Phi 3:16 , en daarvan worden de boeken der Heilige Schriftuur kanoniek genoemd. Vergelijk Exo 25:9 , Exo 25:40 ; Act 7:44 ; Heb 8:5 . Voorts kan men, aangaande de ganse metingen van dit geestelijke gebouw vergelijken Eph 3:17-19 ."},{"catchword":"in de poort","tekst":"Als Heere des huizes en erfgenaam van alles, openende en sluitende; of immers, als last van dien hebbende. Zie Joh 10:2-3 ; Heb 1:2 , en Heb 3:3 , Heb 3:6 ; Rev 3:7 . Anders: bij de poort, of in ene poort."}],"4":[{"catchword":"Mensenkind","tekst":"Zie boven Eze 2:1 ."},{"catchword":"zie met uw ogen,","tekst":"Dat is, let met zonderlinge aandacht op alles wat gij ziet en hoort, opdat gij het volk Gods getrouwelijk moogt voordragen, gelijk volgt. Vergelijk Mat 10:27 ; Luk 12:3 ; Act 20:20 , Act 20:27 ; 1Co 11:23 , enz., en wijders in het algemeen, 1Co 12:7 ; alzo onder Eze 43:10-11 ."}],"5":[{"catchword":"muur buiten aan het huis,","tekst" leden van Christus in zijn huis, of, [om zo te spreken] onder zijn dak, hoede en bescherming op aarde, en daarna in de hemelse woonsteden. Zie Psa 22:31 , en Psa 87:4-6 ; Isa 54:3 , enz., en Isa 60:4 , enz.; Mat 25:10 ; Luk 16:9 ; Act 2:41-42 , enz."},{"catchword":"tussen de kamertjes","tekst":"Dat is, de plaats of het ruim, spatie tussen de kamertJes."},{"catchword":"dorpel der poort,","tekst":"Dat is, beide dorpels [gelijk sommigen] gelijk vs.6."},{"catchword":"voorhuis der poort","tekst":"Of, portaal, en zo in het volgende, gelijk sommigen dit nemen."}],"8":[{"catchword":"Ook mat hij het voorhuis","tekst":"Anders: en als hij gemeten had, enz., en dan vs.9, zo mat hij, enz."},{"catchword":"binnen,","tekst":"Of, inwendig, inwaarts."}],"9":[{"catchword":"haar posten","tekst":"Te weten van de poort, of zijne, te weten van het voorhuis of portaal."},{"catchword":"en het voorhuis der poort","tekst":"Anders: te weten het voorhuis der poort van binnen."}],"10":[{"catchword":"drie van deze,","tekst":"Hebreeuws, drie van hier en drie van hier; dat is, van daar, waarvan de zin is, naar den aard der Hebreeuwse spraak, zulks als in den tekst staat en zo in het volgende."}],"12":[{"catchword":"ruimte","tekst":"Hebreeuws, grens, paal."},{"catchword":"voor aan de kamertjes,","tekst":"Hebreeuws, voor het aangezicht."}],"13":[{"catchword":"van een kamertje af","tekst":"Anders: van het dak der kamertjes af tot haar [der poorten] dak toe."}],"14":[{"catchword":"maakte hij posten","tekst":"Dat is, hij mat, gelijk velen dit hier verstaan, alzo het gebouw al gemaakt of gereed was. Zie boven vs.5."},{"catchword":"voorhofs,","tekst":"De voorhoven des Heeren, waarin Gods volk zich placht te onthouden, [die er verscheidene geweest zijn voor dezen tempel, gelijk in het volgende verhaald wordt], houden enigen als ene afbeelding van de uitbreiding der kerk van het Nieuwe Testament in vele bijzondere kerken door de ganse wereld vergaderd, doch allen behorende tot het lichaam der algemene kerk  vs.46 te zien is; gelijk onder Eze 44:14-15 tussen de wacht en van het huis en van het heiligdom."}],"46":[{"catchword":"wacht des altaars waarnemen;","tekst":"Dat is, de bediening van het brandofferaltaar; waardoor sommigen [gelijk in het voorgaande vs.] verstaan den dienst der Levieten, dien zij den priesters in het offeren moesten doen bij het brandofferaltaar. Doch de aandachtige lezer kan vergelijken onder Eze 44:15 ."},{"catchword":"Zadok,","tekst":"Zie van dezen breder onder Eze 44:15 ."},{"catchword":"naderen,","tekst":"Dit naderen en genaken tot den HEERE [waarvan ook in het volgende dikwijls vermeld wordt] was ene afbeelding van de nadering van Jezus Christus, onzen Middelaar, tot den Vader voor ons, en voorts van de voorbidding der herders voor hunne kudde en van alle gelovigen [als geestelijke priesters] in het algemeen, met hunne gebeden en godsdiensten, in Christus' naam. Zie Jer 30:21 ; Rom 1:9-10 ; Eph 1:16-17 ; Col 4:12 ; Heb 10:19 , Heb 10:22 , enz., en Heb 13:17 ."}],"47":[{"catchword":"altaar","tekst":"Het brandofferaltaar."},{"catchword":"voor aan het","tekst":"Hebreeuws, voor het aangezicht."},{"catchword":"huis","tekst":"Dat is, de tempel, alzo in het volgende. Zie Eze 41:1 ."}],"49":[{"catchword":"trappen,","tekst":"Zonder te melden hoeveel, gelijk boven vs.6."}]},"kanttekeningen_en":{"1":[{"catchword":"In the five and twentieth year of our captive-carrying away","tekst":"With King Jojachin See above c. 1.3 and 24.1 and 33.21"},{"catchword":"in the beginning of the year","tekst":"Heb. The head of the year: this is held by the Jews to be the beginning of the civil year. Others understand it is Ecclesiastical year"},{"catchword":"on the tenth (day) of the month","tekst":"Meaning the fifth month"},{"catchword":"in the fourtenth year after the city","tekst":"Jerusalem"},{"catchword":"was smitten:","tekst":"see above chap. 33.21 and 24.1,2. With the annotat. There"},{"catchword":"even on the same day","tekst":"see above chap. 2.3 and 24.2 with the annotata. Heb. In the bone, or in vigour of that day"},{"catchword":"was the hand of the LORD upon me","tekst":"See Above Chap.1. on vers.3"},{"catchword":"and he brought me thith. R","tekst":"to wit, into the land of Israel. Understand in a vision as followeth"}],"2":[{"catchword":"In the vision of God","tekst":"see above chap.1. on verse 1. and 8 on vers.3."},{"catchword":"brought he","tekst":"the Lord"},{"catchword":"into the land of Israel: and he set me upon a very high mountain","tekst":"compare Revel. 21.10. See of the Hebrews word rendered here set, above chap 37.1"},{"catchword":"and by it it was as the fabric of a city toward the south:","tekst":"Ezekiel standing in the north, (where the temple had been. See Psalms 48 on verse 3.) Saw a city before him in the south. It is worth our observation that neither mountain, nor city, is named both here and in the sequel, save onely with the particle as, covertly as it were with the finger, pointing at Zion or Moria and Jerusalem: which might save to draw away our thoughts the more from the earthly Zion and Jerusalem, and to lead them to heavenly and spiritual Zion or Jerusalema to with the Church of God the mother of us all, Galatians 4.26. Whole name shall be, the LORD is there, below chapter 48.35. to the like purpose might serve the difference that is between the whole fabric and the former Temple of Solomon, and the other that was built after the return of the Jews from Babel. Therefore also, it is no where found in Ezra, Nehemiah, Haggai, and Zachariah that they regulated themselves in the reedification of the temple according to the vision, which even diyers Jewish Rabbines are said to confess that it looketh at the time of the Messias."}],"3":[{"catchword":"when he had brought me","tekst":"or, had caused me to go in, had brought me in"},{"catchword":"thither, behold then there was a man whose form was like the form of copper","tekst":"or steel being dry, hard and durable compare Rev 1:15 also above chapter 1.7 and further, Pslams 45.3 and 102.27,28. Yet here not like burning Hasmel, above chapter 1.4, 27."},{"catchword":"And in his hand was linen","tekst":"like a land meter. For in those times there were wont measure and divide land with lines r rods. See below Chapter 47.3,13 with the annotat. And compare Revelations21.15 Zachariah 2.1. it is called a measuring or meting-line"},{"catchword":"and a measuring reed:","tekst":"as having the measure exactly this fabric which in those times there wer&acirc;&euro;&trade;nt to do much with the reeds, (being very fit for that purpose) for which we may well use the word in asuring-rod, see Rev 11:1. in like manner must the house of God be formed and squared according to his counsel and word as according to the onely rule and direction and the principal square of all institution: thereunto harth respect the phase that is used, Isa 28:10, Gal 6:16, Phil 3.16 and hence the books of the Holy scripture are called Cannonical. Compare Exo 25:9,40, acts 77.44, Heb 8:5. We may likewise concerning the whole measuring of this spiritual building compare Eze 3:17,18,19. We may hereby this man so describe,9as aforefaid)understand with most interpreters, the Lord Jesus Christ, as the supreme builder of his house, who doth not here appeal in dreadful majesty as a judge, but kindly and friendly as a Master-Builder: or at least an angel, whom the son Of God was pleased to use the purpose. Compare above Chapter 1.26 and 9 and 10.2.zachariah 6.12, &c and Revelation 11.1. Likewise below chapter 43.6 where it seemed that this man distin-guished from the Lord, that spake out of the Tempe"},{"catchword":"and he flood the gate","tekst":"As Lord of the house and heir of all, opening and shutting: or at least as one having charge and commission from him. See Heb 1:2 and 3.3,6 and Job 10:2,3, Revelation3.7 others, by the gate or in the gate"}],"4":[{"catchword":"And the man said unto me, child of man","tekst":"see above chapter 2 on ver.11"},{"catchword":"behold with thine eyes, and hear with thine ears, and set thine heart upon all that I shall cause the to see","tekst":"This, is consider diligently and with singular attention all that thou seeth and hearth, to the intent that thou mayest faithfullysheew the fame unto the people of GOD, as followeth compare Mat 10:27. luke 12.5. Act 20:20, 27. 1 Corinthians 12.7 So chapter 43.10,11. for the intent that I might cause thee to see (them) art thou brought hither: declare (afterwards) all that thou seeth to the house of Israel."}],"5":[{"catchword":"And behold there was a wall on the outside of the house round about","tekst":"Hebrews round about, round about: and so into the sequel. This wall is foursquare by compass about the whole place of all this building. Compare Isa 26:1. Zachariah 2.4, 5. See of the circumference of this wall below chapter 42.15, 16,17,18,19,20"},{"catchword":"and in the man&acirc;&euro;&trade;s hand was a measuring reedof fix ells (or cubits) (every ell) of an ell and band breadth","tekst":"the measure of every ell was a common ell and a and breadth, so that the measuring reed was fix common ells and fix hand breadths long: one had-breadth is counted to be the breadth of four fingers oined together, or three thumbs"},{"catchword":"and he measured the breadth of the building","tekst":"That is the thickness of the wall"},{"catchword":"One reed and the height one reed","tekst":"the depth of the outer wall some take as if it were to be as if it were representation; first, of Christ&acirc;&euro;&trade;s utmost humiliation, from whence he went on and increased, until he having finished the work of our redemption was exalted and entered into the Holy of Holies, see Php 2:7, & Joh 3:30. Heb 9:11,12,24, Secondly, of the first beginning and so consequently of the progress and increase of Christendom, and the divers measures of the gift of all members of Christ in this life, till he bring them to be with him in the heavenly places, which he hath prepared for them. See 1 Corinthians 13.9,10,12. Elijah 4.12,13,14,16. Also Luk 17:5, Revelation 12 .11"}],"6":[{"catchword":"Then came he unto the gate","tekst":"meaning the first gate"},{"catchword":"which looked the way toward the east","tekst":"Hebrews whose face (was) the way, etc."},{"catchword":"and he went up to the steps thereof","tekst":"how many they might have been is not here mentioned, as indeed there is mention made of others in the sequel all measured the threshold of the gate, one read the breadth, and the other threshold, one read the breadth."}],"7":[{"catchword":"And (every) little chamber","tekst":"Hebrews, the little chamber that is , very one of the little chambers, or little cells, which were on both sides in the north and south part, between the first and second gate over against one another for an abode of keepers o the gate and threshold and those that came in from abroad; which some hold to be a type and figure of the coming, entrance , admission, and receiving of members Of Christ into his house or (in a manner) under his roof, custody and protection on earth, and afterwards in the heavenly mansions. See Psa 22:31 and 87,4,5,6 Isa 54:3 etc and 60.4, etc. Act 2:41,42 etc. Mat 25:10. Luk 16:9."},{"catchword":"One reed the length, and one reed the breadth; and between the little chambers","tekst":"That is the place, one room, space between the little chambers"},{"catchword":"five ells, and the threshold","tekst":"that is, both the thresholds"},{"catchword":"of the gate, by porch","tekst":"or portal; and so in the sequel, as some do take this of the gate within one reed."}],"8":[{"catchword":"He measured also the porch of the house within","tekst":"Or inward"},{"catchword":"one reed","tekst":"Others, and when he had measured etc and then Verse 9 then measured him, c."}],"9":[{"catchword":"Then Measured he the (other) porch of the gate, eight ells, and posts thereof","tekst":"To wit, of the gate, or of the porch or portal"},{"catchword":"two ells: and the porch of the gate was within","tekst":"Others to wit, the porch of the gate within"}],"10":[{"catchword":"And the little chambers of the gate of the way towards the east were three from this (side) and three from that side","tekst":"Hebrews three from hence, and three hence that is, from thence, the meaning whereof (according to the nature of the Hebrew language) is the fame that is here set down in the text: and so in the sequel those three had one kind of measure: also posts on both (sides) and on that side, had one kind of measure."}],"12":[{"catchword":"And there was a space","tekst":"Hebrews border bound"},{"catchword":"before","tekst":"Hebrews before the face the little chambers, of one ells (on this side) and a space of one ell on that side: and 9every) little chamber fix ells on this (side) and fix ells on that side."}],"13":[{"catchword":"Then measured he the gate from the roof of one little chamber to the roof of another","tekst":"Others, from the roof of the little chamber to their roof, to wit the roof of the gates the breadth was five and twenty ells: door was over against door."}],"14":[{"catchword":"He made also posts of threescore ells:","tekst":"That is, He measured them, as many understand this here, fifth the building was made or prepared already. See above verse 5."},{"catchword":"namely, unto the post of the court round about the gate","tekst":"Some hold the court of the lord (into which the people of God were wont to resort, whereof there were dives for the temple, as is related to the sequel) to be a type of the spreading out of the church of the new statement and branching out it feel to many particular churches gathered throughout the whole world but all pertaining to the body of the universal Church, and having fellowship and interest in the Lord Christ and his benefits, represented and figured out by the temple. See Psa 87:4,5,6, Isaiah 54 2,3 & c. and 60.8, & c and 62.9 also Psa 65:5 and 84.3 and 100.4, & c."}],"15":[{"catchword":"of the gate of the entrance","tekst":"Or, where men come in unto the fore-part of the porch of the inner gate, or (namely unto) the inner gate] were fifty ells."}],"16":[{"catchword":"And there were shut windows","tekst":"meaning glazed, or shut with glass: or straight narrow windows, (as if they had been shut) yet so as that they gave inwardly a fair light, (compare 1 Kings6 on verse 4.) typifying the true light, which the Lord Jesus Christ should bring into the church by his word and spirit See Isa 42:6,7 and 49, 6 and 60.19,20. Job1.7, 8. & 8.12 & R v. 21.23, 24, & c."},{"catchword":"to the little chambers and to their posts inwards in the gate round about; so likewise to the porches:","tekst":"others galleries, arches"},{"catchword":"now the windows were round about inward, and upon the posts were palm-trees","tekst":"Others, now (upon) the windows & c and upon the posts were palm trees. The palm trees figured out the spiritual beautiful, ever flourishing, fruitful and incomparable condition of the church, see Psalms 92, 13 Cant.7.7, 8 Rev 7:9."}],"17":[{"catchword":"Moreover, he brought me into the innermost court","tekst":"which some call the women&acirc;&euro;&trade;s court"},{"catchword":"and so, there chambers, and a pavement that was made in the court round about; there were thirty chambers upon the pavement","tekst":"in my fathers house there are many mansions, faith our saviour, Job 14:2 and on earth he provideth for his own a place and shelter against the storm, rain and scorching heat of the sun; that is, sure and lasting comfort in all affliction, see Isa 4:5,6 and 32.2, & c"}],"18":[{"catchword":"Now the pavement was by the side of the gates, over against the lengths of the gates:","tekst":"or, all along the gates"},{"catchword":"(this) was lowermost","tekst":"Or, low"},{"catchword":"pavement","tekst":"others, over against the length of the gates; (there was) the lower pavement. Some understand this thus, that this pavement did rise up high in the mi   // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
