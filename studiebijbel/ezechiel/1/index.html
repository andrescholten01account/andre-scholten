an die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.","2":"Op de vijfde dag van die maand (dit was het vijfde jaar van de wegvoering van koning Jojachin),","3":"Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.","4":"Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur.","5":"En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens;","6":"En elk had vier gezichten; ook had elk van hen vier vleugels.","7":"En hun voeten waren rechte voeten, en hun voetzolen waren gelijk de voetzool van een kalf, en glinsterden als de kleur van glad koper.","8":"En mensenhanden waren onder hun vleugels, aan hun vier zijden; en die vier hadden hun gezichten en hun vleugels.","9":"Hun vleugels waren aan elkaar verbonden, de een aan de ander; zij keerden zich niet om als zij gingen; zij gingen ieder recht voor zich uit.","10":"De gelijkenis van hun gezicht nu was het gezicht van een mens, en het gezicht van een leeuw hadden die vier aan de rechterzijde; en aan de linkerzijde hadden die vier het gezicht van een os; ook hadden die vier het gezicht van een arend.","11":"Ook waren hun gezichten en hun vleugels naar boven uitgespreid; elk had er twee aan de ander verbonden, en twee bedekten hun lichamen.","12":"En zij gingen ieder recht voor zich uit; waarheen de geest wilde gaan, gingen zij; zij keerden zich niet om als zij gingen.","13":"Wat de gelijkenis van de levende wezens betreft, hun gedaante was als brandende kolen van vuur, als de gedaante van fakkels; dat vuur ging steeds tussen die levende wezens; en het vuur had een glans, en uit het vuur kwam een bliksem voort.","14":"De levende wezens nu liepen en keerden weer als de gedaante van een bliksemflits.","15":"Toen ik die levende wezens zag, zie, zo was er één rad op de aarde bij die levende wezens, met vier gezichten.","16":"De gedaante van de raderen en hun maaksel was als de kleur van een turkoois; en die vier hadden één gelijkenis; bovendien was hun gedaante en hun maaksel alsof het een rad was in het midden van een rad.","17":"Als zij gingen, gingen zij op hun vier zijden; zij keerden zich niet om als zij gingen.","18":"En hun velgen, die waren zo hoog, dat zij vreselijk waren; en hun velgen waren vol ogen rondom aan die vier raderen.","19":"Als nu de levende wezens gingen, gingen de raderen naast hen; en als de levende wezens van de aarde opgeheven werden, werden de raderen opgeheven.","20":"Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.","21":"Als die gingen, gingen deze; en als die stonden, stonden zij; en als die van de aarde opgeheven werden, werden de raderen tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.","22":"En boven de hoofden van de levende wezens was de gelijkenis van een uitspansel, als de kleur van het ontzagwekkende kristal, van boven af over hun hoofden uitgespreid.","23":"En onder dat uitspansel waren hun vleugels rechtop, de een aan de ander; ieder had er twee, die naar deze kant hun lichamen bedekten, en ieder had er twee, die ze naar die kant bedekten.","24":"En toen zij gingen, hoorde ik het geruis van hun vleugels, als het geruis van veel water, als de stem van de Almachtige, als het geluid van spreken, als het gedreun van een leger; als zij stonden, lieten zij hun vleugels neer.","25":"En er kwam een stem van boven het uitspansel dat boven hun hoofden was, toen zij stonden en hun vleugels neergelaten hadden.","26":"En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend.","27":"En ik zag iets als de kleur van amber, als de gedaante van vuur rondom daarbinnen, vanaf de gedaante van Zijn lendenen en opwaarts; en vanaf de gedaante van Zijn lendenen en neerwaarts, zag ik iets als de gedaante van vuur, en een glans rondom Hem.","28":"Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak."},"SV":{"1":"In het dertigste jaar, in de vierde *maand*, op den vijfden derzelve maand, als ik in het midden der weggevoerden was bij de rivier Chebar, zo geschiedde het, *dat* de hemelen werden geopend, en ik gezichten Gods zag.","2":"Op den vijfden derzelve maand (dit was het vijfde jaar van de wegvoering van den koning Jojachin),","3":"Geschiedde het woord des HEEREN uitdrukkelijk tot Ezechiël, den zoon van Buzi, den priester, in het land der Chaldeen, bij de rivier Chebar; en de hand des HEEREN was daar op hem.","4":"Toen zag ik, en ziet, een stormwind kwam van het noorden af, een grote wolk, en een vuur *daarin* vervangen, en een glans was rondom die *wolk*; en uit het midden daarvan was als de verf van Hasmal, uit het midden des vuurs.","5":"En uit het midden daarvan *kwam* de gelijkenis van vier dieren; en dit was hun gedaante: zij hadden de gelijkenis van een mens;","6":"En elkeen had vier aangezichten; insgelijks had elkeen van hen vier vleugelen.","7":"En hun voeten waren rechte voeten, en hun voetplanten waren gelijk de voetplanten van een kalf, en glinsterden gelijk de verf van glad koper.","8":"En mensenhanden waren onder hun vleugelen, aan hun vier zijden; en die vier hadden hun aangezichten en hun vleugelen.","9":"Hun vleugelen waren samengevoegd, de een aan den ander; zij keerden zich niet om, als zij gingen; zij gingen elkeen recht uit voor zijn aangezicht henen.","10":"De gelijkenis nu van hun aangezicht was het aangezicht eens mensen, en het aangezicht eens leeuws hadden zij vier aan de rechterzijde; en ter linkerzijde hadden die vier eens ossen aangezicht; ook hadden die vier eens arends aangezicht.","11":"Ook waren hun aangezichten en hun vleugelen opwaarts verdeeld; elkeen had er twee samengevoegd aan de andere, en twee bedekten hun lichamen.","12":"En zij gingen elkeen rechtuit voor zijn aangezicht henen; waarhenen de geest was om te gaan, gingen zij; zij keerden zich niet om, als zij gingen.","13":"Aangaande de gelijkenis der dieren, hun gedaante was als brandende kolen des vuurs, als de gedaante der fakkelen; datzelve *vuur* ging steeds tussen die dieren; en het vuur had een glans, en uit het vuur kwam een bliksem voort.","14":"De dieren nu liepen en keerden weder als de gedaante van een weerlicht.","15":"Als ik die dieren zag, ziet, zo was er een rad op de aarde bij die dieren, naar vier aangezichten van hetzelve.","16":"De gedaante der raderen en derzelver maaksel was als de verf van een turkoois; en die vier hadden enerlei gelijkenis; daartoe was hun gedaante, en hun maaksel, alsof het ware een rad in het midden van een rad.","17":"Als zij gingen, zij gingen op hun vier zijden; zij keerden zich niet om, als zij gingen.","18":"En hun velgen, die waren zo hoog, dat zij vreselijk waren; en hun velgen waren vol ogen rondom aan die vier *raderen*.","19":"Als nu de dieren gingen, gingen de raderen bij hen; en als de dieren van de aarde opgeheven werden, werden de raderen opgeheven.","20":"Waarhenen de geest was om te gaan, gingen zij, waarhenen de geest was om te gaan; en de raderen werden tegenover hen opgeheven; want de geest der dieren was in de raderen.","21":"Als die gingen, gingen *deze*; en als die stonden, stonden zij; en als die van de aarde opgeheven werden, werden de raderen tegenover hen opgeheven; want de geest der dieren was in de raderen.","22":"En over de hoofden der dieren was de gelijkenis eens uitspansels, gelijk de verf van het vreselijke kristal, van boven af over hun hoofden uitgespreid.","23":"En onder dat uitspansel waren hun vleugelen rechtop, de een aan den ander; ieder had er twee, die herwaarts hun lichamen bedekten, en ieder had er twee, die ze derwaarts bedekten.","24":"En als zij gingen, hoorde ik een geruis hunner vleugelen, als het geruis van vele wateren, als de stem des Almachtigen, *als* de stem eens geroeps, als het gedreun eens heirlegers; als zij stonden, zo lieten zij hun vleugelen neder.","25":"En er geschiedde een stem van boven het uitspansel, hetwelk boven hun hoofden was, als zij stonden, *en* hun vleugelen nedergelaten hadden.","26":"En boven het uitspansel, hetwelk was boven hun hoofden, was de gelijkenis eens troons, als de gedaante van een saffiersteen; en op de gelijkenis des troons was de gelijkenis als de gedaante eens mensen, daarboven op zijnde.","27":"En ik zag als de verf van Hasmal, als de gedaante van vuur rondom daarbinnen, van de gedaante Zijner lenden en opwaarts; en van de gedaante Zijner lenden en nederwaarts, zag ik als de gedaante van vuur, en glans aan Hem rondom.","28":"Gelijk de gedaante van den boog, die in de wolk is ten dage des plasregens, alzo was de gedaante van den glans rondom; dit was de gedaante van de gelijkenis der heerlijkheid des HEEREN; en als ik het zag, viel ik op mijn aangezicht, en ik hoorde een stem van Een, Die sprak."},"KJV":{"1":"Now it came to pass in the thirtieth year, in the fourth *month*, in the fifth *day* of the month, as I *was* among the captives by the river of Chebar, *that* the heavens were opened, and I saw visions of God.","2":"In the fifth *day* of the month, which *was* the fifth year of king Jehoiachin's captivity,","3":"The word of the LORD came expressly unto Ezekiel the priest, the son of Buzi, in the land of the Chaldeans by the river Chebar; and the hand of the LORD","4":"And I looked, and, behold, a whirlwind came out of the north, a great cloud, and a fire infolding itself, and a brightness *was* about it, and out of the midst thereof as the colour of amber, out of the midst of the fire.","5":"Also out of the midst thereof *came* the likeness of four living creatures. And this *was* their appearance; they had the likeness of a man.","6":"And every one had four faces, and every one had four wings.","7":"And their feet *were* straight feet; and the sole of their feet *was* like the sole of a calf's foot: and they sparkled like the colour of burnished brass.","8":"And *they had* the hands of a man under their wings on their four sides; and they four had their faces and their wings.","9":"Their wings *were* joined one to another; they turned not when they went; they went every one straight forward.","10":"As for the likeness of their faces, they four had the face of a man, and the face of a lion, on the right side: and they four had the face of an ox on the left side; they four also had the face of an eagle.","11":"Thus *were* their faces: and their wings *were* stretched upward; two *wings* of every one *were* joined one to another, and two covered their bodies.","12":"And they went every one straight forward: whither the spirit was to go, they went; *and* they turned not when they went.","13":"As for the likeness of the living creatures, their appearance *was* like burning coals of fire, *and* like the appearance of lamps: it went up and down among the living creatures; and the fire was bright, and out of the fire went forth lightning.","14":"And the living creatures ran and returned as the appearance of a flash of lightning.","15":"Now as I beheld the living creatures, behold one wheel upon the earth by the living creatures, with his four faces.","16":"The appearance of the wheels and their work *was* like unto the colour of a beryl: and they four had one likeness: and their appearance and their work *was* as it were a wheel in the middle of a wheel.","17":"When they went, they went upon their four sides: *and* they turned not when they went.","18":"As for their rings, they were so high that they were dreadful; and their rings *were* full of eyes round about them four.","19":"And when the living creatures went, the wheels went by them: and when the living creatures were lifted up from the earth, the wheels were lifted up.","20":"Whithersoever the spirit was to go, they went, thither *was their* spirit to go; and the wheels were lifted up over against them: for the spirit of the living creature *was* in the wheels.","21":"When those went, *these* went; and when those stood, *these* stood; and when those were lifted up from the earth, the wheels were lifted up over against them: for the spirit of the living creature *was* in the wheels.","22":"And the likeness of the firmament upon the heads of the living creature *was* as the colour of the terrible crystal, stretched forth over their heads above.","23":"And under the firmament *were* their wings straight, the one toward the other: every one had two, which covered on this side, and every one had two, which covered on that side, their bodies.","24":"And when they went, I heard the noise of their wings, like the noise of great waters, as the voice of the Almighty, the voice of speech, as the noise of an host: when they stood, they let down their wings.","25":"And there was a voice from the firmament that *was* over their heads, when they stood, *and* had let down their wings.","26":"And above the firmament that *was* over their heads *was* the likeness of a throne, as the appearance of a sapphire stone: and upon the likeness of the throne *was* the likeness as the appearance of a man above","27":"And I saw as the colour of amber, as the appearance of fire round about within it, from the appearance of his loins even upward, and from the appearance of his loins even downward, I saw as it were the appearance of fire, and it had brightness round about.","28":"As the appearance of the bow that is in the cloud in the day of rain, so *was* the appearance of the brightness round about. This *was* the appearance of the likeness of the glory of the LORD. And when I saw *it*, I fell upon my face, and I heard a voice of one that spake."}},"tsk":{"1":[{"kopje":"In het dertigste jaar","refs":["Num 4:3","Luk 3:23"]},{"kopje":"toen ik","refs":["Pred 9:1","Pred 9:2","Jer 24:5-7"]},{"kopje":"bij de rivier","refs":["Ezech 1:3","Ezech 3:15","Ezech 3:23","Ezech 10:15","Ezech 10:20","Ezech 10:22","Ezech 43:3"]},{"kopje":"de hemelen","refs":["Matt 3:16","Luk 3:21","Joh 1:52","Hand 7:56","Hand 10:11","Openb 4:1","Openb 19:11"]},{"kopje":"ik zag","refs":["Ezech 8:3","Ezech 11:24","Gen 15:1","Gen 46:2","Num 12:6","Jes 1:1","Dan 8:1","Dan 8:2","Hos 12:11","Joël 2:28","Matt 17:9","Hand 9:10-12","Hand 10:3","2 Kor 12:1"]}],"3":[{"kopje":"woord","refs":["Jer 1:2","Jer 1:4","Hos 1:1","Joël 1:1","1 Tim 4:1"]},{"kopje":"en de","refs":["Ezech 3:14","Ezech 3:22","Ezech 8:1","Ezech 33:22","Ezech 37:1","Ezech 40:1","1 Kon 18:46","2 Kon 3:15"]}],"4":[{"kopje":"stormwind","refs":["Jes 21:1","Jer 1:13","Jer 1:14","Jer 4:6","Jer 6:1","Jer 23:19","Jer 25:9","Jer 25:32","Hab 1:8","Hab 1:9"]},{"kopje":"grote","refs":["Ezech 10:2-4","Ex 19:16-18","Ex 24:16","Ex 24:17","Deut 4:11","Deut 4:12","2 Kron 5:13","2 Kron 5:14","2 Kron 6:1","2 Kron 7:1-3","Ps 18:12-14","Ps 50:3","Ps 97:2","Ps 97:3","Ps 104:3","Ps 104:4","Jes 19:1","Nahum 1:3-6","Hab 3:3-5","Hebr 12:29"]},{"kopje":"kleur","refs":["Ezech 1:27","Ezech 8:2","Ezech 10:8","Ezech 10:9","Openb 1:15"]}],"5":[{"kopje":"de gelijkenis","refs":["Openb 4:6","Openb 6:6"]}],"6":[{"kopje":"En elk had vier gezichten","refs":["Ezech 1:10","Ezech 1:15","Ezech 10:10","Ezech 10:14","Ezech 10:21","Ezech 10:22","Openb 4:7","Openb 4:8"]},{"kopje":"elk van hen vier vleugels","refs":["Ezech 1:8-11","Ex 25:20","1 Kon 6:24-27","Jes 6:2"]}],"7":[{"kopje":"gelijk de voetzool","ref ng</span> itself, and a <span class=\"wl wl-kjv\" data-code=\"H5051\">brightness</span> was <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> it, and out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> thereof as the <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> of <span class=\"wl wl-kjv\" data-code=\"H2830\">amber,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the fire.","5":"Also out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> thereof came the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> of <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures.</span> And this was their <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance;</span> <span class=\"wl wl-kjv\" data-code=\"H2007\">they</span> had the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> of a man.","6":"And every <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> had <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">faces,</span> and every <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> had <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> wings.","7":"And their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> were <span class=\"wl wl-kjv\" data-code=\"H3477\">straight</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">feet;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3709\">sole</span> of their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> was like the <span class=\"wl wl-kjv\" data-code=\"H3709\">sole</span> of a <span class=\"wl wl-kjv\" data-code=\"H5695\">calf's</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">foot:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5340\">sparkled</span> like the <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> of <span class=\"wl wl-kjv\" data-code=\"H lass=\"wl wl-kjv\" data-code=\"H6440\">face</span> of an eagle.","11":"Thus were their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces:</span> and their <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> were <span class=\"wl wl-kjv\" data-code=\"H6504\">stretched</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">upward;</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> wings of every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> were <span class=\"wl wl-kjv\" data-code=\"H2266\">joined</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H376\">another,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> their bodies.","12":"And they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">straight</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">forward:</span> whither the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> was to <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> they <span class=\"wl wl-kjv\" data-code=\"H3212\">went;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> not when they went.","13":"As for the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> of the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures,</span> their <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> was like <span class=\"wl wl-kjv\" data-code=\"H1197\">burning</span> <span class=\"wl wl-kjv\" data-code=\"H1513\">coals</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and like the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of <span class=\"wl wl-kjv\" data-code=\"H3940\">lamps:</span> it went up and <span class=\"wl wl-kjv\" data-code=\"H1980\">down</span> among the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures;</span> and the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> was <span class=\"wl wl-kjv\" data-code=\"H5051\">bright,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> lightning.","14":"And the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures</span> <span class=\"wl wl-kjv\" data-code=\"H7519\">ran</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of a flash of lightning.","15":"Now as I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures,</span> behold <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H212\">wheel</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures,</span> with his <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> faces.","16":"The <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of the <span class=\"wl wl-kjv\" data-code=\"H212\">wheels</span> and their <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> was like unto the <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> of a <span class=\"wl wl-kjv\" data-code=\"H8658\">beryl:</span> and they <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> had <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness:</span> and their <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> and their <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> was as it were a <span class=\"wl wl-kjv\" data-code=\"H212\">wheel</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">middle</span> of a wheel.","17":"When they <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> upon their <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7253\">sides:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> not when they went.","18":"As for their <span class=\"wl wl-kjv\" data-code=\"H1354\">rings,</span> they were so <span class=\"wl wl-kjv\" data-code=\"H1363\">high</span> that they were <span class=\"wl wl-kjv\" data-code=\"H3374\">dreadful;</span> and their <span class=\"wl wl-kjv\" data-code=\"H1354\">rings</span> were <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> them four.","19":"And when the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> the <span class=\"wl wl-kjv\" data-code=\"H212\">wheels</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> by <span class=\"wl wl-kjv\" data-code=\"H681\">them:</span> and when the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creatures</span> were lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> the <span class=\"wl wl-kjv\" data-code=\"H212\">wheels</span> were lifted up.","20":"Whithersoever the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> was to <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> they <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> thither was their <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go;</span> and the <span class=\"wl wl-kjv\" data-code=\"H212\">wheels</span> were lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> them: for the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creature</span> was in the wheels.","21":"When those <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> these <span class=\"wl wl-kjv\" data-code=\"H3212\">went;</span> and when those <span class=\"wl wl-kjv\" data-code=\"H5975\">stood,</span> these <span class=\"wl wl-kjv\" data-code=\"H5975\">stood;</span> and when those were lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> the <span class=\"wl wl-kjv\" data-code=\"H212\">wheels</span> were lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> them: for the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creature</span> was in the wheels.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> of the <span class=\"wl wl-kjv\" data-code=\"H7549\">firmament</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the living <span class=\"wl wl-kjv\" data-code=\"H2416\">creature</span> was as the <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> of the <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> <span class=\"wl wl-kjv\" data-code=\"H7140\">crystal,</span> stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> over their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> above.","23":"And under the <span class=\"wl wl-kjv\" data-code=\"H7549\">firmament</span> were their <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> <span class=\"wl wl-kjv\" data-code=\"H3477\">straight,</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">one</span> toward the <span class=\"wl wl-kjv\" data-code=\"H269\">other:</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> had <span class=\"wl wl-kjv\" data-code=\"H8147\">two,</span> which <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> on this <span class=\"wl wl-kjv\" data-code=\"H2007\">side,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> had <span class=\"wl wl-kjv\" data-code=\"H8147\">two,</span> which <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> on that <span class=\"wl wl-kjv\" data-code=\"H2007\">side,</span> their bodies.","24":"And when they <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of their <span class=\"wl wl-kjv\" data-code=\"H3671\">wings,</span> like the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> as the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty,</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H1999\">speech,</span> as the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of an <span class=\"wl wl-kjv\" data-code=\"H4264\">host:</span> when they <span class=\"wl wl-kjv\" data-code=\"H5975\">stood,</span> they let <span class=\"wl wl-kjv\" data-code=\"H7503\">down</span> their wings.","25":"And there was a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> from the <span class=\"wl wl-kjv\" data-code=\"H7549\">firmament</span> that was over their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> when they <span class=\"wl wl-kjv\" data-code=\"H5975\">stood,</span> and had let <span class=\"wl wl-kjv\" data-code=\"H7503\">down</span> their wings.","26":"And <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> the <span class=\"wl wl-kjv\" data-code=\"H7549\">firmament</span> that was over their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> was the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> of a <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of a <span class=\"wl wl-kjv\" data-code=\"H5601\">sapphire</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone:</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> of the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> was the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> above","27":"And I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> as the <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> of <span class=\"wl wl-kjv\" data-code=\"H2830\">amber,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> it, from the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> even <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> even <span class=\"wl wl-kjv\" data-code=\"H4295\">downward,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> as it were the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and it had <span class=\"wl wl-kjv\" data-code=\"H5051\">brightness</span> round about.","28":"As the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H1653\">rain,</span> so was the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of the <span class=\"wl wl-kjv\" data-code=\"H5051\">brightness</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about.</span> This was the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of the <span class=\"wl wl-kjv\" data-code=\"H1823\">likeness</span> of the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And when I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, I <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon my <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of one that spake."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dertigste jaar,","tekst":"Sommigen rekenen dit jaar van de regering van Nabochodonosor den eerste, anders genaamd Nebopolassar, de vader van Nabochodonosor,, of Nebukadnezar de Grote, die Syrië en Judea onder zich gebracht heeft, onder wiens gebied de profeet Ezechiël te dien tijde leefde; in welken tijd enigen menen dat ook het wetboek in het achttiende jaar van den koning Josia in den tempel gevonden is; 2Ki 22:8 , en 2Ki 23:2 . Anderen hebben andere berekeningen."},{"catchword":"vierde","tekst":"Die meest met onzen Juni overeenkomt en bij de Joden Tamuz genaamd wordt, welverstaande in het kerkelijke jaar; want de vierde wordt in het burgerlijke jaar Tebeth genoemd."},{"catchword":"maand ,","tekst":"Dit woord is hier ingevoegd uit het volgende lid."},{"catchword":"als ik in het midden","tekst":"Want als Jojachin in Babylonië gevankelijk weggevoerd werd, met veel volk, was de profeet Ezechiël ook daaronder. Zie onder Eze 33:21 , en Eze 40:1 ."},{"catchword":"der weggevoerden was","tekst":"Te weten, als gevangene naar Babylonië. Hebreeuws, wegvoering. Alzo 2Ki 24:15 ; Ezr 1:11 , idem, alzo gevangenis voor gevangene; zie Num 31:12 ."},{"catchword":"Chebar,","tekst":"Sommigen verstaan een arm van de rivier Eufraat, ook genoemd Chaborra, van zekeren overste Chabor, die den Eufraat zou verdeeld hebben; anderen, ene rivier in Mesopotamië, van den berg Masius in de rivier Eufraat invloeiende naar ene stad van denzelfden naam."},{"catchword":"werden geopend,","tekst":"Te weten op een bovennatuurlijke wijze, waardoor de profeet uit zichzelven opgetrokken zijnde, met een nieuw gezicht begaafd is geweest, om zonder enig beletsel, hetgeen hem vertoond werd te aanschouwen. Vergelijk Rev 4:1 , en Rev 19:11 ."},{"catchword":"gezichten Gods zag","tekst":"Dat is, die mij God vertoonde, of waarin God door zekere gedaanten zich van mij in den geest liet aanschouwen. Alzo onder Eze 8:2 , en Eze 40:2 . Zie van de gezichten Gods Gen 15:1 . Aangaande dit gezicht, daarover vallen in Gods kerk verscheidene uitleggingen, onder welke hier gevolgd is hetgeen schijnt het bekwaamst te zijn."}],"2":[{"catchword":"vijfde jaar van de wegvoering","tekst":"Als men tot deze vijf jaren nog doet de elf jaren van Jojakims regering, 2Ki 23:36 , de drie maanden van Joahas, 2Ki 23:31 , en de laatste veertien jaren van Josia, zo vindt men de dertig met de drie maanden van welke in vs.1 gesproken is."}],"3":[{"catchword":"Geschiedde","tekst":"Hebreeuws, geschiedende geschiedde."},{"catchword":"Ezechiël,","tekst":"Hebreeuws, Jechezkel. Deze naam betekent, de sterkte Gods, of de gesterkte van God."},{"catchword":"de hand des HEEREN was daar op hem","tekst":"Dat is, de kracht om te profeteren werd hem van God gegeven. Zie 2Ki 3:15 . Alzo onder Eze 3:22 , en Eze 37:1 , en Eze 40:1 . Voor hand staat Geest, onder Eze 11:5 . De zin is enerlei. Want Gods Geest geeft de kracht en de gave om te profeteren, 1Co 12:4 , enz."}],"4":[{"catchword":"zag ik,","tekst":"Vergelijk dit gezicht met hetgeen onder Eze 10 beschreven is."},{"catchword":"kwam","tekst":"Te weten niet alleen om den profeet tot aandacht op te wekken, maar ook om de schrikkelijke kracht des alleroppersten rechters, die Hij tegen Jeruzalem door hunne vijanden in het werk stellen zou, af te beelden. Zie van zulke gelijkenis Job 9:17 ."},{"catchword":"het noorden af,","tekst":"Te weten vanwaar der Joden vijanden, dat is de Chaldeën, voortkomen zouden. Vergelijk Jer 1:13-15 ."},{"catchword":"grote wolk,","tekst":"Versta hierdoor het heirleger der Chaldeën. Zie Jer 4:13 . Vergelijk Eze 30:18 en Eze 38:9 ."},{"catchword":"vuur daarin","tekst":"Hetwelk betekent de verbranding van de stad Jeruzalem en den tempel."},{"catchword":"vervangen,","tekst":"Of, zich inwikkelende, te weten in die wolk, of die omvangende, vergelijk Exo 9:24 ."},{"catchword":"glans was rondom die wolk;","tekst":"Versta hiermede de eer der gerechtigheid, die God verkrijgt door zijne straffen en oordelen; Psa 51:6 ; Isa 5:16 ."},{"catchword":"daarvan","tekst":"Dat is, van het vuur, gelijk te zien is uit het einde van vs.4."},{"catchword":"de kleur van","tekst":"Hebreeuws, oog; dat is, kleur of verf, waarop het oog zijne werking heeft, alzo Lev 13:55 ; Num 11:7 , onder vs.7."},{"catchword":"Hasmal,","tekst":"Velen verstaan hierdoor ene soort van hars, amber, of ember, of brandsteen, bij de Latijnen succinum genaamd. Anderen nemen het voor ene soort van metaal genaamd electrum, bestaande uit goud, waarvan het vijfde deel zilver is, en van kleur als bleek goud. Anderen verstaan het woord van het reinste brandende koper, of staal; enigen nemen het voor de verf van zeer vurige kolen, hebbende den naam [gelijk sommigen menen] van haastelijk doorsnijden, verteren, enz., dat wel past op gloeiend staal en kolen."},{"catchword":"uit het midden des vuurs","tekst":"Dat is, gelijk de gedaante daarvan zich uitgeeft en vertoont, als het midden in het vuur gloeiende ligt."}],"5":[{"catchword":"daarvan","tekst":"Te weten van het vuur, in hetwelk was de verf van hasmal. Dat nu de vier dieren daaruit voortkwamen, betekent de helderheid hunner natuur en de vurigheid hunner werking. Hiermede komt overeen de naam serafim, komende van saraf, dat is, branden; Isa 6:2 , Isa 6:6 ."},{"catchword":"vier dieren;","tekst":"Door deze dieren zijn te verstaan de heilige engelen, overmits zij cherubim genaamd worden, onder Eze 10:15 , Eze 10:20 ."},{"catchword":"een mens;","tekst":"Te weten naar het meeste deel van hun lichaam, want zij hadden eens mensen aangezicht, handen en benen, vs.7,8. Bij de mensen worden de engelen vergeleken, omdat zij verstand en wil hebben, doch veel volmaakter dan de mensen; 2Sa 14:20 ; Psa 103:20 ; 1Pe 1:12 ."}],"6":[{"catchword":"vier aangezichten;","tekst":"Van welke zie onder vs.10."},{"catchword":"vier vleugelen","tekst":"Te weten twee om te vliegen, die zij nochtans in dit gezicht naar het uitspansel hebben verheven, en enigszins hunne aangezichten bedekt, betekenende eensdeels hunne snelheid in het uitvoeren van Gods bevelen, anderdeels hun gewillige gedienstigheid en genegenheid tot God hunnen Heere; en twee andere vleugelen om hun lichaam te bedekken aanwijzende hun eerbied tot God, en de onzichtbaarheid van hun natuur en wezen voor den mens. Isa 6:2 , en Rev 4:8 , worden den engelen zes vleugelen toegeschreven, te weten nog twee boven deze vier, waarmede zij hunne aangezichten bedekken, overmits zij voor den troon Gods waren, wiens glans en majesteit zij niet verdragen konden."}],"7":[{"catchword":"voeten","tekst":"Dat is, benen of schenkels. Hebreeuws, en hunne voeten, de voet was recht."},{"catchword":"rechte voeten,","tekst":"Betekenende de rechtmatigheid van hunne werken."},{"catchword":"voetplanten","tekst":"Versta het deel des beens, dat eigenlijk de voet genaamd wordt."},{"catchword":"kalf,","tekst":"Die rond en vast zijn, tot een teken van de wakkerheid der engelen en vaardigheid in het uitvoeren van hun dienst."},{"catchword":"glinsterden","tekst":"Om te tonen dat de werken, die God door de engelen doet, klaar en heerlijk zijn."},{"catchword":"glad koper","tekst":"Of, van gepolijst, geschuurd en gezuiverd koper, betekenende de reinheid der engelen; vergelijk Rev 1:15 ."}],"8":[{"catchword":"mensenhanden","tekst":"Versta door deze de werken van de heilige engelen, die zij naar het bevel Gods doen, en de bekwaamheid die zij daartoe hebben."},{"catchword":"onder hun vleugelen,","tekst":"Te weten om te betekenen dat hunne werken den mensen onzienlijk en onbekend zijn."},{"catchword":"vier zijden;","tekst":"Hebreeuws, vier vierhoeken, of vier vierzijden. Waarmede afgebeeld wordt dat zij in en over al de vier hoeken der wereld Gods bevelen uitvoeren; vergelijk onder Eze 43:16-17 ."}],"9":[{"catchword":"vleugelen","tekst":"Versta dit van de vleugelen, waarmede zij vlogen; en vergelijk onder vs.11."},{"catchword":"de een aan den ander;","tekst":"Hebreeuws, de vrouw aan hare zuster; dat is, aan elkander, alzo Exo 26:3 , Exo 26:5-6 ; onder vs.23, en Eze 3:13 . Deze samenvoeging schijnt te betekenen de onderlinge vriendschap en vrede, die onder de heilige engelen is in het uitvoeren van hunne diensten."},{"catchword":"keerden zich niet om,","tekst":"Dat is, zij weken niet af van den weg, dien God hun bevolen had, maar gingen gelijkelijk daarin voort. Alzo onder vs.12, 17."},{"catchword":"zij gingen elkeen recht","tekst":"Dat is, zij gingen recht henen door, een eenparige streek houdende, naar de plaats, die voor hun aangezicht was en tot welke zij komen moesten. De betekenis is dat de heilige engelen in het werk, hun van God bevolen, zonder enig omzien voortgaan, en door geen beletsel afgekeerd worden."}],"10":[{"catchword":"mensen,","tekst":"Te weten van voren. Zie de betekenis boven vs.5. Merk dat elk dier vier aangezichten had, van voren het aangezicht van een mens, van achteren het aangezicht van een arend, ter rechterzijde het aangezicht van een leeuw, ter linkerzijde het aangezicht van een os."},{"catchword":"leeuws","tekst":"Te weten om daarmede te betekenen dat de engelen zeer sterk zijn. Van de sterkte der leeuwen, zie Jdg 14:18 ; Pro 30:30 ; van de heilige engelen, 2Ki 19:35 ; Col 1:16 , die ook sterker zijn dan de duivelen, overmits zij die overwinnen tegen hen strijdende; Dan 10:13 ; Rev 12:7-9 ."},{"catchword":"die vier aan de rechterzijde;","tekst":"Te weten dieren."},{"catchword":"ossenaangezicht;","tekst":"Dit betekent de dienstbare volharding der heilige engelen in het uitvoeren der lasten hun van God opgelegd."},{"catchword":"arends aangezicht","tekst":"Te weten van achteren, gesteld tegen het aangezicht van den mens, dat voren was. Versta hier door de snelheid en wakkerheid der engelen in het werken."}],"11":[{"catchword":"Ook waren hun aangezichten","tekst":"Anders: Dit, of zo waren hunne aangezichten; maar hunne vleugelen waren opwaarts, enz."},{"catchword":"hun vleugelen","tekst":"Versta, de twee vleugelen, waarmede zij vlogen, die zij ophielden alsof zij vliegen wilden."},{"catchword":"verdeeld;","tekst":"Dat is, onderscheidenlijk opgeheven en uitgestrekt tot God, die boven de vier dieren op een hogen troon in de gedaante van een mens zat. Waarmede betekend is dat de heilige engelen met al hunne zinnen en genegenheden wakker zijn om de bevelen Gods te ontvangen en uit te voeren."},{"catchword":"elkeen","tekst":"Te weten der dieren."},{"catchword":"twee","tekst":"Te weten vleugelen."},{"catchword":"samengevoegd","tekst":"Zie boven vs.9 en de aantekening."},{"catchword":"en twee bedekten hun lichamen","tekst":"Zie boven de aantekening vs.6."}],"12":[{"catchword":"En zij gingen elkeen rechtuit","tekst":"Zie boven vs.9."},{"catchword":"Geest was om te gaan,","tekst":"Versta, den Geest en de kracht Gods, die van den Vader door den Zoon werkt, Zec 4:6 , en waardoor deze dieren bewogen en geregeerd werden; vergelijk onder Eze 2:2 , en Eze 3:14 , en Eze 8:3 , en Eze 11:1 , Eze 11:5 , en Eze 43:5 ."},{"catchword":"zij keerden zich niet om,","tekst":"Zie boven vs.9."}],"13":[{"catchword":"brandende kolen des vuurs,","tekst":"Welke niet alleen den profeet toonden dat hier wat goddelijks geschiedde en dat deze dieren geen eigenlijke dieren maar engelen Gods waren, dan ook betekenden den brand der goddelijke wraak, waarvan deze engelen snel en verschrikkelijke uitvoerders zouden wezen; vergelijk Psa 18:9 , en Psa 140:11 , alwaar brandende kolen Gods straffen betekenen."},{"catchword":"fakkelen;","tekst":"Vergelijk Dan 10:6 ."},{"catchword":"ging steeds tussen die dieren;","tekst":"Of, deed zichzelven gaan; dat is, ging voort en voort, met steeds nieuwe vlammen vuur uit te schieten. Waarmede kan verstaan worden de gedurige beweging der engelen om Gods toorn uit te richten, mitsgaders het gestadige voornemen Gods, genegen om de boosheid der Joden te straffen."},{"catchword":"een glans,","tekst":"Betekenende de zuiverheid van Gods gerechtigheid, die in zijne oordelen klaarlijk blijkt."},{"catchword":"bliksem voort","tekst":"Versta hierdoor, eensdeels de vreeslijke verschrikkingen, die uit de rechtvaardige straffen Gods over de mensen vallen; anderdeels de onbegrijpelijke snelheid, die de engelen gebruiken in het uitvoeren van die straffen. Vergelijk Mat 24:27 ."}],"14":[{"catchword":"keerden weder","tekst":"Te weten, niet met zich van enig begonnen werk af te wenden door vermoeidheid, maar met zich weder te vertonen voor God, als hun werk gedaan is, bereid zijnde weder nieuwe bevelen te ontvangen. Van het eerste worden zij vrijgesproken, boven vs.9, 12, en dit laatste wordt hun hier toegeschreven."}],"15":[{"catchword":"rad op de aarde","tekst":"Hetwelk, naar sommiger gevoelen, betekende de wereld, die hier op de aarde aan vele veranderingen onderworpen is, gelijk een lopend rad, waarin dikwijls het bovenste onder en het onderste boven komt. Zie onder Eze 10:13 ."},{"catchword":"bij die dieren,","tekst":"Versta dat elk dier een rad had, zodat er vier raderen waren. Zie onder vs.16, en Eze 10:9 , Eze 10:12 ."},{"catchword":"vier aangezichten","tekst":"Dat is, zijden of hoeken, met welke zij tegen de vier winden der wereld zagen. Want elk rad was tweevoudig, zijnde een rad in een ander overdwars samengevoegd, zodat die twee samengehechte raderen den vorm van een kloot of kogel hadden, en vier zijden, op welke zij van de engelen naar de vier hoeken der aarde konden gerold en bewogen worden, nu naar den enen en dan naar den anderen hoek."},{"catchword":"hetzelve","tekst":"Te weten, van het rad, of van elkeen der dieren."}],"16":[{"catchword":"maaksel","tekst":"Of, werk; dat is vorm en fatsoen. Alzo is dit woord genomen 1Ki 7:17 , 1Ki 7:19 , 1Ki 7:26 , 1Ki 7:33 ; zo ook hier in het navolgende."},{"catchword":"turkoois;","tekst":"Zie Son 5:14 ."},{"catchword":"enerlei gelijkenis;","tekst":"Waardoor beduid werd dat de wereld overal zichzelve gelijk is, te weten ongestadig en vergankelijk. Sommigen duiden deze gelijkheid op de dieren."},{"catchword":"alsof het ware een rad","tekst":"Zie van vs.15 op de woorden, vier aangezichten. De betekenis hiervan is, hoewel de wereld door Gods beleid zeer wijselijk geregeerd wordt, dat nochtans daarin overal vele dingen, wanneer het God naar zijn rechtvaardig oordeel belieft, in het algemeen en in het bijzonder, zeer haast verward en omgekeerd worden, die Hij wel weet tot zijne eer en de zaligheid der zijnen terecht te brengen."}],"17":[{"catchword":"op hun vier zijden;","tekst":"Te weten, of naar het voorste deel, waar het aangezicht van den mens was, òf naar het achterste deel, waar het aangezicht van den arend stond, òf naar het rechterdeel, dat het aangezicht van den leeuw had, òf naar het linkerdeel, waar het aangezicht van den os stond, zodat er in het gaan gene omkering was, volgende het aangezicht van het dier of den cherub. Hetzelfde wordt ook boven van de dieren gezegd vs.9, 12."},{"catchword":"keerden zich niet om,","tekst":"Zie boven vs.9."}],"18":[{"catchword":"velgen,","tekst":"Hebreeuws, ruggen. Versta, de randen, of het ijzeren beslag van elk rad, die het uiterste en hoogste deel daarvan zijn: betekenende de grootste, hoogste en vreeslijkste dingen der wereld; en dat deze alle onder Gods macht staan, en van Hem door den dienst zijner engelen geregeerd worden."},{"catchword":"die waren zo hoog,","tekst":"Hebreeuws, en hoogte hadden zij, en vreeslijkheid hadden zij; dat is, zij waren zo hoog, dat zij vreeslijk waren of vrees veroorzaakten."},{"catchword":"ogen rondom","tekst":"Deze wijzen ons op de voorzienigheid Gods, die alle dingen op de aarde ziet en regeert. Vergelijk 2Ch 16:9 ; Job 34:21 ; Psa 33:18 ; Jer 16:17 ; Zec 3:9 , en Zec 4:10."}],"19":[{"catchword":"Als nu de dieren gingen,","tekst":"Dit betekent ons dat de veranderingen, die in deze wereld geschieden, van God door den dienst zijner heilige engelen geregeerd worden; waarvan het beleid, hoewel het voor ons ten meestendeel onbegrijpelijk is, nochtans rechtvaardig is."}],"20":[{"catchword":"Geest was om te gaan,","tekst":"Zie boven vs.12, en de aantekening."},{"catchword":"zij,","tekst":"Te weten de raderen."},{"catchword":"waarhenen de Geest was om te gaan;","tekst":"Hij verhaalt dat om de zaak te meer te verklaren en te verzekeren."},{"catchword":"hen opgeheven;","tekst":"Te weten de dieren, met welker opheffing de raderen onder hen ook opgeheven werden."},{"catchword":"de Geest","tekst":"De zin is dat de raderen bewogen en gedreven werden door een Geest, waardoor de dieren bewogen en gedreven waren, namelijk door den Geest Gods."},{"catchword":"dieren was in de raderen","tekst":"Hebreeuws, des diers; een enkel getal voor een veelvoudig. Alzo onder vs.21,22. Anders: een geest des levens was in de raderen."}],"21":[{"catchword":"die gingen,","tekst":"Te weten dieren. Alzo in het volgende."},{"catchword":"deze ;","tekst":"Te weten raderen; alzo vervolgens."},{"catchword":"stonden, stonden zij;","tekst":"Dat is, niet meer bewogen werden of voortgingen. Versta hierbij dat de engelen, hun werk uitgericht hebbende, in stilheid andere lasten verwachten, die God hun zou mogen opleggen."},{"catchword":"als die van de aarde opgeheven werden,","tekst":"Zie boven op het einde van vs.20."},{"catchword":"Geest","tekst":"Zie vs.12."},{"catchword":"der dieren was in de raderen","tekst":"Hebreeuws, des diers; gelijk vs.20."}],"22":[{"catchword":"dieren","tekst":"Hebreeuws, des diers; gelijk voren."},{"catchword":"uitspansels,","tekst":"Wat het uitspansel, van God in den beginne geschapen, eigenlijk is, kan men zien Gen 1:6 . Hier wordt nu gesproken van ene gelijkenis van dit uitspansel, die den profeet in dit gezicht vertoond is geweest, en dienvolgens niet was ene zaak, die in haar natuur en wezen gedurig bleef, maar de gedaante daarvan."},{"catchword":"de kleur","tekst":"Hebreeuws, oog. Zie boven vs.4."},{"catchword":"vreeslijke kristal,","tekst":"Of, van vreeslijk ijs. Want het woord kerach wordt meest voor ijs genomen, maar het is hier van de uitleggers kristal overgezet, gelijk het ook is als ijs in een steen verhard, zeer helder, klaar en doorluchtig, zodat de gedaante van dit uitspansel is geweest als een doorschijnend ijs, van zulke nette helderheid, dat het schrikkelijk was om te zien, waarom hetzelve hier vreeslijk genaamd wordt. Dit uitspansel was over de hoofden der dieren of engelen; te verstaan gevende dat de Heere al wat daaronder was, daardoor bekwamelijk kon zien, en dat de engelen zijne majesteit, die daarboven was, enigszins konden aanschouwen."}],"23":[{"catchword":"rechtop,","tekst":"Dat is, opwaarts verheven. Zie boven vs.6, en vergelijk boven vs.11."},{"catchword":"de een aan den ander;","tekst":"Hebreeuws, de vrouw aan hare zuster. Zie boven vs.9."},{"catchword":"ieder had er twee,","tekst":"Versta dit van de andere twee vleugelen, die elkeen van deze dieren nederwaarts had hangende tot bedekking van zijn lichaam. Zie boven vs.6."},{"catchword":"die herwaarts hun lichamen bedekten,","tekst":"Dat is, waarvan de ene bedekte hun ene zijde, te weten de voorste, en de andere de andere zijde, te weten de achterste. Want deze dieren hadden maar vier vleugelen, waarvan de twee oppersten verheven stonden, waarmede zij vlogen, en de andere twee nederhingen, om daarmede hunne lichamen te bedekken."},{"catchword":"ieder had er twee,","tekst":"Het verhaal van een of meer woorden geschiedt naar de wijze van spreken der Hebreën, wanneer zij enige bedeling maken. Zie Gen 7:2 ."},{"catchword":"die ze derwaarts bedekten","tekst":"Dat is, waarvan de andere vleugel de achterste zijde hunner lichamen bedekte."}],"24":[{"catchword":"geruis hunner vleugelen,","tekst":"Dit velerlei geluid betekent eensdeels een heilige toestemming en lofzegging der engelen, anderdeels dat de oordelen Gods, die Hij tegen de goddelozen door zijne engelen uitvoert, zeer schrikkelijk zijn, zulks dat een ieder zich daarvoor moet ontzetten."},{"catchword":"de stem des Almachtigen,","tekst":"Versta hierbij, wanneer Hij spreekt, uit onder Eze 10:5 . Sommigen verstaan het van het geklater of gerommel van den donder. Zie Psa 29:3 ."},{"catchword":"stonden,","tekst":"Zie boven vs.21."}],"25":[{"catchword":"stem van boven het uitspansel,","tekst":"Te weten waardoor de profeet opgewekt werd om toe te luisteren en de bevelen Gods met eerbied en gehoorzaamheid te ontvangen. Vergelijk Exo 19:16 ; Rev 1:10 ."},{"catchword":"hun hoofden was,","tekst":"Te weten der vier dieren."}],"26":[{"catchword":"troons,","tekst":"Deze betekende een koninklijke majesteit en de macht van een oppersten rechter, Gen 41:40 ; 1Ki 1:13 , en 1Ki 7:7 ; Pro 20:8 ."},{"catchword":"saffiersteen;","tekst":"Welks kleur is hemelsblauw, blinkende met gouden stipjes. Zie Job 28:16 . Hij betekende een hemelsen troon vol majesteit en heerlijkheid. Vergelijk Exo 24:10 ."},{"catchword":"mensen,","tekst":"Welke was ene afbeelding van de majesteit Gods. Vergelijk Isa 6:1 . Sommigen duiden het bijzonderlijk op de majesteit onzes Heeren Jezus Christus, waarachtig God en mens in enigheid des persoons, de enige Middelaar aller gelovigen en Rechter aller mensen, die onder Eze 8:6 , den tempel zijn heiligdom noemt, en met vs.28, de Heere geheten wordt."},{"catchword":"daarboven op zijnde","tekst":"Te weten als een eeuwig Koning en overste Rechter; 2Sa 7:13 ; Psa 45:7 ; Mat 25:31 ; Luk 1:32-33 ; Joh 5:22 , Joh 5:27 ; Act 10:42 , en Act 17:31 ."}],"27":[{"catchword":"als de kleur","tekst":"Namelijk rondom dien, die boven het uitspansel in den troon zat."},{"catchword":"Hasmal,","tekst":"Zie boven vs.4."},{"catchword":"van vuur","tekst":"Waarmede betekend werd de eeuwige Godheid, die een verterend vuur genaamd wordt; Deu 4:24 ; zie de aantekening aldaar."},{"catchword":"rondom daarbinnen,","tekst":"Dat is, rondom binnen de kleur van hasmal; zodat het scheen dat die in den troon zat, van zijne lenden af tot het hoofd toe opwaarts en tot de voeten nederwaarts, omgeven was met brandende hasMal."},{"catchword":"glans aan Hem rondom","tekst":"Hetwelk betekende dat God woont in een licht, tot hetwelk niemand toegaan kan, 1Ti 6:16 ; en dat evenwel een licht der vertroosting en zaligheid blijft al den zijnen, dat is den waren gelovigen, Psa 27:1 ; Isa 60:20 ; Mic 7:8 ."}],"28":[{"catchword":"alzo was de gedaante van den glans rondom;","tekst":"De gelijkenis van den regenboog diende om de majesteit desgenen, die op den troon zat, en den eerbied van den profeet jegens hem te vermeerderen. Men kan daardoor ook verstaan een teken der genade, die God in het straffen den boetvaardigen bewijzen zou."},{"catchword":"heerlijkheid des HEEREN;","tekst":"Te weten waarmede God zich in dit gezicht vertoonde, van welke zie ook onder Eze 3:23 , en Eze 8:4 , en Eze 9:3 , enz.; Exo 16:7 ; Lev 9:6 ; Num 14:10 . Zo is dan hiermede Gods heerlijke tegenwoordigheid te verstaan, en vervolgens Hijzelf."},{"catchword":"viel ik op mijn aangezicht,","tekst":"Te weten on tions of it in the church of God amongst which that seemeth to be the fittest is here followed .]"}],"2":[{"catchword":null,"tekst":"On the fifth day of the same moneth ,(that was the fifth year of king Jojachin carrying away,)[if to these five years we add eleven years of Jojachins reign,3Kinbgs 23.36. the three moneth of Joahaz ,2kings 23.31. and the fourteen last years of Josias , we find the thirty years with three months whereof is spoken in former verse .)"}],"3":[{"catchword":null,"tekst":"The word of the Lord came expressly [Heb coming to pass came to pass] unto Ezekiel [Heb Jechezkel .this name signifieth the strength of God or strengthened by God the son of Buzi ,the Priest in the land of Chaldeans ,by the river Chebar and the hand of the Lord was there upon him [that is ability to prophesy was given him of God .see 2kings 3 on ver 15 So below chap .11.5.. The meaning is one and the same .For the spirit of God giveth the ability and the gift for the prophesie ,1Cor .12.4]"}],"4":[{"catchword":null,"tekst":"Then I looked and behold a whirlwind came [To wit ,not onely to up to prophet to attention but also to represent the teible power of the supreme Judge which he would put into practice against Jerusalem ,by the enemies thereof see of such similitude,Job 9.on ver 17] from the north , [to wit from whence the Jews enemies that is the Chaldeans should come compare Jerem 1.13 ,14, 15] a great cloud , understand hereby the army of the Chadeans . see Jerem .4.13 .Compare below c 30.18.and 38.9] and a fire that caught in it , or infolding itself to wit in that cloud or compassing it compare Exod 9.24 this fire fought in the cloud fignifieth the burning of the city of Jerusalem and the temple and brightness was round about that cloud [by the brightness here is meant the glory of justice which God geteth by his punishment and judgements .psal 51.6 isa5.16 ] and out of the midst thereof [that is of the fire as appeareth by the end of this verse ]was the colour [Heb eye ;that is colour or hue whereupon the eye hath its operation .So Levit13.55.Numb 11.7 .below vers .7.] of Hasmal ,[many understand hereby a kind of rosin called amber by the Latines Succinum .Others take it to be a kind of metal called electrum consisting of gold whereof fifth part in silver in colour like unto pale gold .Others understand the word of the purest burning copper or steel :some take it for the colour of very siery coles ; having the name some conceive from hasly cutting as under consuming & this furtheth well with burning steel and coles out of the midst of the fire .[That is thereof appearing when it lyeth and burneth in the midst of thee fire compare this vision with that which is recorded below chap 10."}],"5":[{"catchword":null,"tekst":"And out of the midst thereof [to wit of the fire wherein was the colour of Hasmal] came the likeness of the four beast [by these beasts are to be understood the holy Angels because they they are called Cherubims below chap 10 vers 15,20 .Now that these four beast are said to come out of the midst of the fire this fignifieth both the brightness of their nature and the servency of their operation herewith agreeth the name seraphims , being derived from Saraph ,that is, to burn , Isa .6.2,6]and this was their shape and they had the likeness of a man .[to wit , for the most part of their body;for they had the face ,legs and hands of a man , vers 7,8 .Angels are likened unto man because they have understanding and will ,but much more perfect than men 2Sam .14.20 Psal.103.20 1Pet.1.12]"}],"6":[{"catchword":null,"tekst":"And everyone had four faces ;[whereof see below vers 10 so chap 10.14 ]likewise everyone of them had four wings .[to wit two for flie with not withstanding in this vision they lifted up towards the sirmament and in a manner covered their faces herewith; which wings signified partly their speediness in the exercuting Gods commands ,and partly teir willing and ready attendance and disposition to minister unto God their Lord and master .And two other wings they had for to cover their body therewith , which showeth both their reverence towards God ,and the invisibility of their nature and ssence unto man .in Isa6.2 and in Revel 4.8 are fix wings ascribed unto the angel to wit two more besides these four ,wherewith they cover their faces because they were before the throne of God whose brightness and majesty they were not able to endure .]"}],"7":[{"catchword":null,"tekst":"And their feet [That is legged or shanks ]were straight feet [signifying the straightness of their work .Heb and their feet ,the foot was straight ]and the soles of their feet [meaning that part of the leg that is properly called the foot ] were like the soles of the calves feet [which are round and strong ,to signify the swiftness and readiness of the angels in the execution of their ministery ] and sparkled [to shew that the works which God performeth by the angels are clear and glorious ] like the colour of smooth copper [or polished scoured and cleansed copper ;signifying the purity of the angels compare Revel 1.15]"}],"8":[{"catchword":null,"tekst":"And the hands of a man [understand by these hands the works of the holy angels which they do according to Gods commands and the aptness that is in them for those works were under their wings [to wit to signifie their works are invisible and unknown to men ]on their four sides ,[Heb four squares, wherby is represnted that they executed gods commands in and over all the corner of the world compare below chap 43 .16,17]and they had four faces and their wings."}],"9":[{"catchword":null,"tekst":"Their wings were joyaed together [understand this wherewith they flew ;and compare below vers 11 ]the one to the other ;[Heb the woman to their sister ;that is to, one another .so Exod 26.3 ,5,6 .below vers.23.and3.13.This joyning together seemeth to signifie the natural friendship and piece that is among the holy angels in the executing of their ministeries ] th /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
