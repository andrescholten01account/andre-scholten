en drukten.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Openb 4:5": "En van de troon gingen bliksemflitsen uit, en donderslagen, en stemmen; en zeven vurige lampen waren brandend voor de troon, welke de zeven Geesten van God zijn.", "Hand 9:7": "En de mannen die met hem meereisden, stonden sprakeloos; zij hoorden wel de stem, maar zagen niemand.", "Ps 97:4": "Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "Ezech 10:15": "En die cherubs hieven zich omhoog; dit was hetzelfde dier dat ik bij de rivier de Chebar gezien had.", "Hab 1:9": "Het zal geheel tot geweld komen, wat zij inslorpen zullen met hun gezichten naar het oosten gericht; en het zal de gevangenen verzamelen als zand.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "2 Kron 7:1-3": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis. En de priesters konden niet ingaan in het huis van de HEERE, want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Ps 97:2-5": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon. Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Ex 39:13": "En de vierde rij van een turkoois, en een sardonyx, en een jaspis; gezet in gouden kastjes in hun vullingen.", "Dan 8:17": "En hij kwam naast de plaats waar ik stond; en toen hij kwam, schrok ik, en viel op mijn gezicht. Toen zei hij tegen mij: Begrijp het, mensenkind! want dit gezicht gaat over de tijd van het einde.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Jes 26:15": "U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; maar U hebt hen tot alle einden van het aardrijk ver weggedaan.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Ps 29:2-4": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom. De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "Ezech 1:19-21": "Als nu de levende wezens gingen, gingen de raderen naast hen; en als de levende wezens van de aarde opgeheven werden, werden de raderen opgeheven. Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen. Als die gingen, gingen deze; en als die stonden, stonden zij; en als die van de aarde opgeheven werden, werden de raderen tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Mark 9:4": "En aan hen verschenen Elia met Mozes, en zij spraken met Jezus.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Dan 10:17": "En hoe kan de dienaar van deze mijn Heere spreken met deze mijn Heere? Want wat mij betreft, van nu af aan is er geen kracht meer in mij, en geen adem is in mij overgebleven.", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Gen 9:14": "En het zal gebeuren, als Ik wolken over de aarde breng, dat deze boog gezien zal worden in de wolken;", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "Jes 46:8": "Denk hieraan, en wees kloek, breng het weer in het hart, o overtreders!", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Ex 39:21": "En zij bonden het borstlap met zijn ringen aan de ringen van de efod, met een hemelsblauw snoer, dat op de kunstige riem van de efod was; opdat het borstlap van de efod niet losraakte, zoals de HEERE aan Mozes geboden had.", "Luk 3:21": "En het gebeurde, toen al het volk gedoopt werd, dat ook Jezus gedoopt werd, en bad, dat de hemel geopend werd;", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Openb 19:11": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Job 38:7": "Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.", "Ex 25:20": "En de cherubs zullen hun beide vleugels omhoog uitspreiden, en met hun vleugels het verzoendeksel bedekken; en hun gezichten zullen naar elkaar toe zijn; de gezichten van de cherubs zullen naar het verzoendeksel gericht zijn.", "Ex 33:23": "En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!", "Dan 8:1": "In het derde jaar van de regering van koning Belsazar verscheen mij een gezicht, mij Daniël, na wat mij al eerder verschenen was.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Pred 9:2": "Alles overkomt iedereen op dezelfde manier: eenzelfde lot treft de rechtvaardige en de goddeloze, de goede en de reine, als de onreine; zowel hem die offert, als hem die niet offert; zoals de goede, zo ook de zondaar, hij die zweert, evenals hij die de eed vreest.", "Job 28:26": "Toen Hij voor de regen een vaste orde maakte, en een weg voor het weerlicht van de donders;", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Gen 18:17-19": "En de HEERE zei: Zal Ik voor Abraham verbergen wat Ik ga doen? Omdat Abraham zeker tot een groot en machtig volk zal worden, en alle volken van de aarde in hem gezegend zullen worden? Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Ps 18:12-14": "Duisternis zette Hij tot Zijn verberging; rondom Hem was Zijn tent, duisterheid van water, wolken van de hemel. Van de glans die voor Hem was, dreven Zijn wolken daarheen, hagel en vurige kolen. En de HEERE donderde in de hemel, en de Allerhoogste gaf Zijn stem, hagel en vurige kolen.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Jer 6:1": "Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Deut 5:25": "Maar nu, waarom zouden wij sterven? Want dit grote vuur zou ons verteren; als wij nog langer de stem van de HEERE, onze God, blijven horen, zouden wij sterven.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Ezech 10:5": "En het geruis van de vleugels van de cherubs werd gehoord tot het uiterste voorhof, als de stem van de Almachtige God, wanneer Hij spreekt.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Ezech 10:8": "Want er werd bij de cherubs de gelijkenis van een mensenhand onder hun vleugels gezien.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "Ezech 10:19": "En de cherubs hieven hun vleugels op en verhieven zich van de aarde omhoog voor mijn ogen, toen zij naar buiten gingen; en de raderen waren tegenover hen; en elk bleef staan bij de deur van de Oostpoort van het huis van de HEERE; en de heerlijkheid van de God van Israël was van boven over hen.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Dan 2:32": "Het hoofd van dit beeld was van zuiver goud; zijn borst en zijn armen van zilver; zijn buik en zijn dijen van koper;", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Ezech 10:9": "Toen zag ik, en zie, vier raderen waren bij de cherubs; één rad was bij elke cherub; en de gedaante van de raderen was als de kleur van een turkooissteen.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Job 28:17": "Men kan het goud of het kristal haar niet gelijk waarderen; ook is zij niet te verwisselen voor een kleinood van zuiver goud.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "Ex 16:10": "En het gebeurde, toen Aäron tegen de hele gemeenschap van de Israëlieten sprak, en zij zich naar de woestijn keerden, zie, daar verscheen de heerlijkheid van de HEERE in de wolk.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Gal 3:19": "Waartoe is dan de wet? Zij is vanwege de overtredingen erbij gevoegd, totdat het nageslacht zou gekomen zijn aan wie het beloofd was; en zij is door de engelen ingesteld, in de hand van de Middelaar.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Ezech 10:10": "En wat hun gedaanten betreft, die vier hadden allemaal dezelfde gelijkenis, alsof er een rad in het midden van een rad was.", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Matt 17:6": "En toen de discipelen dit hoorden, vielen zij op hun gezicht en werden zeer bevreesd.", "Ezech 8:2": "Toen zag ik, en zie, een gelijkenis, als de gedaante van vuur; van de gedaante van Zijn lenden en naar beneden was vuur; en van Zijn lenden en naar boven, als de gedaante van een glans, als de kleur van amber.", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Ezech 1:4-14": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur. En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Ps 145:5": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden.", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Jes 2:10": "Ga in de rotssteen, en verberg u in het stof, vanwege de schrik van de HEERE, en om de heerlijkheid van Zijn majesteit.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Ps 19:2-5": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen. De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.", "Zach 6:1": "En ik hief mijn ogen weer op, en ik zag; en zie, vier wagens gingen er uit van tussen twee bergen, en die bergen waren bergen van koper.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Ezech 3:15": "En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Joh 13:31": "Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.", "Jer 1:4": "Het woord van de HEERE dan kwam tot mij, en zei:", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Jer 1:13": "En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Openb 1:15": "En Zijn voeten waren als blinkend koper, en gloeiden als in een oven; en Zijn stem als een stem van veel water.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Jer 4:6": "Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Ezech 10:11": "Als zij gingen, gingen zij naar hun vier zijden; zij keerden zich niet om als zij gingen; maar naar de plaats waar het hoofd heen keek, daar volgden zij naar; zij keerden zich niet om als zij gingen.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Deut 5:5": "(ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei:", "Dan 7:4": "Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "1 Kor 1:10": "Maar ik bid u, broeders, door de Naam van onze Heere Jezus Christus, dat u allen hetzelfde spreekt, en dat er onder u geen scheuringen zijn, maar dat u samengevoegd bent tot eenzelfde zin en tot eenzelfde gevoelen.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "Ezech 1:26-28": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend. En ik zag iets als de kleur van amber, als de gedaante van vuur rondom daarbinnen, vanaf de gedaante van Zijn lendenen en opwaarts; en vanaf de gedaante van Zijn lendenen en neerwaarts, zag ik iets als de gedaante van vuur, en een glans rondom Hem. Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.", "2 Petr 2:11": "terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere.", "Openb 4:8-11": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal. En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid, dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "1 Kron 16:25": "Want de HEERE is groot, en zeer te prijzen, en Hij is te vrezen boven alle goden.", "1 Kon 6:24-27": "En vijf ellen was de ene vleugel van de cherub, en vijf ellen de andere vleugel van de cherub; van het einde van zijn ene vleugel tot aan het einde van zijn andere vleugel waren het tien ellen. Zo was de andere cherub ook tien ellen; beide cherubs hadden dezelfde maat en dezelfde vorm. De hoogte van de ene cherub was tien ellen, en zo ook van de andere cherub.", "Gen 9:8-16": "Verder zei God tegen Noach, en tegen zijn zonen met hem: Maar Ik, zie, Ik richt Mijn verbond op met u, en met uw nageslacht na u; en met alle levende ziel die met u is, van het gevogelte, van het vee, en van alle dieren van de aarde met u; van allen die uit de ark gegaan zijn, tot al de dieren van de aarde toe.", "Ex 34:29-35": "En het gebeurde, toen Mozes van de berg Sinaï afdaalde (de twee tafelen van de getuigenis nu waren in de hand van Mozes, toen hij van de berg afdaalde), dat Mozes niet wist dat de huid van zijn aangezicht straalde, doordat Hij met hem gesproken had. Toen Aäron nu en al de kinderen van Israël Mozes aanzagen, zie, zo straalde de huid van zijn aangezicht; daarom waren zij bang om naar hem toe te gaan. Toen riep Mozes hen; en Aäron, en al de leiders in de vergadering keerden terug naar hem; en Mozes sprak tot hen.", "Hab 3:3-5": "God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof. En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen. Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten uit.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "Ezech 1:4-25": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur. En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Fil 2:9": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is;", "Gen 28:13": "En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.", "Ps 96:4": "Want de HEERE is groot, en zeer te prijzen; Hij is ontzagwekkend boven alle goden.", "Dan 9:21-23": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer. En hij onderrichtte mij en sprak met mij, en zei: Daniël! nu ben ik uitgegaan, om u het inzicht te doen verstaan. In het begin van uw smekingen is het woord uitgegaan, en ik ben gekomen om het u bekend te maken; want u bent een zeer geliefde man; versta dan dit woord, en let op dit visioen.", "Hebr 2:16": "Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Matt 17:3": "En zie, Mozes en Elia verschenen aan hen en spraken met Hem.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Ezech 10:22": "En wat de gelijkenis van hun aangezichten betreft, het waren dezelfde aangezichten die ik bij de rivier de Chebar gezien had, hun gedaanten en zij zelf; zij gingen ieder recht voor zich uit.", "Ps 102:23": "Wanneer de volken samen zullen vergaderd worden, ook de koninkrijken, om de HEERE te dienen.", "Ps 96:6": "Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en sieraad in Zijn heiligdom.", "Ps 29:3-9": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Hand 26:15": "En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt.", "Num 2:18": "De banier van het leger van Efraïm, naar hun legers, zal tegen het westen zijn; en Elisama, de zoon van Ammihud, zal de leider van de zonen van Efraïm zijn.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Luk 9:62": "En Jezus zei tegen hem: Niemand die zijn hand aan de ploeg slaat en achterom kijkt, is geschikt voor het Koninkrijk van God.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Jes 6:2": "De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.", "Ezech 10:12": "Hun hele lichaam nu, en hun ruggen, en hun handen, en hun vleugels, alsook de raderen, waren rondom vol ogen; die vier hadden hun raderen.", "Ezech 8:3": "En Hij stak de gelijkenis van een hand uit, en nam mij bij het haar van mijn hoofd; en de Geest voerde mij op tussen de aarde en de hemel, en bracht mij in visioenen van God naar Jeruzalem, tot de deur van de poort van de binnenste voorhof, die uitziet naar het noorden, waar de zitplaats was van een beeld van de ijver, dat tot ijver opwekt.", "Dan 2:39": "En na u zal een ander koninkrijk opstaan, lager dan het uwe; daarna een ander, het derde koninkrijk, van koper, dat zal heersen over de hele aarde.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Ex 25:3": "Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper;", "Gen 17:3": "Toen viel Abram op zijn aangezicht, en God sprak met hem en zei:", "Ex 34:5": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Matt 17:5": "Terwijl hij nog sprak, zie, een lichtende wolk overschaduwde hen; en zie, een stem uit de wolk zei: Dit is Mijn geliefde Zoon, in wie Ik Mijn welbehagen heb; luister naar Hem!", "Deut 33:25": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "Ps 57:12": "Verhef U boven de hemelen, o God! Uw eer zij over de hele aarde.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "Job 38:25": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen?", "Openb 9:17": "En ik zag zo de paarden in dit visioen, en hen die daarop zaten, met vurige, en hemelsblauwe, en zwavelkleurige borstwapens; en de hoofden van de paarden waren als hoofden van leeuwen, en uit hun monden ging vuur, en rook, en zwavel,", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Gen 9:13-16": "Mijn boog heb Ik gegeven in de wolken; die zal zijn tot een teken van het verbond tussen Mij en tussen de aarde. En het zal gebeuren, als Ik wolken over de aarde breng, dat deze boog gezien zal worden in de wolken; dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "Ezech 3:13": "En ik hoorde het geluid van de vleugels van de dieren, die de een de ander raakten, en het geluid van de raderen tegenover hen; en het geluid van een groot ruisen.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "1 Kor 9:10": "Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden.", "Num 4:5-12": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Openb 4:7": "En het eerste dier was een leeuw gelijk, en het tweede dier een kalf gelijk, en het derde dier had het gezicht als een mens, en het vierde dier was een vliegende arend gelijk.", "Job 37:22": "Als van het noorden het goud komt; maar bij God is een geweldige majesteit!", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Openb 16:18": "En er kwamen stemmen, en donderslagen, en bliksemflitsen; en er kwam een grote aardbeving, wat voor aardbeving niet is voorgekomen sinds er mensen op de aarde geweest zijn, namelijk zo'n aardbeving, en zo groot.", "Hand 7:53": "U, die de wet ontvangen hebt door bemiddeling van engelen, en die niet gehouden hebt!", "1 Kron 16:24": "Vertelt Zijn eer onder de heidenen, Zijn wonderwerken onder alle volken.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "2 Tess 1:8": "Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Joh 5:37": "En de Vader, Die Mij gezonden heeft, Die heeft Zelf van Mij getuigd. U hebt Zijn stem nooit gehoord, en Zijn gedaante ook niet gezien.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Joh 17:10": "En al het Mijne is van U, en het Uwe is van Mij; en Ik ben in hen verheerlijkt.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Ezech 8:4": "En zie, de heerlijkheid van de God van Israël was daar, naar de gedaante die ik in de vallei gezien had.", "2 Kron 3:12": "Evenzo was de vleugel van de andere cherub van vijf ellen, rakend aan de wand van het huis; en de andere vleugel was van vijf ellen, aansluitend aan de vleugel van de andere cherub.", "Job 37:2": "Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat!", "Job 4:15-19": "Toen ging er een geest voorbij mijn gezicht; hij deed het haar van mijn lichaam overeind komen. Hij stond stil, maar ik herkende zijn gedaante niet; er was een beeltenis voor mijn ogen; er was stilte, en ik hoorde een stem, die zei: Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "2 Kron 3:11": "Aangaande de vleugels van de cherubs, hun lengte was twintig ellen; de ene vleugel van de één was van vijf ellen, rakend aan de wand van het huis, en de andere vleugel van vijf ellen, rakend aan de vleugel van de andere cherub.", "Dan 10:18": "Toen raakte Hij mij opnieuw aan, Een, in de gedaante van een mens; en Hij versterkte mij.", "Openb 21:10": "En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Job 35:5-7": "Kijk naar de hemel en zie; en aanschouw de bovenste wolken, zij zijn hoger dan u. Als u zondigt, wat doet u Hem daarmee aan? Als uw overtredingen talrijk zijn, wat doet u Hem daarmee? Als u rechtvaardig bent, wat geeft u Hem, of wat ontvangt Hij uit uw hand?", "Ezech 10:1": "Daarna zag ik, en zie, boven het uitspansel dat over het hoofd van de cherubs was, was er iets als een saffiersteen, als de gedaante van de gelijkenis van een troon; en Hij verscheen daarop.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Openb 22:9": "En hij zei tegen mij: Zie toe, doe dat niet; want ik ben uw mededienstknecht, en van uw broeders de profeten, en van hen die de woorden van dit boek bewaren; aanbid God.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Hebr 1:4": "Zoveel voortreffelijker geworden dan de engelen, als Hij een uitnemender Naam boven hen geërfd heeft.", "Ezech 3:23": "En ik maakte mij op, en ging uit naar de vallei, en zie, de heerlijkheid van de HEERE stond daar, gelijk de heerlijkheid, die ik gezien had bij de rivier Chebar; en ik viel op mijn gezicht.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Jes 48:11": "Om Mijnentwil, om Mijnentwil zal Ik het doen, want hoe zou Hij ontheiligd worden? En Ik zal Mijn eer aan geen ander geven.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Job 37:3": "Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.", "Ps 18:14": "En de HEERE donderde in de hemel, en de Allerhoogste gaf Zijn stem, hagel en vurige kolen.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Nahum 2:4": "De wagens razen door de wijken, zij lopen heen en weer op de straten; hun verschijning is als die van fakkels, zij lopen door elkaar heen als de bliksems.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Ezech 20:14": "Maar Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, voor wier ogen Ik hen uitleidde.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Job 9:32": "Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Jer 29:2": "(Nadat koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, alsook de timmerlieden en smeden van Jeruzalem waren weggegaan);", "Gen 46:2": "En God sprak tot Israël in visioenen in de nacht, en zei: Jakob, Jakob! En hij zei: Zie, hier ben ik!", "Ef 1:22": "En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Ps 104:3": "Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Hab 1:8": "Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Ezech 20:44": "Zo zult u weten dat Ik de HEERE ben, wanneer Ik met u gedaan zal hebben om Mijn Naam, niet naar uw slechte wegen, noch naar uw verdorven handelingen, o huis van Israël, spreekt de Heere HEERE.", "Joz 5:13-15": "Vervolgens gebeurde het, toen Jozua bij Jericho was, dat hij zijn ogen opsloeg en toekeek, en zie, er stond een Man tegenover hem, Die een getrokken zwaard in Zijn hand had. En Jozua ging naar Hem toe, en zei tegen Hem: Bent U van ons, of van onze vijanden? En Hij zei: Nee, maar Ik ben de Vorst van het leger van de HEERE: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zei tegen Hem: Wat spreekt mijn Heere tegen Zijn knecht? Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Lev 11:3": "Alles onder de dieren wat de klauw verdeelt, en de klauwen in tweeën gespleten heeft, en herkauwt, dat mag u eten.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Openb 10:1-6": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur. En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde. En hij riep met een luide stem, zoals een leeuw brult; en toen hij geroepen had, spraken de zeven donderslagen met hun stemmen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Ex 28:28": "En zij zullen de borstlap met zijn ringen aan de ringen van de efod opwaarts binden, met een hemelsblauw snoer, zodat hij op de kunstige riem van de efod is; en de borstlap zal van de efod niet afgescheiden worden.", "2 Kron 6:1": "Toen zei Salomo: De HEERE heeft gezegd dat Hij in de donkerheid zou wonen.", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Hebr 2:5": "Want Hij heeft de toekomende wereld, waar wij van spreken, niet aan de engelen onderworpen.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "Jer 1:18": "Want zie, Ik stel u vandaag tot een vaste stad, en tot een ijzeren pilaar, en tot koperen muren tegen het hele land; tegen de koningen van Juda, tegen haar vorsten, tegen haar priesters, en tegen het volk van het land.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Openb 21:11": "En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Hand 9:4": "en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?", "Ex 31:17": "Hij zal tussen Mij en tussen de kinderen van Israël een teken in eeuwigheid zijn; omdat de HEERE, in zes dagen, de hemel en de aarde gemaakt heeft, en op de zevende dag gerust heeft en Zich verkwikt heeft.", "Ezech 33:21": "En het gebeurde in het twaalfde jaar van onze wegvoering, in de tiende maand, op de vijfde dag van de maand, dat er iemand tot mij kwam die uit Jeruzalem ontkomen was, en hij zei: De stad is ingenomen.", "Ezech 11:25": "En ik sprak tot de weggevoerde gevangenen al de woorden van de HEERE, die Hij mij had laten zien.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Hand 2:19": "En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Openb 9:8": "En zij hadden haar als haar van vrouwen, en hun tanden waren als tanden van leeuwen.", "Ex 33:18-20": "Toen zei hij: Toon mij nu Uw heerlijkheid! Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal. Hij zei verder: U zou Mijn aangezicht niet kunnen zien; want Mij zal geen mens zien en leven.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "2 Kron 4:16": "Insgelijks de potten, en de schoffels, en de krauwels, en al hun gereedschap maakte Huram Abi voor de koning Salomo, voor het huis van de HEERE, van gepolijst koper.", "1 Petr 3:22": "Die aan de rechterhand van God is, opgevaren naar de hemel, terwijl de engelen, en machten, en krachten Hem onderdanig zijn gemaakt.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Jes 49:26": "En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Hebr 12:18-21": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer, En tot het geschal van de bazuin, en de stem van de woorden; waarbij zij die het hoorden, baden dat het woord tot hen niet meer gesproken zou worden. (Want zij konden niet dragen wat er geboden werd: Zelfs als een dier de berg aanraakt, zal het gestenigd of met een pijl doorschoten worden.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Dan 10:16": "En zie, Eén, gelijkend op mensenkinderen, raakte mijn lippen aan, toen deed ik mijn mond open, en ik sprak, en zei tegen Hem, Die tegenover mij stond: Mijn Heere! Om het gezicht keren mijn weeën zich tegen mij, zodat ik geen kracht behoud.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "Ps 96:3": "Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Kol 2:10": "En u bent in Hem volmaakt, Die het Hoofd is van alle overheid en macht;", "Ex 38:18": "En het gordijn voor de poort van de voorhof was van geborduurd werk, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; en twintig ellen was de lengte, en de hoogte in de breedte was vijf ellen, overeenkomstig de behangsels van de voorhof.", "Ex 40:35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Dan 4:13": "Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Zach 1:12-14": "Toen antwoordde de Engel van de HEERE, en zei: HEERE van de heerscharen! Hoelang zult U Zich niet ontfermen over Jeruzalem en over de steden van Juda, op wie U toornig geweest bent, deze zeventig jaren? En de HEERE antwoordde de Engel Die met mij sprak, met goede woorden, troostvolle woorden. En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Ezech 10:17": "Als die stonden, stonden dezen ook; en als die opgeheven werden, hieven dezen zich ook op; want de geest van de dieren was in hen.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Joh 12:28-30": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken. De menigte dan, die daar stond en dit hoorde, zei dat het gedonderd had. Anderen zeiden: Een engel heeft tegen Hem gesproken. Jezus antwoordde en zei: Niet om Mij is deze stem gebeurd, maar om u.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ex 39:29": "En de gordel van fijn getweernd linnen, en van hemelsblauw, en purper, en scharlaken, van geborduurd werk, zoals de HEERE aan Mozes geboden had.", "Matt 13:41": "De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Ezech 10:4": "Toen hief de heerlijkheid van de HEERE zich omhoog van boven de cherub, naar de drempel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van de glans van de heerlijkheid van de HEERE.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Num 12:6": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Ezech 43:3": "En zo was de gedaante van het gezicht dat ik zag, gelijk het gezicht dat ik gezien had toen ik kwam om de stad te verderven; en het waren gezichten als het gezicht dat ik gezien had aan de rivier Chebar; en ik viel op mijn aangezicht.", "Luk 3:23": "En Hij, Jezus, was ongeveer dertig jaar oud toen Hij Zijn werk begon, en Hij was (naar men meende) de zoon van Jozef, de zoon van Heli,", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Num 2:10": "De banier van het leger van Ruben, naar hun legers, zal tegen het zuiden zijn; en Elizur, de zoon van Sedeur, zal de leider van de zonen van Ruben zijn.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Ezech 36:23": "Want Ik zal Mijn grote Naam heiligen, die onder de heidenen ontheiligd is, die u in het midden van hen ontheiligd hebt; en de heidenen zullen weten dat Ik de HEERE ben, spreekt de Heere HEERE, als Ik aan u voor hun ogen zal geheiligd zijn.", "Ezech 43:2": "En zie, de heerlijkheid van de God van Israël kwam van de weg naar het oosten; en Zijn stem was als het geruis van veel water, en de aarde werd verlicht van Zijn heerlijkheid.", "Ezech 8:2-14": "Toen zag ik, en zie, een gelijkenis, als de gedaante van vuur; van de gedaante van Zijn lenden en naar beneden was vuur; en van Zijn lenden en naar boven, als de gedaante van een glans, als de kleur van amber. En Hij stak de gelijkenis van een hand uit, en nam mij bij het haar van mijn hoofd; en de Geest voerde mij op tussen de aarde en de hemel, en bracht mij in visioenen van God naar Jeruzalem, tot de deur van de poort van de binnenste voorhof, die uitziet naar het noorden, waar de zitplaats was van een beeld van de ijver, dat tot ijver opwekt. En zie, de heerlijkheid van de God van Israël was daar, naar de gedaante die ik in de vallei gezien had.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Ps 8:10": "O HEERE, onze Heere! Hoe heerlijk is Uw Naam op de hele aarde!", "Ezech 1:5-11": "En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels. En hun voeten waren rechte voeten, en hun voetzolen waren gelijk de voetzool van een kalf, en glinsterden als de kleur van glad koper.", "Ezech 1:15-21": "Toen ik die levende wezens zag, zie, zo was er één rad op de aarde bij die levende wezens, met vier gezichten. De gedaante van de raderen en hun maaksel was als de kleur van een turkoois; en die vier hadden één gelijkenis; bovendien was hun gedaante en hun maaksel alsof het een rad was in het midden van een rad. Als zij gingen, gingen zij op hun vier zijden; zij keerden zich niet om als zij gingen.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ps 97:9": "Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Openb 15:8": "En de tempel werd vervuld met rook uit de heerlijkheid van God, en uit Zijn kracht; en niemand kon de tempel binnengaan, totdat de zeven plagen van de zeven engelen geëindigd waren.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Matt 13:42": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Ex 19:16-18": "En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik. En Mozes leidde het volk uit het leger, God tegemoet; en zij stonden onderaan de berg. En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.", "Kol 1:16": "Want door Hem zijn alle dingen geschapen, die in de hemelen en die op de aarde zijn, die zienlijk en die onzienlijk zijn, hetzij tronen, hetzij heerschappijen, hetzij overheden, hetzij machten; alle dingen zijn door Hem en tot Hem geschapen;", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Ezech 1:8-11": "En mensenhanden waren onder hun vleugels, aan hun vier zijden; en die vier hadden hun gezichten en hun vleugels. Hun vleugels waren aan elkaar verbonden, de een aan de ander; zij keerden zich niet om als zij gingen; zij gingen ieder recht voor zich uit. De gelijkenis van hun gezicht nu was het gezicht van een mens, en het gezicht van een leeuw hadden die vier aan de rechterzijde; en aan de linkerzijde hadden die vier het gezicht van een os; ook hadden die vier het gezicht van een arend.", "Openb 10:1": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Zach 6:1-8": "En ik hief mijn ogen weer op, en ik zag; en zie, vier wagens gingen er uit van tussen twee bergen, en die bergen waren bergen van koper. Aan de eerste wagen waren rode paarden; en aan de tweede wagen waren zwarte paarden. En aan de derde wagen witte paarden; en aan de vierde wagen hagelvlekkige paarden, die sterk waren.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "Jes 6:5-7": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Jes 62:3": "En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Openb 4:2": "En meteen werd ik in de geest; en zie, er was een troon gezet in de hemel, en er zat Iemand op de troon.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Num 4:3": "Van dertig jaar oud en ouder, tot vijftig jaar oud; ieder die in deze strijd komt om het werk in de tent der samenkomst te doen.", "Jes 6:1-5": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de ee
