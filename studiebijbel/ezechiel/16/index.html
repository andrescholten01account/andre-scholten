mte. Dit betekent de snoodste en laagste schande, die men iemand zou mogen voor de mensen aandoen. Vergelijk 2Sa 10:4 ; Isa 20:4 , en Isa 47:3 ; Jer 13:22 , Jer 13:26 ; Nah 3:5 ."}],"38":[{"catchword":"de rechten der overspeelsters","tekst":"Zie van deze rechten Lev 20:10 ; Deu 22:22 ."},{"catchword":"der bloedvergietsters richten;","tekst":"Zie Gen 9:6 ; Exo 21:12 ; Mat 26:52 ; Rev 13:10 ."},{"catchword":"het bloed der grimmigheid","tekst":"Dat is, den dood, die voortkomen zal uit mijn grimmigheid en ijver."},{"catchword":"ijvers","tekst":"Zie boven Eze 4:13 ."}],"39":[{"catchword":"sierlijke juwelen nemen,","tekst":"Hebreeuws, vaten of gereedschappen van uw sieraad, of uwer heerlijkheid."}],"41":[{"catchword":"met vuur verbranden,","tekst":"Deze straf is hier misschien ook vermeld ten aanzien van de zonde van overspel, die alzo door enige oude wetten is gestraft geweest. Vergelijk Gen 38:24 ; Lev 21:9 ; Jer 29:22-23 ; onder Eze 23:45 , Eze 23:47 . Zie deze verbranding vervuld, 2Ki 25 , en 2Ch 36 , en Jer 52 ."},{"catchword":"vrouwen ogen;","tekst":"Dat is, volken. Alzo is het Joodse volk in dezen gehelen handel voorgesteld onder den naam van een overspelige vrouw. Zo worden ook door dochters in de Heilige Schrift volken verstaan. Zie boven vs.27. Hier nu wordt gesproken van de omliggende volken, wien de Joden in hunnen ondergang tot een openbaar voorbeeld van Gods wraak, ja velen tot een spot geworden zijn. Zie Psa 137:7 ; Lam 1:8 , 21, en Lam 2:15-16 , onder Eze 25:3 , enz., en Eze 26:2 , enz."}],"42":[{"catchword":"Mijn grimmigheid op u doen rusten,","tekst":"Zie boven Eze 5:13 ."},{"catchword":"Mijn ijver zal van u afwijken;","tekst":"Te weten, nadat Ik al mijn schrikkelijke oordelen tegen u zal uitgevoerd hebben, zulks dat Ik mij daarmede tevreden houden zal zonder mij over uwe snoodheid meer te storen. God spreekt van zichzelven menselijkerwijze."}],"43":[{"catchword":"aan de dagen uwer jonkheid,","tekst":"Dat is, aan uwe eerste ellende en mijne weldadigheid daarin tegen u. Zie boven vs.4, enz."},{"catchword":"tot beroering geweest zijt met dit alles,","tekst":"Te weten tot toorn. Alzo is dit woord voor toornige beroering genomen, Gen 45:24 ; Pro 29:9 . Zie de aantekening."},{"catchword":"uw weg op uw hoofd geven,","tekst":"Zie boven Eze 9:10 ."},{"catchword":"die schandelijke","tekst":"Versta, de vergeting van hare jonkheid, waarvan in het begin van vs.43 gemeld is. Anders, de vermoording van hare kinderen, waarvan zie boven vs.20,21. Sommigen nemen het Hebreeuwse woord in het goede, en vertalen deze woorden aldus: en gij hebt niet een gedachte gemaakt, of gehad; dat is niet eens gedacht aan al uwe gruwelen."},{"catchword":"gruwelen","tekst":"Dat is, gruwelijke afgoderijen."}],"44":[{"catchword":"spreekwoord gebruiken,","tekst":"Zie boven Eze 12:22 ."},{"catchword":"Zo de moeder is, is haar dochter","tekst":"Dat is de dochter volgt zeer dikwijls den aard en de zeden hare moeder."}],"45":[{"catchword":"Gij zijt de dochter uwer moeder,","tekst":"Dat is, gij aardt naar haar en zijt haar in manieren en werken gelijk."},{"catchword":"van haar man en van haar kinderen;","tekst":"Dat is, van God, dien zij door de afgoderij verliet, en van haar eigen zonen en dochters, die zij den afgoden ter ere vermoordde."},{"catchword":"uwer zusteren,","tekst":"Genaamd Samaria en Sodom in vs.46. Hebreeuws, zuster; dat is, van elke uwer zusters, alzo in het volgende."},{"catchword":"uw moeder was een Hethietische,","tekst":"Zie boven vs.3."}],"46":[{"catchword":"grote zuster nu is Samaria,","tekst":"Samaria, waardoor de tien stammen verstaan zijn, wordt Jeruzalems grote zuster genaamd, omdat haar koninkrijk meerder was dan het koninkrijk van Juda, alzo Sodom haar kleine zuster, omdat haar koninkrijk minder was."},{"catchword":"dochteren,","tekst":"Het woord dochters betekent wel dikwijls de onderhorige plaatsen der grote steden, [zie 2Ki 19:21 ] , maar hier kan men het verstaan van de inwoners dezer steden en landen."},{"catchword":"aan uw linkerhand;","tekst":"Dat is, noordwaarts van u. Want die in Jeruzalem waren, staande met het aangezicht naar het oosten, hadden Samaria aan de linkerhand; dat is benoorden, en Sodom aan de rechterhand, dat is bezuiden."}],"47":[{"catchword":"hebt in haar wegen niet gewandeld,","tekst":"Dat is, hare zonden zijn nog bij de uwe, die veel meerder en gruwelijker zijn, niet te vergelijken."},{"catchword":"het was wat gerings,","tekst":"Te weten niets anders te zondigen dan die van Samaria en Sodom gezondigd hadden."},{"catchword":"een verdriet;","tekst":"Te weten dat gij niet meer zoudt doen dan zij gedaan hebben."},{"catchword":"meer verdorven dan zij,","tekst":"Dat is, erger gemaakt en goddelozer geleefd. Alzo is het woord verderven, of verdorven maken genomen. Deu 31:29 ; Jdg 2:19 . Anders noemt dit de Heilige Schriftuur, zijnen weg verderven, Gen 6:12 ; zijne handelingen, of werken verderven, Zep 3:7 ."},{"catchword":"wegen","tekst":"Dat is, werken."}],"48":[{"catchword":"uw dochteren","tekst":"Een afgebroken reden, in het eedzweren gebruikelijk."}],"49":[{"catchword":"zatheid van brood","tekst":"Versta al de zonden, welke uit den overvloed van lichamelijke nooddruft plegen in den goddeloze voort te komen, alzo in het volgende: gerust voor het kwaad, dat daaruit komt."},{"catchword":"stille gerustheid","tekst":"Of, gerust stilheid. Anders: overvloedige ledigheid."}],"50":[{"catchword":"gruwelijkheid","tekst":"Zie hiervan Gen 13:13 , en Gen 18:20 , en Gen 19:5 ."},{"catchword":"voor Mijn aangezicht;","tekst":"Zie Gen 6:11 ."},{"catchword":"nadat Ik het gezien had","tekst":"Te weten hoe gruwelijk zij leefden. Vergelijk Gen 18:21 , en de aantekening. Het is menselijkerwijze van God gesproken."}],"51":[{"catchword":"niet gezondigd;","tekst":"Te weten om uwe ondankbaarheid, waardoor gij de weldadigheid, die van mij aan u veel meer dan aan Samaria geweest is, smadelijk verworpen hebt; en om uwe zorgeloosheid, waardoor gij de straffen, die Ik over Samaria gezonden heb, u tot een voorbeeld en waarschuwing, hebt in den wind geslagen."},{"catchword":"gerechtvaardigd door al uw gruwelen,","tekst":"Dat is, verklaard vromer te zijn dan gij, omdat zij zo gruwelijk niet gezondigd hebben. Vergelijk Jer 3:11 ."}],"52":[{"catchword":"zusteren","tekst":"Hebreeuws, zuster. Zie boven vs.45."},{"catchword":"geoordeeld hebt","tekst":"Dat is, gerechtvaardigd en vromer dan uzelven gesproken hebt, gelijk in vs.51. Anders: die uwe zuster, te weten Samaria, veroordeeld hebt, verklarende dat zij om haar afval rechtvaardig van God gestraft en verlaten was. Anders: gij die uwe zusters geoordeeld hebt, draag ook uwe schande om uwe zonden, enz."},{"catchword":"zusters gerechtvaardigd hebt","tekst":"Hebreeuws, zuster. Zie boven vs.45."}],"53":[{"catchword":"gevangenen wederbrengen zal,","tekst":"Hebreeuws, gevangenis, alzo in het volgende. Zie Num 31:12 ."},{"catchword":"gevangenen van Samaria","tekst":"Het woord gevangenis wordt genomen voor allerlei plagen en straffen, die den mens overkomen. Zie Job 42:10 en de aantekening."},{"catchword":"dan zal Ik wederbrengen","tekst":"Dat is, nimmermeer. Want Sodom en Samaria waren gans uitgeroeid zonder enige hoop van in haar vorigen staat hersteld te worden; alzo in vs.55. Versta dit met uitneming van degenen, die God uit genade verkoren had, tot een heilig zaad en een overblijfsel zijner kerk, van welke zie onder vs.60."}],"54":[{"catchword":"haar","tekst":"Te weten Sodom en Samaria."},{"catchword":"troosten zult","tekst":"Dat is, in hare plagen, die zij ontvangen hebben, verlichten, als zij zullen inzien dat gelijke zonden gelijke plagen krijgen. Vergelijk boven Eze 14:22 ."}],"56":[{"catchword":"is in uw mond niet gehoord geweest,","tekst":"Hebreeuws, is niet tot een gehoor of gerucht geweest in uwen mond; dat is, gij hebt kwalijk enig gewag gemaakt van het vreselijk exempel mijner wraak, die Ik over de Sodomieten uitgestort heb, ten einde gij met vermijding van gelijke zonden, gelijke straffen zoudt mogen ontgaan."},{"catchword":"uws groten hoogmoeds,","tekst":"Hebreeuws, uwer hoogmoeden; dat is, als gij zeer hoogmoedig zijt geweest, te weten als gij met grote hovaardigheid en stoutmoedigheid alle waarschuwingen mijner profeten versmaad hebt en in uwe gruwelen voortgegaan zijt. Anders, uwer heerlijkheden, of overtreffelijkheden; dat is, als gij in uw hoogsten welstand, weelde en waardigheid waart. Het Hebreeuwse woord wordt in het kwade voor hoogmoed, of hovaardij genomen, Lev 26:19 ; Job 35:12 ; boven Eze 7:24 ; in het goede voor heerlijkheid, overtreffelijkheid, hoogheid, Exo 15:7 ; Job 40:5 ; Psa 47:5 ."}],"57":[{"catchword":"ontdekt was","tekst":"Te weten door mijne straffen, die Ik over u gezonden heb. Anders zijn de zonden van Gods volk door de predikatie en vermaningen der profeten altijd ontdekt geweest."},{"catchword":"der versmading van de dochteren van Syrië,","tekst":"Dat is, waardoor gij van de Syriërs zijt versmaad geweest, als zij uw land afliepen en plunderden; 2Ki 16:5-6 ; 2Ch 28:5-6 ."},{"catchword":"datzelve waren,","tekst":"Te weten land van Syrië."},{"catchword":"de dochteren der Filistijnen,","tekst":"Dat is, de Filistijnen; zie 2Ch 28:18 ."},{"catchword":"verachten","tekst":"Versta, de verachting, die recht tevoren versmading is genaamd geweest. Anders: beroofden en plunderden. Want het Hebreeuwse woord betekent naar veler gevoelen niet alleen verachten, maar ook beroven."},{"catchword":"van rondom,","tekst":"Dat is, van alle zijden."}],"58":[{"catchword":"uw schandelijke daden","tekst":"Hebreeuws, schandelijke daad, schandelijkheid; dat is, straffen derzelve, waardoor uwe boosheid is begonnen ontdekt te worden."}],"59":[{"catchword":"Ik zal u ook doen,","tekst":"Dat is, gelijk gij het verbond gebroken hebt, alzo heb Ik nu ook de vrijheid hetzelfde te doen."},{"catchword":"eed veracht hebt,","tekst":"Te weten waardoor gij gezworen en u vervloekt hebt, indien gij het verbond, dat Ik met u gemaakt hebt, kwaamt te breken; Deu 27:15 , enz. Vergelijk Neh 10:29 , en de aantekening."},{"catchword":"verbond","tekst":"Gemaakt op den berg Sinaï."}],"60":[{"catchword":"gedachtig wezen aan Mijn verbond","tekst":"Zie Gen 8:1 ."},{"catchword":"met u,","tekst":"Dat is, dat Ik met u gemaakt heb ten tijde van Abraham, Izak en Jakob. Want met dezen en hunne nakomelingen had God een verbond der genade opgericht, steunende op de verdiensten van den toekomenden Messias; Gen 17:2 ."},{"catchword":"eeuwig verbond oprichten","tekst":"Te weten hangende van het voorgaande verbond der genade en ene vernieuwing daarvan zijnde, en mede openstaande voor alle heidenen, die in Christus geloven zouden."}],"61":[{"catchword":"gij uwer wegen gedenken","tekst":"Namelijk, o Jeruzalem en Juda."},{"catchword":"uw zusteren,","tekst":"Versta, degenen die uit de Israëlieten, of de tien stammen, en uit de volken, zo grote, zo kleine, in den Messias geloven, en zich tot de ware kennis van God bekeren zouden."},{"catchword":"aannemen zult;","tekst":"Dat is, ontvangen tot de gemeenschap der kerk."},{"catchword":"tot dochteren,","tekst":"Te weten als uit u geboren door de prediking van het heilig Evangelie."},{"catchword":"uw verbond","tekst":"Te weten het verbond der wet, dat Ik met u gemaakt heb, alsof gij dat wel onderhouden hadt; maar uit mijn genadeverbond, hetwelk ook mijnen uitverkorenen uit de heidenen aangaat."}],"62":[{"catchword":"verbond","tekst":"Versta het verbond der genade, en vergelijk Jer 31:32 ."},{"catchword":"oprichten,","tekst":"Of bevestigen."}],"63":[{"catchword":"niet meer uw mond opent","tekst":"Hebreeuws, niet meer opening des monds hebt; dat is, opdat gij niet meer de stoutheid noch de stof hebt om u te ontschuldigen en uwe zonden te verschonen. Deze manier van spreken in het goede genomen, is zoveel als de vrijmoedigheid en stof te hebben om iets klaarlijk uit te spreken; zie onder Eze 29:21 ; Eph 6:19 ."},{"catchword":"voor u verzoening doen zal","tekst":"Dat is, u met mij verzoenen zal; alzo 2Ch 30:18 . Of, genadig zijn zal; Deu 21:8 . Zie de aantekening."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover the word the Lord came unto me saying :"}],"2":[{"catchword":null,"tekst":"Child of man make Jerusalem [that is inhabitants of Jerusalem which here in the sequel for the cause are spoken to in the singular number and in the feminine gender ]acquainted with her abomination [that is abominable committed especially by idolatry .]"}],"3":[{"catchword":null,"tekst":"And say thus saith the Lord LORD unto Jerusalem ;thy dealings [many understand hereby the whole practice of all the people of Israel in the point of religion and the service of God where under are also to be comprehended the works concerning the conversations of life others render this word offsprings or generations originals habitations and conversations ]and thy nativities are of the land of the Canaanites [that is the beginnings and the originals of forementioned dealings are not Abraham and Sara of whom ye boast to be descended but of the idolatrous and wicked heathen whose doings ye have imitated degenerating from the faiths and the works of your father Abraham compare Job 8..39 Rom 2.28 and 9.7,8 some conceive that the Hebrew word is here put in the plural number to shew that the Israelites always followeth the drivers idolatrous religion not being contented with one ] thy father was Amorite [see of this people descent Genes 10.16 and their wickedness Genes 15.16] and thy mother an Hittite [of the Hittites descent see Genes 10.15 and their wickedness Genes 27.46. ]"}],"4":[{"catchword":null,"tekst":"And concerning the nativities in the day when thou wast born [that is at the time that I called Abraham as an idolater Jos 24.2 when thou wast in his loins out of Uz in Chaldea to go into the land of Canaan and brought his feed into Egypt and led them through the wilderness into the land of promise compare Hos 2.3 ] thy navel was not cut [this signifieth that no bare creature was delivered or could deliver this people from their natural misery and death to bring them to everlasting salvation ]neither wast thou washed with water when I beheld thee [Heb my beholding that is as soon as I beheld thee so do some also render the words by or with my foot Genes 30.30 that is as soon as I came in others for my beholding that is for a delight of my beholding so that thou shouldest have been delightful and acceptable unto my sight others for softening to wit whereby the skin a new born child is made soft clean neat and smooth when after it is washed it is anointed with some materials useful for that purpose ] also thou wast not rubbed with salt at all [Heb being salted wast not salted salt was also used to stiffen or harden the skin and to strengthen the inward parts all this intimateth that God in the Israelites when he took them for his own people found nothing else in them but misery filth and weakness and consequently chose them not in respect of their own worthness but of this free grace in the promised Messiah ]nor swaddled in swaddling &acirc;&euro;&ldquo;bands [the people of Israel misery is in this and some following verses described by a similitude taken from a new-born child that being come forth out of its mother womb is regarded by no man. ]"}],"5":[{"catchword":null,"tekst":"No eye had compression on thee [to wit not only because they would not but also because they could not Heb no cry spared or pitied thee] to do one of these things unto thee [to wit which ought necessarily to be done to a such new born babe for its preservations] to have mercy upon thee but thou wast cast out upon the plain of the field [that is forsaken by all and to be held by none but by God ] for the loathsomeness of thy soul [for the heart of man is deceitful above all things and corrupt Jerem 17.9 his understanding is enmity against God Rom 8.7 and he wholly as a maggot and a worm Job 25:6 yea lighter then vanity Psal 62.10 ]in the day when thou wast born ."}],"6":[{"catchword":null,"tekst":"When I passed by thee then I saw thee being trodden down in thy blood [to wit which was upon thy body when thou first camest into the world this blood signifieth the corruption of our nature wherein we are all conceived and born and which maketh us liable to both temporal and eternal death ] and I said unto thee in thy blood [that is when thou wast in thy blood ] live [that is thou shalt live though thou art exceeding corrupt and miserable it is a command containing in it a promise of life of which kind of phrase see Psal 37 on vers 3 and Prov 3 on vers 25 as if the Lord should say though ye be very unclean and deformed and lie as it is were in the midst of death and I will cause you to live this is continually accomplished according to the covenant of grace which God made with Abraham ] yea I say unto thee in thy bloud live [this is here said to shew that God hath often times renewed his promises and that they remain firm and stedfast see of these promises Gen 12.1 ,2 ,3 and 13.15 ,16 and 15.1 c and 17.1,2 c and 22.17,c and 24.7 and 26.3 and 28.13 c.]"}],"7":[{"catchword":null,"tekst":"I have made thee ten thousand [that is a very great maltitude see Exod 1.7 nd 12.27 a certain number for an uncertain ]as the bird of the field and thou art grown and waxen great and thou art come to great ornament [Heb. ornament of ornaments that is to a very great or to the greatest vigour see of this phrase Lev. 2 on vers 3 understand this of a spiritual ornament and viguor the cause whereof see Deut 7.7,8 and consequently issued from the first mercy here mentioned contained in the promise of life above vers 6] thy breast are become firm and thine hair is grown but thou wast naked [Heb nakedness so below vers. 22 meaning the deprivation of original righteousness and the emptiness of the saving riches see of the spiritual nakedness also Revel 3.17. ] and bare ."}],"8":[{"catchword":null,"tekst":"For when I passed by thee I saw thee and behold thy time was the time of loves [that is the time that thou wast marriage the Lord here speaketh after the manner of man of the spiritual marriage which he out of meer grace and love made with the people of the Jews when he separated from other nations of the earth and entered with them into a covenant of grace in the Messiah ]then I spread out my wings over thee [that is I took the into my custody to make thee my spouse compare Ruth 3 on vers 9] and covered thy nakedness [or shame ] yea I swear unto thee [see Genes 22.16 and 24.7 ]and entered with thee into a covenant [to wit of spiritual marriage that I will be your God and ye should be my people see Genes 17.1 ,2 &c ] saith the Lord and thou became mine ."}],"9":[{"catchword":null,"tekst":"Then washed I thee with water [hereby many understand the benefit of the forgiveness of sins flowing from the covenant of grace which is often represented and expressed by washing Exod 24.8 Levit 15.13 psal 51.4 ,9 below chap 36.25 Acts 22 .16 1Cor 6.11 Revel 1.5 but understand also this and the following benefit to wit the regeneration and sanctification in respect of the children of promise and the elect among the people ] yea I rinsed thy blood off from thee [to wit the blood that was found upon thee in thy nativity ]and anointed thee with oil [ to wit to make the acceptable compare Esth 2.12 this signified the spiritual anointing with the oil of regeneration whereby to men is sanctified for a better life see of this oil and anointing 2Cor 1 .21 ,22 1 Job 2:20,27.]"}],"10":[{"catchword":null,"tekst":"I clothed thee also with bordered work [or broidered works so below vers 18 is I have abundantly furnished thee not only in body in all that was needful for thee but have likewise so enriched and filled thee with spiritual goods and mercies that thou excellest all other nations Gen 12.2,3 Numb 24.5,6,7,17,18,19 Deut 4.6,7,8 Psal 132.13,14,15 c and by my marriage art become a queen see Psal 45.11,12,13 ,14 c see also below on vers 13 ] and I shod thee with badgers skins [see of these Exod on vers 5 ]and girded thee about with fine linen [see Genes 41 on vers 42 ] and covered the with silk."}],"11":[{"catchword":null,"tekst":"I adorned thee also ornament and put bracelets upon thine hands [see of these bracelets Genes 24on vers 22] and a chain [see of this word also Genes 4.42]on thy neck [Heb. throat. ]"}],"12":[{"catchword":null,"tekst":"Likewise I put a front let [see Gen 24 on vers 22 ]upon thy face [or over thy nose or upon thy forehead see Gen 24 on vers 47 ] and ear rings [see the same word in the same signification Gen 35 .4]on thine ears and a crown of glory [or a crown of ornament that is glorious or a beautiful crown see Prov 4.9 and the annotate ]upon thine head .]"}],"13":[{"catchword":null,"tekst":"Thus wast thou adorned with gold and silver and thy clothing was fine linen and silk and embroidered work thou didst eat fine floure and hony and oil [understand the forts of sustenance here mentioned all that is necessary for sustenance here mentioned all that is necessary for sustentations of life and recreations of the body ]and thou wast prosperous so that thou becomest a kingdom [that is so that thou hadst thine own kings that governed thee or thou hadst prosperity in the kingdom to wit for the most part under the reign of King David and Solomon the royal dignity was promised to the Israelites Gen 17.6 and 49.10 by all these similitudes taken from corporal ornaments necessaries beauty and prosperity is shadowed out of the abundance of spiritual blessings whereby God had exalted the people of Israel above other nations such as were the giving of the law the revelation of heavenly doctrine the gift of prophecy the priesthood the pure worship of God the miracles the hope of the life to come &c.]"}],"14":[{"catchword":null,"tekst":"Moreover a name of thee went forth among the heathen because of thy beauty [see the promise hereof Gen 12.2 Deut 4.6,7,8 the accomplishment Numb 23.8,21 c Jos 2.9.1Sam 3.7 1Kings 10c.24 c 2Chrons 32.23 ]for the same was perfect through my glory which I had put upon thee [see above on vers 10and 13 ]saith the Lord LORD."}],"15":[{"catchword":null,"tekst":"But thou didst trust in thy beauty [as if though shouldst keep it forever though thou shouldst deal never so ill with me ] and playedst the harlot [ that is didst commit idolatry partly in thy idol worship and partly in your covenants with idolatrous nations see of the spiritual whoredom committed by idolatry Levit 17on vers 7 and 20 on vers 5 and of lawful confederacies forbidden by God Exod 23.32 and 34.12 Deut 7.2 and made by the Jews 2Chrons 19.2 and 20.25 c] because of thy name [that is because thou hast the name of being very beautiful and in that respect thou hast a desire to prostitute thy self for the satisfying of thy whorish condition ] yea hast poured out thy fornications on everyone that passed by for him it was [it to wit thy beauty compare Isa57.5 Jerem 2.20,23 ,36 and 3.6. ]"}],"16":[{"catchword":null,"tekst":"And of thy garments thou didst take and madest to thy self speckled high places [meaning altars set up in high places unto idols and hung with faire or broad speckled garments that being spied afar off they might allure the passengers of idolatry these are here compare to the beds of harlots that are beautiful and costly trimmed to entice lovers thither Prov 7.16 for which cause also these idolatrous places are called the beds of idolaters Isa 57.7 ] and playedst the harlot thereupon such a thing hath not come neither shall it come to pass [the meaning is that the Jews committed such a gross offence by their idolatry that they never had the like nor ever should have .]"}],"17":[{"catchword":null,"tekst":"Moreover thou hast taken the vessel of thine ornament [the Hebrew word is generally taken for all the manner of vessels furniture or household staff made of gold silver &c compare Levit 15 on vers 4 ] made of my gold and of silver which I had given thee [that is which I have given thee for the necessary use and moderate ornament compare Hos 2.8 and madest [to wit of that gold and silver ]to thy self images of a man are named and not the images of a woman either because here Jerusalem is brought under the person of all harlot that keepeth company with every man portrayed most unchastely and formidably ]and thou didst commit whoredom with them [to wit by offering sacrifices unto them calling upon them and giving all religious honor and worship unto them ]"}],"18":[{"catchword":null,"tekst":"And thou lookest thy embroidered garments and coveredst them [to wit thy images and that for to adorn them also with costly ornaments which is likewise idolatry ]and thou hast set mine oil [which I gave thee for other uses and amongst the rest for my service see Genes 28 on vers 18 Exod 27 .20 ,21 and 30.7 Levit 2.1,2 and 8on vers 2 and Judge9 on vers 9 and mine incense [of incense made of sundry spices for the service of God see Exod 30.4 ,35 ]before their face ."}],"19":[{"catchword":null,"tekst":"And my bread which I gave thee fine flour oils honey wherewith I fed thee the same hast thou set also before their faces [to wit the faces of the images ]for a pleasant savor [compare Gen 8 on vers 21 ]thus it was said the Lord LORD."}],"20":[{"catchword":null,"tekst":"Moreover thou hast taken thy sons and thy daughters whom thou hast born unto me [to wit which belong to me by virtue of the covenant which I made with thee and thy seed for though the people of the Jews have forsaken God and deserved to be forsaken of God yet in regard this was not yet done they begat children whom he by reason of circumcision also yet vouchsafed to own for his not desiring to punish the children for the offence of the parents so below chap 23.37 ]and hast offered them unto them [to wit unto the idols and images ] to be consumed [that is that they might devour them by the fire] is it a small thing of thy whoredoms [to wit in thine eyes or in thy judgment that thou dost commit such abominations as are mentioned in the former and following words proceeding from thy whoredom ?]"}],"21":[{"catchword":null,"tekst":"That thou hast slain [the Hebrew word signifieth properly to throat or to cut the throat Levit 1 on vers 5 but here its taken simple for killing or slaying by causing to pass through the fire see Levit 18 on vers 21 2Kings 23 on vers 10 2Chrons 28.on vers 3 and below chap 23.37 ]my children and hast delivered them when thou didst cause them to pass through the fire for them ?[that is to the honor of the idols .]"}],"22":[{"catchword":null,"tekst":"Also in all thine abominations and in thine whoredoms thou hast not remembered the days of thy youth [see above on vers 4] when thou wast naked [see above on vers 7 and bare when thou wast trample on in thy blood [see above on vers 6. ]"}],"23":[{"catchword":null,"tekst":"It came also to pass after all thy wickedness wow o unto the saith the Lord LORD."}],"24":[{"catchword":null,"tekst":"That thou hast built unto thee a gallery [that is an elevated place to commit thine idolatry upon it compare Levit 26 on vers 30 also Isa 57.7 c Jerem 3.6 ] and hast made thee an high place in every street ."}],"25":[{"catchword":null,"tekst":"Thou hast build thine high at every head of the way [or in every head way or in the front of every way that is in all the cross- ways and top of the streets so below chap 21.21 compare Prov 8 on vers 2 and the annotate were the cross way is called an house of paths ] and hast made thy beauty abominable and hast straddled with thy legs [Heb fell before everyone that passed by [that is thou hast given thyself up to all manner of the vilest and most shameless idolatry that is of what nations forever thou mightest have borrowed it the Hebrew is used both of the mouth and of the legs of the mouth for opening it wide to speak immodestly and impudently Prov 13.3 of the legs for open them wide to uncleanness as here ]and thou hast multiplied thou whoredoms."}],"26":[{"catchword":null,"t // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
