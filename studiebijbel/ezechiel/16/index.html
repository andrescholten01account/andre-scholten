 data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> cause <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> her abominations,","3":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> Thy <span class=\"wl wl-kjv\" data-code=\"H4351\">birth</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4138\">nativity</span> is of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaan;</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> was an <span class=\"wl wl-kjv\" data-code=\"H567\">Amorite,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> an Hittite.","4":"And as for thy <span class=\"wl wl-kjv\" data-code=\"H4138\">nativity,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou wast <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> thy <span class=\"wl wl-kjv\" data-code=\"H8270\">navel</span> was not <span class=\"wl wl-kjv\" data-code=\"H3772\">cut,</span> neither wast thou <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> in <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> to <span class=\"wl wl-kjv\" data-code=\"H4935\">supple</span> thee; thou wast not <span class=\"wl wl-kjv\" data-code=\"H4414\">salted</span> at <span class=\"wl wl-kjv\" data-code=\"H4414\">all,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2853\">swaddled</span> at all.","5":"None <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> <span class=\"wl wl-kjv\" data-code=\"H2347\">pitied</span> thee, to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H259\">any</span> of these unto thee, to have <span class=\"wl wl-kjv\" data-code=\"H2550\">compassion</span> upon thee; but thou wast cast <span class=\"wl wl-kjv\" data-code=\"H7993\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">open</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> to the <span class=\"wl wl-kjv\" data-code=\"H1604\">lothing</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5315\">person,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou wast born.","6":"And when I <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> by thee, and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> thee <span class=\"wl wl-kjv\" data-code=\"H947\">polluted</span> in thine own <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee when thou wast in thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">Live;</span> yea, I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee when thou wast in thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> Live.","7":"I have <span class=\"wl wl-kjv\" data-code=\"H5414\">caused</span> thee to <span class=\"wl wl-kjv\" data-code=\"H7233\">multiply</span> as the <span class=\"wl wl-kjv\" data-code=\"H6780\">bud</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> and waxen <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> and thou art <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H5716\">excellent</span> <span class=\"wl wl-kjv\" data-code=\"H5716\">ornaments:</span> thy <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts</span> are <span class=\"wl wl-kjv\" data-code=\"H3559\">fashioned,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> is <span class=\"wl wl-kjv\" data-code=\"H6779\">grown,</span> whereas thou wast <span class=\"wl wl-kjv\" data-code=\"H5903\">naked</span> and bare.","8":"Now when I <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> by thee, and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> upon thee, behold, thy <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> was the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H1730\">love;</span> and I <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> my <span class=\"wl wl-kjv\" data-code=\"H3671\">skirt</span> over thee, and <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> thy <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> yea, I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto thee, and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD,","9":"Then <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> I thee with <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> yea, I throughly washed <span class=\"wl wl-kjv\" data-code=\"H7857\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> from thee, and I <span class=\"wl wl-kjv\" data-code=\"H5480\">anointed</span> thee with oil.","10":"I <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> thee also with broidered <span class=\"wl wl-kjv\" data-code=\"H7553\">work,</span> and <span class=\"wl wl-kjv\" data-code=\"H5274\">shod</span> thee with badgers' <span class=\"wl wl-kjv\" data-code=\"H8476\">skin,</span> and I <span class=\"wl wl-kjv\" data-code=\"H2280\">girded</span> thee about with fine <span class=\"wl wl-kjv\" data-code=\"H8336\">linen,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> thee with silk.","11":"I <span class=\"wl wl-kjv\" data-code=\"H5710\">decked</span> thee also with <span class=\"wl wl-kjv\" data-code=\"H5716\">ornaments,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7242\">chain</span> on thy neck.","12":"And I <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H5141\">jewel</span> on thy <span class=\"wl wl-kjv\" data-code=\"H639\">forehead,</span> and <span class=\"wl wl-kjv\" data-code=\"H5694\">earrings</span> in thine <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8597\">beautiful</span> <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> upon thine head.","13":"Thus wast thou <span class=\"wl wl-kjv\" data-code=\"H5710\">decked</span> with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4403\">raiment</span> was of fine <span class=\"wl wl-kjv\" data-code=\"H8336\">linen,</span> and <span class=\"wl wl-kjv\" data-code=\"H4897\">silk,</span> and broidered <span class=\"wl wl-kjv\" data-code=\"H7553\">work;</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour,</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> and <span class=\"wl wl-kjv\" data-code=\"H8081\">oil:</span> and thou wast <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H3302\">beautiful,</span> and thou didst <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> into a kingdom.","14":"And thy <span class=\"wl wl-kjv\" data-code=\"H8034\">renown</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> for thy <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty:</span> for it was <span class=\"wl wl-kjv\" data-code=\"H3632\">perfect</span> through my <span class=\"wl wl-kjv\" data-code=\"H1926\">comeliness,</span> which I had <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> upon thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","15":"But thou didst <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in thine own <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty,</span> and playedst the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> because of thy <span class=\"wl wl-kjv\" data-code=\"H8034\">renown,</span> and pouredst <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> thy <span class=\"wl wl-kjv\" data-code=\"H8457\">fornications</span> on every one that passed by;","16":"And of thy <span class=\"wl wl-kjv\" data-code=\"H899\">garments</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H3947\">take,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">deckedst</span> thy high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> with divers <span class=\"wl wl-kjv\" data-code=\"H2921\">colours,</span> and playedst the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> thereupon: the like things shall not come,","17":"Thou hast also <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> thy <span class=\"wl wl-kjv\" data-code=\"H8597\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of my <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and of my <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> which I had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H6213\">madest</span> to thyself <span class=\"wl wl-kjv\" data-code=\"H6754\">images</span> of <span class=\"wl wl-kjv\" data-code=\"H2145\">men,</span> and didst commit whoredom","18":"And <span class=\"wl wl-kjv\" data-code=\"H3947\">tookest</span> thy <span class=\"wl wl-kjv\" data-code=\"H7553\">broidered</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H3680\">coveredst</span> them: and thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> mine <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> and mine <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> before","19":"My <span class=\"wl wl-kjv\" data-code=\"H3899\">meat</span> also which I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> thee, fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour,</span> and <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> wherewith I <span class=\"wl wl-kjv\" data-code=\"H398\">fed</span> thee, thou hast even <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them for a <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour:</span> and thus it was, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","20":"Moreover thou hast <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> whom thou hast <span class=\"wl wl-kjv\" data-code=\"H3205\">borne</span> unto me, and these hast thou <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> unto them to be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured.</span> Is this of thy <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> a small matter,","21":"That thou hast <span class=\"wl wl-kjv\" data-code=\"H7819\">slain</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them to cause them to pass through","22":"And in all thine <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> thou hast not <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> when thou wast <span class=\"wl wl-kjv\" data-code=\"H5903\">naked</span> and <span class=\"wl wl-kjv\" data-code=\"H6181\">bare,</span> and wast <span class=\"wl wl-kjv\" data-code=\"H947\">polluted</span> in thy blood.","23":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> all thy <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness,</span> <span class=\"wl wl-kjv\" data-code=\"H188\">(woe,</span> <span class=\"wl wl-kjv\" data-code=\"H188\">woe</span> unto thee! <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD;)","24":"That thou hast also <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> unto thee an eminent <span class=\"wl wl-kjv\" data-code=\"H1354\">place,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thee an high <span class=\"wl wl-kjv\" data-code=\"H7413\">place</span> in every street.","25":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> thy high <span class=\"wl wl-kjv\" data-code=\"H7413\">place</span> at every <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and hast made thy <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty</span> to be <span class=\"wl wl-kjv\" data-code=\"H8581\">abhorred,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6589\">opened</span> thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> to every one that passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> thy whoredoms.","26":"Thou hast also committed <span class=\"wl wl-kjv\" data-code=\"H2181\">fornication</span> with the <span class=\"wl wl-kjv\" data-code=\"H1121\">Egyptians</span> thy <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbours,</span> <span class=\"wl wl-kjv\" data-code=\"H1432\">great</span> of <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> and hast <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> thy <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms,</span> to provoke me to anger.","27":"Behold, therefore I have stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over thee, and have <span class=\"wl wl-kjv\" data-code=\"H1639\">diminished</span> thine <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinary</span> food, and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> thee unto the <span class=\"wl wl-kjv\" data-code=\"H5315\">will</span> of them that <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> thee, the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> which are <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewd</span> way.","28":"Thou hast played the <span class=\"wl wl-kjv\" data-code=\"H2181\">whore</span> also with the <span class=\"wl wl-kjv\" data-code=\"H1121\">Assyrians,</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">because</span> thou wast <span class=\"wl wl-kjv\" data-code=\"H7646\">unsatiable;</span> yea, thou hast played the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> with them, and yet couldest not be satisfied.","29":"Thou hast moreover <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> thy <span class=\"wl wl-kjv\" data-code=\"H8457\">fornication</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan</span> unto <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldea;</span> and yet thou wast not <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> herewith.","30":"How <span class=\"wl wl-kjv\" data-code=\"H535\">weak</span> is thine <span class=\"wl wl-kjv\" data-code=\"H3826\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> seeing thou <span class=\"wl wl-kjv\" data-code=\"H6213\">doest</span> all these things, the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of an <span class=\"wl wl-kjv\" data-code=\"H7986\">imperious</span> <span class=\"wl wl-kjv\" data-code=\"H2181\">whorish</span> woman;","31":"In that thou <span class=\"wl wl-kjv\" data-code=\"H1129\">buildest</span> thine eminent <span class=\"wl wl-kjv\" data-code=\"H1354\">place</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of every <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">makest</span> thine high <span class=\"wl wl-kjv\" data-code=\"H7413\">place</span> in every <span class=\"wl wl-kjv\" data-code=\"H7339\">street;</span> and hast not been as an <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot,</span> in that thou <span class=\"wl wl-kjv\" data-code=\"H7046\">scornest</span> hire;","32":"But as a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> that committeth <span class=\"wl wl-kjv\" data-code=\"H5003\">adultery,</span> which <span class=\"wl wl-kjv\" data-code=\"H3947\">taketh</span> <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> instead of her husband!","33":"They <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5078\">gifts</span> to all <span class=\"wl wl-kjv\" data-code=\"H2181\">whores:</span> but thou <span class=\"wl wl-kjv\" data-code=\"H5414\">givest</span> thy <span class=\"wl wl-kjv\" data-code=\"H5083\">gifts</span> to all thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> and <span class=\"wl wl-kjv\" data-code=\"H7809\">hirest</span> them, that they may <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side</span> for thy whoredom.","34":"And the <span class=\"wl wl-kjv\" data-code=\"H2016\">contrary</span> is in thee from other <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> in thy <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms,</span> whereas none <span class=\"wl wl-kjv\" data-code=\"H310\">followeth</span> thee to commit <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredoms:</span> and in that thou <span class=\"wl wl-kjv\" data-code=\"H5414\">givest</span> a <span class=\"wl wl-kjv\" data-code=\"H868\">reward,</span> and no <span class=\"wl wl-kjv\" data-code=\"H868\">reward</span> is <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto thee, therefore thou <span class=\"wl wl-kjv\" data-code=\"H1961\">art</span> contrary.","35":"Wherefore, O <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the LORD:","36":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because thy <span class=\"wl wl-kjv\" data-code=\"H5178\">filthiness</span> was poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> through thy <span class=\"wl wl-kjv\" data-code=\"H8457\">whoredoms</span> with thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> and with all the <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> of thy <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> which thou didst give","37":"Behold, therefore I will <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> all thy <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> with whom thou hast taken <span class=\"wl wl-kjv\" data-code=\"H6149\">pleasure,</span> and all them that thou hast <span class=\"wl wl-kjv\" data-code=\"H157\">loved,</span> with all them that thou hast <span class=\"wl wl-kjv\" data-code=\"H8130\">hated;</span> I will even <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> them round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> against thee, and will <span class=\"wl wl-kjv\" data-code=\"H1540\">discover</span> thy <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> unto them, that they may <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> all thy nakedness.","38":"And I will <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thee, as women that break <span class=\"wl wl-kjv\" data-code=\"H5003\">wedlock</span> and <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> are <span class=\"wl wl-kjv\" data-code=\"H4941\">judged;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> in <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> and jealousy.","39":"And I will also <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee into their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and they shall throw <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> thine eminent <span class=\"wl wl-kjv\" data-code=\"H1354\">place,</span> and shall break <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> thy high <span class=\"wl wl-kjv\" data-code=\"H7413\">places:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H6584\">strip</span> thee also of thy <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thy <span class=\"wl wl-kjv\" data-code=\"H8597\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">leave</span> thee <span class=\"wl wl-kjv\" data-code=\"H5903\">naked</span> and bare.","40":"They shall also bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> against thee, and they shall <span class=\"wl wl-kjv\" data-code=\"H7275\">stone</span> thee with <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and thrust thee <span class=\"wl wl-kjv\" data-code=\"H1333\">through</span> with their swords.","41":"And they shall <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> thine <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgments</span> upon thee in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women:</span> and I will cause thee to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease</span> from playing the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot,</span> and thou also shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> no hire","42":"So will I make my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> toward thee to <span class=\"wl wl-kjv\" data-code=\"H5117\">rest,</span> and my <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> shall <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from thee, and I will be <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet,</span> and will be no more angry.","43":"Because thou hast not <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> but hast <span class=\"wl wl-kjv\" data-code=\"H7264\">fretted</span> me in all these things; <span class=\"wl wl-kjv\" data-code=\"H1887\">behold,</span> therefore I also will <span class=\"wl wl-kjv\" data-code=\"H5414\">recompense</span> thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD:</span> and thou shalt not <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> this <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> above all thine abominations.","44":"Behold, every one that useth <span class=\"wl wl-kjv\" data-code=\"H4911\">proverbs</span> shall use this <span class=\"wl wl-kjv\" data-code=\"H4911\">proverb</span> against thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> As is the <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> so is her daughter.","45":"Thou art thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> that <span class=\"wl wl-kjv\" data-code=\"H1602\">lotheth</span> her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> and her <span class=\"wl wl-kjv\" data-code=\"H1121\">children;</span> and thou art the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sisters,</span> which <span class=\"wl wl-kjv\" data-code=\"H1602\">lothed</span> their <span class=\"wl wl-kjv\" data-code=\"H582\">husbands</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> your <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> was an <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite,</span> and your <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> an Amorite.","46":"And thine <span class=\"wl wl-kjv\" data-code=\"H1419\">elder</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> is <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> she and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> at thy left <span class=\"wl wl-kjv\" data-code=\"H8040\">hand:</span> and thy <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> at thy right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> is <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and her daughters.","47":"Yet hast thou not <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> after their <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> after their <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations:</span> but, as if that were a <span class=\"wl wl-kjv\" data-code=\"H6985\">very</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> thing, thou wast <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupted</span> more than <span class=\"wl wl-kjv\" data-code=\"H2004\">they</span> in all thy ways.","48":"As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> hath not <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> she nor her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> as thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> thou and thy daughters.","49":"Behold, this was the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> <span class=\"wl wl-kjv\" data-code=\"H1347\">pride,</span> <span class=\"wl wl-kjv\" data-code=\"H7653\">fulness</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H7962\">abundance</span> of <span class=\"wl wl-kjv\" data-code=\"H8252\">idleness</span> was in her and in her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> neither did she <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and needy.","50":"And they were <span class=\"wl wl-kjv\" data-code=\"H1361\">haughty,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me: therefore I took them <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> as I saw","51":"Neither hath <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2403\">sins;</span> but thou hast <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> thine <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> more than <span class=\"wl wl-kjv\" data-code=\"H2007\">they,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6663\">justified</span> thy <span class=\"wl wl-kjv\" data-code=\"H269\">sisters</span> in all thine <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> which thou hast done.","52":"Thou also, which hast <span class=\"wl wl-kjv\" data-code=\"H6419\">judged</span> thy <span class=\"wl wl-kjv\" data-code=\"H269\">sisters,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> thine own <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> for thy <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> that thou hast committed more <span class=\"wl wl-kjv\" data-code=\"H8581\">abominable</span> than <span class=\"wl wl-kjv\" data-code=\"H2004\">they:</span> they are more <span class=\"wl wl-kjv\" data-code=\"H6663\">righteous</span> than thou: yea, be thou <span class=\"wl wl-kjv\" data-code=\"H954\">confounded</span> also, and <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> thy <span class=\"wl wl-kjv\" data-code=\"H3639\">shame,</span> in that thou hast <span class=\"wl wl-kjv\" data-code=\"H6663\">justified</span> thy sisters.","53":"When I shall bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> their <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity,</span> the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> then will I bring again the <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7622\">captives</span> in the midst","54":"That thou mayest <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> thine own <span class=\"wl wl-kjv\" data-code=\"H3639\">shame,</span> and mayest be <span class=\"wl wl-kjv\" data-code=\"H3637\">confounded</span> in all that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> in that thou art a comfort","55":"When thy <span class=\"wl wl-kjv\" data-code=\"H269\">sisters,</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to their former <span class=\"wl wl-kjv\" data-code=\"H6927\">estate,</span> and <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to their former <span class=\"wl wl-kjv\" data-code=\"H6927\">estate,</span> then thou and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to your former estate.","56":"For thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> was not <span class=\"wl wl-kjv\" data-code=\"H8052\">mentioned</span> by thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thy pride,","57":"Before thy <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> was <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered,</span> as at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> and all that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> her, the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> which <span class=\"wl wl-kjv\" data-code=\"H7590\">despise</span> thee round about.","58":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> thy <span class=\"wl wl-kjv\" data-code=\"H2154\">lewdness</span> and thine <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","59":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will even <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with thee as thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> which hast <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> the <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> in <span class=\"wl wl-kjv\" data-code=\"H6565\">breaking</span> the covenant.","60":"Nevertheless I will <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with thee in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> unto thee an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> covenant.","61":"Then thou shalt <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> thy <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and be <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed,</span> when thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> thy <span class=\"wl wl-kjv\" data-code=\"H269\">sisters,</span> thine <span class=\"wl wl-kjv\" data-code=\"H1419\">elder</span> and thy <span class=\"wl wl-kjv\" data-code=\"H6996\">younger:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them unto thee for <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> but not by thy covenant.","62":"And I will <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with thee; and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD:","63":"That thou mayest <span class=\"wl wl-kjv\" data-code=\"H2142\">remember,</span> and be <span class=\"wl wl-kjv\" data-code=\"H954\">confounded,</span> and never <span class=\"wl wl-kjv\" data-code=\"H6610\">open</span> thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> any more <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3639\">shame,</span> when I am <span class=\"wl wl-kjv\" data-code=\"H3722\">pacified</span> toward thee for all that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Jeruzalem","tekst":"Dat is, de inwoners van Jeruzalem, die hier vervolgens om deze oorzaak in het eenvoudig getal en in het vrouwelijk geslacht toegesproken worden."},{"catchword":"gruwelen bekend,","tekst":"Dat is, gruwelijke werken, voornamelijk door afgoderij bedreven."}],"3":[{"catchword":"handelingen","tekst":"Velen verstaan hierdoor al het bedrijf van het gehele Israëlietische volk, in het stukk van den godsdienst; waaronder ook te begrijpen zijn de werken rakende den wandel des levens. Anderen vertalen dit woord afkomsten, of geslachten, oorsprongen, woningen, of verkeringen."},{"catchword":"geboorten","tekst":"Dat is, de beginselen en de oorsprongen van uw voorgemelde handelingen zijn niet uit Abraham en Sara, van wie gij u beroemt afkomstig te wezen, maar uit de afgodische en goddeloze heidenen, welker doen gij nagevolgd hebt, ontaardende van het geloof en de werken van uwen vader Abraham; vergelijk Joh 8:39 ; Rom 2:28 ; en Rom 9:7-8 . Sommigen menen dat het Hebreeuwse woord hier in het getal van velen gesteld wordt, om aan te wijzen dat de Israëlieten altijd verscheidene afgodische godsdiensten nagevolgd hebben, met een niet tevreden zijnde."},{"catchword":"een Amoriet en uw moeder","tekst":"Zie van de afkomst van dit volk, Gen 10:16 , en van derzelver boosheid, Gen 15:16 ."},{"catchword":"Hethietische","tekst":"Van der Hethieten afkomst, zie Gen 10:15 , en van hunne boosheid, Gen 27:46 ."}],"4":[{"catchword":"ten dage,","tekst":"Dat is, ten tijde als Ik Abram, die een afgodendienaar was, Jos 24:2 , toen gij in zijne lenden waart, riep uit Ur in Chaldea om in het land Kanaän te komen, bracht zijn zaad in Egypte, en leidde het door de woestijn in het beloofde land. Vergelijk Hos 2:2 ."},{"catchword":"werd uw navel","tekst":"De ellende van het volk Israëls wordt hier beschreven door ene gelijkenis, genomen van een nieuwgeboren kind, dat uit zijner moeder lichaam voortgekomen zijnde van niemand gadegeslagen wordt."},{"catchword":"niet afgesneden;","tekst":"Dit betekent dat geen bloot schepsel dit volk van zijn aangeboren ellende, zonde en dood verloste of verlossen kon, om het tot de eeuwige zaligheid te brengen."},{"catchword":"toen Ik u aanschouwde;","tekst":"Hebreeuws, met mijn aanschouwen; dat is, zo haast als Ik u aanschouwde. Alzo vertalen ook enigen de woorden bij, of met mijnen voet; Gen 30:30 . Dat is, zo haast als Ik inkwam. Anders: tot mijn aanschouwen; dat is, tot een welgevallen van mijn aanschouwen, zulks dat gij mijn gezicht zoudt aangenaam geweest zijn. Anders: tot verzachting; te weten waardoor de huid van het nieuwgeboren kind zacht, zuiver, net als glad wordt gemaakt, als dezelve na de afwassing met enige stoffen daartoe gebruikelijk, bestreken is geweest."},{"catchword":"geenszins met zout gewreven,","tekst":"Hebreeuws, gezouten wordende, gezouten worden. Het zout werd in voortijden ook gebruikt tot verstijving van de huid en versterking der inwendige delen. Dit alles geeft te verstaan dat God in de Israëlieten, als Hij hen voor zijn volk aannam, niets anders gevonden heeft dan ellende, vuilnis en zwakheid, en vervolgens hen verkoren heeft niet uit aanzien van hunne waarde, maar door zijne genade in den beloofden Middelaar."}],"5":[{"catchword":"Geen oog had medelijden over u,","tekst":"Te weten niet alleen omdat zij niet wilden, maar ook niet konden. Hebreeuws, geen oog spaarde, of verschoonde over u."},{"catchword":"van deze dingen te doen,","tekst":"Te weten, die aan een zodanig nieuwgeboren kind noodzakelijk tot zijn behoud gedaan moet worden."},{"catchword":"zijt geworpen geweest","tekst":"Dat is, als van allen verlaten en van niemand te helpen dan van God."},{"catchword":"van uw ziel,","tekst":"Want arglistig is het hart meer dan enig ding, ja dodelijk is het; Jer 17:9 . Het bedenken van het vlees is vijandschap tegen God, Rom 8:7 , en hij geheel als een made en worm, Job 25:6 , ja lichter dan de ijdelheid, Psa 62:10 ."}],"6":[{"catchword":"in uw bloed,","tekst":"Te weten dat aan uw lijf was toen gij eerst ter wereld kwaamt. Dit bloed betekent ons de verdorvenheid der natuur, in welke wij allen ontvangen en geboren zijn, en die ons den tijdelijken en eeuwigen dood onderworpen maakt."},{"catchword":"in uw bloed","tekst":"Dat is, daar gij in uw bloed waart."},{"catchword":"Leef;","tekst":"Dat is, gij zult leven, niettegenstaande gij zeer verdorven en ellendig zijt. Het is een bevel, inhoudende ene belofte des levens; van welke manier van spreken zie Psa 37:3 , en Pro 3:25 . De Heere wil zeggen: Hoewel gij zeer onrein en mismaakt zijt, en ligt als in het midden des doods, nochtans zal Ik maken dat gij zult leven. Dit is doorgaans vervuld, volgens het verbond der genade, hetwelk God met Abraham heeft opgericht."},{"catchword":"ja,","tekst":"Dit wordt tweemaal gezegd om te tonen dat God zijne beloften menigmaal heeft vernieuwd en dat zij vast gaan. Zie van deze beloften, Gen 12:1-3 , en Gen 13:15-16 , en Gen 15:1 , enz., en Gen 17:1-2 , enz., en Gen 22:17 , enz., en Gen 24:7 , en Gen 26:3 , en Gen 28:13 , enz."}],"7":[{"catchword":"tien duizend,","tekst":"Dat is, tot een zeer grote menigte. Zie Exo 1:7 , en Exo 12:37 . Een zeker getal voor een onzeker."},{"catchword":"grote sierlijkheid;","tekst":"Hebreeuws, tot een sierlijkheid de sierlijkheden; dat is, tot zeer grote of de allermeeste frisheid. Zie van deze manier van spreken, Lev 2:3 . Versta dit van een geestelijke sierlijkheid en frisheid, welker oorzaak zie Deu 7:7-8 , en is vervolgens voortgekomen uit de eerste weldaad hier vermeld, begrepen in de belofte des levens, boven vs.6."},{"catchword":"naakt en bloot","tekst":"Hebreeuws, naaktheid. Versta, de beroving der oorspronkelijke gerechtigheid en de ledigheid van al het zaligmakend goed. Zie van de geestelijke naaktheid ook Rev 3:17 ."}],"8":[{"catchword":"der minne;","tekst":"Dat is dat gij huwbaar waart, of bekwaam om ten huwelijk begeerd te worden. De Heere spreekt hier menselijkerwijze van het geestelijke huwelijk, hetwelk Hij uit enkel genade en liefde aangegaan heeft met het Joodse volk, als Hij dat van alle andere volken der aarde heeft afgezonderd en daarmede een verbond der genade in den Messias opgericht."},{"catchword":"breidde Ik Mijn vleugel over u uit,","tekst":"Dat is, Ik nam u in mijne bewaring om u tot mijne bruid te nemen; vergelijk Rth 3:9 ."},{"catchword":"naaktheid;","tekst":"Of, schaamte."},{"catchword":"een verbond,","tekst":"Te weten het geestelijke huwelijk, dat Ik uw God en gij mijn volk zoudt wezen; zie Gen 17:1-2 , enz."}],"9":[{"catchword":"wies Ik u met water,","tekst":"Hierdoor verstaan velen de weldaad van de vergeving der zonden, vloeiende uit het genadeverbond, en die dikwijls door afwassing afgebeeld en uitgedrukt wordt; Exo 24:8 ; Lev 15:13 ; Psa 51:4 , Psa 51:9 ; onder Eze 36:25 ; Act 22:16 ; 1Co 6:11 ; Rev 1:5 . Doch versta ook dit en het volgende van de wedergeboorte en heiligmaking, ten aanzien van de kinderen der belofte en de uitverkorenen, die onder het volk waren."},{"catchword":"uw bloed van u af,","tekst":"Te weten dat in uwe geboorte aan u gevonden werd."},{"catchword":"zalfde u met olie","tekst":"Te weten om u behagelijk te maken. Vergelijk Est 2:12 . Dit betekende de geestelijke zalving met olie der wedergeboorte, waardoor de mens tot een beter leven geheiligd wordt. Zie van deze olie en zalving, 2Co 1:21-22 ; 1Jo 2:20 , 1Jo 2:27 ."}],"10":[{"catchword":"Ik bekleedde u ook","tekst":"Dat is, Ik heb u overvloediglijk voorzien, niet alleen naar het lichaam van al hetgeen u nodig was, maar met geestelijke goederen en weldaden zo verrijkt en vervuld, dat gij onder andere volken uitsteekt, Gen 12:2-3 ; Num 24:5-7 , Num 24:17-19 ; Deu 4:6-8 ; Psa 132:13-15 , enz. en door mijn huwelijk ene koningin geworden zijt; zie Psa 45:10-14 , enz. Zie ook onder vs.13."},{"catchword":"gestikt werk,","tekst":"Of, borduurwerk; alzo onder vs.18."},{"catchword":"dassenvellen,","tekst":"Zie van deze Exo 25:5 ."},{"catchword":"fijn linnen,","tekst":"Zie Gen 41:42 ."}],"11":[{"catchword":"armringen aan uw handen,","tekst":"Zie Gen 24:22 ."},{"catchword":"keten","tekst":"Zie van dit woord ook Gen 41:42 ."},{"catchword":"hals","tekst":"Hebreeuws, keel, of gorgel."}],"12":[{"catchword":"voorhoofdsiersel","tekst":"Zie Gen 24:22 ."},{"catchword":"aan uw aangezicht,","tekst":"Of, over uwen neus, of aan uw voorhoofd. Zie Gen 24:47 ."},{"catchword":"oorringen aan uw oren,","tekst":"Zie hetzelfde woord in dezelfde betekenig Gen 35:4 ."},{"catchword":"een kroon der heerlijkheid op uw hoofd","tekst":"Of, ene kroon des sieraads; dat is een heerlijke of sierlijke kroon. Zie Pro 4:9 , en de aantekening."}],"13":[{"catchword":"Zo waart gij versierd","tekst":"Door al deze gelijkenissen, genomen van lichamelijken sieraad, nooddruft, schoonheid en voorspoed, wordt afgebeeld de overvloed der geestelijke gaven, waarmede God het Israëlietische volk boven andere natiën verheven had, als daar waren de geving der wet, de openbaring van de hemelse leer, de gave der profetie, het priesterdom, de zuivere godsdienst, de wonderen, de hoop van het toekomende leven, enz."},{"catchword":"gestikt werk;","tekst":"Of, borduurwerk."},{"catchword":"meelbloem,","tekst":"Versta onder de soorten van leeftocht hier verhaald, al wat nodig is tot onderhouding des levens en aangenaam tot deszelfs vermaking."},{"catchword":"gans","tekst":"Hebreeuws, in zeer zeer."},{"catchword":"zeer schoon,","tekst":"Dat is, zeer aangenaam en van alle volken met verwondering aangezien."},{"catchword":"dat gij een koninkrijk werdt","tekst":"Dat is, dat gij uw eigen koningen gehad hebt, die u regeerden. Of, gij hadt voorspoed in het koninkrijk; te weten meest onder de regering van de koningen David en Salomo. De koninklijke hoogheid was den Israëlieten beloofd, Gen 17:6 en Gen 49:10 ."}],"14":[{"catchword":"ging van u een naam uit","tekst":"Zie de belofte hiervan, Gen 12:2 ; Deu 4:6-8 . De vervulling Num 23:8 , Num 23:21 , enz.; Jos 2:9 ; 2Sa 7:9 ; 1Ki 10:1 , 1Ki 10:24 enz.; 2Ch 32:33 ."},{"catchword":"heerlijkheid,","tekst":"Zie boven vs.10, 13."}],"15":[{"catchword":"vertrouwd op uw schoonheid,","tekst":"Even alsof gij die altijd behouden zoudt, hoe gij het ook met mij maaktet."},{"catchword":"gehoereerd","tekst":"Dat is, afgoderij bedreven, eensdeels in uw afgodendienst, anderdeels in uw snode verbintenissen met de volken. Zie van de geestelijke hoererij door afgodendienst, Lev 17:7 , en Lev 20:5 , en van de ongeoorloofde verbintenissen door God verboden, Exo 23:32 , en Exo 34:12 ; Deu 7:2-3 , en van de Joden gemaakt, 2Ch 19:2 , en 2Ch 20:35 , enz."},{"catchword":"vanwege uw naam;","tekst":"Dat is, omdat gij den naam hebt van zeer schoon te zijn, en uit zulke oorzaak den wil u gemeen te maken tot verzadiging van uwen hoerachtigen aard."},{"catchword":"zij","tekst":"Te weten uwe schoonheid. Vergelijk Isa 57:5 ; Jer 2:20 , Jer 2:23 , Jer 2:36 en Jer 3:6 ."}],"16":[{"catchword":"hoogten,","tekst":"Versta, altaren in hoge plaatsen den afgoden opgericht, en met bonte of breed geplekte klederen behangen, opdat zij, van verre gezien zijnde, de voorbijgangers tot afgoderij zouden aantrekken. Deze worden hier vergeleken bij de bedden der hoeren, welke schoon en kostelijk opgepronkt worden, om de minnaars aan te lokken, Pro 7:16 ; waarom ook deze afgodische plaatsen der afgodendienaren bedden genaamd worden, Isa 57:7 ."},{"catchword":"zulks is niet gekomen,","tekst":"De zin is dat het de Joden zo grof maakten met hunne afgoderij, dat zij huns gelijken niet hadden noch hebben zouden."}],"17":[{"catchword":"de vaten uws sieraads","tekst":"Het Hebreeuwse woord wordt in het algemeen genomen voor allerlei vatentuig, gereedschap, of huisraad, dat van goud, zilver, enz. gemaakt is. Vergelijk Lev 15:4 ."},{"catchword":"Mijn goud en van Mijn zilver,","tekst":"Dat is, hetwelk Ik u gegeven had tot noodzakelijk gebruik en matig sieraad. Vergelijk Hos 2:8 ."},{"catchword":"mansbeelden","tekst":"Het schijnt dat hier mansbeelden genaamd worden, en niet vrouwenbeelden, omdat Jeruzalem hier ingevoerd wordt onder de persoon van ene hoer, die zich met alle mannen vermengt. Of, omdat zij enige beelden hebben gehad in den vorm van een man, zeer onkuis en ijselijk afgebeeld."},{"catchword":"gemaakt,","tekst":"Te weten van dat goud en zilver."},{"catchword":"gehoereerd","tekst":"Te weten met aan die offeranden te doen, hen aan te roepen en alle godsdienstige eer te bewijzen."}],"18":[{"catchword":"hebt ze bedekt;","tekst":"Te weten uwe beelden, en dat, om die ook met kostelijk sieraad te vereren, hetwelk mede afgoderij is."},{"catchword":"Mijn olie","tekst":"Die Ik u tot ander gebruik gegeven heb, en onder anderen tot mijn dienst; zie Gen 28:18 ; Exo 27:20-21 , en Exo 30:7 ; Lev 2:1-2 , en Lev 8:2 , en Jdg 9:9 ."},{"catchword":"reukwerk","tekst":"Van het reukwerk uit verscheidene specerijen tot het gebruik van den godsdienst gemaakt, zie Exo 30:34-35 ."}],"19":[{"catchword":"hun aangezichten gesteld","tekst":"Te weten der beelden."},{"catchword":"liefelijken reuk;","tekst":"Vergelijk Gen 8:21 ."}],"20":[{"catchword":"Mij gebaard hadt,","tekst":"Te weten die mij toekwamen uit kracht van het verbond, dat Ik met u en uw zaad gemaakt heb. Want hoewel het Joodse volk God verlaten had en waardig was van God verlaten te worden, nochtans dewijl dit nog niet geschied was, genereerde het kinderen, die Hij ook door de besnijdenis voor de zijnen nog waardigde te kennen, niet willende de kinderen om de misdaad der ouders straffen. Alzo onder Eze 23:37 ."},{"catchword":"hun geofferd","tekst":"Te weten afgoden en beelden."},{"catchword":"om te verteren;","tekst":"Dat is opdat zij die met het vuur verslinden zouden."},{"catchword":"is het wat kleins van uw hoererijen,","tekst":"Te weten in uwe ogen, of oordeel, dat gij zulke gruwelen doet als in het voorgaande en volgende verhaald worden, voortkomende uit uwe hoererij?"}],"21":[{"catchword":"geslacht hebt,","tekst":"Het Hebreeuwse woord betekent eigenlijk kelen, of de keel afsteken, Lev 1:5 ; maar hier wordt het enkel genomen voor doden; mits door het vuur te doen gaan. Zie Lev 18:21 ; 2Ki 23:10 ; 2Ch 28:3 , en onder Eze 23:37 ."},{"catchword":"voor dezen door het vuur hebt doen gaan?","tekst":"Dat is ter ere der afgoden."}],"22":[{"catchword":"uwer jonkheid,","tekst":"Zie boven vs.4."},{"catchword":"gij naakt en bloot waart,","tekst":"Zie boven vs.7."},{"catchword":"vertreden waart in uw bloed","tekst":"Zie boven vs.6."}],"24":[{"catchword":"verwelfsel gebouwd hebt,","tekst":"Dat is, verheven plaats om daarop uwe afgoderij te bedrijven; vergelijk Lev 26:30 ; Isa 57:7 , enz.; Jer 3:6 ."}],"25":[{"catchword":"Aan elk hoofd des wegs","tekst":"Of, op elken hoofdweg, of vooraan op allen weg; dat is op alle kruiswegen en aanvangen der straten; alzo onder Eze 21:21 . Vergelijk Pro 8:2 , en de aantekening, waar de scheidweg een huis der paden wordt genoemd."},{"catchword":"hebt met uw","tekst":"Dat is, gij hebt u overgegeven tot allerlei soort van allersnoodste en onbeschaamdste afgoderij, van welke volken gij ze ontleend zoudt mogen hebben. Het Hebreeuwse woord wordt gebruikt van den mond en van de benen; van den mond, voor dien wijd opensperren om lichtvaardig en onbeschaamd te spreken, Pro 13:3 ; van de benen, voor open te zetten tot onkuischheid, gelijk hier."},{"catchword":"benen geschreden voor een ieder,","tekst":"Hebreeuws, voeten."}],"26":[{"catchword":"gehoereerd","tekst":"Te weten met ongeoorloofde verbonden met hen te maken; vergelijk Isa 30:2 , en Isa 31:1 , tegen het bevel des Heeren, Deu 17:16 . Alzo is ook onder vs.28 het woord hoereren genomen."},{"catchword":"kinderen van Egypte,","tekst":"Dat is, Egyptenaars; alzo kinderen van Assur voor Assyriërs, onder vs.28; kinderen van Babel, onder Eze 23:17 ."},{"catchword":"groot van vlees zijn;","tekst":"Dat is, die zeer geweldig en machtig zijn, zelfs in onkuischheid. Vergelijk onder Eze 23:20 ."}],"27":[{"catchword":"strekte Ik Mijn hand over u uit,","tekst":"Te weten om u te straffen, gelijk volgt; zie boven Eze 14:9 ."},{"catchword":"bescheiden deel;","tekst":"Te weten van spijs en drank, en gewoon onderhoud; zie Job 23:12 ."},{"catchword":"gaf u over in den lust dergenen,","tekst":"Zie de verklaring dezer manier van spreken Psa 27:12 ."},{"catchword":"der dochteren der Filistijnen,","tekst":"Dat is, van het volk der Filistijnen; zie 2Ki 19:21 ."},{"catchword":"uw schandelijken weg","tekst":"Hebreeuws, uwen weg van schandelijkheid."}],"28":[{"catchword":"gehoereerd","tekst":"Zie boven vs.26."},{"catchword":"kinderen van Assur,","tekst":"Zie 2Ki 16:7 ; 2Ch 28:16 ."},{"catchword":"onverzadelijk waart;","tekst":"Te weten van hoereren."}],"29":[{"catchword":"in het land van Kanaän tot in Chaldea;","tekst":"Sommigen verstaan dit alzo, dat de Joden niet alleen de afgoderij der Kanaänieten nagevolgd hebben, maar ook die der Chaldeën, en dat zulks zou mogen geschied zijn van degenen, die met Jechonia naar Babel gevankelijk zijn weggevoerd geweest."}],"30":[{"catchword":"zwak is uw hart","tekst":"Of, flauw, week, mat; te weten vermoeid en overarbeid zijnde, door die onverzadelijke hoerachtige begeerlijkheid."},{"catchword":"heersende hoerachtige vrouw","tekst":"Dat is, die niet alleen ene hoer is, maar in de hoererij zo overdadig, dartel en moedwillig, dat zij de meesteresse boven allen is."}],"31":[{"catchword":"verwelfsel bouwt","tekst":"Zie boven vs.24."},{"catchword":"aan het hoofd van iederen weg,","tekst":"Zie boven vs.25."},{"catchword":"een hoer,","tekst":"Dewijl zij geen loon begeert, maar toegeeft. Zie vs.33,34."}],"32":[{"catchword":"overspelige vrouw,","tekst":"Te weten die andere mannen tot zich lokt, zonder enig loon te begeren."},{"catchword":"haar man","tekst":"Die God zelf is, Hos 2:19 ; 2Co 11:2 ."},{"catchword":"vreemden aan","tekst":"Te weten boelen en hoereerders; dat is, vreemde en valse goden; Psa 44:21 ; Jer 2:25 , en Jer 3:13 ."}],"33":[{"catchword":"Men geeft loon aan alle hoeren;","tekst":"Hebreeuws, zij geven; te weten de hoereerders."},{"catchword":"uw loon","tekst":"Te weten zowel in het bekomen en verkrijgen van de vreemde goden en de wijze om die te dienen, als om afgodische verbonden met de heidenen te maken."},{"catchword":"boelen,","tekst":"Hebreeuws, liefhebbers, of minnaars; alzo in het volgende."},{"catchword":"van rondom","tekst":"Dat is, van alle steden en landen."},{"catchword":"zouden ingaan","tekst":"Zie van deze manier van spreken Gen 6:4 ."},{"catchword":"om uw hoererijen","tekst":"Dat is, om met u hoererij te bedrijven."}],"34":[{"catchword":"het tegendeel","tekst":"Hebreeuws, omkering
