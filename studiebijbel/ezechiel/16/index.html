nd, maak Jeruzalem haar gruwelen bekend,","3":"en zeg: Zo zegt de Heere HEERE tot Jeruzalem: Uw oorsprong en uw geboorte zijn uit het land van de Kanaänieten; uw vader was een Amoriet en uw moeder een Hethitische.","4":"En wat uw geboorte aangaat: op de dag dat u geboren werd, werd uw navel niet afgesneden; en u was niet met water gewassen om u te reinigen[1]; u was ook helemaal niet met zout gewreven, en ook niet in doeken gewikkeld.","5":"Geen oog had medelijden met u, om u een van deze dingen te doen, om zich over u te erbarmen; maar u bent geworpen op het open veld, uit walging van uw persoon, op de dag dat u geboren werd.","6":"Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!","7":"Ik heb u tot tienduizenden gemaakt, als het gewas van het veld; en u bent gegroeid, en groot geworden, en gekomen tot grote sierlijkheid; uw borsten zijn vast geworden, en uw haar is gegroeid, maar u was naakt en bloot.","8":"Toen Ik nu bij u voorbijkwam, zag Ik u, en zie, uw tijd was de tijd van de liefde; zo breidde Ik Mijn vleugel over u uit, en bedekte uw naaktheid; ja, Ik zwoer u, en kwam met u in een verbond, spreekt de Heere HEERE, en u werd van Mij.","9":"Daarna waste Ik u met water, en Ik spoelde uw bloed van u af, en zalfde u met olie.","10":"Ik kleedde u ook met geborduurd werk, en Ik schoeide u met dassenvellen[2], en omgordde u met fijn linnen, en bedekte u met zijde.","11":"Ook versierde Ik u met sieraad, en deed armringen aan uw handen, en een keten om uw hals.","12":"Ook deed Ik een voorhoofdsieraad[3] aan uw gezicht, en oorringen aan uw oren, en een kroon van heerlijkheid op uw hoofd.","13":"Zo was u versierd met goud en zilver, en uw kleding was fijn linnen, en zijde, en geborduurd werk; u at meelbloem, en honing, en olie, en u was buitengewoon mooi, en u had voorspoed, zodat u een koninkrijk werd.","14":"Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.","15":"Maar u hebt vertrouwd op uw schoonheid, en hebt gehoereerd vanwege uw naam; ja, u hebt uw hoererijen uitgestort over ieder die voorbijkwam; voor hem was u.","16":"En u hebt van uw kleren genomen, en u geplekte hoogten gemaakt, en daarop gehoereerd; zoiets is niet gebeurd en zal niet gebeuren.","17":"Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.","18":"En u hebt uw geborduurde kleren genomen, en hebt ze daarmee bedekt; en u hebt Mijn olie en Mijn reukwerk voor hun gezichten gezet.","19":"En Mijn brood, dat Ik u gaf, meelbloem en olie, en honing, waarmee Ik u voedde, dat hebt u ook voor hun gezichten gezet tot een liefelijke geur; zo is het gebeurd, spreekt de Heere HEERE.","20":"Verder hebt u uw zonen en uw dochters, die u Mij gebaard had, genomen, en hebt ze aan hen geofferd om verteerd te worden; is het iets kleins van uw hoererijen,","21":"dat u Mijn kinderen geslacht hebt, en ze overgegeven hebt, doordat u ze voor hen door het vuur hebt laten gaan?","22":"Ook hebt u bij al uw gruwelen en uw hoererijen niet gedacht aan de dagen van uw jeugd, toen u naakt en bloot was, toen u vertrapt was in uw bloed.","23":"Het is ook gebeurd na al uw slechtheid (wee, wee u, spreekt de Heere HEERE),","24":"dat u zich een verhoging gebouwd hebt, en u een hoge plaats gemaakt hebt in elke straat.","25":"Aan elk hoofd van de weg hebt u uw hoge plaatsen gebouwd, en hebt uw schoonheid tot iets afschuwelijks gemaakt, en hebt uw benen gespreid voor ieder die voorbijkwam, en hebt uw hoererijen vermeerderd.","26":"U hebt ook gehoereerd met de zonen van Egypte, uw buren, die groot van vlees zijn; en u hebt uw hoererij vermeerderd, om Mij tot toorn te verwekken.","27":"Zie, daarom strekte Ik Mijn hand tegen u uit, en verminderde uw vastgesteld deel; en Ik gaf u over aan de begeerte van hen die u haten, de dochters van de Filistijnen, die vanwege uw schandelijke weg beschaamd waren.","28":"Verder hebt u gehoereerd met de zonen van Assur, omdat u onverzadigbaar was; ja, ook toen u met hen gehoereerd had, was u nog niet verzadigd.","29":"Maar u hebt uw hoererij vermeerderd in het land van Kanaän tot in Chaldea; en daarmee bent u ook niet verzadigd geworden.","30":"Hoe zwak is uw hart (spreekt de Heere HEERE) dat u al deze dingen doet, het werk van een heersende hoerachtige vrouw!","31":"Toen u uw verhoging bouwde aan het hoofd van elke weg, en uw hoge plaats maakte in elke straat, was u niet als een hoer, die het hoerenloon veracht.","32":"O, die overspelige vrouw, zij neemt in plaats van haar man de vreemden aan.","33":"Men geeft loon aan alle hoeren; maar u geeft uw loon aan al uw minnaars, en u beschenkt hen, opdat zij van rondom tot u zouden komen om uw hoererijen.","34":"Zo gebeurt met u in uw hoererijen het tegenovergestelde van de vrouwen, omdat men u niet naloopt om te hoereren; want wanneer u hoerenloon geeft, en het hoerenloon u niet gegeven wordt, bent u tot een tegendeel geworden.","35":"Daarom, o hoer, hoor het woord van de HEERE.","36":"Zo zegt de Heere HEERE: Omdat uw vuiligheid uitgestort is, en uw schaamte door uw hoererijen met uw minnaars ontdekt is, en met alle drekgoden van uw gruwelen, en door het bloed van uw kinderen, dat u hun gegeven hebt;","37":"daarom, zie, Ik zal al uw minnaars verzamelen, met wie u vermengd bent geweest, en allen die u liefgehad hebt, met allen die u gehaat hebt; en Ik zal hen van rondom tegen u verzamelen, en Ik zal voor hen uw naaktheid ontdekken, zodat zij uw hele naaktheid zullen zien.","38":"Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver.","39":"En Ik zal u in hun hand overgeven, en zij zullen uw verhoging afbreken, en uw hoge plaatsen omverwerpen, en u uw kleren uittrekken, en uw sierlijke juwelen nemen, en u naakt en bloot achterlaten.","40":"Daarna zullen zij een menigte tegen u laten opkomen, en zij zullen u met stenen stenigen, en u met hun zwaarden doorsteken.","41":"Zij zullen ook uw huizen met vuur verbranden, en oordelen tegen u uitvoeren voor de ogen van veel vrouwen; en Ik zal u doen ophouden een hoer te zijn, en u zult ook geen hoerenloon meer geven.","42":"Zo zal Ik Mijn grimmigheid op u laten rusten, en Mijn ijver zal van u wijken; en Ik zal stil zijn, en niet meer toornig zijn.","43":"Omdat u niet gedacht hebt aan de dagen van uw jeugd, en Mij tot beroering geweest bent met dit alles, zie, zo zal Ik ook uw weg op uw hoofd geven, spreekt de Heere HEERE; en u zult die schandelijke daad niet meer doen boven al uw gruwelen.","44":"Zie, ieder die spreekwoorden gebruikt, zal over u een spreekwoord gebruiken, en zeggen: Zo de moeder is, is haar dochter.","45":"U bent de dochter van uw moeder, die walging had van haar man en van haar kinderen; en u bent de zuster van uw zusters, die walging gehad hebben van hun mannen en van hun kinderen; uw moeder was een Hethitische, en uw vader een Amoriet.","46":"Uw grote zuster nu is Samaria, zij en haar dochters, die woont aan uw linkerhand; maar uw zuster, die kleiner is dan u, die tegen uw rechterhand woont, is Sodom en haar dochters.","47":"Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.","48":"Zo waar Ik leef, spreekt de Heere HEERE, Sodom, uw zuster, heeft niet gedaan, zij en haar dochters niet, zoals u gedaan hebt, u en uw dochters!","49":"Zie, dit was de ongerechtigheid van uw zuster Sodom: hoogmoed, verzadiging van brood, en zorgeloze rust had zij en haar dochters; maar zij versterkte de hand van de arme en de behoeftige niet.","50":"En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.","51":"Samaria heeft ook niet naar de helft van uw zonden gezondigd; en u hebt uw gruwelen meer dan zij vermeerderd, en u hebt uw zusters gerechtvaardigd door al uw gruwelen die u gedaan hebt.","52":"Draag u dan ook uw schande, u die voor uw zusters geoordeeld hebt door uw zonden, die u gruwelijker gemaakt hebt dan zij; zij zijn rechtvaardiger dan u; wees u dan ook beschaamd, en draag uw schande, omdat u uw zusters gerechtvaardigd hebt.","53":"Wanneer Ik hun gevangenen terugbreng, namelijk de gevangenen van Sodom en haar dochters, en de gevangenen van Samaria en haar dochters, dan zal Ik ook de gevangenen van uw gevangenschap in hun midden terugbrengen.","54":"Opdat u uw schande draagt, en te schande gemaakt wordt, om alles wat u gedaan hebt, wanneer u hen troosten zult.","55":"Wanneer uw zusters, Sodom en haar dochters, terugkeren zullen naar hun vorige toestand, alsook Samaria en haar dochters zullen terugkeren naar hun vorige toestand, zult u ook, en uw dochters, terugkeren naar uw vorige toestand.","56":"Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,","57":"voordat uw slechtheid ontdekt werd. Zoals het was in de tijd van de smaad van de dochters van Syrië, en van allen die daaromheen waren, de dochters van de Filistijnen, die u van rondom verachten,","58":"hebt u uw schandelijke daden en uw gruwelen gedragen, spreekt de HEERE.","59":"Want zo zegt de Heere HEERE: Ik zal u ook doen zoals u gedaan hebt, u die de eed veracht hebt door het verbond te breken.","60":"Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten.","61":"Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond.","62":"Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;","63":"opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE."},"SV":{"1":"Verder geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind, maak Jeruzalem haar gruwelen bekend,","3":"En zeg: Alzo zegt de Heere HEERE tot Jeruzalem: Uw handelingen en uw geboorten zijn uit het land der Kanaänieten; uw vader was een Amoriet en uw moeder een Hethietische.","4":"En aangaande uw geboorten: ten dage, als gij geboren waart, werd uw navel niet afgesneden; en gij waart niet met water gewassen, toen Ik *u* aanschouwde; gij waart ook geenszins met zout gewreven, noch in windselen gewonden.","5":"Geen oog had medelijden over u, om u een van deze dingen te doen, om zich over u te erbarmen; maar gij zijt geworpen geweest op het vlakke des velds, om de walgelijkheid van uw ziel, ten dage, toen gij geboren waart.","6":"Als Ik bij u voorbijging, zo zag Ik u, vertreden zijnde in uw bloed, en Ik zeide tot u in uw bloed: Leef; ja, Ik zeide tot u in uw bloed: Leef!","7":"Ik heb u tot tien duizend, als het gewas des velds, gemaakt; en gij zijt gegroeid, en groot geworden, en zijt gekomen tot grote sierlijkheid; *uw* borsten zijn vast geworden, en uw haar is gewassen, doch gij waart naakt en bloot.","8":"Als Ik nu bij u voorbijging, zag Ik u, en ziet, uw tijd was de tijd der minne; zo breidde Ik Mijn vleugel over u uit, en dekte uw naaktheid; ja, Ik zwoer u, en kwam met u in een verbond, spreekt de Heere HEERE en gij werdt de Mijne.","9":"Daarna wies Ik u met water, en Ik spoelde uw bloed van u af, en zalfde u met olie.","10":"Ik bekleedde u ook met gestikt werk, en Ik schoeide u met dassenvellen, en omgordde u met fijn linnen, en bedekte u met zijde.","11":"Ook versierde Ik u met sieraad, en deed armringen aan uw handen, en een keten aan uw hals.","12":"Desgelijks deed Ik een voorhoofdsiersel aan uw aangezicht, en oorringen aan uw oren, en een kroon der heerlijkheid op uw hoofd.","13":"Zo waart gij versierd met goud en zilver, en uw kleding was fijn linnen, en zijde, en gestikt werk; gij at meelbloem, en honig, en olie, en gij waart gans zeer schoon, en waart voorspoedig, dat gij een koninkrijk werdt.","14":"Daartoe ging van u een naam uit onder de heidenen om uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.","15":"Maar gij hebt vertrouwd op uw schoonheid, en hebt gehoereerd vanwege uw naam; ja, hebt uw hoererijen uitgestort aan een ieder, die voorbijging; voor hem was zij.","16":"En gij hebt van uw klederen genomen, en u gemaakt geplekte hoogten, en hebt daarop gehoereerd; *zulks* is niet gekomen, en zal niet geschieden.","17":"Daartoe hebt gij genomen de vaten uws sieraads van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en gij hebt u mansbeelden gemaakt, en gij hebt met dezelve gehoereerd.","18":"En gij hebt uw gestikte klederen genomen, en hebt ze bedekt; en gij hebt Mijn olie en Mijn reukwerk voor hun aangezichten gesteld.","19":"En Mijn brood, hetwelk Ik u gaf, meelbloem en olie, en honig, *waarmede* Ik u spijsde, dat hebt gij ook voor hun aangezichten gesteld tot een liefelijken reuk; zo is het geschied, spreekt de Heere HEERE.","20":"Verder hebt gij uw zonen en uw dochteren, die gij Mij gebaard hadt, genomen, en hebt ze denzelven geofferd om te verteren; is het wat kleins van uw hoererijen,","21":"Dat gij Mijn kinderen geslacht hebt, en hebt ze overgegeven, als gij dezelve voor hen door *het* *vuur* hebt doen gaan?","22":"Ook hebt gij bij al uw gruwelen en uw hoererijen niet gedacht aan de dagen uwer jonkheid, als gij naakt en bloot waart, *als* gij vertreden waart in uw bloed.","23":"Het is ook geschied na al uw boosheid, ( wee, wee u, spreekt de Heere HEERE),","24":"Dat gij u een verwelfsel gebouwd hebt, en u een hoge plaats gemaakt hebt in elke straat.","25":"Aan elk hoofd des wegs hebt gij uw hoge plaatsen gebouwd, en hebt uw schoonheid gruwelijk gemaakt, en hebt met uw benen geschreden voor een ieder, die voorbijging, en hebt uw hoererijen vermenigvuldigd.","26":"Gij hebt ook gehoereerd met de kinderen van Egypte, uw naburen, die groot van vlees zijn; en gij hebt uw hoererij vermenigvuldigd, om Mij tot toorn te verwekken.","27":"Ziet, daarom strekte Ik Mijn hand over u uit, en verminderde uw bescheiden deel; en Ik gaf u over in den lust dergenen, die u haten, der dochteren der Filistijnen, die vanwege uw schandelijken weg beschaamd waren.","28":"Verder hebt gij gehoereerd met de kinderen van Assur, omdat gij onverzadelijk waart; ja, als gij met hen gehoereerd hebt, zijt gij ook niet verzadigd geworden.","29":"Maar gij hebt uw hoererij vermenigvuldigd in het land van Kanaän tot in Chaldea; en daarmede ook zijt gij niet verzadigd geworden.","30":"Hoe zwak is uw hart ( spreekt de Heere HEERE) als gij al deze dingen doet, *zijnde* het werk van een heersende hoerachtige vrouw!","31":"Als gij uw verwelfsel bouwt aan het hoofd van iederen weg, en uw hoge plaats maakt in elke straat, en niet zijt geweest als een hoer, het hoerenloon beschimpende.","32":"O, die overspelige vrouw, zij neemt in plaats van haar man de vreemden aan.","33":"Men geeft loon aan alle hoeren; maar gij geeft uw loon aan al uw boelen, en gij beschenkt ze, opdat zij tot u van rondom zouden ingaan om uw hoererijen.","34":"Zo geschiedt met u in uw hoererijen het tegendeel van de vrouwen, dewijl men u niet naloopt, om te hoereren; want als gij hoerenloon geeft, en het hoerenloon u niet gegeven wordt; zo zijt gij tot een tegendeel geworden.","35":"Daarom, o hoer, hoor des HEEREN woord.","36":"Alzo zegt de Heere HEERE: Omdat uw vergif uitgestort is, en uw schaamte door uw hoererijen met uw boelen ontdekt is, en met al de drekgoden uwer gruwelen, en na het bloed uwer kinderen, dat gij hun gegeven hebt;","37":"Daarom, zie, Ik zal al uw boelen vergaderen, met dewelke gij vermengd zijt geweest, en allen, die gij liefgehad hebt, met allen, die gij gehaat hebt; en Ik zal hen van rondom vergaderen tegen u, en Ik zal voor hen uw naaktheid ontdekken, dat zij uw ganse naaktheid zien zullen.","38":"Daartoe zal Ik u *naar* de rechten der overspeelsters en der bloedvergietsters richten; en Ik zal u overgeven aan het bloed der grimmigheid en des ijvers.","39":"En Ik zal u in hun hand overgeven, en zij zullen uw verwelfsel afbreken, en uw hoge plaatsen omwerpen, en uw klederen u uittrekken, en uw sierlijke juwelen nemen, en u naakt en bloot laten.","40":"Daarna zullen zij tegen u een vergadering doen opkomen, en zullen u met stenen stenigen, en u met hun zwaarden doorsteken.","41":"Zij zullen ook uw huizen met vuur verbranden, en oordelen tegen u uitvoeren voor veler vrouwen ogen; en Ik zal u doen ophouden van een hoer te zijn, en gij zult ook niet meer hoerenloon geven.","42":"Zo zal Ik Mijn grimmigheid op u doen rusten, en Mijn ijver zal van u afwijken; en Ik zal stil zijn, en niet meer toornig wezen.","43":"Daarom dat gij niet gedacht hebt aan de dagen uwer jonkheid, en Mij tot beroering geweest zijt met dit alles, zie, zo zal Ik ook uw weg op *uw* hoofd geven, spreekt de Heere HEERE; en gij zult die schandelijke daad niet doen boven al uw gruwelen.","44":"Zie, een ieder, die spreekwoorden gebruikt, zal van u een spreekwoord gebruiken, zeggende: Zo de moeder is, is haar dochter.","45":"Gij zijt de dochter uwer moeder, die de walg had van haar man en van haar kinderen; en gij zijt de zuster uwer zusteren, die de walg gehad hebben van haar mannen en van haar kinderen; uw moeder was een Hethietische, en uw vader een Amoriet.","46":"Uw grote zuster nu is Samaria, zij en haar dochteren, dewelke woont aan uw linkerhand; maar uw zuster, die kleiner is dan gij, die tegen uw rechterhand woont, is Sodom en haar dochteren.","47":"Doch gij hebt in haar wegen niet gewandeld, noch naar haar gruwelen gedaan; het was wat gerings, een verdriet; maar gij hebt het meer verdorven dan zij, in al uw wegen.","48":"*Zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE, indien Sodom, uw zuster, zij met haar dochteren, gedaan heeft, gelijk gij gedaan hebt en uw dochteren!","49":"Ziet, dit was de ongerechtigheid uwer zuster Sodom; hoogmoed, zatheid van brood en stille gerustheid had zij en haar dochteren; maar zij sterkte de hand des armen en nooddruftigen niet.","50":"En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.","51":"Samaria ook heeft naar de helft uwer zonden niet gezondigd; en gij hebt uw gruwelen meer dan zij vermenigvuldigd, en hebt uw zusters gerechtvaardigd door al uw gruwelen, die gij gedaan hebt.","52":"Draag gij *dan* ook uw schande, gij, die voor uw zusteren geoordeeld hebt door uw zonden, die gij gruwelijker gemaakt hebt dan zij; zij zijn rechtvaardiger dan gij; wees gij dan ook beschaamd, en draag uw schande, omdat gij uw zusters gerechtvaardigd hebt.","53":"Als Ik haar gevangenen wederbrengen zal, *namelijk* de gevangenen van Sodom en haar dochteren, en de gevangenen van Samaria en haar dochteren, dan *zal* *Ik* *wederbrengen* de gevangenen uwer gevangenis in het midden van haar.","54":"Opdat gij uw schande draagt, en te schande gemaakt wordt, om al hetgeen gij gedaan hebt, als gij haar troosten zult.","55":"Als uw zusters, Sodom en haar dochteren, zullen wederkeren tot haar vorigen staat, mitsgaders Samaria en haar dochteren zullen wederkeren tot haar vorigen staat, zult gij ook en uw dochteren wederkeren tot uw vorigen staat.","56":"Ja, uw zuster Sodom is in uw mond niet gehoord geweest, ten dage uws groten hoogmoeds,","57":"Aleer uw boosheid ontdekt was. Als de tijd was der versmading van de dochteren van Syrië, en van al degenen, die rondom datzelve waren, de dochteren der Filistijnen, die u verachten van rondom,","58":"Hebt gij uw schandelijke daden en uw gruwelen gedragen, spreekt de HEERE.","59":"Want alzo zegt de Heere HEERE: Ik zal u ook doen, gelijk als gij gedaan hebt, die den eed veracht hebt, brekende het verbond.","60":"Evenwel zal Ik gedachtig wezen aan Mijn verbond met u, in de dagen uwer jonkheid, en Ik zal met u een eeuwig verbond oprichten.","61":"Dan zult gij uwer wegen gedenken en beschaamd zijn, als gij uw zusteren, die groter zijn dan gij, met degenen, die kleiner zijn dan gij, aannemen zult; want Ik zal u dezelve geven tot dochteren, maar niet uit uw verbond.","62":"Want Ik zal Mijn verbond met u oprichten, en gij zult weten, dat Ik de HEERE ben;","63":"Opdat gij het gedachtig zijt, en u schaamt, en niet meer uw mond opent vanwege uw schande, wanneer Ik voor u verzoening doen zal over al hetgeen gij gedaan hebt, spreekt de Heere HEERE."},"KJV":{"1":"Again the word of the LORD came unto me, saying,","2":"Son of man, cause Jerusalem to know her abominations,","3":"And say, Thus saith the Lord GOD unto Jerusalem; Thy birth and thy nativity *is* of the land of Canaan; thy father *was* an Amorite, and thy mother an Hittite.","4":"And *as for* thy nativity, in the day thou wast born thy navel was not cut, neither wast thou washed in water to supple *thee*; thou wast not salted at all, nor swaddled at all.","5":"None eye pitied thee, to do any of these unto thee, to have compassion upon thee; but thou wast cast out in the open field, to the lothing of thy person, in the day that thou wast born.","6":"And when I passed by thee, and saw thee polluted in thine own blood, I said unto thee *when thou wast* in thy blood, Live; yea, I said unto thee *when thou wast* in thy blood, Live.","7":"I have caused thee to multiply as the bud of the field, and thou hast increased and waxen great, and thou art come to excellent ornaments: *thy* breasts are fashioned, and thine hair is grown, whereas thou *wast* naked and bare.","8":"Now when I passed by thee, and looked upon thee, behold, thy time *was* the time of love; and I spread my skirt over thee, and covered thy nakedness: yea, I sware unto thee, and entered into a covenant with thee, saith the Lord GOD,","9":"Then washed I thee with water; yea, I throughly washed away thy blood from thee, and I anointed thee with oil.","10":"I clothed thee also with broidered work, and shod thee with badgers' skin, and I girded thee about with fine linen, and I covered thee with silk.","11":"I decked thee also with ornaments, and I put bracelets upon thy hands, and a chain on thy neck.","12":"And I put a jewel on thy forehead, and earrings in thine ears, and a beautiful crown upon thine head.","13":"Thus wast thou decked with gold and silver; and thy raiment *was of* fine linen, and silk, and broidered work; thou didst eat fine flour, and honey, and oil: and thou wast exceeding beautiful, and thou didst prosper into a kingdom.","14":"And thy renown went forth among the heathen for thy beauty: for it *was* perfect through my comeliness, which I had put upon thee, saith the Lord GOD.","15":"But thou didst trust in thine own beauty, and playedst the harlot because of thy renown, and pouredst out thy fornications on every one that passed by;","16":"And of thy garments thou didst take, and deckedst thy high places with divers colours, and playedst the harlot thereupon: *the like things* shall not come,","17":"Thou hast also taken thy fair jewels of my gold and of my silver, which I had given thee, and madest to thyself images of men, and didst commit whoredom","18":"And tookest thy broidered garments, and coveredst them: and thou hast set mine oil and mine incense before","19":"My meat also which I gave thee, fine flour, and oil, and honey, *wherewith* I fed thee, thou hast even set it before them for a sweet savour: and *thus* it was, saith the Lord GOD.","20":"Moreover thou hast taken thy sons and thy daughters, whom thou hast borne unto me, and these hast thou sacrificed unto them to be devoured. *Is this* of thy whoredoms a small matter,","21":"That thou hast slain my children, and delivered them to cause them to pass through","22":"And in all thine abominations and thy whoredoms thou hast not remembered the days of thy youth, when thou wast naked and bare, *and* wast polluted in thy blood.","23":"And it came to pass after all thy wickedness, (woe, woe unto thee! saith the Lord GOD;)","24":"*That* thou hast also built unto thee an eminent place, and hast made thee an high place in every street.","25":"Thou hast built thy high place at every head of the way, and hast made thy beauty to be abhorred, and hast opened thy feet to every one that passed by, and multiplied thy whoredoms.","26":"Thou hast also committed fornication with the Egyptians thy neighbours, great of flesh; and hast increased thy whoredoms, to provoke me to anger.","27":"Behold, therefore I have stretched out my hand over thee, and have diminished thine ordinary *food*, and delivered thee unto the will of them that hate thee, the daughters of the Philistines, which are ashamed of thy lewd way.","28":"Thou hast played the whore also with the Assyrians, because thou wast unsatiable; yea, thou hast played the harlot with them, and yet couldest not be satisfied.","29":"Thou hast moreover multiplied thy fornication in the land of Canaan unto Chaldea; and yet thou wast not satisfied herewith.","30":"How weak is thine heart, saith the Lord GOD, seeing thou doest all these *things*, the work of an imperious whorish woman;","31":"In that thou buildest thine eminent place in the head of every way, and makest thine high place in every street; and hast not been as an harlot, in that thou scornest hire;","32":"*But as* a wife that committeth adultery, *which* taketh strangers instead of her husband!","33":"They give gifts to all whores: but thou givest thy gifts to all thy lovers, and hirest them, that they may come unto thee on every side for thy whoredom.","34":"And the contrary is in thee from *other* women in thy whoredoms, whereas none followeth thee to commit whoredoms: and in that thou givest a reward, and no reward is given unto thee, therefore thou art contrary.","35":"Wherefore, O harlot, hear the word of the LORD:","36":"Thus saith the Lord GOD; Because thy filthiness was poured out, and thy nakedness discovered through thy whoredoms with thy lovers, and with all the idols of thy abominations, and by the blood of thy children, which thou didst give","37":"Behold, therefore I will gather all thy lovers, with whom thou hast taken pleasure, and all *them* that thou hast loved, with all *them* that thou hast hated; I will even gather them round about against thee, and will discover thy nakedness unto them, that they may see all thy nakedness.","38":"And I will judge thee, as women that break wedlock and shed blood are judged; and I will give thee blood in fury and jealousy.","39":"And I will also give thee into their hand, and they shall throw down thine eminent place, and shall break down thy high places: they shall strip thee also of thy clothes, and shall take thy fair jewels, and leave thee naked and bare.","40":"They shall also bring up a company against thee, and they shall stone thee with stones, and thrust thee through with their swords.","41":"And they shall burn thine houses with fire, and execute judgments upon thee in the sight of many women: and I will cause thee to cease from playing the harlot, and thou also shalt give no hire","42":"So will I make my fury toward thee to rest, and my jealousy shall depart from thee, and I will be quiet, and will be no more angry.","43":"Because thou hast not remembered the days of thy youth, but hast fretted me in all these *things*; behold, therefore I also will recompense thy way upon *thine* head, saith the Lord GOD: and thou shalt not commit this lewdness above all thine abominations.","44":"Behold, every one that useth proverbs shall use *this* proverb against thee, saying, As *is* the mother, *so is* her daughter.","45":"Thou *art* thy mother's daughter, that lotheth her husband and her children; and thou *art* the sister of thy sisters, which lothed their husbands and their children: your mother *was* an Hittite, and your father an Amorite.","46":"And thine elder sister *is* Samaria, she and her daughters that dwell at thy left hand: and thy younger sister, that dwelleth at thy right hand, *is* Sodom and her daughters.","47":"Yet hast thou not walked after their ways, nor done after their abominations: but, as *if that were* a very little *thing*, thou wast corrupted more than they in all thy ways.","48":"*As* I live, saith the Lord GOD, Sodom thy sister hath not done, she nor her daughters, as thou hast done, thou and thy daughters.","49":"Behold, this was the iniquity of thy sister Sodom, pride, fulness of bread, and abundance of idleness was in her and in her daughters, neither did she strengthen the hand of the poor and needy.","50":"And they were haughty, and committed abomination before me: therefore I took them away as I saw","51":"Neither hath Samaria committed half of thy sins; but thou hast multiplied thine abominations more than they, and hast justified thy sisters in all thine abominations which thou hast done.","52":"Thou also, which hast judged thy sisters, bear thine own shame for thy sins that thou hast committed more abominable than they: they are more righteous than thou: yea, be thou confounded also, and bear thy shame, in that thou hast justified thy sisters.","53":"When I shall bring again their captivity, the captivity of Sodom and her daughters, and the captivity of Samaria and her daughters, then *will I bring again* the captivity of thy captives in the midst","54":"That thou mayest bear thine own shame, and mayest be confounded in all that thou hast done, in that thou art a comfort","55":"When thy sisters, Sodom and her daughters, shall return to their former estate, and Samaria and her daughters shall return to their former estate, then thou and thy daughters shall return to your former estate.","56":"For thy sister Sodom was not mentioned by thy mouth in the day of thy pride,","57":"Before thy wickedness was discovered, as at the time of *thy* reproach of the daughters of Syria, and all *that are* round about her, the daughters of the Philistines, which despise thee round about.","58":"Thou hast borne thy lewdness and thine abominations, saith the LORD.","59":"For thus saith the Lord GOD; I will even deal with thee as thou hast done, which hast despised the oath in breaking the covenant.","60":"Nevertheless I will remember my covenant with thee in the days of thy youth, and I will establish unto thee an everlasting covenant.","61":"Then thou shalt remember thy ways, and be ashamed, when thou shalt receive thy sisters, thine elder and thy younger: and I will give them unto thee for daughters, but not by thy covenant.","62":"And I will establish my covenant with thee; and thou shalt know that I *am* the LORD:","63":"That thou mayest remember, and be confounded, and never open thy mouth any more because of thy shame, when I am pacified toward thee for all that thou hast done, saith the Lord GOD."}},"tsk":{"2":[{"kopje":"maak bekend","refs":["Ezech 20:4","Ezech 22:2","Ezech 23:36","Ezech 33:7-9","Jes 58:1","Hos 8:1"]},{"kopje":"gruwelen","refs":["Ezech 8:9-17"]}],"3":[{"kopje":"uw geboorte","refs":["Ezech 16:45","Ezech 21:30","Gen 11:25","Gen 11:29","Joz 24:14","Neh 9:7","Jes 1:10","Jes 51:1","Jes 51:2","Matt 3:7","Matt 11:24","Luk 3:7","Joh 8:44","Ef 2:3","1 Joh 3:10"]},{"kopje":"Amoriet","refs":["Gen 15:16","Deut 20:17","1 Kon 21:26","2 Kon 21:11"]},{"kopje":"Hethitische","refs":["Ezra 9:1"]}],"4":[{"kopje":"dat","refs":["Ezech 20:8","Ezech 20:13","Gen 15:13","Ex 1:11-14","Ex 2:23","Ex 2:24","Ex 5:16-21","Deut 5:6","Deut 15:15","Joz 24:2","Neh 9:7-9","Hos 2:2","Hand 7:6","Hand 7:7"]},{"kopje":"ook niet","refs":["Klaagl 2:20","Klaagl 2:22","Luk 2:7","Luk 2:12"]}],"5":[{"kopje":"oog","refs":["Ezech 2:6","Jes 49:15","Klaagl 2:11","Klaagl 2:19","Klaagl 4:3","Klaagl 4:10"]},{"kopje":"maar u","refs":["Gen 21:10","Ex 1:22","Num 19:16","Jer 9:21","Jer 9:22","Jer 22:19"]}],"6":[{"kopje":"zag Ik","refs":["Ex 2:24","Ex 2:25","Ex 3:7","Ex 3:8","Hand 7:34"]},{"ko
