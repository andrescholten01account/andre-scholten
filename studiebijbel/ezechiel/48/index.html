en het heiligdom van de HEERE zal in het midden daarvan zijn.", "11": "Het zal zijn voor de priesters, die geheiligd zijn uit de kinderen van Zadok, die Mijn wacht waargenomen hebben; die niet gedwaald hebben, zoals de kinderen van Israël dwaalden; zoals de andere Levieten gedwaald hebben.", "12": "En het geofferde van het hefoffer van het land zal hun allerheiligst zijn, aan de grens van de Levieten.", "13": "Verder zullen de Levieten tegenover de grens van de priesters hebben de lengte van vijfentwintigduizend, en de breedte van tienduizend; de hele lengte zal zijn vijfentwintigduizend, en de breedte tienduizend.", "14": "En zij zullen daarvan niets verkopen, noch de eerstelingen van het land verwisselen, noch overdragen; want het is heilig voor de HEERE.", "15": "Maar de vijfduizend, dat is wat overgelaten is in de breedte, voor aan de vijfentwintigduizend, dat zal onheilig zijn, voor de stad, tot bewoning en tot voorsteden; en de stad zal in het midden daarvan zijn.", "16": "En dit zullen haar maten zijn: de noordkant, vierduizend vijfhonderd *meetrieten*; en de zuidkant vierduizend vijfhonderd; en van de oostkant vierduizend vijfhonderd; en de westkant vierduizend vijfhonderd.", "17": "De voorsteden nu van de stad zullen zijn, noordwaarts tweehonderdvijftig, en zuidwaarts tweehonderdvijftig, en oostwaarts tweehonderdvijftig, en westwaarts tweehonderdvijftig.", "18": "En het overgelatene in de lengte, tegenover het heilig hefoffer, zal zijn tienduizend oostwaarts, en tienduizend westwaarts; en het zal tegenover het heilig hefoffer zijn; en de opbrengst daarvan zal wezen tot voedsel voor hen die de stad dienen.", "19": "En zij die de stad dienen, zullen haar dienen uit alle stammen van Israël.", "20": "Het hele hefoffer zal zijn van vijfentwintigduizend *meetrieten*, met vijfentwintigduizend; vierkant zult u het heilig hefoffer offeren, met de bezitting van de stad.", "21": "En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend *meetrieten* van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.", "22": "Van de bezitting nu van de Levieten, en van de bezitting van de stad af, in het midden van wat van de vorst zal zijn; wat tussen de grens van Juda en tussen de grens van Benjamin is, zal van de vorst zijn.", "23": "Aangaande verder het overige van de stammen: van de oostkant tot de westkant toe, Benjamin een deel.", "24": "En aan de grens van Benjamin, van de oostkant tot de westkant toe, Simeon een.", "25": "En aan de grens van Simeon, van de oostkant tot de westkant toe, Issaschar een.", "26": "En aan de grens van Issaschar, van de oostkant tot aan de westkant toe, Zebulon een.", "27": "En aan de grens van Zebulon, van de oostkant tot de westkant toe, Gad een.", "28": "Aan de grens nu van Gad, aan de zuidkant zuidwaarts, daar zal de grens zijn van Thamar af, naar het twistwater van Kades, vervolgens naar de beek heen, tot aan de grote zee.", "29": "Dit is het land, dat u zult laten vallen in erfenis, voor de stammen van Israël, en dit zullen hun delen zijn, spreekt de Heere HEERE.", "30": "Verder zullen dit de uitgangen van de stad zijn: van de noordkant, vierduizend vijfhonderd maten.", "31": "En de poorten van de stad zullen zijn naar de namen van de stammen van Israël; drie poorten noordwaarts; een poort van Ruben, een poort van Juda, een poort van Levi.", "32": "En aan de oostkant, vierduizend vijfhonderd *maten*, en drie poorten: namelijk, een poort van Jozef, een poort van Benjamin, een poort van Dan.", "33": "De zuidkant ook vierduizend vijfhonderd maten, en drie poorten: een poort van Simeon, een poort van Issaschar, een poort van Zebulon.", "34": "De westkant, vierduizend vijfhonderd; hun poorten drie: een poort van Gad, een poort van Aser, een poort van Naftali.", "35": "Rondom achttienduizend; en de naam van de stad zal van die dag af zijn: DE Heere IS DAAR."}, "SV": {"1": "Dit nu zijn de namen der stammen. Van het einde noordwaarts, aan de zijde des wegs van Hethlon, waar men komt te Hamath, Hazar-enan, de landpale van Damaskus, noordwaarts aan de zijde van Hamath (ook zal hij den ooster *hoek* *en* westerhoek hebben), *zal* Dan een *snoer* *hebben*.", "2": "En aan de landpale van Dan, van den oosterhoek tot den westerhoek toe, Aser een.", "3": "En aan de landpale van Aser, van den oosterhoek af tot den westerhoek toe, Nafthali een.", "4": "En aan de landpale van Nafthali, van den oosterhoek tot den westerhoek toe, Manasse een.", "5": "En aan de landpale van Manasse, van den oosterhoek tot den westerhoek toe, Efraïm een.", "6": "En aan de landpale van Efraïm, van den oosterhoek tot den westerhoek toe, Ruben een.", "7": "En aan de landpale van Ruben, van den oosterhoek tot den westerhoek toe, Juda een.", "8": "Aan de landpale nu van Juda, van den oosterhoek tot den westerhoek toe, zal het hefoffer zijn, dat gijlieden zult offeren, vijf en twintig duizend *meetrieten* in breedte, en de lengte, als van een der *andere* delen, van den oosterhoek tot den westerhoek toe; en het heiligdom zal in het midden deszelven zijn.", "9": "Het hefoffer, dat gijlieden den HEERE zult offeren, zal wezen de lengte van vijf en twintig duizend, en de breedte van tien duizend.", "10": "En daarin zal het heilig hefoffer zijn voor de priesteren, noordwaarts *de* *lengte* van vijf en twintig duizend, en westwaarts de breedte van tien duizend, en oostwaarts de breedte van tien duizend, en zuidwaarts de lengte van vijf en twintig duizend; en het heiligdom des HEEREN zal in het midden deszelven zijn.", "11": "Het zal zijn voor de priesteren, die geheiligd zijn uit de kinderen van Zadok, die Mijn wacht hebben waargenomen; die niet gedwaald hebben, als de kinderen Israëls dwaalden; gelijk als de *andere* Levieten gedwaald hebben.", "12": "En het geofferde van het hefoffer des lands zal hunlieden een heiligheid der heiligheden zijn, aan de landpale der Levieten.", "13": "Voorts zullen de Levieten tegenover de landpale der priesteren hebben de lengte van vijf en twintig duizend, en de breedte van tien duizend; de ganse lengte zal zijn vijf en twintig duizend, en de breedte tien duizend.", "14": "En zij zullen daarvan niet verkopen, noch de eerstelingen des lands verwisselen, noch overdragen ; want het is een heiligheid den HEERE.", "15": "Maar de vijf duizend, dat *is* hetgeen overgelaten is in de breedte, voor aan de vijf en twintig duizend, dat zal onheilig zijn, voor de stad, tot bewoning en tot voorsteden; en de stad zal in het midden daarvan zijn.", "16": "En dit zullen haar maten zijn: de noorderhoek, vier duizend en vijfhonderd *meetrieten*; en de zuiderhoek vier duizend en vijfhonderd en van den oosterhoek vier duizend en vijfhonderd; en de westerhoek vier duizend en vijfhonderd.", "17": "De voorsteden nu der stad zullen zijn, noordwaarts tweehonderd en vijftig, en zuidwaarts tweehonderd en vijftig, en oostwaarts tweehonderd en vijftig, en westwaarts tweehonderd en vijftig.", "18": "En het overgelatene in de lengte, tegenover het heilig hefoffer, zal zijn tien duizend oostwaarts, en tien duizend westwaarts; en het zal tegenover het heilig hefoffer zijn; en de inkomst daarvan zal wezen tot onderhoud voor degenen, die de stad dienen.", "19": "En die de stad dienen, zullen haar dienen uit alle stammen Israëls.", "20": "Het ganse hefoffer zal zijn van vijf en twintig duizend *meetrieten*, met vijf en twintig duizend; vierkant zult gijlieden het heilig hefoffer offeren, met de bezitting der stad.", "21": "En het overgelatene zal voor den vorst zijn, van deze en van gene zijde des heiligen hefoffers, en van de bezitting der stad, voor aan de vijf en twintig duizend *meetrieten* des hefoffers, tot aan de ooster *landpale* en westerlandpale, voor aan de vijf en twintig duizend aan de westerlandpale, tegenover de *andere* delen, *dat* zal voor den vorst zijn; en het heilig hefoffer, en het heiligdom des huizes, zal in het midden daarvan zijn.", "22": "Van de bezitting nu der Levieten, en van de bezitting der stad af, zijnde in het midden van hetgeen des vorsten zal zijn; *wat* tussen de landpale van Juda, en tussen de landpale van Benjamin is, zal des vorsten zijn.", "23": "Aangaande voorts het overige der stammen; van den oosterhoek tot den westerhoek toe, Benjamin een *snoer*.", "24": "En aan de landpale van Benjamin, van den oosterhoek tot den westerhoek toe, Simeon een.", "25": "En aan de landpale van Simeon, van den oosterhoek tot de westerhoek toe, Issaschar een.", "26": "En aan de landpale van Issaschar, van den oosterhoek tot aan den westerhoek toe, Zebulon een.", "27": "En aan de landpale van Zebulon, van den oosterhoek tot den westerhoek toe, Gad een.", "28": "Aan de landpale nu van Gad, aan den zuiderhoek zuidwaarts, daar zal de landpale zijn van Thamar af, *naar* het twistwater van Kades, *voorts* naar de beek henen, tot aan de grote zee.", "29": "Dit is het land, dat gijlieden zult doen vallen in erfenis, voor de stammen Israëls, en dit zullen hun delen zijn, spreekt de Heere HEERE.", "30": "Voorts zullen dit de uitgangen der stad zijn: van den noorderhoek, vier duizend en vijfhonderd maten.", "31": "En de poorten der stad zullen zijn naar de namen der stammen Israëls; drie poorten noordwaarts; een poort van Ruben, een poort van Juda, een poort van Levi.", "32": "En aan den oosterhoek, vier duizend en vijfhonderd *maten*, en drie poorten: namelijk, een poort van Jozef, een poort van Benjamin, een poort van Dan.", "33": "De zuiderhoek ook vier duizend en vijfhonderd maten, en drie poorten: een poort van Simeon, een poort van Issaschar, een poort van Zebulon.", "34": "De westerhoek, vier duizend en vijfhonderd; derzelver poorten drie: een poort van Gad, een poort van Aser, een poort van Nafthali.", "35": "Rondom achttien duizend; en de naam der stad zal van *dien* dag af zijn: DE Heere IS ALDAAR."}, "KJV": {"1": "Now these *are* the names of the tribes. From the north end to the coast of the way of Hethlon, as one goeth to Hamath, Hazarenan, the border of Damascus northward, to the coast of Hamath; for these are his sides east *and* west; a *portion for* Dan.", "2": "And by the border of Dan, from the east side unto the west side, a *portion for* Asher.", "3": "And by the border of Asher, from the east side even unto the west side, a *portion for* Naphtali.", "4": "And by the border of Naphtali, from the east side unto the west side, a *portion for* Manasseh.", "5": "And by the border of Manasseh, from the east side unto the west side, a *portion for* Ephraim.", "6": "And by the border of Ephraim, from the east side even unto the west side, a *portion for* Reuben.", "7": "And by the border of Reuben, from the east side unto the west side, a *portion for* Judah.", "8": "And by the border of Judah, from the east side unto the west side, shall be the offering which ye shall offer of five and twenty thousand *reeds in* breadth, and *in* length as one of the *other* parts, from the east side unto the west side: and the sanctuary shall be in the midst", "9": "The oblation that ye shall offer unto the LORD *shall be* of five and twenty thousand in length, and of ten thousand in breadth.", "10": "And for them, *even* for the priests, shall be *this* holy oblation; toward the north five and twenty thousand *in length*, and toward the west ten thousand in breadth, and toward the east ten thousand in breadth, and toward the south five and twenty thousand in length: and the sanctuary of the LORD shall be in the midst", "11": "*It shall be* for the priests that are sanctified of the sons of Zadok; which have kept my charge, which went not astray when the children of Israel went astray, as the Levites went astray.", "12": "And *this* oblation of the land that is offered shall be unto them a thing most holy by the border of the Levites.", "13": "And over against the border of the priests the Levites *shall have* five and twenty thousand in length, and ten thousand in breadth: all the length *shall be* five and twenty thousand, and the breadth ten thousand.", "14": "And they shall not sell of it, neither exchange, nor alienate the firstfruits of the land: for *it is* holy unto the LORD.", "15": "And the five thousand, that are left in the breadth over against the five and twenty thousand, shall be a profane *place* for the city, for dwelling, and for suburbs: and the city shall be in the midst", "16": "And these *shall be* the measures thereof; the north side four thousand and five hundred, and the south side four thousand and five hundred, and on the east side four thousand and five hundred, and the west side four thousand and five hundred.", "17": "And the suburbs of the city shall be toward the north two hundred and fifty, and toward the south two hundred and fifty, and toward the east two hundred and fifty, and toward the west two hundred and fifty.", "18": "And the residue in length over against the oblation of the holy *portion shall be* ten thousand eastward, and ten thousand westward: and it shall be over against the oblation of the holy *portion*; and the increase thereof shall be for food unto them that serve the city.", "19": "And they that serve the city shall serve it out of all the tribes of Israel.", "20": "All the oblation *shall be* five and twenty thousand by five and twenty thousand: ye shall offer the holy oblation foursquare, with the possession of the city.", "21": "And the residue *shall be* for the prince, on the one side and on the other of the holy oblation, and of the possession of the city, over against the five and twenty thousand of the oblation toward the east border, and westward over against the five and twenty thousand toward the west border, over against the portions for the prince: and it shall be the holy oblation; and the s
