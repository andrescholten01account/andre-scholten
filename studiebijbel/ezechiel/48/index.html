 aan de zijde van de weg van Hethlon, waar men komt te Hamath, Hazar-Enan, de grens van Damaskus noordwaarts aan de zijde van Hamath (ook zal hij de oostkant en westkant hebben), zal Dan een deel hebben.","2":"En aan de grens van Dan, van de oostkant tot de westkant toe, Aser een.","3":"En aan de grens van Aser, van de oostkant af tot de westkant toe, Naftali een.","4":"En aan de grens van Naftali, van de oostkant tot de westkant toe, Manasse een.","5":"En aan de grens van Manasse, van de oostkant tot de westkant toe, Efraïm een.","6":"En aan de grens van Efraïm, van de oostkant tot de westkant toe, Ruben een.","7":"En aan de grens van Ruben, van de oostkant tot de westkant toe, Juda een.","8":"Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend *meetrieten* in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.","9":"Het hefoffer, dat u de HEERE zult offeren, zal zijn de lengte van vijfentwintigduizend, en de breedte van tienduizend.","10":"En daarin zal het heilig hefoffer zijn voor de priesters, noordwaarts de lengte van vijfentwintigduizend, en westwaarts de breedte van tienduizend, en oostwaarts de breedte van tienduizend, en zuidwaarts de lengte van vijfentwintigduizend; en het heiligdom van de HEERE zal in het midden daarvan zijn.","11":"Het zal zijn voor de priesters, die geheiligd zijn uit de kinderen van Zadok, die Mijn wacht waargenomen hebben; die niet gedwaald hebben, zoals de kinderen van Israël dwaalden; zoals de andere Levieten gedwaald hebben.","12":"En het geofferde van het hefoffer van het land zal hun allerheiligst zijn, aan de grens van de Levieten.","13":"Verder zullen de Levieten tegenover de grens van de priesters hebben de lengte van vijfentwintigduizend, en de breedte van tienduizend; de hele lengte zal zijn vijfentwintigduizend, en de breedte tienduizend.","14":"En zij zullen daarvan niets verkopen, noch de eerstelingen van het land verwisselen, noch overdragen; want het is heilig voor de HEERE.","15":"Maar de vijfduizend, dat is wat overgelaten is in de breedte, voor aan de vijfentwintigduizend, dat zal onheilig zijn, voor de stad, tot bewoning en tot voorsteden; en de stad zal in het midden daarvan zijn.","16":"En dit zullen haar maten zijn: de noordkant, vierduizend vijfhonderd *meetrieten*; en de zuidkant vierduizend vijfhonderd; en van de oostkant vierduizend vijfhonderd; en de westkant vierduizend vijfhonderd.","17":"De voorsteden nu van de stad zullen zijn, noordwaarts tweehonderdvijftig, en zuidwaarts tweehonderdvijftig, en oostwaarts tweehonderdvijftig, en westwaarts tweehonderdvijftig.","18":"En het overgelatene in de lengte, tegenover het heilig hefoffer, zal zijn tienduizend oostwaarts, en tienduizend westwaarts; en het zal tegenover het heilig hefoffer zijn; en de opbrengst daarvan zal wezen tot voedsel voor hen die de stad dienen.","19":"En zij die de stad dienen, zullen haar dienen uit alle stammen van Israël.","20":"Het hele hefoffer zal zijn van vijfentwintigduizend *meetrieten*, met vijfentwintigduizend; vierkant zult u het heilig hefoffer offeren, met de bezitting van de stad.","21":"En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend *meetrieten* van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.","22":"Van de bezitting nu van de Levieten, en van de bezitting van de stad af, in het midden van wat van de vorst zal zijn; wat tussen de grens van Juda en tussen de grens van Benjamin is, zal van de vorst zijn.","23":"Aangaande verder het overige van de stammen: van de oostkant tot de westkant toe, Benjamin een deel.","24":"En aan de grens van Benjamin, van de oostkant tot de westkant toe, Simeon een.","25":"En aan de grens van Simeon, van de oostkant tot de westkant toe, Issaschar een.","26":"En aan de grens van Issaschar, van de oostkant tot aan de westkant toe, Zebulon een.","27":"En aan de grens van Zebulon, van de oostkant tot de westkant toe, Gad een.","28":"Aan de grens nu van Gad, aan de zuidkant zuidwaarts, daar zal de grens zijn van Thamar af, naar het twistwater van Kades, vervolgens naar de beek heen, tot aan de grote zee.","29":"Dit is het land, dat u zult laten vallen in erfenis, voor de stammen van Israël, en dit zullen hun delen zijn, spreekt de Heere HEERE.","30":"Verder zullen dit de uitgangen van de stad zijn: van de noordkant, vierduizend vijfhonderd maten.","31":"En de poorten van de stad zullen zijn naar de namen van de stammen van Israël; drie poorten noordwaarts; een poort van Ruben, een poort van Juda, een poort van Levi.","32":"En aan de oostkant, vierduizend vijfhonderd *maten*, en drie poorten: namelijk, een poort van Jozef, een poort van Benjamin, een poort van Dan.","33":"De zuidkant ook vierduizend vijfhonderd maten, en drie poorten: een poort van Simeon, een poort van Issaschar, een poort van Zebulon.","34":"De westkant, vierduizend vijfhonderd; hun poorten drie: een poort van Gad, een poort van Aser, een poort van Naftali.","35":"Rondom achttienduizend; en de naam van de stad zal van die dag af zijn: DE Heere IS DAAR."},"SV":{"1":"Dit nu zijn de namen der stammen. Van het einde noordwaarts, aan de zijde des wegs van Hethlon, waar men komt te Hamath, Hazar-enan, de landpale van Damaskus, noordwaarts aan de zijde van Hamath (ook zal hij den ooster *hoek* *en* westerhoek hebben), *zal* Dan een *snoer* *hebben*.","2":"En aan de landpale van Dan, van den oosterhoek tot den westerhoek toe, Aser een.","3":"En aan de landpale van Aser, van den oosterhoek af tot den westerhoek toe, Nafthali een.","4":"En aan de landpale van Nafthali, van den oosterhoek tot den westerhoek toe, Manasse een.","5":"En aan de landpale van Manasse, van den oosterhoek tot den westerhoek toe, Efraïm een.","6":"En aan de landpale van Efraïm, van den oosterhoek tot den westerhoek toe, Ruben een.","7":"En aan de landpale van Ruben, van den oosterhoek tot den westerhoek toe, Juda een.","8":"Aan de landpale nu van Juda, van den oosterhoek tot den westerhoek toe, zal het hefoffer zijn, dat gijlieden zult offeren, vijf en twintig duizend *meetrieten* in breedte, en de lengte, als van een der *andere* delen, van den oosterhoek tot den westerhoek toe; en het heiligdom zal in het midden deszelven zijn.","9":"Het hefoffer, dat gijlieden den HEERE zult offeren, zal wezen de lengte van vijf en twintig duizend, en de breedte van tien duizend.","10":"En daarin zal het heilig hefoffer zijn voor de priesteren, noordwaarts *de* *lengte* van vijf en twintig duizend, en westwaarts de breedte van tien duizend, en oostwaarts de breedte van tien duizend, en zuidwaarts de lengte van vijf en twintig duizend; en het heiligdom des HEEREN zal in het midden deszelven zijn.","11":"Het zal zijn voor de priesteren, die geheiligd zijn uit de kinderen van Zadok, die Mijn wacht hebben waargenomen; die niet gedwaald hebben, als de kinderen Israëls dwaalden; gelijk als de *andere* Levieten gedwaald hebben.","12":"En het geofferde van het hefoffer des lands zal hunlieden een heiligheid der heiligheden zijn, aan de landpale der Levieten.","13":"Voorts zullen de Levieten tegenover de landpale der priesteren hebben de lengte van vijf en twintig duizend, en de breedte van tien duizend; de ganse lengte zal zijn vijf en twintig duizend, en de breedte tien duizend.","14":"En zij zullen daarvan niet verkopen, noch de eerstelingen des lands verwisselen, noch overdragen ; want het is een heiligheid den HEERE.","15":"Maar de vijf duizend, dat *is* hetgeen overgelaten is in de breedte, voor aan de vijf en twintig duizend, dat zal onheilig zijn, voor de stad, tot bewoning en tot voorsteden; en de stad zal in het midden daarvan zijn.","16":"En dit zullen haar maten zijn: de noorderhoek, vier duizend en vijfhonderd *meetrieten*; en de zuiderhoek vier duizend en vijfhonderd en van den oosterhoek vier duizend en vijfhonderd; en de westerhoek vier duizend en vijfhonderd.","17":"De voorsteden nu der stad zullen zijn, noordwaarts tweehonderd en vijftig, en zuidwaarts tweehonderd en vijftig, en oostwaarts tweehonderd en vijftig, en westwaarts tweehonderd en vijftig.","18":"En het overgelatene in de lengte, tegenover het heilig hefoffer, zal zijn tien duizend oostwaarts, en tien duizend westwaarts; en het zal tegenover het heilig hefoffer zijn; en de inkomst daarvan zal wezen tot onderhoud voor degenen, die de stad dienen.","19":"En die de stad dienen, zullen haar dienen uit alle stammen Israëls.","20":"Het ganse hefoffer zal zijn van vijf en twintig duizend *meetrieten*, met vijf en twintig duizend; vierkant zult gijlieden het heilig hefoffer offeren, met de bezitting der stad.","21":"En het overgelatene zal voor den vorst zijn, van deze en van gene zijde des heiligen hefoffers, en van de bezitting der stad, voor aan de vijf en twintig duizend *meetrieten* des hefoffers, tot aan de ooster *landpale* en westerlandpale, voor aan de vijf en twintig duizend aan de westerlandpale, tegenover de *andere* delen, *dat* zal voor den vorst zijn; en het heilig hefoffer, en het heiligdom des huizes, zal in het midden daarvan zijn.","22":"Van de bezitting nu der Levieten, en van de bezitting der stad af, zijnde in het midden van hetgeen des vorsten zal zijn; *wat* tussen de landpale van Juda, en tussen de landpale van Benjamin is, zal des vorsten zijn.","23":"Aangaande voorts het overige der stammen; van den oosterhoek tot den westerhoek toe, Benjamin een *snoer*.","24":"En aan de landpale van Benjamin, van den oosterhoek tot den westerhoek toe, Simeon een.","25":"En aan de landpale van Simeon, van den oosterhoek tot de westerhoek toe, Issaschar een.","26":"En aan de landpale van Issaschar, van den oosterhoek tot aan den westerhoek toe, Zebulon een.","27":"En aan de landpale van Zebulon, van den oosterhoek tot den westerhoek toe, Gad een.","28":"Aan de landpale nu van Gad, aan den zuiderhoek zuidwaarts, daar zal de landpale zijn van Thamar af, *naar* het twistwater van Kades, *voorts* naar de beek henen, tot aan de grote zee.","29":"Dit is het land, dat gijlieden zult doen vallen in erfenis, voor de stammen Israëls, en dit zullen hun delen zijn, spreekt de Heere HEERE.","30":"Voorts zullen dit de uitgangen der stad zijn: van den noorderhoek, vier duizend en vijfhonderd maten.","31":"En de poorten der stad zullen zijn naar de namen der stammen Israëls; drie poorten noordwaarts; een poort van Ruben, een poort van Juda, een poort van Levi.","32":"En aan den oosterhoek, vier duizend en vijfhonderd *maten*, en drie poorten: namelijk, een poort van Jozef, een poort van Benjamin, een poort van Dan.","33":"De zuiderhoek ook vier duizend en vijfhonderd maten, en drie poorten: een poort van Simeon, een poort van Issaschar, een poort van Zebulon.","34":"De westerhoek, vier duizend en vijfhonderd; derzelver poorten drie: een poort van Gad, een poort van Aser, een poort van Nafthali.","35":"Rondom achttien duizend; en de naam der stad zal van *dien* dag af zijn: DE Heere IS ALDAAR."},"KJV":{"1":"Now these *are* the names of the tribes. From the north end to the coast of the way of Hethlon, as one goeth to Hamath, Hazarenan, the border of Damascus northward, to the coast of Hamath; for these are his sides east *and* west; a *portion for* Dan.","2":"And by the border of Dan, from the east side unto the west side, a *portion for* Asher.","3":"And by the border of Asher, from the east side even unto the west side, a *portion for* Naphtali.","4":"And by the border of Naphtali, from the east side unto the west side, a *portion for* Manasseh.","5":"And by the border of Manasseh, from the east side unto the west side, a *portion for* Ephraim.","6":"And by the border of Ephraim, from the east side even unto the west side, a *portion for* Reuben.","7":"And by the border of Reuben, from the east side unto the west side, a *portion for* Judah.","8":"And by the border of Judah, from the east side unto the west side, shall be the offering which ye shall offer of five and twenty thousand *reeds in* breadth, and *in* length as one of the *other* parts, from the east side unto the west side: and the sanctuary shall be in the midst","9":"The oblation that ye shall offer unto the LORD *shall be* of five and twenty thousand in length, and of ten thousand in breadth.","10":"And for them, *even* for the priests, shall be *this* holy oblation; toward the north five and twenty thousand *in length*, and toward the west ten thousand in breadth, and toward the east ten thousand in breadth, and toward the south five and twenty thousand in length: and the sanctuary of the LORD shall be in the midst","11":"*It shall be* for the priests that are sanctified of the sons of Zadok; which have kept my charge, which went not astray when the children of Israel went astray, as the Levites went astray.","12":"And *this* oblation of the land that is offered shall be unto them a thing most holy by the border of the Levites.","13":"And over against the border of the priests the Levites *shall have* five and twenty thousand in length, and ten thousand in breadth: all the length *shall be* five and twenty thousand, and the breadth ten thousand.","14":"And they shall not sell of it, neither exchange, nor alienate the firstfruits of the land: for *it is* holy unto the LORD.","15":"And the five thousand, that are left in the breadth over against the five and twenty thousand, shall be a profane *place* for the city, for dwelling, and for suburbs: and the city shall be in the midst","16":"And these *shall be* the measures thereof; the north side four thousand and five hundred, and the south side four thousand and five hundred, and on the east side four thousand and five hundred, and the west side four thousand and five hundred.","17":"And the suburbs of the city shall be toward the north two hundred and fifty, and toward the south two hundred and fifty, and toward the east two hundred and fifty, and toward the west two hundred and fifty.","18":"And the residue in length over against the oblation of the holy *portion shall be* ten thousand eastward, and ten thousand westward: and it shall be over against the oblation of the holy *portion*; and the increase thereof shall be for food unto them that serve the city.","19":"And they that serve the city shall serve it out of all the tribes of Israel.","20":"All the oblation *shall be* five and twenty thousand by five and twenty thousand: ye shall offer the holy oblation foursquare, with the possession of the city.","21":"And the residue *shall be* for the prince, on the one side and on the other of the holy oblation, and of the possession of the city, over against the five and twenty thousand of the oblation toward the east border, and westward over against the five and twenty thousand toward the west border, over against the portions for the prince: and it shall be the holy oblation; and the sanctuary of the house *shall be* in the midst","22":"Moreover from the possession of the Levites, and from the possession of the city, *being* in the midst *of that* which is the prince's, between the border of Judah and the border of Benjamin, shall be for the prince.","23":"As for the rest of the tribes, from the east side unto the west side, Benjamin *shall have* a","24":"And by the border of Benjamin, from the east side unto the west side, Simeon *shall have* a","25":"And by the border of Simeon, from the east side unto the west side, Issachar a","26":"And by the border of Issachar, from the east side unto the west side, Zebulun a","27":"And by the border of Zebulun, from the east side unto the west side, Gad a","28":"And by the border of Gad, at the south side southward, the border shall be even from Tamar *unto* the waters of strife *in* Kadesh, *and* to the river toward the great sea.","29":"This *is* the land which ye shall divide by lot unto the tribes of Israel for inheritance, and these *are* their portions, saith the Lord GOD.","30":"And these *are* the goings out of the city on the north side, four thousand and five hundred measures.","31":"And the gates of the city *shall be* after the names of the tribes of Israel: three gates northward; one gate of Reuben, one gate of Judah, one gate of Levi.","32":"And at the east side four thousand and five hundred: and three gates; and one gate of Joseph, one gate of Benjamin, one gate of Dan.","33":"And at the south side four thousand and five hundred measures: and three gates; one gate of Simeon, one gate of Issachar, one gate of Zebulun.","34":"At the west side four thousand and five hundred, *with* their three gates; one gate of Gad, one gate of Asher, one gate of Naphtali.","35":"*It was* round about eighteen thousand *measures*: and the name of the city from *that* day *shall be*, The LORD *is* there."}},"tsk":{"1":[{"kopje":"de namen","refs":["Ex 1:1-5","Num 1:5-15","Num 13:4-15","Openb 7:4-8"]},{"kopje":"Van het einde","refs":["Ezech 47:15-17","Num 34:7-9"]},{"kopje":"Dan","refs":["Gen 30:3-6","Joz 19:40-47","Richt 18:26-29","2 Sam 24:2","1 Kon 12:28","1 Kon 12:29","Matt 20:15","Matt 20:16"]}],"2":[{"kopje":"Aser","refs":["Gen 30:12","Gen 30:13","Joz 19:24-31"]}],"3":[{"kopje":"Naftali","refs":["Gen 30:7","Gen 30:8","Joz 19:32-39"]}],"4":[{"kopje":"aan de grens","refs":["Ezech 45:1"]},{"kopje":"Manasse","refs":["Gen 30:22-24","Gen 41:51","Gen 48:5","Gen 48:14-20","Joz 13:29-31","Joz 17:1-11"]}],"5":[{"kopje":"Efraïm","refs":["Joz 16:1-10","Joz 17:8-10","Joz 17:14-18"]}],"6":[{"kopje":"Ruben","refs":["Gen 29:32","Gen 49:3","Gen 49:4","Joz 13:15-21"]}],"7":[{"kopje":"Juda","refs":["Gen 29:35","Joz 15:1-63","Joz 19:9"]}],"8":[{"kopje":"het hefoffer","refs":["Ezech 45:1-6"]},{"kopje":"het heiligdo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
