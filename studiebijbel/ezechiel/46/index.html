osten kijkt, moet de zes werkdagen gesloten zijn; maar op de sabbatdag moet zij geopend worden; ook moet zij geopend worden op de dag van de nieuwe maan.","2":"En de vorst zal binnengaan door de weg van het voorhuis van die poort van buiten, en zal staan bij de post van de poort; en de priesters zullen zijn brandoffers en zijn dankoffers bereiden, en hij zal aanbidden bij de drempel van de poort, en *daarna* uitgaan; maar de poort zal niet gesloten worden tot de avond.","3":"Ook zal het volk van het land aanbidden *voor* de deur van die poort, op de sabbatten en op de nieuwe manen, voor het aangezicht van de HEERE.","4":"Het brandoffer nu, dat de vorst de HEERE zal offeren, zal op de sabbatdag zijn: zes volkomen lammeren en een volkomen ram.","5":"En het spijsoffer, een efa bij de ram, maar bij de lammeren zal het spijsoffer een gave van zijn hand zijn; en olie, een hin bij een efa.","6":"Maar op de dag van de nieuwe maan, een var, een jong rund, van de volkomen dieren, en zes lammeren, en een ram; volkomen zullen ze zijn.","7":"En *als* spijsoffer zal hij bereiden een efa bij de var, en een efa bij de ram; maar bij de lammeren, naar wat zijn hand kan opbrengen; en een hin olie bij een efa.","8":"En als de vorst binnengaat, zal hij door de weg van het voorhuis van de poort binnengaan, en door diezelfde weg *weer* uitgaan.","9":"Maar als het volk van het land voor het aangezicht van de HEERE komt, op de vastgestelde feesten, dan zal wie door de weg van de noorderpoort binnengaat om te aanbidden, door de weg van de zuiderpoort *weer* uitgaan; en wie door de weg van de zuiderpoort binnengaat, zal door de weg van de noorderpoort *weer* uitgaan; hij zal niet terugkeren door de weg van de poort waardoor hij binnengekomen is, maar recht voor zich uit naar buiten gaan.","10":"De vorst nu zal in hun midden binnengaan, als zij binnengaan; en als zij uitgaan, zullen zij *samen* uitgaan.","11":"Verder, op de feesten en op de vastgestelde hoogtijden zal het spijsoffer zijn: een efa bij een var, en een efa bij een ram; maar bij de lammeren, een gave van zijn hand; en olie, een hin bij een efa.","12":"En als de vorst een vrijwillig offer zal brengen, een brandoffer of dankoffers *als* een vrijwillig offer voor de HEERE, dan zal men hem de poort openen die naar het oosten kijkt; en hij zal zijn brandoffer en zijn dankoffers brengen, zoals hij dat gedaan zal hebben op de sabbatdag; en als hij *weer* naar buiten gaat, zal men de poort sluiten, nadat hij naar buiten gegaan is.","13":"Verder zult u een volkomen eenjarig lam dagelijks bereiden *als* brandoffer voor de HEERE; elke morgen zult u dat bereiden.","14":"En u zult *als* spijsoffer daarbij doen, elke morgen een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bevochtigen; *als* een spijsoffer voor de HEERE, *als* eeuwige inzettingen, voortdurend.","15":"Zij zullen dan het lam, en het spijsoffer, en de olie elke morgen bereiden *als* een voortdurend brandoffer.","16":"Zo zegt de Heere HEERE: Wanneer de vorst aan iemand van zijn zonen een geschenk zal geven *van* zijn erfenis, dan zullen zijn zonen dat hebben; het zal hun bezitting zijn in erfenis.","17":"Maar wanneer hij van zijn erfenis een geschenk zal geven aan een van zijn knechten, dan zal die dat hebben tot het vrijjaar toe; dan zal het naar de vorst terugkeren; het is immers zijn erfenis, zijn zonen zullen het hebben.","18":"En de vorst zal niets nemen van de erfenis van het volk, door hen van hun bezitting te beroven; van zijn eigen bezitting zal hij zijn zonen erfenis nalaten; opdat niet Mijn volk, ieder uit zijn bezitting, verstrooid wordt.","19":"Daarna bracht hij mij door de ingang, die aan de zijkant van de poort was, naar de heilige kamers, die aan de priesters toebehoren, die naar het noorden lagen; en zie, daar was een plaats aan beide zijden, naar het westen.","20":"En hij zei tegen mij: Dit is de plaats waar de priesters het schuldoffer en het zondoffer zullen koken, *en* waar zij het spijsoffer zullen bakken, zodat zij het niet naar buiten hoeven te brengen naar het buitenste voorhof, om het volk te heiligen.","21":"Toen bracht hij mij naar het buitenste voorhof, en leidde mij om, langs de vier hoeken van de voorhof; en zie, in elke hoek van de voorhof was een apart voorhofje.","22":"In de vier hoeken van de voorhof waren voorhofjes, veertig el lang en dertig breed; deze vier hoekhofjes hadden allemaal dezelfde maat.","23":"En er was rondom in die hofjes een ringmuur, rondom deze vier; en er waren keukens gemaakt beneden bij de ringmuren, rondom.","24":"En hij zei tegen mij: Dit zijn de keukens waar de dienaars van het huis het slachtoffer van het volk zullen koken."},"SV":{"1":"Alzo zegt de Heere HEERE: De poort van het binnenste voorhof, die naar het oosten ziet; zal de zes werkdagen gesloten zijn; maar op den sabbatdag zal zij geopend worden; ook zal zij geopend worden op den dag van de nieuwe maan.","2":"En de vorst zal ingaan *door* den weg van het voorhuis derzelve poort van buiten, en zal staan aan den post van de poort; en de priesters zullen zijn brandofferen en zijn dankofferen bereiden, en hij zal aanbidden aan den dorpel der poort, en *daarna* uitgaan; doch de poort zal niet gesloten worden tot op den avond.","3":"Ook zal het volk des lands aanbidden *voor* de deur derzelve poort, op de sabbatten en op de nieuwe manen, voor het aangezicht des HEEREN.","4":"Het brandoffer nu, dat de vorst den HEERE zal offeren, zal op den sabbatdag zijn, zes volkomen lammeren, en een volkomen ram.","5":"En het spijsoffer, een efa tot den ram, maar tot de lammeren zal het spijsoffer een gave zijner hand zijn; en olie, een hin tot een efa.","6":"Maar op den dag van de nieuwe maan, een var, een jong rund, van de volkomene, en zes lammeren, en een ram; volkomen zullen zij zijn.","7":"En *ten* spijsoffer zal hij bereiden een efa tot den var, en een efa tot den ram; maar tot de lammeren, zoals zijn hand bekomen zal; en een hin olie tot een efa.","8":"En als de vorst ingaat, zal hij *door* den weg van het voorhuis der poort ingaan, en door deszelfs weg *weder* uitgaan.","9":"Maar als het volk des lands voor het aangezicht des HEEREN komt, op de gezette hoogtijden, die *door* den weg van de noorderpoort ingaat om te aanbidden, zal *door* den weg van de zuiderpoort *weder* uitgaan; en die *door* den weg van de zuiderpoort ingaat, zal *door* den weg van de noorderpoort *weder* uitgaan; hij zal niet wederkeren *door* den weg der poort, door dewelke hij is ingegaan, maar recht voor zich henen uitgaan.","10":"De vorst nu zal in het midden van hen ingaan, als zij ingaan; en als zij uitgaan, zullen zij *samen* uitgaan.","11":"Voorts op de feesten, en op de gezette hoogtijden zal het spijsoffer zijn, een efa tot een var, en een efa tot een ram; maar tot de lammeren, een gave zijner hand; en olie, een hin tot een efa.","12":"En als de vorst een vrijwillig offer zal doen, een brandoffer of dankofferen *tot* een vrijwillig offer den HEERE, zo zal men hem de poort openen, die naar het oosten ziet; en hij zal zijn brandoffer en zijn dankofferen doen, gelijk als hij zal gedaan hebben op den sabbatdag; en als hij *weder* uitgaat, zal men de poort sluiten, nadat hij uitgegaan zal zijn.","13":"Wijders zult gij een volkomen eenjarig lam dagelijks bereiden *ten* brandoffer den HEERE; alle morgens zult gij dat bereiden.","14":"En gij zult *ten* spijsoffer daarop doen, alle morgens een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bedruipen; *tot* een spijsoffer den HEERE, *tot* eeuwige inzettingen, geduriglijk.","15":"Zij zullen dan het lam, en het spijsoffer, en de olie alle morgens bereiden *tot* een gedurig brandoffer.","16":"Alzo zegt de Heere HEERE: Wanneer de vorst aan iemand van zijn zonen een geschenk zal geven *van* zijn erfenis, dat zullen zijn zonen hebben; het zal hun bezitting zijn in erfenis.","17":"Maar wanneer hij van zijn erfenis een geschenk zal geven aan een van zijn knechten, die zal dat hebben tot het vrijjaar toe; dan zal het tot den vorst wederkeren; het is immers zijn erfenis, zijn zonen zullen het hebben.","18":"En de vorst zal niets nemen van de erfenis des volks, om hen van hun bezitting te beroven; van zijn bezitting zal hij zijn zonen erf nalaten; opdat niet Mijn volk, een iegelijk uit zijn erfenis, verstrooid worde.","19":"Daarna bracht hij mij door den ingang, die aan de zijde der poort was, tot de heilige kameren, den priesteren toe *behorende*, die naar het noorden zagen, en ziet, aldaar was een plaats aan beide zijden, naar het westen.","20":"En hij zeide tot mij: Dit is de plaats, alwaar de priesters het schuldoffer en het zondoffer zullen koken; *en* waar zij het spijsoffer zullen bakken, opdat zij het niet uitbrengen in het buitenste voorhof, om het volk te heiligen.","21":"Toen bracht hij mij in het buitenste voorhof, en voerde mij om in de vier hoeken des voorhofs; en ziet, in elken hoek des voorhofs was een ander voorhofje.","22":"In de vier hoeken des voorhofs waren voorhofjes met schoorstenen, van veertig *ellen* de lengte, en dertig de breedte; dezelve vier hoekhofjes hadden enerlei maat.","23":"En er was rondom in dezelve een ringmuur, rondom deze vier; en er waren keukens gemaakt beneden *aan* de ringmuren rondom.","24":"En hij zeide tot mij: Dit zijn de keukens, alwaar de dienaars des huizes het slachtoffer des volks zullen koken."},"KJV":{"1":"Thus saith the Lord GOD; The gate of the inner court that looketh toward the east shall be shut the six working days; but on the sabbath it shall be opened, and in the day of the new moon it shall be opened.","2":"And the prince shall enter by the way of the porch of *that* gate without, and shall stand by the post of the gate, and the priests shall prepare his burnt offering and his peace offerings, and he shall worship at the threshold of the gate: then he shall go forth; but the gate shall not be shut until the evening.","3":"Likewise the people of the land shall worship at the door of this gate before the LORD in the sabbaths and in the new moons.","4":"And the burnt offering that the prince shall offer unto the LORD in the sabbath day *shall be* six lambs without blemish, and a ram without blemish.","5":"And the meat offering *shall be* an ephah for a ram, and the meat offering for the lambs as he shall be able to give, and an hin of oil to an ephah.","6":"And in the day of the new moon *it shall be* a young bullock without blemish, and six lambs, and a ram: they shall be without blemish.","7":"And he shall prepare a meat offering, an ephah for a bullock, and an ephah for a ram, and for the lambs according as his hand shall attain unto, and an hin of oil to an ephah.","8":"And when the prince shall enter, he shall go in by the way of the porch of *that* gate, and he shall go forth by the way","9":"But when the people of the land shall come before the LORD in the solemn feasts, he that entereth in by the way of the north gate to worship shall go out by the way of the south gate; and he that entereth by the way of the south gate shall go forth by the way of the north gate: he shall not return by the way of the gate whereby he came in, but shall go forth over against","10":"And the prince in the midst of them, when they go in, shall go in; and when they go forth, shall go forth.","11":"And in the feasts and in the solemnities the meat offering shall be an ephah to a bullock, and an ephah to a ram, and to the lambs as he is able to give, and an hin of oil to an ephah.","12":"Now when the prince shall prepare a voluntary burnt offering or peace offerings voluntarily unto the LORD, *one* shall then open him the gate that looketh toward the east, and he shall prepare his burnt offering and his peace offerings, as he did on the sabbath day: then he shall go forth; and after his going forth *one* shall shut the gate.","13":"Thou shalt daily prepare a burnt offering unto the LORD *of* a lamb of the first year without blemish: thou shalt prepare it every morning.","14":"And thou shalt prepare a meat offering for it every morning, the sixth part of an ephah, and the third part of an hin of oil, to temper with the fine flour; a meat offering continually by a perpetual ordinance unto the LORD.","15":"Thus shall they prepare the lamb, and the meat offering, and the oil, every morning *for* a continual burnt offering.","16":"Thus saith the Lord GOD; If the prince give a gift unto any of his sons, the inheritance thereof shall be his sons'; it *shall be* their possession by inheritance.","17":"But if he give a gift of his inheritance to one of his servants, then it shall be his to the year of liberty; after it shall return to the prince: but his inheritance shall be his sons'","18":"Moreover the prince shall not take of the people's inheritance by oppression, to thrust them out of their possession; *but* he shall give his sons inheritance out of his own possession: that my people be not scattered every man from his possession.","19":"After he brought me through the entry, which *was* at the side of the gate, into the holy chambers of the priests, which looked toward the north: and, behold, there *was* a place on the two sides westward.","20":"Then said he unto me, This *is* the place where the priests shall boil the trespass offering and the sin offering, where they shall bake the meat offering; that they bear *them* not out into the utter court, to sanctify the people.","21":"Then he brought me forth into the utter court, and caused me to pass by the four corners of the court; and, behold, in every corner of the court *there was* a court.","22":"In the four corners of the court *there were* courts joined of forty *cubits* long and thirty broad: these four corners *were* of one measure.","23":"And *there was* a row *of building* round about in them, round about them four, and *it was* made with boiling places under the rows round about.","24":"Then said he unto me, These *are* the places of them that boil, where the minist an> toward the <span class=\"wl wl-kjv\" data-code=\"H6921\">east</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">working</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> but on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H6605\">opened,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moon</span> it shall be opened.","2":"And the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H197\">porch</span> of that <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> by the <span class=\"wl wl-kjv\" data-code=\"H4201\">post</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> his burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and his peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> at the <span class=\"wl wl-kjv\" data-code=\"H4670\">threshold</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate:</span> then he shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth;</span> but the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> until the evening.","3":"Likewise the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of this <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths</span> and in the new moons.","4":"And the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> that the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish,</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> without blemish.","5":"And the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> shall be an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> for a <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> for the <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> as he shall be <span class=\"wl wl-kjv\" data-code=\"H3027\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H4991\">give,</span> and an <span class=\"wl wl-kjv\" data-code=\"H1969\">hin</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> to an ephah.","6":"And in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moon</span> it shall be a <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish,</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs,</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram:</span> they shall be without blemish.","7":"And he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> for a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> for a <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> according as his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall <span class=\"wl wl-kjv\" data-code=\"H5381\">attain</span> unto, and an <span class=\"wl wl-kjv\" data-code=\"H1969\">hin</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> to an ephah.","8":"And when the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> in by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H197\">porch</span> of that <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and he shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> by the way","9":"But when the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts,</span> he that <span class=\"wl wl-kjv\" data-code=\"H935\">entereth</span> in by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate;</span> and he that <span class=\"wl wl-kjv\" data-code=\"H935\">entereth</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate:</span> he shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> whereby he came <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> but shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> over against","10":"And the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them, when they go <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> shall go <span class=\"wl wl-kjv\" data-code=\"H935\">in;</span> and when they go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> shall go forth.","11":"And in the <span class=\"wl wl-kjv\" data-code=\"H2282\">feasts</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4150\">solemnities</span> the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> shall be an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> to a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> to a <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> as he is <span class=\"wl wl-kjv\" data-code=\"H3027\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H4991\">give,</span> and an <span class=\"wl wl-kjv\" data-code=\"H1969\">hin</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> to an ephah.","12":"Now when the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> a <span class=\"wl wl-kjv\" data-code=\"H5071\">voluntary</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> or peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings</span> <span class=\"wl wl-kjv\" data-code=\"H5071\">voluntarily</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> one shall then <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> him the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> that <span class=\"wl wl-kjv\" data-code=\"H6437\">looketh</span> toward the <span class=\"wl wl-kjv\" data-code=\"H6921\">east,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> his burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and his peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> as he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> then he shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth;</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> his going <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> one shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the gate.","13":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of a <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> it <span class=\"wl wl-kjv\" data-code=\"H1242\">every</span> morning.","14":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> for it every <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> the sixth <span class=\"wl wl-kjv\" data-code=\"H8345\">part</span> of an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah,</span> and the third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> of an <span class=\"wl wl-kjv\" data-code=\"H1969\">hin</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> to temper <span class=\"wl wl-kjv\" data-code=\"H7450\">with</span> the fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour;</span> a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> by a <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> unto the LORD.","15":"Thus shall they <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb,</span> and the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> every <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> for a <span class=\"wl wl-kjv\" data-code=\"H8548\">continual</span> burnt offering.","16":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> If the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> a <span class=\"wl wl-kjv\" data-code=\"H4979\">gift</span> unto <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> of his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> thereof shall be his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons';</span> it shall be their <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> by inheritance.","17":"But if he <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> a <span class=\"wl wl-kjv\" data-code=\"H4979\">gift</span> of his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> then it shall be his to the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H1865\">liberty;</span> after it shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince:</span> but his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> shall be his sons'","18":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> shall not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people's</span> <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> by <span class=\"wl wl-kjv\" data-code=\"H3238\">oppression,</span> to <span class=\"wl wl-kjv\" data-code=\"H3238\">thrust</span> them out of their <span class=\"wl wl-kjv\" data-code=\"H272\">possession;</span> but he shall give his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H5157\">inheritance</span> out of his own <span class=\"wl wl-kjv\" data-code=\"H272\">possession:</span> that my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> be not <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from his possession.","19":"After he <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> me through the <span class=\"wl wl-kjv\" data-code=\"H3996\">entry,</span> which was at the <span class=\"wl wl-kjv\" data-code=\"H3802\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> into the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H3957\">chambers</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> which <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> toward the <span class=\"wl wl-kjv\" data-code=\"H6828\">north:</span> and, behold, there was a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> on the two <span class=\"wl wl-kjv\" data-code=\"H3411\">sides</span> westward.","20":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto me, This is the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall <span class=\"wl wl-kjv\" data-code=\"H1310\">boil</span> the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> and the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> where they shall <span class=\"wl wl-kjv\" data-code=\"H644\">bake</span> the meat <span class=\"wl wl-kjv\" data-code=\"H4503 s his hand shall attain unto, [Or shall have gotten. Compare above verse 5 and the phrase with Num. 6.21 also Lev. 5.11. And 12.18 and 14.21 and 25.28, c] and an bi of oil to an Epha."}],"8":[{"catchword":null,"tekst":"And when the prince entreth, he shall go in (by) the way of the porch of the gate, and (he shall) go forth [Or go on] (again) by way thereof. [Or his way]"}],"9":[{"catchword":null,"tekst":"But when the people of the land came before the face of the LORD on the appointed solemnities; he that entreth in (by) the way of the north-gate to worship, shall go out (again by) the way of the south-gate: and be that entreth (by) the way the way of the south-gate, shall go forth (again by) the way of the north-gate: he shall not return (by) the way of the gate whereby he went in, [Some compare this with Luk 17:32. ! Cor. 9.24. Phil 1.13,14 also Gal. 4.9. and 5.7. 2Pe 2:20, 23, 22.] But (shall) go forth straight forward [Others, they shall go forth right over against it]"}],"10":[{"catchword":null,"tekst":"Now the prince shall go in the midst of them, [to wit, among the people of the land] when they go in, and when they go forth, [Others, go on: and so immediately again] they shall go forth (together)"}],"11":[{"catchword":null,"tekst":"Moreover, on the feasts and on the appointment solemnities, the meat offering shall be an Epha to the bullock and on Epha to a ram; but to the lambs, a gift of his hand: [as above verse 5.7] and oil, an hin to an Epha."}],"12":[{"catchword":null,"tekst":"And when the prince shall make a free-will-offering, a burnt-offering, or thank-offering (for) a free-will-offering unto the LORD, one shall then open him the gate that looketh towards the east; and he shall make his burnt-offering and his thank-offerings, according as he shall have done on the Sabbath-day: and when he goeth forth (again) one shall shut the gate after that he shall be goneforth."}],"13":[{"catchword":null,"tekst":"Moreover, thou shalt dayly prepare aperfect lamb of a year old [Heb. a son of his year] (for) a burnt-offering unto the LORD: thou shalt prepare it every morning. [Heb. in the morning, in the morning, that is, every morning. So in the sequel. Compare this ordinance with Num. 28.3,4. Here no mention is made of the evening sacrifice. Compare Heb 9:26]"}],"14":[{"catchword":null,"tekst":"And thou shalt add thereto (for) a meat-offering every morning a fixth part of an Epha, and oil a third part of a hin, to drop the meal floure: (for) a meat-offering unto the LORD, (for) everlasting Ordinances [Heb ordinances of eternity] continually."}],"15":[{"catchword":null,"tekst":"They shall then prepare the lamb and the meat-offering, and the oil every morning, (for) a continual burnt-offering, (properly ascension) of continuance]"}],"16":[{"catchword":null,"tekst":"Thus saith the Lord LORD; when the prince shall give a gift (of) his inheritance unto any of his sons [Or children] his sons shall have it: [it shall continue to be his sons, they shall keep it. So in the sequel] it shall be their possession by inheritance."}],"17":[{"catchword":null,"tekst":"But when he shall give a gift of inheritance to one of his servants, he shall have it to the free year; [otherwise called the year of Jubile. See Levit. 25.10, c.] Then it shall return to the prince: it is indeed his inheritance, his sons shall have it. [As for the lord Christ, he giveth to his elect and true children durable and everlasting gifts, an everlasting inheritance, and that of his own, for all that the father hath is his, Joh 16:15 and he is heir of all things, Heb. 1.2. doing with his own what he will, Matth. 20.15. But unto others, which do also like servants&acirc;&euro;&trade; minister in his house, he giveth temporal gifts. Compare Matth. 7.22,23 and 23.21,23 and 35.14, c. Luk 19:1, &c. and see Joh 8:35, &c. it may be also a lesson for Christian magistrates of liberality and rewarding of good services, also of justice towards their subjects: and so in general a d me about in the four corners of the court: and behold, to every corner of the court (there) was another little court, [Heb. a court in a corner of the court, a court in a corner of the court, that is, in every corner of the great court there was a little court]"}],"22":[{"catchword":null,"tekst":"In the four corner of the court (there) were little courts with chimneys; [Or smoke-places. Heb. as if one should say, chimneyed or smoked; that is, made with chimneys or holes to convey the smoke away. Others, joined, as kitchins are often joined to the building: but this cannot take place without changing of a letter in the Hebrew word] of forty (ells) the length, and thirty the breadth: those four corner-little-courts [meaning the forementioned four kitchens that were in the corners of the court. Heb. square or cornered] had one kind of measure."}],"23":[{"catchword":null,"tekst":"And there was round about in them [In the kitchins] a ring-wall [In Hebrew word signifieth properly a row, or an high building, that goeth all along like a raw. Some understand it not of a wall, but of a high sloping roof for defence of the building] round about those four: and there were made kitchins [or boiling places; or it was made (with) c.] below (at) the ring-wals [others, under the portals, or little courts: meaning that they boiled and dressed their meat below as in kitchins, and id eat above] round about."}],"24":[{"catchword":null,"tekst":"And he said unto me, these are the kitchins, [Heb. the house, or the place of cooking ones of them that cook] where the ministers of the house shall cook the slay-offering [that is, the flesh of the slay-offering, as verse 20] of the people."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
