ezicht tegen de bergen van Israël, en profeteer tegen hen;","3":"En zeg: Bergen van Israël, hoor het woord van de Heere HEERE! Zo zegt de Heere HEERE tot de bergen en tot de heuvels, tot de beken en tot de dalen: Zie, Ik, Ik breng over u het zwaard, en Ik zal uw hoogten verwoesten.","4":"Daarbij zullen uw altaren verwoest worden, en uw zonnebeelden[1] verbroken worden; en Ik zal uw gesneuvelden neervellen voor het aangezicht van uw drekgoden[2].","5":"En Ik zal de dode lichamen van de kinderen van Israël voor het aangezicht van hun drekgoden leggen, en Ik zal uw beenderen rondom uw altaren strooien.","6":"In al uw woonplaatsen zullen de steden verwoest en de hoogten tot wildernis worden, zodat uw altaren woest en eenzaam zijn, en uw drekgoden verbroken worden en ophouden, en uw zonnebeelden afgehouwen, en uw werken uitgewist worden.","7":"En de gesneuvelden zullen in uw midden liggen, zodat u weet dat Ik de HEERE ben.","8":"Ik zal dan nog een overblijfsel laten over, doordat u er enigen zult hebben, die het zwaard ontkomen onder de heidenvolken, wanneer u in de landen verstrooid wordt.","9":"Dan zullen wie van u ontkomen waren aan Mij denken onder de heidenvolken, waarheen zij gevankelijk zullen worden weggevoerd, omdat Ik verbroken ben door hun hoerachtige hart, dat van Mij afgeweken is, en door hun ogen, die hun drekgoden nahoereren; en zij zullen een walging aan zichzelf hebben over de slechte daden, die zij in al hun gruwelen gedaan hebben.","10":"En zij zullen weten dat Ik de HEERE ben; Ik heb niet zonder reden gesproken over het aandoen van dit kwaad aan hen.","11":"Zo zegt de Heere HEERE: Sla met uw hand, en stamp met uw voet, en zeg: Ach, over alle gruwelen van de slechte daden van het huis van Israël; want zij zullen door het zwaard, door de honger en door de pest vallen.","12":"Wie ver weg is, zal door de pest sterven, en wie dichtbij is, zal door het zwaard vallen; maar wie overgebleven en belegerd is, zal door honger sterven; zo zal Ik Mijn grimmigheid tegen hen volbrengen.","13":"Dan zult u weten dat Ik de HEERE ben, als hun gesneuvelden in het midden van hun drekgoden rondom hun altaren zullen liggen op alle hoge heuvels, op alle toppen van de bergen, en onder elke groene boom, en onder elke dichte eik, de plaats waar zij aan al hun drekgoden een liefelijke reuk brachten.","14":"Daarom zal Ik Mijn hand over hen uitstrekken, en zal het land woest maken, ja, woester dan de woestijn, tot Diblath toe, in al hun woonplaatsen; en zij zullen bevinden dat Ik de HEERE ben."},"SV":{"1":"En het woord des HEEREN geschiedde tot mij, zeggende:","2":"Mensenkind, zet uw aangezicht tegen de bergen Israëls, en profeteer tegen dezelve;","3":"En zeg: Gij bergen Israëls, hoort het woord des Heeren HEEREN! Zo zegt de Heere HEERE tot de bergen en tot de heuvelen, tot de beken en tot de dalen: Ziet, Ik, Ik breng over u het zwaard, en Ik zal uw hoogten verderven.","4":"Daartoe zullen uw altaren verwoest, en uw zonnebeelden verbroken worden; en Ik zal uw verslagenen nedervellen voor het aangezicht uwer drekgoden.","5":"En Ik zal de dode lichamen der kinderen Israëls voor het aangezicht hunner drekgoden leggen, en Ik zal uw beenderen rondom uw altaren strooien.","6":"In al uw woningen zullen de steden verwoest en de hoogten tot wildernis worden, opdat uw altaren woest en eenzaam zijn, en uw drekgoden verbroken worden en ophouden, en uw zonnebeelden afgehouwen, en uw werken uitgedelgd worden.","7":"En de verslagenen zullen in het midden van u liggen, opdat gij weet, dat Ik de HEERE ben.","8":"Ik zal dan nog een overblijfsel laten, als gij *enigen* zult hebben, die het zwaard ontkomen onder de heidenen, wanneer gij in de landen zult verstrooid worden.","9":"Dan zullen uw ontkomenen Mijner gedenken onder de heidenen, waar zij gevankelijk zullen geworden zijn, omdat Ik verbroken ben door hun hoerachtig hart, dat van Mij afgeweken is, en door hun ogen, die hun drekgoden nahoereren; en zij zullen een walging aan zichzelven hebben over de boosheden, die zij in al hun gruwelen gedaan hebben.","10":"En zij zullen weten, dat Ik de HEERE ben; Ik heb niet tevergeefs gesproken, van hun dit kwaad aan te doen.","11":"Zo zegt de Heere HEERE: Sla met uw hand, en stamp met uw voet, en zeg: Ach, over alle gruwelen der boosheden van het huis Israëls; want zij zullen door het zwaard, door den honger en door de pestilentie vallen.","12":"Die verre af is, zal door de pest sterven, en die nabij is, zal door het zwaard vallen; maar die overgebleven en belegerd is, zal door honger sterven; alzo zal Ik Mijn grimmigheid tegen hen volbrengen.","13":"Dan zult gij weten, dat Ik de HEERE ben, als hun verslagenen in het midden hunner drekgoden rondom hun altaren wezen zullen op alle hoge heuvelen, op alle toppen der bergen, en onder allen groenen boom, en onder alle dichte eiken, de plaats, alwaar zij al hun drekgoden liefelijken reuk maakten.","14":"Daarom zal Ik Mijn hand over hen uitstrekken, en zal het land woest maken, ja, woester dan de woestijn naar Diblath henen, in al hun woningen; en zij zullen bevinden, dat Ik de HEERE ben."},"KJV":{"1":"And the word of the LORD came unto me, saying,","2":"Son of man, set thy face toward the mountains of Israel, and prophesy","3":"And say, Ye mountains of Israel, hear the word of the Lord GOD; Thus saith the Lord GOD to the mountains, and to the hills, to the rivers, and to the valleys; Behold, I, *even* I, will bring a sword upon you, and I will destroy your high places.","4":"And your altars shall be desolate, and your images shall be broken: and I will cast down your slain *men* before your idols.","5":"And I will lay the dead carcases of the children of Israel before their idols; and I will scatter your bones round about your altars.","6":"In all your dwellingplaces the cities shall be laid waste, and the high places shall be desolate; that your altars may be laid waste and made desolate, and your idols may be broken and cease, and your images may be cut down, and your works may be abolished.","7":"And the slain shall fall in the midst of you, and ye shall know that I *am* the LORD.","8":"Yet will I leave a remnant, that ye may have *some* that shall escape the sword among the nations, when ye shall be scattered through the countries.","9":"And they that escape of you shall remember me among the nations whither they shall be carried captives, because I am broken with their whorish heart, which hath departed from me, and with their eyes, which go a whoring after their idols: and they shall lothe themselves for the evils which they have committed in all their abominations.","10":"And they shall know that I *am* the LORD, *and that* I have not said in vain that I would do this evil","11":"Thus saith the Lord GOD; Smite with thine hand, and stamp with thy foot, and say, Alas for all the evil abominations of the house of Israel! for they shall fall by the sword, by the famine, and by the pestilence.","12":"He that is far off shall die of the pestilence; and he that is near shall fall by the sword; and he that remaineth and is besieged shall die by the famine: thus will I accomplish my fury","13":"Then shall ye know that I *am* the LORD, when their slain *men* shall be among their idols round about their altars, upon every high hill, in all the tops of the mountains, and under every green tree, and under every thick oak, the place where they did offer sweet savour to all their idols.","14":"So will I stretch out my hand upon them, and make the land desolate, yea, more desolate than the wilderness toward Diblath, in all their habitations: and they shall know that I *am* the LORD."}},"tsk":{"1":[{"kopje":"En het woord","refs":["Ezech 6:1"]}],"2":[{"kopje":"richt","refs":["Ezech 4:7","Ezech 13:17","Ezech 20:46","Ezech 21:2","Ezech 25:2","Ezech 38:2","Ezech 38:3"]},{"kopje":"de bergen","refs":["Ezech 19:9","Ezech 33:28","Ezech 34:14","Ezech 35:12","Ezech 37:22","Joz 11:21","Micha 6:1","Micha 6:2"]}],"3":[{"kopje":"Bergen van Israël","refs":["Ezech 36:1-4" n Israëls","tekst":"Dat is, Ik zal hen niet alleen laten vermoorden voor hunne afgoden, maar zal ook hunne dode lichamen en de stukken daarvan laten liggen, en maken verstrooid te worden nabij hun afgodische altaren, om die daarmede te verontreinigen. Want de dode lichamen der mensen waren zeer verfoeilijk gehouden nabij de altaren en offeranden."},{"catchword":"leggen,","tekst":"Hebreeuws eigenlijk, geven."}],"6":[{"catchword":"In al uw woningen","tekst":"Dat is, in alle plaats, waar gij zoudt mogen wonen."},{"catchword":"en uw werken","tekst":"Versta, de beelden en afgoden met al hun afgodisch tuig, door mensenhanden gemaakt; zie 2Ki 22:17 ."}],"7":[{"catchword":"liggen,","tekst":"Hebreeuws, vallen; vallen voor liggen; zie Jer 9:22 ."},{"catchword":"gij weet,","tekst":"Zie boven Eze 5:13 ."},{"catchword":"HEERE ben","tekst":"Dat is, de enige en ware God, die dit door mijne profeten gesproken heb, en metterdaad betonen zal dat Ik waarachtig en rechtvaardig ben. Alzo onder vs.10, en Eze 11:10 , en Eze 12:15 , enz."}],"8":[{"catchword":"die het zwaard ontkomen","tekst":"Hebreeuws, ontkomers des zwaards. Versta degenen, die wel ballingen zouden moeten worden in vreemde landen, maar door Gods genade tot hun best in het leven zouden overblijven, opdat God zich hier altijd een zeker volk in het midden van alle verwoestingen behield."}],"9":[{"catchword":"Mijner gedenken","tekst":"Te weten die zij, in hun voorspoed zijnde en in wellusten levende, vergeten hadden. God te gedenken is hier tot Hem weder te keren, met verzaking van het voorgaande leven. Vergelijk Jer 51:50 ."},{"catchword":"verbroken ben","tekst":"Dat is, mij bekommerd of gekweld heb. Zo wordt menselijkerwijze van God gesproken, om te tonen dat de zonden der Joden Hem zeer mishaagden, en den loop zijner weldaden aan hen verhinderen en afbraken."},{"catchword":"hoerachtig hart,","tekst":"Versta dit van het geestelijk hoerdom, hetwelk is afgoderij. Zie Lev 17:7 , en Lev 20:5 ."},{"catchword":"ogen,","tekst":"Vergelijk onder Eze 20:24 ."},{"catchword":"een walging","tekst":"Dat is, zichzelven met smartelijke droefheid en doorsnijding des harten verfoeien vanwege hun voorgaande leven, en zich tot God bekeren. Vergelijk onder Eze 20:43 , en Eze 36:31 ."},{"catchword":"aan zichzelven hebben","tekst":"Hebreeuws, in hunne aangezichten; dat is, aan zichzelven."},{"catchword":"over de boosheden,","tekst":"Het Hebreeuwse woord is ook alzo genomen 1Ki 21:22 ; 2Ki 7:7 , en hier in vs.11."}],"10":[{"catchword":"zullen weten,","tekst":"Zie boven Eze 5:138 ."},{"catchword":"tevergeefs gesproken,","tekst":"Te weten omdat mijne trouw vereist dat Ik hen zo vermanen en dreigen zou door mijne profeten en mijne gerechtigheid dat Ik hen zo verderven zou door hunne vijanden."}],"11":[{"catchword":"Sla met uw hand,","tekst":"Te weten tot een teken van droefheid en zwarigheid, die gij maken zult over de zonden van het volk en de straffen, die daarop volgen zullen. Vergelijk Num 24:10 , en de aantekening. Het handslaan, of klappen [doch met andere woorden in het oorspronkelijke] is ook gebruikt geweest als teken van verachting. Zie Job 34:37 ; Lam 2:15 ; ja zelfs als teken van vreugde, Psa 47:2 , en Psa 98:8 ; onder Eze 25:6 ; en van verbintenissen; Job 17:3 ."},{"catchword":"en stamp met uw voet,","tekst":"Ook tot een teken van droefheid. Een gelijk teken is, op de dij of heup kloppen; Jer 31:19 ; onder Eze 21:12 ."},{"catchword":"vallen","tekst":"Dat is, vergaan en ontkomen. Zie Gen 14:10 , en de aantekening; Lev 26:7 , en de aantekening."}],"12":[{"catchword":"verre af is,","tekst":"Versta, degenen, die in de omliggende landen zouden gevlucht zijn, of hier en daar in bossen en spelonken zich versteken zouden."},{"catchword":"nabij is,","tekst":"Dat is, die in de handen der Chaldeën vallen zouden."},{"catchword":"belegerd is,","tekst":"Te weten in de stad Jeruzalem. Anders: behoed is."}],"13":[{"catchword":"alle hoge heuvelen,","tekst":"Zie Deu 12:2 ; 1Ki 14:23 ; 2Ki 16:4 ."},{"catchword":"dichte eiken,","tekst":"Dat is, zeer dicht getakte."},{"catchword":"liefelijken reuk maakten","tekst":"Hebreeuws, den reuk der rust; te weten van offeranden of reukwerk, waarin zij meenden dat hunne afgoden rust, vermaak en welbehagen hadden, en nabootsten alzo wat God ingesteld had. Zie Gen 8:21 , en Lev 26:31 ."}],"14":[{"catchword":"de woestijn","tekst":"Men meent dat deze woestijn gelegen is geweest in het land der Moabieten, zeer afgrijselijk vanwege haar buitengewone woestheid, waardoor de Israëlieten passeerden als ze eerst in het land Kanaän zouden komen; Num 33:47 ; Jer 48:22 ."},{"catchword":"Diblath henen,","tekst":"Eene stad in het voorgemelde land der Moabieten, zo men meent, anders genaamd Diblathaïm; Jer 48:22 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the word of the Lord came unto me saying:"}],"2":[{"catchword":null,"tekst":"Child of man set thy face against the mountains of Israel [that is take a strong resolution and make thy self ready to prophesie boldly and undauntedly against them so below chap 13.17 and 20.4 and 21.2 and 25.2 and 28.21 and 35.2 and 38. 2 against the mountains of Israel to wit that there were near and round about Jerusalem see Psal 125.2 meaning the land and kingdom of Juda which is called Israel not only the Jews as well as the Israelites descended from the patriarch Israel that is, Jacob but for other causes also mentioned 2 Chron 15 on vers 17 and 21 on vers 2 ] and prophesie against them ."}],"3":[{"catchword":null,"tekst":"And say ye mountains of Israel [meaning the men that dwelt upon the mountains so must in the following words hills brooks and valleys be taken namely for those that had their habitations upon or by or in the woods compare Jugd 1.19 Psal 98.8 below chap 36 .1Mich 6.1,2 ] hear the word of the Lord LORD thus saith the Lord LORD to the mountains and to the hills and to the brooks [or steams floods gulfs that strongly spread forth their course into the land so is the word taken Job 6:15 belo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
