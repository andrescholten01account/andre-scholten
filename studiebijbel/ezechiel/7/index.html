<style>

nd, zo zegt de Heere HEERE, van het land van Israël: Het einde is er, het einde is gekomen over de vier hoeken van het land.","3":"Nu is het einde over u; want Ik zal Mijn toorn tegen u zenden, en Ik zal u richten naar uw wegen, en Ik zal op u brengen al uw gruwelen.","4":"En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben.","5":"Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen;","6":"Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het *kwaad* is gekomen!","7":"De morgenstond is tot u gekomen, o inwoner van het land, de tijd is gekomen, de dag van de opschudding is nabij, en er is geen weerklank van de bergen.","8":"Nu zal Ik binnenkort Mijn grimmigheid over u uitgieten, en Mijn toorn tegen u volbrengen, en u richten naar uw wegen, en zal op u brengen al uw gruwelen.","9":"En Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal u geven naar uw wegen, en uw gruwelen zullen in het midden van u zijn; en u zult weten dat Ik de HEERE ben, Die slaat.","10":"Zie, de dag, zie, *de morgenstond* is gekomen, de morgenstond is voortgekomen, de roede heeft gebloeid, de hoogmoed heeft gebloeid.","11":"Het geweld is opgerezen tot een roede van de goddeloosheid; niets van hen zal *overblijven*, noch van hun menigte, noch van hun gedruis, en geen klaagzang zal over hen zijn.","12":"De tijd is gekomen, de dag is genaderd; de koper zij niet blij, en de verkoper klaagt niet; want een brandende toorn is over de gehele menigte van het *land*.","13":"Want de verkoper zal tot het verkochte niet terugkeren, ook al zouden zij nog onder de levenden zijn; omdat het visioen aangaande de gehele menigte van het *land* niet zal terugkeren; en niemand zal door zijn ongerechtigheid zijn leven sterken.","14":"Zij hebben op de trompet geblazen, en hebben alles klaargemaakt, maar niemand trekt ten strijde; want Mijn brandende toorn is over de gehele menigte van het *land*.","15":"Het zwaard is buiten, en de pest en de honger van binnen; die op het veld is, zal door het zwaard sterven, en die in de stad is, die zal de honger en de pest verteren.","16":"En hun ontkomenen zullen *wel* ontkomen, maar zij zullen op de bergen zijn, zij allen zullen zijn als duiven van de dalen, kermend, ieder om zijn ongerechtigheid.","17":"Alle handen zullen slap worden, en alle knieën zullen wegvloeien *als* water.","18":"Ook zullen zij zakken aangorden, gruwen zal hen bedekken, en over alle gezichten zal schaamte zijn, en op al hun hoofden kaalheid.","19":"Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.","20":"En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen *en* van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld.","21":"En Ik zal het in de hand van de vreemden overgeven ten roof, en aan de goddelozen van de aarde ten buit, en zij zullen het ontheiligen.","22":"Ook zal Ik Mijn aangezicht van hen afwenden, en zij zullen Mijn verborgen plaats ontheiligen; want inbrekers zullen daar binnenkomen en die ontheiligen.","23":"Maak een keten; want het land is vol van bloedgerichten, en de stad is vol van geweld.","24":"Daarom zal Ik de kwaadste van de heidenvolken doen komen, die hun huizen erfelijk zullen bezitten, en Ik zal de hoogmoed van de sterken doen ophouden, en die hen heiligen, zullen ontheiligd worden.","25":"De ondergang komt; en zij zullen de vrede zoeken, maar hij zal er niet zijn.","26":"Ellende zal op ellende komen, en er zal gerucht op gerucht wezen; dan zullen zij het visioen van een profeet zoeken; maar de wet zal vergaan van de priester, en de raad van de oudsten.","27":"De koning zal rouw bedrijven, en de vorsten zullen met verwoesting bekleed zijn, en de handen van het volk van het land zullen verschrikt zijn; Ik zal hun doen naar hun weg, en met hun rechten zal Ik ze richten; en zij zullen weten dat Ik de HEERE ben."},"SV":{"1":"Daarna geschiedde het woord des HEEREN tot mij, zeggende:","2":"Verder, gij mensenkind, zo zegt de Heere HEERE, van het land Israëls: Het einde is er, het einde is gekomen over de vier hoeken des lands.","3":"Nu is het einde over u; want Ik zal Mijn toorn tegen u zenden, en Ik zal u richten naar uw wegen, en Ik zal op u brengen al uw gruwelen.","4":"En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en gijlieden zult weten, dat Ik de HEERE ben.","5":"Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, ziet, is gekomen;","6":"Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; ziet, het *kwaad* is gekomen!","7":"De morgenstond is tot u gekomen, o inwoner des lands, de tijd is gekomen , de dag der beroerte is nabij, en er is geen wederklank der bergen.","8":"Nu zal Ik in kort Mijn grimmigheid over u uitgieten, en Mijn toorn tegen u volbrengen, en u richten naar uw wegen, en zal op u brengen al uw gruwelen.","9":"En Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal u geven naar uw wegen, en uw gruwelen zullen in het midden van u zijn; en gijlieden zult weten, dat Ik de HEERE ben, Die slaat.","10":"Ziet, de dag, ziet, *de* *morgenstond* is gekomen, de morgenstond is voortgekomen, de roede heeft gebloeid, de hovaardij heeft gegroend.","11":"Het geweld is opgerezen tot een roede der goddeloosheid; niets van hen zal *overblijven*, noch van hun menigte, noch van hun gedruis, en geen klage zal over hen zijn.","12":"De tijd is gekomen, de dag is genaakt; de koper zij niet blijde, en de verkoper bedrijve geen rouw; want een brandende toorn is over de gehele menigte van het *land*.","13":"Want de verkoper zal tot het verkochte niet wederkeren, ofschoon hun leven nog onder de levenden ware; overmits het gezicht, aangaande de gehele menigte van het *land*, niet zal terugkeren; en niemand zal door zijn ongerechtigheid zijn leven sterken.","14":"Zij hebben met de trompet getrompet, en hebben alles bereid, maar niemand trekt ten strijde; want Mijn brandende toorn is over de gehele menigte van het *land*.","15":"Het zwaard is buiten, en de pest, en de honger van binnen; die op het veld is, zal door het zwaard sterven, en die in de stad is, dien zal de honger en de pest verteren.","16":"En hun ontkomenden zullen *wel* ontkomen, maar zij zullen op de bergen zijn, zij allen zullen zijn gelijk duiven der dalen, kermende, een ieder om zijn ongerechtigheid.","17":"Alle handen zullen slap worden, en alle knieën zullen henenvlieten *als* water.","18":"Ook zullen zij zakken aangorden, gruwen zal ze bedekken, en over alle aangezichten zal schaamte wezen, en op al hun hoofden kaalheid.","19":"Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinigheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage der verbolgenheid des HEEREN; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot hunner ongerechtigheid zijn.","20":"En Hij heeft de schoonheid Zijns sieraads ter overtreffelijkheid gezet; maar zij hebben daarin beelden hunner gruwelen *en* hunner verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinigheid gesteld.","21":"En Ik zal het in de hand der vreemden overgeven ten roof, en den goddelozen der aarde ten buit, en zij zullen het ontheiligen.","22":"Ook zal Ik Mijn aangezicht van hen omwenden, en zij zullen Mijn verborgen plaats ontheiligen; want inbrekers zullen daar inkomen en die ontheiligen.","23":"Maak een keten; want het land is vol van bloedgerichten, en de stad is vol van geweld.","24":"Daarom zal Ik de kwaadste der heidenen doen komen, die hun huizen erfelijk bezitten zullen, en zal den hoogmoed der sterken doen ophouden, en die hen heiligen, zullen ontheiligd worden .","25":"De ondergang komt; en zij zullen den vrede zoeken, maar hij zal er niet zijn.","26":"Ellende zal op ellende komen, en er zal gerucht op gerucht wezen; dan zullen zij het gezicht van een profeet zoeken; maar de wet zal vergaan van den priester, en de raad van de oudsten.","27":"De koning zal rouw bedrijven, en de vorsten zullen met verwoesting bekleed zijn, en de handen van het volk des lands zullen beroerd zijn; Ik zal hun doen naar hun weg, en met hun rechten zal Ik ze richten; en zij zullen weten, dat Ik de HEERE ben."},"KJV":{"1":"Moreover the word of the LORD came unto me, saying,","2":"Also, thou son of man, thus saith the Lord GOD unto the land of Israel; An end, the end is come upon the four corners of the land.","3":"Now *is* the end *come* upon thee, and I will send mine anger upon thee, and will judge thee according to thy ways, and will recompense upon thee all thine abominations.","4":"And mine eye shall not spare thee, neither will I have pity: but I will recompense thy ways upon thee, and thine abominations shall be in the midst of thee: and ye shall know that I *am* the LORD.","5":"Thus saith the Lord GOD; An evil, an only evil, behold, is come.","6":"An end is come, the end is come: it watcheth for thee; behold, it is come.","7":"The morning is come unto thee, O thou that dwellest in the land: the time is come, the day of trouble *is* near, and not the sounding again of the mountains.","8":"Now will I shortly pour out my fury upon thee, and accomplish mine anger upon thee: and I will judge thee according to thy ways, and will recompense thee for all thine abominations.","9":"And mine eye shall not spare, neither will I have pity: I will recompense thee according to thy ways and thine abominations *that* are in the midst of thee; and ye shall know that I *am* the LORD that smiteth.","10":"Behold the day, behold, it is come: the morning is gone forth; the rod hath blossomed, pride hath budded.","11":"Violence is risen up into a rod of wickedness: none of them *shall remain*, nor of their multitude, nor of any of theirs: neither *shall there be* wailing","12":"The time is come, the day draweth near: let not the buyer rejoice, nor the seller mourn: for wrath *is* upon all the multitude","13":"For the seller shall not return to that which is sold, although they were yet alive: for the vision *is* touching the whole multitude thereof, *which* shall not return; neither shall any strengthen himself in the iniquity of his life.","14":"They have blown the trumpet, even to make all ready; but none goeth to the battle: for my wrath *is* upon all the multitude","15":"The sword *is* without, and the pestilence and the famine within: he that *is* in the field shall die with the sword; and he that *is* in the city, famine and pestilence shall devour","16":"But they that escape of them shall escape, and shall be on the mountains like doves of the valleys, all of them mourning, every one for his iniquity.","17":"All hands shall be feeble, and all knees shall be weak *as* water.","18":"They shall also gird *themselves* with sackcloth, and horror shall cover them; and shame *shall be* upon all faces, and baldness upon all their heads.","19":"They shall cast their silver in the streets, and their gold shall be removed: their silver and their gold shall not be able to deliver them in the day of the wrath of the LORD: they shall not satisfy their souls, neither fill their bowels: because it is the stumblingblock of their iniquity.","20":"As for the beauty of his ornament, he set it in majesty: but they made the images of their abominations *and* of their detestable things therein: therefore have I set it far","21":"And I will give it into the hands of the strangers for a prey, and to the wicked of the earth for a spoil; and they shall pollute","22":"My face will I turn also from them, and they shall pollute my secret *place*: for the robbers shall enter into it, and defile","23":"Make a chain: for the land is full of bloody crimes, and the city is full of violence.","24":"Wherefore I will bring the worst of the heathen, and they shall possess their houses: I will also make the pomp of the strong to cease; and their holy places shall be defiled.","25":"Destruction cometh; and they shall seek peace,","26":"Mischief shall come upon mischief, and rumour shall be upon rumour; then shall they seek a vision of the prophet; but the law shall perish from the priest, and counsel from the ancients.","27":"The king shall mourn, and the prince shall be clothed with desolation, and the hands of the people of the land shall be troubled: I will do unto them after their way, and according to their deserts will I judge them; and they shall know that I *am* the LORD."}},"tsk":{"2":[{"kopje":"over","refs":["Ezech 12:22","Ezech 21:2","Ezech 40:2","2 Kron 34:7"]},{"kopje":"Het einde","refs":["Ezech 7:3","Ezech 7:5","Ezech 7:6","Ezech 11:13","Gen 6:13","Deut 32:20","Jer 5:31","Jer 51:13","Klaagl 1:9","Klaagl 4:18","Amos 8:2","Amos 8:10","Matt 24:6","Matt 24:13","Matt 24:14","1 Petr 4:7"]}],"3":[{"kopje":"en Ik","refs":["Ezech 7:8","Ezech 7:9","Ezech 5:13","Ezech 6:3-7","Ezech 6:12","Ezech 6:13"]},{"kopje":"zal u richten","refs":["Ezech 7:8","Ezech 7:27","Ezech 11:10","Ezech 11:11","Ezech 16:38","Ezech 18:30","Ezech 33:20","Ezech 34:20-22","Ezech 36:19","Openb 20:12","Openb 20:13"]}],"4":[{"kopje":"Mijn","refs":["Ezech 7:9","Ezech 5:11","Ezech 8:18","Ezech 9:10","Ezech 24:14","Jer 13:14","Zach 11:6"]},{"kopje":"maar","refs":["Ezech 11:21","Ezech 16:43","Ezech 23:31","Ezech 23:49","Jer 16:18","Jer 25:14","Hos 9:7","Hos 12:3","Hebr 10:30"]},{"kopje":"en u","refs":["Ezech 7:27","Ezech 6:7","Ezech 6:14","Ezech 12:20"]}],"6":[{"kopje":"Een einde","refs":["Ezech 7:2","Ezech 7:3","Jer 44:27"]},{"kopje":"het is opgewaakt tegen u","refs":["Zach 13:7"]},{"kopje":"zie","refs":["Ezech 7:10","Ezech 21:25 ause it is the <span class=\"wl wl-kjv\" data-code=\"H4383\">stumblingblock</span> of their iniquity.","20":"As for the <span class=\"wl wl-kjv\" data-code=\"H6643\">beauty</span> of his <span class=\"wl wl-kjv\" data-code=\"H5716\">ornament,</span> he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it in <span class=\"wl wl-kjv\" data-code=\"H1347\">majesty:</span> but they <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H6754\">images</span> of their <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> and of their detestable <span class=\"wl wl-kjv\" data-code=\"H8251\">things</span> therein: therefore have I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it far","21":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> for a <span class=\"wl wl-kjv\" data-code=\"H957\">prey,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> for a <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil;</span> and they shall pollute","22":"My <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> will I <span class=\"wl wl-kjv\" data-code=\"H5437\">turn</span> also from them, and they shall <span class=\"wl wl-kjv\" data-code=\"H2490\">pollute</span> my <span class=\"wl wl-kjv\" data-code=\"H6845\">secret</span> place: for the <span class=\"wl wl-kjv\" data-code=\"H6530\">robbers</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into it, and defile","23":"<span class=\"wl wl-kjv\" data-code=\"H6213\">Make</span> a <span class=\"wl wl-kjv\" data-code=\"H7569\">chain:</span> for the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-c ap tegen u zal uitgieten. Alzo Exo 15:7 ; Job 20:23 ; Psa 78:49 ."},{"catchword":"richten","tekst":"Dat is, straffen; zie Gen 15:14 ."},{"catchword":"wegen,","tekst":"Dat is, werken; zie Gen 6:12 ."},{"catchword":"zal op u brengen al uw gruwelen","tekst":"Hebreeuws, zal op u geven; dat is brengen, leggen, stellen, alzo vs.4; dat is, zal u straffen vanwege al uwe gruwelen en boze werken. Zie gelijke manier van spreken 1Ki 8:32 ; Jer 26:15 ; onder vs.8-10, en Eze 11:21 , en Eze 16:43 , en Eze 22:31 , en Eze 23:49 ."}],"4":[{"catchword":"Mijn oog zal u niet verschonen,","tekst":"Zie boven Eze 5:11 ."},{"catchword":"uw gruwelen","tekst":"Dat is, de straffen uwer gruwelen. Want de schuld der gruwelen was lang tevoren onder hen geweest. Alzo ongerechtigheid voor de straf derzelve. Zie Lev 5:1 , en de aantekening."}],"5":[{"catchword":"kwaad, een","tekst":"Versta, het kwaad der straf, Gen 19:19 ."},{"catchword":"enig kwaad,","tekst":"Hetwelk met een slag u gans en ten enenmale vernielen en uitroeien zal. Vergelijk de manier van spreken met 1Sa 26:8 ; Nah 1:9 ."}],"6":[{"catchword":"Een einde is er gekomen,","tekst":"Zie boven vs.2."},{"catchword":"dat einde is gekomen,","tekst":"Te weten dat Ik u steeds gedreigd heb door mijne profeten. Een ding is tweemaal gezegd, om de waarheid en zwaarheid daarvan uit te drukken."},{"catchword":"het is","tekst":"Versta, het voornoemde einde. Anders: Hij is opgewaakt, te weten de Heere, en dat om u te straffen."},{"catchword":"opgewaakt tegen u;","tekst":"Dat is, bereid en vaardig om u te overvallen. Vergelijk 2Pe 2:3 ."},{"catchword":"het kwaad is gekomen","tekst":"Te weten waarvan in vs.5 gesproken is."}],"7":[{"catchword":"De morgenstond is tot u gekomen,","tekst":"Dat is, die tijd, in welken gij zekerlijk vroeg en haastelijk zult uitgeroeid worden. Sommigen menen dat hier gezien wordt op den tijd van de openbare burgerlijke straffen, die bij de Israëlieten in den morgenstond geschied zijn, daartoe gebruikende wat staat Psa 101:8 ."},{"catchword":"der beroerte is nabij,","tekst":"Versta een zekeren en bestemden tijd, in welken het land vol beroerte zou zijn door het gewoel en geweld van den oorlog, en door het geklaag en gehuil der mensen. Hebreeuws, Nabij is de dag, de beroerte."},{"catchword":"wederklank der bergen","tekst":"Versta, het wedergeluid, komende van het vreugdegeroep, hetwelk gemaakt wordt als men met blijdschap den most en andere vruchten uit het veld inzamelt. Sommigen ook verstaan dit van het blijde geluid, hetwelk de afgodendienaars op de bergen bij hunne altaren maakten. Vergelijk Jer 25:30 ."}],"8":[{"catchword":"in kort Mijn","tekst":"Hebreeuws, van nabij."},{"catchword":"grimmigheid","tekst":"Dat is, de straffen mijner grimmigheid in grote menigte en met geweld over u zenden. Alzo onder Eze 20:8 , Eze 20:13 . Zie Psa 79:6 ."},{"catchword":"tegen u volbrengen,","tekst":"Vergelijk boven Eze 5:13 ."},{"catchword":"wegen,","tekst":"Dat is, werken, doen en laten, gelijk boven vs.3."}],"9":[{"catchword":"uw gruwelen","tekst":"Zie boven vs.4."},{"catchword":"Die slaat","tekst":"Dat is, die rechtvaardig straft. Zie van dit woord Gen 8:21 ."}],"10":[{"catchword":"de dag,","tekst":"Dat is, de tijd der straf en wraak Gods. Zie boven vs.7 en onder vs.12."},{"catchword":"de morgenstond is gekomen,","tekst":"Dit woord is hier ingevoegd uit het voorgaande vs.7, of uit het volgende van vs.10. Men kan ook in de plaats daarvan stellen het kwaad, uit vs.5."},{"catchword":"roede heeft gebloeid,","tekst":"Door deze wordt van velen verstaan de koning Nebukadnezar, door wien de Joden zouden gestraft worden, tot welk einde zijne macht toenam en groeide. Vergelijk Isa 10:5 ."},{"catchword":"de hovaardij heeft gegroend","tekst":"Versta, de stoute en hardnekkige moedwilligheid der Joden in het zondigen tegen God, welks oorzaak was der voornoemde bloeiende roede. Zie vs.11."}],"11":[{"catchword":"geweld is opgerezen","tekst":"Versta, de ongerechtigheid en wrevel, voortkomende uit de gemelde hovaardij, want uit de verachting Gods spruit alle ongerechtigheid en wreedheid, die de mensen tegen elkander plegen. Deze nu brengt de roede voort, waardoor de goddeloosheid der mensen naar Gods rechtvaardig oordeel gestraft wordt. Men kan ook hier het geweld verstaan ten aanzien van de Chaldeën, die de Heere in kort opwekken zou, om de boosheden der Joden te straffen."},{"catchword":"van hen zal overblijven,","tekst":"Te weten van de Joden; welverstaande, met uitneming van het overblijfsel, waarvan gesproken is boven Eze 6:8 ."},{"catchword":"hun menigte,","tekst":"Dat is, van het gemene volk."},{"catchword":"hun gedruis,","tekst":"Versta de heren en machtigen des lands, die met een gedruis van volk, dat hen vergezelschapt of ten dienste staat, zich voor de gemeente vertonen. Anders: noch van hen, die uit hen zijn; dat is van hunne nakomelingen."},{"catchword":"geen klage zal over hen zijn","tekst":"Dat is, geen rouw als zij gestorven zullen zijn. De zin is dat het verderf zo groot zou wezen, dat er weinigen hiertoe zouden overig zijn; of dat een ieder met zijn eigen droefheid genoeg zou te doen hebben. Zie Jer 16:4-7 ."}],"12":[{"catchword":"De tijd is gekomen,","tekst":"Zie boven vs.7."},{"catchword":"zij niet blijde,","tekst":"Te weten omdat hij het gekochte goed niet zal genieten."},{"catchword":"bedrijve geen rouw;","tekst":"Te weten omdat hij door gebrek en armoede zijn land of ander goed heeft moeten verkopen; want zo hij het niet verkocht had, zou hij het evenwel niet hebben kunnen behouden. Zie vs.13."},{"catchword":"brandende toorn","tekst":"Versta, den brandenden toorn des Heeren. Zie 2Ch 28:13 , en onder vs.14."},{"catchword":"van het land","tekst":"Te weten van het land Juda."}],"13":[{"catchword":"het verkochte","tekst":"Hebreeuws, verkoping. Alzo boven Eze 1:1 , wegvoering, voor weggevoerde."},{"catchword":"wederkeren,","tekst":"Gelijk wel in het jubeljaar geschiedde, in hetwelk een ieder, die zijne erve verkocht had, tot dezelve moest wederkeren; zie Lev 25:13 ; maar deze wet zou in de zeventigjarige gevangenschap niet kunnen onderhouden worden."},{"catchword":"ofschoon hun leven nog onder de levenden ware;","tekst":"Dat is, ofschoon de koper en de verkoper nog leefden."},{"catchword":"het gezicht,","tekst":"Dat is, deze profetie, voorzeggende den ondergang van het Joodse Rijk en de zeventigjarige gevangenschap van het volk. Zie van het woord gezicht, Gen 15:1 , en Gen 46:2 ."},{"catchword":"van het land,","tekst":"Te weten van het land Juda, gelijk in vs.12."},{"catchword":"terugkeren;","tekst":"Dat is, niet wederroepen worden van God, of ijdel zijn, maar zal volbracht worden; alzo is het woord wederkeren genomen Isa 55:11 ; vergelijk ook 2Sa 1:22 ."},{"catchword":"niemand","tekst":"De zin is dat de Joden, hoe boos ook en snood zij mochten zijn om Gods wraak achter te houden, die nochtans niet ontgaan zouden. Men kan deze woorden ook aldus vertalen: Niemand, wiens leven is in zijn ongerechtigheid, zal zich versterken; of: Niemand in zijne ongerechtigheid zijnde, zal zijn leven sterven; of: Zich [in] zijn leven sterken; dat is, zolang hij in zijne ongerechtigheid voortgaat, zal hij zijn leven van het verderf niet behouden kunnen."}],"14":[{"catchword":"alles bereid,","tekst":"Te weten dat er oorlog nodig en dienstig is."},{"catchword":"trekt ten strijde;","tekst":"Te weten omdat hij niet wil door zorgeloosheid, of niet durft door vrees, of niet kan door zwakheid."},{"catchword":"van het land","tekst":"Te weten van het land Juda, gelijk in vs.12,13."}],"15":[{"catchword":"buiten,","tekst":"Te weten buiten de stad Jeruzalem."},{"catchword":"binnen;","tekst":"Te weten binnen de stad Jeruzalem."},{"catchword":"die op het veld is,","tekst":"Versta degenen, die uit Jeruzalem vluchten, om in haar verderf niet om te komen."},{"catchword":"het zwaard sterven,","tekst":"Te weten de Chaldeën, die de stad zouden belegeren."}],"16":[{"catchword":"ontkomenden zullen wel ontkomen,","tekst":"Versta degenen, die de algemene plaag der stad en de hand der Chaldeën ontgaan zullen zijn."},{"catchword":"der dalen,","tekst":"Te weten waarin zij zich verbergen uit vrees voor enigen storm en onweder, of van enige grijpvogels."},{"catchword":"kermende,","tekst":"Het Hebreeuwse woord betekent hier zoveel als een gewoel maken met zuchten, janken en huilen. Vergelijk Isa 38:14 , en Isa 59:11 ."}],"17":[{"catchword":"slap worden,","tekst":"Zie 2Sa 4:1 ."},{"catchword":"zullen henenvlieten als water","tekst":"Hebreeuws, heengaan; dat is hunne kracht verliezen, bevende van vrees en niet bekwaam zijnde om te bestaan tegen enig geweld noch om daarvoor te vluchten. Alzo onder Eze 21:7 . Van slappe knieën zie ook Job 4:4 , en de aantekening."}],"18":[{"catchword":"aangorden,","tekst":"Zie Gen 37:34 ."},{"catchword":"gruwen zal ze bedekken,","tekst":"Zie dezelfde manier van spreken Psa 55:6 ."},{"catchword":"kaalheid","tekst":"Te weten omdat ze door de grootheid hunner droefenis het haar van hun hoofd zouden uittrekken, hetwelk de Heere verboden had, Deu 14:1 ; niet willende dat zijn volk onmatig en ongemanierden rouw gelijk de heidenen zouden maken, op welk gebod, naardien deze lieden niet achten zouden, zo schijnt wel dat de bekering bij hen niet geweest is."}],"19":[{"catchword":"werpen,","tekst":"Te weten omdat het hun een beletsel mocht worden in de vlucht, of omdat ze wanhopen zouden van hetzelve langer te zullen kunnen bezitten."},{"catchword":"onreinigheid zijn;","tekst":"Dat is, hetwelk zij niet meer zullen achten dan hetgeen naar de wet onrein is en waarvan men zich moest afscheiden en afzonderen. Hebreeuws, afzondering. Zie van die woord 2Ch 29:5 ."},{"catchword":"dage der verbolgenheid des HEEREN;","tekst":"Dat is, als God de Joden door een rechtvaardige gramschap zeer zwaarlijk straffen zal."},{"catchword":"ziel","tekst":"Het woord ziel is hier genomen voor den lust en de begeerte tot de spijs. Deze wordt gezegd niet verzadigd te zijn, door gebrek van leeftocht, die ook den allerrijksten overkomen zou. De manier van spreken is ook Jer 31:25 ."},{"catchword":"het zal","tekst":"Te weten goud en zilver."},{"catchword":"aanstoot","tekst":"Dat is, de aanleiding en oorzaak van hun val en ondergang, omdat zij het kwalijk gekregen en kwalijk gebruikt zullen hebben, en voornamelijk om daarmede hunne afgoden te vereren, onder Eze 16:17 . Zie van het woord aanstoot ook onder Eze 21:15 , en de aantekening."}],"20":[{"catchword":"Hij heeft","tekst":"Te weten God."},{"catchword":"de schoonheid Zijns sieraads","tekst":"Versta den tempel te Jeruzalem, die niet alleen met goud en velerlei kostelijk tuig en kleinodiën, maar ook met de oefening van den waren godsdienst was versierd geweest."},{"catchword":"overtreffelijkheid gezet;","tekst":"Dat is om daardoor, als door een uiterlijk teken, zijn uitnemende heerlijkheid te vertonen, en zijn volk, als zijn wade bruid, zeer kostelijk versierd, boven alle natiën te verheffen."},{"catchword":"dat hun tot","tekst":"Te weten de schoonheid van mijn sieraad."},{"catchword":"onreinigheid gesteld","tekst":"Zie op vs.19. Anders: ter afzondering gemaakt; dat is, verre van hen gemaakt of gedaan."}],"21":[{"catchword":"het in de hand","tekst":"Te weten die schoonheid van mijn sieraad."},{"catchword":"vreemden","tekst":"Te weten volken, als van de Chaldeën of Babyloniërs, die den tempel beroofd, verstoord en verbrand hebben; 2Ki 25:9 , enz.; 2Ch 36:18-19 ."},{"catchword":"goddelozen der aarde","tekst":"Versta dezelfde Chaldeën, bij welke geen vreze Gods, gene gerechtigheid, noch medelijden jegens de mensen zou zijn."},{"catchword":"ontheiligen","tekst":"Te weten met plunderen, moorden, schenden en branden; idem met het goud, zilver, koper en de heilige vaten daaruit te nemen en tot onheilige gebruiken te eigenen; 2Ki 25:13-15 , enz.; Dan 1:2 , en Dan 5:3 ."}],"22":[{"catchword":"hen omwenden,","tekst":"Te weten van de Chaldeën, die mijn tempel innemen en schenden zullen. De Heere wil zeggen dat Hij hen zou laten geworden en hun boos bedrijf niet verhinderen of tegenstaan. Anderen verstaan dit van de Israëlieten."},{"catchword":"verborgen plaats ontheiligen;","tekst":"Versta het heilige der heiligen, waar de ark des verbonds was; en wordt een verborgen plaats genaamd, omdat het het binnenste deel des tempels was, en niemand daarin mocht komen dan de overpriester, en dat eenmaal per jaar."},{"catchword":"inbrekers","tekst":"Zie van dit woord Psa 17:4 ."},{"catchword":"inkomen en die ontheiligen","tekst":"Namelijk in Jeruzalem, en vandaar in den tempel en in het heilige der heiligen."}],"23":[{"catchword":"een keten;","tekst":"Of, koord; te weten tot een teken dat de Joden als misdadigers, die met ketens en koorden gebonden zijnde, naar de gevangenis of richtplaats plegen geleid te worden, ten dele door het zwaard zouden omkomen, ten dele naar Chaldea gevankelijk weggevoerd worden."},{"catchword":"bloedgerichten,","tekst":"Dat is, zonden, die den dood verdiend hebben, anders genaamd gerichten des doods. Zie Deu 19:6 ; Jer 26:11 . Anderen verstaan openbare gerichten, in welke de onschuldigen ter dood veroordeeld zijn van de ongerechtige rechters."},{"catchword":"geweld","tekst":"Versta hierdoor allerlei ongerechtigheid bewezen tegen den naaste door openbare verdrukking of heimelijke bedriegerij om rijkdom op te hopen."}],"24":[{"catchword":"kwaadste der heidenen doen komen,","tekst":"Dat is, de Chaldeën, die van de machtigste waren onder heidenen en geslagen vijanden der Joden."},{"catchword":"erfelijk bezitten zullen,","tekst":"Het Hebreeuwse woord betekent wel meest iets bezitten uit recht van wettelijke erfenis, maar het is ook genomen voor bezitting in eigendom, hoe en op wat wijze dat die zou mogen verkregen zijn; 1Ki 21:15 ; Hab 1:6 ."},{"catchword":"hoogmoed","tekst":"Dat is, de hovaardij, stoutmoedigheid, pracht en praal."},{"catchword":"der sterken","tekst":"Dat is, van de machtigen in het land, machtig in afkomst, staat, rijkdom, of dergelijke."},{"catchword":"hen heiligen,","tekst":"Te weten de voorgemelde sterken. Die dezen nu heiligden, waren de priesters, die voor hen offeranden deden, waardoor zij meenden geheiligd te worden."}],"25":[{"catchword":"ondergang komt;","tekst":"Of, uitroeiing, vernieling. Hebreeuws, afsnijding. Vergelijk Isa 38:12 ."}],"26":[{"catchword":"van een profeet zoeken;","tekst":"Om van hem te verstaan de uitkomst hunner ellende. Maar het zoeken zal wezen zonder vinden, omdat zij de profeten ter rechter tijd niet gehoord hadden."},{"catchword":"wet zal vergaan van den priester,","tekst":"Dat is, de gewone kerkelijke personen zullen de ware en onvervalste leer, die alleen recht onderwijzen en troosten kan in allen nood, verliezen en de burgerlijke regenten zullen radeloos worden; en dat alles tot vermeerdering van de straf, die de Joden verdiend hadden. Vergelijk Isa 29:14 ."},{"catchword":"oudsten","tekst":"Dat is van de raadsheren, regeerders van het land."}],"27":[{"catchword":"met verwoesting bekleed zijn,","tekst":"Dat is gans zeer vervuld zijn met ontzetting, verbaasdheid en wanhoop. Zie gelijke manier van spreken Job 8:22 , en in de aantekening. Hebreeuws, de vorst zal bekleed zijn, enz."},{"catchword":"het volk des lands","tekst":"Dat is, van het gemene volk. Alzo Jer 44:21 ; Hag 2:5 ."},{"catchword":"beroerd zijn;","tekst":"Dat is, door beroering en ontzetting des harten gans onbekwaam zijn om iets tot afkering des vijands uit te richten. Vergelijk 2Sa 4:1 , en de aantekening."},{"catchword":"naar hun weg,","tekst":"Dat is, naar de verdiensten hunner werken."},{"catchword":"met hun rechten zal Ik ze richten;","tekst":"Dat is, met de straffen, die zij verdiend hebben. Recht voor straf. Zie 2Ch 20:12 , of naar de wijze, alzo zij verdienen. Recht voor wijze. Zie Gen 40:13 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that the Lord came unto me saying :"}],"2":[{"catchword":null,"tekst":"Moreover thou child of man thus saith the Lord LORD concerning the land of Israel [meaning the kingdom of Juda which is often in ]behold is come ."}],"6":[{"catchword":null,"tekst":"An end is come [see above on vers 2] that the end is come [to wit which I have continually threatened by my prophets one and the same thing is twice said to express the truth and heaviness of it ] it is awaked against thee [it meaning the fore mentioned end others he is awaked to wit the Lord and that to punish thee awaked that is prepared and ready to fall upon thee compare 2 Pet 2.3 ]behold the evil [to wit whereof is spoken in the former vers ]is come."}],"7":[{"catchword":null,"tekst":"The morning that is the time wherein thou shalt of a certain be early and quickly cut off .Some conceive that here respect is had to the time of public civil punishments which among the Israelites were done in the morning using for that purpose that which is said Psal 101.8 ] is come unto thee o inhabitants of the land the time is come that day of trouble is near [ meaning a certain and determined time wherein the land should be full of trouble by means of the lamenting and howling of men Heb the day the trouble is near ]and there is no echo of the mountains [meaning the echo proceeding from the shouting and noise that is made when they gather in their new wine and other fruits of the fields some understand this also of the joyful sound which idolaters made upon the mountains near their altars compare 25 on vers 30 .]"}],"8":[{"catchword":null,"tekst":"Now will I shortly [Heb from high at hand ] pour out my fury upon thee [that is send upon thee the punishments of my fury in great abundance and with violence so below chap 20.8,13 see Psal 79 on vers 6] and accomplish mine anger against thee [see above chap 5 on vers 13]and judge thee according to thy ways [that is works or doings as above on vers 3] and will bring upon thee all thine abomination"}],"9":[{"catchword":null,"tekst":"And mine eye shall not pity neither will I spare I will render unto thee according to thy ways and thine abominations shall be in the midst of thee [see above on vers 4] and ye shall know that I am the Lord that finisheth [that is that punisheth justly see of this word on Gen 8 on vers 21 ."}],"10":[{"catchword":null,"tekst":"Behold the day [that is the time of punishment and vengeance of God see above vers 7 and below vers 12 ]behold the morning [this word is here inserted from the fore going seventh vers or from the following words of this vers .We may also put in the room of it the evil from the fifth vers ]is come the morning is gone forth the rod hath blossomed [ by the rod here is understood by many king Nebuchadnezzar by whom the Jews should be punished for which end his might increased and flourished compare Isa 10.5 ] pride hath budded [by pride here is meant the bold and obstinate presumption of the Jews in the sinning against God which was the cause of the aforesaid blossoming rod see the next vers .]"}],"11":[{"catchword":null,"tekst":"Violence is risen up into a rod of wickedness [by violence understand here injustice and cruelty proceeding from the afore mentioned pride .For from contempt of God issueth and injustice and cruelty which men practice one against another now this bringeth forth the rod whereby the wickedness of men according to the just judgment of God is punished violence maybe also here understood by in respect of the Chaldeans whom the Lord would shortly raise up to punish the wickedness of the Jews ] nothing of them [to wit of the Jews ] shall remain [this is to be understood with exception of the remnant whereof is spoken above on chap 6.8 ]nor of their multitude [that is of the common people ]nor of their tumult[ understand the Lord the great ones of the land that is with multitudes of people accompanying them or waiting upon them shew themselves others nor of them that are out of them that is of their prosperity ]neither shall there be lamentation for them [that is no mourning when they shall be dead the meaning is that the destruction should be so great that few shall be left to // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
