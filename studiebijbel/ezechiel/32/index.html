 dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:","2":"Mensenkind! Hef een klaaglied op over Farao, de koning van Egypte, en zeg tegen hem: U was als een jonge leeuw onder de heidenvolken, en u was als een zeedraak in de zeeën; u kwam voort in uw rivieren, u beroerde het water met uw voeten, en u vermodderde hun rivieren.","3":"Zo zegt de Heere HEERE: Ik zal daarom Mijn net over u uitspreiden door een vergadering van veel volken; die zullen u optrekken in Mijn garen.","4":"Dan zal Ik u achterlaten op het land, Ik zal u wegwerpen op het open veld; en Ik zal al het gevogelte van de hemel op u laten wonen, en het gedierte van de hele aarde van u verzadigen.","5":"En Ik zal uw vlees op de bergen leggen, en de dalen vullen met uw hoogheid.","6":"En Ik zal het land waarin u zwemt, met uw bloed drenken tot aan de bergen; en de stromen zullen vol worden van u.","7":"En als Ik u zal uitblussen, zal Ik de hemel bedekken en zijn sterren zwart maken; Ik zal de zon met wolken bedekken, en de maan zal haar licht niet laten schijnen.","8":"Alle lichtende lichten aan de hemel, die zal Ik om uwentwil zwart maken; en Ik zal een duisternis over uw land brengen, spreekt de Heere HEERE.","9":"Verder zal Ik het hart van veel volken verdrietig maken, als Ik uw verbreking onder de heidenvolken breng, in de landen die u niet gekend hebt.","10":"En Ik zal maken dat veel volken zich over u ontzetten, en hun koningen zullen de haren over u te berge staan, als Ik Mijn zwaard voor hun aangezicht zwaai; en zij zullen elk ogenblik sidderen, ieder voor zijn eigen leven, op de dag van uw val.","11":"Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.","12":"Ik zal uw menigte vellen door de zwaarden van de helden, die allemaal samen de meest tirannieke van de heidenvolken zijn; die zullen de hoogmoed van Egypte verstoren, en haar hele menigte zal verdelgd worden.","13":"En Ik zal haar dieren wegvagen van bij het vele water; en geen mensenvoet zal het meer beroeren, en geen dierenklauwen zullen het beroeren.","14":"Dan zal Ik hun water laten zinken, en Ik zal hun rivieren laten stromen als olie, spreekt de Heere HEERE.","15":"Als Ik Egypteland tot een verwoesting gesteld zal hebben, en het land van zijn volheid woest zal zijn geworden, als Ik geslagen zal hebben allen die daarin wonen; dan zullen zij weten dat Ik de HEERE ben.","16":"Dat is het klaaglied, en dat zullen zij klagend zingen; de dochters van de heidenvolken zullen het klagend zingen; zij zullen het klagend zingen over Egypte en over haar hele menigte, spreekt de Heere HEERE.","17":"Verder gebeurde het in het twaalfde jaar, op de vijftiende dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:","18":"Mensenkind! Weeklaag over de menigte van Egypte, en laat haar neerdalen, (haar en de dochters van de prachtige heidenvolken) naar de onderste plaatsen van de aarde, bij hen die in het kuil zijn neergedaald.","19":"Boven wie bent u zo liefelijk! Daal neer, en leg u bij de onbesnedenen.","20":"In het midden van de verslagenen van het zwaard zullen zij vallen; zij is aan het zwaard overgegeven; trek haar weg met haar hele menigte.","21":"De machtigste van de helden zullen hem, met zijn helpers, toespreken, uit het midden van het dodenrijk; zij zijn neergedaald, de onbesnedenen liggen daar, verslagen door het zwaard;","22":"Daar is Assur met haar hele menigte, haar graven zijn rondom hem; zij zijn allen verslagen, gevallen door het zwaard;","23":"Van wie de graven gesteld zijn in de zijden van het kuil, en haar menigte is rondom haar graf; zij zijn allen verslagen, gevallen door het zwaard, die een schrik gaven in het land van de levenden.","24":"Daar is Elam met haar hele menigte rondom haar graf; zij zijn allen verslagen, de gevallenen door het zwaard, die onbesneden zijn neergedaald tot de onderste plaatsen van de aarde, die hun schrik hadden gegeven in het land van de levenden; nu dragen zij hun schande met hen die in het kuil zijn neergedaald.","25":"In het midden van de verslagenen hebben zij haar een legerstede gesteld onder haar hele menigte, rondom hem zijn haar graven; zij zijn allen onbesneden, verslagenen van het zwaard, omdat er een schrik van hen uitging in het land van de levenden; nu dragen zij hun schande met hen die in het kuil zijn neergedaald; hij is gelegd in het midden van de verslagenen.","26":"Daar is Mesech, en Tubal, met haar hele menigte; rondom hem zijn haar graven; zij zijn allen onbesneden, verslagenen door het zwaard, omdat zij hun schrik gegeven hebben in het land van de levenden.","27":"Maar zij liggen niet met de helden die onder de onbesnedenen gevallen zijn; die naar het dodenrijk zijn neergedaald met hun oorlogswapens, en van wie de zwaarden gelegd zijn onder hun hoofden; hun ongerechtigheid is nochtans op hun beenderen, omdat de schrik van de helden in het land van de levenden geweest is.","28":"U ook zult verbroken worden in het midden van de onbesnedenen, en zult liggen met de verslagenen van het zwaard.","29":"Daar is Edom, haar koningen en al haar vorsten, die met hun macht gelegd zijn bij de verslagenen van het zwaard; die liggen met de onbesnedenen en met hen die in het kuil zijn neergedaald.","30":"Daar zijn de geweldigen van het noorden, zij allen, en alle Sidoniërs, die met de verslagenen zijn neergedaald, beschaamd vanwege hun schrik die uit hun macht voortkwam, en zij liggen onbesneden bij de verslagenen van het zwaard, en dragen hun schande met hen die in het kuil zijn neergedaald.","31":"Farao zal hen zien, en zich troosten over zijn hele menigte; de verslagenen van het zwaard van Farao en zijn hele leger, spreekt de Heere HEERE.","32":"Want Ik heb ook Mijn schrik gegeven in het land van de levenden; daarom zal hij gelegd worden in het midden van de onbesnedenen bij de verslagenen van het zwaard, Farao en zijn hele menigte, spreekt de Heere HEERE."},"SV":{"1":"Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op den eersten der maand, *dat* het woord des HEEREN tot mij geschiedde, zeggende:","2":"Mensenkind! hef een klaaglied op over Farao, den koning van Egypte, en zeg tot hem: Gij waart een jongen leeuw onder de heidenen gelijk; en gij waart als een zeedraak in de zeeën, en braakt voort in uw rivieren, en beroerdet het water met uw voeten, en vermodderdet hunlieder rivieren.","3":"Alzo zegt de Heere HEERE: Ik zal daarom Mijn net over u uitspreiden door een vergadering van vele volken; die zullen u optrekken in Mijn garen.","4":"Dan zal Ik u laten op het land, Ik zal u henenwerpen op het open veld; en Ik zal al het gevogelte des hemels op u doen wonen, en het gedierte der ganse aarde van u verzadigen.","5":"En Ik zal uw vlees henengeven op de bergen, en de dalen met uw hoogheid vervullen.","6":"En Ik zal het land, waarin gij zwemt, van uw bloed drenken tot aan de bergen; en de stromen zullen van u vervuld worden.","7":"En als Ik u zal uitblussen, zal Ik den hemel bedekken, en zijn sterren zwart maken; Ik zal de zon met wolken bedekken, en de maan zal haar licht niet laten lichten.","8":"Alle lichtende lichten aan den hemel, die zal Ik om uwentwil zwart maken; en Ik zal een duisternis over uw land maken, spreekt de Heere HEERE.","9":"Daartoe zal Ik het hart van vele volken verdrietig maken, als Ik uw verbreking onder de heidenen zal brengen in de landen, die gij niet gekend hebt.","10":"En Ik zal maken, dat zich vele volken over u ontzetten, en hun koningen zullen de haren over u te berge staan, als Ik Mijn zwaard zal zwaaien voor hun aangezichten; en zij zullen elk ogenblik sidderen, een ieder voor zijn ziel, ten dage uws vals.","11":"Want zo zegt de Heere HEERE: Het zwaard des konings van Babel zal u overkomen.","12":"Ik zal uw menigte vellen door de zwaarden der helden, die al te zamen de tirannigste der heidenen zijn; die zullen de hovaardij van Egypte verstoren, en haar ganse menigte zal verdelgd worden.","13":"En Ik zal haar beesten verdoen van bij de grote wateren; en geen mensenvoet zal ze meer beroeren, en geen beestenklauwen zullen ze beroeren.","14":"Dan zal Ik hunlieder wateren doen zinken, en Ik zal hunlieder rivieren doen gaan als olie, spreekt de Heere HEERE:","15":"Als Ik Egypteland zal hebben gesteld *tot* een verwoesting, en het land van zijn volheid zal woest zijn geworden, als Ik geslagen zal hebben allen, die daarin wonen; alzo zullen zij weten, dat Ik de HEERE ben.","16":"Dat is het klaaglied, en dat zullen zij klagelijk zingen; de dochteren der heidenen zullen het klagelijk zingen; zij zullen het klagelijk zingen over Egypte en over haar ganse menigte, spreekt de Heere HEERE.","17":"Voorts gebeurde het in het twaalfde jaar, op den vijftienden der maand, *dat* het woord des HEEREN tot mij geschiedde, zeggende:","18":"Mensenkind! weeklaag over de menigte van Egypte, en doe ze nederdalen, (haar en de dochteren der prachtige heidenen) in de onderste plaatsen der aarde, bij degenen, die in den kuil zijn nedergedaald.","19":"Boven wien zijt gij liefelijk! Daal neder, en leg u bij de onbesnedenen.","20":"In het midden der verslagenen van het zwaard zullen zij vallen; zij is aan het zwaard overgegeven; trek haar henen met al haar menigte.","21":"De machtigste der helden zullen hem, met zijn helpers, toespreken, uit het midden der hel; zij zijn nedergedaald, de onbesnedenen liggen er, verslagen van het zwaard;","22":"Daar is Assur met haar gansen hoop, zijn graven zijn rondom hem; zij zijn allen verslagen, gevallen door het zwaard;","23":"Welker graven gesteld zijn in de zijden des kuils, en haar hoop is rondom haar graf; zij zijn allen verslagen, gevallen door het zwaard, die een schrik gaven in het land der levenden.","24":"Daar is Elam met haar ganse menigte rondom haar graf; zij zijn allen verslagen, de gevallenen door het zwaard, die onbesneden zijn nedergedaald tot de onderste plaatsen der aarde, die hun schrik hadden gegeven in het land der levenden; nu dragen zij hun schande met degenen, die in den kuil zijn nedergedaald.","25":"In het midden der verslagenen hebben zij haar een legerstede gesteld onder haar ganse menigte, rondom hem zijn haar graven; zij zijn allen onbesneden, verslagenen van het zwaard, omdat een schrik van hen gegeven is in het land der levenden; nu dragen zij hun schande met degenen, die in den kuil zijn nedergedaald; hij is geleid in het midden der verslagenen.","26":"Daar is Mesech, *en* Tubal, met haar ganse menigte; rondom hem zijn haar graven; zij zijn allen onbesneden, verslagenen van het zwaard, omdat zij hun schrik gegeven hebben in het land der levenden.","27":"Maar zij liggen niet met de helden, die onder de onbesnedenen gevallen zijn; die ter helle zijn nedergedaald met hun krijgswapenen, en welker zwaarden men gelegd heeft onder hun hoofden; welker ongerechtigheid nochtans op hun beenderen is, omdat der helden schrik in het land der levenden geweest is.","28":"Gij ook zult verbroken worden in het midden der onbesnedenen, en zult liggen met de verslagenen van het zwaard.","29":"Daar is Edom, haar koningen en al haar vorsten, die met hunlieder macht geleid zijn bij de verslagenen van het zwaard; diezelve liggen met de onbesnedenen en met degenen, die in den kuil zijn nedergedaald.","30":"Daar zijn de geweldigen van het Noorden, zij allen, en alle Sidoniërs, die met de verslagenen zijn nedergedaald, beschaamd zijnde vanwege hun schrik, *die* uit hun macht *voortkwam*, en zij liggen onbesneden bij de verslagenen van het zwaard, en dragen hun schande met degenen, die in den kuil zijn nedergedaald.","31":"Farao zal henlieden zien, en zich troosten over zijn ganse menigte; de verslagenen van het zwaard van Farao en zijn ganse heir, spreekt de Heere HEERE.","32":"Want Ik heb *ook* Mijn schrik gegeven in het land der levenden; dies zal hij geleid worden in het midden der onbesnedenen bij de verslagenen van het zwaard, Farao en zijn ganse menigte, spreekt de Heere HEERE."},"KJV":{"1":"And it came to pass in the twelfth year, in the twelfth month, in the first *day* of the month, *that* the word of the LORD came unto me, saying,","2":"Son of man, take up a lamentation for Pharaoh king of Egypt, and say unto him, Thou art like a young lion of the nations, and thou *art* as a whale in the seas: and thou camest forth with thy rivers, and troubledst the waters with thy feet, and fouledst their rivers.","3":"Thus saith the Lord GOD; I will therefore spread out my net over thee with a company of many people; and they shall bring thee up in my net.","4":"Then will I leave thee upon the land, I will cast thee forth upon the open field, and will cause all the fowls of the heaven to remain upon thee, and I will fill the beasts of the whole earth","5":"And I will lay thy flesh upon the mountains, and fill the valleys with thy height.","6":"I will also water with thy blood the land wherein thou swimmest, *even* to the mountains; and the rivers shall be full","7":"And when I shall put thee out, I will cover the heaven, and make the stars thereof dark; I will cover the sun with a cloud, and the moon shall not give her light.","8":"All the bright lights of heaven will I make dark over thee, and set darkness upon thy land, saith the Lord GOD.","9":"I will also vex the hearts of many people, when I shall bring thy destruction among the nations, into the countries which thou hast not known.","10":"Yea, I will make many people amazed at thee, and their kings shall be horribly afraid for thee, when I shall brandish my sword before them; and they shall tremble at *every* moment, every man for his own life, in the day of thy fall.","11":"For thus saith the Lord GOD; The sword of the king of Babylon shall come","12":"By the swords of the mighty will I cause thy multitude to fall, the terrible of the nations, all of them: and they shall spoil the pomp of Egypt, and all the multitude thereof shall be destroyed.","13":"I will destroy also all the beasts thereof from beside the great waters; neither shall the foot of man trouble them any more, nor the hoofs of beasts trouble","14":"Then will I make their waters deep, and cause their rivers to run like oil, saith the Lord GOD.","15":"When I shall make the land of Egypt desolate, and the country shall be destitute of that whereof it was full, when I shall smite all them that dwell therein, then shall they know that I *am* the LORD.","16":"This *is* the lamentation wherewith they shall lament her: the daughters of the nations shall lament her: they shall lament for her, *even* for Egypt, and for all her multitude, saith the Lord GOD.","17":"It came to pass also in the twelfth year, in the fifteenth *day* of the month, *that* the word of the LORD came unto me, saying,","18":"Son of man, wail for the multitude of Egypt, and cast them down, *even* her, and the daughters of the famous nations, unto the nether parts of the earth, with them that go down into the pit.","19":"Whom dost thou pass in beauty? go down, and be thou laid with the uncircumcised.","20":"They shall fall in the midst of *them that are* slain by the sword: she is delivered to the sword: draw her and all her multitudes.","21":"The strong among the mighty shall speak to him out of the midst of hell with them that help him: they are gone down, they lie uncircumcised, slain by the sword.","22":"Asshur *is* there and all her company: his graves *are* about him: all of them slain, fallen by the sword:","23":"Whose graves are set in the sides of the pit, and her company is round about her grave: all of them slain, fallen by the sword, which caused terror in the land of the living.","24":"There *is* Elam and all her multitude round about her grave, all of them slain, fallen by the sword, which are gone down uncircumcised into the nether parts of the earth, which caused their terror in the land of the living; yet have they borne their shame with them that go down to the pit.","25":"They have set her a bed in the midst of the slain with all her multitude: her graves *are* round about him: all of them uncircumcised, slain by the sword: though their terror was caused in the land of the living, yet have they borne their shame with them that go down to the pit: he is put in the midst of *them that be* slain.","26":"There *is* Meshech, Tubal, and all her multitude: her graves *are* round about him: all of them uncircumcised, slain by the sword, though they caused their terror in the land of the living.","27":"And they shall not lie with the mighty *that are* fallen of the uncircumcised, which are gone down to hell with their weapons of war: and they have laid their swords under their heads, but their iniquities shall be upon their bones, though *they were* the terror of the mighty in the land of the living.","28":"Yea, thou shalt be broken in the midst of the uncircumcised, and shalt lie with *them that are* slain with the sword.","29":"There *is* Edom, her kings, and all her princes, which with their might are laid by *them that were* slain by the sword: they shall lie with the uncircumcised, and with them that go down to the pit.","30":"There *be* the princes of the north, all of them, and all the Zidonians, which are gone down with the slain; with their terror they are ashamed of their might; and they lie uncircumcised with *them that be* slain by the sword, and bear their shame with them that go down to the pit.","31":"Pharaoh shall see them, and shall be comforted over all his multitude, *even* Pharaoh and all his army slain by the sword, saith the Lord GOD.","32":"For I have caused my terror in the land of the living: and he shall be laid in the midst of the uncircumcised with *them that are* slain with the sword, *even* Pharaoh and all his multitude, saith the Lord GOD."}},"tsk":{"1":[{"kopje":"in het twaalfde","refs":["Ezech 32:17","Ezech 1:2","Ezech 29:1","Ezech 29:17","Ezech 30:20"]}],"2":[{"kopje":"Hef","refs":["Ezech 32:16","Ezech 32:18","Ezech 19:1","Ezech 27:2","Ezech 27:32","Ezech 28:12","Jer 9:18"]},{"kopje":"U was als","refs":["Ezech 19:2-6","Ezech 38:13","Gen 49:9","Num 24:9","Spr an> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and thou art as a <span class=\"wl wl-kjv\" data-code=\"H8577\">whale</span> in the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas:</span> and thou camest <span class=\"wl wl-kjv\" data-code=\"H1518\">forth</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers,</span> and <span class=\"wl wl-kjv\" data-code=\"H1804\">troubledst</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> with thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H7515\">fouledst</span> their rivers.","3":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will therefore spread <span class=\"wl wl-kjv\" data-code=\"H6566\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> over thee with a <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and they shall bring thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in my net.","4":"Then will I <span class=\"wl wl-kjv\" data-code=\"H5203\">leave</span> thee upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> I will cast thee <span class=\"wl wl-kjv\" data-code=\"H2904\">forth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">open</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and will cause all the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> to <span class=\"wl wl-kjv\" data-code=\"H7931\">remain</span> upon thee, and I will <span class=\"wl wl-kjv\" data-code=\"H7646\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the whole earth","5":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> thy <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H1516\">valleys</span> with thy height.","6":"I will also <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> with thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein thou <span class=\"wl wl-kjv\" data-code=\"H6824\">swimmest,</span> even to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains;</span> and the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers</span> shall be full","7":"And when I shall put thee <span class=\"wl wl-kjv\" data-code=\"H3518\">out,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H6937\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> thereof <span class=\"wl wl-kjv\" data-code=\"H6937\">dark;</span> I will <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> with a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> shall not <span class=\"wl wl-kjv\" data-code=\"H215\">give</span> her light.","8":"All the <span class=\"wl wl-kjv\" data-code=\"H3974\">bright</span> <span class=\"wl wl-kjv\" data-code=\"H216\">lights</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> will I make <span class=\"wl wl-kjv\" data-code=\"H6937\">dark</span> over thee, and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> n."},{"catchword":"zij zijn allen verslagen,","tekst":"De Elamieten."},{"catchword":"onderste plaatsen der aarde,","tekst":"Gelijk boven vs.18."}],"25":[{"catchword":"hem een legerstede gesteld","tekst":"Namelijk Elam."},{"catchword":"hem zijn zijne graven;","tekst":"Den Elamietischen koning."},{"catchword":"van hen gegeven is","tekst":"Hebreeuws, hunlieder schrik gegeven is, of was."},{"catchword":"hij is","tekst":"De Elamiet, of Elamietische koning."},{"catchword":"gelegd","tekst":"Hebreeuws, gegeven."}],"26":[{"catchword":"Mesech, en Tubal,","tekst":"Zie Gen 10:2 ."},{"catchword":"hem zijn haar graven;","tekst":"Den koning van die landen."}],"27":[{"catchword":"helden,","tekst":"Die overwinnend geweest zijnde, met eer en pracht begraven worden; dezen daarentegen zijn met schande verslagen en weggestopt. Anders: zouden zij [de Egyptenaars] niet liggen bij de helden, enz.? Immers ja. Want waarom zouden zij het beter hebben dan zulke helden, die ook al henen onder gevaren zijn?"},{"catchword":"helle zijn nedergedaald","tekst":"Dat is, ten grave met hunne wapenen, maar wijders, naar de ziel, in de plaats der verdoemden."},{"catchword":"krijgswapenen,","tekst":"Tot een teken van hunne dapperheid; als nog hedendaags wel gebruikelijk is in het begraven."},{"catchword":"men gelegd heeft onder hun hoofden;","tekst":"Hebreeuws, zij geleid hebben, gelijk dikwijls, dat is, wien men, naar de gewoonte van dien tijd en die landen, de zwaarden onder het hoofd legde, na hun dood, tot een teken hunner dapperheid."},{"catchword":"ongerechtigheid nochtans","tekst":"Dat is, straf hunner ongerechtigheidd; zie Lev 5:1 , en boven Eze 18:20 ."},{"catchword":"beenderen is,","tekst":"Die niemand vermits hunne macht en vreeslijkheid, in hun leven heeft durven roeren, moeten in en na hunnen dood de straf hunner ongerechtigheid dragen, verrottende naar het lichaam en naar de ziel lijdende, met andere onbesnedenen en goddelozen."}],"28":[{"catchword":"Gij ook zult verbroken worden","tekst":"Gij koning Farao."}],"29":[{"catchword":"Edom,","tekst":"Judea."}],"30":[{"catchword":"geweldigen","tekst":"Of, stadhouders, leenmannen, vorsten, prinsen; zie Jos 13:21 . Hebreeuws eigenlijk, overgotene, of gezalfde."},{"catchword":"Noorden,","tekst":"Van Syrië en daaromtrent, als Tyriërs en Sidoniërs, [gelijk volgt], die allen noordwaarts van Egypte af gelegen waren."},{"catchword":"Sidoniërs,","tekst":"Hebreeuws, Sidoniër. Zie boven Eze 28:21 ."},{"catchword":"schrik,","tekst":"Dien zij anderen hebben aangedaan."},{"catchword":"uit hun macht voortkwam,","tekst":"Of, vanwege hunne macht. Omdat zij hen door dezelve niet hebben kunnen behouden."}],"31":[{"catchword":"Faraö zal henlieden zien,","tekst":"Vergelijk boven vs.21."},{"catchword":"troosten","tekst":"Als hebbende metgezellen in zijne ellende en schande. Zie boven Eze 31:16 ."}],"32":[{"catchword":"heb ook Mijn schrik gegeven","tekst":"Alsof de Heere zeide: Het zal mijn tijd ook eens worden, dat Ik de wereld door mijne oordelen verschrik, dan zal Ik mijn schrikkelijke oordelen over Farao en zijn volk gewisselijk uitvoeren. Anders: als Ik mijnen schrik, enz., dan zal hij, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Also it came to pass in the twelveth year, [after the carrying away of Jojachin, above chap. 1.2.] in the twelveth moneth, on the first (day) of the moneth; (that) the word of the LORD came unto me, saying:"}],"2":[{"catchword":null,"tekst":"Child of man, take up a lamentation, [as below verse 16] for Pharaoh King of Egypt, and say unto him; thou wast like a young lion, [before thy power was dimished. See above chap. 30 on verse 21.] Among the heathen, or nations; that is thou wast among, or towards them like a young lion, fierce and cruel. Compare above chap. 19.2, &c.] and thou wast as a sea-dragon in the seas, [as above chapter 29.3. that is, thou wast cruel, dreadful, stirring, both by land and by water] and braketh forth in [Or, with] thy rivers, [thou didst put thy self forward and didst glory in thy kingdom, as being mighty and rich by reason of the commodious situation of waters] and troubledth the water with thy feet, [Or, trampledst upon the water; to wit, of other nations; that is, their land and trading: thou didst every truth in thy self and didst trouble other nations, stirring them up to rebellion, and hardening them in it] and muddiest their rivers."}],"3":[{"catchword":null,"tekst":"Thus saith the Lord LORD; I will therefore spread out my net over thee, [see above chapter 12, 13 and 17.22. Hos. 7.12. With the Annotat.] by a congregation of many nations: [that shall be in the army of the Babylonians] they shall draw thee up in my net. [Or, with my net that I have spread out over thee for to catch thee]"}],"4":[{"catchword":null,"tekst":"Then will I leave thee upon the land, compare above chapter 29.5 with the Annotat.] I will cause all the fowls of the heaven to dwell upon thee, (I will) satisfie the beasts of the whole earth with thee. [Compare below chap. 39.17, c]"}],"5":[{"catchword":null,"tekst":"And I will give away the flesh upon the mountains and fill the valleys with thy height. [This may be understood of Pharaoh himself, and his pride, compared with the great body of a sea-dragon, verse 2. Or, (as others) his slain multitude, wherein he formerly placed his eminency]."}],"6":[{"catchword":null,"tekst":"And I will water [or, give to drink] with thy blood [The blood of thine own self, and of thy people that are slain] the land wherein thou swimmest, that is, dost now domineer with thy government, like a sea-dragon in the sea] (even) to the mountains: and the streams shall be filled be filled with thee."}],"7":[{"catchword":null,"tekst":"And when I shall put thee, [As a candle, lamp or fire or fire out. Compare Job 18. verse 5,6. With the Annotat. 2 Sam 14.7. and 21.17.] I will cover the heaven, and make the stars thereof black: I will cover the sun with cloud, and the moon shall not cause her light to shine. [That is, I will by this judgement of mine fill the world with terrour, and clothe the whole universe as it were in mourning. Compare Isa. 13.10. Joel 2.30,31. And above chap. 31.5. Also Gen 15:12. With the Annotat.]"}],"8":[{"catchword":null,"tekst":"All the shinning lights [Heb. Light of light] in the heaven, them will make black thy fake: and will make [Or, bring. Heb. Give, set] darkness upon thy land, saith the LORD."}],"9":[{"catchword":null,"tekst":"Moreover, I will trouble [or, grieve, vex] the heart of many nations: [By the tidings of the fall of this great king, and on the contrary, of the exaltation and greatness of the Babylonian. The Hebrew word (otherwise signifying anger) is also taken for grief, trouble, sorrow, vexation, Psa 6:8. And 10.14 and 31.10. Eclas. 7.3. Jer 7:19.] when I shall bring thy breaking [see Jerem. 4 on verse 6. That is here, the news of thy ruine] among the heathen, into the lands which thou hast not known."}],"10":[{"catchword":null,"tekst":"And I will make many nations to be amazed at thee, and their kings shall be horribly afraid for thee, the hairs of their kings shall stand an end at thee, [as above chap. 27.35.] when I shall shake [or brandith] my sword [as above chap. 30.24.] before their faces: [smiting and felling thee down by my sword as it were before their eyes, which will cause greater fear and terror unto them, as followeth] and they shall tremble every moment, [Heb. Tremble in moments] every one for his (own) soul, [that is, life, or person, for himself; fearing that it will cost them their lives. See Genes. 19 on verse 17. ad 12 on verse 5.] in the day of thy fall."}],"11":[{"catchword":null,"tekst":"For thus saith the Lord LORD; the sword of the king of Babel shall come upon thee."}],"12":[{"catchword":null,"tekst":"I will throw (down) thy multitude [Compare above chap. 29.19.] by the sword of the champion, which are all of them together the most tyrannical of the heathen: [As above chap. 28.7.] they shall destroy the pride [or, pomp, glory, Excellency, as above often] of Egypt, and all the multitude thereof shall be rooted out."}],"13":[{"catchword":null,"tekst":"And I will destroy all the beasts [Heb. Beast, or great cattel] from besides the great waters: [so that none shall go and feed any more by the great waters] and no foot of man shall trouble [Compare above chap. 29.11.] them [the waters: compare above verse 2] any more, neither shall any hoofs of beasts trouble them."}],"14":[{"catchword":null,"tekst":"Then will I cause their waters [The waters of the other nations that were troubled by Pharaoh, above verse 2.] to sink, and I will cause their river to run like oyl, [that is, I will quiet the tumults, and bring the land to rest, when I shall have cut off this troubler of waters; as the waters are calmed and run softly and clearly when the tempest is over and troubled filth is funk down. Compare below chap. 34.18.] saith the Lord Lord."}],"15":[{"catchword":null,"tekst":"When I shall have made the land of Egypt a desolation, and the land shall become desolate of her fullness, [that is, shall be bereaved of all that wherewith it was formerly filled and adorned by God. Compare above chap. 19.7.] When I shall have smitten all them that dwell therein: so shall they know that I am the LORD."}],"16":[{"catchword":null,"tekst":"That is the lamentation, [Related in the former part of the chapter. See above verse 2.] and that shall thy sing lamentably [the word sing is intended in the thing it self: see 2 Coron 35.25. as the foregoing Hebrew word also signifieth a, lamentation, from whence the Lamentations of Jeremia bear the name [the daughters of the heathen shall sing it lamentably: [as the women in the those times were wont to sing songs of triumph and lamentations. See Jeremi. 9. on verse 17. They shall sing it lamentably, for Egypt and for all her multitude, saith the Lord LORD."}],"17":[{"catchword":null,"tekst":"Moreover, it came to pass in the twelfth year, [see above verse 1] on the fifteenth (day) of the moneth, [meaning of the same twelfth moneth; as is expressed verse 1.] (that) the word of the LORD came unto me, saying:"}],"18":[{"catchword":null,"tekst":"Child of man, lament for the multitude of Egypt, and cause her to descend, [that is, prophefie, tell her to descend, into the grave, &c. as followeth. See Jerem. 1 on verse 10 and Ezek. 3 on verse 8. some understand it, as if God should have said, conduct her to the grave, follow her as men do a corps, with mourning and lamenting, for a token that she shall surely go down to the pit] (her) and the daughters of the stately heathen) [see of the Hebrew word rendered here stately, Psalms 8 on verse 2] into the lowermost places of the earth, [Heb. The earth: or, the land of barrenness. Compare above chapter 26.19. And 31.14. Lament. 3.55. So below verse 24.] With them that are gone down into the pit."}],"19":[{"catchword":null,"tekst":"Above whom art thou in comeliness? [That is, whom dost thou excel in comeliness or grace? The meaning is, dost thou think that thou art fairer and comelier then all other kings that I should have more cause favour thee then I have done them? As if he should say, no: thou must go down to the pit as well as they] go down, and lay thy self [Heb. properly be laid down or lying] with the uncircumcised. [see above chap. 28 on verse 10 and 31. on verse 15 and so in the sequel.]"}],"20":[{"catchword":null,"tekst":"They [To wit, the Egyptians] shall fall [or lie] in midst of them that are slain by the sword: she [to wit, Egypt] is delivered to the sword; [others, the sword is ordained, or appointed, or appointed; to wit, to smite he. Compare above c. 30.24, 25.] Draw her along [other, they shall draw, drag her; to wit, down into the grave, and consequently to the place of place of the wicked that are deceased] with all her multitude."}],"21":[{"catchword":null,"tekst":"The mightiest of the champions [Other kings and potentates that were dead before, and gone into the same place] shall seek to him, with his helpers, out of the midst of hell: [as it were welcoming him and his people and comforting themselves by coming and company, as is said below of Pharaoh, verse 31. a figurative kind of mucking. Compare Isa. 14.9.] They are gone down, the uncircumcised slain] slain by the sword."}],"22":[{"catchword":null,"tekst":"Assur [Meaning Assyria; that is, the Assyrians and principally the king. See above chapter 31.3, &c.] There is with all company her [his king of Assyrias] graves are round about him: they are all slain, fallen by the sword."}],"23":[{"catchword":null,"tekst":"Whose graves are set in set in the sides of the pit, and her company is round about her grave: they are all slain, fallen by the sword, which caused terrour [by their insolence, power, violence, and oppression. So in the sequel, and above chapter 26.17.] In the land of the living. [That is, here upon the earth, I this life. See Job 28 on verse 13 and Psalms 27 on verse 13. So in the sequel]"}],"24":[{"catchword":null,"tekst":"There is Elam [Meaning Persia and Media, or a particular countrey therein. (see Genesis 10 on verse 22 and 14 on verse 1) and principally the king thereof] with all her multitude, round about her grave: they [the Elamites] are all slain, the fallen ones by the sword, which are gone down uncircumcised unto the lowermost parts of the earth: [as above verse 18] which had given their terrour in the land of the living: now they bear their shame with them that went down into the pit."}],"25":[{"catchword":null,"tekst":"They have set her [namely Elam] a bed in the midst of the slain, among all her multitude: her graves are round about him; [The king of the Elamites] they are all uncircumcised, slain by the sword because terrour is given by them [Heb. Their terrour is, or was given by them] in the land of the living; now they bear their shame with them that are gone down into the pit. He [the Elamite, or the kings of the Elamites] is laid [Heb. Given] in the midst of the slain."}],"26":[{"catchword":null,"tekst":"There is Mesch, and Tubal, [see Genesis 10 on verse 2.] with all her multitude; her graves are proud about him: [the king of those countreys] they are all uncircumcised, slain by the sword, because they have given their terrour in the land of the living."}],"27":[{"catchword":null,"tekst":"But they lie not with the champions, [Which having been righteous, were honourably and stately buried. On the contrary, those were slain ignominiously and dragged away. Others, should not they (the Egyptians) lye by the champions, &c. surely yea, for why should they fare better then such champions that are gone down to the pit?] that are fallen among the uncircumcised: which are gone down to hell [that is, to the grave with their weapons, as followeth: but further, according to the soul, to the place of the damned] with their weapons of war, [in token of their valour: as is also usual even at this day in the burying of valiant souldiers] they whose swords men have laid under their heads; [Heb. They have laid, &c. as often; that is. Whole swords, according to the costumes of the times and countreys, were buried under their heads after they were dead, as a badge and token of their valour] whose iniquity [that is, the punishment of their iniquity. See Levit. 5 on verse 10 and above chapter 18 on verse 20] withstanding is upon their bones, because the terrour of the champions was in the land of the living. [those whom none durst touch in their life-time, because of their power and dreadfulness, they must in and after their death bear the punishment of their iniquity, putrifying in their bodies, and in their souls suffering with other uncircumcised and ungodly ones.]"}],"28":[{"catchword":null,"tekst":"Thou [Thou king Pharaoh] also shall be broken in the midst of the uncircumcised and shall lie with them that are slain with the sword."}],"29":[{"catchword":null,"tekst":"There is Edom, [Idumea] her kings and all her prince, which with their might are laid by them that were slain by the sword: those lie with the uncircumcised, and with them that are gone down into the pit."}],"30":[{"catchword":null,"tekst":"There are the mighty men [Or, Deputies, Lievtenants, noble, princes. See Joel 13.21. Heb. Properly, poured upon, or anointed] of the north, [Or Syria, and thereabout, as Tyrians and Zidonians. See above chapter 28.21] which are gone down into the being ashamed because of their terrour, [which they shall caused unto others] (which proceede) from their power, [Or because of their power, because they were not able to save themselves by it] and they lie uncircumcised by them that are slain by the sword, and bear their shame with them that are gone down into the pit."}],"31":[{"catchword":null,"tekst":"Pharaoh shall see them, [compare above verse 21.] and comfort himself over all his multitude; [as having companions with him in his misery and shame. See above chapter 31.16] they that are slain by the sword of Pharaoh, and all his army, saith the Lord LORD."}],"32":[{"catchword":null,"tekst":"For I have (also) given my terrour in the land the living: therefore shall he be laid in the midst of the uncircumcised by them that are slain by the sword; Pharaoh and all his multitude, saith the Lord LORD. [as if the Lord should say: it will be once my time also, that I should terrifie the world by my judgements, then will I assuredly execute my terrible judgements upon Pharaoh and his people. Others, when I shall cause my terrour, &c, then shall he, c.]"}]}}};

  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  document.getElementById('hfdnav').innerHTML =

    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
