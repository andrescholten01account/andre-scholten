ta-code=\"H2416\">levenden</span>; daarom <span class=\"wl\" data-l=\"L5\" data-code=\"H7901\">zal</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7901\">hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7901\">gelegd</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7901\">worden</span> in <span class=\"wl\" data-l=\"L6\" data-code=\"H8432\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8432\">midden</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8432\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6189\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6189\">onbesnedenen</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6189\">bij</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2491\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2491\">verslagenen</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2491\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H2719\">het</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H2719\">zwaard</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H6547\">Farao</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H1995\">en</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H1995\">zijn</span> hele <span class=\"wl\" data-l=\"L11\" data-code=\"H1995\">menigte</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H5002\">spreekt</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H5002\">de</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H136\">Heere</span> HEERE."}, "koppeling_kjv": {"1": "And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> in the twelfth <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> in the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,", "2": "<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> take <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H7015\">lamentation</span> for <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Thou art <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> a young <span class=\"wl wl-kjv\" data-code=\"H3715\">lion</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and thou art as a <span class=\"wl wl-kjv\" data-code=\"H8577\">whale</span> in the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas:</span> and thou camest <span class=\"wl wl-kjv\" data-code=\"H1518\">forth</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers,</span> and <span class=\"wl wl-kjv\" data-code=\"H1804\">troubledst</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> with thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H7515\">fouledst</span> their rivers.", "3": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will therefore spread <span class=\"wl wl-kjv\" data-code=\"H6566\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> over thee with a <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and they shall bring thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in my net.", "4": "Then will I <span class=\"wl wl-kjv\" data-code=\"H5203\">leave</span> thee upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> I will cast thee <span class=\"wl wl-kjv\" data-code=\"H2904\">forth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">open</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and will cause all the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> to <span class=\"wl wl-kjv\" data-code=\"H7931\">remain</span> upon thee, and I will <span class=\"wl wl-kjv\" data-code=\"H7646\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the whole earth", "5": "And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> thy <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H1516\">valleys</span> with thy height.", "6": "I will also <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> with thy <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein thou <span class=\"wl wl-kjv\" data-code=\"H6824\">swimmest,</span> even to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains;</span> and the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers</span> shall be full", "7": "And when I shall put thee <span class=\"wl wl-kjv\" data-code=\"H3518\">out,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H6937\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> thereof <span class=\"wl wl-kjv\" data-code=\"H6937\">dark;</span> I will <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> with a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> shall not <span class=\"wl wl-kjv\" data-code=\"H215\">give</span> her light.", "8": "All the <span class=\"wl wl-kjv\" data-code=\"H3974\">bright</span> <span class=\"wl wl-kjv\" data-code=\"H216\">lights</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> will I make <span class=\"wl wl-kjv\" data-code=\"H6937\">dark</span> over thee, and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.", "9": "I will also <span class=\"wl wl-kjv\" data-code=\"H3707\">vex</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> when I shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> thy <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> which thou hast not known.", "10": "Yea, I will make <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8074\">amazed</span> at thee, and their <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8178\">horribly</span> <span class=\"wl wl-kjv\" data-code=\"H8175\">afraid</span> for thee, when I shall <span class=\"wl wl-kjv\" data-code=\"H5774\">brandish</span> my <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">them;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2729\">tremble</span> at every <span class=\"wl wl-kjv\" data-code=\"H7281\">moment,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> for his own <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thy fall.", "11": "For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> The <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> shall come", "12": "By the <span class=\"wl wl-kjv\" data-code=\"H2719\">swords</span> of the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> will I cause thy <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> to <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> the <span class=\"wl wl-kjv\" data-code=\"H6184\">terrible</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> all of them: and they shall <span class=\"wl wl-kjv\" data-code=\"H7703\">spoil</span> the <span class=\"wl wl-kjv\" data-code=\"H1347\">pomp</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> thereof shall be destroyed.", "13": "I will <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> also all the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> thereof <span class=\"wl wl-kjv\" data-code=\"H5921\">from</span> beside the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters;</span> neither shall the <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H1804\">trouble</span> them any more, nor the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoofs</span> of <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> trouble", "14": "Then will I make their <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H8257\">deep,</span> and cause their <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">run</span> like <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.", "15": "When I shall <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">destitute</span> of that whereof it was <span class=\"wl wl-kjv\" data-code=\"H4393\">full,</span> when I shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> all them that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein, then shall they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.", "16": "This is the <span class=\"wl wl-kjv\" data-code=\"H7015\">lamentation</span> wherewith they shall <span class=\"wl wl-kjv\" data-code=\"H6969\">lament</span> her: the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H6969\">lament</span> her: they shall <span class=\"wl wl-kjv\" data-code=\"H6969\">lament</span> for her, even for <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and for all her <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.", "17": "It came to pass also in the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,", "18": "<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H5091\">wail</span> for the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and cast them <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> even her, and the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H117\">famous</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> unto the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the pit.", "19": "Whom dost thou pass in <span class=\"wl wl-kjv\" data-code=\"H5276\">beauty?</span> go <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and be thou <span class=\"wl wl-kjv\" data-code=\"H7901\">laid</span> with the uncircumcised.", "20": "They shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them that are <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> she is <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> to the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> <span class=\"wl wl-kjv\" data-code=\"H4900\">draw</span> her and all her multitudes.", "21": "The <span class=\"wl wl-kjv\" data-code=\"H410\">strong</span> among the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> to him out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H7585\">hell</span> with them that <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> him: they are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> they <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised,</span> <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the sword.", "22": "<span class=\"wl wl-kjv\" data-code=\"H804\">Asshur</span> is there and all her <span class=\"wl wl-kjv\" data-code=\"H6951\">company:</span> his <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> are <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him: all of them <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> by the sword:", "23": "Whose <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> are <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> in the <span class=\"wl wl-kjv\" data-code=\"H3411\">sides</span> of the <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> and her <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> is round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> her <span class=\"wl wl-kjv\" data-code=\"H6900\">grave:</span> all of them <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> which <span class=\"wl wl-kjv\" data-code=\"H5414\">caused</span> <span class=\"wl wl-kjv\" data-code=\"H2851\">terror</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the living.", "24": "There is <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam</span> and all her <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> her <span class=\"wl wl-kjv\" data-code=\"H6900\">grave,</span> all of them <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> which are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> into the nether <span class=\"wl wl-kjv\" data-code=\"H8482\">parts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> which <span class=\"wl wl-kjv\" data-code=\"H5414\">caused</span> their <span class=\"wl wl-kjv\" data-code=\"H2851\">terror</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living;</span> yet have they <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> their <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the pit.", "25": "They have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> her a <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with all her <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude:</span> her <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him: all of them <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised,</span> <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> though their <span class=\"wl wl-kjv\" data-code=\"H2851\">terror</span> was <span class=\"wl wl-kjv\" data-code=\"H5414\">caused</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living,</span> yet have they <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> their <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H953\">pit:</span> he is <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them that be slain.", "26": "There is <span class=\"wl wl-kjv\" data-code=\"H4902\">Meshech,</span> <span class=\"wl wl-kjv\" data-code=\"H8422\">Tubal,</span> and all her <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude:</span> her <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him: all of them <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised,</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> though they <span class=\"wl wl-kjv\" data-code=\"H5414\">caused</span> their <span class=\"wl wl-kjv\" data-code=\"H2851\">terror</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the living.", "27": "And they shall not <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> that are <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> of the <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised,</span> which are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7585\">hell</span> with their <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> and they have <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> their <span class=\"wl wl-kjv\" data-code=\"H2719\">swords</span> under their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> but their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities</span> shall be upon their <span class=\"wl wl-kjv\" data-code=\"H6106\">bones,</span> though they were the <span class=\"wl wl-kjv\" data-code=\"H2851\">terror</span> of the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the living.", "28": "Yea, thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with them that are <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with the sword.", "29": "There is <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> her <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and all her <span class=\"wl wl-kjv\" data-code=\"H5387\">princes,</span> which with their <span class=\"wl wl-kjv\" data-code=\"H1369\">might</span> are <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> by them that were <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with the <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised,</span> and with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the pit.", "30": "There be the <span class=\"wl wl-kjv\" data-code=\"H5257\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> all of them, and all the <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians,</span> which are gone <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain;</span> with their <span class=\"wl wl-kjv\" data-code=\"H2851\">terror</span> they are <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> of their <span class=\"wl wl-kjv\" data-code=\"H1369\">might;</span> and they <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> with them that be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> with them that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the pit.", "31": "<span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them, and shall be <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted</span> over all his <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> even <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> and all his <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.", "32": "For I have <span class=\"wl wl-kjv\" data-code=\"H5414\">caused</span> my <span class=\"wl wl-kjv\" data-code=\"H2851\">terror</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">living:</span> and he shall be <span class=\"wl wl-kjv\" data-code=\"H7901\">laid</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> with them that are <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> even <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
