nd bouwt, en zie, de anderen die pleisteren met loze kalk.", "11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "12": "Zie, als die wand gevallen zal zijn, zal er dan niet tegen u gezegd worden: Waar is de pleistering waarmee u gepleisterd hebt?", "13": "Daarom zegt de Heere HEERE zo: Ja, Ik zal hem door een grote stormwind in Mijn grimmigheid splijten, en er zal een overstelpende plasregen zijn in Mijn toorn, en grote hagelstenen in Mijn grimmigheid, om hem te verdoen.", "14": "Zo zal Ik de wand afbreken die u met loze kalk gepleisterd hebt, en zal hem neerwerpen op de aarde, zodat zijn grond ontdekt zal worden; zo zal de stad vallen, en u zult in het midden ervan omkomen; en u zult weten dat Ik de HEERE ben.", "15": "Zo zal Ik Mijn grimmigheid tegen de wand voleindigen, en tegen hen die hem pleisteren met loze kalk; en Ik zal tegen u zeggen: Die wand is er niet meer, en zij die hem pleisterden, zijn er niet meer;", "16": "Namelijk de profeten van Israël, die over Jeruzalem profeteren, en voor haar een gezicht van vrede zien, terwijl er geen vrede is, spreekt de Heere HEERE.", "17": "En u, mensenkind, zet uw gezicht tegen de dochters van uw volk, die profeteren uit hun eigen hart, en profeteer tegen hen;", "18": "En zeg: Zo zegt de Heere HEERE: Wee over die vrouwen, die kussens naaien voor alle oksels van de armen, en hoofddeksels maken voor het hoofd van elke lengte, om de zielen te vangen! Zult u de zielen van Mijn volk vangen, en zult u voor uzelf de zielen in leven houden?", "19": "En zult u Mij ontheiligen bij Mijn volk, voor handvollen gerst en voor stukken brood, om zielen te doden die niet zouden sterven, en om zielen in leven te houden die niet zouden leven, door uw liegen tegen Mijn volk, dat de leugen hoort?", "20": "Daarom zegt de Heere HEERE zo: Zie, Ik ben tegen uw kussens, waarmee u daar de zielen vangt naar de vogels*; en Ik zal ze van uw armen wegscheuren; en Ik zal die zielen loslaten, de zielen die u vangt naar de vogels.", "21": "Verder zal Ik uw hoofddeksels scheuren, en Mijn volk uit uw hand redden, zodat zij niet meer in uw hand zullen zijn om gevangen te worden; en u zult weten dat Ik de HEERE ben.", "22": "Omdat u het hart van de rechtvaardige door valsheid bedroefd hebt gemaakt, terwijl Ik hem geen smart aangedaan heb; en omdat u de handen van de goddeloze gesterkt hebt, zodat hij zich van zijn boze weg niet zou afkeren, doordat ik hem in leven zou houden;", "23": "Daarom zult u niet meer nietigheid zien, en geen waarzegging meer gebruiken; maar Ik zal Mijn volk uit uw hand redden, en u zult weten dat Ik de HEERE ben."}, "SV": {"1": "En des HEEREN woord geschiedde tot mij, zeggende:", "2": "Mensenkind, profeteer tegen de profeten Israëls, die profeteren, en zeg tot degenen, die uit hun hart profeteren: Hoort des HEEREN woord.", "3": "Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun geest nawandelen, en hetgeen zij niet gezien hebben!", "4": "Uw profeten, o Israël, zijn als vossen in de woeste plaatsen.", "5": "Gij zijt in de bressen niet opgetreden, noch hebt den muur toegemuurd voor het huis Israëls, om in den strijd te staan, ten dage des HEEREN.", "6": "Zij zien ijdelheid en leugenachtige voorzegging, die daar zeggen: De HEERE heeft gesproken, daar de HEERE hen niet gezonden heeft; en zij geven hope van het woord te zullen bevestigen.", "7": "Ziet gij niet een ijdel gezicht, en spreekt een leugenachtige voorzegging, als gij zegt: De HEERE spreekt, daar Ik niet gesproken heb?", "8": "Daarom zo zegt de Heere HEERE: omdat gijlieden ijdelheid spreekt, en leugen ziet; daarom, ziet, Ik *wil* aan u, spreekt de Heere HEERE.", "9": "En Mijn hand zal zijn tegen de profeten, die ijdelheid zien, en leugen voorzeggen; zij zullen in de vergadering Mijns volks niet zijn, en in het schrift van het huis Israëls niet geschreven worden, en in het land Israëls niet komen; en gij zult weten, dat Ik de Heere HEERE ben.", "10": "Daarom, ja, daarom dat zij Mijn volk verleiden, zeggende: Vrede, daar geen vrede is; en *dat* de een een lemen wand bouwt, en ziet, de anderen denzelven pleisteren met loze kalk.", "11": "Zeg tot degenen, die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en gij, o grote hagelstenen, zult vallen, en een grote stormwind zal *hem* splijten.", "12": "Ziet, als die wand zal gevallen zijn, zal dan niet tot u gezegd worden: Waar is de pleistering, waarmede gij gepleisterd hebt?", "13": "Daarom alzo zegt de Heere HEERE: Ja, Ik zal *hem* door een groten stormwind in Mijn grimmigheid splijten, en er zal een overstelpende plasregen zijn in Mijn toorn, en grote hagelstenen in *Mijn* grimmigheid, om *dien* te verdoen.", "14": "Zo zal Ik den wand afbreken, dien gijlieden met loze kalk gepleisterd hebt, en zal hem ter aarde nederwerpen, dat zijn grond zal ontdekt worden; alzo zal *de* *stad* vallen, en gij zult in het midden van haar omkomen; en gij zult weten, dat Ik de HEERE ben.", "15": "Zo zal Ik Mijn grimmigheid tegen den wand voortbrengen, en tegen degenen, die hem pleisteren met loze kalk; en Ik zal tot ulieden zeggen: Die wand is er niet *meer*, en die hem pleisterden, zijn er niet;", "16": "*Te* *weten* de profeten Israëls, die van Jeruzalem profeteren, en voor haar een gezicht des vredes zien, waar geen vrede is, spreekt de Heere HEERE.", "17": "En gij, mensenkind, zet uw aangezicht tegen de dochteren uws volks, dewelke profeteren uit haar hart, en profeteer tegen haar;", "18": "En zeg: Zo zegt de Heere HEERE: Wee *die* *vrouwen*, die kussens naaien voor alle okselen der armen, en maken hoofddeksels voor het hoofd van alle statuur, om de zielen te jagen! Zult gij de zielen Mijns volks jagen, en zult gij u de zielen in het leven behouden?", "19": "En zult gij Mij ontheiligen bij Mijn volk, voor handvollen van gerst, en voor stukken broods, om zielen te doden, die niet zouden sterven, en om zielen in het leven te behouden, die niet zouden leven, door uw liegen tot Mijn volk, dat de leugen hoort?", "20": "Daarom, zo zegt de Heere HEERE: Ziet, Ik *wil* aan uw kussens, waarmede gij aldaar de zielen jaagt naar de bloemhoven, en Ik zal ze uit uw armen wegscheuren; en Ik zal die zielen losmaken, de zielen, die gij jaagt naar de bloemhoven.", "21": "Daartoe zal Ik uw hoofddeksels scheuren, en Mijn volk uit uw hand redden, zodat zij niet meer in uw hand zullen zijn tot een jacht; en gij zult weten, dat Ik de HEERE ben.", "22": "Omdat gijlieden het hart des rechtvaardigen *door* valsheid hebt bedroefd gemaakt, daar Ik hem geen smart aangedaan heb; en omdat gij de handen des goddelozen gesterkt hebt, opdat hij zich van zijn bozen weg niet afkeren zou, dat Ik hem in het leven behield;", "23": "Daarom zult gij niet meer ijdelheid zien, noch waarzegging gebruiken; maar Ik zal Mijn volk uit uw hand redden, en gij zult weten, dat Ik de HEERE ben."}, "KJV": {"1": "And the word of the LORD came unto me, saying,", "2": "Son of man, prophesy against the prophets of Israel that prophesy, and say thou unto them that prophesy out of their own hearts, Hear ye the word of the LORD;", "3": "Thus saith the Lord GOD; Woe unto the foolish prophets, that follow their own spirit, and have seen", "4": "O Israel, thy prophets are like the foxes in the deserts.", "5": "Ye have not gone up into the gaps, neither made up the hedge for the house of Israel to stand in the battle in the day of the LORD.", "6": "They have seen vanity and lying divination, saying, The LORD saith: and the LORD hath not sent them: and they have made *others* to hope that they would confirm the word.", "7": "Have ye not seen a vain vision, and have ye not spoken a lying divination, whereas ye say, The LORD saith *it*; albeit I have not spoken?", "8": "Therefore thus saith the Lord GOD; Because ye have spoken vanity, and seen lies, therefore, behold, I *am* against you, saith the Lord GOD.", "9": "And mine hand shall be upon the prophets that see vanity, and that divine lies: they shall not be in the assembly of my people, neither shall they be written in the writing of the house of Israel, neither shall they enter into the land of Israel; and ye shall know that I *am* the Lord GOD.", "10": "Because, even because they have seduced my people, saying, Peace; and *there was* no peace; and one built up a wall, and, lo, others daubed it with untempered", "11": "Say unto them which daub *it* with untempered *morter*, that it shall fall: there shall be an overflowing shower; and ye, O great hailstones, shall fall; and a stormy wind shall rend", "12": "Lo, when the wall is fallen, shall it not be said unto you, Where *is* the daubing wherewith ye have daubed", "13": "Therefore thus saith the Lord GOD; I will even rend *it* with a stormy wind in my fury; and there shall be an overflowing shower in mine anger, and great hailstones in *my* fury to consume", "14": "So will I break down the wall that ye have daubed with untempered *morter*, and bring it down to the ground, so that the foundation thereof shall be discovered, and it shall fall, and ye shall be consumed in the midst thereof: and ye shall know that I *am* the LORD.", "15": "Thus will I accomplish my wrath upon the wall, and upon them that have daubed it with untempered *morter*, and will say unto you, The wall *is* no *more*, neither they that daubed", "16": "*To wit*, the prophets of Israel which prophesy concerning Jerusalem, and which see visions of peace for her, and *there is* no peace, saith the Lord GOD.", "17": "Likewise, thou son of man, set thy face against the daughters of thy people, which prophesy out of their own heart; and prophesy", "18": "And say, Thus saith the Lord GOD; Woe to the *women* that sew pillows to all armholes, and make kerchiefs upon the head of every stature to hunt souls! Will ye hunt the souls of my people, and will ye save the souls alive", "19": "And will ye pollute me among my people for handfuls of barley and for pieces of bread, to slay the souls that should not die, and to save the souls alive that should not live, by your lying to my people that hear *your* lies?", "20": "Wherefore thus saith the Lord GOD; Behold, I *am* against your pillows, wherewith ye there hunt the souls to make *them* fly, and I will tear them from your arms, and will let the souls go, *even* the souls that ye hunt to make *them* fly.", "21": "Your kerchiefs also will I tear, and deliver my people out of your hand, and they shall be no more in your hand to be hunted; and ye shall know that I *am* the LORD.", "22": "Because with lies ye have made the heart of the righteous sad, whom I have not made sad; and strengthened the hands of the wicked, that he should not return from his wicked way, by promising him life:", "23": "Therefore ye shall see no more vanity, nor divine divinations: for I will deliver my people out of your hand: and ye shall know that I *am* the LORD."}}, "tsk": {"2": [{"kopje": "profeteer tegen", "refs": ["Ezech 14:9", "Ezech 14:10", "Ezech 22:25", "Ezech 22:28", "2 Kron 18:18-24", "Jes 9:14", "Jes 56:9-12", "Jer 5:31", "Jer 6:13", "Jer 6:14", "Jer 8:10", "Jer 14:13-15", "Jer 23:2", "Jer 23:11-22", "Jer 23:25", "Jer 23:26", "Jer 27:14", "Jer 27:18", "Jer 28:12-17", "Jer 29:8", "Jer 29:9", "Jer 37:19", "Klaagl 4:13", "Micha 3:6", "Micha 3:11", "Zef 3:4", "2 Petr 2:1-3"]}, {"kopje": "profeteren", "refs": ["Ezech 13:3", "Ezech 13:17", "Jer 14:14", "Jer 23:16", "Jer 23:26"]}, {"kopje": "Hoor", "refs": ["Ezech 34:7", "Ezech 34:9", "1 Kon 22:19", "Jes 1:10", "Jes 28:14", "Jer 28:15", "Jer 29:20-24", "Jer 29:31", "Jer 29:32", "Amos 7:16", "Amos 7:17"]}], "3": [{"kopje": "Wee", "refs": ["Ezech 13:18", "Ezech 34:2", "Jer 23:1", "Matt 23:13-29", "Luk 11:42-47", "Luk 11:52", "1 Kor 9:16"]}, {"kopje": "dwaze", "refs": ["Spr 15:2", "Spr 15:14", "Klaagl 2:14", "Hos 9:7", "Zach 11:15", "Matt 23:16-26", "Luk 11:40", "1 Tim 6:4", "2 Tim 3:9"]}, { e tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "1 Kor 11:3-15": "Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus. Iedere man die bidt of profeteert met iets op het hoofd, onteert zijn eigen hoofd; maar iedere vrouw die bidt of profeteert met ongedekt hoofd, onteert haar eigen hoofd; want het is een en hetzelfde, alsof haar het haar afgesneden was.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "1 Kor 14:35": "En als zij iets willen leren, laat hen thuis hun eigen mannen vragen; want het staat lelijk voor de vrouwen dat zij in de Gemeente spreken.", "1 Sam 8:1": "Het gebeurde nu, toen Samuël oud geworden was, dat hij zijn zonen tot richters over Israël aanstelde.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Jer 23:22": "Maar als zij in Mijn raad hadden gestaan, dan zouden zij Mijn volk Mijn woorden hebben laten horen, en zouden hen hebben afgekeerd van hun boze weg, en van de boosheid van hun handelingen.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "1 Kor 9:16": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig!", "Ps 18:13": "Van de glans die voor Hem was, dreven Zijn wolken daarheen, hagel en vurige kolen.", "Jer 14:13-16": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats. En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Spr 21:14": "Een gift in het verborgene houdt de toorn onder, en een geschenk in de schoot de sterke woede.", "Jer 14:13-15": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats. En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Jer 29:21": "Zo zegt de HEERE van de heerscharen, de God van Israël, over Achab, zoon van Kolaja, en over Zedekia, zoon van Maaseja, die u in Mijn Naam leugenachtig profeteren: Ziet, Ik zal hen geven in de hand van Nebukadnezar, de koning van Babel, en hij zal hen voor uw ogen doden.", "Spr 11:22": "Een mooie vrouw die geen verstand heeft, is een gouden ring in een varkenssnuit.", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "Micha 1:6": "Daarom zal Ik Samaria stellen tot een steenhoop van het veld, tot plantingen van een wijngaard; en Ik zal haar stenen in de vallei storten, en haar fundamenten blootleggen.", "Ex 32:11": "Doch Mozes smeekte de HEERE zijn God, en zei: O HEERE, waarom zou Uw toorn ontsteken tegen Uw volk, dat Gij met grote kracht en met een sterke hand uit Egypteland hebt uitgevoerd?", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Joh 10:10-13": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.", "2 Kor 11:13-15": "Want zulke valse apostelen zijn bedrieglijke arbeiders, die zich veranderen in apostelen van Christus. En het is geen wonder, want de satan zelf verandert zich in een engel van het licht. Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Ezech 31:1": "Het gebeurde ook in het elfde jaar, in de derde maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam:", "Kol 2:8": "Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;", "Klaagl 3:7": "Gimel. Hij heeft mij toegemuurd, zodat ik er niet uit kan gaan; Hij heeft mijn koperen boeien verzwaard.", "2 Petr 3:10": "Maar de dag van de Heere zal komen als een dief in de nacht; op die dag zullen de hemelen met een enorm gedruis voorbijgaan, en de elementen zullen brandend vergaan, en de aarde en de werken die daarop zijn, zullen verbranden.", "Jer 28:16": "Daarom, zo zegt de HEERE: Zie, Ik zal u wegwerpen van de aardbodem; dit jaar zult u sterven, omdat u een afval gesproken hebt tegen de HEERE.", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "Ps 20:9": "Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven.", "Ps 69:6": "O God! U weet van mijn dwaasheid, en mijn schulden zijn voor U niet verborgen.", "Jer 23:1": "Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.", "2 Tim 2:14-18": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Est 1:20-22": "Wanneer het bevel van de koning, dat hij zal geven in zijn hele koninkrijk (want het is groot), bekend wordt gemaakt, dan zullen alle vrouwen aan hun mannen eer geven, van de grootste tot de kleinste toe. Dit woord nu vond de koning en de vorsten goed; en de koning deed naar het woord van Memuchan. En hij zond brieven aan alle landschappen van de koning, aan ieder landschap in zijn eigen schrift, en aan elk volk in zijn eigen taal, dat elke man heerser in zijn eigen huis zou zijn, en zou spreken in de taal van zijn volk.", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Jer 8:15": "Men wacht op vrede, maar er is niets goeds, op een tijd van genezing, maar zie, er is verschrikking.", "Ezech 12:20": "En de bewoonde steden zullen woest worden, en het land zal een wildernis zijn; en u zult weten dat Ik de HEERE ben.", "2 Petr 2:18": "Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen;", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Spr 23:4": "Vermoei u niet om rijk te worden; zie af van uw eigen vernuft.", "Ezech 13:1-23": "En het woord van de HEERE gebeurde tot mij, en zei: Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE. Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!", "1 Joh 4:1-3": "Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld. Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God; en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Jer 23:32": "Zie, Ik wil tegen hen die valse dromen profeteren, spreekt de HEERE, en ze vertellen, en Mijn volk verleiden met hun leugens en met hun lichtvaardigheid; terwijl Ik hen niet gezonden heb, en hun niets bevolen heb, en zij dit volk in het geheel geen nut doen, spreekt de HEERE.", "Ezech 29:3": "Spreek en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Farao, koning van Egypte! die grote zeedraak, die in het midden van zijn rivieren ligt; die zegt: Mijn rivier is van mij, en ik heb die voor mijzelf gemaakt.", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Ef 6:14": "Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid;", "Ezech 24:15": "Verder kwam het woord van de HEERE tot mij, en Hij zei:", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "1 Kor 3:1-4": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Deut 29:18": "Dat onder u niet iemand is, man of vrouw, of gezin, of stam, die zijn hart heden afwendt van de HEERE, onze God, om de goden van deze volken te gaan dienen; dat onder u niet een wortel is, die gal en alsem draagt;", "Jes 5:23": "Die de goddeloze rechtvaardigen om een geschenk, en de gerechtigheid van de rechtvaardigen van hen afwenden.", "Jes 13:6": "Huil, want de dag van de HEERE is nabij; hij komt als een verwoesting van de Almachtige.", "Jer 29:8": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Laat uw profeten en uw waarzeggers, die in uw midden zijn, u niet bedriegen, en luistert niet naar uw dromers, die u laat dromen.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ezech 20:38": "Daartoe zal Ik hen die opstandig zijn, en die tegen Mij overtreden, uit u uitzuiveren; Ik zal hen uit het land van hun vreemdelingschap uitleiden, en zij zullen in het land van Israël niet terugkomen, en u zult weten dat Ik de HEERE ben.", "Ex 23:8": "Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "Jer 27:14-17": "Luister dan niet naar de woorden van de profeten die tegen u spreken en zeggen: U zult de koning van Babel niet dienen; want zij profeteren u leugens. Want Ik heb ze niet gezonden, spreekt de HEERE, en zij profeteren leugens in Mijn Naam; met als gevolg dat Ik u wegjaag, en u omkomt, u en de profeten die u profeteren. Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens.", "Jer 23:21": "Ik heb die profeten niet gezonden, toch hebben zij gelopen; Ik heb tot hen niet gesproken, toch hebben zij geprofeteerd.", "Hos 9:3": "Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Amos 7:17": "Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Jes 56:12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Ezech 14:8": "En Ik zal Mijn aangezicht tegen die man zetten, en zal hem stellen tot een teken en tot een spreekwoord, en zal hem uitroeien uit het midden van Mijn volk; en u zult weten dat Ik de HEERE ben.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Rom 2:19-25": "En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn, Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt. Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?", "Hagg 1:4-11": "Is het voor u wel de tijd om te wonen in uw gewelfde huizen, terwijl dit huis woest zal zijn? Nu dan, zo zegt de HEERE van de heerscharen: Let goed op uw wegen. U zaait veel, maar brengt weinig binnen; u eet, maar niet tot verzadiging; u drinkt, maar wordt niet dronken; u kleedt u, maar niet tot uw verwarming, en wie loon ontvangt, ontvangt dat loon in een doorgeboorde buidel.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Ezech 30:1": "Verder gebeurde het woord van de HEERE tot mij: het zei:", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Spr 27:15": "Een aanhoudend druppelen op een dag van slagregen en een twistzieke huisvrouw zijn precies gelijk.", "Ezech 33:1": "En het woord van de HEERE kwam tot mij:", "1 Sam 2:17": "Zo was de zonde van deze jongens zeer groot voor het aangezicht van de HEERE; want de mensen verachtten het spijsoffer van de HEERE.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "1 Kon 22:6": "Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven.", "2 Tim 3:8": "Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Ezech 44:10": "Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen;", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Jer 49:3": "Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Ezech 21:23": "Dit zal in hun ogen als een nutteloze waarzeggerij zijn, omdat zij met eden beëdigd zijn onder hen; maar hij zal aan de ongerechtigheid denken, opdat zij gegrepen worden.", "Joël 3:14": "Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Ezech 38:22": "En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn.", "Micha 2:11": "Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.", "2 Petr 2:1-3": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Zach 11:5": "Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.", "Spr 19:13": "Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Matt 24:26": "Als zij dan tegen u zullen zeggen: Kijk, hij is in de woestijn, ga er niet heen; Kijk, hij is in de binnenkamers, geloof het niet.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Klaagl 2:14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "Matt 20:20-27": "Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets. En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk. Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Gal 1:6-8": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie; terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien. Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Spr 14:15": "De onnozele gelooft elk woord; maar de kloekzinnige let goed op zijn gang.", "Jes 56:10-12": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief. En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek. Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Jer 28:2": "Zo spreekt de HEERE van de heerscharen, de God van Israël, en zegt: Ik heb het juk van de koning van Babel verbroken.", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Ex 17:9-13": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand. Jozua deed zoals Mozes hem gezegd had, en streed tegen Amalek; maar Mozes, Aäron en Hur klommen op de top van de heuvel. En het gebeurde: terwijl Mozes zijn hand ophief, was Israël de sterkste; maar terwijl hij zijn hand neerliet, was Amalek de sterkste.", "Luk 11:52": "Wee u, wetgeleerden, want u hebt de sleutel van de kennis weggenomen; u zelf bent niet naar binnen gegaan, en hen die naar binnen gingen, hebt u tegengehouden.", "Jer 13:20": "Hef uw ogen op, en zie hen die daar uit het noorden komen! Waar is de kudde die u gegeven was, de schapen van uw heerlijkheid?", "Ezech 44:8": "En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.", "Jes 29:6": "U zult van de HEERE van de heerscharen bezocht worden met donder, en met aardbeving, en groot geluid, met wervelwind, en onweer, en de vlam van een verterend vuur.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "Zach 11:15": "Verder zei de HEERE tegen mij: Neem u nog eens het gereedschap van een dwaze herder.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Openb 8:7": "En de eerste engel heeft op de bazuin geblazen, en er kwam hagel en vuur, gemengd met bloed, en die werden op de aarde geworpen; en het derde deel van de bomen is verbrand, en al het groene gras is verbrand.", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Klaagl 2:11-14": "Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk van de dochter van mijn volk; omdat het kind en de zuigeling op de straten van de stad in onmacht zinken; Lamed. Als zij tegen hun moeders zeggen: Waar is koren en wijn, als zij op de straten van de stad in onmacht zinken, als de verslagenen; als hun ziel zich uitschudt in de schoot van hun moeders. Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "1 Kor 3:10-16": "Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Spr 31:10-31": "Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waarde gaat ver boven de robijnen. Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken. Gimel. Zij doet hem goed en geen kwaad, al de dagen van haar leven.", "Matt 23:4": "Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Nahum 3:6": "En Ik zal verfoeilijke dingen op u werpen, en u tot schande maken, en Ik zal u als een spiegel stellen.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Deut 18:20-22": "Maar de profeet die hoogmoedig handelt door een woord te spreken in Mijn Naam, dat Ik hem niet geboden heb te spreken, of die zal spreken in de naam van andere goden, die profeet zal sterven. Als u dan in uw hart zou zeggen: Hoe zullen wij het woord kennen dat de HEERE niet gesproken heeft? Wanneer die profeet in de Naam van de HEERE gesproken heeft, en dat woord gebeurt niet en komt niet uit, dan is dat het woord dat de HEERE niet gesproken heeft; door trots heeft die profeet dat gesproken; u hoeft niet bevreesd voor hem te zijn.", "1 Tim 5:1-16": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders; De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid. Eer de weduwen, die echt weduwen zijn.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "2 Tess 2:11": "En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "Jer 28:12-17": "Doch het woord van de HEERE kwam tot Jeremia (nadat de profeet Hananja het juk van de hals van de profeet Jeremia verbroken had), en zei: Ga heen en spreek tot Hananja, en zeg: Zo zegt de HEERE: Houten jukken hebt u verbroken, nu zult u in plaats daarvan ijzeren jukken maken. Want zo zegt de HEERE van de heerscharen, de God van Israël: Ik heb een ijzeren juk gedaan aan de hals van al deze volken, om Nebukadnezar, de koning van Babel, te dienen, en zij zullen hem dienen; ja, Ik heb hem ook het gedierte van het veld gegeven.", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Ezech 30:3": "Want de dag is dichtbij, ja, de dag van de HEERE is dichtbij, een wolkige dag, het zal de tijd van de heidenvolken zijn.", "Jer 27:9-18": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen. Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt. Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "Jer 27:9": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Ezech 17:1": "En het woord van de HEERE kwam tot mij en zei:", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "2 Tim 3:7": "vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Luk 11:40": "Dwazen! Heeft Hij die de buitenkant gemaakt heeft, niet ook de binnenkant gemaakt?", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "1 Kon 12:31": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "Mal 2:1-3": "En nu, priesters, dit gebod wordt tot u gezonden. Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt. Zie, Ik zal het zaad voor u verderven; en Ik zal drek op uw gezichten strooien, de drek van uw feesten, zodat men u daarmee wegnemen zal.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Spr 21:9": "Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.", "Ezech 4:3": "Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Ezra 2:59": "Dezen trokken ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; maar zij konden van het huis van hun vaderen en hun nageslacht niet bewijzen of zij uit Israël waren.", "Jer 23:26": "Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart.", "1 Kon 22:37": "Zo stierf de koning, en werd naar Samaria gebracht; en zij begroeven de koning te Samaria.", "Gen 2:18": "Ook had de HEERE God gesproken: Het is niet goed dat de mens alleen is; Ik zal hem een hulp maken, die bij hem past.", "Jer 27:14": "Luister dan niet naar de woorden van de profeten die tegen u spreken en zeggen: U zult de koning van Babel niet dienen; want zij profeteren u leugens.", "Ezech 21:3": "En zeg tegen het land van Israël: Zo zegt de HEERE: Zie, Ik zál tegen u, en Ik zal Mijn zwaard uit zijn schede trekken; en Ik zal van u uitroeien de rechtvaardige en de goddeloze.", "Zach 13:3": "En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Ef 6:13": "Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven.", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Ezech 25:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Ezech 28:20": "Verder gebeurde het woord van de HEERE tot mij:", "Jer 28:15": "En de profeet Jeremia zei tegen de profeet Hananja: Hoor nu, Hananja! De HEERE heeft u niet gezonden, maar u hebt gemaakt dat dit volk op leugen vertrouwt.", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "1 Sam 8:3": "Doch zijn zonen wandelden niet in zijn wegen, maar neigden zich naar de gierigheid, en namen geschenken aan, en bogen het recht.", "Matt 23:16-26": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "1 Sam 9:8": "En de knecht antwoordde Saul verder en zei: Zie, ik heb bij me het vierde deel van een zilveren sikkel; dat zal ik de man van God geven, opdat hij ons onze weg wijst.", "Pred 7:7": "Voorwaar, de onderdrukking zou wel een wijze dol maken; en het geschenk verdoemt het hart.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Mark 12:1": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland.", "Jes 28:18": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden.", "Zach 11:17": "Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden.", "Hagg 2:18": "Ik sloeg u met brandkoren, met honingdauw en met hagel, al het werk van uw handen; en u keerde u niet tot Mij, spreekt de HEERE.", "Jer 5:14": "Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Ps 107:25": "Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Jes 3:12": "De drijvers van Mijn volk zijn kinderen, en vrouwen heersen over hen. O Mijn volk! die u leiden, verleiden u, en de weg van uw paden slokken zij in.", "Richt 9:38": "Toen zei Zebul tegen hem: Waar is nu uw grote mond, waarmee u zei: Wie is Abimelech, dat wij hem zouden dienen? Is dit niet het volk dat u veracht hebt? Trek toch nu uit en strijd tegen hem!", "Gen 2:21-24": "Toen deed de HEERE God een diepe slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot de plaats daarvan toe met vlees. En de HEERE God bouwde de rib, die Hij van Adam genomen had, tot een vrouw, en Hij bracht haar bij Adam. Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Jer 23:2": "Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "2 Kon 4:42": "En er kwam een man van Baäl-Salisa, en bracht de man Gods brood van de eerstelingen, twintig gerstebroden, en groene aren in hun schillen; en hij zei: Geef aan het volk, zodat zij eten.", "Ezech 34:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Matt 7:22": "Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan?", "Mark 10:35-37": "En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden graag willen dat U voor ons deed wat wij ook zullen vragen. En Hij zei tegen hen: Wat wilt u dat Ik voor u doe? En zij zeiden tegen Hem: Geef ons dat wij mogen zitten, de één aan Uw rechterhand, en de ander aan Uw linkerhand, in Uw heerlijkheid.", "Jer 14:14": "En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart.", "Tit 2:3-5": "De oude vrouwen eveneens, dat zij zich gedragen zoals bij heiligheid past, geen lasteraarsters zijn, zich niet overgeven aan veel wijn, maar leraressen zijn van het goede; Opdat zij de jonge vrouwen leren bezonnen te zijn, hun mannen lief te hebben, hun kinderen lief te hebben; Matig te zijn, kuis te zijn, het huis te bewaren, goed te zijn, hun eigen mannen onderdanig te zijn, opdat het Woord van God niet gelasterd wordt.", "Jer 14:15": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Zef 1:14-18": "De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen. Die dag zal een dag van verbolgenheid zijn; een dag van benauwdheid en angst, een dag van woestheid en verwoesting, een dag van duisternis en donkerheid, een dag van wolk en dikke duisternis; Een dag van de bazuin en van het geschal tegen de vaste steden en tegen de hoge hoeken.", "Ezech 39:1": "Verder, mensenkind! Profeteer tegen Gog en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Gog, hoofdvorst van Mesech en Tubal!", "Jer 5:30": "Een verschrikkelijke en afschuwelijke zaak gebeurt er in het land.", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Micha 5:11": "En Ik zal de toverijen uit uw hand uitroeien, en u zult geen guichelaars meer hebben.", "2 Petr 2:19": "zij beloven hun vrijheid, terwijl zijzelf slaven zijn van de verdorvenheid; want door wie iemand overwonnen is, daarvan is hij ook tot een slaaf gemaakt.", "Ezech 22:28": "Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.", "Jer 23:15": "Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land.", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Openb 16:14": "Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God.", "Ezech 7:1": "Daarna kwam het woord van de HEERE tot mij, en Hij zei:", "Joh 3:10": "Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet?", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Ezech 29:1": "In het tiende jaar, in de tiende maand, op de twaalfde dag van de maand, kwam het woord van de HEERE tot mij. Hij zei:", "Lev 26:28": "Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Spr 17:8": "Het geschenk is in de ogen van wie het bezit een aangenaam gesteente; waarheen het zich ook wendt, het zal wel gedijen.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Jer 20:3-6": "Maar het gebeurde de volgende dag dat Pashur Jeremia uit de gevangenis liet halen; toen zei Jeremia tegen hem: De HEERE noemt uw naam niet Pashur, maar Magor-missabib. Want zo zegt de HEERE: Zie, Ik maak u tot een schrik voor uzelf en voor al uw vrienden; die zullen vallen door het zwaard van hun vijanden, zodat uw ogen het zien; en Ik zal heel Juda geven in de hand van de koning van Babel, die hen naar Babel gevankelijk zal wegvoeren en hen zal doden met het zwaard. Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Openb 2:15": "Zo hebt u ook mensen die de leer van de Nikolaieten vasthouden; wat Ik haat.", "Ezech 22:26": "Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "Luk 21:8": "En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na.", "Matt 24:5": "Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Jes 32:19": "Maar het zal hagelen, waar men afgaat in het woud, en de stad zal laag worden in de laagte.", "Ezra 2:62": "Dezen zochten hun register, onder hen die in het geslachtsregister opgenomen waren, maar zij werden niet gevonden; daarom werden zij als onreinen van het priesterschap geweerd.", "Ezech 34:9": "Daarom, u herders! Hoor het woord van de HEERE!", "Ezech 15:1": "En het woord van de HEERE kwam tot mij:", "Ezech 26:1": "En het gebeurde in het elfde jaar, op de eerste van de maand, dat het woord van de HEERE tot mij kwam en zei:", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Ezech 20:45": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Jer 2:28": "Waar zijn dan uw goden, die u zich gemaakt hebt? Laat ze opstaan, of zij u ten tijde van uw kwaad zullen verlossen; want naar het getal van uw steden zijn uw goden, Juda!", "Mark 13:6": "Want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Openb 2:14": "Maar Ik heb enkele weinige dingen tegen u, dat u daar mensen hebt die de leer van Balaäm vasthouden, die Balak leerde de kinderen van Israël een aanstoot voor te werpen, opdat zij afgodenoffer zouden eten en hoereren.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Ezech 12:23": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen.", "Ezech 35:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Joh 13:38": "Jezus antwoordde hem: Zult u uw leven voor Mij geven? Voorwaar, voorwaar, Ik zeg u: De haan zal niet kraaien, totdat u Mij driemaal verloochend zult hebben.", "Jes 34:8": "Want het zal zijn de dag van de wraak van de HEERE, een jaar van vergeldingen, om de rechtszaak van Sion.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Matt 7:15": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.", "Ezech 24:20": "En ik zei tegen hen: Het woord van de HEERE is tot mij gekomen, en Hij zei:", "Ezech 11:14": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "1 Joh 2:18": "Kinderen, het is het laatste uur; en zoals u gehoord hebt, dat de antichrist komt, zo zijn er nu ook al veel antichristen gekomen; waaraan wij weten, dat het het laatste uur is.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Deut 16:19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "Jer 12:10": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Hos 10:13": "U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.", "Ezech 12:1": "Verder kwam het woord van de HEERE tot mij en Hij zei:", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "Ezech 32:17": "Verder gebeurde het in het twaalfde jaar, op de vijftiende dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Ezech 30:8": "En zij zullen weten dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben aangestoken, en al zijn helpers zullen verbroken worden.", "Fil 4:3": "En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.", "Ezech 32:1": "Het gebeurde ook in het twaalfde jaar, in de twaalfde maand op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei:", "Jes 44:20": "Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Klaagl 2:13": "Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Ezech 29:6": "En alle inwoners van Egypte zullen weten dat Ik de HEERE ben, omdat zij voor het huis van Israël een rietstok geweest zijn.", "Micha 3:5-7": "Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog. Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden. En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Ezech 16:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "2 Kon 3:13": "Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Jer 10:21": "Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Klaagl 4:13": "Mem. Het is vanwege de zonden van haar profeten, en de misdaden van haar priesters, die in haar midden het bloed van de rechtvaardigen vergoten hebben.", "1 Kon 22:25": "En Micha zei: Zie, u zult het zien, op diezelfde dag, als u van kamer naar kamer zult gaan om u te verstoppen.", "Jer 23:19": "Zie, een onweer van de HEERE, een grimmigheid is uitgegaan, ja, een pijnlijk onweer, het zal blijven op het hoofd van de goddelozen.", "Openb 11:19": "En de tempel van God in de hemel is geopend, en de ark van het verbond is gezien in Zijn tempel; en er kwamen bliksems, en stemmen, en donderslagen, en aardbeving, en grote hagel.", "Ezech 22:17": "Verder kwam het woord van de HEERE tot mij; Hij zei:", "1 Tim 1:3-7": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren; Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is. Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Ezech 38:1": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei:", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Jer 23:28-32": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE. Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt? Daarom, zie, Ik wil tegen de profeten, spreekt de HEERE, die Mijn woorden stelen, ieder van zijn naaste;", "Joël 2:31": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.", "Num 16:47": "En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Spr 12:4": "Een kloeke huisvrouw is een kroon voor haar man; maar zij die beschaamd maakt, is als verrotting in zijn beenderen.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Jer 29:20-24": "U dan, hoort het woord van de HEERE, u allen die gevankelijk zijt weggevoerd, die Ik van Jeruzalem naar Babel heb weggezonden! Zo zegt de HEERE van de heerscharen, de God van Israël, over Achab, zoon van Kolaja, en over Zedekia, zoon van Maaseja, die u in Mijn Naam leugenachtig profeteren: Ziet, Ik zal hen geven in de hand van Nebukadnezar, de koning van Babel, en hij zal hen voor uw ogen doden. En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Openb 2:20-23": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ezech 35:3": "En zeg ertegen: Zo zegt de Heere HEERE: Zie, Ik heb het tegen u, o gebergte Seir! En Ik zal Mijn hand tegen u uitstrekken, en zal u maken tot een verwoesting en een verlatenheid.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "2 Tess 2:10": "en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Openb 20:8": "En hij zal uitgaan om de volken te verleiden, die in de vier hoeken van de aarde zijn, Gog en Magog, om hen te verzamelen tot de strijd; hun aantal is als het zand aan de zee.", "Zach 10:2": "Want de terafim² spreken onwaarheid, en de waarzeggers zien bedrog, en zij spreken loze dromen, zij troosten met leegte; daarom zijn zij weggetrokken als schapen, zij zijn onderdrukt geworden, want er was geen herder.", "Mark 13:21": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Spr 25:24": "Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.", "1 Tim 4:7": "Maar wijs de ongoddelijke en oudwijfse verzinsels af; oefen uzelf in plaats daarvan in godvruchtigheid.", "Jer 48:11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "Gen 3:4": "Toen zei de slang tegen de vrouw: U zult zeker niet sterven;", "Jes 3:16-24": "Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren. Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "Ezech 24:1": "Verder kwam het woord van de HEERE tot mij, in het negende jaar, in de tiende maand, op de tiende dag van de maand, en Hij zei:", "Openb 13:8": "En allen die op de aarde wonen, zullen hem aanbidden, van wie de namen niet zijn geschreven in het boek des levens van het Lam, Dat geslacht is, van de grondlegging van de wereld af.", "Openb 3:15": "Ik ken uw werken, dat u noch koud bent, noch heet; och, was u maar koud of heet!", "1 Sam 9:7": "Toen zei Saul tegen zijn knecht: Maar zie, als wij gaan, wat zullen we die man dan brengen? Want het brood is op uit onze zakken, en wij hebben geen geschenk om de man van God te brengen; wat hebben wij?", "Jer 4:10": "Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.", "1 Kon 22:19": "Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand.", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "Ezech 21:18": "Opnieuw kwam het woord van de HEERE tot mij, en Hij zei:", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Jer 23:16": "Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Ezech 13:10-15": "Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk. Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten. Zie, als die wand gevallen zal zijn, zal er dan niet tegen u gezegd worden: Waar is de pleistering waarmee u gepleisterd hebt?", "Ezech 22:13": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is.", "Jer 23:13-15": "Ik heb wel dwaasheid gezien in de profeten van Samaria; zij profeteerden door Baäl, en verleidden Mijn volk Israël. Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land.", "1 Kon 22:27": "En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood van benauwdheid en water van benauwdheid, totdat ik in vrede terugkom.", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Tit 1:10-12": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn; hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin. Iemand uit hen, hun eigen profeet, heeft gezegd: De Kretenzers zijn altijd leugenachtig, kwade beesten, luie buiken.", "Richt 4:4": "Debora nu, een vrouw die een profetes was, de vrouw van Lappidoth, zij richtte in die tijd Israël.", "Ezech 15:7": "Want Ik zal Mijn aangezicht tegen hen zetten; als zij van het ene vuur uitgaan, zal het andere vuur hen verteren; en u zult weten, dat Ik de HEERE ben, als Ik Mijn aangezicht tegen hen gesteld zal hebben.", "Ezech 28:22": "En zeg: Zo zegt de Heere HEERE: Zie, Ik zál tegen u zijn, o Si
