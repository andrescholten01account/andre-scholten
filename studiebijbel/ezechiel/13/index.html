ofeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE.","3":"Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!","4":"Uw profeten, Israël, zijn als vossen in de woeste plaatsen.","5":"U bent niet in de bressen opgetreden, en hebt de muur niet toegemuurd voor het huis van Israël, om in de strijd te staan, op de dag van de HEERE.","6":"Zij zien nietigheid en leugenachtige voorzegging, zij die zeggen: De HEERE heeft gesproken, terwijl de HEERE hen niet gezonden heeft; en zij geven hoop dat het woord vervuld zal worden.","7":"Ziet u niet een nietig gezicht, en spreekt u een leugenachtige voorzegging, als u zegt: De HEERE spreekt, terwijl Ik niet gesproken heb?","8":"Daarom zegt de Heere HEERE zo: Omdat u nietigheid spreekt, en leugen ziet; daarom, zie, Ik ben tegen u, spreekt de Heere HEERE.","9":"En Mijn hand zal zijn tegen de profeten die nietigheid zien, en leugen voorzeggen; zij zullen niet in de vergadering van Mijn volk zijn, en in het geschrift van het huis van Israël niet geschreven worden, en in het land van Israël niet komen; en u zult weten dat Ik de Heere HEERE ben.","10":"Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk.","11":"Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.","12":"Zie, als die wand gevallen zal zijn, zal er dan niet tegen u gezegd worden: Waar is de pleistering waarmee u gepleisterd hebt?","13":"Daarom zegt de Heere HEERE zo: Ja, Ik zal hem door een grote stormwind in Mijn grimmigheid splijten, en er zal een overstelpende plasregen zijn in Mijn toorn, en grote hagelstenen in Mijn grimmigheid, om hem te verdoen.","14":"Zo zal Ik de wand afbreken die u met loze kalk gepleisterd hebt, en zal hem neerwerpen op de aarde, zodat zijn grond ontdekt zal worden; zo zal de stad vallen, en u zult in het midden ervan omkomen; en u zult weten dat Ik de HEERE ben.","15":"Zo zal Ik Mijn grimmigheid tegen de wand voleindigen, en tegen hen die hem pleisteren met loze kalk; en Ik zal tegen u zeggen: Die wand is er niet meer, en zij die hem pleisterden, zijn er niet meer;","16":"Namelijk de profeten van Israël, die over Jeruzalem profeteren, en voor haar een gezicht van vrede zien, terwijl er geen vrede is, spreekt de Heere HEERE.","17":"En u, mensenkind, zet uw gezicht tegen de dochters van uw volk, die profeteren uit hun eigen hart, en profeteer tegen hen;","18":"En zeg: Zo zegt de Heere HEERE: Wee over die vrouwen, die kussens naaien voor alle oksels van de armen, en hoofddeksels maken voor het hoofd van elke lengte, om de zielen te vangen! Zult u de zielen van Mijn volk vangen, en zult u voor uzelf de zielen in leven houden?","19":"En zult u Mij ontheiligen bij Mijn volk, voor handvollen gerst en voor stukken brood, om zielen te doden die niet zouden sterven, en om zielen in leven te houden die niet zouden leven, door uw liegen tegen Mijn volk, dat de leugen hoort?","20":"Daarom zegt de Heere HEERE zo: Zie, Ik ben tegen uw kussens, waarmee u daar de zielen vangt naar de vogels*; en Ik zal ze van uw armen wegscheuren; en Ik zal die zielen loslaten, de zielen die u vangt naar de vogels.","21":"Verder zal Ik uw hoofddeksels scheuren, en Mijn volk uit uw hand redden, zodat zij niet meer in uw hand zullen zijn om gevangen te worden; en u zult weten dat Ik de HEERE ben.","22":"Omdat u het hart van de rechtvaardige door valsheid bedroefd hebt gemaakt, terwijl Ik hem geen smart aangedaan heb; en omdat u de handen van de goddeloze gesterkt hebt, zodat hij zich van zijn boze weg niet zou afkeren, doordat ik hem in leven zou houden;","23":"Daarom zult u niet meer nietigheid zien, en geen waarzegging meer gebruiken; maar Ik zal Mijn volk uit uw hand redden, en u zult weten dat Ik de HEERE ben."},"SV":{"1":"En des HEEREN woord geschiedde tot mij, zeggende:","2":"Mensenkind, profeteer tegen de profeten Israëls, die profeteren, en zeg tot degenen, die uit hun hart profeteren: Hoort des HEEREN woord.","3":"Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun geest nawandelen, en hetgeen zij niet gezien hebben!","4":"Uw profeten, o Israël, zijn als vossen in de woeste plaatsen.","5":"Gij zijt in de bressen niet opgetreden, noch hebt den muur toegemuurd voor het huis Israëls, om in den strijd te staan, ten dage des HEEREN.","6":"Zij zien ijdelheid en leugenachtige voorzegging, die daar zeggen: De HEERE heeft gesproken, daar de HEERE hen niet gezonden heeft; en zij geven hope van het woord te zullen bevestigen.","7":"Ziet gij niet een ijdel gezicht, en spreekt een leugenachtige voorzegging, als gij zegt: De HEERE spreekt, daar Ik niet gesproken heb?","8":"Daarom zo zegt de Heere HEERE: omdat gijlieden ijdelheid spreekt, en leugen ziet; daarom, ziet, Ik *wil* aan u, spreekt de Heere HEERE.","9":"En Mijn hand zal zijn tegen de profeten, die ijdelheid zien, en leugen voorzeggen; zij zullen in de vergadering Mijns volks niet zijn, en in het schrift van het huis Israëls niet geschreven worden, en in het land Israëls niet komen; en gij zult weten, dat Ik de Heere HEERE ben.","10":"Daarom, ja, daarom dat zij Mijn volk verleiden, zeggende: Vrede, daar geen vrede is; en *dat* de een een lemen wand bouwt, en ziet, de anderen denzelven pleisteren met loze kalk.","11":"Zeg tot degenen, die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en gij, o grote hagelstenen, zult vallen, en een grote stormwind zal *hem* splijten.","12":"Ziet, als die wand zal gevallen zijn, zal dan niet tot u gezegd worden: Waar is de pleistering, waarmede gij gepleisterd hebt?","13":"Daarom alzo zegt de Heere HEERE: Ja, Ik zal *hem* door een groten stormwind in Mijn grimmigheid splijten, en er zal een overstelpende plasregen zijn in Mijn toorn, en grote hagelstenen in *Mijn* grimmigheid, om *dien* te verdoen.","14":"Zo zal Ik den wand afbreken, dien gijlieden met loze kalk gepleisterd hebt, en zal hem ter aarde nederwerpen, dat zijn grond zal ontdekt worden; alzo zal *de* *stad* vallen, en gij zult in het midden van haar omkomen; en gij zult weten, dat Ik de HEERE ben.","15":"Zo zal Ik Mijn grimmigheid tegen den wand voortbrengen, en tegen degenen, die hem pleisteren met loze kalk; en Ik zal tot ulieden zeggen: Die wand is er niet *meer*, en die hem pleisterden, zijn er niet;","16":"*Te* *weten* de profeten Israëls, die van Jeruzalem profeteren, en voor haar een gezicht des vredes zien, waar geen vrede is, spreekt de Heere HEERE.","17":"En gij, mensenkind, zet uw aangezicht tegen de dochteren uws volks, dewelke profeteren uit haar hart, en profeteer tegen haar;","18":"En zeg: Zo zegt de Heere HEERE: Wee *die* *vrouwen*, die kussens naaien voor alle okselen der armen, en maken hoofddeksels voor het hoofd van alle statuur, om de zielen te jagen! Zult gij de zielen Mijns volks jagen, en zult gij u de zielen in het leven behouden?","19":"En zult gij Mij ontheiligen bij Mijn volk, voor handvollen van gerst, en voor stukken broods, om zielen te doden, die niet zouden sterven, en om zielen in het leven te behouden, die niet zouden leven, door uw liegen tot Mijn volk, dat de leugen hoort?","20":"Daarom, zo zegt de Heere HEERE: Ziet, Ik *wil* aan uw kussens, waarmede gij aldaar de zielen jaagt naar de bloemhoven, en Ik zal ze uit uw armen wegscheuren; en Ik zal die zielen losmaken, de zielen, die gij jaagt naar de bloemhoven.","21":"Daartoe zal Ik uw hoofddeksels scheuren, en Mijn volk uit uw hand redden, zodat zij niet meer in uw hand zullen zijn tot een jacht; en gij zult weten, dat Ik de HEERE ben.","22":"Omdat gijlieden het hart des rechtvaardigen *door* valsheid hebt bedroefd gemaakt, daar Ik hem geen smart aangedaan heb; en omdat gij de handen des goddelozen gesterkt hebt, opdat hij zich van zijn bozen weg niet afkeren zou, dat Ik hem in het leven behield;","23":"Daarom zult gij niet meer ijdelheid zien, noch waarzegging gebruiken; maar Ik zal Mijn volk uit uw hand redden, en gij zult weten, dat Ik de HEERE ben."},"KJV":{"1":"And the word of the LORD came unto me, saying,","2":"Son of man, prophesy against the prophets of Israel that prophesy, and say thou unto them that prophesy out of their own hearts, Hear ye the word of the LORD;","3":"Thus saith the Lord GOD; Woe unto the foolish prophets, that follow their own spirit, and have seen","4":"O Israel, thy prophets are like the foxes in the deserts.","5":"Ye have not gone up into the gaps, neither made up the hedge for the house of Israel to stand in the battle in the day of the LORD.","6":"They have seen vanity and lying divination, saying, The LORD saith: and the LORD hath not sent them: and they have made *others* to hope that they would confirm the word.","7":"Have ye not seen a vain vision, and have ye not spoken a lying divination, whereas ye say, The LORD saith *it*; albeit I have not spoken?","8":"Therefore thus saith the Lord GOD; Because ye have spoken vanity, and seen lies, therefore, behold, I *am* against you, saith the Lord GOD.","9":"And mine hand shall be upon the prophets that see vanity, and that divine lies: they shall not be in the assembly of my people, neither shall they be written in the writing of the house of Israel, neither shall they enter into the land of Israel; and ye shall know that I *am* the Lord GOD.","10":"Because, even because they have seduced my people, saying, Peace; and *there was* no peace; and one built up a wall, and, lo, others daubed it with untempered","11":"Say unto them which daub *it* with untempered *morter*, that it shall fall: there shall be an overflowing shower; and ye, O great hailstones, shall fall; and a stormy wind shall rend","12":"Lo, when the wall is fallen, shall it not be said unto you, Where *is* the daubing wherewith ye have daubed","13":"Therefore thus saith the Lord GOD; I will even rend *it* with a stormy wind in my fury; and there shall be an overflowing shower in mine anger, and great hailstones in *my* fury to consume","14":"So will I break down the wall that ye have daubed with untempered *morter*, and bring it down to the ground, so that the foundation thereof shall be discovered, and it shall fall, and ye shall be consumed in the midst thereof: and ye shall know that I *am* the LORD.","15":"Thus will I accomplish my wrath upon the wall, and upon them that have daubed it with untempered *morter*, and will say unto you, The wall *is* no *more*, neither they that daubed","16":"*To wit*, the prophets of Israel which prophesy concerning Jerusalem, and which see visions of peace for her, and *there is* no peace, saith the Lord GOD.","17":"Likewise, thou son of man, set thy face against the daughters of thy people, which prophesy out of their own heart; and prophesy","18":"And say, Thus saith the Lord GOD; Woe to the *women* that sew pillows to all armholes, and make kerchiefs upon the head of every stature to hunt souls! Will ye hunt the souls of my people, and will ye save the souls alive","19":"And will ye pollute me among my people for handfuls of barley and for pieces of bread, to slay the souls that should not die, and to save the souls alive that should not live, by your lying to my people that hear *your* lies?","20":"Wherefore thus saith the Lord GOD; Behold, I *am* against your pillows, wherewith ye there hunt the souls to make *them* fly, and I will tear them from your arms, and will let the souls go, *even* the souls that ye hunt to make *them* fly.","21":"Your kerchiefs also will I tear, and deliver my people out of your hand, and they shall be no more in your hand to be hunted; and ye shall know that I *am* the LORD.","22":"Because with lies ye have made the heart of the righteous sad, whom I have not made sad; and strengthened the hands ss=\"wl wl-kjv\" data-code=\"H5475\">assembly</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> neither shall they be <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> neither shall they <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","10":"Because, even because they have <span class=\"wl wl-kjv\" data-code=\"H2937\">seduced</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace;</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> and one built <span class=\"wl wl-kjv\" data-code=\"H1129\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H2434\">wall,</span> and, <span class=\"wl wl-kjv\" data-code=\"H2009\">lo,</span> others <span class=\"wl wl-kjv\" data-code=\"H2902\">daubed</span> it with untempered","11":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> unto them which <span class=\"wl wl-kjv\" data-code=\"H2902\">daub</span> it with <span class=\"wl wl-kjv\" data-code=\"H8602\">untempered</span> morter, that it shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall:</span> there shall be an <span class=\"wl wl-kjv\" data-code=\"H7857\">overflowing</span> <span class=\"wl wl-kjv\" data-code=\"H1653\">shower;</span> and <span class=\"wl wl-kjv\" data-code=\"H859\">ye,</span> O great <span class=\"wl wl-kjv\" data-code=\"H417\">hailstones,</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall;</span> and a <span class=\"wl wl-kjv\" data-code=\"H5591\">stormy</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> shall rend","12":"Lo, when the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> is <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen,</span> shall it not be <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto you, Where is the <span class=\"wl wl-kjv\" data-code=\"H2915\">daubing</span> wherewith ye have daubed","13":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will even <span class=\"wl wl-kjv\" data-code=\"H1234\">rend</span> it with a <span class=\"wl wl-kjv\" data-code=\"H5591\">stormy</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> in my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury;</span> and there shall be an <span class=\"wl wl-kjv\" data-code=\"H7857\">overflowing</span> <span class=\"wl wl-kjv\" data-code=\"H1653\">shower</span> in mine <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and great <span class=\"wl wl-kjv\" data-code=\"H417\">hailstones</span> in my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to consume","14":"So will I break <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> that ye have <span class=\"wl wl-kjv\" data-code=\"H2902\">daubed</span> with <span class=\"wl wl-kjv\" data-code=\"H8602\">untempered</span> morter, and <span class=\"wl wl-kjv\" data-code=\"H5060\">bring</span> it down to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H3247\">foundation</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> thereof: and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","15":"Thus will I <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplish</span> my <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> and upon them that have <span class=\"wl wl-kjv\" data-code=\"H2902\">daubed</span> it with <span class=\"wl wl-kjv\" data-code=\"H8602\">untempered</span> morter, and will <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto you, The <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> is no more, neither they that daubed","16":"To wit, the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> which <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> concerning <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and which <span class=\"wl wl-kjv\" data-code=\"H2374\">see</span> <span class=\"wl wl-kjv\" data-code=\"H2377\">visions</span> of <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> for her, and there is no <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","17":"Likewise, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> against the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> out of their own <span class=\"wl wl-kjv\" data-code=\"H3820\">heart;</span> and prophesy","18":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> <span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> to the women that <span class=\"wl wl-kjv\" data-code=\"H8609\">sew</span> <span class=\"wl wl-kjv\" data-code=\"H3704\">pillows</span> to all <span class=\"wl wl-kjv\" data-code=\"H679\">armholes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H4555\">kerchiefs</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of every <span class=\"wl wl-kjv\" data-code=\"H6967\">stature</span> to <span class=\"wl wl-kjv\" data-code=\"H6679\">hunt</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">souls!</span> Will ye <span class=\"wl wl-kjv\" data-code=\"H6679\">hunt</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and will ye <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> alive","19":"And will ye <span class=\"wl wl-kjv\" data-code=\"H2490\">pollute</span> me among my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> for <span class=\"wl wl-kjv\" data-code=\"H8168\">handfuls</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> and for <span class=\"wl wl-kjv\" data-code=\"H6595\">pieces</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that should not <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2421\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">alive</span> that should not <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> by your <span class=\"wl wl-kjv\" data-code=\"H3576\">lying</span> to my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> your lies?","20":"Wherefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I am against your <span class=\"wl wl-kjv\" data-code=\"H3704\">pillows,</span> wherewith <span class=\"wl wl-kjv\" data-code=\"H859\">ye</span> there <span class=\"wl wl-kjv\" data-code=\"H6679\">hunt</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> to make them <span class=\"wl wl-kjv\" data-code=\"H6524\">fly,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7167\">tear</span> them from your <span class=\"wl wl-kjv\" data-code=\"H2220\">arms,</span> and will let the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> even the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that ye <span class=\"wl wl-kjv\" data-code=\"H6679\">hunt</span> to make them fly.","21":"Your <span class=\"wl wl-kjv\" data-code=\"H4555\">kerchiefs</span> also will I <span class=\"wl wl-kjv\" data-code=\"H7167\">tear,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and they shall be no more in your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to be <span class=\"wl wl-kjv\" data-code=\"H4686\">hunted;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","22":"Because with <span class=\"wl wl-kjv\" data-code=\"H8267\">lies</span> ye have made the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H3512\">sad,</span> whom I have not made <span class=\"wl wl-kjv\" data-code=\"H3510\">sad;</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked,</span> that he should not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> from his <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> by promising him life:","23":"Therefore ye shall <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> no more <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7080\">divine</span> <span class=\"wl wl-kjv\" data-code=\"H7081\">divinations:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"profeten Israëls,","tekst":"Te weten die daar in Chaldea waren onder de weggevoerde Joden, die hen wilden wijsmaken dat zij in hun vaderland haast zouden wederkeren; zie van dezen ook Jer 29:8 . Zij hadden ook hunne metgezellen in Jeruzalem; Jer 23:16-17 ."},{"catchword":"die profeteren,","tekst":"Dat is, die het profetisch ambt, doch valselijk, zich aantrekken."},{"catchword":"uit hun hart profeteren","tekst":"Hebreeuws, de profeten uit hun hart, dat is, die profeteren hetgeen uit hun eigen goeddunken, oordeel en drijving voortkomt, en niet van God. Zulke profeten worden gezegd valse gezichten en de bedriegerij van hun hart te profeteren, Jer 14:14 , van de gezichten van hun hart te spreken, Jer 23:16 ; profeten te zijn van de bedriegerij van hun hart, Jer 23:26 ; hunnen geest na te wandelen; hier in vs.3. Zie het tegendeel Num 16:28 , en de aantekening aldaar."}],"3":[{"catchword":"hun geest nawandelen,","tekst":"Dat is, hun eigen verstand en ingeving volgen in het voorstellen van hun gewaande profetieën. Vergelijk de aantekening op vs.2."},{"catchword":"niet gezien hebben","tekst":"Te weten dat hun in enig gezicht van God vertoond zou zijn, om dat uit zijn naam het volk te verkondigen. Het woord zien is dikwijls aldus genomen, gelij Num 24:4 ; Isa 30:10 ; Lam 2:14 , en hier onder vs.6-8. Hiervan worden de profeten zieners genaamd. Zie 1Sa 9:9 , en 2Ch 9:29 ."}],"4":[{"catchword":"als vossen in de woeste plaatsen","tekst":"Te weten die, in woeste, dorre en verlaten plaatsen zijnde, waar zeer weinig te roven is, zeer gretig zijn om het allerslechtste, waar zij het krijgen kunnen, op te snappen."}],"5":[{"catchword":"Gij zijt","tekst":"Te weten valse profeten."},{"catchword":"in de bressen niet opgetreden,","tekst":"Het is ene gelijkenis, genomen van den krijgshandel, waar de kloeke soldaten zich in de bres, die in den stadsmuur van den vijand gemaakt is, moedig stellen, om den vijand daaruit te houden; hetwelk de valse profeten moesten nagevolgd hebben met gebeden tot God en vermaningen tot de gemeente, om de oordelen en straffen Gods af te keren. Zie dezelfde manier van spreken Psa 106:23 , Psa 106:30 , en onder Eze 22:30 ."},{"catchword":"den muur toegemuurd","tekst":"Te weten als hij gebroken was; het is een andere gelijkenis, genomen van de hoven, welker heiningen en muren, als zij beschadigd zijn van de wilde dieren, moeten voorzien worden tegen nieuwen inval derzelven. Zie van dezelfde gelijkenis onder Eze 22:30 ."},{"catchword":"ten dage des HEEREN","tekst":"Versta den tijd, in welken de Heere de Chaldeën over de Israëlieten uitzenden zou, om hen te verderven. Dag des Heeren voor dag der straf, of wraak. Zie Job 24:1 ."}],"6":[{"catchword":"Zij zien","tekst":"Te weten de valse profeten, die Ezechiël in den tweeden persoon toegesproken had, vs.5, van wie hij nu spreekt in den derden persoon, alsook boven vs.4. Zie van dergelijke verandering in persoon, Job 18:4 ."},{"catchword":"ijdelheid","tekst":"Zie boven Eze 12:24 ."},{"catchword":"leugenachtige voorzegging,","tekst":"Hebreeuws, voorzegging der leugen."},{"catchword":"woord te zullen bevestigen","tekst":"Of, de zaak, te weten die zij als ene profetie van God voortkomende valselijk uitgegeven hebben."}],"7":[{"catchword":"Ziet gij niet","tekst":"Deze vraag verzekert sterkelijk."},{"catchword":"ijdel gezicht,","tekst":"Hebreeuws, een gezicht der ijdelheid, alzo boven Eze 12:24 . Zie de aantekening."},{"catchword":"een leugenachtige voorzegging,","tekst":"Hebreeuws, ene voorzegging der leugen."},{"catchword":"zegt","tekst":"Te weten tot het volk."},{"catchword":"Ik niet gesproken heb?","tekst":"Namelijk Ik de Heere."}],"8":[{"catchword":"Ik wil aan u,","tekst":"Te weten om u te straffen. Vergelijk Jer 21:13 , met de aantekening."}],"9":[{"catchword":"Mijn hand zal zijn tegen de profeten,","tekst":"Dat is, mijne kracht om te straffen en te verderven; alzo Exo 9:3 ; Jdg 2:15 ; 1Sa 12:15 ."},{"catchword":"in de vergadering Mijns volks","tekst":"Alzo wordt het woord sod genomen, Psa 89:8 , en Psa 111:1 . De zin is dat de valse profeten niet onder Gods uitverkoren volk zouden gerekend, noch zijn geestelijke goederen mede deelachtig worden."},{"catchword":"schrift","tekst":"Dat is, in het register der ware kinderen Gods; vergelijk Exo 32:32 , en de aantekening; idem, Psa 69:29 , en de aantekening; Luk 10:20 ; Rev 13:8 , en Rev 17:8 , en Rev 20:15 , en Rev 21:27 ."},{"catchword":"van het huis Israëls","tekst":"Dat is, van de ware kerk niet bevonden worden."},{"catchword":"in het land Israëls niet komen;","tekst":"Dat is, in het land van Juda niet wederkeren uit de Babylonische gevangenschap; gelijk ook die onboetvaardig blijven niet komen zu function md(t) {  // *cursief* -> <em>, noot [n] -> sup

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
