rubs was, was er iets als een saffiersteen, als de gedaante van de gelijkenis van een troon; en Hij verscheen daarop.","2":"En Hij sprak tot de man, gekleed in linnen, en zei: Ga naar binnen, tussen de wielen, tot onder de cherub, en vul uw vuisten met vurige kolen van tussen de cherubs, en strooi ze over de stad; en hij ging voor mijn ogen naar binnen.","3":"De cherubs nu stonden aan de rechterzijde van het huis, toen die man naar binnen ging; en een wolk vervulde de binnenste voorhof.","4":"Toen hief de heerlijkheid van de HEERE zich omhoog van boven de cherub, naar de drempel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van de glans van de heerlijkheid van de HEERE.","5":"En het geruis van de vleugels van de cherubs werd gehoord tot het uiterste voorhof, als de stem van de Almachtige God, wanneer Hij spreekt.","6":"Het gebeurde nu, toen Hij de man, gekleed in linnen, geboden had en zei: Neem vuur van tussen de wielen, van tussen de cherubs, dat hij naar binnen ging en bij een rad ging staan.","7":"Toen stak een cherub zijn hand uit van tussen de cherubs tot het vuur dat tussen de cherubs was, en nam daarvan, en gaf het in de vuisten van hem die met linnen gekleed was; die nam het en ging naar buiten.","8":"Want er werd bij de cherubs de gelijkenis van een mensenhand onder hun vleugels gezien.","9":"Toen zag ik, en zie, vier raderen waren bij de cherubs; één rad was bij elke cherub; en de gedaante van de raderen was als de kleur van een turkooissteen.","10":"En wat hun gedaanten betreft, die vier hadden allemaal dezelfde gelijkenis, alsof er een rad in het midden van een rad was.","11":"Als zij gingen, gingen zij naar hun vier zijden; zij keerden zich niet om als zij gingen; maar naar de plaats waar het hoofd heen keek, daar volgden zij naar; zij keerden zich niet om als zij gingen.","12":"Hun hele lichaam nu, en hun ruggen, en hun handen, en hun vleugels, alsook de raderen, waren rondom vol ogen; die vier hadden hun raderen.","13":"Wat de raderen betreft, elk daarvan werd voor mijn oren Galgal[1] genoemd.","14":"En elk had vier aangezichten; het eerste aangezicht was het aangezicht van een cherub, en het tweede aangezicht was het aangezicht van een mens, en het derde het aangezicht van een leeuw, en het vierde het aangezicht van een arend.","15":"En die cherubs hieven zich omhoog; dit was hetzelfde dier dat ik bij de rivier de Chebar gezien had.","16":"En toen de cherubs gingen, gingen die raderen naast hen; en toen de cherubs hun vleugels ophieven om zich van de aarde omhoog te heffen, keerden diezelfde raderen zich ook niet om van bij hen.","17":"Als die stonden, stonden dezen ook; en als die opgeheven werden, hieven dezen zich ook op; want de geest van de dieren was in hen.","18":"Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.","19":"En de cherubs hieven hun vleugels op en verhieven zich van de aarde omhoog voor mijn ogen, toen zij naar buiten gingen; en de raderen waren tegenover hen; en elk bleef staan bij de deur van de Oostpoort van het huis van de HEERE; en de heerlijkheid van de God van Israël was van boven over hen.","20":"Dit is het dier dat ik zag onder de God van Israël bij de rivier de Chebar; en ik merkte dat het cherubs waren.","21":"Elk had vier aangezichten, en elk had vier vleugels; en de gelijkenis van mensenhanden was onder hun vleugels.","22":"En wat de gelijkenis van hun aangezichten betreft, het waren dezelfde aangezichten die ik bij de rivier de Chebar gezien had, hun gedaanten en zij zelf; zij gingen ieder recht voor zich uit."},"SV":{"1":"Daarna zag ik, en ziet, boven het uitspansel, hetwelk was over het hoofd der cherubs, was als een saffiersteen, als de gedaante van de gelijkenis eens troons; *en* Hij verscheen op dezelve.","2":"En Hij sprak tot den man, bekleed met linnen, en Hij zeide: Ga in tot tussen de wielen, tot onder den cherub, en vul uw vuisten met vurige kolen van tussen de cherubs, en strooi ze over de stad; en hij ging in voor mijn ogen.","3":"De cherubs nu stonden ter rechterzijde van het huis, als die man inging; en een wolk vervulde het binnenste voorhof.","4":"Toen hief zich de heerlijkheid des HEEREN omhoog van boven den cherub, op den dorpel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van den glans der heerlijkheid des HEEREN.","5":"En het geruis van de vleugelen der cherubs werd gehoord tot het uiterste voorhof, als de stem des almachtigen Gods, wanneer Hij spreekt.","6":"Het geschiedde nu, als Hij den man, bekleed met linnen, geboden had, zeggende: Neem vuur van tussen de wielen, van tussen de cherubs, dat hij inging en stond bij een rad.","7":"Toen stak een cherub zijn hand uit van tussen de cherubs tot het vuur, hetwelk was tussen de cherubs, en nam *daarvan*, en gaf het in de vuisten desgenen, die met linnen bekleed was; die nam het, en ging uit.","8":"Want er werd gezien aan de cherubs de gelijkenis van eens mensen hand onder hun vleugelen.","9":"Toen zag ik, en ziet, vier raderen waren bij de cherubs; een rad was bij elken cherub; en de gedaante der raderen was als de verf van een turkoois-steen.","10":"En aangaande hun gedaanten, die vier hadden enerlei gelijkenis, gelijk of het ware geweest een rad in het midden van een rad.","11":"Als die gingen, zo gingen *deze* op hun vier zijden; zij keerden zich niet om, als zij gingen; maar de plaats, waarheen het hoofd zag, die volgden zij na; zij keerden zich niet om, als zij gingen.","12":"Hun ganse lichaam nu, en hun ruggen, en hun handen, en hun vleugelen, mitsgaders de raderen, waren vol ogen rondom; die vier hadden hun raderen.","13":"Aangaande de raderen, elkeen derzelve werd voor mijn oren genoemd Galgal.","14":"En elkeen had vier aangezichten; het eerste aangezicht was het aangezicht eens cherubs, en het tweede aangezicht was het aangezicht eens mensen, en het derde het aangezicht eens leeuws, en het vierde het aangezicht eens arends.","15":"En die cherubs hieven zich omhoog; dit was hetzelfde dier, dat ik bij de rivier Chebar gezien had.","16":"En als de cherubs gingen, zo gingen die raderen nevens dezelven; en als de cherubs hun vleugelen ophieven, om zich van de aarde omhoog te heffen, zo keerden zich diezelve raderen ook niet om van bij hen.","17":"Als die stonden, stonden *deze*, en als die opgeheven werden, hieven zich deze *ook* op; want de geest der dieren was in hen.","18":"Toen ging de heerlijkheid des HEEREN van boven den dorpel des huizes weg, en stond boven de cherubs.","19":"En de cherubs hieven hun vleugelen op, en verhieven zich van de aarde omhoog voor mijn ogen, als zij uitgingen; en de raderen waren tegenover hen; en elkeen stond aan de deur der Oostpoort van het huis des HEEREN; en de heerlijkheid des Gods Israëls was van boven over hen.","20":"Dit is het dier, dat ik zag onder den Gods Israëls bij de rivier Chebar; en ik bemerkte, dat het cherubs waren.","21":"Elkeen had vier aangezichten, en elkeen had vier vleugelen; en de gelijkenis van mensenhanden was onder hun vleugelen.","22":"En aangaande de gelijkenis van hun aangezichten, het waren dezelfde aangezichten, die ik gezien had bij de rivier Chebar, hun gedaanten en zij zelven; zij gingen ieder recht uit voor zijn aangezicht henen."},"KJV":{"1":"Then I looked, and, behold, in the firmament that was above the head of the cherubims there appeared over them as it were a sapphire stone, as the appearance of the likeness of a throne.","2":"And he spake unto the man clothed with linen, and said, Go in between the wheels, *even* under the cherub, and fill thine hand with coals of fire from between the cherubims, and scatter *them* over the city. And he went in in my sight.","3":"Now the cherubims stood on the right side of the house, when the man went in; and the cloud filled the inner court.","4":"Then the glory of the LORD went up from the cherub, *and stood* over the threshold of the house; and the house was filled with the cloud, and the court was full of the brightness of the LORD'S glory.","5":"And the sound of the cherubims' wings was heard *even* to the outer court, as the voice of the Almighty God when he speaketh.","6":"And it came to pass, *that* when he had commanded the man clothed with linen, saying, Take fire from between the wheels, from between the cherubims; then he went in, and stood beside the wheels.","7":"And *one* cherub stretched forth his hand from between the cherubims unto the fire that *was* between the cherubims, and took *thereof*, and put *it* into the hands of *him that was* clothed with linen: who took *it*, and went out.","8":"And there appeared in the cherubims the form of a man's hand under their wings.","9":"And when I looked, behold the four wheels by the cherubims, one wheel by one cherub, and another wheel by another cherub: and the appearance of the wheels *was* as the colour of a beryl stone.","10":"And *as for* their appearances, they four had one likeness, as if a wheel had been in the midst of a wheel.","11":"When they went, they went upon their four sides; they turned not as they went, but to the place whither the head looked they followed it; they turned not as they went.","12":"And their whole body, and their backs, and their hands, and their wings, and the wheels, *were* full of eyes round about, *even* the wheels that they four","13":"As for the wheels, it was cried unto them in my hearing, O wheel.","14":"And every one had four faces: the first face *was* the face of a cherub, and the second face *was* the face of a man, and the third the face of a lion, and the fourth the face of an eagle.","15":"And the cherubims were lifted up. This *is* the living creature that I saw by the river of Chebar.","16":"And when the cherubims went, the wheels went by them: and when the cherubims lifted up their wings to mount up from the earth, the same wheels also turned not from beside","17":"When they stood, *these* stood; and when they were lifted up, *these* lifted up themselves *also*: for the spirit of the living creature","18":"Then the glory of the LORD departed from off the threshold of the house, and stood over the cherubims.","19":"And the cherubims lifted up their wings, and mounted up from the earth in my sight: when they went out, the wheels also *were* beside them, and *every one* stood at the door of the east gate of the LORD'S house; and the glory of the God of Israel *was* over them above.","20":"This *is* the living creature that I saw under the God of Israel by the river of Chebar; and I knew that they *were* the cherubims.","21":"Every one had four faces apiece, and every one four wings; and the likeness of the hands of a man *was* under their wings.","22":"And the likeness of their faces *was* the same faces which I saw by the river of Chebar, their appearances and themselves: they went every one straight forward."}},"tsk":{"1":[{"kopje":"zag ik","refs":["Jes 21:8","Jes 21:9","Hab 2:1"]},{"kopje":"boven","refs":["Ezech 1:22-26","Ex 24:10","Openb 4:2","Openb 4:3"]},{"kopje":"boven","refs":["Ezech 10:20","Ezech 11:22","Ps 18:11","Ps 68:18","Ps 68:19","Ef 1:20","1 Petr 3:22"]},{"kopje":"als de","refs":["Ezech 1:22","Ezech 1:26","Gen 18:2","Gen 18:17","Gen 18:22","Gen 18:31","Gen 32:24","Gen 32:30","Joz 5:13-15","Joz 6:2","Jer 13:6","Jer 13:8","Jer 13:18-22","Joh 1:18","Openb 1:13"]}],"2":[{"kopje":"tot onder","refs":["Ezech 10:7","Ezech 9:2","Ezech 9:3","Ezech 9:11"]},{"kopje":"Ga","refs":["Ezech 10:8-13","Ezech 10:16","Ezech 1:15-20"]},{"kopje":"kolen","refs":["Ezech 1:13","Ex 9:8-10","Ps 18:13","Ps 18:14","Ps 140:11","Jes 6:6","Jes 6:7","Openb 8:5"]},{"kopje":"strooi","refs":["Ezech 20:47","Ezech 20:48","Ezech 24:9-14","2 Kon 25:9","Jes 30:30","Jer 24:8-10"]}],"3":[{"kopje":"en een","refs":["Ezech 10:3","Ezech 9:3","Ezech 43:4"]}],"4":[{"kopje":"de heerlijkheid","refs":["Ezech 10:18","Ezech 1:28","Ezech 9:3","Ezech 11:22","Ezech 11:23","Num 16:19"]},{"kopje":"en het huis","refs":["Ezech 43:5","Ex 40:35","1 Kon 8:10-1 oning gehad had; 1Sa 4:4 ; Psa 80:2 ; Isa 37:16 . Of, van op deze vier cherubim tot den dorpel des huizes."},{"catchword":"cherub,","tekst":"Of, cherubim, want het enkelvoudig getal is hier voor het veelvoudig genomen. Zie boven vs.1, en Eze 9:3 ."},{"catchword":"op den dorpel","tekst":"Tot een teken dat God van den tempel en van dat volk verhuizen wilde."},{"catchword":"huis; en het huis werd vervuld met een wolk,","tekst":"Dat is, van het deel des tempels, genaamd het heilige. Eerst is GOd gescheiden van het allerheiligste, boven Eze 9:3 ; nu scheidt Hij ook uit het heilige."},{"catchword":"voorhof was vol van den glans der heerlijkheid des HEEREN","tekst":"Te weten het binnenste, anders genaamd het voorhof der priesters."}],"5":[{"catchword":"geruis","tekst":"Dit wordt breder bij gelijkenissen beschreven, boven Eze 1:24 ."},{"catchword":"vleugelen","tekst":"Zie boven Eze 1:6 ."},{"catchword":"cherubs","tekst":"Te weten die alzo deze rechtvaardige verhuizing des Heeren als met lofzegging toestemden, of de verschrikkelijke zwarigheid, die daarop zou volgen als met ontzetting voorzegden."},{"catchword":"het uiterste voorhof,","tekst":"Anders genaamd het grote voorhof; zie 1Ki 7:9 , en de aantekening."},{"catchword":"als de stem","tekst":"Zie boven Eze 1:24 ."},{"catchword":"almachtigen Gods,","tekst":"Zie Gen 17:1 ."}],"6":[{"catchword":"Hij den man,","tekst":"Namelijk de Heere, wiens heerlijkheid beschreven is boven vs.4."},{"catchword":"vuur","tekst":"Genaamd boven vs.2, vurige kolen. Het vuur betekent Gods toorn en wraak; zie Job 22:20 ."},{"catchword":"van tussen de wielen,","tekst":"Zie boven vs.2."},{"catchword":"een rad","tekst":"Te weten van de vier raderen of wielen, die bij de cherubim waren. Anders: bij de raderen. En zo wordt hier het enkelvoudig getal voor het veelvoudig genomen; vergelijk boven vs.4, de aantekening op het woord cherub."}],"7":[{"catchword":"een cherub zijn hand uit","tekst":"Te weten een van die vier, van wie zie boven Eze 1:5 , en de n van de cherubim gekomen was. Zie boven vs.4, en de aantekening."},{"catchword":"stond boven de cherubs","tekst":"Of, stelde hen."}],"19":[{"catchword":"voor mijn ogen,","tekst":"Dat is, dat ik het aanzag, te weten met de ogen mijns geestes, zijnde in optrekking der zinnen."},{"catchword":"tegenover hen;","tekst":"Of, nevens hen."},{"catchword":"stond aan de deur","tekst":"Of, bleef staan."},{"catchword":"der Oostpoort","tekst":"Of, voorste poort. Sommigen verstaan door deze poort de poort van het voorhof der priesters; anderen de poort van het voorhof des volks. Dit betekende dat God eindelijk ten enenmale uit zijn huis verhuizen zou. Vergelijk boven de aantekening Eze 9:3 , en in vs.4."},{"catchword":"hen","tekst":"Namelijk over de cherubim."}],"20":[{"catchword":"Dit is het dier,","tekst":"Zie boven vs.15."},{"catchword":"onder den Gods Israëls","tekst":"Want deze dieren stonden onder het uitspansel, boven hetwelk de heerlijkheid Gods zich vertoonde. Zie boven Eze 1:26 , en hier vs.1."},{"catchword":"bemerkte,","tekst":"Zulks dat dit gezicht den profeet gediend heeft tot verklaring van het eerste, beschreven boven Eze 1 ."}],"22":[{"catchword":"zij gingen ieder recht uit","tekst":"Zie boven Eze 1:9 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then I looked [to wit in the spirit for the prophet was in a trance ]and behold above the firmament [see above chap 1 on vers22 and compare there vers 26 ]which was over the head of the Cherubims [that is the likeness of the Cherubims see of these Genes 3 on vers 24 they are above chap 1 on vers. 26 and he [to wit God who is called below the Lord vers 18 and the God of Israel vers14 ] appear upon them [to wit the firmament and the throne or upon them to wit the Cherubims.]"}],"2":[{"catchword":null,"tekst":"And he spake to the man clothed with linen see of this man above chap 9 on vers 3 if by him here he understood the Lord .Christ then he is here considered as the judge of the wicked ] and he said go in even between the wheels [that is into the very midst of them so in the sequel understand by these the wheels whose description and signification see above chap 1 on vers 15 ] under the very Cherub [for the wheels where by the Cherubims ]and fill thy fists with fiery coles [which were representations of Gods just judgments see above chap 1 on vers 13 and compare Psal 18.9 ] from between the Cherubims [Heb from betweenesses of the Cherubims that is from the place which is between the Cherubims ]and scatter them over the city [ for a token that it shall be consumed by a burning of the sword famine and pestilence yea also with material fire 2 Kings 25.9] and he [ namely the man clothed with linen ] went in before mine eyes [that is so as I beheld him with mine eyes in this vision .]"}],"3":[{"catchword":null,"tekst":"Now the Cherubims stood on the right side [that is on the north-side which looked towards the land of the Chaldeans to signifie the destruction of the temple and of the Jews to come from thence ] of the house [ that is of the temple of the Lord meaning in the inner court as appeareth by the following words of this vers ]when that man went in and a cloud which signifieth Gods wrath and the destruction that was neerhand ready to light upon the temple So that the cloud here is a token of Gods anger and approaching calamities as Psal 18.13 and not of his gracious co-habitation as Exod 40.34 Numb 9.15 1 Kings 8.10,`11]filled the innermost court [which was the court of the priest see 1 Kings 6 o vers 36.]"}],"4":[{"catchword":null,"tekst":"Then the Glory of the Lord [see above chap 1 on vers 28 ]lifted up itself from high above its Cherub [upon which the Lord had his ordinary dwelling place in the holy of holies 1 Sam 4.4 Psal 8.20 Isa 37.16 or from upon these four Cherubims to the threshold of the house as followeth the Cherub or Cherubims for the singular number is here taken for the plural see above on vers 1 and chap 9 on vers 3] upon the threshold of the house [ const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');

    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
