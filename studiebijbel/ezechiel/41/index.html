breedte van deze zijde, en zes ellen de breedte van de andere zijde, de breedte van de tent.","2":"En de breedte van de deur, tien ellen, en de zijden van de deur, vijf ellen van deze, en vijf ellen van de andere zijde; ook mat hij de lengte daarvan, veertig ellen, en de breedte twintig ellen.","3":"Daarna ging hij naar binnen, en mat de post van de deur, twee ellen; en de deur zes ellen, en de breedte van de deur zeven ellen.","4":"Ook mat hij de lengte daarvan, twintig ellen, en de breedte twintig ellen, voor aan de tempel; en hij zei tegen mij: Dit is het allerheiligste.","5":"En hij mat de wand van het huis, zes ellen; en de breedte van elke zijkamer, vier ellen, rondom het huis, rondom heen.","6":"De zijkamers nu waren zijkamer boven zijkamer, drie, en dat dertig maal, en zij kwamen in de wand die aan het huis was, tot die zijkamers rondom heen, zodat zij vastgehouden konden worden; want zij werden niet vastgehouden in de wand van het huis.","7":"En het was voor de zijkamers opwaarts naar boven al wijder, en liep rondom; want het huis was omsingeld opwaarts naar boven, rondom het huis heen; daarom was de breedte van het huis naar boven; en zo ging het onderste op naar het bovenste, door het middelste.","8":"En ik zag de hoogte van het huis, rondom heen. De fundamenten van de zijkamers waren een vol riet, zes ellen, de el tot aan de oksel toe gerekend.","9":"De breedte van de wand die tot de zijkamers behoorde naar buiten toe, was vijf ellen; en wat leeg gelaten was, was de plaats van de zijkamers die aan het huis waren.","10":"En tussen de kamers was een breedte van twintig ellen, rondom het huis, rondom heen.","11":"De deuren nu van de zijkamers waren naar de leeggelaten plaats toe, de ene deur de weg naar het noorden, en de andere deur naar het zuiden; en de breedte van de leeggelaten plaats was vijf ellen rondom heen.","12":"Verder, van het gebouw dat voor aan de afgesneden plaats was, in de hoek van de weg naar het westen, was de breedte zeventig ellen, en van de wand van het gebouw was de breedte vijf ellen rondom heen, en de lengte daarvan negentig ellen.","13":"Verder mat hij het huis, de lengte honderd ellen; ook de afgesneden plaats en het gebouw, en de wanden daarvan, de lengte honderd ellen.","14":"En de breedte van het voorste deel van het huis, en van de afgesneden plaats tegen het oosten, honderd ellen.","15":"Ook mat hij de lengte van het gebouw voor aan de afgesneden plaats die daarachter was, en de galerijen daarvan van deze en van de andere zijde, honderd ellen; met de binnenste tempel, en de voorhuizen van de voorhof.","16":"De dorpels, en de gesloten vensters en de galerijen rondom die drie *verdiepingen*, tegenover de dorpel, waren beschoten met hout rondom heen, en van de grond tot aan de vensters; de vensters waren bedekt;","17":"Tot boven de deur, en tot het binnenste en buitenste van het huis toe, en aan de hele wand rondom heen, in het binnenste en buitenste, alles volgens maten.","18":"En het was gemaakt met cherubs en palmbomen, zodat er een palmboom was tussen cherub en cherub, en elke cherub had twee gezichten;","19":"Namelijk, het gezicht van een mens tegen de palmboom van deze zijde, en het gezicht van een jonge leeuw tegen de palmboom van de andere zijde; gemaakt in het hele huis, rondom heen.","20":"Van de grond af tot boven de deur waren de cherubs en de palmbomen gemaakt, ook aan de wand van de tempel.","21":"De posten van de tempel waren vierkant; en wat betreft het voorste deel van het heiligdom, de ene vorm was als de andere vorm.","22":"De hoogte van het houten altaar was drie ellen, en zijn lengte twee ellen, en het had zijn hoeken; en zijn lengte en zijn wanden waren van hout. En hij sprak tot mij: Dit is de tafel die voor het aangezicht van de HEERE zal zijn.","23":"De tempel nu en het heiligdom hadden beide twee deuren.","24":"En er waren twee bladen aan de deuren, namelijk twee bladen die men kon omdraaien; twee aan de ene deur, en twee bladen aan de andere.","25":"En aan diezelve, namelijk aan de deuren van de tempel, waren cherubs en palmbomen gemaakt, net zoals er aan de wanden gemaakt waren; en het hout aan het voorste deel van het voorhuis, aan de buitenkant, was dik.","26":"En aan de gesloten vensters waren ook palmbomen van deze en van de andere zijde, aan de zijden van het voorhuis; en aan de zijkamers van het huis, en aan de dikke planken."},"SV":{"1":"Voorts bracht hij mij tot den tempel; en hij mat de posten, zes ellen de breedte van deze, en zes ellen de breedte van gene zijde, de breedte der tent.","2":"En de breedte der deur, tien ellen, en de zijden der deur, vijf ellen van deze, en vijf ellen van gene zijde; ook mat hij de lengte daarvan, veertig ellen, en de breedte twintig ellen.","3":"Daarna ging hij in naar binnen, en mat den post der deur, twee ellen; en de deur zes ellen, en de breedte der deur zeven ellen.","4":"Ook mat hij de lengte daarvan, twintig ellen, en de breedte twintig ellen voor aan den tempel; en hij zeide tot mij: Dit is de heiligheid der heiligheden.","5":"En hij mat den wand des huizes zes ellen; en de breedte van *elke* zijkamer, vier ellen, rondom het huis henen rondom.","6":"De zijkameren nu waren zijkamer boven zijkamer, drie, en dat dertig malen, en zij kwamen in den wand, die aan het huis was, tot die zijkamers rondom henen, opdat zij vastgehouden mochten worden; want zij werden niet vastgehouden in den wand des huizes.","7":"En het was voor de zijkameren opwaarts naar boven al wijder, en gaf zich rondom; want het huis was omsingeld opwaarts naar boven, rondom het huis henen; daarom was de breedte des huizes naar boven; en alzo ging het onderste op naar het bovenste door het middelste.","8":"En ik zag de hoogte des huizes rondom henen. De fondamenten der zijkameren waren van een vol riet, zes ellen, *de* *el* tot den oksel toe *genomen*.","9":"De breedte van den wand, die tot de zijkameren was naar buiten, was vijf ellen; en dat ledig gelaten was, was de plaats der zijkameren, die aan het huis waren.","10":"En tussen de kameren was een breedte van twintig ellen, rondom het huis, rondom henen.","11":"De deuren nu van de zijkameren waren naar het ledig gelatene toe, de ene deur den weg naar het noorden, en de andere deur naar het zuiden; en de breedte van de ledig gelaten plaats was vijf ellen rondom henen.","12":"Voorts *van* het gebouw, dat voor aan de afgesneden plaats was *in* den hoek des wegs naar het westen, was de breedte zeventig ellen, en *van* den wand des gebouws was de breedte vijf ellen rondom henen, en de lengte daarvan negentig ellen.","13":"Voorts mat hij het huis, de lengte honderd ellen; ook de afgesneden plaats en het gebouw, en de wanden daarvan, de lengte honderd ellen.","14":"En de breedte van het voorste deel des huizes, en der afgesneden plaats tegen het oosten, honderd ellen.","15":"Ook mat hij de lengte des gebouws voor aan de afgesneden plaats dat achter dezelve was, en derzelver galerijen van deze en van gene zijde, honderd ellen; met den binnensten tempel, en de voorhuizen des voorhofs.","16":"De dorpelen, en de gesloten vensters en de galerijen rondom die drie, tegenover den dorpel, waren beschoten met hout rondom henen, en *van* de aarde tot aan de vensteren; de vensteren waren bedekt;","17":"Tot hetgeen boven de deur was, en tot het binnenste en buitenste huis toe, en aan den gansen wand rondom henen in het binnenste en buitenste, *al* *bij* maten.","18":"En het was gemaakt *met* cherubs en palmbomen; zodat er een palmboom was tussen cherub en cherub, en *elke* cherub had twee aangezichten;","19":"Namelijk, eens mensen aangezicht tegen den palmboom van deze, en eens jongen leeuws aangezicht tegen den palmboom van gene zijde; gemaakt in het ganse huis rondom henen.","20":"Van de aarde af tot boven de deur waren de cherubs en de palmbomen gemaakt, ook *aan* den wand des tempels.","21":"De posten des tempels waren vierkant; en aangaande het voorste deel des heiligdoms, de *ene* gedaante was als de *andere* gedaante.","22":"De hoogte des houten altaars was drie ellen, en zijn lengte twee ellen, en het had zijn hoeken; en zijn lengte en zijn wanden waren van hout. En hij sprak tot mij: Dit is de tafel, die voor des HEEREN aangezicht zal zijn.","23":"De tempel nu en het heiligdom hadden *beide* twee deuren.","24":"En er waren twee bladen aan de deuren; *te* *weten* twee bladen, die men omdraaien kon; twee aan de ene deur, en twee bladen aan de andere.","25":"En aan dezelve, *namelijk* aan de deuren des tempels, waren cherubs en palmbomen gemaakt, gelijk als er aan de wanden gemaakt waren; en het hout aan het voorste deel van het voorhuis van buiten was dik.","26":"En *aan* de gesloten vensteren waren ook palmbomen van deze en van gene zijde, aan de zijden van het voorhuis; en *aan* de zijkameren van het huis, en *aan* de dikke planken."},"KJV":{"1":"Afterward he brought me to the temple, and measured the posts, six cubits broad on the one side, and six cubits broad on the other side, *which was* the breadth of the tabernacle.","2":"And the breadth of the door *was* ten cubits; and the sides of the door *were* five cubits on the one side, and five cubits on the other side: and he measured the length thereof, forty cubits: and the breadth, twenty cubits.","3":"Then went he inward, and measured the post of the door, two cubits; and the door, six cubits; and the breadth of the door, seven cubits.","4":"So he measured the length thereof, twenty cubits; and the breadth, twenty cubits, before the temple: and he said unto me, This *is* the most holy","5":"After he measured the wall of the house, six cubits; and the breadth of *every* side chamber, four cubits, round about the house on every side.","6":"And the side chambers *were* three, one over another, and thirty in order; and they entered into the wall which *was* of the house for the side chambers round about, that they might have hold, but they had not hold in the wall of the house.","7":"And *there was* an enlarging, and a winding about still upward to the side chambers: for the winding about of the house went still upward round about the house: therefore the breadth of the house *was still* upward, and so increased *from* the lowest *chamber* to the highest by the midst.","8":"I saw also the height of the house round about: the foundations of the side chambers *were* a full reed of six great cubits.","9":"The thickness of the wall, which *was* for the side chamber without, *was* five cubits: and *that* which *was* left *was* the place of the side chambers that *were* within.","10":"And between the chambers *was* the wideness of twenty cubits round about the house on every side.","11":"And the doors of the side chambers *were* toward *the place that was* left, one door toward the north, and another door toward the south: and the breadth of the place that was left *was* five cubits round about.","12":"Now the building that *was* before the separate place at the end toward the west *was* seventy cubits broad; and the wall of the building *was* five cubits thick round about, and the length thereof ninety cubits.","13":"So he measured the house, an hundred cubits long; and the separate place, and the building, with the walls thereof, an hundred cubits long;","14":"Also the breadth of the face of the house, and of the separate place toward the east, an hundred cubits.","15":"And he measured the length of the building over against the separate place which *was* behind it, and the galleries thereof on the one side and on the other side, an hundred cubits, with the inner temple, and the porches of the court;","16":"The door posts, and the narrow windows, and the galleries round about on their three stories, over against the door, cieled with wood round about, and from the ground up to the windows, and the windows *were* covered;","17":"To that above the door, even unto the inner house, and without, and by all the wall round about within and without, by measure.","18":"And *it was* made with cherubims and palm trees, so that a palm tree *was* between a cherub and a cherub; and *every* cherub had two faces;","19":"So that the face of a man *was* toward the palm tree on the one side, and the face of a young lion toward the palm tree on the other side: *it was* made through all the house round about.","20":"From the ground unto above the door *were* cherubims and palm trees made, and *on* the wall of the temple.","21":"The posts of the temple *were* squared, *and* the face of the sanctuary; the appearance *of the one* as the appearance","22":"The altar of wood *was* three cubits high, and the length thereof two cubits; and the corners thereof, and the length thereof, and the walls thereof, *were* of wood: and he said unto me, This *is* the table that *is* before the LORD.","23":"And the temple and the sanctuary had two doors.","24":"And the doors had two leaves *apiece*, two turning leaves; two *leaves* for the one door, and two leaves for the other","25":"And *there were* made on them, on the doors of the temple, cherubims and palm trees, like as *were* made upon the walls; and *there were* thick planks upon the face of the porch without.","26":"And *there were* narrow windows and palm trees on the one side and on the other side, on the sides of the porch, and *upon* the side chambers of the house, and thick planks."}},"tsk":{"1":[{"kopje":"bracht hij mij","refs":["Ezech 40:2","Ezech 40:3","Ezech 40:17"]},{"kopje":"tot de tempel","refs":["1 Kon 6:2","Zach 6:12","Zach 6:13","Ef 2:20-22","1 Petr 2:5","Openb 3:12","Openb 11:1","Openb 11:2","Openb 21:3","Openb 21:15"]}],"2":[{"kopje":"de deur","refs":["Ex 26:36","Ex 36:37","1 Kon 6:31-35","2 Kron 3:7","2 Kron 29:7","Joh 10:7","Joh 10:9"]},{"kopje":"de lengte","refs":["1 Kon 6:2","1 Kon 6:17","2 Kron 3:3"]}],"3":[{"kopje":"twee ellen","refs":["Ezech 41:2","Ezech 41:4","Ezech 41:3"]}],"4":[{"kopje":"twintig ellen","refs":["1 Kon 6:20","2 Kron 3:8","Openb 21:16"]},{"kopje":"Dit","refs":["Ex 26:33","Ex 26:34","Hebr 9:3-8"]}],"5":[{"k     `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
