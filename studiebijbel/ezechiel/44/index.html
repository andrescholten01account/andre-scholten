gdom, die naar het oosten keek; en die was gesloten.","2":"En de HEERE zei tegen mij: Deze poort zal gesloten zijn, zij zal niet geopend worden, en niemand zal er door naar binnen gaan, omdat de HEERE, de God van Israël, er door naar binnen is gegaan; daarom zal zij gesloten zijn.","3":"De vorst, de vorst, die zal erin zitten om brood te eten voor het aangezicht van de HEERE; door de weg van het voorhuis van de poort zal hij naar binnen gaan, en door de weg daarvan zal hij naar buiten gaan.","4":"Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.","5":"En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.","6":"En zeg tegen die opstandigen, tegen het huis van Israël: Zo zegt de Heere HEERE: Het is genoeg geweest voor u, vanwege al uw gruwelen, o huis van Israël.","7":"Omdat u vreemden hebt binnengebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, namelijk Mijn huis; toen u Mijn brood, het vette en het bloed offerde, en zij Mijn verbond verbraken, naast al uw gruwelen.","8":"En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.","9":"Zo zegt de Heere HEERE: Geen vreemde, onbesneden van hart en onbesneden van vlees, zal in Mijn heiligdom naar binnen gaan, van enige vreemde die te midden van de kinderen van Israël is.","10":"Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden [1] achterna, zullen wel hun ongerechtigheid dragen;","11":"Toch zullen zij in Mijn heiligdom bedienaars zijn, in de ambten aan de poorten van het huis, en zij zullen het huis bedienen; zij zullen het brandoffer en het slachtoffer voor het volk slachten, en zullen voor hun aangezicht staan om hen te dienen;","12":"Omdat zij hen gediend hebben voor het aangezicht van hun drekgoden, en het huis van Israël tot een aanstoot van de ongerechtigheid geweest zijn, daarom heb Ik Mijn hand tegen hen opgeheven, spreekt de Heere HEERE, dat zij hun ongerechtigheid zullen dragen.","13":"En zij zullen tot Mij niet naderen om Mij het priesterambt te bedienen, en om te naderen tot al Mijn heilige dingen, tot de allerheiligste dingen; maar zullen hun schande dragen, en hun gruwelen die zij gedaan hebben.","14":"Daarom zal Ik hen stellen tot wachters van de wacht van het huis, over al zijn dienst, en over alles wat daarin gedaan zal worden.","15":"Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;","16":"Die zullen in Mijn heiligdom naar binnen gaan, en die zullen tot Mijn tafel naderen om Mij te dienen, en zij zullen Mijn wacht in acht nemen.","17":"En het zal gebeuren, als zij tot de poorten van het binnenste voorhof naar binnen gaan, dat zij linnen kleren zullen aantrekken; maar wol zal op hen niet komen, als zij dienen in de poorten van het binnenste voorhof, en daarbinnen.","18":"Linnen hoofddeksels zullen op hun hoofd zijn, en linnen onderbroeken zullen op hun heupen zijn; zij zullen zich niet omgorden met iets dat zweet veroorzaakt.","19":"En als zij naar buiten gaan naar het buitenste voorhof, namelijk naar het buitenste voorhof tot het volk, zullen zij hun kleren waarin zij gediend hebben uittrekken, en die neerleggen in de heilige kamers; en zullen andere kleren aantrekken, opdat zij het volk niet heiligen met hun kleren.","20":"En zij zullen hun hoofd niet glad afscheren, ook de lokken niet lang laten groeien; behoorlijk zullen zij hun hoofden scheren.","21":"Ook zal geen priester wijn drinken, als zij in het binnenste voorhof naar binnen gaan.","22":"Ook zullen zij zich geen weduwe of verstotene tot vrouw nemen; maar jonge dochters uit het nageslacht van het huis van Israël, of een weduwe die een weduwe van een priester geweest is, zullen zij nemen.","23":"En zij zullen Mijn volk onderscheid leren tussen het heilige en het onheilige, en hun het onderscheid bekend maken tussen het onreine en het reine.","24":"En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.","25":"Ook zal niemand van hen tot een dode mens naar binnen gaan, zodat hij onrein wordt; maar om een vader, of om een moeder, of om een zoon, of om een dochter, om een broer of om een zuster die geen man gehad heeft, mogen zij zich verontreinigen.","26":"En na zijn reiniging zullen zij hem zeven dagen tellen.","27":"En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.","28":"Dit nu zal hun tot erfenis zijn: Ik ben hun Erfenis; daarom zult u hun geen bezitting geven in Israël; Ik ben hun Bezitting.","29":"Het spijsoffer, en het zondoffer, en het schuldoffer, die zullen zij eten; ook zal al het verbannene [2] in Israël het hunne zijn.","30":"En de eerstelingen van alle eerste vruchten van alles, en elk hefoffer van alles, van al uw hefoffers, zullen voor de priesters zijn; ook zult u de eerstelingen van uw deeg de priester geven, om de zegen op uw huis te doen rusten.","31":"Geen aas, noch wat verscheurd is door gevogelte of door vee, zullen de priesters eten."},"SV":{"1":"Toen deed hij mij wederkeren den weg *naar* de poort van het buitenste heiligdom, die naar het oosten zag; en die was toegesloten.","2":"En de HEERE zeide tot mij: Deze poort zal toegesloten zijn, zij zal niet geopend worden, noch iemand door dezelve ingaan, omdat de HEERE, de God Israëls, door dezelve is ingegaan; daarom zal zij toegesloten zijn.","3":"De vorst, de vorst, die zal in dezelve zitten, om brood te eten voor het aangezicht des HEEREN; door den weg van het voorhuis der poort zal hij ingaan, en door den weg van hetzelve zal hij uitgaan.","4":"Daarna bracht hij mij den weg der noorderpoort, voor aan het huis; en ik zag, en ziet, de heerlijkheid des HEEREN had het huis des HEEREN vervuld; toen viel ik op mijn aangezicht.","5":"En de HEERE zeide tot mij: Mensenkind! zet er uw hart op, en zie met uw ogen, en hoor met uw oren alles, wat Ik met u spreken zal, van alle inzettingen van het huis des HEEREN, en van al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen des heiligdoms.","6":"En zeg tot die wederspannigen, tot het huis Israëls: Zo zegt de Heere HEERE: Het is te veel voor ulieden, vanwege al uw gruwelen, o huis Israëls.","7":"Dewijl gijlieden vreemden hebt ingebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, *te* *weten* Mijn huis; als gij Mijn brood, het vette en het bloed offerdet, en zij Mijn verbond verbraken, nevens al uw gruwelen.","8":"En gijlieden hebt de wacht van Mijn heilige dingen niet waargenomen; maar gij hebt uzelven *enigen* tot wachters Mijner wacht gesteld in Mijn heiligdom.","9":"Alzo zegt de Heere HEERE: Geen vreemde, onbesneden van hart, en onbesneden van vlees, zal in Mijn heiligdom ingaan, van enigen vreemde, die in het midden der kinderen Israëls is.","10":"Maar de Levieten, die verre van Mij geweken zijn, als Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden achterna, zullen wel hun ongerechtigheid dragen;","11":"Nochtans zullen zij in Mijn heiligdom bedienaars zijn, *in* de ambten aan de poorten van het huis, en zij zullen het huis bedienen; zij zullen het brandoffer en het slachtoffer voor het volk slachten, en zullen voor hun aangezicht staan, om hen te dienen;","12":"Omdat zij henlieden gediend hebben voor het aangezicht hunner drekgoden, en den huize Israëls tot een aanstoot der ongerechtigheid geweest zijn, daarom heb Ik Mijn hand tegen hen opgeheven, spreekt de Heere HEERE, dat zij hun ongerechtigheid zullen dragen.","13":"En zij zullen tot Mij niet naderen, om Mij het priesterambt te bedienen, en om te naderen tot al Mijn heilige dingen, tot de allerheiligste dingen; maar zullen hun schande dragen, en hun gruwelen, die zij gedaan hebben.","14":"Daarom zal Ik hen stellen *tot* wachters van de wacht des huizes, aan al zijn dienst, en aan alles, wat daarin zal gedaan worden.","15":"Maar de Levietische priesters, de kinderen van Zadok, die de wacht Mijns heiligdoms hebben waargenomen, als de kinderen Israëls van Mij afdwaalden, die zullen tot Mij naderen, om Mij te dienen; en zullen voor Mijn aangezicht staan, om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;","16":"Die zullen in Mijn heiligdom ingaan, en die zullen tot Mijn tafel naderen om Mij te dienen, en zij zullen Mijn wacht waarnemen.","17":"En het zal geschieden, als zij tot de poorten van het binnenste voorhof zullen ingaan, dat zij linnen klederen zullen aantrekken; maar wol zal op hen niet komen, als zij dienen in de poorten van het binnenste voorhof, en inwaarts.","18":"Linnen huiven zullen op hun hoofd zijn, en linnen onderbroeken zullen op hun lenden zijn; zij zullen zich niet gorden in het zweet.","19":"En als zij uitgaan tot het buitenste voorhof, *namelijk* tot het buitenste voorhof tot het volk, zullen zij hun klederen, in dewelke zij gediend hebben, uittrekken, en dezelve henenleggen in de heilige kameren; en zullen andere klederen aantrekken, opdat zij het volk niet heiligen met hun klederen.","20":"En zij zullen hun hoofd niet glad afscheren, ook de lokken niet lang laten wassen; behoorlijk zullen zij hun hoofden bescheren.","21":"Ook zal geen priester wijn drinken, als zij in het binnenste voorhof zullen ingaan.","22":"Ook zullen zij zich geen weduwe of verstotene tot vrouwen nemen; maar jonge dochters van het zaad van het huis Israëls, of een weduwe, die een weduwe zal geweest zijn van een priester, zullen zij nemen.","23":"En zij zullen Mijn volk *onderscheid* leren tussen het heilige en onheilige, en hun bekend maken *het* *onderscheid* tussen het onreine en reine.","24":"En over een twistzaak zullen zij staan om te richten; naar Mijn rechten zullen zij hen richten; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn gezette hoogtijden houden, en Mijn sabbatten heiligen.","25":"Ook zal geen van hen tot een doden mens ingaan, dat hij onrein worde; maar om een vader, of om een moeder, of om een zoon, of om een dochter, om een broeder of om een zuster, die geens mans geweest is, zullen zij zich mogen verontreinigen.","26":"En na zijn reiniging zullen zij hem zeven dagen tellen.","27":"En ten dage, als hij in het heilige zal ingaan, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.","28":"Dit *nu* zal hun tot een erfenis zijn: Ik ben hun Erfenis; daarom zult gij hunlieden geen bezitting geven in Israël; Ik ben hun Bezitting.","29":"Het spijsoffer, en het zondoffer, en het schuldoffer, die zullen zij eten; ook zal al het verbannene in Israël het hunne zijn.","30":"En de eerstelingen van alle eerste vruchten van alles, en alle hefoffer van alles, van al uw hefofferen, zullen der priesteren zijn; ook zult gij de eerstelingen van uw deeg den priester geven, om den zegen op uw huis te doen rusten.","31":"Geen aas, noch wat verscheurd is van het gevogelte, of van het vee, zullen de priesters eten."},"KJV":{"1":"Then he brought me back the way of the gate of the outward sanctuary which looketh toward the east; and it *was* shut.","2":"Then said the LORD unto me; This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the LORD, the God of Israel, hath entered in by it, therefore it shall be shut.","3":"*It is* for the prince; the prince, he shall sit in it to eat bread before the LORD; he shall enter by the way of the porch of *that* gate, and shall go out by the way","4":"Then brought he me the way of the north gate before the house: and I looked, and, behold, the glory of the LORD filled the house of the LORD: and I fell upon my face.","5":"And the LORD said unto me, Son of man, mark well, and behold with thine eyes, and hear with thine ears all that I say unto thee concerning all the ordinances of the house of the LORD, and all the laws thereof; and mark well the entering in of the house, with every going forth of the sanctuary.","6":"And thou shalt say to the rebellious, *even* to the house of Israel, Thus saith the Lord GOD; O ye house of Israel, let it suffice you of all your abominations,","7":"In that ye have brought *into my sanctuary* strangers, uncircumcised in heart, and uncircumcised in flesh, to be in my sanctuary, to pollute it, *even* my house, when ye offer my bread, the fat and the blood, and they have broken my covenant because of all your abominations.","8":"And ye have not kept the charge of mine holy things: but ye have set keepers of my charge in my sanctuary","9":"Thus saith the Lord GOD; No stranger, uncircumcised in heart, nor uncircumcised in flesh, shall enter into my sanctuary, of any stranger that *is* among the children of Israel.","10":"And the Levites that are gone away far from me, when Israel went astray, which went astray away from me after their idols; they shall even bear their iniquity.","11":"Yet they shall be ministers in my sanctuary, *having* charge at the gates of the house, and ministering to the house: they shall slay the burnt offering and the sacrifice for the people, and they shall stand before them to minister","12":"Because they ministered unto them before their idols, and caused the house of Israel to fall into iniquity; therefore have I lifted up mine hand against them, saith the Lord GOD, and they shall bear their iniquity.","13":"And they shall not come near unto me, to do the office of a priest unto me, nor to come near to any of my holy things, in the most holy *place*: but they shall bear their shame, and their abominations which they have committed.","14":"But I will make them keepers of the charge of the house, for all the service thereof, and for all that shall be done","15":"But the priests the Levites, the sons of Zadok, that kept the charge of my sanctuary when the children of Israel went astray from me, they shall come near to me to minister unto me, and they shall stand before me to offer unto me the fat and the blood, saith the Lord GOD:","16":"They shall enter into my sanctuary, and they shall come near to my table, to minister unto me, and they shall keep my charge.","17":"And it shall come to pass, *that* when they enter in at the gates of the inner court, they shall be clothed with linen garments; and no wool shall come upon them, whiles they minister in the gates of the inner court, and within.","18":"They shall have linen bonnets upon their heads, and shall have linen breeches upon their loins; they shall not gird *themselves* with any thing that causeth sweat.","19":"And when they go forth into the utter court, *even* into the utter court to the people, they shall put off their garments wherein they ministered, and lay them in the holy chambers, and they shall put on other garments; and they shall not sanctify the people with their garments.","20":"Neither shall they shave their heads, nor suffer their locks to grow long; they shall only poll their heads.","21":"Neither shall any priest drink wine, when they enter into the inner court.","22":"Neither shall they take for their wives a widow, nor her that is put away: but they shall take maidens of the seed of the house of Israel, or a widow that had a priest","23":"And they shall teach my people *the difference* between the holy and profane, and cause them to discern between the unclean and the clean.","24":"And in controversy they shall stand in judgment; *and* they shall judge it according to my judgments: and they shall keep my laws and my statutes in all mine assemblies; and they shall hallow my sabbaths.","25":"And they shall come at no dead person to defile themselves: but for father, or for mother, or for son, or for daughter, for brother, or for sister that hath had no husband, they may defile","26":"And after he is cleansed, they shall reckon unto him seven days.","27":"And in the day that he goeth into the sanctuary, unto the inner court, to minister in the sanctuary, he shall offer his sin offering, saith the Lord GOD.","28":"And it shall be unto them for an inheritance: I *am* their inheritance: and ye shall give them no possession in Israel: I *am* their possession.","29":"They shall eat the meat offering, and the sin offering, and the trespass offering; and every dedicated thing in Israel","30":"And the first of all the firstfruits of all *things*, and every oblation of all, of every *sort* of your oblations, shall be the priest's: ye shall also give unto the priest the first of your dough, that he may cause the blessing to rest in thine house.","31":"The priests shall not eat of any thing that is dead of itself, or torn, whether it be fowl or beast."}},"tsk":{"1":[{"kopje":"buitenste","refs":["Ezech 40:6","Ezech 40:17","Ezech 42:14","2 Kron 4:9","2 Kron 20:5","2 Kron 33:5","Hand 21:28-30"]},{"kopje":"keek","refs":["Ezech 43:1","Ezech 43:4","Ezech 46:1"]}],"2":[{"kopje":"omdat","refs":["Ezech 43:2-4","Ex 24:10","Jes 6:1-5"]}],"3":[{"kopje":"om","refs":["Ezech 46:2","Ezech 46:8","2 Kron 23:13","2 Kron 34:31"]},{"kopje":"de vorst","refs":["Ezech 45:22","Ezech 45:8","Ezech 46:18","Ezech 34:24","Ezech 37:25","Zach 6:12","Zach 6:13"]},{"kopje":"brood te eten","refs":["Gen 31:54","Ex 24:9-11","Deut 12:7","Deut 12:17","Deut 12:18","Jes 23:18","J  wl-kjv\" data-code=\"H3069\">GOD;</span> No <span class=\"wl wl-kjv\" data-code=\"H1121\">stranger,</span> <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> in <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> in <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> of any stranger that is <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> that are gone away <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, when <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H8582\">astray,</span> which went astray <span class=\"wl wl-kjv\" data-code=\"H8582\">away</span> from me <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols;</span> they shall even <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their iniquity.","11":"Yet they shall be <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers</span> in my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> having <span class=\"wl wl-kjv\" data-code=\"H6486\">charge</span> at the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H8334\">ministering</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7819\">slay</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them to minister","12":"Because they <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> unto them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> and caused the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H4383\">fall</span> into <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> therefore have I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against them, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their iniquity.","13":"And they shall not come <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> unto me, to do the office of a <span class=\"wl wl-kjv\" data-code=\"H3547\">priest</span> unto me, nor to come <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to any of my holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> in the most <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place: but they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their <span class=\"wl wl-kjv\" data-code=\"H3639\">shame,</span> and their <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> which they have committed.","14":"But I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> them <span class=\"wl wl-kjv\" data-code=\"H8104\">keepers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> for all the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> thereof, and for all that shall be done","15":"But the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok,</span> that <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">charge</span> of my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H8582\">astray</span> from me, they shall come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to me to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> unto me, and they shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me to <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> unto me the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> and the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD:","16":"They shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> and they shall come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to my <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> unto me, and they shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my charge.","17":"And it shall come to pass, that when they <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> in at the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H6442\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> with <span class=\"wl wl-kjv\" data-code=\"H6593\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments;</span> and no <span class=\"wl wl-kjv\" data-code=\"H6785\">wool</span> shall <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> upon them, whiles they <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H6442\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> and within.","18":"They shall have <span class=\"wl wl-kjv\" data-code=\"H6593\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H6287\">bonnets</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> and shall have <span class=\"wl wl-kjv\" data-code=\"H6593\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H4370\">breeches</span> upon their <span class=\"wl wl-kjv\" data-code=\"H4975\">loins;</span> they shall not <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> themselves with any thing that causeth sweat.","19":"And when they go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H2435\">utter</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> even into the <span class=\"wl wl-kjv\" data-code=\"H2435\">utter</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> they shall put <span class=\"wl wl-kjv\" data-code=\"H6584\">off</span> their <span class=\"wl wl-kjv\" data-code=\"H899\">garments</span> wherein they <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">lay</span> them in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H3957\">chambers,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3847\">put</span> on <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments;</span> and they shall not <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with their garments.","20":"Neither shall they <span class=\"wl wl-kjv\" data-code=\"H1548\">shave</span> their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> nor suffer their <span class=\"wl wl-kjv\" data-code=\"H6545\">locks</span> to grow <span class=\"wl wl-kjv\" data-code=\"H7971\">long;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3697\">only</span> <span class=\"wl wl-kjv\" data-code=\"H3697\">poll</span> their heads.","21":"Neither shall any <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> when they <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H6442\">inner</span> court.","22":"Neither shall they <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> for their <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> a <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> nor her that is put <span class=\"wl wl-kjv\" data-code=\"H1644\">away:</span> but they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H1330\">maidens</span> of the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> or a <span class=\"wl wl-kjv\" data-code=\"H490\">widow</span> that had a priest","23":"And they shall <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> the difference between the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> and <span class=\"wl wl-kjv\" data-code=\"H2455\">profane,</span> and cause them to <span class=\"wl wl-kjv\" data-code=\"H3045\">discern</span> between the <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> and the clean.","24":"And in <span class=\"wl wl-kjv\" data-code=\"H7379\">controversy</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> in <span class=\"wl wl-kjv\" data-code=\"H8199\">judgment;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> it according to my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H8451\">laws</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> in all mine <span class=\"wl wl-kjv\" data-code=\"H4150\">assemblies;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> my sabbaths.","25":"And they shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> at no <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> <span class=\"wl wl-kjv\" data-code=\"H120\">person</span> to <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> themselves: but for <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> or for <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> or for <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> or for <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> for <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> or for <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> that hath had no <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> they may defile","26":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he is <span class=\"wl wl-kjv\" data-code=\"H2893\">cleansed,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5608\">reckon</span> unto him <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days.","27":"And in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">goeth</span> into the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6442\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> his sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","28":"And it shall be unto them for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> I am their <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them no <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> I am their possession.","29":"They shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering;</span> and every dedicated <span class=\"wl wl-kjv\" data-code=\"H2764\">thing</span> in Israel","30":"And the <span class=\"wl wl-kjv\" data-code=\"H7225\">first</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1061\">firstfruits</span> of all things, and every <span class=\"wl wl-kjv\" data-code=\"H8641\">oblation</span> of all, of every sort of your <span class=\"wl wl-kjv\" data-code=\"H8641\">oblations,</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's:</span> ye shall also <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> the <span class=\"wl wl-kjv\" data-code=\"H7225\">first</span> of your <span class=\"wl wl-kjv\" data-code=\"H6182\">dough,</span> that he may cause the <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> to <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> in thine house.","31":"The <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of any thing that is dead of <span class=\"wl wl-kjv\" data-code=\"H5038\">itself,</span> or <span class=\"wl wl-kjv\" data-code=\"H2966\">torn,</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H5775\">fowl</span> or beast."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"zijn, zij zal niet geopend worden,","tekst":"Dat is, blijven. Zie Jer 27:22 . Alzo in het volgende."},{"catchword":"dezelve is ingegaan;","tekst":"Zie boven Eze 32:2 , Eze 32:4 ."}],"3":[{"catchword":"vorst, de vorst,","tekst":"Of, overste, waardoor men met sommigen hier kan verstaan den hogepriester, [zie Jer 35:4 ] , afbeeldende onzen Heere Christus, als den enigen Hogepriester, Vorst, Prins en Koning [boven Eze 34:22-23 ] zijner kerk. Of [gelijk anderen] den Heere Christus zelf, die de Heere van dit geestelijk huis is en alleen bekwaam om tot God voor ons te naderen en voor zijn aangezicht te verschijnen, [zie Jer 30:21 ] , die alleen den Vader kent en openbaart, alleen sluit en opent, de enige poort en deur des hemels, die alleen den weg en ingang in het heiligdom voor ons heeft geopend en bereid, en ter rechterhand der majesteit Gods als Koning gezeten is, nemende zijne vreugde in zijn genadewerk en geestelijk gebouw, op welke dit ganse gezicht voornamelijk slaat; vergelijk Mat 3:17 , en Mat 11:27 ; Joh 1:18 , en Joh 3:13 , en Joh 10:9 ; Heb 6:19-20 , en Heb 8:1-2 , en Heb 9:8 , en Heb 10:19-20 ; Rev 3:7 , en Rev 5:5 , enz., idem Isa 53:11 ."},{"catchword":"in dezelve zitten,","tekst":"Anders: aan dezelve."},{"catchword":"brood te eten voor het aangezicht des HEEREN;","tekst":"Dat is, maaltijd te houden, [gelijk tevoren geschiedde van de offeranden] en voorts gemeenzaam voor des Heeren aangezicht te verkeren. Vergelijk Exo 29:32 ; Lev 8:31 , enn Lev 24:9 , en wijders Gen 31:54 . Deze omstandigheden schijnen onderscheid te maken tussen dezen vorst en den vorst, waarvan onder Eze 45 , Eze 46 . Doch beide vorsten [de hogepriester en de koning] kunnen aangemerkt worden als afbeeldende, elk in het zijne, en naar der zaken natuur, den Heere Christus; zie de voorgaande aantekening."},{"catchword":"door den weg van hetzelve","tekst":"Of, zijns weegs."},{"catchword":"uitgaan","tekst":"Dit duiden sommigen op Christus' wederkomst ten oordeel; vergelijk Act 1:11 ; Heb 9:28 ."}],"4":[{"catchword":"voor aan het huis;","tekst":"Hebreeuws, tegen het aangezicht."},{"catchword":"viel ik op mijn aangezicht","tekst":"Gelijk boven Eze 43:3 ."}],"5":[{"catchword":"uitgangen des heiligdoms","tekst":"Of, voortgangen."}],"6":[{"catchword":"Het is te veel voor ulieden,","tekst":"Dat is, gij hebt het te veel gemaakt, het is te hoog en te grof geweest, laat het genoeg zijn, gij zult moeten afhouden van, enz. Vergelijk Num 16:3 ; 1Ki 19:4 , met de aantekening. Alzo onder Eze 45:9 . Met deze ingevoegde bestraffing heeft God zijn volk, wien de profeet dit gezicht belast was bekend te maken, opnieuw willen inscherpen hun gruwelijke zonden, om welker wil Hij den vorigen tempel, stad en land verlaten had, opdat zij door ware bekering en geloof mochten zoeken gemeenschap te hebben met dit nieuwe onverdiende genadewerk, dat God door den Messias zou aanstellen, en dat door dit gezicht was afgebeeld."}],"7":[{"catchword":"vreemden hebt ingebracht,","tekst":"Hebreeuws, kinderen of zonen van den vreemden of uitlandsen; dat is die geen Israëlieten, noch Gods bondgenoten, noch leden van zijn volk waren; zie 2Sa 22:45 , met de aantekening. Alzo vs.9, of, die niet van het priesterlijk geslacht waren, gelijk Lev 22:10 ; [zie de aantekening aldaar] en daarenboven goddeloos, gelijk volgt."},{"catchword":"onbesnedenen van vlees,","tekst":"Dit nemen enigen als twee soorten van onduchtige bedienaars van het heiligdom, zijnde sommigen Israëlieten, maar goddeloos, anderen uitlanders en geen Israëlieten, gans vreemd van God en zijn volk. Anderen verstaan hier zodanigen, die noch van binnen enige godzaligheid hadden, noch van buiten enigen schijn daarvan, zijnde goddeloos van hart en wandel; zie Deu 10:16 ; Jer 4:4 , en Jer 9:25-26 , met de aantekening."},{"catchword":"ontheiligen,","tekst":"Door hunne onwaardigheid, afgoderijen, bijgelovigheden en menselijke inzettingen; vergelijk 2Ki 23:5 ; 2Ch 34:5 , en boven Eze 43:7-8 , met de aantekening."},{"catchword":"brood,","tekst":"Dat is, spijs. Versta, het geofferde; zie Lev 3:11 , en Lev 21:8 ; Num 28:2 ; Mal 1:12 ."},{"catchword":"vet en het bloed offerdet,","tekst":"Vergelijk onder vs.15, en Lev 3:16-17 ; maar dit hadden zij geofferd door onwettelijke en goddeloze priesters."},{"catchword":"zij Mijn verbond verbraken,","tekst":"De vreemde priesters, doende tegen al mijne ordinantiën, en alzo het verbond van het priesterdom inbrekende en vernietigende."},{"catchword":"uw gruwelen","tekst":"Boven de andere gruwelen die gij zelf bedreeft; anders: om, ter oorzaak van, vermits, enz."}],"8":[{"catchword":"wacht van Mijn","tekst":"Vergelijk boven Eze 40:45 , met de aantekening."},{"catchword":"heilige dingen niet waargenomen;","tekst":"Hebreeuws, mijner heiligheden."},{"catchword":"uzelven","tekst":"Die gijzelf daartoe verkoren hebt, buiten en tegen mijn last."}],"9":[{"catchword":"Alzo zegt de Heere HEERE","tekst":"Hier volgen nu de wetten van reformatie in de kerkelijke diensten, aanwijzende wie daartoe onduchtig of duchtig zijn; vergelijk de apostolische bevelen, inzonderheid in de brieven aan Timotheus en Titus; idem Rev 2 , Rev 3 , enz."},{"catchword":"Geen vreemde, onbesneden van hart,","tekst":"Hebreeuws, alle kind, of zoon eens vreemden zal niet, enz.; dat is, geen van hen; geen die onduchtig is in geloof of leer en leven."}],"10":[{"catchword":"Maar de","tekst":"Of, ja ook, zelfs, enz."},{"catchword":"Levieten,","tekst":"Hierdoor verstaan sommigen de priesters uit de Levieten, zijnde van Ithamar en Abjathar afkomstig, uit vs.13, en de tegenstelling van vs.15, en boven Eze 40:46 , en Eze 43:19 ; zie 1Ki 2:27 . Dit is ene afbeelding van de tucht, die in Gods kerk moet geoefend worden over al zulke bedienaars van Gods huis, die van den waren godsdienst en religie afwijkende, Gode en zijn kerk ontrouw zijn geworden, wanneer zij zich daarvan komen te bekeren; vergelijk 2Ki 23:9 , met de aantekening aldaar."},{"catchword":"drekgoden achterna,","tekst":"Zie Lev 26:30 ."},{"catchword":"ongerechtigheid dragen;","tekst":"Dat is, straf hunner ongerechtigheid; zie Lev 5:1 ."}],"11":[{"catchword":"bedienaars zijn,","tekst":"Van slechtere en mindere diensten dan zij tevoren bedienden, [dat is, zij zullen gedegradered worden]; 1Ch 23:28-29 ; idem Num 3:7-8 , en onder vs.14."}],"12":[{"catchword":"henlieden gediend hebben","tekst":"Het volk."},{"catchword":"hand tegen hen opgeheven,","tekst":"Dit is, Ik heb gezworen; zie Gen 14:22 ."}],"13":[{"catchword":"heilige dingen,","tekst":"Hebreeuws, heiligheden."},{"catchword":"allerheiligste dingen;","tekst":"Of, in de allerheiligste plaatsen. Hebreeuws, heiligheden der heiligheden."},{"catchword":"gruwelen, die zij gedaan hebben","tekst":"Dat is, de straf van die, gelijk boven vs.10."}],"14":[{"catchword":"wacht des huizes,","tekst":"Vergelijk boven Eze 40:45 , met de aantekening, en hier boven vs.11."}],"15":[{"catchword":"Levietische priesters,","tekst":"Anders, de priesters [en] de Levieten. Vergelijk boven Eze 40:45-46 , met de aantekening."},{"catchword":"kinderen van Zadok,","tekst":"Dat is, nakomelingen van Zadok, die afkomstig was van Aäron door Eleazar en Pinehas, [welken een eeuwig priesterdom was toegezegd, Num 25:13 ] en die in Abjathars plaats hogepriester werd. Zie 1Ki 2:27 , 1Ki 2:35 , met de aantekening. Zadok heet zoveel als rechtvaardig zijn, of een gerechtvaardigde. Deze kinderen van Zadok worden hier gesteld als een voorbeeld van alle wettelijke, waardige en bekwame dienaars der kerk van Christus [van den Koning der gerechtigheid en Hogepriester naar de ordening of wijze van Melchizedek] die hier van God in hun dienst vastgesteld, vereerd en gezegend worden."},{"catchword":"wacht Mijns heiligdoms hebben waargenomen,","tekst":"Hun bevolen dienst getrouwelijk en bestendiglijk hebben verricht, of rein en zuiver zijn gebleven in het geloof en den waren godsdienst."}],"16":[{"catchword":"tafel naderen,","tekst":"Zie boven Eze 41:22 ."},{"catchword":"Mijn wacht waarnemen","tekst":"Zie Lev 8:35 ; Num 3:7 ."}],"17":[{"catchword":"linnen klederen zullen aantrekken;","tekst":"Dat rein, luchtig, blank, lieflijk en niet bezwaarlijk, lastig of hinderlijk is en in den dienst, als wel in een wollen kleed. Zie van de priesterlijke klederen boven Eze 42:14 , en vergelijk Mat 17:2 , en Mat 28:3 ; Rev 4:4 , en Rev 7:13 ."}],"18":[{"catchword":"huiven zullen op hun hoofd zijn,","tekst":"Het Hebreeuwse woord heeft den naam van versieren; en het dekken van het hoofd wordt genomen voor een teken van onderwerping en onderdanigheid, 1Co 11:10 . Alzo is der leraren sieraad, hun Hoofd Christus onderdanig en onderworpen te zijn; vergelijk Exo 28:40 , en Exo 39:28 ."},{"catchword":"zweet","tekst":"Of, met zweet; dat is, alzo, of met zulke begording of kleding, dat zij daarvan zouden zweten, of, [gelijk sommigen] aan zweterige plaatsen van het lichaam, waar de mens gemeenlijk het meest zweet. Anders: naar het zweet, dit houden sommigen als ene afbeelding van de wakkerheid en kuisheid des harten, die bij de bedienaars van Gods kerk in het verrichten van den dienst moet zijn."}],"19":[{"catchword":"heilige kameren;","tekst":"Hebreeuws, kamers der heiligheid. Zie boven Eze 42:14 ."},{"catchword":"heiligen met hun klederen","tekst":"Door het aanroeren der heilige klederen, die met de heilige olie gezalfd en alleen voor de priesters waren, geheiligd tot den godsdienst, welke heiliging met de andere niet mocht gemeen gemaakt worden; zie Exo 29:37 , en Exo 30:29 ; idem onder Eze 46:20 . Sommigen nemen het alsof God zijne dienstknechten daarmede wil verbieden een huichelachtigen schijn van heiligheid voor de gemeente te voeren, en integendeel bevelen gemeenzaamheid met de broeders; vergelijk Mat 6:5-6 , Mat 6:16-18 ."}],"20":[{"catchword":"hoofd niet glad","tekst":"Niet gans kaal scheren noch het haar lang laten wassen, maar matiglijk korten, afsnijden of scheren, vergelijk Lev 21:5 ; betekenende eerbaarheid, zedigheid en matigheid in den uiterlijken wandel."},{"catchword":"afscheren,","tekst":"Te weten met een scheermes, gelijk enigen dit nemen."},{"catchword":"lang laten wassen;","tekst":"Hebreeuws, laten uitschieten, uitslaan, voortschieten; dat is, lang laten wassen."},{"catchword":"behoorlijk zullen zij hun hoofden bescheren","tekst":"Hebreeuws, bescherende zullen zij bescheren. Anders: ganselijk, of in alle manieren afsnijden, en dan in het voorgaande, bescheren. Het Hebreeuwse woord wordt alleenlijk hier gevonden."}],"21":[{"catchword":"priester","tekst":"Hebreeuws, alle priesters zullen niet, enz.; dat is, geen van hen zal, enz."},{"catchword":"wijn drinken,","tekst":"Dat is, hij zal zijn dienst met een nuchter, aandachtig, opmerkend en heilig gemoed verrichten, en alles vermijden wat hem daarin zou mogen hinderen. Vergelijk Lev 10:9 ; 1Ti 3:3 ; Tit 1:7 ; idem Mat 24:48-49 , enz."}],"22":[{"catchword":"Ook zullen zij zich geen weduwe of verstotene tot vrouwen nemen;","tekst":"Vergelijk Lev 21:13 , enz. Deze ordinantie wil zeggen dat Gods dienaars stichtelijk en den Heere zullen huwelijken, vermijdende hetgeen de eer en waardigheid van hun dienst zou mogen verduisteren, of een onstichtelijke huishouding veroorzaken; vergelijk 1Ti 3:2 , 1Ti 3:4 ; idem 1Co 7:39 , en 1Co 9:5 ."}],"23":[{"catchword":"onderscheid leren","tekst":"Vergelijk Lev 10:10 , en boven Eze 22:26 ; Mal 2:7 ; 1Ti 6:20 ; 2Ti 1:13 , en 2Ti 2:15-16 ; Tit 1:9 ; Rev 2:2 , Rev 2:14-16 , Rev 2:20 , enz."}],"24":[{"catchword":"twistzaak","tekst":"Vergelijk Deu 17:8-9 , enz.; 2Ch 19:10-11 . Dit ziet op de kerkelijke rechtspraak, of de oordelen, die in Gods huis bij kerkelijke vergaderingen naar Gods Woord moeten gehouden worden, tot onderrichting der conscientiën in zaken van geloof en leven, wegneming en voorkoming van ergernissen en behoudenis van vrede en enigheid onder broeders."},{"catchword":"staan om te richten;","tekst":"Of, bij recht blijven staan; dat is, bestendiglijk volharden in hetgeen recht en mijnen woorde overeenkomstig is. Vergelijk 2Ki 23:3 , en de manier van spreken gebruikt, Deu 25:8 ."},{"catchword":"zullen Mijn wetten en Mijn inzettingen","tekst":"Vergelijk 1Ti 6:13-14 , enz."},{"catchword":"gezette hoogtijden houden,","tekst":"Anders: in, of met al mijne bijeenkomsten; dat is, zowel het een als het ander, wat van mij is ingesteld, dat zullen zij onderhouden, bijzonder wat aangaat de vergaderingen der gelovigen den openbaren godsdienst in dezelve."},{"catchword":"sabbatten heiligen","tekst":"Zie Exo 20:8 ; idem Heb 4:9-11 ."}],"25":[{"catchword":"geen van hen tot een doden mens ingaan,","tekst":"Hebreeuws, hij zal niet, enz. dat is, geen der priesters. Vergelijk Lev 21:1-4 , enz. Deze ordinantie beveelt al zulke matigheid in rouw, dat de godsdienst geëerbiedigd en de band der natuur en van den geest onder de Christenen niet veracht, en ook de hoop van het eeuwige leven niet verduisterd worden; met bekentenis onzer zwakheid en gebrekkelijkheid in dezen, waarvan wij vergeving door Christus moeten verzoeken. Vergelijk 1Th 4:13 , enz., Joh 11:33 , Joh 11:35 ; Act 9:39 ."}],"26":[{"catchword":"zijn reiniging zullen zij hem zeven dagen tellen","tekst":"Van den priester, die verontreinigd was over een dode, vergelijk Num 6:9 , enz., en Num 19:11-12 , enz."}],"28":[{"catchword":"Dit nu zal hun tot een erfenis zijn","tekst":"Vergelijk deze wetten met Num 18:8 , Num 18:20 , Num 18:24 ; Deu 10:9 , en Deu 12:12 , en Deu 14:27 , en Deu 18:1-2 , en Deu 26:12 ; onder dezelve wordt den kerkendienaren van God verordineerd hun behoorlijk onderhoud. Zie Mat 10:10 ; Luk 10:7 ; 1Co 9:4 , 2Co 3:6-7 , enz., en zeer klaarlijk vs.13,14, aldaar."}],"29":[{"catchword":"verbannene in Israël het hunne zijn","tekst":"Hebreeuws, ban. Zie Lev 27:21 ."}],"30":[{"catchword":"eerstelingen","tekst":"Hebreeuws, het eerste, het voornaamste van alle eerstelingen van alles. Zie Exo 13:2 , en Exo 22:29-30 ; Num 18:11 ."},{"catchword":"vruchten","tekst":"Of, van hetgeen eerst voortkomt."},{"catchword":"alles, en alle","tekst":"Dat is, allerlei, en zo in het volgende."},{"catchword":"hefoffer van alles,","tekst":"Of, alle offerande, enz."},{"catchword":"de eerstelingen van uw deeg den priester geven,","tekst":"Vergelijk Num 15:20 ; Neh 10:37 , enz."},{"catchword":"zegen op uw huis te doen rusten","tekst":"Vergelijk Deu 14:29 , en zie het tegendeel boven Eze 5:13 ."}],"31":[{"catchword":"Geen aas,","tekst":"Hebreeuws, allen aas, enz. zullen zij [de priesters] niet, enz. dat is, geen aas, niets verscheurds; vergelijk Exo 22:31 ; Lev 22:4 , Lev 22:8 ; boven Eze 4:14 , betekenende dat de kerkedienaars onstraffelijk en heilig moeten zijn, niet genegen tot den verdervenden toorn, roverij, onrechtvaardig gewin, enz. vergelijk Mat 23:25 ; 1Ti 3:3 ; hetwelk ook allen gelovigen [als geestelijke priesters] bevolen moet zijn, gelijk deze wet ook gans Israël gegeven is; Exo 22:31 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then he caused me to return the way (towards) the gate of // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
