 Israël! Hoort het woord van de HEERE.","2":"Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!","3":"Daarom profeteer en zeg: Zo zegt de Heere HEERE: Daarom, omdat men u van rondom verwoest en opgeslokt heeft, opdat u voor het overblijfsel van de heidenen ten erve zou zijn, en u gebracht bent op de klapachtige lip en *in* opspraak van het volk;","4":"Daarom, bergen van Israël! Hoort het woord van de Heere HEERE: Zo zegt de Heere HEERE tot de bergen en tot de heuvels, tot de stromen en tot de dalen, tot de verwoeste eenzame plaatsen en tot de verlaten steden, die tot een roof en tot een spot geworden zijn voor het overblijfsel van de heidenen, die rondom zijn;","5":"Daarom, zo zegt de Heere HEERE: Zeker, Ik heb in het vuur van Mijn ijver gesproken tegen het overblijfsel van de heidenen, en tegen heel Edom; die Mijn land zichzelf ten erve gegeven hebben met blijdschap van het hele hart, met begerige plundering, opdat de landerij daarvan ten rove zou zijn!","6":"Daarom profeteer van het land van Israël, en zeg tot de bergen en tot de heuvels, tot de stromen en tot de dalen: Zo zegt de Heere HEERE: Ziet, Ik heb in Mijn ijver en in Mijn grimmigheid gesproken, omdat u de smaad van de heidenen gedragen hebt;","7":"Daarom, zo zegt de Heere HEERE: Ik heb Mijn hand opgeheven; zeker, de heidenen die rondom u zijn, zullen zelf hun schande dragen!","8":"Maar u, o bergen van Israël! U zult weer *uw* takken geven, en uw vrucht voor Mijn volk Israël dragen, want zij zijn dicht bij om te komen.","9":"Want ziet, Ik ben bij u, en Ik zal u aanzien, en u zult gebouwd en bezaaid worden.","10":"En Ik zal mensen op u vermenigvuldigen, het hele huis van Israël, *ja*, dat geheel; en de steden zullen bewoond, en de eenzame plaatsen bebouwd worden.","11":"Ja, Ik zal mensen en beesten op u vermenigvuldigen, en zij zullen vermenigvuldigd worden en vruchtbaar zijn; en Ik zal u doen bewonen, als in uw vorige tijden, ja, Ik zal het beter maken dan in uw beginselen; en u zult weten dat Ik de HEERE ben.","12":"En Ik zal mensen op u doen wandelen, *namelijk* Mijn volk Israël, die zullen u erfelijk bezitten, en u zult hun ter erfenis zijn, en u zult ze voortaan niet meer beroven.","13":"Zo zegt de Heere HEERE: Omdat zij tot u zeggen: U bent *een* *land* dat mensen opeet, en u bent *een* *land* dat uw volken berooft;","14":"Daarom zult u niet meer mensen opeten, en uw volken niet meer doen struikelen, spreekt de Heere HEERE.","15":"En Ik zal maken dat men de schimp van de heidenen niet meer over u hoort, en u zult de smaad van de natiën niet meer dragen; en u zult uw volken niet meer doen struikelen, spreekt de Heere HEERE.","16":"Verder gebeurde het: het woord van de HEERE kwam tot mij, en Hij zei:","17":"Mensenkind! Het huis van Israël, toen zij in hun land woonden, verontreinigden zij dat met hun weg en met hun handelingen; hun weg was voor Mijn aangezicht als de onreinheid van een afgezonderde *vrouw*.","18":"Daarom goot Ik Mijn grimmigheid over hen uit, om het bloed dat zij in het land vergoten hadden, en om hun drekgoden[1], *waarmee* zij dat verontreinigd hadden.","19":"En Ik verstrooide hen onder de heidenen, en zij werden verspreid in de landen; Ik oordeelde ze naar hun weg en naar hun handelingen.","20":"Toen zij nu tot de heidenen kwamen waarheen zij getrokken waren, ontheiligden zij Mijn heilige Naam, omdat men van hen zei: Dezen zijn het volk van de HEERE, en zijn uit Zijn land uitgegaan.","21":"Maar Ik verschoonde *hen* om Mijn heilige Naam, die het huis van Israël ontheiligde onder de heidenen waarheen zij gekomen waren.","22":"Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.","23":"Want Ik zal Mijn grote Naam heiligen, die onder de heidenen ontheiligd is, die u in het midden van hen ontheiligd hebt; en de heidenen zullen weten dat Ik de HEERE ben, spreekt de Heere HEERE, als Ik aan u voor hun ogen zal geheiligd zijn.","24":"Want Ik zal u uit de heidenen halen, en zal u uit al de landen bijeenbrengen; en Ik zal u in uw land brengen.","25":"Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.","26":"En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven.","27":"En Ik zal Mijn Geest geven in het binnenste van u; en Ik zal maken dat u in Mijn inzettingen zult wandelen, en Mijn rechten zult bewaren en doen.","28":"En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.","29":"En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen.","30":"En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.","31":"Dan zult u denken aan uw slechte wegen en uw handelingen, die niet goed waren; en u zult een walging van uzelf hebben over uw ongerechtigheden en over uw gruwelen.","32":"Ik doe het niet om u, spreekt de Heere HEERE, laat u dat bekend zijn! Schaamt u en wordt schaamrood van uw wegen, huis van Israël!","33":"Zo zegt de Heere HEERE: Op de dag dat Ik u reinigen zal van al uw ongerechtigheden, dan zal Ik de steden doen bewonen, en de eenzame plaatsen zullen bebouwd worden.","34":"En het verwoeste land zal bebouwd worden, in plaats dat het een verwoesting was, voor de ogen van iedereen die er doorheen ging.","35":"En zij zullen zeggen: Dit land, dat verwoest was, is geworden als een hof van Eden; en de eenzame en de verwoeste en verstoorde steden zijn versterkt *en* bewoond.","36":"Dan zullen de heidenen die in de plaatsen rondom u overgelaten zijn, weten dat Ik, de HEERE, de verstoorde plaatsen bebouw, *en* het verwoeste beplant. Ik, de HEERE, heb het gesproken en zal het doen.","37":"Zo zegt de Heere HEERE: Daarenboven zal Ik hierom door het huis van Israël vertrouwd worden, dat Ik het hun doe; Ik zal ze vermenigvuldigen met mensen, als schapen.","38":"Zoals de geheiligde schapen, zoals de schapen van Jeruzalem op hun vastgestelde feesttijden, zo zullen de eenzame steden vol zijn van mensenkudden; en zij zullen weten dat Ik de HEERE ben."},"SV":{"1":"En gij, mensenkind! profeteer tot de bergen Israëls, en zeg: Gij bergen Israëls! hoort des HEEREN woord.","2":"Alzo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! zelfs de eeuwige hoogten zijn ons ten erve geworden!","3":"Daarom profeteer en zeg: Zo zegt de Heere HEERE: Daarom, omdat men u van rondom verwoest en opgeslokt heeft, opdat gij voor het overblijfsel der heidenen ten erve zoudt zijn, en gij gebracht zijt op de klapachtige lip en *in* opspraak des volks;","4":"Daarom, gij bergen Israëls! hoort het woord des Heeren HEEREN: Zo zegt de Heere HEERE tot de bergen en tot de heuvelen, tot de stromen en tot de dalen, tot de verwoeste eenzame plaatsen en tot de verlaten steden, die tot een roof en tot een spot geworden zijn voor het overblijfsel der heidenen, die rondom zijn;","5":"Daarom, zo zegt de Heere HEERE: Zo Ik niet in het vuur Mijns ijvers gesproken heb tegen het overblijfsel der heidenen, en tegen het ganse Edom; die Mijn land zichzelven ten erve gegeven hebben met blijdschap des gansen harten, met begerige plundering, opdat de landerij daarvan ten rove zou zijn!","6":"Daarom profeteer van het land Israëls, en zeg tot de bergen en tot de heuvelen, tot de stromen en tot de dalen: Zo zegt de Heere HEERE: Ziet, Ik heb in Mijn ijver en in Mijn grimmigheid gesproken, omdat gij den smaad der heidenen gedragen hebt;","7":"Daarom, zo zegt de Heere HEERE: Ik heb Mijn hand opgeheven; zo niet de heidenen, die rondom u zijn, zelf hun schande zullen dragen!","8":"Maar gij, o bergen Israëls! gij zult weder *uw* takken geven, en uw vrucht voor Mijn volk Israël dragen, want zij naderen te komen.","9":"Want ziet, Ik ben bij u, en Ik zal u aanzien, en gij zult gebouwd en bezaaid worden.","10":"En Ik zal mensen op u vermenigvuldigen, het ganse huis Israëls, *ja*, dat geheel; en de steden zullen bewoond, en de eenzame plaatsen bebouwd worden.","11":"Ja, Ik zal mensen en beesten op u vermenigvuldigen, en zij zullen vermenigvuldigd worden en vruchtbaar zijn; en Ik zal u doen bewonen, als in uw vorige tijden, ja, Ik zal het beter maken dan in uw beginselen; en gij zult weten, dat Ik de HEERE ben.","12":"En Ik zal mensen op u doen wandelen, *namelijk* Mijn volk Israël, die zullen u erfelijk bezitten, en gij zult hun ter erfenis zijn, en gij zult ze voortaan niet meer beroven.","13":"Zo zegt de Heere HEERE: Omdat zij tot u zeggen: Gij zijt *een* *land*, dat mensen opeet, en gij zijt *een* *land*, dat uw volken berooft;","14":"Daarom zult gij niet meer mensen opeten, en uw volken niet meer doen struikelen, spreekt de Heere HEERE.","15":"En Ik zal maken, dat men den schimp der heidenen niet meer over u hore, en gij zult den smaad der natiën niet meer dragen; en gij zult uw volken niet meer doen struikelen, spreekt de Heere HEERE.","16":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","17":"Mensenkind! het huis Israëls, als zij in hun land woonden, toen verontreinigden zij datzelve met hun weg en met hun handelingen; hun weg was voor Mijn aangezicht als de onreinigheid ener afgezonderde *vrouw*.","18":"Daarom goot Ik Mijn grimmigheid over hen uit, om des bloeds wil, dat zij in het land vergoten hadden, en om hun drekgoden, *waarmede* zij dat verontreinigd hadden.","19":"En Ik verstrooide hen onder de heidenen, en zij werden verspreid in de landen; Ik oordeelde ze naar hun weg en naar hun handelingen.","20":"Als zij nu tot de heidenen kwamen, waarhenen zij getogen waren, ontheiligden zij Mijn heiligen Naam, omdat men van hen zeide: Dezen zijn het volk des HEEREN, en zijn uit Zijn land uitgegaan.","21":"Maar Ik verschoonde *hen* om Mijn heiligen Naam, dien het huis Israëls ontheiligde onder de heidenen, waarhenen zij gekomen waren.","22":"Daarom zeg tot het huis Israëls: Zo zegt de Heere HEERE: Ik doe het niet om uwentwil, gij huis Israëls! maar om Mijn heiligen Naam, dien gijlieden ontheiligd hebt onder de heidenen, waarhenen gij gekomen zijt.","23":"Want Ik zal Mijn groten Naam heiligen, die onder de heidenen ontheiligd is, dien gij in het midden van hen ontheiligd hebt; en de heidenen zullen weten, dat Ik de HEERE ben, spreekt de Heere HEERE, als Ik aan u voor hun ogen zal geheiligd zijn.","24":"Want Ik zal u uit de heidenen halen, en zal u uit al de landen vergaderen; en Ik zal u in uw land brengen.","25":"Dan zal Ik rein water op u sprengen, en gij zult rein worden; van al uw onreinigheden en van al uw drekgoden zal Ik u reinigen.","26":"En Ik zal u een nieuw hart geven, en zal een nieuwen geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlesen hart geven.","27":"En Ik zal Mijn Geest geven in het binnenste van u; en Ik zal maken, dat gij in Mijn inzettingen zult wandelen, en Mijn rechten zult bewaren en doen.","28":"En gij zult wonen in het land, dat Ik uw vaderen gegeven heb, en gij zult Mij tot een volk zijn, en Ik zal u tot een God zijn.","29":"En Ik zal u verlossen van al uw onreinigheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen.","30":"En Ik zal de vrucht van het geboomte en de inkomst des velds vermenigvuldigen; opdat gij de smaadheid des hongers niet meer ontvangt onder de heidenen.","31":"Dan zult gij gedenken aan uw boze wegen en uw handelingen, die niet goed waren; en gij zult een walging van u zelf hebben over uw ongerechtigheden en over uw gruwelen.","32":"Ik doe het niet om uwentwil, spreekt de Heere HEERE, het zij u bekend! Schaamt u en wordt schaamrood van uw wegen, gij huis Israëls!","33":"Alzo zegt de Heere HEERE: Ten dage, als Ik u reinigen zal van al uw ongerechtigheden, dan zal Ik de steden doen bewonen, en de eenzame plaatsen zullen bebouwd worden.","34":"En het verwoeste land zal bebouwd worden, in plaats dat het een verwoesting was, voor de ogen van een ieder, die er doorging.","35":"En zij zullen zeggen: Dit land, dat verwoest was, is geworden als een hof van Eden; en de eenzame, en de verwoeste en verstoorde steden zijn vast *en* bewoond.","36":"Dan zullen de heidenen, die in de plaatsen rondom u zullen overgelaten zijn, weten, dat Ik, de HEERE, de verstoorde plaatsen bebouw, *en* het verwoeste beplant. Ik, de HEERE, heb het gesproken en zal het doen.","37":"Alzo zegt de Heere HEERE: Daarenboven zal Ik hierom van het huis Israëls verzocht worden, dat Ik het hun doe; Ik zal ze vermenigvuldigen van mensen, als schapen.","38":"Gelijk de geheiligde schapen, gelijk de schapen van Jeruzalem op hun gezette hoogtijden, alzo zullen de eenzame steden vol zijn van mensenkudden; en zij zullen weten, dat Ik de HEERE ben."},"KJV":{"1":"Also, thou son of man, prophesy unto the mountains of Israel, and say, Ye mountains of Israel, hear the word of the LORD:","2":"Thus saith the Lord GOD; Because the enemy hath said against you, Aha, even the ancient high places are ours in possession:","3":"Therefore prophesy and say, Thus saith the Lord GOD; Because they have made *you* desolate, and swallowed you up on every side, that ye might be a possession unto the residue of the heathen, and ye are taken up in the lips of talkers, and *are* an infamy of the people:","4":"Therefore, ye mountains of Israel, hear the word of the Lord GOD; Thus saith the Lord GOD to the mountains, and to the hills, to the rivers, and to the valleys, to the desolate wastes, and to the cities that are forsaken, which became a prey and derision to the residue of the heathen that *are* round about;","5":"Therefore thus saith the Lord GOD; Surely in the fire of my jealousy have I spoken against the residue of the heathen, and against all Idumea, which have appointed my land into their possession with the joy of all *their* heart, with despiteful minds, to cast it out for a prey.","6":"Prophesy therefore concerning the land of Israel, and say unto the mountains, and to the hills, to the rivers, and to the valleys, Thus saith the Lord GOD; Behold, I have spoken in my jealousy and in my fury, because ye have borne the shame of the heathen:","7":"Therefore thus saith the Lord GOD; I have lifted up mine hand, Surely the heathen that *are* about you, they shall bear their shame.","8":"But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people of Israel; for they are at hand to come.","9":"For, behold, I *am* for you, and I will turn unto you, and ye shall be tilled and sown:","10":"And I will multiply men upon you, all the house of Israel, *even* all of it: and the cities shall be inhabited, and the wastes shall be builded:","11":"And I will multiply upon you man and beast; and they shall increase and bring fruit: and I will settle you after your old estates, and will do better *unto you* than at your beginnings: and ye shall know that I *am* the LORD.","12":"Yea, I will cause men to walk upon you, *even* my people Israel; and they shall possess thee, and thou shalt be their inheritance, and thou shalt no more henceforth bereave","13":"Thus saith the Lord GOD; Because they say unto you, Thou *land* devourest up men, and hast bereaved thy nations;","14":"Therefore thou shalt devour men no more, neither bereave thy nations any more, saith the Lord GOD.","15":"Neither will I cause *men* to hear in thee the shame of the heathen any more, neither shalt thou bear the reproach of the people any more, neither shalt thou cause thy nations to fall any more, saith the Lord GOD.","16":"Moreover the word of the LORD came unto me, saying,","17":"Son of man, when the house of Israel dwelt in their own land, they defiled it by their own way and by their doings: their way was before me as the uncleanness of a removed woman.","18":"Wherefore I poured my fury upon them for the blood that they had shed upon the land, and for their idols *wherewith* they had polluted","19":"And I scattered them among the heathen, and they were dispersed through the countries: according to their way and according to their doings I judged","20":"And when they entered unto the heathen, whither they went, they profaned my holy name, when they said to them, These *are* the people of the LORD, and are gone forth out of his land.","21":"But I had pity for mine holy name, which the house of Israel had profaned among the heathen, whither they went.","22":"Therefore say unto the house of Israel, Thus saith the Lord GOD; I do not *this* for your sakes, O house of Israel, but for mine holy name's sake, which ye have profaned among the heathen, whither ye went.","23":"And I will sanctify my great name, which was profaned among the heathen, which ye have profaned in the midst of them; and the heathen shall know that I *am* the LORD, saith the Lord GOD, when I shall be sanctified in you before their eyes.","24":"For I will take you from among the heathen, and gather you out of all countries, and will bring you into your own land.","25":"Then will I sprinkle clean water upon you, and ye shall be clean: from all your filthiness, and from all your idols, will I cleanse","26":"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.","27":"And I will put my spirit within you, and cause you to walk in my statutes, and ye shall keep my judgments, and do","28":"And ye shall dwell in the land that I gave to your fathers; and ye shall be my people, and I will be your God.","29":"I will also save you from all your uncleannesses: and I will call for the corn, and will increase it, and lay no famine","30":"And I will multiply the fruit of the tree, and the increase of the field, that ye shall receive no more reproach of famine among the heathen.","31":"Then shall ye remember your own evil ways, and your doings that *were* not good, and shall lothe yourselves in your own sight for your iniquities and for your abominations.","32":"Not for your sakes do I *this*, saith the Lord GOD, be it known unto you: be ashamed and confounded for your own ways, O house of Israel.","33":"Thus saith the Lord GOD; In the day that I shall have cleansed you from all your iniquities I will also cause *you* to dwell in the cities, and the wastes shall be builded.","34":"And the desolate land shall be tilled, whereas it lay desolate in the sight of all that passed by.","35":"And they shall say, This land that was desolate is become like the garden of Eden; and the waste and desolate and ruined cities *are become* fenced, *and* are inhabited.","36":"Then the heathen that are left round about you shall know that I the LORD build the ruined *places, and* plant that that was desolate: I the LORD have spoken *it*, and I will do","37":"Thus saith the Lord GOD; I will yet *for* this be enquired of by the house of Israel, to do *it* for them; I will increase them with men like a flock.","38":"As the holy flock, as the flock of Jerusalem in her solemn feasts; so shall the waste cities be filled with flocks of men: and they shall know that I *am* the LORD."}},"tsk":{"1":[{"kopje":"de bergen","refs":["Ezech 6:2","Ezech 6:3","Ezech 33:28","Ezech 34:14","Ezech 37:22"]},{"kopje":"hoort","refs":["Ezech 36:4","Ezech 36:8","Ezech 20:47","Ezech 37:4","Jer 22:29"]}],"2":[{"kopje":"Omdat","refs":["Ezech 36:5","Ezech 25:3","Ezech 26:2"]},{"kopje":"Zelfs","refs":["Deut 32:13","Ps 78:69","Jes 58:14","Hab 3:19"]},{"kopje":"ons","refs":["Ezech 35:10","Jer 49:1"]}],"3":[{"kopje":"Daarom, omdat","refs":["Ezech 13:10","Lev 26:43"]},{"kopje":"verwoest","refs":["Jer 39:1-18","Jer 41:1-18","Jer 52:1-34","Klaagl 1:1","Klaagl 5:22"]},{"kopje":"opgeslokt","refs":["Ps 35:25" \" data-code=\"H1681\">infamy</span> of the people:","4":"Therefore, ye <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> to the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1516\">valleys,</span> to the <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H2723\">wastes,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that are <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken,</span> which became a <span class=\"wl wl-kjv\" data-code=\"H957\">prey</span> and <span class=\"wl wl-kjv\" data-code=\"H3933\">derision</span> to the <span class=\"wl wl-kjv\" data-code=\"H7611\">residue</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that are round about;","5":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Surely in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of my <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> have I <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> against the <span class=\"wl wl-kjv\" data-code=\"H7611\">residue</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and against all <span class=\"wl wl-kjv\" data-code=\"H123\">Idumea,</span> which have <span class=\"wl wl-kjv\" data-code=\"H5414\">appointed</span> my <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> into their <span class=\"wl wl-kjv\" data-code=\"H4181\">possession</span> with the <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> of all their <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> with <span class=\"wl wl-kjv\" data-code=\"H7589\">despiteful</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">minds,</span> to cast it <span class=\"wl wl-kjv\" data-code=\"H4054\">out</span> for a prey.","6":"<span class=\"wl wl-kjv\" data-code=\"H5012\">Prophesy</span> therefore concerning the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> to the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1516\">valleys,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> in my <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> and in my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury,</span> because ye have <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> the <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> of the heathen:","7":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I have lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> Surely the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that are <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> you, they shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their shame.","8":"But ye, O <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> ye shall shoot <span class=\"wl wl-kjv\" data-code=\"H5414\">forth</span> your <span class=\"wl wl-kjv\" data-code=\"H6057\">branches,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">yield</span> your <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> to my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> for they are at <span class=\"wl wl-kjv\" data-code=\"H7126\">hand</span> to come.","9":"For, behold, I am for you, and I will <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> unto you, and ye shall be <span class=\"wl wl-kjv\" data-code=\"H5647\">tilled</span> and sown:","10":"And I will <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> upon you, all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> even all of it: and the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabited,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2723\">wastes</span> shall be builded:","11":"And I will <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> upon you <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H929\">beast;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7235\">increase</span> and bring <span class=\"wl wl-kjv\" data-code=\"H6509\">fruit:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3427\">settle</span> you after your old <span class=\"wl wl-kjv\" data-code=\"H6927\">estates,</span> and will do <span class=\"wl wl-kjv\" data-code=\"H2895\">better</span> unto you than at your <span class=\"wl wl-kjv\" data-code=\"H7221\">beginnings:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","12":"Yea, I will cause <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> upon you, even my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> thee, and thou shalt be their <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> and thou shalt no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> henceforth bereave","13":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Because they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto you, Thou land devourest <span class=\"wl wl-kjv\" data-code=\"H398\">up</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H7921\">bereaved</span> thy nations;","14":"Therefore thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> no more, neither <span class=\"wl wl-kjv\" data-code=\"H7921\">bereave</span> thy <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> any more, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","15":"Neither will I cause men to <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> in thee the <span class=\"wl wl-kjv\" data-code=\"H3639\">shame</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> any more, neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> any more, neither shalt thou cause thy <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> to <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> any more, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","16":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","17":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> when the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in their own <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> they <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> it by their own <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> and by their <span class=\"wl wl-kjv\" data-code=\"H5949\">doings:</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me as the <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> of a removed woman.","18":"Wherefore I <span class=\"wl wl-kjv\" data-code=\"H8210\">poured</span> my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> upon them for the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that they had <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and for their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> wherewith they had polluted","19":"And I <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> them among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and they were <span class=\"wl wl-kjv\" data-code=\"H2219\">dispersed</span> through the <span class=\"wl wl-kjv\" data-code=\"H776\">countries:</span> according to their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> and according to their <span class=\"wl wl-kjv\" data-code=\"H5949\">doings</span> I judged","20":"And when they <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> whither they <span class=\"wl wl-kjv\" data-code=\"H935\">went,</span> they <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> when they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to them, These are the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and are gone <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of his land.","21":"But I had <span class=\"wl wl-kjv\" data-code=\"H2550\">pity</span> for mine <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> which the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> whither they went.","22":"Therefore <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not this for your sakes, O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> but for mine <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake, which ye have <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> whither ye went.","23":"And I will <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> my <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> which was <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> which ye have <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them; and the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> when I shall be <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> in you before their eyes.","24":"For I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> you from <span class=\"wl wl-kjv\" data-code=\"H4480\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> you out of all <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> and will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> you into your own land.","25":"Then will I <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkle</span> <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> upon you, and ye shall be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean:</span> from all your <span class=\"wl wl-kjv\" data-code=\"H2932\">filthiness,</span> and from all your <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> will I cleanse","26":"A <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> also will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you, and a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> you: and I will take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stony</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> out of your <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you an <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of flesh.","27":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> you, and <span class=\"wl wl-kjv\" data-code=\"H6213\">cause</span> you to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in my <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and do","28":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell wl-kjv\" data-code=\"H2720\">waste</span> and <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> and <span class=\"wl wl-kjv\" data-code=\"H2040\">ruined</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are become <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced,</span> and are inhabited.","36":"Then the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that are <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> you shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H2040\">ruined</span> places, and <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> that that was <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate:</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, and I will do","37":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will yet for this be <span class=\"wl wl-kjv\" data-code=\"H1875\">enquired</span> of by the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it for them; I will <span class=\"wl wl-kjv\" data-code=\"H7235\">increase</span> them with <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> like a flock.","38":"As the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> as the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> in her solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts;</span> so shall the <span class=\"wl wl-kjv\" data-code=\"H2720\">waste</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> be <span class=\"wl wl-kjv\" data-code=\"H4392\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"tot de bergen Israëls,","tekst":"Gelijk boven Eze 6:2 . God spreekt de bergen, dat is het bergachtige land [gelijk vs.6] van Israël aan, tot onderwijs der mensen [om welker zonden wil zij woest lagen en bespot werden] en om te tonen dat de goddeloze beschimpingen van zijn land en volk hem zelven raakten; vergelijk Joe 2:18 , en zie wijders van zulke aanspraken, boven Eze 14:17 ."}],"2":[{"catchword":"vijand van u zegt","tekst":"Zie onder vs.5."},{"catchword":"Heah","tekst":"Zie Job 39:28 , en Psa 35:21 , en vergelijk boven Eze 25:3 , en Eze 26:2 ."},{"catchword":"eeuwige hoogten","tekst":"Hebreeuws, hoogten der eeuwigheid; dat is, oude vermaarde bergen, idem, vaste, durige, enz. Vergelijk Deu 33:15 ; Hab 3:6 , met de aantekening. Men zou dit anders ook kunnen duiden op den berg Sion en Moria, waar Davids slot en de tempel geweest waren. Vergelijk Psa 78:69 , en boven Eze 35:10 . Aldus zou dit een goddeloze roem zijn over God en de verstoring van zijn heiligdom, genoemd God eeuwige woonstede, als zijnde nu in der vijanden macht en bezit vervallen. In het volgende, zijn, Hebreeuws, is, versta, elkeen derzelver hoogten."}],"3":[{"catchword":"u van rondom verwoest","tekst":"Gij bergen van Israël, omsingeld van Ammonieten, Moabieten, Edomieten, Filistijnen, Tyriërs, Sidoniërs, Syriërs, enz."},{"catchword":"opgeslokt heeft,","tekst":"Vergelijk Psa 56:2 ."},{"catchword":"opdat gij","tekst":"Of, zodat gij geworden zijt, enz."},{"catchword":"overblijfsel der heidenen","tekst":"De anderen, de rest, die van de algemene verwoestingen overig zijn, of zouden mogen overblijven; alzo vs.4,5; vergelijk ook vs.36."},{"catchword":"gebracht zijt","tekst":"Hebreeuws, opgebracht."},{"catchword":"klapachtige lip","tekst":"Hebreeuws, lip der tong; dat is, alsof men zeide, tongachtige lip, dat is klachtige, kakelachtige lip; zulks dat een ieder den mond van u vol heeft en bespottelijk van u spreekt, bijspreuken van u maakt."}],"5":[{"catchword":"Zo Ik niet","tekst":"Zie boven Eze 34:8 , met de aantekening en vervul deze rede uit vs.7."},{"catchword":"in het vuur Mijns ijvers","tekst":"Of, in mijn vurigen ijver; te weten voor mijn land en volk; en tegen mijne en hunne vijanden. Vergelijk boven vs.1, en onder vs.6; boven Eze 5:13 ; Deu 4:24 , met de aantekening."},{"catchword":"Mijn land","tekst":"Kanaän; zie Psa 68:10 ; Hos 9:3 ; alzo onder vs.20."},{"catchword":"zichzelven","tekst":"Zie boven Eze 35:10 ."},{"catchword":"begerige plundering,","tekst":"Hebreeuws, plundering, of versmading der ziel; dat is, verachtende of plunderende mijn volk en land met een innerlijken lust en vurige genegenheid of begeerte, zonder enig medelijden. Zie Psa 27:12 ."},{"catchword":"landerij","tekst":"Het Hebreeuwse woord betekent voorsteden, landen, of velden, vrije levendige ruimten, plaatsen voor, of buiten en omtrent de steden, of andere gebouwen gelegen, hoeven, uithoven, erven, enz.; omdat zij daarvan afgezonderd zijn, waarop het oorspronkelijke Hebreeuwse woord ziet, betekenende ook anderszins uitwerping, uitdrijving, waarom anderen dit aldus overzetten: Om hetzelve [land] ten roof uit te zetten. Hebreeuws, om, of opdat, deszelfs landerij, of uitzetting, uitwerping, ten roof [zou zijn]."},{"catchword":"daarvan ten rove zou zijn","tekst":"Van mijn land Kanaän."}],"6":[{"catchword":"smaad der heidenen","tekst":"Gelijk boven Eze 34:29 , en onder vs.15."}],"7":[{"catchword":"Mijn hand opgeheven;","tekst":"Dat is, bij mijzelven gezworen; gelijk mensen bij God zweren met opheffing of opsteking der hand. Zie Gen 14:22 ."}],"8":[{"catchword":"uw takken geven,","tekst":"Dat is, weder groenen en vruchtbaar worden."},{"catchword":"zij naderen te komen","tekst":"De Israëlieten zullen haast wederkomen uit de gevangenschap; waarop het voornaamste zal volgen, de verlossing en oprichting der algemene kerk door den Messias."}],"9":[{"catchword":"u,","tekst":"O gij bergen van Israël, om u te redden en goed te doen. Anders: Ik [wil] aan u. Welke manier van spreken hier niet [gelijk elders, zie Jer 21:13 , en boven Eze 13:8 ] in het kwade, of vijandelijk, maar in het goede en vriendelijk moest genomen worden; gelijk men ook wel somtijds doet in onze taal, wanneer men vijandelijk aan iemand wil, of ook ten beste, om iemand of iets te redden, enz."},{"catchword":"aanzien,","tekst":"Of, mijn aangezicht tot u wenden, of keren; dat is, mij uwer genadiglijk aannemen, zendende u den Messias, op wiens komst en weldaden aan zijne kerk deze profetie meest ziet, gelijk in het vervolg blijkt."}],"10":[{"catchword":"mensen op u vermenigvuldigen,","tekst":"Hebreeuws, mens, en zo in vs.11, mens en beest. Vergelijk onder vs.37,38; Jer 31:27 , met de aantekening."},{"catchword":"ganse huis Israëls,","tekst":"Mijn ganse kerk, het gehele lichaam, onder een hoofd, den Messias; zie Eph 2:12-13 , Eph 2:19-22 ; Col 2:19 , en vergelijk onder Eze 37:16-17 , Eze 37:19 , Eze 37:24 , enz."}],"11":[{"catchword":"zal het beter maken","tekst":"Daarom wordt het nieuwe verbond een beter verbond, en de tijd van den Messias tijden der verbetering, of herstelling genoemd, Heb 8:6 , en Heb 9:10 , enz."}],"12":[{"catchword":"voortaan niet meer beroven","tekst":"Hebreeuws, niet toedoen haar meer, of voortaan te beroven; te weten van alles wat hun lief is, kinderen, mensen in het algemeen, landvruchten, enz.; zie Jer 15:7 ; alzo onder vs.13-15. De zin is, dat het land niet meer alzo zou gesteld zijn als tevoren, toen de mensen door krijg, honger en pestilentie daarin ve bout:"}],"5":[{"catchword":null,"tekst":"Therefore thus saith the Lord LORD; if I have not spoken in the fire of my zeal [or in my zealous zeal; to wit, for my land and people, and against mine and their enemies. Compare above on verse 1 and below verse 6 and above chapter 5.13. Deut. 4.24. with the Annotat.] Against the remains of the heathen, and against all Edo, which have given my land [Canaan See Psalms 68 on verse 10. Hos. 9 on verse 3. So below verse 20] unto themselves for an inheritance, [see above chap. 35.10.] with the joy of all (their) heart, with desirable plundering, [Heb. Plundering, or contempt of the foul; that is, despise or plundering my people and land with an inward delight and servant affection or desire, without any pity or compassion at all. See Psalms 27 on verse 12.] That the countrey thereof [of my land of Canaan] might be for a prey. [The Hebrew word rendered here countrey, signifieth suburbs, lands or fields, near empty ruinous places, lying before, without and about cities or other buildings: farmers, out-gardens inheritance, c. because they are separated therefrom: whereunto the original Hebrew word hath respect, which otherwise sinifieth casting out, driving out: wherefore others render these words thus; to set out the same land (land) for a prey. Heb. That the countrey, or setting out, casting out (might be) for a prey. See of this abrupt sentence usual in oaths, above chap. 34.8. With the Annotat. And fill up the sense from verse 7."}],"6":[{"catchword":null,"tekst":"Therefore prophesie concerning the land of Israel, and say unto the mountains and to the hills, to the streams, and to the valleys, thus saith the Lord LORD; behold, I have spoken in my zeal, and in y fury, because ye have born the reproach of the heathen: [As above chap. 34.29 and below verse 15.]"}],"7":[{"catchword":null,"tekst":"Therefore thus saith the Lord LORD; I have lifted up mine hand, [That is, sworn by my self: as men swear by God by lifting up, or putting  (part) of you: and I will cause you to walk in my statutes, and to keep my judgement, and to do (them)"}],"28":[{"catchword":null,"tekst":"And ye shall dwell in the land but I give to your fathers, and ye shall be a people unto me, [see Deut. 7 on verse 6] and I will be a God unto you. [See Gen. 17 on verse 7.]"}],"29":[{"catchword":null,"tekst":"And I will deliver you from all your uncleannesses, and I will call for the corn, [by my powerful working send all manner of blessings, which is elsewhere called God&acirc;&euro;&trade;s commanding, (see Levet. 25 on verse 21.) as the Lord is also said to call for the plagues. See Psa 105:16. Jerem. 25.29 With the Annotat. By these corporal blessings for the most part (as elsewhere) spiritual blessings are represented yet so as that Godliness hath also the promise of the life that now is (see Joel 2 on verse 23 and 1 Tim. 4.8) but without excluding the conflict and cross. (see Psalms 37 on verse 1) whereof below chap. 38] and will multiply it, and I will lay no famine upon you."}],"30":[{"catchword":null,"tekst":"And I will multiply the fruit of the trees, and the increase of the field, that ye may receive no more the reproach of famine among the heathen."}],"31":[{"catchword":null,"tekst":"Then shall ye remember your wicked waies, and your dealing that were not good: [see above chap. 6.9. with the Annotat] and you shall loathe your selves [Heb. Your faces, as above chap. 6.9.] for your iniquities; and for your abominations."}],"32":[{"catchword":null,"tekst":"I do it not for your sakes, [Ye have not deserved it in the least: but I do it out of free grace, for the honour of my holy name] saith the Lord LORD, beit known unto you: be ashamed, and blush for your (own) waies, ye house of Israel. [God will earnestly have them to know this and to confess it with a humble and dejected confession and acknowledgement of their own unworthiness]"}],"33":[{"catchword":null,"tekst":"Thus saith the Lord LORD, in the day when I shall cleanse you from all your iniquities, then will I cause the cities to be inhabited, [plant them with inhabitants] and the solitary places shall be builded."}],"34":[{"catchword":null,"tekst":"And the desolate land shall be tilled, in stead that it was a desolation before the eyes of everyone that passed by."}],"35":[{"catchword":null,"tekst":"And they shall say, this land that was desolate is become like the garden of Eden: [that is, garden of pleasure. Compare above chap. 28.13. With the Annotat.] And the solitary and the desolate and destroyed cities are strong and inhabited."}],"36":[{"catchword":null,"tekst":"Then shall the heathen that shall be left in the places round about you, know that I am the LORD build the destroyed places, (and) plant that that was desolate: [Or, have builded, planted the destroyed (cities)] I the LORD have spoken it, and will do it."}],"37":[{"catchword":null,"tekst":"Thus saith the Lord LORD; moreover, I will for this be sought of the house of Israel, to perform it unto them: I will multiply them with men like sheep. [Or, as (with) flocks of men. Or, I will suffer my self to be sought, or enquired of, &c. that is, willingly yield to this, suffer myself to be found in it. (Compare Isa. 65.1.) that (in regard the grace is plentiful and exceeding ample and spacious, so that these seemeth to want but men to enjoy it) I may adde yet this mercy thereunto, that I may fill up my church with believing men, like sheep, both of Jews, and chiefly of Gentiles. Compare Job 10:16. Cant. 8.8, c. Isa. 49.19, 20 and 54.2, c and above verse 10.]"}],"38":[{"catchword":null,"tekst":"As the halloweth sheep, as the sheep of Jerusalem on her appointed feasts: [Heb, sheep of holiness. Meaning the cattel for sacrifice, that in great multitudes were brought into Jerusalem against the yearly feasts for sacrifice] so shall the cities be full of flocks of men: and they shall know that I am the LORD."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
