van die maand, dat er mannen uit de oudsten van Israël kwamen, om de HEERE te vragen; en zij gingen voor mijn aangezicht zitten.","2":"Toen kwam het woord van de HEERE tot mij en Hij zei:","3":"Mensenkind, spreek tot de oudsten van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Komt u om Mij te vragen? *Zo waarachtig als* Ik leef, zo Ik door u gevraagd word, spreekt de Heere HEERE!","4":"Zou u hun recht geven, zou u hun recht geven, o mensenkind? Maak hun de gruwelen van hun vaderen bekend;","5":"En zeg tegen hen: Zo zegt de Heere HEERE: Op de dag dat Ik Israël verkoos, hief Ik Mijn hand op tot het nageslacht van het huis van Jakob, en maakte Mijzelf hun in Egypteland bekend; ja, Ik hief Mijn hand tot hen op en zei: Ik ben de HEERE, uw God.","6":"Op diezelfde dag hief Ik Mijn hand tot hen op, om hen uit Egypteland uit te leiden, naar een land dat Ik voor hen had uitgezocht, vloeiend van melk en honing, het sieraad van alle landen.","7":"En Ik zei tegen hen: Ieder werpt de verfoeisels van zijn ogen weg; en verontreinigt u niet met de drekgoden[1] van Egypte; Ik, de HEERE, ben uw God.","8":"Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.","9":"Doch Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, in wier midden zij waren; aan wie Ik Mij, voor hun ogen, bekend heb gemaakt, door hen uit Egypteland uit te leiden.","10":"En Ik leidde hen uit Egypteland, en bracht hen in de woestijn.","11":"Daar gaf Ik hun Mijn inzettingen, en maakte hun Mijn rechten bekend, die, als een mens ze doet, hij daardoor zal leven.","12":"Daarbij gaf Ik hun ook Mijn sabbatten, om een teken te zijn tussen Mij en hen, opdat zij zouden weten dat Ik de HEERE ben, Die hen heiligt.","13":"Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.","14":"Maar Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, voor wier ogen Ik hen uitleidde.","15":"Toch hief Ik ook Mijn hand op tot hen in de woestijn, dat Ik hen niet zou brengen in het land dat Ik hun had gegeven, vloeiend van melk en honing, het sieraad van alle landen;","16":"Omdat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart ging hun drekgoden achterna.","17":"Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.","18":"Maar Ik zei tegen hun kinderen in de woestijn: Wandelt niet in de inzettingen van uw vaderen, en onderhoudt hun rechten niet, en verontreinigt u niet met hun drekgoden.","19":"Ik ben de HEERE, uw God; wandelt in Mijn inzettingen, en onderhoudt Mijn rechten, en doet ze.","20":"En heiligt Mijn sabbatten, en zij zullen tot een teken zijn tussen Mij en u, opdat u weet dat Ik, de HEERE, uw God ben.","21":"Maar die kinderen waren *ook* opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.","22":"Doch Ik trok Mijn hand terug, en deed het om Mijn Naam, opdat die voor de ogen van de heidenvolken niet ontheiligd zou worden, voor wier ogen Ik hen had uitgeleid.","23":"Ik hief ook Mijn hand tot hen op in de woestijn, dat Ik hen zou verspreiden onder de heidenvolken, en hen zou verstrooien in de landen;","24":"Omdat zij Mijn rechten niet gedaan hadden, maar Mijn inzettingen verworpen en Mijn sabbatten ontheiligd hadden, en hun ogen achter de drekgoden van hun vaderen aan gingen.","25":"Daarom gaf Ik hun ook bepalingen die niet goed waren, en rechten waardoor zij niet zouden leven.","26":"En Ik verontreinigde hen in hun eigen giften, doordat zij door het vuur lieten doorgaan al wat de baarmoeder opent; opdat Ik hen zou verwoesten, met als doel dat zij zouden weten dat Ik de HEERE ben.","27":"Daarom, mensenkind, spreek tot het huis van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Hiermee nog hebben uw vaderen Mij gesmaad, dat zij door overtreding tegen Mij hebben overtreden.","28":"Toen Ik hen in het land had gebracht, waarover Ik Mijn hand had opgeheven om het hun te geven, zagen zij naar elke hoge heuvel en elke dichtbeboste boom, en offerden daar hun offers, en zij brachten daar hun tergende offergaven, en daar zetten zij hun liefelijke reuk neer, en daar goten zij hun drankoffers uit.","29":"En Ik zei tegen hen: Wat is die hoogte, waarheen u gaat? Toch wordt de naam daarvan tot op deze dag hoogte genoemd.","30":"Daarom, zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Bent u verontreinigd geraakt op de weg van uw vaderen, en pleegt u hoererij achter hun verfoeisels aan?","31":"Ja, met het offeren van uw gaven, met het door het vuur laten doorgaan van uw kinderen, bent u verontreinigd met al uw drekgoden tot op deze dag toe; en zou Ik door u gevraagd worden, o huis van Israël? *Zo waarachtig als* Ik leef, spreekt de Heere HEERE, zo Ik door u gevraagd word!","32":"Daarom, wat in uw geest is opgekomen, zal geenszins gebeuren, namelijk dat u zegt: Wij zullen zijn als de heidenvolken en als de geslachten van de landen, dienend hout en steen.","33":"*Zo waarachtig als* Ik leef, spreekt de Heere HEERE: Voorzeker zal Ik met een sterke hand, en een uitgestrekte arm, en met een uitgegoten grimmigheid over u regeren!","34":"Want Ik zal u uit de volken leiden, en u verzamelen uit de landen waarin u verstrooid bent, door een sterke hand, en door een uitgestrekte arm, en door een uitgegoten grimmigheid.","35":"Daartoe zal Ik u brengen in de woestijn van de volken, en Ik zal daar met u rechtspreken, van aangezicht tot aangezicht;","36":"Zoals Ik gerecht heb met uw vaderen in de woestijn van Egypteland, zo zal Ik met u rechtspreken, spreekt de Heere HEERE.","37":"En Ik zal u onder de roede laten doorgaan, en Ik zal u brengen onder de band van het verbond.","38":"Daartoe zal Ik hen die opstandig zijn, en die tegen Mij overtreden, uit u uitzuiveren; Ik zal hen uit het land van hun vreemdelingschap uitleiden[2], en zij zullen in het land van Israël niet *terug*komen, en u zult weten dat Ik de HEERE ben.","39":"En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.","40":"Want op Mijn heilige berg, op de hoge berg van Israël, spreekt de Heere HEERE, daar zal Mij het hele huis van Israël in het land dienen, zij allen; daar zal Ik welgevallen aan hen hebben, en daar zal Ik uw hefoffers eisen, en de eerstelingen van uw heffingen met al uw geheiligde dingen.","41":"Ik zal een welgevallen aan u hebben om de liefelijke reuk, wanneer Ik u van de volken uitleid, en u zal verzamelen uit de landen waarin u verstrooid bent geweest, en Ik zal in u geheiligd worden voor de ogen van de heidenvolken.","42":"En u zult weten dat Ik de HEERE ben, wanneer Ik u in het land van Israël gebracht zal hebben, in het land waarover Ik Mijn hand heb opgeheven om het aan uw vaderen te geven.","43":"Daar zult u dan denken aan uw wegen, en aan al uw handelingen waarmee u zich verontreinigd hebt, en u zult van uzelf een afkeer hebben over al uw slechte daden die u gedaan hebt.","44":"Zo zult u weten dat Ik de HEERE ben, wanneer Ik met u gedaan zal hebben om Mijn Naam, niet naar uw slechte wegen, noch naar uw verdorven handelingen, o huis van Israël, spreekt de Heere HEERE.","45":"Verder kwam het woord van de HEERE tot mij en Hij zei:","46":"Mensenkind, richt uw aangezicht naar de weg van het zuiden, en druppel tegen het zuiden; en profeteer tegen het woud van het veld *in* het zuiden.","47":"En zeg tegen het zuiderwoud: Hoor het woord van de HEERE: Zo zegt de Heere HEERE: Zie, Ik zal een vuur in u aansteken, dat in u elke groene boom en elke dorre boom zal verteren; de vlammende vlam zal niet uitgeblust worden, maar daardoor zullen alle aangezichten verbrand worden, van het zuiden tot het noorden toe.","48":"En alle vlees zal zien dat Ik, de HEERE, dat heb aangestoken; het zal niet uitgeblust worden.","49":"En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?"},"SV":{"1":"En het geschiedde in het zevende jaar, in de vijfde *maand*, op den tienden derzelver maand, dat er mannen uit de oudsten van Israël kwamen, om den HEERE te vragen; en zij zaten neder voor mijn aangezicht.","2":"Toen geschiedde des HEEREN woord tot mij, zeggende:","3":"Mensenkind, spreek tot de oudsten van Israël, en zeg tot hen: Alzo zegt de Heere HEERE: Komt gij, om Mij te vragen? *Zo* *waarachtig* *als* Ik leef, zo Ik van u gevraagd worde, spreekt de Heere HEERE.","4":"Zoudt gij hun recht geven, zoudt gij hun recht geven, o mensenkind? Maak hun de gruwelen hunner vaderen bekend;","5":"En zeg tot hen: Alzo zegt de Heere HEERE: Ten dage als Ik Israël verkoos, zo hief Ik Mijn hand op tot het zaad van het huis Jakobs, en maakte Mijzelven hun in Egypteland bekend; ja, Ik hief Mijn hand tot hen op, zeggende: Ik ben de HEERE, uw God.","6":"Ten zelven dage hief Ik Mijn hand tot hen op, dat Ik hen uit Egypteland uitvoeren zou, in een land, dat Ik voor hen uitgespeurd had, vloeiende van melk en honig, hetwelk het sieraad is van alle landen.","7":"En Ik zeide tot hen: Een ieder werpe de verfoeiselen zijner ogen weg; en verontreinigt ulieden niet met de drekgoden van Egypte; Ik, de HEERE, ben uw God.","8":"Maar zij waren wederspannig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeiselen zijner ogen weg, noch verliet de drekgoden van Egypte; daarom zeide Ik, dat Ik Mijn grimmigheid over hen uitgieten zou, om Mijn toorn tegen hen te volbrengen in het midden van Egypteland.","9":"Doch Ik deed het om Mijns Naams wil, opdat hij niet ontheiligd wierde voor de ogen der heidenen, in welker midden zij waren; aan welke Ik Mij, voor derzelver ogen, bekend gemaakt heb, om hen uit Egypteland uit te voeren.","10":"En Ik voerde hen uit Egypteland, en bracht hen in de woestijn.","11":"Daar gaf Ik hun Mijn inzettingen, en maakte hun Mijn rechten bekend, dewelke, zo ze een mens doet, zal *hij* door dezelve leven.","12":"Daartoe ook gaf Ik hun Mijn sabbatten, om een teken te zijn tussen Mij en tussen hen, opdat zij zouden weten, dat Ik de HEERE ben, Die hen heilige.","13":"Maar het huis Israëls werd wederspannig tegen Mij in de woestijn; zij wandelden in Mijn inzettingen niet, en verwierpen Mijn rechten; dewelke, zo ze een mens doet, zal *hij* door dezelve leven; en zij ontheiligden Mijn sabbatten zeer, dat Ik zeide, Mijn grimmigheid te zullen uitgieten over hen in de woestijn, om hen te verdoen.","14":"Maar Ik deed het om Mijns Naams wil, opdat die niet ontheiligd werd voor de ogen van die heidenen, voor welker ogen Ik hen uitvoerde.","15":"Evenwel hief Ik ook Mijn hand op tot hen in de woestijn, dat Ik hen niet zou brengen in het land, dat Ik *hun* gegeven had, vloeiende van melk en honig, hetwelk het sieraad is van alle landen;","16":"Daarom dat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart wandelde hun drekgoden na.","17":"Doch Mijn oog verschoonde hen, dat Ik hen niet verdierf, en geen voleinding met hen maakte in de woestijn.","18":"Maar Ik zeide tot hun kinderen in de woestijn: Wandelt niet in de inzettingen uwer vaderen, en onderhoudt hun rechten niet, en verontreinigt u niet met hun drekgoden.","19":"Ik ben de HEERE, uw God, wandelt in Mijn inzettingen, en onderhoudt Mijn rechten, en doet dezelve.","20":"En heiligt Mijn sabbatten, en zij zullen tot een teken zijn tussen Mij en tussen ulieden, opdat gij weet, dat Ik, de HEERE, uw God ben.","21":"Maar die kinderen waren *ook* wederspannig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet waar, om die te doen; dewelke, zo ze een mens doet, zal *hij* door dezelve leven; zij ontheiligden Mijn sabbatten, dat Ik zeide, Mijn grimmigheid te zullen uitgieten over hen, volbrengende Mijn toorn tegen hen in de woestijn.","22":"Doch Ik keerde Mijn hand af, en deed het om Mijns Naams wil, opdat hij voor de ogen der heidenen niet zou ontheiligd worden, voor welker ogen Ik hen uitgevoerd had.","23":"Ik hief ook Mijn hand tot hen op in de woestijn, dat Ik hen verspreiden zou onder de heidenen, en hen verstrooien in de landen;","24":"Omdat zij Mijn rechten niet gedaan hadden, maar Mijn inzettingen verworpen en Mijn sabbatten ontheiligd hadden, en hun ogen achter de drekgoden hunner vaderen waren.","25":"Daarom gaf Ik hun ook besluitingen, die niet goed waren, en rechten, waarbij zij niet leven zouden.","26":"En Ik verontreinigde hen in hun giften, omdat zij *door* *het* *vuur* deden doorgaan al wat de baarmoeder opent; opdat Ik ze verwoesten zou, ten einde dat zij zouden weten, dat Ik de HEERE ben.","27":"Daarom, mensenkind, spreek tot het huis Israëls, en zeg tot hen: Alzo zegt de Heere HEERE: Hiermede nog hebben Mij uw vaderen gesmaad, dat zij door overtreding tegen Mij overtreden hebben.","28":"Als Ik hen in het land gebracht had, over hetwelk Ik Mijn hand opgeheven had, om hetzelve hun te geven, zo zagen zij naar allen hogen heuvel en alle dicht geboomte, en offerden daar hun offeren, en zij gaven daar hun tergende offeranden, en daar zetten zij hun liefelijken reuk, en daar offerden zij hun drankofferen.","29":"En Ik zeide tot hen: Wat is die hoogte, waarhenen gij gaat? Nochtans is de naam daarvan genoemd hoogte, tot op dezen dag toe.","30":"Daarom zeg tot het huis Israëls: Alzo zegt de Heere HEERE: Zijt gij verontreinigd geworden in den weg uwer vaderen, en hoereert gij achter hun verfoeiselen?","31":"Ja, met het offeren uwer gaven, met uw kinderen door het vuur te doen doorgaan, zijt gij verontreinigd aan al uw drekgoden tot op dezen dag toe; en zou Ik van u gevraagd worden, o huis Israëls? *Zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zo Ik van u gevraagd worde!","32":"Daarom, dat in uw geest opgeklommen is, zal geenszins geschieden, dat gij zegt: Wij zullen als de heidenen en als de geslachten der landen zijn, dienende hout en steen.","33":"*Zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE: Zo Ik niet met een sterke hand, en uitgestrekten arm, en met een uitgegoten grimmigheid over u zal regeren!","34":"Want Ik zal u uit de volken voeren, en u vergaderen uit de landen, waarin gij verstrooid zijt, door een sterke hand, en door een uitgestrekten arm, en door een uitgegoten grimmigheid.","35":"Daartoe zal Ik u brengen in de woestijn der volken, en Ik zal met u aldaar rechten, aangezicht aan aangezicht;","36":"Gelijk als Ik gerecht heb met uw vaderen in de woestijn van Egypteland, alzo zal Ik met u rechten, spreekt de Heere HEERE.","37":"En Ik zal ulieden onder de roede doen doorgaan, en Ik zal u brengen onder den band des verbonds.","38":"Daartoe zal Ik, die rebel zijn, en die tegen Mij overtreden, uit ulieden uitzuiveren; Ik zal hen uit het land hunner vreemdelingschappen uitvoeren, en zij zullen in het landschap Israëls niet *weder* komen, en gij zult weten, dat Ik de HEERE ben.","39":"En gijlieden, o huis Israëls, alzo zegt de Heere HEERE: Gaat henen, dient een ieder zijn drekgoden, ook hierna, dewijl gijlieden naar Mij niet hoort; doch ontheiligt niet meer Mijn heiligen Naam, met uw giften en met uw drekgoden.","40":"Want op Mijn heiligen berg, op den hogen berg Israëls, spreekt de Heere HEERE, daar zal Mij het ganse huis Israëls in het land dienen, zij allen; daar zal Ik welgevallen aan hen nemen, en daar zal Ik uw hefofferen eisen, en de eerstelingen uwer heffingen met al uw geheiligde dingen.","41":"Ik zal een welgevallen aan ulieden nemen om den liefelijken reuk, wanneer Ik u van de volken uitvoeren, en u vergaderen zal uit de landen, in dewelke gij zult verstrooid zijn, en Ik zal in u geheiligd worden voor de ogen der heidenen.","42":"En gij zult weten, dat Ik de HEERE ben, als Ik u in het landschap Israëls gebracht zal hebben, in het land, waarover Ik Mijn hand opgeheven heb, om hetzelve uw vaderen te geven.","43":"Daar zult gij dan gedenken aan uw wegen, en aan al uw handelingen waarmede gij u verontreinigd hebt, en gij zult van u zelven een walging hebben over al uw boosheden, die gij gedaan hebt.","44":"Zo zult gij weten, dat Ik de HEERE ben, als Ik met u gedaan zal hebben, om Mijns Naams wil, niet naar uw boze wegen, noch naar uw verdorven handelingen, o huis Israëls, spreekt de Heere HEERE.","45":"Verder geschiedde des HEEREN woord tot mij, zeggende:","46":"Mensenkind, zet uw aangezicht naar den weg van het zuiden, en drup tegen het zuiden; en profeteer tegen het woud van het veld *in* *het* zuiden.","47":"En zeg tot het zuiderwoud: Hoor des HEEREN woord: Alzo zegt de Heere HEERE: Ziet, Ik zal een vuur in u aansteken, hetwelk in u allen groenen boom en allen dorren boom verteren zal; de vlammende vlam zal niet uitgeblust worden, maar daardoor zullen verbrand worden alle aangezichten van het zuiden tot het noorden toe.","48":"En alle vlees zal zien, dat Ik, de HEERE, dat aangestoken heb; het zal niet uitgeblust worden.","49":"En ik zeide: Ach, Heere HEERE, zij zeggen van mij: Is hij niet een verdichter van gelijkenissen?"},"KJV":{"1":"And it came to pass in the seventh year, in the fifth *month*, the tenth *day* of the month, *that* certain of the elders of Israel came to enquire of the LORD, and sat before","2":"Then came the word of the LORD unto me, saying,","3":"Son of man, speak unto the elders of Israel, and say unto them, Thus saith the Lord GOD; Are ye come to enquire of me? *As* I live, saith the Lord GOD, I will not be enquired","4":"Wilt thou judge them, son of man, wilt thou judge *them*? cause them to know the abominations of their fathers:","5":"And say unto them, Thus saith the Lord GOD; In the day when I chose Israel, and lifted up mine hand unto the seed of the house of Jacob, and made myself known unto them in the land of Egypt, when I lifted up mine hand unto them, saying, I *am* the LORD your God;","6":"In the day *that* I lifted up mine hand unto them, to bring them forth of the land of Egypt into a land that I had espied for them, flowing with milk and honey, which *is* the glory of all lands:","7":"Then said I unto them, Cast ye away every man the abominations of his eyes, and defile not yourselves with the idols of Egypt: I *am* the LORD your God.","8":"But they rebelled against me, and would not hearken unto me: they did not every man cast away the abominations of their eyes, neither did they forsake the idols of Egypt: then I said, I will pour out my fury upon them, to accomplish my anger against them in the midst of the land of Egypt.","9":"But I wrought for my name's sake, that it should not be polluted before the heathen, among whom they *were*, in whose sight I made myself known unto them, in bringing them forth out of the land of Egypt.","10":"Wherefore I caused them to go forth out of the land of Egypt, and brought them into the wilderness.","11":"And I gave them my statutes, and shewed them my judgments, which *if* a man do, he shall even live","12":"Moreover also I gave them my sabbaths, to be a sign between me and them, that they might know that I *am* the LORD that sanctify","13":"But the house of Israel rebelled against me in the wilderness: they walked not in my statutes, and they despised my judgments, which *if* a man do, he shall even live in them; and my sabbaths they greatly polluted: then I said, I would pour out my fury upon them in the wilderness, to consume","14":"But I wrought for my name's sake, that it should not be polluted before the heathen, in whose sight I brought them out.","15":"Yet also I lifted up my hand unto them in the wilderness, that I would not bring them into the land which I had given *them*, flowing with milk and honey, which *is* the glory of all lands;","16":"Because they despised my judgments, and walked not in my statutes, but polluted my sabbaths: for their heart went after their idols.","17":"Nevertheless mine eye spared them from destroying them, neither did I make an end of them in the wilderness.","18":"But I said unto their children in the wilderness, Walk ye not in the statutes of your fathers, neither observe their judgments, nor defile yourselves with their idols:","19":"I *am* the LORD your God; walk in my statutes, and keep my judgments, and do","20":"And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I *am* the LORD your God.","21":"Notwithstanding the children rebelled against me: they walked not in my statutes, neither kept my judgments to do them, which *if* a man do, he shall even live in them; they polluted my sabbaths: then I said, I would pour out my fury upon them, to accomplish my anger against them in the wilderness.","22":"Nevertheless I withdrew mine hand, and wrought for my name's sake, that it should not be polluted in the sight of the heathen, in whose sight I brought them forth.","23":"I lifted up mine hand unto them also in the wilderness, that I would scatter them among the heathen, and disperse them through the countries;","24":"Because they had not executed my judgments, but had despised my statutes, and had polluted my sabbaths, and their eyes were after their fathers' idols.","25":"Wherefore I gave them also statutes *that were* not good, and judgments whereby they should not live;","26":"And I polluted them in their own gifts, in that they caused to pass through *the fire* all that openeth the womb, that I might make them desolate, to the end that they might know that I *am* the LORD.","27":"Therefore, son of man, speak unto the house of Israel, and say unto them, Thus saith the Lord GOD; Yet in this your fathers have blasphemed me, in that they have committed a trespass","28":"*For* when I had brought them into the land, *for* the which I lifted up mine hand to give it to them, then they saw every high hill, and all the thick trees, and they offered there their sacrifices, and there they presented the provocation of their offering: there also they made their sweet savour, and poured out there their drink offerings.","29":"Then I said unto them, What *is* the high place whereunto ye go? And the name thereof is called Bamah unto this day.","30":"Wherefore say unto the house of Israel, Thus saith the Lord GOD; Are ye polluted after the manner of your fathers? and commit ye whoredom after their abominations?","31":"For when ye offer your gifts, when ye make your sons to pass through the fire, ye pollute yourselves with all your idols, even unto this day: and shall I be enquired of by you, O house of Israel? *As* I live, saith the Lord GOD, I will not be enquired","32":"And that which cometh into your mind shall not be at all, that ye say, We will be as the heathen, as the families of the countries, to serve wood and stone.","33":"*As* I live, saith the Lord GOD, surely with a mighty hand, and with a stretched out arm, and with fury poured out, will I rule","34":"And I will bring you out from the people, and will gather you out of the countries wherein ye are scattered, with a mighty hand, and with a stretched out arm, and with fury poured out.","35":"And I will bring you into the wilderness of the people, and there will I plead with you face to face.","36":"Like as I pleaded with your fathers in the wilderness of the land of Egypt, so will I plead with you, saith the Lord GOD.","37":"And I will cause you to pass under the rod, and I will bring you into the bond of the covenant:","38":"And I will purge out from among you the rebels, and them that transgress against me: I will bring them forth out of the country where they sojourn, and they shall not enter into the land of Israel: and ye shall know that I *am* the LORD.","39":"As for you, O house of Israel, thus saith the Lord GOD; Go ye, serve ye every one his idols, and hereafter *also*, if ye will not hearken unto me: but pollute ye my holy name no more with your gifts, and with your idols.","40":"For in mine holy mountain, in the mountain of the height of Israel, saith the Lord GOD, there shall all the house of Israel, all of them in the land, serve me: there will I accept them, and there will I require your offerings, and the firstfruits of your oblations, with all your holy things.","41":"I will accept you with your sweet savour, when I bring you out from the people, and gather you out of the countries wherein ye have been scattered; and I will be sanctified in you before the heathen.","42":"And ye shall know that I *am* the LORD, when I shall bring you into the land of Israel, into the country *for* the which I lifted up mine hand to give it to your fathers.","43":"And there shall ye remember your ways, and all your doings, wherein ye have been defiled; and ye shall lothe yourselves in your own sight for all your evils that ye have committed.","44":"And ye shall know that I *am* the LORD, when I have wrought with you for my name's sake, not according to your wicked ways, nor according to your corrupt doings, O ye house of Israel, saith the Lord GOD.","45":"Moreover the word of the LORD came unto me, saying,","46":"Son of man, set thy face toward the south, and drop *thy word* toward the south, and prophesy against the forest of the south field;","47":"And say to the forest of the south, Hear the word of the LORD; Thus saith the Lord GOD; Behold, I will kindle a fire in thee, and it shall devour every green tree in thee, and every dry tree: the flaming flame shall not be quenched, and all faces from the south to the north shall be burned","48":"And all flesh shall see that I the LORD have kindled it: it shall not be quenched.","49":"Then said I, Ah Lord GOD! they say of me, Doth he not speak parables?"}},"tsk":{"1":[{"kopje":"in het zevende","refs":["Ezech 1:2","Ezech 8:1","Ezech 24:1","Ezech 26:1","Ezech 29:1","Ezech 29:17","Ezech 30:20","Ezech 31:1","Ezech 32:1","Ezech 40:1"]},{"kopje":"dat er mannen","refs":["Ezech 14:1-3","Ezech 33:30-33","1 Kon 14:2-6","1 Kon 22:15-28","2 Kon 3:13","Jes 29:13","Jes 58:2","Jer 37:17","Matt 22:16"]},{"kopje":"en zij gingen zitten","refs":["Ezech 8:1","Luk 2:46","Luk 8:35","Luk 10:39","Hand 22:3"]}],"3":[{"kopje":"Komt u","refs":["Jes 1:12","Matt 3:7","Luk 3:7"]},{"kopje":"Zo waarachtig als Ik","refs":["Ezech 20:31","Ezech 14:3","Ezech 14:4","Ezech 14:7","Ezech 14:8","1 Sam 28:6","Ps 50:15-21","Spr 15:8","Spr 21:27","Spr 28:9","Jes 1:15","Micha 3:7","Matt 15:8","Matt 15:9","Joh 4:24"]}],"4":[{"kopje":"recht geven","refs":["Ezech 14:14","Ezech 14:20","Ezech 22:2","Ezech 23:36","Ezech 23:45","Jes 5:3","Jer 7:16","Jer 11:14","Jer 14:11-14","Jer 15:1","1 Kor 6:2"]},{"kopje":"Maak bekend","refs":["Ezech 16:2","Ezech 16:3","Matt 23:29-37","Luk 11:47-51","Luk 13:33-35","Hand 7:51","Hand 7:52"]}],"5":[{"kopje":"Op de dag","refs":["Ex 6:5","Ex 6:6","Ex 19:4-6","Deut 4:37","Deut 7:6","Deut 14:2","Ps 33:12","Jes 41:8","Jes 41:9","Jes 43:10","Jes 44:1","Jes 44:2","Jer 33:24","Mark 13:20"]},{"kopje":"hief Ik Mijn hand op","refs":["Ezech 20:6","Ex 6:7","Ex 6:8","Ezech 20:15","Ezech 20:23","Ezech 47:14","Gen 14:22","Deut 32:40","Openb 10:5"]},{"kopje":"en maakte","refs":["Ezech 35:11","Ex 3:8","Ex 4:31","Deut 4:34","Deut 11:2-7","Ps 103:7"]},{"kopje":"Ik ben","refs":["Ex 3:6","Ex 3:16","Ex 20:2","Ex 20:3"]}],"6":[{"kopje":"hief","refs":["Ezech 20:5","Ezech 20:15","Ezech 20:23","Ezech 20:42"]},{"kopje":"uit te leiden","refs":["Gen 15:13","Gen 15:14","Ex 3:8","Ex 3:17","Ex 14:1","Ex 15:27"]}, code=\"H8141\">year,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> month, the <span class=\"wl wl-kjv\" data-code=\"H6218\">tenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> before","2":"Then came the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto me, saying,","3":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Are ye <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of me? As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> I will not be enquired","4":"Wilt thou <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> them, <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> them? cause them to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> of their fathers:","5":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> In the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when I <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and made myself <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> unto them in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> when I <span class=\"wl wl-kjv\" data-code=\"H5375\">lifted</span> up mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God;","6":"In the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto them, to bring them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> into a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that I had <span class=\"wl wl-kjv\" data-code=\"H8446\">espied</span> for them, <span class=\"wl wl-kjv\" data-code=\"H2100\">flowing</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H6643\">glory</span> of all lands:","7":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I unto them, Cast ye <span class=\"wl wl-kjv\" data-code=\"H7993\">away</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abominations</span> of his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> not yourselves with the <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","8":"But they <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against me, and <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me: they did not every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> cast <span class=\"wl wl-kjv\" data-code=\"H7993\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abominations</span> of their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> neither did they <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> then I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> upon them, to <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplish</span> my <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> against them in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","9":"But I <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake, that it should not be <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> whom they were, in whose <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> I made myself <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> unto them, in bringing them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","10":"Wherefore I caused them to go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the wilderness.","11":"And I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">shewed</span> them my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> which if a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> he shall even live","12":"Moreover also I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> to be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> between me and them, that they might <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that sanctify","13":"But the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against me in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> they <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> not in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> which if a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> he shall even <span class=\"wl wl-kjv\" data-code=\"H2425\">live</span> in them; and my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths</span> they <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted:</span> then I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I would pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> upon them in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> to consume","14":"But I <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake, that it should not be <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> in whose <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> I brought them out.","15":"Yet also I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto them in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> that I would not <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them, <span class=\"wl wl-kjv\" data-code=\"H2100\">flowing</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H6643\">glory</span> of all lands;","16":"Because they <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> not in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> but <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths:</span> for their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their idols.","17":"Nevertheless mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> <span class=\"wl wl-kjv\" data-code=\"H2347\">spared</span> them from <span class=\"wl wl-kjv\" data-code=\"H7843\">destroying</span> them, neither did I <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> an <span class=\"wl wl-kjv\" data-code=\"H3617\">end</span> of them in the wilderness.","18":"But I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto their <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Walk</span> ye not in the <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> their <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> yourselves with their idols:","19":"I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and do","20":"And <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths;</span> and they shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> between me and you, that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","21":"Notwithstanding the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against me: they <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> not in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them, which if a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> he shall even <span class=\"wl wl-kjv\" data-code=\"H2425\">live</span> in them; they <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths:</span> then I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I would pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> upon them, to <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplish</span> my <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> against them in the wilderness.","22":"Nevertheless I <span class=\"wl wl-kjv\" data-code=\"H7725\">withdrew</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake, that it should not be <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> in whose <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> I brought them forth.","23":"I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto them also in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> that I would <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> them among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2219\">disperse</span> them through the countries;","24":"Because they had not <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> but had <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and had <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> and their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> were <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> idols.","25":"Wherefore I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them also <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> that were not <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> whereby they should not live;","26":"And I <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> them in their own <span class=\"wl wl-kjv\" data-code=\"H4979\">gifts,</span> in that they caused to pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the fire all that <span class=\"wl wl-kjv\" data-code=\"H6363\">openeth</span> the <span class=\"wl wl-kjv\" data-code=\"H7356\">womb,</span> that I might make them <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> to the end that they might <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","27":"Therefore, <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Yet in this your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H1442\">blasphemed</span> me, in that they have <span class=\"wl wl-kjv\" data-code=\"H4603\">committed</span> a trespass","28":"For when I had <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> for the which I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it to them, then they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> every <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> <span class=\"wl wl-kjv\" data-code=\"H1389\">hill,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5687\">thick</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> there their <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices,</span> and there they <span class=\"wl wl-kjv\" data-code=\"H5414\">presented</span> the <span class=\"wl wl-kjv\" data-code=\"H3708\">provocation</span> of their <span class=\"wl wl-kjv\" data-code=\"H7133\">offering:</span> there also they <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour,</span> and poured <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> there their drink offerings.","29":"Then I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, What is the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> whereunto ye <span class=\"wl wl-kjv\" data-code=\"H935\">go?</span> And the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> thereof is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1117\">Bamah</span> unto this day.","30":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Are ye <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> after the <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers?</span> and commit ye <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their abominations?","31":"For when ye <span class=\"wl wl-kjv\" data-code=\"H5375\">offer</span> your <span class=\"wl wl-kjv\" data-code=\"H4979\">gifts,</span> when ye make your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> to pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> ye <span class=\"wl wl-kjv\" data-code=\"H2930\">pollute</span> yourselves with all your <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> even unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and shall I be <span class=\"wl wl-kjv\" data-code=\"H1875\">enquired</span> of by you, O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> I will not be enquired","32":"And that which <span class=\"wl wl-kjv\" data-code=\"H5927\">cometh</span> into your <span class=\"wl wl-kjv\" data-code=\"H7307\">mind</span> shall not be at all, that ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We will <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> as the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> and stone.","33":"As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> surely with a <span class=  wl-kjv\" data-code=\"H6086\">tree:</span> the <span class=\"wl wl-kjv\" data-code=\"H3852\">flaming</span> <span class=\"wl wl-kjv\" data-code=\"H7957\">flame</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H3518\">quenched,</span> and all <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> from the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> to the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall be burned","48":"And all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1197\">kindled</span> it: it shall not be quenched.","49":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, <span class=\"wl wl-kjv\" data-code=\"H162\">Ah</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD!</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> of me, Doth he not <span class=\"wl wl-kjv\" data-code=\"H4911\">speak</span> parables?"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het geschiedde in het zevende jaar,","tekst":"Te weten na de wegvoering van Jojachin; vergelijk boven Eze 1:2 , en Eze 8:1 ."},{"catchword":"vijfde maand,","tekst":"Zie van deze maand Num 33:38 ."},{"catchword":"oudsten van Israël kwamen,","tekst":"Zie boven Eze 8:1 ."},{"catchword":"te vragen;","tekst":"Te weten welke uitkomst het Joodse volk uit al zijne ellenden zou hebben, zowel in Jeruzalem en Judea als daar in het land van Babylonië; en wat hun te doen stond om de straffen, waarmede gedreigd werd, te ontgaan; hoe de Heere gevraagd werd, zie boven Eze 14:3 ."}],"3":[{"catchword":"Zo waarachtig als Ik leef,","tekst":"Dat is, Ik wil van u niet gevraagd zijn. Zie van deze eedzwering, Num 14:23 ."}],"4":[{"catchword":"recht geven,","tekst":"Hebreeuws, oordelen; dat is hier voorspreken, ontschuldigen, verdedigen, verantwoorden, verweren. Alzo onder Eze 22:2 , en Eze 23:36 ; vergelijk de aantekening Gen 15:14 , over het woord richten; anders: zult gij hen [niet] oordelen, of richten? enz. dat is, oordelende bestraffen, gelijk volgt."},{"catchword":"zoudt gij hun recht geven,","tekst":"Hij verdubbelt de rede, om die te meer kracht te geven, en wil zeggen, dat hij hen geenszins moest voorspreken of verdedigen; vergelijk Num 17:12 ; Jdg 5:12 , Jdg 5:27 ."},{"catchword":"gruwelen hunner vaderen bekend;","tekst":"Te weten die zij met hunne vaderen gemeen hebben; opdat zij verzinnen hoe diep zij in hunne boosheid steken en hoe lang Ik hen daarin verdragen heb."}],"5":[{"catchword":"verkoos,","tekst":"Dat is, verklaarde verkoren te hebben uit alle volken en natiën der aarde, opdat het mij tot een heilig volk zou zijn. Vergelijk Deu 4:37 , en Deu 7:6 , en Deu 14:2 , en Deu 26:18 ."},{"catchword":"hief Ik Mijn hand op","tekst":"Dat is, beloofde met ede dat voor mijn volk te houden, Gen 22:16 ; Exo 6:7 . De hand opheffen voor zweren. Het is menselijkerwijze van God gesproken. Zie Gen 14:22 ."},{"catchword":"zaad van het huis Jakobs,","tekst":"Dat is, nakomelingen. Zie Gen 9:9 ."},{"catchword":"bekend;","tekst":"Te weten door Mozes en Aäron. Zie Exo 3 ,Exo 4 , enz."}],"6":[{"catchword":"vloeiende van melk en honig,","tekst":"Zie Exo 3:8 ."},{"catchword":"hetwelk het sieraad is van alle landen","tekst":"Alzo onder vs.15, en Eze 26:20 . Zie ook van de heerlijkheid van het land Kanaän, Deu 8:7 , en Deu 32:13 ; Psa 106:24 ."}],"7":[{"catchword":"de verfoeiselen zijner ogen weg;","tekst":"Zo noemt God de beelden en al hun goddeloos tuig, omdat zij verfoeilijk voor hem zijn, en voor alle mensen zijn moeten, waarop nochtans de Israëlieten met vermaking hunne ogen sloegen. Zie 1Ki 11:5 ; 2Ch 15:8 ."},{"catchword":"verontreinigt ulieden niet","tekst":"Hetwelk geschiedt met die ter afgoderij op te richten, en hun godsdienstige eer inwendiglijk of uitwendiglijk te bewijzen. Alzo onder vs.30,31, en Eze 23:7 , en Eze 36:25 . Afgoderij is geestelijke onreinheid. Vergelijk Gen 35:2 , en 2Ch 29:16 , enz. Hierom wordt zij ook hoererij, of overspel genaamd. Zie Lev 17:7 ."},{"catchword":"de drekgoden van Egypte;","tekst":"Die zeer gruwelijk en belachelijk waren, gelijk de kalven, krokodillen, apen, de ibis, welken men schrijft in Egypte een vogel te zijn als een ooievaar, die de slangen opeet, enz."}],"8":[{"catchword":"niemand wierp de verfoeiselen zijner ogen weg,","tekst":"Hebreeuws, een ieder verwierpen de verfoelselen van hunne ogen niet; of en wierpen hen niet weg; alzo in de volgende woorden; dat is, niemand, of geen van hen, welverstaande van het merendeel. Zie 1Ki 11:34 ."},{"catchword":"Mijn grimmigheid","tekst":"Zie Psa 79:6 ."},{"catchword":"Mijn toorn","tekst":"Zie boven Eze 7:8 ."}],"9":[{"catchword":"deed het","tekst":"Te weten wat Ik gedaan heb, namelijk hun belovende uit Egypteland te verlossen, Gen 15:14 ; Exo 3:8 ; vergelijk onder vs.14, 22."},{"catchword":"om Mijns Naams wil,","tekst":"Dat is, niet omdat zij het verdienden of waardig waren, maar omdat Ik dat uit loutere genade beloofd had, en wilde in mijn woord waarachtig bevonden worden. Vergelijk onder vs.14, 22, 44, enz.; Dan 9:19 ; Rom 9:17 , Rom 9:23 ; Eph 1:6 ."},{"catchword":"ontheiligd wierde","tekst":"Zie Lev 18:21 , en onder vs.21, 24, 39, en Eze 39:7 ."},{"catchword":"welke Ik Mij,","tekst":"Namelijk Israëlieten."},{"catchword":"derzelver ogen,","tekst":"Te weten der heidenen, en voornamelijk der Egyptenaars, die al Gods wonderwerken hadden gezien; Exo 14:18 ; Num 33:3 ."}],"10":[{"catchword":"woestijn","tekst":"Die zich uitstrekt van de Rode zee tot aan de grenzen van het land Kanaän."}],"11":[{"catchword":"Daar gaf Ik hun Mijn inzettingen,","tekst":"Te weten aan den berg Sinaï, van welken zie Exo 19:1 ; zie ook Lev 7:38 , en Lev 25:1 , en de aantekening."},{"catchword":"dewelke,","tekst":"Zie Lev 18:5 ; Deu 6:25 ."}],"12":[{"catchword":"sabbatten,","tekst":"Zie van dit woord Lev 25:2 ."},{"catchword":"teken te zijn","tekst":"Dat is, een ceremonieële afbeelding en beduiding van den geestelijken en eeuwigen sabbat. Alzo onder vs.20."},{"catchword":"Die hen heilige","tekst":"Dat is, uit genade afzonderen van andere mensen, opdat Ik hun God zij, en zij mijn volk, hetwelk Ik mij door het bloed van den Messias reinige en door mijn Woord en Geest heilig make. Zie Lev 20:8 , en Lev 21:8 ."}],"13":[{"catchword":"ontheiligden Mijn sabbatten zeer,","tekst":"Te weten mits daarop te doen wat God verboden en te laten wat Hij geboden had."}],"14":[{"catchword":"deed het om Mijns Naams wil,","tekst":"Te weten dat Ik hun naar mijn genadige belofte gedaan heb. Zie boven vs.9. Anders: Ik deed het; te weten mits hen dikwijls te straffen, als zij tegen mij in de woestijn murmureerden en zondigden."},{"catchword":"uitvoerde","tekst":"Te weten uit Egypteland, gelijk boven vs.6."}],"15":[{"catchword":"hief Ik ook Mijn hand op","tekst":"Zie boven vs.5."},{"catchword":"vloeiende van melk en honig,","tekst":"Zie boven vs.6."}],"16":[{"catchword":"en in Mijn inzettingen niet wandelden,","tekst":"Of, en in mijne inzettingen, in die niet wandelen; of, en aangaande mijne inzettingen, in die niet wandelden. De zin is enerlei."},{"catchword":"wandelde hun drekgoden na","tekst":"Vergelijk 1Ki 11:5 ."}],"17":[{"catchword":"voleinding met hen maakte","tekst":"Zie van deze manier van spreken Jer 4:27 ; alzo boven Eze 11:13 ."}],"18":[{"catchword":"tot hun kinderen in de woestijn","tekst":"Dat is, tot de zonen en de dochters dergenen, die Ik krachtiglijk uit Egypteland geleid had."},{"catchword":"Wandelt niet","tekst":"Zie 1Ki 15:26 ."},{"catchword":"hun rechten niet,","tekst":"Dat is, hunne wijze en manier van doen; vergelijk Gen 40:13 , en de aantekening."},{"catchword":"verontreinigt u niet","tekst":"Zie boven vs.7."}],"19":[{"catchword":"wandelt in Mijn inzettingen,","tekst":"Vergelijk 2Ch 6:16 , en de aantekening."}],"20":[{"catchword":"heiligt Mijn sabbatten,","tekst":"Dat is, gebruikt ze tot dat heilig einde, waartoe ik ze geheiligd heb; zie Jer 17:22 ."},{"catchword":"teken zijn tussen Mij en tussen ulieden,","tekst":"Zie boven vs.12."}],"21":[{"catchword":"Ik zeide,","tekst":"Of, Ik dacht. Zeggen voor denken; zie Gen 20:11 ."},{"catchword":"Mijn grimmigheid","tekst":"Zie boven Eze 7:8 ."},{"catchword":"volbrengende Mijn toorn","tekst":"Alzo boven vs.8."}],"22":[{"catchword":"Ik keerde Mijn hand af,","tekst":"Te weten van mijn toorn over hen te volbrengen."},{"catchword":"deed het om Mijns Naams wil,","tekst":"Te weten dat Ik hen niet in de woestijn vernielde."},{"catchword":"ontheiligd worden,","tekst":"Alzo boven vs.9."}],"23":[{"catchword":"hief ook Mijn hand tot hen op","tekst":"Te weten dreigende hen te straffen; vergelijk Psa 10:12 , en de aantekening."}],"24":[{"catchword":"hun ogen","tekst":"Versta ook hunne harten. Want deze twee dingen volgen elkander, Job 31:7 . Daarom worden zij ook somtijds samengevoegd; Jer 22:17 ; boven Eze 6:9 ."}],"25":[{"catchword":"besluitingen,","tekst":"Dat is, gezette vonnissen en ordinantiën van mijn rechtvaardig oordeel, inhoudende de straffen, die zij verdiend hadden en ook hebben moeten lijden. Zo is ook het Hebreeuwse woord genomen Job 23:14 ; Psa 2:7 ; alzo is het volgende woord rechten genomen voor straffen, die hun om hunne zonden recht toekwamen."},{"catchword":"niet goed waren,","tekst":"Dat is hun niet aangenaam of welbekomende, maar zeer kwaad en verderflijk. Zie van deze straffen Num 16:23 , enz., en Num 21:6 , en Num 25:4 , enz. Anderen verstaan door deze kwade inzettingen de afgodische wetten der heidenen, welke God gezegd wordt den Israëlieten gegeven te hebben, omdat Hij door een rechtvaardig oordeel hen daarin heeft laten wandelen tot hun verderf, overmits zij zijn heilige wetten verlieten; vergelijk Psa 81:12-13 ; Rom 1:24 , enz. 2Th 2:11 ."},{"catchword":"waarbij zij niet leven zouden","tekst":"Hetwelk vervuld is als zij vergaan zijn in de woestijn en daarna."}],"26":[{"catchword":"verontreinigde hen in hun giften,","tekst":"Dat is, Ik verklaarde, bewees en betuigde dat zij onrein, dat is onheilig, gruwelijk en mij onaangenaam waren in het offeren van hunne giften, die zij mij toebrachten. Zie van het woord verontreinigen alzo genomen, Lev 13:3 ."},{"catchword":"door het vuur","tekst":"Dit is hier ingevoegd uit vs.31. Het is ook uit den tekst gelaten, Lev 18:21 ; zie van deze gruwel der heidenen, Lev 18:21 . Sommigen menen dat de Joden ook dezen gruwel den waren God ter ere hebben willen doen."},{"catchword":"al wat de baarmoeder opent;","tekst":"Hebreeuws, alle opening der baarmoeder; dat is, alle eerstgeborenen; alzo Exo 13:2 , enz.; Num 3:12 ."},{"catchword":"opdat Ik ze verwoesten zou,","tekst":"Want God had hen gedreigd, indien zij de heidense gruwelen navolgden, dat Hij hun land verwoesten zou; Lev 26:22 , Lev 26:31-32 , enz."}],"27":[{"catchword":"door overtreding","tekst":"Dat is, een zonderlinge zonde tegen mij begaan hebben; vergelijk de manier van spreken, Lev 5:15 ; Num 5:27 ; Jos 7:1 ."}],"28":[{"catchword":"Als Ik hen","tekst":"Hier wordt verhaald de voorgemelde zonderlinge overtreding."},{"catchword":"in het land gebracht had,","tekst":"Dat is, in het land Kanaän, dat Ik hunnen vaderen beloofd had."},{"catchword":"dicht geboomte,","tekst":"Dat is, dat zeer dik en doorvlochten is van takken en bladeren. Vergelijk Lev 23:40 ; Neh 8:16 ."},{"catchword":"tergende offeranden,","tekst":"Hebreeuws, de terging hunner offerande; dat is de offeranden, waarmede zij mij tergden en tot toorn verwekten."},{"catchword":"offerden zij hun drankofferen","tekst":"Zie Psa 16:4 ."}],"29":[{"catchword":"hoogte,","tekst":"Wat de afgodische hoogten geweest zijn, zie Lev 26:30 . De Heere, aldus sprekende, vraagt spottenderwijze wat het te beduiden had, dat zij daarheen gingen om te offeren. Want, hoewel hij hun zulks doorgaans door zijne profeten verboden had, zo bleef nochtans met den afgodendienst zelfs de naam der plaats bij hen in eer en waarde."}],"30":[{"catchword":"Zijt gij","tekst":"Te weten door de eer en den dienst, die gij den afgoden doet. Zie boven vs.7."},{"catchword":"verontreinigd geworden","tekst":"Anders: zijt gij [niet] verontreinigd geworden, enz."},{"catchword":"in den weg uwer vaderen,","tekst":"Dat is, naar, of met de manier van doen uwer vaderen. Zie Pro 6:6 ."},{"catchword":"hoereert gij","tekst":"Zie Lev 17:7 , en Lev 20:5 ."}],"31":[{"catchword":"Ja,","tekst":"Anders: Want als gij uwe gaven offert, [en] als gij uwe kinderen door het vuur doet doorgaan, enz., zou Ik dan van u gevraagd worden?"},{"catchword":"worde","tekst":"Vervul den zin gelijk in andere eedzweringen van God. Zie Num 14:23 . De zin dan is, alsof de Heere zeide: Ik begeer van u, die zulke gruwelijke afgodendienaren zijt, niet gevraagd te worden."}],"32":[{"catchword":"in uw geest opgeklommen is,","tekst":"Dat is, in de gedachten van uw hart gerezen en opgekomen is, of wat gij denkt bij uzelven; vergelijk boven Eze 11:5 , en zie Jer 7:31 ."},{"catchword":"zal geenszins geschieden,","tekst":"Hebreeuws, zal zijnde niet zijn, of geschiedende niet geschieden."},{"catchword":"hout en steen","tekst":"Zo worden de beelden genaamd, Deu 4:28 , en Deu 29:17 ; Jer 2:27 , en Jer 3:9 ; idem, gebeelde stenen, Lev 26:1 ; goud en zilver, Deu 29:17 ; Psa 115:4 , enz."}],"33":[{"catchword":"sterke hand,","tekst":"Dat is, sterke en harde plagen. Zie Exo 3:19 , en Exo 9:3 ; Job 13:21 met de aantekening."},{"catchword":"uitgestrekten arm,","tekst":"Dat is, geweldige, wijdlopende en langdurige straffen. Vergelijk Jer 21:5 , en boven Eze 4:7 ."},{"catchword":"uitgegoten grimmigheid","tekst":"Zie boven Eze 7:8 ."},{"catchword":"over u zal regeren","tekst":"Dat is, uw Heere en Koning zijn, zulks dat het in uwe vrijheid en vermogen niet staan zal van mij af te gaan en mij te verlaten om een anderen overheer te verkiezen."}],"34":[{"catchword":"uit de volken voeren,","tekst":"Velen verstaan door dezen, die met den koning Jojachin weggetrokken zijn naar Babel, 2Ki 24:12 . Hoewel daaronder ook kunnen verstaan worden die door de laatste belegering onder Zedekia in de omliggende landen verstrooid zijn geworden. Vergelijk Jer 40:11-12 ."}],"35":[{"catchword":"in de woestijn der volken,","tekst":"Dat is, in Chaldea en de omliggende landen, waar de Joden als in ene woestijn zouden wezen; vergelijk boven Eze 19:13 , en de aantekening."},{"catchword":"rechten,","tekst":"Of, pleiten. Het Hebreeuwse woord betekent eigenlijk geoordeeld of gerecht te worden voor een rechter; Psa 109:7 ; Pro 29:9 . Nu is er geen andere opperste Rechter dan God alleen, maar Hij wordt gezegd geoordeeld te worden, als Hij door zijn rechtvaardige straffen den mens alzo overtuigt van zijne zonden, dat ook andere mensen oordelen dat de zondaar om dezelve rechtvaardig gestraft wordt; zie boven Eze 17:20 ."},{"catchword":"aangezicht aan aangezicht;","tekst":"Dat is, in tegenwoordigheid, mij hun openbarende door straffen, welker gerechtigheid allen zo blijken zal, alsof Ik tegen u in tegenwoordigheid pleitte; vergelijk Exo 33:11 ."}],"37":[{"catchword":"onder de roede doen doorgaan,","tekst":"Dat is, van de andere afzonderen, en mij tot een heilig volk toeëigenen; zie van deze manier van spreken Lev 27:32 ; idem Jer 33:13 ."},{"catchword":"u brengen","tekst":"Te weten die Ik afgezonderd heb."},{"catchword":"onder den band des verbonds","tekst":"Dat is, tot de gehoorzaamheid, die gij mij schuldig zijt uit kracht van het verbond, dat Ik met u gemaakt heb."}],"38":[{"catchword":"die rebel zijn,","tekst":"Te weten Israël."},{"catchword":"uitzuiveren;","tekst":"Of, uitvagen; dat is afscheiden van degenen, die Ik tot mijn eigendom verkoren heb en die mijn woord gehoorzaam zijn."},{"catchword":"uit het land","tekst":"Dat is, uit het land van Juda. Hij spreekt vande Joden, die nog met Zedekia in Judea waren, en hij noemt dat land, van hetwelk zij zich beroemden de rechte erfgenamen te zijn, het land hunner vreemdelingschap, omdat het nu meest overheerd was van den koning van Babel, en dat zij door hunne rebellie tegen hem, ja ook zelfs tegen God, hun recht daartoe verloren hadden. Sommigen verstaan door het land hunner vreemdelingschappen het landschap van Chaldea, waar wel enige goddelozen zouden uitgevoerd, maar van God verdaan worden, en in het land Israëls niet komen."},{"catchword":"uitvoeren,","tekst":"Te weten om gevankelijk gevoerd te worden naar Babel."},{"catchword":"in het landschap Israëls","tekst":"Dat is, in hetzelve land."},{"catchword":"niet weder- komen,","tekst":"Te weten omdat zij in de Babylonische gevangenschap zouden sterven."}],"39":[{"catchword":"Gaat henen,","tekst":"Een bevel spottenderwijze en uit zeer bittere toornigheid gegeven tot een teken, dat Hij dit hardnekkig volk verliet en verwierp; vergelijk Jdg 10:14 ; 1Ki 22:15 ; Job 38:3 , en de aantekening."},{"catchword":"hierna,","tekst":"Te weten nadat gij uit Judea gevankelijk zult weggevoerd zijn."},{"catchword":"Mijn heiligen Naam,","tekst":"Hebreeuws, den naam mijner heiligheid."},{"catchword":"uw giften en met uw drekgoden","tekst":"Te weten die gij uwen afgoden geeft en offert, en dat kwanswijs uit een goede bedoeling, tot mijne eer, gelijk gij voorgeeft."}],"40":[{"catchword":"op Mijn heiligen berg,","tekst":"Hebreeuws, in den berg mijner heiligheid. Versta de heilige kerk, en zie boven Eze 14:22 ."},{"catchword":"het ganse huis Israëls","tekst":"Of, allen, die in het land zijn, enz. Versta, het geestelijk Israël, hetwelk is de vergadering van alle uitverkorenen en ware gelovigen; Rom 9:6-7 , enz., en Rom 11:26 ; Gal 6:16 ."},{"catchword":"aan hen nemen,","tekst":"Dat is, aan hunne personen, en dat uit genade, om des Middelaars wil, in wien zij geloven zullen, en door wiens Geest zij zullen geheiligd en geregeerd worden; Eph 1:6 ."},{"catchword":"hefofferen eisen,","tekst":"Versta onder de benaming van den godsdienst van het Oude Testament ook den godsdienst van het Nieuwe; vergelijk Isa 19:19 , Isa 19:21 ; Mal 1:11 ."},{"catchword":"geheiligde dingen","tekst":"Te weten die mij geheiligd en toegeëigend zullen worden."}],"41":[{"catchword":"om den liefelijken reuk,","tekst":"Zie Gen 8:21 ."},{"catchword":"geheiligd worden","tekst":"Dat is, geëerd en grootgemaakt worden om de genade en weldaad, die Ik aan u zal bewezen hebben. Zie Lev 10:3 ."}],"43":[{"catchword":"zult gij dan gedenken","tekst":"Vergelijk boven Eze 6:9 , en de aantekening."},{"catchword":"verontreinigd hebt,","tekst":"Vergelijk boven Eze 14:11 ."},{"catchword":"walging hebben","tekst":"Zie boven Eze 6:9 ."}],"44":[{"catchword":"om Mijns Naams wil,","tekst":"Zie boven vs.9."}],"46":[{"catchword":"zet uw aangezicht","tekst":"Dat is, bereid u, schik u, neem vastelijk voor om tegen het zuiden te profeteren. Vergelijk boven Eze 6:2 , en onder Eze 21:2 . Hier beginnen sommigen het volgende hoofdstuk, in welks begin deze figuurlijke profetie duidelijk verklaard wordt."},{"catchword":"naar den weg van het zuiden,","tekst":"Dat is, naar Jeruzalem en Judea; want dit land was ten aanzien van Chaldea, of Mesopotamië, waarin Ezechiël nu was, zuidwaarts gelegen. Vergelijk onder Eze 21:2 ."},{"catchword":"drup tegen het zuiden;","tekst":"Zie Deu 32:2 ."},{"catchword":"woud van het veld in het zuiden","tekst":"Versta het land van Juda, hetwelk zo vol mensen is geweest, gelijk een bos vol is van bomen. Vergelijk vs.47."}],"47":[{"catchword":"zuiderwoud","tekst":"Dat is, tot de mensen, die in Judea wonen; zie boven Eze 17:24 ."},{"catchword":"een vuur in u aansteken,","tekst":"Dat is, een geweldige plaag van een gruwzamen oorlog; vergelijk Job 15:34 ; idem zie Psa 78:63 , en Psa 83:15 ."},{"catchword":"allen groenen boom en allen dorren boom verteren zal;","tekst":"Dat is, rechtvaardigen en goddelozen; zie deze verklaring onder Eze 21:3 ; boven Eze 17:24 . De vromen worden gezegd groen te zijn, en de bozen dor; Psa 52:10 ; Jer 17:8 ; Luk 23:31 ."},{"catchword":"de vlammende vlam","tekst":"Hebreeuws, de v (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}
