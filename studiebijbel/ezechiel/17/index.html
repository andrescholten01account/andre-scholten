n raadsel voor, en gebruik een gelijkenis tegen het huis van Israël,","3":"en zeg: Zo zegt de Heere HEERE: Een arend, die groot was, groot van vleugels, lang van vlerken, vol van veren, die verschillende kleuren had, kwam op de Libanon, en nam de opperste tak van een ceder.","4":"Hij plukte de top van zijn jonge takjes af, en bracht hem in een land van koophandel; hij zette hem in een stad van kooplieden.","5":"Hij nam ook van het zaad van het land, en legde het in een zaadakker; hij nam het, hij zette het bij veel water met grote zorgvuldigheid.","6":"En het sproot uit, en werd een welig uitlopende wijnstok, *doch* nederig van stam, terwijl hij met zijn takken naar hem toe keek, omdat zijn wortels onder hem waren. Zo werd hij tot een wijnstok, die ranken voortbracht en scheuten uitwierp.","7":"Nog was er een grote arend, groot van vleugels en overvloedig van veren; en zie, deze wijnstok voegde zijn wortels naar hem toe, en wierp zijn takken naar hem uit, opdat hij hem bevochtigen zou vanuit de bedden van zijn planting.","8":"Hij was in een goede landouw bij veel water geplant, om takken te maken en vrucht te dragen, opdat hij tot een heerlijke wijnstok worden mocht.","9":"Zeg: Zo zegt de Heere HEERE: Zal hij gedijen? Zal hij niet zijn wortels uitrukken, en zijn vrucht afsnijden, zodat hij droog wordt? Hij zal aan al de bladeren van zijn loot verdrogen; en dat niet door een grote arm, of door veel volk, om hem uit zijn wortels weg te voeren.","10":"Ja zie, zal hij, geplant zijnde, gedijen? Zal hij niet, als de oostenwind hem aanraakt, helemaal verdrogen? Op de bedden waar hij groeide zal hij verdrogen.","11":"Daarna kwam het woord van de HEERE tot mij en zei:","12":"Zeg nu tegen dat opstandige huis: Weet u niet wat deze dingen betekenen? Zeg: Zie, de koning van Babel is naar Jeruzalem gekomen, en heeft haar koning genomen, en haar vorsten, en heeft ze naar zich toe gevoerd naar Babel.","13":"Daartoe heeft hij van het koninklijke zaad genomen, en daarmee een verbond gemaakt, en heeft hem tot een eed gebracht, en de machtigen van het land heeft hij weggenomen;","14":"opdat het koninkrijk nederig zou zijn, zich niet verheffend, *en* dat het, zijn verbond houdend, kon bestaan.","15":"Maar hij kwam tegen hem in opstand, door zijn boden naar Egypte te zenden, opdat men hem paarden en veel volk bezorgen zou; zal hij gedijen? Zal hij ontkomen, die zulke dingen doet? Ja, zal hij het verbond breken en ontkomen?","16":"*Zo waarachtig als* Ik leef, spreekt de Heere HEERE, hij zal sterven in de plaats van de koning die hem koning gemaakt heeft, wiens eed hij veracht heeft, en wiens verbond hij gebroken heeft — bij hem, midden in Babel!","17":"Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.","18":"Want hij heeft de eed veracht, door het verbond te breken, terwijl hij, zie, zijn hand gegeven had; omdat hij al deze dingen gedaan heeft, zal hij niet ontkomen.","19":"Daarom, zo zegt de Heere HEERE: *Zo waarachtig als* Ik leef, Ik zal Mijn eed, die hij veracht heeft, en Mijn verbond, dat hij gebroken heeft, op zijn hoofd geven!","20":"En Ik zal Mijn net over hem uitspreiden, zodat hij gegrepen zal worden in Mijn jachtnet; en Ik zal hem naar Babel laten brengen, en zal daar met hem in het gericht gaan over zijn overtreding, waarmee hij tegen Mij overtreden heeft.","21":"Daartoe zullen al zijn vluchtelingen met al zijn troepen door het zwaard vallen, en de overgeblevenen zullen naar alle windrichtingen verstrooid worden; en u zult weten dat Ik, de HEERE, dit gesproken heb.","22":"Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal;","23":"op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen.","24":"Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen."},"SV":{"1":"En des HEEREN woord geschiedde tot mij, zeggende:","2":"Mensenkind, stel een raadsel voor, en gebruik een gelijkenis tot het huis Israëls,","3":"En zeg: Alzo zegt de Heere HEERE: Een arend, die groot was, groot van vleugelen, lang van vlerken, vol van vederen, die verscheidene verven had, kwam op den Libanon, en nam den oppersten tak van een ceder.","4":"Hij plukte den top van zijn jonge takjes af, en bracht hem in een land van koophandel; hij zette hem in een stad van kooplieden.","5":"Hij nam ook van het zaad des lands, en legde het in een zaadakker; hij nam het, hij zette het bij vele wateren met grote voorzichtigheid.","6":"En het sproot uit, en werd tot een welig uitlopenden wijnstok, *doch* nederig van stam, ziende met zijn takken naar hem, dewijl zijn wortelen onder hem waren. Zo werd hij tot een wijnstok, die ranken voortbracht en scheuten uitwierp.","7":"Nog was er een grote arend, groot van vleugelen en overvloedig van vederen; en ziet, deze wijnstok voegde zijn wortelen naar denzelven toe, en wierp zijn takken tot hem uit, opdat hij hem bevochtigen zou naar de bedden zijner planting toe.","8":"Hij was in een goede landouwe bij vele wateren geplant, om takken te maken en vrucht te dragen, opdat hij tot een heerlijken wijnstok worden mocht.","9":"Zeg: Alzo zegt de Heere HEERE: Zal hij gedijen? Zal hij niet zijn wortelen uitrukken, en zijn vrucht afsnijden, dat hij droog worde? Hij zal aan al de bladeren van zijn gewas verdrogen; en dat niet door een groten arm, noch door veel volks, om dien van zijn wortelen weg te voeren.","10":"Ja ziet, zal hij geplant zijnde gedijen? Zal hij niet, als de oostenwind hem aanroert, gans verdrogen? Op de bedden van zijn gewas zal hij verdrogen.","11":"Daarna geschiedde des HEEREN woord tot mij, zeggende:","12":"Zeg nu tot dat wederspannig huis: Weet gij niet, wat deze dingen zijn? Zeg: Ziet, de koning van Babel is *tot* Jeruzalem gekomen, en heeft haar koning genomen, en haar vorsten, en heeft ze tot zich gevoerd naar Babel.","13":"Daartoe heeft hij van het koninklijk zaad genomen, en daarmede een verbond gemaakt, en heeft hem tot een eed gebracht, en de machtigen des lands heeft hij weggenomen;","14":"Opdat het koninkrijk nederig zou zijn, zich niet verheffende, *en* dat het, zijn verbond houdende, bestaan mocht.","15":"Maar hij rebelleerde tegen hem, zendende zijn boden in Egypte, opdat men hem paarden en veel volks bestellen zou; zal hij gedijen? Zal hij ontkomen, die zulke dingen doet? Ja, zal hij het verbond breken en ontkomen?","16":"*Zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zo hij niet in de plaats des konings, die hem koning gemaakt heeft, wiens eed hij veracht, en wiens verbond hij gebroken heeft, bij hem in het midden van Babel zal sterven!","17":"Ook zal Farao, door een groot heir en door menigte van *krijgs* vergadering, met hem in oorlog niets uitrichten als men een wal zal opwerpen, en als men sterkten bouwen zal, om vele zielen uit te roeien.","18":"Want hij heeft den eed veracht, brekende het verbond, daar hij, ziet, zijn hand gegeven had; dewijl hij al deze dingen gedaan heeft, zal hij niet ontkomen.","19":"Daarom, alzo zegt de Heere HEERE: *Zo* *waarachtig* *als* Ik leef, zo Ik Mijn eed, dien hij veracht heeft, en Mijn verbond, dat hij gebroken heeft, datzelve niet op zijn hoofd geve!","20":"En Ik zal Mijn net over hem uitspreiden, dat hij gegrepen zal worden in Mijn jachtgaren; en Ik zal hem doen brengen naar Babel, en zal daar met hem rechten *over* zijn overtreding, waardoor hij tegen Mij overtreden heeft.","21":"Daartoe zullen al zijn vluchtelingen met al zijn benden door het zwaard vallen, en de overgeblevenen zullen in alle winden verstrooid worden; en gijlieden zult weten, dat Ik, de HEERE, gesproken heb.","22":"Alzo zegt de Heere HEERE: Ik zal ook van den oppersten tak des hogen ceders nemen, dat Ik zetten zal; van het opperste zijner jonge takjes zal Ik een tederen afplukken, denwelken Ik op een hogen en verhevenen berg planten zal;","23":"Op den berg der hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijken ceder worden, dat onder hem wonen zal alle gevogelte van allerlei vleugel; in de schaduw zijner takken zullen zij wonen.","24":"Zo zullen alle bomen des velds weten, dat Ik, de HEERE, den hogen boom vernederd heb, den nederigen boom verheven heb, den groenen boom verdroogd, en den drogen boom bloeiende gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen."},"KJV":{"1":"And the word of the LORD came unto me, saying,","2":"Son of man, put forth a riddle, and speak a parable unto the house of Israel;","3":"And say, Thus saith the Lord GOD; A great eagle with great wings, longwinged, full of feathers, which had divers colours, came unto Lebanon, and took the highest branch of the cedar:","4":"He cropped off the top of his young twigs, and carried it into a land of traffick; he set it in a city of merchants.","5":"He took also of the seed of the land, and planted it in a fruitful field; he placed *it* by great waters, *and* set it *as* a willow tree.","6":"And it grew, and became a spreading vine of low stature, whose branches turned toward him, and the roots thereof were under him: so it became a vine, and brought forth branches, and shot forth sprigs.","7":"There was also another great eagle with great wings and many feathers: and, behold, this vine did bend her roots toward him, and shot forth her branches toward him, that he might water it by the furrows of her plantation.","8":"It was planted in a good soil by great waters, that it might bring forth branches, and that it might bear fruit, that it might be a goodly vine.","9":"Say thou, Thus saith the Lord GOD; Shall it prosper? shall he not pull up the roots thereof, and cut off the fruit thereof, that it wither? it shall wither in all the leaves of her spring, even without great power or many people to pluck it up by the roots","10":"Yea, behold, *being* planted, shall it prosper? shall it not utterly wither, when the east wind toucheth it? it shall wither in the furrows where it grew.","11":"Moreover the word of the LORD came unto me, saying,","12":"Say now to the rebellious house, Know ye not what these *things mean*? tell *them*, Behold, the king of Babylon is come to Jerusalem, and hath taken the king thereof, and the princes thereof, and led them with him to Babylon;","13":"And hath taken of the king's seed, and made a covenant with him, and hath taken an oath of him: he hath also taken the mighty of the land:","14":"That the kingdom might be base, that it might not lift itself up, *but* that by keeping of his covenant it might stand.","15":"But he rebelled against him in sending his ambassadors into Egypt, that they might give him horses and much people. Shall he prosper? shall he escape that doeth such *things*? or shall he break the covenant, and be delivered?","16":"*As* I live, saith the Lord GOD, surely in the place *where* the king *dwelleth* that made him king, whose oath he despised, and whose covenant he brake, *even* with him in the midst of Babylon he shall die.","17":"Neither shall Pharaoh with *his* mighty army and great company make for him in the war, by casting up mounts, and building forts, to cut off many persons:","18":"Seeing he despised the oath by breaking the covenant, when, lo, he had given his hand, and hath done all these *things*, he shall not escape.","19":"Therefore thus saith the Lord GOD; *As* I live, surely mine oath that he hath despised, and my covenant that he hath broken, even it will I recompense upon his own head.","20":"And I will spread my net upon him, and he shall be taken in my snare, and I will bring him to Babylon, and will plead with him there for his trespass that he hath trespassed","21":"And all his fugitives with all his bands shall fall by the sword, and they that remain shall be scattered toward all winds: and ye shall know that I the LORD have spoken","22":"Thus saith the Lord GOD; I will also take of the highest branch of the high cedar, and will set *it*; I will crop off from the top of his young twigs a tender one, and will plant *it* upon an high mountain and eminent:","23":"In the mountain of the height of Israel will I plant it: and it shall bring forth boughs, and bear fruit, and be a goodly cedar: and under it shall dwell all fowl of every wing; in the shadow of the branches thereof shall they dwell.","24":"And all the trees of the field shall know that I the LORD have brought down the high tree, have exalted the low tree, have dried up the green tree, and have made the dry tree to flourish: I the LORD have spoken and have done"}},"tsk":{"3":[{"kopje":"die groot was","refs":["Ezech 17:7","Ezech 17:12-21","Deut 28:49","Jer 4:13","Jer 48:40","Jer 49:16","Klaagl 4:19","Hos 8:1","Matt 24:28"]},{"kopje":"groot van vleugels","refs":["Dan 2:38","Dan 4:22","Dan 7:4"]},{"kopje":"kwam","refs":["Ezech 17:12","2 Kon 24:10-16","2 Kron 36:9","2 Kron 36:10","Jer 22:23-28","Jer 24:1"]}],"4":[{"kopje":"in","refs":["Jes 43:14","Jes 47:15","Jer 51:13","Openb 18:3","Openb 18:11-19"]}],"5":[{"kopje":"het zaad","refs":["Ezech 17:13","2 Kon 24:17","Jer 37:1"]},{"kopje":"legde het in een zaadakker","refs":["Deut 8:7-9"]},{"kopje":"hij zette het","refs":["Ezech 19:11","Ezech 19:12","Jes 15:7","Jes 44:4"]}],"6":[{"kopje":"het sproot uit","refs":["Ezech 17:14","Spr 16:18","Spr 16:19"]}],"7":[{"kopje":"Nog was er een","refs":["Ezech 17:15","2 Kon 24:20","2 Kron 26:13","Jer 37:5-7"]}],"8":[{"kopje":"landouw","refs":["Ezech 17:5","Ezec 61\">heb</span>, <span class=\"wl\" data-l=\"L13\" data-code=\"H6213\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3002\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3002\">droge</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H6086\">boom</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H6524\">bloeiend</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H6524\">gemaakt</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1696\">heb</span>; <span class=\"wl\" data-l=\"L12\" data-code=\"H1696\">Ik</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H1696\">de</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1696\">HEERE</span>, <span class=\"wl\" data-l=\"L11\" data-code=\"H6524\">heb</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H6524\">het</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1696\">gesproken</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H3002\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3002\">zal</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H6213\">het</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H6213\">doen</span>."},"koppeling_kjv":{"1":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","2":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> put <span class=\"wl wl-kjv\" data-code=\"H2330\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H2420\">riddle,</span> and <span class=\"wl wl-kjv\" data-code=\"H4911\">speak</span> a <span class=\"wl wl-kjv\" data-code=\"H4912\">parable</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel;","3":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> A <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">wings,</span> <span class=\"wl wl-kjv\" data-code=\"H83\">longwinged,</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H5133\">feathers,</span> which had divers <span class=\"wl wl-kjv\" data-code=\"H7553\">colours,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the highest <span class=\"wl wl-kjv\" data-code=\"H6788\">branch</span> of the cedar:","4":"He cropped <span class=\"wl wl-kjv\" data-code=\"H6998\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of his young <span class=\"wl wl-kjv\" data-code=\"H3242\">twigs,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">carried</span> it into a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">traffick;</span> he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it in a <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of merchants.","5":"He <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> also of the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">planted</span> it in a <span class=\"wl wl-kjv\" data-code=\"H2233\">fruitful</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> he <span class=\"wl wl-kjv\" data-code=\"H3947\">placed</span> it by <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it as a willow tree.","6":"And it <span class=\"wl wl-kjv\" data-code=\"H6779\">grew,</span> and became a <span class=\"wl wl-kjv\" data-code=\"H5628\">spreading</span> <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> of <span class=\"wl wl-kjv\" data-code=\"H8217\">low</span> <span class=\"wl wl-kjv\" data-code=\"H6967\">stature,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1808\">branches</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> toward him, and the <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> thereof were under him: so it became a <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H6213\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H905\">branches,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">shot</span> forth sprigs.","7":"There was also <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5133\">feathers:</span> and, behold, this <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> did <span class=\"wl wl-kjv\" data-code=\"H3719\">bend</span> her <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> toward him, and shot <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> her <span class=\"wl wl-kjv\" data-code=\"H1808\">branches</span> toward him, that he might <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> it by the <span class=\"wl wl-kjv\" data-code=\"H6170\">furrows</span> of her plantation.","8":"It was <span class=\"wl wl-kjv\" data-code=\"H8362\">planted</span> in a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">soil</span> by <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> that it might bring <span class=\"wl wl-kjv\" data-code=\"H6213\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H6057\">branches,</span> and that it might <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit,</span> that it might be a <span class=\"wl wl-kjv\" data-code=\"H155\">goodly</span> vine.","9":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> thou, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Shall it <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper?</span> shall he not pull <span class=\"wl wl-kjv\" data-code=\"H5423\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> thereof, and cut <span class=\"wl wl-kjv\" data-code=\"H7082\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> thereof, that it <span class=\"wl wl-kjv\" data-code=\"H3001\">wither?</span> it shall <span class=\"wl wl-kjv\" data-code=\"H3001\">wither</span> in all the <span class=\"wl wl-kjv\" data-code=\"H2964\">leaves</span> of her <span class=\"wl wl-kjv\" data-code=\"H6780\">spring,</span> even without <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">power</span> or <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to pluck it <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> by the roots","10":"Yea, behold, being <span class=\"wl wl-kjv\" data-code=\"H8362\">planted,</span> shall it <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper?</span> shall it not <span class=\"wl wl-kjv\" data-code=\"H3001\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H3001\">wither,</span> when the <span class=\"wl wl-kjv\" data-code=\"H6921\">east</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> it? it shall <span class=\"wl wl-kjv\" data-code=\"H3001\">wither</span> in the <span class=\"wl wl-kjv\" data-code=\"H6170\">furrows</span> where it grew.","11":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","12":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> now to the <span class=\"wl wl-kjv\" data-code=\"H4805\">rebellious</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> ye not what these things mean? <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> them, Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H935\">led</span> them with him to Babylon;","13":"And hath <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> of the <span class=\"wl wl-kjv\" data-code=\"H4410\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with him, and hath <span class=\"wl wl-kjv\" data-code=\"H935\">taken</span> an <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> of him: he hath also <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">mighty</span> of the land:","14":"That the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> might be <span class=\"wl wl-kjv\" data-code=\"H8217\">base,</span> that it might not lift itself <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> but that by <span class=\"wl wl-kjv\" data-code=\"H8104\">keeping</span> of his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> it might stand.","15":"But he <span class=\"wl wl-kjv\" data-code=\"H4775\">rebelled</span> against him in <span class=\"wl wl-kjv\" data-code=\"H7971\">sending</span> his <span class=\"wl wl-kjv\" data-code=\"H4397\">ambassadors</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span> Shall he <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper?</span> shall he <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> such things? or shall he <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> and be delivered?","16":"As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> surely in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> dwelleth that made him <span class=\"wl wl-kjv\" data-code=\"H4427\">king,</span> whose <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> he <span class=\"wl wl-kjv\" data-code=\"H959\">despised,</span> and whose <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> he <span class=\"wl wl-kjv\" data-code=\"H6565\">brake,</span> even with him in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> he shall die.","17":"Neither shall <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> with his <span class=\"wl wl-kjv\" data-code=\"H1419\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> for him in the <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> by casting <span class=\"wl wl-kjv\" data-code=\"H8210\">up</span> <span class=\"wl wl-kjv\" data-code=\"H5550\">mounts,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">building</span> <span class=\"wl wl-kjv\" data-code=\"H1785\">forts,</span> to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> persons:","18":"Seeing he <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> the <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> by <span class=\"wl wl-kjv\" data-code=\"H6565\">breaking</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> when, lo, he had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> all these things, he shall not escape.","19":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> As I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> surely mine <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H959\">despised,</span> and my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H6331\">broken,</span> even it will I <span class=\"wl wl-kjv\" data-code=\"H5414\">recompense</span> upon his own head.","20":"And I will <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> my <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> upon him, and he shall be <span class=\"wl wl-kjv\" data-code=\"H8610\">taken</span> in my <span class=\"wl wl-kjv\" data-code=\"H4686\">snare,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> him to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and will <span class=\"wl wl-kjv\" data-code=\"H8199\">plead</span> with him there for his <span class=\"wl wl-kjv\" data-code=\"H4603\">trespass</span> that he hath trespassed","21":"And all his <span class=\"wl wl-kjv\" data-code=\"H4015\">fugitives</span> with all his <span class=\"wl wl-kjv\" data-code=\"H102\">bands</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H7604\">remain</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6566\">scattered</span> toward all <span class=\"wl wl-kjv\" data-code=\"H7307\">winds:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have spoken","22":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> I will also <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the highest <span class=\"wl wl-kjv\" data-code=\"H6788\">branch</span> of the <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> <span class=\"wl wl-kjv\" data-code=\"H730\">cedar,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it; I will crop <span class=\"wl wl-kjv\" data-code=\"H6998\">off</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of his young <span class=\"wl wl-kjv\" data-code=\"H3127\">twigs</span> a tender <span class=\"wl wl-kjv\" data-code=\"H7390\">one,</span> and will <span class=\"wl wl-kjv\" data-code=\"H8362\">plant</span> it upon an <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> and eminent:","23":"In the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of the <span class=\"wl wl-kjv\" data-code=\"H4791\">height</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> will I <span class=\"wl wl-kjv\" data-code=\"H8362\">plant</span> it: and it shall bring <span class=\"wl wl-kjv\" data-code=\"H5375\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H6057\">boughs,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit,</span> and be a <span class=\"wl wl-kjv\" data-code=\"H117\">goodly</span> <span class=\"wl wl-kjv\" data-code=\"H730\">cedar:</span> and under it shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> all <span class=\"wl wl-kjv\" data-code=\"H6833\">fowl</span> of every <span class=\"wl wl-kjv\" data-code=\"H3671\">wing;</span> in the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of the <span class=\"wl wl-kjv\" data-code=\"H1808\">branches</span> thereof shall they dwell.","24":"And all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have brought <span class=\"wl wl-kjv\" data-code=\"H8213\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> have <span class=\"wl wl-kjv\" data-code=\"H1361\">exalted</span> the <span class=\"wl wl-kjv\" data-code=\"H8217\">low</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> have <span class=\"wl wl-kjv\" data-code=\"H3001\">dried</span> up the <span class=\"wl wl-kjv\" data-code=\"H3892\">green</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> and have made the <span class=\"wl wl-kjv\" data-code=\"H3002\">dry</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> to <span class=\"wl wl-kjv\" data-code=\"H6524\">flourish:</span> I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> and have done"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"raadsel voor,","tekst":"Zie Jdg 14:12 ."},{"catchword":"gelijkenis","tekst":"Of, parabel; dat is een verhaal in hetwelk ene zaak doorgaans met iets anders vergeleken wordt, om die te meer klaarheid en kracht te geven; en kan anders ook genoemd worden een allegorie. Alzo onder Eze 20:49 en Eze 24:3 ; Mat 13:3 , Mat 13:13 , enz. Hebreeuws, parabel een parabel."},{"catchword":"tot het huis Israëls,","tekst":"Of, rakende het huis van Israël."}],"3":[{"catchword":"Een arend,","tekst":"Versta Nebukadnezar, den koning van Babel, zie onder vs.12."},{"catchword":"groot van vleugelen,","tekst":"Dat is, hebbende grote macht, een wijd uitgestrekt koninkrijk en overvloed van allen rijkdom."},{"catchword":"verscheidene veren had,","tekst":"Het Hebreeuwse woord betekent eigenlijk wat met de naald van verscheidene kleuren gemaakt wordt, als geborduurd of gestikt werk, boven Eze 16:10 , Eze 16:13 , enz.; maar hier wordt het bij gelijkenis gebruikt van schone gespikkelde en dooreen gekleurde vederen, alsof zij geborduurd waren."},{"catchword":"Libanon,","tekst":"Versta het land van Palestina, hetwelk noordwaarts met het gebergte van Libanon begrensd was. Zie 1Ki 4:33 ."},{"catchword":"oppersten tak","tekst":"Door dezen is betekend de koning Jojachin, ander ook Jechonias genaamd, 1Ch 3:16 ; die van Nebukadnezar gevankelijk naar Babylonië weggevoerd was; 2Ki 24:12 ; 2Ch 36:10 ."},{"catchword":"ceder","tekst":"Die ene figuur was van het koninkrijk der Joden. Vergelijk Num 24:6 ; Amo 2:9 ."}],"4":[{"catchword":"zijn jonge takjes af,","tekst":"Deze betekenden de vorsten, heren en edellieden, die met den koning Jojachin in de gevangenschap naar Babel gingen; 2Ki 24:12 ."},{"catchword":"koophandel;","tekst":"Hier is in het oorspronkelijke het woord chenaän, hetwelk eigenlijk betekent koopman. Zie Job 40:25 , en de aantekening. Versta nu hierdoor Babylonië, alwaar veel koophandel omging uit oorzaak van de menigte der mensen, die daar woonden en die van alle landen daar verkeerden en handelden."},{"catchword":"een stad","tekst":"Namelijk Babel."},{"catchword":"kooplieden","tekst":"Anders, kruideniers, of drogisten; gelijk 1Ki 10:15 . Zo zou de stad van Babel genaamd zijn, omdat zij vol was van allerlei specerijen, droge en kostelijke waren, dienende niet alleen tot nooddruft of vermaak, maar ook tot lekkernij en overdadigheid."}],"5":[{"catchword":"Hij nam ook","tekst":"Te weten de voorgemelde arend, de koning Nebukadnezar."},{"catchword":"het zaad des lands,","tekst":"Dat is, van degenen, die in het land Juda geboren waren. Versta, Matthanja, den oom van Jechonia, dat is, zijns vaders Jojakims broeder, genaamd van Nebukadnezar Zedekia; 2Ki 24:17 ."},{"catchword":"legde het in een zaadakker;","tekst":"Dat is, hij stelde Zedekia tot koning over Juda."},{"catchword":"bij vele wateren","tekst":"Dat is, in een bekwame plaats, waar het wel kon groeien."},{"catchword":"met grote voorzichtigheid","tekst":"Dat is, met wijze en welbedachte voorwaarden. Anders: [als] een wilgenboom, die gaarne bij het water wast."}],"6":[{"catchword":"het sproot uit,","tekst":"Te weten dat zaad, de koning Zedekia. De zin is, dat deze koning welvoer en gelukkig was in zijn koninkrijk, zolang als hij den koning van Babel getrouw bleEf."},{"catchword":"doch nederig","tekst":"Te weten als die onder het gebied was van den koning van Babel, dien hij jaarlijks schatting moest betalen."},{"catchword":"stam,","tekst":"Hebreeuws, statuur, hoogte, opstaande gestalte; alzo onder Eze 19:11 , en Eze 31:3 , Eze 31:5 , Eze 31:10 ."},{"catchword":"naar hem,","tekst":"Te weten waarvan hij zijne planting had en onder wiens bescherming hij schuilde."},{"catchword":"hij tot een wijnstok,","tekst":"Namelijk de wijnstok."}],"7":[{"catchword":"grote arend,","tekst":"Namelijk Farao, de koning van Egypte. Zie onder vs.15, 17."},{"catchword":"groot van vleugelen","tekst":"Vergelijk boven de aantekening vs.3."},{"catchword":"deze wijnstok","tekst":"Dat is, de koning Zedekia."},{"catchword":"zijn wortelen","tekst":"Versta door dezen de gezanten, die de koning Zedekia naar den koning van Egypte heimelijk zond om een verbond met hem te maken, ten einde dat hij hem helpen zou tegen den koning van Babel, wiens schatplichtige en vazal hij was, en van welken hij nu was afgevallen. Vergelijk onder vs.15; Jer 2:18 ."},{"catchword":"denzelven toe,","tekst":"Te weten arend, den koning van Egypte."},{"catchword":"hij","tekst":"Versta denzelfden arend."},{"catchword":"hem bevochtigen zou","tekst":"Te weten den voorgemelden wijnstok, den koning Zedekia."},{"catchword":"naar de bedden","tekst":"Dat is naar de ingangen en passages toe, die leidden tot de plaats zijner planting. Het Hebreeuwse woord is in gelijke betekenis genomen; Jdg 7:3 , Jdg 7:7 . Zie de aantekening. Dit ziet nu op de gewoonte van Egypte, waar men, als de rivier de Nijl overvloeide, waterlopen, groeven en voren maakte om het water door het gehele land uit te laten en naar alle plaatsen te verspreiden. Alzo begeerde of verzocht ook de koning Zedekia, dat de koning van Egypte zijn macht en krijgsvolk hem toeschikken zou, om tegen den koning van Babel geholpen te worden. Anders: uit de bedden zijner planting; te weten alzo dat zijn land van den koning van Egypte bevochtigd zijnde, hij alsdan daardoor mocht opwassen."},{"catchword":"zijner planting toe","tekst":"Te weten des wijnstoks planting; dat is, ter plaatse, waar hij geplant was, te weten in Judea."}],"8":[{"catchword":"geplant,","tekst":"Te weten van den koning Nebukadnezar."}],"9":[{"catchword":"hij gedijen?","tekst":"Te weten de wijnstok, die van den eersten arend geplant is."},{"catchword":"hij niet","tekst":"Te weten de eerste arend, de koning Nebukadnezar."},{"catchword":"zijn wortelen uitrukken,","tekst":"Te weten, van den wijnstok. Versta den koning Zedekia, gelijk boven, met al zijne macht en zijn ganse koninkrijk."},{"catchword":"en dat","tekst":"Alzo is de letter vau voor en dat genomen; Jer 17:10 ."},{"catchword":"niet door een groten arm,","tekst":"Dat is, zonder dat een zeer geweldig leger daartoe zal nodig zijn. Want de Heere zal Zedekia tegen zijn om zijne goddeloosheid en meinedigheid."}],"10":[{"catchword":"zal hij geplant zijnde gedijen?","tekst":"Deze vraag loochent sterkelijk."},{"catchword":"Zal hij niet,","tekst":"Deze vraag verzekert sterkelijk."},{"catchword":"oostenwind hem aanroert,","tekst":"Versta den koning van Babel, die den koning Zedekia, al zijne macht en de stad Jeruzalem zou verderven, gelijk de vruchten van den oostenwind verdorven worden; Gen 41:6 ."},{"catchword":"gans verdrogen?","tekst":"Hebreeuws, verdrogende verdrogen."},{"catchword":"Op de bedden","tekst":"Te weten waarin hij geplant is om wel bevochtigd te worden en wel te groeien. Of, tezamen met de voren, dat is met het land Juda mede, waarin hij staat, zal hij verdorren en vergaan. Of, de voren, da is de middelen, waardoor hij water zal zoeken, dat is hulp uit Egypte te krijgen, zullen mede vergaan."},{"catchword":"van zijn gewas","tekst":"Dat is, waarin hij wast of groeit; alzo boven vs.7, de bedden zijner planting; dat is, waarin hij geplant was."}],"12":[{"catchword":"dat wederspannig huis","tekst":"Hebreeuws, dat huis der wederspannigheid. Versta, den stam of het koninkrijk van Juda. Zie boven Eze 2:5 ."},{"catchword":"deze dingen","tekst":"Te weten, die Ik u voorgesteld heb van twee arenden."},{"catchword":"zijn?","tekst":"Of, beduiden, of betekenen, of te kennen geven."},{"catchword":"Ziet,","tekst":"Hier volgt de verklaring der voorgestelde gelijkenis."},{"catchword":"haar koning genomen,","tekst":"Namelijk Jojachin; 2Ki 24:12 ; 2Ch 36:10 . Zie boven vs.3."},{"catchword":"vorsten,","tekst":"Welke boven vs.4, vergeleken worden bij de opperste tedere takken van den Libanon."}],"13":[{"catchword":"koninklijk zaad genomen,","tekst":"Genaam boven vs.5, het zaad des lands, namelijk van Juda. Hebreeuws, zaad des koninkrijks. Hij bedoelt Zedekia. Zie boven vs.5."},{"catchword":"een eed gebracht,","tekst":"Of, in een eed doen komen; te weten waardoor Zedekia zich vervloekt zo hij zijn woord niet hield en niet getrouw bleef; vergelijk boven Eze 16:59 . Sommigen menen dat deze manier van spreken, in den eed doen komen, ziet op het oude gebruik, waardoor degenen, die met elkander een verbond maakten, beesten slachtten, die in stukken deelden en dan tussen de gedeelde stukken doorgingen; zie Gen 15:17 ."},{"catchword":"machtigen des lands","tekst":"Te weten die Zedekia met raad en met daad hadden kunnen helpen, om het koninkrijk van Juda tegen den koning van Babel vast te maken en eindelijk van hem te doen afvallen."},{"catchword":"weggenomen;","tekst":"Te weten tot pandlieden of gijzelaars."}],"14":[{"catchword":"zijn verbond houdende,","tekst":"Te weten van den koning van Babel. Versta de beloften van onderdanigheid en trouw, die Zedekia en de heren van het land aan den koning van Babel gedaan hadden."}],"15":[{"catchword":"het verbond breken","tekst":"Te weten dat hij met den koning Nebukadnezar gemaakt heeft."}],"16":[{"catchword":"in de plaats des konings,","tekst":"Waar de koning Nebukadnezar woont, dat is, in Babel, gelijk hier in het einde van vs.16 gezegd wordt."},{"catchword":"bij hem in het midden van Babel","tekst":"Dat is, in dezelfde plaats of stad, gelijk straks gezegd is, en dus niet in zijn vaderland."},{"catchword":"zal sterven","tekst":"De zin is: Dat hij daar zekerlijk zou sterven; hoewel hij het land niet zien zou, omdat hem tevoren in Riblath de ogen verblind zouden worden; 2Ki 25:6-7 ; Jer 32:5 , en Jer 34:3 , Jer 34:5 , en Jer 52:11 ."}],"17":[{"catchword":"hem in oorlog","tekst":"Dat is met Zedekia, te weten om hem te helpen door zijne macht bij de macht van Zedekia te voegen. Of tegen hem; dat is tegen den koning Nebukadnezar, om hem te wederstaan en van Jeruzalem te verdrijven."},{"catchword":"als men een wal","tekst":"Hetwelk de koning van Babel doen zou."},{"catchword":"opwerpen,","tekst":"Hebreeuws, uitstorten; alzo 2Sa 20:15 ; 2Ki 19:32 ."},{"catchword":"vele zielen","tekst":"Dat is, vele mensen."}],"18":[{"catchword":"hij heeft","tekst":"Namelijk de koning Zedekia."},{"catchword":"eed veracht,","tekst":"Of, vloek."},{"catchword":"hand gegeven had;","tekst":"Te weten aan den koning van Babel, tot verzekering van te zullen vasthouden aan het verbond, dat hij met hem gemaakt had. Zie van zulke handhaving, gedaan tot verzekering van hetgeen men zegt of belooft, 2Ki 10:15 ; 2Ch 30:8 ; Ezr 10:19 ."}],"19":[{"catchword":"Mijn eed,","tekst":"God noemt den eed, dien Zedekia aan den koning van Babel gedaan had, zijn eed, omdat hij met aanroeping van zijn naam gedaan was; en in gelijken zin zijn verbond, dat hij met denzelfden koning gemaakt had. Versta onder het woord eed de straf van de verbreking van den eed."},{"catchword":"niet op zijn hoofd geve","tekst":"Dat is met straffen vergeld. Zie 1Ki 8:32 ; alzo boven Eze 9:10 , en Eze 11:21 , en Eze 16:43 , en onder Eze 22:31 ; een afgebroken manier van eedzweren."}],"20":[{"catchword":"Mijn net","tekst":"Zie boven Eze 12:13 , en onder Eze 32:3 ."},{"catchword":"hem uitspreiden,","tekst":"Te weten over den koning Zedekia."},{"catchword":"daar met hem rechten","tekst":"Te weten bo (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
