kind! Richt uw gezicht tegen Gog, het land van Magog, de hoofdvorst van Mesech en Tubal, en profeteer tegen hem,","3":"en zeg: Zo zegt de Heere HEERE: Zie, Ik *wil* aan u, o Gog, gij hoofdvorst van Mesech en Tubal!","4":"En Ik zal u omkeren, en haken in uw kaken leggen, en Ik zal u uitvoeren, alsook uw hele leger, paarden en ruiters, die allemaal volkomen goed gekleed zijn, een grote verzameling, *met* rondas en schild, die allemaal zwaarden hanteren;","5":"Perzen, Moren en Puteeërs met hen, die allemaal schild en helm *voeren*;","6":"Gomer en al zijn benden, en het huis van Togarma, *aan* de zijden van het noorden, en al zijn benden; veel volken met u.","7":"Wees bereid en maak u gereed, u en uw hele verzameling, die zich bij u verzameld hebben; en wees u hun tot een wacht.","8":"Na veel dagen zult u bezocht worden[1]; in het laatste van de jaren zult u komen in het land, dat teruggebracht is van het zwaard, dat verzameld is uit veel volken, op de bergen van Israël, die steeds tot verwoesting geweest zijn; wanneer datzelfde *land* uit de volken uitgevoerd zal zijn, en zij allemaal veilig zullen wonen.","9":"Dan zult u optrekken, u zult aankomen als een onstuimige verwoesting, u zult zijn als een wolk, om het land te bedekken; u en al uw benden, en veel volken met u.","10":"Zo zegt de Heere HEERE: Op die dag zal het ook gebeuren, dat er plannen in uw hart zullen opkomen, en u zult een kwade gedachte bedenken,","11":"en zult zeggen: Ik zal optrekken naar *dat* dorpland, ik zal komen tot hen die in rust zijn, die veilig wonen, die allemaal wonen zonder muur, en geen grendel of deuren hebben.","12":"Om buit te buiten, en om roof te roven; om uw hand te wenden tegen de woeste plaatsen, die *nu* bewoond zijn, en tegen een volk, dat uit de heidenen verzameld is, dat vee en have verkregen heeft, wonend in het midden van het land.","13":"Scheba, en Dedan, en de kooplieden van Tarsis, en al hun jonge leeuwen zullen tegen u zeggen: Komt u, om buit te buiten? Hebt u uw verzameling verzameld, om roof te roven? Om zilver en goud weg te voeren, om vee en have weg te nemen, om een grote buit te buiten?","14":"Daarom, profeteer, o mensenkind! En zeg tegen Gog: Zo zegt de Heere HEERE: Zult u het, op die dag, als Mijn volk Israël veilig woont, niet gewaarworden?","15":"U zult dan komen uit uw plaats, uit de zijden van het noorden, u en veel volken met u; die allemaal op paarden zullen rijden, een grote verzameling, en een machtig leger;","16":"en u zult optrekken tegen Mijn volk Israël, als een wolk, om het land te bedekken; in het laatste van de dagen zal het gebeuren; dan zal Ik u aanbrengen tegen Mijn land, opdat de heidenen Mij kennen, als Ik aan u, o Gog! voor hun ogen geheiligd zal worden.","17":"Zo zegt de Heere HEERE: Bent u die, over wie Ik in vroegere dagen gesproken heb, door de dienst van Mijn knechten, de profeten van Israël, die in die dagen geprofeteerd hebben, jarenlang, dat Ik u tegen hen zou aanbrengen?","18":"Maar het zal gebeuren op die dag, op de dag als Gog tegen het land van Israël zal aankomen, spreekt de Heere HEERE, dat Mijn grimmigheid in Mijn neus zal opkomen.","19":"Want Ik heb gesproken in Mijn ijver, in het vuur van Mijn verbolgenheid: Zeker, op die dag zal er een grote beving zijn in het land van Israël!","20":"Zodat voor Mijn aangezicht zullen beven de vissen van de zee, en het gevogelte van de hemel, en het gedierte van het veld, en al het kruipende gedierte, dat op de aarde kruipt, en alle mensen die op de aardbodem zijn; en de bergen zullen neergeworpen worden, en de steile plaatsen zullen neervallen, en alle muren zullen ter aarde neervallen.","21":"Want Ik zal het zwaard over hem roepen op al Mijn bergen, spreekt de Heere HEERE; het zwaard van ieder man zal tegen zijn broeder zijn.","22":"En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn.","23":"Zo zal Ik Mij groot maken, en Mij heiligen, en bekend worden voor de ogen van veel heidenen; en zij zullen weten dat Ik de HEERE ben."},"SV":{"1":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","2":"Mensenkind! zet uw aangezicht tegen Gog, het land van Magog, den hoofdvorst van Mesech en Tubal; en profeteer tegen hem,","3":"En zeg: Zo zegt de Heere HEERE: Zie, Ik *wil* aan u, o Gog, gij hoofdvorst van Mesech en Tubal!","4":"En Ik zal u omwenden, en haken in uw kaken leggen, en Ik zal u uitvoeren, mitsgaders uw ganse heir, paarden en ruiteren, die altemaal volkomen wel gekleed zijn, een grote vergadering, *met* rondas en schild, die altemaal zwaarden handelen;","5":"Perzen, Moren en Puteers met hen, die altemaal schild en helm *voeren*;","6":"Gomer en al zijn benden, en het huis van Togarma, *aan* de zijden van het noorden, en al zijn benden; vele volken met u.","7":"Zijt bereid en maakt u gereed, gij en uw ganse vergadering, die tot u vergaderd zijn; en wees gij hun tot een wacht.","8":"Na vele dagen zult gij bezocht worden; in het laatste der jaren zult gij komen in het land, dat wedergebracht is van het zwaard, dat vergaderd is uit vele volken, op de bergen Israëls, die steeds tot verwoesting geweest zijn; als hetzelve *land* uit de volken zal uitgevoerd zijn, en zij allemaal zeker zullen wonen.","9":"Dan zult gij optrekken, gij zult aankomen als een onstuimige verwoesting, gij zult zijn als een wolk, om het land te bedekken; gij en al uw benden, en vele volken met u.","10":"Alzo zegt de Heere HEERE: Te dien dage zal het ook geschieden, dat er raadslagen in uw hart zullen opkomen, en gij zult een kwade gedachte denken,","11":"En zult zeggen: Ik zal optrekken naar *dat* dorpland, ik zal komen tot degenen, die in rust zijn, die zeker wonen, die altemaal wonen zonder muur, en grendel noch deuren hebben.","12":"Om buit te buiten, en om roof te roven; om uw hand te wenden tegen de woeste plaatsen, die *nu* bewoond zijn, en tegen een volk, dat uit de heidenen verzameld is, dat vee en have verkregen heeft, wonende in het midden des lands.","13":"Scheba, en Dedan, en de kooplieden van Tarsis, en alle hun jonge leeuwen zullen tot u zeggen: Komt gij, om buit te buiten? hebt gij uw vergadering vergaderd, om roof te roven? om zilver en goud weg te voeren, om vee en have weg te nemen, om een groten buit te buiten?","14":"Daarom profeteer, o mensenkind! en zeg tot Gog: Zo zegt de Heere HEERE: Zult gij het, te dien dage, als Mijn volk Israël zeker woont, niet gewaar worden?","15":"Gij zult dan komen uit uw plaats, uit de zijden van het noorden, gij en vele volken met u; die altemaal op paarden zullen rijden, een grote vergadering, en een machtig heir;","16":"En gij zult optrekken tegen Mijn volk Israël, als een wolk, om het land te bedekken; in het laatste der dagen zal het geschieden; dan zal Ik u aanbrengen tegen Mijn land, opdat de heidenen Mij kennen, als Ik aan u, o Gog! voor hun ogen zal geheiligd worden.","17":"Zo zegt de Heere HEERE: Zijt gij die, *van* welken Ik in verleden dagen gesproken heb, door den dienst Mijner knechten, de profeten Israëls, die in die dagen geprofeteerd hebben, jaren *lang*, dat Ik u tegen hen zou aanbrengen?","18":"Maar het zal geschieden te dien dage, ten dage als Gog tegen het land Israëls zal aankomen, spreekt de Heere HEERE, dat Mijn grimmigheid in Mijn neus zal opkomen.","19":"Want Ik heb gesproken in Mijn ijver, in het vuur Mijner verbolgenheid: Zo er niet, te dien dage, een groot beven zal zijn in het land Israëls!","20":"Zodat van Mijn aangezicht beven zullen de vissen der zee, en het gevogelte des hemels, en het gedierte des velds, en al het kruipend gedierte, dat op het aardrijk kruipt, en alle mensen, die op den aardbodem zijn; en de bergen zullen nedergeworpen worden, en de steile plaatsen zullen nedervallen, en alle muren zullen ter aarde nedervallen.","21":"Want Ik zal het zwaard over hem roepen op al Mijn bergen, spreekt de Heere HEERE; het zwaard van een ieder zal tegen zijn broeder zijn.","22":"En Ik zal met hem rechten, door pestilentie en door bloed; en Ik zal een overstelpenden plasregen, en grote hagelstenen, vuur en zwavel regenen op hem, en op zijn benden, en op de vele volken, die met hem zullen zijn.","23":"Alzo zal Ik Mij groot maken, en Mij heiligen, en bekend worden voor de ogen van vele heidenen; en zij zullen weten, dat Ik de HEERE ben."},"KJV":{"1":"And the word of the LORD came unto me, saying,","2":"Son of man, set thy face against Gog, the land of Magog, the chief prince of Meshech and Tubal, and prophesy","3":"And say, Thus saith the Lord GOD; Behold, I *am* against thee, O Gog, the chief prince of Meshech and Tubal:","4":"And I will turn thee back, and put hooks into thy jaws, and I will bring thee forth, and all thine army, horses and horsemen, all of them clothed with all sorts *of armour, even* a great company *with* bucklers and shields, all of them handling swords:","5":"Persia, Ethiopia, and Libya with them; all of them with shield and helmet:","6":"Gomer, and all his bands; the house of Togarmah of the north quarters, and all his bands: *and* many people","7":"Be thou prepared, and prepare for thyself, thou, and all thy company that are assembled unto thee, and be thou a guard","8":"After many days thou shalt be visited: in the latter years thou shalt come into the land *that is* brought back from the sword, *and is* gathered out of many people, against the mountains of Israel, which have been always waste: but it is brought forth out of the nations, and they shall dwell safely","9":"Thou shalt ascend and come like a storm, thou shalt be like a cloud to cover the land, thou, and all thy bands, and many people","10":"Thus saith the Lord GOD; It shall also come to pass, *that* at the same time shall things come into thy mind, and thou shalt think an evil thought:","11":"And thou shalt say, I will go up to the land of unwalled villages; I will go to them that are at rest, that dwell safely, all of them dwelling without walls, and having neither bars nor gates,","12":"To take a spoil, and to take a prey; to turn thine hand upon the desolate places *that are now* inhabited, and upon the people *that are* gathered out of the nations, which have gotten cattle and goods, that dwell in the midst of the land.","13":"Sheba, and Dedan, and the merchants of Tarshish, with all the young lions thereof, shall say unto thee, Art thou come to take a spoil? hast thou gathered thy company to take a prey? to carry away silver and gold, to take away cattle and goods, to take a great spoil?","14":"Therefore, son of man, prophesy and say unto Gog, Thus saith the Lord GOD; In that day when my people of Israel dwelleth safely, shalt thou not know","15":"And thou shalt come from thy place out of the north parts, thou, and many people with thee, all of them riding upon horses, a great company, and a mighty army:","16":"And thou shalt come up against my people of Israel, as a cloud to cover the land; it shall be in the latter days, and I will bring thee against my land, that the heathen may know me, when I shall be sanctified in thee, O Gog, before their eyes.","17":"Thus saith the Lord GOD; *Art* thou he of whom I have spoken in old time by my servants the prophets of Israel, which prophesied in those days *many* years that I would bring","18":"And it shall come to pass at the same time when Gog shall come against the land of Israel, saith the Lord GOD, *that* my fury shall come up in my face.","19":"For in my jealousy *and* in the fire of my wrath have I spoken, Surely in that day there shall be a great shaking in the land of Israel;","20":"So that the fishes of the sea, and the fowls of the heaven, and the beasts of the field, and all creeping things that creep upon the earth, and all the men that *are* upon the face of the earth, shall shake at my presence, and the mountains shall be thrown down, and the steep places shall fall, and every wall shall fall to the ground.","21":"And I will call for a sword against him throughout all my mountains, saith the Lord GOD: every man's sword shall be against his brother.","22":"And I will plead against him with pestilence and with blood; and I will rain upon him, and upon his bands, and upon the many people that *are* with him, an overflowing rain, and great hailstones, fire, and brimstone.","23":"Thus will I magnify myself, and sanctify myself; and I will be known in the eyes of many nations, and they shall know that I *am* the LORD."}},"tsk":{"2":[{"kopje":"Mensenkind","refs":["Ezech 2:1","Ezech 39:1"]},{"kopje":"Richt","refs":["Ezech 6:2","Ezech 20:46","Ezech 25:2","Ezech 35:2","Ezech 35:3"]},{"kopje":"Gog","refs":["Openb 20:8","Openb 20:9"]},{"kopje":"Magog","refs":["Gen 10:2","1 Kron 1:5"]},{"kopje":"Mesech","refs":["Ezech 27:13","Ezech 32:26","Jes 66:19"]}],"3":[{"kopje":"Ik wil","refs":["Ezech 13:8","Ezech 29:3","Ezech 35:3","Ezech 39:1","Ezech 39:2-10"]}],"4":[{"kopje":"Ik zal u omkeren","refs":["Ezech 29:4","Ezech 39:2","2 Kon 19:28","Jes 37:29"]},{"kopje":"paarden","refs":["Ezech 38:15","Dan 11:40"]},{"kopje":"die allemaal","refs":["Ezech 23:12"]},{"kopje":"hanteren","refs":["1 Kron 12:8","2 Kron 25:5","Jer 46:9"]}],"5":[{"kopje":"Perzen","refs":["Ezech 27:10"]},{"kopje":"Moren","refs":["Ezech 30:5","Gen 10:6","1 Kron 1:8","Nahum 3:9"]}],"6":[{"kopje":"Gomer","refs":["Gen 10:2","1 Kron 1:5"]},{"kopje":"Togarma","refs":["Ezech 27:14","Gen 10:3","1 Kron 1:6","Dan 11:40"]}],"8":[{"kopje":"veel dagen","refs":["Ezech 38:16","Gen 49:1","Num 24:14","Deut 4:30","Jer 48:47","Jer 49:39","Hos 3:3-5","Hab 2:3"]},{"kopje":"zult u","refs":["Ex 20:5","Jes 24:22","Jes 29:6","Jer 32:5","Klaagl 4:22"]},{"kopje":"in het land","refs":["Ezech 38:12","Ezech 36:24-38","Ezech 37:21-28","Ezech 39:27-29","Jes 11:11-16","Jer 30:3","Jer 30:18","Jer 32:37","Amos 9:14","Amos 9:15"]},{"kopje":"de bergen","refs":["Ezech 34:13","Ezech 36:1-8"]},{"kopje":"dat","refs":["1 Petr 2:9"]},{"kopje":"en zij allemaal","refs":["Ezech 38:11","Ez // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
