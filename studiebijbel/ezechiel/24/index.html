iende maand, op de tiende dag van de maand, en Hij zei:","2":"Mensenkind! Schrijf voor uzelf de naam van de dag op, van deze dag zelf; de koning van Babel heeft zich tegen Jeruzalem gelegerd, op deze dag zelf.","3":"En gebruik een gelijkenis tegenover dat opstandige huis, en zeg tegen hen: Zo zegt de Heere HEERE: Zet een pot toe, zet hem toe, en giet er ook water in.","4":"Doe de stukken ervan samen erin, alle goede stukken, de dij en de schouder, vul hem met de beste beenderen.","5":"Neem het beste van de kudde, en stook ook een brandstapel van de beenderen daaronder; laat het goed opkoken; ook zullen de beenderen erin gekookt worden.","6":"Daarom, zo zegt de Heere HEERE: Wee de bloedstad, de pot, waarin zijn schuim is, en waaruit zijn schuim niet is uitgegaan! Trek er stuk bij stuk uit, en laat het lot niet over hem vallen.","7":"Want haar bloed is in haar midden; op een gladde rots heeft zij het gelegd; zij heeft het niet op de aarde uitgestort, om het met stof te bedekken.","8":"Opdat Ik de grimmigheid doe opgaan om wraak te oefenen, heb Ik haar bloed op een gladde rots gelegd, opdat het niet bedekt wordt.","9":"Daarom, zo zegt de Heere HEERE: Wee de bloedstad! Ik zal ook de brandstapel groot maken!","10":"Draag veel hout aan, steek het vuur aan, verteer het vlees, en kruid het met specerijen, en laat de beenderen verbranden.","11":"Zet hem daarna leeg op zijn kolen, opdat hij heet wordt, en zijn roest verbrandt, en zijn onreinheid in zijn midden smelt, zijn schuim verteerd wordt.","12":"Met leugens heeft zij Mij moe gemaakt; toch is haar overvloedige schuim niet van haar uitgegaan; haar schuim moet in het vuur.","13":"In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.","14":"Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.","15":"Verder kwam het woord van de HEERE tot mij, en Hij zei:","16":"Mensenkind! Zie, Ik zal de lust van uw ogen van u wegnemen door een plaag; toch zult u niet rouwklagen, en ook niet wenen, en uw tranen zullen niet komen.","17":"Houd stil met kermen, u zult geen dodenrouw bedrijven, bind uw hoofddeksel op u, en doe uw schoenen aan uw voeten; en de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.","18":"Dit sprak ik tot het volk in de morgen, en mijn vrouw stierf in de avond; en ik deed in de morgen zoals mij geboden was.","19":"En het volk zei tegen mij: Zult u ons niet laten weten wat deze dingen voor ons betekenen, dat u zo doet?","20":"En ik zei tegen hen: Het woord van de HEERE is tot mij gekomen, en Hij zei:","21":"Zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Zie, Ik zal Mijn heiligdom ontheiligen, de heerlijkheid van uw sterkte, de begeerte van uw ogen, en waar uw ziel medelijden mee heeft; en uw zonen en uw dochters, die u achtergelaten hebt, zullen door het zwaard vallen.","22":"Dan zult u doen, zoals ik gedaan heb; de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.","23":"En uw hoofddeksels zullen op uw hoofden zijn, en uw schoenen aan uw voeten; u zult niet rouwklagen, en ook niet wenen, maar u zult wegkwijnen in uw ongerechtigheden, en ieder zal tegen zijn broeder zuchten.","24":"Zo zal Ezechiël voor u een wonderteken zijn; naar alles wat hij gedaan heeft, zult u doen; wanneer dit komt, zult u weten, dat Ik de Heere HEERE ben.","25":"En u, mensenkind! zal het niet zo zijn, op de dag dat Ik van hen wegneem hun sterkte, de vreugde van hun sieraad, de lust van hun ogen en het verlangen van hun zielen, hun zonen en hun dochters;","26":"Dat op diezelfde dag iemand die ontkomen is naar u toe zal komen, om het u met eigen oren te laten horen?","27":"Op diezelfde dag zal uw mond geopend worden tegenover hem die ontkomen is, en u zult spreken, en niet langer stom zijn; zo zult u voor hen tot een wonderteken zijn, en zij zullen weten, dat Ik de HEERE ben."},"SV":{"1":"Wijders geschiedde des HEEREN woord tot mij, in het negende jaar, in de tiende maand, op den tienden der maand, zeggende:","2":"Mensenkind! schrijf u den naam van den dag op, even van dezen zelfden dag; de koning van Babel legt zich voor Jeruzalem, even op dezen zelfden dag.","3":"En gebruik een gelijkenis tot dat wederspannig huis, en zeg tot hen: Alzo zegt de Heere HEERE: Zet een pot toe, zet *hem* toe, en giet ook water daarin.","4":"Doe zijn stukken te zamen daarin, alle goede stukken, de dij en den schouder, vul *hem* met de keur der beenderen.","5":"Neem de keur van de kudde, en stook ook een brandstapel van de beenderen daaronder; doe hem wel opzieden; ook zullen zijn beenderen daarin gekookt worden.","6":"Daarom, alzo zegt de Heere HEERE: Wee der bloedstad, den pot, welks schuim in hem is, en van welken zijn schuim niet is uitgegaan! trek stuk bij stuk daaruit, en laat het lot over hem niet vallen.","7":"Want haar bloed is in het midden van haar; op een gladde steenrots heeft zij dat gelegd; zij heeft het op de aarde niet uitgestort, om hetzelve met stof te bedekken.","8":"Opdat Ik de grimmigheid doe opgaan om wraak te oefenen, heb Ik *ook* haar bloed op een gladde steenrots gelegd, opdat het niet bedekt worde.","9":"Daarom, alzo zegt de Heere HEERE: Wee der bloedstad! Ik zal ook den brandstapel groot maken!","10":"Draag veel houts toe, steek het vuur aan, verteer het vlees, en kruid *het* met specerijen, en laat de beenderen verbranden.","11":"Stel hem daarna ledig op zijn kolen, opdat hij heet worde, en zijn roest verbrande, en zijn onreinigheid in het midden van hem versmelte, zijn schuim verteerd worde.","12":"*Met* ijdelheden heeft zij *Mij* moede gemaakt; nog is haar overvloedig schuim van haar niet uitgegaan; haar schuim *moet* in het vuur.","13":"In uw onreinigheid is schandelijkheid, omdat Ik u gereinigd heb, en gij niet gereinigd zijt, zo zult gij van uw onreinigheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u zal hebben doen rusten.","14":"Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet verschonen noch berouw hebben; naar uw wegen en naar uw handelingen zullen zij u richten, spreekt de Heere HEERE.","15":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","16":"Mensenkind! zie, Ik zal den lust uwer ogen van u wegnemen door een plage; nochtans zult gij niet rouwklagen, noch wenen, en uw tranen zullen niet voortkomen.","17":"Houd stil van kermen, gij zult geen dodenrouw maken, bind uw hoed op u, en doe uw schoenen aan uw voeten; en de bovenste lip zult gij niet bewinden, en zult der lieden brood niet eten.","18":"Dit sprak ik tot het volk in den morgenstond, en mijn huisvrouw stierf in den avond; en ik deed in den morgenstond, gelijk mij geboden was.","19":"En het volk zeide tot mij: Zult gij ons niet te kennen geven, wat ons deze dingen zijn, dat gij *aldus* doet?","20":"En ik zeide tot hen: Het woord des HEEREN is tot mij geschied, zeggende:","21":"Zeg tot het huis Israëls: Alzo zegt de Heere HEERE: Ziet, Ik zal Mijn heiligdom ontheiligen, de heerlijkheid uwer sterkte, de begeerte uwer ogen, en de verschoning uwer ziel; en uw zonen en uw dochteren, die gij verlaten hebt, zullen door het zwaard vallen.","22":"Dan zult gijlieden doen, gelijk als ik gedaan heb; de bovenste lip zult gij niet bewinden, en der lieden brood zult gij niet eten.","23":"En uw hoeden zullen op uw hoofden zijn, en uw schoenen aan uw voeten; gij zult niet rouwklagen, noch wenen, maar gij zult in uw ongerechtigheden versmachten, en een iegelijk tegen zijn broeder zuchten.","24":"Alzo zal ulieden Ezechiël tot een wonderteken zijn; naar alles, wat hij gedaan heeft, zult gij doen; als dit komt, dan zult gij weten, dat Ik de Heere HEERE ben.","25":"En gij, mensenkind! zal het niet zijn, ten dage, als Ik van hen zal wegnemen hun sterkte, de vreugde huns sieraads, den lust hunner ogen en het verlangen hunner zielen, hun zonen en hun dochteren;","26":"Dat tenzelfden dage een ontkomene tot u zal komen, om *uw* oren *dat* te doen horen?","27":"Ten zelven dage zal uw mond bij dien, die ontkomen is, opengedaan worden, en gij zult spreken, en niet meer stom zijn; alzo zult gij hun tot een wonderteken zijn, en zij zullen weten, dat Ik de HEERE ben."},"KJV":{"1":"Again in the ninth year, in the tenth month, in the tenth *day* of the month, the word of the LORD came unto me, saying,","2":"Son of man, write thee the name of the day, *even* of this same day: the king of Babylon set himself against Jerusalem this same day.","3":"And utter a parable unto the rebellious house, and say unto them, Thus saith the Lord GOD; Set on a pot, set *it* on, and also pour water","4":"Gather the pieces thereof into it, *even* every good piece, the thigh, and the shoulder; fill *it* with the choice bones.","5":"Take the choice of the flock, and burn also the bones under it, *and* make it boil well, and let them seethe the bones of it therein.","6":"Wherefore thus saith the Lord GOD; Woe to the bloody city, to the pot whose scum *is* therein, and whose scum is not gone out of it! bring it out piece by piece; let no lot fall","7":"For her blood is in the midst of her; she set it upon the top of a rock; she poured it not upon the ground, to cover it with dust;","8":"That it might cause fury to come up to take vengeance; I have set her blood upon the top of a rock, that it should not be covered.","9":"Therefore thus saith the Lord GOD; Woe to the bloody city! I will even make the pile for fire great.","10":"Heap on wood, kindle the fire, consume the flesh, and spice it well, and let the bones be burned.","11":"Then set it empty upon the coals thereof, that the brass of it may be hot, and may burn, and *that* the filthiness of it may be molten in it, *that* the scum of it may be consumed.","12":"She hath wearied *herself* with lies, and her great scum went not forth out of her: her scum *shall be* in the fire.","13":"In thy filthiness *is* lewdness: because I have purged thee, and thou wast not purged, thou shalt not be purged from thy filthiness any more, till I have caused my fury to rest","14":"I the LORD have spoken *it*: it shall come to pass, and I will do *it*; I will not go back, neither will I spare, neither will I repent; according to thy ways, and according to thy doings, shall they judge thee, saith the Lord GOD.","15":"Also the word of the LORD came unto me, saying,","16":"Son of man, behold, I take away from thee the desire of thine eyes with a stroke: yet neither shalt thou mourn nor weep, neither shall thy tears run down.","17":"Forbear to cry, make no mourning for the dead, bind the tire of thine head upon thee, and put on thy shoes upon thy feet, and cover not *thy* lips, and eat not the bread of men.","18":"So I spake unto the people in the morning: and at even my wife died; and I did in the morning as I was commanded.","19":"And the people said unto me, Wilt thou not tell us what these *things are* to us, that thou doest","20":"Then I answered them, The word of the LORD came unto me, saying,","21":"Speak unto the house of Israel, Thus saith the Lord GOD; Behold, I will profane my sanctuary, the excellency of your strength, the desire of your eyes, and that which your soul pitieth; and your sons and your daughters whom ye have left shall fall by the sword.","22":"And ye shall do as I have done: ye shall not cover *your* lips, nor eat the bread of men.","23":"And your tires *shall be* upon your heads, and your shoes upon your feet: ye shall not mourn nor weep; but ye shall pine away for your iniquities, and mourn one toward another.","24":"Thus Ezekiel is unto you a sign: according to all that he hath done shall ye do: and when this cometh, ye shall know that I *am* the Lord GOD.","25":"Also, thou son of man, *shall it* not *be* in the day when I take from them their strength, the joy of their glory, the desire of their eyes, and that whereupon they set their minds, their sons and their daughters,","26":"*That* he that escapeth in that day shall come unto thee, to cause *thee* to hear *it* with *thine* ears?","27":"In that day shall thy mouth be opened to him which is escaped, and thou shalt speak, and be no more dumb: and thou shalt be a sign unto them; and they shall know that I *am* the LORD."}},"tsk":{"1":[{"kopje":"het negende jaar","refs":["Ezech 1:2","Ezech 8:1","Ezech 20:1","Ezech 26:1","Ezech 29:1","Ezech 29:17","Ezech 31:1","Ezech 32:1","Ezech 32:17","Ezech 33:21","Ezech 40:1","2 Kon 24:12"]}],"2":[{"kopje":"Schrijf","refs":["Jes 8:1","Jes 30:8","Jes 30:9","Hab 2:2","Hab 2:3"]},{"kopje":"van deze","refs":["2 Kon 25:1","Jer 39:1","Jer 52:4"]}],"3":[{"kopje":"gebruik","refs":["Ezech 17:2","Ezech 19:2-14","Ezech 20:49","Ps 78:2","Micha 2:4","Mark 12:12","Luk 8:10"]},{"kopje":"opstandige","refs":["Ezech 2:3","Ezech 2:6","Ezech 2:8","Ezech 3:9","Ezech 12:2","Ezech 12:25","Ezech 17:12","Jes 1:2","Jes 30:1","Jes 30:9","Jes 63:10","Hand 7:51"]},{"kopje":"Zet","refs":["Ezech 24:6","Ezech 11:3","Jer 50:13","Jer 50:14"]}],"5":[{"kopje":"het beste","refs":["Ezech 20:47","Ezech 34:16","Ezech 34:17","Ezech 34:20","Jer 39:6","Jer 52:10","Jer 52:24-27","Openb 19:20"]},{"kopje":"stook","refs":["Ezech 24:9","Ezech 24:10"]}],"6":[{"kopje":"Wee","refs":["Ezech 24:9","Ezech 11:6","Ezech 11:7","Ezech 22:2","Ezech 22:6-9","Ezech 22:12","Ezech 22:27","Ezech 23:37-45","2 Kon 21:16","2 Kon 24:4","Micha 7:2","Nahum 3:1","Matt 23:35","Openb 11:7","Openb 11:8","Openb 17:6","Openb 18:24"]},{"kopje":"de pot","refs":["Ezech 24:11-13","Jer 6:29"]},{"kopje":"Trek","refs":["Ezech 9:5","Ezech 9:6","Ezech 11:7-9","Ezech 11:11","Joz 10:22"]},{"kopje":"laat ... niet","refs":["Joz 7:16-18","1 Sam 14:40-42","2 Sam 8:2","Joël 3:3","Obadja 1:11","Jona 1:7","Nahum 3:10"]}],"7":[{"kopje":"haar bloed","refs":["1 Kon 21:19","Jes 3:9","Jer 2:34","Jer 6:1  it <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H5409\">piece</span> by <span class=\"wl wl-kjv\" data-code=\"H5409\">piece;</span> let no <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> fall","7":"For her <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> is in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of her; she <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H6706\">top</span> of a <span class=\"wl wl-kjv\" data-code=\"H5553\">rock;</span> she <span class=\"wl wl-kjv\" data-code=\"H8210\">poured</span> it not upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> to <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> it with dust;","8":"That it might cause <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H5358\">take</span> <span class=\"wl wl-kjv\" data-code=\"H5359\">vengeance;</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> her <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6706\">top</span> of a <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> that it should not be covered.","9":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> <span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> to the <span class=\"wl wl-kjv\" data-code=\"H1818\">bloody</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city!</span> I will even make the <span class=\"wl wl-kjv\" data-code=\"H4071\">pile</span> for fire great.","10":"<span class=\"wl wl-kjv\" data-code=\"H7235\">Heap</span> on <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> <span class=\"wl wl-kjv\" ta-code=\"H2932\">filthiness</span> any more, till I have caused my <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to rest","14":"I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it: it shall come to <span class=\"wl wl-kjv\" data-code=\"H935\">pass,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it; I will not go <span class=\"wl wl-kjv\" data-code=\"H6544\">back,</span> neither will I <span class=\"wl wl-kjv\" data-code=\"H2347\">spare,</span> neither will I <span class=\"wl wl-kjv\" data-code=\"H5162\">repent;</span> according to thy <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and according to thy <span class=\"wl wl-kjv\" data-code=\"H5949\">doings,</span> shall they <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","15":"Also the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","16":"<span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> behold, I take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> from thee the <span class=\"wl wl-kjv\" data-code=\"H4261\">desire</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> with a <span class=\"wl wl-kjv\" data-code=\"H4046\">stroke:</span> yet neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H5594\">mourn</span> nor <span class=\"wl wl-kjv\" data-code=\"H1058\">weep,</span> neither shall thy <span class=\"wl wl-kjv\" data-code=\"H1832\">tears</span> run down.","17":"<span class=\"wl wl-kjv\" data-code=\"H1826\">Forbear</span> to <span class=\"wl wl-kjv\" data-code=\"H602\">cry,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> no <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> for the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">bind</span> the tire of thine <span class=\"wl wl-kjv\" data-code=\"H6287\">head</span> upon thee, and put <span class=\"wl wl-kjv\" data-code=\"H7760\">on</span> thy <span class=\"wl wl-kjv\" data-code=\"H5275\">shoes</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H5844\">cover</span> not thy <span class=\"wl wl-kjv\" data-code=\"H8222\">lips,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> not the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of men.","18":"So I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning:</span> and at <span class=\"wl wl-kjv\" data-code=\"H6153\">even</span> my <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died;</span> and I <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> as I was commanded.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Wilt thou not <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> us what these things are to us, that thou doest","20":"Then I <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> them, The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto me, saying,","21":"<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> the <span class=\"wl wl-kjv\" data-code=\"H1347\">excellency</span> of your <span class=\"wl wl-kjv\" data-code=\"H5797\">strength,</span> the <span class=\"wl wl-kjv\" data-code=\"H4261\">desire</span> of your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and that which your <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H4263\">pitieth;</span> and your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> whom ye have <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the sword.","22":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> as I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done:</span> ye shall not <span class=\"wl wl-kjv\" data-code=\"H5844\">cover</span> your <span class=\"wl wl-kjv\" data-code=\"H8222\">lips,</span> nor <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of men.","23":"And your <span class=\"wl wl-kjv\" data-code=\"H6287\">tires</span> shall be upon your <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> and your <span class=\"wl wl-kjv\" data-code=\"H5275\">shoes</span> upon your <span class=\"wl wl-kjv\" data-code=\"H7272\">feet:</span> ye shall not <span class=\"wl wl-kjv\" data-code=\"H5594\">mourn</span> nor <span class=\"wl wl-kjv\" data-code=\"H1058\">weep;</span> but ye shall pine <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> for your <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities,</span> and <span class=\"wl wl-kjv\" data-code=\"H5098\">mourn</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> toward another.","24":"Thus <span class=\"wl wl-kjv\" data-code=\"H3168\">Ezekiel</span> is unto you a <span class=\"wl wl-kjv\" data-code=\"H4159\">sign:</span> according to all that he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> and when this <span class=\"wl wl-kjv\" data-code=\"H935\">cometh,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","25":"Also, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> shall it not be in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when I <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> from them their <span class=\"wl wl-kjv\" data-code=\"H4581\">strength,</span> the <span class=\"wl wl-kjv\" data-code=\"H4885\">joy</span> of their <span class=\"wl wl-kjv\" data-code=\"H8597\">glory,</span> the <span class=\"wl wl-kjv\" data-code=\"H4261\">desire</span> of their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and that whereupon they <span class=\"wl wl-kjv\" data-code=\"H4853\">set</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">minds,</span> their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and their daughters,","26":"That he that <span class=\"wl wl-kjv\" data-code=\"H6412\">escapeth</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, to cause thee to <span class=\"wl wl-kjv\" data-code=\"H2045\">hear</span> it with thine ears?","27":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> be <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> to him which is <span class=\"wl wl-kjv\" data-code=\"H6412\">escaped,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> and be no more <span class=\"wl wl-kjv\" data-code=\"H481\">dumb:</span> and thou shalt be a <span class=\"wl wl-kjv\" data-code=\"H4159\">sign</span> unto them; and they shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"negende jaar,","tekst":"Na de gevankelijke wegvoering van den koning Jechonia, beschreven 2Ki 24:12-16 ; [vergelijk boven Eze 1:2 ; onder Eze 33:21 , en Eze 40:1 ] ; in wiens plaats Nebukadnezar Zedekia tot koning maakte; en in het negende jaar van dezen Zedekia, in de tiende maand op den tienden dag der maand werd Jeruzalem belegerd; zie 2Ki 25:1 ; Jer 39:1 , en Jer 52:4 ."},{"catchword":"tiende maand,","tekst":"In het kerkelijke jaar genoemd Tebeth, in het maatschappelijke jaar Thamuz."}],"2":[{"catchword":"schrijf u den naam van den dag op,","tekst":"Ter gedachtenis, om vergeleken te worden met de uitkomst, waarvan te zien is 2Ki 25:1 ; Jer 52:4 . Die was omtrent twee jaren vóór het innemen en verwoesten van Jeruzalem, waarvan hier geprofeteerd wordt."},{"catchword":"even van dezen zelfden dag;","tekst":"Hebreeuws, de kracht, of het been des daags, dat is, het wezen des daags, en [gelijk wij zeggen] even, of juist dienzelfden dag. Zie boven Eze 2:3 , met de aantekening."},{"catchword":"legt zich voor Jeruzalem,","tekst":"Of, is genaderd, heeft zich vervoegd. Het Hebreeuwse woord wordt veel gebruikt voor leunen, steunen, ondersteunen, idem van het opleggen der handen, hetwelk alles met enige samenvoeging, genaking, of nadering geschiedt; en in zake van belegering zeggen wij, voor ene stad liggen, zich daarvoor leggen, enz."}],"3":[{"catchword":"gebruik een gelijkenis","tekst":"Hebreeuws alsof men zeide: parabel een parabel. Zie boven Eze 17:2 ."},{"catchword":"pot toe,","tekst":"Betekenende de belegerde stad Jeruzalem, gelijk vs.6. Zie Jer 1:13 , en boven Eze 11:3 met de aantekening."}],"4":[{"catchword":"zijn","tekst":"Namelijk van den pot; dat is, al zulke stukken vlees, als in den pot behoren te zijn."},{"catchword":"stukken te zamen daarin,","tekst":"Betekenende de inwoners, inzonderheid de rijke, vette, weelderige burgers en groten van Jeruzalem."},{"catchword":"alle goede stukken,","tekst":"Hebreeuws, alle, of elk goed, of beste stuk."},{"catchword":"dij en den schouder,","tekst":"Of, lenden, heup, achterbout."},{"catchword":"keur der beenderen","tekst":"Dat is, uitgelezenste beenderen, als mergbenen, of bonken."}],"5":[{"catchword":"keur van de kudde,","tekst":"Dat is, het uitgelezenste schaap, of geit, neem het beste van het kleine vee daartoe."},{"catchword":"brandstapel","tekst":"Of, een vuur van beenderen. [Vergelijk Isa 30:33 , en onder vs.9], betekenende de zware en gedurige ellenden van het volk, die zij in de belegering van zwaard, honger en pestilentie en daarna zouden lijden; gelijk een vuur van beenderen zeer heet is en de beenderen hard en duurzaam zijn. Sommigen duiden het op het wegwerpen der dode lichamen en beenderen, die onbegraven op het open veld zouden blijven liggen, als God hen dikwijls gedreigd had, zodat er genoeg zouden te bekomen zijn om vuur daarvan te stoken, door welke straffen zij nochtans niet zouden worden gebeterd of bekeerd, gelijk volgt."},{"catchword":"hem","tekst":"Den pot."},{"catchword":"wel opzieden;","tekst":"Hebreeuws, zied zijne zoden."},{"catchword":"zijn beenderen","tekst":"Van den pot, gelijk vs.4."},{"catchword":"daarin","tekst":"Hebreeuws, in zijn [des pots] midden."},{"catchword":"gekookt worden","tekst":"Of, zieden. Hebreeuws, zijn gekookt, of gezoden."}],"6":[{"catchword":"bloedstad,","tekst":"Gelijk boven Eze 22:2 , en onder vs.9."},{"catchword":"welks","tekst":"De Heere wil zeggen dat de inwoners van Jeruzalem door al dat zieden en koken evenwel niet zijn gezuiverd; dat is bekeerd, maar bij hunne boosheid hardnekkig gebleven."},{"catchword":"schuim niet is uitgegaan","tekst":"Anders, roest, gelijk onder vs.11; alwaar ook een ander woord is, dat roest betekent. Het woord, dat hier gebruikt wordt en ook onder vs.11,12, schijnt te betekenen het schuim, dat niet afgegaan, afgeschuimd of verzoden zijnde, aan den rand van den pot beklijft, en tot enkel taaie vuiligheid of slijm wordt."},{"catchword":"Trek stuk bij stuk daaruit,","tekst":"Hebreeuws, bij, of naar zijne stukken, naar zijne stukken breng hem uit; het lot is over hem niet gevallen. Dit betekent het doden en wegwerpen van velen, en het uitvoeren van de rest in de gevangenschap van Babel, zonder verschoning of onderscheid. Zie boven Eze 11:7 ."},{"catchword":"hem niet vallen","tekst":"Welke stukken gij eerst, of laatst, of niet, zoudt hebben uit den pot te trekken; zij moeten allen voort, de een dood, de ander het land uit."}],"7":[{"catchword":"haar bloed","tekst":"Van Jeruzalem, afgebeeld door dezen pot."},{"catchword":"gladde steenrots","tekst":"Hebreeuws, gladdigheid, glans, of spits, uitstekendheid ener steenrots, alwaar zij, als voor Gods ogen, het bloed harer kinderen, den afgoden ter ere, heeft gestort en in het openbaar laten liggen, om God te tergen, gelijk volgt. Vergelijk de manier van spreken met onder Eze 26:4 , Eze 26:14 ."},{"catchword":"stof te bedekken","tekst":"Dit ziet op de wet Lev 17:13 ; Deu 12:16 , Deu 12:24 ."}],"8":[{"catchword":"Opdat Ik de grimmigheid doe opgaan","tekst":"Dat is, om mijne grimmigheid en wraak over zulke gruwelen op het hoogste te tonen."},{"catchword":"wraak te oefenen,","tekst":"Hebreeuws, wraak te wreken."},{"catchword":"bloed","tekst":"God wil zeggen dat Hij hun ook in het openbaar zal straffen, dat er de tekenen zullen zijn voor alle mans ogen."}],"9":[{"catchword":"bloedstad","tekst":"Gelijk boven vs.6."},{"catchword":"brandstapel groot maken","tekst":"Vergelijk boven vs.5. Dat is, een groot vuur onder Jeruzalem [dezen pot] stoken, gelijk volgt."}],"10":[{"catchword":"Draag veel houts toe,","tekst":"Hebreeuws, vermenigvuldig de houten, of houteren; een levendige vertoning van de ellende der belegerden van Jeruzalem."},{"catchword":"verteer het vlees,","tekst":"Of, maak het gaar, doorkook het, kook het volkomenlijk."},{"catchword":"kruid het met specerijen,","tekst":"Hebreeuws, specerij der specerijen, opdat de vijanden [gelijk sommigen verstaan] appetijt en lust daartoe krijgen."},{"catchword":"verbranden","tekst":"Of, aanbranden."}],"11":[{"catchword":"hem daarna ledig","tekst":"Den pot, dat is: Jeruzalem zal niet alleen van inwoners ontbloot worden, maar de stad ook verbrand, opdat de plaats van die gruwelijke onreinheid ten enenmale uitgezuiverd worde."},{"catchword":"versmelte,","tekst":"Of, wegvliete, afgestort worde."}],"12":[{"catchword":"ijdelheden","tekst":"Drijvende zulk een gedurig gewoel in hare afgoderijen, heidense verbonden, inwendigen overlast, leugen, huichelarij en allerlei boze handelingen, met welke zij haar vervallen staat heeft willen ondersteunen en het gedreigde verderf afweren, in plaats van zich tot mij te bekeren, waartoe Ik hen door mijne profeten met zulke verdraagzaamheid vermaand, en met zware dreigementen zo getrouwelijk en veelvoudig gewaarschuwd heb, dat Ik des als moede ben geworden, alzo zij in het minst daardoor niet gebeterd, maar telkens niet dan te hardnekkiger geworden is, gelijk in het volgende verhaald wordt. Het Hebreeuwse woord wordt alleenlijk hier gevonden, komende, naar het meeste gevoelen, van een woord dat ijdelheid, onrechtigheid, leugen, boosheid, ondeugd, ook afgoderij betekent. Anders: [met] ijdelheden heeft zij [zich] moede gemaakt."}],"13":[{"catchword":"gereinigd heb,","tekst":"Door de vermaningen, waarschuwingen en dreigementen mijner profeten tevergeefs gezocht heb te reinigen, zo zal Ik nu een anderen weg met u ingaan."},{"catchword":"rusten","tekst":"Zie boven Eze 5:13 ."}],"16":[{"catchword":"lust uwer ogen","tekst":"Of, wens; dat is uwe huisvrouw, zie vs.18. Waardoor de tempel en de stad Jeruzalem werden afgebeeld."},{"catchword":"plage;","tekst":"Dat is, een haastigen, van God buitengewoon toegeschikten, dood."}],"17":[{"catchword":"Houd stil van kermen,","tekst":"Dat is, kerm niet, maar zwijg stil."},{"catchword":"dodenrouw maken,","tekst":"Dat is, geen rouwtekens tonen, gelijk men over verstorven vrienden te dien tijde placht te doen."},{"catchword":"hoed op u,","tekst":"Of, huif, muts, zet op uw hoofd [gelijk onder vs.23]. Het Hebreeuwse woord heeft den naam van versieren. Integendeel plegen de rouwdragenden met het blote hoofd te gaan, en as of stof daarop te spreiden; Lev 10:6 , en Lev 21:10 ; 1Sa 4:12 ; 2Sa 15:32 ; Isa 61:3 ; Lam 2:10 ."},{"catchword":"schoenen aan uw voeten;","tekst":"Daar de rouwenden ongeschoeid of barvoets plachten te gaan; 2Sa 15:30 ."},{"catchword":"lip","tekst":"Of knevelbaard niet verhullen, bewimpelen, gelijk die plachten te doen, die in rouw waren over een groot ongeval; zie Lev 13:45 ; Mic 3:7 . Sommigen verstaan niet alleen de bovenste lip, maar voorts den mond en de kin, met de ganse plaats van den baard."},{"catchword":"brood niet eten","tekst":"Versta, leedspijs, leed of rouwmaal eten met de vrienden en naburen; zie Jer 16:7 ."}],"19":[{"catchword":"wat ons deze dingen beduiden,","tekst":"Dat is, wat zij ons betekenen, wat gij ons door deze vreemde manier van doen wilt te verstaan geven. Het woord zijn is hier bijgevoegd naar den aard der Hebreeuwse taal, gelijk elders dikwijls. Alzo onder Eze 37:18 ."}],"21":[{"catchword":"heiligdom","tekst":"Den tempel."},{"catchword":"ontheiligen,","tekst":"In handen der Chaldeën overleveren om verstoord te worden, als een gemene onheilige plaats."},{"catchword":"heerlijkheid uwer sterkte,","tekst":"Of, hoogheid, uitnemendheid uwer sterkte, dat is, dat heerlijk gebouw van den tempel, waarop gij u zozeer verlaat, menende dat Ik daarom Jeruzalem verschonen zal. Sommigen verstaan Jeruzalem of het koninkrijk."},{"catchword":"begeerte uwer ogen,","tekst":"Versta, al denzelfden tempel, in welks aanschouwing zij hun lust en vermaak plachten te nemen, en waarnaar zij nu zozeer verlangden. Sommigen verstaan hunne vrouwen, uit vs.16."},{"catchword":"verschoning uwer ziel;","tekst":"Welken tempel gij zo liefhebt, dat het u hartelijk deren en wee zou doen, indien men hem zou verwoesten. Sommigen verstaan hier de kinderen en naaste vrienden, die zij, gaande met Jojachin in de gevangenschap, te Jeruzalem gelaten hadden."}],"22":[{"catchword":"gedaan heb;","tekst":"Gij zult alsdan geen rouwteken kunnen tonen, vanwege den vloek Gods, en uwe verbaasdheid over de verschrikkelijke algemene ellenden en verwoestingen, die tempel, stad, land en het ganse volk zullen overkomen. Vergelijk hiermede zonderling Jer 16:5-8 , met de aantekening aldaar."}],"23":[{"catchword":"versmachten,","tekst":"Of, uitteren, versmelten, vanwege Gods vloed over u, gelijk onder Eze 33:10 ."},{"catchword":"zuchten","tekst":"Of, beren, tieren, uit onverduldigheid en mistroostigheid."}],"24":[{"catchword":"wonderteken zijn;","tekst":"Zie boven Eze 12:6 ."}],"25":[{"catchword":"zal het niet zijn,","tekst":"Dat is, het zal voorzeker alzo geschieden. Dit voorzegt God tot meerdere bevestiging dezer profetieën. Zie de vervulling onder Eze 33:21-22 ."},{"catchword":"sterkte,","tekst":"Den tempel, enz., gelijk boven vs.21, dat is, ten tijde als Jeruzalem ingenomen en de tempel met de stad verwoest zullen worden, en al het volk jammerlijk behandeld naar deze profetieën."},{"catchword":"vreugde huns sieraads,","tekst":"Dat is, in welks sieraad zij zich verheugen."},{"catchword":"verlangen hunner zielen,","tekst":"Hebreeuws, de opheffing; dat is, hetgeen waarnaar zij hartelijk verlangen, gelijk men omhoog naar iets reikt en langt, dat men gaarne zou bereiken willen. Zie Psa 24:4 ."}],"26":[{"catchword":"ontkomene tot u zal komen,","tekst":"Die het ontlopen is en door mijne regering tot u zal komen, om u de tijding te brengen."}],"27":[{"catchword":"opengedaan worden,","tekst":"A function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
