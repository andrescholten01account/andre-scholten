es", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En u, mensenkind, neem u een tichelsteen, leg die voor uw aangezicht en teken daarop de stad Jeruzalem.", "2": "En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.", "3": "Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "4": "Lig u ook neer op uw linkerzijde, en leg daarop de ongerechtigheid van het huis van Israël; naar het getal van de dagen dat u daarop zult liggen, zult u hun ongerechtigheid dragen.", "5": "Want Ik heb u de jaren van hun ongerechtigheid gegeven, naar het getal van de dagen: driehonderdnegentig dagen, zolang zult u de ongerechtigheid van het huis van Israël dragen.", "6": "Als u deze dagen voleindigd hebt, ligt u een tweede keer neer, op uw rechterzijde, en zult u de ongerechtigheid van het huis van Juda dragen, veertig dagen; Ik heb u gegeven elke dag voor elk jaar.", "7": "Daarom zult u uw aangezicht richten tegen de belegering van Jeruzalem, en uw arm zal ontbloot zijn; en u zult tegen haar profeteren.", "8": "En zie, Ik zal dikke touwen aan u leggen, zodat u zich niet omkeert van de ene zijde naar de andere zijde, totdat u de dagen van uw belegering voleindigd hebt.", "9": "En neem u tarwe, gerst, bonen, linzen, gierst[1] en spelt; doe die in één vat en maak daar brood van; naar het getal van de dagen dat u op uw zijde neerligt, driehonderdnegentig dagen, zult u dat eten.", "10": "Uw voedsel nu, dat u eten zult, zal in gewicht twintig sikkels per dag zijn; van tijd tot tijd zult u dat eten.", "11": "U zult ook water drinken naar een bepaalde maat, het zesde deel van een hin[2]; van tijd tot tijd zult u het drinken.", "12": "En u zult een gerstekoek eten, en die zult u bakken met drek van menselijke uitwerpselen, voor hun ogen.", "13": "En de HEERE zei: Zo zullen de kinderen van Israël hun brood onrein eten onder de heidenen, waarheen Ik hen verdrijven zal.", "14": "Toen zei ik: Ach, Heere HEERE, zie, mijn ziel is niet verontreinigd geweest; want ik heb van mijn jeugd af tot nu toe geen dood aas gegeten, of wat verscheurd is, en geen verfoeilijk vlees is in mijn mond gekomen.", "15": "En Hij zei tegen mij: Zie, Ik heb u koeienmest gegeven in plaats van mensendrek, zo zult u uw brood daarmee bereiden.", "16": "Daarna zei Hij tegen mij: Mensenkind, zie, Ik breek de staf van het brood in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met een bepaalde maat en met verbaasdheid drinken;", "17": "Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen."}, "SV": {"1": "En gij, mensenkind, neem u een tichelsteen, en leg dien voor uw aangezicht, en bewerp daarop de stad Jeruzalem.", "2": "En maak een belegering tegen haar, en bouw tegen haar sterkten, en werp tegen haar een wal op, en stel legers tegen haar, en zet tegen haar stormrammen rondom.", "3": "Verder, neem gij u een ijzeren pan, en stel ze tot een ijzeren muur tussen u en tussen die stad; en richt uw aangezicht tegen haar, dat zij in belegering kome, en gij zult ze belegeren. Dit zij den huize Israëls een teken.", "4": "Lig gij ook neder op uw linkerzijde, en leg daarop de ongerechtigheid van het huis Israëls, *naar* het getal der dagen, dat gij daarop zult liggen, zult gij hun ongerechtigheid dragen.", "5": "Want Ik heb u gegeven de jaren hunner ongerechtigheid, naar het getal der dagen, driehonderd en negentig dagen, dat gij de ongerechtigheid van het huis Israëls dragen zult.", "6": "Als gij nu deze voleinden zult, lig ten anderen male neder op uw rechterzijde, en gij zult de ongerechtigheid van het huis van Juda dragen veertig dagen; Ik heb u gegeven elken dag voor elk jaar.", "7": "Daarom zult gij uw aangezicht richten tegen de belegering van Jeruzalem, en uw arm zal ontbloot zijn; en gij zult tegen haar profeteren.", "8": "En ziet, Ik zal dikke touwen aan u leggen, dat gij u niet omkeert van uw *ene* zijde tot uw *andere* zijde, totdat gij de dagen uwer belegering voleind hebt.", "9": "En neemt gij voor u tarwe, en gerst, en bonen, en linzen, en heerse, en spelt; en doe die in een vat, en maak die u tot brood; *naar* het getal der dagen, die gij op uw zijde nederliggen zult, driehonderd en negentig dagen, zult gij dat eten.", "10": "Uw spijze nu, die gij eten zult, zal in gewicht zijn twintig sikkelen daags; van tijd tot tijd zult gij die eten.", "11": "Gij zult ook water naar *zekere* maat drinken, het zesde deel van een hin; van tijd tot tijd zult gij het drinken.", "12": "En gij zult een gerstekoek eten, en dien zult gij met drek van des mensen afgang bakken voor hun ogen.", "13": "En de HEERE zeide: Alzo zullen de kinderen Israëls hun brood onrein eten onder de heidenen, waarhenen Ik hen verdrijven zal.", "14": "Toen zeide ik: Ach, Heere, HEERE, zie, mijn ziel is niet verontreinigd geweest; want ik heb, van mijn jeugd af tot nu toe, geen dood aas, noch dat verscheurd is, gegeten, en geen verfoeilijk vlees is in mijn mond gekomen.", "15": "En Hij zeide tot mij: Zie, Ik heb u rundermest gegeven voor mensendrek, zo zult gij uw brood daarmede bereiden.", "16": "Daarna zeide Hij tot mij: Gij mensenkind, zie, Ik breek den staf des broods in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met *zekere* maat en met verbaasdheid drinken;", "17": "Opdat zij des broods en des waters gebrek hebben, en de een met den ander verbaasd worden, en in hun ongerechtigheid uitteren."}, "KJV": {"1": "Thou also, son of man, take thee a tile, and lay it before thee, and pourtray upon it the city, *even* Jerusalem:", "2": "And lay siege against it, and build a fort against it, and cast a mount against it; set the camp also against it, and set *battering* rams against it round about.", "3": "Moreover take thou unto thee an iron pan, and set it *for* a wall of iron between thee and the city: and set thy face against it, and it shall be besieged, and thou shalt lay siege against it. This *shall be* a sign to the house of Israel.", "4": "Lie thou also upon thy left side, and lay the iniquity of the house of Israel upon it: *according* to the number of the days that thou shalt lie upon it thou shalt bear their iniquity.", "5": "For I have laid upon thee the years of their iniquity, according to the number of the days, three hundred and ninety days: so shalt thou bear the iniquity of the house of Israel.", "6": "And when thou hast accomplished them, lie again on thy right side, and thou shalt bear the iniquity of the house of Judah forty days: I have appointed thee each day for a year.", "7": "Therefore thou shalt set thy face toward the siege of Jerusalem, and thine arm *shall be* uncovered, and thou shalt prophesy", "8": "And, behold, I will lay bands upon thee, and thou shalt not turn thee from one side to another, till thou hast ended the days of thy siege.", "9": "Take thou also unto thee wheat, and barley, and beans, and lentiles, and millet, and fitches, and put them in one vessel, and make thee bread thereof, *according* to the number of the days that thou shalt lie upon thy side, three hundred and ninety days shalt thou eat", "10": "And thy meat which thou shalt eat *shall be* by weight, twenty shekels a day: from time to time shalt thou eat", "11": "Thou shalt drink also water by measure, the sixth part of an hin: from time to time shalt thou drink.", "12": "And thou shalt eat it *as* barley cakes, and thou shalt bake it with dung that cometh out of man, in their sight.", "13": "And the LORD said, Even thus shall the children of Israel eat their defiled bread among the Gentiles, whither I will drive", "14": "Then said I, Ah Lord GOD! behold, my soul hath not been polluted: for from my youth up even till now have I not eaten of that which dieth of itself, or is torn in pieces; neither came there abominable flesh into my mouth.", "15": "Then he said unto me, Lo, I have given thee cow's dung for man's dung, and thou shalt prepare thy bread", "16": "Moreover he said unto me, Son of man, behold, I will break the staff of bread in Jerusalem: and they shall eat bread by weight, and with care; and they shall drink water by measure, and with astonishment:", "17": "That they may want bread and water, and be astonied one with another, and consume away for their iniquity."}}, "tsk": {"1": [{"kopje": "neem", "refs": ["Ezech 5:1-17", "Ezech 12:3-16", "1 Sam 15:27", "1 Sam 15:28", "1 Kon 11:30", "1 Kon 11:31", "Jes 20:2-4", "Jer 13:1-14", "Jer 18:2-12", "Jer 19:1-15", "Jer 25:15-38", "Jer 27:2-22", "Hos 1:2-9", "Hos 3:1-5", "Hos 12:11"]}, {"kopje": "en", "refs": ["Jer 6:6", "Jer 32:31", "Amos 3:2"]}], "2": [{"kopje": "bouw", "refs": ["Jer 39:1", "Jer 39:2", "Jer 52:4", "Luk 19:42-44"]}, {"kopje": "stormrammen", "refs": ["Ezech 21:22"]}], "3": [{"kopje": "een ijzeren pan", "refs": ["Lev 2:5"]}, {"kopje": "Dit", "refs": ["Ezech 12:6", "Ezech 12:11", "Ezech 24:24-27", "Jes 8:18", "Jes 20:3", "Luk 2:34", "Hebr 2:4"]}], "4": [{"kopje": "op", "refs": ["Ezech 4:5", "Ezech 4:8"]}, {"kopje": "en leg", "refs": ["2 Kon 17:21-23"]}, {"kopje": "zult u hun ongerechtigheid dragen", "refs": ["Lev 10:17", "Lev 16:22", "Num 14:34", "Num 18:1", "Jes 53:11", "Jes 53:12", "Matt 8:17", "Hebr 9:28", "1 Petr 2:24"]}], "5": [{"kopje": "Ik heb", "refs": ["Jes 53:6"]}, { stig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden. En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Jer 37:5": "En het leger van Farao was uit Egypte weggetrokken; en toen de Chaldeeën, die Jeruzalem belegerden, het gerucht over hen gehoord hadden, trokken zij van Jeruzalem weg.)", "Ezech 24:24-27": "Zo zal Ezechiël voor u een wonderteken zijn; naar alles wat hij gedaan heeft, zult u doen; wanneer dit komt, zult u weten, dat Ik de Heere HEERE ben. En u, mensenkind! zal het niet zo zijn, op de dag dat Ik van hen wegneem hun sterkte, de vreugde van hun sieraad, de lust van hun ogen en het verlangen van hun zielen, hun zonen en hun dochters; Dat op diezelfde dag iemand die ontkomen is naar u toe zal komen, om het u met eigen oren te laten horen?", "Ex 30:24": "Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin.", "Lev 11:39": "En wanneer van de dieren die u tot voedsel zijn iets zal gestorven zijn, wie het kadaver ervan aangeraakt zal hebben, zal onrein zijn tot de avond.", "Jer 27:2-22": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda. En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen:", "Jer 39:2": "In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken.", "Lev 19:7": "En als het op de derde dag toch gegeten wordt, is het een afschuwelijk ding, het zal niet aangenaam zijn.", "Jer 32:31": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "Deut 20:19": "Wanneer u een stad vele dagen zult belegeren, strijdend tegen haar, om die in te nemen, dan zult u haar geboomte niet verderven door de bijl daaraan te slaan; want u zult daarvan eten; daarom zult u dat niet omhakken (want het geboomte van het veld is het voedsel van de mens), opdat het voor uw aangezicht dient tot een bolwerk.", "Ezech 27:19": "Ook leverden Dan en Javan, de omreizer, op uw markten; glad ijzer, kassie en kalmoes was in uw onderlinge koophandel.", "Ezech 14:13": "Mensenkind, als een land tegen Mij zondigt door zwaar te overtreden, dan zal Ik Mijn hand daartegen uitstrekken, en de staf van het brood daarvan breken, en een honger daarin zenden, zodat Ik daaruit mensen en beesten uitroei;", "2 Sam 20:15": "En zij kwamen en belegerden hem in Abel Beth-Maächa, en zij wierpen een wal op tegen de stad, zodat hij tegen de buitenmuur stond; en al het volk dat met Joab was, beschadigde de muur, om die neer te vellen.", "Ex 29:40": "Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Ezech 5:1-17": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "Luk 19:42-44": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven; en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "Deut 28:23": "En uw hemel, die boven uw hoofd is, zal koper zijn, en de aarde, die onder u is, zal ijzer zijn.", "Jer 51:53": "Al klom Babel ten hemel op, en al maakte zij de hoogte van haar sterkte vast, toch zullen haar verstoorders van Mij overkomen, spreekt de HEERE.", "Jes 24:1": "Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "2 Kon 17:21-23": "Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen. Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af; Totdat de HEERE Israël van Zijn aangezicht wegdeed, zoals Hij gesproken had door de dienst van al Zijn knechten, de profeten; zo werd Israël weggevoerd uit zijn land naar Assyrië, tot op deze dag.", "Ezech 17:17": "Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "Lev 2:5": "En indien uw offer een spijsoffer is, in de pan gebakken, zal het van ongezuurde meelbloem zijn, met olie gemengd.", "Neh 4:2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "Jer 25:15-38": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "2 Kon 23:3": "De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "Jer 18:2-12": "Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven. En het vat dat hij maakte werd verdorven, als leem, in de hand van de pottenbakker; toen maakte hij daarvan weer een ander vat, zoals het goed was in de ogen van de pottenbakker om te maken.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Jes 28:25-27": "Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats. En zijn God onderricht hem over de juiste wijze, Hij leert het hem. Want men dorst de wikken niet met de dorswagen, en men laat het wagenrad niet rondom over het komijn gaan; maar de wikken slaat men uit met een staf, en het komijn met een stok;", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Klaagl 4:10": "Jod. De handen van barmhartige vrouwen hebben hun eigen kinderen gekookt; zij zijn hun tot voedsel geworden bij de ondergang van de dochter van mijn volk.", "Openb 11:3": "En Ik zal Mijn twee getuigen macht geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Ezech 5:17": "Ja, honger en boos gedierte, die u van kinderen zullen beroven, zal Ik over u zenden; ook zal pest en bloed onder u omgaan; en het zwaard zal Ik over u brengen; Ik, de HEERE, heb het gesproken!", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Ezech 21:22": "De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen.", "1 Kron 21:12": "Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.", "Jer 19:1-15": "Zo zegt de HEERE: Ga heen en koop een pottenbakkerskruik, en neem tot u van de oudsten van het volk, en van de oudsten van de priesters. En ga uit naar het dal van de zoon van Hinnom, dat voor de deur van de Zonnepoort is, en roep daar de woorden uit, die Ik tot u spreken zal; En zeg: Hoort het woord van de HEERE, koningen van Juda en inwoners van Jeruzalem! Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal een kwaad brengen over deze plaats, waarvan een ieder die het hoort, zijn oren zullen klinken;", "Ezech 12:11": "Zeg: Ik ben uw wonderteken; zoals ik gedaan heb, zo zal hun gedaan worden; zij zullen door wegvoering in de gevangenis heengaan.", "Gen 18:6": "En Abraham haastte zich naar de tent, naar Sara, en zei: Haast u; kneed drie maten meelbloem en maak koeken.", "Ezech 7:23": "Maak een keten; want het land is vol van bloedgerichten, en de stad is vol van geweld.", "Num 15:4-10": "Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie. En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam. Of voor een ram zult u een spijsoffer bereiden, van twee tienden meelbloem, gemengd met olie, een derde deel van een hin.", "Ezech 6:2": "Mensenkind, richt uw gezicht tegen de bergen van Israël, en profeteer tegen hen;", "Lev 11:40": "Ook wie van hun kadaver gegeten zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond; en wie hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Ezech 5:10": "Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Dan 12:11": "En vanaf de tijd dat het voortdurende offer weggenomen zal zijn, en de verwoestende gruwel zal zijn opgesteld, zullen er duizend tweehonderd en negentig dagen zijn.", "Luk 5:19": "En toen zij vanwege de menigte geen manier vonden om hem naar binnen te brengen, klommen zij op het dak en lieten hem met het draagbed door de dakpannen naar beneden, midden voor Jezus.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Ex 22:31": "U moet Mij heilige mensen zijn; daarom mag u geen vlees eten dat door wilde dieren op het veld verscheurd is, u moet het aan de honden voorwerpen.", "Jer 19:11": "En u zult tegen hen zeggen: Zo zegt de HEERE van de heerscharen: Zo zal Ik dit volk en deze stad verbreken, zoals men een pottenbakkersvat verbreekt, dat niet weer heel gemaakt kan worden; en zij zullen hen in Tofeth begraven, omdat er geen andere plaats zal zijn om te begraven.", "1 Kon 12:33": "En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.", "Klaagl 1:11": "Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Hand 2:5": "En er waren Joden die in Jeruzalem woonden, godvruchtige mannen, uit alle volken die er onder de hemel zijn.", "Richt 9:31": "En hij zond in het geheim boden naar Abimelech, en zei: Zie, Gaal, de zoon van Ebed, en zijn broers zijn naar Sichem gekomen, en zie, zij zetten deze stad tegen u op.", "Jer 1:13": "En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Jes 3:1": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water;", "Klaagl 4:8": "Cheth. Maar nu is hun gedaante donkerder dan roet, men herkent hen niet op de straten; hun huid kleeft aan hun beenderen, zij is verdord, zij is geworden als hout.", "Ezech 12:3-16": "Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn. U zult dan uw gereedschap bij dag voor hun ogen naar buiten brengen, als het gereedschap van hen die vertrekken; daarna zult u in de avond uitgaan voor hun ogen, zoals zij uitgaan die vertrekken. Graaf u een gat door de wand voor hun ogen, en breng daardoor uw gereedschap naar buiten.", "Hagg 1:11": "Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over de most, en over de olie, en over wat de aardbodem zou voortbrengen; ook over de mensen, en over de dieren, en over alle arbeid van de handen.", "Jer 15:20": "Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.", "Ezech 21:6": "Maar u, mensenkind, zucht; zucht voor hun ogen met verbreking van de lenden en met bitterheid.", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Ezech 3:25": "Want wat u aangaat, mensenkind, zie, zij zullen dikke touwen aan u leggen, en zij zullen u daarmee binden; daarom zult u niet uitgaan in het midden van hen.", "Ezech 4:1-8": "En u, mensenkind, neem u een tichelsteen, leg die voor uw aangezicht en teken daarop de stad Jeruzalem. En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom. Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "Ezech 12:18": "Mensenkind, u zult uw brood eten met beven, en uw water zult u met angst en bezorgdheid drinken.", "Jes 25:12": "En Hij zal de hoge vesten van uw muren buigen, vernederen, ja, Hij zal ze tot de aarde toe, tot het stof toe, doen reiken.", "Jes 53:6": "Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Jer 29:17": "Zo zegt de HEERE van de heerscharen: Ziet, Ik zal het zwaard, de honger en de pest onder hen zenden; en Ik zal hen maken als de afschuwelijke vijgen, die vanwege hun slechtheid niet gegeten kunnen worden.", "Hos 9:17": "Mijn God zal ze verwerpen, omdat zij niet naar Hem luisteren; en zij zullen zwervend zijn onder de heidenvolken.", "Hos 3:1-5": "En de Heere zei tegen mij: Ga opnieuw heen, heb een vrouw lief, die, ook al is ze bemind door haar vriend, toch overspel doet; zoals de Heere de kinderen van Israël liefheeft, terwijl zij zich richten naar andere goden, en houden van de wijnkruiken. En ik kocht haar voor mij voor vijftien zilverstukken, en een homer gerst, en een halve homer gerst. En ik zei tegen haar: U zult veel dagen bij mij blijven zitten (u zult niet hoereren, en niet de vrouw van een andere man worden), en ik ook bij u.", "Ezech 21:7": "En het zal gebeuren, als zij tegen u zeggen: Waarom zucht u? dat u zult zeggen: Om het gerucht, want het komt! En alle hart zal wegsmelten, en alle handen zullen verslappen, en alle geest zal terugkrimpen, en alle knieën zullen wegvloeien als water; zie, het komt, en het zal gebeuren, spreekt de Heere HEERE.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "Ezech 24:23": "En uw hoofddeksels zullen op uw hoofden zijn, en uw schoenen aan uw voeten; u zult niet rouwklagen, en ook niet wenen, maar u zult wegkwijnen in uw ongerechtigheden, en ieder zal tegen zijn broeder zuchten.", "Joël 3:6": "En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "Lev 26:39": "En de overgeblevenen onder u zullen om hun ongerechtigheid in de landen van uw vijanden wegteren; ja, ook om de ongerechtigheden van hun vaderen zullen zij met hen wegteren.", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Openb 13:5": "En hem werd een mond gegeven, om grote dingen en godslasteringen te spreken; en hem werd macht gegeven om dat te doen, tweeënveertig maanden.", "Ezech 24:1-24": "Verder kwam het woord van de HEERE tot mij, in het negende jaar, in de tiende maand, op de tiende dag van de maand, en Hij zei: Mensenkind! Schrijf voor uzelf de naam van de dag op, van deze dag zelf; de koning van Babel heeft zich tegen Jeruzalem gelegerd, op deze dag zelf. En gebruik een gelijkenis tegenover dat opstandige huis, en zeg tegen hen: Zo zegt de Heere HEERE: Zet een pot toe, zet hem toe, en giet er ook water in.", "Ezech 36:19": "En Ik verstrooide hen onder de heidenen, en zij werden verspreid in de landen; Ik oordeelde ze naar hun weg en naar hun handelingen.", "Jes 22:10": "U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.", "Jer 13:1-14": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "1 Kon 11:30": "toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken.", "2 Kon 25:1-4": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Klaagl 4:9": "Teth. De gevallenen door het zwaard hebben het beter dan de gevallenen door de honger; want die kwijnen weg, als doorstoken, omdat er geen vruchten van de velden zijn.", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Deut 28:24": "De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.", "Jer 9:16": "En Ik zal hen verstrooien onder de heidenen, die zij niet gekend hebben, zij noch hun vaders; en Ik zal het zwaard achter hen zenden, totdat Ik hen verteerd zal hebben.", "Hand 10:14": "Maar Petrus zei: Geenszins, Heere! Want ik heb nog nooit iets gegeten dat gewoon of onrein was.", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Ezech 20:23": "Ik hief ook Mijn hand tot hen op in de woestijn, dat Ik hen zou verspreiden onder de heidenvolken, en hen zou verstrooien in de landen;", "Lev 26:19-29": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper. En uw macht zal voor niets verbruikt worden; en uw land zal zijn opbrengst niet geven, en het geboomte van het land zal zijn vrucht niet geven. En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen.", "Deut 28:38-42": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten. Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "2 Kron 11:11": "En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn;", "Jer 19:9": "En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "2 Sam 23:11": "Na hem nu was Samma, de zoon van Age, de Harariet. Toen de Filistijnen verzameld waren in een dorp, en daar een stuk akker was vol linzen, en het volk vluchtte voor de Filistijnen,", "Deut 20:20": "Maar het geboomte waarvan u zult weten dat het geen geboomte tot voedsel is, dat zult u verderven en omhakken; en u zult een bolwerk bouwen tegen deze stad, die tegen u oorlog voert, totdat zij valt.", "Amos 5:16": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben.", "Amos 4:6-9": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Hagg 1:10": "Daarom onthouden de hemelen zich boven u van dauw, en het land onthoudt zijn vruchten.", "Ezech 12:6": "Voor hun ogen zult u het op de schouders dragen, in het donker zult u het naar buiten brengen; uw gezicht zult u bedekken, zodat u het land niet ziet; want Ik heb u het huis van Israël tot een wonderteken gegeven.", "Ps 60:5": "U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Jes 20:2-4": "In dezelfde tijd sprak de HEERE, door de dienst van Jesaja, de zoon van Amoz, en Hij zei: Ga heen, en maak de zak van uw lendenen los, en doe uw schoenen van uw voeten. En hij deed zo, en liep naakt en barrevoets. Toen zei de HEERE: Zoals Mijn knecht Jesaja naakt en barrevoets rondloopt, drie jaren, tot een teken en wonder over Egypte en over Morenland; zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "Ezech 5:16": "Wanneer Ik de boze pijlen van de honger tegen hen uitzenden zal, die tot verderf zullen zijn, die Ik uitzenden zal om u te verderven; zo zal Ik de honger over u vermeerderen, en u de staf van het brood breken.", "Openb 6:5-8": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand. En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet. En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!", "Ezech 4:1-3": "En u, mensenkind, neem u een tichelsteen, leg die voor uw aangezicht en teken daarop de stad Jeruzalem. En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom. Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Num 28:7": "En zijn drankoffer zal zijn het vierendeel van een hin, voor het ene lam; in het heiligdom zult u het drankoffer van de sterke drank de HEERE offeren.", "Num 28:14": "En hun drankoffers zullen zijn de helft van een hin bij een stier, en een derde deel van een hin bij een ram, en een vierendeel van een hin wijn bij een lam; dat is het brandoffer van de nieuwe maan in elke maand, naar de maanden van het jaar.", "Lev 10:17": "Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE.", "Ezech 12:3-7": "Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn. U zult dan uw gereedschap bij dag voor hun ogen naar buiten brengen, als het gereedschap van hen die vertrekken; daarna zult u in de avond uitgaan voor hun ogen, zoals zij uitgaan die vertrekken. Graaf u een gat door de wand voor hun ogen, en breng daardoor uw gereedschap naar buiten.", "Jes 14:30": "En de eerstgeborenen van de armen zullen weiden, en de behoeftigen zullen zeker neerliggen; uw wortel daarentegen zal Ik door de honger doden, en uw overblijfsel zal hij ombrengen.", "Jer 39:1": "In het negende jaar van Zedekia, koning van Juda, in de tiende maand, kwam Nebukadrezar, de koning van Babel, en al zijn leger, tegen Jeruzalem, en zij belegerden haar.", "Lev 16:22": "Zo zal die bok op zich al hun ongerechtigheden naar een afgezonderd land wegdragen; en hij zal die bok in de woestijn laten wegbrengen.", "Jer 52:30": "In het drieëntwintigste jaar van Nebukadrezar voerde Nebuzaradan, de leider van de lijfwacht, gevankelijk weg van de Joden zevenhonderdvijfenveertig zielen. Alle zielen zijn vierduizend zeshonderd.", "Ezech 26:9": "En hij zal muurbrekers tegen uw muren stellen, en uw torens met zijn zwaarden afbreken.", "2 Kon 23:23": "Maar in het achttiende jaar van koning Josia, werd dit pascha voor de HEERE te Jeruzalem gehouden.", "Jer 14:15-22": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten. Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "Num 28:5": "En een tiende deel van een efa meelbloem als spijsoffer, gemengd met het vierendeel van een hin gestoten olie.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ps 107:33": "Hij maakt van rivieren een woestijn, en van waterbronnen dorstig land.", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Lev 17:15": "En elke ziel onder de inboorlingen of onder de vreemdelingen, die een dood aas of het verscheurde zal gegeten hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond; daarna zal hij rein zijn.", "Ps 105:16": "Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Jer 19:10": "Dan zult u de kruik verbreken voor de ogen van de mannen, die met u meegegaan zijn;", "Jes 66:17": "Wie zichzelf heiligen, en zichzelf reinigen in de hoven, achter één in het midden van die, die zwijnenvlees eten, en verfoeisel, en muizen; samen zullen zij verteerd worden, spreekt de HEERE.", "Ezech 4:4-8": "Lig u ook neer op uw linkerzijde, en leg daarop de ongerechtigheid van het huis van Israël; naar het getal van de dagen dat u daarop zult liggen, zult u hun ongerechtigheid dragen. Want Ik heb u de jaren van hun ongerechtigheid gegeven, naar het getal van de dagen: driehonderdnegentig dagen, zolang zult u de ongerechtigheid van het huis van Israël dragen. Als u deze dagen voleindigd hebt, ligt u een tweede keer neer, op uw rechterzijde, en zult u de ongerechtigheid van het huis van Juda dragen, veertig dagen; Ik heb u gegeven elke dag voor elk jaar.", "Ezech 9:8": "Het gebeurde nu, toen zij hen geslagen hadden en ik overgebleven was, dat ik op mijn aangezicht viel, en riep, en zei: Ach, Heere HEERE, zult U het hele overblijfsel van Israël verderven, door Uw grimmigheid uit te gieten over Jeruzalem?", "Ezech 5:1-4": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "Nahum 3:14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "Ezech 12:19": "En u zult tegen het volk van het land zeggen: Zo zegt de Heere HEERE, over de inwoners van Jeruzalem, in het land Israël: Zij zullen hun brood met bezorgdheid eten, en hun water zullen zij met ontzetting drinken, omdat hun land woest zal worden en zijn overvloed zal verliezen, vanwege het geweld van allen die daarin wonen;", "Joël 3:20": "Maar Juda zal blijven tot in eeuwigheid, en Jeruzalem van geslacht tot geslacht.", "2 Kon 8:1": "Elisa had tegen de vrouw gesproken, van wie hij de zoon levend gemaakt had. Hij zei: Maak u klaar, en ga weg, u en uw huisgezin, en woon als vreemdeling waar u maar wonen kunt; want de HEERE heeft een hongersnood aangekondigd, die ook zeven jaar lang over het land zal komen.", "Jes 20:3": "Toen zei de HEERE: Zoals Mijn knecht Jesaja naakt en barrevoets rondloopt, drie jaren, tot een teken en wonder over Egypte en over Morenland;", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Ezech 4:9-15": "En neem u tarwe, gerst, bonen, linzen, gierst en spelt; doe die in één vat en maak daar brood van; naar het getal van de dagen dat u op uw zijde neerligt, driehonderdnegentig dagen, zult u dat eten. Uw voedsel nu, dat u eten zult, zal in gewicht twintig sikkels per dag zijn; van tijd tot tijd zult u dat eten. U zult ook water drinken naar een bepaalde maat, het zesde deel van een hin; van tijd tot tijd zult u het drinken.", "Jer 6:6": "Want zo zegt de HEERE van de heerscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "Jes 29:3": "Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Hos 1:2-9": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon. En de Heere zei tegen hem: Noem zijn naam Jizreël, want nog een korte tijd, en Ik zal de bloedschuld van Jizreël bezoeken over het huis van Jehu, en Ik zal het koninkrijk van het huis van Israël doen ophouden.", "Klaagl 5:9": "Wij moeten ons brood met gevaar voor ons leven halen, vanwege het zwaard van de woestijn.", "Dan 12:12": "Gelukkig is hij die verwacht en komt tot duizend driehonderd vijfendertig dagen.", "Openb 11:2": "En laat het voorhof erbuiten, dat van buiten de tempel is, en meet dat niet, want het is aan de heidenen gegeven; en zij zullen de heilige stad vertrappen, tweeënveertig maanden.", "Matt 24:7": "Want het ene volk zal tegen het andere volk opstaan, en het ene koninkrijk tegen het andere koninkrijk; en er zullen hongersnoden zijn, en pestilentiën, en aardbevingen op verschillende plaatsen.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Dan 11:15": "En de koning van het Noorden zal komen, en een wal opwerpen, en versterkte steden innemen; en de legers van het Zuiden zullen niet standhouden, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om stand te houden.", "1 Kon 11:31": "En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "1 Sam 15:28": "Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Lev 23:13": "en zijn spijsoffer twee tienden meelbloem, met olie gemengd, tot een vuuroffer, voor de HEERE tot een liefelijke reuk; en zijn drankoffer van wijn, het vierde deel van een hin.", "Klaagl 5:5": "Wij worden vervolgd, met een juk op onze nek; zijn wij moe, men laat ons geen rust.", "Jes 65:4": "Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten.", "Jer 19:1": "Zo zegt de HEERE: Ga heen en koop een pottenbakkerskruik, en neem tot u van de oudsten van het volk, en van de oudsten van de priesters.", "Jer 51:63": "En het zal gebeuren, als u deze rol geheel gelezen hebt, dat u er een steen aan zult binden, en hem zult werpen in het midden van de Eufraat;", "Num 14:34": "Naar het getal van de dagen waarin u dat land verspied hebt, veertig dagen, elke dag voor elk jaar, zult u uw ongerechtigheden dragen, veertig jaar, en u zult Mijn tegenwerking ervaren.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Jer 27:3": "En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "2 Sam 17:28": "Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd,", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Luk 21:11": "En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.", "Ezech 4:12-15": "En u zult een gerstekoek eten, en die zult u bakken met drek van menselijke uitwerpselen, voor hun ogen. En de HEERE zei: Zo zullen de kinderen van Israël hun brood onrein eten onder de heidenen, waarheen Ik hen verdrijven zal. Toen zei ik: Ach, Heere HEERE, zie, mijn ziel is niet verontreinigd geweest; want ik heb van mijn jeugd af tot nu toe geen dood aas gegeten, of wat verscheurd is, en geen verfoeilijk vlees is in mijn mond gekomen.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Ezech 26:8": "Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen.", "Ezech 4:9-17": "En neem u tarwe, gerst, bonen, linzen, gierst en spelt; doe die in één vat en maak daar brood van; naar het getal van de dagen dat u op uw zijde neerligt, driehonderdnegentig dagen, zult u dat eten. Uw voedsel nu, dat u eten zult, zal in gewicht twintig sikkels per dag zijn; van tijd tot tijd zult u dat eten. U zult ook water drinken naar een bepaalde maat, het zesde deel van een hin; van tijd tot tijd zult u het drinken.", "Deut 14:3": "U zult geen gruwel eten.", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Ezech 4:1-13": "En u, mensenkind, neem u een tichelsteen, leg die voor uw aangezicht en teken daarop de stad Jeruzalem. En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom. Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "Jer 43:9": "Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen;", "Joh 7:35": "De Joden zeiden dan tegen elkaar: Waar zal Deze heengaan, dat wij Hem niet zullen vinden? Zal Hij naar de verstrooide Grieken gaan, en de Grieken leren?", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Dan 11:19": "En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Jer 52:4": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom.", "Ezech 24:3-5": "En gebruik een gelijkenis tegenover dat opstandige huis, en zeg tegen hen: Zo zegt de Heere HEERE: Zet een pot toe, zet hem toe, en giet er ook water in. Doe de stukken ervan samen erin, alle goede stukken, de dij en de schouder, vul hem met de beste beenderen. Neem het beste van de kudde, en stook ook een brandstapel van de beenderen daaronder; laat het goed opkoken; ook zullen de beenderen erin gekookt worden.", "Amos 5:17": "Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "Openb 12:14": "En aan de vrouw werden twee vleugels van een grote arend gegeven, opdat zij zou vliegen naar de woestijn, naar haar plaats, waar zij gevoed wordt een tijd, en tijden, en een halve tijd, buiten het zicht van de slang.", "1 Sam 15:27": "Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Gen 25:34": "En Jakob gaf aan Ezau brood en het linzenkooksel; en hij at en dronk, en hij stond op en ging weg; zo verachtte Ezau het eerstgeboorterecht."}, "noten": {"1": "SV: heerse. D.i.: gierst, een graansoort.", "2": "Hin: een inhoudsmaat, ongeveer 6 liter."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">En</span> u, <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">mensenkind</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H3947\">neem</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3843\">u</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3843\">een</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3843\">tichelsteen</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H5414\">leg</span> die voor <span class=\"wl\" data-l=\"L5\" data-code=\"H6440\">uw</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6440\">aangezicht</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5414\">en</span> teken <span class=\"wl\" data-l=\"L6\" data-code=\"H5892\">daarop</span> <span class=\"wl\" data-l=\"L6\" data > <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> into my mouth.", "15": "Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H7200\">Lo,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee <span class=\"wl wl-kjv\" data-code=\"H1241\">cow's</span> <span class=\"wl wl-kjv\" data-code=\"H6832\">dung</span> for <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H1561\">dung,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">prepare</span> thy bread", "16": "Moreover he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> behold, I will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> by <span class=\"wl wl-kjv\" data-code=\"H4948\">weight,</span> and with <span class=\"wl wl-kjv\" data-code=\"H1674\">care;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> by <span class=\"wl wl-kjv\" data-code=\"H4884\">measure,</span> and with astonishment:", "17": "That they may <span class=\"wl wl-kjv\" data-code=\"H2637\">want</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonied</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> and consume <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> for their iniquity."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
