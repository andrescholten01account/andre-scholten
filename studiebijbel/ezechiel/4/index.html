daarop de stad Jeruzalem.","2":"En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.","3":"Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.","4":"Lig u ook neer op uw linkerzijde, en leg daarop de ongerechtigheid van het huis van Israël; naar het getal van de dagen dat u daarop zult liggen, zult u hun ongerechtigheid dragen.","5":"Want Ik heb u de jaren van hun ongerechtigheid gegeven, naar het getal van de dagen: driehonderdnegentig dagen, zolang zult u de ongerechtigheid van het huis van Israël dragen.","6":"Als u deze dagen voleindigd hebt, ligt u een tweede keer neer, op uw rechterzijde, en zult u de ongerechtigheid van het huis van Juda dragen, veertig dagen; Ik heb u gegeven elke dag voor elk jaar.","7":"Daarom zult u uw aangezicht richten tegen de belegering van Jeruzalem, en uw arm zal ontbloot zijn; en u zult tegen haar profeteren.","8":"En zie, Ik zal dikke touwen aan u leggen, zodat u zich niet omkeert van de ene zijde naar de andere zijde, totdat u de dagen van uw belegering voleindigd hebt.","9":"En neem u tarwe, gerst, bonen, linzen, gierst[1] en spelt; doe die in één vat en maak daar brood van; naar het getal van de dagen dat u op uw zijde neerligt, driehonderdnegentig dagen, zult u dat eten.","10":"Uw voedsel nu, dat u eten zult, zal in gewicht twintig sikkels per dag zijn; van tijd tot tijd zult u dat eten.","11":"U zult ook water drinken naar een bepaalde maat, het zesde deel van een hin[2]; van tijd tot tijd zult u het drinken.","12":"En u zult een gerstekoek eten, en die zult u bakken met drek van menselijke uitwerpselen, voor hun ogen.","13":"En de HEERE zei: Zo zullen de kinderen van Israël hun brood onrein eten onder de heidenen, waarheen Ik hen verdrijven zal.","14":"Toen zei ik: Ach, Heere HEERE, zie, mijn ziel is niet verontreinigd geweest; want ik heb van mijn jeugd af tot nu toe geen dood aas gegeten, of wat verscheurd is, en geen verfoeilijk vlees is in mijn mond gekomen.","15":"En Hij zei tegen mij: Zie, Ik heb u koeienmest gegeven in plaats van mensendrek, zo zult u uw brood daarmee bereiden.","16":"Daarna zei Hij tegen mij: Mensenkind, zie, Ik breek de staf van het brood in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met een bepaalde maat en met verbaasdheid drinken;","17":"Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen."},"SV":{"1":"En gij, mensenkind, neem u een tichelsteen, en leg dien voor uw aangezicht, en bewerp daarop de stad Jeruzalem.","2":"En maak een belegering tegen haar, en bouw tegen haar sterkten, en werp tegen haar een wal op, en stel legers tegen haar, en zet tegen haar stormrammen rondom.","3":"Verder, neem gij u een ijzeren pan, en stel ze tot een ijzeren muur tussen u en tussen die stad; en richt uw aangezicht tegen haar, dat zij in belegering kome, en gij zult ze belegeren. Dit zij den huize Israëls een teken.","4":"Lig gij ook neder op uw linkerzijde, en leg daarop de ongerechtigheid van het huis Israëls, *naar* het getal der dagen, dat gij daarop zult liggen, zult gij hun ongerechtigheid dragen.","5":"Want Ik heb u gegeven de jaren hunner ongerechtigheid, naar het getal der dagen, driehonderd en negentig dagen, dat gij de ongerechtigheid van het huis Israëls dragen zult.","6":"Als gij nu deze voleinden zult, lig ten anderen male neder op uw rechterzijde, en gij zult de ongerechtigheid van het huis van Juda dragen veertig dagen; Ik heb u gegeven elken dag voor elk jaar.","7":"Daarom zult gij uw aangezicht richten tegen de belegering van Jeruzalem, en uw arm zal ontbloot zijn; en gij zult tegen haar profeteren.","8":"En ziet, Ik zal dikke touwen aan u leggen, dat gij u niet omkeert van uw *ene* zijde tot uw *andere* zijde, totdat gij de dagen uwer belegering voleind hebt.","9":"En neemt gij voor u tarwe, en gerst, en bonen, en linzen, en heerse, en spelt; en doe die in een vat, en maak die u tot brood; *naar* het getal der dagen, die gij op uw zijde nederliggen zult, driehonderd en negentig dagen, zult gij dat eten.","10":"Uw spijze nu, die gij eten zult, zal in gewicht zijn twintig sikkelen daags; van tijd tot tijd zult gij die eten.","11":"Gij zult ook water naar *zekere* maat drinken, het zesde deel van een hin; van tijd tot tijd zult gij het drinken.","12":"En gij zult een gerstekoek eten, en dien zult gij met drek van des mensen afgang bakken voor hun ogen.","13":"En de HEERE zeide: Alzo zullen de kinderen Israëls hun brood onrein eten onder de heidenen, waarhenen Ik hen verdrijven zal.","14":"Toen zeide ik: Ach, Heere, HEERE, zie, mijn ziel is niet verontreinigd geweest; want ik heb, van mijn jeugd af tot nu toe, geen dood aas, noch dat verscheurd is, gegeten, en geen verfoeilijk vlees is in mijn mond gekomen.","15":"En Hij zeide tot mij: Zie, Ik heb u rundermest gegeven voor mensendrek, zo zult gij uw brood daarmede bereiden.","16":"Daarna zeide Hij tot mij: Gij mensenkind, zie, Ik breek den staf des broods in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met *zekere* maat en met verbaasdheid drinken;","17":"Opdat zij des broods en des waters gebrek hebben, en de een met den ander verbaasd worden, en in hun ongerechtigheid uitteren."},"KJV":{"1":"Thou also, son of man, take thee a tile, and lay it before thee, and pourtray upon it the city, *even* Jerusalem:","2":"And lay siege against it, and build a fort against it, and cast a mount against it; set the camp also against it, and set *battering* rams against it round about.","3":"Moreover take thou unto thee an iron pan, and set it *for* a wall of iron between thee and the city: and set thy face against it, and it shall be besieged, and thou shalt lay siege against it. This *shall be* a sign to the house of Israel.","4":"Lie thou also upon thy left side, and lay the iniquity of the house of Israel upon it: *according* to the number of the days that thou shalt lie upon it thou shalt bear their iniquity.","5":"For I have laid upon thee the years of their iniquity, according to the number of the days, three hundred and ninety days: so shalt thou bear the iniquity of the house of Israel.","6":"And when thou hast accomplished them, lie again on thy right side, and thou shalt bear the iniquity of the house of Judah forty days: I have appointed thee each day for a year.","7":"Therefore thou shalt set thy face toward the siege of Jerusalem, and thine arm *shall be* uncovered, and thou shalt prophesy","8":"And, behold, I will lay bands upon thee, and thou shalt not turn thee from one side to another, till thou hast ended the days of thy siege.","9":"Take thou also unto thee wheat, and barley, and beans, and lentiles, and millet, and fitches, and put them in one vessel, and make thee bread thereof, *according* to the number of the days that thou shalt lie upon thy side, three hundred and ninety days shalt thou eat","10":"And thy meat which thou shalt eat *shall be* by weight, twenty shekels a day: from time to time shalt thou eat","11":"Thou shalt drink also water by measure, the sixth part of an hin: from time to time shalt thou drink.","12":"And thou shalt eat it *as* barley cakes, and thou shalt bake it with dung that cometh out of man, in their sight.","13":"And the LORD said, Even thus shall the children of Israel eat their defiled bread among the Gentiles, whither I will drive","14":"Then said I, Ah Lord GOD! behold, my soul hath not been polluted: for from my youth up even till now have I not eaten of that which dieth of itself, or is torn in pieces; neither came there abominable flesh into my mouth.","15":"Then he said unto me, Lo, I have given thee cow's dung for man's dung, and thou shalt prepare thy bread","16":"Moreover he said unto me, Son of man, behold, I will break the staff of bread in Jerusalem: and they shall eat bread by weight, and with care; and they shall drink water by measure, and with astonishment:","17":"That they may want bread and water, and be astonied one with another, and consume away for their iniquity."}},"tsk":{"1":[{"kopje":"neem","refs":["Ezech 5:1-17","Ezech 12:3-16","1 Sam 15:27","1 Sam 15:28","1 Kon 11:30","1 Kon 11:31","Jes 20:2-4","Jer 13:1-14","Jer 18:2-12","Jer 19:1-15","Jer 25:15-38","Jer 27:2-22","Hos 1:2-9","Hos 3:1-5","Hos 12:11"]},{"kopje":"en","refs":["Jer 6:6","Jer 32:31","Amos 3:2"]}],"2":[{"kopje":"bouw","refs":["Jer 39:1","Jer 39:2","Jer 52:4","Luk 19:42-44"]},{"kopje":"stormrammen","refs":["Ezech 21:22"]}],"3":[{"kopje":"een ijzeren pan","refs":["Lev 2:5"]},{"kopje":"Dit","refs":["Ezech 12:6","Ezech 12:11","Ezech 24:24-27","Jes 8:18","Jes 20:3","Luk 2:34","Hebr 2:4"]}],"4":[{"kopje":"op","refs":["Ezech 4:5","Ezech 4:8"]},{"kopje":"en leg","refs":["2 Kon 17:21-23"]},{"kopje":"zult u hun ongerechtigheid dragen","refs":["Lev 10:17","Lev 16:22","Num 14:34","Num 18:1","Jes 53:11","Jes 53:12","Matt 8:17","Hebr 9:28","1 Petr 2:24"]}],"5":[{"kopje":"Ik heb","refs":["Jes 53:6"]},{"kopje":"driehonderdnegentig","refs":["1 Kon 12:33","Jer 52:30"]}],"6":[{"kopje":"veertig dagen","refs":["Ezech 4:9","2 Kon 25:1-4","Jer 37:5","2 Kon 23:3","2 Kon 23:23","Jer 52:30"]},{"kopje":"elke dag voor elk jaar","refs":["Num 14:34","Dan 9:24-26","Dan 12:11","Dan 12:12","Openb 9:15","Openb 11:2","Openb 11:3","Openb 12:14","Openb 13:5"]}],"7":[{"kopje":"richten","refs":["Ezech 4:3","Ezech 6:2"]},{"kopje":"en uw","refs":["Jes 52:10"]}],"8":[{"kopje":"Ik zal","refs":["Ezech 3:25"]}],"9":[{"kopje":"tarwe","refs":["Ezech 4:13","Ezech 4:16"]},{"kopje":"driehonderdnegentig","refs":["Ezech 4:5"]}],"11":[{"kopje":"zult u het drinken","refs":["Ezech 4:16","Jes 5:13","Joh 3:34"]}],"12":[{"kopje":"koek","refs":["Gen 18:6"]}],"14":[{"kopje":"Ach","refs":["Ezech 9:8","Ezech 20:49","Jer 1:6"]},{"kopje": wl wl-kjv\" data-code=\"H4227\">pan,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it for a <span class=\"wl wl-kjv\" data-code=\"H7023\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> between thee and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and <span class=\"wl wl-kjv\" data-code=\"H3559\">set</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> against it, and it shall be <span class=\"wl wl-kjv\" data-code=\"H4692\">besieged,</span> and thou shalt lay <span class=\"wl wl-kjv\" data-code=\"H6696\">siege</span> against it. This shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","4":"<span class=\"wl wl-kjv\" data-code=\"H7901\">Lie</span> thou also upon thy <span class=\"wl wl-kjv\" data-code=\"H8042\">left</span> <span class=\"wl wl-kjv\" data-code=\"H6654\">side,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> upon it: according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> upon it thou shalt <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their iniquity.","5":"For I have <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> upon thee the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8673\">ninety</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> so shalt thou <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel.","6":"And when thou hast <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished</span> <span class=\"wl wl-kjv\" data-code=\"H428\">them,</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> <span class=\"wl wl-kjv\" data-code=\"H8145\">again</span> on thy <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H6654\">side,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">appointed</span> thee each <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> for a <span class=\"wl wl-kjv\" data-code=\"H8141\">year.</span>","7":"Therefore thou shalt <span class=\"wl wl-kjv\" data-code=\"H3559\">set</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2834\">uncovered,</span> and thou shalt prophesy","8":"And, behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">bands</span> upon thee, and thou shalt not <span class=\"wl wl-kjv\" data-code=\"H2015\" by <span class=\"wl wl-kjv\" data-code=\"H4884\">measure,</span> and with astonishment:","17":"That they may <span class=\"wl wl-kjv\" data-code=\"H2637\">want</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonied</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> and consume <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> for their iniquity."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"tichelsteen,","tekst":"Versta, een platvormige effen tafel van tichelsteen gemaakt, waarop men iets schrijven, graveren of afbeelden kon; gelijk bij ons de schalen tot zulk een einde gebruikt worden."},{"catchword":"ontwerp daarop de stad Jeruzalem","tekst":"Het woord betekent hier eigenlijk uitdrukken, insnijden, afmalen, graveren met een griffel; vergelijk onder Eze 23:14 ."}],"2":[{"catchword":"maak een belegering tegen haar,","tekst":"Te weten in afbeelding, of schildering."},{"catchword":"sterkten,","tekst":"Zie van het Hebreeuwse woord 2Ki 25:1 ."},{"catchword":"werp tegen haar","tekst":"Hebreeuws, stort, of giet uit."},{"catchword":"wal op,","tekst":"Zie 2Sa 20:15 ."},{"catchword":"stormrammen rondom","tekst":"Te weten waarmede de muren der steden en sterkten gebroken worden; genaamd bij de Latijnen arietes. Het woord betekent ook hoofdmannen, of krijgsoversten, gelijk 2Ki 11:4 , 2Ki 11:19 , in welken zin het hier ook van enige genomen wordt, gelijk ook onder Eze 21:22 ."}],"3":[{"catchword":"een ijzeren pan,","tekst":"Te weten tot een teken van Gods vast en onbeweeglijk voornemen, dat Hij had om Jeruzalem te verderven en niet te verschonen."},{"catchword":"richt uw aangezicht tegen haar,","tekst":"Dat is, heb een vast voornemen om die door de belegering uit te roeien; vergelijk de manier van spreken met Lev 17:10 , en zie de aantekening. De profeet wordt hier belast in manier van afbeelding het werk te doen tegen Jeruzalem, dat God zelf voorhad; Jer 21:10 ."},{"catchword":"kome,","tekst":"Hebreeuws, worde, of zij."},{"catchword":"teken","tekst":"Te weten dat Jeruzalem zal belegerd, ingenomen en verstoord worden."}],"4":[{"catchword":"Lig gij ook neder","tekst":"Te weten tot een teken dat God zolang gelijk stil en slapende geweest was, verdragende de misdaden van zijn volk. Nu houdt men dit van den profeet geschied te zijn, niet dadelijk in zijn persoon, maar in een profetisch gezicht en afbeelding deszelven, die hij in het prediken het volk vertonen moest. Doch enigen menen dat ook iets van dezen inderdaad het volk vertoond is."},{"catchword":"linkerzijde,","tekst":"Te weten om daarmede te betekenen, dat deze eerste nederligging was ten aanzien der kinderen Israëls, [hoewel sommigen hier niet alleen de tien stammen, maar ook Juda verstaan, vanwege de gemeenschap van hunne zonden, inzonderheid der afgoderij], welker hoofdstad Samaria dengenen, die tussen dezelve en de stad Jeruzalem met hunne aangezichten naar het oosten stonden, aan de linkerzijde was, dat is noordwaarts; gelijk Jeruzalem de hoofdstad der Joden aan de rechterzijde, dat is, zuidwaarts. Of, versta door de linkerzijde dat de Israëlieten de onwaardigsten waren van Gods volk, omdat zij onder Jerobeam van den rechten godsdienst afgevallen waren; zie onder vs.6."},{"catchword":"naar het getal der dagen,","tekst":"Dit woord is hier ingevoegd uit vs.5."},{"catchword":"hun ongerechtigheid dragen","tekst":"Te weten niet als Christus, om de schuld en de straf der ongerechtigheid door voldoening weg te nemen, maar als een goddelijk teken hun door deze afbeelding voorgesteld, beduidende Gods lankmoedigheid, waardoor Hij vele jaren hunne moedwilligheid verdragen had, en de zwaarheid der straf, die zij nu hadden te verwachten."}],"5":[{"catchword":"gegeven","tekst":"Dat is, bescheiden, geordineerd en bevolen, om zoveel dagen, als die jaren zijn, hunne ongerechtigheid te dragen."},{"catchword":"de jaren hunner ongerechtigheid,","tekst":"Welke hier door de dagen der nederligging van den profeet, gelijk volgt, te kennen gegeven worden. Zij zijn in getal drie honderd en negentig, beginnende van den afval der tien stammen onder Jerobeam; 1Ki 12:16 ; 2Ch 10:16 ; waarop ook terstond gevolgd is de afval der Joden, 1Ki 14:22 ; 2Ch 12:1 ; en eindigende met de belegering of innemening der stad Jeruzalem en de verstoring van den tempel, geschied door Nebukadnezar, 2Ki 25 , 2Ch 36 ; welverstaande, dat onder de voorgemelde drie honderd en negentig jaren ook begrepen zijn de veertig jaren gemeld in vs.6, van welke begin zie aldaar. Dit is af te nemen uit vs.9, waar den profeet de leeftocht voorgeschreven wordt, alleen voor drie honderd en negentig dagen. Eenigen beginnen de jaren, door deze dagen betekend, van het zeven en twintigste jaar van den koning Salomo, als hij en het land begonnen in openbare afgoderij te vervallen; 1Ki 11:4 ."},{"catchword":"driehonderd en negentig dagen,","tekst":"Dit getal wordt alzo juist gesteld, omdat de vaste en nauwe belegering van Jeruzalem zoveel tijd duren zou, overeenkomende met den tijd der jaren, in welken de Israëlieten en Joden zich met de afgoderij besmet hadden, tot een openbaar bewijs van Gods rechtvaardig oordeel. Uit Jer 52:4-6 , blijkt, dat er meer dagen zijn verlopen van het begin der belegering tot het innemen der s tad, maar men moet weten dat de belegering een tijdlang gestaakt is geweest om het optrekken der Egyptenaren, Jer 37:5 , welke tijd hier van Ezechiël wordt overgeslagen en niet gerekend."}],"6":[{"catchword":"Als gij nu deze voleinden zult,","tekst":"Dat is, als gij niet ver van het voleinden dezer dagen zult wezen, hebbende van dezelve driehonderd en vijftig afgedaan, zodat er maar veertig overblijven."},{"catchword":"lig ten anderen male neder","tekst":"Zie boven vs.4. Deze tweede nederligging was ten aanzien van de zonden der Joden."},{"catchword":"rechterzijde,","tekst":"Juda, ten aanzien van Samaria en de Israëlieten, was zuidwaarts gelegen, dat is, aan de rechterzijde der wereld; zie boven vs.4. De rechterzijde kan ook betekenen de waardigheid, die de Joden boven de Israëlieten hadden, omdat bij hen was de tempel, de godsdienst en het huis Davids."},{"catchword":"dragen","tekst":"Zie boven vs.4."},{"catchword":"veertig dagen;","tekst":"Deze dagen, die veertig jaren betekenden, worden begonnen van het achttiende jaar van het koninkrijk van Josia, in welke de Joden wel het verbond met God vernieuwd hebben, maar alzo, dat zij terstond daarna weder tot afgoderij vervallen zijn; zij worden geëindigd met de belegering of verstoring der stad Jeruzalem en des tempels, of de laatste vervoering naar Babel, geschied door Nebuzaradan; 2Ki 25 ."},{"catchword":"elken dag voor elk jaar","tekst":"Hebreeuws, een dag voor een jaar, een dag voor een jaar; zie Gen 7:2 , en Lev 24:8 ."}],"7":[{"catchword":"aangezicht","tekst":"Zie boven vs.3."},{"catchword":"de belegering van Jeruzalem,","tekst":"Dat is, het belegerde Jeruzalem."},{"catchword":"zal ontbloot zijn;","tekst":"Tot een teken dat de Chaldeën zeer vaardig, wakker en bereid zullen zijn, om Jeruzalem met geweld en met louter kracht haastelijk in te nemen. Vergelijk Jer 21:5 ."}],"8":[{"catchword":"Ik zal dikke touwen aan u leggen,","tekst":"Hij geeft hiermede te verstaan dat zijn besluit, van de stad te verderven, onveranderlijk was, en dat daarom de profeet moest volharden in dit zijn profeteren en in het voorstellen zijner profetische afbeelding."},{"catchword":"van uw ene zijde tot uw andere zijde,","tekst":"Hebreeuws, van uwe zijde tot uwe zijde."},{"catchword":"uwer","tekst":"Zijne wordt ze genaamd, omdat hem de afbeelding en de voorzegging daarvan bevolen was, of omdat ze zijne stad aangingen."},{"catchword":"belegering voleind hebt","tekst":"Anders, belegeringen; in het getal van velen, uit oorzaak dat er toenmaals twee belegeringen der stad Jeruzalem geweest zijn. Want als de Chaldeën gehoord hadden dat de koning van Egypte den koning Zedekia te hulp kwam, zijn zij van de belegering afgetrokken, maar als zij vernamen dat hij weder in Egypte gekeerd was, hebben zij de belegering hervat."}],"9":[{"catchword":"neemt gij voor u tarwe,","tekst":"Hiermede en met het volgende wordt betekend de grote benauwdheid en hongersnood, die den belegerden overkomen zou."},{"catchword":"heerse,","tekst":"Anders genaamd geerst of gierst."},{"catchword":"in een vat,","tekst":"Dat is, niet elk soort in een onderscheiden vat, maar alle ondereen gemengd in enig vat; hetwelk placht te geschieden in tijd van nood, als er groot gebrek van broodkoren is."},{"catchword":"driehonderd en negentig dagen,","tekst":"Dat is, omtrent de veertien maanden zal de belegering van Jeruzalem duren."}],"10":[{"catchword":"sikkelen daags;","tekst":"Versta gemene of burgerlijke sikkelen, van welke een deed omtrent een oordje van een rijksdaalder, Gen 20:16 ; vier van dezen maakten het gewicht van een ons; dat is, van een rijksdaalder. Zo was dan het gewicht van twintig sikkelen vijf onsen."},{"catchword":"van tijd tot tijd","tekst":"Dat is, telken dage zult gij maar zoveel eten, te weten tot een teken van hongersnood, die in Jeruzalem wezen zal. Alzo in vs.11, van den dagelijksen drank. Vergelijk 2Ki 25:3 ; Jer 37:21 ."}],"11":[{"catchword":"hin;","tekst":"Een maat van natte waren, inhoudende zoveel als in twee en zeventig gemene eierschalen zou mogen gaan. Zie Lev 19:36 . Alzo was de maat van den drank zoveel als in twaalf hoendereieren gaan Kon."}],"12":[{"catchword":"een gerstekoek eten,","tekst":"Anders: gij zult dat [als] gerstekoek eten. Versta de spijs, vermeld vs.9,10. Dat is, in zulken vorm bereid en toegemaakt als gerstekoeken."},{"catchword":"drek van des mensen afgang bakken","tekst":"Hetwelk hun in plaats van hout zou moeten wezen, om daarmede hun spijs te koken, of ook hunne koeken te bakken op een haard met mensendrek heet gemaakt. Zo wordt betekend dat ze in de belegering groot gebrek van hout zouden hebben, ja ook van vee, overmits de mist daarvan minder verfoeilijk gehouden werd."},{"catchword":"voor hun ogen","tekst":"Hieruit nemen sommigen af dat deze dingen den profeet niet alleen in een gezicht zijn vertoond geweest van God, maar dat hij ook dezelve in ene afbeelding het volk vertoond heeft."}],"13":[{"catchword":"kinderen Israëls","tekst":"Dat is, de Joden, mitsgaders die van de tien stammen onder hen woonden; zie 2Ki 21:2 ."},{"catchword":"onrein eten","tekst":"Zo wordt het genoemd om de manier of wijze der voorgemelde koning of bakking. Vergelijk Deu 23:12 , enz."},{"catchword":"heidenen,","tekst":"Versta, de Chaldeën, onder wie de Joden zouden zijn, als zij van hen belegerd en daarna weggevoerd zouden worden."}],"14":[{"catchword":"mijn ziel","tekst":"Dat is, mijn persoon. Zie 1Ki 19:4 ."},{"catchword":"verontreinigd geweest;","tekst":"Te weten met enige ceremoniele onreinheid, die velerlei is geweest, van welke drie soorten hier genoemd worden, waaronder al de andere te verstaan zijn, en die den priesters verboden waren; Lev 21 , Lev 22 ."},{"catchword":"dood aas,","tekst":"Zie van deze soort der onreinheid Lev 11:40 ."},{"catchword":"verscheurd is,","tekst":"Zie van deze soort Exo 22:31 ."},{"catchword":"verfoeilijk vlees","tekst":"Hebreeuws, vlees des verfoeisels, of des stanks; zie Lev 7:18 ."}],"15":[{"catchword":"Ik heb u rundermest gegeven voor mensendrek,","tekst":"Alzo verzacht de Heere zijn voorgaande bevel ten aanzien van den persoon des profeets, die dit voor de ogen des volks afbeelden moest, boven vs.12; maar niet ten aanzien van de Joden, die binnen Jeruzalem belegerd zouden worden."}],"16":[{"catchword":"breek den staf des broods","tekst":"Zie Lev 26:26 ."},{"catchword":"met gewicht","tekst":"Gelijk God gedreigd had; Lev 26:26 ."},{"catchword":"kommer eten,","tekst":"Te weten waardoor zij nog meerdere ellende zullen vrezen."},{"catchword":"verbaasdheid drinken;","tekst":"Dat is, waardoor zij zo verslagen zullen zijn, dat zij bedwelmd zullen staan gelijk wanhopende mensen."}],"17":[{"catchword":"Opdat zij","tekst":"Of, zodat zij des broods, enz. gebrek zullen hebben."},{"catchword":"de een met den ander verbaasd worden,","tekst":"Hebreeuws, de man en zijn broeder."},{"catchword":"in hun ongerechtigheid uitteren","tekst":"Vergelijk Lev 26:39 ; Eze 24:23 en Eze 33:10 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And thou child of man take thee a tile [ meaning a flat smooth table made of tile or brick were on a man might write engrave or make a draught of anything as with us slates are used for such purpose ]and lay it before thy face and portray the word signifieth here properly to cut in to delineate to engrave with the graver compare below chap 23 .14 ]upon it the city of Jerusalem ."}],"2":[{"catchword":null,"tekst":"And lay siege against it [to wit in portraying or delineating ] and build forts against it [ see of the Hebrew rendered here fort s 2 Kings 25 on vers 1 ] and cast up [Heb puore out ] a mount [see 2 Sam 20. on vers 15 ]against it and set camps against and set battering rams [to wit whereby the walls and the forts of cities were battered and broken down called by the latins arietes .the word signifieth also captain or commanders in war as 2 Kings 11.4 ,19 in which sense it is also taken by some as below chap 21.22.]against it round about ."}],"3":[{"catchword":null,"tekst":"Moreover take unto thee an iron pan [to wit a token of Gods firm and unmovable resolution which he had to destroy Jerusalem and not to spare it] and set it for an iron wall between thee and between that city and set thy face against it [that is have a strong resolution to destroy it by the siege compare the phrase with Levit 17.10 and see the annotate The prophet is here commanded by the way of portraying to do that work against Jerusalem which God himself intended to do Jerem 21.10 ]that it besieged [Heb that it be in siege ]and thou shalt destroy it let this be a // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
