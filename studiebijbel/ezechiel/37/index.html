n zette mij neer in het midden van een vallei; die was nu vol beenderen.","2":"En Hij deed mij daar helemaal omheen voorbijgaan; en zie, er waren er zeer veel op de grond van de vallei; en zie, ze waren zeer dor.","3":"En Hij zei tot mij: Mensenkind! Zullen deze beenderen levend worden? En ik zei: Heere HEERE, U weet *het*!","4":"Toen zei Hij tot mij: Profeteer over deze beenderen, en zeg tot hen: Dorre beenderen! Hoor het woord van de HEERE.","5":"Zo zegt de Heere HEERE tot deze beenderen: Zie, Ik zal de geest in u brengen, en u zult levend worden.","6":"En Ik zal zenuwen op u leggen, en vlees op u laten opkomen, en een huid over u trekken, en de geest in u geven, en u zult levend worden; en u zult weten dat Ik de HEERE ben.","7":"Toen profeteerde ik, zoals mij bevolen was, en er kwam een geluid, terwijl ik profeteerde, en zie, een beroering! En de beenderen kwamen bij elkaar, *elk* been bij zijn been.","8":"En ik zag, en zie, er kwamen zenuwen op hen, en er kwam vlees op; en Hij trok een huid van boven over hen, maar er was geen geest in hen.","9":"En Hij zei tot mij: Profeteer tot de geest; profeteer, mensenkind! En zeg tot de geest: Zo zegt de Heere HEERE: Geest! Kom van de vier winden, en blaas in deze gedoden, zodat zij levend worden.","10":"En ik profeteerde, zoals Hij mij bevolen had. Toen kwam de geest in hen, en zij werden levend en gingen op hun voeten staan, een geheel zeer groot leger.","11":"Toen zei Hij tot mij: Mensenkind! Deze beenderen zijn het gehele huis van Israël; zie, zij zeggen: Onze beenderen zijn verdord, en onze verwachting is verloren, wij zijn afgesneden.","12":"Daarom, profeteer en zeg tot hen: Zo zegt de Heere HEERE: Zie, Ik zal uw graven openen en zal u uit uw graven laten opkomen, o Mijn volk! En Ik zal u brengen in het land van Israël.","13":"En u zult weten dat Ik de HEERE ben, als Ik uw graven zal hebben geopend, en als Ik u uit uw graven zal hebben laten opkomen, o Mijn volk!","14":"En Ik zal Mijn Geest in u geven, en u zult leven, en Ik zal u in uw land zetten; en u zult weten dat Ik, de HEERE, *dit* gesproken en gedaan heb, spreekt de HEERE.","15":"Verder gebeurde het dat het woord van de HEERE tot mij kwam:","16":"U dan, mensenkind! Neem een stuk hout, en schrijf daarop: Voor Juda, en voor de kinderen van Israël, zijn metgezellen; en neem een ander stuk hout, en schrijf daarop: Voor Jozef, het hout van Efraïm, en van het gehele huis van Israël, zijn metgezellen.","17":"Doe ze dan bij elkaar komen, het een bij het ander tot één stuk hout; en zij zullen één worden in uw hand.","18":"En wanneer de kinderen van uw volk tot u zullen spreken en zeggen: Wilt u ons niet duidelijk maken wat u met deze dingen bedoelt?","19":"Zo spreek tot hen: Zo zegt de Heere HEERE: Zie, Ik zal het hout van Jozef, dat in de hand van Efraïm geweest is, en van de stammen van Israël, zijn metgezellen, nemen, en Ik zal die met hem samenvoegen tot het hout van Juda, en zal ze maken tot één stuk hout; en zij zullen één worden in Mijn hand.","20":"De stukken hout nu, waarop u zult hebben geschreven, zullen in uw hand zijn voor hun ogen.","21":"Spreek dan tot hen: Zo zegt de Heere HEERE: Zie, Ik zal de kinderen van Israël halen uit het midden van de heidenvolken, waarheen zij gegaan zijn, en zal ze van rondom bijeenbrengen, en hen brengen in hun land;","22":"En Ik zal ze maken tot één volk in het land, op de bergen van Israël; en zij zullen allen samen één Koning als koning hebben; en zij zullen niet meer twee volken zijn, en voortaan ook niet meer in twee koninkrijken verdeeld zijn.","23":"En zij zullen zich niet meer verontreinigen met hun drekgoden[1], en met hun afschuwelijkheden, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, waarin zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.","24":"En Mijn Knecht David zal Koning over hen zijn; en zij zullen allen samen één Herder hebben; en zij zullen in Mijn rechten wandelen, en Mijn inzettingen bewaren en die doen.","25":"En zij zullen wonen in het land dat Ik Mijn knecht Jakob gegeven heb, waarin uw vaders gewoond hebben; ja, daarin zullen zij wonen, zij en hun kinderen, en hun kindskinderen tot in eeuwigheid, en Mijn Knecht David zal hun Vorst zijn tot in eeuwigheid.","26":"En Ik zal een verbond van vrede met hen sluiten, het zal een eeuwig verbond met hen zijn; en Ik zal ze vestigen en zal ze vermenigvuldigen, en Ik zal Mijn heiligdom in het midden van hen zetten tot in eeuwigheid.","27":"En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.","28":"En de heidenvolken zullen weten dat Ik de HEERE ben, Die Israël heilig maakt, als Mijn heiligdom in het midden van hen zal zijn tot in eeuwigheid."},"SV":{"1":"De hand des HEEREN was op mij, en de HEERE voerde mij uit in den geest, en zette mij neder in het midden ener vallei; dezelve nu was vol beenderen.","2":"En Hij deed mij bij dezelve voorbijgaan geheel rondom; en ziet, er waren zeer vele op den grond der vallei; en ziet, zij waren zeer dor.","3":"En Hij zeide tot mij: Mensenkind! zullen deze beenderen levend worden? En ik zeide: Heere HEERE, Gij weet *het*!","4":"Toen zeide Hij tot mij: Profeteer over deze beenderen, en zeg tot dezelve: Gij dorre beenderen! hoort des HEEREN woord.","5":"Alzo zegt de Heere HEERE tot deze beenderen: Ziet, Ik zal den geest in u brengen, en gij zult levend worden.","6":"En Ik zal zenuwen op u leggen, en vlees op u doen opkomen, en een huid over u trekken, en den geest in u geven, en gij zult levend worden; en gij zult weten, dat Ik de HEERE ben.","7":"Toen profeteerde ik, gelijk mij bevolen was, en er werd een geluid, als ik profeteerde, en ziet een beroering! en de beenderen naderden, *elk* been tot zijn been.","8":"En ik zag, en ziet, en er werden zenuwen op dezelve, en er kwam vlees op; en Hij trok een huid boven over dezelve, maar er was geen geest in hen.","9":"En Hij zeide tot mij: Profeteer tot den geest; profeteer, mensenkind! en zeg tot den geest: Zo zegt de Heere HEERE: Gij geest! kom aan van de vier winden, en blaas in deze gedoden, opdat zij levend worden.","10":"En ik profeteerde, gelijk als Hij mij bevolen had. Toen kwam de geest in hen, en zij werden levend en stonden op hun voeten, een gans zeer groot heir.","11":"Toen zeide Hij tot mij: Mensenkind! deze beenderen zijn het ganse huis Israëls; ziet, zij zeggen: Onze beenderen zijn verdord, en onze verwachting is verloren, wij zijn afgesneden.","12":"Daarom, profeteer en zeg tot hen: Zo zegt de Heere HEERE: Ziet, Ik zal uw graven openen, en zal ulieden uit uw graven doen opkomen, o Mijn volk! en Ik zal u brengen in het land Israëls.","13":"En gij zult weten, dat Ik de HEERE ben, als Ik uw graven zal hebben geopend, en als Ik u uit uw graven zal hebben doen opkomen, o Mijn volk!","14":"En Ik zal Mijn Geest in u geven, en gij zult leven, en Ik zal u in uw land zetten; en gij zult weten, dat Ik, de HEERE, *dit* gesproken en gedaan heb, spreekt de HEERE.","15":"Wijders geschiedde des HEEREN woord tot mij, zeggende:","16":"Gij nu, mensenkind! neem u een hout, en schrijf daarop: Voor Juda, en voor de kinderen Israëls, zijn metgezellen; en neem een ander hout, en schrijf daarop: Voor Jozef, het hout van Efraïm, en van het ganse huis Israëls, zijn metgezellen.","17":"Doe gij ze dan naderen, het een tot het ander tot een enig hout; en zij zullen tot een worden in uw hand.","18":"En wanneer de kinderen uws volks tot u zullen spreken, zeggende: Zult gij ons niet te kennen geven, wat u deze dingen zijn?","19":"Zo spreek tot hen: Alzo zegt de Heere HEERE: Ziet, Ik zal het hout van Jozef, dat in Efraïms hand geweest is, en van de stammen Israëls, zijn metgezellen, nemen, en Ik zal dezelve met hem voegen tot het hout van Juda, en zal ze maken tot een enig hout; en zij zullen een worden in Mijn hand.","20":"De houten nu, op dewelke gij zult geschreven hebben, zullen in uw hand zijn voor hunlieder ogen.","21":"Spreek dan tot hen: Zo zegt de Heere HEERE: Ziet, Ik zal de kinderen Israëls halen uit het midden der heidenen, waarhenen zij getogen zijn, en zal ze vergaderen van rondom, en brengen hen in hun land;","22":"En Ik zal ze maken tot een enig volk in het land, op de bergen Israëls; en zij zullen allen te zamen een enigen Koning tot koning hebben; en zij zullen niet meer tot twee volken zijn, noch voortaan meer in twee koninkrijken verdeeld zijn.","23":"En zij zullen zich niet meer verontreinigen met hun drekgoden, en met hun verfoeiselen, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, in dewelke zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.","24":"En Mijn Knecht David zal Koning over hen zijn; en zij zullen allen te zamen een Herder hebben; en zij zullen in Mijn rechten wandelen, en Mijn inzettingen bewaren en die doen.","25":"En zij zullen wonen in het land, dat Ik Mijn knecht Jakob gegeven heb, waarin uw vaders gewoond hebben; ja, daarin zullen zij wonen, zij en hun kinderen, en hun kindskinderen tot in eeuwigheid, en Mijn Knecht David zal hunlieder Vorst zijn tot in eeuwigheid.","26":"En Ik zal een verbond des vredes met hen maken, het zal een eeuwig verbond met hen zijn; en Ik zal ze inzetten en zal ze vermenigvuldigen, en Ik zal Mijn heiligdom in het midden van hen zetten tot in eeuwigheid.","27":"En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.","28":"En de heidenen zullen weten, dat Ik de HEERE ben, Die Israël heilige, als Mijn heiligdom in het midden van hen zal zijn tot in eeuwigheid."},"KJV":{"1":"The hand of the LORD was upon me, and carried me out in the spirit of the LORD, and set me down in the midst of the valley which *was* full of bones,","2":"And caused me to pass by them round about: and, behold, *there were* very many in the open valley; and, lo, *they were* very dry.","3":"And he said unto me, Son of man, can these bones live? And I answered, O Lord GOD, thou knowest.","4":"Again he said unto me, Prophesy upon these bones, and say unto them, O ye dry bones, hear the word of the LORD.","5":"Thus saith the Lord GOD unto these bones; Behold, I will cause breath to enter into you, and ye shall live:","6":"And I will lay sinews upon you, and will bring up flesh upon you, and cover you with skin, and put breath in you, and ye shall live; and ye shall know that I *am* the LORD.","7":"So I prophesied as I was commanded: and as I prophesied, there was a noise, and behold a shaking, and the bones came together, bone to his bone.","8":"And when I beheld, lo, the sinews and the flesh came up upon them, and the skin covered them above: but *there was* no breath","9":"Then said he unto me, Prophesy unto the wind, prophesy, son of man, and say to the wind, Thus saith the Lord GOD; Come from the four winds, O breath, and breathe upon these slain, that they may live.","10":"So I prophesied as he commanded me, and the breath came into them, and they lived, and stood up upon their feet, an exceeding great army.","11":"Then he said unto me, Son of man, these bones are the whole house of Israel: behold, they say, Our bones are dried, and our hope is lost: we are cut off","12":"Therefore prophesy and say unto them, Thus saith the Lord GOD; Behold, O my people, I will open your graves, and cause you to come up out of your graves, and bring you into the land of Israel.","13":"And ye shall know that I *am* the LORD, when I have opened your graves, O my people, and brought you up out of your graves,","14":"And shall put my spirit in you, and ye shall live, and I shall place you in your own land: then shall ye know that I the LORD have spoken *it*, and performed *it*, saith the LORD.","15":"The word of the LORD came again unto me, saying,","16":"Moreover, thou son of man, take thee one stick, and write upon it, For Judah, and for the children of Israel his companions: then take another stick, and write upon it, For Joseph, the stick of Ephraim, and *for* all the house of Israel his companions:","17":"And join them one to another into one stick; and they shall become one in thine hand.","18":"And when the children of thy people shall speak unto thee, saying, Wilt thou not shew","19":"Say unto them, Thus saith the Lord GOD; Behold, I will take the stick of Joseph, which *is* in the hand of Ephraim, and the tribes of Israel his fellows, and will put them with him, *even* with the stick of Judah, and make them one stick, and they shall be one in mine hand.","20":"And the sticks whereon thou writest shall be in thine hand before their eyes.","21":"And say unto them, Thus saith the Lord GOD; Behold, I will take the children of Israel from among the heathen, whither they be gone, and will gather them on every side, and bring them into their own land:","22":"And I will make them one nation in the land upon the mountains of Israel; and one king shall be king to them all: and they shall be no more two nations, neither shall they be divided into two kingdoms","23":"Neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions: but I will save them out of all their dwellingplaces, wherein they have sinned, and will cleanse them: so shall they be my people, and I will be their God.","24":"And David my servant *shall be* king over them; and they all shall have one shepherd: they shall also walk in my judgments, and observe my statutes, and do","25":"And they shall dwell in the land that I have given unto Jacob my servant, wherein your fathers have dwelt; and they shall dwell therein, *even* they, and their children, and their children's children for ever: and my servant David *shall be* their prince for ever.","26":"Moreover I will make a covenant of peace with them; it shall be an everlasting covenant with them: and I will place them, and multiply them, and will set my sanctuary in the midst of them fo ;</span> Behold, I will cause <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into you, and ye shall live:","6":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H1517\">sinews</span> upon you, and will bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> upon you, and <span class=\"wl wl-kjv\" data-code=\"H7159\">cover</span> you with <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> in you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the LORD.","7":"So I <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> as I was <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded:</span> and as I <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied,</span> there was a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H7494\">shaking,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> came <span class=\"wl wl-kjv\" data-code=\"H7126\">together,</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> to his bone.","8":"And when I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld,</span> lo, the <span class=\"wl wl-kjv\" data-code=\"H1517\">sinews</span> and the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon them, and the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> <span class=\"wl wl-kjv\" data-code=\"H7159\">covered</span> them <span class=\"wl wl-kjv\" data-code=\"H4605\">above:</span> but there was no breath","9":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto me, <span class=\"wl wl-kjv\" data-code=\"H5012\">Prophesy</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> from the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">winds,</span> O <span class=\"wl wl-kjv\" data-code=\"H7307\">breath,</span> and <span class=\"wl wl-kjv\" data-code=\"H5301\">breathe</span> upon these <span class=\"wl wl-kjv\" data-code=\"H2026\">slain,</span> that they may live.","10":"So I <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> as he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> me, and the <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into them, and they <span class=\"wl wl-kjv\" data-code=\"H2421\">lived,</span> and stood <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> an <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> army.","11":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H1121\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> these <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are the whole <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> behold, they <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Our <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are <span class=\"wl wl-kjv\" data-code=\"H3001\">dried,</span> and our <span class=\"wl wl-kjv\" data-code=\"H8615\">hope</span> is <span class=\"wl wl-kjv\" data-code=\"H6\">lost:</span> we are cut off","12":"Therefore <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, O my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> your <span class=\"wl wl-kjv\" data-code=\"H6913\">graves,</span> and cause you to come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of your <span class=\"wl wl-kjv\" data-code=\"H6913\">graves,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> you into the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of Israel.","13":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when I have <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> your <span class=\"wl wl-kjv\" data-code=\"H6913\">graves,</span> O my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and brought you <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of your graves,","14":"And shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> and I shall <span class=\"wl wl-kjv\" data-code=\"H3240\">place</span> you in your own <span class=\"wl wl-kjv\" data-code=\"H127\">land:</span> then shall ye <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> it, and <span class=\"wl wl-kjv\" data-code=\"H6213\">performed</span> it, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","15":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came again unto me, saying,","16":"Moreover, thou <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">stick,</span> and <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> upon it, For <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his <span class=\"wl wl-kjv\" data-code=\"H2270\">companions:</span> then <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">stick,</span> and <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> upon it, For <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">stick</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and for all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his companions:","17":"And <span class=\"wl wl-kjv\" data-code=\"H7126\">join</span> them <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> into <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">stick;</span> and they shall become <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> in thine hand.","18":"And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Wilt thou not shew","19":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">stick</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his <span class=\"wl wl-kjv\" data-code=\"H2270\">fellows,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them with him, even with the <span class=\"wl wl-kjv\" data-code=\"H6086\">stick</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">stick,</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> in mine hand.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H6086\">sticks</span> whereon thou <span class=\"wl wl-kjv\" data-code=\"H3789\">writest</span> shall be in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> before their eyes.","21":"And <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from <span class=\"wl wl-kjv\" data-code=\"H996\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> whither they be <span class=\"wl wl-kjv\" data-code=\"H1980\">gone,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> them on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them into their own land:","22":"And I will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to them all: and they shall <span class=\"wl wl-kjv\" data-code=\"H5750\">be</span> no more <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> neither shall they be <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> into <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> kingdoms","23":"Neither shall they <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> th wl-kjv\" data-code=\"H1121\">children's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> and my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> shall be their <span class=\"wl wl-kjv\" data-code=\"H5387\">prince</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.","26":"Moreover I will <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> with them; it shall be an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with them: and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">place</span> them, and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> them, and will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them for evermore.","27":"My <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> also shall be with them: yea, I will be their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and they shall be my people.","28":"And the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> do <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of them for evermore."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hand des HEEREN was op mij,","tekst":"Zie boven Eze 1:3 ."},{"catchword":"geest,","tekst":"Dat is, in een gezicht met optrekking van mijnen geest. Anders: zij [de hand des Heeren] voerde mij uit door den Geest des Heeren."},{"catchword":"zette mij neder","tekst":"Hebreeuws, deed mij rusten."},{"catchword":"beenderen","tekst":"Versta, dorre dode beenderen van verstorven mensen, gelijk volgt. Door dit gezicht en het volgende teken van twee stukjes hout, heeft God willen verzekeren de vervulling der genadebeloften, die in het voorgaande wijlopig gedaan zijn, zo van de lichamelijke verlossing uit Babel als van de geestelijke door den Messias en de vergadering der algemene kerk uit Joden en heidenen, hetwelk alles het begrip en vermogen van den mens teboven ging, om zijn volk te leren dat het Hem [als den almachtigen God] zo licht is zulks alles te volbrengen als doden op te wekken en levend te maken, [waarvan God hier een levendig beeld tot het geloof zijner kerk, voorstelt] en twee stukjes hout samen te voegen."}],"2":[{"catchword":"Hij deed mij","tekst":"Namelijk de Heere; anders mocht de profeet een natuurlijken schrik daarvan gehad hebben, en gevreesd hebben voor ceremonieële onreinheid."},{"catchword":"geheel rondom;","tekst":"Hebreeuws, rondom, rondom."},{"catchword":"grond der vallei;","tekst":"Hebreeuws, aangezicht."}],"3":[{"catchword":"Hij zeide tot mij","tekst":"De Heere."},{"catchword":"zullen deze beenderen levend worden?","tekst":"Alsof God zeide: Zouden zij wel kunnen levend worden? weet gij daartoe enig natuurlijk, begrijpelijk middel, raad, of vermogen? dunkt het u wel menselijk, mogelijk te zijn? Vergelijk deze vraag met Job 6:5-6 . Anderszins was de zaak van de toekomstige algemene verrijzenis der doden onder Gods volk bekend en buiten twijfel; zie Mat 22:29 , enz.; Heb 11:13-14 , Heb 11:35 ."},{"catchword":"Gij weet het","tekst":"Alsof de profeet zeide: Ik weet uwe macht wel, maar wat Gij hier nu met deze beenderen voorhebt, en aan dezelve zult willen doen, dat is U bekend en mij van U nog niet geopenbaard; anderszins had de profeet in het algemeen het geloof der vrome voorvaderen; zie Gen 23:4 , en Gen 50:25 ; Exo 13:19 ; Isa 26:19 , enz.; zonder hetwelk de gelovigen de ellendigste aller mensen geweest zouden zijn, 1Co 15:19 ; zie wijders Joh 11:24 ."}],"4":[{"catchword":"zeg tot hen:","tekst":"Vergelijk deze aanspraak met boven Eze 36:1 , en Eze 14:17 , met de aantekening; idem Rom 4:17 ."}],"5":[{"catchword":"geest in u brengen,","tekst":"Dat is, de ziel, in een iegelijk lichaam; alzo vs.8, 10. Zie Num 16:22 ."}],"6":[{"catchword":"leggen,","tekst":"Hebreeuws, geven."}],"7":[{"catchword":"geluid,","tekst":"Dit waren tekenen en boden van Gods tegenwoordige majesteit en krachtige werking, gelijk in het volgende de wind."},{"catchword":"beroering","tekst":"Of, schudding, beving, beweging. Anders: [aard] beving, waarvan het Hebreeuwse woord veel gebruikt wordt; doch ook van andere beroerten, gelijk onder Eze 38:19-20 ; Nah 3:2 ."},{"catchword":"zijn been","tekst":"Zodat de beenderen, die in het leven bij elkander in elk lichaam geweest waren, in dit gezicht weder samenkwamen; een levendige afbeelding van hetgeen God zal werken in de opstanding der doden."}],"8":[{"catchword":"geest in hen","tekst":"Gelijk boven vs.5."}],"9":[{"catchword":"Profeteer tot den geest;","tekst":"Dat is, verkondig in mijnen naam dat Ik door mijn goddelijke kracht de zielen zal wederbrengen in deze dode lichamen, enz. Sommigen verstaan door het woord geest den wind, en alzo in het volgende van vs.9. Niet dat de wind den doden het leven of de ziel kan inblazen of geven; maar dat het God belieft den wind te gebruiken tot een voorbode zijner krachtige werking, om de gelijkheid, die er enigszins is tussen de werking Gods en de kracht van den wind, en het geblaas van den wind, [waarvan in het volgende] en het geblaas of adem, dat de ziel voortbrengt in den levende. VergelijK Act 2:2 , en Joh 20:22 , enz."},{"catchword":"winden,","tekst":"Dat is, van de vier hoeken of delen der wereld. Zie boven Eze 5:10 ."},{"catchword":"in deze gedoden,","tekst":"Of, op, of blaas deze gedoden aan."}],"10":[{"catchword":"geest in hen,","tekst":"Dat is, ziel, gelijk boven vs.5."},{"catchword":"gans zeer groot heir","tekst":"Hebreeuws, zeer zeer."}],"11":[{"catchword":"die zijn het ganse huis Israëls;","tekst":"Dat is, zij zijn een teken of afbeelding van het huis van Israël, of zij beduiden dat en hun tegenwoordigen staat in Babel."},{"catchword":"Onze beenderen zijn verdord,","tekst":"Daar is zo weinig hoop van onze verlossing uit Babel en de wederkomst in ons land, als er is dat dode, begraven en verrotte mensen en hun verdorde beenderen weder zouden levend worden. Deze redenen van ongeloof en mistroostigheid waren de aanleiding, en geven het oogmerk te kennen van het voorgaande gezicht."},{"catchword":"afgesneden","tekst":"Gelijk takken, die afgesneden zijn en van den wortel geen sap kunnen trekken, moetende dienvolgens vergaan."}],"12":[{"catchword":"Ziet,","tekst":"God herhaalt hier sommierlijk de lichamelijke en geestelijke beloften, die in de voorgaande h.h. wijdlopig zijn gedaan, gebruikende daartoe figuurlijke manieren van spreken, die uit het voorgaande gezicht en hun eigen woorden genomen zijn."}],"14":[{"catchword":"dat Ik, de HEERE,","tekst":"Anders: dat Ik de HEERE [ben], Ik heb het gesproken en zal het doen."}],"16":[{"catchword":"hout,","tekst":"Eene roede, of plat hout; vergelijk Num 17:2 , enz."},{"catchword":"zijn metgezellen;","tekst":"Versta, Benjamin en Levi. Zie 2Ch 11:12-13 ."},{"catchword":"ganse huis Israëls,","tekst":"Versta, de tien stammen, die zich aan Efraïm [als de machtigste] gehouden hadden, en daaronder dikwijls verstaan worden."}],"17":[{"catchword":"Doe gij ze dan naderen,","tekst":"Dat is, breng hen nabij en tot elkander, dat zij een worden."}],"18":[{"catchword":"kinderen uws volks","tekst":"Zie boven Eze 3:11 ."},{"catchword":"wat u deze dingen zijn?","tekst":"Dat is, wat zij beduiden of betekenen, en wat Gij daarmede meent, wat daardoor te verstaan zij; zie boven Eze 24:19 ."}],"19":[{"catchword":"hout van Jozef,","tekst":"Dat is, Jozefs nakomelingen, of de Efraïmieten met hun bijgevoegde stammen, die door dit hout samen betekend werden."},{"catchword":"hand geweest is,","tekst":"Dat is, de tien stammen, waarvan Efraïm het hoofd tevoren geweest was, toebehoorde."},{"catchword":"een worden in Mijn hand","tekst":"Gelijk de verdeeldheid en vijandschap tussen Juda en Efraïm [waarvan Samaria de hoofdstad was] als ene afbeelding was van de twee vijandelijke gedeelten der mensen, namelijk Joden en heidenen, alzo was de vereniging van dezelve een afbeelding of voorbeeld van de vereniging der algemene kerk, of van alle uitverkorenen in de ganse wereld, uit Joden en heidenen, door enen Geest en een geloof, onder een Hoofd, Koning en Zaligmaker, welke is onze Heere Jezus Christus, de beloofde Messias. Of nu wel enige van de tien stammen zich met Juda gevoegd hebben, en alzo samen uit Babel zijn opgetogen [ 1Ch 9:3 ] , zo heeft nochtans de rechte geestelijke vereniging haar aanvang genomen ten tijde des Heeren Christus en van zijne apostelen, [zie Joh 4:9 , Joh 4:21 , Joh 4:23 , Joh 4:35 , Joh 4:39 , Joh 4:41 ; Act 2:9-11 , en Act 8:5 , Act 8:14 , en Act 9:31 ] , en is voorts vervolgd onder de Joden, en voornamelijk onder de heidenen, en zal duren tot aan het einde der wereld, totdat gans geestelijk Israël is beroepen, in Gods hand, [dat is, in den Heere Christus, die in dezen des Vaders knecht is, in wiens hand Hij alles heeft overgegeven en tot"},{"catchword":"een worden in Mijn hand","tekst":"wien Hij alle uitverkorenen trekt] in een lichaam of eene kerk verenigd en behouden. Zie Mat 28:19 ; Act 1:8 ; Rom 11:25-26 ; Eph 2:13 , enz."}],"20":[{"catchword":"voor hunlieder ogen","tekst":"Gelijk den profeet dikwijls belast werd, hetgeen hun van God was geopenbaard het volk alzo levendig en als metterdaad af te beelden en voor ogen te stellen. Vergelijk boven Eze 12:3-4 , enz., met de aantekening; Jer 27:2 , en ased, as followeth. By this vision, and the following token of two pieces of wood, God would assure the accomplishing of the promises of grace, which are amply made in the former chapters, both concerning the corporal deliverance from Babel and the spiritual redemption by the Messiah, and the gathering of the universal church out of Jews and gentiles, all which surpassed the capacity and power of man: to teach his people, that it is as easie for him (who is the Almighty God) to perform all these things, as to raise and quicken dead men, (whereof God here representeth a lively pattern for the confirmation of the faith of his church) and to joyn two pieces of wood together"}],"2":[{"catchword":null,"tekst":"And he [Namely the Lord] caused me to pass by them, quite round about: [Heb. Round about round about. Otherwise the prophet might have been naturally afraid of them, and been in the fear of contracting ceremonial pollution thereby] and behold, there were very many upon the ground [Heb. Face of the valley] and lo they were very dry."}],"3":[{"catchword":null,"tekst":"And he [The Lord] said unto me, child of men, I shall these bones become alive? [As if God should say, is it possible that they should ever grow alive? Dost thou know any natural, conceivable means, counsel, or power for it? Doth it seem a thing possible unto thee to be done by the skill and power of man? Compare this question with Job 6:4,5. Otherwise the article of the future universal resurrection of the dead was a point well known, and without all doubt among the people of God. See Mat 22:29, &c. Heb 11:13, 14, 35.] And I said Lord LORD, thou knoweth (it). [As if the prophet should say; I know thy power well, but what thou at present intendeth hereby these bones, and what thou wilt do to them, that is best known to thee, and is not yet revealed unto me by thee: otherwise the prophet had the general the faith of the godly Patriarchs. See Genesis 23 on verse 4 and 50 on verse 25. Exo 13:19. Isa 26:19, function refUrl(ref) {

}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  } catch (e) { cache[code] = null; }

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

}

    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
