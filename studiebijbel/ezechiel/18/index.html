et u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden?","3":"Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!","4":"Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.","5":"Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet;","6":"Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden[1] van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert;","7":"En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;","8":"Niet uitleent op woeker, noch overwinst neemt, zijn hand van onrecht afkeert, waarachtig recht tussen de een en de ander toepast;","9":"In Mijn inzettingen wandelt, en Mijn rechten onderhoudt, om trouw te handelen; die rechtvaardige zal zeker leven, spreekt de Heere HEERE.","10":"Heeft hij nu een zoon voortgebracht, die een inbreker is, die bloed vergiet, die zijn broeder een van deze dingen aandoet;","11":"En die al die dingen zelf niet doet; maar ook eet op de bergen, en de vrouw van zijn naaste onteert;","12":"De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;","13":"Uitleent op woeker, en overwinst neemt; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal zeker gedood worden; zijn bloed zal op hem zijn!","14":"Zie nu, heeft hij een zoon voortgebracht, die al de zonden van zijn vader, die hij doet, aanziet, en toeziet, en dergelijke niet doet;","15":"Niet eet op de bergen, noch zijn ogen opheft tot de drekgoden van het huis van Israël, de vrouw van zijn naaste niet onteert;","16":"En niemand verdrukt, het pand niet vasthoudt, en geen roof pleegt, zijn brood aan de hongerige geeft, en de naakte met kleding bedekt;","17":"Zijn hand van de ellendige afhoudt, geen woeker noch overwinst neemt, Mijn rechten doet, en in Mijn inzettingen wandelt; die zal niet sterven om de ongerechtigheid van zijn vader; hij zal zeker leven.","18":"Zijn vader, omdat hij met onderdrukking onderdrukt heeft, het goed van zijn broeder geroofd heeft, en gedaan heeft wat niet goed was te midden van zijn volk; zie, hij zal sterven in zijn ongerechtigheid.","19":"Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.","20":"De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.","21":"Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven.","22":"Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven.","23":"Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?","24":"Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en handelt naar al de gruwelen die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet aangerekend worden; door zijn overtreding, waardoor hij overtreden heeft, en door zijn zonde, die hij gezondigd heeft, daardoor zal hij sterven.","25":"Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?","26":"Als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en daarin sterft, zal hij in zijn onrecht, dat hij gedaan heeft, sterven.","27":"Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en recht en gerechtigheid doet, die zal zijn ziel in het leven behouden;","28":"Omdat hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, zal hij zeker leven, hij zal niet sterven.","29":"Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?","30":"Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden.","31":"Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?","32":"Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef."},"SV":{"1":"Verder geschiedde des HEEREN woord tot mij, zeggende:","2":"Wat is ulieden, dat gij dit spreekwoord gebruikt van het land Israëls, zeggende: De vaders hebben onrijpe druiven gegeten, en de tanden der kinderen zijn stomp geworden?","3":"*Zo* *waarachtig* *als* Ik leef, spreekt de Heere HEERE, zo het ulieden meer gebeuren zal, dit spreekwoord in Israël te gebruiken!","4":"Ziet, alle zielen zijn Mijne; gelijk de ziel des vaders, alzo ook de ziel des zoons, zijn Mijne; de ziel, die zondigt, die zal sterven.","5":"Wanneer nu iemand rechtvaardig is, en doet recht en gerechtigheid;","6":"Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis Israëls; noch de huisvrouw zijns naasten verontreinigt, noch tot de afgezonderde vrouw nadert;","7":"En niemand verdrukt, den schuldenaar zijn pand wedergeeft, geen roof rooft, den hongerige zijn brood geeft, en den naakte met kleding bedekt;","8":"Niet geeft op woeker, noch overwinst neemt, zijn hand van onrecht afkeert, waarachtig recht tussen den een en den anderen oefent;","9":"In Mijn inzettingen wandelt, en Mijn rechten onderhoudt, om trouwelijk te handelen; die rechtvaardige zal gewisselijk leven, spreekt de Heere HEERE.","10":"Heeft hij nu een zoon gewonnen, die een inbreker is, die bloed vergiet, die zijn broeder doet een van deze dingen;","11":"En die al die dingen niet doet; maar eet ook op de bergen, en verontreinigt de huisvrouw zijns naasten;","12":"Verdrukt den ellendige en den nooddruftige, rooft veel roofs, geeft het pand niet weder, en heft zijn ogen op tot de drekgoden, doet gruwel;","13":"Geeft op woeker, en neemt overwinst; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal voorzeker gedood worden; zijn bloed zal op hem zijn!","14":"Ziet nu, heeft hij een zoon gewonnen, die al de zonden zijn vaders, die hij doet, aanziet, en toeziet, dat hij dergelijke niet doet;","15":"Niet eet op de bergen, noch zijn ogen opheft tot de drekgoden van het huis Israëls, de huisvrouw zijns naasten niet verontreinigt;","16":"En niemand verdrukt, het pand niet behoudt, en geen roof rooft, zijn brood den hongerige geeft, en den naakte met kleding bedekt;","17":"Zijn hand van den ellendige afhoudt, geen woeker noch overwinst neemt, Mijn rechten doet, *en* in Mijn inzettingen wandelt; die zal niet sterven om de ongerechtigheid zijns vaders; hij zal gewisselijk leven.","18":"Zijn vader, dewijl hij met onderdrukking onderdrukt heeft, des broeders goed geroofd heeft, en gedaan heeft, dat niet goed was in het midden zijner volken; ziet daar, hij zal sterven in zijn ongerechtigheid.","19":"Maar gijlieden zegt: Waarom draagt de zoon niet de ongerechtigheid des vaders? Immers zal de zoon, *die* recht en gerechtigheid gedaan heeft, *en* al Mijn inzettingen onderhouden, en die gedaan heeft, gewisselijk leven.","20":"De ziel, die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid des vaders, en de vader zal niet dragen de ongerechtigheid des zoons; de gerechtigheid des rechtvaardigen zal op hem zijn, en de goddeloosheid des goddelozen zal op hem zijn.","21":"Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en doet recht en gerechtigheid, hij zal gewisselijk leven, hij zal niet sterven.","22":"Al zijn overtredingen, die hij gedaan heeft, zullen hem niet gedacht worden; in zijn gerechtigheid, die hij gedaan heeft, zal hij leven.","23":"Zou Ik enigzins lust hebben aan den dood des goddelozen, spreekt de Heere HEERE; is het niet, als hij zich bekeert van zijn wegen, dat hij leve?","24":"Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, doende naar al de gruwelen, die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; in zijn overtreding, waardoor hij overtreden heeft, en in zijn zonde, die hij gezondigd heeft, in die zal hij sterven.","25":"Nog zegt gijlieden: De weg des Heeren is niet recht; hoort nu, o huis Israëls! is Mijn weg niet recht? Zijn niet uw wegen onrecht?","26":"Als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en sterft in dezelve, hij zal in zijn onrecht, dat hij gedaan heeft, sterven.","27":"Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en doet recht en gerechtigheid, die zal zijn ziel in het leven behouden;","28":"Dewijl hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, hij zal gewisselijk leven, hij zal niet sterven.","29":"Evenwel zegt het huis Israëls: De weg des Heeren is niet recht. Zouden Mijn wegen, o huis Israëls, niet recht zijn? Zijn niet uw wegen onrecht?","30":"Daarom zal Ik u richten, o huis Israëls! een ieder naar zijn wegen, spreekt de Heere HEERE, keert weder, en bekeert u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een aanstoot worden.","31":"Werpt van u weg al uw overtredingen, waardoor gij overtreden hebt, en maakt u een nieuw hart en een nieuwen geest; want waarom zoudt gij sterven, o huis Israëls?","32":"Want Ik heb geen lust aan den dood des stervenden, spreekt de Heere HEERE; daarom bekeert u en leeft."},"KJV":{"1":"The word of the LORD came unto me again, saying,","2":"What mean ye, that ye use this proverb concerning the land of Israel, saying, The fathers have eaten sour grapes, and the children's teeth are set on edge?","3":"*As* I live, saith the Lord GOD, ye shall not have *occasion* any more to use this proverb in Israel.","4":"Behold, all souls are mine; as the soul of the father, so also the soul of the son is mine: the soul that sinneth, it shall die.","5":"But if a man be just, and do that which is lawful and right,","6":"*And* hath not eaten upon the mountains, neither hath lifted up his eyes to the idols of the house of Israel, neither hath defiled his neighbour's wife, neither hath come near to a menstruous woman,","7":"And hath not oppressed any, *but* hath restored to the debtor his pledge, hath spoiled none by violence, hath given his bread to the hungry, and hath covered the naked with a garment;","8":"He *that* hath not given forth upon usury, neither hath taken any increase, *that* hath withdrawn his hand from iniquity, hath executed true judgment between man and man,","9":"Hath walked in my statutes, and hath kept my judgments, to deal truly; he *is* just, he shall surely live, saith the Lord GOD.","10":"If he beget a son *that is* a robber, a shedder of blood, and *that* doeth the like to *any* one","11":"And that doeth not any of those *duties*, but even hath eaten upon the mountains, and defiled his neighbour's wife,","12":"Hath oppressed the poor and needy, hath spoiled by violence, hath not restored the pledge, and hath lifted up his eyes to the idols, hath committed abomination,","13":"Hath given forth upon usury, and hath taken increase: shall he then live? he shall not live: he hath done all these abominations; he shall surely die; his blood","14":"Now, lo, *if* he beget a son, that seeth all his father's sins which he hath done, and considereth, and doeth not such like,","15":"*That* hath not eaten upon the mountains, neither hath lifted up his eyes to the idols of the house of Israel, hath not defiled his neighbour's wife,","16":"Neither hath oppressed any, hath not withholden the pledge, neither hath spoiled by violence, *but* hath given his bread to the hungry, and hath covered the naked with a garment,","17":"*That* hath taken off his hand from the poor, *that* hath not received usury nor increase, hath executed my judgments, hath walked in my statutes; he shall not die for the iniquity of his father, he shall surely live.","18":"*As for* his father, because he cruelly oppressed, spoiled his brother by violence, and did *that* which *is* not good among his people, lo, even he shall die in his iniquity.","19":"Yet say ye, Why? doth not the son bear the iniquity of the father? When the son hath done that which is lawful and right, *and* hath kept all my statutes, and hath done them, he shall surely live.","20":"The soul that sinneth, it shall die. The son shall not bear the iniquity of the father, neither shall the father bear the iniquity of the son: the righteousness of the righteous shall be upon him, and the wickedness of the wicked","21":"But if the wicked will turn from all his sins that he hath committed, and keep all my statutes, and do that which is lawful and right, he shall surely live, he shall not die.","22":"All his transgressions that he hath committed, they shall not be mentioned unto him: in his righteousness that he hath done he shall live.","23":"Have I any pleasure at all that the wicked should die? saith the Lord GOD: *and* not that he should return from his ways, and live?","24":"But when the righteous turneth away from his righteousness, and committeth iniquity, *and* doeth according to all the abominations that the wicked *man* doeth, shall he live? All his righteousness that he hath done shall not be mentioned: in his trespass that he hath trespassed, and in his sin that he hath sinned, in them shall he die.","25":"Yet ye say, The way of the Lord is not equal. Hear now, O house of Israel; Is not my way equal? are not your ways unequal?","26":"When a righteous *man* turneth away from his righteousness, and committeth iniquity, and dieth in them; for his iniquity that he hath done shall he die.","27":"Again, when the wicked *man* turneth away from his wickedness that he hath committed, and doeth that which is lawful and right, he shall save his soul alive.","28":"Because he considereth, and turneth away from all his transgressions that he hath committed, he shall surely live, he shall not die.","29":"Yet saith the house of Israel, The way of the Lord is not equal. O house of Israel, are not my ways equal? are not your ways unequal?","30":"Therefore I will judge you, O house of Israel, every one according to his ways, saith the Lord GOD. Repent, and turn *yourselves* from all your transgressions; so iniquity shall not be your ruin.","31":"Cast away from you all your transgressions, whereby ye have transgressed; and make you a new heart and a new spirit: for why will ye die, O house of Israel?","32":"For I have no pleasure in the death of him that dieth, saith the Lord GOD: wherefore turn *yourselves*, and live"}},"tsk":{"2":[{"kopje":"is er met u","refs":["Ezech 17:12","Jes 3:15","Rom 9:20"]},{"kopje":"het land","refs":["Ezech 6:2","Ezech 6:3","Ezech 7:2","Ezech 25:3","Ezech 36:1-6","Ezech 37:11","Ezech 37:19","Ezech 37:25"]},{"kopje":"De vaders","refs":["Jer 15:4","Jer 31:29","Jer 31:30","Klaagl 5:7","Matt 23:36"]}],"4":[{"kopje":"alle zielen","refs":["Num 16:22","Num 27:16","Zach 12:1","Hebr 12:9"]},{"kopje":"de ziel die","refs":["Ezech 18:20","Rom 6:23","Gal 3:10-13","Gal 3:22"]}],"5":[{"kopje":"wanneer","refs":["Ps 15:2-5","Ps 24:4-6","Matt 7:21-27","Ro =\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> neither hath <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> neither hath come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to a <span class=\"wl wl-kjv\" data-code=\"H5079\">menstruous</span> woman,","7":"And hath not <span class=\"wl wl-kjv\" data-code=\"H3238\">oppressed</span> <span class=\"wl wl-kjv\" data-code=\"H376\">any,</span> but hath <span class=\"wl wl-kjv\" data-code=\"H7725\">restored</span> to the <span class=\"wl wl-kjv\" data-code=\"H2326\">debtor</span> his <span class=\"wl wl-kjv\" data-code=\"H2258\">pledge,</span> hath <span class=\"wl wl-kjv\" data-code=\"H1497\">spoiled</span> none by <span class=\"wl wl-kjv\" data-code=\"H1500\">violence,</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> his <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> to the <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H5903\">naked</span> with a garment;","8":"He that hath not given <span class=\"wl wl-kjv\" data-code=\"H5414\">forth</span> upon <span class=\"wl wl-kjv\" data-code=\"H5392\">usury,</span> neither hath <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> any <span class=\"wl wl-kjv\" data-code=\"H8636\">increase,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H7725\">withdrawn</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> between <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and man,","9":"Hath <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> <span class=\"wl wl-kjv\" data-code=\"H571\">truly;</span> he is <span class=\"wl wl-kjv\" data-code=\"H6662\">just,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> GOD.","10":"If he <span class=\"wl wl-kjv\" data-code=\"H3205\">beget</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> that is a <span class=\"wl wl-kjv\" data-code=\"H6530\">robber,</span> a <span class=\"wl wl-kjv\" data-code=\"H8210\">shedder</span> of <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">like</span> to any one","11":"And that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> not any of those duties, but even hath <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> wife,","12":"Hath <span class=\"wl wl-kjv\" data-code=\"H3238\">oppressed</span> the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H34\">needy,</span> hath <span class=\"wl wl-kjv\" data-code=\"H1497\">spoiled</span> by <span class=\"wl wl-kjv\" data-code=\"H1500\">violence,</span> hath not <span class=\"wl wl-kjv\" data-code=\"H7725\">restore ss=\"wl wl-kjv\" data-code=\"H7307\">spirit:</span> for why will ye <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> O <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Israel?","32":"For I have no <span class=\"wl wl-kjv\" data-code=\"H2654\">pleasure</span> in the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of him that <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD:</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> yourselves, and live"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Wat is ulieden,","tekst":"Dat is, wat reden hebt gijlieden om dit spreekwoord te gebruiken? Alsof Hij zeide: Ik heb u geen oorzaak daartoe gegeven."},{"catchword":"spreekwoord gebruikt","tekst":"Zie boven Eze 12:22 ."},{"catchword":"van het land Israëls,","tekst":"Dat is, van de inwoners des lands; zie Gen 6:11 ."},{"catchword":"De vaders","tekst":"Dat is, de vaders hebben de zonde gedaan en de kinderen moeten de straf dragen. Aldus hebben de Joden den Heere zeer onbeschaamd van ongerechtigheid beschuldigd."},{"catchword":"tanden der kinderen","tekst":"Dat is, onze tanden."}],"3":[{"catchword":"zo het ulieden","tekst":"Hij loochent sterkelijk en met een eed dat zij de gelegenheid niet lang zouden hebben om dit lasterlijk spreekwoord te gebruiken; want zij zouden haast met zulke gruwelijke plagen overvallen worden, dat een ieder oordelen, ja hun eigen conscientiën getuigen zouden, dat zij om hun eigen zonden geplaagd werden."}],"4":[{"catchword":"zielen","tekst":"Dat is, mensen; zie Gen 12:5 ."},{"catchword":"zijn Mijne;","tekst":"Dat is, behoren mij toe; te weten omdat Ik hun Schepper en onderhouder ben. Hieruit besluit God dat Hij niemand met straffen ongelijk kan doen, dewijl Hij hun allen goedgedaan heeft met hen te scheppen, en doorgaand goeddoet met hen te onderhouden; maar dat Hij alleen straft die zondigen, en dat niet omdat Hij zijn schepsel, maar de zonde haat, en tegen hem die ze doet een rechtvaardig Rechter is."},{"catchword":"zal sterven","tekst":"Dat is, zal de straf harer zonden dragen, te weten òf in deze wereld, òf in het toekomende oordeel."}],"5":[{"catchword":"doet recht en gerechtigheid;","tekst":"Dat is, leeft naar de geboden der eerste en tweede tafel, hetzij in een publiek of privaat leven; zie Gen 18:19 ."}],"6":[{"catchword":"eet op de bergen,","tekst":"Te weten van hetgeen den afgoden geofferd is, en vervolgens met de afgoderij gene gemeenschap heeft. Want op de bergen, gelijk ook in de bossen en onder de groene bomen, hadden zij hunne altaren, waarop zij den afgoden offeranden deden, 1Ki 11:7 ; Isa 65:7 ; Hos 4:13 ; van welke zij dan ook een deel aten en met hunne vrienden versmulden, Deu 32:38 ; Jdg 9:27 ; Psa 106:28 ; 1Co 8:1 , 1Co 8:4 , enz."},{"catchword":"tot de drekgoden","tekst":"Te weten om dien godsdienstige eer te bewijzen, overmits zij gemeenlijk in hoge plaatsen staan; alzo onder vs.15; het tegendeel is zijne ogen op te heffen tot God, die in den hemel is; Psa 123:1 ."},{"catchword":"verontreinigt,","tekst":"Te weten door overspel. Zie deze manier van spreken, aldus vol gesteld, onder Eze 23:17 ."},{"catchword":"de afgezonderde vrouw","tekst":"Dat is, die afgezonderd moest zijn van de bijslaping van haren man, als zij hare maandstonden had, op lijfstraf. Zie Lev 15:24 , en Lev 18:19 , en Lev 20:18 , met de aantekening."},{"catchword":"nadert;","tekst":"Te weten om die te bekennen. Zie Gen 20:4 ."}],"7":[{"catchword":"geeft den schuldenaar","tekst":"Zie de wet hiervan Exo 22:26-27 ."},{"catchword":"geen roof rooft,","tekst":"Dat is, niemand het zijne, òf door straatschenderij, òf onder den schijn van het recht ontweldigt. Zie dezelfde manier van spreken onder vs.12, 16, 18, en Eze 22:29 ."}],"8":[{"catchword":"Woeker . . . overwinst","tekst":"Zie van deze woorden woeker en overwinst, Lev 25:36 ."},{"catchword":"waarachtig recht","tekst":"Hebreeuws, recht, of gericht der waarheid doet tussen den man, tegen den man; dat is, recht oordeelt en handelt tussen den een en den ander. Hetwelk geschieden moet niet alleen van degenen, die in een publiek ambt gesteld zijn, maar ook in het private leven."}],"9":[{"catchword":"Mijn inzettingen wandelt,","tekst":"Vergelijk 1Ki 11:33 , en de aantekening."},{"catchword":"om trouwelijk te handelen;","tekst":"Hebreeuws, om waarheid of trouw te doen. Zie Pro 12:22 ."},{"catchword":"gewisselijk leven,","tekst":"Hebreeuws, levende leven; dat is naar ziel en lichaam behouden worden. Alzo onder vs.17, 19, 21."}],"10":[{"catchword":"inbreker is,","tekst":"Zie Psa 17:4 ."},{"catchword":"broeder doet","tekst":"Dat is, naaste. Zie 2Ch 11:4 ."},{"catchword":"deze dingen;","tekst":"Hebreeuws, uit een van deze dingen; te weten die verboden zijn. Anders, die zijnen broeder [iets anders] doet dan, enz. Te weten van die goede werken, die recht tevoren vermeld zijn. Of van de inzettingen en rechten Gods, van welke in het voorgaande vs.9 gesproken is."}],"11":[{"catchword":"al die dingen niet doet;","tekst":"Te weten, die geboden zijn. Anders, geen van die dingen doet."},{"catchword":"eet ook op de bergen,","tekst":"Zie boven vs.6."}],"12":[{"catchword":"rooft veel roofs,","tekst":"Hebreeuws, rooft roven; dat is, doet veel geweld om zijnen naaste veel te ontnemen; vergelijk boven vs.7, en onder vs.18."},{"catchword":"geeft het pand niet weder,","tekst":"Zie boven vs.6."},{"catchword":"gruwel;","tekst":"Door gruwel wordt zeer dikwijls in de Heilige Schriftuur verstaan de afgoderij; zie boven Eze 8:6 , en de aantekening. Waarom ook de afgoden gruwelen worden genaamd, 2Ki 23:13 , en afgoden der gruwelen, boven Eze 16:36 ."}],"13":[{"catchword":"voorzeker gedood worden;","tekst":"Hebreeuws, zal stervende gedood worden; of met den dood gedood worden; te weten, òf hier naar het lichaam door middel van mensen, of hierna door Gods rechtvaardig oordeel, naar lichaam en ziel."},{"catchword":"bloed zal op hem zijn","tekst":"Hebreeuws, bloeden; dat is, hij zelf is de oorzaak van zijnen dood. Zie Lev 20:9 ."}],"15":[{"catchword":"Niet eet op de bergen,","tekst":"Zie boven vs.6."}],"16":[{"catchword":"het pand niet behoudt,","tekst":"Hebreeuws, geen pand pandt; panden heet hier niet: pand nemen, maar het pand behouden en niet wedergeven, gelijk dit af te nemen is boven uit de tegenstelling van vs.7, alwaar staat: Geeft den schuldenaar zijn pand weder."}],"17":[{"catchword":"hand van den ellendige afhoudt,","tekst":"Versta, de hand, die geweld en onrecht doet, dat is, die zijne hand afwendt van den armen geweld en onrecht aan te doen; hetwelk boven vs.8, heet, zijne hand van onrecht afkeren."},{"catchword":"hij zal gewisselijk leven","tekst":"Hebreeuws, zal levende leven."}],"18":[{"catchword":"met onderdrukking onderdrukt heeft,","tekst":"Dat is, wredelijk verdrukt heeft, te weten met geweld of bedrog. Zie Pro 14:31 ."},{"catchword":"des broeders goed geroofd heeft,","tekst":"Dat is, zijns naasten, gelijk boven vs.10. Hebreeuws, des broeders roof."}],"19":[{"catchword":"gijlieden zegt","tekst":"Namelijk gij Joden, die het voorgemelde spreekwoord gebruikt, boven vs.2. God valselijk beschuldigende dat Hij de kinderen om der vaderen misdaden straft; gij, zeg ik, antwoordt mij aldus, waarom? enz. Zo voorkomt de profeet hier hetgeen de boze Joden op zijn voorgaande leer antwoordden."},{"catchword":"waarom","tekst":"Dit zijn de woorden der Joden, alsof zij zeiden: Waarom zegt gij dat, te weten dat de Zoon niet draagt de misdaad van zijn vader, dewijl het tegendeel aan ons blijkt; die met oorlog, om onzer vaderen wil, gestraft worden?"},{"catchword":"ongerechtigheid des vaders?","tekst":"Ongerechtigheid is hier genomen voor de straf der ongerechtigheid, alzo in het volgende; zie Lev 5:1 . Hebreeuws, draagt niet de zoon in, of van de ongerechtigheid, enz. en alzo in het volgende."},{"catchword":"Immers zal de zoon,","tekst":"Dit is het wederantwoord en de wederlegging, die God door zijn profeet aan de Joden geeft, verklarende dàt de vrome niet gestraft wordt om den goddeloze, en dat deze zijn eigen straf draagt."}],"20":[{"catchword":"De ziel, die zondigt,","tekst":"Zie boven vs.4."},{"catchword":"de zoon zal niet dragen","tekst":"Versta dit van zulk een zoon, die de ongerechtigheid zijns vaders niet navolgt. Anders blijven vast de dreigementen, die wij lezen Exo 20:5 , en Deu 5:9 ."},{"catchword":"de gerechtigheid des rechtvaardigen zal op hem zijn,","tekst":"Dat is, de genadige beloning der gerechtigheid en goede werken zal hem geworden. Van het woord gerechtigheid, vergelijk Gen 30:33 , en de aantekening; idem zie Psa 24:5 , en Psa 85:14 , en Psa 112:9 ; Isa 58:8 ."},{"catchword":"de goddeloosheid des goddelozen zal op hem zijn","tekst":"Dat is, de rechtvaardige straf, die de goddeloze verdient, zal op hem komen. Zie boven vs.19, het woord ongerechtigheid."}],"21":[{"catchword":"doet recht en gerechtigheid,","tekst":"Zie boven vs.5."},{"catchword":"gewisselijk leven,","tekst":"Hebreeuws, levende leven."}],"22":[{"catchword":"Al zijn overtredingen,","tekst":"Dat is, gene zijner overtredingen zullen gedacht worden. Zie van deze manier van spreken 1Ki 11:34 ."},{"catchword":"hem niet gedacht worden;","tekst":"Of, tegen hem. Zie Psa 79:8 . De zin is dat zijne overtredingen den Heere niet bewegen zullen om hem te straffen. Het is menselijkerwijze van God gesproken; alzo Isa 64:9 ; Jer 14:10 ; Heb 10:17 ; vergelijk boven Eze 3:20 ."},{"catchword":"in zijn gerechtigheid,","tekst":"Versta, niet omdat zijne gerechtigheid zulks uit haar eigen waarde verdient, maar omdat God haar alzo uit genade, om den wil van zijnen Zoon, beloont; Rom 4:4 ."}],"23":[{"catchword":"enigszins lust hebben","tekst":"Hebreeuws, lustende lust hebben; deze vraag loochent sterkelijk. Zo is de zin dat Hij geenszins belust is, of door enigen lust gedreven, om den goddeloze te doden /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
