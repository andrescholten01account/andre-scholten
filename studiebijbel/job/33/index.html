iver is, uitspreken.","4":"De Geest van God heeft mij gemaakt, en de adem van de Almachtige heeft mij levend gemaakt.","5":"Als u kunt, antwoord mij; schik u voor mijn aangezicht, stel u op.","6":"Zie, ik ben Gods, net als u; uit het leem ben ik ook afgesneden.","7":"Zie, mijn verschrikking zal u niet beroeren, en mijn hand zal over u niet zwaar zijn.","8":"Zeker, u hebt gezegd voor mijn oren, en ik heb de stem der woorden gehoord;","9":"Ik ben rein, zonder overtreding; ik ben zuiver, en heb geen misdaad.","10":"Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.","11":"Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.","12":"Zie, hierin bent u niet rechtvaardig, antwoord ik u; want God is meerder dan een mens.","13":"Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.","14":"Maar God spreekt eens of tweemaal; doch men let daar niet op.","15":"In de droom, *door* het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger;","16":"Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;","17":"Opdat Hij de mens afwendt *van* *zijn* werk, en van de man de hoogmoed verbergt;","18":"Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.","19":"Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen;","20":"Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel;","21":"Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, *die* niet gezien werden, uitsteken;","22":"En zijn ziel nadert ten verderve, en zijn leven tot de dingen, die doden.","23":"Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;","24":"Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.","25":"Zijn vlees zal frisser worden dan het was in de jeugd; hij zal tot de dagen van zijn jonkheid wederkeren.","26":"Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.","27":"Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat;","28":"*Maar* *God* heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.","29":"Zie, dit alles werkt God twee *maal* *of* driemaal met een man;","30":"Opdat hij zijn ziel afkeert van het verderf, en hij verlicht wordt met het licht der levenden.","31":"Merk op, o Job! Hoor naar mij; zwijg, en ik zal spreken.","32":"Als er redenen zijn, antwoord mij; spreek, want ik heb lust u te rechtvaardigen.","33":"Zo niet, hoor naar mij; zwijg, en ik zal u wijsheid leren."},"SV":{"1":"En gewisselijk, o Job! hoor toch mijn redenen, en neem al mijn woorden ter ore.","2":"Zie nu, ik heb mijn mond opengedaan; mijn tong spreekt onder mijn gehemelte.","3":"Mijn redenen zullen de oprechtigheid mijns harten, en de wetenschap mijner lippen, wat zuiver is, uitspreken.","4":"De Geest Gods heeft mij gemaakt, en de adem des Almachtigen heeft mij levend gemaakt.","5":"Zo gij kunt, antwoord mij; schik u voor mijn aangezicht, stel u.","6":"Zie, ik ben Godes, gelijk gij; uit het leem ben ik ook afgesneden.","7":"Zie, mijn verschrikking zal u niet beroeren, en mijn hand zal over u niet zwaar zijn.","8":"Zeker, gij hebt gezegd voor mijn oren, en ik heb de stem der woorden gehoord;","9":"Ik ben rein, zonder overtreding; ik ben zuiver, en heb geen misdaad.","10":"Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.","11":"Hij legt mijn voeten in den stok; Hij neemt al mijn paden waar.","12":"Zie, hierin zijt gij niet rechtvaardig, antwoord ik u; want God is meerder dan een mens.","13":"Waarom hebt gij tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.","14":"Maar God spreekt eens of tweemaal; doch men let niet daarop.","15":"In den droom, *door* het gezicht des nachts, als een diepe slaap op de lieden valt, in de sluimering op het leger;","16":"Dan openbaart Hij het voor het oor der lieden, en Hij verzegelt hun kastijding;","17":"Opdat Hij den mens afwende *van* *zijn* werk, en van den man de hovaardij verberge;","18":"Dat Hij zijn ziel van het verderf afhoude; en zijn leven, dat het door het zwaard niet doorga.","19":"Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte zijner beenderen;","20":"Zodat zijn leven het brood zelf verfoeit, en zijn ziel de begeerlijke spijze;","21":"Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, *die* niet gezien werden, uitsteken ;","22":"En zijn ziel nadert ten verderve, en zijn leven tot de dingen, die doden.","23":"Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om den mens zijn rechten plicht te verkondigen;","24":"Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdale, Ik heb verzoening gevonden.","25":"Zijn vlees zal frisser worden dan het was in de jeugd; hij zal tot de dagen zijner jonkheid wederkeren.","26":"Hij zal tot God ernstiglijk bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal den mens zijn gerechtigheid wedergeven.","27":"Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, hetwelk mij niet heeft gebaat;","28":"*Maar* *God* heeft mijn ziel verlost, dat zij niet voere in het verderf, zodat mijn leven het licht aanziet.","29":"Zie, dit alles werkt God twee *maal* *of* driemaal met een man;","30":"Opdat hij zijn ziel afkere van het verderf, en hij verlicht worde met het licht der levenden.","31":"Merk op, o Job! Hoor naar mij; zwijg, en ik zal spreken.","32":"Zo er redenen zijn, antwoord mij; spreek, want ik heb lust u te rechtvaardigen.","33":"Zo niet, hoor naar mij; zwijg, en ik zal u wijsheid leren."},"KJV":{"1":"Wherefore, Job, I pray thee, hear my speeches, and hearken to all my words."," ,"25":"His flesh shall be fresher than a child's: he shall return to the days of his youth:","26":"He shall pray unto God, and he will be favourable unto him: and he shall see his face with joy: for he will render unto man his righteousness.","27":"He looketh upon men, and *if any* say, I have sinned, and perverted *that which was* right, and it profited","28":"He will deliver his soul from going into the pit, and his life shall see the light.","29":"Lo, all these *things* worketh God oftentimes with man,","30":"To bring back his soul from the pit, to be enlightened with the light of the living.","31":"Mark well, O Job, hearken unto me: hold thy peace, and I will speak.","32":"If thou hast any thing to say, answer me: speak, for I desire to justify","33":"If not, hearken unto me: hold thy peace, and I shall teach thee wisdom."}},"tsk":{"1":[{"kopje":"hoor","refs":["Job 13:6","Job 34:2","Ps 49:2-4","Mark 4:9"]}],"2":[{"kopje":"ik","refs":["Job 3:1","Ps 78:2","Matt 5:2"]},{"kopje":"mond","refs":["Job 31:30"]}],"3":[{"kopje":"de","refs":["Job 27:4","Spr 8:7","Spr 8:8","1 Tess 2:3","1 Tess 2:4"]},{"kopje":"mijn lippen","refs":["Job 15:2","Job 36:3","Job 36:4","Job 38:2","Ps 37:30","Ps 37:31","Spr 15:2","Spr 15:7","Spr 20:15"]}],"5":[{"kopje":"Als","refs":["Job 33:32","Job 33:33","Job 32:1","Job 32:12"]},{"kopje":"stel u op","refs":["Job 23:4","Job 23:5","Job 32:14","Ps 50:21"]},{"kopje":"stel u op","refs":["Hand 10:26"]}],"6":[{"kopje":"ik ben","refs":["Job 9:32-35","Job 13:3","Job 20:22","Job 23:3","Job 23:4","Job 31:35"]},{"kopje":"uit","refs":["Gen 30:2","Ex 4:16","2 Kor 5:20"]},{"kopje":"ik ook","refs":["Job 4:19","Job 10:9","Job 13:12","Gen 2:7","Gen 3:19","2 Kor 5:1"]}],"7":[{"kopje":"mijn verschrikking","refs":["Job 9:34","Job 13:21","Ps 88:17"]},{"kopje":"mijn hand","refs":["Ps 32:4"]}],"8":[{"kopje":"stem der woorden gehoord","refs":["Deut 13:14","Jer 29:23"]}],"9":[{"kopje":"rein","refs":["Job 9:17","Job 10:7","Job 11:4","Job 16:17","Job 23:11","Job 23:12","Jo \" data-code=\"H2416\">life</span> <span class=\"wl wl-kjv\" data-code=\"H2092\">abhorreth</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H8378\">dainty</span> meat.","21":"His <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> is consumed <span class=\"wl wl-kjv\" data-code=\"H3615\">away,</span> that it cannot be <span class=\"wl wl-kjv\" data-code=\"H7210\">seen;</span> and his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> that were not <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> stick <span class=\"wl wl-kjv\" data-code=\"H8192\">out.</span>","22":"Yea, his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> draweth <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7845\">grave,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> to the destroyers.","23":"If <span class=\"wl wl-kjv\" data-code=\"H3426\">there</span> be a <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> with him, an <span class=\"wl wl-kjv\" data-code=\"H3887\">interpreter,</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> among a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> unto <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> his uprightness:","24":"Then he is <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> <span class=\"wl wl-kjv\" data-code=\"H6308\">Deliver</span> him from going <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H7845\">pit:</span> I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> a ransom.","25":"His <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall be <span c " data-code=\"H5315\">soul</span> from the <span class=\"wl wl-kjv\" data-code=\"H7845\">pit,</span> to be <span class=\"wl wl-kjv\" data-code=\"H215\">enlightened</span> with the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of the living.","31":"Mark <span class=\"wl wl-kjv\" data-code=\"H7181\">well,</span> O <span class=\"wl wl-kjv\" data-code=\"H347\">Job,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me: hold thy <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> and I will speak.","32":"If thou <span class=\"wl wl-kjv\" data-code=\"H3426\">hast</span> any thing to <span class=\"wl wl-kjv\" data-code=\"H4405\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">answer</span> me: <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> for I <span class=\"wl wl-kjv\" data-code=\"H2654\">desire</span> to justify","33":"If not, <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me: hold thy <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> and I shall <span class=\"wl wl-kjv\" data-code=\"H502\">teach</span> thee wisdom."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"ik heb","tekst":"Den mond opendoen is dikwijls met zeer groten ernst van gewichtige zaken spreken, of een statig verhaal aanvangen, gelijk hier en Jdg 11:35 ; Psa 78:2 ; Pro 24:7 , en Pro 31:8-9 , Pro 31:26 ."},{"catchword":"onder","tekst":"Of, met mijn raak, of gehemelte; dat is in mijn mond. Het gehemelte helpt tot de spraak, boven, Job 29:10 ; daarom wordt hetzelve ook de spraak toegeschreven. Zie boven, Job 31:30 ; Pro 8:7 ."}],"3":[{"catchword":"de oprechtigheid","tekst":"Dat is, het rechte, ware en onvervalste gevoelen mijns harten. Vergelijk boven, Job 6:25 , en de aantekening."},{"catchword":"de wetenschap","tekst":"Dat is, mijn lippen, die wetenschap of lering zullen en moeten voortbrengen; die ook lippen der wetenschap genaamd worden; Pro 14:7 ."},{"catchword":"wat zuiver is,","tekst":"Dat is, hetwelk onvervalst is en komt uit een oprecht hart."}],"4":[{"catchword":"De Geest Gods","tekst":"Elihu geeft te verstaan dat hij een mens was en schepsel Gods gelijk anderen; vervolgens dat Job met hem vrijelijk spreken mocht zonder schroom, als met zijns gelijke, zodat hij zich niet behoefde te ontschuldigen met de vreeslijke majesteit Gods, tegen welke hij verklaard had niet te kunnen verstaan. Zie boven, Job 9:32 , en Job 13:21 , en Job 16:21 ."},{"catchword":"adem","tekst":"Hij schijnt te zien op de schepping van den eersten mens; Gen 2:7 ."}],"5":[{"catchword":"schik u","tekst":"Of, schik, richt [uwe woorden]; gelijk Job 32:14 ."}],"6":[{"catchword":"ik ben","tekst":"Dat is, ik behoor God toe, zijnde van Hem geschapen, en totnutoe van Hem in het leven onderhouden. Anders, ik ben voor God naar uw woord, te weten om zijn zaak te verdedigen naar uw eigen begeerte."},{"catchword":"uit","tekst":"Te weten, in den eersten voorvader Adam, zodat ik van stof en afkomst uws gelijke ben, en daarom van u niet te vrezen; zie Gen 2:7 ."}],"7":[{"catchword":"mijn verschrikking","tekst":"Te weten, waarmede ik u zou mogen verschrikken."},{"catchword":"hand","tekst":"Zie boven, Job 13:21 , en de aantekening."}],"9":[{"catchword":"Ik ben","tekst":"Dit zijn de redenen, die Elihu uit Jobs redenen had gemerkt, oordelende die strafbaar te wezen. Men kan dezelve, of dergelijke vinden in de plaatsen hier recht tevoren op den kant aangetekend. Niettemin, Job heeft zijn zonden meermalen bekend, gelijk te zien is boven, Job 9:2 , en Job 14:4 ; maar sprekende van zijn onnozelheid, verstaat hij daarmede de gerechtigheid zijner zaak tegen zijn vrienden, en niet de gerechtigheid zijns persoons voor God."}],"10":[{"catchword":"Hij vindt","tekst":"Te weten, God. Job had wel deze zelfde woorden niet gebruikt, maar die van gelijken zin waren, boven, Job 14:16-17 ."},{"catchword":"oorzaken","tekst":"Dat is, stof om mij te bezwaren, dat is te beschuldigen en te straffen. Anders, afbrekingen; dat is, middelen om zich van mij of mij van hem te scheiden en alle vriendschap te breken, of om al mijn voornemens en pogen te vernietigen. Vergelijk Num 14:34 ."},{"catchword":"houdt mij","tekst":"Zie boven, Job 13:24 , en de aantekening; idem vergelijk boven, Job 16:9 , en Job 19:11 ."}],"11":[{"catchword":"Hij legt","tekst":"Zie boven, Job 13:27 , en de aantekening."},{"catchword":"Hij neemt","tekst":"Vergelijk boven, Job 14:16 , en Job 31:4 , met de aantekening."}],"12":[{"catchword":"hierin","tekst":"Dat is, in hetgeen ik nu van u verhaald heb."},{"catchword":"want God","tekst":"Hieruit besluit Elihu dat Job met meerderen ootmoed en eerbied tegen God gehandeld moest hebben; vervolgens, dewijl hij zich hierin vergrepen had, dat hij in dezen dele onrechtvaardig was, hoewel hij hem anders voor vroom bekende."},{"catchword":"meerder","tekst":"Ten aanzien niet alleen van zijn wezen en macht, maar ook van zijn wijsheid en rechtvaardigheid, enz."}],"13":[{"catchword":"Hij antwoordt","tekst":"De zin is dat God van al zijn doen ons geen rekenschap geeft, noch ook gehouden is te geven. Of aldus: omdat Hij al zijn woorden niet gesproken heeft. Anders, want Hij verantwoordt geen zijner daden, of werken; dat is, Hij is niet gehouden enige te antwoorden."}],"14":[{"catchword":"Maar God","tekst":"De zin is, hoewel God niet gehouden is van zijn doen ons rekenschap te geven, nochtans door zijn vriendelijke goedheid doet Hij het dikwijls, te weten als het Hem belieft, hetwelk van velen niet waargenomen wordt. Vergelijk Gen 6:3 ; Num 14:42 ; 1Ki 22:28 ; 2Ki 17:13 ; Dan 4:5 , Dan 4:22 , Dan 4:28 ; Mat 27:19 ."},{"catchword":"eens of tweemaal;","tekst":"Een zeker getal voor een onzeker. Alzo onder, vs.29. Zie Lev 26:8 ."},{"catchword":"let niet","tekst":"Hebreeuws, ziet."}],"15":[{"catchword":"In den droom,","tekst":"Zie Gen 20:3 , en Gen 28:12 , en de aantekening."}],"16":[{"catchword":"openbaart","tekst":"Dat is, opent en verlicht het verstand en bekeert den wil des mensen door zijn inwendige aanspraak en vermaning. Zie van dezelfde manier van spreken Rth 4:4 ."},{"catchword":"verzegelt","tekst":"Dat is, Hij drukt in hun harten de zekerheid zijner bestraffing; dat is, dat Hij zijn voornemen om hen te straffen zekerlijk uitvoeren zal. Zie dezelfde manier van spreken Deu 32:34 ."}],"17":[{"catchword":"van zijn","tekst":"Het woord van is hier in te voegen uit het volgende lid van vs.17."},{"catchword":"werk,","tekst":"Te weten, kwaad werk dat hij voorhad. Zie Gen 20:3 , en Gen 31:24 ."},{"catchword":"de hovaardij","tekst":"Dat is, de grootsheid en vermetelheid des harten, waardoor de mens tot een kwaad voornemen geraakt."},{"catchword":"verberge;","tekst":"Hebreeuws, bedekke; dat is, wegneme. Vergelijk de manier van spreken met degene die boven is, Job 3:10 ."}],"18":[{"catchword":"zwaard","tekst":"Het Hebreeuwse woord betekent een geweer, dat met werpen gebruikt wordt. Versta hierdoor, allerlei kwaad der ziel of des lichaams, tijdelijk of eeuwig. Vergelijk onder, Job 36:12 ."}],"19":[{"catchword":"Ook wordt","tekst":"De zin is dat God den mens vermaand heeft in voortijden, niet alleen door dromen en gezichten, maar ook, gelijk heden, door ziekten en krankheden, om op hun leven acht te nemen en God te vrezen."},{"catchword":"sterke","tekst":"Dat is, al zijn beenderen, die veel en sterk zijn; versta hierop, worden gestraft, uit het volgende. Anders, en de twist zijner beenderen is geweldig; dat is, de smart zijner beenderen, waardoor God gelijk met hem twist."}],"20":[{"catchword":"Zodat","tekst":"Anders, zodat zijn leven hem het brood doet verfoeien."},{"catchword":"de begeerlijke","tekst":"Hebreeuws, de spijs der begeerte; dat is, die men begeert, of waartoe men belust is, als men gezond is. Alzo vaten, of gereedschap der begeerte, 2Ch 32:27 ; het land der begeerte, Psa 106:24 ; wijnstokken der begeerte, Amo 5:11 ."}],"21":[{"catchword":"uit het gezicht,","tekst":"Dat is, dat het niet meer gezien wordt vanwege zijn magerheid."},{"catchword":"niet gezie /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
