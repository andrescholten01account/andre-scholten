sheid zijn; iemand die oprecht van kennis is, is bij u.","5":"Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.","6":"Hij laat de goddeloze niet leven, en het recht van de ellendigen verschaft Hij.","7":"Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.","8":"En als zij, gebonden met boeien, vastgehouden worden met banden van ellende;","9":"Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben;","10":"En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.","11":"Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.","12":"Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.","13":"En zij die met het hart huichelachtig zijn, stapelen toorn op; zij roepen niet, wanneer Hij hen gebonden heeft.","14":"Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.","15":"Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij *voor* hun oor openbaren.","16":"Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid *naar* de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.","17":"Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.","18":"Omdat er grimmigheid is, *pas op*, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.","19":"Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?","20":"Verlang niet naar die nacht, wanneer de volken van hun plaats worden weggenomen.","21":"Wacht u, keer u niet tot ongerechtigheid; want dat hebt u boven de ellende verkozen.","22":"Zie, God verhoogt door Zijn kracht; wie is een Leraar zoals Hij?","23":"Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?","24":"Denk eraan, dat u Zijn werk groot maakt, dat de mensen aanschouwen.","25":"Alle mensen zien het aan; de mens aanschouwt het van verre.","26":"Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.","27":"Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp;","28":"Die de wolken uitgieten, en over de mens overvloedig afdruipen.","29":"Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?","30":"Zie, Hij breidt over hem Zijn licht uit, en de bodem van de zee bedekt Hij.","31":"Want daardoor oordeelt Hij de volken; Hij geeft voedsel in overvloed.","32":"Met handen bedekt Hij het licht, en geeft daaraan bevel door hem die er tussendoor komt.","33":"Daarvan verkondigt Zijn geklater, en het vee; ook van de opgaande damp."},"SV":{"1":"Elihu ging nog voort, en zeide:","2":"Verbeid mij een weinig, en ik zal u aanwijzen, dat er nog redenen voor God zijn.","3":"Ik zal mijn gevoelen van verre ophalen, en mijn Schepper gerechtigheid toewijzen.","4":"Want voorwaar, mijn woorden zullen geen valsheid zijn; een, die oprecht is van gevoelen, is bij u.","5":"Zie, God is geweldig, nochtans versmaadt Hij niet; geweldig is Hij in kracht des harten.","6":"Hij laat den goddeloze niet leven, en het recht der ellendigen beschikt Hij.","7":"Hij onttrekt Zijn ogen niet van den rechtvaardige, maar met de koningen zijn zij in den troon; daar zet Hij hen voor altoos, en zij worden verheven.","8":"En zo zij, gebonden zijnde in boeien, vast gehouden worden met banden der ellende;","9":"Dan geeft Hij hun hun werk te kennen, en hun overtredingen, omdat zij de overhand genomen hebben;","10":"En Hij openbaart het *voor* hunlieder oor ter tucht, en zegt, dat zij zich van de ongerechtigheid bekeren zouden.","11":"Indien zij horen, en *Hem* dienen, zo zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.","12":"Maar zo zij niet horen, zo gaan zij door het zwaard door, en zij geven den geest zonder kennis.","13":"En die met het hart huichelachtig zijn, leggen toorn op; zij roepen niet, als Hij hen gebonden heeft.","14":"Hun ziel zal in de jonkheid sterven, en hun leven onder de schandjongens.","15":"Hij zal den ellendige in zijn ellende vrijmaken, en in de onderdrukking zal Hij het *voor* hunlieder oor openbaren.","16":"Alzo zou Hij ook u afgekeerd hebben van den mond des angstes *tot* de ruimte, onder dewelke geen benauwing zou geweest zijn; en het gerecht uwer tafel zou vol vettigheid geweest zijn.","17":"Maar gij hebt het gericht des goddelozen vervuld; het gericht en het recht houden *u* vast.","18":"Omdat er grimmigheid is, *wacht* *u*, dat Hij u misschien niet met een klop wegstote; zodat u een groot rantsoen er niet zou afbrengen.","19":"Zou Hij uw rijkdom achten, *dat* *gij* niet in benauwdheid zoudt zijn; of enige versterkingen van kracht?","20":"Haak niet naar dien nacht, *als* de volken van hun plaats opgenomen worden.","21":"Wacht u, wend u niet tot ongerechtigheid; overmits gij ze in dezen verkoren hebt, uit oorzake van de ellende.","22":"Zie, God verhoogt door Zijn kracht; wie is een Leraar, gelijk Hij?","23":"Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: Gij hebt onrecht gedaan?","24":"Gedenk, dat gij Zijn werk groot maakt, hetwelk de lieden aanschouwen.","25":"Alle mensen zien het aan; de mens schouwt *het* van verre.","26":"Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het getal Zijner jaren.","27":"Want Hij trekt de druppelen der wateren op, die den regen na zijn damp uitgieten;","28":"Welke de wolken uitgieten, *en* over den mens overvloediglijk afdruipen.","29":"Kan men ook verstaan de uitbreidingen der wolken, *en* de krakingen Zijner hutte?","30":"Zie, Hij breidt over hem Zijn licht uit, en de wortelen der zee bedekt Hij.","31":"Want daardoor richt Hij de volken; Hij geeft spijze ten overvloede.","32":"Met handen bedekt Hij het licht, en doet aan hetzelve verbod door dengene, die tussen doorkomt.","33":"Daarvan verkondigt Zijn geklater, *en* het vee; ook van den opgaanden *damp*."},"KJV":{"1":"Elihu also proceeded, and said,","2":"Suffer me a little, and I will shew thee that *I have* yet to speak on God's","3":"I will fetch my knowledge from afar, and will ascribe righteousness to my Maker.","4":"For truly my words *shall* not *be* false: he that is perfect in knowledge","5":"Behold, God *is* mighty, and despiseth not *any: he is* mighty in strength *and* wisdom.","6":"He preserveth not the life of the wicked: but giveth right to the poor.","7":"He withdraweth not his eyes from the righteous: but with kings *are they* on the throne; yea, he doth establish them for ever, and they are exalted.","8":"And if *they be* bound in fetters, *and* be holden in cords of affliction;","9":"Then he sheweth them their work, and their transgressions that they have exceeded.","10":"He openeth also their ear to discipline, and commandeth that they return from iniquity.","11":"If they obey and serve *him*, they shall spend their days in prosperity, and their years in pleasures.","12":"But if they obey not, they shall perish by the sword, and they shall die without knowledge.","13":"But the hypocrites in heart heap up wrath: they cry not when he bindeth","14":"They die in youth, and their life *is* among the unclean.","15":"He delivereth the poor in his affliction, and openeth their ears in oppression.","16":"Even so would he have removed thee out of the strait *into* a broad place, where *there is* no straitness; and that which should be set on thy table *should be* full of fatness.","17":"But thou hast fulfilled the judgment of the wicked: judgment and justice take hold","18":"Because *there is* wrath, *beware* lest he take thee away with *his* stroke: then a great ransom cannot deliver","19":"Will he esteem thy riches? *no*, not gold, nor all the forces of strength.","20":"Desire not the night, when people are cut off","21":"Take heed, regard not iniquity: for this hast thou chosen rather than affliction.","22":"Behold, God exalteth by his power: who teacheth","23":"Who hath enjoined him his way? or who can say, Thou hast wrought iniquity?","24":"Remember that thou magnify his work, which men behold.","25":"Every man may see it; man may behold *it* afar off.","26":"Behold, God *is* great, and we know *him* not, neither can the number of his years be searched out.","27":"For he maketh small the drops of water: they pour down rain according to the vapour","28":"Which the clouds do drop *and* distil upon man abundantly.","29":"Also can *any* understand the spreadings of the clouds, *or* the noise of his tabernacle?","30":"Behold, he spreadeth his light upon it, and covereth the bottom of the sea.","31":"For by them judgeth he the people; he giveth meat in abundance.","32":"With clouds he covereth the light; and commandeth it *not to shine* by *the cloud* that cometh betwixt.","33":"The noise thereof sheweth concerning it, the cattle also concerning the vapour."}},"tsk":{"2":[{"kopje":"Wacht","refs":["Job 21:3","Job 33:31-33","Hebr 13:22"]},{"kopje":"ik zal u aanwijzen","refs":["Job 13:7","Job 13:8","Job 33:6","Ex 4:16","Jer 15:19","Ezech 2:7","2 Kor 5:20"]}],"3":[{"kopje":"ophalen","refs":["Job 28:12","Job 28:13","Job 28:20-24","Job 32:8","Spr 2:4","Spr 2:5","Matt 2:1","Matt 2:2","Matt 12:42","Hand 8:27-40","Rom 10:6-8","Jak 1:5","Jak 1:17","Jak 3:17"]},{"kopje":"toewijzen","refs":["Job 32:2","Job 34:5","Job 34:10-12","Deut 32:4","Ps 11:7","Ps 145:17","Jer 12:1","Dan 9:7","Dan 9:14","Rom 3:25","Rom 3:26","Rom 9:14","Openb 15:3"]}],"4":[{"kopje":"mijn","refs":["Job 13:4","Job 13:7","Job 21:27","Job 21:34","Job 22:6-30","Spr 8:7","Spr 8:8","2 Kor 2:17"]},{"kopje":"oprecht","refs":["Job 37:16","Luk 1:3","Hand 24:22","1 Kor 14:20","Kol 4:12","2 Tim 3:16","2 Tim 3:17"]},{"kopje":"bij","refs":["Ps 49:4","Spr 22:20", "H1478\">die</span> without knowledge.","13":"But the <span class=\"wl wl-kjv\" data-code=\"H2611\">hypocrites</span> in <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> heap <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath:</span> they <span class=\"wl wl-kjv\" data-code=\"H7768\">cry</span> not when he bindeth","14":"<span class=\"wl wl-kjv\" data-code=\"H5315\">They</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in <span class=\"wl wl-kjv\" data-code=\"H5290\">youth,</span> and their <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> is among the unclean.","15":"He <span class=\"wl wl-kjv\" data-code=\"H2502\">delivereth</span> the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> in his <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction,</span> and <span class=\"wl wl-kjv\" data-code=\"H1540\">openeth</span> their <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> in oppression.","16":"Even so would he have <span class=\"wl wl-kjv\" data-code=\"H5496\">removed</span> thee out of the <span class=\"wl wl-kjv\" data-code=\"H6310\">strait</span> into a broad <span class=\"wl wl-kjv\" data-code=\"H7338\">place,</span> <span class=\"wl wl-kjv\" data-code=\"H8478\">where</span> there is no <span class=\"wl wl-kjv\" data-code=\"H4164\">straitness;</span> and that which should be <span class=\"wl wl-kjv\" data-code=\"H5183\">set</span> on thy <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> should be <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of fatness.","17":"But thou hast <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> the <span class=\"wl wl-kjv\" data-code=\"H1779\">judgment</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked:</span> <span class=\"wl wl-kjv\" data-code=\"H1779\">judgment</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">justice</span> take hold","18":"Because there is <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath,</span> beware lest he take thee <span class=\"wl wl-kjv\" data-code=\"H5496\">away</span> with his <span class=\"wl wl-kjv\" data-code=\"H5607\">stroke:</span> then a <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3724\">ransom</span> cannot deliver","19":"Will he <span class=\"wl wl-kjv\" data-code=\"H6186\">esteem</span> thy <span class=\"wl wl-kjv\" data-code=\"H7769\">riches?</span> no, not <span class=\"wl wl-kjv\" data-code=\"H1222\">gold,</span> nor all the <span class=\"wl wl-kjv\" data-code=\"H3981\">forces</span> of strength.","20":"<span class=\"wl wl-kjv\" data-code=\"H7602\">Desire</span> not the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> when <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are cut off","21":"Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed,</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">regard</span> not <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity:</span> for this hast thou <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> rather than affliction.","22":"Behold, <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7682\">exalteth</span> by his <span class=\"wl wl-kjv\" data-code=\"H3581\">power:</span> who teacheth","23":"Who hath <span class=\"wl wl-kjv\" data-code=\"H6485\">enjoined</span> him his <span class=\"wl wl-kjv\" data-code=\"H1870\">way?</span> or who can <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thou hast <span class=\"wl wl-kjv\" data-code=\"H6466\">wrought</span> iniquity?","24":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> that thou <span class=\"wl wl-kjv\" data-code=\"H7679\">magnify</span> his <span class=\"wl wl-kjv\" data-code=\"H6467\">work,</span> which <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> behold.","25":"Every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> may <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> it; <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> may <span class=\"wl wl-kjv\" data-code=\"H5027\">behold</span> it afar off.","26":"Behold, <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H7689\">great,</span> and we <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> him not, neither can the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of his <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> be searched out.","27":"For he maketh <span class=\"wl wl-kjv\" data-code=\"H1639\">small</span> the <span class=\"wl wl-kjv\" data-code=\"H5198\">drops</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> they pour <span class=\"wl wl-kjv\" data-code=\"H2212\">down</span> <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> according to the vapour","28":"Which the <span class=\"wl wl-kjv\" data-code=\"H7834\">clouds</span> do <span class=\"wl wl-kjv\" data-code=\"H5140\">drop</span> and <span class=\"wl wl-kjv\" data-code=\"H7491\">distil</span> upon <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> abundantly.","29":"Also can any <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> the <span class=\"wl wl-kjv\" data-code=\"H4666\">spreadings</span> of the <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds,</span> or the <span class=\"wl wl-kjv\" data-code=\"H8663\">noise</span> of his tabernacle?","30":"Behold, he <span class=\"wl wl-kjv\" data-code=\"H6566\">spreadeth</span> his <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> upon it, and <span class=\"wl wl-kjv\" data-code=\"H3680\">covereth</span> the <span class=\"wl wl-kjv\" data-code=\"H8328\">bottom</span> of the sea.","31":"For by them <span class=\"wl wl-kjv\" data-code=\"H1777\">judgeth</span> he the <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> in abundance.","32":"With <span class=\"wl wl-kjv\" data-code=\"H3709\">clouds</span> he <span class=\"wl wl-kjv\" data-code=\"H3680\">covereth</span> the <span class=\"wl wl-kjv\" data-code=\"H216\">light;</span> and <span class=\"wl wl-kjv\" data-code=\"H6680\">commandeth</span> it not to shine by the cloud that cometh betwixt.","33":"The <span class=\"wl wl-kjv\" data-code=\"H7452\">noise</span> thereof <span class=\"wl wl-kjv\" data-code=\"H5046\">sheweth</span> concerning it, the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> also concerning the vapour."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"redenen","tekst":"Of, woorden, inhoudende vaste redenen, om de gerechtigheid Gods te verdedigen."}],"3":[{"catchword":"van verre","tekst":"Dat is, van omhoog af, te weten, van de natuur, eigenschappen en werken Gods."},{"catchword":"Schepper","tekst":"Hebreeuws, werker, dat is, Schepper. Vergelijk boven, Job 4:17 ."},{"catchword":"toewijzen","tekst":"Hebreeuws, geven."}],"4":[{"catchword":"een, die oprecht is","tekst":"Elihu verstaat hiermede zichzelven, sprekende in den derden persoon uit manierlijkheid, om geen achterdenken van hovaardigheid te verwekken."}],"5":[{"catchword":"God is geweldig,","tekst":"Alsof hij zeide: Hoewel God almachtig is, dat Hij doen kan al hetgeen wat Hij wil, Gen 17:1 , en Gen 18:14 ; Psa 115:3 , nochtans is Hij ook rechtvaardig, dat Hij niemand ten ongelijke straffen zal, [gelijk Jobs woorden schenen te luiden, boven, Job 19:7 , en Job 23:13 , en Job 30:21 ] ; en dat overmits Hij machtig is, niet alleen in zijn daden, maar ook in zijn hart, gelijk volgt."},{"catchword":"versmaadt Hij niet;","tekst":"Te weten, zonder rechtvaardige oorzaak. Zie het volgende."},{"catchword":"des harten","tekst":"Versta door het hart Gods zijn wijsheid en wil, die ten hoogste volmaakt zijn."}],"6":[{"catchword":"niet leven,","tekst":"Te weten, niet eeuwiglijk, maar eindelijk doodt Hij hem, òf hier, òf hierna. Anders, Hij bewaart het leven des goddelozen niet."},{"catchword":"schikt Hij","tekst":"Hebreeuws, geeft."}],"7":[{"catchword":"zijn zij","tekst":"Te weten, de rechtvaardigen. De zin is, dat zij eindelijk zeer hoog verheven worden; hetwelk voornamelijk vervuld wordt in het toekomende leven. Vergelijk 1Sa 2:8 ; Psa 113:7 . Anders, met de koningen is Hij [te weten God] bij den troon, opdat Hij hen daar zette, enz."}],"8":[{"catchword":"in boeien,","tekst":"Zo worden genaamd de kastijdingen, die God den vromen toezendt, uit oorzaak van hun zonden, om hen tot leedwezen en betering te brengen. Zie boven, Job 13:27 ; onder, vs.13, en Job 42:10 ; Psa 107:10 ."},{"catchword":"der ellende;","tekst":"Dat is, die hun ellende toebrengen."}],"9":[{"catchword":"werk","tekst":"Dat is, hun kwaad leven, waardoor zij de straffen Gods over zich gebracht hebben, gelijk het volgende woord verklaart."},{"catchword":"te kennen,","tekst":"Te weten, door die ellende en kastijding."},{"catchword":"omdat zij","tekst":"Dat is, omdat zij zeer groot en vele geworden zijn."}],"10":[{"catchword":"openbaart","tekst":"Dat is, Hij opent hun verstand, onderwijst en bekeert hen. Alzo onder, vs.15; zie boven, Job 33:16 ."},{"catchword":"zegt,","tekst":"Dat is, beveelt en vermaant; alzo boven, Job 9:7 ; zie ook 2Ch 29:24 ."}],"11":[{"catchword":"goede,","tekst":"Vergelijk boven, de aantekening Job 21:25 ."},{"catchword":"liefelijkheden","tekst":"Dat is, in welvaren des geestes en des lichaams. Zie Psa 36:8-9 ."}],"12":[{"catchword":"zo vergaan","tekst":"Zie boven, Job 33:18 ."},{"catchword":"zonder kennis","tekst":"Dat is, zonder geloof en boetvaardigheid."}],"13":[{"catchword":"die","tekst":"Dat is, die onzuiver, onheilig en vals van geest zijn, en niet zijn die zij schijnen; Mat 23:27-28 ; Luk 16:15 ."},{"catchword":"leggen","tekst":"Dat is, vergaderen een schat van Gods wraak, Rom 2:5 . Het woord toorn alleen gesteld, betekent zeer dikwijls den toorn Gods. Zie 2Ch 28:13 ."},{"catchword":"roepen niet,","tekst":"Dat is, zij bidden God niet om zijn genade en hulp. Roepen voor ernstig en vurig bidden, Exo 14:10 , Exo 14:15 ; Neh 9:9 ; Psa 22:3 , enz."},{"catchword":"Hij hen","tekst":"Dat is, als hen God gestraft heeft. Vergelijk boven, de aantekening vs.8."}],"14":[{"catchword":"Hun ziel","tekst":"Dat is, hun leven zal in de eerste jaren eindigen."},{"catchword":"schandjongens","tekst":"Versta, onder een soort van gruwelijke zondaren alle anderen; zie van deze zondaren Deu 23:17 , en de aantekening."}],"15":[{"catchword":"Hij zal","tekst":"Te weten, God."},{"catchword":"zal Hij het","tekst":"Dat is, Hij zal hen onderwijzen en vermanen tot hun schuldigen plicht, gelijk boven, vs.10."}],"16":[{"catchword":"mond des angstes","tekst":"Dat is, het geweld der benauwdheid; want gelijk de wilde dieren met hun muil verslinden, alzo verteert het geweld van den druk den mens."},{"catchword":"ruimte,","tekst":"Dat is, in een vrije en open plaats, waar hij onbenauwd en naar zijn wens zou geweest zijn. Alzo Psa 18:20 ."},{"catchword":"geen benauwing","tekst":"Dat is, geen zwarigheid, noch druk, die den mens benauwt."},{"catchword":"het gerecht","tekst":"Anders, uw tafel zou gerust geweest zijn, vol vettigheid."},{"catchword":"vettigheid","tekst":"Dat is, overvloed en lieflijke spijs."}],"17":[{"catchword":"gericht","tekst":"Dat is, de maat uwer zonde, met kwaad en onbedacht spreken; hetwelk straf verdient. Vergelijk boven, Job 34:8 . Recht wordt hier genomen voor de rechtvaardige straf, en deze voor de zonde, die rechtvaardiglijk gestraft moet zijn."},{"catchword":"houden u vast","tekst":"Te weten, dat gij aan de straf schuldig zijt. Anders, zouden het recht en het gericht [dat] ondersteunen? Dat is, voorstaan?"}],"18":[{"catchword":"grimmigheid is,","tekst":"Namelijk, bij God, dewijl Hij rechtvaardig is."},{"catchword":"een klop","tekst":"Dat is, met een zeer zware plaag, die u gans tenonder brengt. Anders, met samenklapping [der handen]."},{"catchword":"daar niet","tekst":"Te weten, van de rechtvaardige straf Gods."}],"19":[{"catchword":"dat gij","tekst":"Anders, niet het goud [zelf], noch enige versterkingen van kracht; te weten, zal Hij achten."},{"catchword":"versterkingen","tekst":"Versta, al hetgeen men zou mogen toebrengen om zich te wapenen en sterken tegen Gods gramschap, en de verdiende straffen te ontgaan."}],"20":[{"catchword":"Haak niet","tekst":"Dat is, zijt niet begerig om zeer zorgvuldig te onderzoeken de oorzaak van Gods oordeel, waardoor Hij somtijds in een nacht gehele volken uitroeit, de goeden met de kwaden. Versta daarbij, dat Job ook niet curieuslijk moest onderzoeken waarom hij in een weinig tijds uit zijn welvaren geworpen was. Sommigen verstaan door den nacht den tijdelijken dood, en dat Job vermaand wordt daarnaar niet te verlangen, alzo de goddelozen door denzelven doorgaan tot den eeuwigen dood."},{"catchword":"nacht,","tekst":"Van welken Elihu gesproken had, boven, Job 34:20 ."},{"catchword":"opgenomen","tekst":"Dat is, uitgeroeid, verdelgd worden, omkomen, vergaan. Het Hebreeuwse woord is zo genomen Psa 102:25 ."}],"21":[{"catchword":"ongerechtigheid;","tekst":"Of, ijdelheid, waardoor gij God over zijn oordelen beschuldigen zoudt."},{"catchword":"overmits","tekst":"Dat is, dewijl gij deze ongerechtigheid reeds aangenomen hebt, gelijk het schijnt uit dezen uw handel en de redenen, die van u gekomen zijn."},{"catchword":"ellende","tekst":"Te weten, die u alsnu toegezonden is van God. Anders, verkoren hebt meer dan de ellende? dat is, meer dan de lijdzaamheid, die gij in uw ellende behoordet te hebben."}],"22":[{"catchword":"verhoogt","tekst":"Te weten, de ellendigen; dat is, verlos hen uit hun nood. Verhogen voor verlossen, Psa 9:14 , en Psa 18:49 . Anders, God verhoogt zich; te weten, in de ganse regering der wereld, vertonende alleszins daarin zijn wonderbare wijsheid, almogendheid en hoge oordelen."},{"catchword":"gelijk Hij?","tekst":"Versta, niemand; en daarom kan Hem ook niemand leren hoe Hij de wereld regeren moet; hetwelk gij, o Job, schijnt te willen doen, als gij tegen zijn regering klachtig valt."}],"23":[{"catchword":"gesteld","tekst":"Dat is, Hem voorgeschreven wat Hij doen moet, de wijze hoe Hij werken en regeren moet."}],"24":[{"catchword":"groot maakt,","tekst":"Te weten, met dat te prijzen, inplaats van iets daarin te berispen."},{"catchword":"aanschouwen","tekst":"Te weten, met verwondering."}],"25":[{"catchword":"Alle mensen","tekst":"Te weten, die enig verstand hebben en dat wel gebruiken."},{"catchword":"van verre","tekst":"Dat is, niet volkomenlijk, zulks dat hij het werk en de redenen daarvan maar ten dele begrijpen kan."}],"26":[{"catchword":"groot,","tekst":"Te weten, in wezen, eigenschappen en werken; doch hier wordt voornamelijk van zijne werken gesproken."},{"catchword":"wij begrijpen","tekst":"Voornamelijk in dit leven, waar onze kennis maar stuksgewijs is; 1Co 13:10 , 1Co 13:12 . Hebreeuws, wij weten het niet."},{"catchword":"onderzoeking","tekst":"Te weten, waardoor zijn eeuwigheid en oneindelijkheid van ons zou kunnen uitgevonden en begrepen worden."}],"27":[{"catchword":"Want Hij","tekst":"Door enige exempelen van Gods werken bewijst hij zijn grote wijsheid en kracht."},{"catchword":"der wateren op,","tekst":"Te weten, die hier beneden zijn en voornamelijk in de zee. Deze trekt God opwaarts, door de dampen daaruit rijzende, in de lucht, alwaar zij ineen klonteren en wolken worden; zie Gen 2:6 ."},{"catchword":"na zijn damp","tekst":"Dat is, na Gods damp; te weten, nadat God van die dampen, die Hij uit de wateren in de lucht opgetrokken had, wolken gemaakt heeft. Of, nadat de damp is, die God uit de wateren heeft opgetrokken om in wolken veranderd te worden."}],"28":[{"catchword":"Welke","tekst":"Te weten, regen."}],"29":[{"catchword":"uitbreidingen","tekst":"Dat is, hoe ver en wijd, en over welke plaatsen zij zich uitspannen, als zij den regen uitstorten."},{"catchword":"Zijner hutte?","tekst":"Te weten, der // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
