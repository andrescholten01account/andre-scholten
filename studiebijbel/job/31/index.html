rkers van ongerechtigheid?","4":"Ziet Hij niet mijn wegen, en telt Hij niet al mijn treden?","5":"Als ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij;","6":"Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten.","7":"Als mijn gang uit de weg geweken is, en mijn hart mijn ogen nagevolgd is, en aan mijn handen iets aankleeft;","8":"Zo moet ik zaaien, maar een ander eten, en mijn spruiten moeten uitgeworteld worden!","9":"Als mijn hart verlokt is geweest tot een vrouw, of ik aan mijn naasten deur geloerd heb;","10":"Zo moet mijn huisvrouw met een ander malen, en anderen zich over haar krommen!","11":"Want dat is een schandelijke daad, en het is een misdaad *bij* de rechters.","12":"Want dat is een vuur, dat tot de verderving toe verteert, en al mijn inkomen uitgeworteld zou hebben.","13":"Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij;","14":"(Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden?","15":"Heeft Hij niet, Die mij in de buik maakte, hem *ook* gemaakt en Een ons in de baarmoeder bereid?)","16":"Als ik de armen *hun* begeerte onthouden heb, of de ogen van de weduwe laten versmachten;","17":"En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft;","18":"(Want van mijn jonkheid af is hij bij mij opgetogen, als *bij* een vader, en van mijner moeders buik af heb ik haar geleid;)","19":"Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had;","20":"Als zijn lenden mij niet gezegend hebben, toen hij van de vellen van mijn lammeren verwarmd werd;","21":"Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;","22":"Mijn schouder valt van het schouderbeen, en mijn arm breekt van zijn pijp af!","23":"Want het verderf van God was bij mij een schrik, en ik vermocht niet vanwege Zijn hoogheid.","24":"Als ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: U bent mijn vertrouwen;","25":"Als ik blijde ben geweest, omdat mijn vermogen groot was, en omdat mijn hand geweldig veel verkregen had;","26":"Als ik het licht aangezien heb, wanneer het scheen, of de maan heerlijk voortgaande;","27":"En mijn hart verlokt is geweest in het verborgen, dat mijn hand mijn mond gekust heeft;","28":"Dat ware ook een misdaad *bij* de rechter; want ik zou de God van boven verzaakt hebben.","29":"Als ik verblijd ben geweest in de verdrukking van mijn haters, en mij opgewekt heb, als het kwaad hem vond;","30":"(Ook heb ik mijn gehemelte niet toegelaten te zondigen, door een vloek zijn ziel te begeren).","31":"Als de lieden van mijn tent niet hebben gezegd: Och, hadden wij van zijn vlees maar, wij zouden niet verzadigd worden;","32":"De vreemdeling overnachtte niet op de straat; mijn deuren opende ik naar de weg;","33":"Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!","34":"Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.","35":"Och, had ik er maar een die mij hoorde! Zie, mijn oogmerk is, dat de Almachtige mij antwoordt, en dat mijn tegenpartij een boek schrijft.","36":"Zou ik het niet op mijn schouder dragen? Ik zou het op mij binden *als* een kroon.","37":"Het getal van mijn treden zou ik hem aanwijzen; als een vorst zou ik tot hem naderen.","38":"Als mijn land tegen mij roept, en zijn voren samen wenen;","39":"Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;","40":"Dat voor tarwe distels voortkomen, en voor gerst stinkkruid! De woorden van Job hebben een einde."},"SV":{"1":"Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd?","2":"Want wat is het deel Gods van boven, of de erve des Almachtigen uit de hoogten?","3":"Is niet het verderf voor den verkeerde, ja, wat vreemds voor de werkers der ongerechtigheid?","4":"Ziet Hij niet mijn wegen, en telt Hij niet al mijn treden?","5":"Zo ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij;","6":"Hij wege mij op, in een rechte weegschaal, en God zal mijn oprechtigheid weten.","7":"Zo mijn gang uit den weg geweken is, en mijn hart mijn ogen nagevolgd is, en aan mijn handen iets aankleeft;","8":"Zo moet ik zaaien, maar een ander eten, en mijn spruiten moeten uitgeworteld worden!","9":"Zo mijn hart verlokt is geweest tot een vrouw, of ik aan mijns naasten deur geloerd heb;","10":"Zo moet mijn huisvrouw met een ander malen, en anderen zich over haar krommen!","11":"Want dat is een schandelijke daad, en het is een misdaad *bij* de rechters.","12":"Want dat is een vuur, hetwelk tot de verderving toe verteert, en al mijn inkomen uitgeworteld zou hebben.","13":"Zo ik versmaad heb het recht mijns knechts, of mijner dienstmaagd, als zij geschil hadden met mij;","14":"(Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden?","15":"Heeft Hij niet, Die mij in den buik maakte, hem *ook* gemaakt en Een ons in de baarmoeder bereid?)","16":"Zo ik den armen *hun* begeerte onthouden heb, of de ogen der weduwe laten versmachten;","17":"En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft;","18":"( Want van mijn jonkheid af is hij bij mij opgetogen, als *bij* een vader, en van mijner moeders buik af heb ik haar geleid;)","19":"Zo ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had;","20":"Zo zijn lenden mij niet gezegend hebben, toen hij van de vellen mijner lammeren verwarmd werd;","21":"Zo ik mijn hand tegen den wees bewogen heb, omdat ik in de poort mijn hulp zag;","22":"Mijn schouder valle van het schouderbeen, en mijn arm breke van zijn pijp af!","23":"Want het verderf Gods was bij mij een schrik, en ik vermocht niet vanwege Zijn hoogheid.","24":"Zo ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: Gij zijt mijn vertrouwen;","25":"Zo ik blijde ben geweest, omdat mijn vermogen groot was, en omdat mijn hand geweldig veel verkregen had;","26":"Zo ik het licht aangezien heb, wanneer het scheen, of de maan heerlijk voortgaande;","27":"En mijn hart verlokt is geweest in het verborgen, dat mijn hand mijn mond gekust heeft;","28":"Dat ware ook een misdaad *bij* den rechter; want ik zou den God van boven verzaakt hebben.","29":"Zo ik verblijd ben geweest in de verdrukking mijns haters, en mij opgewekt heb, als het kwaad hem vond;","30":"(Ook heb ik mijn gehemelte niet toegelaten te zondigen, mits door een vloek zijn ziel te begeren).","31":"Zo de lieden mijner tent niet hebben gezegd: Och, of wij van zijn vlees hadden, wij zouden niet verzadigd worden;","32":"De vreemdeling overnachtte niet op de straat; mijn deuren opende ik naar den weg;","33":"Zo ik, gelijk Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!","34":"Zeker, ik kon wel een grote menigte geweldiglijk onderdrukt hebben; maar de verachtste der huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en ter deure niet uitgegaan zijn.","35":"Och, of ik een hadde, die mij hoorde! Zie, mijn oogmerk is, dat de Almachtige mij antwoorde, en dat mijn tegenpartij een boek schrijve.","36":"Zou ik het niet op mijn schouder dragen? Ik zou het op mij binden *als* een kroon.","37":"Het getal mijner treden zou ik hem aanwijzen; als een vorst zou ik tot hem naderen.","38":"Zo mijn land tegen mij roept, en zijn voren te zamen wenen;","39":"Zo ik zijn vermogen gegeten heb zonder geld, en de ziel zijner akkerlieden heb doen hijgen;","40":"Dat voor tarwe distelen voortkomen, en voor gerst stinkkruid! De woorden van Job hebben een einde."},"KJV":{"1":"I made a covenant with mine eyes; why then should I think upon a maid?","2":"For what portion of God *is there* from above? and *what* inheritance of the Almighty from on high?","3":"*Is* not destruction to the wicked? and a strange *punishment* to the workers of iniquity?","4":"Doth not he see my ways, and count all my steps?","5":"If I have walked with vanity, or if my foot hath hasted to deceit;","6":"Let me be weighed in an even balance, that God may know mine integrity.","7":"If my step hath turned out of the way, and mine heart walked after mine eyes, and if any blot hath cleaved to mine hands;","8":"*Then* let me sow, and let another eat; yea, let my offspring be rooted out.","9":"If mine heart have been deceived by a woman, or *if* I have laid wait at my neighbour's door;","10":"*Then* let my wife grind unto another, and let others bow down","11":"For this *is* an heinous crime; yea, it *is* an iniquity *to be punished by* the judges.","12":"For it *is* a fire *that* consumeth to destruction, and would root out all mine increase.","13":"If I did despise the cause of my manservant or of my maidservant, when they contended","14":"What then shall I do when God riseth up? and when he visiteth, what shall I answer","15":"Did not he that made me in the womb make him? and did not one fashion us in the womb?","16":"If I have withheld the poor from *their* desire, or have caused the eyes of the widow to fail;","17":"Or have eaten my morsel myself alone, and the fatherless hath not eaten","18":"(For from my youth he was brought up with me, as *with* a father, and I have guided her from my mother's womb;)","19":"If I have seen any perish for want of clothing, or any poor without covering;","20":"If his loins have not blessed me, and *if* he were *not* warmed with the fleece of my sheep;","21":"If I have lifted up my hand against the fatherless, when I saw my help in the gate:","22":"*Then* let mine arm fall from my shoulder blade, and mine arm be broken from the bone.","23":"For destruction *from* God *was* a terror to me, and by reason of his highness I could","24":"If I have made gold my hope, or have said to the fine gold, *Thou art* my confidence;","25":"If I rejoiced because my wealth *was* great, and because mine hand had gotten much;","26":"If I beheld the sun when it shined, or the moon walking *in* brightness;","27":"And my heart hath been secretly enticed, or my mouth hath kissed my hand:","28":"This also *were* an iniquity *to be punished by* the judge: for I should have denied the God *that is* above.","29":"If I rejoiced at the destruction of him that hated me, or lifted up myself when evil found","30":"Neither have I suffered my mouth to sin by wishing a curse to his soul.","31":"If the men of my tabernacle said not, Oh that we had of his flesh! we cannot be satisfied.","32":"The stranger did not lodge in the street: *but* I opened my doors to the traveller.","33":"If I covered my transgressions as Adam, by hiding mine iniquity in my bosom:","34":"Did I fear a great multitude, or did the contempt of families terrify me, that I kept silence, *and* went not out of the door?","35":"Oh that one would hear me! behold, my desire *is, that* the Almighty would answer me, and *that* mine adversary had written a book.","36":"Surely I would take it upon my shoulder, *and* bind it *as* a crown","37":"I would declare unto him the number of my steps; as a prince would I go near","38":"If my land cry against me, or that the furrows likewise thereof complain;","39":"If I have eaten the fruits thereof without money, or have caused the owners thereof to lose their life:","40":"Let thistles grow instead of wheat, and cockle instead of barley. The words of Job are ended."}},"tsk":{"1":[{"kopje":"een verbond","refs":["Gen 6:2","2 Sam 11:2-4","Ps 119:37","Spr 4:25","Spr 23:31-33","Matt 5:28","Matt 5:29","1 Joh 2:16"]},{"kopje":"acht gegeven","refs":["Spr 6:25","Jak 1:14","Jak 1:15"]}],"3":[{"kopje":"verderf","refs":["Job 21:30","Ps 55:24","Ps 73:18","Spr 1:27","Spr 10:29","Spr 21:15","Matt 7:13","Rom 9:22","1 Tess 5:3","2 Tess 1:9","2 Petr 2:1"]},{"kopje":"wat vreemds","refs":["Jes 28:21","Juda  wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes;</span> why then should I <span class=\"wl wl-kjv\" data-code=\"H995\">think</span> upon a maid?","2":"For what <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> is there from <span class=\"wl wl-kjv\" data-code=\"H4605\">above?</span> and what <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> from on high?","3":"Is not <span class=\"wl wl-kjv\" data-code=\"H343\">destruction</span> to the <span class=\"wl wl-kjv\" data-code=\"H5767\">wicked?</span> and a <span class=\"wl wl-kjv\" data-code=\"H5235\">strange</span> punishment to the <span class=\"wl wl-kjv\" data-code=\"H6466\">workers</span> of iniquity?","4":"Doth not he <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">count</span> all my steps?","5":"If I have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> with <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity,</span> or if my <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> hath <span class=\"wl wl-kjv\" data-code=\"H2363\">hasted</span> to deceit;","6":"Let me be <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> in an <span class=\"wl wl-kjv\" data-code=\"H6664\">even</span> <span class=\"wl wl-kjv\" data-code=\"H3976\">balance,</span> that <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> mine integrity.","7":"If my <span class=\"wl wl-kjv\" data-code=\"H838\">step</span> hath turned <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and if any <span class=\"wl wl-kjv\" data-code=\"H3971\">blot</span> hath <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaved</span> to mine hands;","8":"Then let me <span class=\"wl wl-kjv\" data-code=\"H2232\">sow,</span> and let <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> yea, let my <span class=\"wl wl-kjv\" data-code=\"H6631\">offspring</span> be rooted out.","9":"If mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> have been <span class=\"wl wl-kjv\" data-code=\"H6601\">deceived</span> by a <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> or if I have laid <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> at my <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> door;","10":"Then let my <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H2912\">grind</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">another,</span> and let <span class=\"wl wl-kjv\" data-code=\"H312\">others</span> bow down","11":"For this is an heinous <span class=\"wl wl-kjv\" data-code=\"H2154\">crime;</span> yea, it is an <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> to be punished by the judges.","12":"For it is a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">consumeth</span> to <span class=\"wl wl-kjv\" data-code=\"H11\">destruction,</span> and would root <span class=\"wl wl-kjv\" data-code=\"H8327\">out</span> all mine increase.","13":"If I did <span class=\"wl wl-kjv\" data-code=\"H3988\">despise</span> the <span class=\"wl wl-kjv\" data-code=\"H4941\">cause</span> of my <span class=\"wl wl-kjv\" data-code=\"H5650\">manservant</span> or of my <span class=\"wl wl-kjv\" data-code=\"H519\">maidservant,</span> when they contended","14":"What then shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> when <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> riseth <span class=\"wl wl-kjv\" data-code=\"H6965\">up?</span> and when he <span class=\"wl wl-kjv\" data-code=\"H6485\">visiteth,</span> what shall I answer","15":"Did not he that <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me in the <span class=\"wl wl-kjv\" data-code=\"H990\">womb</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> him? and did not <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">fashion</span> us in the womb?","16":"If I have <span class=\"wl wl-kjv\" data-code=\"H4513\">withheld</span> the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> from their <span class=\"wl wl-kjv\" data-code=\"H2656\">desire,</span> or have caused the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H490\">widow</span> to fail;","17":"Or have <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> my <span class=\"wl wl-kjv\" data-code=\"H6595\">morsel</span> myself alone, and the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless</span> hath not eaten","18":"(For from my <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> he was brought <span class=\"wl wl-kjv\" data-code=\"H1431\">up</span> with me, as with a <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and I have <span class=\"wl wl-kjv\" data-code=\"H5148\">guided</span> her from my <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> womb;)","19":"If I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> any <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> for want of <span class=\"wl wl-kjv\" data-code=\"H3830\">clothing,</span> or any <span class=\"wl wl-kjv\" data-code=\"H34\">poor</span> without covering;","20":"If his <span class=\"wl wl-kjv\" data-code=\"H2504\">loins</span> have not <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> me, and if he were not <span class=\"wl wl-kjv\" data-code=\"H2552\">warmed</span> with the <span class=\"wl wl-kjv\" data-code=\"H1488\">fleece</span> of my sheep;","21":"If I have lifted <span class=\"wl wl-kjv\" data-code=\"H5130\">up</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> when I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> my <span class=\"wl wl-kjv\" data-code=\"H5833\">help</span> in the gate:","22":"Then let mine <span class=\"wl wl-kjv\" data-code=\"H3802\">arm</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> from my shoulder <span class=\"wl wl-kjv\" data-code=\"H7929\">blade,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H248\">arm</span> be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> from the bone.","23":"For <span class=\"wl wl-kjv\" data-code=\"H343\">destruction</span> from <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> was a <span class=\"wl wl-kjv\" data-code=\"H6343\">terror</span> to me, and by reason of his <span class=\"wl wl-kjv\" data-code=\"H7613\">highness</span> I could","24":"If I have <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> my <span class=\"wl wl-kjv\" data-code=\"H3689\">hope,</span> or have <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the fine <span class=\"wl wl-kjv\" data-code=\"H3800\">gold,</span> Thou art my confidence;","25":"If I <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> because my <span class=\"wl wl-kjv\" data-code=\"H2428\">wealth</span> was <span class=\"wl wl-kjv\" data-code=\"H7227\">great,</span> and because mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> had <span class=\"wl wl-kjv\" data-code=\"H4672\">gotten</span> much;","26":"If I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> the <span class=\"wl wl-kjv\" data-code=\"H216\">sun</span> when it <span class=\"wl wl-kjv\" data-code=\"H1984\">shined,</span> or the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walking</span> in brightness;","27":"And my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> hath been <span class=\"wl wl-kjv\" data-code=\"H5643\">secretly</span> <span class=\"wl wl-kjv\" data-code=\"H6601\">enticed,</span> or my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> hath <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> my hand:","28":"This also were an <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> to be punished by the <span class=\"wl wl-kjv\" data-code=\"H6416\">judge:</span> for I should have <span class=\"wl wl-kjv\" data-code=\"H3584\">denied</span> the <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> that is above.","29":"If I <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> at the <span class=\"wl wl-kjv\" data-code=\"H6365\">destruction</span> of him that <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> me, or lifted <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> myself when <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> found","30":"Neither have I <span class=\"wl wl-kjv\" data-code=\"H5414\">suffered</span> my <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> by <span class=\"wl wl-kjv\" data-code=\"H7592\">wishing</span> a <span class=\"wl wl-kjv\" data-code=\"H423\">curse</span> to his soul.","31":"If the <span class=\"wl wl-kjv\" data-code=\"H4962\">men</span> of my <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> not, Oh that we <span class=\"wl wl-kjv\" data-code=\"H5414\">had</span> of his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh!</span> we cannot be satisfied.","32":"The <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> did not <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> in the <span class=\"wl wl-kjv\" data-code=\"H2351\">street:</span> but I <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> my <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> to the traveller.","33":"If I <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> my <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> as <span class=\"wl wl-kjv\" data-code=\"H121\">Adam,</span> by <span class=\"wl wl-kjv\" data-code=\"H2934\">hiding</span> mine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> in my bosom:","34":"Did I <span class=\"wl wl-kjv\" data-code=\"H6206\">fear</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> or did the <span class=\"wl wl-kjv\" data-code=\"H937\">contempt</span> of <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> <span class=\"wl wl-kjv\" data-code=\"H2865\">terrify</span> me, that I kept <span class=\"wl wl-kjv\" data-code=\"H1826\">silence,</span> and went not <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the door?","35":"Oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> one would <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> me! behold, my <span class=\"wl wl-kjv\" data-code=\"H8420\">desire</span> is, that the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> would <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> me, and that mine <span class=\"wl wl-kjv\" data-code=\"H376\">adversary</span> had <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> a book.","36":"Surely I would <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> it upon my <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulder,</span> and <span class=\"wl wl-kjv\" data-code=\"H6029\">bind</span> it as a crown","37":"I would <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of my <span class=\"wl wl-kjv\" data-code=\"H6806\">steps;</span> as a <span class=\"wl wl-kjv\" data-code=\"H5057\">prince</span> would I go near","38":"If my <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> against me, or that the <span class=\"wl wl-kjv\" data-code=\"H8525\">furrows</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">likewise</span> thereof complain;","39":"If I have <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the <span class=\"wl wl-kjv\" data-code=\"H3581\">fruits</span> thereof without <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> or have caused the <span class=\"wl wl-kjv\" data-code=\"H1167\">owners</span> thereof to <span class=\"wl wl-kjv\" data-code=\"H5301\">lose</span> their life:","40":"Let <span class=\"wl wl-kjv\" data-code=\"H2336\">thistles</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">grow</span> instead of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat,</span> and <span class=\"wl wl-kjv\" data-code=\"H890\">cockle</span> instead of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley.</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> are ended."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een maagd?","tekst":"Te weten, om die onkuis te aanschouwen en ter onere te begeren. Vergelijk Mat 5:28 ; 1Jo 2:16 ."}],"2":[{"catchword":"het deel Gods","tekst":"Te weten, dat God geeft. Versta, de straf voor de onkuische verordend van God; vergelijk boven, Job 20:29 . Sommigen verstaan het van de beloning der kuisheid, die hij zou verliezen door onkuische daden."},{"catchword":"uit de hoogten","tekst":"Dat is, uit den hemel; zie boven, Job 16:19 ."}],"3":[{"catchword":"wat vreemds","tekst":"Hebreeuws, vreemdigheid; dat is, wat zeldzaam, ongewoon en extraordinair is."}],"4":[{"catchword":"Hij niet","tekst":"Te weten, God. Alzo vs.6."},{"catchword":"wegen,","tekst":"Zie Gen 6:12 ."},{"catchword":"telt Hij","tekst":"Dat is, neemt Hij niet waar al mijn doen en laten, om dat genadiglijk te belonen zo het goed is, of rechtvaardiglijk te straffen zo het kwaad is? Zie boven, Job 14:16 ."}],"5":[{"catchword":"ijdelheid","tekst":"Dat is, leugen en valsheid in samenhandelingen. Alzo Exo 23:1 ; Deu 5:20 ; Isa 5:18 ."}],"6":[{"catchword":"een rechte weegschaal,","tekst":"Hebreeuws, in schalen der gerechtigheid; dat is, men onderzoeke naar behoren mijn gemoed, voornemen, woorden en werken."},{"catchword":"oprechtigheid","tekst":"Te weten, dat ik geen huichelaar geweest ben, waarvoor ik van mijn vrienden aangezien word."}],"7":[{"catchword":"den weg","tekst":"Dat is, van den regel en het voorschrift des levens, dat ons van God voorgesteld is. Hij spreekt van moedwillige zonden, waarin men voortgaat."},{"catchword":"nagevolgd is,","tekst":"Dat is, ongerechtiglijk begeerd heeft dat den ogen aangenaam was en een ander toebehoorde."},{"catchword":"iets aankleeft;","tekst":"Te weten, van anderer lieden goed. Anders, een vlek of smet; dat is, enige kwade daad."}],"8":[{"catchword":"Zo moet ik zaaien,","tekst":"Hij wenst zichzelven de straf Gods toe, van welke te zien is Lev 26:16 ; Deu 28:30 , Deu 28:33 , Deu 28:38-40 ."},{"catchword":"spruiten","tekst":"Dat is, wat ik in de aarde geplant heb."}],"9":[{"catchword":"tot een vrouw,","tekst":"Te weten, om die ongehoorlijk te begeren en te gebruiken, daartoe de gelegenheden bespiedende."}],"11":[{"catchword":"bij de rechters","tekst":"Dat is, die waardig is door de rechters geoordeeld en gestraft te worden. Alzo onder, vs.28."}],"12":[{"catchword":"dat is een vuur,","tekst":"Dat is, veroorzakende een vuur; te weten der goddelijke wraak. Zie boven, Job 22:20 . Want gelijk het vuur zeer haastelijk de stoppelen verteert, alzo ook Gods toorn en rechtvaardige straf der zondige mensen. Vergelijk Deu 4:24 , en Nah 1:6 ."}],"14":[{"catchword":"doen,","tekst":"Te weten, om mij te verantwoorden voor God. Want de slaven hadden in voortijden geen vrijheid om tegen hunne heren voor den wereldsen rechter enige klacht aan te stellen."},{"catchword":"opstond?","tekst":"Te weten, om te oordelen tussen mij en hen; hetwelk geschiedt door de straffen, die God den onrechtvaardigen en wreden in dit leven of in het toekomende toezendt."},{"catchword":"Hij bezoeking deed,","tekst":"Dat is, straffe. Zie Gen 21:1 ; Lev 18:25 ."}],"15":[{"catchword":"hem ook gemaakt","tekst":"Te weten, mijn knecht."},{"catchword":"Een ons","tekst":"Te weten, God. Anders, heeft Hij hem niet in de baarmoeder bereid op een manier? of in enerlei baarmoeder."}],"16":[{"catchword":"onthouden heb,","tekst":"Te weten, dat ik die naar mijn vermogen niet zou voldaan hebben. Hebreeuws, zo ik de armen van de begeerte geweerd heb."},{"catchword":"de ogen","tekst":"Men laat iemands ogen versmachten als men hem lang tevergeefs laat wachten naar iets goeds dat hij begeert; hetwelk gezegd wordt bij gelijkenis, genomen van de ogen, welker krachten als zij sterkelijk en zonder ophouden, doch tevergeefs, naar iets uitzien, vergaan en versmelten. Alzo Psa 69:4 , en Psa 119:82 , Psa 119:123 ; Lam 4:17 ."}],"18":[{"catchword":"hij bij mij","tekst":"Te weten, van welken in vs.16 gesproken is. Vergelijk boven, Job 29:16 ."},{"catchword":"opgetogen,","tekst":"Hebreeuws, groot geworden."},{"catchword":"van mijner moeders buik","tekst":"Een overtollige manier van spreken, betekenende de eerste jonkheid, in welke God hem deze liefde jegens de weduwen en wezen ingestort had."},{"catchword":"haar","tekst":"Te weten, weduwe, van welke in vs.16 gesproken is."},{"catchword":"geleid;","tekst":"Dat is, geholpen met troost, raad en daad."}],"19":[{"catchword":"dat de nooddruftige","tekst":"Te weten, zonder van mij deksel en kleding te ontvangen."}],"20":[{"catchword":"zijn lenden","tekst":"Versta, de lenden des nooddruftigen, die Job met zijn vellen gekleed en gedekt had. De zin is: Zo hij, wiens die lenden waren, Job niet gedankt, goeds toegewenst en lof gegeven had, uit oorzaak van het gemak, dat hij daarbij voelde. Alzo is het woord zegenen genomen, Gen 12:3 ; Deu 24:13 ; 2Sa 8:10 ; Psa 62:5 ."}],"21":[{"catchword":"bewogen heb,","tekst":"Te weten, om hem te slaan, of smijten, of dreigen, of enigszins met geweld te verdrukken. Vergelijk 1Ki 13:4 ."},{"catchword":"poort","tekst":"Dat is, in de plaats van het gericht, of in de vierschaar, welke bij de ouden in de stadspoorten was. Zie Gen 22:17 ."},{"catchword":"hulp zag;","tekst":"Te weten, mij bereid van de rechters, die mij het recht wijzen zouden, uit vrees van mijn macht en aanzien, of uit begeerte van mijn vriendschap."}],"22":[{"catchword":"pijp af","tekst":"Hebreeuws, riet. Versta, het opperbeen des arms, zich strekkende van den elleboog af tot den schouder."}],"23":[{"catchword":"verderf Gods","tekst":"Dat is, dat God den verdrukkers der armen toezendt."},{"catchword":"vermocht","tekst":"Dat is, ik had gans geen kracht, te weten om voor Hem te bestaan en zijn wrekende hand te verdragen."},{"catchword":"vanwege","tekst":"Dat is, uit oorzaak van zijn schrikkelijke majesteit en overgrote macht."}],"24":[{"catchword":"mijn hoop","tekst":"Alzo is het Hebreeuwse woord genomen boven, Job 8:14 ; Pro 3:26 ."}],"25":[{"catchword":"vermogen","tekst":"Dat is, rijkdom en middelen. Alzo Gen 34:29 ; Num 31:9 ; Deu 8:17 ."},{"catchword":"verkregen had;","tekst":"Hebreeuws, gevonden had. Alzo Deu 8:17-18 ; Isa 10:10 , enz."}],"26":[{"catchword":"licht","tekst":"Dat is, de zon; want hier worden de grote lichten [alzo genaamd Gen 1:16 ; Psa 136:7 ] gemeld, de zon en de maan, over welker schoonheid en werkingen de heidenen zich zozeer verwonderd hebben, dat zij die goddelijke eer bewezen, Jer 43:13 , ja ook de Israëlieten zelf, 2Ki 21:3 en 2Ki 23:4-5 , 2Ki 23:11 ; Eze 8:16 ."},{"catchword":"aangezien heb,","tekst":"Te weten, om dat goddelijke eer te bewijzen, gelijk de afgodendienaars doen."},{"catchword":"wanneer het scheen,","tekst":"De afgodendienaars hebben de zon meest geëerd als zij opging en in haar glans was, en de maan als zij vol was; hetwelk hier genoemd wordt haar heerlijke voortgang."}],"27":[{"catchword":"verlokt","tekst":"Te weten, om die godsdienstige eer aan te doen."},{"catchword":"in het verborgen,","tekst":"Tegen de openbare belijdenis, die ik doe van den waren en levenden God alleen in geest en waarheid te dienen. Zie Deu 27:15 ."},{"catchword":"dat mijn hand","tekst":"Dat is, mijn hand aan mijn mond gebracht hebt, tot bewijs van eerbied en onderdanigheid. Zie van den afgodischen kus, gedaan ter ere van de afgoden, 1Ki 19:18 ; zie ook Gen 41:40 ."}],"28":[{"catchword":"misdaad","tekst":"Zie boven, vs.11."},{"catchword":"van boven","tekst":"Dat is, die boven in den hemel is en vandaar ons aanziet, regeert en goeddoet. Alzo Deu 4:39 ; 1Ki 8:23 ."},{"catchword":"verzaakt hebben","tekst":"Te weten, door de eer, die Hem alleen toekomt, den schepselen te geven; want zij kunnen beiden niet tezamen gediend worden. Zie Jos 24:22-23 ; 1Ki 18:21 ; Mat 4:10 , en Mat 6:24 ; 2Co 6:16 ."}],"29":[{"catchword":"verdrukking","tekst":"Dat is, schade, kwalijk varen, ondergang, verderf. Alzo boven, Job 30:24 ; Pro 24:22 ."},{"catchword":"opgewekt","tekst":"Te weten, tot blijdschap en vreugde."},{"catchword":"kwaad","tekst":"Versta, het kwaad der straf, dat is ellende en tegenspoed. Zie Gen 19:19 ."},{"catchword":"vond;","tekst":"Dat is, overkwam en trof. Zie Gen 44:34 ."}],"30":[{"catchword":"gehemelte","tekst":"Dat is, mijn tong of mond."},{"catchword":"zijn ziel","tekst":"Dat is, met een vloek te wensen dat hij sterven zou. Anders, mits over zijn ziel een vloek te wensen."}],"31":[{"catchword":"mijner tent","tekst":"Dat is, mijner woning; zie 2Ki 13:5 . Versta, zijn huisgenoten, knechten en dienstmaagden."},{"catchword":"hebben gezegd:","tekst":"Het schijnt hieruit dat Job niet alleen zeer herbergzaam is geweest, maar ook zijn gasten zo mildelijk heeft onthaald dat hij hen met zijn allerbeste en lekkerste vlees en spijs heeft verzadigd; zodat zijn huisgenoten, wensende ook alzo dagelijks getracteerd te worden, kwamen te zeggen: Och, of wij, enz. Anderen verstaan dat, om de grote herbergzaamheid van Job, zijn huisgenoten hebben gevreesd dat zij geen spijs genoeg zouden behouden om zich te verzadigen. Anderen duiden het op zijn vijanden, die zij gaarne uit wraakgierigheid zouden verscheurd hebben, indien Job daarin had bewilligd."}],"32":[{"catchword":"den weg;","tekst":"Dat is, tegenover 's heren straat, om de voorbijgaande reizende lieden alzo in mijn huis te ontvangen; of, voor den reizenden man zie boven, Job 6:19 ."}],"33":[{"catchword":"gelijk Adam,","tekst":"Vergelijk Hos 6:7 . Anders, gelijk een mens; dat is, gelijk de mensen plegen te doen."},{"catchword":"door eigenliefde","tekst":"Hebreeuws, in, of met mij te beminnen. Anders, in mijn schoot; dat is, bij mij in het verborgen, of in het heimelijke."}],"34":[{"catchword":"geweldiglijk","tekst":"Te weten, door mijn macht en autoriteit, dat zij mijn gebreken niet zouden hebben durven openbaren: zulks dat ik niet behoefde te vrezen voor de blaam, die zij mij hadden mogen nageven."},{"catchword":"verachtste","tekst":"Hebreeuws, de verachting; dat is, die allerminst in enige huisgezinnen gezien en geacht waren."},{"catchword":"zou mij afgeschrikt hebben;","tekst":"Te weten, zo ik mij vergrepen hebbende, daarvan ware vermaand geweest."},{"catchword":"zodat ik","tekst":"Te weten, door zedigheid, schaamte en vrees. Anders, doch ik heb mij stil gehouden en ben ter deure niet uitgegaan."}],"35":[{"catchword":"Och,","tekst":"De zin is: indien men niet gelooft wat ik verhaald heb, dat men mijn zaak onderzoeke en recht oordele; maar och, of ik daartoe nu een rechter had, die, van alles kennis genomen hebbende, recht richtte. Vergelijk Job 9:32 , en Job 19:23 ."},{"catchword":"oogmerk is,","tekst":"Hebreeuws, trekken. Anders, mijn begeerte."},{"catchword":"Almachtige","tekst":"Dien ik liefst tegen mijn vrienden voor een rechter heb."},{"catchword":"antwoorde,","tekst":"Te weten, waarom Hij mij alzo straft, dewijl ik niet zodanig een ben als mijn vrienden mij afmalen. Vergelijk boven, Job 10:2 , en Job 13:22-23 ."},{"catchword":"mijn tegenpartij","tekst":"Hebreeuws, de man van mijn twist."},{"catchword":"boek schrijve","tekst":"Inhoudende de beschuldigingen, die tegen mij gedaan worden."}],"36":[{"catchword":"Zou ik het niet","tekst":"Te weten, mij daarmede verblijdende en tentoonstellende, omdat ik, een goede conscientie hebbende, wel weet dat het geen bewijs zou kunnen inhouden, om mij te overtuigen dat ik een huichelaar ben geweest."},{"catchword":"een kroon","tekst":"Hebreeuws, als kronen; dat is, als een zonderling sieraad. Vergelijk Pro 12:4 ."}],"37":[{"catchword":"mijner treden","tekst":"Dat is, mijner woorden en werken."},{"catchword":"hem aanwijzen;","tekst":"Versta, zijn beschuldiger. Dezen zou Job al zijn doen en laten rechtuit openbaren, steunende alzo op de goedheid zijner zaak, dat de partij haar beschuldiging niet zou kunnen waar maken."},{"catchword":"als een vorst","tekst":"Dat is, met een kloekmoedig en onbeschroomd hart. Anders, als tot een vorst zou ik tot hem naderen; dat is, hoewel hij mijn vijand zou zijn, ik zou nochtans hem als een prins aanzien uit verheuging, om de zekerheid van het proces te zullen winnen."}],"38":[{"catchword":"roept,","tekst":"Te weten, als om wraak, overmits ik het ongerechtelijk verkregen en bezeten zou hebben. Zie gelijke manier van spreken Gen 4:10 , en Hab 2:11 ; idem, zie boven, Job 8:18 ."},{"catchword":"voren","tekst":"Het Hebreeuwse woord betekent eigenlijk de verheven aarde of ruggen tussen twee voren. Alzo onder, Job 39:13 ; Psa 65:11 ; Hos 10:4 . // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
