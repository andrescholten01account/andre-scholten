","4":"Ja, u vernietigt de vreze, en neemt het gebed voor het aangezicht van God weg.","5":"Want uw mond leert uw ongerechtigheid, en u hebt de tong van de arglistigen gekozen.","6":"Uw mond verdoemt u, en niet ik; en uw lippen getuigen tegen u.","7":"Bent u de eerste mens die geboren is? Of bent u vóór de heuvelen voortgebracht?","8":"Hebt u de verborgen raad van God gehoord, en hebt u de wijsheid naar u toe getrokken?","9":"Wat weet u, dat wij niet weten? Wat verstaat u, dat bij ons niet is?","10":"Onder ons is ook een grijsaard, ja, een stokoude, meer van dagen dan uw vader.","11":"Zijn de vertroostingen van God u te klein, en schuilt er een geheime zaak bij u?","12":"Waarom rukt uw hart u weg, en waarom wenken uw ogen?","13":"Dat u uw geest keert tegen God, en zulke redenen uit uw mond laat uitgaan.","14":"Wat is de mens, dat hij zuiver zou zijn, en die geboren is van een vrouw, dat hij rechtvaardig zou zijn?","15":"Zie, op Zijn heiligen zou Hij niet vertrouwen, en de hemelen zijn niet zuiver in Zijn ogen.","16":"Hoeveel te meer is een man gruwelijk en stinkend, die het onrecht indrinkt als water?","17":"Ik zal u wijzen, hoor mij aan, en wat ik gezien heb, dat zal ik vertellen;","18":"Wat de wijzen verkondigd hebben, en men voor hun vaderen niet verborgen heeft;","19":"Aan wie alleen het land gegeven was, en door wier midden niemand die vreemd was, doorging.","20":"Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd.","21":"Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over.","22":"Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.","23":"Hij zwerft heen en weer om brood, waar het maar is; hij weet, dat bij zijn hand gereed is de dag van de duisternis.","24":"Angst en benauwdheid verschrikken hem; zij overweldigt hem, als een koning die bereid is ten strijde.","25":"Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.","26":"Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;","27":"Omdat hij zijn aangezicht met zijn vet bedekt heeft, en rimpels gemaakt heeft rond de weekdarmen;","28":"En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden.","29":"Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde.","30":"Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.","31":"Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.","32":"Als zijn dag nog niet is, zal het vervuld worden; want zijn tak zal niet groenen.","33":"Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.","34":"Want de vergadering van de huichelaars wordt eenzaam, en het vuur verteert de tenten van de geschenken.","35":"Zij ontvangen moeite, en baren ijdelheid, en hun buik richt bedrog aan."},"SV":{"1":"Toen antwoordde Elifaz, de Themaniet, en zeide:","2":"Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind?","3":"Bestraffende door woorden, *die* niet baten, en door redenen, met dewelke hij geen voordeel doet?","4":"Ja, gij vernietigt de vreze, en neemt het gebed voor het aangezicht Gods weg.","5":"Want uw mond leert uw ongerechtigheid, en gij hebt de tong der arglistigen verkoren.","6":"Uw mond verdoemt u, en niet ik; en uw lippen getuigen tegen u.","7":"Zijt gij de eerste een mens geboren? Of zijt gij voor de heuvelen voortgebracht?","8":"Hebt gij den verborgen raad Gods gehoord, en hebt gij de wijsheid naar u getrokken?","9":"Wat weet gij, dat wij niet weten? *Wat* verstaat gij, dat bij ons niet is?","10":"Onder ons is ook een grijze, ja, een stokoude, meerder van dagen dan uw vader.","11":"Zijn de vertroostingen Gods u te klein, en schuilt er enige zaak bij u?","12":"Waarom rukt uw hart u weg, en waarom wenken uw ogen?","13":"Dat gij uw geest keert tegen God, en *zulke* redenen uit uw mond laat uitgaan.","14":"Wat is de mens, dat hij zuiver zou zijn, en die geboren is van een vrouw, dat hij rechtvaardig zou zijn?","15":"Zie, op Zijn heiligen zou Hij niet vertrouwen, en de hemelen zijn niet zuiver in Zijn ogen.","16":"Hoeveel te meer is een man gruwelijk en stinkende, die het onrecht indrinkt als water?","17":"Ik zal u wijzen, hoor mij aan, en hetgeen ik gezien heb, dat zal ik vertellen;","18":"Hetwelk de wijzen verkondigd hebben, en men voor hun vaderen niet verborgen heeft;","19":"Denwelken alleen het land gegeven was, en door welker midden niemand vreemds doorging.","20":"Te allen dage doet de goddeloze zichzelven weedom aan; en *weinige* jaren in getal zijn voor den tiran weggelegd.","21":"Het geluid der verschrikkingen is in zijn oren; in den vrede zelven komt de verwoester hem over.","22":"Hij gelooft niet uit de duisternis weder te keren, maar dat hij beloerd wordt ten zwaarde.","23":"Hij zwerft heen en weder om brood, waar het zijn mag; hij weet, dat bij zijn hand gereed is de dag der duisternis.","24":"Angst en benauwdheid verschrikken hem; zij overweldigt hem, gelijk een koning, bereid ten strijde.","25":"Want hij strekt tegen God zijn hand uit, en tegen den Almachtige stelt hij zich geweldiglijk aan.","26":"Hij loopt tegen Hem aan met den hals, met zijn dikke, hoog verhevene schilden;","27":"Omdat hij zijn aangezicht met zijn vet bedekt heeft, en rimpelen gemaakt om de weekdarmen;","28":"En heeft bewoond verdelgde steden, *en* huizen, die men niet bewoonde, die gereed waren tot *steen* hopen te worden.","29":"Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde.","30":"Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas zijns monds.","31":"Hij betrouwe niet op ijdelheid, *waardoor* hij verleid wordt; want ijdelheid zal zijn vergelding wezen.","32":"Als zijn dag nog niet is, zal hij vervuld worden; want zijn tak zal niet groenen.","33":"Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.","34":"Want de vergadering der huichelaren wordt eenzaam, en het vuur verteert de tenten der geschenken.","35":"Zijn ontvangen moeite, en baren ijdelheid, en hun buik richt bedrog aan."},"KJV":{"1":"Then answered Eliphaz the Temanite, and said,","2":"Should a wise man utter vain knowledge, and fill his belly with the east wind?","3":"Should he reason with unprofitable talk? or with speeches wherewith he can do no good?","4":"Yea, thou castest off fear, and restrainest prayer before God.","5":"For thy mouth uttereth thine iniquity, and thou choosest the tongue of the crafty.","6":"Thine own mouth condemneth thee, and not I: yea, thine own lips testify","7":"*Art* thou the first man *that* was born? or wast thou made before the hills?","8":"Hast thou heard the secret of God? and dost thou restrain wisdom","9":"What knowest thou, that we know not? *what* understandest","10":"With us *are* both the grayheaded and very aged men, much elder than thy father.","11":"*Are* the consolations of God small with thee? is there any secret thing","12":"Why doth thine heart carry thee away? and what do thy eyes wink at,","13":"That thou turnest thy spirit against God, and lettest *such* words go out of thy mouth?","14":"What *is* man, that he should be clean? and *he which is* born of a woman, that he should be righteous?","15":"Behold, he putteth no trust in his saints; yea, the heavens are not clean in his sight.","16":"How much more abominable and filthy *is* man, which drinketh iniquity like water?","17":"I will shew thee, hear me; and that *which* I have seen I will declare;","18":"Which wise men have told from their fathers, and have not hid","19":"Unto whom alone the earth was given, and no stranger passed among","20":"The wicked man travaileth with pain all *his* days, and the number of years is hidden to the oppressor.","21":"A dreadful sound *is* in his ears: in prosperity the destroyer shall come","22":"He believeth not that he shall return out of darkness, and he is waited for of the sword.","23":"He wandereth abroad for bread, *saying*, Where *is it*? he knoweth that the day of darkness is ready at his hand.","24":"Trouble and anguish shall make him afraid; they shall prevail against him, as a king ready to the battle.","25":"For he stretcheth out his hand against God, and strengtheneth himself against the Almighty.","26":"He runneth upon him, *even* on *his* neck, upon the thick bosses of his bucklers:","27":"Because he covereth his face with his fatness, and maketh collops of fat on *his* flanks.","28":"And he dwelleth in desolate cities, *and* in houses which no man inhabiteth, which are ready to become heaps.","29":"He shall not be rich, neither shall his substance continue, neither shall he prolong the perfection thereof upon the earth.","30":"He shall not depart out of darkness; the flame shall dry up his branches, and by the breath of his mouth shall he go away.","31":"Let not him that is deceived trust in vanity: for vanity shall be his recompence.","32":"It shall be accomplished before his time, and his branch shall not be green.","33":"He shall shake off his unripe grape as the vine, and shall cast off his flower as the olive.","34":"For the congregation of hypocrites *shall be* desolate, and fire shall consume the tabernacles of bribery.","35":"They conceive mischief, and bring forth vanity, and their belly prepareth deceit."}},"tsk":{"1":[{"kopje":"Elifaz","refs":["Job 2:11","Job 4:1","Job 22:1","Job 42:7","Job 42:9"]}],"2":[{"kopje":"een wijs man","refs":["Job 11:2","Job 11:3","Job 13:2","Jak 3:13"]},{"kopje":"winderige wetenschap","refs":["Job 6:26","Job 8:2"]},{"kopje":"vullen","refs":["Hos 12:2"]}],"3":[{"kopje":"r jv\" data-code=\"H5493\">depart</span> out of <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness;</span> the <span class=\"wl wl-kjv\" data-code=\"H7957\">flame</span> shall dry <span class=\"wl wl-kjv\" data-code=\"H3001\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H3127\">branches,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> shall he go away.","31":"Let not him that is <span class=\"wl wl-kjv\" data-code=\"H8582\">deceived</span> <span class=\"wl wl-kjv\" data-code=\"H539\">trust</span> in <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity:</span> for <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity</span> shall be his recompence.","32":"It shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">accomplished</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H3117\">time,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3712\">branch</span> shall not be green.","33":"He shall shake <span class=\"wl wl-kjv\" data-code=\"H2554\">off</span> his unripe <span class=\"wl wl-kjv\" data-code=\"H1154\">grape</span> as the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and shall cast <span class=\"wl wl-kjv\" data-code=\"H7993\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H5328\">flower</span> as the olive.","34":"For the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H2611\">hypocrites</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1565\">desolate,</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">consume</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacles</span> of bribery.","35":"They <span class=\"wl wl-kjv\" data-code=\"H2029\">conceive</span> <span class=\"wl wl-kjv\" data-code=\"H5999\">mischief,</span> and bring <span class=\"wl wl-kjv\" data-code=\"H3205\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H205\">vanity,</span> and their <span class=\"wl wl-kjv\" data-code=\"H990\">belly</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">prepareth</span> deceit."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"wijs man","tekst":"Te weten, waarvoor gij uzelven uitgeeft."},{"catchword":"winderige","tekst":"Hebreeuws, wetenschap des winds; dat is, die niet vast of zeker is, maar vergaande en verwaaiende. Vergelijk boven, Job 7:7 , en de aantekening."},{"catchword":"buik","tekst":"Dat is, zijn binnenste, of verborgenste, te weten, zijn zin, hart en gemoed; alzo onder, vs.35, en Job 20:20 , en Job 32:19 ; Pro 20:27 , en Pro 22:18 , gelijk in den buik de darmen met ander ingewand gesloten en verborgen zijn, alzo zijn in de ziel de gedachten, de wil en bewegingen."},{"catchword":"oostenwind?","tekst":"Dat is met woorden en redenen, die niet alleen ijdel en licht zijn als de wind, maar ook schadelijk als in dat land de oostenwind. Zie Gen 41:6 ; Exo 10:13 , en de aantekening."}],"4":[{"catchword":"de vreze,","tekst":"Te weten, Gods, mits die door uw redenen uit de harten der mensen te verdrijven, en in dezelve te verzwakken de genegenheid om Hem in den nood aan te roepen. Hij schijnt te zien op hetgeen Job gezegd had, boven, Job 9:22 ."},{"catchword":"neemt","tekst":"Of, vermindert, verhindert."},{"catchword":"het gebed","tekst":"Of, aanspraak. Versta, gebed, hetwelk met een nederig gemoed, in den nood tot God uitgesproken wordt, om voor Hem zijn klachten uit te storten en van Hem hulp te verzoeken."}],"5":[{"catchword":"mond","tekst":"Het woord mond, gelijk ook tong in vs.5, en lippen in het volgende, betekenen de woorden en redenen, die door mond, tong en lippen uitgesproken worden. Alzo onder, Job 16:5 ; Psa 5:10 ; Pro 2:6 , en Pro 14:3 , en Pro 15:2 , en Pro 18:7 , en Pro 21:6 , enz."},{"catchword":"leert","tekst":"Dat is, geeft getuigenis van de verkeerdheid uws harten, door welke gij deze vreemde redenen drijft. Anders, uw ongerechtigheid leert uw mond; dat is, de boosheid uws harten doet u zulke redenen spreken."},{"catchword":"uw ongerechtigheid,","tekst":"Te weten, waardoor gij in het spreken aangenomen hebt de manier van doen der node schalken, die met een schijn, zowel van woorden als van redenen, een zaak weten te bewimpelen, verduisteren en om te keren."}],"7":[{"catchword":"de eerste","tekst":"Dat is, de oudste van alle mensen, zulks dat gij meer weten zoudt dan iemand, en dat een ieder voor u zou moeten wijken als voor den oudste, den wijste en aanzienlijkste."},{"catchword":"de heuvelen","tekst":"Dat is van eeuwigheid geweest, of eer de wereld geschapen was; vergelijk Psa 90:2 ; Pro 8:25 ."},{"catchword":"voortgebracht?","tekst":"Het Hebreeuwse woord is gebruikt van de ordinaire geboorte des mensen, Psa 51:7 , en van de wonderbare geboorte des Eeniggeborenen van den Vader, die de wijsheid Gods is; Pro 8:24-25 ."}],"8":[{"catchword":"gehoord,","tekst":"Te weten, dat gij alle hemelse en goddelijke verborgenheden zoudt weten, meer dan een ander. Den raad Gods horen, heet Jeremia, in den raad Gods staan; Jer 23:22 ."},{"catchword":"naar u getrokken?","tekst":"Te weten, alzo, dat gij haar alleen bij u zoudt hebben, en niemand anders."}],"10":[{"catchword":"meerder van dagen","tekst":"Dat is, bedaagder, of ouder van jaren. Hij ziet op hetgeen Job gezegd heeft, boven, Job 12:12 ."}],"11":[{"catchword":"vertroostingen Gods","tekst":"Te weten, die wij u voorgehouden hebben; maar die Job verachtte , onder, Job 16:2 ."},{"catchword":"klein,","tekst":"Dat is, te slecht en te onwaardig om uw persoon voorgesteld te worden."},{"catchword":"schuilt","tekst":"Dat is, is er enige meerdere wetenschap bij u, die wij niet vatten; of voordeel, om der oudere vermaningen te mogen verwerpen? of ook enige snoodheid, achter welke wij niet kunnen geraken, waardoor gij onze redenen zo onwaardiglijk veracht? Of, is er iets dat [dezelve], te weten, vertroostingen, bij u bedekt?"}],"12":[{"catchword":"rukt","tekst":"Te weten, om God zo te tergen, uzelven te rechtvaardigen en ons te versmaden."},{"catchword":"waarom","tekst":"Tot teken van hoogmoed. Anders, waarop mikken uw ogen? Dat is, waarheen zien, wat zoeken zij? Wat hebt gij voor, dat gij met een zo verwaand opzet en opzicht ons bejegent? en schijnt onze redenen gans te verachten?"}],"13":[{"catchword":"uw geest","tekst":"Dat is, uw gemoed door ongeduldigheid ontstelt en door gramschap met kwade rechten laat uitvaren tegen God. Anders, dat uw geest mort tegen God, en [zulke] redenen uit uw mond voortbrengt."}],"14":[{"catchword":"is de mens,","tekst":"De zin is, dat hij gans niets is en geen stof heeft om zich voor zuiver en rechtvaardig uit te geven. De vraag loochent sterkelijk; zie Gen 18:17 ."}],"15":[{"catchword":"heiligen","tekst":"Dat is, de goede engelen, die boven, Job 1:6 worden genaamd Gods zonen. Idem Job 4:18 , zijn knechten, en 1Ti 5:21 , de uitverkoren engelen. Zij worden heiligen genaamd, omdat zij volkomenlijk Gods wil doen, Psa 103:20 ; Mat 6:10 , en dienvolgens Hem volkomenlijk liefhebben."},{"catchword":"zou Hij niet","tekst":"Zie boven, Job 4:18 ."},{"catchword":"de hemelen","tekst":"Dat is, de voorgemelde goede engelen, wier woonstede in de hemelen is; waarom zij ook engelen der hemelen genaamd worden, Mat 24:36 ; en worden gezegd aldaar het aangezicht des hemelsen Vaders te aanschouwen; Mat 18:10 ."}],"16":[{"catchword":"een man","tekst":"Of, een mens. Zie boven, Job 12:10 , maar het schijnt dat Elifaz hier liever het woord man gebruikt heeft, om Job daarmede een neep te geven."},{"catchword":"onrecht","tekst":"Dat is, met zulken lust en overmatigheid de boosheid doende, gelijk de mensen en beesten, dorstig zijnde, zeer begerig zijn om te drinken. Vergelijk onder, Job 34:7 ; Pro 26:6 ."}],"17":[{"catchword":"wijzen,","tekst":"Te weten, dat het waar is, hetgeen ik gezegd heb, dat de goddelozen alleen van God uitgeroeid worden. Zie boven, Job 4:7-8 ."},{"catchword":"en hetgeen","tekst":"Anders, want ik heb het gezien, daarom zal ik het vertellen."}],"18":[{"catchword":"hunne vaderen","tekst":"Versta, van de wijze vaderen. De zin is, dat de wijzen zulks van hand tot hand ontvangen, en van hun voorouders gehoord hadden."}],"19":[{"catchword":"gegeven was,","tekst":"Te weten, van de volken des lands, om dat te regeren door hun wijsheid en groot aanzien, want denzulken werd in de vorige tijden de regering der landen toevertrouwd en overgegeven."},{"catchword":"door welker","tekst":"Dat is, door wier land geen vreemde volken vijandiglijk passeerden. De zin is, dat de wijzen zo wel geregeerd hebben, dat hun landen door geen buitenvolken zijn beroerd geweest. Of, geen vreemde; dat is, die enige andere of vreemde leer in hun land brachten, gelijk de wijze oudvaders leerden."}],"20":[{"catchword":"Te allen dage","tekst":"Dat is, den gansen tijd zijns levens. Hier begint Elifaz te verhalen hetgeen de oude en wijze mannen voor een lering nagelaten hadden, zeer overeenkomende met hetgeen hij voorgedragen heeft, boven, Job 5:3 , enz."},{"catchword":"doet de goddeloze","tekst":"De zin is: Hoewel de bozen uiterlijk welvaren in deze wereld, dat zij nochtans ongelukkig zijn vanwege de inwendige onrust huns gemoeds."},{"catchword":"weinige","tekst":"Hebreeuws, een getal der jaren; inplaats van jaren des getals. Dat is, weinige, die licht kunnen geteld worden; gelijk Gen 34:30 . Zie de aantekening. De boze heeft tweeërlei plagen; de ene dat hij in zijn tijdelijk geluk nimmermeer gerust is; de andere, dat zijn voorspoed niet lang duurt. Anderen zetten het laatste van vs.20 aldus over: En het getal der jaren, te weten, zijns levens, is voor den tiran verborgen."},{"catchword":"weggelegd","tekst":"Te weten, in Gods eeuwigen raad, die voor de mensen verborgen is."}],"21":[{"catchword":"der verschrikkingen","tekst":"Te weten, die hem zijn conscientie zal aanjagen, hem voorstellende zijn boosheden en dreigende met Gods rechtvaardig oordeel. Vergelijk Lev 26:36 , en Deu 28:65 ."},{"catchword":"den vrede","tekst":"Dat is, in het midden van zijn welstand en rust. Zie van het woord vrede, Gen 37:14 ."}],"22":[{"catchword":"duisternis","tekst":"Dat is, lijden en tegenspoed. Zie Gen 15:12 . Alzo onder, in het volgende en vs.30."},{"catchword":"maar dat hij","tekst":"Dat is, hij gelooft dat hem lagen gelegd worden om hem een geweldigen dood aan te doen."}],"23":[{"catchword":"Hij zwerft","tekst":"Dat is, hij is in gedurige onrust en woeling, om den kost en de verzorging des lichaams; hier intussen overtuigt hem ook zijn gemoed dat zijn verderf nabij is."},{"catchword":"dat bij zijn hand","tekst":"Dat is, dat hem voorhanden is en staat te verwachten."},{"catchword":"de dag","tekst":"Dat is, de tijd des lijdens. Vergelijk onder, Job 30:16 , en de aantekening daarop."}],"24":[{"catchword":"overweldigt hem,","tekst":"Te weten, de benauwdheid."},{"catchword":"strijde","tekst":"Men houdt dat het Hebreeuwse woord chidor, hetwelk nergens meer dan hier gevonden wordt, zeer hetzelfde is als caddur, betekenende een bal, Isa 22:18 , en dat chidor anders niet zou betekenen dat een heir, zo in orde gesteld dat het in rondigheid den vorm van een bal of ei had, gelijk zij dan in die tijden hun heiren plachten te ordineren."}],"25":[{"catchword":"hij strekt","tekst":"Dat is, door een trots opzet en moedwillig bedrijf stelt hij zich met al zijn macht tegen God, hem tergende door allerlei gruwelen, en de mensen, doch voornamelijk de vromen, door velerlei overlast verdrukkende, zonder God enigszins te ontzien; wiens oordelen hij meent door louter geweld van zich te zullen afkeren. Vergelijk Lev 26:21 ; Num 15:30 , en de aantekening."},{"catchword":"Almachtige","tekst":"Zie van dezen naam Gods Gen 17:1 ."}],"26":[{"catchword":"Hem aan","tekst":"Namelijk, God."},{"catchword":"den hals,","tekst":"Te weten, opgeheven en uitgestrekt, gelijk de stouten, verwaanden en hoogmoedigen plegen te doen."},{"catchword":"zijn dikke,","tekst":"Dat is, met zijn wapenen en geweld, en al zijn uiterlijke middelen. Hebreeuws, met de dikte [en] hoogten, of ruggen zijner schilden."}],"27":[{"catchword":"zijn aangezicht","tekst":"Dat is, zijn lichaam door lekkernij, gulzigheid en allerlei overdaad opgemest heeft, niets anders dan den buik bezorgende. Vergelijk Psa 17:10 , en Psa 73:7 ."},{"catchword":"de weekdarmen;","tekst":"Het Hebreeuwse woord betekent de darmen, die bij de Latijnen ilia genaamd worden, en van ons overgezet worden weekdarmen; Lev 3:4 . Zie aldaar de aantekening."}],"28":[{"catchword":"steden,","tekst":"Te weten, die door zijn macht weder oprichtende en herbouwende, om zich een naam te maken en zijn geweld tentoon te stellen; zie boven, Job 3:14 ."}],"29":[{"catchword":"rijk worden,","tekst":"Te weten, voor een langen tijd; want zijn goederen zullen hem niet beklijven, gelijk de volgende woorden verklaren."},{"catchword":"hun volmaaktheid","tekst":"Dat is, der bozen heerlijkheid, rijkdom en verheven staat, waardoor zij schenen volmaakt te wezen."}],"30":[{"catchword":"duisternis","tekst":"Te weten, der ellende en katijvigheden, als hij eenmaal in deze zal gekomen zijn; zie boven, vs.22."},{"catchword":"vlam","tekst":"Te weten, der tegenheden en plagen. Alzo Isa 29:6 , en Isa 43:2 ; Jer 48:45 ; Lam 2:3 ."},{"catchword":"wijken","tekst":"Dat is, vergaan en teniet worden. Of, hij zal moeten afhouden van hem, tegen welken hij zich gesteld had; zie boven, vs.25."},{"catchword":"het geblaas","tekst":"Dat is, voor Gods toorn; zie boven, Job 4:9 , en de aantekening."}],"31":[{"catchword":"ijdelheid, waardoor","tekst":"Dat is, op alle dingen, die lichtelijk vergaan, als eer, staat, rijkdom, sterkte, steden, mensen, enz. Alzo is het woord ijdelheid genomen, Psa 62:10 , en Psa 119:37 , en Psa 144:4 ; Pro 31:30 ; Rom 8:20 ."},{"catchword":"ijdelheid zal zijn","tekst":"Dat is, verdriet, ondergang, verderf en nietigheid; want dit zal de beloning wezen van al de voorgaande ijdelheid, bestaande in eer, rijkdom, geweld, enz., dat zij hem niet zal kunnen verlossen uit de hand Gods, ja ten verderve dienen zal. Zie van deze betekenis des woords ijdelheid boven, Job 7:3 ."},{"catchword":"vergelding","tekst":"Hebreeuws, verandering, verwisseling."}],"32":[{"catchword":"zijn dag","tekst":"Te weten, den dag zijns doods, gelijk 1Sa 26:10 ; Psa 37:13 , tot welken hij natuurlijkerwijze had kunnen geraken. De zin is, dat de goddeloze als hij in het beste zijns levens is en in goeden welstand naar het lichaam, haastelijk en door enig onverwacht ongeluk zal vergaan, of uitgeroeid worden. Vergelijk onder, Job 18:20 , en de aantekening."},{"catchword":"zal hij","tekst":"Te weten, de voorverhaalde vergelding."}],"33":[{"catchword":"Men zal","tekst":"Anders, [God] zal zijn ontijdige druiven afrukken. Deze gelijkenissen leren dat de verwachting der goddelozen, waarmede zij zich en anderen bedriegen, gans teniet worden zal. Zie boven, Job 8:13 ."}],"34":[{"catchword":"huichelaren","tekst":"Zie boven, Job 8:13 ."},{"catchword":"het vuur","tekst":"Te weten, der tegenheden, ellenden en plagen. Alzo wordt het woord vuur gebruikt, Psa 66:12 ; Isa 9:18 , en Isa 26:11 ; Eze 30:8 , enz., gelijk het woord vlam, boven, vs.30."},{"catchword":"tenten","tekst":"Dat is, waarin geschenken ontvangen zijn, en die door middel van onbehoorlijke geschenken opgebouwd zijn en onderhouden worden."}],"35":[{"catchword":"Zijn ontvangen","tekst":"Vergelijk boven, Job 4:8 ."},{"catchword":"ijdelheid,","tekst":"Of, ongerechtigheid, ondeugd, onrecht."},{"catchword":"buik","tekst":"Dat is, hun hart. Zie boven, vs.2."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then answered Eliphaz the Temanite, and said,"}],"2":[{"catchword":null,"tekst":"Shall a wiseman [viz. Such as thou pretendest thy self to be] give windy knowledge for answer; [Heb. Knowledge of wind, i.e. which is not solid, nor sure, but flashing and passing away. Compare above 7.7. and the annotation.] and shall be fill his belly [i.e. his inmost, or most hidden part, to wit, his apprehending faculty, his heart and mind. So below verse 35. And ch.20.20. and 30.19. Prov 20:27. and 22.18. for as in the belly, the guts and other entrails are shut up and hidden; so are the thoughts, the will and affections in the soul.] with Eastwind? [i.e. with words and discourses, that are not onely as vain and light as the wind, but as hurtful also, as in those parts the East-wind. See Gen 41:6. Exo 10:13. and the annot.]"}],"3":[{"catchword":null,"tekst":"Reproving by words, (which) avail not, and by sayings wherewith he doth no profit?"}],"4":[{"catchword":null,"tekst":"Yea thou nullifies the fear [viz. Of God, driving the same out of mens hearts, by thy discourses, and weakening their disposition and headiness of calling upon him in distress. He seemeth to look back upon that which Job had said above chap.9.22.] and takest away [or, doest lessen, abate, or hinder] the prayer [or speech before the face of God. [understand such a speech or prayer, as is uttered with an humble heart be fore God in time of distress, powering out its complaints in his presence, and sueing earnestly for his assistance."}],"5":[{"catchword":null,"tekst":"For thy mouth; [the word mouth, as also tongue, in this verse, and lips in the next, do signify, the words, speechs and discourses, which are uttered by the mouth, tongue and lips. So below 16.5. Psa 5:10. Pro.2.10. and 14.3. & 15.2. and 18.7. and 21.6. &c.] teacheth [i.e. giveth testimony of the perverseness of thy heart, from whence thou brightest forth these strange discourses. Oth. Thine iniquity teacheth thy mouth, i.e. the wickedness of thy heart doth make thee utter such speechs.] thine iniquity: [viz. Which hath made thee to assume in speaking the practise of notorious dissemblers, who are able to equivocate, obscure and pervert any thing, by a fair shew of words and arguments.] and thou hast chosen the tongue of the crafty."}],"6":[{"catchword":null,"tekst":"Thy mouth condemneth thee, and not I, and thy lips testify against thee."}],"7":[{"catchword":null,"tekst":"Art thou the first born man? [i.e. the eldest of all men, so that thou shouldst know more than any other, and that every one should be forced to yield unto thee, as to the antientest, wisest and gravest of all the rest?] or art thou brought forth, [the Hebrew word is used of the ordinary birth of man. Psa 51:7. and of the wonderful birth of the onely begotten of the Father, who is the wisdom of God. Prov 8:24,25.] before the little hills? [i.e. hast thou been from eternity or before the world was created? Compare Psal.90.2. Pro 8:25.]"}],"8":[{"catchword":null,"tekst":"Hast thou heard the hidden counsel of God, [namely, that thou shouldst know all heavenly and divine mysteries, more than any other. To hear the counsel of God, Jeremiah calleth, to stand in the counsel of God, chap.23.22.] and haste thou drawn the wisdom after thee? [viz. So that thou shouldst have the same alone, and none besides thee?]"}],"9":[{"catchword":null,"tekst":"What knowest thou, that we know not? (what) understandest thou that is not with us?"}],"10":[{"catchword":null,"tekst":"Among us there is also a gray-head; yea a very old one, more of days than thy father. [i.e. more antient or more stricken in years, he reflecteth upon that which Job had said abov.12.12.]"}],"11":[{"catchword":null,"tekst":"Are the consolations of God, [viz. Which we propounded unto thee, but were slighted by thee, below chap.16.2.] to little for thee? [i.e. too slender and too unworthy for to be propounded unto thee.] and is there any thing hidden with thee? [i.e. is there any more knowledge with thee, which we perhaps comprehend not; or, any advantage that we may reject the exhortation of the antients; or likewise any business, which we are not able to discern, for which thou doest so unworthily slight our reasoning; or, is there ought with thee which covereth (the same) consolations namely.]"}],"12":[{"catchword":null,"tekst":"Why doth thy heart hale thee away? [viz. To provoke God in this manner, to justify thy self, and to despise us.] and why wink thine eyes? [in sign of contempt and overweening. Oth. What do thine eyes wink at? i.e. what do they look or pore upon, what dost thou mean, that thou entertainest us with such an odd look and aspect? And seemest to contemn our discourses altogether?]"}],"13":[{"catchword":null,"tekst":"That thou turnest thy spirit against God, [i.e. distemperest thy mind, through impatience, and out of indignation breakest out into evil speaking against God. Oth. That thy spirit muttereth against God, and bringeth forth (such) speechs against God.] and lettest (such) speeches go forth out of thy mouth?"}],"14":[{"catchword":null,"tekst":"What is man that he should be clean? [the sense is, that he is not clean at all: and hath nothing to make him boast of his cleanness and righteousness. The question here inferreth a strong denial, see Gen.18.on verse 17.] and he that is born of a woman, that he should be righteous."}],"15":[{"catchword":null,"tekst":"Behold, he should not confide in his Saints: [i.e. the good Angels, which above chap.1. verse 6 are called the sons of God, item, chap.4.18. his servants and 1Tim.5.21. the elect Angels, they are called holy, because they do perfectly execute the will of God. Psa 103:20. Mat 6:10. and consequently perfectly love him. See above chap.4.on verse 18.] and the heavens [i.e. the aforesaid good angels, which have their dwelling-place in heaven: for which cause they are likewise called the angels of heaven Matt.24.36. and are said there to behold the face of the heavenly father, Matt.18.10.] are not pure in his eyes."}],"16":[{"catchword":null,"tekst":"How much more is a man [vir, or homo, See above chap.12.on verse 10. But it seemeth that Eliphaz doth rather make use here of the word man (vir) to give Job a touch thereby] abominable and stinking, which drinketh in iniquity like water? [i.e. committeth evil and iniquity as eargerly and excessively, as men and beasts being dry and thirty, do long to drink and quench their thirst. Compare below 34.7. and Prov 26:6.]"}],"17":[{"catchword":null,"tekst":"I shall shew thee [viz. That it is true, what I said, that only the wicked are destroyed of God. See above chap.4.on vers.8.] hearken unto me: and that which I have seen, that will I relate. [Otherwise, For I have seen it, therefore will I relate it.]"}],"18":[{"catchword":null,"tekst":"Which the wise have declared; and was not hidden wise ones, the sense being, that the wise had received it from hand to hand, and heard it of their fore-fathers.]"}],"19":[{"catchword":null,"tekst":"To whom alone the land was given: [viz. By the people of the land, for to govern the same by their wisdom, and great authority, for unto such was the Government of Countries in former times committed passed [i.e. through whose Country there was no hostile passing or thorough-fare of any strange or foreign Nation. The meaning is, that those wise did so well govern, that their Country was not touched, nor annoyed by any foreign fores. Or, no strangers, i.e. such as brought any other, or strange doctrine into the land, besides that which those wise Patriachs, did teach therein.]"}],"20":[{"catchword":null,"tekst":"The wicked puts himself to pain at all days, [i.e. all his life long. Eliphaz beginneth here to relate what doctrine, or instruction those antient and wise men had left behind them, much agreeing with that which he had propounded before chap.5.3, &c. And his meaning is. Although the wicked prosper in this world, nevertheless they are unhappy still, by reason of the inward disquietness, and perpetual vexation of their minds] and (few) years in number [Heb. A number of years, instead of, years of number, i.e. few; such as are soon told, as Gen 34:30. See the annotation] are laid up for the Tyrants. [viz. In Gods eternal decree, which is hid and kept secret from men. The sense of this verse is, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    }

      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
