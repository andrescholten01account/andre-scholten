\"H995\">aanmerk</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H6342\">vrees</span> ik voor Hem;","16":"<span class=\"wl\" data-l=\"L1\" data-code=\"H410\">Want</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H410\">God</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H410\">heeft</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3820\">mijn</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3820\">hart</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7401\">week</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7401\">gemaakt</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H7706\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7706\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7706\">Almachtige</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7706\">heeft</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H926\">mij</span> ontsteld;","17":"<span class=\"wl\" data-l=\"L1\" data-code=\"H3588\">Omdat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3808\">ik</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3808\">niet</span> weggevaagd <span class=\"wl\" data-l=\"L3\" data-code=\"H4480\">ben</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4480\">vóór</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4480\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2822\">duisternis</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H4480\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4480\">Hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4480\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6440\">mijn</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6440\">aangezicht</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6440\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H652\">donkerheid</span> niet <span class=\"wl\" data-l=\"L8\" data-code=\"H3680\">bedekt</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3680\">heeft</span>."},"koppeling_kjv":{"1":"Then <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and said,","2":"Even to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is my <span class=\"wl wl-kjv\" data-code=\"H7879\">complaint</span> <span class=\"wl wl-kjv\" data-code=\"H4805\">bitter:</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">stroke</span> is <span class=\"wl wl-kjv\" data-code=\"H3513\">heavier</span> than my groaning.","3":"Oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> where I might <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> him! that I might <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> even to his seat!","4":"I would <span class=\"wl wl-kjv\" data-code=\"H6186\">order</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">cause</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> with arguments.","5":"I would <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H4405\">words</span> which he would <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> me, and <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> what he would say","6":"Will he <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> <span class=\"wl wl-kjv\" data-code=\"H5978\">against</span> me with his <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power?</span> No; but he would put","7":"There the <span class=\"wl wl-kjv\" data-code=\"H3477\">righteous</span> might <span class=\"wl wl-kjv\" data-code=\"H3198\">dispute</span> with him; so should I be <span class=\"wl wl-kjv\" data-code=\"H6403\">delivered</span> for <span class=\"wl wl-kjv\" data-code=\"H5331\">ever</span> from my judge.","8":"Behold, I <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> <span class=\"wl wl-kjv\" data-code=\"H6924\">forward,</span> but he is not there; and <span class=\"wl wl-kjv\" data-code=\"H268\">backward,</span> but I cannot perceive","9":"On the left <span class=\"wl wl-kjv\" data-code=\"H8040\">hand,</span> where he doth <span class=\"wl wl-kjv\" data-code=\"H6213\">work,</span> but I cannot <span class=\"wl wl-kjv\" data-code=\"H2372\">behold</span> him: he <span class=\"wl wl-kjv\" data-code=\"H5848\">hideth</span> himself on the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> that I cannot see","10":"But he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that I <span class=\"wl wl-kjv\" data-code=\"H5978\">take:</span> when he hath <span class=\"wl wl-kjv\" data-code=\"H974\">tried</span> me, I shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> as gold.","11":"My <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> hath <span class=\"wl wl-kjv\" data-code=\"H270\">held</span> his <span class=\"wl wl-kjv\" data-code=\"H838\">steps,</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> have I <span class=\"wl wl-kjv\" data-code=\"H8104\">kept,</span> and not declined.","12":"Neither have I gone <span class=\"wl wl-kjv\" data-code=\"H4185\">back</span> from the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips;</span> I have <span class=\"wl wl-kjv\" data-code=\"H6845\">esteemed</span> the <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> more than my necessary","13":"But he is in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> mind, and who can <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> him? and what his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H183\">desireth,</span> even that he doeth.","14":"For he <span class=\"wl wl-kjv\" data-code=\"H7999\">performeth</span> the thing that is <span class=\"wl wl-kjv\" data-code=\"H2706\">appointed</span> for me: and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> such","15":"Therefore am I <span class=\"wl wl-kjv\" data-code=\"H926\">troubled</span> at his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence:</span> when I <span class=\"wl wl-kjv\" data-code=\"H995\">consider,</span> I am afraid","16":"For <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> maketh my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H7401\">soft,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> troubleth","17":"Because I was not cut <span class=\"wl wl-kjv\" data-code=\"H6789\">off</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> neither hath he <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H652\">darkness</span> from my face."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Ook heden","tekst":"Te weten, na zoveel verdedigingen, die ik tot bewijs van mijn onschuld en oprechtheid voor dezen gedaan heb. Of men kan deze woorden vraagsgewijze nemen: Zal ook heden mijn klacht wederspannigheid zijn?"},{"catchword":"klacht","tekst":"Te weten, die ik doe over mijn grote ellende."},{"catchword":"wederspannigheid;","tekst":"Dat is, zij wordt voor wederspannigheid tegen God gehouden. Dit zegt Job, omdat zijn verantwoordingen daarvoor van zijn vrienden veroordeeld werden. Vergelijk boven, Job 4:5 , en Job 5:1 , en Job 8:2-3 , en Job 11:2-3 , en Job 15:4 , en Job 22:4-5 ."},{"catchword":"mijn plage","tekst":"Hebreeuws, mijn hand; dat is, de hand Gods, waarmede ik alsnu geplaagd en geslagen word; want de hand Gods is voor Gods straf genomen, die ook Jobs hand en straf genaamd wordt, omdat hij ze dragen en lijden moest; zie boven, Job 13:21 , en de aantekening."},{"catchword":"zwaar","tekst":"Dat is, zwaarder dan ik met mijn zuchten en klachten uitdrukken kan. Alzo in het Hebreeuwse woord hal ook gebruikt Psa 89:8 ."}],"3":[{"catchword":"Och,","tekst":"Hebreeuws, wie zal geven, ik heb geweten, en ik zal hem vinden. Zie van deze manier van wensen boven, Job 6:8 ."},{"catchword":"Hem","tekst":"Te weten, God."},{"catchword":"stoel","tekst":"Te weten, niet zijner strenge gerechtigheid, maar van zijn vriendelijke genade en vertrouwen, niet van enige volmaaktheid voor God, maar van onschuld voor de mensen."}],"4":[{"catchword":"het recht","tekst":"Dat is, mijn rechtzaak. Vergelijk Num 27:5 , en 1Ki 8:45 ."},{"catchword":"ordentelijk","tekst":"Dat is, ordelijk aandienen, beleiden en verweren."},{"catchword":"met verdedigingen","tekst":"Dat is, met redenen om mijn zaak te verdedigen; te weten, om te tonen en waar te maken dat ik geen huichelaar ben, waarvoor ik van deze mijn vrienden gehouden word. Zie van het Hebreeuwse woord boven, Job 13:6 ."}],"5":[{"catchword":"Hij mij antwoorden zou;","tekst":"Namelijk God."}],"6":[{"catchword":"grootheid","tekst":"Dat is, naar de volheid zijns vermogens en de strengheid zijner gerechtigheid."},{"catchword":"acht","tekst":"De volle manier van spreken is boven, Job 1:8 ; zie de aantekening. De zin is dat God bereid zou zijn om Job te horen en kennis van de beschuldigingen, tegen hem gedaan, te nemen. Anders, Hij zou [kracht] in mij leggen; te weten om voor zijn majesteit te bestaan; verre vandaar dat Hij mij door die verdrukken zou, of ten hardste met mij handelen; Isa 27:4 , Isa 27:8 ."}],"7":[{"catchword":"Daar zou","tekst":"Te weten, waar God zijn volle recht en absolute macht niet in het werk zou stellen. Hij spreekt ten aanzien van het geschil, dat hij met zijn vrienden uitstaande had."},{"catchword":"van mijn Rechter","tekst":"Te weten, vrij verklaard zijnde van denzelven over de beschuldigingen, waarmede mijn vrienden mij bezwaren."}],"8":[{"catchword":"Zie,","tekst":"Hij ziet op hetgeen hij gezegd had boven, vs.3. Och, of ik wist dat ik Hem vinden zou! Alsof hij zeide: Ik kan dat niet weten; hoe zou ik dan met Hem handelen? Want Hij is onzienlijk en onbegrijpelijk en een vrijwillig werkmeester, niet zijnde gehouden zich aan iemand te openbaren ten zijnen gevalle. Vergelijk boven, Job 9:11 ."}],"9":[{"catchword":"Als Hij","tekst":"De zin is, dat de oordelen Gods ons verstand teboven gaan, en waar men zich keert, dat men ze niet kan doorgronden."}],"10":[{"catchword":"weg,","tekst":"Dat is, mijn genegenheid, wil, bewegingen, voornemen, woorden, werken en ganse leven. Zie Gen 6:12 ."},{"catchword":"beproeve","tekst":"Vergelijk boven, Job 7:18 , en de aantekening."},{"catchword":"als goud","tekst":"Dat is, ik zal rein en zuiver bevonden worden over hetgeen mijn vrienden mij opleggen, even gelijk het goud zuiver uit het vuur komt, als het daarin gelouterd is geweest."}],"11":[{"catchword":"Aan Zijn","tekst":"Hij geeft reden van hetgeen hij gezegd had in vs.10, en wederlegt de beschuldigingen van Elifaz; boven, Job 22:5 ."},{"catchword":"gang","tekst":"Zie op het volgende woord weg."},{"catchword":"vastgehouden;","tekst":"Dat is, ik heb zijn weg, dat is zijn geboden, gestadiglijk gevolgd. Vergelijk boven, Job 17:9 ."},{"catchword":"weg","tekst":"Zie Gen 18:19 ."}],"12":[{"catchword":"Zijner lippen","tekst":"Dat is, door zijn lippen of mond uitgesproken; dat is, door zichzelven, of door zijn dienaren."},{"catchword":"bescheiden deel","tekst":"Versta, het dagelijks gezet en verordend onderhoud mijns lichaams; dat is, zoveel mij daartoe nodig, of van God bescheiden is. Alzo Gen 47:22 ; Pro 30:8 , en Pro 31:15 ."},{"catchword":"weggelegd","tekst":"Dat is, in goede bewaring der memorie gehouden, en als een waardigen schat in het binnenste mijns harten opgesloten, om daaraan te gedenken in al mijn doen en laten. Alzo Psa 119:11 ; Pro 2:1 , Pro 2:7 , en Pro 7:1 ."}],"13":[{"catchword":"Maar","tekst":"Alsof hij zeide: Ofschoon ik een goede conscientie heb, nochtans dewijl het Hem belieft mij aldus te bezoeken, wie kan er tegen? wie zal daarover rekenschap van Hem eisen? Zie boven, Job 9:12 , en Job 11:10 ; Rom 9:19 ."},{"catchword":"iemand,","tekst":"Hebreeuws, enen. Of, gelijk sommigen, heeft Hij enig ding voor."},{"catchword":"Zijn ziel","tekst":"Dat is, Hij zelf; te weten God. Alzo Lev 26:30 ; Isa 1:14 ."}],"14":[{"catchword":"wat over mij bescheiden is;","tekst":"Hebreeuws, mijn besluit, of bescheiden deel; te weten, der straffen, die Hij voorgenomen heeft over mij te zenden."},{"catchword":"dingen","tekst":"Dat is, verborgen en toch rechtvaardige oordelen."}],"15":[{"catchword":"aanmerk het,","tekst":"Dat is, als ik betracht deze zijn grote macht, oneindelijke wijsheid en vreeslijke strengheid."}],"16":[{"catchword":"week gemaakt,","tekst":"Dat is, blode, zwak, teder, en als gebroken door al mijn lijden en door de vrees, die mij de grootheid zijner macht en majesteit indrukt. Zie dezelfde manier van spreken Deu 20:3 ."}],"17":[{"catchword":"uitgedelgd ben","tekst":"Dat is, niet weggenomen ben uit deze wereld door den dood."},{"catchword":"voor de duisternis,","tekst":"Hebreeuws, van, of voor het aangezicht der duisternis; dat is, eer de duisternis over mij kwam; of vanwege; dat is, uit oorzaak der duisternis. Versta door deze het lijden en de ellende, waarin hij stak. Zie Gen 15:12 . Hij is verwonderd, dat hij door de grootheid zijns lijdens nog niet was gestorven."},{"catchword":"Hij","tekst":"Namelijk God."},{"catchword":"van mijn aangezicht","tekst":"Dat is, van mijn kennis en wetenschap; teneinde ik mijn verdriet niet meer zien noch gevoelen zou."},{"catchword":"de donkerheid","tekst":"Versta, de donkerheid des doods, die den stervende overkomt. Deze wordt van iemands aangezicht bedekt zolang hij haar niet ziet, dat is, niet sterft, maar in het leven behouden wordt, waarvan Job een afschuw had, boven, Job 3:23 , en Job 6:8-9 . Anders, en dat Hij van mijn aangezicht de donkerheid [niet] bedekt heeft; dat is, dat Hij van mij dit lijden niet weggenomen heeft, te weten door den dood, opdat ik hetzelve niet langer aanschouwen, noch lijden zou. Aldus is het woord niet uit het voorgaande lid van vs.17 hier weder ingevoegd; en het woord donkerheid in denzelfden zin als het voorgaande duisternis genomen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered and said,"}],"2":[{"catchword":null,"tekst":"This day also, [viz. After so many pleadings of mine innocence and uprightfulness; or the words may be read in a question. Shall my complaint; [viz. Which I make of my great misery] obstinacy, [i.e. my complaint is held and judged to be obstinacy and refractoriness against God. This Job saith because his friends past such a doom upon his apologies. Comp. Above 4.5. and 5.1. and 8.2,3. And 11.2,3. And 15.4. and 22.4,5.] My plague [Heb. My hand, i.e. the hand of God; whereby I am plagued and afflicted now, for Gods hands, is taken for Gods punishment; which likewise called Jobs hand and punishment, because he must bear and endure it. See above 13.21. and the annotation.] is heavy, above my sighting. [i.e. more grievous, than I am able to express by my sighing and complaining. So the Hebrew particle hal, is likewise taken, Psa 89:8.]"}],"3":[{"catchword":null,"tekst":"O that I knew that I should find him! [Heb. Who shall give, I have known, and I shall find him! See of this kind of wishing above 6.on verse 8. Him, viz. God] I should come unto his seat. [viz. Not of his severe Justice, but of his tender mercy; in confidence, not of any perfection before God, but of my innocency before men.]"}],"4":[{"catchword":null,"tekst":"I should ordery set forth [i.e. orderly and punctually declare, deduce and maintain.] the right [i.e. my cause, or controversy, Compare Num 27:5 and 1 Kings 8.45.] and I should fill up my mouth with pleadings. [i.e. with grounds and reasons to plead my cause; namely to shew and evidence the truth, that I am no hypocrite, as I am judged and counted by these friends of mine. See of the Hebrew word above 13.on v.6.]"}],"5":[{"catchword":null,"tekst":"I should know the speechs (which) he [God namely] should answer me, and understand what he should say to me."}],"6":[{"catchword":null,"tekst":"Would he contend with me, according to the greatness of (his) power? [i.e. according to the utmost and fullness of his power, and the exact severity of his justice.] no: but he should take (heed) to me. [The full phrase is above chap.1.8. See the annotation. The meaning is, That God would be ready to give Job a gracious hearing, and to take cognizance of the accusations made against him Oth. He should lay (strength) in me, viz. To stand before his Majesty; as who would be far from oppressing me by the same, or dealing with extremity of rigour against me. Isaiah 27. 4,8.]"}],"7":[{"catchword":null,"tekst":"There the upright should plead with him: [viz. Where God should not proceed with the exactness of his justice, and according to the absoluteness of his power. He speaketh thus in regard of the quarrel he had with his friends.] and I should forever free my self from my Judge. [i.e. be cleared or declared free by him, in the matter of these accusations or charges wherewith my friends charge me.]"}],"8":[{"catchword":null,"tekst":"Behold, if I go forward then he is not there, or backward, then I perceive him not. [He reflecteth on that which he had said above verse 3. O that I knew where I should find him! As if he said, I cannot come to know that, how then should I be able to deal with him? For he is invisible and incomprehensible, and a most free and absolute agent, being not bound to reveal himself at any ones pleasure. Comp. Above ch.9. v.11.]"}],"9":[{"catchword":null,"tekst":"When he worketh on the left hand, I do not behold (him): (when) he covereth himself on the right // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    } else {

  const refChips = refs => {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
