 hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen.","5":"Maar zeker, och, of God sprak, en Zijn lippen tegen u opende;","6":"En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.","7":"Zult u de doorgronding van God vinden? Zult u tot de volmaaktheid toe de Almachtige vinden?","8":"*Zij* *is* *als* de hoogten van de hemelen, wat kunt u doen? Dieper dan het graf, wat kunt u weten?","9":"Langer dan de aarde is haar maat, en breder dan de zee.","10":"Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?","11":"Want Hij kent de ijdele mensen, en Hij ziet de ondeugd; zou Hij dan niet opmerken?","12":"Dan zal een verstandeloos man verstandig worden; hoewel de mens *als* het veulen van een woudezel geboren is.","13":"Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit.","14":"Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen.","15":"Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen.","16":"Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is.","17":"Ja, *uw* levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn.","18":"En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;","19":"En u zult neerliggen, en niemand zal *u* verschrikken; en velen zullen uw gezicht smeken.","20":"Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht."},"SV":{"1":"Toen antwoordde Zofar, de Naämathiet, en zeide:","2":"Zou de veelheid der woorden niet beantwoord worden, en zou een klapachtig man recht hebben?","3":"Zouden uw leugenen de lieden doen zwijgen, en zoudt gij spotten, en niemand *u* beschamen?","4":"Want gij hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen.","5":"Maar gewisselijk, och, of God sprak, en Zijn lippen tegen u opende;","6":"En u bekend maakte de verborgenheden der wijsheid, omdat zij dubbel zijn in wezen! Daarom weet, dat God voor u vergeet van uw ongerechtigheid.","7":"Zult gij de onderzoeking Gods vinden? Zult gij tot de volmaaktheid toe den Almachtige vinden?","8":"*Zij* *is* *als* de hoogten der hemelen, wat kunt gij doen? Dieper dan de hel, wat kunt gij weten?","9":"Langer dan de aarde is haar maat, en breder dan de zee.","10":"Indien Hij voorbijgaat, opdat Hij overlevere of vergadere, wie zal dan Hem afkeren?","11":"Want Hij kent de ijdele lieden, en Hij ziet de ondeugd; zou Hij dan niet aanmerken?","12":"Dan zal een verstandeloos man kloekzinnig worden; hoewel de mens *als* het veulen eens woudezels geboren is.","13":"Indien gij uw hart bereid hebt, zo breid uw handen tot Hem uit.","14":"Indien er ondeugd in uw hand is, doe die verre weg; en laat het onrecht in uw tenten niet wonen.","15":"Want dan zult gij uw aangezicht opheffen uit de gebreken, en zult vast wezen, en niet vrezen.","16":"Want gij zult de moeite vergeten, *en* *harer* gedenken als der wateren, die voorbijgegaan zijn.","17":"Ja, *uw* tijd zal klaarder dan de middag oprijzen; gij zult uitvliegen, als de morgenstond zult gij zijn.","18":"En gij zult vertrouwen, omdat er verwachting zal zijn; en gij zult graven, gerustelijk zult gij slapen;","19":"En gij zult nederliggen, en niemand zal *u* verschrikken; en velen zullen uw aangezicht smeken.","20":"Maar de ogen der goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de uitblazing der ziel."},"KJV":{"1":"Then answered Zophar the Naamathite, and said,","2":"Should not the multitude of words be answered? and should a man full of talk be justified?","3":"Should thy lies make men hold their peace? and when thou mockest, shall no man make thee ashamed?","4":"For thou hast said, My doctrine *is* pure, and I am clean in thine eyes.","5":"But oh that God would speak, and open his lips","6":"And that he would shew thee the secrets of wisdom, that *they are* double to that which is! Know therefore that God exacteth of thee *less* than thine iniquity","7":"Canst thou by searching find out God? canst thou find out the Almighty unto perfection?","8":"*It is* as high as heaven; what canst thou do? deeper than hell; what canst thou know?","9":"The measure thereof *is* longer than the earth, and broader than the sea.","10":"If he cut off, and shut up, or gather together, then who can hinder","11":"For he knoweth vain men: he seeth wickedness also; will he not then consider","12":"For vain man would be wise, though man be born *like* a wild ass's colt.","13":"If thou prepare thine heart, and stretch out thine hands","14":"If iniquity *be* in thine hand, put it far away, and let not wickedness dwell in thy tabernacles.","15":"For then shalt thou lift up thy face without spot; yea, thou shalt be stedfast, and shalt not fear:","16":"Because thou shalt forget *thy* misery, *and* remember *it* as waters *that* pass away:","17":"And *thine* age shall be clearer than the noonday; thou shalt shine forth, thou shalt be as the morning.","18":"And thou shalt be secure, because there is hope; yea, thou shalt dig *about thee, and* thou shalt take thy rest in safety.","19":"Also thou shalt lie down, and none shall make *thee* afraid; yea, many shall make suit unto thee.","20":"But the eyes of the wicked shall fail, and they shall not escape, and their hope *shall be as* the giving up of the ghost."}},"tsk":{"1":[{"kopje":"Zofar","refs":["Job 2:11","Job 20:1"]}],"2":[{"kopje":"de veelheid","refs":["Job 16:3","Job 18:2","Ps 140:12","Spr 10:19","Hand 17:18","Jak 1:19"]}],"3":[{"kopje":"uw leugens","refs":["Job 13:4","Job 15:2","Job 15:3","Job 24:25"]},{"kopje":"spotten","refs":["Job 12:4","Job 13:9","Job 17:2","Job 34:7","Ps 35:16","Jer 15:17","Judas 1:18"]},{"kopje":"beschamen","refs":["Ps 83:17","2 Tess 3:14","Tit 2:8"]}],"4":[{ ss=\"wl wl-kjv\" data-code=\"H6691\">Zophar</span> the <span class=\"wl wl-kjv\" data-code=\"H5284\">Naamathite,</span> and said,","2":"Should not the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> be <span class=\"wl wl-kjv\" data-code=\"H6030\">answered?</span> and should a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> full of <span class=\"wl wl-kjv\" data-code=\"H8193\">talk</span> be justified?","3":"Should thy <span class=\"wl wl-kjv\" data-code=\"H907\">lies</span> <span class=\"wl wl-kjv\" data-code=\"H2790\">make</span> <span class=\"wl wl-kjv\" data-code=\"H4962\">men</span> hold their <span class=\"wl wl-kjv\" data-code=\"H2790\">peace?</span> and when thou <span class=\"wl wl-kjv\" data-code=\"H3932\">mockest,</span> shall no man make thee ashamed?","4":"For thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H3948\">doctrine</span> is <span class=\"wl wl-kjv\" data-code=\"H2134\">pure,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H1249\">clean</span> in thine eyes.","5":"<span class=\"wl wl-kjv\" data-code=\"H199\">But</span> oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> would <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> and <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> his lips","6":"And that he would <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee the <span class=\"wl wl-kjv\" data-code=\"H8587\">secrets</span> of <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> that they are <span class=\"wl wl-kjv\" data-code=\"H3718\">double</span> to that which <span class=\"wl wl-kjv\" data-code=\"H8454\">is!</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> therefore that <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5382\">exacteth</span> of thee less than thine iniquity","7":"Canst thou by <span class=\"wl wl-kjv\" data-code=\"H2714\">searching</span> find <span class=\"wl wl-kjv\" data-code=\"H4672\">out</span> <span class=\"wl wl-kjv\" data-code=\"H433\">God?</span> canst thou <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> out the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> unto perfection?","8":"It is as <span class=\"wl wl-kjv\" data-code=\"H1363\">high</span> as <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> what canst thou <span class=\"wl wl-kjv\" data-code=\"H6466\">do?</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deeper</span> than <span class=\"wl wl-kjv\" data-code=\"H7585\">hell;</span> what canst thou know?","9":"The <span class=\"wl wl-kjv\" data-code=\"H4055\">measure</span> thereof is <span class=\"wl wl-kjv\" data-code=\"H752\">longer</span> than the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7342\">broader</span> than the sea.","10":"If he cut <span class=\"wl wl-kjv\" data-code=\"H2498\">off,</span> and shut <span class=\"wl wl-kjv\" data-code=\"H5462\">up,</span> or gather <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> then who can hinder","11":"For he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> <span class=\"wl wl-kjv\" data-code=\"H7723\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H4962\">men:</span> he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> <span class=\"wl wl-kjv\" data-code=\"H205\">wickedness</span> also; will he not then consider","12":"For <span class=\"wl wl-kjv\" data-code=\"H5014\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> would be <span class=\"wl wl-kjv\" data-code=\"H3823\">wise,</span> though <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> be <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> like a wild <span class=\"wl wl-kjv\" data-code=\"H6501\">ass's</span> colt.","13":"If thou <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">stretch</span> out thine hands","14":"If <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity</span> be in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> put it far <span class=\"wl wl-kjv\" data-code=\"H7368\">away,</span> and let not <span class=\"wl wl-kjv\" data-code=\"H5766\">wickedness</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in thy tabernacles.","15":"For then shalt thou lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> without <span class=\"wl wl-kjv\" data-code=\"H3971\">spot;</span> yea, thou shalt be <span class=\"wl wl-kjv\" data-code=\"H3332\">stedfast,</span> and shalt not fear:","16":"Because thou shalt <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> thy <span class=\"wl wl-kjv\" data-code=\"H5999\">misery,</span> and <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> it as <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> that pass away:","17":"And thine <span class=\"wl wl-kjv\" data-code=\"H2465\">age</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6965\">clearer</span> than the <span class=\"wl wl-kjv\" data-code=\"H6672\">noonday;</span> thou shalt shine <span class=\"wl wl-kjv\" data-code=\"H5774\">forth,</span> thou shalt be as the morning.","18":"And thou shalt be <span class=\"wl wl-kjv\" data-code=\"H982\">secure,</span> because there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> <span class=\"wl wl-kjv\" data-code=\"H8615\">hope;</span> yea, thou shalt <span class=\"wl wl-kjv\" data-code=\"H2658\">dig</span> about thee, and thou shalt take thy <span class=\"wl wl-kjv\" data-code=\"H7901\">rest</span> in safety.","19":"Also thou shalt lie <span class=\"wl wl-kjv\" data-code=\"H7257\">down,</span> and none shall make thee <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid;</span> yea, <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> shall make <span class=\"wl wl-kjv\" data-code=\"H2470\">suit</span> unto thee.","20":"But the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> shall <span class=\"wl wl-kjv\" data-code=\"H3615\">fail,</span> and they shall not <span class=\"wl wl-kjv\" data-code=\"H6\">escape,</span> and their <span class=\"wl wl-kjv\" data-code=\"H8615\">hope</span> shall be as the giving <span class=\"wl wl-kjv\" data-code=\"H4646\">up</span> of the ghost."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"de veelheid","tekst":"Anders, die veel van woorden is, of een veelspreker."},{"catchword":"klapachtig","tekst":"Hebreeuws, man der lippen; dat is, een klapper en zwetser. Alzo wordt een man der tong genaamd een man die tot kwaadspreken en lasteren genegen is, Psa 140:12 . Daarentegen een man der woorden wordt genaamd een, die welsprekend is; Exo 4:10 ."},{"catchword":"recht hebben?","tekst":"Of, rechtvaardig zijn?"}],"3":[{"catchword":"Zouden","tekst":"Anders, zouden [o] uw leugenen de lieden zwijgen?"},{"catchword":"leugenen","tekst":"Het woord in het oorspronkelijke betekent verscheidene dingen, maar voor leugenen wordt het genomen Jer 48:30 ."}],"4":[{"catchword":"Mijn leer","tekst":"Te weten, waardoor Job geleerd had dat God de goeden zowel gestraft als de kwaden, boven, Job 9:22 , hoewel Hij zulks rechtvaardiglijk doet, in hetzelfde hoofdstuk, Job 9:2-3 , doch niet altijd acht hebbende op de zonde [gelijk wanneer Hij de goddelozen straft], boven, Job 10:7 . Het Hebreeuwse woord betekent niet alleen het onderwijs, dat gegeven wordt, maar ook de wetenschap, die ontvangen wordt. Vergelijk Pro 1:5 , en Pro 4:2 , enz."},{"catchword":"ik ben rein","tekst":"Zie boven, Job 10:7 , waar Job wel zegt dat hij niet goddeloos was, maar niet, gelijk Zofar hem hier verwijt, dat hij zuiver was in des Heeren ogen. Het eerste verstond Job van gruwelijke goddeloosheid, die zijn vrienden hem oplegden; en dit andere, dat Zofar hem hier ten laste legt, verstaat zich van een volkomen reinheid, die Job noch zichzelven, noch iemand toegeschreven heeft. Zie boven, Job 9:2 ."},{"catchword":"in uw ogen","tekst":"De ogen Gods betekenen hier zijn oordeel; alzo 1Sa 15:19 ; 1Ki 11:6 ."}],"5":[{"catchword":"och,","tekst":"Hebreeuws, wie zal geven dat God spreke? Zie boven, Job 6:8 ."}],"6":[{"catchword":"dubbel","tekst":"Dat is, nog eens zo groot in der daad en waarheid. De zin is, dat in Gods wijsheid nog veel meer reden was om Job harder te straffen, dan hij gestraft was, indien Hij tegen hem het hoogste recht had willen gebruiken; vergelijk Ezr 9:15 . Anders, want der wijsheid is nog eens zoveel."},{"catchword":"in wezen","tekst":"Anders, bij de wet, die nog eens zoveel vereist dan gij gedaan hebt. Zie van het Hebreeuwse woord touschijah, boven, Job 5:12 ."},{"catchword":"vergeet","tekst":"Dat is, afstaat, of vermindert. Of aldus: Dat God u vergeet [dat is, geen weldadigheid bewijst] vanwege uwe ongerechtigheid, of dat God u afvordert, enz. Anders, van u [min] eist, dan uw ongerechtigheid [verdient]."},{"catchword":"ongerechtigheid","tekst":"Dat is, straf uwer ongerechtigheid. Zie Lev 5:1 ."}],"7":[{"catchword":"de onderzoeking","tekst":"Onderzoeking wordt genaamd hetgeen door onderzoeking verkregen wordt, als verstand, wijsheid en oordeel; want hoewel deze dingen door zulk middel in God niet zijn, nochtans menselijker wijze worden zij alzo genoemd. Gode nu en zijnen Geest wordt onderzoeking toegeschreven, onder, Job 28:27 ; 1Co 2:10 . Versta hier door deze de heimelijke, doch rechtvaardige oordelen Gods, die Hij gebruikt in het straffen. Anders, zult gij [door] onderzoeking God vinden?"},{"catchword":"den Almachtige","tekst":"Dat is, de verborgenheden van de wijsheid des almachtigen Gods, of zijn volmaaktheid."}],"8":[{"catchword":"Zij is als","tekst":"Dat is, zij, te weten, de wijsheid Gods, waarvan boven, vs.6, gesproken is, [of de volmaaktheid Gods, waarvan enigen menen vs.7 gesproken te zijn] is bij den allerhoogsten hemel te vergelijken. Zie Eph 3:18 ."},{"catchword":"wat kunt gij doen?","tekst":"Te weten, om die ten volle te onderzoeken en uit te vinden."},{"catchword":"hel,","tekst":"Vergelijk onder, Job 26:6 , en zie Gen 37:35 ."}],"10":[{"catchword":"Hij voorbijgaat,","tekst":"Dat is, zo Hij, te weten, God, zich vertoont in zijne werken. Alzo boven, Job 9:11 . Zie de aantekening. Anders, zo Hij verandert; te weten, zijn werk."},{"catchword":"overlevere","tekst":"Of, besluite; te weten, in het geweld der straf, die Hij rechtvaardiglijk tegen hem uitvoert."},{"catchword":"vergadere,","tekst":"Versta, tot de genieting zijner weldaden, die Hij bewijst aan degenen, welke Hij genadiglijk aanneemt."}],"11":[{"catchword":"de ijdele lieden","tekst":"Hebreeuws, mensen der ijdelheid, of valsheid; dat is, die tot ijdelheid en valsheid genegen zijn. Versta, ijdele leer en onnutte werken, welke gevonden worden in degenen, die zonder het geloof, de vreze Gods en ware boetvaardigheid zijn. Alzo Psa 26:4 . In gelijken zin worden genaamd onder, Job 22:15 , lieden der ongerechtigheid, en Job 34:8 , mannen der goddeloosheid; Pro 24:1 , lieden der boosheid."},{"catchword":"aanmerken?","tekst":"Dat is, bedenken, verstaan, achtgeven en voornemen die naar zijne rechtvaardigheid te straffen. Zie van het Hebreeuwse woord 1Ki 3:21 ."}],"12":[{"catchword":"Dan zal","tekst":"Te weten, als God zijn straffen en oordelen uitvoert. Anders, maar de mens is ijdel [en] verstandeloos, en [als] het jong van een woudezel is de mens geboren."},{"catchword":"verstandeloos","tekst":"Hebreeuws, ledig."},{"catchword":"kloekzinnig","tekst":"Dat is, niet alleen genegen zijn om wijsheid te leren, maar zal ook dezelve begrijpen en aannemen; want het hart wordt in de Heilige Schrift voor den zin en het verstand des mensen genomen. Zie boven, Job 9:4 ."},{"catchword":"hoewel","tekst":"Dat is, al is het dat de mens van het begin zijns levens af zeer plomp en onverstandig is, gelijk het veulen van een wilden ezel, nochtans kan hij door de overlegging van Gods werken enige wijsheid vatten, welverstaande door den Geest Gods verlicht en geleid zijnde."}],"13":[{"catchword":"bereid hebt,","tekst":"Te weten, door oprechte bekering. Zie 2Ch 12:14 ."},{"catchword":"breid","tekst":"Zie van deze ceremoniën in het bidden gebruikelijke, 1Ki 8:22 ."},{"catchword":"tot Hem uit","tekst":"Namelijk, tot God."}],"14":[{"catchword":"Indien","tekst":"Dat is, zo gij een voornemen hebt om uw naaste kwaad te doen, of alreeds dat gedaan hebt. In zulk een manier van spreken betekent het woord hand het voornemen of de daad des mensen, of beide. Vergelijk 1Sa 26:18 ; 1Ch 12:17 ; Psa 26:10 ."}],"15":[{"catchword":"uit de gebreken,","tekst":"Dat is, uit de menigerlei ellenden, in welke gij nu steekt, en de straffen, die gij nu lijden moet."}],"16":[{"catchword":"harer","tekst":"Dat is, der voorgemelde moeite, of ellende."},{"catchword":"als der wateren,","tekst":"Te weten, die zeer snellijk weggevloeid en voorbijgelopen zijn, op welke men niet meer denkt. Hij wil zeggen dat hij gans geen gedachtenis zijner ellende zou hebben."}],"17":[{"catchword":"Ja,","tekst":"Of, ouderdom; vergelijk Psa 39:6 , en Psa 89:48 ."},{"catchword":"klaarder","tekst":"Dat is, klaarder dan het schijnsel der middagzon. De middag betekent hier zeer grote klaarheid. Zie boven, Job 5:14 . De zin is: Wat gij nog overig te leven hebt, zal van God grotelijks gezegend worden; want middag betekent somtijds in de Heilige Schriftuur groten voorspoed; Isa 58:10 ; Amo 8:9 ."},{"catchword":"uitvliegen,","tekst":"Dat is, uit kruis en lijden verlost worden, en u als het morgenlicht uitbreiden. Anders, zijt gij duister, zo zult gij als de morgenstond zijn."}],"18":[{"catchword":"graven,","tekst":"Te weten, om uw hut of huis te bouwen en te verzekeren. De zin is dat hij een zekere plaats van woning zou hebben, in welke hij stil en gerust zou wonen."}],"19":[{"catchword":"smeken","tekst":"Dat is, de mensen zullen zich voor u vernederen, verzoekende met allen eerbied en ernst uw gunst, uit oorzaak van uw hoogheid, eer en vermogen. Het Hebreeuwse woord is ook in gelijken zin genomen, Exo 32:11 ; 1Sa 13:12 ; 1Ki 13:6 ; Psa 45:13 , en Psa 119:58 ; Pro 19:6 ; Zec 7:2 ."}],"20":[{"catchword":"de uitblazing","tekst":"Versta hiermede den dood, welke, als hij den goddelozen overkomt, hun alle hoop beneemt, niet alleen omdat zij hier al hun goed en heerlijkheid laten moeten, maar ook omdat het gevoel van Gods toorn hen verschrikt, waardoor zij beroofd worden van hun troost, ten aanzien van dit en het toekomende leven. Vergelijk Jer 15:9 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then answered Zophar the Naamatite, and said:"}],"2":[{"catchword":null,"tekst":"Should the multitude of words, [Oth. He that is much in words, or one that speaketh much.] not be answered? And should a babbling man [Heb. A man of lips, i.e. a babler and parter. So he is called a man of the tongue, that loveth to speak evil, and to slander, Psa 140:12. contrarily a man of words, he that is eloquent, or able to speak well, Exo 4:10.] have right? [or, be righteous?]"}],"3":[{"catchword":null,"tekst":"Should thy lies make men to be silent? [Other. Should men be silent upon, or at thy lies? The Hebrew word rendered lies here, hath divers significations, but is taken likewise for lies, Jer 48:30.] and shouldst thou mock and none shame (thee)?"}],"4":[{"catchword":null,"tekst":"For thou haste said, My doctrine is clean, [viz. That, whereby Job had taught, that God doth punish the good as well as the wicked, above 9.22. although he do it righteously, in the same chapter, vers.2,3. Yet not always regarding sin (as when he punisheth the wicked) above 10.7. The Hebrew words for doctrine, doth not only signify the instruction, which is given, but the knowledge also, which is received, or gotten by it. Compare Prov 1:5. and 4.2, etc.] and I am pure, [see above chap.10. verse 7. Where Job saith indeed, that he was not wicked; but not as Zophar here upbraideth him, that he was pure and clean in the eyes of the LORD. The former, Job understood of abominable impiety, which Zophar here rebukes him for, is to be understood of a perfect cleanness and purity, which Job never attributed neither to himself, nor to another. See above 9.2.] in thine eyes: [Gods eyes doth signify his Judgement. So 1 Samuel 15. Verse 19. And 1 Kings 11.6.]"}],"5":[{"catchword":null,"tekst":"But certaintly, that God spake; [Hebr. Who giveth, that God would speak? See above chapter 8. On verse 8.] and opened his lips against thee!"}],"6":[{"catchword":null,"tekst":"And made known unto thee, the hiddenesses of wisdom, because they are double [i.e. once again as great indeed and truth. The sense is; That in the wisdom of God there was much more reason to punish Job neither yet, then he was punished, if he would proceed against him, according to the utmost of his justice. Compare Ezra 9.on verse 15. Oth. For there is yet once again as much wisdom.] in essence [Oth. By the Law, which requireth a double satisfaction for the breach thereof. See of the Hebrew word here used, above chap.5.on v.12.] therefore know that God, for thee [i.e. in thy behalf] foregetteth [i.e. abateth, or lesseneth. Or thus, that God forgets thee (i.e. sheweth thee no kindness now) because of thy iniquity; or, that God requireth of thee, etc. Oth. Requireth (less) of thee then thine iniquity (deserveth.)] of thine iniquity [i.e. of the punishment of thine iniquity. See Leviticus chap.5.on verse 1.]"}],"7":[{"catchword":null,"tekst":"Shalt thou find the searching of God? [searching is called, that which is gotten by searching; as understanding, wisdom and judgement: for although these things be not in God by any such means, yet they are called so accordi // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {

  if (!k) return;

// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)

  const rij = e.target.closest('.vers');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
