r dan uzelf.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Job 15:14": "Wat is de mens, dat hij zuiver zou zijn, en die geboren is van een vrouw, dat hij rechtvaardig zou zijn?", "Jes 43:20": "Het gedierte van het veld zal Mij eren, de jakhalzen en de jonge struisvogels; want Ik zal in de woestijn water geven, en rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen te drinken te geven.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Spr 21:21": "Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Jes 56:2-8": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen. En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond;", "Luk 18:29": "En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "Mark 6:12": "En zij gingen uit, en predikten dat de mensen zich moesten bekeren.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Ps 105:14-45": "Liet Hij geen mens toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, en zei: Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad. Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "1 Kor 13:9": "Want wij kennen ten dele, en wij profeteren ten dele;", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Jes 47:4-10": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël. Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "2 Kron 19:3": "Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken.", "Job 24:1": "Waarom zouden voor de Almachtige de tijden niet verborgen zijn, terwijl zij die Hem kennen Zijn dagen niet zien?", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 104:24": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom.", "Rom 3:27": "Waar is dan de roem? Hij is uitgesloten. Door welke wet? Van de werken? Nee, maar door de wet van het geloof.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Job 32:9-13": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet. Daarom zeg ik: Luister naar mij; ik zal mijn mening ook tonen. Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Ps 147:16": "Hij geeft sneeuw als wol; Hij strooit de rijp als as.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Ps 139:1-24": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij. U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten. U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.", "Job 8:4-7": "Als uw kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding. Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt; als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Jes 30:23-26": "Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden. En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan. En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen.", "Job 36:7-12": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven. En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben;", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ezech 31:10-14": "Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over uw stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte; daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, zodat die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid. En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Pred 11:5": "Zoals u niet weet wat de weg van de wind is, of hoe de beenderen zijn in de buik van een zwangere vrouw, zo weet u het werk van God niet, Die het alles maakt.", "Ex 15:17": "Hen zult U inbrengen, en planten op de berg van Uw erfenis, op de plaats die U, o HEERE, gemaakt hebt om te wonen, het heiligdom, dat Uw handen gesticht hebben, o Heere!", "Ex 3:16": "Ga heen, en verzamel de oudsten van Israël, en zeg tegen hen: De HEERE, de God van uw vaderen, is mij verschenen, de God van Abraham, Izak en Jakob, en Hij zei: Ik heb u getrouw bezocht, en gezien wat u in Egypte is aangedaan;", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Ps 78:12-16": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop. En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "Ps 30:7": "Ik zei wel in mijn voorspoed: Ik zal nooit wankelen.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Jer 23:17": "Zij zeggen steeds tegen hen die Mij lasteren: De HEERE heeft het gesproken, u zult vrede hebben; en tegen ieder die naar het goeddunken van zijn eigen hart wandelt, zeggen zij: U zal geen kwaad overkomen.", "Ef 4:17-19": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed. Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart; Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.", "Hos 13:10": "Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?", "Job 22:24": "Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken;", "Jes 44:7": "En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.", "1 Tess 4:13": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben.", "Jer 12:5": "Als u loopt met de voetgangers, zo maken zij u moe; hoe zult u zich dan meten met de paarden? Als u alleen vertrouwt in een land van vrede, hoe zult u het dan maken in de verheffing van de Jordaan?", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Joh 14:1-3": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij. In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden. En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Jer 51:15": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;", "Jer 2:35": "Nog zegt u: Zeker, ik ben onschuldig; Zijn toorn is immers van mij afgekeerd. Zie, Ik zal met u rechten, omdat u zegt: Ik heb niet gezondigd.", "Spr 25:3": "Aan de hoogte van de hemel, en aan de diepte van de aarde, en aan het hart van koningen is geen doorgronding.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Pred 8:17": "toen zag ik al het werk van God, dat de mens niet kan doorgronden, het werk dat onder de zon gebeurt, waarnaar een mens zoekt met inspanning, maar hij zal het niet doorgronden; ja, zelfs al zou een wijze zeggen dat hij het zou kennen, dan nog zal hij het niet kunnen doorgronden.", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Job 36:27-33": "Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp; Die de wolken uitgieten, en over de mens overvloedig afdruipen. Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "1 Kor 6:3": "Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "2 Kron 12:14": "En hij deed wat kwaad was, omdat hij zijn hart er niet op richtte om de HEERE te zoeken.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Ex 23:26": "Er zal geen vrouw zijn die een miskraam heeft, of onvruchtbaar is, in uw land; Ik zal het getal van uw dagen vervullen.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "Job 22:21-30": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen. Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart. Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jes 42:6": "Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.", "Kol 1:26-28": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid; Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 92:7": "Een redeloos man weet er niet van, en een dwaas begrijpt dit niet;", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Ef 1:8": "Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "2 Kor 3:4": "En zo'n vertrouwen hebben wij door Christus bij God.", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Jes 66:5": "Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Jes 43:8": "Breng voort het blinde volk, dat ogen heeft, en de doven, die oren hebben.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Nahum 1:12": "Zo zegt de HEERE: Al zijn zij voorspoedig, en al zijn er nog zoveel, toch zullen zij afgesneden worden, en hij zal doorgaan. Ik heb u wel vernederd, maar Ik zal u niet meer vernederen.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Ps 97:3-5": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft. De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Jes 30:5": "Hij zal hen allen beschaamd maken door een volk dat hun geen nut kan doen, noch tot hulp, noch tot voordeel, maar tot schande en ook tot smaad zijn zal.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Deut 34:7": "Mozes nu was honderdtwintig jaar oud, toen hij stierf; zijn oog was niet dof geworden, en zijn kracht was niet vergaan.", "Deut 29:5": "En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Hand 7:34-36": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden. Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik. Deze heeft hen uitgeleid, en deed wonderen en tekenen in het land van Egypte, en in de Rode Zee, en in de woestijn, veertig jaar lang.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ps 92:6": "O HEERE! hoe groot zijn Uw werken! Zeer diep zijn Uw gedachten.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Hos 10:11": "Omdat Efraïm een vaars is, gewend om graag te dorsen, ben Ik over de schoonheid van haar hals heengegaan; Ik zal Efraïm laten rijden, Juda zal ploegen, Jakob zal voor zich eggen.", "Pred 8:6": "Want voor elk voornemen is er een tijd en een wijze, omdat het kwaad van de mens zwaar op hem drukt.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Ezech 18:27": "Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en recht en gerechtigheid doet, die zal zijn ziel in het leven behouden;", "Mark 10:27": "Maar Jezus keek hen aan, en zei: Bij de mensen is het onmogelijk, maar niet bij God; want bij God zijn alle dingen mogelijk.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Pred 6:3": "Als een man honderd kinderen verwekte, en veel jaren leefde, zodat de dagen van zijn jaren veel waren, maar zijn ziel niet verzadigd werd van het goede, en hij ook geen begrafenis had; ik zeg dat een misdracht beter is dan hij.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Mark 10:24": "En de discipelen waren verbaasd over deze woorden van Hem. Maar Jezus antwoordde weer en zei tegen hen: Kinderen, hoe moeilijk is het voor hen die op rijkdom vertrouwen, om het Koninkrijk van God binnen te gaan!", "Ps 69:4": "Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Job 15:2": "Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind?", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Ps 68:11": "Uw kudde woonde daarin; U bereidde het door Uw goedheid voor de ellendige, o God!", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "1 Kor 5:10": "Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan.", "Ef 3:5": "die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Hand 8:23": "Want ik zie dat u bent in een geheel bittere gal en in de samenknoping van ongerechtigheid.", "2 Kron 6:36": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen zult overleveren aan de vijand, zodat degenen die hen gevangen hebben, hen gevankelijk wegvoeren naar een land dat ver weg of nabij is;", "Ezech 37:23": "En zij zullen zich niet meer verontreinigen met hun drekgoden, en met hun afschuwelijkheden, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, waarin zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Dan 3:27": "Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.", "Joh 9:5": "Zolang Ik in de wereld ben, ben Ik het Licht van de wereld.", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "Ps 76:7": "Van Uw schelden, o God van Jakob! zijn samen wagen en paard in slaap gezonken.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Rom 5:6": "Want Christus is, toen wij nog krachteloos waren, op Zijn tijd voor de goddelozen gestorven.", "Hand 8:22": "Bekeer u dan van deze slechtheid van u, en bid tot God, of misschien deze overweging van uw hart u vergeven wordt.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Zach 14:6": "En het zal op die dag gebeuren, dat er geen kostelijk licht zal zijn, en ook geen dikke duisternis.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jer 21:13": "Zie, Ik zál tegen u, inwoonster van het dal, rots van het plein! spreekt de HEERE; u, die zegt: Wie zou tegen ons afkomen, of wie zou komen in onze woningen?", "Jes 17:13": "De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Spr 30:13": "Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Spr 21:22": "De wijze beklimt de stad van de geweldigen, en werpt de sterkte van hun vertrouwen neer.", "Ps 147:18": "Hij zendt Zijn woord, en doet ze smelten; Hij laat Zijn wind waaien, de wateren stromen weg.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "1 Kron 17:7": "Nu dan, zo zult u zeggen tegen Mijn knecht, tegen David: Zo zegt de HEERE van de heerscharen: Ik heb u van de schaapskooi genomen, van achter de schapen vandaan, opdat u een voorganger over Mijn volk Israël zou zijn;", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Luk 16:8": "En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Job 18:14": "Zijn vertrouwen zal uit zijn tent uitgerukt worden; dat zal hem doen treden tot de koning der verschrikkingen.", "Neh 9:10": "En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Ps 103:14": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Ps 68:10": "U hebt zeer milde regen doen druipen, o God! En U hebt Uw erfenis gesterkt, toen zij moe geworden was.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Spr 25:2": "Het is de eer van God om een zaak te verbergen; maar de eer van koningen om een zaak te doorgronden.", "Hos 12:9": "Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; in al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn.", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Job 34:7": "Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Ps 31:9": "En mij niet hebt overgeleverd in de hand van de vijand; U hebt mijn voeten doen staan in de ruimte.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Spr 3:25": "Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Pred 3:18": "Ik zei in mijn hart over de toestand van de mensenkinderen, dat God hen zal aantonen, en dat zij zullen zien, dat zij als de dieren zijn aan zichzelf.", "Jes 28:29": "Ook dit komt voort van de HEERE van de heerscharen; Hij is wonderlijk van raad, Hij is groot van daad.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Klaagl 3:1": "Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid.", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "Spr 30:2-4": "Voorwaar, ik ben onverstandiger dan wie ook; en ik heb geen mensenverstand; En ik heb geen wijsheid geleerd, en heb de wetenschap van de heiligen niet gekend. Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Spr 28:10": "Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Ps 104:10-19": "Die de bronnen laat stromen door de dalen, zodat zij tussen de bergen door lopen. Zij drenken al het gedierte van het veld; de wilde ezels lessen er hun dorst mee. Daarbij woont het gevogelte van de hemel, een geluid latend horen van tussen de takken.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt.", "Gen 6:5-7": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was. Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart. En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Job 37:5": "God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Job 37:15": "Weet u wanneer God daarover orde stelt, en het licht van Zijn wolk laat schijnen?", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Ps 136:5-25": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Ef 3:19": "en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Ps 119:168": "Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Matt 6:8": "Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Ps 124:1-8": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Luk 1:76-79": "En u, kind, zult een profeet van de Allerhoogste genoemd worden; want u zult voor het aangezicht van de Heere uit gaan, om Zijn wegen te bereiden; om Zijn volk kennis van het heil te geven, in vergeving van hun zonden, door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 3:23": "Want zij hebben allen gezondigd, en missen de heerlijkheid van God;", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Deut 7:13-24": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten; en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.", "Pred 3:13": "Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, dit is een gave van God.", "Job 26:9": "Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "Spr 31:7": "dat hij drinkt en zijn armoede vergeet, en aan zijn moeite niet meer denkt.", "Kol 3:7": "Daarin hebt ook u eertijds gewandeld, toen u daarin leefde.", "Job 27:8": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken?", "2 Kor 1:3-5": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting; Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden. Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Ef 5:8": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.", "Job 36:10": "En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Jer 11:11": "Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Amos 4:7-12": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Spr 15:24": "De weg van het leven gaat voor de verstandige omhoog, opdat hij afwijkt van het dodenrijk beneden.", "Deut 13:18": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God.", "Spr 22:3": "Een verstandig mens ziet het kwaad en verbergt zich; maar de eenvoudigen gaan door en worden gestraft.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Gen 21:17": "En God hoorde de stem van de jongen; en de Engel van God riep Hagar toe uit de hemel, en zei tegen haar: Wat is er met u, Hagar? Wees niet bang; want God heeft naar de stem van de jongen geluisterd, op de plaats waar hij is.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "2 Kron 30:6-9": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië. En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet. Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "Job 5:6-11": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Job 12:23": "Hij vermenigvuldigt de volken, en verdelgt ze; Hij breidt de volken uit, en leidt ze.", "Matt 11:27": "Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Job 28:25": "Toen Hij de wind het gewicht gaf, en de wateren afwoog in mate;", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 88:7": "U hebt mij in de onderste kuil gelegd, in duisternissen, in diepten.", "Job 11:1-6": "Toen antwoordde Zofar, de Naämathiet, en zei: Zou de veelheid van woorden niet beantwoord worden, en zou een klapachtig man gelijk hebben? Zouden uw leugens de mensen doen zwijgen, en zou u spotten, en zou niemand u beschamen?", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Job 28:20": "Die wijsheid dan, waar komt zij vandaan, en waar is de plaats van het verstand?", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Ps 37:23-29": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg. Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand. Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Matt 28:9": "En terwijl zij heengingen om het aan Zijn discipelen te vertellen, zie, Jezus ontmoette hen en zei: Wees gegroet! En zij kwamen naar Hem toe, grepen Zijn voeten, en aanbaden Hem.", "Matt 13:11": "En Hij antwoordde en zei tegen hen: Omdat het u gegeven is de verborgenheden van het Koninkrijk der hemelen te kennen, maar hun is het niet gegeven.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "Luk 5:30": "En hun Schriftgeleerden en de Farizeeën morden tegen Zijn discipelen en zeiden: Waarom eet en drinkt u met tollenaars en zondaars?", "Ps 108:5": "Want Uw goedertierenheid is groot tot boven de hemelen, en Uw waarheid tot aan de bovenste wolken.", "Joh 16:13": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Ps 128:2-6": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "2 Kor 1:7": "En onze hoop voor u is vast, omdat wij weten dat u, zoals u deel hebt aan het lijden, ook zo deel hebt aan de vertroosting.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Job 33:8": "Zeker, u hebt gezegd voor mijn oren, en ik heb de stem der woorden gehoord;", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Gen 9:1-3": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Ps 51:7": "Zie, ik ben in ongerechtigheid geboren, en in zonde heeft mijn moeder mij ontvangen.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Joh 10:27-29": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Jer 26:13": "Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "1 Tess 5:9-11": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven. Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Ps 78:52-55": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Hand 17:18": "En sommigen van de Epicureïsche en Stoïcijnse wijsgeren streden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "2 Kor 1:20-22": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons. Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God; Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Ex 32:34": "Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Spr 15:22": "Plannen worden tenietgedaan als er geen overleg is; maar door veel raadgevers komen ze tot stand.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Openb 12:6": "En de vrouw vluchtte naar de woestijn, waar zij een plaats had, door God voor haar bereid, opdat zij haar daar zouden voeden duizend tweehonderd zestig dagen.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Jes 65:3-5": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt; Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten. Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Spr 1:23": "Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Joh 1:11": "Hij is gekomen tot het Zijne, en de Zijnen hebben Hem niet aangenomen.", "2 Tim 2:26": "en zij weer mochten ontwaken uit de strik van de duivel, door wie zij gevangen waren om diens wil te doen.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ps 127:1-5": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs. Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap. Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Job 10:8": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij.", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "2 Kor 10:12": "Want wij durven o
