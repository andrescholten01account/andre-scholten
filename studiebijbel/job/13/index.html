is beter dan wie verkeerd is van wegen, al is hij rijk.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Job 34:5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Jes 59:13": "het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Jer 8:22": "Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Rom 14:14": "Ik weet en ben verzekerd in de Heere Jezus, dat niets onrein is op zichzelf; behalve voor hem die iets acht onrein te zijn, voor hem is het onrein.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Neh 1:6": "Laat toch Uw oor opmerkzaam, en Uw ogen open zijn, om te horen naar het gebed van Uw dienaar, dat ik vandaag voor Uw aangezicht bid, dag en nacht, voor de kinderen van Israël, Uw dienaren; en ik doe belijdenis over de zonden van de kinderen van Israël, die wij tegen U gezondigd hebben; ook ik en het huis van mijn vader, wij hebben gezondigd.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Luk 21:16": "En u zult overgeleverd worden, ook door ouders, en broers, en verwanten, en vrienden; en zij zullen sommigen van u doden.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "1 Sam 28:21": "De vrouw nu kwam bij Saul, en zag dat hij erg verbijsterd was; en zij zei tegen hem: Zie, uw dienstmaagd heeft naar uw stem geluisterd, en ik heb mijn leven in mijn hand gesteld, en ik heb uw woorden gehoord die u tegen mij gesproken hebt.", "Job 2:10": "Maar hij zei tegen haar: U spreekt zoals een van de dwaze vrouwen spreekt; zouden wij dan het goede van God ontvangen, en het kwade niet ontvangen? In dit alles zondigde Job niet met zijn lippen.", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Luk 6:31": "En zoals u wilt dat de mensen u doen, doe hun ook hetzelfde.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "Ps 143:9": "Red mij, HEERE, van mijn vijanden; bij U schuil ik.", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Ps 102:17": "Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,", "Job 17:2": "Zijn er niet bespotters bij mij, en overnacht mijn oog niet in hun verbittering?", "Job 42:8": "Daarom neemt nu voor u zeven jonge stieren en zeven rammen, en gaat heen naar Mijn knecht Job, en offert een brandoffer voor u, en laat Mijn knecht Job voor u bidden; want zeker, Ik zal zijn aangezicht aannemen, opdat Ik aan u niet doe naar uw dwaasheid; want u hebt niet recht van Mij gesproken, zoals Mijn knecht Job.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Dan 9:5-7": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten. En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land. Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Ps 144:3": "O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Job 18:5": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren.", "Ps 77:11-13": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "Job 33:32": "Als er redenen zijn, antwoord mij; spreek, want ik heb lust u te rechtvaardigen.", "Spr 18:7": "De mond van de dwaas is voor hemzelf een verstoring, en zijn lippen zijn een strik voor zijn ziel.", "Job 36:14": "Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Job 18:2-4": "Hoe lang duurt het nog voordat u een einde maakt aan uw woorden? Let op, en daarna zullen wij spreken. Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen? O u, die uw ziel verscheurt door uw toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots weggenomen worden uit haar plaats?", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Ezech 14:7": "Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Job 14:3": "Toch houdt U Uw ogen op zo iemand gericht, en U betrekt mij in het gericht met U.", "Ps 32:7": "U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.", "Job 23:3-7": "Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen. Ik zou de woorden weten die Hij mij antwoorden zou, en verstaan wat Hij mij zeggen zou.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Ex 20:18": "En al het volk zag de donderslagen, en de bliksemflitsen, en het geluid van de bazuin, en de rokende berg; toen het volk dit zag, weken zij terug en bleven op een afstand staan;", "Matt 23:2-33": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes; daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet. Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "Ps 73:22": "Toen was ik redeloos, en wist niets; ik was een groot dier bij U.", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "Pred 5:5": "Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "Job 40:2": "Gord nu als een man uw lenden; Ik zal u vragen, en onderricht Mij.", "Ezra 9:10": "En nu, wat zullen wij zeggen, o onze God, na dit alles? Want wij hebben Uw geboden verlaten,", "Job 10:6": "Dat U onderzoekt naar mijn ongerechtigheid, en naar mijn zonde speurt?", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "2 Sam 24:17": "En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Ps 109:15": "Laat ze voortdurend voor de HEERE zijn; en Hij roeit hun gedachtenis uit van de aarde.", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Matt 22:18": "Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef?", "Jer 46:11": "Ga heen op naar Gilead, en haal balsem, jonkvrouw, dochter van Egypte! Tevergeefs vermenigvuldigt u de medicijnen, er is geen genezing voor u.", "Jes 9:19": "Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten;", "Job 10:2-7": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "Spr 2:5": "Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "Ps 73:21": "Toen mijn hart verbitterd was, en ik in mijn nieren geprikkeld werd,", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Job 35:7": "Als u rechtvaardig bent, wat geeft u Hem, of wat ontvangt Hij uit uw hand?", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Ps 41:5": "Ik zei: O HEERE! wees mij genadig; genees mijn ziel, want ik heb tegen U gezondigd.", "Num 16:3": "En zij verzamelden zich tegen Mozes en tegen Aäron, en zeiden tegen hen: Het is te veel voor u, want deze hele vergadering, zij allen, zijn heilig, en de HEERE is in hun midden; waarom verheft u zich dan boven de gemeente van de HEERE?", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "Jona 3:10": "En God zag hun werken, dat zij zich bekeerden van hun boze weg; en het berouwde God over het kwaad, dat Hij gesproken had hun te zullen doen, en Hij deed het niet.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Job 35:2": "Houdt u dat voor recht, dat u gezegd hebt: Mijn gerechtigheid is meer dan die van God?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Ex 21:15": "Wie zijn vader of zijn moeder slaat, die zal zeker gedood worden.", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Job 16:3": "Zal er een einde zijn aan de winderige woorden? Of wat drijft u ertoe om zo te antwoorden?", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Jes 50:9": "Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Hos 8:2": "Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Ps 145:5": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Job 16:21": "Och, mocht men rechtspreken voor een man bij God, zoals een kind van een mens voor zijn vriend.", "Matt 9:10-13": "En het gebeurde, toen Hij aan tafel lag in het huis van Mattheüs, zie, veel tollenaars en zondaars kwamen en gingen mee aan tafel, met Jezus en Zijn discipelen. En de Farizeeën zagen dit en zeiden tegen Zijn discipelen: Waarom eet uw Meester met de tollenaars en de zondaars? Maar Jezus hoorde dat en zei tegen hen: Wie gezond zijn hebben de dokter niet nodig, maar wie ziek zijn.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Jes 3:5": "En het volk zal gedrongen worden, de een zal zijn tegen de ander, en ieder tegen zijn naaste; de jongeling zal zich brutaal gedragen tegen de oude, de verachte tegen de eerlijke.", "Job 15:18": "Wat de wijzen verkondigd hebben, en men voor hun vaderen niet verborgen heeft;", "Ps 19:2-5": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen. De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "Ps 19:13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgen afdwalingen.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Jer 3:11": "Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Job 19:18": "Ook versmaden de jonge kinderen mij; sta ik op, dan spreken zij mij tegen.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "Luk 12:10": "En ieder die een woord spreken zal tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest gelasterd zal hebben, die zal het niet vergeven worden.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Openb 12:18": "En ik stond op het zand van de zee.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Ezech 1:26-28": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend. En ik zag iets als de kleur van amber, als de gedaante van vuur rondom daarbinnen, vanaf de gedaante van Zijn lendenen en opwaarts; en vanaf de gedaante van Zijn lendenen en neerwaarts, zag ik iets als de gedaante van vuur, en een glans rondom Hem. Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.", "Ps 139:12": "Ook verduistert de duisternis voor U niet; maar de nacht licht als de dag; de duisternis is als het licht.", "Joh 9:39-41": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden. En dit hoorden enkelen van de Farizeeën die bij Hem waren, en zij zeiden tegen Hem: Zijn wij dan ook blind? Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Mark 7:6-8": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij. Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen; Want u laat het gebod van God los, en houdt vast aan de overleveringen van mensen, namelijk het wassen van kannen en drinkbekers; en vele andere dergelijke dingen doet u.", "Job 31:31-37": "Als de lieden van mijn tent niet hebben gezegd: Och, hadden wij van zijn vlees maar, wij zouden niet verzadigd worden; De vreemdeling overnachtte niet op de straat; mijn deuren opende ik naar de weg; Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Spr 26:9": "Zoals een doorn omhooggaat in de hand van een dronkaard, zo is een spreuk in de mond van de dwazen.", "Luk 14:35": "Het is niet meer geschikt voor het land, en ook niet voor de mesthoop; men gooit het weg. Wie oren heeft om te horen, laat hij horen.", "Jer 18:19": "HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Job 31:6": "Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten.", "Jer 31:19": "Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb.", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Ps 40:14": "Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.", "Ps 102:23": "Wanneer de volken samen zullen vergaderd worden, ook de koninkrijken, om de HEERE te dienen.", "Spr 15:14": "Een verstandig hart zoekt de wetenschap; maar de mond van de zotten voedt zich met dwaasheid.", "Ps 96:6": "Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en sieraad in Zijn heiligdom.", "Jes 39:8": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE dat u gesproken hebt, is goed. Ook zei hij: Er zal immers vrede en waarheid zijn in mijn dagen!", "Job 6:21": "Voorwaar, zo bent u mij nu niets geworden; u hebt de ontzetting gezien, en u hebt gevreesd.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Matt 25:3": "Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Spr 16:11": "Een eerlijke weegschaal en balans zijn van de HEERE; alle gewichten in de zak zijn Zijn werk.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Hos 8:13": "Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.", "Matt 7:5": "Huichelaar! Haal eerst de balk uit uw eigen oog, en dan zult u goed genoeg zien om de splinter uit het oog van uw broeder te halen.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Ps 6:2-8": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Jer 10:19": "O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Ex 34:5": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "Job 29:2": "Och, was ik maar zoals in de vorige maanden, zoals in de dagen toen God mij bewaarde!", "Job 11:4-6": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen. Maar zeker, och, of God sprak, en Zijn lippen tegen u opende; En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Jak 1:22-24": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "Matt 26:44": "En Hij liet hen achter, ging opnieuw weg, en bad voor de derde keer, met dezelfde woorden.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Ps 5:3": "Let op de stem van mijn geroep, o mijn Koning en mijn God! Want tot U zal ik bidden.", "Ps 25:16-19": "Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Ps 106:6": "Wij hebben gezondigd, alsook onze vaderen, wij hebben verkeerd gedaan; wij hebben goddeloos gehandeld.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "Richt 12:3": "Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Job 8:4": "Als uw kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding.", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Hos 6:1": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden.", "Job 35:5-7": "Kijk naar de hemel en zie; en aanschouw de bovenste wolken, zij zijn hoger dan u. Als u zondigt, wat doet u Hem daarmee aan? Als uw overtredingen talrijk zijn, wat doet u Hem daarmee? Als u rechtvaardig bent, wat geeft u Hem, of wat ontvangt Hij uit uw hand?", "Ps 7:8": "Zo zal de vergadering van de volken U omringen; keer dan boven haar terug in de hoogte.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Gen 47:9": "En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Pred 11:10": "Doe dan de toorn wijken uit uw hart, en doe het kwade weg van uw lichaam, want de jeugd en de jonge jaren zijn vergankelijk.", "Jes 48:11": "Om Mijnentwil, om Mijnentwil zal Ik het doen, want hoe zou Hij ontheiligd worden? En Ik zal Mijn eer aan geen ander geven.", "Ezech 3:23": "En ik maakte mij op, en ging uit naar de vallei, en zie, de heerlijkheid van de HEERE stond daar, gelijk de heerlijkheid, die ik gezien had bij de rivier Chebar; en ik viel op mijn gezicht.", "Mark 2:17": "En Jezus hoorde dat, en zei tegen hen: Wie gezond zijn, hebben de dokter niet nodig, maar wie ziek zijn. Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars tot bekering.", "Job 10:1": "Mijn ziel is de dood moe, wat mijn leven betreft; ik zal mijn klacht over mijzelf de vrije loop laten; ik zal spreken in de bitterheid van mijn ziel.", "Amos 5:21-27": "Ik haat, Ik verafschuw uw feesten, en Ik kan uw verbodsdagen niet rieken. Want al offert u Mij brandoffers, alsook uw spijsoffers, Ik heb er toch geen welgevallen aan; en het dankoffer van uw vette beesten wil Ik niet aanzien. Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "Job 9:32": "Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "Neh 1:7": "Wij hebben het helemaal tegen U verdorven; en wij hebben niet gehouden de geboden, noch de inzettingen, noch de rechten, die U Uw dienaar Mozes geboden hebt.", "Spr 18:13": "Wie antwoord geeft eer hij geluisterd heeft, dat is hem dwaasheid en schande.", "Job 5:9-16": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan; Die de regen geeft op de aarde, en water zendt op de straten; Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Jer 6:20": "Waartoe zal dan de wierook voor Mij uit Scheba komen, en de beste kalmus uit ver land? Uw brandoffers zijn Mij niet behagelijk, en uw slachtoffers zijn Mij niet zoet.", "Job 27:13-18": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Job 36:8": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende;", "Pred 5:6": "Want zoals in de veelheid van dromen nietige dingen zijn, zo ook in veel woorden; maar vrees ú God!", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Job 19:22": "Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Jer 42:20-22": "Zeker, u hebt uzelf misleid; want u hebt mij tot de HEERE, uw God, gezonden, en gezegd: Bid voor ons tot de HEERE, onze God, en maak ons alles bekend wat de HEERE, onze God, zal zeggen, en wij zullen het doen. Nu heb ik het u heden bekendgemaakt; maar u hebt niet geluisterd naar de stem van de HEERE, van uw God, noch naar al hetgeen waarmee Hij mij tot u gezonden heeft. Zo weet nu zeker, dat u door het zwaard, door de honger en door de pestilentie zult sterven, op de plaats waar u naartoe wilde gaan om daar als vreemdelingen te wonen.", "Ezech 35:12": "En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "2 Tess 3:15": "En houd hem niet als een vijand, maar vermaan hem als een broeder.", "Openb 6:15": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen;", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Job 15:17": "Ik zal u wijzen, hoor mij aan, en wat ik gezien heb, dat zal ik vertellen;", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "2 Petr 2:17": "Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Spr 26:24-26": "Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart. Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Spr 2:2": "Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt;", "Neh 6:14": "Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Job 27:5": "Het zij verre van mij, dat ik u rechtvaardigen zou; totdat ik de geest zal gegeven hebben, zal ik mijn oprechtheid niet van mij wegdoen.", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Ex 33:18-20": "Toen zei hij: Toon mij nu Uw heerlijkheid! Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal. Hij zei verder: U zou Mijn aangezicht niet kunnen zien; want Mij zal geen mens zien en leven.", "Ex 21:17": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Jak 5:2": "Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten.", "Ps 144:7": "Steek Uw handen van boven uit; bevrijd mij, en red mij uit het vele water, uit de hand van vreemden;", "2 Kor 5:12": "Want wij prijzen onszelf bij u niet opnieuw aan, maar wij geven u aanleiding om over ons te roemen, opdat u iets zou hebben tegen hen die roemen op het uiterlijk en niet op het hart.", "Deut 9:4-6": "Wanneer de HEERE, uw God, hen nu voor uw aangezicht zal hebben uitgestoten, spreek dan niet in uw hart en zeg: De HEERE heeft mij om mijn gerechtigheid ingebracht, om dit land te erven; want om de goddeloosheid van deze volken verdrijft de HEERE hen voor uw aangezicht uit de bezitting. Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft. Weet dan, dat de HEERE, uw God, u niet om uw gerechtigheid dit goede land geeft om dat te erven; want u bent een hardnekkig volk.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "Ps 96:3": "Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Ex 40:35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Matt 16:3": "en 's morgens: Vandaag onweer; want de hemel is somber rood. Huichelaars! Het uiterlijk van de hemel weet u wel te onderscheiden, maar kunt u de tekenen van de tijden niet onderscheiden?", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Spr 12:19": "Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Mal 2:6": "De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Job 16:9": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "2 Petr 3:3": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen,", "Ps 20:2": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Ps 69:2-37": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Ps 8:10": "O HEERE, onze Heere! Hoe heerlijk is Uw Naam op de hele aarde!", "Rom 2:17-20": "Zie, u wordt een Jood genoemd en rust op de wet, en roemt in God, En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet; En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Job 35:8": "Uw goddeloosheid zou een man treffen, gelijk u bent, en uw gerechtigheid een mensenkind ten goede komen.", "Jak 2:7": "Lasteren zij niet de goede naam die over u aangeroepen is?", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Jes 65:5": "Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "2 Sam 22:21": "De HEERE vergold mij naar mijn gerechtigheid; Hij gaf mij weer naar de reinheid van mijn handen.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Job 15:34": "Want de vergadering van de huichelaars wordt eenzaam, en het vuur verteert de tenten van de geschenken.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Ps 44:21": "Als wij de Naam van onze God hadden vergeten, en onze handen tot een vreemde god uitgebreid,", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "1 Petr 4:12": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam;", "Job 42:5": "Met het gehoor van het oor heb ik U gehoord; maar nu ziet mijn oog U.", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Ezra 9:4": "Toen verzamelden zich bij mij allen die voor de woorden van de God van Israël beefden, om de overtreding van de weggevoerden; maar ik bleef verbaasd zitten tot aan het avondoffer.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Spr 30:7-9": "Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf; Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is; Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Spr 15:2": "De tong van de wijzen maakt de wetenschap goed; maar de mond van de zotten stort overvloedig dwaasheid uit.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Job 21:27-34": "Zie, ik ken uw gedachten, en de boze plannen, waarmee u tegen mij geweld doet. Want u zult zeggen: Waar is het huis van de vorst, en waar is de tent van de woningen der goddelozen? Hebt u niet gevraagd aan de voorbijgaande op de weg, en kent u hun tekenen niet?", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H2005\">Ziet</span>, dit <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">alles</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">heeft</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5869\">mijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5869\">oog</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7200\">gezien</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H7200\">mijn</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H241\">oor</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8085\">gehoord</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H995\">en</span> <span class=\"wl\" data-l=\ /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
