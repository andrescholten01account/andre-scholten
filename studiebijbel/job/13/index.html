t leugensmeders; u bent allemaal artsen van niets.","5":"Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen.","6":"Hoor toch mijn verdediging, en let op de twistingen van mijn lippen.","7":"Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken?","8":"Zult u Zijn aangezicht aannemen? Zult u voor God twisten?","9":"Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?","10":"Hij zal u zeker bestraffen, als u in het verborgene het aangezicht aanneemt.","11":"Zal Zijn hoogheid u niet verschrikken, en Zijn schrik over u vallen?","12":"Uw spreuken zijn als as, uw verweer is als een verweer van leem.","13":"Houd u stil van mij, opdat ik spreek, en laat over mij komen wat het ook zij.","14":"Waarom zou ik mijn vlees in mijn tanden nemen, en mijn ziel in mijn hand stellen?","15":"Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.","16":"Ook zal Hij mij tot heil zijn; maar een huichelaar zal voor Zijn aangezicht niet komen.","17":"Hoor aandachtig mijn woord, en mijn uitleg met uw oren.","18":"Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.","19":"Wie is hij die met mij twist? Want als ik nu zweeg, zou ik de geest geven.","20":"Doe alleen deze twee dingen niet met mij; dan zal ik mij niet van Uw aangezicht verbergen.","21":"Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.","22":"Roep dan, en ik zal antwoorden; of ik zal spreken, en geef mij antwoord.","23":"Hoeveel misdaden en zonden heb ik? Maak mij mijn overtreding en mijn zonden bekend.","24":"Waarom verbergt U Uw aangezicht, en houdt U mij voor Uw vijand?","25":"Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen?","26":"Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven.","27":"U legt ook mijn voeten in het blok, en let op al mijn paden; U drukt Uzelf in de hielen van mijn voeten,","28":"En hij vergaat als een verrotting, als een kleed dat de mot opeet."},"SV":{"1":"Ziet, *dat* alles heeft mijn oog gezien, mijn oor gehoord en verstaan.","2":"Gelijk gijlieden *het* weet, weet ik het ook; ik zwicht niet voor u.","3":"Maar ik zal tot den Almachtige spreken, en ben belust *mij* te verdedigen voor God.","4":"Want gewisselijk, gij zijt leugenstoffeerders; gij allen zijt nietige medicijnmeesters.","5":"Och, of gij gans stilzweegt! Dat zou ulieden voor wijsheid wezen.","6":"Hoort toch mijn verdediging, en merkt op de twistingen mijner lippen.","7":"Zult gij voor God onrecht spreken, en zult gij voor Hem bedriegerij spreken?","8":"Zult gij Zijn aangezicht aannemen? Zult gij voor God twisten?","9":"Zal het goed zijn, als Hij u zal onderzoeken? Zult gij met Hem spotten, gelijk men met een mens spot?","10":"Hij zal u gewisselijk bestraffen, zo gij in het verborgene het aangezicht aanneemt.","11":"Zal u niet Zijn hoogheid verschrikken, en Zijn vreze over u vallen?","12":"Uw gedachtenissen zijn gelijk as, uw hoogten als hoogten van leem.","13":"Houdt stil van mij, opdat ik spreke, en er ga over mij, wat *het zij*.","14":"Waarom zou ik mijn vlees in mijn tanden nemen, en mijn ziel in mijn hand stellen?","15":"Ziet, *zo* Hij mij doodde, zou ik niet hopen? Evenwel zal ik mijn wegen voor Zijn aangezicht verdedigen.","16":"Ook zal Hij mij tot zaligheid zijn; maar een huichelaar zal voor Zijn aangezicht niet komen.","17":"Hoort naarstiglijk mijn rede, en mijn aanwijzing met uw oren.","18":"Ziet nu, ik heb het recht ordentelijk gesteld; ik weet, dat ik rechtvaardig zal verklaard worden.","19":"Wie is hij, die met mij twist? Wanneer ik nu zweeg, zo zou ik den geest geven.","20":"Alleenlijk doe twee dingen niet met mij; dan zal ik mij van Uw aangezicht niet verbergen.","21":"Doe Uw hand verre van op mij, en Uw verschrikking make mij niet verbaasd.","22":"Roep dan, en ik zal antwoorden; of ik zal spreken, en geef mij antwoord.","23":" d be your wisdom.","6":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> now my <span class=\"wl wl-kjv\" data-code=\"H8433\">reasoning,</span> and <span class=\"wl wl-kjv\" data-code=\"H7181\">hearken</span> to the <span class=\"wl wl-kjv\" data-code=\"H7379\">pleadings</span> of my lips.","7":"Will ye <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">wickedly</span> for <span class=\"wl wl-kjv\" data-code=\"H410\">God?</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">talk</span> deceitfully","8":"Will ye <span class=\"wl wl-kjv\" data-code=\"H5375\">accept</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">person?</span> will ye <span class=\"wl wl-kjv\" data-code=\"H7378\">contend</span> for God?","9":"Is it <span class=\"wl wl-kjv\" data-code=\"H2895\">good</span> that he should search you <span class=\"wl wl-kjv\" data-code=\"H2713\">out?</span> or as one <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2048\">mocketh</span> another, do ye so mock","10":"He will <span class=\"wl wl-kjv\" data-code=\"H3198\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H3198\">reprove</span> you, if ye do <span class=\"wl wl-kjv\" data-code=\"H5643\">secretly</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">accept</span> persons.","11":"Shall not his <span class=\"wl wl-kjv\" data-code=\"H7613\">excellency</span> make you <span class=\"wl wl-kjv\" data-code=\"H1204\">afraid?</span> and his <span class=\"wl wl-kjv\" data-code=\"H6343\">dread</span> fall","12":"Your <span class=\"wl wl-kjv\" data-code=\"H2146\">remembrances</span> are <span class=\"wl wl-kjv\" data-code=\"H4912\">like</span> unto <span class=\"wl wl-kjv\" data-code=\"H665\">ashes,</span> your <span class=\"wl wl-kjv\" data-code=\"H1354\">bodies</span> to <span class=\"wl wl-kjv\" data-code=\"H1354\">bodies</span> of clay.","13":"Hold your <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> let me alone, that I may <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> and let come","14":"Wherefore do I <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in my <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> in mine hand?","15":"<span class=\"wl wl-kjv\" data-code=\"H2005\">Though</span> he <span class=\"wl wl-kjv\" data-code=\"H6991\">slay</span> me, yet will I <span class=\"wl wl-kjv\" data-code=\"H3176\">trust</span> in him: but I will <span class=\"wl wl-kjv\" data-code=\"H3198\">maintain</span> mine own <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> before","16":"He also shall be my <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation:</span> for an <span class=\"wl wl-kjv\" data-code=\"H2611\">hypocrite</span> shall not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> before","17":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">diligently</span> my <span class=\"wl wl-kjv\" data-code=\"H4405\">speech,</span> and my <span class=\"wl wl-kjv\" data-code=\"H262\">declaration</span> with your ears.","18":"Behold now, I have <span class=\"wl wl-kjv\" data-code=\"H6186\">ordered</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">cause;</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I shall be justified.","19":"Who is he that will <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> with me? for now, if I hold my <span class=\"wl wl-kjv\" data-code=\"H2790\">tongue,</span> I shall give up the ghost.","20":"Only <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> things unto me: then will I not <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> myself from thee.","21":"<span class=\"wl wl-kjv\" data-code=\"H7368\">Withdraw</span> thine <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me: and let not thy <span class=\"wl wl-kjv\" data-code=\"H367\">dread</span> make me afraid.","22":"Then <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> thou, and I will <span class=\"wl wl-kjv\" data-code=\"H6030\">answer:</span> or let me <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> and answer","23":"How many are mine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities</span> and <span class=\"wl wl-kjv\" data-code=\"H2403\">sins?</span> make me to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> my <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression</span> and my sin.","24":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H5641\">hidest</span> thou thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H2803\">holdest</span> me for thine enemy?","25":"Wilt thou <span class=\"wl wl-kjv\" data-code=\"H6206\">break</span> a <span class=\"wl wl-kjv\" data-code=\"H5929\">leaf</span> driven to and <span class=\"wl wl-kjv\" data-code=\"H5086\">fro?</span> and wilt thou <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> the <span class=\"wl wl-kjv\" data-code=\"H3002\">dry</span> stubble?","26":"For thou <span class=\"wl wl-kjv\" data-code=\"H3789\">writest</span> bitter <span class=\"wl wl-kjv\" data-code=\"H4846\">things</span> against me, and makest me to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities</span> of my youth.","27":"Thou <span class=\"wl wl-kjv\" data-code=\"H7760\">puttest</span> my <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> also in the <span class=\"wl wl-kjv\" data-code=\"H5465\">stocks,</span> and lookest <span class=\"wl wl-kjv\" data-code=\"H8104\">narrowly</span> unto all my <span class=\"wl wl-kjv\" data-code=\"H734\">paths;</span> thou settest a <span class=\"wl wl-kjv\" data-code=\"H2707\">print</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8328\">heels</span> of my feet.","28":"And he, as a rotten <span class=\"wl wl-kjv\" data-code=\"H7538\">thing,</span> <span class=\"wl wl-kjv\" data-code=\"H1086\">consumeth,</span> as a <span class=\"wl wl-kjv\" data-code=\"H899\">garment</span> that is <span class=\"wl wl-kjv\" data-code=\"H6211\">moth</span> eaten."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dat","tekst":"Te weten, dat ik van de wijze en machtige regering Gods nu verhaald, en hier tevoren geleerd heb, niet alleen uit de algemene ervarenheid, maar inzonderheid uit de openbaring en onderwijzing des Heeren."},{"catchword":"verstaan","tekst":"Hebreeuws, voor zich verstaan, naar den aard der Hebreeuwse taal."}],"2":[{"catchword":"ik zwicht niet","tekst":"Hebreeuws, ik val niet voor u. Zie boven, Job 12:3 , en de aantekening."}],"3":[{"catchword":"en ben belust","tekst":"Hiermede ziet hij op hetgeen dat Zofar gezegd had, boven, Job 11:5 . Hij wil zeggen dat hij liever met God zou handelen dan met deze zijne vrienden. Want God, op Jobs conscientie ziende, zou hem beter verstaan dan dezen, die hem als een huichelaar achtende, het recht Gods met kwade redenen verdedigden."}],"4":[{"catchword":"leugenstoffeerders;","tekst":"Dat is, gij verzint leugens [gelijk Psa 119:69 ] , omdat gij met leugens Gods recht wilt voorstaan, drijvende dat God de bozen alleen, en niet de vromen straft, en dat ik daarom boos moet zijn, omdat ik dus gestraft word, en dat Hij niet rechtvaardig zou zijn, indien Hij mij, vroom zijnde, aldus strafte."},{"catchword":"nietige","tekst":"Dat is, onbekwame troosters, die inplaats van mij te verkwikken met Gods beloften, die voor de vromen zijn, mij voorhouden de strenge oordelen Gods en de rechtvaardige straffen, die tegen de goddelozen gaan."}],"5":[{"catchword":"Och,","tekst":"Hebreeuws, wie zal geven dat gij, enz. Zie van deze manier van wensen, boven, Job 6:8 ."},{"catchword":"gans stilzweegt","tekst":"Hebreeuws, zwijgende zweegt."},{"catchword":"voor wijsheid wezen","tekst":"Dat is, voor wijsheid gerekend worden; Pro 17:28 ."}],"6":[{"catchword":"verdediging,","tekst":"Het Hebreeuwse woord betekent eigenlijk bestraffing, of berisping. Versta hier, de verdediging, die hij op hun voorgestelde redenen in te brengen had. Zo is het woord genomen onder, Job 23:4 ."},{"catchword":"twistingen","tekst":"Dat is, de verhandeling mijner tegenreden, waarmede ik mijne zaak tegen u wil verdedigen."}],"7":[{"catchword":"voor God","tekst":"Dat is, ten gevalle van God, of tot zijne bescherming; alzo in het volgende. Job beschuldigt hen, omdat zij de gerechtigheid Gods wilden voorstaan, mits hem voor een goddelozen schijnheilige en huichelaar te scheiden. Want zij wilden niet verstaan, dat in dit leven de straffen Gods gewoonlijk zo wel vallen over de goeden als over de kwaden. Zie boven, Job 5:3 , enz., en Job 8:11 , enz., en Job 11:13 , Job 11:20 ."},{"catchword":"onrecht spreken,","tekst":"Hetwelk was, dat God ongerechtiglijk zou handelen, zo Hij de vromen strafte, even alsof God daartoe geen recht, noch vrijheid had."}],"8":[{"catchword":"aangezicht","tekst":"Dat is, zijn persoon aanzien om zijne hoogheid en mogendheid, zonder op de zaak zelve naar behoren wel te letten. Hij wil zeggen dat God zo niet behoorde verdedigd te worden. Alzo onder, vs.10. Zie Lev 19:15 ."},{"catchword":"voor God twisten?","tekst":"Te weten, op zulke wijze, gelijk gij doet. De zin is, dat zij niet behoefden voor God enige moeite te doen, om zijne gerechtigheid voor te spreken, dewijl Hij zelf genoegzaam was om zich te verdedigen."}],"9":[{"catchword":"Zal het goed zijn,","tekst":"Dat is, zal het eerlijk en voordelig zijn voor u? Hij wil zeggen: Neen, maar veel meer verenigd met schande en schade. Het is ene vraag, die sterkelijk loochent. Zie Gen 18:17 ."},{"catchword":"u zal onderzoeken?","tekst":"Dat is, uwe harten en verstanden, die in dezen handel van hem niet recht gevoelen, naarstiglijk ondertasten; want gij oordeelt dat Hij onrechtvaardig zou zijn, indien Hij de vromen strafte."},{"catchword":"Zult gij met Hem spotten,","tekst":"Dat is, zult gij Hem bedriegelijk en met leugens wijsmaken dat Hij rechtvaardig is, omdat Hij de goddelozen alleen [gelijk gij gevoelt] straft, en dat ik goddeloos ben, omdat ik van Hem gestraft word?"}],"10":[{"catchword":"gewisselijk bestraffen","tekst":"Hebreeuws, bestraffende, bestraffen; dat is, Hij zal u zekerlijk van huichelarij en geveinsde heiligheid overtuigen."},{"catchword":"In het verborgene","tekst":"Dat is, bedektelijk en lozelijk. Want uiterlijk houdt gij u, dat gij de gerechtigheid Gods verdedigt, tegen mij, die nochtans mijner oprechtheid wel bewust ben, en die u niet onbekend behoort te wezen."},{"catchword":"Het aangezicht","tekst":"Zie boven, vs.8."}],"11":[{"catchword":"hoogheid","tekst":"Dat is, de grootheid en voortreffelijkheid zijner majesteit."},{"catchword":"vreze","tekst":"Te weten, waarmede God de mensen bevreesd maakt, of de mensen God vrezen moeten."}],"12":[{"catchword":"Uw gedachtenissen","tekst":"Dat is, al wat men u heerlijks bedenken mag, als uw staat, macht, naam, leven."},{"catchword":"gelijk as,","tekst":"Hebreeuws, gelijkenissen van as. De zin is: Wat in u groots en voortreffelijks zou mogen wezen, is in vergelijking met God niets dan as, die lichtelijk verwaait of vervliegt, en als eenhoop leem, die van kleine waarde is; hoe ontziet gij dan God niet? En zou Hij uw onnutte, krachteloze en onbillijke voorspraak behoeven?"},{"catchword":"hoogten als hoogten","tekst":"Anders, uwe ruggen; dat is, lichamen, als de lichamen van leem; datis, tezamen van een aarden en slijkerige stof; hoe zoudt gij dan u voor God niet ontzetten?"}],"13":[{"catchword":"Houdt stil","tekst":"Anders, zwijgt [en houdt op] van mij; dat is, houdt uwen mond toe en laat mij met vrede. Dezelfde manier van spreken is 1Sa 7:8 ; Psa 28:1 ; Jer 38:27 ."},{"catchword":"er ga","tekst":"Dat is, kome wat komen mag over mij; ik moet spreken; op mijn eigen gevaar wil ik doen wat ik doe; want ik hoop dat God tegen mij redelijker zal zijn dan gij zijt; ja ofschoon God mij nog zwaarder strafte, zo kan ik nochtans niet nalaten miji te verdedigen, om te bewijzen dat ik niet goddeloos ben. Zie een gelijke manier van spreken 2Sa 18:23 ."}],"14":[{"catchword":"Waarom","tekst":"Hij wil zeggen: Zo God de goddelozen alleen straft, hoe komt het dan dat Hij mij straft, die niet goddeloos ben, ja zo straft, dat ik mijn huid en vlees, dat door de verzwering gans geschonden en verbroken is, met mijn tanden bij stukken zou kunnen afrukken; of zo straft, dat ik gelijk de razende mensen mijn eigen ledematen door wanhoop en vertwijfeling zou kunnen beschadigen, en alzo mijn ziel in het uiterste gevaar stellen; of, zou ik mijn vlees in mijn tanden nemen? dat is, ik zou mijzelven als verscheuren en ellendiglijk sterven, indien ik zou moeten zwijgen; vergelijk vs.13, 19."},{"catchword":"mijn ziel","tekst":"Dat is, duizend gevaren begeven. Zie deze manier van spreken Jdg 12:3 , en in de aantekening."}],"15":[{"catchword":"Ziet,","tekst":"Of, ziet, dat Hij mij doodde; te weten, God. De zin is: Het is zover vandaar, dat ik zou wanhopen, dat ik niet wil laten op God te vertrouwen, ofschoon Hij mij in dit verdriet uit het leven wegrukte. Anders, zo Hij mij doodt, ik zal op Hem hopen. De zin is enerlei."},{"catchword":"Evenwel","tekst":"Dat is, hoewel ik weet dat God mijn toeverlaat altijd blijven zal in leven en in sterven, nochtans kan ik niet nalaten het recht mijner zaak tegen het gevoelen dezer vrienden te verweren."}],"16":[{"catchword":"Hij mij","tekst":"Te weten, God."},{"catchword":"huichelaar","tekst":"Te weten, waarvoor gij mij houdt, hoewel ten onrechte, gelijk God mijn hart kent en mij mijn conscientie getuigt; vergelijk boven, Job 8:13 , en de aantekening."}],"17":[{"catchword":"Hoort","tekst":"Hebreeuws, horende hoort."}],"18":[{"catchword":"het recht","tekst":"Te weten, mijn recht. Versta, het geschil en de rechtzaak, waarin hij verklaarde, dat hij zodanig niet was als hij wel van zijn vrienden afgemaald werd."},{"catchword":"zal verklaard worden","tekst":"Te weten, bij God in dit geschil, hetwelk ik heb tegen mijn vrienden."}],"19":[{"catchword":"Wanneer","tekst":"Dat is, indien ik nu, als ik zo schandelijk afgeschilderd ben, niet mocht ijveren in het verdedigen van mijn onnozelheid, ik zou van droefenis en benauwdheid sterven."},{"catchword":"den geest geven","tekst":"Of allengskens afnemen, en eindelijk door den dood tenonder gaan."}],"20":[{"catchword":"dingen","tekst":"Te weten, welke in vs.21 verhaald worden; waarvan het ene is, dat Hij hem met de plaag, die hij nu had, niet geduriglijk drukken zou; het andere, dat Hij hem niet steeds verschrikken zou met zijne majesteit, als voor welke hij niet kon bestaan, om zijn recht te verhandelen. Deze twee dingen heeft hij ook tevoren verhaald, Job 9:34 . Zij worden ook vermeld van Elihu, onder, Job 33:7 ."},{"catchword":"dan zal ik","tekst":"Dat is, ik zal mij voor U niet versteken of zoek maken, maar zal mij vrijmoediglijk vertonen om mijn recht te verdedigen."}],"21":[{"catchword":"hand","tekst":"Dat is, straf, plaag. Alzo Jdg 2:15 ; Rth 1:13 ; 1Sa 5:6-7 , 1Sa 5:11 ; Psa 81:15 ; Lam 2:8 , enz.; Act 13:11 ."}],"23":[{"catchword":"Hoeveel","tekst":"Alsof hij zeide: Ik weet wel dat ik een arm zondaar ben, maar hoe vele en hoedanig zijn mijne zonden, dat ik aldus zwaarlijk om dezelve moet gestraft worden, dewijl mijn vrienden oordelen dat naar de grootheid der plagen de zonde ook groot moeten zijn."}],"24":[{"catchword":"verbergt","tekst":"God wordt gezegd zijn aangezicht van de vromen te verbergen, als Hij op hen in den nood geen acht schijnt te geven, hun gebeden niet te verhoren en alle hulp te weigeren. Zie Deu 31:17 . Gelijke manier van spreken zijn Psa 13:2 , en Psa 69:18 , en Psa 102:3 ; Isa 54:8 ; Mic 3:4 ."},{"catchword":"houdt mij","tekst":"Dat is, handelt met mij zo strengelijk door al de plagen, die mij overkomen, dat Gij mij voor uw vijand schijnt te houden; daar ik nochtans uw kind en dienaar ben."}],"25":[{"catchword":"Zult Gij","tekst":"Dat is, zal uw hoge en almogende majesteit zodanig geweld in het straffen gebruiken omtrent mij, die maar bij een dor blad en drogen stoppel te vergelijken ben?"}],"26":[{"catchword":"Gij schrijft","tekst":"Dit wordt gezegd naar de wijze der rechters, die hun vonnissen en besluiten over de misdadigers schriftelijk laten aantekenen. Daarom is schrijven hier zoveel als besluiten, ordineren en besluiten vast maken."},{"catchword":"de misdaden","tekst":"Dat is, de straffen, die ik van mijn jonkheid af door mijn misdaden verdiend heb. Alzo is ongerechtigheid voor de straf der ongerechtigheid genomen. Zie Lev 5:1 ."}],"27":[{"catchword":"Gij legt","tekst":"Dat is, gelijk men de misdadigers gevangen legt, alzo ben ik door al mijn plagen zo besloten, omsingeld en vastgemaakt, dat ik niet weg kan en uit mijn verdriet geen uitkomst zie. Vergelijk onder, Job 36:8 en de aantekening."},{"catchword":"neemt","tekst":"Dat is, ik ben niet alleen rondom besloten, maar Gij hebt mij nog met wachten bezet, opdat ik geenszins ontkomen zou; vergelijk boven, Job 7:12 ."},{"catchword":"Gij drukt","tekst":"Dat is, Gij hebt mij niet alleen met wachten bezet van verre, maar Gij komt mij zo nabij, dat uw voetstappen, dat is de getuigenissen uwer strenge oordelen, recht nevens mijn voeten uitgedrukt staan; dat is, zo nabij als zij immers kunnen."},{"catchword":"wortelen","tekst":"Dat is, het onderste van mijn voeten. Hij wil zeggen dat God hem niet nader kon benauwen dan Hij deed, hem als bij de voeten vast hebbende, dat hij uit zijn lijden niet een stap ontgaan Kon."}],"28":[{"catchword":"En hij veroudert","tekst":"Hij verstaat zichzelven, wijzende met den vinger op zijn eigen lichaam. De zin is dat God, onaangezien zijn verzwakking en uittering, evenwel niet ophield hem ten uiterste toe te beangstigen. Anderen verstaan het van zijn lichaam, of van den mens in het algemeen, gelijk volgt, Job 14:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Behold all that mine eye hath seen, mine ear hath heard, [viz. What I have alledged now, and taught heretofore, of the wise and mighty Government of God, not only by common experience, but especially by the revelation and instruction of the LORD.] and understood [Hebr. Understood for it self, according to the Hebrew phrase.]"}],"2":[{"catchword":null,"tekst":"As ye do know (it), I also know it; I faint not before you. [Heb. I fall not before you. See ab.ch.12.3. and the annot.]"}],"3":[{"catchword":null,"tekst":"But I will speak to the Almighty, and I long to defend my self before God. [Hereby he reflecteth upon that which Zophar had said above chap.11.5. implying that he would rather deal with God himself than with these Friends of his, forasmuch as God, looking upon his conscience, would understand him better than they did, who judging him to be an hypocrite, maintained Gods cause by wrongful arguments.]"}],"4":[{"catchword":null,"tekst":"For assuredly ye are dressers of lies: [i.e. you garnish and adorn lies, (as Psa 119:169.) in that ye go about to plead for Gods cause with lies, urging, that God doth onely punished the wicked and not the godly, and that I must needs be wicked because punished thus, yea, and that he should not be righteous, to punish me thus if I were godly.] ye are all of you naughty Physicians. [i.e. unfit comforters, who, instead of chearing and reviving me with Gods promises made for the godly, set before me nothing but severe judgements of God, and the just vengeances, which he doth execute against the wicked.]"}],"5":[{"catchword":null,"tekst":"Ah, [Hebr. Who shall give. See above cha.6.8.] that ye kept silence together! [Hebr. Being silent were silent!] that would be wisdom for you. [i.e. it should be held and accounted your wisdom, Prov 17:28.]"}],"6":[{"catchword":null,"tekst":"Do but hear my defence: [The Hebrew word doth properly signify reprehension, reproof. Understand here the defence or plea which he was ready to produce against their charge. So the word is taken below chapter 23.verse 4.] and mark the controversies of my lips. [i.e. the managing of my Arguments, whereby I go about to maintain my cause against you.]"}],"7":[{"catchword":null,"tekst":"Should ye speak wrong [viz. As if God dealt unjustly to chasten the godly, even as if God had no right nor liberty to do it.] for God? [i.e. to please him, or to defend him: and so in the sequel. Job taxeth them, that they charge him with wicked dissembling and hypocrisy, under pretence of maintaining Gods justice. For they would not understand, or yield, that the judgements of God, ordinarily, do as soon light upon the good as upon the wicked, in this life. See above 5.ver.3, &c. & 8.v.11. &c. And 11.ver.13,20.] and should ye speak deceitfulness for him?"}],"8":[{"catchword":null,"tekst":"Should ye accept his face, [i.e. regard his person, because of his power and greatness, without duely considering and weighing the matter it self. Implying, that God ought not to be defended in such a manner; and so below verse 10. See Leviticus 19. On verse 15.] Should ye contend for God? [viz. After this manner. The sense is; They needed not at all trouble, or, pain themselves to plead for the Justice of God, because he himself was sufficiently able to maintain himself.]"}],"9":[{"catchword":null,"tekst":"Will it be good [i.e. shall it be honourable and profitable for you? He will say, no; but rather accompanied with disgrace and damage, it is a phrase which strongly denieth. See Genesis 18.on verse 17.] when he shall search you? [i.e. accurately sift your hearts, and understandings, who in this matter do not rightly conceive of him; for judging him unrighteous, if he should in judging punish the godly.] will ye mock him, [shall ye de (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  const hfdOpties = m.hoofdstukken.map(h =>

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
