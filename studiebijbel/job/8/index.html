en lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Ezech 23:35": "Daarom, zo zegt de Heere HEERE: Omdat u Mij vergeten hebt, en Mij achter uw rug geworpen hebt, daarom draagt u ook uw schandelijkheid en uw hoererijen.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Deut 29:5": "En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Hand 7:34-36": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden. Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik. Deze heeft hen uitgeleid, en deed wonderen en tekenen in het land van Egypte, en in de Rode Zee, en in de woestijn, veertig jaar lang.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Ps 119:162": "Ik ben vrolijk over Uw toezegging, als iemand, die een grote buit vindt.", "Pred 8:6": "Want voor elk voornemen is er een tijd en een wijze, omdat het kwaad van de mens zwaar op hem drukt.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Spr 11:9": "De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.", "Job 15:2": "Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind?", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Ps 68:11": "Uw kudde woonde daarin; U bereidde het door Uw goedheid voor de ellendige, o God!", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Ps 16:6": "De snoeren zijn mij op fijne plaatsen gevallen; ja, een mooie erfenis is mij ten deel gevallen.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "Hab 3:18": "Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Ps 33:21": "Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen.", "Spr 24:13": "Eet honing, mijn zoon! want hij is goed, en honingzeem is zoet voor uw gehemelte.", "Ezech 33:17": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Gen 13:13": "En de mannen van Sodom waren slecht, en grote zondaars tegen de HEERE.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Ps 89:49": "Wat man leeft er, die de dood niet zien zal, die zijn ziel zal bevrijden van het geweld van het graf? Sela.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Job 11:3": "Zouden uw leugens de mensen doen zwijgen, en zou u spotten, en zou niemand u beschamen?", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "1 Kron 17:7": "Nu dan, zo zult u zeggen tegen Mijn knecht, tegen David: Zo zegt de HEERE van de heerscharen: Ik heb u van de schaapskooi genomen, van achter de schapen vandaan, opdat u een voorganger over Mijn volk Israël zou zijn;", "Ps 26:6": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE!", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Ps 18:4": "Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ef 4:18": "Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart;", "Job 18:14": "Zijn vertrouwen zal uit zijn tent uitgerukt worden; dat zal hem doen treden tot de koning der verschrikkingen.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Job 17:1": "Mijn geest is verdorven, mijn dagen worden uitgeblust, de graven zijn voor mij.", "Spr 24:14": "Zo is de kennis van de wijsheid voor uw ziel; als u ze vindt, zal er beloning zijn, en uw verwachting zal niet afgesneden worden.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Ps 68:10": "U hebt zeer milde regen doen druipen, o God! En U hebt Uw erfenis gesterkt, toen zij moe geworden was.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "Hebr 10:27": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden.", "Luk 18:1-8": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven, en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag. En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Spr 3:25": "Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.", "Matt 18:13": "En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Ps 19:9": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Spr 28:10": "Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Ps 145:4": "Daleth. Geslacht aan geslacht zal Uw werken roemen; en zij zullen Uw machtige daden verkondigen.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Ps 104:10-19": "Die de bronnen laat stromen door de dalen, zodat zij tussen de bergen door lopen. Zij drenken al het gedierte van het veld; de wilde ezels lessen er hun dorst mee. Daarbij woont het gevogelte van de hemel, een geluid latend horen van tussen de takken.", "Gen 21:6": "En Sara zei: God heeft mij te lachen gemaakt; ieder die het hoort, zal met mij lachen.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Matt 25:41-45": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is. Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven; Ik was een vreemdeling; en u hebt Mij geen onderkomen gegeven; naakt, en u hebt Mij niet gekleed; ziek, en in de gevangenis, en u hebt Mij niet bezocht.", "Job 37:5": "God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.", "Job 37:15": "Weet u wanneer God daarover orde stelt, en het licht van Zijn wolk laat schijnen?", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Ps 136:5-25": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Deut 8:14": "Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Ps 86:5-7": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen. HEERE! neem mijn gebed ter ore, en let op de stem van mijn smekingen. In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "Mark 12:32-34": "En de schriftgeleerde zei tegen Hem: Meester, U hebt naar waarheid goed gezegd dat er een enig God is, en er is geen ander dan Hij; en Hem lief te hebben uit heel het hart, en uit heel het verstand, en uit heel de ziel, en uit heel de kracht; en de naaste lief te hebben als zichzelf, is meer dan alle brandoffers en slachtoffers. En Jezus zag dat hij verstandig geantwoord had, en zei tegen hem: U bent niet ver van het Koninkrijk van God. En niemand durfde Hem meer iets te vragen.", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Hos 8:3": "Israël heeft het goede verstoten; de vijand zal hem vervolgen.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Jer 33:3": "Roep tot Mij, en Ik zal u antwoorden, en Ik zal u grote en vaste dingen bekendmaken, die u niet weet.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Deut 7:13-24": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten; en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.", "Pred 3:13": "Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, dit is een gave van God.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Joh 6:26": "Jezus antwoordde hun en zei: Voorwaar, voorwaar, Ik zeg u: u zoekt Mij niet omdat u tekenen gezien hebt, maar omdat u van de broden gegeten hebt en verzadigd bent.", "Pred 3:15": "Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Mal 2:13": "Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Job 27:8": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken?", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Jes 35:1": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Jer 12:2": "U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Matt 6:2": "Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen.", "Ps 2:10": "Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Amos 4:7-12": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Deut 13:18": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God.", "Spr 22:3": "Een verstandig mens ziet het kwaad en verbergt zich; maar de eenvoudigen gaan door en worden gestraft.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Joh 14:13": "En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.", "Ex 6:4": "En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht.", "Hand 8:8": "En er ontstond grote blijdschap in die stad.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Job 5:6-11": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Openb 16:7": "En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Job 12:23": "Hij vermenigvuldigt de volken, en verdelgt ze; Hij breidt de volken uit, en leidt ze.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "1 Joh 4:6": "Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Job 13:16": "Ook zal Hij mij tot heil zijn; maar een huichelaar zal voor Zijn aangezicht niet komen.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Job 28:20": "Die wijsheid dan, waar komt zij vandaan, en waar is de plaats van het verstand?", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Ps 37:23-29": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg. Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand. Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Zach 7:6": "Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "1 Kron 16:27": "Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en vrolijkheid zijn in Zijn plaats.", "Ps 128:2-6": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "Ps 126:2": "Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Gen 9:1-3": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Rom 2:5-16": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Joh 10:27-29": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "1 Tess 5:9-11": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven. Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Ps 78:52-55": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.", "Deut 4:32": "Want vraag toch naar de vorige dagen, die vóór u geweest zijn, vanaf de dag dat God de mens op de aarde geschapen heeft, van het ene einde van de hemel tot aan het andere einde van de hemel, of er ooit zo'n groot ding gebeurd of gehoord is als dit:", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Luk 16:16": "De wet en de profeten zijn tot op Johannes; van die tijd af wordt het Koninkrijk van God verkondigd, en ieder doet geweld op datzelfde.", "Jes 3:13": "De HEERE stelt Zich op om te pleiten, en Hij staat om de volken te richten.", "2 Kor 1:20-22": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons. Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God; Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Spr 1:5": "Die wijs is, zal horen, en zal in leer toenemen; en die verstandig is, zal wijze raad bekomen;", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Ps 54:5": "Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Jes 66:3-5": "Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is als die zwijnenbloed offert; wie wierook brandt tot een gedenkoffer, is als die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels. Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde. Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Job 18:16": "Van onderen zullen zijn wortels verdorren, en van boven zal zijn tak afgesneden worden.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "1 Sam 24:13": "De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ps 127:1-5": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs. Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap. Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Ps 36:2": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "Matt 6:16": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Openb 21:3-7": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn. En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan. En Die op de troon zat, zei: Zie, Ik maak alle dingen nieuw. En Hij zei tegen mij: Schrijf, want deze woorden zijn waarachtig en betrouwbaar.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Mal 2:17": "U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?", "Jer 33:6": "Zie, Ik zal haar gezondheid en genezing laten opkomen, en Ik zal hen genezen, en Ik zal hun een overvloed van vrede en waarheid openbaren.", "Openb 11:12": "En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "Ezech 33:7-19": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Joh 14:12-21": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader. En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt. Als u iets zult vragen in Mijn Naam, Ik zal het doen.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Amos 8:7": "De HEERE heeft gezworen bij de heerlijkheid van Jakob: Zeker zal Ik al hun werken voor altijd niet vergeten!", "Joh 5:42": "maar Ik ken u, dat u de liefde van God niet in uzelf hebt.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Hebr 10:31": "Vreselijk is het te vallen in de handen van de levende God.", "Ps 78:39": "En Hij dacht eraan, dat zij vlees waren, een wind, die heengaat en niet terugkeert.", "Jes 52:9": "Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Spr 15:6": "In het huis van de rechtvaardige is een grote schat; maar in de inkomst van de goddeloze is opschudding.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Lev 26:6": "Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "2 Kron 31:21": "En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed.", "Spr 19:8": "Die verstand krijgt, heeft zijn ziel lief; hij neemt de verstandigheid waar, om het goede te vinden.", "Openb 7:9-17": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen. En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam. En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Hand 2:28": "U hebt mij de wegen van het leven bekendgemaakt; U zult mij vervullen met vreugde door Uw aangezicht.", "Ps 113:6-9": "Die zeer laag ziet, in de hemel en op de aarde. Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt; Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Joël 2:23": "En u, kinderen van Sion! verheugt u en weest blijde in de HEERE, uw God; want Hij zal u die Leraar ter gerechtigheid geven; en Hij zal u de regen doen neerdalen, de vroege regen en de late regen in de eerste maand.", "Ps 33:19": "Om hun ziel van de dood te redden, en om hen bij het leven te houden in de honger.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ezech 18:21-23": "Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Ps 147:9": "Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "Jer 31:26": "(Hierop ontwaakte ik, en zag toe, en mijn slaap was mij zoet.)", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ps 145:18": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.", "Rom 3:26": "tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "1 Joh 5:15": "En als wij weten dat Hij ons verhoort, wat wij ook bidden, dan weten wij dat wij de beden verkrijgen die wij van Hem gebeden hebben.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Ps 89:17": "Zij zullen zich de hele dag verheugen in Uw Naam, en door Uw gerechtigheid verhoogd worden.", "Spr 7:10-21": "En zie, een vrouw ontmoette hem in hoerenversiersel, en met het hart op haar hoede; Deze was druk en opstandig, haar voeten bleven in haar huis niet; Nu buiten, dan op de straten zijnde, en bij alle hoeken loerend;", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Job 39:8": "Wie heeft de woudezel vrij heengezonden, en wie heeft de banden van de wilde ezel gelost?", "Ps 52:7-9": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela. En de rechtvaardigen zullen het zien, en vrezen; en zij zullen over hem lachen, en zeggen: Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Job 36:29": "Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Ps 56:10": "Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Zach 14:7": "Maar het zal één enige dag zijn, die de HEERE bekend zal zijn; het zal geen dag en geen nacht zijn; en het zal gebeuren, ten tijde van de avond, dat het licht zal zijn.", "Pred 7:18": "Het is goed dat u daaraan vasthoudt, en trek ook uw hand van dit niet af; want wie God vreest, die ontgaat dat allemaal.", "Job 36:26": "Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Ps 50:16": "Maar tegen de goddeloze zegt God: Wat hebt u Mijn inzettingen te vertellen, en neemt u Mijn verbond in uw mond?", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Rom 5:11": "En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "2 Kron 11:16": "Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.", "Jes 65:19": "En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Spr 9:9-12": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis. De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand. Want door mij zullen uw dagen zich vermenigvuldigen, en de jaren van uw leven zullen u toegevoegd worden.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Rom 15:14": "Doch, mijn broeders, ook ik zelf ben ervan verzekerd dat u ook zelf vol bent van goedheid, vervuld met alle kennis, in staat om ook elkaar te vermanen.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Jak 5:13": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen.", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Job 7:6": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Pred 9:13-18": "Ook heb ik onder de zon deze wijsheid gezien, en zij leek mij groot: Er was een kleine stad, en er waren maar weinig mensen in; en een groot koning kwam tegen haar op, en hij omsingelde haar, en hij bouwde grote belegeringswerken tegen haar. En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Job 34:30": "Opdat de huichelachtige mens niet meer regeert, en geen strikken van het volk zijn.", "Job 10:3": "Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft?", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Spr 7:6-23": "Want door het venster van mijn huis, door mijn tralie keek ik uit; En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Mark 11:23": "Want voorwaar, Ik zeg u, dat wie tegen deze berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven dat wat hij zegt, zal gebeuren, het zal hem gebeuren, wat hij ook zegt.", "Matt 21:22": "En alles wat u in het gebed zult vragen, in geloof, zult u ontvangen.", "Ps 37:25": "Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Ex 10:3": "Zo gingen Mozes en Aäron naar Farao, en zeiden tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Hoe lang weigert u zich voor Mijn aangezicht te verootmoedigen? Laat Mijn volk gaan, dat zij Mij dienen.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Jes 30:19": "Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Ps 37:22": "Want zijn gezegenden zullen de aarde erfelijk bezitten; maar zijn vervloekten zullen uitgeroeid worden.", "Spr 4:4-13": "Hij leerde mij, en zei tegen mij: Uw hart houdt mijn woorden vast, onderhoud mijn geboden, en leef. Verkrijg wijsheid, verkrijg verstand; vergeet niet, en wijk niet van de woorden van mijn mond. Verlaat haar niet, en zij zal u behoeden; heb haar lief, en zij zal u bewaren.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Ps 91:15": "Hij zal Mij aanroepen, en Ik zal hem verhoren; in de benauwdheid zal Ik bij hem zijn. Ik zal hem eruit trekken, en zal hem verheerlijken.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Hos 7:2-4": "En zij zeggen niet in hun hart dat Ik al hun boosheid onthoud; nu omsingelen hun daden hen, zij zijn voor Mijn aangezicht. Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens. Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Jes 45:1": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden:", "1 Petr 1:8": "Hem, Die u niet gezien hebt en toch liefhebt, in Wie u nu, hoewel u Hem niet ziet, maar gelooft, zich verheugt met een onuitsprekelijke en heerlijke vreugde;", "Ps 9:3": "In U zal ik mij verblijden, en van vreugde opspringen; ik zal Uw Naam zingen, o Allerhoogste!", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "Joh 10:14": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend.", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Ex 10:7": "En de knechten van Farao zeiden tegen hem: Hoe lang zal deze man ons tot een valstrik zijn? Laat de mannen gaan, dat zij de HEERE, hun God, dienen! Weet u nog niet dat Egypte verloren is?", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "Job 11:13": "Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit.", "2 Kron 7:13-15": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen. Nu zullen Mijn ogen open zijn, en Mijn oren opmerkzaam op het gebed van deze plaats.", "2 Petr 2:20": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Job 9:28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "1 Kor 2:7-10": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was; Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben. Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Pred 1:4": "Het ene geslacht gaat, en het andere geslacht komt; maar de aarde blijft staan in eeuwigheid.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Job 29:5": "Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Mal 4:3": "En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Fil 4:4": "Verblijd u in de Heere te allen tijd; opnieuw zeg ik: Verblijd u.", "Job 21:15": "Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zouden wij hebben, dat wij Hem zouden aanroepen?", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Ps 102:12": "Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Joh 16:24": "Tot nu toe hebt u niets gebeden in Mijn Naam; bid, en u zult ontvangen, opdat uw blijdschap volkomen is.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Job 7:17": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?", "Pred 3:11": "Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.", "Ps 91:9-12": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt
