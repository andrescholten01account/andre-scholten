 kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding.","5":"*Maar* als u God vroeg zoekt, en tot de Almachtige om genade bidt;","6":"als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.","7":"Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.","8":"Want vraag toch aan het vorige geslacht, en stel u open voor het onderzoek van hun vaderen.","9":"Want wij zijn van gisteren en weten niets, omdat onze dagen op de aarde een schaduw zijn.","10":"Zullen zij u niet leren, tot u spreken, en uit hun hart woorden voortbrengen?","11":"Groeit het riet op zonder moeras? Groeit het rietgras zonder water?","12":"Als het nog in zijn groenheid is, *hoewel* het niet afgesneden wordt, verdort het toch eerder dan al het andere gras.","13":"Zo zijn de wegen van allen die God vergeten; en de verwachting van de huichelaar zal vergaan.","14":"Van wie zijn hoop walgen zal; en zijn vertrouwen zal zijn als het huis van een spin.","15":"Hij zal op zijn huis leunen, maar het zal niet bestaan; hij zal zich eraan vasthouden, maar het zal niet staande blijven.","16":"Hij is sappig in de zon, en zijn scheuten breiden zich uit over zijn tuin.","17":"Zijn wortels vervlechten zich bij de steenhoop; hij vindt zich een plaats tussen de stenen.","18":"*Maar* als *God* hem wegrukt van zijn plaats, dan zal die hem verloochenen en zeggen: Ik heb u nooit gezien.","19":"Zie, dat is de vreugde van zijn weg; en uit het stof zullen anderen opgroeien.","20":"Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;","21":"totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.","22":"Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet *meer* zijn."},"SV":{"1":"Toen antwoordde Bildad, de Suhiet, en zeide:","2":"Hoe lang zult gij deze dingen spreken, en de redenen uws monds een geweldige wind zijn?","3":"Zou dan God het recht verkeren, en zou de Almachtige de gerechtigheid verkeren?","4":"Indien uw kinderen gezondigd hebben tegen Hem, Hij heeft hen ook in de hand hunner overtreding geworpen.","5":"*Maar* indien gij naar God vroeg zoekt, en tot den Almachtige om genade bidt;","6":"Zo gij zuiver en recht zijt, gewisselijk zal Hij nu opwaken, om uwentwil, en Hij zal de woning uwer gerechtigheid volmaken.","7":"Uw beginsel zal wel gering zijn; maar uw laatste zal zeer vermeerderd worden.","8":"Want vraag toch naar het vorige geslacht, en bereid u tot de onderzoeking hunner vaderen.","9":"Want wij zijn van gisteren en weten niet; dewijl onze dagen op de aarde een schaduw zijn.","10":"Zullen die u niet leren, tot u spreken, en uit hun hart redenen voortbrengen?","11":"Verheft zich de bieze zonder slijk? Groeit het rietgras zonder water?","12":"Als het nog in zijn groenigheid is, *hoewel* het niet afgesneden wordt, nochtans verdort het voor alle gras.","13":"Alzo zijn de paden van allen, die God vergeten; en de verwachting des huichelaars zal vergaan.","14":"Van denwelke zijn hoop walgen zal; en zijn vertrouwen zal zijn een huis der spinnekop.","15":"Hij zal op zijn huis leunen, maar het zal niet bestaan; hij zal zich daaraan vasthouden, maar het zal niet staande blijven.","16":"Hij is sappig voor de zon, en zijn scheuten gaan over zijn hof uit.","17":"Zijn wortelen worden bij de springader ingevlochten; hij ziet een stenige plaats.","18":"*Maar* als *God* hem verslindt uit zijn plaats, zo zal zij hem loochenen, *zeggende*: Ik heb u niet gezien.","19":"Zie, dat is de vreugde zijns wegs; en uit het stof zullen anderen voortspruiten.","20":"Zie, God zal den oprechte niet verwerpen; Hij vat ook de boosdoeners niet bij de hand;","21":"Totdat Hij uw mond met gelach vervulle, en uw lippen met gejuich.","22":"Uw haters zullen met schaamte bekleed worden; en de tent der goddelozen zal niet *meer* zijn."},"KJV":{"1":"Then answered Bildad the Shuhite, and said,","2":"How long wilt thou speak these *things*? and *how long shall* the words of thy mouth *be like* a strong wind?","3":"Doth God pervert judgment? or doth the Almighty pervert justice?","4":"If thy children have sinned against him, and he have cast them away for their transgression;","5":"If thou wouldest seek unto God betimes, and make thy supplication to the Almighty;","6":"If thou *wert* pure and upright; surely now he would awake for thee, and make the habitation of thy righteousness prosperous.","7":"Though thy beginning was small, yet thy latter end should greatly increase.","8":"For enquire, I pray thee, of the former age, and prepare thyself to the search of their fathers:","9":"(For we *are but of* yesterday, and know nothing, because our days upon earth *are* a shadow:)","10":"Shall not they teach thee, *and* tell thee, and utter words out of their heart?","11":"Can the rush grow up without mire? can the flag grow without water?","12":"Whilst it *is* yet in his greenness, *and* not cut down, it withereth before any *other* herb.","13":"So *are* the paths of all that forget God; and the hypocrite's hope shall perish:","14":"Whose hope shall be cut off, and whose trust *shall be* a spider's web.","15":"He shall lean upon his house, but it shall not stand: he shall hold it fast, but it shall not endure.","16":"He *is* green before the sun, and his branch shooteth forth in his garden.","17":"His roots are wrapped about the heap, *and* seeth the place of stones.","18":"If he destroy him from his place, then *it* shall deny him, *saying*, I have not seen","19":"Behold, this *is* the joy of his way, and out of the earth shall others grow.","20":"Behold, God will not cast away a perfect *man*, neither will he help the evil doers:","21":"Till he fill thy mouth with laughing, and thy lips with rejoicing.","22":"They that hate thee shall be clothed with shame; and the dwelling place of the wicked shall come to nought."}},"tsk":{"1":[{"kopje":"Bildad","refs":["Job 2:11"]}], d":"schaduw zijn","tekst":"Dat is, zeer vergankelijk, ijdel en nietig. Vergelijk de aangewezen plaatsen."}],"10":[{"catchword":"die u niet","tekst":"Te weten, die voorvaderen, tot welken Job van Bildad gewezen was, boven, vs.8. Deze manier van vragen heeft macht om zeer te verzekeren; zie Gen 13:9 ."},{"catchword":"leren,","tekst":"Te weten, van de voorzienigheid en oordelen Gods, die wonderbaar zijn, en van de uitkomsten der goeden, die goed, en der kwaden, die kwaad zijn."},{"catchword":"uit hun hart","tekst":"Dat is, niet dat hun haastelijk uit de lippen valt, maar dat zij tevoren wel rijpelijk met het verstand bedacht en met de daad bevonden hebben."}],"11":[{"catchword":"Verheft","tekst":"De zin is, gelijk een bies niet kan opwassen zonder slijk, noch het wier zonder water, maar haastelijk verdroogt; alzo kan de mens geen welstand hebben zonder godvruchtigheid."},{"catchword":"rietgras","tekst":"Anders, sek, of slag, of meergras. Vergelijk Gen 41:2 , en de aantekening daarop."}],"12":[{"catchword":"gras","tekst":"Zie 1Ki 18:5 ."}],"13":[{"catchword":"Alzo zijn","tekst":"Dat is, alzo gaat het hun, of zodanig is het leven, de macht en de uitkomst dergenen, die God verachten; want hoewel zij voor een tijdlang groenen en bloeien, en hoog opgaan, en vast schijnen te wezen, zolang de tijdelijke voorspoed hen toelacht, nochtans, wanneer deze ontbreekt, vergaan zij zeer haastelijk, ja eer dan anderen; Psa 37:2 , Psa 37:35 ."},{"catchword":"huichelaars","tekst":"Versta, een mens, die in zijn hart goddeloos is voor God, maar zich voor vroom uitgeeft met woorden, gebaren en werken voor de mensen, om die te bedreigen. Alzo onder, Job 13:16 , en Job 15:34 , en Job 17:8 ; Pro 11:9 ; Isa 9:16 , enz."}],"14":[{"catchword":"zijn hoop","tekst":"Dat is, het goed dat hij hoopt; hetwelk gezegd wordt een verdriet of walg van den huichelaar te zullen hebben, omdat het hem niet aankomen, maar van hem vlieden zal. Vergelijk Psa 95:10 . Anders, wiens hoop zal afgesneden worden."},{"catchword":"een huis","tekst":"Versta, het web der spinnekop, dat zeer zwak en teer is en lichtelijk gebroken wordt. De zin is, gelijk de spinnekop zich niet met haar weg tegen enig geweld kan bewaren, alzo kan de goddeloze zich tegen de straffen Gods met zijn tijdelijke middelen niet beschermen."}],"15":[{"catchword":"Hij zal","tekst":"Te weten, de huichelaar en goddeloze."}],"16":[{"catchword":"Hij is sappig","tekst":"Dat is, de goddeloze is te vergelijken bij een groenen en vochtigen boom, die wel geworteld is, maar als hij van den eigenaar afgehouwen en uitgeroeid is, zeer haastelijk vergaat; want alzo vergaan ook de huichelaars, als zij van God uitgeroeid worden, hoewel zij van groot vermogen zijn, en door rijkdom hoog verheven."},{"catchword":"voor de zon,","tekst":"Dat is, zo vochtig dat hij ook door de brandende hitte der zon niet verdroogt."},{"catchword":"gaan over zijn hof","tekst":"Dat is, rekken uit en verheffen zich over den hof door zijn weelderigheid en overgroten wasdom; sommigen menen dat Bildad in vs.16 begint te spreken van de vromen of godvruchtigen, en zetten voorts vs.18 aldus over: Zal iemand hem verslinden uit zijn plaats, zodat zij hem loochenen, enz."}],"17":[{"catchword":"springader","tekst":"Te weten, waar de wateren hun oorsprong nemen, hobbelen, wellen en zich omwentelen, en vervolgens daar geen vochtigheid ontbreekt. Het Hebreeuwse woord is voor een springader genomen, Son 4:12 , gelijk ook het woord gullat, dat van denzelfden oorsprong is; Jos 15:19 . Anderen zetten het Hebreeuwse woord hier over een hoop; te weten van stenen, gelijk het ook genomen wordt Gen 31:46 , en de zin is dan hier enerlei met den zin der volgende woorden van vs.17."},{"catchword":"hij ziet","tekst":"Dat is, hij breidt zijn wortelen zo ver en krachtig uit, dat hij ook aan den steenachtigen grond gerakende, evenwel zijn kracht behoudt. Hij wil zeggen dat de huichelaar voor een tijd alle beletselen en tegenstoot overkomt, die zijn tijdelijken welstand schenen te zul juich","tekst":"Versta, vreugdegeluid; zie 2Ch 15:14 ."}],"22":[{"catchword":"Uw haters","tekst":"Of, [totdat] uw haters met schaamte bekleed worden, en de hutten der goddelozen niet meer zijn."},{"catchword":"met schaamte","tekst":"Dat is, gans zeer beschaamd worden. Zie gelijke manier van spreken Psa 35:26 , en Psa 109:29 ; Eze 7:27 , en Eze 26:16 ."},{"catchword":"tent","tekst":"Dat is, huis en woning."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then answered Bildad the Suhite, and said;"}],"2":[{"catchword":null,"tekst":"How long shalt thou speak these things, and the sayings of thy mouth be a mighty wind? [Here Jobs discourses are compared to a strong wind, as proceeding of violent passions; contrary to the rules of discretion, and seeming to encounter with Gods honour."}],"3":[{"catchword":null,"tekst":"Should God then pervert the right? And should the Almighty pervert righteousness?"}],"4":[{"catchword":null,"tekst":"If thy children have sinned against him, he hath also cast them into the hand of the transgression [Heb. He hath sent them, i.e. he hath suffered them to fall into the power of sin, for fill up measure thereof, and of punishment, for to receive their due reward.]"}],"5":[{"catchword":null,"tekst":"(But) if thou seek early after God, [i.e. timely and diligently, see above ch.7.on v.21.] and pray for grace to the Almighty. [his meaning here is, as if he had said; Thy children indeed are perished by reason of their sins; but as for thee, if thou do seek the LORD withal thy heart, and pray for grace and pardon, and shalt be clean from abominable sins, he shall redress thee well enough, and repossess thee of thy former well enough, and repossess thee of thy former welfare.]"}],"6":[{"catchword":null,"tekst":"If thou be pure [i.e. not defiled with gross secret sins, for which thou art not sorrowful] and right; surely he shall awake now for thy sake: [Heb. Over thee, i.e. for thy sake, for thy own good and benefit:] and he shall perfect the habitation [i.e. rear it up again, restore and re-establish the same in its former state and condition. Oth. Appease, or prosper, make prosperous.] of thy righteousness [i.e. wherein thou doest practise righteousness and virtuousness and virtuousness.]"}],"7":[{"catchword":null,"tekst":"Thy beginning shall be mean indeed, but thy later end shall be very much increased. [i.e. God shall make thee great, being low; exalted, being debased; rich, being poor, prosperous, being crossed, by blessing thee and thine more and more.]"}],"8":[{"catchword":null,"tekst":"For do but enquire after the former generation, [understand a multitude of people that lived together in one age, or for many years together. See Gen.6.on v.9. and Psal.12.on v.8.] and fit thy self for the searching after their Fathers [viz. That were or lived in the former generations, and had gotten a great measure of understanding and wisdom, by means of their long life and great experience, besides the sundry revelations they had from God.]"}],"9":[{"catchword":null,"tekst":"For we are of yesterday [i.e. not to be compared with those Fathers or Patriarchs, we having a shorter life, less experience, and not so many revelations from God.] and know nothing, because our days are a shadow upon the earth. [i.e. very transitory, vain and nothing Comp.Ps.102.12. & 144.4.]"}],"10":[{"catchword":null,"tekst":"Shall not they [viz. Those Forefathers, whom Job was directed unto by Bildad, ab. Verse 8. This kind of asking, implyeth a strong affirmation. See Gen.13.on v.9.] teach thee, speak to thee [viz. Of the courses of Gods providence and judgements, which are wonderful, and of the issues of Good men, which are good, and of the bad, which are bad.] and bring forth speechs out of their heart? [i.e. not as such as were uttered on the sudden from the lips, but such as they did sit, ripely weigh and consider in their understandings, and had made trial of by their experience.]"}],"11":[{"catchword":null,"tekst":"Doth the Bull-rush raise it self without mire? [the meaning is; even as a Bull-rush cannot grow up without mire, nor the reed without water; but must soon wither away; so a man cannot thrive nor prosper without piety.] growth the reed-grass without water? Oth-flag, or Moor-grass, comp. Gen 41:2. and the annotate. There.]"}],"12":[{"catchword":null,"tekst":"When it is in its virtue, yet (although) it be not cut down, yet it withereth before all grass. [See 1 Kings 18.on v.5.]"}],"13":[{"catchword":null,"tekst":"Thus are the paths of all that forget God: [i.e. thus it fares with them, or, such is the life, the ability, and the issue of those that despise God: although for a time they may be green, and flourish and rise up high, and seem to stand very firm, whiles outward prosperity doth smile upon them; yet when that fails once, they fall and perish on a suddain, yea much sooner than others, Psa 37:2,35.] and the expectation of the hypocrite shall perish: [understand here by the hypocrite, him that is wicked or impious in his heart before God, and yet maketh outward profession in words, behaviour and action before men, of being Godly, to deceive the same. So also bel.ch.13.16. etc 15.34. etc 17.18. Pro 11:9. Isa 9:17. &c.]"}],"14":[{"catchword":null,"tekst":"Whom his hope shall loath: [his hope, i.e. the good he hoped for; which is said here shall loath and abhor the hypocrite, and not draw neer unto, but shun and fly from him. Comp. Psa 96:10. Oth. Whose hope shall be cut off.] and his confidence shall be an house of the spider. [i.e. a Spiders web, which is very weak and frail, and most easily ruined and undone. The sence is, that even as the Spider cannot defend her self against any violence, by her own web, so neither can the wicked protect themselves against the judgements of God, by their outward prosperity.]"}],"15":[{"catchword":null,"tekst":"He [viz. The hypocrite and wicked] shall lean upon his house, but it shall not subsist; he shall lay firmly hold of it, but it shall not abide standing."}],"16":[{"catchword":null,"tekst":"He is sappy [the wicked is compared to a green and sappy Tree that is well rooted, but being cut down once, and destroyed by the owner, doth fade and waste very soon. For thus the hypocrites also do perish when God doth cut them off once, be they of never so great abilities, or never so highly exalted by all their wealth and welfare.] before the Sun: [i.e. so full of sap and juice, that the very scorching heat of the Sun is not able to dry it up.] and his branches issue forth over his garden. [i.e. they spread forth and elevate themselves all the garden over, by their thrivings, and extraordinary growth. Some are of opinion, that Bildad here in this 16. Verse beginneth to speak of the good or godly men; and therefore they translate the 18. Verse thus; shall any on swallow him out of his place, so that it deny him, etc.]"}],"17":[{"catchword":null,"tekst":"His roots are wreathed in by the spring-vein [viz. There where the waters have their source, do spring and bubble forth, rowling about as it were, and consequently, where there is no want of moisture. The Hebrew word is taken for a Spring-vein, Cant.4.v.12. as likewise the word, Gullet, coming of the same root, Jos.15.19. others render the Hebrew word here over an heap, viz. Of stones; as it is likewise taken, Gen 31:46. and so the sence is one and the same with that of the words following] he seeth a stony place; [i.e. he spreads out his roots so far and mightily, that he reacheth even to the stony ground, and yet maintains his vigour. The sense is, That the hypocrite for a time doth overcome all lets and opposition, which seem to retard or impede his prosperity. Heb. The house of stones. Thus the word house is taken by the Hebrews for a place, or room, or largeness, 2 Samuel 15.17. Other. He looketh out after a stony place. Viz.to settle a firm Habitation there.]"}],"18":[{"catchword":null,"tekst":"(But) when (God) [or the swallower, which is God, who doth  of expression, Psa 35:26. and 109.29. Eze 7:27. & 26.16.] and the tent of the wicked [i.e. their house, dwelling or habitation.] shall be no (more.)"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
