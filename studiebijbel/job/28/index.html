ste onderzoekt hij; het gesteente van de donkerheid en van de schaduw des doods.","4":"Er breekt een beek door, bij hem die daar woont, *de* *wateren*, vergeten door de voet, worden door de mens uitgeput, *en* gaan weg.","5":"Uit de aarde komt het brood voort, en onder haar wordt zij veranderd, alsof zij vuur was.","6":"Haar stenen zijn de plaats van de saffier, en zij heeft stofjes van goud.","7":"De roofvogel heeft het pad niet gekend, en het oog van de kraai heeft het niet gezien.","8":"De jonge hoogmoedige dieren hebben het niet betreden, de felle leeuw is er niet overheen gegaan.","9":"Hij legt zijn hand aan de keiachtige *rots*, hij keert de bergen vanaf de wortel om.","10":"In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke.","11":"Hij bindt de rivier toe, zodat er geen traan uitkomt, en het verborgene brengt hij aan het licht.","12":"Maar de wijsheid, waar zal zij gevonden worden? En waar is de plaats van het verstand?","13":"De mens weet haar waarde niet, en zij wordt niet gevonden in het land van de levenden.","14":"De afgrond zegt: Zij is niet in mij; en de zee zegt: Zij is niet bij mij.","15":"Het gesloten goud kan niet voor haar gegeven worden, en met zilver kan haar prijs niet worden opgewogen.","16":"Zij kan niet geschat worden tegen fijn goud van Ofir, tegen de kostelijke Schoham, en de Saffier.","17":"Men kan het goud of het kristal haar niet gelijk waarderen; ook is zij *niet* te verwisselen voor een kleinood van zuiver goud.","18":"De Ramoth en Gabisch zullen niet gedacht worden; want de trek van de wijsheid is meer dan die van Robijnen.","19":"Men kan de Topaas van Morenland haar niet gelijk waarderen; en bij het fijn louter goud kan zij niet geschat worden.","20":"Die wijsheid dan, waar komt zij vandaan, en waar is de plaats van het verstand?","21":"Want zij is verholen voor de ogen van alle levenden, en voor het gevogelte des hemels is zij verborgen.","22":"Het verderf en de dood zeggen: Haar gerucht hebben wij met onze oren gehoord.","23":"God verstaat haar weg, en Hij weet haar plaats.","24":"Want Hij schouwt tot aan de einden der aarde, Hij ziet onder al de hemelen.","25":"Toen Hij de wind het gewicht gaf, en de wateren afwoog in mate;","26":"Toen Hij voor de regen een vaste orde maakte, en een weg voor het weerlicht van de donders;","27":"Toen zag Hij haar, en vertelde ervan; Hij bracht haar in orde, en doorzocht haar ook.","28":"Maar tegen de mens heeft Hij gezegd: Zie, de vreze des Heeren, dat is de wijsheid, en van het kwade te wijken is het verstand."},"SV":{"1":"Gewisselijk, er is voor het zilver een uitgang, en een plaats voor het goud, dat zij smelten.","2":"Het ijzer wordt uit stof genomen, en *uit* steen wordt koper gegoten.","3":"Het einde, *dat* *God* gesteld heeft voor de duisternis, en al het uiterste onderzoekt hij; het gesteente der donkerheid en der schaduw des doods.","4":"Breekt er een beek door, bij dengene, die daar woont, *de* *wateren* vergeten zijnde van den voet, worden van den mens uitgeput, *en* gaan weg.","5":"Uit de aarde komt het brood voort, en onder zich wordt zij veranderd, alsof zij vuur ware.","6":"Haar stenen zijn de plaats van den saffier, en zij heeft stofjes van goud.","7":"De roofvogel heeft het pad niet gekend, en het oog der kraai heeft het niet gezien.","8":"De jonge hoogmoedige dieren hebben het niet betreden, de felle leeuw is daarover niet heengegaan.","9":"Hij legt zijn hand aan de keiachtige *rots*, hij keert de bergen van den wortel om.","10":"In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke.","11":"Hij bindt de rivier toe, dat niet een traan uitkomt, en het verborgene brengt hij uit in het licht.","12":"Maar de wijsheid, van waar zal zij gevonden worden? En waar is de plaats des verstands?","13":"De mens weet haar waarde niet, en zij wordt niet gevonden in het land der levenden.","14":"De afgrond zegt: Zij is in mij niet; en de zee zegt: Zij is niet bij mij.","15":"Het gesloten goud kan voor haar niet gegeven worden, en met zilver kan haar prijs niet worden opgewogen.","16":"Zij kan niet geschat worden tegen fijn goud van Ofir, tegen den kostelijken Schoham, en den Saffier.","17":"Men kan het goud of het kristal haar niet gelijk waarderen; ook is zij *niet* te verwisselen voor een kleinood van dicht goud.","18":"De Ramoth en Gabisch zal niet gedacht worden; want de trek der wijsheid is meerder dan der Robijnen.","19":"Men kan de Topaas van Morenland haar niet gelijk waarderen; en bij het fijn louter goud kan zij niet geschat worden.","20":"Die wijsheid dan, van waar komt zij, en waar is de plaats des verstands?","21":"Want zij is verholen voor de ogen aller levenden, en voor het gevogelte des hemels is zij verborgen.","22":"Het verderf en de dood zeggen: Haar gerucht hebben wij met onze oren gehoord.","23":"God verstaat haar weg, en Hij weet haar plaats.","24":"Want Hij schouwt tot aan de einden der aarde, Hij ziet onder al de hemelen.","25":"Als Hij den wind het gewicht maakte, en de wateren opwoog in mate;","26":"Als Hij den regen een gezette orde maakte, en een weg voor het weerlicht der donderen;","27":"Toen zag Hij haar, en vertelde ze; Hij schikte ze, en ook doorzocht Hij ze.","28":"Maar tot den mens heeft Hij gezegd: Zie, de vreze des Heeren is de wijsheid, en van het kwade te wijken is het verstand."},"KJV":{"1":"Surely there is a vein for the silver, and a place for gold *where* they fine","2":"Iron is taken out of the earth, and brass *is* molten *out of* the stone.","3":"He setteth an end to darkness, and searcheth out all perfection: the stones of darkness, and the shadow of death.","4":"The flood breaketh out from the inhabitant; *even the waters* forgotten of the foot: they are dried up, they are gone away from men.","5":"*As for* the earth, out of it cometh bread: and under it is turned up as it were fire.","6":"The stones of it *are* the place of sapphires: and it hath dust of gold.","7":"*There is* a path which no fowl knoweth, and which the vulture's eye hath not seen:","8":"The lion's whelps have not trodden it, nor the fierce lion passed","9":"He putteth forth his hand upon the rock; he overturneth the mountains by the roots.","10":"He cutteth out rivers among the rocks; and his eye seeth every precious thing.","11":"He bindeth the floods from overflowing; and *the thing that is* hid bringeth he forth to light.","12":"But where shall wisdom be found? and where *is* the place of understanding?","13":"Man knoweth not the price thereof; neither is it found in the land of the living.","14":"The depth saith, It *is* not in me: and the sea saith,","15":"It cannot be gotten for gold, neither shall silver be weighed *for* the price","16":"It cannot be valued with the gold of Ophir, with the precious onyx, or the sapphire.","17":"The gold and the crystal cannot equal it: and the exchange of it *shall not be for* jewels of fine gold.","18":"No mention shall be made of coral, or of pearls: for the price of wisdom *is* above rubies.","19":"The topaz of Ethiopia shall not equal it, neither shall it be valued with pure gold.","20":"Whence then cometh wisdom? and where *is* the place of understanding?","21":"Seeing it is hid from the eyes of all living, and kept close from the fowls of the air.","22":"Destruction and death say, We have heard the fame thereof with our ears.","23":"God understandeth the way thereof, and he knoweth the place","24":"For he looketh to the ends of the earth, *and* seeth under the whole heaven;","25":"To make the weight for the winds; and he weigheth the waters by measure.","26":"When he made a decree for the rain, and a way for the lightning of the thunder:","27":"Then did he see it, and declare it; he prepared it, yea, and searched it out.","28":"And unto man he said, Behold, the fear of the Lord, that *is* wisdom; and to depart from evil *is* understanding."}},"tsk":{"1":[{"kopje":"het zilver","refs":["Gen 2:11","Gen 2:12","Gen 23:15","Gen 24:22","1 Kon 7:48-50","1 Kon 10:21","1 Kron 29:2-5" his <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> every precious thing.","11":"He <span class=\"wl wl-kjv\" data-code=\"H2280\">bindeth</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">floods</span> from <span class=\"wl wl-kjv\" data-code=\"H1065\">overflowing;</span> and the thing that is <span class=\"wl wl-kjv\" data-code=\"H8587\">hid</span> bringeth he <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to light.","12":"But <span class=\"wl wl-kjv\" data-code=\"H370\">where</span> shall <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found?</span> and where is the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of understanding?","13":"<span class=\"wl wl-kjv\" data-code=\"H582\">Man</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> not the <span class=\"wl wl-kjv\" data-code=\"H6187\">price</span> thereof; neither is it <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the living.","14":"The <span class=\"wl wl-kjv\" data-code=\"H8415\">depth</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> It is not in me: and the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> saith,","15":"It cannot be <span class=\"wl wl-kjv\" data-code=\"H5414\">gotten</span> for <span class=\"wl wl-kjv\" data-code=\"H5458\">gold,</span> neither shall <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> be <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> for the price","16":"It cannot be <span class=\"wl wl-kjv\" data-code=\"H5541\">valued</span> with the <span class=\"wl wl-kjv\" data-code=\"H3800\">gold</span> of <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H7718\">onyx,</span> or the sapphire.","17":"The <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and the <span class=\"wl wl-kjv\" data-code=\"H2137\">crystal</span> cannot <span class=\"wl wl-kjv\" data-code=\"H6186\">equal</span> it: and the <span class=\"wl wl-kjv\" data-code=\"H8545\">exchange</span> of it shall not be for <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of fine gold.","18":"No <span class=\"wl wl-kjv\" data-code=\"H2142\">mention</span> shall be made of <span class=\"wl wl-kjv\" data-code=\"H7215\">coral,</span> or of <span class=\"wl wl-kjv\" data-code=\"H1378\">pearls:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4901\">price</span> of <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> is above rubies.","19":"The <span class=\"wl wl-kjv\" data-code=\"H6357\">topaz</span> of <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia</span> shall not <span class=\"wl wl-kjv\" data-code=\"H6186\">equal</span> it, neither shall it be <span class=\"wl wl-kjv\" data-code=\"H5541\">valued</span> with <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> gold.","20":"<span class=\"wl wl-kjv\" data-code=\"H370\">Whence</span> then <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom?</span> and where is the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of understanding?","21":"Seeing it is <span class=\"wl wl-kjv\" data-code=\"H5956\">hid</span> from the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of all <span class=\"wl wl-kjv\" data-code=\"H2416\">living,</span> and kept <span class=\"wl wl-kjv\" data-code=\"H5641\">close</span> from the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the air.","22":"<span class=\"wl wl-kjv\" data-code=\"H11\">Destruction</span> and <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8088\">fame</span> thereof with our ears.","23":"<span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H995\">understandeth</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> thereof, and he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> the place","24":"For he <span class=\"wl wl-kjv\" data-code=\"H5027\">looketh</span> to the <span class=\"wl wl-kjv\" data-code=\"H7098\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> under the whole heaven;","25":"To <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> for the <span class=\"wl wl-kjv\" data-code=\"H7307\">winds;</span> and he <span class=\"wl wl-kjv\" data-code=\"H8505\">weigheth</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> by measure.","26":"When he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H2706\">decree</span> for the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> for the <span class=\"wl wl-kjv\" data-code=\"H2385\">lightning</span> of the thunder:","27":"Then did he <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> it; he <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> it, yea, and searched it out.","28":"And unto <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> that is <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom;</span> and to <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is understanding."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"er is","tekst":"Job, vertoond hebbende dat God ook enige bozen in dit leven straft, hoewel niet allen, en merkende dat zijn vrienden dit niet verstaan konden, wil nu leren dat de oordelen Gods voor ons onbegrijpelijk zijn en dat de mens wel vernuftig is om veel aardse dingen uit te vinden en te begrijpen, vs.1,2, enz., maar niet om de redenen der wonderbare regering Gods te doorgronden, onder, vs.12, enz."},{"catchword":"uitgang,","tekst":"Dat is, plaatsen in de aarde, waar het uitgegraven wordt. Om deze uit te vinden het zilver van aarde, steen en andere metalen te onderscheiden, heeft de mens wetenschap genoeg; en alzo in het volgende."},{"catchword":"dat zij smelten","tekst":"Te weten, de kunstenaars, of waar het gesmolten wordt. Zie boven, Job 4:19 ."}],"2":[{"catchword":"stof","tekst":"Dat is, uit de aarde."},{"catchword":"steen","tekst":"Welken sommigen cadmiam noemen, voegende daarbij den steen chalcitem, uit welken men meent dat het koper gemaakt wordt; Plin. natural. Histor. lib. 34, cap. 1 en 2. Anderen vertalen deze woorden: De steen wordt [tot] koper gegoten. Of, de steen giet het koper uit. Of, [uit] gegoten steen [komt] koper."}],"3":[{"catchword":"Het einde,","tekst":"Dat is, de uiterste grenzen van alle groeven, kuilen, holen en spelonken der aarde."},{"catchword":"dat God","tekst":"Anderen voegen hier in het woord mens, en vertalen vs.3 aldus: [De mens] stelt een einde voor de duisternis en voor alle voleinding, die hij onderzoekt, als het gesteente der donkerheid en des doods schaduw."},{"catchword":"duisternis,","tekst":"Versta de dingen, die in het allerdiepste en duisterste der aarde verborgen liggen, als metalen, gesteenten, enz., gelijk blijkt uit de volgende woorden."},{"catchword":"al het uiterste","tekst":"Of, alle volmaaktheid; datis al wat dienstig is om enige werken daaruit of daarmede te maken."},{"catchword":"hij","tekst":"Te weten, de mens."},{"catchword":"donkerheid","tekst":"Dat is, hetwelk in het donker is. Van des doods schaduw, zie boven, Job 3:5 ."}],"4":[{"catchword":"Breekt","tekst":"Dat is, zo het gebeurt dat het hof der mijn, waar men enige metalen of gesteenten uitgraaft, vol water wordt, hetwelk daarin zakt en inbreekt van enige naburige plaats, verlatende alzo zijn oude groef en degenen, die daarbij woonden."},{"catchword":"de wateren","tekst":"Te weten, der beek."},{"catchword":"vergeten","tekst":"Dat is, welke wateren de voet des mensen niet doorgaan kan vanwege de grote diepte. De zin is, hoewel de wateren, die uit den voorgemelden vloed in de mijn vallen, zo diep zijn dat zij van den voet des mensen vergeten zijn, dat is, niet kunnen doorgaan worden, nochtans worden zij door de kunst en den arbeid des mensen uitgeput dat zij wegraken. Of aldus: [Daar de wateren] van den voet vergeten waren; dat is, waar tevoren geen water was geweest, of enig van den voet gevoeld."}],"5":[{"catchword":"het brood voort,","tekst":"Dat is, het koren, waaruit het brood gebakken wordt."},{"catchword":"wordt","tekst":"Dat is, heeft binnen in zich aderen en lagen van sulfer en vurige stof, die de mensen weten uit te vinden."}],"6":[{"catchword":"Haar stenen","tekst":"Te weten, der aarde."},{"catchword":"zijn de plaats","tekst":"Dat is, hebben bij zich saffierstenen, die de mijnwerkers uitgraven. Zie van dit gesteente ook onder, vs.16; idem Exo 24:10 , en Exo 28:18 ; Son 5:14 ."},{"catchword":"zij heeft","tekst":"Te weten, die plaats."},{"catchword":"stofjes","tekst":"Dat is, zandjes van goud, die onder de aarde gemengd zijn en daaruit, door het vernuft en werk des mensen, gezameld en gescheiden worden."}],"7":[{"catchword":"roofvogel","tekst":"Versta, een soort van een vogel, die gierig tot roven zijnde, zeer nauw de verborgen plaatsen doorzoekt."},{"catchword":"pad","tekst":"Te weten, om tot de voorgemelde plaatsen te geraken."},{"catchword":"kraai","tekst":"Van welke men schrijft, dat zij een zeer scherp gezicht heeft. Zie Lev 11:14 ."}],"8":[{"catchword":"jonge","tekst":"Hebreeuws, de zonen van het, enz. Vergelijk onder, Job 41:25 ."},{"catchword":"het niet betreden,","tekst":"Dat is, het pad of de steeg, welke leidt naar de plaats des gouds en der edelgesteenten. Versta hierbij: Hoewel geen dieren tot die plaats kunnen indringen, door enige uitnemendheid die in hen is, dat nochtans de mens zulks doen kan door zijn vernuft en arbeid."}],"9":[{"catchword":"Hij legt","tekst":"Te weten, de mens."},{"catchword":"keiachtige","tekst":"Dat is, de allerhardste steenrotsen."},{"catchword":"hij keert","tekst":"Te weten, met die te verdelen, te effenen, uit te hollen, enz. om metalen en gesteenten daaruit te halen, of om vloeden, beken en fonteinen daaruit te trekken, of om het land tot de bouwing bekwaam te maken."}],"10":[{"catchword":"houwt hij","tekst":"Splijt, of klieft hij rivieren; dat is, hij maakt groeven in de rotsen, om het water daarin te lokken, die dan tot rivieren en beken of andere gebruiken dienen zouden."},{"catchword":"het kostelijke","tekst":"Als goud, zilver en edelgesteenten, die, in de aarde verborgen liggende, door het graven van den mens ontdekt worden."}],"11":[{"catchword":"rivieren toe,","tekst":"Te weten, die onder de aarde verborgen zijn."},{"catchword":"traan","tekst":"Hebreeuws, van het geween, of getraan; dat is, dat er geen water daarvan kan opbreken en uitvloeien in de mijnen. Versta, dat de mens de rivieren toedamt en opdroogt, waardoor het kostelijke, dat daarin verborgen was, ontdekt wordt."}],"12":[{"catchword":"Maar de wijsheid,","tekst":"Alsof hij zeide: De mens kan wel kostelijke dinge, die in de aarde verborgen zijn, door zijn wetenschap en arbeid uitvinden, maar die verborgen wijsheid, waardoor de redenen van Gods oordelen ten volle verstaan worden, kan hij niet bekomen."}],"13":[{"catchword":"der levenden","tekst":"Dat is, onder de mensen, die op de aarde leven. Vergelijk Psa 27:13 , en Psa 142:6 ; Isa 38:11 , en Isa 53:8 ."}],"14":[{"catchword":"afgrond","tekst":"Versta, de diepte der wateren, die onder de aarde, ja in het onderste derzelve zijn. Zie Gen 1:2 ."},{"catchword":"de zee","tekst":"Versta, het deel der zee, dat boven op de aarde drijft. Vergelijk Gen 1:10 ."}],"15":[{"catchword":"gesloten goud","tekst":"Zie 1Ki 6:20 ."}],"16":[{"catchword":"Ofir,","tekst":"Zie 1Ki 9:28 ."},{"catchword":"Schoham,","tekst":"Zie Gen 2:12 . Velen houden dezen steen voor den onyxsteen, of sardonix, wiens kleur is wit en rood ineengemengd, gelijk de nagelen des mensen."},{"catchword":"Saffier","tekst":"Een edelgesteente van hemelse kleur, blinkende met gouden stipJes."}],"17":[{"catchword":"kristal","tekst":"Anders, zeer blinkende parel, of den diamant."},{"catchword":"kleinood","tekst":"Hebreeuws, vat. Zie Gen 24:53 ; Num 31:50 ; 1Sa 6:8 ; 2Ki 20:13 ; Est 1:7 ."},{"catchword":"dicht goud","tekst":"Zie 1Ki 10:18 ."}],"18":[{"catchword":"De Ramoth","tekst":"Eenigen verstaan door dit woord koraal, anderen een edelgesteente, genaamd sandastros, of garamantites."},{"catchword":"Gabisch","tekst":"De naam [naar eniger gevoelen] van een parel, groeiende in de schelp van een vis, bij de Latijnen genaamd unio, omdat geen twee onderscheiden wassen. Anderen verstaan daardoor een zeker edelgesteente."},{"catchword":"niet gedacht","tekst":"Te weten, als men gewag maakt van de waarde der wijsheid."},{"catchword":"Robijnen","tekst":"Het woord betekent een gesteente, dat rood van kleur geweest is, uit hetgeen verhaald wordt Lam 4:7 ."}],"19":[{"catchword":"Topaas van Morenland","tekst":"Een edelgesteente van groene kleur. Zie van hetzelve Exo 28:17 , en Exo 39:10 ."}],"21":[{"catchword":"voor het gevogelte","tekst":"Hij noemt de vogelen, omdat zij hoog vliegen en ver zien, en nochtans niet geraken kunnen tot de plaats, waar de wijsheid verborgen is; want de volmaakte wijsheid is alleen te vinden in God, die daarvan den redelijken creaturen zoveel mededeelt als het Hem belieft."}],"22":[{"catchword":"Het verderf","tekst":"Hij verdeelt alle plaatsen in drieën: in de middelste, waarin de levende mensen zijn, in de hoogste, waarin de vogelen vliegen, en in de onderste, waarin de doden zijn en al wat vergaan is. Vergelijk hiermede boven, de aantekening Job 26:6 ."},{"catchword":"Haar gerucht","tekst":"Te weten, der verborgen wijsheid. De zin is dat zij van deze geen kennis hebben, maar alleen een gerucht dat zij in wezen is. Vergelijk boven, vs.14."}],"23":[{"catchword":"God verstaat","tekst":"Dat is, niemand anders dan God."},{"catchword":"weg,","tekst":"Dat is, de wijze hoe men de wijsheid vinden kan, hoedanig zij is, en welke werkingen zij heeft, en welk beleid en einde daarin."},{"catchword":"hare plaats","tekst":"Te weten, waar zij te vinden is, namelijk alleen in Hemzelf; Mat 11:27 ."}],"24":[{"catchword":"tot aan de einden der aarde,","tekst":"De zin is, dat Gods wijsheid oneindig en onbepaald is; 1Co 2:10 ; Heb 4:13 ."}],"25":[{"catchword":"Als Hij","tekst":"Hij wil zeggen dat de wijsheid, die in God verborgen is, zich enigszins geopenbaard heeft door de schepping der wereld."},{"catchword":"den wind","tekst":"De zin is dat God allen schepselen naar zijne wijsheid niet alleen het wezen heeft gegeven, maar dat Hij hen ook heeft gesteld in orde, gewicht en maakt, en dezelve ingestort hun eigenschappen en manieren van werkingen."}],"26":[{"catchword":"orde maakte,","tekst":"Te weten, hoe, waar, wanneer en waartoe Hij den regen, donder, bliksem, enz., zou laten vallen."},{"catchword":"een weg","tekst":"Vergelijk onder, Job 38:25 ."},{"catchword":"der donderen;","tekst":"Hebreeuws, der stemmen. Alzo Exo 9:23 ; 1Sa 7:10 ; onder, Job 37:4-5 ; Psa 29:3 ."}],"27":[{"catchword":"zag Hij","tekst":"Vergelijk Gen 1:31 ."},{"catchword":"haar,","tekst":"Te weten, de wijsheid, van welke hier gesproken wordt."},{"catchword":"vertelde ze;","tekst":"Dat is, openbaarde haar, en gaf den mensen stof om die te vertellen en te verkondigen."},{"catchword":"schikte ze,","tekst":"Dat is, Hij ordineerde haar tot het einde, waartoe Hij haar geopenbaard had."},{"catchword":"doorzocht Hij ze","tekst":"Dat is, Hij toonde dat Hij haar met de allervolmaakste doorzoeking en allerwijste bedenking de mensen voorgesteld had, opdat zij die met eerbied nazoeken en met ootmoed vereren zouden."}],"28":[{"catchword":"de vreze des HEEREN","tekst":"Alsof Hij zeide: De verborgen wijsheid, waardoor Ik de wereld en daarin de mensen regeer, is voor mij; maar de wijsheid, die Ik voor de mensen behouden heb, is dat zij mij vrezen naar het voorschrift van mijn geopenbaarden wil. Zie Deu 29:29 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Certainly [Job having shewed that God doth punish likewise some of the wicked in this life, although not all, and perceiving that his friends were not able to understand this, teacheth now, that the Judgements of God are incomprehensible for us, and that man hath indeed wit and ability enough, to find out and comprehend many earthly things, here c.1,2, &c. But is not able to search out the grounds and reasons of the wonderful government of God, below v.22. &c.] there is an issue for the silver, [i.e. places in the earth, out of which it is digged. For the finding out of this, and to discern and sever the silver in its ore from earth, stones and baser metals, man hath wit and knowledge enough: and so in the sequel.] and a place for the gold, that they melt. [they, viz. The artificers, miners and refiners. Or, there where it is melted. See above 4.on v.19.]"}],"2":[{"catchword":null,"tekst":"The iron is taken out of the dust. [i.e. out of the earth] and copper is melted out of stone. [by some called Cadmia, mixing therewith the stone Chalcitis, whence it is thought that copper is made. Plinius natural. Hist Lib.34.chap.1. and 2. Oth. Render this place the stone is molten into copper. Or the stone doth power out the copper. Or out of molten stone cometh copper.]"}],"3":[{"catchword":null,"tekst":"The end [i.e. the utmost bounds of all mines, caves, caverns, holes of the Earth] (which God) [others insert here the word man, and read this v. Thus. Man setteth an end for the darkness, and for all accomplishment, which he searcheth, as the stones of darkness, [understand the things that lie most abstruse in the deepest and darkest parts of the earth, as metals, minerals, precious stones, etc. As appeareth by the words following.] and the very uttermost [Oth. All perfection, i.e. whatsoever is serviceable for to make anything of it, or by it.] he [viz. Man] searcheth into: the stones of darkness, [i.e. which lay hid in the dark] and the shadow of death. [See of that above chap.3.on v.5.]"}],"4":[{"catchword":null,"tekst":"If a brook break through by him that dwelleth there: [i.e. if it happen, or fall out, that the hole of the mine, out of which some metals or stones are digged, growth full of waters, which sappeth and breaketh in there, from some neighbouring place; forsaking thus the old channel, and those that dwell by it.] (the waters) [viz. Of that brook] being forgotten of the foot [i.e. which waters the foot of man is not able any more or pass or wade through, because of the great depth] are drawn out by man and pass away. [the meaning is; for all that the waters, which fall out of the foresaid brook into the mine, be so deep, that they are forgotten by mans foot, i.e. cannot be waded through; nevertheless by the industry and labour of man, they are drawn out and gotten away. Or thus (when the waters) of the foot were forgotten, i.e. where there was no water before, or none felt by the foot.]"}],"5":[{"catchword":null,"tekst":"Out of the earth cometh forth bread; [i.e. the corns of which the bread is made and baken] and underneath it is altered, as if it were fire [i.e. the earth hath her veins and gifts of sulphur and other fiery material, which men know how to find out.]"}],"6":[{"catchword":null,"tekst":"The stones [viz. Of the Earth] are the place of the Saphir: [i.e. have among them, or contain the Saphir-stones, which the miners are digging out. See of these stones also below v.16. Item Exo 24:10. and 28.18. Cant.5 14.] and it [that place namely] hath small dust of gold, [i.e. grains, or sands of gold which are mixed with the earth, and by the industry and labour of man gathered and severed.]"}],"7":[{"catchword":null,"tekst":"The bird of prey [understand a certain kind of fowl, which being very greedy for prey, doth very narrowly search all hidden places] hath not known the path; [viz. To get unto any of the foresaid places.] and the eye of the crow [which as writers testify, are very sharp-sighted. See Levit.11.on v.14.] hath not seen it."}],"8":[{"catchword":null,"tekst":"The young haughty beasts [Heb. The sons of the wild beast. Compare below chap.41.25.] have not trodden it: [the path namely, or descent which leadeth to the place of the gold and precious stones. Understand hereby, that although no kind of beasts, by any excelling quality of theirs before others, is able to find out or make its way unto place; yet man is able to do it by his labour and industry.] the fell Lion hath not passed over it."}],"9":[{"catchword":null,"tekst":"He [man namely] layeth his hand on the flinty (rock): [on the very hardest stony rock that is.] he overturneth the hills by the roots. [viz. By piercing, darting, levelling, undermining them, etc. Far to search metals, minerals and precious stones thence, or to draw forth brooks, floods, streams and fountains out them? Or to make the Country sit and proper for tilling and building.]"}],"10":[{"catchword":null,"tekst":"In the stony rocks he heweth out streams; [Heb. He splitteth, or cleaveth rivers, i.e. he maketh channels in the rocks, to derive the water into them, that may serve afterwards for rivers or brooks, or other uses.] and his eye seeth all the preciousness [as gold, silver and precious stones, which lying hid in the Earth, come to be discovered to men by hewing and digging.]"}],"11":[{"catchword":null,"tekst":"He hindeth up the Rivers, [which are hid under ground] that not a tear cometh forth. [Heb. From weeping or shedding tears, i.e. that no water at all can break forth, or issue thence into the mines. Understand that men do dam up and dry up the rivers, whereby the precious things which lay hid in them, are discovered.] and that which was hidden, he bringeth forth into the light."}],"12":[{"catchword":null,"tekst":"But wisdom, from whence shall she be found? And where is the place of understanding? [as if he said, man is able indeed by his labour and industry, to find out many precious things which lie hidden in the Earth; but he is not able to attain to the secret wisdom, whereby the causes of Gods judgements may be fully dived into and comprehended.]"}],"13":[{"catchword":null,"tekst":"Man knows not her worth; and he is not to be found in the land of the living, [i.e. among man, that live here upon the earth. Compare Ps. 27.13 and 142.6. Isa. 38.11 and 53.8.]"}],"14":[{"catchword":null,"tekst":"The abyss [Understand the depths of the waters that are under the earth, yea in the very nethermost part of it. See Gen.1.on v.2.] saith; she is not in me; and the sea, [understand that part of the Sea, which floateth uppermost upon the Earth. Compare Gen.1.on v.10.] saith; she is not with me."}],"15":[{"catchword":null,"tekst":"The enclosed gold [or gold lock up. See 1 Kings 6.on v.20.] can not be given for her; and her price can not be weighed up with silver."}],"16":[{"catchword":null,"tekst":"She can not he estimated against fine gold of Ophir, [See 1 Kings 9.on v.28.] against the precious Shoham [See Gen.2.on v.12. Many hold this to be the onix or sardonix-stone, whose colour is a mixed one of white and red, like the nails on a mans hand.] or the saphyr [a precious stone of a sky colour, glimmering with golden dipples.]"}],"17":[{"catchword":null,"tekst":"One cannot value the gold or the Christal alike with her [Oth. // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
