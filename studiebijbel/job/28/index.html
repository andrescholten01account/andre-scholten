, "Jer 4:11": "In die tijd zal tegen dit volk en tegen Jeruzalem gezegd worden: Een dorre wind van de hoge plaatsen in de woestijn, op de weg naar de dochter van Mijn volk; niet om te wannen, of om te zuiveren.", "1 Tess 4:3": "Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jes 42:5": "Zo zegt God, de HEERE, Die de hemelen geschapen en ze uitgebreid heeft, Die de aarde uitgespannen heeft, en wat daaruit voortkomt; Die aan het volk dat daarop is, de adem geeft, en de geest aan hen die daarop wandelen:", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Job 37:5": "God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Jes 37:28": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woede tegen Mij.", "Ps 136:6": "Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig.", "Job 37:15": "Weet u wanneer God daarover orde stelt, en het licht van Zijn wolk laat schijnen?", "Jer 4:12": "Er zal Mij een wind komen, die hun te sterk zal zijn. Nu zal Ik ook een oordeel tegen hen uitspreken.", "Matt 28:3": "Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw.", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "Ps 119:168": "Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Ps 78:48": "Ook gaf Hij hun vee over aan de hagel, en hun beesten aan de vurige kolen.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Ex 3:20": "Want Ik zal Mijn hand uitstrekken, en Egypte slaan met al Mijn wonderen die Ik in het midden ervan doen zal; daarna zal hij u laten vertrekken.", "1 Kor 8:12": "Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Matt 11:19": "De Zoon des mensen is gekomen, etend en drinkend, en zij zeggen: Zie daar, een Mens, Die een vraat en wijnzuiper is, een Vriend van tollenaars en zondaars. Maar de Wijsheid is gerechtvaardigd door haar kinderen.", "Ef 4:20-24": "Maar u hebt Christus zo niet geleerd; Als u naar Hem hebt geluisterd, en door Hem geleerd bent, zoals de waarheid in Jezus is; Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "Mark 12:32-34": "En de schriftgeleerde zei tegen Hem: Meester, U hebt naar waarheid goed gezegd dat er een enig God is, en er is geen ander dan Hij; en Hem lief te hebben uit heel het hart, en uit heel het verstand, en uit heel de ziel, en uit heel de kracht; en de naaste lief te hebben als zichzelf, is meer dan alle brandoffers en slachtoffers. En Jezus zag dat hij verstandig geantwoord had, en zei tegen hem: U bent niet ver van het Koninkrijk van God. En niemand durfde Hem meer iets te vragen.", "Deut 8:9": "Een land waarin u brood zult eten zonder gebrek, waarin u niets ontbreken zal; een land waarvan de stenen ijzer zijn, en uit welks bergen u koper zult uithouwen.", "Matt 6:8": "Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "Jes 33:6": "En het zal gebeuren, dat de vastheid van uw tijden, de sterkte van uw redding, wijsheid en kennis zal zijn; de vrees voor de HEERE zal Zijn schat zijn.", "Ps 107:29": "Hij doet de storm stilstaan, zodat hun golven zwijgen.", "Nahum 1:4-6": "Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen. Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Luk 10:18": "En Hij zei tegen hen: Ik zag de satan als een bliksem uit de hemel vallen.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "2 Petr 3:5-7": "Want willens en wetens is dit hun onbekend, dat door het woord van God de hemelen er van oudsher geweest zijn, en de aarde ontstaan is uit het water en door het water in stand blijft; Doordat de wereld die er toen was, met water bedekt werd door de zondvloed, is vergaan. Maar de hemelen die er nu zijn, en de aarde, zijn door datzelfde woord als een schat weggelegd, en worden voor het vuur bewaard tegen de dag van het oordeel en van het verderf van de goddeloze mensen.", "Num 14:27": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Luk 1:75": "in heiligheid en gerechtigheid voor Hem, al de dagen van ons leven.", "Hand 15:8": "En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;", "Ps 85:14": "De gerechtigheid zal voor Zijn aangezicht heengaan, en Hij zal ze zetten op de weg van Zijn voetstappen.", "Luk 21:25": "En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Ps 104:8": "De bergen rezen op, de dalen daalden, naar de plaats die U voor hen gegrond had.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "Dan 2:22": "Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.", "Rom 13:12-14": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen. Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie; Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Job 12:17": "Hij voert de raadsheren beroofd weg, en de rechters maakt Hij uitzinnig,", "Job 8:10": "Zullen zij u niet leren, tot u spreken, en uit hun hart woorden voortbrengen?", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "Deut 14:2": "Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Openb 18:16": "En zeggen: Wee, wee, de grote stad, die bekleed was met fijn linnen, en purper, en scharlaken, en versierd met goud, en met kostbaar gesteente, en met parels; want in één uur is zo'n grote rijkdom verwoest.", "Dan 11:33": "En de leraren van het volk zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenschap en door beroving, vele dagen lang.", "Hos 13:15": "Want hij zal vrucht voortbrengen onder de broeders; toch zal er een oostenwind komen, een wind van de Heere, opkomend uit de woestijn; en zijn bron zal uitdrogen, die zal de schat van alle kostbare voorwerpen roven.", "Jer 49:19": "Zie, gelijk een leeuw uit de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hem in een ogenblik daaruit doen wegrennen; en wie daartoe uitverkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden, en wie is die herder die voor Mijn aangezicht bestaan zou?", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Ps 2:10": "Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Ps 95:5": "Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Ps 49:5": "Ik zal mijn oor neigen tot een spreuk; ik zal mijn verborgen rede openen op de harp.", "Spr 22:3": "Een verstandig mens ziet het kwaad en verbergt zich; maar de eenvoudigen gaan door en worden gestraft.", "Dan 10:6": "En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.", "Matt 5:29": "Als dan uw rechteroog u ergert, ruk het uit en werp het van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Rom 8:24-26": "Want wij zijn in hoop gered. De hoop nu, die gezien wordt, is geen hoop; want wat iemand ziet, waarom zou hij dat nog hopen? Maar als wij hopen wat wij niet zien, dan verwachten wij het met volharding. En evenzo komt ook de Geest onze zwakheden te hulp; want wij weten niet wat wij bidden moeten zoals het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchten.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Jes 48:3": "De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snel gedaan, en zij zijn gekomen;", "Kol 3:12-15": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld; verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo. En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Spr 3:13-26": "Gelukkig is de mens die wijsheid vindt, en de mens die verstandigheid voortbrengt! Want haar koophandel is beter dan de koophandel van zilver, en haar inkomst dan het uitgegraven goud. Zij is kostbaarder dan robijnen; en alles wat u kan verlangen, is met haar niet te vergelijken.", "Job 7:8": "Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn.", "1 Joh 4:6": "Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Spr 26:1": "Zoals de sneeuw in de zomer, en zoals de regen in de oogst, zo past de eer de dwaas niet.", "Pred 1:6": "Zij gaat naar het zuiden, en zij gaat om naar het noorden; de wind gaat steeds ronddraaiend, en de wind keert weer terug in zijn kringloop.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Spr 7:2-4": "Bewaar mijn geboden, en leef, en mijn wet als de appel van uw ogen. Bind ze aan uw vingers, schrijf ze op de tafel van uw hart. Zeg tegen de wijsheid: U bent mijn zuster; en noem het verstand uw bloedverwant;", "Jes 11:9": "Men zal nergens leed doen of verderven op de hele berg van Mijn heiligheid; want de aarde zal vol zijn van kennis van de HEERE, zoals het water de bodem van de zee bedekt.", "2 Petr 1:2-8": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Matt 13:46": "Die, toen hij één parel van grote waarde gevonden had, heenging en alles verkocht wat hij had, en die kocht.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "Openb 9:1": "En de vijfde engel heeft op de bazuin geblazen, en ik zag een ster, gevallen uit de hemel op de aarde, en haar werd de sleutel gegeven van de put van het afgrond.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "1 Petr 1:14-16": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had; maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel; want er staat geschreven: Wees heilig, want Ik ben heilig.", "Pred 1:13": "En ik richtte mijn hart erop om met wijsheid te onderzoeken en na te speuren alles wat er gebeurt onder de hemel. Deze moeilijke bezigheid heeft God de kinderen der mensen gegeven, om zich daarmee bezig te houden.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "1 Kor 13:12": "Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Spr 8:19": "Mijn vrucht is beter dan uitgegraven goud, en dan zuiver goud; en Mijn inkomen dan uitgelezen zilver.", "Spr 27:1": "Beroem u niet over de dag van morgen; want u weet niet, wat de dag zal baren.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "2 Tim 2:17": "En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;", "Jes 13:12": "Ik zal maken dat een man kostbaarder zal zijn dan zuiver goud, en een mens dan fijn goud van Ofir.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 24:2": "Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Ps 104:5": "Hij heeft de aarde gegrond op haar fundamenten; zij zal nooit meer, ook niet eeuwig, wankelen.", "1 Kor 4:5": "Oordeel dan niets vóór de tijd, totdat de Heere gekomen zal zijn, Die ook in het licht zal brengen wat in de duisternis verborgen is, en de plannen van de harten openbaar zal maken; en dan zal ieder lof van God ontvangen.", "Ps 136:5-9": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "2 Kron 6:30": "Hoor U dan uit de hemel, de vaste plaats van Uw woning, en vergeef, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van de kinderen der mensen;", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Jes 17:7": "Op die dag zal de mens zien naar Hem, Die hem gemaakt heeft, en zijn ogen zullen op de Heilige van Israël zien.", "1 Tess 4:7": "Want God heeft ons niet geroepen tot onreinheid, maar tot heiliging.", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Deut 31:21": "En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "Job 28:1-28": "Zeker, er is voor het zilver een uitgang, en een plaats voor het goud, waar zij het smelten. Het ijzer wordt uit het stof genomen, en uit steen wordt koper gegoten. Het einde, dat God gesteld heeft voor de duisternis, en al het uiterste onderzoekt hij; het gesteente van de donkerheid en van de schaduw des doods.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Jes 61:9-11": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft. Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden. Want zoals de aarde haar spruit voortbrengt, en zoals een tuin datgene wat erin gezaaid is, laat uitspruiten, zo zal de Heere HEERE gerechtigheid en lof laten uitspruiten voor alle volken.", "Ezech 38:20": "Zodat voor Mijn aangezicht zullen beven de vissen van de zee, en het gevogelte van de hemel, en het gedierte van het veld, en al het kruipende gedierte, dat op de aarde kruipt, en alle mensen die op de aardbodem zijn; en de bergen zullen neergeworpen worden, en de steile plaatsen zullen neervallen, en alle muren zullen ter aarde neervallen.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "Gen 1:31": "En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Pred 12:13": "Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.", "Job 38:35": "Kunt u de bliksemen uitlaten, dat zij heengaan, en tot u zeggen: Zie, hier zijn wij?", "Ps 74:17": "U hebt al de grenzen van de aarde gesteld; zomer en winter, die hebt U gevormd.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Ps 104:15": "En de wijn, die het hart van de mens verheugt, zodat het gezicht blinkt van olie; en het brood, dat het hart van de mens sterkt.", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Openb 8:7": "En de eerste engel heeft op de bazuin geblazen, en er kwam hagel en vuur, gemengd met bloed, en die werden op de aarde geworpen; en het derde deel van de bomen is verbrand, en al het groene gras is verbrand.", "Spr 9:14-18": "En zij zit aan de deur van haar huis, op een stoel, op de hoge plaatsen van de stad; om te roepen naar hen die op de weg voorbijgaan, die hun paden recht maken: Wie is eenvoudig? Hij keert zich hierheen; en tegen wie geen verstand heeft, zegt zij:", "Openb 8:12": "En de vierde engel heeft op de bazuin geblazen, en het derde deel van de zon werd getroffen, en het derde deel van de maan, en het derde deel van de sterren; zodat het derde deel daarvan verduisterd zou worden, en het derde deel van de dag niet zou lichten; en van de nacht evenzo.", "Spr 19:20": "Hoor raad, en neem tucht aan, opdat u in uw laatste jaren wijs bent.", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Spr 10:8": "Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Ps 21:4": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud.", "Hand 2:20": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat de grote en luisterrijke dag van de Heere komt.", "Spr 8:11": "Want wijsheid is beter dan robijnen, en al wat men begeren mag, is met haar niet te vergelijken.", "Job 12:13": "Bij Hem is wijsheid en macht; Hij heeft raad en verstand.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Ef 4:11-13": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars; Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus; Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Jer 2:15": "De jonge leeuwen hebben over hem gebruld, zij hebben hun stem verheven; en zij hebben zijn land verwoest gemaakt; zijn steden zijn verbrand, zodat er niemand in woont.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Gen 1:10": "En God noemde het droge aarde, en het samengevloeide water noemde Hij zeeën; en God zag dat het goed was.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Spr 1:5": "Die wijs is, zal horen, en zal in leer toenemen; en die verstandig is, zal wijze raad bekomen;", "Matt 24:27": "Want zoals de bliksem uitgaat vanuit het oosten en schijnt tot het westen, zo zal ook de komst van de Zoon des mensen zijn.", "Spr 8:26-29": "Hij had de aarde nog niet gemaakt, noch de velden, noch het begin van de stofjes van de wereld. Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef; Toen Hij de opperwolken van boven vestigde; toen Hij de fonteinen van de afgrond vastmaakte;", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Job 37:19": "Onderricht ons, wat wij Hem zeggen zullen; want wij zullen niets ordentelijk kunnen voorstellen vanwege de duisternis.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Job 38:24-29": "Waar is de weg, daar het licht verdeeld wordt, en de oostenwind zich verstrooit op de aarde? Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is;", "Matt 13:17": "Want voorwaar, Ik zeg u, dat veel profeten en rechtvaardigen begeerd hebben te zien wat u ziet, en het niet gezien hebben; en te horen wat u hoort, en het niet gehoord hebben.", "Job 11:11": "Want Hij kent de ijdele mensen, en Hij ziet de ondeugd; zou Hij dan niet opmerken?", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Job 34:21": "Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Job 28:9-11": "Hij legt zijn hand aan de keiachtige rots, hij keert de bergen vanaf de wortel om. In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke. Hij bindt de rivier toe, zodat er geen traan uitkomt, en het verborgene brengt hij aan het licht.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Lev 11:14": "En de gier, en de kraai, naar hun soort;", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Ps 19:11": "Zij zijn begeerlijker dan goud, ja, dan veel fijn goud; en zoeter dan honing en honingzeem.", "Gen 2:12": "En het goud van dit land is goed; daar is ook bedolah, en de steen sardonix.", "Job 28:8-11": "De jonge hoogmoedige dieren hebben het niet betreden, de felle leeuw is er niet overheen gegaan. Hij legt zijn hand aan de keiachtige rots, hij keert de bergen vanaf de wortel om. In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke.", "Gen 1:1-28": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Spr 22:17-21": "Neig uw oor, en luister naar de woorden van de wijzen, en richt uw hart op mijn kennis; want het is aangenaam, als u die in uw binnenste bewaart; ze zullen samen op uw lippen gepast worden. Opdat uw vertrouwen op de HEERE is, maak ik ze u vandaag bekend, ja, aan u.", "Spr 8:26-32": "Hij had de aarde nog niet gemaakt, noch de velden, noch het begin van de stofjes van de wereld. Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef; Toen Hij de opperwolken van boven vestigde; toen Hij de fonteinen van de afgrond vastmaakte;", "Deut 18:13": "Oprecht zult u zijn met de HEERE, uw God.", "Job 10:8": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Spr 29:3": "Een man die de wijsheid liefheeft, verblijdt zijn vader; maar wie omgaat met hoeren, brengt zijn bezit door.", "Gen 2:6": "Maar een damp steeg op uit de aarde, en bevochtigde de hele aardbodem.", "1 Kor 5:7": "Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus.", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Openb 11:6": "Dezen hebben macht om de hemel te sluiten, zodat het geen regen regent in de dagen van hun profeteren; en zij hebben macht over de wateren, om die in bloed te veranderen, en om de aarde te slaan met allerlei plaag, zo vaak als zij willen.", "1 Kron 29:2-5": "Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed. En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb; Drieduizend talenten goud, van het goud van Ofir, en zevenduizend talenten gelouterd zilver, om de wanden van de huizen mee te bekleden;", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Rom 7:6": "Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "Jer 51:19": "Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Amos 9:2-4": "Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten. En al gingen zij in gevangenschap voor het aangezicht van hun vijanden, dan zal Ik vandaar het zwaard gebieden, dat het hen doodt; en Ik zal Mijn oog tegen hen richten ten kwade, en niet ten goede.", "Jer 33:2": "Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "Mark 13:19": "Want die dagen zullen zo'n verdrukking zijn, zoals er niet geweest is vanaf het begin van de schepping die God geschapen heeft, tot nu toe, en er ook niet meer zal zijn.", "Ezech 24:11": "Zet hem daarna leeg op zijn kolen, opdat hij heet wordt, en zijn roest verbrandt, en zijn onreinheid in zijn midden smelt, zijn schuim verteerd wordt.", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "Spr 12:1": "Wie de tucht liefheeft, heeft de wetenschap lief; maar wie de bestraffing haat, is redeloos.", "Job 10:16": "Want het verheft zich; als een felle leeuw jaagt U mij; U keert weer en stelt U wonderlijk tegen mij.", "Ps 104:20": "U beschikt de duisternis, en het wordt nacht, waarin al het gedierte van het woud uittreedt.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Ps 119:91": "Naar Uw verordeningen blijven zij nog heden staan, want zij allen zijn Uw knechten.", "Gen 4:22": "En Zilla baarde ook Tubal-kaïn, een leermeester van allen die met koper en ijzer werken; en de zuster van Tubal-kaïn was Naäma.", "Ps 103:22": "Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "1 Kor 10:21": "U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "Jes 45:3": "En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Ps 104:19": "Hij heeft de maan gemaakt tot vaste tijden, de zon weet haar ondergang.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Jes 54:11": "U verdrukte, door onweer voortgedrevene, ongetrooste! Zie, Ik zal uw stenen helemaal sierlijk leggen, en Ik zal u op saffieren grondvesten.", "Luk 6:45": "De goede mens brengt het goede voort uit de goede schat van zijn hart; en de slechte mens brengt het kwade voort uit de kwade schat van zijn hart; want uit de overvloed van het hart spreekt zijn mond.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Matt 16:2": "Maar Hij antwoordde en zei tegen hen: Als het avond geworden is, zegt u: Mooi weer; want de hemel is rood;", "Ps 12:7": "De woorden van de HEERE zijn reine woorden, zilver, gelouterd in een aarden smeltkroes, gezuiverd zevenmaal.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Spr 19:8": "Die verstand krijgt, heeft zijn ziel lief; hij neemt de verstandigheid waar, om het goede te vinden.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "Spr 15:3": "De ogen van de HEERE zijn in alle plaatsen, en zien de kwaden en de goeden.", "Openb 17:4": "En de vrouw was bekleed met purper en scharlaken, en versierd met goud en kostbaar gesteente en parels, en had in haar hand een gouden drinkbeker, vol van gruwelen en van de onreinheid van haar hoererij.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Job 26:7-13": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Hoogl 5:14": "Zijn handen zijn als gouden ringen, gevuld met turkoois; Zijn buik is als blinkend ivoor, overtrokken met saffieren.", "Ex 28:20": "En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.", "Spr 8:5": "Gij eenvoudigen! versta kloekzinnigheid, en gij dwazen! versta met het hart.", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Job 5:24": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen.", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "1 Petr 4:6": "Want daarom is ook aan de doden het Evangelie verkondigd, opdat zij weliswaar naar de mens in het vlees geoordeeld zouden worden, maar naar God zouden leven in de geest.", "Ps 74:16": "De dag is van U, ook is de nacht van U; U hebt het licht en de zon bereid.", "Ps 139:6": "De kennis is mij te wonderbaar, ze is hoog, ik kan er niet bij.", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "Job 9:7": "Die de zon gebiedt, en zij gaat niet op; en verzegelt de sterren;", "Fil 3:7-10": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Ps 104:6": "U had haar met de afgrond als een kleed overdekt; de wateren stonden boven de bergen.", "Spr 5:12": "En zegt: Hoe heb ik de tucht gehaat, en heeft mijn hart de bestraffing versmaad!", "Pred 6:12": "Want wie weet wat goed is voor de mens in dit leven, gedurende het aantal dagen van het leven van zijn ijdelheid, dat hij doorbrengt als een schaduw? Want wie kan de mens aanzeggen wat na hem wezen zal onder de zon?", "Ps 102:26": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen;", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Joh 1:48": "Jezus zag Nathanaël naar Zich toe komen, en zei van hem: Zie, waarlijk een Israëliet, in wie geen bedrog is.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Deut 30:2": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel.", "1 Petr 3:11": "hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Job 38:17": "Zijn u de poorten van de dood ontdekt, en hebt u gezien de poorten van de schaduw van de dood?", "Ex 3:19": "Toch weet Ik dat de koning van Egypte u niet zal laten gaan, ook niet door een sterke hand.", "Luk 8:24": "En zij gingen naar Hem toe en wekten Hem, en zeiden: Meester, Meester, wij vergaan! En Hij stond op en bestrafte de wind en de golven, en zij hielden op, en het werd stil.", "Openb 7:1": "En hierna zag ik vier engelen staan op de vier hoeken van de aarde, die de vier winden van de aarde vasthielden, zodat er geen wind zou waaien op de aarde, of op de zee, of tegen enige boom.", "Matt 13:45": "Opnieuw, het Koninkrijk der hemelen is gelijk aan een koopman, die mooie parels zoekt;", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Spr 20:15": "Goud is er, en een menigte van robijnen; maar de lippen van de wetenschap zijn een kostbaar kleinood.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Matt 24:36": "Maar die dag en dat uur kent niemand, ook de engelen van de hemelen niet, maar alleen Mijn Vader.", "Ps 33:13-15": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen. Hij ziet uit vanaf Zijn vaste woonplaats op alle inwoners van de aarde. Hij vormt hun aller hart; Hij let op al hun werken.", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Ex 11:1": "(Want de HEERE had tegen Mozes gesproken: Ik zal nog één plaag over Farao en over Egypte brengen, daarna zal hij u van hier laten trekken; als hij u geheel zal laten trekken, dan zal hij u haastig van hier uitdrijven.", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Spr 23:12": "Richt uw hart op de tucht, en uw oren op de woorden van kennis.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Job 36:32": "Met handen bedekt Hij het licht, en geeft daaraan bevel door hem die er tussendoor komt.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Jes 5:6": "En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Job 31:24": "Als ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: U bent mijn vertrouwen;", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Job 5:27": "Zie dit, wij hebben het doorzocht, het is zo; hoor het, en bemerk het voor uzelf.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Job 36:29": "Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Job 12:7-13": "En werkelijk, vraag toch de dieren, en ieder van hen zal het u leren; en de vogels van de hemel, die zullen het u bekendmaken. Of spreek tot de aarde, en zij zal het u leren; ook zullen de vissen van de zee het u vertellen. Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Spr 27:12": "De schrandere ziet het kwaad, en verbergt zich; de eenvoudigen gaan door, en worden gestraft.", "Matt 10:30": "En ook uw haren van het hoofd zijn alle geteld.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "1 Joh 3:6-10": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend. Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is. Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "1 Tess 5:22": "Onthoud u van elke schijn van het kwaad.", "Jes 60:17": "Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.", "Ps 104:30": "Zendt U Uw Geest uit, dan worden zij geschapen, en U vernieuwt het gelaat van het aardrijk.", "Job 24:23": "Geeft God hem gerustheid, dan steunt hij daarop; toch zijn Zijn ogen op hun wegen.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Job 31:4": "Ziet Hij niet mijn wegen, en telt Hij niet al mijn treden?", "Job 36:26": "Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Spr 22:13": "De luiaard zegt: Er is een leeuw buiten; ik zou wel eens midden op straat gedood kunnen worden!", "Rom 8:29": "Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Matt 6:18": "opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Openb 11:19": "En de tempel van God in de hemel is geopend, en de ark van het verbond is gezien in Zijn tempel; en er kwamen bliksems, en stemmen, en donderslagen, en aardbeving, en grote hagel.", "Spr 9:9-12": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis. De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand. Want door mij zullen uw dagen zich vermenigvuldigen, en de jaren van uw leven zullen u toegevoegd worden.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Rom 15:14": "Doch, mijn broeders, ook ik zelf ben ervan verzekerd dat u ook zelf vol bent van goedheid, vervuld met alle kennis, in staat om ook elkaar te vermanen.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Joël 2:31": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Spr 27:21": "De smeltkroes is voor het zilver, en de oven voor het goud; zo wordt een man beproefd naar zijn lof.", "Pred 1:7": "Alle beken stromen naar de zee, toch wordt de zee niet vol; naar de plaats waar de beken heen stromen, daarheen keren zij steeds weer terug.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Openb 22:1": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "2 Kor 11:2": "Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.", "Openb 4:5": "En van de troon gingen bliksemflitsen uit, en donderslagen, en stemmen; en zeven vurige lampen waren brandend voor de troon, welke de zeven Geesten van God zijn.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Ps 97:4": "Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Gen 1:12": "En de aarde bracht grasscheutjes voort, gewas dat zaad voortbrengt naar zijn aard, en vruchtdragende bomen waarvan het zaad erin zit, naar hun aard. En God zag dat het goed was.", "Luk 1:74": "dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Ps 142:4": "Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.", "Spr 13:14": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood.", "Job 8:9": "Want wij zijn van gisteren en weten niets, omdat onze dagen op de aarde een schaduw zijn.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Pred 9:13-18": "Ook heb ik onder de zon deze wijsheid gezien, en zij leek mij groot: Er was een kleine stad, en er waren maar weinig mensen in; en een groot koning kwam tegen haar op, en hij omsingelde haar, en hij bouwde grote belegeringswerken tegen haar. En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "Pred 6:11": "Voorwaar, er zijn veel dingen die de ijdelheid vermeerderen; wat heeft de mens daar meer aan?", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Ps 29:3-10": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Matt 7:6": "Geef het heilige niet aan de honden, en gooi uw parels niet voor de zwijnen; anders vertrappen ze die met hun poten, en verscheuren u nadat ze zich hebben omgekeerd.", "1 Tim 1:5": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Job 10:3": "Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft?", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Jes 1:16": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen.", "Rom 8:12": "Dus, broeders, wij zijn het niet aan het vlees verschuldigd om naar het vlees te leven.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Spr 7:6-23": "Want door het venster van mijn huis, door mijn tralie keek ik uit; En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis.", "Jes 40:26-28": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist. Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij? Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Kol 3:5-10": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is. Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid. Daarin hebt ook u eertijds gewandeld, toen u daarin leefde.", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Job 37:6-22": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Gen 23:16": "En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Spr 9:10": "De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "1 Kor 8:6": "toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "Openb 21:19": "En de fundamenten van de muur van de stad waren met allerlei kostbaar gesteente versierd. Het eerste fundament was Jaspis, het tweede Saffier, het derde Chalcedon, het vierde Smaragd.", "Spr 8:22-29": "De HEERE bezat Mij in het beginsel van Zijn weg, voor Zijn werken, van toen aan. Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water;", "Hand 1:7": "En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;", "Joël 2:30": "En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Spr 4:4-13": "Hij leerde mij, en zei tegen mij: Uw hart houdt mijn woorden vast, onderhoud mijn geboden, en leef. Verkrijg wijsheid, verkrijg verstand; vergeet niet, en wijk niet van de woorden van mijn mond. Verlaat haar niet, en zij zal u behoeden; heb haar lief, en zij zal u bewaren.", "1 Kron 16:26": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Ps 104:5-9": "Hij heeft de aarde gegrond op haar fundamenten; zij zal nooit meer, ook niet eeuwig, wankelen. U had haar met de afgrond als een kleed overdekt; de wateren stonden boven de bergen. Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Joh 3:8": "De wind waait waarheen hij wil, en u hoort zijn geluid; maar u weet niet waar hij vandaan komt en waar hij heen gaat; zo is ieder die uit de Geest geboren is.", "Jes 32:17": "En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Ps 94:9-11": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien? Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert? De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Job 26:6": "Het dodenrijk is naakt voor Hem, en geen bedekking is er voor het verderf.", "Luk 23:45": "En de zon werd verduisterd, en het voorhangsel van de tempel scheurde middendoor.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Job 28:24-27": "Want Hij schouwt tot aan de einden der aarde, Hij ziet onder al de hemelen. Toen Hij de wind het gewicht gaf, en de wateren afwoog in mate; Toen Hij voor de regen een vaste orde maakte, en een weg voor het weerlicht van de donders;", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Joh 10:14": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Openb 8:10": "En de derde engel heeft op de bazuin geblazen, en er is een grote ster, brandend als een fakkel, uit de hemel gevallen, en zij is gevallen op het derde deel van de rivieren, en op de bronnen van het water.", "Job 26:7": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets.", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Job 38:19": "Waar is de weg, daar het licht woont? En de duisternis, waar is haar plaats?", "Ps 89:48": "Gedenk wat voor eeuw ik ben; waarom zou Gij alle mensenkinderen tevergeefs geschapen hebben?", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "Ex 3:3": "En Mozes zei: Ik zal mij nu daarheen wenden, en dat grote gezicht bezien, waarom het braambos niet verbrandt.", "Job 38:16": "Bent u gekomen tot aan de oorsprongen van de zee, en hebt u in het onderste van het afgrond gewandeld?", "Rom 8:1": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest.", "Ex 39:30": "Zij maakten ook de plaat van de heilige kroon van zuiver goud, en zij schreven daarop een schrift, gegraveerd zoals een zegel gegraveerd wordt: HEILIGHEID VAN DE HEERE.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Luk 11:34-36": "De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister. Kijk dan uit, dat niet het licht dat in u is, duisternis is. Als dan uw hele lichaam verlicht is, zonder enig duister deel, dan zal het geheel verlicht zijn, zoals wanneer de lamp u met haar schijnsel verlicht.", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duister
