onder ons wat goed is.","5":"Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.","6":"Ik moet liegen over mijn recht; mijn pijl is smartelijk zonder overtreding.","7":"Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;","8":"En gaat over weg in gezelschap met de werkers van de ongerechtigheid, en wandelt met goddeloze lieden.","9":"Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.","10":"Daarom, u, lieden van verstand, hoor naar mij: Ver zij God van goddeloosheid, en de Almachtige van onrecht!","11":"Want *naar* het werk van de mens vergeldt Hij hem, en naar ieders weg doet Hij het hem vinden.","12":"Ook waarlijk, God handelt niet goddeloos, en de Almachtige verkeert het recht niet.","13":"Wie heeft Hem gesteld over de aarde, en wie heeft de hele wereld geschikt?","14":"Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;","15":"Alle vlees zou tegelijk de geest geven, en de mens zou tot stof terugkeren.","16":"Zo er dan verstand *bij u* is, hoor dit; neig de oren tot de stem van mijn woorden.","17":"Zou Hij ook, Die het recht haat, *de gewonde* verbinden, en zou u de zeer Rechtvaardige veroordelen?","18":"Zou men tot een koning zeggen: U bent Belial[1]; tot de vorsten: U bent goddelozen!","19":"*Hoe dan tot Hem*, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.","20":"In een ogenblik sterven zij; zelfs te middernacht wordt een volk geschud, dat het doorgaat; en de machtige wordt weggenomen zonder hand.","21":"Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.","22":"Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.","23":"Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.","24":"Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.","25":"Daarom *dat* Hij hun werken kent, zo keert Hij hen 's nachts om, en zij worden verbrijzeld.","26":"Hij klopt hen samen als goddelozen, in een plaats, *waar* van het aanschouwer zijn;","27":"Daarom dat zij van achter Hem afgeweken zijn, en geen van Zijn wegen verstaan hebben;","28":"Opdat Hij op hem het geroep van de arme brengt, en het geroep van de ellendigen verhoort.","29":"Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?","30":"Opdat de huichelachtige mens niet meer regeert, *en* geen strikken van het volk zijn.","31":"Zeker heeft hij tot God gezegd: Ik heb *Uw straf* verdragen, ik zal het niet verderven.","32":"Behalve *wat* ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.","33":"Zal het van u zijn, hoe Hij iets vergelden zal, omdat u *Hem* versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.","34":"De lieden van verstand zullen met mij zeggen, en een wijs man zal naar mij horen:","35":"*Dat* Job niet met wetenschap gesproken heeft, en zijn woorden niet met kloek verstand geweest zijn.","36":"Mijn Vader, laat Job beproefd worden tot het einde toe, om *zijn* antwoorden wil onder de onrechtvaardige lieden.","37":"Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God."},"SV":{"1":"Verder antwoordde Elihu, en zeide:","2":"Hoort, gij wijzen, mijn woorden, en gij verstandigen, neigt de oren naar mij.","3":"Want het oor proeft de woorden, gelijk het gehemelte de spijze smaakt.","4":"Laat ons kiezen voor ons, wat recht is; laat ons kennen onder ons wat goed is.","5":"Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.","6":"Ik moet liegen in mijn recht; mijn pijl is smartelijk zonder overtreding.","7":"Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;","8":"En gaat over weg in gezelschap met de werkers der ongerechtigheid, en wandelt met goddeloze lieden.","9":"Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.","10":"Daarom, gij, lieden van verstand, hoort naar mij: Verre zij God van goddeloosheid, en de Almachtige van onrecht!","11":"Want *naar* het werk des mensen vergeldt Hij hem, en naar eens ieders weg doet Hij het hem vinden.","12":"Ook waarlijk, God handelt niet goddelooslijk, en de Almachtige verkeert het recht niet.","13":"Wie heeft Hem gesteld over de aarde, en wie heeft de ganse wereld geschikt?","14":"Indien Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich vergaderen;","15":"Alle vlees zou tegelijk den geest geven, en de mens zou tot stof wederkeren.","16":"Zo er dan verstand *bij* *u* is, hoor dit; neig de oren tot de stem mijner woorden.","17":"Zou Hij ook, Die het recht haat, *den* *gewonde* verbinden, en zoudt gij den zeer Rechtvaardige verdoemen?","18":"Zou men tot een koning zeggen: Gij Belial; tot de prinsen: Gij goddelozen!","19":"*Hoe* *dan* *tot* *Dien*, Die het aangezicht der vorsten niet aanneemt, en den rijke voor den arme niet kent? Want zij zijn allen Zijner handen werk.","20":"In een ogenblik sterven zij; zelfs ter middernacht wordt een volk geschud, dat het doorga; en de machtige wordt weggenomen zonder hand.","21":"Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.","22":"Er is geen duisternis, en er is geen schaduw des doods, dat aldaar de werkers der ongerechtigheid zich verbergen mochten.","23":"Gewisselijk, Hij legt den mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.","24":"Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.","25":"Daarom *dat* Hij hun werken kent, zo keert Hij hen des nachts om, en zij worden verbrijzeld.","26":"Hij klopt hen samen als goddelozen, in een plaats, *waar* aanschouwers zijn;","27":"Daarom dat zij van achter Hem afgeweken zijn, en geen Zijner wegen verstaan hebben;","28":"Opdat Hij op hem het geroep des armen brenge, en het geroep der ellendigen verhore.","29":"Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?","30":"Opdat de huichelachtige mens niet *meer* regere, *en* geen strikken des volks zijn.","31":"Zekerlijk heeft hij tot God gezegd: Ik heb *Uw* *straf* verdragen, ik zal het niet verderven.","32":"Behalve *wat* ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.","33":"Zal het van u zijn, hoe Hij iets vergelden zal, dewijl gij *Hem* versmaadt? Zoudt gij dan verkiezen, en niet ik? Wat weet gij dan? Spreek.","34":"De lieden van verstand zullen met mij zeggen, en een wijs man zal naar mij horen:","35":"*Dat* Job niet met wetenschap gesproken heeft, en zijn woorden niet met kloek verstand geweest zijn.","36":"Mijn Vader, laat Job beproefd worden tot het einde toe, om *zijner* antwoorden wil onder de ongerechtige lieden.","37":"Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God."},"KJV":{"1":"Furthermore Elihu answered and said,","2":"Hear my words, O ye wise *men*; and give ear unto me, ye that have knowledge.","3":"For the ear trieth words, as the mouth tasteth meat.","4":"Let us choose to us judgment: let us know among ourselves what *is* good.","5":"For Job hath said, I am righteous: and God hath taken away my judgment.","6":"Should I lie against my right? my wound *is* incurable without transgression.","7":"What man *is* like Job, *who* drinketh up scorning like water?","8":"Which goeth in company with the workers of iniquity, and walketh with wicked men.","9":"For he hath said, It profiteth a man nothing that he should delight himself with God.","10":"Therefore hearken unto me, ye men of understanding: far be it from God, *that he should do* wickedness; and *from* the Almighty, *that he should commit* iniquity.","11":"For the work of a man shall he render unto him, and cause every man to find according to *his* ways.","12":"Yea, surely God will not do wickedly, neither will the Almighty pervert judgment.","13":"Who hath given him a charge over the earth? or who hath disposed the whole world?","14":"If he set his heart upon man, *if* he gather unto himself his spirit and his breath;","15":"All flesh shall perish together, and man shall turn again unto dust.","16":"If now *thou hast* understanding, hear this: hearken to the voice of my words.","17":"Shall even he that hateth right govern? and wilt thou condemn him that is most just?","18":"*Is it fit* to say to a king, *Thou art* wicked? *and* to princes, *Ye are* ungodly?","19":"*How much less to him* that accepteth not the persons of princes, nor regardeth the rich more than the poor? for they all *are* the work of his hands.","20":"In a moment shall they die, and the people shall be troubled at midnight, and pass away: and the mighty shall be taken away without hand.","21":"For his eyes *are* upon the ways of man, and he seeth all his goings.","22":"*There is* no darkness, nor shadow of death, where the workers of iniquity may hide","23":"For he will not lay upon man more *than right*; that he should enter into judgment with God.","24":"He shall break in pieces mighty men without number, and set others","25":"Therefore he knoweth their works, and he overturneth *them* in the night, so that they are destroyed.","26":"He striketh them as wicked men in the open sight","27":"Because they turned back from him, and would not consider any of his ways:","28":"So that they cause the cry of the poor to come unto him, and he heareth the cry of the afflicted.","29":"When he giveth quietness, who then can make trouble? and when he hideth *his* face, who then can behold him? whether *it be done* against a nation, or against a man only:","30":"That the hypocrite reign not, lest the people be ensnared.","31":"Surely it is meet to be said unto God, I have borne *chastisement*, I will not offend","32":"*That which* I see not teach thou me: if I have done iniquity, I will do","33":"*Should it be* according to thy mind? he will recompense it, whether thou refuse, or whether thou choose; and not I: therefore speak what thou knowest.","34":"Let men of understanding tell me, and let a wise man hearken","35":"Job hath spoken without knowledge, and his words *were* without wisdom.","36":"My desire *is that* Job may be tried unto the end because of *his* answers for wicked men.","37":"For he addeth rebellion unto his sin, he clappeth *his hands* among us, and multiplieth his words against God."}},"tsk":{"3":[{"kopje":"het oor","refs":["Job 6:30","Job 12:11","1 Kor 2:15","Hebr 5:14"]},{"kopje":"het gehemelte","refs":["Job 31:30","Job 33:2"]}],"4":[{"kopje":"kiezen","refs":["Job 34:36","Richt 19:30","Richt 20:7","1 Kor 6:2-5","Gal 2:11-14","1 Tess 5:21"]},{"kopje":"kennen","refs":["Jes 11:2-5","Joh 7:24","Rom 12:2"]}],"5":[{"kopje":"Ik","refs":["Job 10:7","Job 11:4","Job 16:17","Job 29:14","Job 32:1","Job 33:9"]},{"kopje":"God","refs":["Job 9:17","Job 27:2"]}],"6":[{"kopje":"Ik","refs":["Job 27:4-6"]},{"kopje":"pijl","refs":["Job 6:4","Job 16:13"]}],"9":[{"kopje":"Het","refs":["Job 9:22","Job 9:23","Job 9:30","Job 9:31","Job 21:14-16","Job 21:30","Job 22:17","Job 35:3","Mal 3:14"]},{"kopje":"welbehagen","refs":["Job 27:10","Ps 37:4"]}],"10":[{"kopje":"verstand","refs":["Job 34:2","Job 34:3","Job 34:34","Spr 6:32","Spr 15:32"]},{"kopje":"Ver","refs":["Job 8:3","Job 36:23","Job 37:23","Gen 18:25","Deut 32:4","2 Kron 19:7","Ps 92:16","Jer 12:1","Rom 3:4","Rom 3:5","Rom 9:14","Jak 1:13"]}],"11":[{"kopje":"het werk","refs":["Job 33:26","Ps 62:13","Spr 24:12","Jer 32:19","Ezech 33:17-20","Matt 16:27","Rom 2:6","2 Kor 5:10","1 Petr 1:17","Openb 22:12"]},{"kopje":"vinden","refs":["Spr 1:31","Gal 6:7","Gal 6:8"]}],"12":[{"kopje":"waarlijk","refs":["Ps 11:7","Ps 145:17","Hab 1:12","Hab 1:1 ,"koppeling_kjv":{"1":"Furthermore <span class=\"wl wl-kjv\" data-code=\"H453\">Elihu</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and said,","2":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> my <span class=\"wl wl-kjv\" data-code=\"H4405\">words,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men; and give <span class=\"wl wl-kjv\" data-code=\"H238\">ear</span> unto me, ye that have knowledge.","3":"For the <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> <span class=\"wl wl-kjv\" data-code=\"H974\">trieth</span> <span class=\"wl wl-kjv\" data-code=\"H4405\">words,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"H2938\">tasteth</span> meat.","4":"Let us <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> to us <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment:</span> let us <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> among ourselves what is good.","5":"For <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am <span class=\"wl wl-kjv\" data-code=\"H6663\">righteous:</span> and <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> my judgment.","6":"Should I <span class=\"wl wl-kjv\" data-code=\"H3576\">lie</span> against my <span class=\"wl wl-kjv\" data-code=\"H4941\">right?</span> my <span class=\"wl wl-kjv\" data-code=\"H2671\">wound</span> is <span class=\"wl wl-kjv\" data-code=\"H605\">incurable</span> without transgression.","7":"What <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> is like <span class=\"wl wl-kjv\" data-code=\"H347\">Job,</span> who drinketh <span class=\"wl wl-kjv\" data-code=\"H8354\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3933\">scorning</span> like water?","8":"Which <span class=\"wl wl-kjv\" data-code=\"H732\">goeth</span> in <span class=\"wl wl-kjv\" data-code=\"H2274\">company</span> with the <span class=\"wl wl-kjv\" data-code=\"H6466\">workers</span> of <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walketh</span> with <span class=\"wl wl-kjv\" data-code=\"H7562\">wicked</span> men.","9":"For he hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It <span class=\"wl wl-kjv\" data-code=\"H5532\">profiteth</span> a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> nothing that he should <span class=\"wl wl-kjv\" data-code=\"H7521\">delight</span> himself with God.","10":"Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me, ye <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3824\">understanding:</span> far be <span class=\"wl wl-kjv\" data-code=\"H2486\">it</span> from <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> that he should do <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness;</span> and from the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty,</span> that he should commit iniquity.","11":"For the <span class=\"wl wl-kjv\" data-code=\"H6467\">work</span> of a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall he <span class=\"wl wl-kjv\" data-code=\"H7999\">render</span> unto him, and cause every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> according to his ways.","12":"Yea, <span class=\"wl wl-kjv\" data-code=\"H551\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> will not do <span class=\"wl wl-kjv\" data-code=\"H7561\">wickedly,</span> neither will the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> <span class=\"wl wl-kjv\" data-code=\"H5791\">pervert</span> judgment.","13":"Who hath given him a <span class=\"wl wl-kjv\" data-code=\"H6485\">charge</span> over the <span class=\"wl ensnared.","31":"Surely it is meet to be <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> chastisement, I will not offend","32":"That which I <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">not</span> <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> thou me: if I have <span class=\"wl wl-kjv\" data-code=\"H6466\">done</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> I will do","33":"Should it be according to thy mind? he will <span class=\"wl wl-kjv\" data-code=\"H7999\">recompense</span> it, whether thou <span class=\"wl wl-kjv\" data-code=\"H3588\">refuse,</span> or whether thou <span class=\"wl wl-kjv\" data-code=\"H977\">choose;</span> and not I: therefore <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> what thou knowest.","34":"Let <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3824\">understanding</span> <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> me, and let a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> hearken","35":"<span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> without <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> were without wisdom.","36":"My <span class=\"wl wl-kjv\" data-code=\"H15\">desire</span> is that <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> may be <span class=\"wl wl-kjv\" data-code=\"H974\">tried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5331\">end</span> because of his <span class=\"wl wl-kjv\" data-code=\"H8666\">answers</span> for <span class=\"wl wl-kjv\" data-code=\"H205\">wicked</span> men.","37":"For he <span class=\"wl wl-kjv\" data-code=\"H3254\">addeth</span> <span class=\"wl wl-kjv\" data-code=\"H6588\">rebellion</span> unto his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> he <span class=\"wl wl-kjv\" data-code=\"H5606\">clappeth</span> his hands among us, and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplieth</span> his <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> against God."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"antwoordde","tekst":"Dat is, ving een nieuwe rede aan. Zie Jdg 18:14 , of, ging voort in het antwoorden."}],"3":[{"catchword":"proeft","tekst":"Dat is, het hoort ze en brengt ze tot het verstand, om daar geoordeeld te worden hoedanig dat zij zijn."},{"catchword":"gelijk","tekst":"Hebreeuws, en. Zie boven, Job 5:7 . Het gehemelte wordt de smaak toegeschreven. Alzo boven, Job 12:11 ; Pro 24:13 ."}],"4":[{"catchword":"wat recht is;","tekst":"Hebreeuws, het oordeel, of recht; dat is, de waarheid en billijkheid, die wij in dezen gehelen handel zoeken moeten, verwerpende al hetgeen vals en onrecht is. Alzo is het Hebreeuwse woord dikwijls genomen. Zie Deu 32:4 ; Job 32:9 ; Psa 37:30 ; Pro 2:8 ; Isa 59:8 ; Mic 3:8 , enz."}],"5":[{"catchword":"Ik ben rechtvaardig,","tekst":"Zie boven, Job 13:18 , en Job 23:10 , en Job 27:2 , Job 27:6 , en Job 31:1 , enz., waar Job niet wil zeggen dat hij gans zonder zonde was; want het tegendeel bekent hij boven, Job 14:4 ; maar alleen dat hij geen goddeloos mens, of hypocriet was, gelijk zijn vrienden meenden, en dat hij niet alleen had de burgerlijke gerechtigheid, maar ook de goede conscientie."},{"catchword":"God","tekst":"Deze beschuldiging gedaan tegen Job wordt gesteld met zijn eigen woorden, gelijk wij dezelve vinden boven, Job 27:2 . Doch Job heeft haar zo verstaan dat God geen kennis nam van zijn zaak; maar Elihu, dat God ongerechtiglijk tegen hem handelde. Evenwel had Elihu reden om Job te berispen, omdat hij zijn onnozelheid zozeer voorstond, dat hij de gerechtigheid Gods scheen ongelijk te geven."}],"6":[{"catchword":"Ik moet","tekst":"Dat is, als ik mijn onschuld verdedig, word ik gehouden te liegen. Dit verhaalt Elihu mede als van Job gesproken . Vergelijk boven, Job 19:7 . Anders, zou ik liegen in mijn recht?"},{"catchword":"mijn pijl","tekst":"Te weten, de pijl mijns lijdens en van deze mijn bezoeking, waarmede mij God getroffen heeft. Zie boven, Job 6:4 . Vergelijk Deu 32:33 ."},{"catchword":"zonder","tekst":"Dat is, zonder dat ik daartoe schuld heb."}],"7":[{"catchword":"gelijk Job?","tekst":"Te weten, die zo wijs en kloek wil zijn als Job, en nochtans zulke redenen voortbrengt, die der bespotting waardig zijn, gelijk, naar het oordeel van Elihu, Job voortbracht ."},{"catchword":"in als water;","tekst":"Zie dezelfde gelijkenis boven, Job 15:16 , en de aantekening."}],"8":[{"catchword":"En gaat","tekst":"Hij wil zeggen dat Job met zijn redenen zich den kwaden en goddelozen mensen gelijk maakte en gemeenschap met hen had in het kwaad spreken."},{"catchword":"goddeloze lieden","tekst":"Hebreeuws, lieden der goddeloosheid. Zie boven, Job 11:11 ."}],"9":[{"catchword":"hij heeft gezegd","tekst":"Namelijk, Job."},{"catchword":"het baat","tekst":"Hoewel Job deze woorden in vorm alzo niet had uitgesproken, nochtans wil Elihu uit zijn redenen besluiten, gelijk uit Job 9:22 , en Job 21:8 , en Job 30:26 , enz., maar de mening van Job was zodanig niet, als was het dat hij, door het geweld zijns lijdens gedrongen zijnde, somtijds al te heftiglijk en te onvoorzichtig zijn zaak dreEf."},{"catchword":"als hij welbehagen","tekst":"Dat is, als zijn lust is God te dienen en te gehoorzamen. Anders, als hij een behagen heeft met God [te wandelen]. Dit woord is ingevoegd uit Gen 5:22 ."}],"10":[{"catchword":"lieden","tekst":"Hebreeuws, lieden des harten; dat is, des verstands. Alzo onder, vs.34. Zie boven, Job 9:4 ."},{"catchword":"Verre","tekst":"Hebreeuws, het zij Gode verre van goddeloosheid, enz."}],"11":[{"catchword":"vergeldt","tekst":"Te weten, òf loon naar genade, zo het werk goed is, òf straf naar verdienste, zo het werk kwaad is."},{"catchword":"weg","tekst":"Dat is, naar zijn gedachten, pogingen, woorden en werken. Zo spreekt ook Eze 7:27 , en Eze 33:10 ."},{"catchword":"hem vinden","tekst":"Te weten, dat hem naar Gods oordeel wedervaren en overkomen moet vanwege zijne werken."}],"12":[{"catchword":"handelt","tekst":"Anders, en verdoemt [den onschuldige] niet. Dergelijk invoegsel is ook Exo 34:7 ."}],"13":[{"catchword":"Wie heeft","tekst":"Hebreeuws, op hem besteld, of bevolen; dat is, Hem last gegeven, te weten om die te onderhouden en te regeren. De zin is, dat niemand Hem daarover gesteld heeft, maar dat Hij alle macht van zich alleen heeft. Elihu bewijst dat God niemand onrecht doen kan, omdat Hij is de schepper, onderhouder en regeerder van alle dingen, die zo gerechtig en heilig is van natuur dat Hij niet kan kwaad doen, en zo hoog van heerlijkheid dat Hij niemand gehouden is rekenschap van zijn doen te geven."}],"14":[{"catchword":"Zijn hart","tekst":"Dat is, ten nauwste acht op hem wilde nemen, om het hoogste recht tegen hem te gebruiken."},{"catchword":"hem zette,","tekst":"Te weten, den mens. Zie boven, vs.11."},{"catchword":"Zijn geest","tekst":"Dat is, zijn ziel zou Hij van hem door den dood kunnen wegnemen, en alzo in dit leven een einde met hem maken. Vergelijk Psa 26:9 , en de aantekening."}],"15":[{"catchword":"Alle vlees","tekst":"Dat is, alle mensen. Zie Gen 6:12 ."},{"catchword":"mens","tekst":"Versta, het lichaam des mensen. Vergelijk Gen 3:19 ; Ecc 12:7 ."}],"16":[{"catchword":"bij u is,","tekst":"Te weten, bij u, o Job."}],"17":[{"catchword":"den gewonde","tekst":"Hij wil zeggen dat zulks niet kan geschieden. Den gewonde verbinden is dengene, die om zijn zonden gestraft is en zich bekeert, weder genadig zijn en goeddoen, hetwelk niet geschied van hem, die het recht haat. Vergelijk boven, Job 5:18 . Anderen vertalen het Hebreeuwse woord chabas, heersen, of regeren, en alzo is het genomen van enigen, Isa 3:7 , want de oversten hebben de macht om de onderzaten te bedwingen en in banden te leggen. De zin is dat Hij, die de gehele wereld regeert, niet ongerechtig kan zijn."},{"catchword":"zeer Rechtvaardige","tekst":"Hebreeuws, geweldig, krachtig; dat is, die allermeest en ten hoogste rechtvaardig is."}],"18":[{"catchword":"Zou men","tekst":"Dat is, is het niet geoorloofd een koning of prins alzo toe te spreken, hoeveel temin van God alzo te spreken? Anders, zoudt gij hem [te weten God] verdoemen, als Hij tot een koning zegt: Gij boet, enz. Het woord verdoemen wordt hier weder ingevoegd uit vs.17."},{"catchword":"Belial;","tekst":"Zie van dit woord Deu 13:13 ."}],"19":[{"catchword":"Dien","tekst":",] Te weten, God."},{"catchword":"het aangezicht","tekst":"Zie van deze manier van spreken Lev 19:15 ."}],"20":[{"catchword":"sterven zij;","tekst":"Namelijk, rijken en armen, edelen en onedelen, sterken en zwakken, en dat als het God belieft door zijn macht, dat niemand wederstaan kan, en naar zijn gerechtigheid, die niemand vermag te wederspreken of te controleren."},{"catchword":"ter middernacht","tekst":"Dat is, onverwachts, en als zij zekerst menen te wezen. Zie Exo 12:29 ; 2Ki 19:35 ."},{"catchword":"een volk","tekst":"Dat is, gehele volken worden door Gods kracht en ook rechtvaardiglijk uit hun land, welvaren en staat vervoerd en weggerukt."},{"catchword":"doorgaat;","tekst":"Dat is, te gronde gaat."},{"catchword":"machtige","tekst":"Hebreeuws, zij nemen de sterken weg; te weten, de engelen of dienaars Gods. Zie boven, Job 4:18 ."},{"catchword":"zonder hand","tekst":"Dat is, zonder menselijke hand, en dienvolgens door de kracht Gods."}],"21":[{"catchword":"wegen,","tekst":"Dat is, werken. Zie Gen 6:12 ."}],"22":[{"catchword":"is geen duisternis,","tekst":"Vergelijk boven, Job 26:6 ."},{"catchword":"schaduw","tekst":"Zie boven, Job 12:22 ."}],"23":[{"catchword":"Hij legt","tekst":"Te weten, God."},{"catchword":"te veel op,","tekst":"Dat is, te veel straf, gaande boven de verdiensten zijner zonden."},{"catchword":"dat hij tegen God","tekst":"Dat is, dat de mens oorzaak zou mogen hebben om tegen God van ongelijk te klagen en Hem in het gericht te willen betrekken, gelijk Job gedaan had. Zie boven, Job 13:3 , en Job 16:21 , en Job 23:3-4 ."}],"24":[{"catchword":"dat men","tekst":"Hebreeuws, zonder doorzoeking; dat is zonder dat men uitvinden en rekenen kan, hoevelen Hij van deze geweldigen vernietigt; of doorgronden de redenen van deze zijne oordelen. Vergelijk boven, Job 5:9 , en Job 9:10 , en onder, Job 36:26 ."}],"25":[{"catchword":"zo keert Hij","tekst":"Dat is, Hij verderft hen onvoorziens en als zij menen in hun rust te wezen. Zie boven, vs.20. Anders, Hij verandert den nacht, waarmede zij hun zonden meenden te bedekken, in den dag, die hen tevoorschijn brengt. Of, zo keert Hij op hen den nacht; dat is, allerlei ellende, tegenheid en kwalijk varen."}],"26":[{"catchword":"klopt","tekst":"Dat is, drukt hen tezamen, slaat hen, smijt hen; te weten, door zijn rechtvaardige straffen."},{"catchword":"als goddelozen,","tekst":"Of, voor goddelozen. Hebreeuws, inplaats van goddelozen, gelijk ook zodanigen zijn."},{"catchword":"een plaats,","tekst":"Hebreeuws, in de plaats der zienden; dat is, in een openbare plaats, waar hun straf van velen kan gezien worden, opdat de aanschouwers door hun exempel geleerd mochten worden hun leven te verbeteren."}],"27":[{"catchword":"Hem afgeweken zijn,","tekst":"Te weten, God."},{"catchword":"Zijner wegen","tekst":"Zie Gen 18:19 ."}],"28":[{"catchword":"op hem","tekst":"Dat is, op elkeen van hen, de straf die zij verdiend hebben, door den arme zo te verdrukken, dat hij genoodzaakt is geweest tot God te roepen."}],"29":[{"catchword":"Als hij stilt,","tekst":"Hij toont Gods kracht, verenigd met zijn genade en gerechtigheid, omdat niemand beroerte kan maken, daar God naar zijn goedigheid stilte verleent, en omdat niemand hem helpen kan, tegen wien God vergramd at is, dezen mijn handel met God niet verderven, te weten, met mijn onschuld al te zeer te verdedigen, gelijk ik gedaan heb; of ik zal uw wetten niet verderven, te weten door dezelve te overtreden. Anders, heb ik weggenomen, ik zal geen pand nemen. Alsof hij zeide: Heb ik pand genomen, ik zal het niet meer doen. Vergelijk boven, Job 22:6 ."}],"32":[{"catchword":"ik zie,","tekst":"Te weten, aangaande mijn zonden."},{"catchword":"leer Gij mij;","tekst":"Te weten, dat mij van mijn zonden nog onbekend is; dat is, maakt mij bekend mijn verborgen gebreken. Vergelijk Psa 19:13 ."},{"catchword":"niet meer doen","tekst":"Te weten, mij te vergrijpen."}],"33":[{"catchword":"van u zijn,","tekst":"Dat is, zal het aan u staan, naar uw gevoelen en goeddunken gaan, hoe God het kwade met straffen vergelden zal, of het goede met weldaden? Zal Hij u raad moeten vragen, om te weten hoe Hij dat wel doen zal? Elihu spreekt Job toe ."},{"catchword":"Hij iets","tekst":"Te weten, God."},{"catchword":"Hem","tekst":"Namelijk, God over zijn regering, waardoor Hij de goede en kwade werken vergeldt."},{"catchword":"Zoudt gij","tekst":"Dit zijn de woorden Gods, in wiens persoon Elihu die voortbrengt. De zin is: zoudt gij dan, o Job, mij voorschrijven de wijze hoe Ik straffen en zegenen zal, en niet Ik?"},{"catchword":"Wat weet gij dan?","tekst":"Hier spreekt Elihu in zijn eigen persoon tot Job, alsof hij zeide: Wat hebt gij hiertegen te zeggen: spreekt uit, antwoord. Doch sommigen stellen vs.33 aldus: Zal Hij vergelden hetgeen van u is, dewijl gij [de kastijding] versmaadt? Wanneer gij het verkoost, ik zou het evenwel niet doen, enz."}],"34":[{"catchword":"De lieden","tekst":"Hebreeuws, de lieden des harten. Hart voor verstand; alzo boven, vs.10."},{"catchword":"met mij zeggen,","tekst":"De Hebreeuwse letter lamed betekent somtijds met; gelijk Gen 46:26 ; Exo 34:12 ; Num 18:11 ."},{"catchword":"naar mij horen","tekst":"Dat is, dit mij toestemmen, of hierin mij gelijk geven."}],"36":[{"catchword":"Mijn Vader,","tekst":"Te weten, die in den hemel zijt; dat is, o mijn God. Anders, mijn begeerte is dat Job beproefd worde."},{"catchword":"beproefd worden","tekst":"Te weten, door kruis en tegenspoed. Zie Gen 22:1 ."},{"catchword":"tot het einde toe,","tekst":"Dat is, tot de voleinding van het werk zijner bezoeking, namelijk, als zijn godvruchtigheid ten volle blijken zal door een oprechte bekentenis zijner zonden. Anders, tot de overwinning toe; dat is, totdat hij God als zijn overwinnaar de eer geve en ophoude zo kwalijk te spreken. Of aldus: zal Job beproefd worden tot den einde toe? alsof hij vreesde dat Job door al te langdurige beproeving zijn zonden zou vermenigvuldigen."},{"catchword":"antwoorden","tekst":"Dat is, redenen, die hij met antwoorden voortbrengt."},{"catchword":"ongerechtige","tekst":"Hebreeuws, lieden der ongerechtigheid; dat is, als zijnde een der ongerechtige lieden, die Gods oordelen tegenspreken. Of, met de ongerechtige lieden; dat is, zijnde in zijn doen hun metgezel. Anders, voor de ongerechtigen; te weten, als hun voorspraak zijnde."}],"37":[{"catchword":"zonde","tekst":"Dat is, de misdaad, die hij totnutoe gedaan heeft, door misverstand en dwaling."},{"catchword":"overtreding","tekst":"Dat is, zijn zonden vermenigvuldigen."},{"catchword":"in de handen klappen,","tekst":"Alsof hij ons met zijn disputen overwonnen had. Zie boven, Job 27:23 , en vergelijk 1Ki 9:8 . Sommigen verstaan het alzo, dat hij hun tot dispuut geroepen had en borgtocht wilde aangaan. Vergelijk boven, Job 17:3 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Further answereth Elihu, [i.e. he began to speak again, or to make a new speech. See Judges 18.on verse 14. Or, Went on in answering] and said:"}],"2":[{"catchword":null,"tekst":"Hear ye wise, my words; and yet understanding ones, incline the ears to me."}],"3":[{"catchword":null,"tekst":"For the ear trieth the words; [i.e. doth hear them, and convey them to the understanding, there to be judged, of wha comparison, above 15.16. and the annot.]"}],"8":[{"catchword":null,"tekst":"And passeth along in company with the workers of unrighteousness: [He would say, that Job by such exorbitant speechs made himself like unto evil and wicked men, and had communion with them by his evil speaking.] and walketh with wicked men. [Heb. Men of wickedness, See above 11.on v.11.]"}],"9":[{"catchword":null,"tekst":"For he [Job namely] hath said; it doth not profit a man [though Job had not said so in express terms, yet Elihu inferreth it out of his speechs. Chap.9.22. and 21.8. and 30.36. etc. But Jobs meaning was not such, although the extremity of his pains and sufferings made him sometimes to prosecute his matter with too much eagerness and unadvisedness.] when he taketh pleasure in God, [i.e. when he taketh delight to serve and obey God. Oth. When he taketh pleasure (to walk) with God, the insertion (to walk) being inserted out of Gen 5:22.]"}],"10":[{"catchword":null,"tekst":"Therefore ye men of understanding, [Heb. Men of the heart, i.e. of understanding. So below v.34. See above 9.on v.4.] hearken to me; far be God from wickedness: [Heb. Be is for to God from, &c.] and the Almighty from wrong."}],"11":[{"catchword":null,"tekst":"For (according) to the work of man, he doth requite him: [viz. Either with reward by grace, if the work be good; or with punishment according to desert, if the work be evil.] and according to every ones way, [i.e. according to his thoughts, endeavours, words and actions, thus Ezekiel likewise speaketh, chap.7.27. and 33.10.] he doth find it him, [viz. That it must go with or happen unto him according to Gods judgement, according and because of his works.]"}],"12":[{"catchword":null,"tekst":"Also indeed, God dealeth not wickedly: [Oth. Doth not condemn (the innocent). The sike insertion is likewise, Exo 34:7.] and the Almighty doth not pervert the right."}],"13":[{"catchword":null,"tekst":"Who hath appointed him over the earth? [Heb. Appointed, or commanded upon him, i.e. given the same. The meaning is, that none hath appointed him, but he hath all the power, by and of himself Elihu proveth that God can wrong none, because he is the sole Creator, Upholder and Governor of all things; being so righteous and holy by nature, that he can do no evil, and so transcendent in Glory and Majesty, that he is not bound to give account to any, of his doings.] who hath disposed the whole world?"}],"14":[{"catchword":null,"tekst":"If he should set his heart against him, [viz. Against man. See above v.11. i.e. if he should very accurately mark him, and proceed with him according to the rigour f justice.] he should gather unto himself his spirit and his breath: [i.e. he might well the take his souls away from him by death, and so make an utter end with him in this life. Compare Psa 26:9. and the annot.]"}],"15":[{"catchword":null,"tekst":"All flesh, [i.e. all men. See Gen.6.on v.12.] should give (up) the spirit together: and man, [i.e. the body of man. Compare Gen 3:10. Ecc 12:7.] should return again to dust."}],"16":[{"catchword":null,"tekst":"If then there be understanding (with thee) [viz. O Job] hear this: encline the ears to the voice of my words."}],"17":[{"catchword":null,"tekst":"Would he also, that hateth the right, bind (the wounded?) [His meaning is, that such a one would not do it; or, that it could not be. To bind the wounded, is or implyeth to be gracious again and to do good to him that being punished for his sins, is brought to repentance and conversion; which course is not practised by one that hateth the right. Compare above 5.18. Others render the Hebrew word Chabash, to rule, to govern, and so it is taken by some, Isa 3:7. For the Governors have power to coerce and force men, and to put them in bonds: and then the sense is, that he that governeth the whole world, can not be unjust.] And shouldest thou condemn the most righteous? [Heb. Righteous mighty, or powerful, i.e. that is most, or most exactly righteous.]"} ds power, accompanied with his grace and righteousness,, in regard that none can cause troubles, where God of his goodness granteth calms; and none can help or save, when Gods wrath is gone out against any] who shall trouble? [i.e. cause or stir up trouble] when he doth hide the face, [viz. From man, i.e. when he withdraweth his grace, his help and blessing from him. See Deut.31.on v.17.] who [viz. Of those against whom Gods wrath is kindled, of whom was spoken in the former verse] shall look then upon him, [viz. Upon God, i.e. who of them shall dare to appear before God, viz. By prayer, to sue for help, or comfort. Compare the manner of speaking with Psa 34:6.] as well for [thus the Hebrew particle is used. Gen 37:8. below v.15. Hos 11:7.] A Nation as for one man done? [So the Hebrew for this Hos 11:7. By this latter part of the verse Elihu sheweth, that what he related of God, was true, not onely in regard of this or that particular man, but also for whole nations in general, whom he is able to grant rest unto, or hide his face from, at pleasure.]"}],"30":[{"catchword":null,"tekst":"That the hypocritical man may rule no (more); [Of the hypocrite. See above chap.8.on v.13. he sheweth that God doth hide his face, not only before the common sort, but also before the great ones, the Commanders and Governors of the rest.] and there be no snares of the people [i.e. no burden, violence and tyranny, whereby to aggrieve the same. Oth. Because of the snares of the people, viz. Whereby the he should oppress them.]"}],"31":[{"catchword":null,"tekst":"Surely, hath he said to God? [He, viz. Job, for Elihu doth turn to him again, to exhort him to his duty, how to speak of and unto God, instead of complaining of, or finding fault with his judgements, as he had laid to his charge, above v.5. to have done.] I have born (thy punishment), I shall not corrupt it, [i.e. in this my cause, and my whole life, shall I do nothing, neither in words nor indeeds, but what is right and fit to be done. Or, I shall not spoil the (matter; i.e. this case of mine with God, viz. With too much pleading of mine innocency, as I have done. Or, I shall not corrupt thy Laws, viz. By transgression them. Oth. Have I taken away, I shall take no pawn; as if he said, if I have taken pawn, I shall do it no more. Compare above 22.6.]"}],"32":[{"catchword":null,"tekst":"Besides (what) I see, [viz. Concerning my sins.] teach thou me: [viz. What sins of mine are yet unknown to me, i.e. discover and make known unto me my secret failings. Compare Psa 19:13.] if I have wrought iniquity, I shall do it no more [viz. To trespass thus.]"}],"33":[{"catchword":null,"tekst":"Shall it be of thee, [i.e. Shall it be at thy disposing, according as thou conceives and thinkest good, that God shall punish the evil, or reward the good. Shall he be bound to ask thy council, and to learn of thee how to administer his punishments or benefits? Elihu directeth his speech to Job.] how he [God namely] shall requite ought, because thou despises him? [viz. God in matter of his Government, whereby he doth recompence good and evil works] shouldest thou then choose, and not I? [these are the words of God, which Elihu produceth here in his behalf. The meaning is, shouldest thou then, O Job, and not my self prescribe the way and manner unto me, how to punish, and how to bless such and such?] what knowest thou then, speak. [Here Elihu speaketh again in his own person to Job, as if he said, what hast thou say or allege against this, speak out, answer. Yet some construe and read this verse thus shall he require that which is from thee, because thou despises (the chastisement) if thou shouldest choose it, yet should not I do it.]"}],"34":[{"catchword":null,"tekst":"The men of understanding [Heb. The men of the heart, heart for understanding. So above v.10.] shall say with me, [the Heb. Letter lamed, doth signify sometimes, with, as Gen 46:26. Exo 34:12. Num 18:11.] and a wise man shall hearken to me: [i.e. approve of this, or justify me in this behalf.]"}],"35":[{"catchword":null,"tekst":"(That) Job hath not spoken with knowledge, and his words have not been with prudent understanding."}],"36":[{"catchword":null,"tekst":"My Father, [viz. That art in heaven, i.e. O my God, Oth. My desire is that Job be tried.] let Job be tried, [viz. By crosses and adversity. See Gen.22.on v.1.] unto the end, i.e. to the finishing of the work of his visitation, viz. When his piety shall fully appear by an upright confession of his sins. Oth. Until the overcoming, i.e. until he shall give God the glory of overcoming him, and give over to speak so evil of him. Or thus, shall Job be tried till to the end? As if he feared, that Job would multiply his sins too much, by his too long and lasting trail.] because of his answers, [i.e. the discourses which he held by way of answers.] among unrighteous men. [Heb. Men of unrighteousness, i.e. as being one of those unrighteous men, of God. Or with the unrighteous men, i.e. being their companions in his practise. Oth. For the unrighteous, viz. Being their advocate and pleader.]"}],"37":[{"catchword":null,"tekst":"For unto his sin, [i.e. his faults committed hitherto, through error and mistake.] he should yet add transgression, [i.e. multiply his sins] he should clap in his hands amongst us: [viz. As if he had overcome us with his disputes. See above 27.on v.23. and Compare 1 Kings 9.on v.8. Some understand it thus; that he would challenge them to dispute, and strike covenant, or surety-ship, for entering in and standing to it. Compare above 17.8.] and he should multiply his speechs against God."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
