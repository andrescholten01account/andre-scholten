 gedwaald heb, mijn dwaling zal bij mij overnachten.","5":"Als u zich werkelijk tegen mij verheft, en mijn smaad tegen mij aanvoert;","6":"Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.","7":"Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht.","8":"Hij heeft mijn weg toegemuurd, zodat ik niet door kan gaan, en over mijn paden heeft Hij duisternis gesteld.","9":"Mijn eer heeft Hij van mij afgetrokken, en de kroon van mijn hoofd heeft Hij weggenomen.","10":"Hij heeft mij van rondom afgebroken, zodat ik heenga, en heeft mijn verwachting als een boom weggerukt.","11":"Daartoe heeft Hij Zijn toorn tegen mij ontstoken, en mij bij Zich geacht als Zijn vijanden.","12":"Zijn benden zijn samen aangekomen, en hebben tegen mij hun weg gebaand, en hebben zich rondom mijn tent gelegerd.","13":"Mijn broeders heeft Hij ver van mij gedaan; en die mij kennen, zeker, zij zijn van mij vervreemd.","14":"Mijn nabestaanden houden op, en mijn bekenden vergeten mij.","15":"Mijn huisgenoten en mijn dienstmaagden achten mij als een vreemde; een buitenlander ben ik in hun ogen.","16":"Ik riep mijn knecht, en hij antwoordde niet; ik smeekte met mijn mond tot hem.","17":"Mijn adem is mijn vrouw vreemd; en ik smeek om de wil van de kinderen van mijn buik.","18":"Ook versmaden de jonge kinderen mij; sta ik op, dan spreken zij mij tegen.","19":"Alle mensen van mijn heimelijke raad hebben een afkeer van mij; en degenen die ik liefhad, zijn tegen mij gekeerd.","20":"Mijn gebeente kleeft aan mijn huid en aan mijn vlees; en ik ben ontkomen met de huid van mijn tanden.","21":"Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.","22":"Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?","23":"Och, of nu mijn woorden toch opgeschreven werden. Och, of zij ook in een boek werden ingetekend!","24":"Dat zij met een ijzeren griffie en lood voor eeuwig in een rots gehouwen werden!","25":"Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan;","26":"En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen;","27":"Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.","28":"Voorwaar, u zou zeggen: Waarom vervolgen wij hem? Nu de wortel van de zaak in mij gevonden wordt.","29":"Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is."},"SV":{"1":"Maar Job antwoordde en zeide:","2":"Hoe lang zult gijlieden mijn ziel bedroeven, en mij met woorden verbrijzelen?","3":"Gij hebt nu tienmaal mij schande aangedaan; gij schaamt u niet, gij verhardt u tegen mij.","4":"Maar ook het zij waarlijk, dat ik gedwaald heb, mijn dwaling zal bij mij vernachten.","5":"Indien gijlieden waarlijk u verheft tegen mij, en mijn smaad tegen mij drijft;","6":"Weet nu, dat God mij heeft omgekeerd, en mij *met* Zijn net omsingeld.","7":"Ziet, ik roep, geweld! doch word niet verhoord; ik schreeuw, doch er is geen recht.","8":"Hij heeft mijn weg toegemuurd, dat ik niet doorgaan kan, en over mijn paden heeft Hij duisternis gesteld.","9":"Mijn eer heeft Hij van mij afgetrokken, en de kroon mijns hoofds heeft Hij weggenomen.","10":"Hij heeft mij rondom afgebroken, zodat ik henenga, en heeft mijn verwachting als een boom weggerukt.","11":"Daartoe heeft Hij Zijn toorn tegen mij ontstoken, en mij bij Zich geacht als Zijn vijanden.","12":"Zijn benden zijn te zamen aangekomen, en hebben tegen mij haar weg gebaand, en hebben zich gelegerd rondom mijn tent.","13":"Mijn broeders heeft Hij verre van mij gedaan; en die mij kennen, zekerlijk, zij zijn van mij vervreemd.","14":"Mijn nabestaanden houden op, en mijn bekenden vergeten mij.","15":"Mijn huisgenoten en mijn dienstmaagden achten mij voor een vreemde; een uitlander ben ik in hun ogen.","16":"Ik riep mijn knecht, en hij antwoordde niet; ik smeekte met mijn mond tot hem.","17":"Mijn adem is mijn huisvrouw vreemd; en ik smeek om der kinderen mijns buiks wil.","18":"Ook versmaden mij de jonge kinderen; sta ik op, zo spreken zij mij tegen.","19":"Alle mensen mijns heimelijken raads hebben een gruwel aan mij; en die ik liefhad, zijn tegen mij gekeerd.","20":"Mijn gebeente kleeft aan mijn huid en aan mijn vlees; en ik ben ontkomen met de huid mijner tanden.","21":"Ontfermt u mijner, ontfermt u mijner, o gij, mijn vrienden! want de hand Gods heeft mij aangeraakt.","22":"Waarom vervolgt gij mij als God, en wordt niet verzadigd van mijn vlees?","23":"Och, of nu mijn woorden toch opgeschreven wierden. Och, of zij in een boek ook wierden ingetekend!","24":"Dat zij met een ijzeren griffie en lood voor eeuwig in een rots gehouwen wierden!","25":"Want ik weet: mijn Verlosser leeft, en Hij zal de laatste over het stof opstaan;","26":"En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen;","27":"Denwelken ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.","28":"Voorwaar, gij zoudt zeggen: Waarom vervolgen wij hem? Nademaal de wortel der zaak in mij gevonden wordt.","29":"Schroomt u vanwege het zwaard; want de grimmigheid is *over* de misdaden des zwaards; opdat gij weet, dat er een gericht zij."},"KJV":{"1":"Then Job answered and said,","2":"How long will ye vex my soul, and break me in pieces with words?","3":"These ten times have ye reproached me: ye are not ashamed *that* ye make yourselves strange","4":"And be it indeed *that* I have erred, mine error remaineth","5":"If indeed ye will magnify *yourselves* against me, and plead against me my reproach:","6":"Know now that God hath overthrown me, and hath compassed me with his net.","7":"Behold, I cry out of wrong, but I am not heard: I cry aloud, but *there is* no judgment.","8":"He hath fenced up my way that I cannot pass, and he hath set darkness in my paths.","9":"He hath stripped me of my glory, and taken the crown *from* my head.","10":"He hath destroyed me on every side, and I am gone: and mine hope hath he removed like a tree.","11":"He hath also kindled his wrath against me, and he counteth me unto him as *one of* his enemies.","12":"His troops come together, and raise up their way against me, and encamp round about my tabernacle.","13":"He hath put my brethren far from me, and mine acquaintance are verily estranged","14":"My kinsfolk have failed, and my familiar friends have forgotten","15":"They that dwell in mine house, and my maids, count me for a stranger: I am an alien in their sight.","16":"I called my servant, and he gave *me* no answer; I intreated him with my mouth.","17":"My breath is strange to my wife, though I intreated for the children's *sake* of mine own body.","18":"Yea, young children despised me; I arose, and they spake","19":"All my inward friends abhorred me: and they whom I loved are turned","20":"My bone cleaveth to my skin and to my flesh, and I am escaped with the skin of my teeth.","21":"Have pity upon me, have pity upon me, O ye my friends; for the hand of God hath touched","22":"Why do ye persecute me as God, and are not satisfied with my flesh?","23":"Oh that my words were now written! oh that they were printed in a book!","24":"That they were graven with an iron pen and lead in the rock for ever!","25":"For I know *that* my redeemer liveth, and *that* he shall stand at the latter *day* upon the earth:","26":"And *though* after my skin *worms* destroy this *body*, yet in my flesh shall I see God:","27":"Whom I shall see for myself, and mine eyes shall behold, and not another; *though* my reins be consumed within","28":"But ye should say, Why persecute we him, seeing the root of the matter is found","29":"Be ye afraid of the sword: for wrath *bringeth* the punishments of the sword, that ye may know *there is* a judgment."}},"tsk":{"2":[{"kopje":"Hoe lang","refs":["Job 8:2","Job 18:2"," v\" data-code=\"H8615\">hope</span> hath he <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> like a tree.","11":"He hath also <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> his <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> against me, and he <span class=\"wl wl-kjv\" data-code=\"H2803\">counteth</span> me unto him as one of his enemies.","12":"His <span class=\"wl wl-kjv\" data-code=\"H1416\">troops</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and raise <span class=\"wl wl-kjv\" data-code=\"H5549\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> against me, and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamp</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> my tabernacle.","13":"He hath <span class=\"wl wl-kjv\" data-code=\"H7368\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, and mine <span class=\"wl wl-kjv\" data-code=\"H3045\">acquaintance</span> are verily estranged","14":"My <span class=\"wl wl-kjv\" data-code=\"H7138\">kinsfolk</span> have <span class=\"wl wl-kjv\" data-code=\"H2308\">failed,</span> and my familiar <span class=\"wl wl-kjv\" data-code=\"H3045\">friends</span> have forgotten","15":"They that <span class=\"wl wl-kjv\" data-code=\"H1481\">dwell</span> in mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and my <span class=\"wl wl-kjv\" data-code=\"H519\">maids,</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">count</span> me for a <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger:</span> I am an <span class=\"wl wl-kjv\" data-code=\"H5237\">alien</span> in their sight.","16":"I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and he gave me no <span class=\"wl wl-kjv\" data-code=\"H6030\">answer;</span> I <span class=\"wl wl-kjv\" data-code=\"H2603\">intreated</span> him <span class=\"wl wl-kjv\" data-code=\"H1119\">with</span> my mouth.","17":"My <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> is <span class=\"wl wl-kjv\" data-code=\"H2114\">strange</span> to my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> though I <span class=\"wl wl-kjv\" data-code=\"H2589\">intreated</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> sake of mine own body.","18":"Yea, young <span class=\"wl wl-kjv\" data-code=\"H5759\">children</span> <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> me; I <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and they spake","19":"All my <span class=\"wl wl-kjv\" data-code=\"H5475\">inward</span> <span class=\"wl wl-kjv\" data-code=\"H4962\">friends</span> <span class=\"wl wl-kjv\" data-code=\"H8581\">abhorred</span> me: and they whom I <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> are turned","20":"My <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaveth</span> to my <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> and to my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> with the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of my teeth.","21":"Have <span class=\"wl wl-kjv\" data-code=\"H2603\">pity</span> upon me, have <span class=\"wl wl-kjv\" data-code=\"H2603\">pity</span> upon me, O ye my <span class=\"wl wl-kjv\" data-code=\"H7453\">friends;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> hath touched","22":"Why do ye <span class=\"wl wl-kjv\" data-code=\"H7291\">persecute</span> me as <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and are not <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> with my flesh?","23":"Oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> my <span class=\"wl wl-kjv\" data-code=\"H4405\">words</span> were <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">written!</span> oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> they were <span class=\"wl wl-kjv\" data-code=\"H2710\">printed</span> in a book!","24":"That they were <span class=\"wl wl-kjv\" data-code=\"H2672\">graven</span> with an <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H5842\">pen</span> and <span class=\"wl wl-kjv\" data-code=\"H5777\">lead</span> in the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> for ever!","25":"For I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that my <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and that he shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand</span> at the <span class=\"wl wl-kjv\" data-code=\"H314\">latter</span> day upon the earth:","26":"And though <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> my <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> worms <span class=\"wl wl-kjv\" data-code=\"H5362\">destroy</span> this body, yet in my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall I <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> God:","27":"Whom I shall <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> for myself, and mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">behold,</span> and not <span class=\"wl wl-kjv\" data-code=\"H2114\">another;</span> though my <span class=\"wl wl-kjv\" data-code=\"H3629\">reins</span> be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> within","28":"But ye should <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Why <span class=\"wl wl-kjv\" data-code=\"H7291\">persecute</span> we him, seeing the <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> is found","29":"Be ye <span class=\"wl wl-kjv\" data-code=\"H1481\">afraid</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> for <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath</span> bringeth the <span class=\"wl wl-kjv\" data-code=\"H5771\">punishments</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> there is a <span class=\"wl wl-kjv\" data-code=\"H1779\">judgment.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"met woorden","tekst":"Dat is, met veel gezwets en gesnater mij balorig maken; of met ongegronde en vijandige aanspraken verdrukken?"}],"3":[{"catchword":"tienmaal","tekst":"Dat is, dikwijls; een zeker getal voor een onzeker. En alzo wordt het getal van tien menigmalen gebruikt; zie Gen 31:7 ."},{"catchword":"verhardt u","tekst":"Of, verstijft; dat is, zo onbeschaamdelijk en hardnekkiglijk tegen mij twist? Anders, [zo] vreemd tegen mij stelt?"}],"4":[{"catchword":"dat ik","tekst":"Dat is, genomen dat ik door misverstand of zwakheid mij vergrepen had."},{"catchword":"mijn dwaling","tekst":"Dat is, mijn fout, zo ik ze heb, raakt mij, niet u; gijlieden hebt daarvoor niet te zorgen; laat mij met vrede, dat ik mij verzoene met God en wachte wat daarvan komen wil, zonder zo voort te varen met mij te versmaden en te lasteren."}],"5":[{"catchword":"u verheft","tekst":"Of, grootmaker; dat is, u stoutelijk en trotselijk tegen mij met hoge woorden en bittere passiën aanstelt. Het Hebreeuwse woord is ook zo genomen Psa 35:26 ; Jer 48:26 ; Lam 1:9 ; Eze 35:13 ; Zep 2:8 ."},{"catchword":"mijn smaad","tekst":"Dat is, poogt met heftige twisting te bewijzen hetgeen mij schadelijk is, en met mijn smaadheid verenigd. Smaad, voor hetgeen dat smadelijk maakt. Vergelijk onder, Job 20:3 , de aantekening over het woord beschamende."}],"6":[{"catchword":"dat God","tekst":"Hij wil zeggen dat zij behoorden te bedenken, dat hij buitengewoon door de hand Gods vernederd was, en daarom veel meer tot barmhartigheid bewogen te zijn en hem te vertroosten, dan zo smadelijk tegen hem uit te vallen en met verkeerde oordelen zijn lijden te bezwaren. Vergelijk Job 6:14-16 ."},{"catchword":"omgekeerd,","tekst":"Of, gekromd; dat is, door velerlei lijden gans terneder gedrukt en verdorven."},{"catchword":"met Zijn net","tekst":"Of, over mij; dat is, Hij heeft mij zo omsingeld met velerlei ellenden en plagen, dat ik niet ontgaan kan, even alsof ik rondom met strikken bezet ware, die men niet kan mijde. Zie van dezelfde gelijkenis boven, Job 18:8 , en onder, Job 22:10 ; Lam 1:13 ; Eze 12:13 , en Eze 32:3 ; Hos 7:12 ."}],"7":[{"catchword":"geweld","tekst":"Dat is, dat mij geweld geschiedt, omdat ik, vroom zijnde, dus geweldiglijk van God gestraft en smadelijk van mijn vrienden veroordeeld en bespot word, en daarover roepende tot God, niet wordt geholpen. Zie gelijke manier van spreken Jer 20:8 ; Hab 1:2 ."},{"catchword":"recht","tekst":"Te weten, voor alsnu, waardoor mijn zaak verdedigd en ik uit dit lijden zou mogen verlost worden. Alzo worden de vromen somtijds in hun kruis als verlaten, omdat zij de tegenwoordige hulp van God niet gevoelende, onder het lijden schijnen te versmachten; Psa 13:2 , en Psa 88:15 ; Lam 3:8 ; Hab 1:2 . Hetwelk ook den Heere Christus, het hoofd der gelovigen, wedervaren is; Psa 22:3 ."}],"8":[{"catchword":"Hij heeft","tekst":"Vergelijk hiermede boven, Job 3:23 ; Lam 3:7 , Lam 3:9 . De zin is dat hij rondom zo met alle lijden bezet en omtuind was, dat hij gans geen uitkomst kon bemerken. Vergelijk boven, vs.6 de laatste aantekening, en Hos 2:5 ."},{"catchword":"duisternis","tekst":"Vergelijk boven, Job 3:23 de aantekening."}],"9":[{"catchword":"Mijn eer","tekst":"Dat is, Hij heeft mij ontbloot en beroofd van al mijn staat, vermogen, waardigheid en aanzien. Het woord eer is aldus genomen Psa 7:6 ; Isa 16:14 , en Isa 21:16 . Vergelijk Gen 31:1 ."},{"catchword":"kroon","tekst":"Versta door de kroon hier al hetgeen hem tot heerlijkheid en sieraad gediend had. Alzo is dit woord genomen onder, Job 31:36 ; Pro 4:9 , en Pro 12:4 , en Pro 14:24 , en Pro 16:31 , en Pro 17:6 ; Lam 5:16 ; Eze 21:26 ."}],"10":[{"catchword":"afgebroken,","tekst":"Versta dit van het verlies der goederen, hetwelk hij aan alle zijden geleden had."},{"catchword":"henenga,","tekst":"Dat is, verga en tenonder kome."},{"catchword":"verwachting","tekst":"Versta hiermede de hoop van zijn tijdelijken welstand in dit leven; want aan de hoop van zijn eeuwig welvaren heeft hij zich altijd vastgehouden; gelijk te zien is boven, Job 13:15-16 , en onder vs.25-27."},{"catchword":"weggerukt","tekst":"Hebreeuws, doen verreizen; dat is, uitgeroeid en vervoerd; want, gelijk voor een boom, die uitgeworteld is en zo gelaten wordt, geen hoop meer is van weder te zullen groeien en groenen, alzo zegt Job, dat hij zo ontbloot was van alle tijdelijk welvaren, dat er geen hoop meer voor hem was om weder op te komen."}],"11":[{"catchword":"geacht","tekst":"Zo oordeelt het vlees als God de zijnen beproeft en kastijdt. Alzo boven, Job 13:24 ."}],"12":[{"catchword":"Zijn benden","tekst":"Hij verstaat hierdoor de menigte der kwalen en plagen, die hem overkomen waren, boven, Job 1 , Job 2 , ja zelfs zijn vrienden, die met hun verkeerd oordeel en kwaadspreken hem veel verdriet aandeden, boven, vs.2,3."},{"catchword":"weg gebaand,","tekst":"Te weten, naar de wijze van doen der heirlegers, welke een stad door belegering willende krijgen, rondom dezelve alle ongangbare en onbruikelijke wegen effenen, en tot hun gebruik bekwaam maken, om des te meer de stad te beschadigen en te eer te veroveren. Hebreeuws eigenlijk, opgehoogd."}],"13":[{"catchword":"broeders","tekst":"Versta, zijn vleselijke maagschap, of ook de geestelijke, van welke hij, om de enigheid des geloofs, broederlijke vertroostingen verwacht zou hebben. Zie Gen 13:8 ."},{"catchword":"zekerlijk,","tekst":"Dat is, zonder enigen twijfel, gelijk het nu blijkende is. Anders, alleen vervreemden zij zich van mij; dat is, dat zij hem geen anderen dienst wisten te bewijzen in zulk een droevigen staat, dat hem te aanschouwen, als niet wetende hem te helpen."}],"14":[{"catchword":"houden op,","tekst":"Anders, ontbreken; te weten, van mij te bezoeken, te vertroosten en de onderlinge gedienstigheden te bewijzen, die men elkander in zulk een nood schuldig is."}],"15":[{"catchword":"huisgenoten","tekst":"Of, de inwoners van mijn huis, of die in mijn huis verkeren. Het Hebreeuwse woord schijnt algemeen te zijn, betekenende niet alleen degenen, die in het huis steeds wonen als huisgenoten, maar ook die daarin veel verkeren als goede bekenden."},{"catchword":"ben ik","tekst":"Dat is, zij houden en achten mij voor een, die hen niet aangaat en met wien zij niet te doen hebben. Zie boven, Job 18:3 ."}],"16":[{"catchword":"smeekte","tekst":"Te weten, om iets voor mij te doen. Hij gebood hem niet alleen als huisvader, maar bad hem ook als een van zijns gelijken."}],"17":[{"catchword":"adem","tekst":"Hebreeuws, geest. Alzo boven, Job 9:18 . De zin is, dat zijn huisvrouw zich van hem afkeerde als van een, die een stinkenden adem heeft; vervolgens dat zij van hem een afkeer, ja afschuw had, en hem alle schuldige diensten weigerde."},{"catchword":"om der kinderen","tekst":"Dat is, om den trek en de genegenheid, die zij tot mij nog zou mogen hebben, vanwege de kinderen, die wij hier tevoren tezamen gekregen en opgebracht hebben."}],"18":[{"catchword":"de jonge kinderen;","tekst":"Alzo wordt het Hebreeuwse woord genomen onder, Job 21:11 . Anders, de verkeerde, of ongerechtige; gelijk boven, Job 16:11 ."},{"catchword":"sta ik op,","tekst":"Te weten, om hen te stillen en van kwaadspreken te doen ophouden. Anders, om die door beleefdheid en schone woorden aan mij te verbinden."}],"19":[{"catchword":"mensen","tekst":"Versta, de mannen, dien hij zijn geheimen placht te vertrouwen, en zich daarmede te beraden."}],"20":[{"catchword":"gebeente","tekst":"Hij wil zeggen dat al de vochtigheid en kracht zijns levens zo verteerd en uitgedroogd was, dat hij niet veel meer had dan het vel en de benen, welke met het vel en het weinige vlees zou uitstaken, dat zij niet daarmede schenen te groeien, maar daaraan gehecht te zijn. Vergelijk Psa 102:6 ."},{"catchword":"en ik ben","tekst":"Dat is, de Heere heeft mijn lichaam zo aangetast, dat daaraan niets overig is gebleven dan het vel, hetwelk is aan de tanden, dat is het tandvlees, of de lippen, waarmede de tanden bedekt zijn. Hij wil zeggen dat hij niet dan een geraamte was van beenderen met vel bedekt, zodat hij bijna anders niets had dan den mond om te spreken."}],"21":[{"catchword":"aangeraakt","tekst":"Dat is, zeer beschadigd en geplaagd aan mijn lichaam, vrienden en middelen; zie Gen 26:11 . Aldus wordt onze Zaligmaker genoemd de geraakte Gods, Isa 53:4 . Dat is, die van God zeer geplaagd was."}],"22":[{"catchword":"als God,","tekst":"Dat is, gelijk God mij vervolgt, even alsof gij hetzelfde recht over mij hadt."},{"catchword":"en wordt","tekst":"Dat is, waarom is het u niet genoeg, dat mijn vlees door mijn lijden vergaan is, maar dat gij nog mijn geest bezwaart met uw verkeerd oordeel en kwade lasteringen."}],"23":[{"catchword":"Och,","tekst":"Hebreeuws, wie zal nu geven, dat mijne, enz. Alzo in het volgende van vs.23; zie boven, Job 11:5 ."}],"24":[{"catchword":"lood","tekst":"Te weten, dat gesmolten en gegoten zijnde in de snede door de griffel gemaakt in de rots, dezelfde snede klaarder zou aftekenen. Sommigen verstaan hier een loden plaat, waar het ook op gehouwen zou worden."}],"25":[{"catchword":"Want ik weet","tekst":"Hij wil zeggen: Dewijl ik tegenwoordig zo ellendig ben, en daarenboven verdacht gemaakt word, dat ik God niet vrees noch op hem hoop, boven, Job 18:21 , hoewel ik mij hier tevoren daarover verklaard heb, boven, Job 13:15-16 ; zo verklaar ik nu dat ik geloof dat de beloofde Messias mijn Zaligmaker is, die mij ten jongsten dage ten eeuwigen leven opwekken zal."},{"catchword":"Verlosser leeft,","tekst":"Hebreeuws, goël. Versta, den beloofden Messias, onzen Heere Jezus Christus. Vergelijk Gen 48:16 ; Isa 59:20 met de aantekening. Zie wijders van het gebruik van dit woord Lev 25:25 , enz.; Rth 2:20 , en Rth 3:9 , Rth 3:12 , enz."},{"catchword":"Hij zal","tekst":"Dat is, ten laatste, of ten laatsten [dage]. Of, de laatste; dat is, die de eindelijke en laatste rechter over allen zijn zal."},{"catchword":"over het stof","tekst":"Dat is, zich ten jongsten dage met grote heerlijkheid over al degenen, die in het stof of in de aarde liggen vertonen zal, om die op te wekken, te oordelen, en de zijnen, waarvan ik een ben, tot zich in de eeuwige zaligheid op te nemen. Sommigen nemen deze woorden aldus: En de laatste [te weten, mens] zal op het st of opstaan; dat is, alle mensen zullen opstaan tot den laatsten toe. Sommigen verstaan dat Job hier spreekt van zijn eigen opstanding, en zetten het aldus over: En dit [te weten, lichaam of vlees, gelijk in vs.26] zal ten laatste op het stof opstaan."}],"26":[{"catchword":"zij","tekst":"Te weten, de doorboorders, dat is, de wormen en maden, die mijn huid en gehele lichaam in de aarde doorboren zullen."},{"catchword":"na mijn huid","tekst":"Dat is, na de doorboring en verslinding mijner huid."},{"catchword":"dit doorknaagd","tekst":"Versta, het overige zijns lichaams, waarop hij met zijn vinger gewezen heeft, alsof hij zeide: Dit ellendig vlees en deze zwakke benen, die met de huid bedekt zijn. De zin is, dat de wormen niet alleen zijn huid, maar ook zijn vlees en benen, of het gehele lichaam doorknagen zouden, doch dat daarna in de verrijzenis hetzelve hem weder geworden zou, om daarin zijn God te zien."},{"catchword":"God aanschouwen;","tekst":"Namelijk den Heere Christus, God geopenbaard in het vlees, en zichtbaar in grote majesteit ten oordeel verschijnende."}],"27":[{"catchword":"voor mij","tekst":"Dat is, tot mijn best, of tot mijn eeuwige vreugde en zaligheid."},{"catchword":"een vreemde;","tekst":"Te weten, mens, of oog; dat is, met geen ander lichaam of ogen zal ik Hem aanschouwen, dan met deze mijn eigene, gelijk ik ook met mijn eigen lichaam opstaan zal, en niet met een ander van nieuws geschapen; zie 1Co 15:53 ."},{"catchword":"mijn nieren","tekst":"De nieren worden in de Heilige Schrift zeer dikwijls voor het inwendigste, als voor de begeerten, aandoeningen, of bewegingen des mensen genomen, gelijk hier en Psa 7:10 , en Psa 26:2 ; Pro 23:16 ; Jer 12:2 , enz. Vergelijk onder, Job 38:36 ."},{"catchword":"verlangen zeer","tekst":"Of, vergaan; te weten van verlangen, dat is, mijn begeerten en genegenheden zijn zo ontstoken tot de aanschouwing van mijn Heere en Zaligmaker, dat zij bijna versmachten, of bezwijken. Het Hebreeuwse woord wordt zo genomen 2Sa 13:39 ; Psa 84:3 , en Psa 119:81-82 , Psa 119:123 , en Psa 139:13 ."},{"catchword":"schoot","tekst":"Versta, het binnenste des mensen. Zo wordt dit genomen Ecc 7:9 ."}],"28":[{"catchword":"gij zoudt zeggen","tekst":"Dat is, gij behoordet te zeggen."},{"catchword":"Nademaal","tekst":"Dat is, omdat de eerste stof en oorsprong van ons geschil is het lijden, dat mij God toegezonden heeft; waarover gij, als vrienden, eer medelijden met mij moest hebben, dan mij dus smadelijk te overhalen. Of versta, door den wortel der zaak den vasten grond des geschils, vervattende de bondige redenen, die het dispuut behoorden te eindigen, en niet waren in de redenen zijner vrienden, maar wel in de zijne te vinden. Men kan ook door dezen wortel verstaan de schone belijdenis des geloofs, die Job gedaan had, en zijn vrienden behoorde te voldoen, om hem niet meer voor een huichelaar te houden."}],"29":[{"catchword":"vanwege","tekst":"Hebreeuws, van het aangezicht des zwaards. Hij noemt een soort der straffen, voor alle, welke van God over de onboetvaardigen gezonden worden."},{"catchword":"de grimmigheid","tekst":"Versta, de grimmigheid Gods, welke zich openbaart over de ongerechtigheden der mensen; Rom 1:18 . Zie 2Ch 28:13 . Anders, [zulke] grimmigheid, te weten, als de vrienden van Job tegen Job openbaarden [is een] der misdaden van het zwaard, of brengt mede de straffen van het zwaard."},{"catchword":"zwaards;","tekst":"Dat is, die het zwaard of enige andere straffen verdienen."},{"catchword":"een gericht","tekst":"Te weten, bij God, die de zonden straft in dit leven, òf in het toekomende, òf in beide."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered, and said;"}],"2":[{"catchword":null,"tekst":"How long will ye make sad my soul, and bruise me with words? [i.e. disturb and dull me with your prating and babbling. Or, oppress me with groundless and hostile charges.]"}],"3":[{"catchword":null,"tekst":"Ye have put me to shame now ten times; [i.e. very often a certain number for an uncertain: and thus the number of ten is often used. See Gen.3.on v.7.] ye are not ashamed, ye harden yourselves against me. [or, grow stiff, in that ye contend so impundently and obstinately with me. Otherw. That ye carry yourselves so strangely towards me.]"}],"4":[{"catchword":null,"tekst":"But also, be it indeed, that I have erred; [i.e. admit, put case, that through mistake, or weakness I may have slipt, or forgot my self.] Mine error shall tarry (all) night with me. [i.e. my fault, if any there be, doth touch my self, not you: ye need not trouble yourselves for the same, let me alone and unmolested, that I may reconcile my self with God, and wait on the issue, without going on thus to revile and slander me.]"}],"5":[{"catchword":null,"tekst":"If indeed ye exalt your selves against me, [or, make your selves great. i.e. are stoutly and spightfully set against with big words and bitter insultings. The Hebrew word f the faithful, Psa 22:3.]"}],"8":[{"catchword":null,"tekst":"He hath walled up my way, [Compare with this above chap.3.23. and Lam 3:7,9. The meaning is that he was round about so begirt and hemed in with all manner of misery, that he saw not the least gap for any escape. Compare above v.6. the last annot. And Hos 2:5.] That I cannot pass through: and over my paths hath he set darkness. [Compare above chap.3.on v.23.]"}],"9":[{"catchword":null,"tekst":"Mine honour he hath plucked off from me, [i.e. he hath dispossessed and bereaved me of all my former estate, means, worth and authority. The word honour is taken in this sense, Psa 7:6. Isa 16:14. and 21.16. Compare Gen.31.on v.1.] And the Crown of my head he hath taken away. [understand by the Crown, whatsoever served him for his glory, and ornament. So this word is taken, below chap.31.36. Pro 4:9. and 12.4. and 14.24. and 16.31. and 17.6. Lam 5:16. Eze 21:26.]"}],"10":[{"catchword":null,"tekst":"He hath broken me down round about, [understand this of the loss of his goods, which he had suffered on all hands.] So that I pass away; [i.e. go to decay and perish.] And hath removed [Heb. Made to depart.] Mine expectation, [understand hereby the hope of his everlasting welfare, he ever cleaved fast to that, as is to be seen, above chap.13.15,16. And below in this chap.v.25.26,27.] Like a tree. [i.e. he hath taken me up by the roots and carried me away: for as there is no hope for a tree, that is rooted up, and left so, that ever he should grow and flourish again; so saith Job, he was out of all temporal welfare, that there was no hope left for his recovering.]"}],"11":[{"catchword":null,"tekst":"Besides, he hath kindled his anger against me, and accounted me by him, as his enemies. [Thus the flesh judgeth, when God doth but try and chastise his children. So above chapter 13.on verse 24.]"}],"12":[{"catchword":null,"tekst":"His troops are arrived together [hereby he understandeth the manifold plagues and troubles, that were come upon him, above chap.1. and 2. Yea his friends themselves, who by their perverse judging, and bitter speaking did very much afflict and vex him, above v.2.and 3. And have made plain their way against me. [viz. Accord to the manner of hoasts and armies, who being about to subdue a City by siege, lay all the rubs and obstacles level round about it, for to facilitate their passage and communication, and the better to make their approaches for the speedy subduing and mastering of the City. Heb. Properly raised up.] And have leaguered themselves round about my Tent."}],"13":[{"catchword":null,"tekst":"My brethren he hath put far away from me: [understand his carnal kindred, or the spiritual also, from whom, because of the unity of faith he might have expected some brotherly consolation. See Gen.13.on v.8.] And those that know me, assuredly they are estranged from me. [i.e. without all peradvernture, as it doth plainly appear now. Oth. Onely they enstrange themselves from me, i.e. they knew not how to do him any other service in this sad condition of his, but to eschew and shun him, as not knowing by what means to help him.]"}],"14":[{"catchword":null,"tekst":"My near (friends) cease. [Oth. Fail, viz. To risit me and comfort me, and to shew me that reciprocal kindness, which one friend doth owe to another, in such straights.] And my acquaintance forget me."}],"15":[{"catchword":null,"tekst":"My household [or, the inhabitants of my house: or those which converse in my house. The Hebrew word seemeth to be general; betoken not only those that are constants inhabitants of the house, and of the household, but those also which repair to it and converse, there as good friends & acquaintance.] And my serving maids count me a stranger. I am a foreigner in their eyes, [i.e. they hold and count me for one that hath no relation to them, and with whom they have nothing to do. See above chap.18.on v.3.]"}],"16":[{"catchword":null,"tekst":"I called my servant and he answered me er with the skin, and had scarce any thing whole or sound about him, but his mouth to speak withal.]"}],"21":[{"catchword":null,"tekst":"Have pity on me, have pity on me, O ye my friends, for the hand of God hath seized me. [i.e. extreamly afflicted & plagued me in my body, friends and substance. See Gen.26.on v.11. Thus our Saviour is called, the seized of God, Isa 53:4. i.e. greatly afflicted by God."}],"22":[{"catchword":null,"tekst":"Why do ye persecute me like God, [i.e. as God doth persecute me, as if ye had or could challenge the same right over me.] And are not satisfied with my flesh? [i.e. why is it not sufficient for you, that my flesh is consumed by my suffering, that ye must needs afflict my spirit too, with your perverse doom and yile slanderings.]"}],"23":[{"catchword":null,"tekst":"O that [Heb. Who shall give that, and so in the sequel of this verse. See above 11.on v.8.] My words now were written down. Oh! That they were likewise entered into a book?"}],"24":[{"catchword":null,"tekst":"That they were hewen into a rock forever, with an lion graver and lead, [viz. Which being melted and powered out unto the cuts made by the iron grave in the rock, might the better set out and shew the laid cuts. Some do understand by the lead here, a leaden plate, which should likewise have his words cut or ingraven upon it.]"}],"25":[{"catchword":null,"tekst":"For I know my Redeemer liveth, [His meaning is; Since I am so miserable at present, and am besides made suspected as one neither fearing God, nor trusting in him, above chap.18.21. though I have declared my self formerly in that behalf, above chap.13.15,16. Yet do I solemnly declare now, that I do believe the promised Messia to be my Saviour, who shall raise me up at last day unto eternal life. The word Redeemer, Heb. Goel, betokeneth the promised Messia, our LORD and Saviour Jesus Christ. Compare Gen 48:16. Isa 59:20.] with the annotation, and see further of the use of this word. Levit.25.25. &c. And Ruth.2.20 en in Scripture for the inmost disposition; as the affections, inward motions and desires of man. So here and Psa 7:10. and 26.2. Prov 23:16. Jer 12:2. &c. Compare below 38.on verse 36.] long much [or consume, viz. With longing i.e. my desires and longings are so fervent within me, for to behold my LORD and Saviour once, that they are even ready to make me faint and consume. Thus the Hebrew word is taken. 2 Samuel 13.39. Psa 84:3. & 119.81,123. And 139.13.] in my bosom. [understand the inmost part of man. So this word is taken, Ecc 7:9.]"}],"28":[{"catchword":null,"tekst":"Verily, ye should say; [i.e. ye ought to say] Wherefore do we persecute him? Seeing the root of the matter is found in me. [i.e. seeing, that the first matter and ground of our difference, is the affliction which God sent upon me, in regard whereof ye ought rather to commiserate me, then to fall so reproachfully upon me. Or, understand by the root of the matter, the main ground of the difference, comprehending the solid reasons, which ought to end the dispute, and which were found not in theirs, but in his arguings. Also by this Root, there may be understood, that excellent confession of faith, which Job had made, and ought to have satisfied his friends, to count him no longer an Hypocrite.]"}],"29":[{"catchword":null,"tekst":"Be ye afraid because of the Sword; [Hebr. From the face of the Sword; He nameth one sort of punishments wherewith God visiteth the impenitent, instead of all] for the fierceness [understanding the fierce Wrath of God, which doth reveal it self over the unrighteousness of men, Rom 1:18. See 2 Chron.28.on verse 13. Oth. (such) fierceness, viz. As the friends of Job did shew against him (is one) of the iniquities of the Sword, or, bringeth with it the punishments of the sword] is (over) the iniquities of the sword; [i.e. which deserve the sword, or some other destructive judgement.] that ye may know, there is a judgement. [viz. With God, who doth punish sins, either in this life, or in that to come, or in both together.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
