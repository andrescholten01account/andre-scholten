n, als uw ziel in de plaats van mijn ziel was? Zou ik woorden tegen u kunnen samenhopen, en zou ik met mijn hoofd over u kunnen schudden?","5":"Ik zou u versterken met mijn mond, en de beweging van mijn lippen zou de smart verzachten.","6":"Als ik spreek, wordt mijn smart niet ingehouden; en houd ik op, wat gaat er dan van mij weg?","7":"Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest.","8":"Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.","9":"Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.","10":"Zij gapen met hun mond tegen mij; zij slaan met smaad op mijn kaken; zij verzamelen zich samen tegen mij.","11":"God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.","12":"Ik had rust, maar Hij heeft mij verbroken, en mij bij mijn nek gegrepen, en mij verpletterd; en Hij heeft mij Zich tot een doelwit opgericht.","13":"Zijn schutters hebben mij omringd; Hij heeft mijn nieren doorkliefd, en niet gespaard; Hij heeft mijn gal op de aarde uitgegoten.","14":"Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.","15":"Ik heb een zak over mijn huid genaaid; ik heb mijn hoorn in het stof gedaan.","16":"Mijn gezicht is helemaal bemodderd van het wenen, en op mijn oogleden ligt de schaduw van de dood.","17":"Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.","18":"O aarde, bedek mijn bloed niet; en laat er voor mijn geroep geen plaats zijn.","19":"Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.","20":"Mijn vrienden bespotten mij; maar mijn oog druipt tot God.","21":"Och, mocht men rechtspreken voor een man bij God, zoals een kind van een mens voor zijn vriend.","22":"Want er zullen nog maar weinige jaren in aantal aankomen, en ik zal het pad heengaan waardoor ik niet zal terugkeren."},"SV":{"1":"Maar Job antwoordde en zeide:","2":"Ik heb vele dergelijke dingen gehoord; gij allen zijt moeilijke vertroosters.","3":"Zal er een einde zijn aan de winderige woorden? Of wat stijft u, dat gij *alzo* antwoordt?","4":"Zou ik ook, als gijlieden, spreken, indien uw ziel ware in mijner ziele plaats? Zou ik woorden tegen u samenhopen, en zou ik over u met mijn hoofd schudden?","5":"Ik zou u versterken met mijn mond, en de beweging mijner lippen zou zich inhouden.","6":"Zo ik spreek, mijn smart wordt niet ingehouden; en houd ik op, wat gaat er van mij weg?","7":"Gewisselijk, Hij heeft mij nu vermoeid; Gij hebt mijn ganse vergadering verwoest.","8":"Dat Gij mij rimpelachtig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn aangezicht.","9":"Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn wederpartijder scherpt zijn ogen tegen mij.","10":"Zij gapen met hun mond tegen mij; zij slaan met smaadheid op mijn kinnebakken; zij vervullen zich te zamen aan mij.","11":"God heeft mij den verkeerde overgegeven, en heeft mij afgewend in de handen der goddelozen.","12":"Ik had rust, maar Hij heeft mij verbroken, en bij mijn nek gegrepen, en mij verpletterd; en Hij heeft mij Zich tot een doelwit opgericht.","13":"Zijn schutters hebben mij omringd; Hij heeft mijn nieren doorspleten, en niet gespaard; Hij heeft mijn gal op de aarde uitgegoten.","14":"Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.","15":"Ik heb een zak over mijn huid genaaid; ik heb mijn hoorn in het stof gedaan.","16":"Mijn aangezicht is gans bemodderd van wenen, en over mijn oogleden is des doods schaduw.","17":"Daar toch geen wrevel in mijn handen is, en mijn gebed zuiver is.","18":"O, aarde! bedek mijn bloed niet; en voor mijn geroep zij geen plaats.","19":"Ook nu, zie, in den hemel is mijn Getuige, en mijn Getuige in de hoogten.","20":"Mijn vrienden zijn mijn bespotters; *doch* mijn oog druipt tot God.","21":"Och, mocht men rechten voor een man met God, gelijk een kind des mensen voor zijn vriend.","22":"Want *weinige* jaren in getal zullen er *nog* aankomen, en ik zal het pad henengaan, *waardoor* ik niet zal wederkeren."},"KJV":{"1":"Then Job answered and said,","2":"I have heard many such things: miserable comforters","3":"Shall vain words have an end? or what emboldeneth thee that thou answerest?","4":"I also could speak as ye *do*: if your soul were in my soul's stead, I could heap up words against you, and shake mine head at","5":"*But* I would strengthen you with my mouth, and the moving of my lips should asswage","6":"Though I speak, my grief is not asswaged: and *though* I forbear, what am I eased?","7":"But now he hath made me weary: thou hast made desolate all my company.","8":"And thou hast filled me with wrinkles, *which* is a witness *against me*: and my leanness rising up in me beareth witness to my face.","9":"He teareth *me* in his wrath, who hateth me: he gnasheth upon me with his teeth; mine enemy sharpeneth his eyes","10":"They have gaped upon me with their mouth; they have smitten me upon the cheek reproachfully; they have gathered themselves together","11":"God hath delivered me to the ungodly, and turned me over into the hands of the wicked.","12":"I was at ease, but he hath broken me asunder: he hath also taken *me* by my neck, and shaken me to pieces, and set me up for his mark.","13":"His archers compass me round about, he cleaveth my reins asunder, and doth not spare; he poureth out my gall upon the ground.","14":"He breaketh me with breach upon breach, he runneth upon me like a giant.","15":"I have sewed sackcloth upon my skin, and defiled my horn in the dust.","16":"My face is foul with weeping, and on my eyelids *is* the shadow of death;","17":"Not for *any* injustice in mine hands: also my prayer *is* pure.","18":"O earth, cover not thou my blood, and let my cry have no place.","19":"Also now, behold, my witness *is* </span> upon me like a giant.","15":"I have <span class=\"wl wl-kjv\" data-code=\"H8609\">sewed</span> <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> upon my <span class=\"wl wl-kjv\" data-code=\"H1539\">skin,</span> and <span class=\"wl wl-kjv\" data-code=\"H5953\">defiled</span> my <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> in the dust.","16":"My <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> is <span class=\"wl wl-kjv\" data-code=\"H2560\">foul</span> with <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping,</span> and on my <span class=\"wl wl-kjv\" data-code=\"H6079\">eyelids</span> is the shadow of death;","17":"Not for any <span class=\"wl wl-kjv\" data-code=\"H2555\">injustice</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3709\">hands:</span> also my <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> is pure.","18":"O <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> not thou my <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and let my <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> have no place.","19":"Also now, behold, my <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> is in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and my <span class=\"wl wl-kjv\" data-code=\"H7717\">record</span> is on high.","20":"My <span class=\"wl wl-kjv\" data-code=\"H7453\">friends</span> <span class=\"wl wl-kjv\" data-code=\"H3887\">scorn</span> me: but mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> poureth <span class=\"wl wl-kjv\" data-code=\"H1811\">out</span> tears unto God.","21":"O that one might <span class=\"wl wl-kjv\" data-code=\"H3198\">plead</span> for a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> with <span class=\"wl wl-kjv\" data-code=\"H433\">God,</span> as a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> pleadeth for his <span class=\"wl wl-kjv\" data-code=\"H1121\">neighbour!</span>","22":"When a <span class=\"wl wl-kjv\" data-code=\"H4557\">few</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> are <span class=\"wl wl-kjv\" data-code=\"H857\">come,</span> then I shall <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> the <span class=\"wl wl-kjv\" data-code=\"H734\">way</span> whence I shall not return."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"dergelijke dingen","tekst":"Te weten, als gij mij voorgesteld hebt, van den ondergang en het verderf der goddelozen."},{"catchword":"gehoord;","tekst":"Niet alleen van u en uw metgezellen, maar ook van anderen."},{"catchword":"moeilijke","tekst":"Hebreeuws, vertroosters der moeite, welke boven, Job 13:4 , worden genaamd nietige medicijnmeesters. Zie aldaar de aantekening."}],"3":[{"catchword":"winderige woorden?","tekst":"Hebreeuws, woorden des winds. Vergelijk boven, Job 15:2 , en zie de aantekening."},{"catchword":"wat stijft u,","tekst":"Dat is, wat vaste redenen hebt gij, welke u zo moedig, streng en stout maken, om mij met zulke antwoorden te bejegenen? Dat het Hebreeuwse woord, hetwelk nergens dan hier in deze vervoeging gevonden wordt, de betekenis heeft van sterk, of krachtig zijn, gelijk te zien is 1Ki 2:8 ; boven, Job 6:25 , en Mic 2:10 ."}],"4":[{"catchword":"Zou ik ook,","tekst":"Te weten, mij uitgevende voor een vertrooster. Anders, ik mocht ook als gijlieden spreken, indien enz., ik mocht woorden tegen u, enz., en ik mocht over u, enz."},{"catchword":"indien","tekst":"Dat is, zo uw personen in de plaats van mijn persoon waren, lijdende hetzelfde lijden, waar ik nu in ben. Ziel voor persoon; zie Gen 12:5 ."},{"catchword":"over u","tekst":"Dat is, u verachten en bespotten, en dat bewijzen met het schudden des hoofds. Zie 2Ki 19:21 . Hij wil zeggen dat hij zulks niet doen zou, want al deze vragen hebben kracht om te loochenen, gelijk het blijkt uit vs.5."}],"5":[{"catchword":"zich inhouden","tekst":"Of, ingehouden worden; te weten, van zoveel gesnaps en geraas te maken, gelijk gij nu doet tegen mij. Anders, zou [u] of [uw droefheid] in, of wederhouden. Of, aldus: Het medelijden zou mijn lippen inhouden."}],"6":[{"catchword":"wat gaat er","tekst":"Dat is, wat zal er van mijn droefheid verminderd worden? Hij wil zeggen: Hetzij dat ik spreek of zwijg, het is evenveel; ik doe geen voordeel, want zo ik spreek, men misduidt mijn woorden, en ik word evenwel uit mijn lijden voor een goddeloos mens veroordeeld; zo ik zweeg, men zou menen dat ik mijzelven overtuigd vond."}],"7":[{"catchword":"Hij heeft","tekst":"Te weten, God, die hem al dit lijden toegezonden had, en dien hij terstond met de volgende woorden, door de grote beroering zijns gemoeds, in den tweeden persoon toespreekt. Van de verzwijging des naams van God, zie boven, Job 3:20 ; alzo onder, vs.9. Anders, maar nu heeft zij mij vermoeid; te weten de smart, van welke hij in vs.6 gesproken had."},{"catchword":"vermoeid;","tekst":"Dat is, moede gemaakt door dit zwaar en menigvuldig lijden."},{"catchword":"mijn ganse","tekst":"Versta, zijn huisgezin, vrouw, kinderen, vrienden, huisgenoten en dienstvolk, die de Heere alle op verscheidene manieren, òf hem ontnomen, òf van hem vervreemd had; zie boven, Job 1 , Job 2 , en Job 19:13-15 , enz."}],"8":[{"catchword":"is tot","tekst":"Te weten, van de grootheid mijner benauwdheid en smart, waardoor mijn geest zo ontsteld is dat mijn lichaam allengskens verdwijnt en uitdroogt."},{"catchword":"zij getuigt","tekst":"Dat is, mijn gerimpeld, mager, dor en uitgeteerd lichaam spreekt tegen mij als een getuige, vallende op de zijde van mijn wederpartijders. Want deze oordelen van des mensen vroomheid of onvroomheid uit zijn tijdelijken en uiterlijken stand, welk gevoelen toegestaan zijnde, was zijn ellendig lichaam een genoegzaam getuige van Gods verbolgenheid tegen hem."},{"catchword":"in mijn aangezicht","tekst":"Dat is, openlijk tegen mij. Vergelijk boven, Job 1:11 ."}],"9":[{"catchword":"Zijn toorn","tekst":"Versta, den toorn Gods. Hij spreekt weder van God in den derden persoon."},{"catchword":"verscheurt,","tekst":"Het is een gelijkenis, genomen van de leeuwen, of andere verscheurende dieren, om des te beter uit te drukken hoe vreeslijk het is in de handen des levenden Gods te vallen, als Hij met ernst wil straffen; Heb 10:31 . Vergelijk Psa 50:22 ; Lam 3:10-11 ; Hos 5:14 , en Hos 6:1 ."},{"catchword":"Hij haat mij;","tekst":"Of, haat mij innerlijk. Alzo Gen 49:23 , en Gen 50:15 ."},{"catchword":"Hij knerst","tekst":"De knersing der tanden, welke geschiedt door samenbijting en samenwringing derzelve, is een gebaar dergenen, die met zeer felle gramschap bevangen zijn, gelijk Psa 35:16 , en Psa 37:12 , en Psa 112:10 ; Lam 2:16 ; of dergenen, die in zeer grote pijn, kwelling en smarten gesteld zijn; Mat 8:12 ; Luk 13:28 . Hier wordt zij Gode in den eersten zin bij gelijkenis toegeschreven, om des te beter het geweld en de vreeslijkheid zijner gramschap ons bekend te maken."},{"catchword":"scherpt","tekst":"Dat is, stelt een vergramd en vreeslijk gezicht tegen mij, even alsof Hij met zijn ogen, gelijk met een vreeslijken bliksem, mij doorstralen wilde."}],"10":[{"catchword":"Zij gapen","tekst":"Hij meent de werktuigen, of instrumenten, die God gebruikte om hem door velerlei kastijdingen te beproeven; maar voornamelijk schijnt hij te zien op Elifaz en zijn metgezellen, die tegen hem den mond opengedaan hadden om hem schandelijk te veroordelen, als een, die verlaten was van God. Vergelijk Psa 35:21 ."},{"catchword":"mijn kinnebakken;","tekst":"Dat is, doen mij spijtige verachting aan. Zie 1Ki 22:24 ."},{"catchword":"vervullen","tekst":"Dat is, verzadigen hun toorn, of koelen hun moed. Zie een gelijke manier van spreken Exo 15:9 en vergelijk de aantekening. Anders, zij hebben zich tezamen tegen mij met menigte vergaderd."}],"11":[{"catchword":"verkeerde","tekst":"Het schijnt dat hij hiermede verstaat de Chaldeën en Sabeërs, van wie gesproken wordt boven, Job 1:15 , Job 1:17 ."},{"catchword":"overgegeven,","tekst":"Anders, besloten bij de verkeerden; te weten, als in een gevangenis, om van hen gekweld en geplaagd te worden."},{"catchword":"afgewend","tekst":"Dat is, gemaakt dat ik in hun handen gevallen ben."}],"12":[{"catchword":"verbroken,","tekst":"Te weten, door vuur, door wind, door vijanden; boven, Job 1:15-17 , Job 1:19 ."},{"catchword":"mijn nek","tekst":"Gelijk wanneer een geweldige reus een klein en zwakachtig mens aantastende en bij den hals vattende, hem meteen tegen de aarde slingerde en verpletterde."},{"catchword":"tot een doelwit","tekst":"Te weten, tegen hetwelk Hij de pijlen zijner verbolgenheid uitschiet. Vergelijk boven, Job 7:20 ."}],"13":[{"catchword":"schutters","tekst":"Sommigen menen dat hij door deze verstaat zijn huisvrouw, vrienden en anderen, die door verkeerde oordelen, spottingen en plagerijen zijn lijden vermeerderden. Anderen nemen dit van zijn zweren, die hem de huid en het vlees doorboorden. Het kan ook in het algemeen genomen worden van al zijn plagen."},{"catchword":"mijn nieren","tekst":"Dit zijn overtollige manieren van spreken om de grootheid zijns lijdens, waarin hij stak, uit te drukken. De zin is, dat God niet alleen zijn lichaam van buiten met zweren en van binnen met grote smarten vervuld had, maar ook zijn geest met heftige beroering alzo doorsneden had, dat hij al zijn aandoeningen of bewegingen, in grote kwelling der zinnen en benauwdheid des harten had uitgestort."}],"14":[{"catchword":"met breuk","tekst":"Hebreeuws, met breuk op het aangezicht der breuk. Hij wil zeggen dat hij van het begin zijns lijdens tot nu toe geen respijt gehad had om een weinig adem te halen, maar dat plagen op plagen tot nu toe zonder ophouden zich opeengehoopt hadden, en nu nog tegenwoordiglijk hem overvielen."},{"catchword":"als een geweldige","tekst":"Dat is, als een geweldig, vreeslijk en sterk gewapend krijgsman."}],"15":[{"catchword":"over mijn huid","tekst":"Versta, den zak, dien hij aan zijn huid getogen had, als hij al de droeve tijdingen gehoord had van het verlies zijner beesten en zijner kinderen. De zin is, dat die zak nu zo aan zijn huis, welke vol etter en verzwering was, vastkleefde, dat hij scheen daaraan genaaid te wezen."},{"catchword":"mijn hoorn","tekst":"Dat is, mijne eer, aanzien en vermogen is teniet geworden en veranderd in schande, verachting en armoede. Alzo is het woord hoorn voor eer, macht, hoogheid, enz. genomen. Zie Deu 33:17 , en het woord stof voor schande, verachting, zwarigheid, nietigheid, onvermogen, nederheid. Zie 1Ki 16:2 . Of men kan door den hoorn verstaan [bij gelijkenis van de beesten] het hoofd, hetwelk zij in rouw met stof bestrooiden."},{"catchword":"het stof gedaan","tekst":"Dat is, vuil gemaakt."}],"16":[{"catchword":"bemodderd","tekst":"Of, bezoedeld, besmeerd, bekrozen. Het Hebreeuwse woord betekent een vuiligheid, komende van vochtigheid, die omgeroerd is; Psa 46:4 , en Psa 75:9 ."},{"catchword":"doods","tekst":"Dat is, zeer dikke duisternis, hoedanig den mensen overkomt nabij den dood zijnde. Zie de aantekening boven, Job 3:5 , en Job 10:21 . Job wil zeggen dat zijn gezicht zeer verdonkerd was door zijn groot verdriet en zijn veel wenen."}],"17":[{"catchword":"Daar toch","tekst":"De zin is dat hij zijn naaste geen leed gedaan en God oprechtelijk gediend had. Het gebed is het voornaamste deel van den godsdienst."}],"18":[{"catchword":"O, aarde","tekst":"Hij neemt de aarde tot getuige van zijn onnozelheid en vroomheid, waarvan hij gesproken had, wensende, zo hij enig geweld en wrevel met bloedvergieten tegen zijn naasten bedreven had, gelijk zijn vrienden hem oplegden, dat God zulks openbaren en in het licht brengen wilde, makende dat de aarde zulk bloed ontdekte."},{"catchword":"bedek","tekst":"De aarde wordt gezegd het bloed te bedekken als onrecht, geweld en moord verholen en ongestraft blijven; daarentegen niet te bedekken als zij geopenbaard en gestraft worden. Vergelijk Gen 4:10-11 ; Isa 26:21 ; Eze 24:7 ."},{"catchword":"mijn bloed niet;","tekst":"Dat is, dat ik ten onrechte zou mogen vergoten hebben."},{"catchword":"voor mijn","tekst":"Dat is, ik wens dat mijn gebed van God niet verhoord worde, indien ik zodanig ben, gelijk mijn vrienden mij beschrijven en afmalen."}],"19":[{"catchword":"mijn Getuige,","tekst":"Hij verstaat hiermede God, die van zijn conscientie en onschuld ten volle getuigenis geven Kon. Dezen noemt hij ook terstond zijn medegetuige; want hij zegt hetzelfde tweemaal."},{"catchword":"hoogten","tekst":"Dat is, in de allerhoogste plaatsen, of hoogste hemelen. Vergelijk onder, Job 25:2 , en Job 31:2 ; Psa 148:1 ; Mat 21:9 ; Luk 2:14 ."}],"20":[{"catchword":"druipt","tekst":"Dat is, wacht vuriglijk met tranen op God, dat Hij mijn rechtvaardige zaak eenmaal aan den dag brenge; waarom ik hem ook zonder ophouden aanroep. Vergelijk Psa 69:4 ."}],"21":[{"catchword":"gelijk","tekst":"Hebreeuws, en. Zie boven, Job 5:7 ."},{"catchword":"een kind","tekst":"Dat is, een mens. Zie 1Ki 8:39 ."}],"22":[{"catchword":"weinige","tekst":"Hebreeuws, jaren des getals; dat is, weinige jaren; te weten mijns levens. Zie Gen 34:30 ; idem boven, Job 15:20 . Het is zoveel alsof hij zeide: Wat wens ik met God te rechten? Het is tevergeefs; want ik moet haast sterven. Anders, want de aftelling der jaren zal aankomen. Zo zou Job reden geven waarom hij gezind was met God in samenhandeling te treden, namelijk, omdat zijn leven hier haast ten einde zou zijn, en dat hij wel wilde dat dit geschil gedaan ware eer hij stierf."},{"catchword":"ik zal","tekst":"Anders aldus: het pad is daar; ik zal niet wederkeren; ik zal heen gaan."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered, and said:"}],"2":[{"catchword":null,"tekst":"I have heard [not only by thee and thy companions, but of others also.] many such things: [viz. As thou hast set before me, about the ruin and destruction of the wicked.] ye are all troublesome comforters. [Heb. Comforters of toil, or, trouble, above chap.13.4. called naughty physicians. See the annotation there.]"}],"3":[{"catchword":null,"tekst":"Shall there be an end of windy words? [Hebr. Words of wind. Compare above 15.2. and see the annotation.] or what hardeneth you, that ye answer (thus)? [i.e. what solid grounds or reasons have ye, that make you so resolved, severe and peremptory in encountering me with such answers? That the Hebrew word here, which no where else is found in this construction, hath the signification of hardening, or strengthening, may be gathered by a word of the same root, which signifieth to be strong, or firm, & vigorous. See 1 Kings 2.8. ab.6.25. Mic 2:10.]"}],"4":[{"catchword":null,"tekst":"Should I likewise speak as ye do, [viz. Pretending to be a Comforter. Otherwise, I might likewise speak as ye do, if, etc. I might heap words, etc. And I might shake, etc.] if your soul were in my souls stead? [i.e. if your persons were in the place and condition of mine, enduring the same misery which now I do endure. Soul for person, see Gen.12.on v.5.] should I heap words together against you? [i.e. scorn and mock you, and shew forth the same by shaking of my head at you. See 2 Kings 19.on verse 21. Implying that he would not deal so with them: for all these kind of questions have a force of denying, as appeareth by the very next verse.]"}],"5":[{"catchword":null,"tekst":"I should strengthen you out with my mouth, and the moving of my lips, should with-hold it self. [or, be withheld, held, or kept in. Viz. From so much prating, or making so much stir and ado; as ye now practice against me. Oth. Should (you) or (your grief) keep in, or refrain. Or thus; Compassion should with-hold my lips.]"}],"6":[{"catchword":null,"tekst":"If I speak, my pain is not with-held: [or, kept in.] and if I cease, what goeth there away from me? [i.e. what is my grief the less for it? Implying , that whether he spake or held his peace, it was all one, he found no advantage; as if he said, if I do speak my words are mis-construed, and I am nevertheless judged a wicked man, by reason of my sufferings; and if I hold my peace, I shall be held convicted.]"}],"7":[{"catchword":null,"tekst":"Verily, he hath tired me now: [(i.e. extremely wearied me with this heavy and manifold affliction.) he, God namely, who had sent all this suffering upon him; whom also presently he directs his speech unto in the words following in the second person being transported with the greatness of his anguish, of the suppressing of the name of God. See above chap.3.on v.20. and below here v.9. Oth. But now it hath tired me, the pain or grief namely, whereof he had spoken in the former verse.] thou hast laid waste my whole congregation. [understand his family, wife, children, friends, retinue, servants, whom the LORD, in several ways, had either bereaved him of, or estranged from him. See ab.ch.1. and 2. Item ch.19.v.13,14,15; &c.]"}],"8":[{"catchword":null,"tekst":"That thou hast made me wrinkled, the same is a witness: [i.e. it doth witness of the greatness of my distress and pain, whereby my spirit is so distempered, that my body doth by little, even wear and wither away.) and my leanness standeth up against me; it beareth above chap.1.vers.11. as if he said; My wrinkled, lean, dry, and withered body, doth speak against me, like a witness, and taketh part against me with my adversaries. They judging of a mans godliness, or ungodliness, by his temporal and outward estate and condition. Which if it were granted to be so, his miserable diseased and decayed body might well have been a sufficient witness of Gods indignation and vengeance against him.]"}],"9":[{"catchword":null,"tekst":"His wrath [Understand the wrath of God. He speaketh again of God in the third person.] teareth [this is a similitude taken from the Lions; or such like worrying and tearings beasts, the better to express, how fearful it is to fall into the hands of the living God, when he beginneth once to execute the severity of his punishments, Hebrews 10..31. Compare Psa 50:22. Lamentantions 3.10.11. Hos 5:14. and 6.7.] and he hateth me, [or, doth hate me inwardly. So Gen 49:23. and 50.15.] he gnasheth over me with his teeth, them together and grating them the one against the other is a behaviour of such as are filled with extream rage, and revengefulness. So Psa 35:16. and 37.12. and 112.10. and Lament.2.16.or, of those that are in extremity of pain, torture, or torment. Mat 8:2. Luk 13:28. Here it is attributed to God in the first sense by similitude. To make us the better apprehend the fierceness and fearfulness of his wrath and indignation.] mine adversary sharpeneth his eyes against me. [i.e. casts a fierce and grim look upon me, as if he meant to dart me through with his very eyes and looks, as with the terrible flashes of lightening.]"}],"10":[{"catchword":null,"tekst":"They gape with their mouth against me, [He meaneth those instrument s or persons whom God made use of, to try him, by all kinds of chastisements; but it should seem; he hath an especial regard here to Eliphaz and his companions who had opened their mouth against him, to condemn him unworthily, as one that was forsaken of God altogether. Compare Psa 35:21.] they smite with reproach upon my cheek: [i.e. they scornfully reproach me. See 1 Kings 22.on ver.24.] they fill themselves together on me. [i.e. they satisfy their anger, or spightful mind. See the like expression Exo 15:9. and compare the annotation. Oth. They have gathered themselves with multitudes against me.]"}],"11":[{"catchword":null,"tekst":"God hath given me over [Oth. Shut me up with the perverse, viz. As in a hold or prison, for to be plagued and tormented by them.] to the perverse; [it should seem he meaneth hereby the Chaldeans and Sabeans, spoken of above chap.1. verse 15. And 17.] and hath turned me off into the hands of the wicked. [i.e. made me to fall into their hands.]"}],"12":[{"catchword":null,"tekst":"I was at rest, but he hath broken me, [viz. By fire, by winds, by enemies, above chap.1.15,16,17,19.] and laid hold by my neck, and dashed me to pieces: [like as a mighty Giant, who apprehending a little weakly man, and gripping him by the neck, doth there withal, fling him to the ground to brain him, and dash him to pieces.] and he hath set me up for a mark to him. [whereat to shoot the arrow of his indignation. Comp.ab.ch.7.20.]"}],"13":[{"catchword":null,"tekst":"His archers have surrounded me, [Some are of opinion, that by these he meaneth his wife, friends, and others, who by perverse Judgements, mockings and gibing&acirc;&euro;&trade;s did greatly multiply his sufferings. Others understand this of his sores, which pierced and tore his skin and flesh all over. It may also generally be taken for all his plagues and sufferings together.] he hath split through my reins, and not spared; he hath powered out my gall upon the earth. [these art hyperbolical expressions, to shew forth the greatness of the sufferings wherewith he was inthralled. The meaning is, that God had not only filled his body, outwardly with sores and biles, & inwardly with pangs and pains; but likewise so pierced and split his spirit with grievous troubles, and cutting perplexities, that it had made him to power and gush out all his passions and resentments in the great anguish of his senses and agony of his heart.]"}],"14":[{"catchword":null,"tekst":"He hath broken me with breach upon breach; [Heb. With breach upon the face of breach: implying, that from the very beginning of his suffering hitherto be had no respite at all, not so much as to breath once a little; but that the plagues had still heaped themselves upon him, one in the neck of another, without intermission hitherto, and without ceasing yet, to fall upon him.] he hath run on against me like a mighty one. [i.e. like as a mighty, terrible, and strongly-armed man of war would or could do.]"}],"15":[{"catchword":null,"tekst":"I have sowed a sack over my skin, [Understand the sack (or d to cover the blood, when as wrong, violence and murder, remain concealed and unpunished Contrarily, not to cover it, when they are revealed and punished. Compare Gen 4:10,11. Isa 26:21. Eze 24:7.] my blood; [i.e. that which at any time I may have shed wrongfully.] and let there be no place for my cry; [i.e. I wish that my prayer may not be heard, if so be I am such as my friends do describe and paint me.]"}],"19":[{"catchword":null,"tekst":"Now also, behold, my witness is in heaven [he meaneth God who was able to give a perfect testimony of his conscience, and guiltlessness, and him he calleth immediately against his other or second-witness; for he saith the same thing twice.] and my witness in the heights; [i.e. in the highest place, or highest heavens. Compare below 25.2. and 31.2. Psa 148:1. Mat 21:9. Luk 2:14.]"}],"20":[{"catchword":null,"tekst":"My friends are my deriders: (yet) mine eye droppeth to God; [i.e. waiteth upon God with fervent tears, for to bring my righteous cause to light once wherefore also I call upon him without ceasing. Compare Psa 69:4.]"}],"21":[{"catchword":null,"tekst":"Oh that one might plead for a man with God, as [Heb. And, [see above chap.5.on verse 7.] a child of man [i.e. a man (homo) see 1 Kings 8.on v.39.] for his friend!"}],"22":[{"catchword":null,"tekst":"For (but a few) years in number are to come (yet) [Hebr. Years of number, i.e. few years, namely of my life. See Genesis 34.on ver.30. Item ab.ch.15.v.20. it is much, as if he said; what do I wish to plead with God? It is in vain, for I must die ere long. Oth. For the numbering of years shall come on; as if Job gave the reason here, why he was so desirous to enter into mutual plea with God, namely, because his life was neer to its ends, and he would gladly have this controversy ended, before he died.] and I shall pass the path, (through which) I shall not return again. [Oth. Thus. The path is there; I shall not return, I shall not return, I shall be gone.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  const hfdOpties = m.hoofdstukken.map(h =>

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
