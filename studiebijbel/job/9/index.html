ht; wie heeft zich tegen Hem verhard en vrede gehad?","5":"Die de bergen verzet, zodat zij het niet gewaar worden, Die ze omkeert in Zijn toorn;","6":"Die de aarde beweegt uit haar plaats, zodat haar pilaren schudden;","7":"Die de zon gebiedt, en zij gaat niet op; en verzegelt de sterren;","8":"Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;","9":"Die de Wagen maakt, de Orion, en het Zevengesternte, en de binnenkamers van het Zuiden;","10":"Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.","11":"Zie, Hij zal aan mij voorbijgaan, en ik zal Hem niet zien; en Hij zal voorbijgaan, en ik zal Hem niet merken.","12":"Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?","13":"God zal Zijn toorn niet afkeren; onder Hem worden de hoogmoedige helpers gebogen.","14":"Hoeveel te minder zal ik Hem antwoorden, en mijn woorden uitkiezen tegen Hem?","15":"Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.","16":"Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.","17":"Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.","18":"Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.","19":"Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?","20":"Al zou ik mijzelf rechtvaardigen, mijn mond zal mij verdoemen; ben ik oprecht, Hij zal mij toch verkeerd verklaren.","21":"Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.","22":"Dat is één ding, daarom zeg ik: De oprechte en de goddeloze verdoet Hij.","23":"Als de gesel haastig doodt, bespot Hij de beproeving van de onschuldigen.","24":"De aarde wordt gegeven in de hand van de goddeloze; Hij overdekt het aangezicht van haar rechters; is het niet zo, wie is het dan?","25":"En mijn dagen zijn sneller geweest dan een loper; zij zijn weggevlucht, zij hebben het goede niet gezien.","26":"Zij zijn voorbijgevaren met jachtschepen; zoals een arend naar het aas toevliegt.","27":"Als ik zeg: Ik zal mijn klacht vergeten, en ik zal mijn treurige gezicht laten varen, en mij verkwikken;","28":"Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.","29":"Ik zal toch goddeloos verklaard worden; waarom dan zal ik zonder nut zwoegen?","30":"Al zou ik mij wassen met sneeuwwater, en mijn handen zuiveren met zeep;","31":"Dan zult U mij in de gracht dompelen, en mijn kleren zullen van mij walgen.","32":"Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.","33":"Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.","34":"Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;","35":"Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf."},"SV":{"1":"Maar Job antwoordde en zeide:","2":"Waarlijk, ik weet, dat het zo is; want hoe zou de mens rechtvaardig zijn bij God?","3":"Zo Hij lust heeft, om met hem te twisten, niet een uit duizend zal hij Hem beantwoorden.","4":"Hij is wijs van hart, en sterk van kracht; wie heeft zich tegen Hem verhard, en vrede gehad?","5":"Die de bergen verzet, dat zij het niet gewaar worden, Die ze omkeert in Zijn toorn;","6":"Die de aarde beweegt uit haar plaats, dat haar pilaren schudden;","7":"Die de zon gebiedt, en zij gaat niet op; en verzegelt de sterren;","8":"Die alleen de hemelen uitbreidt, en treedt op de hoogten der zee;","9":"Die den Wagen maakt, den Orion, en het Zevengesternte, en de binnenkameren van het Zuiden;","10":"Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.","11":"Zie, Hij zal voor mij henengaan, en ik zal Hem niet zien; en Hij zal voorbijgaan, en ik zal Hem niet merken.","12":"Zie, Hij zal roven, wie zal het Hem doen wedergeven? Wie zal tot Hem zeggen: Wat doet Gij?","13":"God zal Zijn toorn niet afkeren; onder Hem worden gebogen de hovaardige helpers.","14":"Hoeveel te min zal ik Hem antwoorden, *en* mijn woorden uitkiezen tegen Hem?","15":"Denwelken ik, zo ik rechtvaardig ware, niet zou antwoorden; mijn Rechter zal ik om genade bidden.","16":"Indien ik roep, en Hij mij antwoordt; ik zal niet geloven, dat Hij mijn stem ter ore genomen heeft.","17":"Want Hij vermorzelt mij door een onweder, en vermenigvuldigt mijn wonden zonder oorzaak.","18":"Hij laat mij niet toe mijn adem te verhalen; maar Hij verzadigt mij met bitterheden.","19":"Zo het aan de kracht *komt*, zie, Hij is sterk; en zo het aan het recht *komt*, wie zal mij dagvaarden?","20":"Zo ik mij rechtvaardig, mijn mond zal mij verdoemen; ben ik oprecht, Hij zal mij toch verkeerd verklaren.","21":"Ben ik oprecht, zo acht ik *toch* mijn ziel niet; ik versmaad mijn leven.","22":"Dat is een ding, daarom zeg ik: Den oprechte en den goddeloze verdoet Hij.","23":"Als de gesel haastelijk doodt, bespot Hij de verzoeking der onschuldigen.","24":"De aarde wordt gegeven in de hand des goddelozen; Hij overdekt het aangezicht harer rechteren; zo niet, wie is Hij dan?","25":"En mijn dagen zijn lichter geweest dan een loper; zij zijn weggevloden, zij hebben het goede niet gezien.","26":"Zij zijn voorbijgevaren met jachtschepen; gelijk een arend naar het aas toevliegt.","27":"Indien mijn zeggen is: Ik zal mijn klacht vergeten, en ik zal mijn gebaar laten varen, en mij verkwikken;","28":"Zo schroom ik voor al mijn smarten; ik weet, dat Gij mij niet onschuldig zult houden.","29":"Ik zal *toch* goddeloos zijn; waarom dan zal ik ijdellijk arbeiden?","30":"Indien ik mij wasse met sneeuwwater, en mijn handen zuivere met zeep;","31":"Dan zult Gij mij in de gracht induiken, en mijn klederen zullen van mij gruwen.","32":"Want Hij is niet een man, als ik, dien ik antwoorden zou, zo wij te zamen in het gericht kwamen.","33":"Er is geen scheidsman tussen ons, *die* zijn hand op ons beiden leggen mocht.","34":"Dat Hij van op mij Zijn roede wegdoe, en dat Zijn verschrikking mij niet verbaasd make;","35":"Zo zal ik spreken, en Hem niet vrezen; want zodanig ben ik niet bij mij."},"KJV":{"1":"Then Job answered and said,","2":"I know *it is* so of a truth: but how should man be just with God?","3":"If he will contend with him, he cannot answer him one of a thousand.","4":"*He is* wise in heart, and mighty in strength: who hath hardened *himself* against him, and hath prospered?","5":"Which removeth the mountains, and they know not: which overturneth them in his anger.","6":"Which shaketh the earth out of her place, and the pillars thereof tremble.","7":"Which commandeth the sun, and it riseth not; and sealeth up the stars.","8":"Which alone spreadeth out the heavens, and treadeth upon the waves of the sea.","9":"Which maketh Arcturus, Orion, and Pleiades, and the chambers of the south.","10":"Which doeth great things past finding out; yea, and wonders without number.","11":"Lo, he goeth by me, and I see *him* not: he passeth on also, but I perceive","12":"Behold, he taketh away, who can hinder him? who will say unto him, What doest","13":"*If* God will not withdraw his anger, the proud helpers do stoop","14":"How much less shall I answer him, *and* choose out my words","15":"Whom, though I were righteous, *yet* would I not answer, *but* I would make supplication to my judge.","16":"If I had called, and he had answered me; *yet* would I not believe that he had hearkened unto my voice.","17":"For he breaketh me with a tempest, and multiplieth my wounds without cause.","18":"He will not suffer me to take my breath, but filleth me with bitterness.","19":"If *I speak* of strength, lo, *he is* strong: and if of judgment, who shall set","20":"If I justify myself, mine own mouth shall condemn me: *if I say*, I *am* perfect, it shall also prove me perverse.","21":"*Though* I *were* perfect, *yet* would I not know my soul: I would despise my life.","22":"This *is* one *thing*, therefore I said *it*, He destroyeth the perfect and the wicked.","23":"If the scourge slay suddenly, he will laugh at the trial of the innocent.","24":"The earth is given into the hand of the wicked: he covereth the faces of the judges thereof; if not, where,","25":"Now my days are swifter than a post: they flee away, they see no good.","26":"They are passed away as the swift ships: as the eagle *that* hasteth to the prey.","27":"If I say, I will forget my complaint, I will leave off my heaviness, and comfort","28":"I am afraid of all my sorrows, I know that thou wilt not hold me innocent.","29":"*If* I be wicked, why then labour I in vain?","30":"If I wash myself with snow water, and make my hands never so clean;","31":"Yet shalt thou plunge me in the ditch, and mine own clothes shall abhor","32":"For *he is* not a man, as I *am, that* I should answer him, *and* we should come together in judgment.","33":"Neither is there any daysman betwixt us, *that* might lay his hand upon us both.","34":"Let him take his rod away from me, and let not his fear terrify","35":"*Then* would I speak, and not fear"}},"tsk":{"2":[{"kopje":"hoe","refs":["Job 4:17","Job 14:3","Job 14:4","Job 25:4","Job 32:2","Job 33:9","Job 34:5","1 Kon 8:46","Ps 130:3","Ps 143:2","Rom 3:20"]}],"3":[{"kopje":"met hem te twisten","refs":["Job 9:20","Job 9:32","Job 9:33","Job 10:2","Job 23:3-7","Job 31:35-37","Job 33:13","Job 34:14","Job 34:15","Job 39:35","Jes 57:15","Jes 57:16","Rom 9:20"]},{"kopje":"hij Hem niet","refs":["Ps 19:13","Ps 40:13","1 Joh 1:8","1 Joh 3:20"]}],"4":[{"kopje":"wijs van hart","refs":["Job 9:19","Job 36:5","Ps 104:24","Ps 136:5","Dan 2:20","Dan 4:34-37","Rom 11:33","Ef 1:8","Ef 1:19","Ef 3:10","Ef 3:20","Judas 1:24","Judas 1:25"]},{"kopje":"wie heeft zich verhard","refs":["Job 6:10","Job 15:23-27","Job 40:4","Ex 9:14-17","Ex 14:17","Ex 14:18","Spr 28:14","Spr 29:1","Dan 5:20-30","1 Kor 10:22"]}],"5":[{"kopje":"verzet","refs":["Job 28:9","Ps 46:3","Ps 68:9","Ps 114:6",  data-code=\"H6030\">answer</span> him, and choose <span class=\"wl wl-kjv\" data-code=\"H977\">out</span> my words","15":"Whom, though I were <span class=\"wl wl-kjv\" data-code=\"H6663\">righteous,</span> yet would I not <span class=\"wl wl-kjv\" data-code=\"H6030\">answer,</span> but I would make <span class=\"wl wl-kjv\" data-code=\"H2603\">supplication</span> to my judge.","16":"If I had <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> and he had <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> me; yet would I not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> that he had <span class=\"wl wl-kjv\" data-code=\"H238\">hearkened</span> unto my voice.","17":"For he <span class=\"wl wl-kjv\" data-code=\"H7779\">breaketh</span> me with a <span class=\"wl wl-kjv\" data-code=\"H8183\">tempest,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplieth</span> my <span class=\"wl wl-kjv\" data-code=\"H6482\">wounds</span> without cause.","18":"He will not <span class=\"wl wl-kjv\" data-code=\"H5414\">suffer</span> me to <span class=\"wl wl-kjv\" data-code=\"H7725\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">breath,</span> but <span class=\"wl wl-kjv\" data-code=\"H7646\">filleth</span> me with bitterness.","19":"If I speak of <span class=\"wl wl-kjv\" data-code=\"H3581\">strength,</span> lo, he is <span class=\"wl wl-kjv\" data-code=\"H533\">strong:</span> and if of <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> who shall set","20":"If I <span class=\"wl wl-kjv\" data-code=\"H6663\">justify</span> myself, mine own <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> shall <span class=\"wl wl-kjv\" data-code=\"H7561\">condemn</span> me: if I say, I am <span class=\"wl wl-kjv\" data-code=\"H8535\">perfect,</span> it shall also prove me perverse.","21":"Though I were <span class=\"wl wl-kjv\" data-code=\"H8535\">perfect,</span> yet would I not <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul:</span> I would <span class=\"wl wl-kjv\" data-code=\"H3988\">despise</span> my life.","22":"This is <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> thing, therefore I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> it, He <span class=\"wl wl-kjv\" data-code=\"H3615\">destroyeth</span> the <span class=\"wl wl-kjv\" data-code=\"H8535\">perfect</span> and the wicked.","23":"If the <span class=\"wl wl-kjv\" data-code=\"H7752\">scourge</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly,</span> he will <span class=\"wl wl-kjv\" data-code=\"H3932\">laugh</span> at the <span class=\"wl wl-kjv\" data-code=\"H4531\">trial</span> of the innocent.","24":"The <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked:</span> he <span class=\"wl wl-kjv\" data-code=\"H3680\">covereth</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> of the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> thereof; if not, where,","25":"Now my <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H7043\">swifter</span> than a <span class=\"wl wl-kjv\" data-code=\"H7323\">post:</span> they flee <span class=\"wl wl-kjv\" data-code=\"H1272\">away,</span> they <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> no good.","26":"They are passed <span class=\"wl wl-kjv\" data-code=\"H2498\">away</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">as</span> the <span class=\"wl wl-kjv\" data-code=\"H16\">swift</span> <span class=\"wl wl-kjv\" data-code=\"H591\">ships:</span> as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> that <span class=\"wl wl-kjv\" data-code=\"H2907\">hasteth</span> to the prey.","27":"If I <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> my <span class=\"wl wl-kjv\" data-code=\"H7879\">complaint,</span> I will leave <span class=\"wl wl-kjv\" data-code=\"H5800\">off</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">heaviness,</span> and comfort","28":"I am <span class=\"wl wl-kjv\" data-code=\"H3025\">afraid</span> of all my <span class=\"wl wl-kjv\" data-code=\"H6094\">sorrows,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou wilt not hold me innocent.","29":"If I be <span class=\"wl wl-kjv\" data-code=\"H7561\">wicked,</span> why then <span class=\"wl wl-kjv\" data-code=\"H3021\">labour</span> I in vain?","30":"If I <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> myself <span class=\"wl wl-kjv\" data-code=\"H7950\">with</span> snow <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and make my <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> <span class=\"wl wl-kjv\" data-code=\"H1252\">never</span> so clean;","31":"<span class=\"wl wl-kjv\" data-code=\"H227\">Yet</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H2881\">plunge</span> me in the <span class=\"wl wl-kjv\" data-code=\"H7845\">ditch,</span> and mine own <span class=\"wl wl-kjv\" data-code=\"H8008\">clothes</span> shall abhor","32":"For he is not a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> as I am, that I should <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> him, and we should <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> in judgment.","33":"Neither <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> there any <span class=\"wl wl-kjv\" data-code=\"H3198\">daysman</span> betwixt us, that might <span class=\"wl wl-kjv\" data-code=\"H7896\">lay</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon us both.","34":"Let him <span class=\"wl wl-kjv\" data-code=\"H5493\">take</span> his <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from me, and let not his <span class=\"wl wl-kjv\" data-code=\"H367\">fear</span> terrify","35":"Then would I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> and not fear"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"zo is;","tekst":"Te weten, gelijk gij zegt, namelijk dat God rechtvaardig is, straffende de kwaden en de goeden voorstaande. Dit weet ik zo wel, dat ik nooit gedacht heb God van ongerechtigheid te beschuldigen."},{"catchword":"God?","tekst":"Dat is, voor God. Alzo wordt het Hebreeuwse woord genomen, 1Sa 2:26 ; Psa 130:4 ."}],"3":[{"catchword":"niet een","tekst":"Dat is, duizendmaal zal de mens schuldig bevonden worden, dat is, zeer dikwijls, ja bijna oneindelijk. Een zeker getal voor een onzeker. Zie Lev 26:8 ."}],"4":[{"catchword":"Hij is wijs","tekst":"Te weten, God. Zie boven, Job 3:20 ."},{"catchword":"van hart,","tekst":"Bij de Hebreën wordt het woord hart genomen voor de plaats des verstands, en vervolgens ook voor het verstand en de wijsheid zelve; Exo 28:3 ; onder, Job 11:12 , en Job 34:34 ; Pro 2:10 , en Pro 6:32 , en Pro 19:8 ; Hos 4:11 ."}],"5":[{"catchword":"niet gewaar worden,","tekst":"Dat is, onvoorziens en buiten alle verwachting, te weten, der mensen, die daarop wonen. Vergelijk boven, Job 7:10 ; of den levenlozen dingen wordt hier bij gelijkenis leven en gevoel toegeschreven. Zie onder, Job 28:14 ."}],"6":[{"catchword":"haar pilaren","tekst":"Dat is, hun onderste grondslagen en fondamenten."},{"catchword":"schudden;","tekst":"Dat is, gelijk van verschrikking hutsen. Vergelijk hiermede Job 26:11 ."}],"7":[{"catchword":"de zon","tekst":"Hebreeuws, tot de zon zegt. Zeggen, of spreken, voor gebieden. Zie 2Ch 29:24 ."},{"catchword":"zij gaat niet op;","tekst":"Te weten, gewoonlijk, zolang de nacht over den horizon van een land duren moet, of buitengewoon als het God belieft in den loop der zon verandering te brengen; Jos 10:12 , en 2Ki 20:11 ."},{"catchword":"verzegelt","tekst":"Te weten, door het licht des daags, hetwelk de sterren verbergt, even gelijk door een zegel het ingeslotene verborgen wordt, dat men het niet zien kan. De zin is, dat God den dag maakt; gelijk in het eerste lid van vs.7 Hem toegeschreven wordt het maken van den nacht. Of men kan het verstaan van buitengewone en wonderbare verduistering of ophouding van het licht der sterren. Alzo wordt het woord zegelen genomen, Isa 29:11 ; Dan 9:24 , en Dan 12:4 , Dan 12:9 ."}],"8":[{"catchword":"hoogten","tekst":"Dat is, op den vloed en de hooglopende baren der zee, die God stilt en effent, alsof Hij ze met zijn voet nederzette en gelijk maakte."}],"9":[{"catchword":"Wagen","tekst":"Een gesternte des hemels, hedendaags ook alzo genaamd, en anders geheten Arctos, of Ursa; sommigen verstaan het gesternte genoemd Arcturus. Zie hiervan ook onder, Job 38:32 ."},{"catchword":"Orion,","tekst":"Een gesternte, zich vertonende in December tot de lente toe. Zie ook hiervan onder, Job 38:31 , en Amo 5:8 ."},{"catchword":"Zevengesternte,","tekst":"Ook een gesternte, of teken des hemels, genaamd van de Latijnen Virgiliae, van de Grieken Pleiades, van de onzen het Zevengesternte, met de lente voortkomende; waarvan zie mede onder, Job 38:31 ."},{"catchword":"binnenkameren","tekst":"Of, vertrekken, of heimelijkheden. Versta hiermede de sterren, welke zijn omtrent den zuidpool, en omdat zij ten meeste van ons, die omtrent den noordpool wonen, niet gezien worden, de heimelijkheden, binnenkamers, of vertrekplaatsen genaamd worden."}],"10":[{"catchword":"Die grote dingen doet,","tekst":"Zie boven, Job 5:9 , en de aantekening daarop."},{"catchword":"die men","tekst":"Hebreeuws, tot geen onderzoek toe."}],"11":[{"catchword":"zal voor mij","tekst":"Te weten, met getuigenissen zijner wijsheid, mogendheid, goedheid en rechtvaardigheid, die Hij in zijn werken alleszins uitdrukt, en van ons laat aanschouwen, die nochtans ten volle van ons niet kunnen doorgrond worden; Rom 11:33 ."},{"catchword":"zal voorbijgaan,","tekst":"Hebreeuws, veranderen; te weten, van plaats; menselijk van God gesproken, ten aanzien van zijn werken, die Hij doet in toorn of genade. Zie boven, Job 4:15 ."}],"12":[{"catchword":"Zie,","tekst":"Dat is, Hij zal den mensen, om hunner zonden wil, hun goed en leven, dat Hij hun gegeven had, ontnemen."},{"catchword":"roven,","tekst":"Vergelijk 2Sa 16:10 ; Isa 45:9 ; Jer 18:6 ; Rom 9:20 ."}],"13":[{"catchword":"Zijn toorn","tekst":"Dat is, zijn straf niet inhouden als Hij dezelve voorgenomen heeft naar zijn rechtvaardig oordeel uit te voeren, hoezeer ook de goddelozen daartegen worstelen, zoekende die met geweld te ontgaan, of van anderen af te keren."},{"catchword":"hovaardige","tekst":"Hebreeuws, de helpers der hovaardigheid; dat is, die stoutelijk vermeten zichzelven of anderen te helpen."}],"14":[{"catchword":"antwoorden,","tekst":"Dat is, antwoorden kunnen, te weten, indien Hij mij in het gericht riep. Alzo in vs.15."},{"catchword":"tegen Hem?","tekst":"Het Hebreeuwse woord him wordt somtijds voor tegen genomen, gelijk Deu 9:7 , onder, Job 10:17 ; Psa 94:16 ; Pro 30:31 ."}],"16":[{"catchword":"niet geloven,","tekst":"Te weten, niet geheel vastelijk. Want Job, tenonder geworpen zijnde door de zwaarheid zijns lijdens en verschrikt door de grootheid der goddelijke majesteit, heeft zich voor een wijle niet kunnen inbeelden een haastige verlossing uit zijn ellende."}],"17":[{"catchword":"onweder,","tekst":"Te weten, der straffen en bezoekingen, die over hem gevallen waren, welke hij bij een onweder vergelijkt, vanwege haar snelle, onverwachte, vreeslijke en geweldige overkomst. Vergelijk onder, Job 27:20 ; Psa 83:16 ; Pro 10:25 ; Eze 13:11 , Eze 13:13-14 ; Amo 1:14 ."},{"catchword":"wonden","tekst":"Versta, de ellenden, die hij in zijn lichaam, goed en huisgezin door de bezoekingen des Heeren gekregen had."},{"catchword":"zonder oorzaak","tekst":"Dat is, waardoor ik zulke straf meer zou verdiend hebben dan andere mensen, of iets gruwelijks bedreven, dat een extraordinaire straf verdienen zou. Zie boven, Job 2:3 ."}],"18":[{"catchword":"mijn adem","tekst":"Hebreeuws, mijn geest weder te brengen; dat is, enig respijt of verlichting te hebben, maar Hij houdt doorgaans aan om mij met deze plagen op te vullen en gelijk te verstrikken. Vergelijk boven, Job 7:4 , geest voor adem. Alzo onder, Job 19:17 ."},{"catchword":"bitterheden","tekst":"Dat is, droevige plagen. Vergelijk 2Ki 4:27 ."}],"19":[{"catchword":"Zo het aan de kracht","tekst":"Dat is, zo het geschil tussen God en mij door kracht moet geëffend en geëindigd worden."},{"catchword":"dagvaarden?","tekst":"Hebreeuws, doen vergaderen? dat is, wie zal maken dat wij bijeenkomen om samen te rechten, en dat eindelijk een vonnis tussen ons beiden gewezen worde?"}],"20":[{"catchword":"Zo ik mij","tekst":"Te weten, voor God. Anders, hoewel ik rechtvaardig ben."},{"catchword":"mijn mond","tekst":"Dat is, ik zal evenwel moeten bekennen dat ik een arm zondaar ben; of, uit hetgeen mijn mond zal spreken, zal God evenwel mij nog van zonde kunnen overtuigen. Van het woord verdoemen, zie onder, Job 10:2 ."},{"catchword":"Hij zal mij","tekst":"Dat is, God of mijn mond zal mij bewijzen verkeerd te zijn; want Hij zal mij zo wijselijk ondervragen, dat Hij nog bij mijn ontschuldiging stof zal vinden om mij te veroordelen; en hoewel ik in dit geschil een goede zaak tegen mijne vrienden heb, nochtans weet ik dat ik voor God een zondig mens ben, en daarom ook verdoemelijk."}],"21":[{"catchword":"acht","tekst":"Hebreeuws, ken; dat is, acht, bezorg, gadesla. Vergelijk de aantekening Gen 18:19 . Anders, ik zal mijn ziel, of mijzelven niet kennen, alsof ik bij mijzelven niets ware voor de vrees der goddelijke majesteit."},{"catchword":"ziel niet;","tekst":"Dat is, leven. Zie Gen 19:17 . De verklaring volgt in het einde van vs.21. Of, mijzelven niet. Zie 1Ki 19:4 ."}],"22":[{"catchword":"Dat is een ding,","tekst":"Te weten, dat ik kwalijk verzwelgen kan; hetwelk dit is, dat ik, vroom zijnde, nochtans mijn leven versmaden moet, uit oorzaak van het menigvuldige kwaad en verdriet, dat mij daarin overkomt."}],"23":[{"catchword":"doodt,","tekst":"Te weten, de goeden tezamen met de kwaden."},{"catchword":"bespot","tekst":"Te weten, naar de uiterlijke gedaante dezes levens, en niet naar de verborgen waarheid der zaken; want naar de uitwendige gedaante schijnt hier geen onderscheid te wezen tussen goeden en kwaden, hetwelk vele vromen, hier altijd zeer bekommerd heeft; Psa 37:1 ,en Psa 73:2 , enz.; Ecc 8:14 ; Jer 12:1 ; Hab 1:13-14 . Maar anders is het waarachtig wat wij lezen Psa 73:17-18 ; Jer 12:3 ; Mal 3:16-17 ; 1Co 11:32 ; Heb 12:10-11 ."},{"catchword":"verzoeking","tekst":"Zie Gen 22:1 ."}],"24":[{"catchword":"gegeven","tekst":"Te weten, door Gods regering."},{"catchword":"in de hand","tekst":"Dat is, in het geweld des bozen, daar het den mens dunkt dat de vromen veel meer behoorden de overhand en het opperste gebied te hebben in de wereld."},{"catchword":"Hij overdekt","tekst":"Versta, dat God de ogen des verstands van de regeerders der wereld verblindt, dat zij niet kunnen onderscheiden het goede van het kwade, om de boosheden te straffen en de deugden te vereren."},{"catchword":"wie is Hij","tekst":"Te weten, die het doet. Anders, waar [en] wie is Hij? Hoe nu God gezegd wordt het kwade te doen, zie Gen 45:5 , en 1Ki 12:15 ."},{"catchword":"dan?","tekst":"Hebreeuws, Efo. Zie Hos 13:10 ."}],"25":[{"catchword":"En mijn dagen","tekst":"Alsof hij zeide: Heb ik enigen voorspoed gehad, die is haast vergaan; maar der goddelozen welstand is langdurig; Psa 73:4 ."},{"catchword":"lichter","tekst":"Dat is, sneller. Zie boven, Job 7:6 ."},{"catchword":"niet gezien","tekst":"Dat is, niet genoten. Zie boven, Job 7:7 ."}],"26":[{"catchword":"met","tekst":"Dat is, gelijk; blijkende zulks uit het andere lid van vs.26."},{"catchword":"jachtschepen;","tekst":"Hebreeuws, schepen der begeerte; dat is, die zo snellijk voortzeilen, dat zij een begeerte en lust schijnen te hebben tot de plaats waar zij wezen moeten. Of, versta, schepen, die met begeerlijke, dat is kostelijke dingen geladen zijnde, hunnen weg kort zoeken te maken om hun waren buiten gevaar te brengen en geld daarvan te maken."}],"27":[{"catchword":"gebaar","tekst":"Hebreeuws, aangezicht; dat is mijn ongesteld wezen en droevig gelaat."}],"28":[{"catchword":"smarten;","tekst":"Te weten, dat zij mij verhinderen zullen naar mijn zeggen te doen."},{"catchword":"onschuldig","tekst":"Dat is, niet ongestraft laten. Zie 1Ki 2:9 ."}],"29":[{"catchword":"goddeloos","tekst":"Of, schuldig, strafbaar; idem, goddeloos, of schuldig verklaard worden, omdat Gij altijd met recht behouden zult, hoezeer ik mij ook poog te verdedigen."},{"catchword":"ijdellijk","tekst":"Dat is, waarom zal ik mij nu tevergeefs vermoeien? of, moeite tevergeefs doen, met mijn zaak voor te staan?"}],"30":[{"catchword":"zeep;","tekst":"Anders, in reinheid."}],"31":[{"catchword":"gracht","tekst":"Te weten, die modderig, slijmerig en zeer drekkig is, en uit welke ik zeer onrein en stinkende zal voortkomen. Hij spreekt bij gelijkenis. De zin is dat zijn verantwoording, hoe schoon zij ook met redenen bekleed en versierd ware, niet zou helpen, als de Heere met hem in zijn gericht treden wilde."},{"catchword":"klederen","tekst":"Dat is, al wat mij naast is en toebehoort, zal een walg hebben van mijn onreinheid. Het is een overtollige manier van spreken."}],"33":[{"catchword":"scheidsman","tekst":"Of, rechter."},{"catchword":"zijn hand","tekst":"Te weten, zowel ook door zijn autoriteit orde te stellen en wetten voor te schrijven, die wij in het pleiten volgen zouden, als om ons geschil door zijn uitspraak te eindigen. Merk, dat de oplegging der handen een teken van macht en gebied geweest is. Anders, die zijn hand aan ons beiden legge; dat is, het vonnis ter executie stelle."}],"34":[{"catchword":"Dat Hij","tekst":"Alsof hij zeide: Indien ik van dit lijden ontslagen ware, en dat ik maar met mijns gelijke te doen had, die mij door zijn majesteit niet verschrikte, ik zou haast doen blijken dat deze plagen mij niet overgekomen zijn om enige grove zonden en boosheden, gelijk gijlieden meent."},{"catchword":"roede","tekst":"Dat is, zijn straf en kastijding. Alzo 2Sa 7:14 , onder, Job 21:9 , en Job 37:13 ; Psa 89:33 ; Isa 10:5 ; Lam 3:1 ."}],"35":[{"catchword":"zodanig","tekst":"Te weten, gelijk ik ben afgemaald van mijn vrienden."},{"catchword":"bij mij","tekst":"Dat is, mijn eigen conscientie, gevoel en bevinding. Anders, aldus ben ik niet bij mijzelven."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered and said:"}],"2":[{"catchword":null,"tekst":"Verily I know that it is so: [viz. As thou sayest, that God indeed is righteous, punishing the evil, and protecting the good. This I do know so well, that it never came into my mind to charge God with unrighteousness.] for how should man be righteous with God? [i.e. before God. So the Hebrew word is taken, 1 Sam.2.26. Psa 130:4.]"}],"3":[{"catchword":null,"tekst":"If he hath a mind to contend with him, he shall not answer him, one of a thousand, [man shall be found guilty a thousand times over, i.e. very often, and in a manner, infinitely. A certain number for an uncertain, See Lev.26. on v.8.]"}],"4":[{"catchword":null,"tekst":"He [viz. God; see ab.3.on v.20.] is wise of heart, [[by the Hebrews the word heart is taken sometimes for the seat of the understanding, and consequently also for the understanding and wisdom it self. Exo 28:3.& 11.12. etc. 34.34. Pr.2.10. & 6.32. & 6.32.& 19.8. Hos 4:11.] and strong of power; who hardeneth himself against him, and had peace?"}],"5":[{"catchword":null,"tekst":"That transposeth the mountains, that they are not aware of it; [i.e. at unawares, and beyond all expectation, viz. Of the people that dwell upon them. Compare above ch.7.on v.10. or by way of comparison there is here ascribed life and motion unto things inanimate. See bel.ch.28. v.14.] that overturneth them in his anger."}],"6":[{"catchword":null,"tekst":"That removeth the Earth out of her place; that her pillars [i.e. her nethermost grounds and foundations] shake [i.e. do even quake and tremble for terror, comp.bel.26.11.]"}],"7":[{"catchword":null,"tekst":"That he commandeth the Sun, [Heb. Saith to the Sun; to say, or to speak, for to command. See 2 Chron.29.on v.24.] and he riseth not; [viz. Ordinarily, whiles the night must continue over such, and such lands Horizon; to or extraordinarily, when God is pleased to bring some alteration in the course of the Sea, Josh.10.20. 2 Kings 20.11.] and sealeth up the stars [viz. By the daylight, which hideth them, even as by a seal the contents of the letter, are hidden from the sight. The sense is, that God doth make the day: as in the first part of this verse the making of the night is ascribed to him. Or, it may be understood of some extraordinary and miraculous obscuring or with-holding of the light of the stars: thus the word sealing, is taken Isa 29:11. Dan.9.24. etc 12.4,9.]"}],"8":[{"catchword":null,"tekst":"That spreads forth the heavens alone: and treadeth upon the heights of the Sea [i.e. upon the flood, and high-swollen waves of the sea, which God doth calm and make plain, as if he did level and smooth with his feet.]"}],"9":[{"catchword":null,"tekst":"That maketh the Wain, [a certain constellation of the heavens, so called likewise by many to this day, but otherwise Arctas, or, Ursa. Some do understand here the constellation called Arcturus. See hereof likewise bel.38,32.] the Orton [another Constellation appearing in December, until the Spring time. See likewise hereof, bel.38.31. & Amos 5.8.] and the seven stares, [also a Constellation, or Celestial sign, called by the Latines Vergiliae, and Plejades by the Greeks, vulgarly the sevens stares, appearing in the // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
