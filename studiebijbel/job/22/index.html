t maakt?","4":"Is het om uw vrees dat Hij u bestraft, dat Hij met u in het gericht komt?","5":"Is uw boosheid niet groot, en is er geen einde aan uw ongerechtigheden?","6":"Want u hebt van uw broeders zonder reden pand afgenomen, en de kleren van de naakten hebt u uitgetrokken.","7":"De vermoeide hebt u geen water te drinken gegeven, en van de hongerige hebt u het brood onthouden.","8":"Maar was er een man van geweld, aan hem behoorde het land, en een aanzienlijk persoon woonde daarin.","9":"De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld.","10":"Daarom zijn er strikken rondom u, en angst heeft u haastig overvallen.","11":"Of u ziet de duisternis niet, en een overvloed van water bedekt u.","12":"Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.","13":"Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?","14":"De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.","15":"Hebt u het pad van vroeger dagen[1] in acht genomen, dat de onrechtvaardige mensen betreden hebben?","16":"Die weggerukt zijn voordat het hun tijd was; een vloed is over hun grond uitgestort;","17":"Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?","18":"Hij had immers hun huizen met goed gevuld; daarom is de raad van de goddelozen ver van mij.","19":"De rechtvaardigen zagen het, en waren blij, en de onschuldige bespotte hen;","20":"Omdat onze stand niet vernietigd is, maar het vuur hun overblijfsel verteerd heeft.","21":"Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen.","22":"Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart.","23":"Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.","24":"Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken;","25":"Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;","26":"Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.","27":"U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.","28":"Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.","29":"Als men iemand vernederen zal, en u zult zeggen: Er is verhoging; dan zal God de nederige van ogen behouden.","30":"Ja, Hij zal hem bevrijden, die niet onschuldig is; hij wordt bevrijd door de zuiverheid van uw handen."},"SV":{"1":"Toen antwoordde Elifaz, de Themaniet, en zeide:","2":"Zal ook een man Gode voordelig zijn? Maar voor zichzelven zal de verstandige voordelig zijn.","3":"Is het voor den Almachtige nuttigheid, dat gij rechtvaardig zijt; of gewin, dat gij uw wegen volmaakt?","4":"Is het om uw vreze, dat Hij u bestraft, dat Hij met u in het gericht komt?","5":"Is niet uw boosheid groot, en uwer ongerechtigheden geen einde?","6":"Want gij hebt uw broederen zonder oorzaak pand afgenomen, en de klederen der naakten hebt gij uitgetogen.","7":"Den moede hebt gij geen water te drinken gegeven, en van den hongerige hebt gij het brood onthouden.","8":"Maar was er een man van geweld, voor dien was het land, en een aanzienlijk persoon woonde daarin.","9":"De weduwen hebt gij ledig weggezonden, en de armen der wezen zijn verbrijzeld.","10":"Daarom zijn strikken rondom u, en vervaardheid heeft u haastelijk beroerd.","11":"Of gij ziet de duisternis niet, en des water overvloed bedekt u.","12":"Is niet God *in* de hoogte der hemelen? Zie toch het opperste der sterren aan, dat zij verheven zijn.","13":"Daarom zegt gij: Wat weet er God van? Zal Hij door de donkerheid oordelen?","14":"De wolken zijn Hem een verberging, dat Hij niet ziet; en Hij bewandelt den omgang der hemelen.","15":"Hebt gij het pad der eeuw waargenomen, dat de ongerechtige lieden betreden hebben?","16":"Die rimpelachtig gemaakt zijn, als het de tijd niet was; een vloed is *over* hun grond uitgestort;","17":"Die zeiden tot God: Wijk van ons! En wat had de Almachtige hun gedaan?","18":"Hij had immers hun huizen met goed gevuld; daarom is de raad der goddelozen verre van mij.","19":"De rechtvaardigen zagen het, en waren blijde, en de onschuldige bespotte hen;","20":"Dewijl onze stand niet verdelgd is, maar het vuur hun overblijfsel verteerd heeft.","21":"Gewen u toch aan Hem, en heb vrede; daardoor zal u het goede overkomen.","22":"Ontvang toch de wet uit Zijn mond, en leg Zijn redenen in uw hart.","23":"Zo gij u bekeert tot den Almachtige, gij zult gebouwd worden; doe het onrecht verre van uw tenten.","24":"Dan zult gij het goud op het stof leggen, en het *goud* *van* Ofir bij den rotssteen der beken;","25":"Ja, de Almachtige zal uw overvloedig goud zijn, en uw krachtig zilver zijn;","26":"Want dan zult gij u over den Almachtige verlustigen, en gij zult tot God uw aangezicht opheffen.","27":"Gij zult tot Hem ernstiglijk bidden, en Hij zal u verhoren; en gij zult uw geloften betalen.","28":"Als gij een zaak besluit, zo zal zij u bestendig zijn; en op uw wegen zal het licht schijnen.","29":"Als men *iemand* vernederen zal, en gij zeggen zult: Het zij verhoging; dan zal *God* den nederige van ogen behouden.","30":"*Ja*, Hij zal dien bevrijden, die niet onschuldig is, want hij wordt bevrijd door de zuiverheid uwer handen."},"KJV":{"1":"Then Eliphaz the Temanite answered and said,","2":"Can a man be profitable unto God, as he that is wise may be profitable","3":"*Is it* any pleasure to the Almighty, that thou art righteous? or *is it* gain *to him*, that thou makest thy ways perfect?","4":"Will he reprove thee for fear of thee? will he enter with thee into judgment?","5":"*Is* not thy wickedness great? and thine iniquities infinite?","6":"For thou hast taken a pledge from thy brother for nought, and stripped the naked of their clothing.","7":"Thou hast not given water to the weary to drink, and thou hast withholden bread from the hungry.","8":"But *as for* the mighty man, he had the earth; and the honourable man dwelt","9":"Thou hast sent widows away empty, and the arms of the fatherless have been broken.","10":"Therefore snares *are* round about thee, and sudden fear troubleth","11":"Or darkness, *that* thou canst not see; and abundance of waters cover","12":"*Is* not God in the height of heaven? and behold the height of the stars, how high","13":"And thou sayest, How doth God know? can he judge through the dark cloud?","14":"Thick clouds *are* a covering to him, that he seeth not; and he walketh in the circuit of heaven.","15":"Hast thou marked the old way which wicked men have trodden?","16":"Which were cut down out of time, whose foundation was overflown with a flood:","17":"Which said unto God, Depart from us: and what can the Almighty do","18":"Yet he filled their houses with good *things*: but the counsel of the wicked is far","19":"The righteous see *it*, and are glad: and the innocent laugh them to scorn.","20":"Whereas our substance is not cut down, but the remnant of them the fire consumeth.","21":"Acquaint now thyself with him, and be at peace: thereby good shall come","22":"Receive, I pray thee, the law from his mouth, and lay up his words in thine heart.","23":"If thou return to the Almighty, thou shalt be built up, thou shalt put away iniquity far from thy tabernacles.","24":"Then shalt thou lay up gold as dust, and the *gold* of Ophir as the stones of the brooks.","25":"Yea, the Almighty shall be thy defence, and thou shalt have plenty of silver.","26":"For then shalt thou have thy delight in the Almighty, and shalt lift up thy face unto God.","27":"Thou shalt make thy prayer unto him, and he shall hear thee, and thou shalt pay thy vows.","28":"Thou shalt also decree a thing, and it shall be established unto thee: and the light shall shine upon thy ways.","29":"When *men* are cast down, then thou shalt say, *There is* lifting up; and he shall save the humble person.","30":"He shall deliver the island of the innocent: and it is delivered by the pureness of thine hands."}},"tsk":{"2":[{"kopje":"man","refs":["Job 35:6-8","Ps 16:2","Luk 17:10"]},{"kopje":"terwijl","refs":["Job 21:15","Deut 10:13","Spr 3:13-18","Spr 4:7-9","Spr 9:12","Pred 7:11","Pred 7:12","Matt 5:29","Gal 6:7","Gal 6:8"]}],"3":[{"kopje":"nuttig","refs":["1 Kron 29:17","Ps 147:10","Ps 147:11","Spr 11:1","Spr 11:20","Spr 12:22","Spr 15:8","Mal 2:17","Fil 4:18"]},{"kopje":"u uw wegen volmaakt maakt","refs":["Job 23:10-12","Ps 39:2","Ps 119:3-6","Ps 119:59","Hand 24:16","2 Kor 7:1"]}],"4":[{"kopje":"bestraft","refs":["Ps 39:12","Ps 76:7","Ps 80:17","Openb 3:19"]},{"kopje":"om uw vrees","refs":["Job 7:12"]},{"kopje":"Hij met u in het gericht komt","refs":["Job 9:19","Job 9:32","Job 14:3","Job 16:21","Job 23:6","Job 23:7","Job 34:23","Ps 130:3","Ps 130:4","Ps 143:2","Pred 12:14","Jes 3:14","Jes 3:15"]}],"5":[{"kopje":"niet groot","refs":["Job 4:7-11","Job 11:14","Job 15:5","Job 15:6","Job 15:31-34","Job 21:27","Job 32:3"]},{"kopje":"uw","refs":["Ps 19:13","Ps 40:13"]}],"6":[{"kopje":"Want u hebt","refs":["Job 24:3","Job 24:9","Ex 22:26","Deut 24:10-18","Ezech 18:7","Ezech 18:12","Ezech 18:16","Amos 2:8"]},{"kopje":"uitgetrokken","refs":["Job 24:10","Job 31:19","Job 31:20"]}],"7":[{"kopje":"geen water te drinken gegeven","refs":["Job 31:17","Deut 15:7-11","Ps 112:9","Spr 11:24","Spr 11:25","Spr 19:17","Jes 58:7","Jes 58:10","Ezech 18:7","Ezech 18:16","Matt 25:42","Rom 12:20"]}],"8":[{"kopje":"Maar","refs":["Job 29:7-17","Job 31:34","1 Kon 21:11-15","Ps 12:9","Micha 7:3"]},{"kopje":"aanzienlijk","refs":["Job 13:8"]}],"9":[{"kopje":"weduwen","refs":["Job 24:3","Job 24:21","Job 29:12","Job 29:13","Job 31:16-18","Job 31:21","Ex 22:21-24","Deut 27:19","Ps 94:6","Jes 1:17","Jes 1:23","Jes 10:2","Ezech 22:7","Mal 3:5","Luk 18:3-5"]},{"kopje":"armen","refs":["Ps 10:15","Ps 37:17","Ezech 30:22"]}],"10":[{"kopje":"strikken","refs":["Job 18:8-10","Job 19:6","Ps 11:6"]},{"kopje":"haastig","refs":["Jo \"H7896\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1220\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">as</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and the gold of <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir</span> as the <span class=\"wl wl-kjv\" data-code=\"H6697\">stones</span> of the brooks.","25":"Yea, the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> shall be thy <span class=\"wl wl-kjv\" data-code=\"H1220\">defence,</span> and thou shalt have <span class=\"wl wl-kjv\" data-code=\"H8443\">plenty</span> of silver.","26":"For then shalt thou have thy <span class=\"wl wl-kjv\" data-code=\"H6026\">delight</span> in the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty,</span> and shalt lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> unto God.","27":"Thou shalt make thy <span class=\"wl wl-kjv\" data-code=\"H6279\">prayer</span> unto him, and he shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thee, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> thy vows.","28":"Thou shalt also <span class=\"wl wl-kjv\" data-code=\"H1504\">decree</span> a <span class=\"wl wl-kjv\" data-code=\"H562\">thing,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H6965\">established</span> unto thee: and the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> shall <span class=\"wl wl-kjv\" data-code=\"H5050\">shine</span> upon thy ways.","29":"When men are cast <span class=\"wl wl-kjv\" data-code=\"H8213\">down,</span> then thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> There is lifting <span class=\"wl wl-kjv\" data-code=\"H1466\">up;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H7807\">humble</span> person.","30":"He shall <span class=\"wl wl-kjv\" data-code=\"H4422\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H336\">island</span> of the <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent:</span> and it is <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered</span> by the <span class=\"wl wl-kjv\" data-code=\"H1252\">pureness</span> of thine hands."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Zal ook","tekst":"Hij wil zeggen: Neen, Psa 16:2 . Daarom hebt gij niet zozeer te beroemen over uw vroomheid; want Hij heeft geen voordeel daarvan, hetzij gij vroom zijnde lijdt, of goddeloos zijnde welvaart. Een wijs mens kan zichzelven deugd doen, maar niet Gode, die in zichzelven de volle genoegzaamheid is van alle goed; zie Gen 17:1 , op de woorden God Almachtig, en vergelijk onder, Job 35:7-8 ."},{"catchword":"Maar","tekst":"Anders, als hij; te weten de mens, nut is, zal Hij, te weten God, daardoor voorspoedig zijn, of welvaren?"}],"3":[{"catchword":"Is het","tekst":"Anders, is het den Almachtige welgevallig, of behagelijk, dat gij u rechtvaardigt?"},{"catchword":"nuttigheid,","tekst":"Hebreeuws, lust, of begeerte, vermaking. Hetwelk hier zoveel is als voordeel [omdat voordelige zaken begeerd worden], gelijk blijkt uit het voorgaande en navolgende, waar het woord, eigenlijk betekenende begeerte, voor gewin genomen wordt."},{"catchword":"uw wegen","tekst":"Dat is, uw leven vromelijk aanstelt. Het tegendeel is, zijn weg verderven, Gen 6:12 , en zijn werken verderven; Zep 3:7 ."}],"4":[{"catchword":"Is het","tekst":"Dat is, omdat Hij u vreest, dat gij Hem zoudt mogen beschadigen en leed doen; gelijk Jobs woorden boven, Job 7:12 , zo zouden mogen getrokken worden. Of, omdat gij Hem vreest, dat is, door een religieuse godvruchtigheid voor ogen hebt. De vraag van Elifaz loochent sterkelijk, willende zeggen dat het daarom niet was, maar om hetgeen verhaald wordt in vs.5."},{"catchword":"in het gericht","tekst":"Te weten, om u te veroordelen en te straffen. Alzo Psa 143:2 ."}],"5":[{"catchword":"groot,","tekst":"Of, vele; te weten, waarom gij gestraft wordt. Uit de grootheid en veelheid zijner straffen besluit Elifaz kwalijk de grootheid en veelheid van Jobs misdaden."}],"6":[{"catchword":"Want","tekst":"Hij wil zeggen: Het moet zijn, dat gij u met enige dezer misdaden, die ik nu ga verhalen, of met alle, bezoedeld hebt, omdat gij zo vreeslijk van God gestraft wordt."},{"catchword":"broederen","tekst":"Dat is, bloedvrienden. Zie Gen 24:27 ."},{"catchword":"zonder oorzaak","tekst":"Dat is, ten onrechte; te weten, als het niet nodig was; of omdat gij te pand genomen hebt, dat gij niet meost te pand nemen; of, omdat gij meer genomen hebt dan het geleende waardig was, of omdat gij betaald zijnde, het pand nog behouden hebt dat genomen hebbende, niet zozeer om u te verzekeren, als om het goed van uw naaste in uw macht te krijgen. Zie Exo 22:26-27 ; Deu 24:6 , Deu 24:10 , enz."},{"catchword":"der naakten","tekst":"Dat is, die van armoede bijna naakt waren. Zo worden de armen genoemd, Isa 58:7 , of die door het uitroven hunner goederen arm gemaakt werden."}],"8":[{"catchword":"van geweld,","tekst":"Hebreeuws, een man des arms; dat is, die geweld pleegde en de lieden verdrukte; voor dien steldet gij het land open. Vergelijk deze manier van spreken met de aantekening boven, Job 11:2 . Arm voor geweld; alzo onder, Job 35:9 , en Job 38:15 ."},{"catchword":"aanzienlijk persoon","tekst":"Hebreeuws, aangenomen van aangezicht; dat is, die men om enige uiterlijke hoedanigheid vóór anderen stelde, die van geringer aanzien waren. Zie van dusdanige aanneming, of aanzien, Lev 19:15 ."}],"9":[{"catchword":"armen der wezen","tekst":"Versta, al de hulp en sterkte, die nog voor de wezen overig was; zie 2Ch 32:8 ."}],"10":[{"catchword":"strikken","tekst":"Te weten, der ellenden en tegenheden, die u omvangen en verwarren als een strik. Vergelijk boven, Job 18:8-9 , enz., en Job 19:6 met de aantekening."}],"11":[{"catchword":"ziet","tekst":"Dat is, begrijpt niet, zo gij wel behoordet, de ellende waarin gij steekt en de oorzaken van die, te weten de zonden, waarvan in het voorgaande. Duisternis voor ellende. Zie Gen 15:12 , voor zonden Isa 5:20 ; Eph 5:11 ."},{"catchword":"des water","tekst":"Versta, dezelve ellende; want de woorden water, vloed, stromen, enz. worden dikwijls voor allerlei tegenspoed genomen. Zie 2Sa 22:17 ."}],"12":[{"catchword":"Is niet God","tekst":"Nadat Elifaz den vromen Job in het voorgaande enige zonden tenlaste gelegd heeft, die hij tegen zijn naasten begaan zou hebben, bezwaart hij hem nu nog met hetgeen hij regelrecht tegen God, in het loochenen van zijne eeuwige voorzienigheid, gezondigd zou hebben; naar welken zin de woorden van vs.12 Jobs woorden zouden zijn. Anders kunnen zij verstaan worden van de woorden van Elifaz, waarmede hij Job zou vermanen, dat God, die hoog gezeten is en laag ziet, wel waarnemen kan wien Hij het goede of kwade wil toezenden; hetwelk wel recht gesproken is, doch op den persoon van Job kwalijk gepast."},{"catchword":"in de hoogte","tekst":"Dat is, is God niet de allerhoogste, en heeft Hij niet zijn woning boven alle zichtbare schepselen, ja ook boven de sterren?"},{"catchword":"het opperste","tekst":"Hebreeuws, het hoofd."},{"catchword":"dat zij","tekst":"Te weten, om daaruit te verzinnen hoe hoog God is, die nog veel hoger is dan de sterren."}],"13":[{"catchword":"zegt gij","tekst":"Job had dit alzo niet gezegd, maar Elifaz, verdraaiende Jobs redenen, heeft dit verkeerdelijk daaruit getrokken."},{"catchword":"donkerheid","tekst":"Versta door deze hetgeen tussen de hoogste woonstede Gods en deze aarde begrepen is, waaronder zijn de wolken en dikke nevelen, door welke, omdat de mensen niet zien kunnen, het verdorven verstand des mensen oordeelt dat God ook daardoor niet zien kan wat hier in deze wereld omgaat. Dit ongerijmd oordeel heeft Elifaz en onrechte Job toegeschreven , gelijk ook wat volgt in vs.14."}],"14":[{"catchword":"Hij bewandelt","tekst":"Dat is, Hij bemoeit zich in de regering der wereld met de hemelse en algemene dingen, niet met de aardse en particuliere."}],"15":[{"catchword":"het pad","tekst":"Dat is, den vorigen gang, dien de goddelozen vanouds af tot hun verderf ingegaan zijn. Alzo is het woord eeuw, of eeuwigheid genomen. Isa 57:11 ; Jer 2:20 , en Jer 28:8 ."}],"16":[{"catchword":"rimpelachtig","tekst":"Anders, uitgeroeid, of afgesneden zijn. Hierdoor verstaan sommigen in het algemeen de plagen en oordelen Gods over de goddelozen, die dikwijls vergeleken worden bij water, gelijk hier, en bij vuur, gelijk vs.20. Sommigen nemen het in het bijzonder op den zondvloed."},{"catchword":"tijd","tekst":"Te weten, de volle tijd huns levens, tot welken zij naar den loop der natuur en den staat hunner gezondheid hadden kunnen geraken, zo zij niet door een geweldigen dood van versmoring waren omgekomen. Vergelijk Psa 55:24 ."}],"17":[{"catchword":"Wijk van ons","tekst":"Dit zijn de woorden, die Job tevoren verhaald had van de goddelozen, die in rijkdom en weelde oud werden; boven, Job 21:14 . Deze keert nu Elifaz tot zijn rede, zeggende dat de doden door plagen in het algemeen, of den zondvloed in het bijzonder, omgekomen waren, omdat zij deze woorden gesproken hadden."}],"18":[{"catchword":"daarom","tekst":"Deze woorden had Job ook gebruikt, boven, Job 21:16 , maar Elifaz schijnt ze te vernieuwen, met deze mening, dat ze hem beter betaamden dan Job, dien hij voor goddeloos hield."},{"catchword":"is de raad","tekst":"Deze woorden had Job ook gebruikt, boven, Job 21:16 , maar Elifaz schijnt ze te vernieuwen, met deze mening, dat ze hem beter betaamden dan Job, dien hij voor goddeloos hield."}],"19":[{"catchword":"De rechtvaardigen","tekst":"Namelijk Noach, met de zijnen; want deze woorden behoren nog [naar sommiger gevoelen] tot de historie van den zondvloed."},{"catchword":"waren blijde,","tekst":"Te weten, niet in den ondergang der goddelozen, maar in het bewijs van Gods rechtvaardigheid tegen dezelve, en zijn barmhartigheid tegen henzelven."},{"catchword":"de onschuldige","tekst":"Namelijk Noach."}],"20":[{"catchword":"stand","tekst":"Dat is, het leven en welvaren dergenen die vroom waren en God vreesden, onder wie Elifaz zich mede rekent, omdat hij zich hield een van hun navolgers en metgezellen in de godvruchtigheid."},{"catchword":"vuur","tekst":"Versta, het vuur der goddelijke gramschap en wraak. Alzo Deu 32:22 ; Psa 18:9 ; Isa 26:11 , en Isa 66:16 ; Eze 22:31 , of de tegenheid, die uit Gods gramschap komt, boven, Job 15:34 . Sommigen verstaan het voornamelijk van de uitroeiing van Sodom en Gomorra."},{"catchword":"overblijfsel","tekst":"Anders, hun uitnemendheid."}],"21":[{"catchword":"aan Hem,","tekst":"Namelijk, aan God, te weten, om Hem oprechtelijk te vrezen en te dienen als uw Heere en Vader."},{"catchword":"heb vrede;","tekst":"Te weten, door geduldigheid in het tegenwoordig lijden en hoop van toekomende verlossing. Het woord vrede betekent de inwendige en geestelijke gerustheid des harten, gelijk Jdg 6:23 , en Jdg 19:20 ; Isa 57:21 ; Col 3:15 . Of, gij zult vrede hebben; dat is, welvaren en voorspoed hebben. Zie Gen 37:14 ."},{"catchword":"daardoor","tekst":"Anders, daarin, of in die [dingen] is uw toekomst goed."},{"catchword":"het goede","tekst":"Vergelijk boven, Job 21:13 , en de aantekening."}],"22":[{"catchword":"wet","tekst":"Anders, lering."},{"catchword":"Zijn mond,","tekst":"Namelijk, Gods. Versta door den mond Gods, zijn woord, of zijn dienaren, die zijn woord verkondigen. Zie Isa 11:4 ; 2Th 2:8 ."}],"23":[{"catchword":"gebouwd worden;","tekst":"Dat is, hersteld worden in uw vorigen staat, of door zegen en voorspoed opkomen. Het woord bouwen wordt alzo genomen, Psa 28:5 ; Jer 12:16 , en Jer 31:4 ; Mal 3:15 . Vergelijk Gen 16:2 , en boven, Job 5:24 ."},{"catchword":"tenten","tekst":"Dat is, huizen en woningen. Zie 2Ki 13:5 ."}],"24":[{"catchword":"het goud","tekst":"Dat is, zeer overvloedigen rijkdom vergaderen. Het goud op, of bij het stof te leggen, schijnt zoveel te zijn als goud gelijk stof op te hopen, of het goud door den geweldigen overvloed, dien men heeft, te achten als stof, dat men niet met vaste bewaring behoeft te verzekeren. Anders, men zal het goud op het stof leggen; dat is, God zal door zijn zegen u het goud lichtelijk laten voortkomen."},{"catchword":"het goud van","tekst":"Zie 1Ki 9:28 ."},{"catchword":"rotssteen","tekst":"Dat is, niet in hoge en vaste plaatsen, waar het zou mogen schijnen wel bewaard te zijn, maar in het lage aan den voet van een rotssteen, waartegen sterke stromen vloeien, die lichtelijk ontdekken en ook wegnemen kunnen wat daarbij ligt. De zin is, dat hij het goud in zulken overvloed zou hebben, dat hij het niet veel achten zou, en weinig bezorgd zijn om wel te bewaren."}],"25":[{"catchword":"overvloedig goud zijn,","tekst":"Het Hebreeuwse woord staat in het getal van velen, waarmede de overvloed te kennen gegeven wordt. Anders, uw bescherming."},{"catchword":"krachtig zilver zijn;","tekst":"Hebreeuws, zilver der krachten."}],"26":[{"catchword":"tot God","tekst":"Dat is, Hem vrijmoediglijk aanbidden en alle goed van Hem verwachten."}],"27":[{"catchword":"zult uw","tekst":"Dat is, dewijl Hij weldadig zal zijn tegen u, vervullende uw begeerten, zo zult gij ook Hem dankbaar zijn, u in zijn weldaden verheugende. Vergelijk Psa 50:14 , en Psa 61:9 ."}],"28":[{"catchword":"bestendig zijn;","tekst":"Dat is, zij zal in het werk gesteld worden en u vast blijven. Alzo Num 30:4 ; Isa 7:7 , en Isa 8:10 ."},{"catchword":"op uw wegen","tekst":"Dat is, uw handelingen, werken en daden zullen door den zegen des Heeren voorspoedig zijn."}],"29":[{"catchword":"Als men iemand","tekst":"Dat is, als iemand vernederd zal worden, te weten door enige ellende en tegenspoed."},{"catchword":"zeggen zult","tekst":"Dat is, bidden zult met vurige gebeden tot God, dat hij weder uit zijn lijden verhoogd en verlost zou mogen worden."},{"catchword":"den nederige","tekst":"Hebreeuws, den nedergebogene, of geslagene van ogen. Zie hiertegen de hoge ogen, van welken zie Pro 6:17 ."}],"30":[{"catchword":"die niet onschuldig","tekst":"Dat is, niet alleen de vromen, maar ook de onvromen en schuldigen zal God door uw gebed helpen; Gen 18:32 . Anders, een onschuldige zal een eiland bevrijden; of, Hij zal het eiland des onschuldigen bevrijden."},{"catchword":"door de zuiverheid","tekst":"Versta, de gebeden, die met opheffing der handen geschieden, komende uit een gelovig en oprecht hart; 1Ti 2:8 ."},{"catchword":"handen","tekst":"Hebreeuws, palmen."}]},"kanttekeningen_en":{"2":[{"catchword":"Shall a man also be profitable to God?","tekst":"He will say, no. Psa 16:2. and therefore thou needest not vaunt so much of thy goodness or godliness. For God hath no benefit by it, whether, being godly thou do suffer, or being wicked, thou do prosper. A wise and good unto himself, but not to God, who in himself is the full and perfect sufficiency of all Good., See Gen 17:1. on the words, God Almighty, and compare below 35.7,8."},{"catchword":"but the understanding (man) shall be profitable for himself","tekst":"Oth. When he (man, namely) is useful, shall he (namely, God) be prosperous thereby, or thrive by it?"}],"3":[{"catchword":"Is it advantage for the Almighty that thou art righteous?","tekst":"Oth. Is it well pleasing, or, acceptable to the Almighty, that thou justifieth thy self? Heb. Is it pleasure, or, desire, recreation, which doth here imply as much as profit, (things profitable being much desired and delighted in) which is plain by what goeth before and followeth after. Where the word, properly signifying desire, is taken for gain, or lucre."},{"catchword":"or gain, that thou perfectest thy ways?","tekst":"i.e. doest lead a godly, unblameable life. The contrary whereof is to spoil, or corrupt ones way. Gen 6:12. and to corrupt or destroy ones works Zeph.3.7."}],"4":[{"catchword":"Is it for fear of thee that he doth punish thee?","tekst":"i.e. doest thou think he is afraid, thou mightiest do him any hurt or damage and prejudice; according as Jobs words above 7.12. might be construed to imply, or, is it for thy fearing his, i.e. standing in a religious aw and fear of him. This quaere of Eliphaz doth strongly deny, and imply, that it was not therefore, but by reason, and for the causes related in the next verse."},{"catchword":"that he cometh with thee to judgement?","tekst":"viz. For to condemn, pass sentence upon, and punish thee, Psa 143:2."}],"5":[{"catchword":"Is not thy wickedness great?","tekst":"or, much: that namely, for which thou art punished; from the greatness and multitude of Jobs afflictions Eliphaz falsely inferreth the greatness and multitude of his transgressions. and no end of thine iniquities?"}],"6":[{"catchword":"For","tekst":"He will say, it must needs be, that thou hast defiled thy self with some of these iniquities, I shall rehearse now, if not with all, because of these fearful plagues from God upon thee."},{"catchword":"Thou hast taken pawn from thy Brethren","tekst":"i.e. of those of thy kindred and consanguinity. See Genesis 24.on verse 27."},{"catchword":"without cause","tekst":"i.e. wrongfully, viz. Because thou tookest that away in pawn, which thou oughtest not to take, or, taking away more then to the value of the thing thou lendest, or being paid, didst keep the pawn in thy hands still, having taken it not so much to ensure what thou lendest forth, as to wrest thy neighbours goods out of his hand, and keep it for thy self. See Exo 22:26,27. Deut.24.6,10, &c."},{"catchword":"and thou hast stripped the cloths off the naked","tekst":"i.e. those which were so poor and bare, that they could hardly cover their nakedness. Thus the poor are called Isaiah chapter 58.ver.7. or which were made poor by thy robbing and plundering of them."}],"8":[{"catchword":"But was there a man of power","tekst":"Heb. A man of the arm; i.e. one that had, and abused his power to violence and oppression."},{"catchword":"the land was for him","tekst":"i.e. thy country stood open for such an one. Compare this manner of speaking with the annotation above chap.11.on v.2. Arm for power, or Violence. Thus also below 35.9. and 38.15."},{"catchword":"and a respectful person","tekst":"Heb. Accepted by face, i.e. one that by reason of some outward port or quality, is ranked and placed before others, which are of less appearance. See of the like accepting, or respecting of persons, Lev.19.on v.15. dwelled therein."}],"9":[{"catchword":"The widows thou hast sent empty away, and the arms of the Orphans are bruised","tekst":"understand all the help, strength and ability, which the Orphans had left them. See 2 Chron.32.on v.8."}],"10":[{"catchword":"Therefore are snares round about thee:","tekst":"viz. All those miseries and adversities, which now do compass, intangle, and inthral thee, like so many snares, compare above 18.8,9, &c. And 19.6. together with the annotation. and fearfulness hath troubled thee on a sudden."}],"11":[{"catchword":"Or thou seest not the darkness","tekst":"i.e. doest not comprehend as indeed thou oughtest in what extremity of misery thou art plunged; and for what cause, that is, sins of thine; whereof in the former verses. Darkness for Misery. See Genesis 15.on verse 12. For sins, Isa 5:20. Eph 5:11."},{"catchword":"and the overflowing of the water covereth thee","tekst":"understand the same miseries; for the words waters, floods, streams, &c. Are frequently taken for all manner of adversity. See 2 Sam.22.on ver.17."}],"12":[{"catchword":"After that Elipahz in the precedent verses had taxed godly Job of divers sins, which he should have committed against his neighbour; he chargeth him now yet further with that, whereby he should have sinned and prevaricated directly against God, in denying of his eternal providence, according to which sense, the words of this verse, should be the represented speech of Job. Otherw. They may be understood, as the words of Eliphaz, minding Job, that God sitting so high, and seeing low, is well able to discern, to whom he shall impart good, or evil; which is well said indeed, but not so well applied to the person of Job. In the height of the heavens, i.e. is not God the most high of all, and hath he not his dwelling place above all visible creatures, yea, above the stars? Behold but the uppermost of the stars","tekst":"Heb. The head"},{"catchword":"That they are exalted","tekst":"namely thereby to consider how high God is, being much higher yet then any star."}],"13":[{"catchword":"Therefore sayest thou","tekst":"Job had not said so; but Eliphaz wresting his words, made this perverse construction of them."},{"catchword":"What doth God know of it, shall be judge through the darkness?","tekst":"understand hereby that vastness, which is betwixt the highest dwelling of God, and this earth here below, in which space there are the clouds, and thick mists of the air, through which men being not able to pierce with their sight, their corrupt understanding judgeth, that God himself also is not able to discern through it, what there is a doing here in the world. This absurd judgement Eliphaz wrongfully imputeth unto Job here, together with that which followeth in the next verse."}],"14":[{"catchword":"The clouds are a hiding to him, that he seeth not: and he doth walk the circuit of the heavens","tekst":"i.e. he troubleth himself, in governing of the world, only with things celestial and universal, not with terrestrial and particular."}],"15":[{"catchword":"Hast thou observed the path of the age (Seculi) which the unrighteous have trodden?","tekst":"i.e. the former course which the wicked of old have held to run into destruction. Thus the word age, or, eternity is taken. Isa 57:11. Jer 2:20. and 28.8."}],"16":[{"catchword":"Being made wrinkled","tekst":"Oth. Being destroyed, or, cut off. Hereby some do understand the plagues and judgements of God in general over the wicked, which are often compared to water, as in the verse, and to fire, as v.20. Some apply it in particular to the Deluge."},{"catchword":"When it was not the time:","tekst":"viz. The full time of their lives, whereunto, according to the course of nature, and the state of their bodily health, they might possibly have attained, if they had not been seized on by a violent death of fading and mouldering away on a sudden. Compare Psal.54.24. A flood is powered out (over) them."}],"17":[{"catchword":"Which said unto God, turn from us:","tekst":"these are the words which Job had formerly alledged of the wicked, that grew old in their riches and prosperity, above 21.14. Now Eliphaz turns them to his advantage, saying that the wicked did perish by such and such plagues in general, or in particular by the Deluge, because they had uttered these words. And what had the Almighty done to them."}],"18":[{"catchword":"Surely he had filled their houses with goods: there the counsel of the wicked is far from me","tekst":"Or, be far, &c. These very words Job had used before chap.21.16. but Eliphaz seemeth to repeat them here, to shew they became him better, then Job when he judged wicked."}],"19":[{"catchword":"The righteous saw it","tekst":"viz. Noah, and his, for these words (as some conceive) relate to the intimated judgement of the Deluge."},{"catchword":"And were glad:","tekst":"viz. Not in the destruction of the wicked, but in the demonstration of Gods righteous judgements on them, and mercy to themselves."},{"catchword":"And the innocent","tekst":"viz. Noah mocked them."}],"20":[{"catchword":"Because our estate is not destroyed","tekst":"he meaneth the life and welfare of those that were good and fearing God: among whom Eliphaz doth reckon himself also, as reputing himself one of their followers and co-partners in godliness:"},{"catchword":"But the fire","tekst":"viz. Of Gods wrath and indignation. So Deut.32.22. Psal.18.9. Isa 26:11. and 66.16. Eze 22:31. Or, the adversity which proceedeth from Gods indignation, above 15.34. Some understand here the destroying of the Cities of Sodom and Gomorra, in particular."},{"catchword":"Hath devoured their remnant","tekst":"Oth. Their excellency."}],"21":[{"catchword":"Do but accustom thy self to him","tekst":"viz. To God to fear and serve him uprightly as thy Lord and thy Father."},{"catchword":"And have peace:","tekst":"or, be at peace, viz. Through patience in the present affliction, and hope of the deliverance to come. The word peace, doth signify the inward and spiritual rest & quietness of the heart, as Jud 6:23. and 19.20. Isa 57:21. Col.3.15. Or, thou shalt have peace, i.e. prosper and farewell. See Gen.37.on v.4."},{"catchword":"thereby","tekst":"Oth. Therein in these (things)"},{"catchword":"Shall the good come upon thee","tekst":"Or, is thy income good. Compare above 21.13. and the annot."}],"22":[{"catchword":"Receive but the law","tekst":"Oth. Instruction"},{"catchword":"out of his mouth:","tekst":"God namely: understand by the mouth of declare his word. See Isa 11:4. 2 Thes.2.8. And lay his sayings (up) in thy heart."}],"23":[{"catchword":"If thou convert thy self to the Almighty, thou shalt be built","tekst":"i.e. restored into thy former estate. Or, through Gods blessing thrive and prosper. Thus the word building is taken, Psal.28.5. Jer 12:10. and 31.4. Malac.3.15. Compare Gen.16.on v.2. and above 5.44."},{"catchword":"Put the iniquity far from thy tents","tekst":"i.e. houses, or dwelling-places, See 2 Kings 13.on ver.5."}],"24":[{"catchword":"Then shalt thou lay the gold upon the dust:","tekst":"i.e. thou shalt get abundance of wealth. To lay the gold upon, or by the dust, seems to imply the heaping of it up reason of the mighty abundance one hath, then of the dust one treads upon, and which needs no care nor locks to keep it. Oth. The gold shall be laid upon the dust, or, one shall lay, &c. i.e. God shall by his blessing make the gold come easily before thee."},{"catchword":"and the (gold of) Ophir","tekst":"See 1 Kings 9.on v.28."},{"catchword":"by the rock of the brooks:","tekst":"i.e. not in high and inaccessible places, where it might seem to be guarded from coming at, but in the lower parts at the foot of a rock, against which the streams do beat, and thereby one may easily discover and also carry away that which lieth there. The meaning is, he should have the gold in that abundance, that he should not value it much, and take as little care to keep it in safe custody."}],"25":[{"catchword":"Ye the Almighty shall be thy overflowing gold:","tekst":"The Hebrew word is in the plural, whereby given to understand the mighty abundance. Oth. Thy protection."},{"catchword":"And thy mighty silver","tekst":"Hebrew silver, of strengths. (virium.)"}],"26":[{"catchword":null,"tekst":"For then thou shalt recreate thy self in the Almighty and thou shalt lift up thy face to God] i.e. cheerfully call upon, and expect all manner of good from him.]"}],"27":[{"catchword":"Thou shalt pray earnestly unto him, and he shall hear thee: and thou shalt pay thy vows","tekst":"i.e. because he shall be bountiful to thee, fulfilling thy desires, thou also shalt be thankful unto him, rejoicing in his beauty. Compare Psal.50.14. and 61.9."}],"28":[{"catchword":"When thou determinest a matter, then it shall be constant to thee:","tekst":"i.e. it shall be brought to pass and be settled for thee. So Num 30:4. Isa 7:7. and 8.10."},{"catchword":"And the light shall upon thy ways","tekst":"i.e. thy undertakings, works and actions shall through Gods blessings thrive and prosper."}],"29":[{"catchword":"When (any) one shall be humbled","tekst":"or brought low viz. Through misery and adversity"},{"catchword":"and thou shalt say. Be it exalting:","tekst":"i.e. fervently pray to God in his behalf, that such an one may be raised up again out of his affliction, and be delivered."},{"catchword":"then shall (God) save the lowly of eyes","tekst":"Heb. The bowed down, or, beaten down if eyes. Unto these are opposed, the high, or haughty eyes whereof see Pro 6:17."}],"30":[{"catchword":"Yea, he shall free him that is n     `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
