, omdat er geen eten is?","4":"Weet u de tijd van het baren van de steengeiten? Hebt u waargenomen de arbeid van de hinden?","5":"Zult u de maanden tellen, *die* zij vervullen, en weet u de tijd van haar baren?","6":"Als zij zich krommen, haar jongen met versplijting voortbrengen, haar smarten uitwerpen?","7":"Haar jongen worden kloek, worden groot door het koren; zij gaan uit, en keren niet weer tot dezelve.","8":"Wie heeft de woudezel vrij heengezonden, en wie heeft de banden van de wilde ezel gelost?","9":"Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.","10":"Hij belacht het gewoel van de stad; het menigerlei getier van de drijver hoort hij niet.","11":"Dat hij uitspeurt op de bergen, is zijn weide; en hij zoekt allerlei groensel na.","12":"Zal de eenhoorn[1] u willen dienen? Zal hij vernachten aan uw kribbe?","13":"Zult u de eenhoorn met zijn touw aan de voren binden? Zal hij de laagten achter u eggen?","14":"Zult u op hem vertrouwen, omdat zijn kracht groot is, en zult u uw arbeid op hem laten?","15":"Zult u hem geloven, dat hij uw zaad zal terugbrengen, en verzamelen *tot* uw dorsvloer?","16":"Zijn *van u* de verheugelijke vleugels van de pauwen? Of de veren van de ooievaar, en van de struisvogel?","17":"Dat zij haar eieren in de aarde laat, en in het stof die verwarmt.","18":"En vergeet, dat de voet die drukken kan, en de dieren van het veld die vertrappen kunnen?","19":"Zij verhardt zich tegen haar jongen, alsof zij de hare niet waren; haar arbeid is tevergeefs, *omdat* zij zonder vrees is.","20":"Want God heeft haar van wijsheid ontbloot, en heeft haar van het verstand niet meegedeeld.","21":"Als het tijd is, verheft zij zich in de hoogte; zij belacht het paard en zijn rijder.","22":"Zult u het paard sterkte geven? Kunt u zijn hals met donder bekleden?","23":"Zult u het beroeren als een sprinkhaan? De pracht van zijn gesnuif is een verschrikking.","24":"Het graaft in de grond, en het is vrolijk in zijn kracht; en trekt uit, de geharnaste tegemoet.","25":"Het belacht de vrees, en wordt niet ontsteld, en keert niet weerom vanwege het zwaard.","26":"Tegen hem ratelt de pijlkoker, het vlammig ijzer van de speer en van de lans.","27":"Met schudding en beroering slokt het de aarde op, en gelooft niet, dat het is het geluid van de bazuin.","28":"In het volle geschal van de bazuin, zegt het: Heah! en ruikt de krijg van verre, de donder van de vorsten en het gejuich.","29":"Vliegt de sperwer door uw verstand, *en* breidt hij zijn vleugels uit naar het zuiden?","30":"Is het naar uw bevel, dat de arend zich omhoog verheft, en dat hij zijn nest in de hoogte maakt?","31":"Hij woont en vernacht in de steenrots, op de scherpte van de steenrots en van de vaste plaats.","32":"Van daar speurt hij het voedsel op; zijn ogen zien van verre af.","33":"Ook zuipen zijn jongen bloed; en waar verslagenen zijn, daar is hij.","34":"En de HEERE antwoordde Job, en zei:","35":"Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.","36":"Toen antwoordde Job de HEERE, en zei:","37":"Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.","38":"Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren."},"SV":{"1":"Zult gij voor den ouden leeuw roof jagen, of de graagheid der jonge leeuwen vervullen?","2":"Als zij nederbukken in de holen, *en* in den kuil zitten, ter loering?","3":"Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, *als* zij dwalen, omdat er geen eten is?","4":"Weet gij den tijd van het baren der steengeiten? Hebt gij waargenomen den arbeid der hinden?","5":"Zult gij de maanden tellen, *die* zij vervullen, en weet gij den tijd van haar baren?","6":"Als zij zich krommen, haar jongen met versplijting voortbrengen, haar smarten uitwerpen?","7":"Haar jongen worden kloek, worden groot door het koren; zij gaan uit, en keren niet weder tot dezelve.","8":"Wie heeft den woudezel vrij henengezonden, en wie heeft de banden des wilden ezels gelost?","9":"Dien Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.","10":"Hij belacht het gewoel der stad; het menigerlei getier des drijvers hoort hij niet.","11":"Dat hij uitspeurt op de bergen, is zijn weide; en hij zoekt allerlei groensel na.","12":"Zal de eenhoorn u willen dienen? Zal hij vernachten aan uw kribbe?","13":"Zult gij den eenhoorn met zijn touw aan de voren binden? Zal hij de laagten achter u eggen?","14":"Zult gij op hem vertrouwen, omdat zijn kracht groot is, en zult gij uw arbeid op hem laten?","15":"Zult gij hem geloven, dat hij uw zaad zal wederbrengen , en vergaderen *tot* uw dorsvloer?","16":"Zijn *van* *u* de verheugelijke vleugelen der pauwen? Of de vederen des ooievaars, en des struisvogels?","17":"Dat zij haar eieren in de aarde laat, en in het stof die verwarmt.","18":"En vergeet, dat de voet die drukken kan, en de dieren des velds die vertrappen kunnen?","19":"Zij verhardt zich tegen haar jongen, alsof zij de hare niet waren; haar arbeid is te vergeefs, *omdat* zij zonder vreze is.","20":"Want God heeft haar van wijsheid ontbloot, en heeft haar des verstands niet medegedeeld.","21":"Als het tijd is, verheft zij zich in de hoogte; zij belacht het paard en zijn rijder.","22":"Zult gij het paard sterkte geven? Kunt gij zijn hals met donder bekleden?","23":"Zult gij het beroeren als een sprinkhaan? De pracht van zijn gesnuif is een verschrikking.","24":"Het graaft in den grond, en het is vrolijk in zijn kracht; en trekt uit, den geharnaste tegemoet.","25":"Het belacht de vreze, en wordt niet ontsteld, en keert niet wederom vanwege het zwaard.","26":"Tegen hem ratelt de pijlkoker, het vlammig ijzer des spies en der lans.","27":"Met schudding en beroering slokt het de aarde op, en gelooft niet, dat het is het geluid der bazuin.","28":"In het volle geklank der bazuin, zegt het: Heah! en ruikt den krijg van verre, den donder der vorsten en het gejuich.","29":"Vliegt de sperwer door uw verstand, *en* breidt hij zijn vleugelen uit naar het zuiden?","30":"Is het naar uw bevel, dat de arend zich omhoog verheft, en dat hij zijn nest in de hoogte maakt?","31":"Hij woont en vernacht in de steenrots, op de scherpte der steenrots en der vaste plaats.","32":"Van daar speurt hij de spijze op; zijn ogen zien van verre af.","33":"Ook zuipen zijn jongen bloed; en waar verslagenen zijn, daar is hij.","34":"En de HEERE antwoordde Job, en zeide:","35":"Is het twisten met den Almachtige onderrichten? Wie God bestraft, die antwoorde daarop.","36":"Toen antwoordde Job den HEERE, en zeide:","37":"Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.","38":"Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren."},"KJV":{"1":"Wilt thou hunt the prey for the lion? or fill the appetite of the young lions,","2":"When they couch in *their* dens, *and* abide in the covert to lie in wait?","3":"Who provideth for the raven his food? when his young ones cry unto God, they wander for lack of meat.","4":"Knowest thou the time when the wild goats of the rock bring forth? *or* canst thou mark when the hinds do calve?","5":"Canst thou number the months *that* they fulfil? or knowest thou the time when they bring forth?","6":"They bow themselves, they bring forth their young ones, they cast out their sorrows.","7":"Their young ones are in good liking, they grow up with corn; they go forth, and return","8":"Who hath sent out the wild ass free? or who hath loosed the bands of the wild ass?","9":"Whose house I have made the wilderness, and the barren land his dwellings.","10":"He scorneth the multitude of the city, neither regardeth he the crying of the driver.","11":"The range of the mountains *is* his pasture, and he searcheth after every green thing.","12":"Will the unicorn be willing to serve thee, or abide by thy crib?","13":"Canst thou bind the unicorn with his band in the furrow? or will he harrow the valleys after"," ata-code=\"H539\">believe</span> him, that he will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">home</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> it into thy barn?","16":"Gavest thou the <span class=\"wl wl-kjv\" data-code=\"H7443\">goodly</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5965\">peacocks?</span> or <span class=\"wl wl-kjv\" data-code=\"H84\">wings</span> and <span class=\"wl wl-kjv\" data-code=\"H2624\">feathers</span> unto the ostrich?","17":"Which <span class=\"wl wl-kjv\" data-code=\"H5800\">leaveth</span> her <span class=\"wl wl-kjv\" data-code=\"H1000\">eggs</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2552\">warmeth</span> them in dust,","18":"And <span class=\"wl wl-kjv\" data-code=\"H7911\">forgetteth</span> that the <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> may <span class=\"wl wl-kjv\" data-code=\"H2115\">crush</span> them, or that the <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> may break","19":"She is <span class=\"wl wl-kjv\" data-code=\"H7188\">hardened</span> against her young <span class=\"wl wl-kjv\" data-code=\"H1121\">ones,</span> as though they were <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> hers: her <span class=\"wl wl-kjv\" data-code=\"H3018\">labour</span> is in <span class=\"wl wl-kjv\" data-code=\"H7385\">vain</span> without fear;","20":"Because <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5382\">deprived</span> her of <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> neither hath he <span class=\"wl wl-kjv\" data-code=\"H2505\">imparted</span> to her understanding.","21":"What <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> she lifteth <span class=\"wl wl-kjv\" data-code=\"H4754\">up</span> herself on <span class=\"wl wl-kjv\" data-code=\"H4791\">high,</span> she <span class=\"wl wl-kjv\" data-code=\"H7832\">scorneth</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> and his rider.","22":"Hast thou <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> <span class=\"wl wl-kjv\" data-code=\"H1369\">strength?</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> his <span class=\"wl wl-kjv\" data-code=\"H6677\">neck</span> with thunder?","23":"Canst thou make him <span class=\"wl wl-kjv\" data-code=\"H7493\">afraid</span> as a <span class=\"wl wl-kjv\" data-code=\"H697\">grasshopper?</span> the <span class=\"wl wl-kjv\" data-code=\"H1935\">glory</span> of his <span class=\"wl wl-kjv\" data-code=\"H5170\">nostrils</span> is terrible.","24":"He <span class=\"wl wl-kjv\" data-code=\"H2658\">paweth</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley,</span> and <span class=\"wl wl-kjv\" data-code=\"H7797\">rejoiceth</span> in his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength:</span> he goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">on</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the armed men.","25":"He <span class=\"wl wl-kjv\" data-code=\"H7832\">mocketh</span> at <span class=\"wl wl-kjv\" data-code=\"H6343\">fear,</span> and is not <span class=\"wl wl-kjv\" data-code=\"H2865\">affrighted;</span> neither turneth he <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the sword.","26":"The <span class=\"wl wl-kjv\" data-code=\"H827\">quiver</span> <span class=\"wl wl-kjv\" data-code=\"H7439\">rattleth</span> against him, the <span class=\"wl wl-kjv\" data-code=\"H3851\">glittering</span> <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> and the shield.","27":"He <span class=\"wl wl-kjv\" data-code=\"H1572\">swalloweth</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> with <span class=\"wl wl-kjv\" data-code=\"H7494\">fierceness</span> and <span class=\"wl wl-kjv\" data-code=\"H7267\">rage:</span> neither <span class=\"wl wl-kjv\" data-code=\"H539\">believeth</span> he that it is the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the trumpet.","28":"He <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">Ha,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">ha;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7306\">smelleth</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> the <span class=\"wl wl-kjv\" data-code=\"H7482\">thunder</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains,</span> and the shouting.","29":"Doth the <span class=\"wl wl-kjv\" data-code=\"H5322\">hawk</span> <span class=\"wl wl-kjv\" data-code=\"H82\">fly</span> by thy <span class=\"wl wl-kjv\" data-code=\"H998\">wisdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">stretch</span> her <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> toward the south?","30":"Doth the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> mount <span class=\"wl wl-kjv\" data-code=\"H1361\">up</span> at thy <span class=\"wl wl-kjv\" data-code=\"H6310\">command,</span> and <span class=\"wl wl-kjv\" data-code=\"H7311\">make</span> her <span class=\"wl wl-kjv\" data-code=\"H7064\">nest</span> on high?","31":"She <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelleth</span> and <span class=\"wl wl-kjv\" data-code=\"H3885\">abideth</span> on the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8127\">crag</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> and the strong place.","32":"From thence she <span class=\"wl wl-kjv\" data-code=\"H2658\">seeketh</span> the <span class=\"wl wl-kjv\" data-code=\"H400\">prey,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H5027\">behold</span> afar off.","33":"Her young <span class=\"wl wl-kjv\" data-code=\"H667\">ones</span> also suck <span class=\"wl wl-kjv\" data-code=\"H5966\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> and where the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> are, there is she.","34":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H347\">Job,</span> and said,","35":"Shall he that <span class=\"wl wl-kjv\" data-code=\"H7378\">contendeth</span> with the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> <span class=\"wl wl-kjv\" data-code=\"H3250\">instruct</span> him? he that <span class=\"wl wl-kjv\" data-code=\"H3198\">reproveth</span> <span class=\"wl wl-kjv\" data-code=\"H433\">God,</span> let him answer","36":"Then <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and said,","37":"Behold, I am <span class=\"wl wl-kjv\" data-code=\"H7043\">vile;</span> what shall I <span class=\"wl wl-kjv\" data-code=\"H7725\">answer</span> thee? I will <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H3926\">upon</span> my mouth.","38":"<span class=\"wl wl-kjv\" data-code=\"H259\">Once</span> have I <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken;</span> but I will not <span class=\"wl wl-kjv\" data-code=\"H6030\">answer:</span> yea, <span class=\"wl wl-kjv\" data-code=\"H8147\">twice;</span> but I will proceed no further."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ouden leeuw","tekst":"Te weten, die niet veel kracht meer heeft om zijn aas te bekomen. De zin is dat hem hetzelve door de voorzienigheid Gods toegeschikt wordt, niet door de zorg en den arbeid der mensen, Psa 104:21 , want anders zou hij moeten vergaan; boven, Job 4:11 ."},{"catchword":"graagheid","tekst":"Hebreeuws, het leven. Versta den gierigen lust en trek, dien de jonge leeuwen naar het aas hebben. Het Hebreeuwse woord chajah is in dit boek somtijds van enerlei betekenis met het woord nephes, ziel, gelijk te zien is boven, Job 33:18 , Job 33:20 , Job 33:22 . Nu nephes is somtijds zoveel als lust en begeerte tot iets, gelijk Psa 27:12 , en Psa 107:9 ; Pro 23:2 ; Isa 56:11 . Anders, den jongen leeuwen den kost, of leeftocht ten volle beschikken?"},{"catchword":"vervullen?","tekst":"Te weten, als zij van de oude vergeten of verlaten worden. Vergelijk Psa 47:9 ."}],"2":[{"catchword":"kuil","tekst":"Hebreeuws, hut, of tent; dat is, schuilhol, kuil, of schuilplaats."},{"catchword":"ter loering?","tekst":"Dat is, om enig gedierte te bespieden, dat zij vangen en verslinden mochten. Anders, in de loerplaats, te weten, waaruit zij loeren; alzo boven, Job 37:8 ."}],"3":[{"catchword":"kost,","tekst":"Het Hebreeuwse woord betekent eigenlijk den kost, die met jagen gekregen wordt. Zie Gen 27:3 , en de aantekening."},{"catchword":"jongen","tekst":"Hebreeuws, geborenen."},{"catchword":"tot God","tekst":"Dat is, als zij in hun nest schreeuwen om aas; hetwelk een geroep tot God genaamd wordt, omdat God voor het voedsel der jonge raven zorg draagt. Men schrijft dat zij in het eerst, omdat zij wit paddenhaar hebben, van de ouden verlaten worden, totdat zij zwart zijn, en hier intussen wonderbaarlijk van God gespijsd worden met zekere wormpjes, die in het nest uit hun drek groeien. Vergelijk Psa 147:9 ."},{"catchword":"dwalen,","tekst":"Te weten, omtrent het nest van de moeder verlaten zijnde."}],"4":[{"catchword":"Weet gij","tekst":"Versta hierdoor het gehele beleid en werk van de geboorten, voorttelingen en opkwekingen der wilde beesten; hetwelk alleen de voorzienigheid Gods moet toegeschreven worden, en niet de zorg des mensen."},{"catchword":"steengeiten?","tekst":"Zie 1Sa 24:3 ."},{"catchword":"den arbeid","tekst":"Dat is, den tijd, wanneer zij in den nood van baren zijn, om die, als zij in gevaar en smart zijn, te helpen."}],"5":[{"catchword":"Zult gij","tekst":"Dat is, kunt gij verzinnen het ogenblik van hun ontvangen? Deze vragen loochenen alle sterkelijk."},{"catchword":"vervullen,","tekst":"Dat is, afdoen en volbrengen; te weten, met het dragen van hun jongen."}],"6":[{"catchword":"krommen,","tekst":"Te weten, om te beter te baren."},{"catchword":"smarten","tekst":"Versta, de geboortepijnen, die in deze dieren groot zijn, en van welke zij alleen geholpen worden door de goddelijke voorzienigheid. Zie Psa 29:9 ."}],"7":[{"catchword":"jongen","tekst":"Hebreeuws, zonen; zie Lev 1:14 ."},{"catchword":"worden kloek,","tekst":"Dat is, worden weder gezond, fris en sterk, ofschoon zij eerst geworpen zijnde, door de zwaarheid der geboorte slap en teer waren."},{"catchword":"door het koren;","tekst":"Het woord bar in het oorspronkelijke betekent in het Hebreeuws koren, of tarwe, waarvan deze beesten hun voedsel nemen; maar het betekent in het Syrisch akker, of veld, gelijk ook het Chaldeeuwse woord bara zulks betekent; Dan 2:38 en Dan 4:12 . Waarom enigen hetzelve zo overzetten."},{"catchword":"haar","tekst":"Te weten, moeders, die ze geworpen hebben."}],"8":[{"catchword":"Wie heeft den woudezel","tekst":"De zin is, dat de ontembare en onbedwingelijke natuur der wilde ezels alleen van Gods regering en voorzienigheid komt, welker redenen, zodat de mens niet kan begrijpen, hij nog veel minder andere diepe en ondoorgrondelijke werken Gods vatten kan."}],"9":[{"catchword":"de wildernis","tekst":"Anders, het vlakke veld. Doch versta zulk vlak veld, dat wel wild en woest ligt, maar nochtans enig voeder voor de beesten heeft, gemengd uit velerlei groente en ruigte, hetwelk den wilden beesten wel smakend is."},{"catchword":"ziltige","tekst":"Dat is, het dorre, onvruchtbare en onbebouwde land. Zie Jdg 9:45 , en Psa 107:34 ."}],"10":[{"catchword":"Hij belacht","tekst":"Dat is, hij acht de menigte en het bedrijf der mensen niet, omdat hij de woestijn liever heeft, of omdat hij ook niet vreest het geweld, dat vele mensen zouden mogen aanleggen om hem te bedwingen. Dit is menselijkerwijze van de beesten gesproken, gelijk onder, vs.21, 25, 28, en Job 40:22-23 , en Job 41:18 , ob 41:20 ."},{"catchword":"menigerlei","tekst":"Dat is, het geroep, hetwelk pleegt gemaakt te worden van degenen, die enigen arbeid of dienst van mensen of beesten gedaan willen hebben."}],"11":[{"catchword":"Wat hij uitspeurt","tekst":"Hebreeuws, de uitspeuring, of het uitgespeurde der bergen; dat is hetgeen hij steeds zoekt op de bergen, als gras en andere groenigheid, is zijn voedsel."},{"catchword":"groensel na","tekst":"Dat is, groen kruid, dat in het wild wast."}],"12":[{"catchword":"Zal de eenhoorn","tekst":"Versta, ganselijk niet, en dat vanwege zijn moedige en onbedwingelijke kracht. Zie Num 23:22 ."}],"13":[{"catchword":"touw","tekst":"Te weten, waarmede hij gebonden zou worden om het ploegwerk te doen."},{"catchword":"voren binden?","tekst":"Dat is, aan het verheven land, hetwelk in de akkers tussen twee voren is. Zie boven, Job 31:38 . Doch versta hier het ploegwerk, waardoor de voren gemaakt worden, om welke oorzaak de overzetting gesteld kan worden aldus: Met zijn touw binden ter ploeging; dat is om te ploegen."},{"catchword":"de laagten","tekst":"Of, diepten, valleien, gronden. Sommigen verstaan hierdoor wederom de voren."}],"14":[{"catchword":"op hem vertrouwen,","tekst":"Dat is, u verzekeren dat hij uw werk in het veld zou mogen doen, gelijk de tamme beesten wel doen, die van de mensen in het akkerwerk gebruikt worden."},{"catchword":"uw arbeid","tekst":"Dat is, uw vruchten, die gij door uw arbeid gewonnen hebt. Vergelijk boven, Job 20:18 ."},{"catchword":"op hem laten?","tekst":"Te weten, om te dragen, of te voeren naar de schuur. Zie vs.15."}],"15":[{"catchword":"wederbrengen,","tekst":"Dat is, maken dat gij de gewenste vruchten genieten zult? hetwelk zou moeten geschieden met ploegen en eggen, of met de vruchten in de schuur te brengen."}],"16":[{"catchword":"de verheugelijke","tekst":"Te weten, waarmede de pauwen zich verheugen en verheffen, of ook de mensen zich vermaken."},{"catchword":"Of de vederen","tekst":"Anders, of de vleugel en het geveder des ooievaars. Anders, of de vleugel van den struis en [zijn] geveder, of pluimen."},{"catchword":"ooievaars,","tekst":"Zie Lev 11:19 ."},{"catchword":"struisvogels?","tekst":"Het Hebreeuwse woord notsah betekent wel een pluim, maar uit de volgende woorden van dit hfdst. wordt van de overzetters afgenomen dat hier te verstaan is de struis, dat is, een vogel, die met vele pluimen voorzien is. Het volgende kan op den pauw en op den ooievaar niet passen."}],"17":[{"catchword":"zij haar eieren","tekst":"Te weten, de struis."},{"catchword":"stof","tekst":"Dat is, in het zand."},{"catchword":"verwarmt","tekst":"Te weten, latende de zon daarover schijnen, opdat door haar warmte de eieren zouden uitgebroed worden. Want men schrijft dat deze vogel onaardig en zonder natuurlijken trek is tegen zijn eieren, die verlatende en de warmte der zon aanbevelende, zonder daarop te zitten."}],"18":[{"catchword":"die drukken kan,","tekst":"Hebreeuws, dat; dat is, elk een van die, te weten, eieren. Alzo in het andere lid van vs.18."}],"19":[{"catchword":"haar jongen,","tekst":"Of, haar eieren, uit welke zij jongen krijgt. Zij handelt daarmede hardelijk tegen het natuurlijke van andere vogels, om de redenen in vs.17,18 vermeld."},{"catchword":"haar arbeid","tekst":"Te weten, die zij heeft met haar eieren te leggen, zo God voor dezelve niet zorgde."},{"catchword":"omdat","tekst":"Te weten, van haar eieren te verliezen en daaruit geen jongen te krijgen."}],"20":[{"catchword":"heeft haar","tekst":"Hebreeuws, heeft haar de wijsheid doen vergeten; dat is, de wijsheid niet gegeven, of daarvan ontbloot. Versta door deze, de natuurlijke beweging en trek, die anderen beesten van God ingestort is, waardoor zij hun jongen wel weten te bewaren, te verzorgen en buiten gevaar te brengen."}],"21":[{"catchword":"Als het tijd is,","tekst":"Te weten, als zij van de jagers vervolgd wordt."},{"catchword":"verheft","tekst":"Te weten, wat boven de aarde, om haar loop te versnellen, en zo de pijlen en schichten te ontvlieden; want om de grootte en zwaarheid haars lichaams kan zij zich niet zeer hoog van de aarde oplichten."},{"catchword":"zij belacht","tekst":"Dat is, zij veracht ze, omdat zij ze door haar erge en aardige snelheid kan ontkomen. Dit is menselijker wijze van beesten gesproken; zie boven, vs.10."}],"22":[{"catchword":"donder bekleden?","tekst":"Versta hierbij, het briesen des paards, verenigd met geruisch en onstuimigheid. Vergelijk Jer 8:6 ."}],"23":[{"catchword":"als een sprinkhaan?","tekst":"Dat is, gelijk de mensen de sprinkhanen plegen te verschrikken en verjagen."},{"catchword":"een verschrikking","tekst":"Dat is, een oorzaak om verschrikt te worden."}],"24":[{"catchword":"grond,","tekst":"Het Hebreeuwse woord betekent wel gemeenlijk een dal, maar het wordt ook voor allerlei diepte en laagte genomen, gelijk boven, vs.13, voor de laagte des lands, of der voren, Pro 9:18 , voor de diepte des grafs; en hier voor een kuil, die van een moedig paard in de aarde gemaakt wordt."},{"catchword":"geharnaste","tekst":"Of, gewapenden. Hebreeuws, wapen, of wapening."}],"25":[{"catchword":"vreze,","tekst":"Dat is, de dingen, die den mensen vrees plegen aan te jagen, als allerlei wapenen en krijgsgereedschap. Vrees voor dat te vrezen is; alzo Pro 1:26 , en Pro 10:24 ; Isa 66:4 ."},{"catchword":"wederom","tekst":"Hebreeuws, van het aangezicht des zwaards."}],"26":[{"catchword":"de pijlkoker,","tekst":"Te weten, des gewapenden ruiters, die daarop zit."},{"catchword":"het vlammig","tekst":"Hebreeuws, vlam; maar dit woord is ook bij gelijkenis genomen voor het blinkende en glinsterende ijzer van een spies, lans en zwaard. Zie Gen 3:24 :1Sa 17:7 ; Nah 3:3 ."}],"27":[{"catchword":"slokt het","tekst":"Dat is, loopt daarover met zulke snelheid en vaardigheid, dat het schijnt deze in te slikken, overmits hij, die daarop zit, het land terstond uit het gezicht verliest, alsof het van een paard opgeslokt en ingezwolgen ware. Anders, slorpt in, te weten, het stof dat het met zijn voeten maakt, of holt uit."},{"catchword":"gelooft niet,","tekst":"De zin is dat de moedige paarden in den strijd zo over en weder lopen met zulke haastigheid en moed, en zo branden om aan het gevecht en gewoel te komen, dat zij niet merken, zelfs op den slag der trompetten. Of, zij zijn zo vrolijk, wanneer zij het geluid der trompetten horen, dat zij, om zo te spreken, hetzelve kwalijk kunnen geloven. Anders, houdt zich niet vast als het geluid der bazuin gaat. Hebreeuws, de stem der bazuin."}],"28":[{"catchword":"In het volle","tekst":"Hebreeuws, in de genoegzaamheid der bazuinen; dat is, als de bazuin of de trompet ten allerklaarste slaat. Of, onder de bazuin."},{"catchword":"Heah","tekst":"Dit is een woord, betekenende het geluid van vreugde, en ook somtijds van grote moedigheid, waarmede men zijn vijand trotseert. Vergelijk Psa 35:21 , Psa 35:25 , en Psa 40:16 ; Eze 36:2 ."},{"catchword":"der vorsten","tekst":"Versta het geroep en gebaar der oversten, waarmede zij elkander in den strijd, om schrik te maken, bejegenen en aanvallen."}],"29":[{"catchword":"Vliegt","tekst":"Anders, verpluimt de sperwer; dat is, verandert hij van vederen? Anders, gebruikt de sperwer vederen? dat is, vliegt hij?"},{"catchword":"Verstand,","tekst":"Dat is, voorzienigheid, zorg en bestuur."},{"catchword":"naar het zuiden?","tekst":"Om de koude des winters te ontvlieden, en door de warmte der zon [zo enigen menen] te verpluimen."}],"30":[{"catchword":"uw bevel,","tekst":"Hebreeuws, uw mond; dat is, bevel, gebod. Zie Gen 41:40 ."}],"31":[{"catchword":"scherpte","tekst":"Hebreeuws, op den tand. Zo noemen de Hebreën de uitstekende hoogten der steenrotsen, die niet beklimbaar zijn. Zie 1Sa 14:4 ."}],"32":[{"catchword":"zien","tekst":"Van de naturonderzoekers wordt den arend onder het gedierte een zeer scherp en sterk gezicht toegeschreven, waardoor hij van verre en wijduit zijn aas kan bespeuren."},{"catchword":"par van verre af","tekst":"Het Hebreeuwse woord betekent niet alleen van verre, maar ook tot in vergelegen plaatsen."}],"33":[{"catchword":"bloed;","tekst":"Te weten, uit de dode lichamen der mensen en der beesten, die de ouden voor hen bejagen, en bij stukken, of geheel, naardat zij die dragen kunnen, in het nest brengen."},{"catchword":"waar verslagenen zijn,","tekst":"De Heere Christus, in de plaatsen recht tevoren aan den kant getekend, ziet op deze woorden om te tonen dat de kinderen Gods door de verlichting en roering zijns Geestes, tot Hem, die door zijn dood het waarachtig en enig voedsel hunner zielen geworden is, van alle plaatsen vergaderen, gelijk de arenden door hun klaar gezicht en scherpen reuk tot de dode lichamen om hun voedsel toevlieGen."}],"34":[{"catchword":"de HEERE","tekst":"Te weten, nadat Hij, wat gezwegen hebbende, Job tijd gegeven had om daar intussen te spreken, en zich te verantwoorden; maar dewijl hij zweeg, is God voortgevaren. Zo is het woord antwoorden hier genomen voor het spreken van opnieuw aanvangen, of in de voorgaande rede voortgaan; zie Jdg 18:14 ."}],"35":[{"catchword":"onderrichten?","tekst":"Dat is, wijsheid leren en overtuigen dat hij ongelijk heeft."},{"catchword":"bestraft,","tekst":"Dat is, die zijn oordelen wil tegenspreken en berispen."}],"37":[{"catchword":"ik ben","tekst":"Vergelijk Gen 32:10 , en de aantekening."},{"catchword":"leg mijn hand","tekst":"Dat is, ik zwijg stil. Zie boven, Job 21:5 ."}],"38":[{"catchword":"Eenmaal","tekst":"Hebreeuws, een; te weten, maal. Zie 2Ch 9:21."},{"catchword":"tweemaal","tekst":"Een zeker getal voor een onzeker. Anders aldus: Eenmaal heb ik gesproken, en zal niet antwoorden, doch de tweede maal zal ik niet voortvaren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(39:1) Wilt thou hunt the prey for the old Lion? [viz. For him that hath but little strength left, to recover some prey for his sustenance. The meaning is, that the same is prepared for him by Gods providence, and not by the care or labour of man, Psa 104:21. for otherwise he might starve and perish, above 4.11.] or fill the greediness of the young Lion? [viz. When they are forsaken or forgotten by the old ones, Compare Psa 147:9. Heb. Fill the life etc. Whereby is to be understood the greedy desire and fiery appetite, which the young Lions have to their prey and food. The Hebrew word Chajah. Is sometimes of the same signification with the word Nephesh, soul, as may be seen, above chap.33.v.18.20,22. And Nephesh is sometimes as much as, and standeth for a desire or longing appetite for somewhat, as Psal.27.12. and 107.9. Pro 23:2. Isa 56:11. Oth. Fully supply the young Lions their food or sustenance."}],"2":[{"catchword":null,"tekst":"(39:2) When they bow down in the holes, (and sit in the den, [Heb. Hutt, or tent, i.e. hiding-place, cave or den] to lurk, [i.e. to spy out some beast or other, which they may take and tear and devour. Oth. In the lurking-place: viz. Out of which they do lurk. So above chap.37.8.]"}],"3":[{"catchword":null,"tekst":"(39:3) Who prepareth the Raven her meat. [The Hebrew word doth properly signify such meat or food as is gotten by hunting. See Gen 27:3. and the annot.] when they cry in their nests for food; which is called a crying to God, because God taketh care to provide food for the young Ravens. They write that, having at first while down on them, they are forsaken by the old ones, till they grow black; and in the mean while wonderfully fed by Gods providence, by certain small worms, which grow in their own nests, out of their dung. Compare Psa 147:9.] (when) they stray, [viz. About the nest forsaken by the dam] because there is no meat.]"}],"4":[{"catchword":null,"tekst":"(4) Knowest thou the time of the bringing forth of the Rock Goats: [Understand hereby the whole work and disposition of the engendering, propagation, breeding and bringing up of the wild beasts in general, which must solely be ascribed to Gods providence, and not any care of man. Of the sort of Goats here specified. See 1 Sam.21.on v.3.] hast thou taken notice of the travel of the hinds, [i.e. of the time when they use to be in labour, that thou mightiest afford them some help and assistance, when they are in danger and pain.]"}],"5":[{"catchword":null,"tekst":"(5) Canst thou number the Months which they fill up, art thou able to calculate the minute of time wherein they conceive, and thereby know how long they are to go ere they bring forth their young ones. All these questions do strongly deny.]"}],"6":[{"catchword":null,"tekst":"(6) When they know how themselves [to ease their travel in bringing forth their young] bring forth their young ones with splitting, cast forth their pains, [understand the pains of travel, which are very great in these beasts, and in which they are only helped and assisted by Gods providence. See Ps.29.9.]"}],"7":[{"catchword":null,"tekst":"(7) Their young (ones) [ Heb. Sons, see Lev.1.on v.14.] grow lively [i.e. recover strength, and vigour, though by reason of their difficult coming forth, they were at first very weak and tender] became great, by the corn, [the word Bar in the original tongue doth signicorn or wheat, which these kind of beasts love much to feed upon; But in the syriake, it signifieth ground or a field; as also doth the Chaldaick word Bara, Dan.2.38. and 4.12. which maketh some to render it likewise thus in this place] they go forth, and return not again to the same, [viz. To their dams that had cast, or brought them forth.]"}],"8":[{"catchword":null,"tekst":"(8) Who hath sent the wild ass free away, and who hath loosened the bonds of the wild ass? [The meaning is, that the untameable and unbridled nature of the wild ass proceedeth only from Gods providence and disposing; the reason whereof man being not able to comprehend, how much less can he search and dive into other more deep and incomprehensible works of God.]"}],"9":[{"catchword":null,"tekst":"(9) To whom I have appointed the desert for his house place [Oth. The plain field, etc. Whereby must be understood such, as lieth wild and wast indeed; but yet doth yield some fodder here and there growing out of the ground, though wild and rank, which relisheth well unto those savage Creatures.] and the brackish (ground) for his habitations [i.e. the dry: barren and uncultivated country. See Jud.9.on v.35. and Psal.107.34.]"}],"10":[{"catchword":null,"tekst":"(10) He laughteth at the stir of the City, [i.e. he doth not care for multitudes of people, and the affairs and businesses of men, loving rather to live in the desert: or also, that he doth not fear, or is not frighted by the force, which many men might be ready to distress and borrowed speech from the manner of men, as below v.21,25,28. And chap.40.22,23. And 41.18,20.] be doth not hear the various clamour of the driver, [i.e. all those calls, cries and noises, which are used by them, that do urge and instigate, either men or beasts to their labour and working.]"}],"11":[{"catchword":null,"tekst":"(11) That (which) he spieth out upon the hills, is his pasture: [Heb. The spying out, or the spied out (exploratum) i.e. that which he is continually seeking for upon the hills as grass and other green things, that is it he feedeth upon.] and he seeketh after all manner of green (things) [i.e. green herbs or bows such as grow in with places."}],"12":[{"catchword":null,"tekst":"(12) Shall the Unicorn be willing to serve thee: shall he lodge at thy crib? [Understand no, not at all; and that by reason of his undaunted and untameable strength and vigour. See Numb.23.on v.22.]"}],"13":[{"catchword":null,"tekst":"(13) Shalt thou bind the Unicorn with a roap [viz. Whereby he might be tied fast to the Plough to draw the same] unto the furrows, [unto the raised ground, or ridges, that is upon the ploughed land, between two furrows, see above chap.31.on v.38. Yet here is to be understood the plough-work and drawing of it, whereby the furrows are made, in which regard the translation may run thus; bind the Unicorn with his rope to ploughing, i.e. for to plough] shall he harrow thee, the low grounds? [or depths, valleys, bottoms. Some do here understand again the furrows.]"}],"14":[{"catchword":null,"tekst":"(14) Shalt thou confide in him, [i.e. he sure, that he shall do thy work i the field, as well as those other tame beasts, which are employed by men in their field service] because his force is great? And shalt thou leave thy labour, [i.e. the fruits which thou hast gotten by thy labour. Compare above 20.v.18.] upon him? [viz. To carry or draw them home unto thy barns? See the next verse.]"}],"15":[{"catchword":null,"tekst":"(15) Shalt thou believe him, that he shall bring thy seed again, and gather (it to) thy threshing-floor, [i.e. that he shall make thee enjoy thy wished for fruits? Which must be brought to pass by ploughing and harrowing, or with carrying the fruits into the barn.]"}],"16":[{"catchword":null,"tekst":"(16) Are the delightful wings of the Peacock [viz. Wherewith they delight and lift up themselves, or which men also take pleasure and delight and lift up themselves, or which men also take pleasure and delight in?] (from thee) or the feathers of the Stork. [See Lev.11.on v.19. Oth. Or the wings, and feathers of the stork. Or the wings of the Ostrich, and his Feathers, or plumes?] and of the Ostrich? [The Hebrew word Notsah doth signify indeed a plume; but the interpectors gathered out of the next following verses, that here is meant by this word the Ostrich, a fowl singularly well furnished with plumes; that which followeth can neither can neither be applied to the Peacock, nor to the Stork.]"}],"17":[{"catchword":null,"tekst":"(17) That she [viz. The Ostrich] leaveth her eggs in the earth, and warmeth them in the dust, [i.e. in the sand, viz. By letting the sun to shine upon them, that by the warmeth thereof the eggs may be hatched. For they write, that this fowl is very unkind, without any natural affection to her eggs, abandoning the same, and leaving the care to the warmeth of the Sun, without sitting over them.]"}],"18":[{"catchword":null,"tekst":"(18) And forgetteth that the foot can press them [Heb. , i.e. every one of those eggs and so in the other member of the verse] and the beasts of the field can trample them."}],"19":[{"catchword":null,"tekst":"(19) She hardeneth her self against her young ones, [or her eggs, out of which her young ones are hatched in manner as was said in the former v. She dealeth very hard with them, against the nature of other birds, and that for the reason alledged before, of not hatching of her own eggs.] as if they were none of hers: her labour is in vain; [viz. That of laying her eggs, if God took not more care of the same then she doth her self.] (because) she is without fear. [viz. Of loosing her eggs, and of not getting young ones by them.]"}],"20":[{"catchword":null,"tekst":"(20) For God hath deprived her of wisdom, [Heb. Hath made her forget the wisdom, i.e. given her no wisdom, or deprived her of it. Understand by the same, the natural inclination or instinct, which God hath infused into the rest of the Beasts, whereby they are given and know how to preserve, provide for and recover themselves out of danger.] and hath imparted to her nothing of understanding."}],"21":[{"catchword":null,"tekst":"(21) When it is time, [viz. When she is pursued by the hunter] she lifteth up her self on high; [viz. Some what above the ground, better to speed her running, and so escape the arrows and shootings; for by reason of the great bulk and weight of her body she is not able to lift up her self very high above the ground.] she laugheth at the horse and his rider. [i.e. she contemneth them since she is able by the readiness and nimbleness of running to get out of their reach. This is said of them according to the manner of men. See above on v.10.]"}],"22":[{"catchword":null,"tekst":"(22) Canst thou give strength to the horse? Canst thou cloth his neck with thunder? [Understand hereby the neighing of the horse, together with his stirs and boisterousness; comp. Jer 8:6.]"}],"23":[{"catchword":null,"tekst":"(23) Canst thou trouble it, like a Grasshopper? [i.e. s men are wont to fright and chase away the silly Grasshoppers.] the pride of his snuffing is a terrifying. [i.e. a cause to make one afraid.]"}],"24":[{"catchword":null,"tekst":"(24) It diggeth into the ground, [The Hebrew word indeed doth commonly signify a valley, but it is taken for all manner of depths and bottoms; or how, hollow places, as above v.13. for the lowness of ground, or, the furrows, Pro 9:18. for the depth of the grave; and here for the hole, that is made into the ground, by the stamping of a stout horse.] and it is joyful in its strength: and draweth forth to meet the armed (man). [or armed, Hebr. Arms, or weapon.]"}],"25":[{"catchword":null,"tekst":"(25) It laugheth at fear, [i.e. It contemneth those things, which use to make men afraid; as all manner of arms, weapons, and other furniture of War. Fear, for that which is to be feared. So Pro 1:26, & 10.v.24. Isa 66:4.] and is not dismayed, and returneth not because of the sword. [Heb. From the face of the sword.]"}],"26":[{"catchword":null,"tekst":"(26) The quiver [viz. Of The armed man that rideth it] doth rattle against him; the flaming iron of the spear and of the lance; [Heb. The flame; but this word is likewise taken by way of comparison for the bright-shining iron of a Spear, Lance or Sword. See Gen 3:24. 1 Sam.17.7. Nah.3.3.]"}],"27":[{"catchword":null,"tekst":"(27) With shaking and commotion doth it swallow up the earth, [i.e. doth run over it with that swiftness, and nimbleness; that it seemeth to swallow up all the way, making him that sitteth upon it, to loose the ground before him out of his sight, no otherwise, than if it were swallowed and gulfed up under him. Oth. Suppeth in; The dust namely, which it raiseth with its feet; or halloweth out.] and believeth not that it is the sound of the trumpet. [The meaning is; That the stout horses, do so run up and down in the battle, with that celerity, courage, and fiery eagerness to come to the battle or fight and medley, that they heed nothing, no not the shrill sound of the Trumpet; Or, they are so frolic when they hear the sound of the Trumpet, that in a manner, they can hardly believe it. Oth. Doth not hold it self firm, when the sound of the Trumpet goeth, Heb. The voice of the Trumpet.]"}],"28":[{"catchword":null,"tekst":"(28) In the full resounding of the Trumpet, [Heb. In the sufficiency of the Trumpet, i.e. when the Trumpet sounds most shrill, clear, and full. Or, under the Trumpet.] it saith, Heaha: [This is a word or interjection, signifying, or expressing a sound of joyfulness or jollity; and sometime, of great courage and alacrity, in setting upon and daring the Enemy. Compare Psal.35.ver.21,25. And 40.16. Eze 36:2.] and smelleth the war afar off, the thunder of the Princes, [understand the clamour noise and stir of the Commanders, wherewith they seek to daunt their enemy, at the joining of battle, and commencing the fight.] and the shouting."}],"29":[{"catchword":null,"tekst":"(29) Doth the Hawk fly [Oth. Plummet the Hawk, i.e. Doth she change her Feathers? Oth. Doth the Hawk use Feathers? i.e. Doth she fly?] by thine understanding. [i.e. by thy disposing, care and government?] (and) doth she spread forth her wings toward the south? [viz. For to shun the cold of winter, and by means of the warm sun, (as some conceive) to change her feathers.]"}],"30":[{"catchword":null,"tekst":"(30) Is it at thy command [Heb. Mouth, i.e. command, change, see Gen.41.on verse 40.] that the Eagle doth mount aloft, and that he maketh his nest in the height?"}],"31":[{"catchword":null,"tekst":"(31)"},{"catchword":null,"tekst":"He dwelleth and lodgeth in the stony rock, on the sharpness of the stony rock, [Heb. Upon the tooth. So the Hebrews call the most eminent heights of the rocks, being unapproachable. See 1Sa 14:4.] and of the strong place."}],"32":[{"catchword":null,"tekst":"(32) From thence he spieth out the meat: his eyes see afar of. [The Naturalists ascribe unto the Eagle a most sharp, strong, and quick sight among the brutes; whereby he is able to spy his prey at a great distance, or afar off; and unto far distant places, as the Hebrew word implieth.]"}],"33":[{"catchword":null,"tekst":"(33) His young ones also sup up blood, [viz. Out of the dead bodies of men, and of beasts, which the old ones prey for them, and bring unto the nest, either pierce meal, or entire, as they are able to carry it along] and where slain (ones) are, there he is. [Our Saviour Christ reflecteth upon this place, Matth. 24.28. Luk 17:37. to shew, that the children of God, through the enlightening and moving of his spirit, are gathering unto him, (who by his death and being slain, is become the true and onely food of their souls) from all parts and places, even as the Eagles by the directive help of their clear sight and exquisite scenting, do fly unto, and gather about the dead carcases, for their food and nourishment.]"}],"34":[{"catchword":null,"tekst":"(39:34) And the LORD answereth Job, [viz. After he had paused a while, and given Job space to speak between and say, what he could for his own defence; But seeing Job was mute, God went // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
