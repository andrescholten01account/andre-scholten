 meer rechtvaardigde dan God.","3":"Zijn toorn ontstak ook tegen zijn drie vrienden, omdat zij geen antwoord vonden en Job toch veroordeelden.","4":"Doch Elihu had gewacht op Job in het spreken, omdat zij ouder van dagen waren dan hij.","5":"Toen Elihu dan zag dat er geen antwoord was in de mond van die drie mannen, ontstak zijn toorn.","6":"Hierom antwoordde Elihu, de zoon van Baracheël, de Buziet, en zei: Ik ben jong van dagen, maar u bent stokoude; daarom heb ik geschroomd en gevreesd, u mijn mening te tonen.","7":"Ik zei: Laat de dagen spreken, en de veelheid van jaren wijsheid te kennen geven.","8":"Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.","9":"De groten zijn niet altijd wijs, en de ouden verstaan het recht *niet*.","10":"Daarom zeg ik: Luister naar mij; ik zal mijn mening ook tonen.","11":"Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.","12":"Toen ik nu goed op u gelet heb, ziet, er is niemand die Job overtuigde, die op zijn redenen antwoordde;","13":"Opdat u niet zegt: Wij hebben de wijsheid gevonden; God heeft hem neergestoten, geen mens.","14":"Nu heeft hij tegen mij geen woorden gericht, en met uw woorden zal ik hem niet beantwoorden.","15":"Zij zijn ontzet, zij antwoorden niet meer; zij hebben geen woorden meer.","16":"Ik heb dan gewacht, maar zij spreken niet; want zij staan stil; zij antwoorden niet meer.","17":"Ik zal mijn deel ook antwoorden, ik zal mijn mening ook tonen.","18":"Want ik ben vol woorden; de geest in mijn binnenste benauwt mij.","19":"Zie, mijn binnenste is als wijn die niet geopend is; als nieuwe lederen zakken zou het bersten.","20":"Ik zal spreken, opdat ik voor mij lucht krijg; ik zal mijn lippen openen, en zal antwoorden.","21":"Och, dat ik niemands aanzien aanneem, en tegen de mens geen bijnamen gebruik!","22":"Want ik weet geen bijnamen te gebruiken; anders zou mijn Maker mij binnenkort wegnemen."},"SV":{"1":"Toen hielden de drie mannen op van Job te antwoorden, dewijl hij in zijn ogen rechtvaardig was.","2":"Zo ontstak de toorn van Elihu, den zoon van Baracheël, den Buziet, van het geslacht van Ram; tegen Job werd zijn toorn ontstoken, omdat hij zijn ziel meer rechtvaardigde dan God.","3":"Zijn toorn ontstak ook tegen zijn drie vrienden, omdat zij, geen antwoord vindende, nochtans Job verdoemden.","4":"Doch Elihu had gewacht op Job in het spreken, omdat zij ouder van dagen waren dan hij.","5":"Als dan Elihu zag, dat er geen antwoord was in den mond van die drie mannen, ontstak zijn toorn.","6":"Hierom antwoordde Elihu, de zoon van Baracheël, den Buziet, en zeide: Ik ben minder van dagen, maar gijlieden zijt stokouden; daarom heb ik geschroomd en gevreesd, ulieden mijn gevoelen te vertonen.","7":"Ik zeide: Laat de dagen spreken, en de veelheid der jaren wijsheid te kennen geven.","8":"Zekerlijk de geest, die in den mens is, en de inblazing des Almachtigen, maakt henlieden verstandig.","9":"De groten zijn niet wijs, en de ouden verstaan het recht *niet*.","10":"Daarom zeg ik: Hoor naar mij; ik zal mijn gevoelen ook vertonen.","11":"Ziet, ik heb gewacht op ulieder woorden; ik heb het oor gewend tot ulieder aanmerkingen, totdat gij redenen uitgezocht hadt.","12":"Als ik nu acht op u gegeven heb, ziet, er is niemand, die Job overreedde, die uit ulieden zijn redenen beantwoordde;","13":"Opdat gij niet zegt: Wij hebben de wijsheid gevonden; God heeft hem nedergestoten, geen mens.","14":"Nu heeft hij tegen mij geen woorden gericht, en met ulieder woorden zal ik hem niet beantwoorden.","15":"Zij zijn ontzet, zij antwoorden niet meer; zij hebben de woorden van zich verzet.","16":"Ik heb dan gewacht, maar zij spreken niet; want zij staan stil; zij antwoorden niet meer.","17":"Ik zal mijn deel ook antwoorden, ik zal mijn gevoelen ook vertonen.","18":"Want ik ben der woorden vol; de geest mijns buiks benauwt mij.","19":"Ziet, mijn buik is als de wijn, *die* niet geopend is; gelijk nieuwe lederen zakken zou hij bersten.","20":"Ik zal spreken, opdat ik voor mij lucht krijge; ik zal mijn lippen openen, en zal antwoorden.","21":"Och, dat ik niemands aangezicht aanneme, en tot den mens geen bijnamen gebruike!","22":"Want ik weet geen bijnamen te gebruiken; in kort zou mijn Maker mij wegnemen."},"KJV":{"1":"So these three men ceased to answer Job, because he *was* righteous in his own eyes.","2":"Then was kindled the wrath of Elihu the son of Barachel the Buzite, of the kindred of Ram: against Job was his wrath kindled, because he justified himself rather than God.","3":"Also against his three friends was his wrath kindled, because they had found no answer, and *yet* had condemned Job.","4":"Now Elihu had waited till Job had spoken, because they *were* elder","5":"When Elihu saw that *there was* no answer in the mouth of *these* three men, then his wrath was kindled.","6":"And Elihu the son of Barachel the Buzite answered and said, I *am* young, and ye *are* very old; wherefore I was afraid, and durst not shew you mine opinion.","7":"I said, Days should speak, and multitude of years should teach wisdom.","8":"But *there is* a spirit in man: and the inspiration of the Almighty giveth them understanding.","9":"Great men are not *always* wise: neither do the aged understand judgment.","10":"Therefore I said, Hearken to me; I also will shew mine opinion.","11":"Behold, I waited for your words; I gave ear to your reasons, whilst ye searched out what to say.","12":"Yea, I attended unto you, and, behold, *there was* none of you that convinced Job, *or* that answered his words:","13":"Lest ye should say, We have found out wisdom: God thrusteth him down, not man.","14":"Now he hath not directed *his* words against me: neither will I answer him with your speeches.","15":"They were amazed, they answered no more: they left off speaking.","16":"When I had waited, (for they spake not, but stood still, *and* answered","17":"*I said*, I will answer also my part, I also will shew mine opinion.","18":"For I am full of matter, the spirit within me constraineth","19":"Behold, my belly *is* as wine *which* hath no vent; it is ready to burst like new bottles.","20":"I will speak, that I may be refreshed: I will open my lips and answer.","21":"Let me not, I pray you, accept any man's person, neither let me give flattering titles unto man.","22":"For I know not to give flattering titles; *in so doing* my maker would soon take me away."}},"tsk":{"1":[{"kopje":"rechtvaardig","refs":["Job 6:29","Job 10:2","Job 10:7","Job 13:15","Job 23:7","Job 27:4-6","Job 29:11-17","Job 31:1-40","Job 33:9"]}],"2":[{"kopje":"ontstak","refs":["Ps 69:10","Mark 3:5","Ef 4:26"]},{"kopje":"Buziet","refs":["Gen 22:21"]},{"kopje":"omdat","refs":["Job 10:3","Job 27:2","Job 34:5","Job 34:6","Job 34:17","Job 34:18","Job 35:2","Job 40:3","Luk 10:29"]}],"3":[{"kopje":"omdat","refs":["Job 32:1","Job 24:25","Job 25:2-6","Job 26:2-4"]},{"kopje":"toch","refs":["Job 8:6","Job 15:34","Job 22:5-30","Hand 24:5","Hand 24:13"]}],"4":[{"kopje":"had gewacht op Job in het spreken","refs":["Job 32:11","Job 32:12","Spr 18:13"]}],"5":[{"kopje":"zijn toorn","refs":["Job 32:2","Ex 32:19"]}],"6":[{"kopje":"ben jong","refs":["Lev 19:32","Rom 13:7","1 Tim 5:1","Tit 2:6","1 Petr 5:5"]},{"kopje":"u bent stokoude","refs":["Job 15:10"]},{"kopje":"geschroomd","refs":["Job 15:7","1 Sam 17:28-30"]}],"8":[{"kopje":"de inblazing","refs":["Job 4:12-21","Job 33:16","Job 35:11","Job 38:36","Gen 41:39","1 Kon 3:12","1 Kon 3:28","1 Kon 4:29","Spr 2:6","Pred 2:26","Dan 1:17","Dan 2:21","1 Kor 2:10-12","1 Kor 12:8","2 Tim 3:16","Jak 1:5"]}],"9":[{"kopje":"groten","refs":["Jer 5:5","Matt 11:25","Joh 7:48","1 Kor 1:26","1 Kor 1:27","1 Kor 2:7","1 Kor 2:8","Jak 2:6","Jak 2:7"]},{"kopje":"niet","refs":["Job 12:20","Pred 4:13"]}],"11":[{"kopje":"ik heb gewacht op","refs":["Job 32:4","Job 29:21","Job 29:23"]},{"kopje":"totdat","refs":["Job 5:27","Spr 18:17","Spr 28:11","Pred 12:9","Pred 12:10"]}],"12":[{"kopje":" l wl-kjv\" data-code=\"H7725\">answer</span> him with your speeches.","15":"They were <span class=\"wl wl-kjv\" data-code=\"H2865\">amazed,</span> they <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> no more: they left <span class=\"wl wl-kjv\" data-code=\"H6275\">off</span> speaking.","16":"When I had <span class=\"wl wl-kjv\" data-code=\"H3176\">waited,</span> (for they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> not, but stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still,</span> and answered","17":"I said, I will <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> also my <span class=\"wl wl-kjv\" data-code=\"H2506\">part,</span> I also will <span class=\"wl wl-kjv\" data-code=\"H2331\">shew</span> mine opinion.","18":"For I am <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H4405\">matter,</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H990\">within</span> me constraineth","19":"Behold, my <span class=\"wl wl-kjv\" data-code=\"H990\">belly</span> is as <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> which hath no <span class=\"wl wl-kjv\" data-code=\"H6605\">vent;</span> it is ready to <span class=\"wl wl-kjv\" data-code=\"H1234\">burst</span> like <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> bottles.","20":"I will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> that I may be <span class=\"wl wl-kjv\" data-code=\"H7304\">refreshed:</span> I will <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> my <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> and answer.","21":"Let me not, I pray you, <span class=\"wl wl-kjv\" data-code=\"H5375\">accept</span> any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">person,</span> neither let me give flattering <span class=\"wl wl-kjv\" data-code=\"H3655\">titles</span> unto man.","22":"For I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not to give flattering <span class=\"wl wl-kjv\" data-code=\"H3655\">titles;</span> in so doing my <span class=\"wl wl-kjv\" data-code=\"H6213\">maker</span> would <span class=\"wl wl-kjv\" data-code=\"H4592\">soon</span> take me away."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"drie mannen op","tekst":"Namelijk, Elifaz, Bildad en Zofar."},{"catchword":"in zijn ogen","tekst":"Dat is, in zijn eigen oordeel; zie boven, Job 18:3 . Zo gevoelen de drie mannen van Job, te weten, dat hij zichzelven voor rechtvaardig hield; gelijk zij daarentegen ook geen stof vonden om te bewijzen dat Job onrechtvaardig , dat is een goddeloos mens en huichelaar was; want dat hij nevens anderen mede een zondaar was, had hij vrijuit bekend; boven, Job 14:4 ."}],"2":[{"catchword":"ontstak de toorn","tekst":"Namelijk tegen Job en zijn drie vrienden. Vergelijk de manier van spreken met Gen 4:5 , en Gen 39:19 ."},{"catchword":"Buziet,","tekst":"Dat is, een der nakomelingen van Buz, den zoon van Nahor, den broeder van Abraham. Zie Gen 22:21 . Sommigen houden hem voor Bileam, waarvan zie Num 22:5 ."},{"catchword":"Ram;","tekst":"Van dezen naam is verscheiden gevoelen. Vele menen dat Ram een bekorting des naams is voor Aram, den naam van een Syriër, van welken een huisgezin of geslacht der Syriërs, uit welke Elihu was, toegenaamd is. Anderen verstaan hier Ram, den vader van Aminadab, 1Ch 2:9-10 , die ook Aram genaamd wordt, Mat 1:4 . Sommigen ook Abram, Gen 11:27 , die daarna Abraham genoemd werd; Gen 17:5 ."},{"catchword":"ziel","tekst":"Dat is, zichzelven. Zie 1Ki 19:4 ."},{"catchword":"meer rechtvaardigde dan God","tekst":"Dat had Job niet uitdrukkelijk gezegd, maar Elihu besloot dit hieruit, omdat Job met God gelijk in proces wilde treden, en meer bezig was met zijn oprechtheid te verdedigen dan Gods wijsheid en gerechtigheid de eer te geven."}],"3":[{"catchword":"geen antwoord vindende,","tekst":"Te weten, om Job te wederleggen en te overtuigen."},{"catchword":"verdoemden","tekst":"Te weten, van huichelarij en goddeloosheid."}],"4":[{"catchword":"op Job","tekst":"En zijn vrienden."},{"catchword":"in het spreken,","tekst":"Hebreeuws, in de woorden; te weten om te vernemen of zij nog meer met elkander spreken zouden, of wanneer zij hun woorden eindigen zouden. De vrienden hadden ze geëindigd, Job 26 , en Job de zijne met het einde van Job 31 . Anders, Elihu had met Job gewacht op [hun] woorden; te weten, der drie vrienden."},{"catchword":"omdat zij","tekst":"Namelijk, Job en zijn drie vrienden."}],"6":[{"catchword":"minder van dagen,","tekst":"Dat is, jonger van jaren. Zie boven, Job 30:1 , en de aantekening."}],"7":[{"catchword":"Ik zeide","tekst":"Te weten, bij mijzelven; dat is, ik dacht. Zie Gen 20:11 ."},{"catchword":"de dagen spreken,","tekst":"Dat is, die bedaagd zijn; alzo in het volgende, veelheid der jaren voor degenen, die veel jaren hebben."}],"8":[{"catchword":"de geest,","tekst":"Versta, den Geest Gods, gelijk uit de volgende woorden kan verstaan worden. De zin is, dat de wijsheid eigenlijk alleen is oorspronkelijk van God, niet van de oudheid der jaren, die menigmaal feilt. Anders, zekelijk is de geest, dat is de redelijke en verstandige ziel, in den mens, maar de adem, enz.; dat is, de rechte wijsheid komt alleen van de verlichting Gods."},{"catchword":"maakt henlieden","tekst":"Te weten, de mensen. Het is een verandering des getals; want hij had recht tevoren in vs.8 in het enkelvoudig getal gesproken. Zie boven, Job 24:18 ."}],"9":[{"catchword":"groten","tekst":"Dat is, de oude van jaren; zie boven, Job 30:1 . De zin is, dat deze niet altijd wijs zijn, en niet eigenlijk noch voornamelijk door de oudheid."}],"10":[{"catchword":"Hoor naar mij;","tekst":"Hij spreekt Job toe ."},{"catchword":"ik zal","tekst":"Te weten, die jonger ben van jaren."}],"11":[{"catchword":"op ulieder woorden;","tekst":"Hij spreekt de drie vrienden van Job toe ."},{"catchword":"tot ulieder","tekst":"Dat is, zo naarstiglijk en aandachtiglijk, dat ik geraakt ben tot in het begrip van al uw voorgestelde bedenkingen."},{"catchword":"redenen","tekst":"Te weten, waarmede gij Job zoudt mogen overtuigen."}],"13":[{"catchword":"Opdat gij","tekst":"Sommigen vullen den zin der woorden aan met: Ik zeg dit, opdat gij niet zegt."},{"catchword":"de wijsheid","tekst":"Te weten, waarmede Job van ons overtuigd en beantwoord is. Deze wijsheid nu zou zijn dat God hem zijn lijden toegezonden had en niet een mens, en dewijl God rechtvaardig is en niemand ongelijk doet, voornamelijk als Hij zo vreeslijk straft, dat Job een goddeloos mens moet zijn."},{"catchword":"geen mens","tekst":"Hebreeuws, niet een man."}],"14":[{"catchword":"hij tegen mij","tekst":"Namelijk Job."},{"catchword":"ulieder woorden","tekst":"Namelijk, gij Elifaz, Bildad en Zofar."}],"15":[{"catchword":"Zij zijn ontzet,","tekst":"Te weten, de drie vrienden van Job. Het schijnt dat hij, dit zeggende, zich gekeerd heeft tot de omstanders en toehoorders."},{"catchword":"niet meer;","tekst":"Te weten, op de redenen van Job."},{"catchword":"verzet","tekst":"Dat is, afgeweerd en anderen overgelaten."}],"16":[{"catchword":"gewacht,","tekst":"Te weten, op de antwoorden der drie vrienden van Job."}],"17":[{"catchword":"ook vertonen","tekst":"Alzo boven, vs.10."}],"18":[{"catchword":"de geest","tekst":"Versta, den ijver en goede genegenheid, die Elihu tot dezen handel had. Zie 2Ki 19:7 ."},{"catchword":"buiks","tekst":"Dat is, van het innerste gemoed. Zie boven, Job 15:2 . Alzo in vs.19."}],"19":[{"catchword":"mijn buik","tekst":"Versta dat het binnenste zijns gemoeds niet zonder schade zou zijn, indien hij verzweeg hetgeen hij over dezen handel bedacht had; gelijk de vaten scheuren en barsten, die, van nieuwen en sterken wijn vol zijnde, geen lucht hebben."},{"catchword":"lederen zakken","tekst":"Het Hebreeuwse woord betekent hier lederen zakken, waar men hier in voortijden den wijn in deed. Vergelijk Mat 9:17 ."}],"20":[{"catchword":"voor mij","tekst":"Dat is, verlichting krijge van de bedenking en bekommernis, komende uit mijn voorgaand aanhoren en stilzwijgen."}],"21":[{"catchword":"niemands aangezicht","tekst":"Zie Lev 19:15 ."},{"catchword":"geen bijnamen","tekst":"Te weten, noch ten goede om hem te vereren met pluimstrijken, noch ten kwade om hem te versmaden met bittere vermaningen."}],"22":[{"catchword":"zou mijn","tekst":"Te weten, indien ik zulks deed."},{"catchword":"Maker","tekst":"Dat is, God, die mij gemaakt en geschapen heeft. Zie boven, Job 4:17 ."},{"catchword":"wegnemen","tekst":"Dat is, doden en verderven."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then the three men ceased [viz. Eliphaz, Bildad, and Zophar] from answering Job: because he was righteous in his eyes. [i.e. in his own judgement. See above 18.on v.3. So the three men conceived of Job, viz. That he held himself a righteous man; being not able neither to find out matter for proving the contrary, viz. That Job was unrighteous, i.e. a wicked wretch and hypocrite, for that he was a sinner, together with others, himself had freely yielded and confessed, above 14.4.]"}],"2":[{"catchword":null,"tekst":"Then was kindled the anger of Elihu [viz. Against Job and his three friends. Compare the phrase with Gen.45. and 39.19.] the son of Baracheel the Buzite, [i.e. one of the posterity of Buz, the son of Nahor the brother of Abraham, see Gen 22:21. Some hold him for Bileam, of whom see Num 22:5.] of the family of Ram. [about this name opinions vary, many conceive that Ram is put by abbreviation for Aram, the name of a Syrian of whom a certain family or generation of the Syrians, of which Elihu was, bore the surname. Others understand by Ram the father of Aminidab, 1 Chron.2.9,10. Who is likewise called Aram, Mat 1:4. Some Abram himself, so called first, Gen 11:27. and after Abraham, Gen 17:5.] against Job his anger was kindled, because he justified his soul [i.e. himself. See 1 Kings 19.on v.4.] more then God. [Job never said so in any express terms, but Elihu inferred thence, that Job would fain enter the bars of Judgement with God, and was more busy to maintain his uprightness, then to give glory to Gods wisdom and righteousness.]"}],"3":[{"catchword":null,"tekst":"His anger kindled also against his three friends, because finding no answer, [viz. For to argue further against, and to convince Job] they nevertheless condemned Job. [viz. Of hypocrisy and wickedness.]"}],"4":[{"catchword":null,"tekst":"Yet Elihu had waited on Job [And his friends] in speaking; [Heb. In the words, viz. To see whether they would go in their discourse, or debate; or when they would make an end of their words. The friends had ended theirs above chap.26. and Job his with the end of the former chapter. Oth. Elihu had waited with Job upon (their) words, i.e. upon the prosecution of his friends] were elder of days then be."}],"5":[{"catchword":null,"tekst":"When Elihu saw then, that there was no answer in the mouth of those three men his anger was kindled."}],"6":[{"catchword":null,"tekst":"Therefore answered Elihu the son of Baracheel the Buzite, and said, I am less of days, [i.e. a man of younger years. See ab.30.1. and the annot.] but ye are very aged, therefore I stood in aw, and was afraid to shew you my opinion."}],"7":[{"catchword":null,"tekst":"I said, [viz. By my self, i.e. I thought; See Gen.20, on v.11.] let the days speak, [i.e. those that are well stricken in days or years; and so in the words following, multitude of years, for those that have lived many years.] and the multitude of years make wisdom known.]"}],"8":[{"catchword":null,"tekst":"Surely the spirit of God, as may be gathered by the words following. The meaning is, that wisdom properly and solely had its original from God, and not from age, or the multitude of years, which often fail. Oth. Surely is the spirit, i.e. the reasonable and understanding soul, in man, but the breath, etc. i.e. the true wisdom proceedeth onely from Gods illumination.] and the inspiration of the Almighty maketh them understanding [them, viz. Men, a permutation of the number, for he had spoken just now in the singular. See above 24.on ver.18.]"}],"9":[{"catchword":null,"tekst":"The great (ones) are not wise, [great i.e. great in years. See above 30.on v.1. The meaning is, that such are not always wise, and not properly nor principally because of age and many years] and the aged do (not) understand the right."}],"10":[{"catchword":null,"tekst":"Therefore say, I hearken thou to me: [He speaketh in the singular to Job] I shall shew mine opinion likewise. [viz. Though I am of younger years.]"}],"11":[{"catchword":null,"tekst":"Behold, I have waited on your words, [Here he speaketh to Job his friends.] I have turned the year to your observations, [i.e. listened so accurately and attentively, that I have fully comprehended all your propounded considerations.] until you had sought out speechs. [whereby your might convince Job.]"}],"12":[{"catchword":null,"tekst":"Now having heed to you, behold there is none of you that convinceth Job, that doth answer his speechs."}],"13":[{"catchword":null,"tekst":"That ye (may) not say, [Some do fill up the sense of these words with, I say this that ye may not say,] We have found the wisdom; [viz. Whereby Job is convinced and confused by us. Now this wisdom; they conceived was, that God had sent this misery upon him, and no man; and that God being righteous, and doing wrong to none especially, when his punishments are so dreadful and terrible, Job must needs be a very wicked man.] God hath thrust him down, no man. [Heb. Not a man.]"}],"14":[{"catchword":null,"tekst":"Now he [Job namely] hath directed no words against me, and I shall not answer him with your words. [viz. Ye Eliphaz, Bildad and Zephar.]"}],"15":[{"catchword":null,"tekst":"They are amazed, [viz. The three friends of Job. It seemeth that saying this, he turned himself about to the standers by and auditors.] they answer no more, [viz. To Jobs replys.] they have set by the words from them. [i.e. given them over, and left the prosecution to others.]"}],"16":[{"catchword":null,"tekst":"I have waited then [viz. For the answer of Job his friends] but they speak not: for they stand still: they answer no more."}],"17":[{"catchword":null,"tekst":"I shall likewise answer my share: I shall shew my opinion also. [As above v.10.]"}],"18":[{"catchword":null,"tekst":"For I am full of words, the spirit of my belly [Understand the zeal and bent of inclination, which Elihu had to utter his mind about this matter. See 2 Kings 19.on verse 7. Of my belly, i.e. of my inmost disposition and readiness. See ab.15.on v.2. and so in the sequel.] distresseth me."}],"19":[{"catchword":null,"tekst":"Behold my belly is as the wine, that is not opened: [or, hath no vent. Understand that his inward disposition, should not be without danger if he concealed that which he had apprehended and considered about this matter, even as we see the vessel, rend and burst, which being filled with new and strong wine, have no vent left them.] it would burst like new leather sacks [or bottles; The Hebrew word doth here signify, leather bottles, or sacks, such as they used of old, to put their wine in. Compare Mat 9:17.]"}],"20":[{"catchword":null,"tekst":"I shall speak, that I may get air for my self: [that I may vent and ease my self, of the thoughts and trouble, which were caused in me by hearing and holding my peace all this while.] I shall open my lips, and shall answer."}],"21":[{"catchword":null,"tekst":"O that I may accept no mans face! [See Lev.19.on v.15.] and use no by-name to man. [viz. Neither in good teams, to sooth and flatter him; nor in evil, revile or abuse him, with bitter and reproachful checkings.]"}],"22":[{"catchword":null,"tekst":"For I know not (how) to use by-means: my maker [i.e. God that made and created me. See above 4. On v.17.] might soon take me away [i.e. kill and destroy me, viz. If I should so, or commit any such thing.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
