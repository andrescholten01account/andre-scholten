l=\"L3\" data-code=\"H2091\">goud</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H857\">komt</span>; <em>maar</em> <span class=\"wl\" data-l=\"L5\" data-code=\"H5921\">bij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H433\">God</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H433\">is</span> een geweldige <span class=\"wl\" data-l=\"L7\" data-code=\"H1935\">majesteit</span>!", "23": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7706\">De</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7706\">Almachtige</span>, Hem <span class=\"wl\" data-l=\"L2\" data-code=\"H3808\">kunnen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3808\">wij</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3808\">niet</span> doorgronden; <span class=\"wl\" data-l=\"L3\" data-code=\"H7689\">Hij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7689\">is</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7689\">groot</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7689\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3581\">kracht</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H4941\">doch</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4941\">door</span> recht <span class=\"wl\" data-l=\"L6\" data-code=\"H7230\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7230\">grote</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6666\">gerechtigheid</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6031\">verdrukt</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6031\">Hij</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3808\">niet</span>.", "24": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3651\">Daarom</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3372\">vrezen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3372\">de</span> mensen <span class=\"wl\" data-l=\"L3\" data-code=\"H582\">Hem</span>; <span class=\"wl\" data-l=\"L4\" data-code=\"H7200\">Hij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7200\">ziet</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3808\">geen</span> enkele <span class=\"wl\" data-l=\"L6\" data-code=\"H2450\">wijze</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2450\">van</span> hart <span class=\"wl\" data-l=\"L7\" data-code=\"H7200\">aan</span>."}, "koppeling_kjv": {"1": "At <span class=\"wl wl-kjv\" data-code=\"H2063\">this</span> also my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H2729\">trembleth,</span> and is moved <span class=\"wl wl-kjv\" data-code=\"H5425\">out</span> of his place.", "2": "<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">attentively</span> the <span class=\"wl wl-kjv\" data-code=\"H7267\">noise</span> of his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1899\">sound</span> that goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of his mouth.", "3": "He <span class=\"wl wl-kjv\" data-code=\"H3474\">directeth</span> <span class=\"wl wl-kjv\" data-code=\"H8281\">it</span> under the whole <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and his <span class=\"wl wl-kjv\" data-code=\"H216\">lightning</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3671\">ends</span> of the earth.", "4": "<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> it a <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> <span class=\"wl wl-kjv\" data-code=\"H7580\">roareth:</span> he <span class=\"wl wl-kjv\" data-code=\"H7481\">thundereth</span> with the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of his <span class=\"wl wl-kjv\" data-code=\"H1347\">excellency;</span> and he will not <span class=\"wl wl-kjv\" data-code=\"H6117\">stay</span> them when his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> is heard.", "5": "<span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7481\">thundereth</span> <span class=\"wl wl-kjv\" data-code=\"H6381\">marvellously</span> with his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> great <span class=\"wl wl-kjv\" data-code=\"H1419\">things</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> he, which we cannot comprehend.", "6": "For he <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> to the <span class=\"wl wl-kjv\" data-code=\"H7950\">snow,</span> Be <span class=\"wl wl-kjv\" data-code=\"H1933\">thou</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> likewise to the <span class=\"wl wl-kjv\" data-code=\"H4306\">small</span> <span class=\"wl wl-kjv\" data-code=\"H1653\">rain,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4306\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1653\">rain</span> of his strength.", "7": "He sealeth <span class=\"wl wl-kjv\" data-code=\"H2856\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of every <span class=\"wl wl-kjv\" data-code=\"H120\">man;</span> that all <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> his work.", "8": "Then the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> <span class=\"wl wl-kjv\" data-code=\"H1119\">into</span> <span class=\"wl wl-kjv\" data-code=\"H695\">dens,</span> and <span class=\"wl wl-kjv\" data-code=\"H7931\">remain</span> in their places.", "9": "Out of the <span class=\"wl wl-kjv\" data-code=\"H2315\">south</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> the <span class=\"wl wl-kjv\" data-code=\"H5492\">whirlwind:</span> and <span class=\"wl wl-kjv\" data-code=\"H7135\">cold</span> out of the north.", "10": "By the <span class=\"wl wl-kjv\" data-code=\"H5397\">breath</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7140\">frost</span> is <span class=\"wl wl-kjv\" data-code=\"H5414\">given:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> is straitened.", "11": "Also by <span class=\"wl wl-kjv\" data-code=\"H7377\">watering</span> he <span class=\"wl wl-kjv\" data-code=\"H2959\">wearieth</span> the thick <span class=\"wl wl-kjv\" data-code=\"H5645\">cloud:</span> he <span class=\"wl wl-kjv\" data-code=\"H6327\">scattereth</span> his <span class=\"wl wl-kjv\" data-code=\"H216\">bright</span> cloud:", "12": "And it is <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> round <span class=\"wl wl-kjv\" data-code=\"H4524\">about</span> by his <span class=\"wl wl-kjv\" data-code=\"H8458\">counsels:</span> that they may <span class=\"wl wl-kjv\" data-code=\"H6467\">do</span> whatsoever he <span class=\"wl wl-kjv\" data-code=\"H6680\">commandeth</span> them upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> in the earth.", "13": "He causeth it to <span class=\"wl wl-kjv\" data-code=\"H4672\">come,</span> whether for <span class=\"wl wl-kjv\" data-code=\"H7626\">correction,</span> or for his <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> or for mercy.", "14": "<span class=\"wl wl-kjv\" data-code=\"H238\">Hearken</span> unto this, O <span class=\"wl wl-kjv\" data-code=\"H347\">Job:</span> stand <span class=\"wl wl-kjv\" data-code=\"H5975\">still,</span> and <span class=\"wl wl-kjv\" data-code=\"H995\">consider</span> the <span class=\"wl wl-kjv\" data-code=\"H6381\">wondrous</span> works of God.", "15": "Dost thou <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> when <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">disposed</span> them, and caused the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of his <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> to shine?", "16": "Dost thou <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H4657\">balancings</span> of the <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds,</span> the wondrous <span class=\"wl wl-kjv\" data-code=\"H4652\">works</span> of him which is <span class=\"wl wl-kjv\" data-code=\"H8549\">perfect</span> in knowledge?", "17": "How thy <span class=\"wl wl-kjv\" data-code=\"H899\">garments</span> are <span class=\"wl wl-kjv\" data-code=\"H2525\">warm,</span> when he <span class=\"wl wl-kjv\" data-code=\"H8252\">quieteth</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> by the south", "18": "Hast thou with him spread <span class=\"wl wl-kjv\" data-code=\"H7554\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H7834\">sky,</span> which is <span class=\"wl wl-kjv\" data-code=\"H2389\">strong,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H3332\">molten</span> looking glass?", "19": "<span class=\"wl wl-kjv\" data-code=\"H3045\">Teach</span> us what we shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him; for we cannot <span class=\"wl wl-kjv\" data-code=\"H6186\">order</span> our speech by <span class=\"wl wl-kjv\" data-code=\"H6440\">reason</span> of darkness.", "20": "Shall it be <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> him that I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak?</span> if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">speak,</span> surely he shall be swallowed up.", "21": "And now men <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> not the <span class=\"wl wl-kjv\" data-code=\"H925\">bright</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H7834\">clouds:</span> but the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth,</span> and cleanseth", "22": "Fair <span class=\"wl wl-kjv\" data-code=\"H2091\">weather</span> <span class=\"wl wl-kjv\" data-code=\"H857\">cometh</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north:</span> with <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> majesty.", "23": "Touching the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty,</span> we cannot find him <span class=\"wl wl-kjv\" data-code=\"H4672\">out:</span> he is <span class=\"wl wl-kjv\" data-code=\"H7689\">excellent</span> in <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> and in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> and in <span class=\"wl wl-kjv\" data-code=\"H7230\">plenty</span> of <span class=\"wl wl-kjv\" data-code=\"H6666\">justice:</span> he will not afflict.", "24": "<span class=\"wl wl-kjv\" data-code=\"H582\">Men</span> do therefore <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> him: he <span class=\"wl wl-kjv\" data-code=\"H7200\">respecteth</span> not any that are <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> of heart."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
