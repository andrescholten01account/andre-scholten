j niet.","24":"Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan."},"SV":{"1":"Ook beeft hierover mijn hart, en springt op uit zijn plaats.","2":"Hoort met aandacht de beweging Zijner stem, en het geluid, *dat* uit Zijn mond uitgaat!","3":"Dat zendt Hij rechtuit onder den gansen hemel, en Zijn licht over de einden der aarde.","4":"Daarna brult Hij met de stem; Hij dondert met de stem Zijner hoogheid, en vertrekt die dingen niet, als Zijn stem zal gehoord worden.","5":"God dondert met Zijn stem zeer wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.","6":"Want Hij zegt tot de sneeuw: Wees op de aarde; en *tot* den plasregen des regens; dan is er de plasregen Zijner sterke regenen.","7":"*Dan* zegelt Hij de hand van ieder mens toe, opdat Hij kenne al de lieden Zijns werks.","8":"En het gedierte gaat in de loerplaatsen, en blijft in zijn holen.","9":"Uit de binnenkamer komt de wervelwind, en van de verstrooiende *winden* de koude.","10":"Door *zijn* geblaas geeft God de vorst, zodat de brede wateren verstijfd worden.","11":"Ook vermoeit Hij de dikke wolken *door* klaarheid; Hij verstrooit de wolk Zijns lichts.","12":"Die keert zich dan naar Zijn wijzen raad *door* ommegangen, dat zij doen al wat Hij ze gebiedt, op het vlakke der wereld, op de aarde.","13":"Hetzij dat Hij die tot een roede, of tot Zijn land, of tot weldadigheid beschikt.","14":"Neem dit, o Job, ter ore; sta, en aanmerk de wonderen Gods.","15":"Weet gij, wanneer God over dezelve orde stelt, en het licht Zijner wolk laat schijnen?","16":"Hebt gij wetenschap van de opwegingen der dikke wolken; de wonderheden Desgenen, Die volmaakt is in wetenschappen?","17":"Hoe uw klederen warm worden, als Hij de aarde stil maakt uit het zuiden?","18":"Hebt gij met Hem de hemelen uitgespannen, die vast zijn, als een gegoten spiegel?","19":"Onderricht ons, wat wij Hem zeggen zullen; *want* wij zullen niets ordentelijk voorstellen kunnen vanwege de duisternis.","20":"Zal het Hem verteld worden, als ik *zo* zou spreken? Denkt iemand *dat*, gewisselijk, hij zal verslonden worden.","21":"En nu ziet men het licht niet *als* *het* helder is in den hemel, als de wind doorgaat, en dien zuivert;","22":"*Als* van het noorden het goud komt; *maar* bij God is een vreselijke majesteit!","23":"Den Almachtige, Dien kunnen wij niet uitvinden; Hij is groot van kracht; doch *door* gericht en grote gerechtigheid verdrukt Hij niet.","24":"Daarom vrezen Hem de lieden; Hij ziet geen wijzen van harte aan."},"KJV":{"1":"At this also my heart trembleth, and is moved out of his place.","2":"Hear attentively the noise of his voice, and the sound *that* goeth out of his mouth.","3":"He directeth it under the whole heaven, and his lightning unto the ends of the earth.","4":"After it a voice roareth: he thundereth with the voice of his excellency; and he will not stay them when his voice is heard.","5":"God thundereth marvellously with his voice; great things doeth he, which we cannot comprehend.","6":"For he saith to the snow, Be thou *on* the earth; likewise to the small rain, and to the great rain of his strength.","7":"He sealeth up the hand of every man; that all men may know his work.","8":"Then the beasts go into dens, and remain in their places.","9":"Out of the south cometh the whirlwind: and cold out of the north.","10":"By the breath of God frost is given: and the breadth of the waters is straitened.","11":"Also by watering he wearieth the thick cloud: he scattereth his bright cloud:","12":"And it is turned round about by his counsels: that they may do whatsoever he commandeth them upon the face of the world in the earth.","13":"He causeth it to come, whether for correction, or for his land, or for mercy.","14":"Hearken unto this, O Job: stand still, and consider the wondrous works of God.","15":"Dost thou know when God disposed them, and caused the light of his cloud to shine?","16":"Dost thou know the balancings of the clouds, the wondrous works of him which is perfect in rs natuurlijk geschiedt na den bliksem, maar hij ziet op hetgeen de mensen eerst gewaar worden, want het licht des bliksems valt eer in het gezicht dan het geluid des donders in de oren."},{"catchword":"die dingen niet,","tekst":"Te weten, regen, hagel, wind en ander onweder, dat met den donder pleegt verenigd te zijn. Of, men kan invoegen het woord, die [ bliksemen ]."}],"6":[{"catchword":"zegt","tekst":"Gods zeggen is zijn doen. Zie Gen 1:3 ."},{"catchword":"den plasregens","tekst":"Te weten, gebiedt God dat hij op de aarde vallen zou."},{"catchword":"plasregen","tekst":"Hebreeuws, de plasregens der regens zijner sterkte."}],"7":[{"catchword":"Dan","tekst":"Te weten, als het zeer sneeuwt of regent."},{"catchword":"zegelt","tekst":"Dat is, sluit de handen toe, dat zij op het veld niet werken kunnen door het onweder. Hebreeuws, in, of op de hand."},{"catchword":"van ieder mens","tekst":"Dat is, van alle landbouwers."},{"catchword":"kenne","tekst":"Dat is, opdat de landbouwer door de gelegenheid van den stilstand des werks, uit een ieder zijner werklieden tehuis op zijn gemak vernemen zou, hoe het met hun ganse werk te veld gesteld is. Anders, tot kennis aller mensen, die Hij gemaakt heeft."}],"8":[{"catchword":"En het gedierte","tekst":"Te weten, als het onweder is; gelijk in vs.7."},{"catchword":"loerplaatsen,","tekst":"Het Hebreeuwse woord betekent zulke plaatsen, waarin de beesten niet alleen schuilen voor het onweder, maar ook loeren op hun aas; vergelijk onder, Job 39:2 ."},{"catchword":"en blijft","tekst":"Hebreeuws, woont in zijne woningen."}],"9":[{"catchword":"binnenkamer","tekst":"Vergelijk boven, Job 9:9 , en de aantekening. Sommigen verstaan de dikke wolken of andere verborgen schatkamers, waar de winden uit voortkomen."},{"catchword":"verstrooiende","tekst":"Die uit het noorden komen."}],"10":[{"catchword":"zijn","tekst":"Versta den wind, die ook zo genaamd wordt 2Sa 22:16 ; Psa 18:16 . Hebreeuws, door het geblaas Gods geeft Hij de vorst."},{"catchword":"brede wateren","tekst":"Hebreeuws, de breedte der wateren in klontering, of pranging, of praming, of stijvigheid en vastigheid is; dat is vast ineengedrongen en geklonterd door de koude."}],"11":[{"catchword":"door klaarheid;","tekst":"Namelijk, mits die door het schijnsel der zon te verdunnen, te verdelen en te verstrooien. Anders, door bevochtiging [der aarde]; dat is, als Hij de wolken zeer ontsluit om water uit te gieten; waardoor de wolken bij gelijkenis van degenen, die veel werk doen, worden gezegd vermoeid te worden."},{"catchword":"de wolk","tekst":"Dat is, waardoor Hij licht en klaarheid voortbrengt, als zij verstrooid is. Of, versta, de wolk van zijn weerlicht, of bliksems, waardoor God het weerlicht of den bliksem doet voortschieten. Anders, Hij verstrooit de wolken zijns regens. Vergelijk boven, Job 36:30 , met de aantekening."}],"12":[{"catchword":"Die keert","tekst":"Te weten, de wolk, van welke in vs.11 gesproken is."},{"catchword":"wijzen raad","tekst":"Het Hebreeuwse woord betekent meest vlijtige kloekheid en beraadzaamheid in het regeren; gelijk de stuurlieden ter zee met bijzondere behendigheid hun schip weten te sturen en ter gewenste plaats te brengen. Alzo hier, Pro 1:5 , en Pro 11:14 , en Pro 20:18 , en Pro 24:6 . Elders wordt het in het kwade genomen voor des bozen listige en schalkse raadslagen; gelijk Pro 12:5 ."},{"catchword":"door ommegangen,","tekst":"Te weten, waardoor de wolk van het ene oord der lucht in het andere gedreven wordt, geleid zijnde door Gods voorzienigheid, naar de orde, die Hij in de natuur gesteld heeft."},{"catchword":"dat zij doen","tekst":"Te weten, niet alleen de wolk, maar ook al de andere voorverhaalde schepselen, als de winden, de sneeuw, de regen, enz."},{"catchword":"gebiedt,","tekst":"Dat is, al wat Hij daardoor doet. Zie boven, Job 36:32 ."},{"catchword":"op het vlakke","tekst":"Hebreeuws, op het aangezicht der aarde. Vergelijk Gen 1:2 ."}],"13":[{"catchword":"die tot","tekst":"Te weten, de wolk."},{"catchword":"roede,","tekst":"Dat is, kastijding en straf voor de mensen; zie boven, Job 9:34 ."},{"catchword":"Zijn land,","tekst":"Dat is, om het land met al de andere schepselen, die daarin zijn, naar zijn goed welbehagen te bezoeken. Zij worden Gods genaamd, omdat zij Hem toebehoren, zijnde van Hem geschapen."},{"catchword":"weldadigheid","tekst":"Te weten, om die tegen de mensen te bewijzen."},{"catchword":"beschikt","tekst":"Hebreeuws, doet vinden."}],"15":[{"catchword":"dezelve","tekst":"Te weten, wolken. Anders, wonderen."},{"catchword":"orde stelt,","tekst":"Te weten, om door dezelve te werken; of, op die [zijn hart] stelt; dat is, achtgeeft, met een voornemen, om door dezelve zijn weldaden te bewijzen, of oordelen uit te voeren."},{"catchword":"licht","tekst":"Dat is, den bliksem en het weerlicht, alzo boven, vs.3, en Job 36:30 . Hij wil zeggen, dewijl Job zodanige natuurlijke dingen ten volle niet kon begrijpen, dat hij nog veel minder den grond van Gods oordelen kon uitvinden."}],"16":[{"catchword":"opwegingen","tekst":"Dat is, van de manier, op welke de wolken in de lucht worden opgehangen als in een gelijke weegschaal, dat zij niet ten enenmale nedervallen op de aarde."},{"catchword":"Desgenen,","tekst":"Dat is, Gods, wiens wijsheid volkomen is in het beschikken, en kracht in het uitvoeren van al zijne werken; vergelijk 1Sa 2:3 ."}],"17":[{"catchword":"Hoe uw klederen","tekst":"Alsof hij zeide: Kunt gij ook dit geringe stuk ten volle wel begrijpen, hoe de kleding aan uw lijf warm wordt door de verwarmde lucht. Weliswaar dat Job dit wel enigszins verstaan kon; maar Elihu spreekt van een volmaakte doorgronding aller omstandigheden, om ten volle te weten hoe, waarom, wanneer, waar, over wien de Heere zulks wil doen."},{"catchword":"Hij de aarde","tekst":"Te weten, God."},{"catchword":"stil maakt","tekst":"Dat is, vrijmaakt van de winden, die koude veroorzaken."},{"catchword":"uit het zuiden?","tekst":"Dat is, door de zon uit het zuiden schijnende."}],"18":[{"catchword":"met Hem","tekst":"Te weten, met God, alsof gij zijn metgezel in het scheppen der wereld geweest waart."},{"catchword":"vast zijn,","tekst":"Te weten, hoewel ze van een zeer dunne zelfstandigheid zijn."},{"catchword":"als een gegoten spiegel?","tekst":"Namelijk, vanwege haar klaarheid en doorluchtigheid. Elihu wil zeggen, naardien Job dat grote werk der schepping niet gemaakt had, noch ook zou kunnen maken, dat hij zich billijk onder dien Almogende behoorde te vernederen, voornamelijk omdat men uit de volmaaktheid zijner macht moet oordelen van de volmaaktheid zijner rechtvaardigheid."}],"19":[{"catchword":"Hem zeggen zullen;","tekst":"Te weten, God, zo wij in twist en tegenspreking met Hem komen zouden, gelijk gij dan wilt, om uw recht tegen Hem te verdedigen. Zie boven, Job 13:3 , en Job 23:3-4 , enz., en Job 31:35 ."},{"catchword":"ordentelijk","tekst":"Te weten, waartoe noch stof van redenen, noch bekwaamheid van woorden, noch kunst van stellen vindende."},{"catchword":"de duisternis","tekst":"Te weten, van ons verstand, hetwelk niet ten volle Gods werken kan doorgronden, veelmin in samenspreking bestaan tegen zijn wijsheid."}],"20":[{"catchword":"Hem","tekst":"Te weten, Gode; dat is, zal iemand Gode durven verhalen en voorstellen, hetgeen ik zou mogen voorgenomen hebben kwalijk van God te spreken?"},{"catchword":"zo","tekst":"Te weten, gelijk gij, o Job, van God en zijn regering gesproken hebt."},{"catchword":"Denkt iemand","tekst":"Hebreeuws, zegt; te weten in zijn hart; dat is, denkt iemand. Zie Gen 20:11 ; of zegt hij; te weten, met den mond."},{"catchword":"dat,","tekst":"Te weten, dat hij zulke woorden Gode zou durven voordragen."},{"catchword":"verslonden worden","tekst":"Namelijk, van de majesteit Gods."}],"21":[{"catchword":"licht","tekst":"Dat is, de zon, als zij in haar vollen glans is en de lucht doorstralende. Zie boven, Job 25:3 . De zin is, dewijl wij de zon, als zij ten allerklaarste schijnt, met onze ogen niet kunnen aanschouwen, hoeveel minder kunnen wij de oneindelijke majesteit Gods verdragen en zijn verborgen oordelen met ons verstand begrijpen?"},{"catchword":"dien zuivert;","tekst":"Te weten, hemel."}],"22":[{"catchword":"noorden","tekst":"Te weten, als de hemel door den noordenwind gezuiverd en klaar gemaakt is; vergelijk boven, vs.9."},{"catchword":"het goud","tekst":"Versta, schoon en klaar weder met zonneschijn, welke bij het goud wordt vergeleken, om zijn klaarheid en zuiverheid. Vergelijk Zec 4:12 , met de aantekening."},{"catchword":"komt;","tekst":"Dat is, zich uitspreidt in de lucht."},{"catchword":"vreselijke majesteit","tekst":"Te weten, welker glans oneindig meerder is dan van de zon. Anders, bij den vreeslijken God is majesteit."}],"23":[{"catchword":"doch","tekst":"Dat is, hoewel Hij almogend is, nochtans zal Hij zijn grote kracht niet gebruiken, om naar het hoogste recht hier met den mens te handelen. Anders, Hij is groot van kracht en van oordeel, en van grote gerechtigheid, Hij verdrukt niet."}],"24":[{"catchword":"Hij ziet","tekst":"De zin is, dat God, om barmhartigheid en weldadigheid tegen de mensen te bewijzen, wordt bewogen, niet door iets da Hij in den mens ziet, al ware hij een van de allerwijste, maar alleen door zijn liefde, die Hij ons toedraagt in den Messias, en dat tot verheerlijking zijns heiligen naams."},{"catchword":"wijzen","tekst":"Dat is, die een kloek en wijs verstand hebben. Alzo Exo 28:3 , en Exo 31:6 , en Exo 35:25 ; vergelijk ook boven, Job 9:4 , en de aantekening. Anders, Hij ziet geen wijzen van hart; of, zal Hij niet alle wijzen van hart aanzien? dat is, achtnemen op degenen, die recht wijs zijn?"}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For this also my heart trembleth [viz. For or by reason of the dreadful works of God, which I am about to rehearse now.] and leapeth out of its place. [Heb. Is transposed, dislocated.]"}],"2":[{"catchword":null,"tekst":"Hearken with attention [Heb. Hearing hear] the motion of his voice, [Gods namely, Understand the Thunder, so Below v.4, and 5. And Psa 29:3.] and the sound [Oth. Rumbling, or refounding. Hebr. Speech] (that) goeth forth out of his mouth. [i.e. is made at his command. Comp. Deuter.8.3. and the annotation.]"}],"3":[{"catchword":null,"tekst":"That [Sound of thunder namely] he [God] sendeth directly forth under all the heaven, and his light [i.e. Gods lightenings and fiery flashes; as above 36.30.] over the ends of the Earth [Heb. Wings of, etc. So likewise below 38.13. Isa 11:12.]"}],"4":[{"catchword":null,"tekst":"Then [Viz. After the sending forth of the lightening, mentioned in the thunder. Elihu meaneth not that the rating of kneel of the thunder is naturally after the lightening; but he speaketh of it in that order in which it is presented to the human senses. For the flash of lightening doth sooner appear to the eyes, then the sounding of thunder is conveyed to the ears.] he thundereth with the voice of his highness, and withdraweth not those things, [viz. The rain, hail, wind and other tempestuousness, which useth to be accompanied with thunder. Or there may be inserted the word, lightenings.] when his voice is heard."}],"5":[{"catchword":null,"tekst":"God thundereth with his voice very wonderfully, he doth great things, and we comprehend them not."}],"6":[{"catchword":null,"tekst":"For he saith to the snow [Gods saying, is his doing. See Gen 1:4.] Be upon the earth, and to the shower of rain; [viz. Doth God command to fall up the Earth] then there is the shower of his strong rains. [Heb. The shower of the rains of his strength.]"}],"7":[{"catchword":null,"tekst":"Then [viz. When it snoweth or raineth very much] doth he seal up the land. [i.e. he shutteth up, and stayeth the hands that they are not able to work in the field, by reason of the storm and tempest,] of every man, [viz. That work in the fields, i.e. the Husband man] that he may know all the men of his work, [i.e. that the Husbandman by occasion of the works, standing still, may inform himself at home with ease, how all the work goeth on and thriveth abroad. Oth. For the knowledge of all men which he made.]"}],"8":[{"catchword":null,"tekst":"And the beast go, [viz. When it is foul tempestuous weather, as in the former verse] into lurking places, [the Hebrew word doth signify such places, wherein the beasts do not only shelter themselves in time of fowl weather, but also lurk and watch for their prey. Comp. Below 39.2.] and abideth in its holes: [Heb. Dwelleth in his habitation."}],"9":[{"catchword":null,"tekst":"Out of the inner chamber [Compare above 9.9. and the annot. Some do understand hereby the thick clouds, or other hidden treasuries, whence the winds do issue forth] cometh the whirlwind, and from off the Sea scattering (winds) [which come from the North]"}],"10":[{"catchword":null,"tekst":"Through his blowing, [Understand the wind, which is likewise so called, 2 Sam.22.16. Psa.18.v.16.] God giveth the frost; [Heb. Through Gods blowing doth he give the frost] so that the broad waters are stiffened. [Heb. The breadth of the waters (is) in curding, or entering, stiffening, or fasting, i.e. driven close together, and curded as it were within it self through cold.]"}],"11":[{"catchword":null,"tekst":"Also he tired the thick clouds (through) brightness, [viz. By rarefying, dissipating and scattering the same, by the beams of the Sun. Oth. Through moistening (the Earth) [i.e. whilst he is dissolving the clouds for to power out their water, whence by way of comparison, from such as do a great deal of work, the clouds are said to be wearied or tired.] he scattereth the cloud of his light, [i.e. whereby he bringeth forth the light the cloud of his lightening, or flashings, whereby God doth shoot or dart forth the lightenings. Oth. He scattereth the cloud of his rain. Compare above 36.30. with the annot.]"}],"12":[{"catchword":null,"tekst":"Then the same [Cloud namely, spoken of in the former verse] turneth it self according to his wise counsel, [the Hebrew word doth signify for the most part a diligent prudence, and advisedness in governing, like as the pilots at Sea are able to steer their ships, with singular readiness, for to bring them unto the wished harbour. So here, and Pro 1:5. chap.11,14. And 20.18. and 24.6. Otherwise it is taken in an ill sense, for the willy and mischievous devises and plottings of the wicked, as Pro 12:5.] through circuits, [viz. Whereby the clouds is driven and hurried about from one place of the air into the other; according to the order, by Gods providence established in nature] that they do, [viz. Not the could only, but likewise all the other forementioned creatures, as the winds, the snow, the frost, the rain, &c.] all that he commandeth them, [i.e. whatsoever he doth by them. See above 35.on v.21.] upon the Earth."}],"13":[{"catchword":null,"tekst":"Whether he disposeth, [Heb. Make to find] the same [cloud namely] for a rod [i.e. correction and punishment for men. See above chap.9.on v.34.] or for his land, [viz. To visit the land, with all the creatures that are contained therein; according to his pleasure, they are called his, i.e. Gods, because they belong unto him, being created by him] or for benefit, [viz. To be shewed unto, and bestowed upon men.]"}],"14":[{"catchword":null,"tekst":"Take this, O Job, to ears, stand, and observe the wonders of God."}],"15":[{"catchword":null,"tekst":"Doest thou know when God setteth Order over them; [over the clouds namely: Oth. Over the wonders, viz. To work by them; or setteth (his heart) upon them i.e. doth heed and observe them, with a purpose by the same, either to shew and impart his mercies; or to inflict and execute his judgements.] and letteth the light of his clouds to shine, [i.e. the lighting, and fire flashes. So above v.3. and chap.36.30. He would infer, because Job was not able perfectly to comprehend such natural things, that therefore he was much more unable to find out, or dive into ground or bottom of the judgements of God.]"}],"16":[{"catchword":null,"tekst":"Hast thou knowledge of the balancing of the thick clouds, [i.e. of the manner how the clouds are hung as in an even balance, that they do not fall to ground at once.] The wonderfulness of him, that is perfect in knowledge, [i.e. God, whose wisdom is as perfect in dispositions, as his power in executing all his works. Compare 1 Sam.2.3.]"}],"17":[{"catchword":null,"tekst":"How thy cloths grow warm, [as if he said, art thou able fully to comprehend but so small a thing, as how the cloths upon thy body grow warm through a warmed air? No doubt but Job was able enough to understand it in some degree; but Elihu speaketh here of a perfect and through search of every circumstance, to know exactly and fully, how, wherefore, when, where for or over whom the LORD may or doth effect the same] when he, [God namely] maketh the earth still, [i.e. calmeth and layeth the winds upon it, which caused the cold] out of the South; [i.e. by means of the sun-shine from the south."}],"18":[{"catchword":null,"tekst":"Hast thou extended the heavens with him; [viz. With God, as if thou hadst been his companion in creating the world] which are firm [notwithstanding that they are of a very thin and subtile transparent substance] like a founded mirror or looking-glass, [viz. By reason of their brightness and lustre, Elihu&acirc;&euro;&trade;s meaning is, since Job had no share in the making of that great work, nor was able to produce the like, that therefore he ought in all reason, to humble himself under that Almighty power, which made them; especially seeing we may and must, by the perfection of his power, judge also of the perfection of his justice.]"}],"19":[{"catchword":null,"tekst":"Instruct us, what we shall say unto him: [namely to God, if we should enter into contention and variance with him, as thy self is about now, in maintaining the cause of thy pretended integrity against him, See above 13.3. and 23.3,4. Etc. And 31,35.] for we shall be able to set forth nothing orderly [viz. For want of matter, reasons or arguments, fitness of words, art and ability, finding our selves altogether unprovided and unfurnished to enter the lifts with him] by reason of the darkness, [viz. Of our understanding, which is not able fully it out in debate of words and plea against his wisdom.]"}],"20":[{"catchword":null,"tekst":"Shall it be related unto him, [viz. To God, i.e. shall any need to inform and represent it unto God, if I should have purposed to speak evil of God] if I should speak (so)? [viz. As thou, O Job! Hast spoken of God and his Government] doth any think. [Heb. Sayeth any, viz. In his heart, i.e. thinketh any. See Gen.20.on v.11. Or saith he, viz. With the mouth] (that)? [viz. That he shall need to inform and acquaint God with such words or speechs] certainly he shall be swallowed up, [viz. By the majesty of God.]"}],"21":[{"catchword":null,"tekst":"And now one seeth not the light (when it) is brighter in heaven, [i.e. the Sun; when he is in his full splendour, and spreadeth his beams through the air. See above chap.25.on v.3. The sense is, seeing we are not able to look with our eyes upon the sun, when he shineeth most bright, how much less shall we able to endure the infinite Majesty of God, and pore into his secret judgements, by our dull understanding] when the wind passeth through and cleanseth the same; [viz. The heavens, or sky.]"}],"22":[{"catchword":null,"tekst":"When the gold, [i.e. (in this place) fair and clear weather with Sunshine; which is compared to the gold for its brightness and pureness. Compare Zach.4.12. and the annot.] cometh [i.e. spreadeth it self through the air] from the North; [i.e. spreadeth it self through the air] from the North; [i.e. when the air is cleansed and purified by the North wind. Compare above v.8.] (but) by God (there) is a dreadful Majesty, [i.e. the brightness thereof is infinitely more glorious, and unendurable to man, then is the Sun, in his greatest strength and excellency. Oth. By the dreadful God (there) is Majesty.]"}],"23":[{"catchword":null,"tekst":"The almighty, whom we cannot find out, he is great of power; yet doth he not oppress by judgement, and great justice, [i.e. although he be omnipotent, nevertheless he will not make use of his great power, to deal with me, according to the utmost rigour of his justice. Oth. He is great of power, and of judgement, and of great justice, he oppresseth, (or afflicteth) not.]"}],"24":[{"catchword":null,"tekst":"Therefore men fear him: he regardeth not any wise of heart. [The sense is, that God is not moved to shew his mercy and kindness to men for any thing, that he doth see in man, although he were the wisest of men; but only of and for his love, which he bare unto us in the Messiah, and that for the glorifying of his holy name. By the wise of heart, are understood those that are of wise and prudent understanding. So Exo 28:3. and 31.6. and 35.25. Compare also above ch.9.4. and the annot. Oth, he seeth not any wise of heart. Or shall be not regard all wise of heart? i.e. take notice of them, that are truly wise?]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
// vanuit een rechtsklik-vertaalmenu (elders) kan de link ?vert=SV meegeven om

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +

// popup positioneren bij een element

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
