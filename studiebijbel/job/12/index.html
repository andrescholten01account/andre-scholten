de=\"H3212\">leadeth</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellors</span> away <span class=\"wl wl-kjv\" data-code=\"H7758\">spoiled,</span> and maketh the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> fools.","18":"He <span class=\"wl wl-kjv\" data-code=\"H6605\">looseth</span> the <span class=\"wl wl-kjv\" data-code=\"H4148\">bond</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and <span class=\"wl wl-kjv\" data-code=\"H631\">girdeth</span> their <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> with a girdle.","19":"He <span class=\"wl wl-kjv\" data-code=\"H3212\">leadeth</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">princes</span> away <span class=\"wl wl-kjv\" data-code=\"H7758\">spoiled,</span> and <span class=\"wl wl-kjv\" data-code=\"H5557\">overthroweth</span> the mighty.","20":"He removeth <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H8193\">speech</span> of the <span class=\"wl wl-kjv\" data-code=\"H539\">trusty,</span> and taketh <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H2940\">understanding</span> of the aged.","21":"He <span class=\"wl wl-kjv\" data-code=\"H8210\">poureth</span> <span class=\"wl wl-kjv\" data-code=\"H937\">contempt</span> upon <span class=\"wl wl-kjv\" data-code=\"H5081\">princes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7503\">weakeneth</span> the <span class=\"wl wl-kjv\" data-code=\"H4206\">strength</span> of the mighty.","22":"He <span class=\"wl wl-kjv\" data-code=\"H1540\">discovereth</span> deep <span class=\"wl wl-kjv\" data-code=\"H6013\">things</span> out of <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> and bringeth <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> the shadow of death.","23":"He <span class=\"wl wl-kjv\" data-code=\"H7679\">increaseth</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroyeth</span> them: he <span class=\"wl wl-kjv\" data-code=\"H7849\">enlargeth</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and straiteneth","24":"He taketh <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and causeth them to <span class=\"wl wl-kjv\" data-code=\"H8582\">wander</span> in a <span class=\"wl wl-kjv\" data-code=\"H8414\">wilderness</span> where there is no way.","25":"They <span class=\"wl wl-kjv\" data-code=\"H4959\">grope</span> in the <span class=\"wl wl-kjv\" data-code=\"H2822\">dark</span> without <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> and he maketh them to <span class=\"wl wl-kjv\" data-code=\"H8582\">stagger</span> like a drunken"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"omdat gijlieden","tekst":"Hij spreekt spottenderwijze, alsof hij zeide: Gij zijt de lieden, bij welke de wijsheid te vinden is; anderen, bij u vergeleken, zijn maar beesten, en ik bijzonderlijk, gelijk gij zegt, ben maar als een jonge woudezel; boven, Job 11:12 . Anders, omdat gijlieden een volk zijt; dat is, zijnde weinig mensen, houdt gij u zo verstandig alsof gij een geheel volk waart."}],"3":[{"catchword":"Ik heb","tekst":"Dat is, ik heb mede verstand om tussen de waarheid en de valsheid, tussen het goede en het kwade te onderscheiden. Hart voor verstand; zie boven, Job 9:4 ."},{"catchword":"ik zwicht","tekst":"Hebreeuws, ik val niet voor u, of meer dan gij; te weten, van de trap des verstands en der wijsheid, dat is, aangaande het verstand; ik behoef mij voor ulieden niet te schamen, zijnde daarin niet lager noch minder dan gijlieden zijt. Vallen is bij de Hebreën somwijlen klein, onwaardig en veracht te zijn. Vergelijk Neh 6:16 , en onder, Job 13:2 ."},{"catchword":"bij wien","tekst":"Dat is, wie weet die dingen niet, die gij voortgebracht hebt van Gods rechtvaardige regering, waardoor Hij de goeden pleegt wel te doen en de kwaden te straffen? Daar is niets bijzonders in uwe redenen, dat een ieder van de geringsten niet zou weten."}],"4":[{"catchword":"spot is,","tekst":"Of, gelach; dat is, die om zijn ellendigen staat beschimpt wordt, zelfs van degenen, die met hem vriendschapshalve medelijden moesten hebben en hem vertroosten."},{"catchword":"roepende","tekst":"Versta dit roepen van den vriend, die bespot wordt. Job wil zeggen: Ik ben nu wel van ulieden veracht en bespot, maar evenwel ben ik niet zonder troost bij God, omdat Hij mij verhoort als ik Hem aanroep. Dit kan ook verstaan worden van den vriend, die zijn naaste bespot. De zin zou zijn, dat hij met zijnen naaste niet alleen in zijnen tegenspoed spot, maar ook zichzelven wijsmaakt in Gods gunst te staan en van Hem verhoord te zijn, omdat hij op zijn gemak in weelde en voorspoed leeft."},{"catchword":"is een spot","tekst":"Te weten, den bozen en verkeerden, die door voorspoed verheven en dartel zijn geworden."}],"5":[{"catchword":"verachte fakkel,","tekst":"Dat is, als een verachte fakkel, die bijna uit is en afgebrand, en die men pleegt weg te werpen als onnut zijnde om meer te lichten."},{"catchword":"gerust is;","tekst":"Te weten, van alle vrees des kwaads, gelijk Pro 1:33 . Dat is, die op zijn gemak is en in voorspoed zit, zonder enige moeite of kwelling van iemand te lijden of te verwachten."},{"catchword":"gereed","tekst":"Dat is, die nabij den val schijnt te wezen, door het menigerlei kruis en verdriet, dat hem overkomen is. Job verstaat dit van zichzelven; vergelijk Psa 35:15 , en Psa 38:18 ; Jer 20:10 ."},{"catchword":"met den voet","tekst":"Hebreeuws, tot de struikeling des voets, of, [om te zijn] onder de struikelenden met den voet."}],"6":[{"catchword":"hebben rust,","tekst":"Of, zijn voorspoedig. Dit gaat tegen hetgeen de vrienden van Job geleerd en gedreven hadden van den tegenspoed en de straffen der goddelozen. Zie boven, Job 4:8-9 , en Job 5:3 , en Job 8:13-15 , en Job 11:11 , Job 11:20 ."},{"catchword":"verzekerdheden,","tekst":"Dat is, als vaste plaatsen en sterkten, waarop zij zich verlaten."},{"catchword":"met Zijn hand","tekst":"Versta, de hand Gods. Anders, voor [hem] dien God in zijn hand [alles] toebrengt."},{"catchword":"toebrengt","tekst":"Versta, allerlei tijdelijke zegeningen."}],"7":[{"catchword":"vraag","tekst":"Dat is, aanmerk het gedierte, en verzin hoe het, door de voorzienigheid Gods, den goddelozen tot vele bekwame en profijtelijke gebruiken dienstelijk is, en den vromen dikwijls ondienstig en schadelijk; of, sla ook gade, hoe het klein gedierte van de grote, de tamme van de wilde, de domme van de listige verdrukt worden."},{"catchword":"elkeen","tekst":"Hebreeuws, het zal u leren; dat is, elkeen daarvan zal u leren. Zie Gen 47:3 ."},{"catchword":"zal het u","tekst":"Te weten, dat het hier menigmalen den goeden kwalijk en den kwaden wel gaat."},{"catchword":"leren;","tekst":"Te weten, niet met rede en spraak, die zij niet hebben, maar met hun doen en hetgeen hun wedervaart. Alzo in het volgende."}],"9":[{"catchword":"alle deze,","tekst":"Te weten, schepselen. Hij wil zeggen dat zij allen getuigen zijn dat God zijn weldaden en straffen vrijwilliglijk uitdeelt, zonder altijd op de hoedanigheid der mensen acht te nemen."},{"catchword":"dit doet?","tekst":"Te weten, dat den vromen meest velerlei ellende, en den bozen allerlei voorspoed overkomt."}],"10":[{"catchword":"hand","tekst":"Dat is, macht en gebied; zie Gen 16:6 ."},{"catchword":"ziel","tekst":"Dit woord betekent hier het leven, of de gevoelende ziel, die in alle dieren is."},{"catchword":"de geest","tekst":"Dit woord ziet op den mens, die een redelijke en onsterflijke ziel heeft, die een geest genaamd wordt; zie Num 16:22 , en de aantekening."},{"catchword":"vlees","tekst":"Versta, het menselijke lichaam, waarin de redelijke ziel des mensen woont. Alzo Gen 17:13 ; Lev 19:28 ; Eze 11:19 ."},{"catchword":"des mensen","tekst":"Hebreeuws, mans; welk woord dikwijls niet alleen het mannelijk, maar ook het vrouwelijk geslacht, dat is alle mensen, betekent. Alzo Exo 19:13 , en Exo 21:16 , hier onder, Job 15:16 , en Job 34:11 , enz."}],"11":[{"catchword":"oor","tekst":"Dat is, het verstand, door middel van de oren; de zin is: Begrijpt het verstand niet de redenen en gezegden of zij vals of waar, redelijk of onredelijk zijn? Job geeft zijnen vrienden te verstaan, dewijl zij hun uiterlijke zinnen wel wisten te gebruiken, dat zij ook wel hun verstand behoorden aan te leggen om zijn redenen, en uit die de wonderbare regering Gods te begrijpen. Onder, Job 34:3 , is dezelfde gelijkenis."}],"12":[{"catchword":"In de stokouden","tekst":"Alsof hij zeide: Het is wel waar, dat de ouden uit oorzaak van de ervarenheid, die zij van vele dingen hebben, behoorden wij te zijn, maar niettemin merk ik dat men van God beter dan van de ouden onderwezen wordt. Anders, is in de stokouden de wijsheid? enz., waarmede Job zou schijnen te willen voorkomen hetgeen hem boven, Job 8:8-10 , tegengeworpen was, zeggende: Gij, mijn vrienden, behoort wel vanwege uw ouderdom en ervarenheid de orde van Gods wijze regering te begrijpen, maar de rechte wijsheid is bij God, die gij niet kunt vatten, en niet alleen deze, maar ook zijn sterkte, om krachtiglijk uit te voeren al hetgeen Hij wijselijk besloten heeft."}],"13":[{"catchword":"Hem","tekst":"Namelijk, bij God. Van het onderscheid van het woord wijsheid en wetenschap, of verstand, zie 1Ki 3:12 ."}],"14":[{"catchword":"breekt af,","tekst":"Te weten, huizen, paleizen, sterkten, steden, enz."},{"catchword":"besluit","tekst":"Versta dit in het algemeen van gevangenissen, belegeringen en allerhande plagen, waarin men zo vast besloten ligt, dat men geen opening of uitkomst ziet om daaruit te geraken. Vergelijk Isa 22:22 ; Rev 3:7 ."}],"15":[{"catchword":"Hij houdt","tekst":"Zie hiervan exempelen Gen 8:2 ; 1Ki 17:1 , 1Ki 17:7 ."},{"catchword":"laat Hij","tekst":"Hiervan is een exempel te zien Gen 7:11 ."}],"16":[{"catchword":"wijsheid;","tekst":"Of, het wezen [der zaken]."},{"catchword":"Zijns","tekst":"De zin is, dat zonder Gods voorzienigheid niemand kan dwalen, noch een ander in dwaling brengen; hetwelk in het algemeen te verstaan is van de dwaling, niet alleen des lichaams, maar ook des geestes; van de lichamelijke kunnen wij zien Psa 107:4 , van de geestelijke Deu 13:1 ; 1Ki 22:20 ; Eze 14:9 ; 2Th 2:11 , waar zij Gode toegeschreven worden; niet als een werker der zonden, maar als een wijs en heilig regeerder en rechtvaardig Rechter daarvan."}],"17":[{"catchword":"de raadsheren","tekst":"Versta, elkeen der goddeloze raadsheren; dat is, wie of hoe groot hij zou mogen zijn. Een gelijke manier van spreken is boven, vs.7, en onder, vs.19."},{"catchword":"beroofd weg,","tekst":"Te weten, van verstand, wijsheid en oordeel."},{"catchword":"de rechters","tekst":"Zie hiervan exempelen 2Sa 17:14 , 2Sa 17:23 ; Isa 19:12 ; 1Co 1:19 ."}],"18":[{"catchword":"band","tekst":"Versta, het juk der tirannie, waarmede zij hun onderzaten tenonder houden en verdrukken. Deze maakt Hij los, dat is, te niet."},{"catchword":"bindt","tekst":"Dat is, Hij beneemt hun niet alleen hun macht, die zij misbruiken, maar als het hem belieft, stelt Hij hen weder in dezelve; want de gordel betekent hier hun volle macht, sieraad en heerlijkheid, die zij hebben in hun regering. Vergelijk Isa 11:5 ; Jer 13:1-2 , enz. Anderen verstaan dat Hij de koningen als gevangenen en gebondenen wegvoert."}],"19":[{"catchword":"oversten","tekst":"Versta, elkeen der goddeloze oversten, of vorsten. Zie boven, vs.17, en van het Hebreeuwse woord, zie Gen 41:45 ."},{"catchword":"keert Hij om","tekst":"Dat is, al hun raadslagen, voornemens, middelen en bedrijf werpt Hij om en stoot ze te gronde."}],"20":[{"catchword":"den getrouwen","tekst":"Of, welsprekenden. Versta, degenen, die benevens dat zij kloek van verstand zijn om goeden en getrouwen raad te kunnen geven, ook gestadig zijn om daarbij te volharden, en welsprekend, om denzelven anderen vastelijk aan te raden; onder dezen zijn de getrouwe gezanten, van wie gesproken wordt Pro 25:13 ."},{"catchword":"spraak,","tekst":"Hebreeuws, lip. Zie Gen 11:1 , en boven, Job 2:10 ."},{"catchword":"oordeel","tekst":"Hebreeuws, smaak; maar bij gelijkenis wordt het woord ook gebruikt voor des mensen verstand, rede en oordeel, waardoor hij het goede van het kwade, en het eerlijke van het oneerlijke onderscheidt. Alzo Psa 119:66 ; Pro 11:22 , en smaken voor oordelen, Pro 31:18 ."}],"21":[{"catchword":"prinsen uit,","tekst":"Het Hebreeuwse woord betekent eigenlijk die vanzelf en vrijwilliglijk milddadig zijn; Exo 35:5 . Zo worden de prinsen, edelen en machtigen genaamd, omdat zij met goeddoen een naam willen krijgen en beroemd worden; vergelijk Psa 83:12 ; Pro 19:6 , en Luk 22:25 ."},{"catchword":"verslapt","tekst":"Dat is, Hij verzwakt de allersterksten; want een losse riem maakt den mens slapper van leden, maar stijf aangebonden zijnde, maakt hij hem vaster en wakkerder."}],"22":[{"catchword":"de diepten","tekst":"Dat is, de allerverborgenste zaken. Deze worden ook elders diepten genaamd, gelijk Ecc 7:24 ; Dan 2:22 ; 1Co 2:10 ."},{"catchword":"des doods","tekst":"Versta, het allerduisterste, dat niet scheen immermeer in het licht te zullen komen. Alzo onder, Job 34:22 ."}],"23":[{"catchword":"Hij vermenigvuldigt","tekst":"Gelijk voor den zondvloed; Gen 5 , Gen 6 ."},{"catchword":"Hij breidt","tekst":"Gelijk na den zondvloed; Gen 10 , Gen 11 ."},{"catchword":"leidt ze","tekst":"Dit verstaan sommigen ten goede, als een zegen, sommigen ten kwade, als een straf."}],"24":[{"catchword":"het hart","tekst":"Dat is, het verstand en oordeel. Alzo boven, vs.3."},{"catchword":"van de hoofden","tekst":"Te weten, van de regeerders en oversten der volken of landen, die aldus dikwijls genaamd worden. Zie Exo 6:13 ; Num 1:16 ; Deu 1:13 ; Jdg 11:8 , enz."},{"catchword":"doet hen dwalen","tekst":"Dat is, leidt hen met hun onderzaten door hun aanslagen in het verderf."},{"catchword":"waar geen weg is","tekst":"Zijnde zonder goed beleid en regering."}],"25":[{"catchword":"duisternis,","tekst":"Versta, de duisternis des verstands. De zin is, dat zij door Gods rechtvaardig oordeel gans verblind en radeloos worden, zulks dat zij geen weg weten in te gaan om het verderf te ontkomen."},{"catchword":"doet hen dwalen,","tekst":"Vergelijk Gen 19:11 , en 2Ki 6:18 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered, and said:"}],"2":[{"catchword":null,"tekst":"Forsooth, because ye are the people shall wisdom die with you. [Her speaketh ironically, as if he said; ye are the people it seemeth with whom wisdom is to be found: Others compared with you are but brutes, and I especially, as counting me no better then as the Colt of a wild ass, above chap. 11.12. Oth. Because ye are a people, i.e. being but few ye repute your selves as understanding as if ye were a whole nation.]"}],"3":[{"catchword":null,"tekst":"I have a heart too, as well as you [i.e. I am likewise endued with understanding, for to judge between truth and falsehood, between good and bad. Heart for understanding. See above 9.on verse 4.] I faint not before you. [Heb. I fall not before you, or more than you; viz. From the steps, or ascent of understanding and wisdom, i.e. as for understanding, I need not be ashamed before you, being of no lower or less degree in the same, then your selves. To fall, is sometimes as much with the Hebrews, as to be mean, unworthy and contemptible. Compare Nehem.6.16. and below 13.2.] and with whom are not the like thing? [i.e. who doth not know these things, which ye produced of Gods righteous Government, whereby he is wont to reward the good, and to punish the wicked? There is no singular matter in your arguments, but every one of the meanest capacity doth know as much.]"}],"4":[{"catchword":null,"tekst":"I am he (that) is a mock to his friend [or, a laughter, i.e. one, that by reason of his miserable condition is become a mocking stock, even to those, who for friendships sake, ought to pity and comfort me.] (but) crying to God that heareth him; [understand this crying of the friend that is mocked. Job will say; I am indeed now despised and mocked by you; but yet I am not without comfort by God; because he hears me when I cry unto him. This may likewise be understood of the Friend, that doth mock his neighbour being in adversity, but likewise believeth himself, to be in Gods favour and heard by him, because of his own living in peace and prosperity.] the righteous (and) upright, is a mock. [viz. To the wicked and perverse, who by their prosperity are lifted up and grown want on.]"}],"5":[{"catchword":null,"tekst":"He is a despised torch [i.e. as a despised torch, which is even spent, and wasted to the last snuff, and which is even spent, and wasted to the last snuff, and which cast away, as unserviceable, to give any light more.] according to the opinion of him that is at rest; [viz. From all fear of evil, as Prov 1:33. i.e. that is, or lives at ease and prospereth, without suffering, or expecting any trouble or disturbance from others.] he is ready to trip with the foot. [i.e. he seemeth to be near his downfall, by reason of the manifold crosses and vexations, that are fallen upon him. Job understands this of himself. Compare Psa 35:15. and 38.18. Jeremy 20.10. Heb. Unto the tripping of the foot; or, (for to be) among them that trip, or stumble with the foot.]"}],"6":[{"catchword":null,"tekst":"The tents of the destroyers are at rest, [or, prosperous. This is said in opposition to what Jobs friends had taught and urged of the adversity and punishment of the wicked. See above chap.4.v.8,9. & 5. V.3,4. And 8.13,14,15. And 11.11,20.] }

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};

        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
