":"Die door gebrek en honger eenzaam waren, vluchtend naar dorre plaatsen, *in* *het* donkere, woeste en verwoeste land.","4":"Die ziltige kruiden plukten bij de struiken, en wiens voedsel de wortel van de jenevers was.","5":"Zij werden uit het midden van de mensen weggejaagd; men riep hen na, als achter een dief,","6":"Zodat zij moesten wonen in de kloven van de dalen, de holen van het stof en van de steenrotsen.","7":"Zij schreeuwden tussen de struiken; onder de netels verzamelden zij zich.","8":"Zij waren kinderen van dwazen, en kinderen zonder naam; zij waren uit het land verjaagd.","9":"Maar nu ben ik hun een spotlied geworden, en ik ben hun tot een spreekwoord.","10":"Zij hebben een afschuw van mij, zij houden zich ver van mij, ja, zij weerhouden zich er niet van om voor mijn aangezicht te spugen.","11":"Want Hij heeft mijn koord losgemaakt en mij bedrukt; daarom hebben zij de teugel voor mijn aangezicht afgeworpen.","12":"Ter rechterhand staat de jeugd op, stoten mijn voeten weg, en banen tegen mij hun verderfelijke wegen.","13":"Zij breken mijn pad af, zij bevorderen mijn ellende; zij hebben geen helper nodig.","14":"Zij komen op mij af, als door een wijde bres; onder de verwoesting rollen zij zich op mij aan.","15":"Men heeft zich met verschrikkingen tegen mij gekeerd; ieder vervolgt als een wind mijn edele *ziel*, en mijn heil is als een wolk voorbijgegaan.","16":"Daarom stort mijn ziel zich nu in mij uit; de dagen van het druk grijpen mij aan.","17":"'s Nachts doorboort Hij mijn beenderen in mij, en mijn polsaderen rusten niet.","18":"Door de veelheid van kracht is mijn kleed veranderd; Hij omgordt mij als de kraag van mijn rok.","19":"Hij heeft mij in het slijk geworpen, en ik ben geworden als stof en as.","20":"Ik schrei tot U, maar U antwoordt mij niet; ik sta, maar U let *niet* op mij.","21":"U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.","22":"U heft mij op in de wind; U doet mij *daarop* rijden, en U doet mijn wezen versmelten.","23":"Want ik weet dat U mij ter dood zult brengen, en tot het huis der samenkomst van alle levenden.","24":"Maar Hij zal tot de aardhoop de hand niet uitsteken; is er bij hen geschrei in zijn verdrukking?","25":"Weende ik niet over hem die harde dagen had? Was mijn ziel niet beangst over de nooddruftige?","26":"*Nochtans*, toen ik het goede verwachtte, kwam het kwade; toen ik hoopte naar het licht, kwam de donkerheid.","27":"Mijn ingewand ziedt, en is niet stil; de dagen van de verdrukking zijn mij voorgekomen.","28":"Ik ga zwart daarheen, niet van de zon; opstaande schreeuw ik in de gemeente.","29":"Ik ben de jakhalzen een broeder geworden, en een metgezel van de jonge struisvogels.","30":"Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorheid.","31":"Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen."},"SV":{"1":"Maar nu lachen over mij minderen dan ik van dagen, welker vaderen ik versmaad zou hebben, om bij de honden mijner kudde te stellen.","2":"Waartoe zou mij ook geweest zijn de krachten hunner handen? Zij was *door* ouderdom in hen vergaan.","3":"Die door gebrek en honger eenzaam waren, vliedende naar dorre plaatsen, *in* *het* donkere, woeste en verwoeste.","4":"Die ziltige kruiden plukten bij de struiken, en welker spijze was de wortel der jeneveren.","5":"Zij werden uit het midden uitgedreven; (men jouwde over hen, als *over* een dief),","6":"Opdat zij wonen zouden in de kloven der dalen, de holen des stofs en der steenrotsen.","7":"Zij schreeuwden tussen de struiken; onder de netelen vergaderden zij zich.","8":"Zij waren kinderen der dwazen, en kinderen van geen naam; zij waren geslagen uit den lande.","9":"Maar nu ben ik hun een snarenspel geworden, en ik ben hun tot een klapwoord.","10":"Zij hebben een gruwel aan mij, zij maken zich verre van mij, ja, zij onthouden het speeksel niet van mijn aangezicht.","11":"Want Hij heeft mijn zeel losgemaakt, en mij bedrukt; daarom hebben zij den breidel voor mijn aangezicht afgeworpen.","12":"Ter rechterhand staat de jeugd op, stoten mijn voeten uit, en banen tegen mij hun verderfelijke wegen.","13":"Zij breken mijn pad af, zij bevorderen mijn ellende; zij hebben geen helper *van* *doen*.","14":"Zij komen aan, als door een wijde breuk; onder de verwoesting rollen zij zich aan.","15":"Men is *met* verschrikkingen tegen mij gekeerd; elk een vervolgt als een wind mijn edele *ziel*, en mijn heil is als een wolk voorbijgegaan.","16":"Daarom stort zich nu mijn ziel in mij uit; de dagen des druks grijpen mij aan.","17":"Des nachts doorboort Hij mijn beenderen in mij, en mijn polsaderen rusten niet.","18":"Door de veelheid der kracht is mijn kleed veranderd; Hij omgordt mij als de kraag mijns roks.","19":"Hij heeft mij in het slijk geworpen, en ik ben gelijk geworden als stof en as.","20":"Ik schrei tot U, maar Gij antwoordt mij niet; ik sta, maar Gij acht *niet* op mij.","21":"Gij zijt veranderd in een wrede tegen mij; door de sterkte Uwer hand wederstaat Gij mij hatelijk.","22":"Gij heft mij op in den wind; Gij doet mij *daarop* rijden, en Gij versmelt mij het wezen.","23":"Want ik weet, dat Gij mij ter dood brengen zult, en tot het huis der samenkomst aller levenden.","24":"Maar Hij zal tot den aardhoop de hand niet uitsteken; is er bij henlieden geschrei in zijn verdrukking?","25":"Weende ik niet over hem, die harde dagen had? Was mijn ziel niet beangst over den nooddruftige?","26":"*Nochtans* toen ik het goede verwachtte, zo kwam het kwade; toen ik hoopte naar het licht, zo kwam de donkerheid.","27":"Mijn ingewand ziedt, en is niet stil; de dagen der verdrukking zijn mij voorgekomen.","28":"Ik ga zwart daarheen, niet van de zon; opstaande schreeuw ik in de gemeente.","29":"Ik ben den draken een broeder geworden, en een metgezel der jonge struisen.","30":"Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorrigheid.","31":"Hierom is mijn harp tot een rouwklage geworden, en mijn orgel tot een stem der wenenden."},"KJV":{"1":"But now *they that are* younger than I have me in derision, whose fathers I would have disdained to have set with the dogs of my flock.","2":"Yea, whereto *might* the strength of their hands *profit* me, in whom old age was perished?","3":"For want and famine *they were* solitary; fleeing into the wilderness in former time desolate and waste.","4":"Who cut up mallows by the bushes, and juniper roots *for* their meat.","5":"They were driven forth from among *men*, (they cried after them as *after* a thief;)","6":"To dwell in the clifts of the valleys, *in* caves of the earth, and *in* the rocks.","7":"Among the bushes they brayed; under the nettles they were gathered together.","8":"*They were* children of fools, yea, children of base men: they were viler than the earth.","9":"And now am I their song, yea, I am their byword.","10":"They abhor me, they flee far from me, and spare not to spit in my face.","11":"Because he hath loosed my cord, and afflicted me, they have also let loose the bridle before","12":"Upon *my* right *hand* rise the youth; they push away my feet, and they raise up against me the ways of their destruction.","13":"They mar my path, they set forward my calamity, they have no helper.","14":"They came *upon me* as a wide breaking in *of waters*: in the desolation they rolled","15":"Terrors are turned upon me: they pursue my soul as the wind: and my welfare passeth away as a cloud.","16":"And now my soul is poured out upon me; the days of affliction have taken hold","17":"My bones are pierced in me in the night season: and my sinews take no rest.","18":"By the great force *of my disease* is my garment changed: it bindeth me about as the collar of my coat.","19":"He hath cast me into the mire, and I am become like dust and ashes.","20":"I cry unto thee, and thou dost not hear me: I stand up, and thou regardest","21":"Thou art become cruel to me: with thy strong hand thou opposest","22":"Thou liftest me up to the wind; thou causest me to ride *upon it*, and dissolvest my substance.","23":"For I know *that* thou wilt bring me *to* death, and *to* the house appointed for all living.","24":"Howbeit he will not stretch out *his* hand to the grave, though they cry in his destruction.","25":"Did not I weep for him that was in trouble? was *not* my soul grieved for the poor?","26":"When I looked for good, then evil came *unto me*: and when I waited for light, there came darkness.","27":"My bowels boiled, and rested not: the days of affliction prevented","28":"I went mourning without the sun: I stood up, *and* I cried in the congregation.","29":"I am a brother to dragons, and a companion to owls.","30":"My skin is black upon me, and my bones are burned with heat.","31":"My harp also is *turned* to mourning, and my organ into the voice of them that weep."}},"tsk":{"1":[{"kopje":"die jonger zijn","refs":["Job 19:13-19","Job 29:8-10","2 Kon 2:23","Jes 3:5"]},{"kopje":"van wie","refs":["Ps 35:15","Ps 35:16","Ps 69:13","Mark 14:65","Mark 15:17-20","Luk 23:14","Luk 23:18","Luk 23:35","Luk 23:39","Hand 17:5","Tit 1:12"]}],"3":[{"kopje":"eenzaam","refs":["Job 24:13-16"]},{"kopje":"vluchtend naar","refs":["Job 24:5","Hebr 11:38"]}],"4":[{"kopje":"voedsel","refs":["2 Kon 4:38","2 Kon 4:39","Amos 7:14","Luk 15:16"]}],"5":[{"kopje":"weggejaagd","refs":["Gen 4:12-14","Ps 109:10","Dan 4:25","Dan 4:32","Dan 4:33"]}],"6":[{"kopje":"wonen","refs":["Richt 6:2","1 Sam 22:1","1 Sam 22:2","Jes 2:19","Openb 6:15"]}],"7":[{"kopje":"schreeuwden","refs":["Job 6:5","Job 11:12","Gen 16:12"]},{"kopje":"de netels","refs":["Spr 24:31","Zef 2:9"]}],"8":[{"kopje":"kinderen","refs":["2 Kon 8:18","2 Kon 8:27","2 Kron 22:3","Ps 49:11-14","Jer 7:18","Mark 6:24"]},{"kopje":"dwazen","refs":["Spr 1:7","Spr 1:22","Spr 16:22"]},{"kopje":"verjaagd","refs":["Job 39:37","Ps 15:4","Jes 32:6"]}],"9":[{"kopje":"ben ik","refs":["Job 17:6","Ps 35:15","Ps 35:16","Ps 44:15","Ps 69:13","Klaagl 3:14","Klaagl kjv\" data-code=\"H5549\">up</span> against me the <span class=\"wl wl-kjv\" data-code=\"H734\">ways</span> of their destruction.","13":"They <span class=\"wl wl-kjv\" data-code=\"H5420\">mar</span> my <span class=\"wl wl-kjv\" data-code=\"H5410\">path,</span> they set <span class=\"wl wl-kjv\" data-code=\"H3276\">forward</span> my <span class=\"wl wl-kjv\" data-code=\"H1942\">calamity,</span> they have no helper.","14":"They <span class=\"wl wl-kjv\" data-code=\"H857\">came</span> upon me as a <span class=\"wl wl-kjv\" data-code=\"H7342\">wide</span> <span class=\"wl wl-kjv\" data-code=\"H6556\">breaking</span> in of waters: <span class=\"wl wl-kjv\" data-code=\"H8478\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H7722\">desolation</span> they rolled","15":"<span class=\"wl wl-kjv\" data-code=\"H1091\">Terrors</span> are <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> upon me: they <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> my <span class=\"wl wl-kjv\" data-code=\"H5082\">soul</span> as the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind:</span> and my <span class=\"wl wl-kjv\" data-code=\"H3444\">welfare</span> passeth <span class=\"wl wl-kjv\" data-code=\"H5674\">away</span> as a cloud.","16":"And now my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> upon me; the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction</span> have taken hold","17":"My <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are <span class=\"wl wl-kjv\" data-code=\"H5365\">pierced</span> in me in the night <span class=\"wl wl-kjv\" data-code=\"H3915\">season:</span> and my <span class=\"wl wl-kjv\" data-code=\"H6207\">sinews</span> take no rest.","18":"By the <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">force</span> of my disease is my <span class=\"wl wl-kjv\" data-code=\"H3830\">garment</span> <span class=\"wl wl-kjv\" data-code=\"H2664\">changed:</span> it bindeth me <span class=\"wl wl-kjv\" data-code=\"H247\">about</span> as the <span class=\"wl wl-kjv\" data-code=\"H6310\">collar</span> of my coat.","19":"He hath <span class=\"wl wl-kjv\" data-code=\"H3384\">cast</span> me into the <span class=\"wl wl-kjv\" data-code=\"H2563\">mire,</span> and I am become <span class=\"wl wl-kjv\" data-code=\"H4911\">like</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> and ashes.","20":"I <span class=\"wl wl-kjv\" data-code=\"H7768\">cry</span> unto thee, and thou dost not <span class=\"wl wl-kjv\" data-code=\"H6030\">hear</span> me: I stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up,</span> and thou regardest","21":"Thou art <span class=\"wl wl-kjv\" data-code=\"H2015\">become</span> <span class=\"wl wl-kjv\" data-code=\"H393\">cruel</span> to me: with thy <span class=\"wl wl-kjv\" data-code=\"H6108\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> thou opposest","22":"Thou liftest me <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind;</span> thou causest me to <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> upon it, and <span class=\"wl wl-kjv\" data-code=\"H4127\">dissolvest</span> my <span class=\"wl wl-kjv\" data-code=\"H8454\">substance.</span>","23":"For I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou wilt <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> me to <span class=\"wl wl-kjv\" data-code=\"H4194\">death,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed</span> for all living.","24":"Howbeit he will not stretch <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to the <span class=\"wl wl-kjv\" data-code=\"H1164\">grave,</span> though they <span class=\"wl wl-kjv\" data-code=\"H7769\">cry</span> in his destruction.","25":"Did not I <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> for him that was in <span class=\"wl wl-kjv\" data-code=\"H7186\">trouble?</span> was not my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H5701\">grieved</span> for the poor?","26":"When I <span class=\"wl wl-kjv\" data-code=\"H6960\">looked</span> for <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> then <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto me: and when I <span class=\"wl wl-kjv\" data-code=\"H3176\">waited</span> for <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> darkness.","27":"My <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> <span class=\"wl wl-kjv\" data-code=\"H7570\">boiled,</span> and <span class=\"wl wl-kjv\" data-code=\"H1826\">rested</span> not: the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction</span> prevented","28":"I <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6937\">mourning</span> without the <span class=\"wl wl-kjv\" data-code=\"H2535\">sun:</span> I stood <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7768\">cried</span> in the congregation.","29":"I am a <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> to <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7453\">companion</span> to <span class=\"wl wl-kjv\" data-code=\"H1323\">owls.</span>","30":"My <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> is <span class=\"wl wl-kjv\" data-code=\"H7835\">black</span> upon me, and my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are <span class=\"wl wl-kjv\" data-code=\"H2787\">burned</span> with heat.","31":"My <span class=\"wl wl-kjv\" data-code=\"H3658\">harp</span> also is turned to <span class=\"wl wl-kjv\" data-code=\"H60\">mourning,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5748\">organ</span> into the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of them that weep."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"minderen","tekst":"Dat is, jonger van jaren. Alzo onder, Job 32:6 . Het woord dagen wordt ook nagelaten, dezelfde zin blijvende; Gen 19:31 , en Gen 48:14 ; Jos 6:26 ; Jdg 6:15 . Alzo grote voor oude; 1Sa 17:28 , en onder, Job 32:9 ."},{"catchword":"om bij de honden","tekst":"Dat is, om acht te nemen over de honden, die mijn schapen en geiten bewaarden."}],"2":[{"catchword":"hunner handen?","tekst":"Dat is, huns lichaams."},{"catchword":"Zij was","tekst":"Te weten, de kracht. Anders, de ouderdom was aan hen verloren; dat is, de oude jaren waren in hen vruchteloos, zijnde zonder verstand en voorzichtigheid, die in de oude lieden vereist worden."}],"3":[{"catchword":"gebrek","tekst":"Te weten, dat hun overkwam door hun onachtzaamheid en luiheid."},{"catchword":"dorre plaatsen,","tekst":"In welke zij verdreven waren als onwaardigen der mensen, of die zij zelf verkoren door schaamte en vrees, om uit aller lieden ogen te wezen."},{"catchword":"donkere,","tekst":"Het Hebreeuwse woord betekent eigenlijk den verleden nacht of avond, Gen 19:34 , maar hier is het voor donkerheid of donkere plaatsen genomen, als dikke bossen, spelonken, woeste en ruige heiden, die ver van de woningen der mensen afgezonderd zijn. Anders, eertijds woest, enz."},{"catchword":"woeste","tekst":"Deze twee woorden zijn samengevoegd om een grote woestheid daarmede uit te drukken. Alzo onder, Job 38:27 ; Zep 1:15 ."}],"4":[{"catchword":"ziltige kruiden","tekst":"Dat is, die in zoutachtige aarde groeien. Anders, pappel of wilde kruiden."},{"catchword":"jeneveren","tekst":"Zie 1Ki 19:4 , en de aantekening. Hij wil zeggen dat zij gegeten hebben hetgeen anders niet eetbaar was. Anders, de jeneverwortel was om [hen] te warmen. Vergelijk Isa 47:14 , waar het Hebreeuwse woord alzo gebruikt wordt."}],"5":[{"catchword":"het midden","tekst":"Te weten, der steden of der mensen; omdat men een mistrouwen en kwaad vermoeden van hen had. Anders, uit het gezelschap; te weten, der mensen."}],"7":[{"catchword":"Zij schreeuwden","tekst":"Te weten, uit het gevoelen van hun nood, ruchelende als woudezels, die hongerig zijn; in welken zin dit woord gebruikt wordt boven, Job 6:5 en een ander woord, dit zeer gelijk, boven, Job 24:12 ."},{"catchword":"vergaderden","tekst":"Te weten, om daar te schuilen, of gezocht werden. Anders, verzengden, of wondden zich; te weten, aan de netels, die door haar brand de lichamen dezer lieden met hittige pukkels en puisten deden uitlopen."}],"8":[{"catchword":"dwazen,","tekst":"Zie de betekenis van dit woord 1Sa 25:25 . Anders, zij waren dwaze lieden, ja lieden zonder naam."},{"catchword":"van geen naam;","tekst":"Dat is, zonder eer en achting in de wereld. Het tegendeel zijn mannen van naam. Zie Gen 6:4 , en de aantekening."},{"catchword":"zij waren geslagen","tekst":"Dat is, verdreven en uitgesmeten. Anders, verworpener, of, nedergedrukter dan de aarde; te weten, door der mensen verachting."}],"9":[{"catchword":"hun een snarenspel","tekst":"Dat is, waarvan zij zingen, spelen en klappen, blijde zijnde over mijn ellende en daarmede den spot drijvende. Vergelijk boven, Job 17:2 , Job 17:5-6 ; Psa 35:15 , en Psa 69:13 ; Lam 3:14 ; Eze 33:32 ."}],"10":[{"catchword":"ja, zij onthouden","tekst":"Iemand te bespuwen is altijd een teken geweest van grote verachting. Vergelijk Num 12:14 ; Deu 25:9 ; Isa 50:6 ; Mat 26:67 ."}],"11":[{"catchword":"Hij heeft","tekst":"Namelijk God. Zie boven, Job 3:20 . Alzo onder, vs.18, 20."},{"catchword":"zeel","tekst":"Dat is, mijn aanzien en autoriteit, waarmede ik de mijnen bedwongen en als in den toom gehouden heb, heeft Hij mij gans ontnomen."},{"catchword":"zij den","tekst":"Te weten, de bozen, die mij nu tegenvallen en de behoorlijke eer weigeren."},{"catchword":"breidel","tekst":"Door welken zij van mij in orde gehouden werden."},{"catchword":"voor mijn aangezicht","tekst":"Dat is, in mijn tegenwoordigheid. De zin is dat zij zich in het aanzien zelfs van Job ontbonden en onttrokken aan den plicht der eerbieding en gehoorzaamheid, die zij hem schuldig waren."}],"12":[{"catchword":"Ter rechterhand","tekst":"Dat is, daar hij de meeste sterkte had."},{"catchword":"jeugd op,","tekst":"Het woord heeft zijn oorsprong van spruiten en bloeien, betekenende de eerste groenende jeugd. Hij ziet op degenen, die hem in zijn lijden met de allermeeste onverstandigheid, felheid en heftigheid overvielen."},{"catchword":"stoten","tekst":"Te weten, om mij te doen struikelen en te gronde te storten."},{"catchword":"banen","tekst":"Dat is, zij hogen en maken den weg effen, dien zij ingaan en betreden willen om mij te verderven. Hebreeuws, paden huns verderfs."}],"13":[{"catchword":"Zij breken","tekst":"Dat is, den raad en de orde, die ik volgen moet, om mij in dit lijden wel te gedragen, beroeren zij zo met hun twistingen, dat ik niet weet wat ik voornemen, of spreken, of doen zal."},{"catchword":"zij bevorderen","tekst":"Dat is, zij vermeerderen haar, te weten met hun verkeerd oordeel, valse beschuldigingen en bittere lasteringen."},{"catchword":"geen helper","tekst":"Te weten, om hun kwaad voornemen tegen mij uit te voeren. Zij zijn daartoe mans genoeg van zichzelven."}],"14":[{"catchword":"Zij komen aan,","tekst":"Te weten, tegen mij. Het is een gelijkenis, genomen van de krijgslieden, die door de bres, die zij in den muur ener stad gemaakt hebben, met groot geweld en gedruis de inwoners pogen te overvallen."},{"catchword":"onder","tekst":"Dat is, onder mijn benden hebben zij gewoeld en gearbeid, om die meerder te maken en met dezelve mij te overstorten en te gronde te brengen."}],"15":[{"catchword":"edele ziel,","tekst":"Anders, vorstin, of milddadige, of vrijwillige, of voorname. Versta, de ziel, die de eer des mensen genoemd wordt, Gen 49:6 , en de enige, Psa 22:21 ; zie de aantekening."}],"16":[{"catchword":"stort zich","tekst":"Dat is, mijn leven gaat uit, versmelt in tranen en wordt verteerd door droefenis. Alzo Psa 42:5 ."},{"catchword":"des druks","tekst":"Dat is, in welke mij druk en groot lijden overvallen; die elders ook genaamd worden dagen der benauwdheid, 2Ki 19:3 , der duisternis, boven, Job 15:23 , der bezoeking en verwoesting, Isa 10:3 , der bestraffing, Hos 5:9 ."}],"17":[{"catchword":"Hij mijn beenderen","tekst":"Namelijk, God, gelijk boven, vs.11, en in het volgende, te weten, omdat Hij hem ook des nachts, als anderen rusten, geen rust liet genieten door het geweld zijner ziekte, hetwelk indrong tot de sterkste en binnenste delen des lichaams. Vergelijk boven, Job 7:3 , Job 7:14 , en Job 17:12 ."},{"catchword":"in mij,","tekst":"Hebreeuws, van boven mij; dat is, uit den hemel, vanwaar Hij zijn plagen op mij zendt."}],"18":[{"catchword":"de veelheid","tekst":"Te weten, die God tegen mij aanlegt om mijn lichaam met ongezondheid te ontstellen en te mismaken."},{"catchword":"veranderd;","tekst":"Te weten, door de vlekken van etter en bloed, vloeiende uit mijn gezwellen en verzweringen."},{"catchword":"Hij omgordt","tekst":"Namelijk, God."},{"catchword":"kraag","tekst":"Hebreeuws, de mond. De zin is, gelijk het opperste en het hol des roks, waardoor het hoofd gestoken wordt, alzo omgordt de Heere mijn lichaam met smarten."}],"19":[{"catchword":"slijk","tekst":"Dat is, in de uiterste versmaadheid. Het woord slijk is in gelijken zin genomen Psa 40:3 , en Psa 69:15 ; Mic 7:10 ."},{"catchword":"aan stof","tekst":"Zie Gen 18:27 , en de aantekening."}],"20":[{"catchword":"U,","tekst":"Namelijk, o God."},{"catchword":"sta,","tekst":"Te weten, verwachtende uw hulp, of U biddende."},{"catchword":"maar Gij acht","tekst":"Anders, en Gij merkt op mij, te weten, zonder barmhartigheid, gelijk in vs.21."}],"21":[{"catchword":"veranderd","tekst":"Tegen uw natuur en gewoonte."},{"catchword":"wederstaat","tekst":"Vergelijk boven, Job 13:24 , en Job 16:9 ; Jer 30:14 ."}],"22":[{"catchword":"heft","tekst":"Dat is, slingert mij naar lijf en ziel, door uw gramschap, gelijk stro en stoppel door een geweldigen wind opgeheven, verstrooid en overeen gerold worden."},{"catchword":"het wezen","tekst":"Dat is, mijn leven en krachten. Zie van het Hebreeuwse woord boven, Job 5:12 ."}],"23":[{"catchword":"huis der samenkomst","tekst":"Dat is, tot het graf, of de plaats, die den doden lichamen tot den dag der verrijzenis van God bestemd is. Anders, het huis der bestemming; dat is, het bestemde huis."},{"catchword":"aller levenden","tekst":"Te weten, mensen. Alzo Psa 143:2 ."}],"24":[{"catchword":"Hij zal","tekst":"Namelijk, God."},{"catchword":"tot een aardhoop","tekst":"Dat is, tot degenen, die in de aarde begraven liggen."},{"catchword":"niet uitsteken;","tekst":"Te weten, om die daaronder liggen hier nog naar het lichaam te plagen. Hij wil zeggen dat het lijden dezes tijds eindigt met den lichamelijken dood, en dat hij dienvolgens met dien ontslagen zou zijn van het tegenwoordig verdriet. Vergelijk boven, Job 7:21 , en Job 14:21 ."},{"catchword":"henlieden","tekst":"Te weten, bij de dode lichamen, die in de graven liggen."},{"catchword":"zijn verdrukking","tekst":"Dat is, waarmede God die verdrukt heeft, te weten als Hij door den dood de lichamen derzelven te gronde geworpen heeft. Is dan [wil Job zeggen] in de lichamen, die in het graf verbroken liggen, nog enige geschrei vanwege het lijden, dat zij daar nog zouden hebben? Hij verstaat: Neen; gelijk de ervaring leert."}],"25":[{"catchword":"Weende","tekst":"Deze vraag verzekert sterkelijk dat hij zulks gedaan had. Of het is een soort van eedzweren, waarin de straf, die hij wenste, verzwegen wordt, indien hij het g /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
