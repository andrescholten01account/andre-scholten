en welker spijze was de wortel der jeneveren.", "5": "Zij werden uit het midden uitgedreven; (men jouwde over hen, als *over* een dief),", "6": "Opdat zij wonen zouden in de kloven der dalen, de holen des stofs en der steenrotsen.", "7": "Zij schreeuwden tussen de struiken; onder de netelen vergaderden zij zich.", "8": "Zij waren kinderen der dwazen, en kinderen van geen naam; zij waren geslagen uit den lande.", "9": "Maar nu ben ik hun een snarenspel geworden, en ik ben hun tot een klapwoord.", "10": "Zij hebben een gruwel aan mij, zij maken zich verre van mij, ja, zij onthouden het speeksel niet van mijn aangezicht.", "11": "Want Hij heeft mijn zeel losgemaakt, en mij bedrukt; daarom hebben zij den breidel voor mijn aangezicht afgeworpen.", "12": "Ter rechterhand staat de jeugd op, stoten mijn voeten uit, en banen tegen mij hun verderfelijke wegen.", "13": "Zij breken mijn pad af, zij bevorderen mijn ellende; zij hebben geen helper *van* *doen*.", "14": "Zij komen aan, als door een wijde breuk; onder de verwoesting rollen zij zich aan.", "15": "Men is *met* verschrikkingen tegen mij gekeerd; elk een vervolgt als een wind mijn edele *ziel*, en mijn heil is als een wolk voorbijgegaan.", "16": "Daarom stort zich nu mijn ziel in mij uit; de dagen des druks grijpen mij aan.", "17": "Des nachts doorboort Hij mijn beenderen in mij, en mijn polsaderen rusten niet.", "18": "Door de veelheid der kracht is mijn kleed veranderd; Hij omgordt mij als de kraag mijns roks.", "19": "Hij heeft mij in het slijk geworpen, en ik ben gelijk geworden als stof en as.", "20": "Ik schrei tot U, maar Gij antwoordt mij niet; ik sta, maar Gij acht *niet* op mij.", "21": "Gij zijt veranderd in een wrede tegen mij; door de sterkte Uwer hand wederstaat Gij mij hatelijk.", "22": "Gij heft mij op in den wind; Gij doet mij *daarop* rijden, en Gij versmelt mij het wezen.", "23": "Want ik weet, dat Gij mij ter dood brengen zult, en tot het huis der samenkomst aller levenden.", "24": "Maar Hij zal tot den aardhoop de hand niet uitsteken; is er bij henlieden geschrei in zijn verdrukking?", "25": "Weende ik niet over hem, die harde dagen had? Was mijn ziel niet beangst over den nooddruftige?", "26": "*Nochtans* toen ik het goede verwachtte, zo kwam het kwade; toen ik hoopte naar het licht, zo kwam de donkerheid.", "27": "Mijn ingewand ziedt, en is niet stil; de dagen der verdrukking zijn mij voorgekomen.", "28": "Ik ga zwart daarheen, niet van de zon; opstaande schreeuw ik in de gemeente.", "29": "Ik ben den draken een broeder geworden, en een metgezel der jonge struisen.", "30": "Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorrigheid.", "31": "Hierom is mijn harp tot een rouwklage geworden, en mijn orgel tot een stem der wenenden."}, "KJV": {"1": "But now *they that are* younger than I have me in derision, whose fathers I would have disdained to have set with the dogs of my flock.", "2": "Yea, whereto *might* the strength of their hands *profit* me, in whom old age was perished?", "3": "For want and famine *they were* solitary; fleeing into the wilderness in former time desolate and waste.", "4": "Who cut up mallows by the bushes, and juniper roots *for* their meat.", "5": "They were driven forth from among *men*, (they cried after them as *after* a thief;)", "6": "To dwell in the clifts of the valleys, *in* caves of the earth, and *in* the rocks.", "7": "Among the bushes they brayed; under the nettles they were gathered together.", "8": "*They were* children of fools, yea, children of base men: they were viler than the earth.", "9": "And now am I their song, yea, I am their byword.", "10": "They abhor me, they flee far from me, and spare not to spit in my face.", "11": "Because he hath loosed my cord, and afflicted me, they have also let loose the bridle before", "12": "Upon *my* right *hand* rise the youth; they push away my feet, and they raise up against me the ways of their destruction.", "13": "They mar my path, they set forward s hij voortgekomen is uit de buik van zijn moeder, zo zal hij naakt terugkeren, gaande zoals hij gekomen was; en hij zal niets van zijn arbeid meenemen, dat hij met zijn hand zou kunnen wegdragen.", "Spr 20:13": "Heb de slaap niet lief, opdat u niet arm wordt; open uw ogen, verzadig u met brood.", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Jer 4:11": "In die tijd zal tegen dit volk en tegen Jeruzalem gezegd worden: Een dorre wind van de hoge plaatsen in de woestijn, op de weg naar de dochter van Mijn volk; niet om te wannen, of om te zuiveren.", "Job 6:1-30": "Maar Job antwoordde en zei: Och, of mijn verdriet grondig gewogen werd, en men mijn ellende samen in een weegschaal ophief! Want het zou nu zwaarder zijn dan het zand der zeeën; daarom worden mijn woorden opgezwolgen.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Zef 2:9": "Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten.", "Job 13:26": "Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven.", "Ezech 37:8": "En ik zag, en zie, er kwamen zenuwen op hen, en er kwam vlees op; en Hij trok een huid van boven over hen, maar er was geen geest in hen.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Job 3:1-26": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Jer 4:12": "Er zal Mij een wind komen, die hun te sterk zal zijn. Nu zal Ik ook een oordeel tegen hen uitspreken.", "Job 34:9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "Matt 25:42": "Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven;", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "1 Kon 3:26": "Maar de vrouw wier zoon de levende was, sprak tot de koning (want haar ingewanden ontstaken vanwege haar zoon), en zei: Och, mijn heer! Geef haar dat levende kind, en dood het geenszins; de andere zei daarentegen: Het zal noch van u noch van mij zijn, snijd het doormidden.", "Job 7:8-10": "Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn. Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen. Hij zal niet meer terugkeren naar zijn huis, en zijn plaats zal hem niet meer kennen.", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Ps 35:16": "Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "1 Kon 1:40": "En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Klaagl 3:8": "Gimel. Ook wanneer ik roep en schreeuw, sluit Hij Zijn oren voor mijn gebed.", "Spr 16:22": "Het verstand van hen die het bezitten is een bron van leven; maar de tucht van de dwazen is dwaasheid.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "Spr 29:14": "Een koning die de armen in trouw recht doet, diens troon zal voor eeuwig bevestigd worden.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Job 5:7": "Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen.", "Spr 15:20": "Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Job 13:7-9": "Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken? Zult u Zijn aangezicht aannemen? Zult u voor God twisten? Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?", "Job 20:11": "Zijn beenderen zullen vol zijn van zijn zonden uit zijn jeugd; die zullen met hem in het stof neerliggen.", "Jak 3:18": "En de vrucht van de gerechtigheid wordt in vrede gezaaid voor hen die vrede stichten.", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "2 Kron 5:12": "en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);", "Job 9:34": "Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;", "Hebr 9:27": "En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;", "Jes 36:20": "Welke zijn er onder al de goden van deze landen, die hun land uit mijn hand gered hebben, zodat de HEERE Jeruzalem uit mijn hand zou redden?", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Ps 88:16": "Van jongs af aan ben ik bedrukt en aan het sterven; ik draag Uw verschrikkingen, ik ben radeloos.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Pred 2:23": "Want al zijn dagen zijn smarten, en zijn bezigheid is verdriet; zelfs 's nachts vindt zijn hart geen rust. Dat is ook ijdelheid.", "Matt 8:14": "En toen Jezus in het huis van Petrus gekomen was, zag Hij de moeder van diens vrouw met koorts te bed liggen.", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Spr 18:14": "De geest van een man zal zijn ziekte dragen; maar een verslagen geest, wie zal die opheffen?", "Matt 27:39-44": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Jer 8:15": "Men wacht op vrede, maar er is niets goeds, op een tijd van genezing, maar zie, er is verschrikking.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Job 9:31": "Dan zult U mij in de gracht dompelen, en mijn kleren zullen van mij walgen.", "Ps 135:3": "Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Ps 144:11": "Bevrijd mij en red mij van de hand van vreemden, wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is;", "Job 17:16": "Zij zullen mee naar beneden gaan met de grendels van het graf, als er rust samen in het stof zal zijn.", "2 Sam 19:35": "Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "2 Kron 20:19": "En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.", "1 Tess 1:8": "Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "Ps 69:13": "Die in de poort zitten, praten over mij; en ik ben een lied voor hen die sterke drank drinken.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "Matt 15:23": "Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "Mark 14:65": "En sommigen begonnen Hem te bespuwen, en Zijn gezicht te bedekken, en Hem met vuisten te slaan, en tegen Hem te zeggen: Profeteer! En de dienaars gaven Hem klappen in het gezicht.", "2 Sam 16:5-8": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Job 16:11": "God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "Ps 18:5-7": "Banden van de dood hadden mij omvangen, en beken van Belial verschrikten mij. Banden van het graf omringden mij, strikken van de dood bejegenden mij. Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "1 Tim 6:7": "Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen.", "Job 3:5": "Dat de duisternis en de schaduw van de dood hem verontreinigen; dat wolken over hem wonen; dat hem verschrikken de zwarte dampen van de dag!", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "Gen 43:30": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.", "2 Sam 12:14": "Toch, omdat u door deze daad de vijanden van de HEERE ernstig hebt doen lasteren, zal ook de zoon die u geboren is, zeker sterven.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Luk 23:39": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons.", "Job 37:20": "Zal het Hem verteld worden, als ik zo zou spreken? Denkt iemand dat, zeker, hij zal verslonden worden.", "2 Kor 6:4-10": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Ps 55:5-9": "Mijn hart doet mij pijn in mijn binnenste, en verschrikkingen van de dood zijn op mij gevallen. Vrees en beving komen over mij, en gruwen overdekt mij; Zodat ik zeg: Och, kreeg ik maar vleugels als een duif! ik zou wegvliegen, waar ik blijven mocht.", "1 Kor 3:6-9": "Ik heb geplant, Apollos heeft nat gemaakt; maar God heeft de groei gegeven. Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft. En hij die plant en hij die nat maakt, zijn één; maar ieder zal zijn loon ontvangen naar zijn arbeid.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Lev 24:10-16": "En de zoon van een Israëlitische vrouw ging naar buiten – hij was, te midden van de Israëlieten, de zoon van een Egyptische man – en de zoon van deze Israëlitische vrouw en een Israëlitische man kregen ruzie in het kamp. Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan. En zij zetten hem in bewaring, totdat hun, naar de mond van de HEERE, uitspraak gedaan zou worden.", "Job 15:26": "Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;", "Joël 2:6": "Voor hun aangezicht zullen de volken pijn lijden; alle gezichten zullen bleek wegtrekken.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Jes 57:5": "U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen?", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Luk 6:30-35": "Maar geef ieder die het u vraagt; en van wie het uwe wegneemt, eis het niet terug. En zoals u wilt dat de mensen u doen, doe hun ook hetzelfde. En als u liefhebt wie u liefhebben, wat voor dank hebt u dan? Want ook de zondaars hebben lief wie hen liefhebben.", "Job 2:7": "Toen ging de satan weg van het aangezicht van de HEERE, en sloeg Job met kwaadaardige zweren, van zijn voetzool af tot zijn schedel toe.", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Job 36:8-12": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Mark 14:7": "Want de armen hebt u altijd bij u, en wanneer u wilt, kunt u hun goeddoen; maar Mij hebt u niet altijd.", "Jer 30:14": "Al uw minnaars hebben u vergeten, zij vragen niet naar u; want Ik heb u geslagen met de plaag van een vijand, met de kastijding van iemand wrede; om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn.", "Hos 4:19": "Een wind heeft hen gebonden in zijn vleugels, en zij zullen beschaamd worden vanwege hun offers.", "Jer 38:6": "Toen namen zij Jeremia en wierpen hem in de kuil van Malchia, de zoon van Hammelech, die in het voorhof van de bewaking was, en zij lieten Jeremia met touwen zakken; in de kuil nu was geen water, maar slijk; en Jeremia zonk in het slijk.", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Job 31:16-21": "Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten; En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft; (Want van mijn jonkheid af is hij bij mij opgetogen, als bij een vader, en van mijner moeders buik af heb ik haar geleid;)", "Spr 19:17": "Die zich ontfermt over de arme, leent aan de HEERE, en Hij zal hem zijn weldaad vergelden.", "Job 12:21": "Hij giet verachting uit over de prinsen, en Hij verslapt de riem van de geweldigen.", "Job 7:2-6": "Zoals de dienstknecht hijgt naar de schaduw, en zoals de dagloner uitkijkt naar zijn werkloon; Zo zijn mij maanden van ijdelheid ten erve geworden, en nachten van moeite zijn mij voorbereid. Als ik ga liggen om te slapen, dan zeg ik: Wanneer zal ik opstaan, en heeft Hij de avond afgemeten? En ik word verzadigd van woelingen tot aan de schemertijd.", "Job 14:19-21": "Het water vermaalt de stenen, het stof van de aarde overspoelt het gewas dat er zelf uit voortkomt; zo verderft U de verwachting van de mens. U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg. Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.", "Jes 8:21": "En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;", "Spr 13:12": "De uitgestelde hoop maakt het hart ziek; maar de begeerte die komt, is een boom des levens.", "Kol 3:12-14": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld; verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo. En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Joël 3:14": "Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing.", "1 Kor 15:55-57": "Dood, waar is uw prikkel? Graf, waar is uw overwinning? De prikkel van de dood nu is de zonde; en de kracht van de zonde is de wet. Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Klaagl 3:1-36": "Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid. Aleph. Hij heeft mij geleid en gevoerd in de duisternis, en niet in het licht. Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Luk 23:14": "U hebt deze Mens naar mij gebracht, als iemand die het volk afkerig maakt; en zie, ik heb Hem in uw tegenwoordigheid ondervraagd, en heb in deze Mens geen schuld gevonden van wat u Hem verwijt;", "Lev 26:16": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Job 7:20": "Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?", "Job 23:16": "Want God heeft mijn hart week gemaakt, en de Almachtige heeft mij ontsteld;", "Job 16:22": "Want er zullen nog maar weinige jaren in aantal aankomen, en ik zal het pad heengaan waardoor ik niet zal terugkeren.", "Ps 135:1": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE!", "Hebr 10:24": "en laten wij op elkaar letten, om elkaar aan te sporen tot liefde en goede werken;", "Ezra 2:64": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "Job 13:4-13": "Want zeker, u bent leugensmeders; u bent allemaal artsen van niets. Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen. Hoor toch mijn verdediging, en let op de twistingen van mijn lippen.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Ps 88:7": "U hebt mij in de onderste kuil gelegd, in duisternissen, in diepten.", "Pred 8:8": "Er is geen mens die macht heeft over de geest, om de geest tegen te houden; en hij heeft geen macht over de dag van de dood; er is ook geen vrijstelling in die strijd; en de goddeloosheid zal haar meesters niet redden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Spr 19:13": "Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.", "Ps 109:22-24": "Want ik ben ellendig en behoeftig, en mijn hart is in mijn binnenste doorwond. Ik ga heen als een schaduw wanneer die zich neigt; ik word omgedreven als een sprinkhaan. Mijn knieën struikelen van het vasten, en mijn vlees is vermagerd, zodat er geen vet aan is.", "Pred 7:15": "Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "2 Kon 4:38": "Toen Elisa weer in Gilgal kwam, was er honger in dat land, en de zonen der profeten zaten voor hem; en hij zei tegen zijn knecht: Zet de grote pot aan, en kook moes voor de zonen der profeten.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Spr 30:17": "Het oog dat de vader bespot, of de gehoorzaamheid aan de moeder veracht, dat zullen de raven van de beek uitpikken, en de jongen van de arend zullen het eten.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Job 13:25-28": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen? Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven. U legt ook mijn voeten in het blok, en let op al mijn paden; U drukt Uzelf in de hielen van mijn voeten,", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "1 Sam 20:3": "Toen zwoer David verder, en zei: Uw vader weet heel goed dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Ps 87:7": "En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.", "Mark 6:24": "En zij ging naar buiten en zei tegen haar moeder: Wat zal ik vragen? En die zei: Het hoofd van Johannes de Doper.", "Zach 5:3": "Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden.", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Job 10:14-17": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden. Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan. Want het verheft zich; als een felle leeuw jaagt U mij; U keert weer en stelt U wonderlijk tegen mij.", "Job 16:6-14": "Als ik spreek, wordt mijn smart niet ingehouden; en houd ik op, wat gaat er dan van mij weg? Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest. Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.", "Job 34:37": "Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "2 Kon 2:23": "En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!", "Ps 44:15": "U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.", "Ps 35:14": "Ik ging steeds als een vriend, als was hij mij een broeder geweest; ik ging gebukt in het zwart, als iemand die over zijn moeder treurt.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Lev 11:16": "En de struisvogel, en de nachtuil, en de koekoek, en de sperwer naar zijn soort;", "Jer 9:11": "En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Job 16:9-14": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij. Zij gapen met hun mond tegen mij; zij slaan met smaad op mijn kaken; zij verzamelen zich samen tegen mij. God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Hos 9:6": "Want zie, zij gaan weg vanwege de verwoesting; Egypte zal ze verzamelen, Memfis zal ze begraven; hun begeerlijke plaatsen voor hun zilver zullen door netels bezet worden, doornen zullen in hun tenten zijn.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Job 27:9": "Zal God zijn geroep horen, als benauwdheid over hem komt?", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Jes 26:17": "Zoals een zwangere vrouw, als zij nadert tot het baren, smarten heeft en schreeuwt in haar weeën, zo zijn wij geweest, o HEERE, vanwege Uw aangezicht.", "Ps 69:2": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel.", "Ezech 22:7": "Vader en moeder hebben zij in u licht geacht; met de vreemdeling hebben zij in uw midden door verdrukking gehandeld; zij hebben in u de wees en de weduwe verdrukt.", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "Jes 30:20": "De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Job 3:25": "Want ik vreesde een vrees, en zij is mij aangekomen; en wat ik schroomde, is mij overkomen.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Spr 18:23": "De arme spreekt smekingen; maar de rijke antwoordt harde dingen.", "Matt 25:34-46": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Job 24:5": "Zie, zij zijn woudezels in de woestijn; zij gaan uit tot hun werk, maken zich vroeg op om te roven; het vlakke veld is voedsel voor hem en voor de jongeren.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Rom 5:14": "Maar de dood heeft geheerst van Adam tot Mozes toe, ook over hen die niet gezondigd hadden op dezelfde manier als de overtreding van Adam, die een voorbeeld is van Hem die komen zou.", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "Jes 58:7": "Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt?", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Luk 23:39-43": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons. Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent? En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Ps 6:8": "Mijn oog is doorknaagd van verdriet, is verouderd, vanwege al mijn tegenstanders.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Openb 14:2": "En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;", "2 Kor 4:7-12": "Maar wij hebben deze schat in aarden vaten, opdat de uitnemendheid van de kracht van God zou zijn, en niet uit ons; Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "Job 29:8-10": "De jongens zagen mij en verstopten zich, en de stokouden stonden op en bleven staan. De leiders hielden hun woorden in, en legden de hand op hun mond. De stem van de vorsten verstomde, en hun tong kleefde aan hun gehemelte.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Pred 7:2-4": "Het is beter te gaan in het klaaghuis, dan te gaan in het huis van het maaltijd; want daarin is het einde van alle mensen, en de levende legt het in zijn hart. Het treuren is beter dan het lachen; want door de droefheid van het aangezicht wordt het hart gebeterd. Het hart van de wijzen is in het klaaghuis; maar het hart van de dwazen in het huis van de vreugde.", "Pred 7:2": "Het is beter te gaan in het klaaghuis, dan te gaan in het huis van het maaltijd; want daarin is het einde van alle mensen, en de levende legt het in zijn hart.", "Jes 34:11": "Maar de roerdomp en de nachtuil zullen het erfelijk bezitten, en de uil en de raaf zullen daarin wonen; want Hij zal een meetsnoer van woestheid over hen trekken, en een dieplood van leegte.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Job 7:5": "Mijn vlees is met het gewormte en met het gruis van het stof bekleed; mijn huid is gekliefd en verachtelijk geworden.", "Spr 7:7": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling;", "Job 19:19": "Alle mensen van mijn heimelijke raad hebben een afkeer van mij; en degenen die ik liefhad, zijn tegen mij gekeerd.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Spr 21:13": "Wie zijn oor stopt voor het geschrei van de arme, die zal ook roepen, en niet verhoord worden.", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Pred 2:22": "Wat heeft die mens toch van al zijn arbeid en van de kwellingen van zijn hart, waarmee hij zich aftobt onder de zon?", "Ezech 33:32": "En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Job 12:5": "Hij is een verachte fakkel, naar de mening van hem die gerust is; hij is gereed om met de voet te struikelen.", "Job 18:18": "Men zal hem stoten van het licht in de duisternis, en men zal hem uit de wereld verjagen.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Deut 27:16": "Vervloekt is hij die zijn vader of zijn moeder veracht! En heel het volk zal zeggen: Amen.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Zef 1:14": "De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Job 23:17": "Omdat ik niet weggevaagd ben vóór de duisternis, en Hij van mijn aangezicht de donkerheid niet bedekt heeft.", "2 Kon 19:22": "Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Spr 19:22": "De wens van de mens is zijn weldadigheid; maar de arme is beter dan een leugenachtig man.", "Job 18:6": "Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Matt 14:31": "En Jezus stak meteen Zijn hand uit, greep hem vast, en zei tegen hem: Kleingelovige! Waarom heb je getwijfeld?", "Ezech 33:17-20": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is. Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven. En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Job 10:8": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij.", "Job 12:14-25": "Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden. Zie, Hij houdt de wateren tegen, en zij drogen uit; ook laat Hij ze los, en zij keren de aarde om. Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Hand 28:8": "En het gebeurde dat de vader van Publius met koorts en buikloop te bed lag; Paulus ging naar hem toe, en nadat hij gebeden had, legde hij hem de handen op en maakte hem gezond.", "Jak 1:9": "Maar de broeder die nederig is, moet roemen in zijn hoogheid.", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Job 33:19-22": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel; Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Klaagl 3:17": "Vau. En U hebt mijn ziel ver van de vrede verstoten, ik heb het goede vergeten.", "Gal 6:4": "Maar ieder moet zijn eigen werk beproeven; en dan zal hij aan zichzelf alleen roem hebben, en niet aan een ander.", "Joël 2:10": "De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.", "Ps 144:8": "wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "Neh 12:27-31": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Spr 28:24": "Wie zijn vader of zijn moeder berooft, en zegt: Het is geen overtreding; die is de metgezel van een verwoestend man.", "Jak 1:22-27": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "Job 10:16": "Want het verheft zich; als een felle leeuw jaagt U mij; U keert weer en stelt U wonderlijk tegen mij.", "Klaagl 1:20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.", "Job 6:5": "Balkt ook de woudezel bij het jonge gras? Loeit de os bij zijn voeder?", "Spr 28:6": "De arme, die in zijn oprechtheid wandelt, is beter dan wie verkeerd is van wegen, al is hij rijk.", "Job 33:19-21": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel; Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Hand 10:38": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Job 21:18": "Dat zij worden als stro voor de wind, en als kaf, dat de wervelwind wegsteelt;", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Ps 103:14-16": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn. De dagen van de mens zijn als het gras, zoals een bloem van het veld, zo bloeit hij. Als de wind daarover gegaan is, is hij er niet meer, en zijn plaats kent hem niet meer.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Ps 107:5": "Zij waren hongerig, ook dorstig; hun ziel was in hen overstelpt.", "Ps 89:39-46": "Maar Gij hebt hem verstoten en verworpen; Gij bent verbolgen geworden tegen Uw gezalfde. Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen.", "Jes 38:10-13": "Ik zei: Vanwege het afsnijden van mijn dagen zal ik naar de poorten van het graf gaan, ik word beroofd van wat er nog over is van mijn jaren. Ik zei: Ik zal de HEERE niet meer zien, de HEERE, in het land van de levenden; ik zal de mensen niet meer aanschouwen met de inwoners van de wereld. Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever zijn weefsel; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "2 Kron 23:13": "En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Ps 78:31-34": "Toen Gods toorn tegen hen opging, zodat Hij van hun vetste doodde, en de uitgelezen mannen van Israël neervelde. Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen. Daarom liet Hij hun dagen vergaan in ijdelheid, en hun jaren in verschrikking.", "Lev 22:32": "En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Job 21:33": "De kluiten van het dal zijn hem zoet, en hij trekt achter zich alle mensen aan; en van hen die vóór hem geweest zijn, is geen getal.", "Zach 1:15": "En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "2 Kron 7:12-22": "En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis. Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ezech 35:13": "Zo hebt u zich met uw mond tegen Mij groot gemaakt, en uw woorden tegen Mij vermenigvuldigd; Ik heb het gehoord.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "Job 19:6-9": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft. Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht. Hij heeft mijn weg toegemuurd, zodat ik niet door kan gaan, en over mijn paden heeft Hij duisternis gesteld.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "Job 34:5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "1 Sam 22:1": "Toen ging David vandaar weg, en ontkwam naar de spelonk van Adullam. En zijn broers hoorden het, en het hele huis van zijn vader, en ze kwamen daarheen naar hem toe.", "Jes 38:1": "In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.", "Spr 28:19": "Wie zijn land bouwt, zal met brood verzadigd worden; maar wie nietige mensen volgt, zal met armoede verzadigd worden.", "Jes 37:10": "Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.", "Luk 16:20": "En er was een zekere bedelaar, met de naam Lazarus, die voor zijn poort lag, vol zweren;", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "Fil 1:8": "Want God is mijn Getuige, hoezeer ik verlang naar u allen, met de innerlijke bewogenheid van Jezus Christus.", "Matt 10:25": "Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Ezech 5:2": "Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Ps 40:13": "Want kwaden, tot zonder getal toe, hebben mij omgeven; mijn ongerechtigheden hebben mij aangegrepen, zodat ik niet heb kunnen zien; ze zijn menigvuldiger dan de haren van mijn hoofd, en mijn hart heeft mij verlaten.", "Openb 16:11": "En zij lasterden de God van de hemel vanwege hun pijnen, en vanwege hun gezwellen; en zij bekeerden zich niet van hun werken.", "Ps 22:15": "Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "Spr 17:21": "Wie een dwaas voortbrengt, die zal hem tot droefheid zijn; en de vader van de dwaas zal zich niet verblijden.", "Spr 17:5": "Die de arme bespot, smaadt zijn Maker; die zich verblijdt in het ongeluk van een ander, zal niet onschuldig blijven.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "2 Kor 9:8": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.", "Klaagl 4:8": "Cheth. Maar nu is hun gedaante donkerder dan roet, men herkent hen niet op de straten; hun huid kleeft aan hun beenderen, zij is verdord, zij is geworden als hout.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Ex 23:3": "Ook zult u de arme niet voortrekken in zijn geschil.", "Ps 119:83": "Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.", "1 Kron 16:41": "En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.", "Job 21:25": "De ander daarentegen sterft met een bittere ziel, en hij heeft van het goede niet gegeten.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Job 16:14": "Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Job 3:13": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn;", "Job 38:17": "Zijn u de poorten van de dood ontdekt, en hebt u gezien de poorten van de schaduw van de dood?", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Jes 13:22": "En wilde dieren van de eilanden zullen in zijn verlaten plaatsen elkaar toeroepen, alsook de draken in de weelderige paleizen; zijn tijd is immers nabij om te komen, en zijn dagen zullen niet verlengd worden.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Ps 88:8": "Uw grimmigheid ligt op mij; U hebt mij neergedrukt met al Uw baren. Sela.", "Job 4:3-6": "Zie, u hebt velen onderwezen, en u hebt slappe handen gesterkt; uw woorden hebben de struikelende opgericht, en de knieën die knikten hebt u vastgesteld; maar nu komt het aan bij u, en u bent verdrietig; het raakt tot u, en u wordt beroerd.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Ps 143:4": "Daarom wordt mijn geest overstelpt in mij, mijn hart is verbaasd in het midden van mij.", "2 Kron 32:19": "En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.", "1 Sam 18:7": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "1 Tim 2:10": "maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken.", "Job 17:13": "Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Job 36:15": "Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij voor hun oor openbaren.", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Job 17:2": "Zijn er niet bespotters bij mij, en overnacht mijn oog niet in hun verbittering?", "Deut 32:33": "Hun wijn is vurig drakenvenijn, en een wreed adderenvergif.", "Pred 9:16": "Toen zei ik: Wijsheid is beter dan kracht, hoewel de wijsheid van de arme veracht wordt, en zijn woorden niet gehoord worden.", "Matt 9:23": "En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,", "Job 12:18": "De band van de koningen maakt Hij los, en Hij bindt de gordel aan hun heupen.", "Micha 1:8": "Hierom zal ik misbaar bedrijven en huilen; ik zal beroofd en naakt gaan; ik zal misbaar maken als de draken, en treuren als de jonge struisen.", "Jer 8:18": "Mijn verkwikking is in droefenis; mijn hart is flauw in mij.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "1 Kon 19:4": "Maar hijzelf ging een dagreis de woestijn in, en kwam en ging zitten onder een jeneverboom; en bad dat hij mocht sterven, en zei: Het is genoeg; neem nu, HEERE, mijn leven, want ik ben niet beter dan mijn vaderen.", "Job 9:35": "Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "Klaagl 3:5": "Beth. Hij heeft tegen mij gebouwd, en Hij heeft mij met gal en moeite omringd.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Klaagl 3:14": "He. Ik ben voor al mijn volk tot bespotting geworden, hun snarenspel de hele dag.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Mark 4:38": "En Hij lag in het achterschip te slapen op een kussen; en zij maakten Hem wakker, en zeiden tegen Hem: Meester, kan het U niet schelen dat wij vergaan?", "Tit 3:2": "Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen.", "Mark 12:43": "En Jezus riep Zijn discipelen tot Zich, en zei tegen hen: Voorwaar, Ik zeg u, dat deze arme weduwe meer heeft ingeworpen dan allen die iets in de schatkist geworpen hebben.", "Hoogl 5:4": "Mijn Liefste trok Zijn hand door het gat van de deur; en mijn binnenste raakte ontroerd om Zijnentwil.", "Ps 1:4": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft.", "Job 9:18": "Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.", "Ezech 16:49": "Zie, dit was de ongerechtigheid van uw zuster Sodom: hoogmoed, verzadiging van brood, en zorgeloze rust had zij en haar dochters; maar zij versterkte de hand van de arme en de behoeftige niet.", "Ps 102:24": "Hij heeft mijn kracht op de weg neergedrukt; mijn dagen heeft Hij verkort.", "Luk 23:35": "En het volk stond te kijken. En ook de leiders bespotten Hem samen met hen en zeiden: Anderen heeft Hij verlost; laat Hij nu Zichzelf verlossen, als Hij de Christus is, de Uitverkorene van God.", "Ps 141:7": "Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.", "Mark 9:19": "En Hij antwoordde hem en zei: O ongelovig geslacht, hoelang zal Ik nog bij u zijn? Hoelang zal Ik u nog verdragen? Breng hem bij Mij.", "Jes 8:7": "daarom, zie, zal de Heere over hen laten opkomen dat sterke en geweldige water van de rivier, de koning van Assyrië en al zijn heerlijkheid; en hij zal opkomen over al zijn stromen, en overgaan over al zijn oevers;", "Job 14:5-12": "Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden; Wend U van hem af, zodat hij rust heeft, totdat hij als een dagloner een welgevallen heeft aan zijn dag. Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden.", "Jes 8:8": "en hij zal doortrekken in Juda, hij zal het overstromen en er doorgaan, hij zal tot aan de hals reiken; en de uitgestrektheid van zijn vleugels zal de breedte van uw land vullen, o Immanuël!", "Job 19:12": "Zijn benden zijn samen aangekomen, en hebben tegen mij hun weg gebaand, en hebben zich rondom mijn tent gelegerd.", "Ps 80:5": "HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk?", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Ps 80:6": "U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Openb 20:12-14": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken. En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken. En de dood en het rijk van de dood werden geworpen in de poel van het vuur; dit is de tweede dood.", "Ps 82:7": "Toch zult u sterven als een mens; en als een van de vorsten zult u vallen.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Ps 150:4": "Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel!", "Micha 1:12": "Want de inwoonster van Maroth is ziek om het goede; want een kwaad is van de HEERE neergedaald, tot aan de poort van Jeruzalem.", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Ps 73:13-17": "Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen. Als ik zou zeggen: Ik zal ook zo spreken; zie, dan zou ik trouweloos zijn tegenover het geslacht van Uw kinderen.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Ps 66:11": "U had ons in het net gebracht; U had een engs band om onze lenden gelegd;", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "Gen 18:27": "En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben!", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Jer 50:39": "Daarom zullen de wilde dieren van de woestijnen met de wilde dieren van de eilanden daar wonen; ook zullen de jonge struisen daar wonen; en men zal er geen verblijf meer hebben in eeuwigheid, en zij zal niet bewoond worden van geslacht tot geslacht.", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "Tit 3:8": "Dit is een betrouwbaar woord, en ik wil dat u deze dingen met ernst bevestigt, opdat zij die aan God geloven, er zorg voor dragen goede werken voor te staan; deze dingen zijn goed en nuttig voor de mensen.", "Mark 12:44": "Want zij allen hebben van hun overvloed daarin geworpen; maar deze heeft van haar armoede, alles wat zij had, daarin geworpen, haar hele levensonderhoud.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Mark 4:40": "En Hij zei tegen hen: Waarom bent u zo angstig? Hoe kan het dat u geen geloof hebt?", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "2 Kon 6:33": "Terwijl hij nog met hen sprak, zie, zo kwam de bode bij hem af; en hij zei: Zie, dit kwaad is van de HEERE; wat zou ik nog langer op de HEERE wachten?", "Ps 74:18": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Ezech 20:27": "Daarom, mensenkind, spreek tot het huis van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Hiermee nog hebben uw vaderen Mij gesmaad, dat zij door overtreding tegen Mij hebben overtreden.", "Ps 22:3": "Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "Job 19:20": "Mijn gebeente kleeft aan mijn huid en aan mijn vlees; en ik ben ontkomen met de huid van mijn tanden.", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Jes 38:13": "Ik stelde mij gerust tot de morgenstond toe; zoals een leeuw, zo zal Hij al mijn beenderen breken; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Spr 19:7": "Al de broeders van de arme haten hem; hoeveel te meer gaan zijn vrienden ver van hem weg! Hij loopt hen achterna met woorden, die niets zijn.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Ps 6:7": "Ik ben moe van mijn zuchten; ik laat mijn bed de hele nacht zwemmen; ik doornat mijn bedstede met mijn tranen.", "Jes 13:21": "Maar daar zullen de wilde dieren van de woestijnen neerliggen, en hun huizen zullen vervuld worden met angstaanjagende dieren, en daar zullen de jonge struisvogels wonen, en de bokachtige demonen zullen er springen.", "Spr 30:11": "Er is een geslacht dat zijn vader vervloekt, en zijn moeder niet zegent;", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "Openb 21:4": "En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan.", "Job 21:12": "Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.", "Jes 65:7": "Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.", "Jer 4:10": "Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Pred 3:2": "Er is een tijd om geboren te worden, en een tijd om te sterven; een tijd om te planten, en een tijd om het geplante uit te roeien;", "Matt 17:17": "Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "Job 31:15-22": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?) Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten; En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft;", "2 Petr 2:4": "Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden;", "Ps 35:21": "En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Jes 34:13": "En in hun paleizen zullen doornen opschieten, netels en distels in hun vestingen; en het zal een woonplaats van jakhalzen zijn, een plek voor de jongen van de struisvogels.", "Dan 4:32": "En men zal u van de mensen verstoten, en uw woning zal bij de dieren van het veld zijn; men zal u gras te eten geven, zoals de ossen, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste over de koninkrijken van de mensen heerschappij heeft, en dat Hij ze geeft aan wie Hij wil.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Rom 8:20": "Want de schepping is aan de zinloosheid onderworpen, niet vrijwillig, maar om hem die haar daaraan onderworpen heeft,", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "Spr 14:10": "Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.", "Job 10:2-7": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Ps 106:31": "En het is hem gerekend tot gerechtigheid, van geslacht tot geslacht tot in eeuwigheid.", "Ps 49:11-14": "Want hij ziet dat de wijzen sterven, dat samen een dwaas en een onverstandig mens omkomen, en hun bezit aan anderen nalaten. Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen. De mens echter, die in aanzien is, blijft niet; hij wordt gelijk aan de dieren, die vergaan.", "Deut 4:5-31": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen. Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk! Want welk groot volk is er, dat de goden zo dichtbi
