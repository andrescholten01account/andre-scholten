elen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.","4":"En zijn zonen gingen en maakten maaltijden, ieder in zijn eigen huis op zijn dag; en zij zonden weg en nodigden hun drie zusters, om met hen te eten en te drinken.","5":"Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt[1]. Zo deed Job al die dagen.","6":"Er was nu een dag, dat de kinderen van God kwamen om zich voor de HEERE te stellen, dat de satan ook in hun midden kwam.","7":"Toen zei de HEERE tegen de satan: Waar komt u vandaan? En de satan antwoordde de HEERE en zei: Van het rondtrekken op de aarde, en van het doorwandelen ervan.","8":"En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want er is niemand op de aarde zoals hij, een man oprecht en vroom, godvrezend en afwijkend van het kwaad.","9":"Toen antwoordde de satan de HEERE en zei: Is het voor niets, dat Job God vreest?","10":"Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.","11":"Maar strek toch nu Uw hand uit, en tast alles aan wat hij heeft; dan zal hij U beslist in Uw aangezicht vervloeken[1].","12":"En de HEERE zei tegen de satan: Zie, alles wat hij heeft, is in uw hand; alleen aan hemzelf mag u uw hand niet slaan. En de satan ging weg van het aangezicht van de HEERE.","13":"Er was nu een dag, dat zijn zonen en zijn dochters aten en wijn dronken in het huis van hun broer, de eerstgeborene.","14":"Dat er een bode tot Job kwam en zei: De runderen waren aan het ploegen, en de ezelinnen weidden aan hun zijden.","15":"Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.","16":"Terwijl deze nog sprak, kwam er een ander en zei: Het vuur van God viel uit de hemel en stak de schapen en de knechten in brand en verteerde ze; en ik ben maar alleen ontkomen om het u te vertellen.","17":"Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.","18":"Terwijl deze nog sprak, kwam er een ander en zei: Uw zonen en uw dochters aten en dronken wijn in het huis van hun broer, de eerstgeborene;","19":"En zie, een grote wind kwam van over de woestijn, en stootte tegen de vier hoeken van het huis, en het viel op de jongemannen, zodat zij stierven; en ik ben maar alleen ontkomen om het u te vertellen.","20":"Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;","21":"En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!","22":"In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe."},"SV":{"1":"Er was een man in het land Uz, zijn naam was Job; en dezelve man was oprecht, en vroom, en godvrezende, en wijkende van het kwaad.","2":"En hem werden zeven zonen en drie dochteren geboren.","3":"Daartoe was zijn vee zeven duizend schapen, en drie duizend kemelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook was zijn dienstvolk zeer veel; zodat deze man groter was dan al die van het oosten.","4":"En zijn zonen gingen, en maakten maaltijden in ieders huis op zijn dag; en zij zonden henen, en nodigden hun drie zusteren, om met hen te eten en te drinken.","5":"Het geschiedde dan, als de dagen der maaltijden omgegaan waren, dat Job henenzond, en hen heiligde en des morgens vroeg opstond, en brandofferen offerde *naar* hun aller getal; want Job zeide: Misschien hebben mijn kinderen gezondigd, en God in hun hart gezegend. Alzo deed Job al die dagen.","6":"Er was nu een dag, als de kinderen Gods kwamen, om zich voor den HEERE te stellen, dat de satan ook in het midden van hen kwam.","7":"Toen zeide de HEERE tot den satan: Van waar komt gij? En de satan antwoordde den HEERE, en zeide: Van om te trekken op de aarde, en van die te doorwandelen.","8":"En de HEERE zeide tot den satan: Hebt gij *ook* acht geslagen op Mijn knecht Job? Want niemand is op de aarde gelijk hij, een man oprecht en vroom, godvrezende en wijkende van het kwaad.","9":"Toen antwoordde de satan den HEERE, en zeide: Is het om niet, dat Job God vreest?","10":"Hebt Gij niet een betuining gemaakt voor hem, en voor zijn huis, en voor al wat hij heeft rondom? Het werk zijner handen hebt Gij gezegend, en zijn vee is *in* *menigte* uitgebroken in den lande.","11":"Maar toch strek nu Uw hand uit, en tast aan alles, wat hij heeft; zo hij U niet in Uw aangezicht zal zegenen?","12":"En de HEERE zeide tot den satan: Zie, al wat hij heeft, zij in uw hand; alleen aan hem strek uw hand niet uit. En de satan ging uit van het aangezicht des HEEREN.","13":"Er was nu een dag, als zijn zonen en zijn dochteren aten, en wijn dronken in het huis van hun broeder, den eerstgeborene.","14":"Dat een bode tot Job kwam, en zeide: De runderen waren ploegende, en de ezelinnen weidende aan hun zijden.","15":"Doch de Sabeërs deden een inval, en namen ze, en sloegen de jongeren met de scherpte des zwaards; en ik ben maar alleen ontkomen, om het u aan te zeggen.","16":"Als deze nog sprak, zo kwam een ander, en zeide: Het vuur Gods viel uit den hemel, en ontstak onder de schapen en onder de jongeren, en verteerde ze; en ik ben maar alleen ontkomen, om het u aan te zeggen.","17":"Als deze nog sprak, zo kwam een ander, en zeide: De Chaldeen stelden drie hopen, en vielen op de kemelen aan, en namen ze, en sloegen de jongeren met de scherpte des zwaards; en ik ben maar alleen ontkomen, om het u aan te zeggen.","18":"Als deze nog sprak, zo kwam een ander, en zeide: Uw zonen en uw dochteren aten, en dronken wijn, in het huis van hun broeder, den eerstgeborene;","19":"En zie, een grote wind kwam van over de woestijn, en stiet aan de vier hoeken van het huis, en het viel op de jongelingen, dat ze stierven; en ik ben maar alleen ontkomen, om het u aan te zeggen.","20":"Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neder;","21":"En hij zeide: Naakt ben ik uit mijner moeders buik gekomen, en naakt zal ik daarhenen wederkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam des HEEREN zij geloofd!","22":"In dit alles zondigde Job niet, en schreef Gode niets ongerijmds toe."},"KJV":{"1":"There was a man in the land of Uz, whose name *was* Job; and that man was perfect and upright, and one that feared God, and eschewed evil.","2":"And there were born unto him seven sons and three daughters.","3":"His substance also was seven thousand sheep, and three thousand camels, and five hundred yoke of oxen, and five hundred she asses, and a very great household; so that this man was the greatest of all the men of the east.","4":"And his sons went and feasted *in their* houses, every one his day; and sent and called for their three sisters to eat and to drink","5":"And it was so, when the days of *their* feasting were gone about, that Job sent and sanctified them, and rose up early in the morning, and offered burnt offerings *according* to the number of them all: for Job said, It may be that my sons have sinned, and cursed God in their hearts. Thus did Job continually.","6":"Now there was a day when the sons of God came to present themselves before the LORD, and Satan came also among","7":"And the LORD said unto Satan, Whence comest thou? Then Satan answered the LORD, and said, From going to and fro in the earth, and from walking up and down","8":"And the LORD said unto Satan, Hast thou considered my servant Job, that *there is* none like him in the earth, a perfect and an upright man, one that feareth God, and escheweth evil?","9":"Then Satan answered the LORD, and said, Doth Job fear God for nought?","10":"Hast not thou made an hedge about him, and about his house, and about all that he hath on every side? thou hast blessed the work of his hands, and his substance is increased in the land.","11":"But put forth thine hand now, and touch all that he hath, and he will curse thee to thy face.","12":"And the LORD said unto Satan, Behold, all that he hath *is* in thy power; only upon himself put not forth thine hand. So Satan went forth from the presence of the LORD.","13":"And there was a day when his sons and his daughters *were* eating and drinking wine in their eldest brother's house:","14":"And there came a messenger unto Job, and said, The oxen were plowing, and the asses feeding beside","15":"And the Sabeans fell *upon them*, and took them away; yea, they have slain the servants with the edge of the sword; and I only am escaped alone to tell","16":"While he *was* yet speaking, there came also another, and said, The fire of God is fallen from heaven, and hath burned up the sheep, and the servants, and consumed them; and I only am escaped alone to tell","17":"While he *was* yet speaking, there came also another, and said, The Chaldeans made out three bands, and fell upon the camels, and have carried them away, yea, and slain the servants with the edge of the sword; and I only am escaped alone to tell","18":"While he *was* yet speaking, there came also another, and said, Thy sons and thy daughters *were* eating and drinking wine in their eldest brother's house:","19":"And, behold, there came a great wind from the wilderness, and smote the four corners of the house, and it fell upon the young men, and they are dead; and I only am escaped alone to tell","20":"Then Job arose, and rent his mantle, and shaved his head, and fell down upon the ground, and worshipped,","21":"And said, Naked came I out of my mother's womb, and naked shall I return thither: the LORD gave, and the LORD hath taken away; blessed be the name of the LORD.","22":"In all this Job sinned not, nor charged God foolishly."}},"tsk":{"1":[{"kopje":"Uz","refs":["Gen 10:23","Gen 22:20","Gen 22:21","Gen 36:28","1 Kron 1:17","1 Kron 1:42","Jer 25:20","Klaagl 4:21"]},{"kopje":"Job","refs":["Ezech 14:14","Ezech 14:20","Jak 5:11"]},{"kopje":"oprecht","refs":["Job 1:8","Job 2:3","Job 23:11","Job 23:12","Job 31:1-40","Gen 6:9","Gen 17:1","2 Kon 20:3","2 Kron 31:20","2 Kron 31:21","Luk 1:6"]},{"kopje":"man","refs":["Gen 22:12","Spr 8:13","Spr 16:6","1 Petr 3:11"]}],"2":[{"kopje":"zeven zonen","refs":["Job 13:13","Est 5:11","Ps 107:38","Ps 127:3-5","Ps 128:3"]}],"3":[{"kopje":"dienstvolk","refs":["Gen 12:5","Gen 13:6","Gen 34:23","2 Kron 32:29"]},{"kopje":"zeven","refs":["Job 42:12","Gen 12:16","Num 31:32-34","Richt 6:5","1 Sam 25:2","2 Kon 3:4","Spr 10:22"]},{"kopje":"dienstvolk","refs":["2 Kron 26:10"]},{"kopje":"groter","refs":["Job 29:9","Job 29:10","Job 29:25"]},{"kopje":"man","refs":["Richt 6:3","Richt 7:12","Richt 8:10","1 Kon 4:30"]},{"kopje":"van het oosten","refs":["Gen 25:6","Gen 29:1","Num 23:7"]}],"4":[{"kopje":"zonden weg en nodigden","refs":["Ps 133:1","Hebr 13:1"]}],"5":[{"kopje":"heiligde","refs":["Job 41:16","Gen 35:2","Gen 35:3","Ex 19:10","1 Sam 16:5","Neh 12:30","Joh 11:55"]},{"kopje":"opstond","refs":["Gen 22:3","Ps 5:4","Pred 9:10"]},{"kopje":"offerde","refs":["Job 42:8","Gen 8:20","Ex 18:12","Ex 24:5","Lev 1:3-6"]},{"kopje":"naar","refs":["1 Kon 18:31","Hand 21:26"]},{"kopje":"Misschien","refs":["2 Kor 11:2"]},{"kopje":"vervloekt","refs":["Job 1:11","Job 2:9","Lev 24:10-16","1 Kon 21:10","1 Kon 21:13"]},{"kopje":"in hun hart","refs":["Gen 6:5","Jer 4:14","Jer 17:9","Jer 17:10","Mark 7:21-23","Hand 8:22","1 Kor 4:5"]},{"kopje":"Zo","refs":["Job 27:10"]},{"kopje":"al die dagen","refs":[ andschap de gelovigen haat, die verklagende voor God, Rev 12:10 , en als een briesende leeuw rondom hen lopende, en zoekende wien hij zou mogen verslinden; 1Pe 5:8 ."}],"7":[{"catchword":"om te trekken","tekst":"Des duivels werk is alles te doorlopen en te doorsnuffelen, om degenen, die op hun hoede niet zijn, te grijpen, en die nog enigszins wacht houden te kwellen en te bespringen."}],"8":[{"catchword":"Hebt gij ook","tekst":"Hebreeuws, hebt gij uw hart gelegd, of gesteld; dat is, hebt gij achtgegeven, of opmerking genomen? Dezelfde manier van spreken is te vinden 2Sa 18:3 , en onder, Job 2:3 , en Job 7:17 , en Job 23:6 ."},{"catchword":"Want niemand","tekst":"Of, dat niemand zijns gelijke is op de aarde, enz."}],"10":[{"catchword":"een betuining","tekst":"Dat is, beschermt en bevrijdt Gij hem niet van alle kwaad door uw overaltegenwoordige voorzienigheid en almogende kracht?"},{"catchword":"gezegend,","tekst":"Zie van dit woord zegenen Gen 12:2 ."},{"catchword":"in menigte","tekst":"Zie Gen 30:30 . Het Hebreeuwse woord is ook elders gebruikt van zeer grote vermenigvuldiging, gelijk Gen 28:14 , en Gen 30:43 ; Exo 1:12 ."}],"11":[{"catchword":"tast aan","tekst":"Te weten, om dat te beschadigen en hem alzo te plagen. Zie Gen 26:11 ."},{"catchword":"aangezicht","tekst":"Dat is, stoutelijk zonder schroom en schaamte."},{"catchword":"zegenen?","tekst":"Zie boven, vs.5."},{"catchword":"*","tekst":"In het eedzweren der Hebreën wordt gemeenlijk de straf, die men zich onderwerpt zo men valselijk zweert, verzwegen, gelijk hier. Zie Gen 14:23 ."}],"12":[{"catchword":"in uw hand;","tekst":"Dat is, in uw macht, onder uw geweld. Zie Gen 16:6 ."},{"catchword":"aan hem","tekst":"Dat is, aan zijn persoon. Versta, zijn lichaam en ziel."}],"14":[{"catchword":"aan hun zijden","tekst":"Dat is, nevens deze runderen. Hebreeuws, aan hun handen. Zie het woord hand voor zijde gebruikt 2Ch 21:16 , enz. Anders, op hun plaatsen; dat is, waar zij plachten te weiden. Dit woord is somtijds voor plaatsen genomen gelijk Num 2:17 ; Jer 6:3 ."}],"15":[{"catchword":"Sabeërs","tekst":"Hebreeuws, Scheba; dat is het heir der Sabeërs. Dezen waren de nakomelingen van Scheba, den zoon van Joksan, den zoon van Abraham uit Ketura, Gen 25:1-3 . Zij woonden in woest Arabië. Zie van hen Eze 27:23 . Deze Scheba is te onderscheiden van een anderen van dezen naam, welke was de zoon van Raema, de zoon van Cus, den zoon van Cham, den zoon van Noach, Gen 10:7 , wiens nakomelingen het Morenland bewoonden. Zie de aantekening op Gen 10:7 en op vs.28."},{"catchword":"deden","tekst":"Hebreeuws, Scheba viel."},{"catchword":"scherpte","tekst":"Hebreeuws, mond. Alzo in het volgende."}],"16":[{"catchword":"Het vuur Gods","tekst":"Dit is, een groot, geweldig en verschrikkelijk vuur. Vergelijk de aantekening Gen 13:10 , of dat God van den hemel gezonden heeft, zo zij meenden."},{"catchword":"schapen","tekst":"Zie boven, vs.3."}],"17":[{"catchword":"hopen,","tekst":"Hebreeuws, hoofden; maar het Hebreeuwse woord betekent somtijds een schare of bende, of hoop volks, gelijk hier; Jdg 7:16 ; 1Sa 11:11 ."}],"18":[{"catchword":"nog sprak,","tekst":"Het Hebreeuwse woord is aldus genomen Pro 8:26 , en Jon 4:2 ."}],"19":[{"catchword":"stiet","tekst":"Hebreeuws eigenlijk, raakte; dat is, trof."},{"catchword":"jongelingen,","tekst":"De zonen van Job. Zie Gen 22:5 ."}],"20":[{"catchword":"scheurde","tekst":"Zie Gen 37:29 ."},{"catchword":"mantel,","tekst":"Dit is een opperkleed geweest, hetwelk de voornaamsten onder het volk droegen."},{"catchword":"schoor zijn hoofd,","tekst":"Dat is, liet zijn hoofd scheren. Alzo Gen 41:14 ; 2Sa 14:26 , en zie Gen 40:22 . Het scheren nu was een teken van droefenis en rouw; Lev 21:5 ; Jer 41:5 , en Jer 48:37 ; Mic 1:16 . Anders heeft men zich ook laten scheren als men zijn lichaam reinigen wilde; hetwelk, naardien het tegen den tijd van vreugde placht te geschieden, zo is het ook een teken geweest van verkwikking en blijdschap, Gen 41:14 , en het nalaten daarvan een teken van ontsteltenis en droefheid; 2Sa 19:24 ."},{"catchword":"boog zich neder;","tekst":"Het Hebreeuwse woord betekent zich nederbuigen, òf voor God om Hem godsdienstige eer te bewijzen; van welke betekenis, zie Gen 24:26 , òf voor de mensen om hun burgerlijke eer aan te doen; van welke betekenis, zie Gen 18:2 . De eerste heeft hier plaats, gelijk af te nemen is uit de volgende woorden, in welke hij God dankt voor al wat Hij hem toegezonden had."}],"21":[{"catchword":"daarhenen","tekst":"Dit zeide hij, zo het schijnt, wijzende op de aarde, naar welke hij zich neergebogen had."},{"catchword":"de HEERE heeft genomen;","tekst":"Hoe de kwade werken des Satans en der boze mensen, den goeden God toegeschreven worden, zie Gen 45:5 , en 1Ki 12:15 ."},{"catchword":"geloofd","tekst":"Hebreeuws, gezegend. Zie Gen 14:20 , en de aantekening."}],"22":[{"catchword":"zondigde","tekst":"Noch met woord, noch met daad."},{"catchword":"schreef","tekst":"Of, eigende toe. Hebreeuws, gaf."},{"catchword":"ongerijmds","tekst":"Hebreeuws, onsmakelijk; dat is ongerijmds, onredelijks, te weten, hetwelk zou mogen strijden tegen Gods natuur en eigenschappen en tegen de eer zijns naams."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"There was a man in the Land of Uz, [Heb. Uts, or Huts. Understand a Country so called from a man of that Name. The holy Scripture maketh mention of three that beareth this name, 1. the Son of Aram the son of Sem, Gen. 10. 23. 2. the first-born son of Nahor, the brother of Abraham, Gen. 21. 21. 3. one of Esau posterity. Gen. 36. 28. The first was the father of the inhabitants of the Country of the Trachonites, otherwise called Ausitis, or Uzitis: and of this Land (it being a portion of the Land of the Israelites) some interpreters do hold, the text here speaks off. Yet others conceive that here is to be understood a Country, which lay in Syria, having its name from the second Uz. Yea there are likewise some, which take this place for a Country of Idumca, where the third Uz had his habitation; see lam. 4. 21.] and his name was Job: [Heb. Ijob, see Ezek, 14. 14, 20. James 5. 11.] and the same man was upright, [or plain, (simplex) i.e. unfeigned in his faith , and trusting in God, and sincere in his love towards his neighbour. The word looketh most here upon the commandments of the second Table; although it be much used in a general sense, signifying one that swarveth neither to the right hand nor to the left, from the right way, but holdeth on in the same, eschewing all crooked ways that might turn him out of the right; so below, ch. 4. 7. & 8. 6. & 17. 8.] and fearing God, [see also Psalm 7. on v. 11. the true fear of God is the beginning of all virtues, Prov. 8. 13. and 15. 33. yet this commendation hath its chief regard unto Godliness, and the commandments of the first Table] and turning away from the evil [viz. of sin, forbidden in the first and second Table of the ten commandments]"}],"2":[{"catchword":null,"tekst":"And to him were born seven Sons and three daughters."}],"3":[{"catchword":null,"tekst":"Besides, his Cattle [See of the Hebrew Word Mikneh, Gen. 4. on v. 20.] was seven thousand sheep [the Hebrew word doth not onely signify sheep, but goats also, that is to say, all kind of small cattle, especially being set opposite to the greater sort, see Gen. 12. on v. 16. & Lev. 1. on v. 2.] and three thousand camels, and five hundred yoak of oxen, and five hundred she-asses, also his serving-people [or, serving-work, country-tillage, (husbandry)] were very many. So that this man was greater that all those of the East [or, the people, or, men of the East, Heb. children of the East, i.e. those that dwelt Eastwards in regard of Judea, comp. Gen. 29. 1. Jud. 6. 3. and see the Annot. there]"}],"4":[{"catchword":null,"tekst":"And his sons went, and made Feasts in every one&acirc;&euro;&trade;s house upon his day: [i.e. at his turn to keep his Feast; for it went orderly about among them. And peradventure the order came to each one, upon his own birthday; for Job also calleth that same, his day: below ch. 3. 1.] and they sent, [messengers namely, to bid their Sisters to the Feast, and so in the next verse] and invited their three Sisters, to eat and to drink with them."}],"5":[{"catchword":null,"tekst":"It came to pass then, when the days of the Feast were gone about, that Job sent and hallowed them, [i.e. took care, and charged them, that thy should sanctify themselves, to be well prepared for the offering at hand. So also Exod. 19. 10. This hallowing, or sanctifying, consisted indeed principally in the forsaking of, or. abstaining from all spiritual defilement of sin; but yet therewithal in the observation of certain bodily, or outward ceremonies, as tokens of the inward sanctification; such namely as were then in use and practise among the godly, compare Gen. 35. 2. (where ye have the word, to cleanse, or purify) and the annot. thereupon.] and rose up early in the morning, and offered burnt-offerings (according to) all their number; for Job said, [viz. by himself, that is, he thought; see Gen. 20. 11.] Peradventure my children have sinned [viz. by excess of mirth and jollity, light behaviour, wasting of Gods good gifts, forgetting of the poor, and other the like sins of carnal unadvisedness] and blessed God in their hearts: [i.e. not blessed, hallowed and honoured God, as it became them, lightly setting by, and making but small account of the commandments of the LORD, in their jollity and abundance. Thus the word blessing, which otherwise signifieth lauding and praising, is taken here in the contrary signification, for cursing, dispraising, profaning; for here it implyeth the sins, for which Job made the offering, and thus this word is also used, below v. 11. and ch. 2. v. 9. see likewise 1 King 21. 10. and the annot. thereupon] thus did Job all those days [viz. when, or, at what time his children, had kept their Feasts.]"}],"6":[{"catchword":null,"tekst":"Now there was a day, when the children of God [Heb. Sons, i.e. the Angels of God, as bel. ch. 38. 7. not that they are the Sons, or, children of God by nature, so as only is the only begotten Son of the Father, but as having received this dignity by the gift of the creation, being made after the image or likeness of God, for to behold his face continually, to serve him, and his Church, and to live with him for ever.] came, for to present themselves before the LORD [this is said, by a comparison taken from worldly Princes, who summon their Servants to appear and render an account, of what they have given them in charge, comp. 1 Kings 22. 19. and annotation] that Satan [i.e. the adversary. See 1 Chron. 21. 1. Thus the evil spirit is called by reason of the implacable enmity and hatred he beareth to the faithful, accusing them before God, Rev. 12. 10. and ranging round about them like a roaring Lion, seeking whom he might swallow up, 1 Pet. 5. 8.] also came in the midst of them."}],"7":[{"catchword":null,"tekst":"Then said the LORD to Satan; from whence cometh thou? and Satan answered the Lord and said; from circuiting upon the Earth, and from walking through the same [( a perambullindo illam) This is the Devils practise, to haunt and range every where about still, for to lay hold on these, that are not upon their guard, and trouble and assault that in some measure are.]"}],"8":[{"catchword":null,"tekst":"And the LORD said unto Satan; hast thou (also) taken heed [Heb. laid, or set thine heart, i.e. haste thou marked, taken notice of; the same manner of expression we find likewise, 2 Sam. 18. 3. & bel. 2. 3. & 7. 17. & 23. 6.] unto my Servant Job? for there is [or, that there is] none like him upon the Earth, a man upright, and honest, fearing God, and withdrawing from evil."}],"9":[{"catchword":null,"tekst":"Then answered Satan to the LORD, and said: Is it for nought that job fearth God?"}],"10":[{"catchword":null,"tekst":"Hast thou not made a fence for him, and for his house, and for all that he hath round about? [i.e. dost not thou protect and free him from all manner of evil, by thine every where present providence, and almighty power ?] the work of his hands thou hast blessed, [see of this word blessing, Gen. 12. on v. 2.] and his cattle is broken out (in multitude) [See Gen. 30. 30. The Hebrew word is likewise used elsewhere, for multiplying exceedingly, as Gen. 28. 14. and chap. 30. 34. Exodus 1. 12.] in the Land."}],"11":[{"catchword":null,"tekst":"But yet stretch out thine hand now. and touch all what he hath: [viz. to hurt and damnify it, and thereby to plague him. See Gen. 26. on v. 11.] if he shall not bless thee [See above on v. 5.] in thy face [i.e. daringly, without awe or shame. The speech is abrupt here, according to the Hebrew manner of swearing, where commonly, as here, the penalty of swearing falsely, is concealed. See Gen. 14. on v. 23.]"}],"12":[{"catchword":null,"tekst":"And the LORD said to Satan: behold all what he hath, be in thy hand; [i.e. in thy power and disposing See Gen. 16. on v. 6.] only on him [i.e. on his person; understand his body and soul] do not stretch out thy hand, and Satan went out from the face of the LORD."}],"13":[{"catchword":null,"tekst":"Now there was a day, when his sons and his Daughters did eat and drank wine, in the house of their brother the first-born."}],"14":[{"catchword":null,"tekst":"That a Messenger came to Job, and said, the oxen were ploughing, and the she-asses feeding by their sides. [i.e. beside, about, near hand these Oxen, Heb. at their hands. See the word hand, used for side, 2 Chron. 21. 16, & c. others, on their places, i.e. where they used to feed. This word is sometimes taken for places, as Num. 2. 17. Jerem. 6. 3.]"}],"15":[{"catchword":null,"tekst":"But the Sabeans [Heb. Sheba, i.e. the host of the Sabeans: These were the posterity of Sheba, the Son of Joksam the son of Abraham by Ketura. Gen. 25. 1, 2, 3. They had their habitation in Arabia the Desert. See of them Ezek. 27. 23. This Sheba ii to be distinguished from another of that name, which was the Son of Raema, the son of Cus, the son of the Gen. 10. 7. whose posterity inhabited Ethiopia. See the annot. on the place, and on v. 28.] made an invasion, smote the youths with the edge of the sword [Heb. mouth of the sword, and so in the sequel] and but I alone escaped to relate it to thee."}],"16":[{"catchword":null,"tekst":"While this spake yet, there came another, and said: The fire of God fell out of Heaven [i.e. a great, fierce and terrible fire, comp, Gen. 13. the notes on v. 10. or, which God sent down out of heaven, as they conceived.] and kindled among the sheep [see ab. on v. 3.] and among the youths, and devoured them; and but I alone escaped for to relate it to thee."}],"17":[{"catchword":null,"tekst":"While they yet spake, there came another and said, The Caldeans put [disposed] three Troops [Heb. heads, But the Hebrew word doth sometimes signify a Band, or Company, or Troop, or gathering of people, as here, and Jud. 7. 17. 1 Sam. 11. 11.] and fell on upon the Camels, and took them, and smote the youths with the edge of the Sword; and but I alone escaped, to relate it to thee."}],"18":[{"catchword":null,"tekst":"While this yet [the Hebrew word rendered yet, is taken thus Prov. 8. 26. and Jonas 4. 2.] spake, there came another and said, Thy sons and thy Daughters did eat, and drank wine, in the house of their brother the first born."}],"19":[{"catchword":null,"tekst":"And behold a great wind came, from over the Desert, and smote [Hebr. touched, i.e. hit] on the four corners of the house, and it fell upon the youths, [the sons of Job. See Gen. 22. on v. 5.] that they died, and but I alone escaped to relate it to thee."}],"20":[{"catchword":null,"tekst":"Then Job arose, and rent [See Gen. 37. on v. 29.] his Cloak [this was an upper garment, which the chief among the people used to wear] and shaved his head [i.e. caused his head to be shaved or polled. So Gen. 41. 14. 2 Sam 14. 26. and see Gen. 40. on v. 22. now the shaving was a token of grief and sorrow, Levit. 21. 5. Jerem. 41. 5. and 48. 37. Mich. 1. 16. Otherwise they used shaving too when they were to purify their bodies, which when it was done against a time of Joyfulness, then it was likewise a token of joy and cheerfulness, Gen. 41. 14. and the omitting of it at such a time was a token of distemper, grief and sadness, 2 Sam. 19. 24.] and fell upon the Earth and bowed himself down. [The Hebrew word doth signify, to bow down one&acirc;&euro;&trade;s self, either before God, to exhibit divine worship unto him; of which signification see Gen. 24. on v. 26. or before men, by way of civil respect and obeisance; of which signification see Gen. 18. on v. 2. The first sort is meant here, as appeareth by the words following, whereby he giveth God thanks for all that he gave and sent him.]"}],"21":[{"catchword":null,"tekst":"And he said: Naked am I come out of my mothers Belly, and naked shall I return thither again; [this he saith, it should seem, in respect of the earth, unto which he had bowed himself down: ] The LORD hath given, and evil men are ascribed to God, see Gen. 45. on v. 5. and 1 Kings 12. on v. 15.] the Name of the LORD be praised [Hebrew, blessed, see Gen. 14. 20. and the Annot.]"}],"22":[{"catchword":null,"tekst":"In all this Job sinned not [neither in word nor indeed] and ascribed [or attributed, Heb. gave] God nought tribe seeming [Heb. unsavoury, i.e. unbefitting, unreasonable, viz. as might stand in opposition to the nature and attributes of God, and the honour of his name.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    .then(r => r.ok ? r.json() : null).catch(() => null);

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));

  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
