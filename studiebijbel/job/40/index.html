en?","20":"Zult gij den Leviathan met den angel trekken, of zijn tong met een koord, *dat* gij laat nederzinken?","21":"Zult gij hem een bieze in den neus leggen, of met een doorn zijn kaak doorboren?","22":"Zal hij aan u veel smekingen maken? Zal hij zachtjes tot u spreken?","23":"Zal hij een verbond met u maken? Zult gij hem aannemen tot een eeuwigen slaaf?","24":"Zult gij met hem spelen gelijk *met* een vogeltje, of zult gij hem binden voor uw jonge dochters?","25":"Zullen de metgezellen over hem een maaltijd bereiden? Zullen zij hem delen onder de kooplieden?","26":"Zult gij zijn huis met haken vullen, of met een visserskrauwel zijn hoofd?","27":"Leg uw hand op hem, gedenk des strijds, doe het niet meer.","28":"Zie, zijn hoop zal feilen; zal hij ook voor zijn gezicht nedergeslagen worden?"},"KJV":{"1":"Then answered the LORD unto Job out of the whirlwind, and said,","2":"Gird up thy loins now like a man: I will demand of thee, and declare","3":"Wilt thou also disannul my judgment? wilt thou condemn me, that thou mayest be righteous?","4":"Hast thou an arm like God? or canst thou thunder with a voice","5":"Deck thyself now *with* majesty and excellency; and array thyself with glory and beauty.","6":"Cast abroad the rage of thy wrath: and behold every one *that is* proud, and abase","7":"Look on every one *that is* proud, *and* bring him low; and tread down the wicked","8":"Hide them in the dust together; *and* bind their faces in secret.","9":"Then will I also confess unto thee that thine own right hand can save","10":"Behold now behemoth, which I made with thee; he eateth grass as an ox.","11":"Lo now, his strength *is* in his loins, and his force *is* in the navel of his belly.","12":"He moveth his tail like a cedar: the sinews of his stones are wrapped together.","13":"His bones *are as* strong pieces of brass; his bones *are* like bars of iron.","14":"He *is* the chief of the ways of God: he that made him can make his sword to approach","15":"Surely the mountains bring him forth food, where all the beasts of the field play.","16":"He lieth under the shady trees, in the covert of the reed, and fens.","17":"The shady trees cover him *with* their shadow; the willows of the brook compass him about.","18":"Behold, he drinketh up a river, *and* hasteth not: he trusteth that he can draw up Jordan into his mouth.","19":"He taketh it with his eyes: *his* nose pierceth through snares.","20":"Canst thou draw out leviathan with an hook? or his tongue with a cord *which* thou lettest down?","21":"Canst thou put an hook into his nose? or bore his jaw through with a thorn?","22":"Will he make many supplications unto thee? will he speak soft","23":"Will he make a covenant with thee? wilt thou take him for a servant for ever?","24":"Wilt thou play with him as *with* a bird? or wilt thou bind him for thy maidens?","25":"Shall the companions make a banquet of him? shall they part him among the merchants?","26":"Canst thou fill his skin with barbed irons? or his head with fish spears?","27":"Lay thine hand upon him, remember the battle, do no more.","28":"Behold, the hope of him is in vain: shall not *one* be cast down even at the sight"}},"tsk":{"1":[{"kopje":"uit","refs":["Job 38:1","Ps 50:3","Ps 50:4","Hebr 12:18-20","2 Petr 3:10-12"]}],"2":[{"kopje":"Gord","refs":["Job 13:22","Job 23:3","Job 23:4","Job 38:3"]},{"kopje":"Ik","refs":["Job 42:4"]}],"3":[{"kopje":"Zult","refs":["Ps 51:6","Rom 3:4"]},{"kopje":"te niet maken","refs":["Jes 14:27","Jes 28:18","Gal 3:15","Gal 3:17","Hebr 7:18"]},{"kopje":"Zult U Mij verdoemen","refs":["Job 10:3","Job 27:2-6","Job 32:2","Job 34:5","Job 34:6","Job 35:2","Job 35:3"]}],"4":[{"kopje":"Hebt","refs":["Job 9:4","Job 23:6","Job 33:12","Job 33:13","Ex 15:6","Ps 89:11","Ps 89:14","Jes 45:9","1 Kor 10:22"]},{"kopje":"kunt","refs":["Job 37:4","Job 37:5","Ps 39:4-10"]}],"5":[{"kopje":"Versier","refs":["Job 39:22","Ps 93:1","Ps 104:1","Ps 104:2","Jes 59:17"]},{"kopje":"majesteit","refs":["1 Kron 29:11","Ps 21 \"H6083\">dust</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together;</span> and <span class=\"wl wl-kjv\" data-code=\"H2280\">bind</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> in secret.","9":"Then will I also <span class=\"wl wl-kjv\" data-code=\"H3034\">confess</span> unto thee that thine own right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> can save","10":"Behold now <span class=\"wl wl-kjv\" data-code=\"H930\">behemoth,</span> which I <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> with thee; he <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> <span class=\"wl wl-kjv\" data-code=\"H2682\">grass</span> as an ox.","11":"Lo now, his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> is in his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and his <span class=\"wl wl-kjv\" data-code=\"H202\">force</span> is in the <span class=\"wl wl-kjv\" data-code=\"H8306\">navel</span> of his belly.","12":"He <span class=\"wl wl-kjv\" data-code=\"H2654\">moveth</span> his <span class=\"wl wl-kjv\" data-code=\"H2180\">tail</span> like a <span class=\"wl wl-kjv\" data-code=\"H730\">cedar:</span> the <span class=\"wl wl-kjv\" data-code=\"H1517\">sinews</span> of his <span class=\"wl wl-kjv\" data-code=\"H6344\">stones</span> are wrapped together.","13":"His <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are as <span class=\"wl wl-kjv\" data-code=\"H650\">strong</span> pieces of <span class=\"wl wl-kjv\" data-code=\"H5154\">brass;</span> his <span class=\"wl wl-kjv\" data-code=\"H1634\">bones</span> are like <span class=\"wl wl-kjv\" data-code=\"H4300\">bars</span> of iron.","14":"He is the <span class=\"wl wl-kjv\" data-code=\"H7225\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">God:</span> he that <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him can <span class=\"wl wl-kjv\" data-code=\"H5066\">make</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> to approach","15":"Surely the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> bring him <span class=\"wl wl-kjv\" data-code=\"H5375\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H944\">food,</span> where all the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> play.","16":"He <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> under the shady <span class=\"wl wl-kjv\" data-code=\"H6628\">trees,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5643\">covert</span> of the <span class=\"wl wl-kjv\" data-code=\"H7070\">reed,</span> and fens.","17":"The shady <span class=\"wl wl-kjv\" data-code=\"H6628\">trees</span> <span class=\"wl wl-kjv\" data-code=\"H5526\">cover</span> him with their <span class=\"wl wl-kjv\" data-code=\"H6752\">shadow;</span> the <span class=\"wl wl-kjv\" data-code=\"H6155\">willows</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> compass him about.","18":"Behold, he drinketh <span class=\"wl wl-kjv\" data-code=\"H6231\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> and <span class=\"wl wl-kjv\" data-code=\"H2648\">hasteth</span> not: he <span class=\"wl wl-kjv\" data-code=\"H982\">trusteth</span> that he can draw <span class=\"wl wl-kjv\" data-code=\"H1518\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> into his mouth.","19":"He <span class=\"wl wl-kjv\" data-code=\"H3947\">taketh</span> it with his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> his <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> pierceth <span class=\"wl wl-kjv\" data-code=\"H5344\">through</span> snares.","20":"Canst thou draw <span class=\"wl wl-kjv\" data-code=\"H4900\">out</span> <span class=\"wl wl-kjv\" data-code=\"H3882\">leviathan</span> with an <span class=\"wl wl-kjv\" data-code=\"H2443\">hook?</span> or his <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> with a <span class=\"wl wl-kjv\" data-code=\"H2256\">cord</span> which thou lettest down?","21":"Canst thou <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> an <span class=\"wl wl-kjv\" data-code=\"H100\">hook</span> into his <span class=\"wl wl-kjv\" data-code=\"H639\">nose?</span> or <span class=\"wl wl-kjv\" data-code=\"H5344\">bore</span> his <span class=\"wl wl-kjv\" data-code=\"H3895\">jaw</span> through with a thorn?","22":"Will he make <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> <span class=\"wl wl-kjv\" data-code=\"H8469\">supplications</span> unto thee? will he <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> soft","23":"Will he <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with thee? wilt thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> him for a <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> for ever?","24":"Wilt thou <span class=\"wl wl-kjv\" data-code=\"H7832\">play</span> with him as with a <span class=\"wl wl-kjv\" data-code=\"H6833\">bird?</span> or wilt thou <span class=\"wl wl-kjv\" data-code=\"H7194\">bind</span> him for thy maidens?","25":"Shall the <span class=\"wl wl-kjv\" data-code=\"H2271\">companions</span> make a <span class=\"wl wl-kjv\" data-code=\"H3739\">banquet</span> of him? shall they <span class=\"wl wl-kjv\" data-code=\"H2673\">part</span> him among the merchants?","26":"Canst thou <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> his <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> with barbed <span class=\"wl wl-kjv\" data-code=\"H7905\">irons?</span> or his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> with <span class=\"wl wl-kjv\" data-code=\"H1709\">fish</span> spears?","27":"<span class=\"wl wl-kjv\" data-code=\"H7760\">Lay</span> thine <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> upon him, <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> do no more.","28":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H8431\">hope</span> of him is in <span class=\"wl wl-kjv\" data-code=\"H3576\">vain:</span> shall not one be cast <span class=\"wl wl-kjv\" data-code=\"H2904\">down</span> even at the sight"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een onweder,","tekst":"Zie boven, Job 38:1 ."}],"2":[{"catchword":"Gord nu","tekst":"Zie boven, Job 38:3 ."},{"catchword":"onderricht Mij","tekst":"Zie op de voorgemelde plaats."}],"3":[{"catchword":"ook Mijn","tekst":"Dat is niet alleen uw oprechtheid verdedigen, maar ook mijn gerechtigheid tekort spreken."},{"catchword":"oordeel","tekst":"Versta, het recht dat God had in het straffen van Job."},{"catchword":"verdoemen,","tekst":"Zie van dit woord Deu 25:1 ."}],"4":[{"catchword":"arm","tekst":"Dat is, macht en sterkte, gelijk God. Alzo Exo 15:16 ; Deu 33:27 ; Psa 79:11 , en Psa 89:14 , en Psa 136:12 ."}],"5":[{"catchword":"Versier","tekst":"Te weten, gelijk Ik daarmede versierd en bekleed ben. Zie Psa 93:1 , en Psa 96:6 , en Psa 104:1 ; Isa 51:9 . God wordt gezegd hiermede aangetogen en bekleed te zijn, omdat zij zich in al zijne oordelen en werken vertonen, hetwelk Job vermaand werd na te komen, zo hij lust had met God te richten. Vergelijk boven, Job 29:14 , en de aantekening."}],"6":[{"catchword":"verbolgenheden","tekst":"Versta, zeer heftige en uitvarende gramschap, die Gode menselijkerwijze hier toegeschreven wordt, alsook boven, Job 21:30 ; Psa 78:49 . De zin is dat Job de macht niet had om zijn vijanden en tegenpartijders te dempen en tenonder te brengen, gelijk wel God had, en dat hij daarom zich niet tegen God moest gesteld hebben, willende tegen hem als tegen zijn partij zijn zaak verdedigen. Zie boven, Job 13:22 , en Job 16:21 , en Job 23:3-5 , enz."},{"catchword":"zie","tekst":"Dat is, veracht hem en aanschouw hem met een gram en dreigend oog; alzo in vs.7, en onder, Job 41:25 ."}],"7":[{"catchword":"in hun plaats","tekst":"Te weten, daar zij verheven en prachtig zijn, hebbende daar al hun staat, vermogen en geweld."}],"8":[{"catchword":"te zamen","tekst":"Te weten, de goddelozen."},{"catchword":"stof;","tekst":"Dat is, in het graf, waar zij in stof veranderd worden; dat is, dood hen. Vergelijk de manier van spreken met Psa 22:16 ."},{"catchword":"verbind","tekst":"Dat is, maak dat men hen niet meer in de wereld ziet, want de aangezichten der doden pleegt men met doeken te verbinden en te dekken. Vergelijk Pro 10:16 , en de aantekening; idem Joh 11:44 , en Joh 20:7 ."}],"9":[{"catchword":"omdat","tekst":"Dat is, dat gij genoegzaam voor uzelven zijt, gelijk Ik ben, om u in het gericht tegen mij te vergelijken."},{"catchword":"rechterhand","tekst":"Dat is, uw kracht en sterkte; alzo Psa 89:43 ; Isa 41:13 ."}],"10":[{"catchword":"Behemoth,","tekst":"Dit woord wordt van velen overgezet olifant. Anderen menen dat het een algemene naam is, begrijpende alle aardse beesten, zowel tamme als wilde, die zeer groot van lichaam zijn, onder welke de olifant een van de voornaamste is. Het woord staat in het getal van velen om de grootheid van dit beest uit te drukken; alzo wijsheden, voor de opperste en hoogste wijsheid; Pro 1:20 ."},{"catchword":"nevens u;","tekst":"Dat is, zowel als u; of met u; dat is, op denzelfden dag der schepping als Ik de eerste twee mensen, en in hen u, oorspronkelijk gemaakt heb. Anders, opdat hij met u op de aarde wonen zou."},{"catchword":"hij eet hooi,","tekst":"Hetwelk een bewijs en teken is van Gods voorzienigheid en macht, waardoor de allergrootste en sterkste beesten worden getemd en den mensen onderworpen."}],"11":[{"catchword":"navel","tekst":"De zin is, dat hij niet alleen in de lenden, dat is in de opperste delen zijns lichaams, maar ook in de onderdelen [die het zwakst plegen te zijn], als in den buik en den navel, enz., zeer sterk is."}],"12":[{"catchword":"zijn staart","tekst":"Anders, hij roert, of richt zijn staart op, enz.; te weten, zo recht opgeheven en zo onbewegelijk als een ceder."},{"catchword":"doorvlochten","tekst":"Dat is, door elkander, ingewikkeld en doortrokken."}],"13":[{"catchword":"vast koper;","tekst":"Hebreeuws, sterkten des kopers, of des staals."}],"14":[{"catchword":"een hoofdstuk","tekst":"Dat is, het voornaamste stuk der werken Gods onder de viervoetige dieren, ten aanzien van zijn grootte en sterkte."},{"catchword":"zijn zwaard","tekst":"Die het woord behemoth voor den olifant nemen, verstaan door zijn zwaard zijn snuit, of uitstekende tanden, waarmede hij zich als met een hand behelpt en grote kracht bedrijft. Anders, kan zijn zwaard tot hem voegen; te weten, om hem te doden; dat is, kan hem doden."}],"15":[{"catchword":"Omdat","tekst":"Dat is, omdat hij niet leeft bij den roof, maar bij het gewas, dat op de bergen voortkomt, zo is het dat andere dieren hem niet vrezen, maar in zijn tegenwoordigheid zonder schroom en zorg zijn. Anders, als de bergen, enz. zo spelen, enz."},{"catchword":"aldaar","tekst":"Dat is, in de plaats waar hij weidt."}],"16":[{"catchword":"schaduwachtige","tekst":"Dat is, die schaduw van zich geven. Alzo in vs.17."},{"catchword":"in een schuilplaats","tekst":"Te weten, waar hij verkoeling en verversing zoekt tegen de grote en felle hitte der zon."}],"17":[{"catchword":"elkeen","tekst":"Of, tot [zijn] schaduw; dat is, opdat zij hem schaduw zouden maken."}],"18":[{"catchword":"doet","tekst":"Te weten, als hij in de rivier ingaat om te drinken, belet hij den loop van den rivier. Of, hij zwelgt de rivier met geweld in. Waarvan de zin is dat hij zoveel water inzuigt, dat hij de rivier schijnt te zullen inzwelgen. Dit zijn poëtische en overtollige manieren van spreken."},{"catchword":"verhaast","tekst":"Te weten, in het drinken niet vrezende den waterstroom, noch dat enig mens of beest hem zou kunnen verjagen en verhinderen, gelijk men schrijft dat andere gedierten uit de rivier Nijl met grote zorg drinken, vrezende van den krokodil verslonden te worden. Anders, [dat] zij, te weten de rivier, zich niet kan haasten, te weten om in haar loop voort te vloeien."},{"catchword":"Jordaan","tekst":"Zie van deze rivier Gen 13:10 ."}],"19":[{"catchword":"voor zijn ogen","tekst":"Dat is, dat hij het ziet, met geweld en niet met behendigheid."}],"20":[{"catchword":"Leviathan","tekst":"Versta, een zeer groot en schrikkelijk zeegedierte, hetwelk leviathan genoemd wordt, naar sommiger gevoelen van het Hebreeuwse woord lavah, hetwelk betekent bijdoen, bijvoegen, omdat zijn lijf met vele schubben bedekt is, die zeer vast samengevoegd zijn. Sommigen verstaan een zeedraak. Vergelijk Isa 27:1 ."},{"catchword":"trekken,","tekst":"Te weten, om hem te vangen, gelijk men andere vissen vangt. Hij wil zeggen: Neen gij, want hij is veel te groot en te sterk om zo gevangen te worden."},{"catchword":"zijn tong","tekst":"Te weten, trekken, nadat gij hem met den angel of haak gevat hebt. Anders, zult gij zijn tong met een koord nedertrekken?"}],"21":[{"catchword":"in den neus","tekst":"Versta, een ijzeren angel, hebbende den vorm van een gekromde bies. De zin is dat een mens met een zodanig instrument den leviathan, als hij hem gevangen had, niet zou kunnen vasthouden en bedwingen, gelijk men wel doet met andere beesten."},{"catchword":"doorn","tekst":"Of, haak uit doornen, of naar den vorm der doornen gemaakt."}],"22":[{"catchword":"veel smekingen","tekst":"Te weten, om uit uw handen verlost te worden, nadat gij hem gevangen hebt, en zijns zelfs weder te worden. Het is van de beesten menselijkerwijze gesproken. Vergelijk boven, Job 39:21 ."},{"catchword":"zachtjes","tekst":"Hebreeuws, zachte, of gladde dingen, of redenen, voortkomende van degenen, die met ootmoedig bidden pogen iets te verkrijgen."}],"23":[{"catchword":"een eeuwigen","tekst":"Hebreeuws, tot een slaaf, of knecht der eeuwigheid; dat is tot een slaaf, die u eeuwiglijk dient en onderworpen is."}],"24":[{"catchword":"vogeltje,","tekst":"Zie van het Hebreeuwse woord Gen 7:14 , en Lev 14:4 ."},{"catchword":"voor uw jonge","tekst":"Te weten, opdat zij daarmede zich vermaken en tijdverdrijf hebben zouden."}],"25":[{"catchword":"metgezellen","tekst":"Versta, de vissers, die tezamen in een verdrag en compagnie zijn, en zulk een vis zouden mogen gevangen hebben."},{"catchword":"maaltijd","tekst":"Te weten, uit blijdschap van een zodanige vangst, of uit hoop daarvan."},{"catchword":"kooplieden?","tekst":"Hebreeuws, de Kanaänieten. Zo waren de kooplieden genaamd, omdat de oude inwoners van het land Kanaän veel met koophandel omgingen, zijnde daartoe aan de Middellandse zee zeer wel geleGen. Het woord is zo ook genomen Pro 31:24 ; Isa 23:8 ; Hos 12:8 ."}],"26":[{"catchword":"vullen,","tekst":"Dat is, om en om vatten en gans doorsteken, om hem te vangen en vast te houden."},{"catchword":"zijn hoofd?","tekst":"Te weten, waar de vissers mede geslagen, vastgehouden en gevangen worden."}],"27":[{"catchword":"op hem,","tekst":"Te weten, om hem te strelen en troetelen, en alzo met vriendschap aan u te krijGen. Anders, leg gij uw hand op hem, om hem geweldiglijk aan te tasten en zo te vangen."},{"catchword":"des strijds,","tekst":"Te weten, dien gij zoudt moeten uitstaan, indien gij hem enigszins aantastte om hem te vangen."},{"catchword":"doe het niet meer","tekst":"Dat is, poog niet meer aan hem te komen, uit vrees van schade te lijden. Anders, ik wil niet meer des strijds gedenken."}],"28":[{"catchword":"zijn hoop","tekst":"Te weten, desgenen die hem vangen wil, en daartoe de hand aan hem legt. Anders, de hoop van hem; te weten, te vangen."},{"catchword":"feilen;","tekst":"Hebreeuws, leugenachtig worden; dat is, gans nietig en tevergeefs, overmits hij hem niet vangen zal."},{"catchword":"hij ook","tekst":"Te weten, de leviathan. Anders, zal hij [te weten, die hem zoekt te vangen] ook [niet] voor zijn gezicht, of als hij gezien wordt, nedergeslagen, of nedergeworpen worden?"},{"catchword":"gezicht","tekst":"Dat is, desgenen, die hem zoekt te vangen."},{"catchword":"nedergeslagen","tekst":"Te weten, door vrees van dengene, die hem vangen wil."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(1) And the LORD answered Job out of a tempest. [See above chap.38.on v.1.] and said:"}],"2":[{"catchword":null,"tekst":"(2) Gird now thy lions as a man. [See above chap.38.on v.3.] I shall ask thee, and instruct thou me. [see the foresaid place.]"}],"3":[{"catchword":null,"tekst":"(3) Wilt thou also bring to nought my judgement? [Understand the right God had in punishing of Job; the meaning is, wilt thou undertake not only to maintain thy own uprightness, but likewise speak to the prejudice of my righteousness?] Wilt thou condemn [See of this word, Deut.25.on v.1.] me, that thou mayst be righteous?"}],"4":[{"catchword":null,"tekst":"(4) Hast thou an arm like God [i.e. the like strength and might as God hath. So Exo 15:16. Deut.33.27. Psa 79:11. and 89.14. and 136.12.] and canst thou thunder with the voice like he?"}],"5":[{"catchword":null,"tekst":"(5) Adorn thy self now with excellency, and highness, and cloth thy self with Majesty and glory, [viz. As I am adorned and clothed with the same. See Psal.39.1. and 96.6. and 104.1. Isa.51.v.9. God is said to be decked and clothed with them, forasmuch as they do appear and shew forth themselves in all his works and judgements; which Job is willed here to imitate, if he had a mind to enter into debate with God. Compare above 29.14. and the annot.]"}],"6":[{"catchword":null,"tekst":"(6) Scatter forth the indignations of thy wrath; [Understand a most fierce and extream anger which is ascribed unto God here, according to the manner of men; as also above chap.21.30. Psa 78:49. The meaning is, that Job had not the power, to quell and suppress his enemies and adversaries which God had, and that therefore he ought not to have set himself against God, with intent and purpose to maintain his cause against him, against his adverse party. See above chap.13.22. and 16.21. and 23.3,4,5,etc.] and look on every high minded and humble him [i.e. look scornfully and with contempt upon him, shew him a grim and threatening countenance; and so in the verse following, and below chap.41.25.]"}],"7":[{"catchword":null,"tekst":"(7) Look upon every high minded (and) bring him down, and crush the wicked in their place, [viz. Where they are exalted and magnificent; where they have all their state and wealth and power, and exercise their insolence.]"}],"8":[{"catchword":null,"tekst":"(8) Break them together in the dust; [the wicked namely, in the dust, i.e. into the grave, where they are turned into dust, i.e. put them to death, destroy them, compare the manner of speaking with Psa 22:16.] bind up their faces in the covert, [i.e. make or cause them to be no more seen in this world, for they used to cover and bind up the faces of the dead with certain cloths and kerchiefs. Compare Pro 10:6. and the annot. Joh 11:44. and 20.7.]"}],"9":[{"catchword":null,"tekst":"(9) Then shall I also praise thee, because that thy right band shall have delivered thee [i.e. that thou are self-sufficient, as I am, to compare thy self with me in judgement. Thy right hand, i.e. thy own power and strength. So also Psa 89:43. Isa 41:13.]"}],"10":[{"catchword":null,"tekst":"(10) Behold now, Behemoth, [this word is by many wondered Elephant. Others take it to be a general name, comprehending all terrestrial brute Creatures, both tame and savage, being vast and great of Body, among which the Elephant is one of the Principal. The word is set down in the plural number, thereby to set out the huge bigness of those Beasts; thus wisdoms; for the chiefest and highest wisdom, Pro 1:20.] whom I have made beside thee, [i.e. as well as thee: or together with thee, viz. On the same sixth day of the Creation, when I made the first man and woman, and thy self originally in them. Oth. That he should dwell with thee upon Earth] he eateth hay like an Oxe [which is a token and testimony of Gods providence and power, whereby the greatest and strongest beasts are tamed and subjected to man.]"}],"11":[{"catchword":null,"tekst":"(11) Behold now his power is in his lions, and his might in the navel of his belly, [The meaning is, that he is very strong; not only in his lions, or the upper parts of his body, but also in the lower parts (which use to be but weak) as in the belly and navel, etc.]"}],"12":[{"catchword":null,"tekst":"(12) When it pleaseth him, his tail is like a Cedar tree: [Oth. He stirreth, or erecteth his tail up, as a, etc. Viz. So bolt upright, and so immoveable as a Cedar] the sinews of his privy [Heb. Stones] are plighted [or complicated, interwoven, wounded up drawn one through another.]"}],"13":[{"catchword":null,"tekst":"(13) His bones are (like) firm [or massy] copper. [Heb. Strengths of copper or steel] his bones are like iron hand-bars."}],"14":[{"catchword":null,"tekst":"(14) He is a chief-piece of the ways of God, [i.e. the chief and principal piece of Gods works, among the four footed beasts; in regard of his greatness and strength] he that made him, hath joined his sword (unto him) [those which take Behemoth here to be the Elephant, do understand by his sword his long snout or huge tusks forth his mouth, whereby he maketh shift to held himself as with hands and weapons, and is able to perform mighty feats. Oth. Can join his sword unto him, viz. For to put him to death, i.e. is able to kill and destroy him.]"}],"15":[{"catchword":null,"tekst":"(15) Because the hills do bring him forth jodder, therefore all the beasts of the field play there, [viz. In the same place where he feedeth: the sense is, in regard he liveth not on prey, but feeds on grass and herbs, that growth upon the hills, thence it is, that other beasts are not afraid of him, but freely feed and disport themselves in his presence, without any care or trouble. Oth. When the hills, &c. Then play, &c.]"}],"16":[{"catchword":null,"tekst":"(16) He lieth down under shadowing trees, [i.e. such as yield great and thick shadows from them, and so in the next verse] in a lurking-place of the reed and of the mire, [viz. Where he seeketh to cool and refresh himself against the great and fierce heat of the Sun.]"}],"17":[{"catchword":null,"tekst":"(17) The shadowing trees do cover him, every one with its shadow: [Or (for) his shadow, i.e. to make shadow for him] the brook-willows encompass him."}],"18":[{"catchword":null,"tekst":"(18) Behold he forceth the River, [viz. When he goeth into the River for to drink, then doth he hinder the stream or course of it. Or he swilleth the River in with force; the meaning whereof is that he suppeth up so much of the water, one would think he might go neer to swallow up all. These are poetical & hyperbolical expressions] and doth not over haste himself [viz. In drinking being not afraid of the streams violence, or that any man or beasts should disturb or let him, so as they write that other beasts drink of the River Nilus with great deal of fear and anxiousness, least the Crocodile should snatch and swallow them up. Oth. That she, viz. The River cannot hasten her self, viz. To run on freely in her course] he trusteth that he shall be able to draw in that Jordan into his mouth, [of this River see Gen 14:10.]"}],"19":[{"catchword":null,"tekst":"(19) Should one be able to take him before his eyes? [So that he is aware of it, by meer force, and not by slight or stratagem] should one be able to bore his nose through with halters?"}],"20":[{"catchword":null,"tekst":"(40:20) Canst thou draw the Leviathan with the angle? [i.e. think to take him, and to draw him to the boat or shoar, after that he hath taken the angle or fish-hook, even as other fish are taken. He will say; not thou not sure, for he is too strong and great thus to be taken. By the Leviathan is understood a great and terrible Sea-monster, which is called Leviathan, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

    toast.classList.add('zichtbaar');

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
