schaduw van de dood, en zonder ordeningen, en het geeft schijnsel als de duisternis."},"SV":{"1":"Mijn ziel is verdrietig over mijn leven; ik zal mijn klacht op mij laten; ik zal spreken in bitterheid mijner ziel.","2":"Ik zal tot God zeggen: Verdoem mij niet; doe mij weten, waarover Gij met mij twist.","3":"Is het U goed, dat Gij verdrukt, dat Gij verwerpt den arbeid Uwer handen, en over den raad der goddelozen schijnsel geeft?","4":"Hebt Gij vleselijke ogen, ziet Gij, gelijk een mens ziet?","5":"Zijn Uw dagen als de dagen van een mens? Zijn Uw jaren als de dagen eens mans?","6":"Dat Gij onderzoekt naar mijn ongerechtigheid, en naar mijn zonde verneemt?","7":"Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlosse.","8":"Uw handen doen mij smart aan, hoewel zij mij gemaakt hebben, te zamen rondom *mij* zijn zij, en Gij verslindt mij.","9":"Gedenk toch, dat Gij mij als leem bereid hebt, en mij tot stof zult doen wederkeren.","10":"Hebt Gij mij niet als melk gegoten, en mij als een kaas doen runnen?","11":"Met vel en vlees hebt Gij mij bekleed; met beenderen ook en zenuwen hebt Gij mij samengevlochten;","12":"Benevens het leven hebt Gij weldadigheid aan mij gedaan, en Uw opzicht heeft mijn geest bewaard.","13":"Maar deze dingen hebt Gij verborgen in Uw hart; ik weet, dat dit bij U geweest is.","14":"Indien ik zondig, zo zult Gij mij waarnemen, en van mijn misdaad zult Gij mij niet onschuldig houden.","15":"Zo ik goddeloos ben, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben zat van schande, maar aanzie mijn ellende.","16":"Want zij verheft zich; gelijk een felle leeuw jaagt Gij mij; Gij keert weder en stelt U wonderlijk tegen mij.","17":"Gij vernieuwt Uw getuigen tegenover mij, en vermenigvuldigt Uw toorn tegen mij; verwisselingen, ja, een heirleger, zijn tegen mij.","18":"En waarom hebt Gij mij uit de baarmoeder voortgebracht? Och, dat ik den geest gegeven had, en geen oog mij gezien had!","19":"Ik zou zijn, alsof ik niet geweest ware; van *moeders* buik zou ik tot het graf gebracht zijn geweest.","20":"Zijn mijn dagen niet weinig? Houd op , zet van mij af , dat ik mij een weinig verkwikke;","21":"Eer ik henenga (en niet wederkom) in een land der duisternis en der schaduwe des doods;","22":"Een stikdonker land, als de duisternis zelve, de schaduwe des doods, en zonder ordeningen, en het geeft schijnsel als de duisternis."},"KJV":{"1":"My soul is weary of my life; I will leave my complaint upon myself; I will speak in the bitterness of my soul.","2":"I will say unto God, Do not condemn me; shew me wherefore thou contendest","3":"*Is it* good unto thee that thou shouldest oppress, that thou shouldest despise the work of thine hands, and shine upon the counsel of the wicked?","4":"Hast thou eyes of flesh? or seest thou as man seeth?","5":"*Are* thy days as the days of man? *are* thy years as man's days,","6":"That thou enquirest after mine iniquity, and searchest after my sin?","7":"Thou knowest that I am not wicked; and *there is* none that can deliver out of thine hand.","8":"Thine hands have made me and fashioned me together round about; yet thou dost destroy","9":"Remember, I beseech thee, that thou hast made me as the clay; and wilt thou bring me into dust again?","10":"Hast thou not poured me out as milk, and curdled me like cheese?","11":"Thou hast clothed me with skin and flesh, and hast fenced me with bones and sinews.","12":"Thou hast granted me life and favour, and thy visitation hath preserved my spirit.","13":"And these *things* hast thou hid in thine heart: I know","14":"If I sin, then thou markest me, and thou wilt not acquit me from mine iniquity.","15":"If I be wicked, woe unto me; and *if* I be righteous, *yet* will I not lift up my head. *I am* full of confusion; therefore see thou mine affliction;","16":"For it increaseth. Thou huntest me as a fierce lion: and again thou shewest thyself marvellous","17":"Thou renewest thy witnesses against me, 90\">womb</span> to the grave.","20":"Are not my <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">few?</span> <span class=\"wl wl-kjv\" data-code=\"H2308\">cease</span> then, and let me <span class=\"wl wl-kjv\" data-code=\"H7896\">alone,</span> that I may take <span class=\"wl wl-kjv\" data-code=\"H1082\">comfort</span> a little,","21":"Before I <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> whence I shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> even to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> and the shadow of death;","22":"A <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5890\">darkness,</span> as <span class=\"wl wl-kjv\" data-code=\"H652\">darkness</span> itself; and of the shadow of <span class=\"wl wl-kjv\" data-code=\"H6757\">death,</span> without any <span class=\"wl wl-kjv\" data-code=\"H5468\">order,</span> and where the <span class=\"wl wl-kjv\" data-code=\"H3313\">light</span> is as darkness."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"over mijn leven;","tekst":"Versta, over de ellende mijns levens."},{"catchword":"op mij laten;","tekst":"Dat is, ik zal dezelve niet laten ophouden, maar wil den toom losgeven, dat ik mijn hart met treuren en kermen uitstort."},{"catchword":"bitterheid","tekst":"Zie boven, Job 7:11 , en de aantekening daarop."}],"2":[{"catchword":"Verdoem mij niet;","tekst":"Dit woord betekent iemand onrechtvaardig en strafbaar verklaren. Zie Deu 25:1 ; alzo 1Ki 8:32 ; Psa 94:21 ; Pro 17:15 ; Rom 8:34 ."},{"catchword":"waarover","tekst":"Dat is, welke de reden is van den twist. Want ik heb U gevreesd en gediend met een goede conscientie, en evenwel hebt Gij mij al deze ellende laten overkomen."}],"3":[{"catchword":"goed,","tekst":"Dat is, eerlijk, profijtelijk of vermakelijk."},{"catchword":"den arbeid","tekst":"Dat is, mij, uw schepsel, dat Gij gemaakt hebt. Het Hebreeuwse woord betekent een werk, dat zeer naarstiglijk voltrokken is, als tot vermoeidheid toe."},{"catchword":"schijnsel","tekst":"God wordt gezegd over iets of iemand te schijnen, of schijnsel te geven, als Hij zijn zegen geeft en weldadigheid bewijst. Alzo onder, Job 29:3 . Vergelijk Num 6:25 ."}],"4":[{"catchword":"vleselijke","tekst":"Hebreeuws, ogen des vleesches; dat is, ogen der mensen, die naar het uiterlijke plegen te oordelen en door driften gedreven worden, zonder wel acht te geven op de waarheid der zaak en den eis des rechts."}],"5":[{"catchword":"Zijn Uw dagen","tekst":"De zin is, hebt Gij tijd van doen, als een werelds rechter, om kennis van zaken te nemen, eer Gij uw oordeel kondt strijken?"}],"6":[{"catchword":"Dat Gij","tekst":"Te weten, door deze bittere smart, die ik lijd, en al de andere straffen, die Gij mij toegezonden hebt, welke mij allen gelijk pijnigingen zijn, waarmede Gij mij schijnt te pijnigen om mij de bekentenis mijner misdaden uit te persen."},{"catchword":"verneemt?","tekst":"Even alsof alle dingen U niet ten volle bekend waren."}],"7":[{"catchword":"Het is","tekst":"Dat is, Gij weet het, dat ik, enz. Vergelijk de manier van spreken met Hos 10:10 , en zie de aantekening aldaar."},{"catchword":"niet goddeloos ben;","tekst":"Dat is, geen huichelaar of heimelijke booswicht, gelijk ik gescholden word."},{"catchword":"verlosse","tekst":"Te weten, mij, die onschuldig ben van de lasteren, waarmede mijn vrienden mij bezwaren."}],"8":[{"catchword":"Uw handen","tekst":"De zin is, dat de handen Gods, die Job gemaakt hadden, nu hem door deze gruwelijke straffen, niet alleen schenen te willen bedroeven, maar gans te willen verderven. Anderen zetten het Hebreeuwse woord over, maken, formeren, bearbeiden, of fatsoeneren; waaruit dan de overzetting aldus staat: Uw handen hebben mij bearbeid en gemaakt; te weten, met grote kunst en naarstigheid."},{"catchword":"rondom","tekst":"Te weten, om mij smart aan te doen; of om mij, dien Gij gemaakt hebt, te onderhouden en te regeren in dit leven; Psa 139:3 ; Act 17:27-28 . Anders, tezamen om en om, al wat ik ben; te weten, heeft Hij mij gemaakt. Dit gehele vers wordt ook aldus overgezet: Uw handen hebben mij bearbeid en mij gemaakt; nochtans tezamen rondom heen verslindt Gij mij. Of, en mij gemaakt, tezamen om en om; en zult Gij mij verslinden?"}],"9":[{"catchword":"bereid hebt,","tekst":"Dat is, uit het zaad mijner ouders voortgekomen van Adam, wiens lichaam uit de aarde was geschapen en gefatsoeneerd, gelijk een pottenbakker uit het leem een vat toemaakt, en dat Gij mij wederom in stof en aarde veranderen zult. De zin is: Gedenk, dat ik van een zwakke en tedere conditie ben, en handel daarom met mij zachtelijker."}],"10":[{"catchword":"als melk","tekst":"Dit is gesproken bij gelijkenis, om uit te drukken een zeer wonderbare werking des Heeren, waardoor de mens naar de orde van God in de natuur gesteld, in zijner moeders lichaam ontvangen wordt. Vergelijk Psa 139:14-16 ."}],"11":[{"catchword":"samengevlochten;","tekst":"Te weten, gelijk de omtuiningen en heiningen met wissen en buigzame tenen tezamen gehecht worden. Anders, overdekt."}],"12":[{"catchword":"Benevens","tekst":"Dat is, Gij hebt mij niet alleen het leven gegeven, maar ook in hetzelve vele weldaden bewezen, rakende zowel de bewaring en onderhouding deszelven als de gedurige regering."},{"catchword":"opzicht","tekst":"Of, bezoek; dat is, zorg en toezien."},{"catchword":"mijn geest","tekst":"Dat is, mijn ziel, waardoor ik leEf."}],"13":[{"catchword":"deze dingen","tekst":"Dat is, deze plagen en straffen. Alsof hij zeide: Gij hebt tevoren wel vele weldaden bewezen, maar dit kwaad, dat mij nu overkomt, hebt Gij in Uzelven verborgen gehouden en mij niet geopenbaard."},{"catchword":"dat dit","tekst":"Dat is, dat Gij in Uzelven besloten hadt, mij deze straffen toe te zenden en dit grote verdriet aan te doen."}],"14":[{"catchword":"waarnemen,","tekst":"Te weten, om mij te straffen. Vergelijk onder, Job 14:16 , en Job 31:4 . Anders, zo ik gezondigd heb, zult Gij daarom over mij de wacht houden en mij van mijn misdaad niet onschuldig verklaren? Vergelijk boven, Job 7:12 ."},{"catchword":"onschuldig","tekst":"Of, zuiver."}],"15":[{"catchword":"mijn hoofd","tekst":"Die worden gezegd hun hoofd op te heffen, welke goeden moed gekregen hebbende, wat beter verwachten; Luk 21:28 ."},{"catchword":"zat","tekst":"Dat is, vervuld en overstelpt van schande. Zie boven, Job 7:4 . Anders, wordt verzadigd met de schande, te weten, die ik nu lijd, en aanziet, enz."}],"16":[{"catchword":"zij verheft","tekst":"Te weten, de ellende."},{"catchword":"gelijk","tekst":"Het is een gelijkenis, genomen van de leeuwen, die het wild met groot geweld en gruwzaamheid najagen."},{"catchword":"Gij keert weder","tekst":"Hij klaagt dat God niet alleen met een of twee vreeslijke plagen over hem gekomen was, maar dat Hij daarna wedergekeerd zijnde, met andere plagen zich in het straffen van zijn persoon zeer vreemd en zeldzaam vertoond had."}],"17":[{"catchword":"getuigen","tekst":"Dat is, straffen en plagen, die van uw gramschap getuigenis geven."},{"catchword":"verwisselingen,","tekst":"Te weten, der kwalen; dat is, verscheidene ellenden en katijvigheden, die al bij beurten op elkander gehoopt en getast worden. Anders, uitdelgingen. Zo zou hij zijn plagen noemen, omdat zij hem uitroeiden."},{"catchword":"heirleger,","tekst":"Zo worden zijn ellenden genaamd, vanwege haar menigte, geweld en gruwzaamheid."}],"18":[{"catchword":"geest","tekst":"Te weten, in mijner moeders lichaam, eer ik ter wereld kwam."},{"catchword":"mij gezien had","tekst":"Te weten, levend."}],"19":[{"catchword":"moeders","tekst":"Zie boven, Job 3:10 ."}],"20":[{"catchword":"Houd op,","tekst":"Te weten, van mij dus te straffen."},{"catchword":"zet van mij af,","tekst":"Dat is, houd op van mij te belegeren. Vergelijk Psa 3:7 ; Isa 22:7 ."}],"21":[{"catchword":"wederkom","tekst":"Te weten, in dit tijdelijke leven."},{"catchword":"in een land","tekst":"Dat is, in het graf, hetwelk ook duisternis genaamd wordt, onder, Job 17:13 ."},{"catchword":"schaduwe","tekst":"Dat is, dodelijke schaduw; versta, een zeer dikke en donkere schaduw, die met den dood verenigd is, gelijk er is des grafs schaduw. Alzo in vs.22."}],"22":[{"catchword":"ordeningen,","tekst":"Te weten, van dag en nacht, licht en duisternis, zomer en winter, lente en herfst, hitte en koude. De zin is, dat deze veranderingen der lucht en van den tijd, die bij beurten elkander achtervolgen, in de donkerheid des grafs niet gezien worden, zijnde daar anders niet dan enkel verwarring."},{"catchword":"en het geeft","tekst":"Dat is, het klaarste, dat in het graf is, is anders niet dan dikke, tastelijke en ijslijke donkerheid."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"My soul is vexed at my life; [understand at, or by reason of the miseries or wretchedness of his life.] I shall leave my complaint upon me; [i.e. I shall not give it over, but let the reins lose to it, that I may power out my heart with grief and lamentation] I will speak in the bitterness of my soul. [See ab.ch.7.11. and the annotation thereupon.]"}],"2":[{"catchword":null,"tekst":"I will say unto God, Condemn me not: [this word doth signify to declare one unrighteous, or, punishable. See Deut.25.on ver.1. and so likewise, 1 Kings 8.32. Psa 94:21. Prov 17:15. Rom 8:34.] make me know for what thou contendest with me. [i.e. what the reasons are of the controversy; for I have feared thee and served thee with a good conscience; and nevertheless thou hast suffered all this misery to come upon me.]"}],"3":[{"catchword":null,"tekst":"Is it good (for) thee [i.e. honourable, profitable, pleasurable.] that thou oppressest? That thou rejectest the labour of thine hands? [i.e. me, thy creature which thou hast made. The Hebrew word doth signify, such a kind of Work, as is most carefully wrought, not without painful and wearisome labour.] and givest brightness over the counsel of the wicked? [God is said to shine, or give brightness over a thing or person, when he doth bless and prosper the same. So below 29.3. comp. Num.6.on v.25.]"}],"4":[{"catchword":null,"tekst":"Hast thou carnal eyes? [Heb. Eyes of flesh? i.e. eyes of men, that judge by the outward appearance, and are carried away by passion, not heeding the truth of things, and the requisites of justice?] dost thou see as a man seeth?"}],"5":[{"catchword":null,"tekst":"Are your days as the days of a man? [the sense is, Have you need of time, like worldly judges, to take knowledge of matters, before you proceed to give sentence, or pass your judgement?] are your years as the years of a man?"}],"6":[{"catchword":null,"tekst":"That thou searchest after mine unrighteousness [viz. By these bitter pains, which I endure, and all the other afflictions which thou hast sent upon me; which are all of them as so many torments unto me, whereby thou seemest to rack and torture me, for to press the confession of my misdeeds out of me.] and enquires after my sin? [as though the same were not fully known unto there before-hand.]"}],"7":[{"catchword":null,"tekst":"It is in thy knowledge [i.e. Thou knowest it full well; compare this manner of speaking with Hos 10:10. and see the annotation there.] that I am not wicked [i.e. no hypocrite, nor secret wicked wretch, as I am charged to be.] nevertheless there is none that delivereth out of thine hand [me namely, that am not guilty of the crimes my friends do charge me with.]"}],"8":[{"catchword":null,"tekst":"Thy hands put me to pain, although they made me: [the meaning is, that he hands of God, which had made Job, seemed now ready by these terrible affections not only to try and prove, but even utterly to destroy him. Others render the Hebrew word hatzab, to make, form, work, shape or fashion: and then the text might be read thus; Thine hands have wrought and made me, viz. With a great deal of art and care.] they are together round about (me) [viz. To put me to pain and anguish, or, to maintain and govern me in this life, since thou hast made me, Psa 139:3. Act 17:27,28. Oth. Together round about, all what I am, viz. Hast thou made] and thou doest swallow me up [this whole verse is likewise read in this manner. Thine hands have wrought me and made me; nevertheless thou swallowest me up together, round about. Or, and made me together, round about: and shouldst thou swallow me up?]"}],"9":[{"catchword":null,"tekst":"Remember ( I prey) that thou didst prepare me as clay, and shalt make me return to dust. [i.e. being descended by my parents seed from Adam, whose body was created out of the earth, and fashioned, even as potter prepareth or shapeth a vessel out of clay; and that thou shalt change me again to dust and earth; the sence is. Remember, that I am of a very weak and frail condition, and therefore deal more gently and tenderly with me.]"}],"10":[{"catchword":null,"tekst":"Hast thou not powered me out like milk, and made me run like cheese? [this is spoken by way of comparison, to express the most wonderful operation of the LORD, whereby mankind by Gods order apprinted in nature, is conceived in the Mothers womb. Comp.Psal.139.15,16.]"}],"11":[{"catchword":null,"tekst":"With skin and flesh hast thou clothed me: with ones also, and sinews hast thou plated me together: [viz. Like as the pales or fences about a close or garden, are bound in and plated together with withes, and the like. Oth. Covered me over.]"}],"12":[{"catchword":null,"tekst":"Besides the life, thou haste done kindness unto me: [i.e. thou haste not onely given me life, but likewise in the same, shewed many kindnesses unto me, as well in the preservation and maintaining of it, as in the continual governing thereof.] and thy survey [or, visitation, i.e. care or regard, inspection.] hath kept my spirit. [i.e. my soul, whereby I live.]"}],"13":[{"catchword":null,"tekst":"But these things thou hast hidden in thine heart: [i.e. these plagues and punishments, as if he said, thou hast indeed shewed many kindnesses unto me heretofore, but this evil that now doth come upon me, thou hast kept secret by thy self, and not revealed it unto me.] I know that this hath been with thee. [i.e. that thou hadst determined it with thy self, to send these great afflictions upon me, and to distress and grieve me in this sort.]"}],"14":[{"catchword":null,"tekst":"If I sin thou shalt observe me, [viz. To punish me. Compare below 14.16. & 31.4.] and of my misdeed thou shalt not hold me guiltless. [or, clean, otherwise the whole verse may be read thus. If I have sinned, shalt thou therefore keep the watch over, and not declare me guiltless of my misdeed? Compare above chap.7. verse 12.]"}],"15":[{"catchword":null,"tekst":"If I am wicked, wo (is) me; and if I am righteous, I shall not lift up mine head, [those are said to lift up their heads, which having received good hopes and encouragement, do yet expect something better, Luk 21:28.] I am full [satur] of reproaches; [i.e. I am overcharged and cloyed with reproach. See above chap.7. on verse 4. Otherwise. Be satisfied with my reproach, viz. Which I endure now, and see thee] but regard my misery."}],"16":[{"catchword":null,"tekst":"For it [the misery namely] exalteth it self: thou chicest me like a fierce Lion; [a comparison taken from the Lions that hunt and chase the wild Beasts with great violence, rage and cruelty] thou turnest again, and settest thy self wonderfully against me. [he complaineth, that God had not only visited him, with one or two fearful plagues, but being returned a fresh upon him afterwards, he had shewed himself most strange and uncouth with divers other plagues in afflicting his person.]"}],"17":[{"catchword":null,"tekst":"Thou renewest thy witnesses [i.e. these plagues and punishments, which do bear witness of thy fierce wrath and indignation.] over against me, and multiplyest thy wrath against me: changes, [viz. Of afflictions, i.e. many sorts of miseries and wretchednesses, which are all by turns heaped and hoarded upon me. Other.extripations, as if he called his plagues thus, because they seemed ready to destroy him utterly] yea, an host, [so his miseries are called likewise, by reason of their multitude, power and cruelty.] are against me."}],"18":[{"catchword":null,"tekst":"And why haste thou brought me forth out of the womb? Oh, that I had given (up) the spirit [viz. In my mothers womb, before I came into the world.] and no eye had seen me [viz. Alive.]"}],"19":[{"catchword":null,"tekst":"I should be as if I had not been: from (the mothers) belly, should I have been brought to the grave [see above cha.3.on v.10.]"}],"20":[{"catchword":null,"tekst":"Are not my days few? Surcease: [viz. From punishment me thus] set off from me [forbear to besiege and surround me in this manner; Compare Psa 3:7. Isa 22:7.] that I may refresh my self a little;"}],"21":[{"catchword":null,"tekst":"Before I pass away (and return not again) [viz. Into this temporal life] into land of darkness [i.e. into the grave, which it self also is called darkness below chap.17.13.] and of the shadow of death, [i.e. deadly shadow. Understand a very thick and dark shadow, united, or accompanied with death; such as is the shadow of the grave, and so in the next verse.]"}],"22":[{"catchword":null,"tekst":"A very dark land, as darkness it self, the shadow of death, and without orderings, [viz. Of day and night. Light and darkness, Summer and Winter, Spring and Fall, heat and cold. The sense is, that these enter changes of the air, and times and seasons, which here do follow one another by turns in their order, shall not be seen in the darkness of the grave, there being nothing else but disorder and confusion.] and it giveth brightness like darkness. [i.e. the brightest splendour that is in the grave, is nothing but a thick, palpable and ghastly darkness.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
