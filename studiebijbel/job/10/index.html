ezus keek hen aan, en zei: Bij de mensen is het onmogelijk, maar niet bij God; want bij God zijn alle dingen mogelijk.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Job 21:6": "Ja, wanneer ik daaraan denk, word ik verschrikt, en huivering grijpt mijn lichaam aan.", "Job 40:12": "Als het hem lust, zijn staart is als een ceder; de zenuwen van zijn schaamte zijn doorvlochten.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "2 Tim 2:11-13": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Dan 3:27": "Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Job 12:7-9": "En werkelijk, vraag toch de dieren, en ieder van hen zal het u leren; en de vogels van de hemel, die zullen het u bekendmaken. Of spreek tot de aarde, en zij zal het u leren; ook zullen de vissen van de zee het u vertellen. Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Rom 9:1": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest),", "Rom 5:6-8": "Want Christus is, toen wij nog krachteloos waren, op Zijn tijd voor de goddelozen gestorven. Want nauwelijks zal iemand voor een rechtvaardige sterven; want voor de goede zal misschien iemand ook durven te sterven. Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren.", "Job 16:8": "Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Ps 76:7": "Van Uw schelden, o God van Jakob! zijn samen wagen en paard in slaap gezonken.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Hebr 11:7-11": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is. Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Nahum 2:10": "Zij is geledigd, ja, uitgeledigd, uitgeput, en haar hart smelt weg, en de knieën schudden, en in alle lenden is smart, en aller aangezichten worden bleek, als een pot.", "Ps 85:6-8": "Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.", "2 Sam 22:20": "En Hij voerde mij uit in de ruimte, en rukte mij eruit, want Hij had lust aan mij.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Job 7:15": "Zodat mijn ziel de verworging kiest; de dood meer dan mijn beenderen.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Ps 46:2-4": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Ps 89:49": "Wat man leeft er, die de dood niet zien zal, die zijn ziel zal bevrijden van het geweld van het graf? Sela.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jes 17:13": "De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.", "Jona 2:1-10": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Gen 5:2": "Man en vrouw schiep Hij hen, en zegende ze, en noemde hun naam Mens, op de dag dat zij geschapen werden.", "Ps 147:18": "Hij zendt Zijn woord, en doet ze smelten; Hij laat Zijn wind waaien, de wateren stromen weg.", "Job 31:1-40": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd? Want wat is het deel van God van boven, of de erve van de Almachtige uit de hoogten? Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Ps 60:12": "Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Ps 24:4": "Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert;", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Job 17:1": "Mijn geest is verdorven, mijn dagen worden uitgeblust, de graven zijn voor mij.", "Jer 15:10": "Wee mij, mijn moeder, dat u mij gebaard hebt, een man van twist, en een man van ruzie voor het hele land! Ik heb hun niet op rente gegeven, ook hebben zij mij niet op rente gegeven, toch vervloekt mij ieder van hen.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Matt 12:31": "Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.", "Ps 35:17": "Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "Jak 3:10": "Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Jes 24:11": "Er is een klagelijk geroep op de straten, om de wijn; alle blijdschap is verduisterd, de vreugde van het land is heengegaan.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Gen 6:22": "En Noach deed het; naar alles wat God hem geboden had, zo deed hij.", "Job 11:18": "En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "Ps 115:12": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Klaagl 3:1": "Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid.", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Job 27:7": "Mijn vijand zij als de goddeloze, en die zich tegen mij opmaakt, als de verkeerde.", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Ps 94:9": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Job 9:2-35": "Waarlijk, ik weet dat het zo is; want hoe zou de mens rechtvaardig zijn bij God? Als Hij lust heeft om met hem te twisten, zal hij Hem niet één op de duizend beantwoorden. Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Joël 3:17": "En u zult weten dat Ik de HEERE, uw God, ben, die op Sion woont, Mijn heilige berg; en Jeruzalem zal heilig zijn, en vreemden zullen er niet meer doorheen trekken.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Ef 4:7": "Maar aan ieder van ons is de genade gegeven, naar de maat van de gave van Christus.", "Job 34:18": "Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Jes 42:5": "Zo zegt God, de HEERE, Die de hemelen geschapen en ze uitgebreid heeft, Die de aarde uitgespannen heeft, en wat daaruit voortkomt; Die aan het volk dat daarop is, de adem geeft, en de geest aan hen die daarop wandelen:", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Jes 63:15-17": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Num 5:3": "Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Job 3:20-23": "Waarom geeft Hij de ellendigen het licht, en het leven de bitterlijk bedroefden van gemoed? Die verlangen naar de dood, maar hij is er niet; en graven daarnaar meer dan naar verborgen schatten; Die blij zijn tot het opspringen toe, en zich verheugen, als zij het graf vinden;", "Pred 8:12-17": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen. Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God. Er is nog een vluchtigheid, die op aarde gebeurt: dat er rechtvaardigen zijn, die overkomt wat de goddelozen toekomt, en er zijn goddelozen, die overkomt wat de rechtvaardigen toekomt. Ik zeg, dat dit ook vluchtigheid is.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Job 13:7-9": "Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken? Zult u Zijn aangezicht aannemen? Zult u voor God twisten? Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Jes 36:20": "Welke zijn er onder al de goden van deze landen, die hun land uit mijn hand gered hebben, zodat de HEERE Jeruzalem uit mijn hand zou redden?", "Ps 124:1-8": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Pred 3:15": "Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.", "Job 17:16": "Zij zullen mee naar beneden gaan met de grendels van het graf, als er rust samen in het stof zal zijn.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Jer 15:20": "Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.", "Jer 12:2": "U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Job 3:5": "Dat de duisternis en de schaduw van de dood hem verontreinigen; dat wolken over hem wonen; dat hem verschrikken de zwarte dampen van de dag!", "Luk 17:10": "Zo ook u: wanneer u alles gedaan hebt wat u bevolen is, zeg dan: Wij zijn onnutte dienstknechten; want wij hebben alleen maar gedaan wat wij verplicht waren te doen.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Ps 95:5": "Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "Luk 2:52": "En Jezus nam toe in wijsheid en grootte, en in genade bij God en de mensen.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Job 14:19-21": "Het water vermaalt de stenen, het stof van de aarde overspoelt het gewas dat er zelf uit voortkomt; zo verderft U de verwachting van de mens. U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg. Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.", "Jes 8:21": "En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;", "Jes 54:8": "In een kleine toorn heb Ik Mijn aangezicht van u een ogenblik verborgen; maar met eeuwige goedertierenheid zal Ik Mij over u ontfermen, zegt de HEERE, uw Verlosser.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 103:15": "De dagen van de mens zijn als het gras, zoals een bloem van het veld, zo bloeit hij.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ps 88:7": "U hebt mij in de onderste kuil gelegd, in duisternissen, in diepten.", "Pred 8:8": "Er is geen mens die macht heeft over de geest, om de geest tegen te houden; en hij heeft geen macht over de dag van de dood; er is ook geen vrijstelling in die strijd; en de goddeloosheid zal haar meesters niet redden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Pred 7:15": "Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Ef 2:16": "en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Jes 64:3": "Toen U vreselijke dingen deed, die wij niet verwachtten; U kwam neer, van Uw aangezicht smolten de bergen weg.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Matt 6:25": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding?", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Ps 71:4": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Ps 71:2": "Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Rom 14:5": "De één acht de ene dag boven de andere dag; maar de ander acht alle dagen gelijk. Laat ieder in zijn eigen gemoed ten volle overtuigd zijn.", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Deut 4:32": "Want vraag toch naar de vorige dagen, die vóór u geweest zijn, vanaf de dag dat God de mens op de aarde geschapen heeft, van het ene einde van de hemel tot aan het andere einde van de hemel, of er ooit zo'n groot ding gebeurd of gehoord is als dit:", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Ps 8:5": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt?", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Job 6:2-4": "Och, of mijn verdriet grondig gewogen werd, en men mijn ellende samen in een weegschaal ophief! Want het zou nu zwaarder zijn dan het zand der zeeën; daarom worden mijn woorden opgezwolgen. Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Openb 12:6": "En de vrouw vluchtte naar de woestijn, waar zij een plaats had, door God voor haar bereid, opdat zij haar daar zouden voeden duizend tweehonderd zestig dagen.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Ps 31:2-5": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Ps 118:17": "Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Ps 94:1-23": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Num 24:1": "Toen Bileam zag dat het goed was in de ogen van de HEERE dat hij Israël zegende, ging hij ditmaal niet, zoals de andere keren, op zoek naar toverijen; maar hij richtte zijn gezicht naar de woestijn.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Joël 2:10": "De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.", "Spr 10:30": "De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Ps 71:21": "Gij zult mijn grootheid vermeerderen, en mij rondom vertroosten.", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "Jes 33:20": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Mark 13:19": "Want die dagen zullen zo'n verdrukking zijn, zoals er niet geweest is vanaf het begin van de schepping die God geschapen heeft, tot nu toe, en er ook niet meer zal zijn.", "Klaagl 1:20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.", "Ps 78:39": "En Hij dacht eraan, dat zij vlees waren, een wind, die heengaat en niet terugkeert.", "Ps 103:22": "Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "Rom 4:4": "Nu wordt hem die werkt het loon niet toegerekend naar genade, maar naar schuld.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Deut 9:3": "Zo zult u vandaag weten, dat de HEERE, uw God, Degene is die voor uw aangezicht doorgaat, een verterend vuur: Die zal hen verdelgen, en Die zal hen voor uw aangezicht neerwerpen; en u zult ze uit de bezitting verdrijven, en zult hen snel te niet doen, zoals de HEERE tot u gesproken heeft.", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 79:9": "Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.", "Dan 2:30": "Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Ps 143:8": "Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Spr 30:2": "Voorwaar, ik ben onverstandiger dan wie ook; en ik heb geen mensenverstand;", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "1 Sam 2:26": "En de jongen Samuël nam toe, en werd groot en aangenaam, zowel bij de HEERE als ook bij de mensen.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "1 Tim 1:14": "Maar de genade van onze Heere is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus.", "Jes 10:27": "En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Deut 3:24": "Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden!", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ps 74:16": "De dag is van U, ook is de nacht van U; U hebt het licht en de zon bereid.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "2 Kron 20:4-13": "En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof. En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Zef 3:15": "De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien.", "Ps 102:26": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen;", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Joh 3:29": "Wie de bruid heeft, is de bruidegom, maar de vriend van de bruidegom, die staat en hem hoort, verblijdt zich zeer over de stem van de bruidegom. Deze blijdschap van mij is dan vervuld geworden.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ps 143:1-12": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid. En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn. Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Matt 19:26": "En Jezus keek hen aan, en zei tegen hen: Bij de mensen is dat onmogelijk, maar bij God zijn alle dingen mogelijk.", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "2 Kron 32:19": "En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.", "Ps 119:173": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen.", "Ps 97:6": "De hemelen verkondigen Zijn gerechtigheid, en alle volken zien Zijn eer.", "2 Kor 4:8": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig;", "1 Kon 3:7": "Nu dan, HEERE, mijn God! U hebt Uw knecht koning gemaakt in de plaats van mijn vader David; en ik ben een jonge man, ik weet niet uit te gaan of in te gaan.", "Ps 61:8": "Hij zal eeuwig voor Gods aangezicht zitten; bereid goedertierenheid en waarheid, dat zij hem behoeden.", "Job 17:13": "Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden.", "Jes 32:18": "En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Gen 15:6": "En hij geloofde in de HEERE; en Hij rekende het hem tot gerechtigheid.", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Deut 16:19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "Matt 15:27": "En zij zei: Ja, Heere! maar de hondjes eten ook van de brokjes die van de tafel van hun heren vallen.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Pred 9:11": "Ik keerde mij om en zag onder de zon dat de wedloop niet is voor de snellen, en de strijd niet voor de helden, en ook het brood niet voor de wijzen, en ook de rijkdom niet voor de verstandigen, en ook de gunst niet voor de kundigen; maar dat tijd en toeval hen allen treft.", "Job 7:7": "Bedenk, dat mijn leven een wind is; mijn oog zal niet terugkomen, om het goede te zien.", "Ex 24:2": "En dat Mozes alleen tot de HEERE nadert, maar dat zij niet naderen; en het volk klimt ook niet op met hem.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Ps 56:10": "Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.", "Job 5:9": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 57:2-4": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan. Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien. Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "Ps 82:7": "Toch zult u sterven als een mens; en als een van de vorsten zult u vallen.", "Job 7:17-21": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet? En dat U hem bezoekt elke morgen; dat U hem elk ogenblik beproeft? Hoe lang keert U zich niet van mij af, en laat U niet van mij af, totdat ik mijn speeksel inzwelg?", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Ps 4:2": "Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Micha 1:4": "En de bergen zullen onder Hem versmelten, en de dalen gekloofd worden, zoals was voor het vuur, zoals water dat uitgestort wordt in de laagte.", "Ps 73:2-5": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Job 6:8": "Och, of mijn begeerte kwam, en dat God mijn verwachting gaf;", "Micha 7:7-9": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen. Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Ps 149:4": "Want de HEERE heeft een welgevallen aan Zijn volk; Hij zal de zachtmoedigen versieren met heil.", "Ps 142:4": "Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.", "Ps 139:1": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij.", "Ps 74:18": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.", "Job 7:6": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Jes 64:1": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;", "Job 8:9": "Want wij zijn van gisteren en weten niets, omdat onze dagen op de aarde een schaduw zijn.", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "Job 12:14-16": "Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden. Zie, Hij houdt de wateren tegen, en zij drogen uit; ook laat Hij ze los, en zij keren de aarde om. Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Jer 48:11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "Jes 38:13": "Ik stelde mij gerust tot de morgenstond toe; zoals een leeuw, zo zal Hij al mijn beenderen breken; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "1 Tim 1:5": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "Ps 116:6": "De HEERE bewaart de eenvoudigen; ik was uitgeteerd, maar Hij heeft mij verlost.", "Ps 70:2": "Haast U, o God, om mij te verlossen, o HEERE, tot mijn hulp.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Klaagl 3:40-42": "Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE. Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen: Nun. Wij hebben overtreden, en wij zijn opstandig geweest, daarom hebt U niet gespaard.", "Openb 19:9": "En hij zei tegen mij: Schrijf, zalig zijn zij die geroepen zijn tot het avondmaal van de bruiloft van het Lam. En hij zei tegen mij: Deze zijn de waarachtige woorden van God.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "Jes 65:7": "Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Jer 4:10": "Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.", "Dan 6:28": "Hij verlost en redt, en Hij doet tekenen en wonderen in de hemel en op de aarde; Hij heeft Daniël uit de macht van de leeuwen verlost.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "1 Kor 8:6": "toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "Ps 30:8": "Want, HEERE! U had mijn berg door Uw goedgunstigheid vast doen staan; maar toen U Uw aangezicht verborg, werd ik verschrikt.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Ps 7:7": "Sta op, HEERE, in Uw toorn, verhef U om de woede van hen die mij benauwen, en ontwaak tot mij; U hebt het oordeel bevolen.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Klaagl 3:10": "Daleth. Hij is voor mij een loerende beer, een leeuw in verborgen plaatsen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Ex 33:23": "En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Ps 90:7": "Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Job 10:2-18": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Pred 9:2": "Alles overkomt iedereen op dezelfde manier: eenzelfde lot treft de rechtvaardige en de goddeloze, de goede en de reine, als de onreine; zowel hem die offert, als hem die niet offert; zoals de goede, zo ook de zondaar, hij die zweert, evenals hij die de eed vreest.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Job 4:7-21": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd? Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook. Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Gal 4:6": "En omdat u kinderen bent, heeft God de Geest van Zijn Zoon uitgezonden in uw harten, Die roept: Abba, Vader!", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "Ex 16:15": "Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.", "Jes 54:14": "U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en ver van verschrikking, want zij zal tot u niet naderen.", "Ps 130:1-8": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "2 Sam 22:2-5": "Hij zei dan: De HEERE is mij mijn Steenrots, en mijn Burg, en mijn Uithelper. God is mijn Rots, ik zal op Hem vertrouwen; mijn Schild en de Hoorn van mijn heil, mijn Hoog Vertrek en mijn Toevlucht, mijn Verlosser! Van geweld hebt U mij verlost! Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Ps 3:6": "Ik lag neer en sliep; ik werd wakker, want de HEERE ondersteunde mij.", "Gen 50:24": "En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.", "Jes 38:14-19": "Zoals een kraanvogel of zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg. Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel. Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Ps 35:10": "Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Ps 9:14": "Wees mij genadig, HEERE, zie mijn ellende aan, die mijn haters mij aandoen, Gij, Die mij verhoogt uit de poorten van de dood;", "Ex 14:29": "Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "Matt 25:37-40": "Dan zullen de rechtvaardigen Hem antwoorden: Heere! Wanneer hebben wij U hongerig gezien, en te eten gegeven, of dorstig, en te drinken gegeven? En wanneer hebben wij U een vreemdeling gezien, en een onderkomen gegeven, of naakt en gekleed? En wanneer hebben wij U ziek gezien, of in de gevangenis, en zijn bij U gekomen?", "Ps 68:23": "De Heere heeft gezegd: Ik zal terugbrengen uit Basan; Ik zal terugbrengen uit de diepten van de zee;", "Ps 61:5": "Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "Pred 1:4": "Het ene geslacht gaat, en het andere geslacht komt; maar de aarde blijft staan in eeuwigheid.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "1 Tess 2:4": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft.", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Joz 23:14": "En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Ps 102:12": "Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Jes 27:4": "Grimmigheid is bij Mij niet; wie zou Mij als een doorn en distel in oorlog willen zetten, zodat Ik tegen hem zou aanvallen, en hem tegelijk zou verbranden?", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Job 5:20": "In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Job 7:17": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?", "Zach 1:5": "Uw vaderen, waar zijn die? En de profeten, zullen zij eeuwig leven?", "Pred 3:11": "Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Pred 3:14": "Ik weet, dat al wat God doet, dat zal in eeuwigheid zijn, en er is niets aan toe te doen, en er is niets van af te doen; en God doet dat, opdat men vreest voor Zijn aangezicht.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Rom 11:6": "En als het door genade is, dan is het niet meer uit de werken; anders is de genade geen genade meer; en als het is uit de werken, dan is het geen genade meer; anders is het werk geen werk meer.", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Job 9:25": "En mijn dagen zijn sneller geweest dan een loper; zij zijn weggevlucht, zij hebben het goede niet gezien.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Job 21:17": "Hoe vaak gebeurt het, dat de lamp van de goddelozen wordt uitgeblust, en hun ondergang over hen komt; dat God hun smarten uitdeelt in Zijn toorn!", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Job 10:8-11": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij. Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren. Hebt U mij niet als melk uitgegoten, en mij als een kaas laten stremmen?", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Hebr 10:19": "Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus,", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om
