deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Ps 77:8-10": "Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn? Houdt Zijn goedertierenheid voor eeuwig op? Heeft de toezegging een einde, van geslacht tot geslacht? Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Jer 23:10": "Want het land is vol overspelers, want het land treurt vanwege de vloek, de weiden van de woestijn verdorren, omdat hun loop slecht is, en hun macht niet recht.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Joh 3:33": "Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.", "Jes 38:16": "Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Ex 15:1-19": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!", "Job 12:6-24": "De tenten van de verwoesters hebben rust, en zij die God tergen, hebben zekerheid, om wat God met Zijn hand toebrengt. En werkelijk, vraag toch de dieren, en ieder van hen zal het u leren; en de vogels van de hemel, die zullen het u bekendmaken. Of spreek tot de aarde, en zij zal het u leren; ook zullen de vissen van de zee het u vertellen.", "Ps 89:40-52": "Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Hebr 12:9": "Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?", "Openb 10:6": "En hij zwoer bij Hem Die leeft in alle eeuwigheid, Die de hemel geschapen heeft en wat daarin is, en de aarde en wat daarin is, en de zee en wat daarin is, dat er geen tijd meer zal zijn;", "Jes 40:7": "Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Ps 131:1": "Een lied Hammaaloth, van David. HEERE, mijn hart is niet hoogmoedig, en mijn ogen zijn niet trots; ook heb ik niet gestreefd naar dingen die mij te groot en te wonderlijk zijn.", "Luk 1:30": "En de engel zei tegen haar: Wees niet bang, Maria, want u hebt genade bij God gevonden.", "Ps 83:2-19": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Num 11:15": "En als U zo met mij doet, dood mij dan toch maar meteen, als ik genade in Uw ogen gevonden heb; en laat mij mijn ongeluk niet aanzien!", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Job 11:19": "En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Job 5:6": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;", "Job 36:22": "Zie, God verhoogt door Zijn kracht; wie is een Leraar zoals Hij?", "2 Kor 8:21": "Als mensen die zorgen voor wat eerlijk is, niet alleen voor het oog van de Heere, maar ook voor het oog van de mensen.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Job 33:10": "Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Job 6:9": "En dat het God beliefde, dat Hij mij verbrijzelde, Zijn hand losliet, en een einde met mij maakte!", "Neh 2:20": "Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Rom 9:10-16": "En niet alleen dit, maar ook Rebekka is daar een bewijs van, toen zij zwanger was van één man, namelijk Izaak, onze vader. Want toen de kinderen nog niet geboren waren, en nog niets goeds of kwaads gedaan hadden, opdat het voornemen van God, dat volgens de verkiezing is, vast zou blijven, niet uit de werken, maar uit Hem Die roept, werd tot haar gezegd: De oudste zal de jongste dienen.", "1 Kor 15:26": "De laatste vijand die tenietgedaan wordt, is de dood.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Job 14:1": "De mens, uit een vrouw geboren, leeft maar kort en is vol onrust.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "2 Kor 4:9": "Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "Spr 3:3": "Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Hand 17:25": "En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft;", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Zef 1:15": "Die dag zal een dag van verbolgenheid zijn; een dag van benauwdheid en angst, een dag van woestheid en verwoesting, een dag van duisternis en donkerheid, een dag van wolk en dikke duisternis;", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Ps 40:4": "En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Ps 119:134": "Verlos mij van de overlast van de mens, en ik zal Uw bevelen onderhouden.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "Jes 43:1": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Rom 13:5": "Daarom is het nodig onderworpen te zijn, niet alleen om de straf, maar ook om het geweten.", "Num 20:16": "Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.", "Ps 38:10": "Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Job 34:5-7": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen. Ik moet liegen over mijn recht; mijn pijl is smartelijk zonder overtreding. Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "Ps 86:7": "In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "Jes 51:15": "Want Ik ben de HEERE, uw God, Die de zee klieft, zodat haar golven bruisen; HEERE van de heerscharen is Zijn Naam.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Micha 1:3": "Want ziet, de HEERE gaat uit van Zijn plaats, en Hij zal neerdalen en treden op de hoogten van de aarde.", "Neh 1:8-10": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien. Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen. Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Hand 23:1": "En Paulus keek de raad recht aan en zei: Mannen broeders! Ik heb met een geheel goed geweten voor God geleefd tot op deze dag.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Ps 54:3-5": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht. O God! Hoor mijn gebed; neig Uw oren tot de woorden van mijn mond. Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Jes 8:22": "als hij de aarde aanschouwen zal, zie, dan zal er benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Ps 38:2-23": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Ps 104:1-32": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Ps 114:3-8": "De zee zag het en vluchtte; de Jordaan keerde achterwaarts. De bergen sprongen als rammen, de heuvels als lammeren. Wat was er met u, zee, dat u vluchtte? Met u, Jordaan, dat u achterwaarts keerde?", "Job 9:4-7": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad? Die de bergen verzet, zodat zij het niet gewaar worden, Die ze omkeert in Zijn toorn; Die de aarde beweegt uit haar plaats, zodat haar pilaren schudden;", "Dan 6:17": "Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Jer 18:3-10": "Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven. En het vat dat hij maakte werd verdorven, als leem, in de hand van de pottenbakker; toen maakte hij daarvan weer een ander vat, zoals het goed was in de ogen van de pottenbakker om te maken. Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Ps 11:1": "Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ps 109:21": "Maar U, o HEERE Heere! doe met mij naar wat past bij Uw Naam; omdat Uw goedertierenheid goed is, verlos mij.", "Ps 143:3": "Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "2 Sam 15:31": "Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Jes 43:5": "Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang.", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ef 1:5-9": "Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil. Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade,", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Fil 3:12": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben.", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Job 22:12-14": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn. Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen? De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "Job 9:13": "God zal Zijn toorn niet afkeren; onder Hem worden de hoogmoedige helpers gebogen.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Job 34:16-19": "Zo er dan verstand bij u is, hoor dit; neig de oren tot de stem van mijn woorden. Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Job 41:2": "Wie heeft Mij iets gegeven, dat Ik het hem zou vergelden? Wat onder de hele hemel is, is van Mij.", "Joh 10:28-30": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader. Ik en de Vader zijn één.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Jer 27:8": "En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "2 Kon 19:19": "Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Luk 1:49": "Want grote dingen heeft Hij, Die machtig is, aan mij gedaan, en heilig is Zijn Naam.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Ps 136:10-22": "Hem, Die de Egyptenaren geslagen heeft in hun eerstgeborenen; want Zijn goedertierenheid is voor eeuwig. En Israël uit hun midden heeft uitgebracht; want Zijn goedertierenheid is voor eeuwig. Met een sterke hand, en met een uitgestrekte arm; want Zijn goedertierenheid is voor eeuwig.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Ps 119:82": "Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten?", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Luk 7:6": "En Jezus ging met hen mee. En toen Hij al niet ver meer van het huis was, zond de hoofdman over honderd enkele vrienden naar Hem toe, en zei tegen Hem: Heere, doe geen moeite; want ik ben het niet waard dat U onder mijn dak komt.", "Ps 79:8": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Gen 2:1-25": "Zo zijn de hemel en de aarde voltooid, en heel hun leger. Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had. En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Ps 44:20": "Hoewel U ons verpletterd hebt in een plaats van de draken, en ons met een doodsschaduw bedekt hebt.", "Job 19:7": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht.", "Job 21:23": "De één sterft in de kracht van zijn volkomenheid, terwijl hij helemaal stil en gerust was;", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Job 31:35": "Och, had ik er maar een die mij hoorde! Zie, mijn oogmerk is, dat de Almachtige mij antwoordt, en dat mijn tegenpartij een boek schrijft.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "1 Kor 11:12": "Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "1 Kor 9:26": "Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Job 9:22": "Dat is één ding, daarom zeg ik: De oprechte en de goddeloze verdoet Hij.", "Ps 120:2": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.", "Jer 50:44": "Zie, zoals een leeuw van de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen wegvluchten; en wie daartoe verkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder die voor Mijn aangezicht kan bestaan?", "Luk 1:28": "En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "2 Sam 22:16": "En de diepe kolken van de zee werden gezien, de bodems van de wereld werden ontdekt, door het schelden van de HEERE, van het geblaas van de wind van Zijn neus.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Zach 5:4": "Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Ef 3:16": "opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 119:121-123": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers. Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken. Mijn ogen zijn bezweken van verlangen naar Uw heil, en naar de toezegging van Uw rechtvaardigheid.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Job 34:15": "Alle vlees zou tegelijk de geest geven, en de mens zou tot stof terugkeren.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Job 29:14": "Ik bekleedde mij met gerechtigheid, en zij bekleedde mij; mijn oordeel was als een mantel en vorstelijke hoed.", "Job 17:14": "Tot de groeve roep ik: U bent mijn vader! Tot het gewormte: Mijn moeder, en mijn zuster!", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Fil 3:13": "Broeders, ik acht niet dat ik het zelf al gegrepen heb.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Job 39:35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "2 Kor 5:3": "Als wij tenminste bekleed en niet naakt bevonden zullen worden.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Job 26:12": "Door Zijn kracht klieft Hij de zee, en door Zijn verstand verslaat Hij haar trots.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Job 13:26": "Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven.", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Ps 119:73": "Jod. Uw handen hebben mij gemaakt, en bereid; maak mij verstandig, opdat ik Uw geboden leer.", "Ps 31:15-19": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God. Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers. Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.", "Job 34:9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "Gen 18:30": "Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.", "Job 31:14": "(Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden?", "Job 39:4-33": "Weet u de tijd van het baren van de steengeiten? Hebt u waargenomen de arbeid van de hinden? Zult u de maanden tellen, die zij vervullen, en weet u de tijd van haar baren? Als zij zich krommen, haar jongen met versplijting voortbrengen, haar smarten uitwerpen?", "Job 29:3-5": "Toen Hij Zijn lamp deed schijnen over mijn hoofd, en ik bij Zijn licht door de duisternis liep; Zoals ik was in de dagen van mijn jeugd, toen Gods vertrouwelijke omgang over mijn tent was; Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "Job 6:26": "Zult u, om te bestraffen, woorden bedenken, en zullen de redenen van de mismoedige voor wind zijn?", "Hos 2:9": "En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Ps 107:29": "Hij doet de storm stilstaan, zodat hun golven zwijgen.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Job 13:25": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen?", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "Jes 38:17": "Zie, in vrede is mij de bitterheid bitter geweest; maar Gij hebt mijn ziel liefdevol omhelsd, zodat zij niet in de groeve van de vertering kwam; want Gij hebt al mijn zonden achter Uw rug geworpen.", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "2 Sam 7:19": "Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE!", "1 Joh 4:18": "Er is in de liefde geen vrees, maar de volmaakte liefde drijft de vrees naar buiten; want de vrees heeft pijn, en die vreest, is niet volmaakt in de liefde.", "Job 5:16": "Zo is er voor de arme verwachting; en de slechtheid stopt haar mond toe.", "Luk 1:37": "Want geen ding zal bij God onmogelijk zijn.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Gal 1:16": "om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Job 37:20": "Zal het Hem verteld worden, als ik zo zou spreken? Denkt iemand dat, zeker, hij zal verslonden worden.", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Job 9:26": "Zij zijn voorbijgevaren met jachtschepen; zoals een arend naar het aas toevliegt.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Job 15:26": "Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;", "Ps 18:30": "Want met U loop ik door een bende, en met mijn God spring ik over een muur.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Ps 10:12-15": "Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Luk 3:13": "En hij zei tegen hen: Eis niet meer dan wat u opgelegd is.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Ps 115:15": "U bent door de HEERE gezegend, Die de hemel en de aarde gemaakt heeft.", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Job 16:11-16": "God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen. Ik had rust, maar Hij heeft mij verbroken, en mij bij mijn nek gegrepen, en mij verpletterd; en Hij heeft mij Zich tot een doelwit opgericht. Zijn schutters hebben mij omringd; Hij heeft mijn nieren doorkliefd, en niet gespaard; Hij heeft mijn gal op de aarde uitgegoten.", "Ps 10:1": "HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?", "1 Sam 20:3": "Toen zwoer David verder, en zei: Uw vader weet heel goed dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Ps 24:2": "Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 109:1-31": "Een psalm van David, voor de koorleider. O God van mijn lof! Zwijg niet. Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "Zach 5:3": "Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "1 Kor 11:31": "Want als wij onszelf zouden oordelen, zouden wij niet geoordeeld worden.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Ef 4:16": "Uit Wie het hele lichaam bekwaam samengevoegd en samen vastgemaakt wordt, door alle gewrichten die het voeden, naar de werking van ieder deel in zijn maat, groei van het lichaam bereikt, tot opbouw van zichzelf in de liefde.", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Jer 30:7": "O wee! Want die dag is zo groot, dat er zijn gelijke niet geweest is; en het is een tijd van benauwdheid voor Jakob; toch zal hij daaruit verlost worden.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Ps 119:107": "Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.", "Hos 13:7": "Daarom werd Ik voor hen als een felle leeuw; als een luipaard loerde Ik op de weg.", "Ps 38:2-9": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "Ps 8:4-7": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt; Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Pred 7:2": "Het is beter te gaan in het klaaghuis, dan te gaan in het huis van het maaltijd; want daarin is het einde van alle mensen, en de levende legt het in zijn hart.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Jes 64:6": "Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind.", "Ef 1:19": "En wat de uitnemende grootheid is van Zijn kracht aan ons, die geloven, naar de werking van de sterkte van Zijn macht,", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Ps 9:4": "Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.", "1 Joh 3:19": "En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Ezech 18:7-9": "En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt; Niet uitleent op woeker, noch overwinst neemt, zijn hand van onrecht afkeert, waarachtig recht tussen de een en de ander toepast; In Mijn inzettingen wandelt, en Mijn rechten onderhoudt, om trouw te handelen; die rechtvaardige zal zeker leven, spreekt de Heere HEERE.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Ezech 33:17-20": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is. Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven. En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Job 36:16": "Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid naar de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.", "Ps 46:7": "De heidenen raasden, de koninkrijken bewogen zich; Hij verhief Zijn stem, de aarde versmolt.", "Num 11:23": "Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Ps 119:145-149": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Gen 18:26": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Ps 64:8": "Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Jer 33:2": "Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "Ps 135:8-12": "Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe. Hij zond tekenen en wonderen in het midden van u, o Egypte! tegen Farao en tegen al zijn knechten. Die veel volken sloeg, en machtige koningen doodde;", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Openb 4:10": "dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "2 Petr 1:2": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere;", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Jes 38:10-13": "Ik zei: Vanwege het afsnijden van mijn dagen zal ik naar de poorten van het graf gaan, ik word beroofd van wat er nog over is van mijn jaren. Ik zei: Ik zal de HEERE niet meer zien, de HEERE, in het land van de levenden; ik zal de mensen niet meer aanschouwen met de inwoners van de wereld. Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever zijn weefsel; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Ps 78:31-34": "Toen Gods toorn tegen hen opging, zodat Hij van hun vetste doodde, en de uitgelezen mannen van Israël neervelde. Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen. Daarom liet Hij hun dagen vergaan in ijdelheid, en hun jaren in verschrikking.", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "2 Kron 7:12-22": "En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis. Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ezech 35:13": "Zo hebt u zich met uw mond tegen Mij groot gemaakt, en uw woorden tegen Mij vermenigvuldigd; Ik heb het gehoord.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Jer 31:35-37": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam: Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen. Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Ps 140:7": "Ik heb tegen de HEERE gezegd: U bent mijn God; neem ter ore, HEERE, de stem van mijn smekingen.", "Job 26:7-13": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Ps 80:4-6": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Ps 94:22": "Doch de HEERE is mij geweest tot een Hoog Vertrek, en mijn God tot een Steenrots van mijn toevlucht.", "Luk 17:1": "En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "Job 27:8-23": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ps 31:15": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God.", "Openb 16:11": "En zij lasterden de God van de hemel vanwege hun pijnen, en vanwege hun gezwellen; en zij bekeerden zich niet van hun werken.", "Ps 34:20-23": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem. Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken. Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "Ps 119:57": "Cheth. De HEERE is mijn deel, ik heb gezegd, dat ik Uw woorden zal bewaren.", "Pred 6:12": "Want wie weet wat goed is voor de mens in dit leven, gedurende het aantal dagen van het leven van zijn ijdelheid, dat hij doorbrengt als een schaduw? Want wie kan de mens aanzeggen wat na hem wezen zal onder de zon?", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Ps 86:2": "Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Ps 108:11-14": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom? Zult U het niet zijn, o God! Die ons verstoten had, en Die niet uittrok, o God! Met onze legers? Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Ps 31:16": "Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "Job 7:6-10": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting. Bedenk, dat mijn leven een wind is; mijn oog zal niet terugkomen, om het goede te zien. Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Ps 56:2-14": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Ps 43:1-5": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "1 Kor 1:4-8": "Ik dank mijn God altijd over u, vanwege de genade van God, die u gegeven is in Christus Jezus; Dat u in alles rijk bent geworden in Hem, in alle rede en alle kennis; Zoals de getuigenis van Christus onder u bevestigd is;", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Spr 10:6": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Job 30:11": "Want Hij heeft mijn koord losgemaakt en mij bedrukt; daarom hebben zij de teugel voor mijn aangezicht afgeworpen.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Ps 102:24": "Hij heeft mijn kracht op de weg neergedrukt; mijn dagen heeft Hij verkort.", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Job 14:5-12": "Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden; Wend U van hem af, zodat hij rust heeft, totdat hij als een dagloner een welgevallen heeft aan zijn dag. Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden.", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 147:15-18": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel. Hij geeft sneeuw als wol; Hij strooit de rijp als as. Hij werpt Zijn ijs neer als stukken; wie kan standhouden voor Zijn koude?", "Jer 10:2": "Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Ef 2:14": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft,", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Ps 91:9": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek;", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Job 26:7-14": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Ps 66:11": "U had ons in het net gebracht; U had een engs band om onze lenden gelegd;", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Joh 4:17": "Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in de dag van het oordeel, namelijk dat wij zijn zoals Hij is, in deze wereld.", "Matt 8:25": "En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "Mal 2:10": "Hebben wij niet allen één Vader? Heeft niet één God ons geschapen? Waarom handelen wij dan trouweloos, de één tegen de ander, door het verbond van onze vaders te ontheiligen?", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Gen 24:40": "En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Job 7:18": "En dat U hem bezoekt elke morgen; dat U hem elk ogenblik beproeft?", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Job 8:5": "Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Ps 66:3": "Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.", "Ps 44:24-2
