"Ver waren zijn zonen van heil; en zij werden verbrijzeld in de poort, en er was geen verlosser.","5":"Wiens oogst de hongerige verteerde, die hij ook uit de doornen gehaald had; de struikrover slokte hun vermogen in.","6":"Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;","7":"Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen.","8":"Doch ik zou God zoeken, en tot God mijn aanspraak richten;","9":"Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;","10":"Die de regen geeft op de aarde, en water zendt op de straten;","11":"Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.","12":"Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.","13":"Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.","14":"Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.","15":"Maar Hij verlost de behoeftige van het zwaard, van hun mond, en van de hand van de sterke.","16":"Zo is er voor de arme verwachting; en de slechtheid stopt haar mond toe.","17":"Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.","18":"Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.","19":"In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken.","20":"In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.","21":"Tegen de gesel van de tong zult u verborgen zijn, en u zult niet vrezen voor de verwoesting, als zij komt.","22":"Tegen de verwoesting en tegen de honger zult u lachen, en voor het gedierte van de aarde zult u niet vrezen.","23":"Want met de stenen van het veld zal uw verbond zijn, en het gedierte van het veld zal met u bevredigd zijn.","24":"En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen.","25":"Ook zult u bevinden dat uw nageslacht talrijk zal zijn, en uw spruiten als het kruid van de aarde.","26":"U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.","27":"Zie dit, wij hebben het doorzocht, het is zo; hoor het, en bemerk het voor uzelf."},"SV":{"1":"Roep nu, zal er iemand zijn, die u antwoorde? En tot wien van de heiligen zult gij u keren?","2":"Want den dwaze brengt de toornigheid om, en de ijver doodt den slechte.","3":"Ik heb gezien een dwaas wortelende; doch terstond vervloekte ik zijn woning.","4":"Verre waren zijn zonen van heil; en zij werden verbrijzeld in de poort, en er was geen verlosser.","5":"Wiens oogst de hongerige verteerde, dien hij ook tot uit de doornen gehaald had; de struikrover slokte hun vermogen in.","6":"Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;","7":"Maar de mens wordt tot moeite geboren; gelijk de spranken der vurige kolen zich verheffen *tot* vliegen.","8":"Doch ik zou naar God zoeken, en tot God mijn aanspraak richten;","9":"Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;","10":"Die den regen geeft op de aarde, en water zendt op de straten;","11":"Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.","12":"Hij maakt te niet de gedachten der arglistigen; dat hun handen niet een ding uitrichten.","13":"Hij vangt de wijzen in hun arglistigheid; dat de raad der verdraaiden gestort wordt.","14":"Des daags ontmoeten zij de duisternis, en gelijk des nachts tasten zij in den middag.","15":"Maar Hij verlost den behoeftige van het zwaard, van hun mond, en van de hand des sterken.","16":"Zo is voor den arme verwachting; en de boosheid stopt haar mond toe.","17":"Zie, gelukzalig is de mens, denwelken God straft; daarom verwerp de kastijding des Almachtigen niet.","18":"Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.","19":"In zes benauwdheden zal Hij u verlossen, en in de zevende zal u het kwaad niet aanroeren.","20":"In den honger zal Hij u verlossen van den dood, en in den oorlog van het geweld des zwaards.","21":"Tegen den gesel der tong zult gij verborgen wezen, en gij zult niet vrezen voor de verwoesting, als zij komt.","22":"Tegen de verwoesting en tegen den honger zult gij lachen, en voor het gedierte der aarde zult gij niet vrezen.","23":"Want met de stenen des velds zal uw verbond zijn, en het gedierte des velds zal met u bevredigd zijn.","24":"En gij zult bevinden, dat uw tent in vrede is; en gij zult uw woning verzorgen, en zult niet feilen.","25":"Ook zult gij bevinden, dat uw zaad menigvuldig wezen zal, en uw spruiten als het kruid der aarde.","26":"Gij zult in ouderdom ten grave komen, gelijk de korenhoop te zijner tijd opgevoerd wordt.","27":"Zie dit, wij hebben het doorzocht, het is alzo; hoor het, en bemerk gij het voor u."},"KJV":{"1":"Call now, if there be any that will answer thee; and to which of the saints wilt thou turn?","2":"For wrath killeth the foolish man, and envy slayeth the silly one.","3":"I have seen the foolish taking root: but suddenly I cursed his habitation.","4":"His children are far from safety, and they are crushed in the gate, neither *is there* any to deliver","5":"Whose harvest the hungry eateth up, and taketh it even out of the thorns, and the robber swalloweth up their substance.","6":"Although affliction cometh not forth of the dust, neither doth trouble spring out of the ground;","7":"Yet man is born unto trouble, as the sparks fly upward.","8":"I would seek unto God, and unto God would I commit my cause:","9":"Which doeth great things and unsearchable; marvellous things without number:","10":"Who giveth rain upon the earth, and sendeth waters upon the fields:","11":"To set up on high those that be low; that those which mourn may be exalted to safety.","12":"He disappointeth the devices of the crafty, so that their hands cannot perform *their* enterprise.","13":"He taketh the wise in their own craftiness: and the counsel of the froward is carried headlong.","14":"They meet with darkness in the daytime, and grope in the noonday as in the night.","15":"But he saveth the poor from the sword, from their mouth, and from the hand of the mighty.","16":"So the poor hath hope, and iniquity stoppeth her mouth.","17":"Behold, happy *is* the man whom God correcteth: therefore despise not thou the chastening of the Almighty:","18":"For he maketh sore, and bindeth up: he woundeth, and his hands make whole.","19":"He shall deliver thee in six troubles: yea, in seven there shall no evil touch","20":"In famine he shall redeem thee from death: and in war from the power of the sword.","21":"Thou shalt be hid from the scourge of the tongue: neither shalt thou be afraid of destruction when it cometh.","22":"At destruction and famine thou shalt laugh: neither shalt thou be afraid of the beasts of the earth.","23":"For thou shalt be in league with the stones of the field: and the beasts of the field shall be at peace","24":"And thou shalt know that thy tabernacle *shall be* in peace; and thou shalt visit thy habitation, and shalt not sin.","25":"Thou shalt know also that thy seed *shall be* great, and thine offspring as the grass of the earth.","26":"Thou shalt come to *thy* grave in a full age, like as a shock of corn cometh in in his season.","27":"Lo this, we have searched it, so it *is*; hear it, and know"}},"tsk":{"1":[{"kopje":"en tot wie","refs":["Job 15:8-10","Job 15:15","Jes 41:1","Jes 41:21-23","Hebr 12:1"]},{"kopje":"de heiligen","refs":["Job 4:18","Job 15:15","Deut 33:2","Deut 33:3","Ps 16:3","Ps 106:16","Ef 1:1"]}],"2":[{"kopje":"toorn","refs":["Job 18:4","Jona 4:9"]},{"kopje":"de dwaas","refs":["Ps 14:1","Ps 75:5","Ps 92:7","Ps 107:17","Spr 1:22","Spr 1:23","Spr 8:5","Pred 7:9"]},{"kopje":"ijver","refs":["Gen 30:1","1 Sam 18:8","1 Sam 18:9","Rom 2:8"]},{"kopje":"de eenvoudige","refs":["Hos 7:11" </span> great <span class=\"wl wl-kjv\" data-code=\"H1419\">things</span> and <span class=\"wl wl-kjv\" data-code=\"H369\">unsearchable;</span> marvellous <span class=\"wl wl-kjv\" data-code=\"H6381\">things</span> without number:","10":"Who <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sendeth</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the fields:","11":"To set <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> on <span class=\"wl wl-kjv\" data-code=\"H4791\">high</span> those that be <span class=\"wl wl-kjv\" data-code=\"H8217\">low;</span> that those which <span class=\"wl wl-kjv\" data-code=\"H6937\">mourn</span> may be <span class=\"wl wl-kjv\" data-code=\"H7682\">exalted</span> to safety.","12":"He <span class=\"wl wl-kjv\" data-code=\"H6565\">disappointeth</span> the <span class=\"wl wl-kjv\" data-code=\"H4284\">devices</span> of the <span class=\"wl wl-kjv\" data-code=\"H6175\">crafty,</span> so that their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> cannot <span class=\"wl wl-kjv\" data-code=\"H6213\">perform</span> their enterprise.","13":"He <span class=\"wl wl-kjv\" data-code=\"H3920\">taketh</span> the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> in their own <span class=\"wl wl-kjv\" data-code=\"H6193\">craftiness:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H6617\">froward</span> is carried headlong.","14":"They <span class=\"wl wl-kjv\" data-code=\"H6298\">meet</span> with <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> in the <span class=\"wl wl-kjv\" data-code=\"H3119\">daytime,</span> and <span class=\"wl wl-kjv\" data-code=\"H4959\">grope</span> in the <span class=\"wl wl-kjv\" data-code=\"H6672\">noonday</span> as in the night.","15":"But he <span class=\"wl wl-kjv\" data-code=\"H3467\">saveth</span> the <span class=\"wl wl-kjv\" data-code=\"H34\">poor</span> from the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> from their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the mighty.","16":"So the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> hath <span class=\"wl wl-kjv\" data-code=\"H8615\">hope,</span> and <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> <span class=\"wl wl-kjv\" data-code=\"H7092\">stoppeth</span> her mouth.","17":"Behold, <span class=\"wl wl-kjv\" data-code=\"H835\">happy</span> is the <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> whom <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3198\">correcteth:</span> therefore <span class=\"wl wl-kjv\" data-code=\"H3988\">despise</span> not thou the <span class=\"wl wl-kjv\" data-code=\"H4148\">chastening</span> of the Almighty:","18":"For he maketh <span class=\"wl wl-kjv\" data-code=\"H3510\">sore,</span> and bindeth <span class=\"wl wl-kjv\" data-code=\"H2280\">up:</span> he <span class=\"wl wl-kjv\" data-code=\"H4272\">woundeth,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> make whole.","19":"He shall <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> thee in <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H6869\">troubles:</span> yea, in <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> there shall no <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> touch","20":"In <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> he shall <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> thee from <span class=\"wl wl-kjv\" data-code=\"H4194\">death:</span> and in <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">power</span> of the sword.","21":"Thou shalt be <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> from the <span class=\"wl wl-kjv\" data-code=\"H7752\">scourge</span> of the <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue:</span> neither shalt thou be <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of <span class=\"wl wl-kjv\" data-code=\"H7701\">destruction</span> when it cometh.","22":"At <span class=\"wl wl-kjv\" data-code=\"H7701\">destruction</span> and <span class=\"wl wl-kjv\" data-code=\"H3720\">famine</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7832\">laugh:</span> neither shalt thou be <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the earth.","23":"For thou shalt be in <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall be at peace","24":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thy <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> shall be in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> thy <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation,</span> and shalt not sin.","25":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> also that thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7227\">great,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H6631\">offspring</span> as the <span class=\"wl wl-kjv\" data-code=\"H6212\">grass</span> of the earth.","26":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thy <span class=\"wl wl-kjv\" data-code=\"H6913\">grave</span> in a full <span class=\"wl wl-kjv\" data-code=\"H3624\">age,</span> like as a shock of <span class=\"wl wl-kjv\" data-code=\"H1430\">corn</span> cometh <span class=\"wl wl-kjv\" data-code=\"H5927\">in</span> in his season.","27":"Lo this, we have <span class=\"wl wl-kjv\" data-code=\"H2713\">searched</span> it, so it is; <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> it, and know"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zal er iemand zijn,","tekst":"Anders, of er iemand is, die u antwoordt."},{"catchword":"antwoorde?","tekst":"Of, verhore? te weten, uit de heiligen, die hier op de aarde zijn, of uit de onheiligen en onvromen. De heiligen zullen u niet willen voorspreken; de anderen zullen niet kunnen. Tot wien dan zult gij u keren als gij God zo tegenspreekt? Hij wil zeggen: Niemand."},{"catchword":"heiligen","tekst":"Te weten, mensen, die nog in het leven zijn. Sommigen verstaan dit van de heilige engelen, gelijk onder, Job 15:15 , in dezen zin, dat die zelf, hoewel zij hogelijk begaafd zijn, Jobs zaak niet zouden kunnen verdedigen; maar de omstandigheden van den tekst geven te verstaan dat hier van vrome mensen gesproken wordt, die tegen de dwazen gesteld worden; en Elifaz neemt voor zeker op dat die vromen de bescherming zijner zaak niet zouden willen aannemen."}],"2":[{"catchword":"dwaze","tekst":"Zo worden meest genaamd degenen die met valse opiniën ingenomen zijnde, God naar behoren niet kennen of vrezen. Alzo in vs.3, idem Psa 107:17 ; Pro 1:7 , enz."},{"catchword":"toornigheid om,","tekst":"Te weten, des Heeren. Versta ook alzo in het volgende den ijver, dien de Heere heeft om de eer zijns naams voor te staan. Alzo wordt het woord toorn, of gramschap, alleen gesteld zonder bijvoeging van het woord God, 2Ch 28:13 . Zie de aantekening. Of men kan door den toorn en ijver verstaan de ongeduldigheid en roekeloze hittigheid der dwazen in het lijden en onder de straf van God. Sommigen stellen voor het woord ijver, nijdigheid; te weten, der onverstandigen en slechten."},{"catchword":"slechte","tekst":"Versta, dengene, die door zijne domheid lichtelijk gelooft, lichtelijk zich laat omzetten en van het goede verleiden. Sommigen maken tussen dezen en den dwazen voormeld dit onderscheid, dat die tot het rechte einde des levens niet tracht door de behoorlijke middelen, en dat deze het rechte einde niet begrijpt."}],"3":[{"catchword":"wortelende;","tekst":"Dat is, voorspoedig, machtig en weelderig zijnde."},{"catchword":"terstond","tekst":"Te weten, als ik kort daarna zag dat zij uitgeroeid was. Vergelijk Psa 37:35-36 , of terstond als ik ze gezien had, heb ik ze geoordeeld vervloekt te wezen."}],"4":[{"catchword":"in de poort,","tekst":"Dat is, in het rechthuis, want in de poorten der steden werd gericht gehouden, ten aanzien en aanhore des volks, dat uit en inging. Zie Gen 22:17 ."}],"5":[{"catchword":"Wiens oogst","tekst":"Te weten, des goddelozen, die recht tevoren, vs.3, de dwaze is genaamd geweest."},{"catchword":"uit de doornen","tekst":"Dat is, uit de akkers, niettegenstaande zij met doornen bezet en betuind waren."},{"catchword":"struikrover","tekst":"Het Hebreeuwse woord betekent eigenlijk een, die lang en wild haar heeft, gelijk moordenaars en struikrovers plegen te hebben. Alzo onder, Job 18:9 ."}],"6":[{"catchword":"uit het stof","tekst":"De zin is dat men de oorzaken der menselijke ellenden niet moet zoeken in het ijdel geval, òf het vliegende ongeluk, òf enkel in den ordinairen loop der natuur, maar in de zonde des mensen, die God naar zijn rechtvaardig oordeel straft en tehuiszoekt."},{"catchword":"verdriet","tekst":"Het Hebreeuwse woord betekent wel meest het kwaad der schuld, dat is, der ongerechtigheid, maar het wordt ook genomen voor het kwaad der straf. Zie Psa 90:10 , en Pro 12:21 ."}],"7":[{"catchword":"gelijk","tekst":"Hebreeuws, en. Alzo wordt de Hebreeuwse vau dikwijls genomen, gelijk onder, Job 12:11 , en Job 14:12 , en Job 16:21 , en Job 34:3 ; Pro 25:25 ."},{"catchword":"spranken","tekst":"Hebreeuws, de zonen der vurige kolen. Alzo wordt bij de Hebreën een pijl genoemd de zoon van den boog, onder, Job 41:19 ; idem, een zoon des pijlkokers, Lam 3:13 ; de tarwe, een zoon van den dorsvloer, Isa 21:10 . De zin nu hier is, gelijk uit een brandende kool de spranken en vonken opvliegen, die dan schade verwekken, dat ook alzo uit de aangeboren zonde voortkomen de dadelijke zonden, die dan vele ellenden, kwalen en plagen in de wereld veroorzaken. Of, gelijk het den spranken natuurlijk is opwaarts te vliegen, alzo is het den zondigen mens natuurlijk tot ellendigheid in deze wereld voort te komen."}],"8":[{"catchword":"ik zou","tekst":"Elifaz raadt Job dat hij zich liever verzoene met God door bekentenis van zijn zonden en de aanroeping der goddelijke genade, dan dat hij zo tot ongeduld zou uitvaren."}],"9":[{"catchword":"die men niet doorzoeken kan;","tekst":"Hebreeuws, en daar is geen doorzoeking; te weten, der grote dingen, die de Heere doet. Alzo Job 9:10 ."},{"catchword":"die men niet tellen kan;","tekst":"Hebreeuws, totdat er geen getal is. Alzo onder in de voor aangewezen plaats."}],"10":[{"catchword":"op de aarde,","tekst":"Hebreeuws, op het aangezicht der aarde. Alzo in het volgende lid van vs.10, en onder Job 18:17 ."},{"catchword":"straten;","tekst":"Het Hebreeuwse woord betekent niet alleen straten, die buiten de huizen zijn, maar ook andere plaatsen, die buiten de steden zijn, als velden, akkers, weiden, herenstraten, tuinen, hoven, enz., gelijk dat af te nemen is uit Psa 144:13 ."}],"11":[{"catchword":"de vernederden","tekst":"Dat is, die verkleind zijn door armoede en allerlei ellende, komende voornamelijk uit gebrek van Gods zegen."},{"catchword":"rouwdragenden","tekst":"Hebreeuws, zwarte; dat is, welke in het zwart gekleed zijn, als degenen, die treuren of rouw dragen. Versta dan, bedroefden en treurigen."}],"12":[{"catchword":"een ding uitrichten","tekst":"Of, niet dat wezen heeft, niets wezenlijks, niets bestendigs, of deugdzaams, of niet dat iets bijzonders is, of [hun] voornemen niet uitrichten. Het Hebreeuwse woord betekent wezen, bestendigheid, iets dat waarlijk is, gelijk hier, en onder, Job 11:6 , en Job 30:22 ; idem wet, wijsheid, rede, deugd; overmits deze dingen bestendig, vast en duurzaam zijn, gelijk onder, Job 6:13 , en Job 12:16 ; Pro 2:7 , en Pro 3:21 , en Pro 8:14 ."}],"13":[{"catchword":"wijzen","tekst":"Dat is, die menen wijs te wezen, of die wijs zijn naar de wereld. Alzo Isa 44:25 ; Oba 1:8 ; Mat 11:25 ."},{"catchword":"verdraaiden","tekst":"Of, tegenworstelenden. Versta, degenen, die met verkeerde zinnen woelen en worstelen om hun schalksheden in het werk te stellen. Alzo verdraaid, voor verkeerd, Pro 8:8 ."},{"catchword":"gestort","tekst":"Hebreeuws, verhaast; dat is, over hoop geworpen en verstoord."}],"14":[{"catchword":"Des daags","tekst":"Versta hiermede dat zij in de allerklaarste zaken blind zijn en zonder beleid van een recht verstand, hoewel zij zich gelaten zeer wijs en scherpzinnig te wezen. Vergelijk Deu 28:28 ."},{"catchword":"in de middag","tekst":"Dat is, als het allerklaarst is. Vergelijk Deu 28:29 ; onder, Job 11:17 ; Isa 50:10 ; Jer 15:8 . Alzo wordt de middag genomen voor hetgeen zeer klaar is; Psa 37:6 ."}],"15":[{"catchword":"behoeftige","tekst":"Dat is, den armen mens, die van de goddelozen verdrukt zijnde, de hulp des Heeren van doen heeft, en wordt in vs.16"},{"catchword":"hun mond,","tekst":"Te weten, der waanwijzen en listigen, van welke in vs.13 gesproken is, kwade lasteringen, dreigementen en wrede raadslagen."}],"16":[{"catchword":"verwachting;","tekst":"Dat is, goed, dat te verwachten is; alzo onder, Job 8:13 , en Job 11:18 , en Job 17:15 ."},{"catchword":"de boosheid","tekst":"Dat is, de bozen staan verstomd en bedwelmd, door de verwondering van Gods oordelen als voor het hoofd geslagen zijnde. Zie deze manier van spreken ook Psa 107:42 ."}],"17":[{"catchword":"mens,","tekst":"Van het Hebreeuwse woord, zie boven, Job 4:17 ."},{"catchword":"Almachtigen","tekst":"Zie Gen 17:1 ."}],"19":[{"catchword":"zes","tekst":"Een zeker getal van een onzeker. Zie Lev 26:8 . De zin is dat God den zijnen in vele benauwdheden bijstand zal bewijzen; ja in zeer vele zijn hand zo laten blijken dat het kwaad, hetwelk men vreesde, niet over hen zal komen. Zie gelijke manier van een groot en onzeker getal zekerlijk te stellen, Pro 6:16 , en Pro 24:16 , en Pro 30:18 , Pro 30:29 ."},{"catchword":"zal Hij","tekst":"Te weten, zo gij op hem door het geloof vertrouwt, hem door den gebede aanroept en door ware bekering uw leven naar zijn geboden aanstelt."},{"catchword":"in de zevende","tekst":"Anders, in zeven. Dat hier eerst het getal van zes, en daarvan van zeven gesteld wordt, dient eigenlijk tot uitbreiding en versiering der taal. Vergelijk Pro 6:16 , en Pro 30:15 , Pro 30:18 , Pro 30:21 , Pro 30:29 ."}],"20":[{"catchword":"van het geweld","tekst":"Hebreeuws, van de handen des zwaards; dat is, van het geweld van den oorlog, of der wapenen; alzo Psa 63:11 ; idem, van de hand des grafs, Psa 49:16 ; van de hand des striks, Psa 141:9 , nog van de hand des grafs, Hos 13:14 ; alzo van de hand des leeuws en des beers, 1Sa 17:37 ; van de hand des honds, Psa 22:21 , enz."}],"21":[{"catchword":"Tegen den gesel","tekst":"Dat is, tegen de lasterwoorden, achterklappingen en leugentalen, waardoor de kwaadspekende mensen tegen de vromen overal uitbreken en woeden. Anders, in; dat is, als gij gelasterd wordt, of van."}],"22":[{"catchword":"zult gij lachen,","tekst":"Dat is, gij zult hen belachen, verachten, en daarom niet bezwaard zijn. Lachen, voor verachten, gelijk onder, Job 39:10 , ob 39:25 ; Psa 2:4 , en Psa 37:13 ; Pro 31:25 ."}],"23":[{"catchword":"stenen des velds","tekst":"Te weten, opdat gij u aan dezelve niet stoot. De zin iah 59. 10. Jer. 15. 8. Thus the Word Noon, or midday, is taken for that which is very clear, Psal. 37. 6.]"}],"15":[{"catchword":null,"tekst":"But he delivereth the needy[i.e. the poor, who, being oppressed by the wicked, doth stand in need of the LORDS help, and is called poor, in the next verse, by a word in the original, which signifieth not only want, or scarcity of means, but likewise weakness, or feebleness of body, 2 Samuel 13. 4. Psalm 41. 2.] from the sword; from their mouth [i.e. from the evil slanders, reproaches, threatening, plots; and practices of those conceited wise and wily ones, spoken of ab. V. 13.] and from the hand of the strong."}],"16":[{"catchword":null,"tekst":"So (there) is expectation [i.e. some good to be expected; bel. Ch. 8. 13. & 17. 15.] for the poor, and the malice stoppeth her mouth [i.e. the wicked stand as dumb, and astonished, being amazed with the judgements of God, and knocked on the head as it were by wonderfulness of them. See this kind of speaking likewise Psal. 147. 42]"}],"17":[{"catchword":null,"tekst":"Behold, happy is the man [of the Hebrew word see above ch. 4. on v. 17.] when God chasteneth, therefore reject not the correction of the Almighty [See Gen. 17. On v. 1]"}],"18":[{"catchword":null,"tekst":"For he maketh to smart, and he bindeth, he woundeth throw, and his hands doth heal."}],"19":[{"catchword":null,"tekst":"In six straights [a certain number for an uncertain. See Lev. 26. On v. 8. The meaning is, that God doth show forth assistance to his in many straights, yea in very many, causeth his hand so to appear, that the evil which was feared doth not come upon them at all. See the like manner of putting down, a great uncertain number for a certain, Prov. 6. 16. And 24. 16. And 30. 18, 29.] he will deliver thee [viz. If so be, that thou put thy trust in him, and call upon him by prayer, and reform thy life according to his commandments by true Repentance] and in the seventh [oth. In seven. That here the number of (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
