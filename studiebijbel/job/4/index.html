ende opgericht, en de knieën die knikten hebt u vastgesteld;","5":"maar nu komt het aan bij u, en u bent verdrietig; het raakt tot u, en u wordt beroerd.","6":"Was niet uw vrees voor *God* uw hoop, en de oprechtheid van uw wegen uw verwachting?","7":"Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd?","8":"*Maar* zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.","9":"Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.","10":"Het gebrul van de leeuw, en de stem van de felle leeuw, en de tanden van de jonge leeuwen worden verbroken.","11":"De oude leeuw vergaat, omdat er geen prooi is, en de jongen van een oude leeuwin worden verstrooid.","12":"Verder is er mij in het geheim een woord gebracht, en mijn oor heeft daarvan een beetje opgevangen;","13":"Onder de gedachten die kwamen bij de visioenen van de nacht, toen een diepe slaap valt op de mensen,","14":"kwam er schrik en beving over mij, en het deed al mijn beenderen sidderen.","15":"Toen ging er een geest voorbij mijn gezicht; hij deed het haar van mijn lichaam overeind komen.","16":"Hij stond stil, maar ik herkende zijn gedaante niet; er was een beeltenis voor mijn ogen; er was stilte, en ik hoorde een stem, die zei:","17":"Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?","18":"Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd.","19":"Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.","20":"Van de morgen tot de avond worden zij vermorzeld; zonder dat men er acht op slaat, vergaan zij voor eeuwig.","21":"Verdwijnt hun uitnemendheid niet met hen? Zij sterven, maar niet in wijsheid."},"SV":{"1":"Toen antwoordde Elifaz, de Themaniet, en zeide:","2":"Zo wij een woord opnemen tegen u, zult gij verdrietig zijn? Nochtans wie zal zich van woorden kunnen onthouden?","3":"Zie, gij hebt velen onderwezen, en gij hebt slappe handen gesterkt;","4":"Uw woorden hebben den struikelende opgericht, en de krommende knieën hebt gij vastgesteld;","5":"Maar nu komt het aan u, en gij zijt verdrietig; het raakt tot u, en gij wordt beroerd.","6":"Was niet uw vreze *Gods* uw hoop, en de oprechtheid uwer wegen uw verwachting?","7":"Gedenk toch, wie is de onschuldige, die vergaan zij; en waar zijn de oprechten verdelgd?","8":"*Maar* gelijk als ik gezien heb: die ondeugd ploegen, en moeite zaaien, maaien dezelve.","9":"Van den adem Gods vergaan zij, en van het geblaas van Zijn neus worden zij verdaan.","10":"De brulling des leeuws, en de stem des fellen leeuws, en de tanden der jonge leeuwen worden verbroken.","11":"De oude leeuw vergaat, omdat er geen roof is, en de jongens eens oudachtigen leeuws worden verstrooid.","12":"Voorts is tot mij een woord heimelijk gebracht, en mijn oor heeft een weinigje daarvan gevat;","13":"Onder de gedachten van de gezichten des nachts, als diepe slaap valt op de mensen;","14":"Kwam mij schrik en beving over, en verschrikte de veelheid mijner beenderen.","15":"Toen ging voorbij mijn aangezicht een geest; hij deed het haar mijns vleses te berge rijzen.","16":"Hij stond, doch ik kende zijn gedaante niet; een beeltenis was voor mijn ogen; er was stilte, en ik hoorde een stem, *zeggende*:","17":"Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?","18":"Zie, op Zijn knechten zou Hij niet vertrouwen; hoewel Hij in Zijn engelen klaarheid gesteld heeft.","19":"Hoeveel te min *op* degenen, die lemen huizen bewonen, welker grondslag in het stof is? Zij worden verbrijzeld voor de motten.","20":"Van den morgen tot den avond worden zij vermorzeld; zonder dat men er acht op slaat, vergaan zij in eeuwigheid.","21":"Verreist niet hun uitnemendheid met hen? Zij sterven, maar niet in wijsheid."},"KJV":{"1":"Then Eliphaz the Temanite answered and said,","2":"*If* we assay to commune with thee, wilt thou be grieved? but who can withhold himself from speaking?","3":"Behold, thou hast instructed many, and thou hast strengthened the weak hands.","4":"Thy words have upholden him that was falling, and thou hast strengthened the feeble knees.","5":"But now it is come upon thee, and thou faintest; it toucheth thee, and thou art troubled.","6":"*Is* not *this* thy fear, thy confidence, thy hope, and the uprightness of thy ways?","7":"Remember, I pray thee, who *ever* perished, being innocent? or where were the righteous cut off?","8":"Even as I have seen, they that plow iniquity, and sow wickedness, reap","9":"By the blast of God they perish, and by the breath of his nostrils are they consumed.","10":"The roaring of the lion, and the voice of the fierce lion, and the teeth of the young lions, are broken.","11":"The old lion perisheth for lack of prey, and the stout lion's whelps are scattered abroad.","12":"Now a thing was secretly brought to me, and mine ear received a little","13":"In thoughts from the visions of the night, when deep sleep falleth on men,","14":"Fear came upon me, and trembling, which made all my bones to shake.","15":"Then a spirit passed before my face; the hair of my flesh stood up:","16":"It stood still, but I could not discern the form thereof: an image *was* before mine eyes, *there was* silence, and I heard a voice,","17":"Shall mortal man be more just than God? shall a man be more pure than his maker?","18":"Behold, he put no trust in his servants; and his angels he charged with folly:","19":"How much less *in* them that dwell in houses of clay, whose foundation *is* in the dust, *which* are crushed before the moth?","20":"They are destroyed from morning to evening: they perish for ever without any regarding","21":"Doth not their excellency *which is* in them go away? they die, even without wisdom."}},"tsk":{"1":[{"kopje":"Elifaz","refs":["Job 2:11","Job 15:1","Job 22:1","Job 42:9"]},{"kopje":"antwoordde","refs":["Job 3:1","Job 3:2","Job 6:1","Job 8:1 de=\"H8127\">teeth</span> of the young <span class=\"wl wl-kjv\" data-code=\"H3715\">lions,</span> are broken.","11":"The old <span class=\"wl wl-kjv\" data-code=\"H3918\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perisheth</span> for <span class=\"wl wl-kjv\" data-code=\"H1097\">lack</span> of <span class=\"wl wl-kjv\" data-code=\"H2964\">prey,</span> and the stout <span class=\"wl wl-kjv\" data-code=\"H3833\">lion's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">whelps</span> are scattered abroad.","12":"Now a <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was secretly <span class=\"wl wl-kjv\" data-code=\"H1589\">brought</span> to me, and mine <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> a little","13":"In <span class=\"wl wl-kjv\" data-code=\"H5587\">thoughts</span> from the <span class=\"wl wl-kjv\" data-code=\"H2384\">visions</span> of the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> when deep <span class=\"wl wl-kjv\" data-code=\"H8639\">sleep</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> on men,","14":"<span class=\"wl wl-kjv\" data-code=\"H6343\">Fear</span> <span class=\"wl wl-kjv\" data-code=\"H7122\">came</span> upon me, and <span class=\"wl wl-kjv\" data-code=\"H7461\">trembling,</span> which made <span class=\"wl wl-kjv\" data-code=\"H7230\">all</span> my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> to shake.","15":"Then a <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"H2498\">passed</span> before my <span class=\"wl wl-kjv\" data-code=\"H6440\">face;</span> the <span class=\"wl wl-kjv\" data-code=\"H8185\">hair</span> of my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> stood up:","16":"It stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still,</span> but I could not <span class=\"wl wl-kjv\" data-code=\"H5234\">discern</span> the <span class=\"wl wl-kjv\" data-code=\"H4758\">form</span> thereof: an <span class=\"wl wl-kjv\" data-code=\"H8544\">image</span> was before mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> there was <span class=\"wl wl-kjv\" data-code=\"H1827\">silence,</span> and I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a voice,","17":"Shall mortal <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> be more <span class=\"wl wl-kjv\" data-code=\"H6663\">just</span> than <span class=\"wl wl-kjv\" data-code=\"H433\">God?</span> shall a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> be more <span class=\"wl wl-kjv\" data-code=\"H2891\">pure</span> than his maker?","18":"Behold, he put no <span class=\"wl wl-kjv\" data-code=\"H539\">trust</span> in his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> and his <span class=\"wl wl-kjv\" data-code=\"H4397\">angels</span> he <span class=\"wl wl-kjv\" data-code=\"H7760\">charged</span> with folly:","19":"How much <span class=\"wl wl-kjv\" data-code=\"H637\">less</span> in them that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of <span class=\"wl wl-kjv\" data-code=\"H2563\">clay,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3247\">foundation</span> is in the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> which are <span class=\"wl wl-kjv\" data-code=\"H1792\">crushed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the moth?","20":"They are <span class=\"wl wl-kjv\" data-code=\"H3807\">destroyed</span> from <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> to <span class=\"wl wl-kjv\" data-code=\"H6153\">evening:</span> they <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> for <span class=\"wl wl-kjv\" data-code=\"H5331\">ever</span> without any regarding","21":"Doth not their <span class=\"wl wl-kjv\" data-code=\"H3499\">excellency</span> which is in them go <span class=\"wl wl-kjv\" data-code=\"H5265\">away?</span> they <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> even without wisdom."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"woord","tekst":"Het Hebreeuwse woord nasah is voor opheffen genomen, Psa 4:7 , gelijk manieren van spreken zijn Num 23:7 , onder, Job 27:1 . Anders, zo wij een woord verzoeken tot u, of aan u; namelijk, te spreken."},{"catchword":"verdrietig","tekst":"Hebreeuws eigenlijk, moede, of vermoeid worden? dat is, kwalijk tevreden zijn? Dit vrezen zij, merkende in Job enige tekenen van ongeduld, van welke zij begonnen kwalijk te oordelen."},{"catchword":"wie zal","tekst":"Te weten, die achtgeven op de woorden, die gij uit uw mond hebt laten gaan, en op de eer des Allerhoogsten, die wij voorstaan. Onder een schijn van goddelijken ijver strijkt Elifaz een verkeerd oordeel over zijn vriend, den vromen Job."}],"3":[{"catchword":"slappe handen","tekst":"Versta, de mensen, die traag waren in het volbrengen van hun schuldigen plicht, voornamelijk wanneer hun een zwaar kruis en lijden bejegend was. Vergelijk Isa 35:3 . De handen worden gezegd te verslappen als der mensen moed en kracht vergaan. Zie 2Sa 4:1 ."}],"4":[{"catchword":"den struikelende","tekst":"Dat is, die door ongeloof, mistrouwen, ongeduld en murmurering op den weg der godzaligheid gevallen waren, dat is gezondigd hadden. Zie van zulken geestelijken val, Pro 25:26 ; 1Co 10:12 ; Gal 6:1 ."},{"catchword":"krommende","tekst":"Die vanwege haar grote zwakheid door sterke vertroostingen moesten ondersteund worden om onder het kruis niet te bezwijken. Vergelijk Isa 35:3 ."}],"5":[{"catchword":"aan u,","tekst":"Te weten, het kwaad der straf, in hetwelk, als gij anderen placht gesteld te zien, gij dezelve onderwezen, gesterkt, vermaand en getroost hebt; daarom is het wonder dat gij dit nu aan uzelven niet weet te doen."},{"catchword":"zijt verdrietig;","tekst":"Of, bezwijkt; te weten, onder den last des lijdens."}],"6":[{"catchword":"vreze","tekst":"Dat is, uw godvruchtigheid en religie."},{"catchword":"hoop,","tekst":"Te weten, waarop gij steundet, dat is een oorzaak om loon voor uw godvruchtigheid te hopen en te genieten. De zin is: Hebt gij niet gehoopt, als gij God zoudt vrezen, dat Hij u altijd goeddoen zou? Maar dat is nu niet geschied. Bedenk dan dat uw vreze Gods niet oprecht is geweest, maar een geveinsde huichelarij. Het Hebreeuwse woord is ook voor hoop genomen, onder Job 8:14 , en Job 31:24 ; Psa 78:7 ; Pro 3:26 ."}],"8":[{"catchword":"die ondeugd","tekst":"Dat is, die goddelooslijk leven en anderen mensen kwaaddoen, zullen eindelijk om hun misdaden van God gestraft worden. Zie gelijke manier van spreken onder, Job 15:35 ; Psa 7:15 ; Pro 22:8 ; Isa 59:4 ; Hos 10:13 ; Gal 6:7-8 ."}],"9":[{"catchword":"adem","tekst":"Dit wordt van God bij gelijkenis gesproken, om zijn kracht en rechtvaardigheid te beter uit te drukken. De adem Gods betekent zijn kracht, die Hij gebruikt naar zijn wil, en zo licht kan uitvoeren als een mens zijn adem kan laten gaan. Vergelijk onder Job 33:4 , en Job 37:10 ; Isa 30:33 ."},{"catchword":"het geblaas","tekst":"Versta, zijn gramschap en toornigheid. Vergelijk onder, Job 15:30 , en de aantekening."}],"10":[{"catchword":"De brulling","tekst":"De zin is: Gelijk God de wrede en gruwzame dieren bedwingt en verdoet, dat Hij ook alzo de boze tirannen en goddeloze mensen, die hier bij leeuwen vergeleken worden, weet in den toom te houden en te verdoen. Anders, [van de] brulling des leeuws en de stem des fellen leeuws vergaan zij, en [van de] tanden, enz. worden zij gemaald; te weten, de goddelozen. De zin is, zo God hen niet verderft door zichzelven, òf door anderen, òf door enige levenloze schepselen, Hij verderft hen door de wilde dieren."}],"11":[{"catchword":"De oude leeuw","tekst":"Dat is, gelijk de leeuwen, hoewel zij geweldig en moedig zijn, onder, Job 39:1 , nochtans eindelijk vergaan door het ene of het andere middel, alzo nemen ook de goddeloze tirannen door Gods rechtvaardig oordeel hun einde."}],"12":[{"catchword":"woord","tekst":"Dat is, een leer en openbaring Gods, op dezen handel wel passende."},{"catchword":"heimelijk","tekst":"Hebreeuws, gestolen, of steelsgewijze gekomen; dat is, heimelijk en in het verborgen toegebracht om van mij waargenomen en wel bewaard te worden."},{"catchword":"weinigje","tekst":"Of, stukje."}],"13":[{"catchword":"gedachten","tekst":"Het Hebreeuwse woord betekent eigenlijk takken; gelijk Isa 17:6 en Isa 27:11 , maar hier wordt het genomen bij gelijkenis voor gedachten, gelijk onder, Job 20:2 . Zie ook 1Ki 18:21 , en de aantekening daarop; want gelijk de takken van den stam des booms voortkomen, alzo ook komen de gedachten voort van den zin of het hart des mensen."},{"catchword":"van de gezichten","tekst":"Of, uit de gezichten; dat is, die uit de gezichten des nachts voortkomen. Anders, naar de gezichten des nachts. Versta door deze, die des nachts den mensen in den slaap, of buiten denzelven vertoond worden. Zie van de gezichten Gen 15:1 , en Gen 46:2 ."}],"14":[{"catchword":"Kwam mij","tekst":"Welke pleegt te bejegenen dengenen, wien God, òf zelf, òf door zijne engelen verschijnt, om hem tot aandacht en eerbied te bereiden. Vergelijk Exo 3:6 , en de aantekening."},{"catchword":"veelheid","tekst":"Dat is al mijn beenderen."}],"15":[{"catchword":"ging","tekst":"Alzo wordt het Hebreeuwse woord ook genomen onder Job 9:11 , Job 9:26 , en Job 11:10 ."},{"catchword":"geest;","tekst":"Dat is, een goede engel des Heeren, om hem te verklaren hetgeen volgt, vs.17."},{"catchword":"mijns vleses","tekst":"Dat is, van mijn hoofd."}],"16":[{"catchword":"Hij stond,","tekst":"Te weten, de geest."},{"catchword":"daar was stilte,","tekst":"Vergelijk hiermede 1Ki 19:12-13 , en de aantekening daarop."}],"17":[{"catchword":"mens","tekst":"Het Hebreeuwse woord betekent eigenlijk den mens, die vol zwakheid en boosheid en aan vele ellendigheden onderworpen is, na welke eindelijk de dood volgt."},{"catchword":"zijn Maker?","tekst":"Dat is, God, die hem gemaakt en geschapen heeft. Alzo Deu 32:15 , onder, Job 35:10 ; Pro 14:31 , en Pro 22:2 ; Isa 17:7 ; Hos 8:14 ."}],"18":[{"catchword":"knechten","tekst":"Versta, de heilige engelen, die voor hem staan om zijn wil uit te voeren; Psa 103:20-21 ."},{"catchword":"vertrouwen;","tekst":"Dat is, Hij zou niet steunen op de kloekheid en de gaven, die in hen geschapen zijn, wanneer zij afgezonderd waren van de gedurige zorg en bewaring, waardoor Hij hen in hun staat onderhoudt. Gelijke manier van spreken is onder, Job 15:15 ."},{"catchword":"klaarheid","tekst":"Waardoor verstaan wordt de volmaaktheid der gaven en deugden, die God in de heilige engelen heeft geschapen. Want hoewel zij uitnemend zijn, zo zijn zij nochtans niet te vergelijken met de volmaaktheid des Scheppers, omdat zij zonder deze gedurige genade en kracht in zichzelven veranderlijk zijn. In welken zin Elifaz ook onder, Job 15:15 , zegt dat de hemelen in de ogen des Heeren niet zuiver zijn; namelijk met zijn oneindige volmaaktheid vergeleken zijnde. Anders, en zijnen engelen zou Hij dwaasheid opleggen; dat is, Hij zou hen voor dwaas houden indien zij zich rechtvaardiger zouden houden dan God; gelijk Elifaz meende dat Job van zichzelven gezegd had. Of Hij zou hun dwaasheid kunnen toeschrijven, wanneer Hij van hen oordeelde naar hun natuur buiten zijn gave, waardoor Hij hen geduriglijk in hun staat onderhoudt; anders bevindt Hij dat zij wel tot zottigheid en onzinnigheid zouden kunnen vervallen; of, Hij zou hun dwaasheid kunnen toeschrijven in vergelijking van zijn oneindige wijsheid en majesteit."}],"19":[{"catchword":"op degenen,","tekst":"Te weten, vertrouwt Hij, namelijk, God. Anders, hoeveel te meer, [verlegt Hij dwaasheid] op degenen, enz."},{"catchword":"lemen huizen","tekst":"Hebreeuws, huizen des leems. Versta door deze de lichamen der mensen, die oorspronkelijk uit aarde en slijk gemaakt zijn; Gen 2:7 ; 1Co 15:47 . Zo worden ook de lichamen bij huizen en woningen vergeleken; 2Co 5:1 . Sommigen verstaan het van de aardse woning der mensen gesteld tegen de hemelse woningen der engelen."},{"catchword":"worden verbrijzeld","tekst":"Hebreeuws, verbrijzelen; dat is, verbrijzeld worden. Alzo onder, Job 7:3 , hebben mij besteld, voor zijn, of worden mij besteld; en Job 34:20 , nemen weg, voor wordt weggenomen; Pro 6:30 , verachten, voor veracht wordt; Luk 12:20 , zal eisen, voor zal geëist worden, enz."},{"catchword":"voor de motten","tekst":"Hebreeuws, voor het aangezicht ener mot; dat is, zeer haastelijk, eerder en lichter dan een mot verteerd wordt, welke door een kleine aanwrijving verbroken wordt. De woorden voor het aangezicht betekenen hier niet de plaats, maar den tijd, gelijk Gen 27:7 , en Gen 29:26 , en Gen 36:31 . Anderen verstaan daardoor van de motten."}],"20":[{"catchword":"Van den morgen","tekst":"Dat is, geduriglijk door, den gansen tijd huns levens worden zij door allerlei ellende en plagen verpletterd."},{"catchword":"zonder","tekst":"Dat is, zonder dat iemand zulks waarneme of enige remedie daartoe brenge. Hebreeuws, omdat niet is, die [zijn hart tot zich] stelt. Vergelijk Job 23:6 , en zie deze manier van spreken in haar geheel boven, Job 1:8 , en in de aantekening."}],"21":[{"catchword":"uitnemendheid","tekst":"Versta hierdoor al hetgeen, waardoor de mensen hier onder elkander plegen uit te steken en verheven te worden."},{"catchword":"met hen?","tekst":"Of, die in hen is."},{"catchword":"in wijsheid","tekst":"Dat is, zonder de ware kennis en vreze Gods, die het beginsel, ja de hoofdzaak is van de ware wijsheid; Pro 1:7 . Vergelijk Psa 49:21 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then answered Eliphaz the Temanite, and said:"}],"2":[{"catchword":null,"tekst":"If we took up a word against thee, [the Hebrew word Nasah is used for taking, or lifting up, Psalm 4. 7. the like manner of speaking ye have, Num. 23. 7. & 27. 1. Oth. if we tried, or essayed a word unto thee, or on thee; // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen

  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;

  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
