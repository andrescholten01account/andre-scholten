en nachten van moeite zijn mij voorbereid.","4":"Als ik ga liggen om te slapen, dan zeg ik: Wanneer zal ik opstaan, en heeft Hij de avond afgemeten? En ik word verzadigd van woelingen tot aan de schemertijd.","5":"Mijn vlees is met het gewormte en met het gruis van het stof bekleed; mijn huid is gekliefd en verachtelijk geworden.","6":"Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting.","7":"Bedenk, dat mijn leven een wind is; mijn oog zal niet terugkomen, om het goede te zien.","8":"Het oog van hem die mij *nu* ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet *meer* zijn.","9":"Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet *weer* opkomen.","10":"Hij zal niet meer terugkeren naar zijn huis, en zijn plaats zal hem niet meer kennen.","11":"Zo zal ik ook mijn mond niet weerhouden, ik zal spreken in benauwdheid van mijn geest; ik zal klagen in bitterheid van mijn ziel.","12":"Ben ik dan een zee, of een walvis, dat U een wacht bij mij zet?","13":"Wanneer ik zeg: Mijn bedstede zal mij vertroosten, mijn leger zal van mijn klacht *iets* wegnemen;","14":"Dan doet U mij schrikken met dromen, en door visioenen verschrikt U mij;","15":"Zodat mijn ziel de verworging kiest; de dood meer dan mijn beenderen.","16":"Ik versmaad ze, ik zal toch in eeuwigheid niet leven; houd op met mij, want mijn dagen zijn ijdelheid.","17":"Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?","18":"En dat U hem bezoekt elke morgen; dat U hem elk ogenblik beproeft?","19":"Hoe lang keert U zich niet van mij af, *en* laat U niet van mij af, totdat ik mijn speeksel inzwelg?","20":"Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?","21":"En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn."},"SV":{"1":"Heeft niet de mens een strijd op de aarde, en zijn zijn dagen niet als de dagen des dagloners?","2":"Gelijk de dienstknecht hijgt naar de schaduw, en gelijk de dagloner verwacht zijn werkloon;","3":"Alzo zijn mij maanden der ijdelheid ten erve geworden, en nachten der moeite zijn mij voorbereid.","4":"Als ik te slapen lig, dan zeg ik: Wanneer zal ik opstaan, en Hij den avond afgemeten hebben? En ik word zat van woelingen tot aan den schemertijd.","5":"Mijn vlees is met het gewormte en met het gruis des stofs bekleed; mijn huid is gekliefd en verachtelijk geworden.","6":"Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting.","7":"Gedenk, dat mijn leven een wind is; mijn oog zal niet wederkomen, om het goede te zien.","8":"Het oog desgenen, die mij *nu* ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet *meer* zijn.","9":"Een wolk vergaat en vaart henen; alzo die in het graf daalt, zal niet *weder* opkomen.","10":"Hij zal niet meer wederkeren tot zijn huis, en zijn plaats zal hem niet meer kennen.","11":"Zo zal ik ook mijn mond niet wederhouden, ik zal spreken in benauwdheid mijns geestes; ik zal klagen in bitterheid mijner ziel.","12":"Ben ik dan een zee, of walvis, dat Gij om mij wachten zet?","13":"Wanneer ik zeg: Mijn bedstede zal mij vertroosten, mijn leger zal van mijn klacht *wat* wegnemen;","14":"Dan ontzet Gij mij met dromen, en door gezichten verschrikt Gij mij;","15":"Zodat mijn ziel de verworging kiest; den dood meer dan mijn beenderen.","16":"Ik versmaad ze, ik zal toch in der eeuwigheid niet leven; houd op van mij, want mijn dagen zijn ijdelheid.","17":"Wat is de mens, dat Gij hem groot acht, en dat Gij Uw hart op hem zet?","18":"En dat Gij hem bezoekt in elken morgenstond; dat Gij hem in elken ogenblik beproeft?","19":"Hoe lang keert Gij U niet af van mij, *en* laat niet van mij af, totdat ik mijn speeksel inzwelge?","20":"Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt Gij mij U tot een tegenloop gesteld, dat ik mijzelven tot een last zij?","21":"En waarom vergeeft Gij niet mijn overtreding, en doet mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en Gij zult mij vroeg zoeken, maar ik zal niet zijn."},"KJV":{"1":"*Is there* not an appointed time to man upon earth? *are not* his days also like the days of an hireling?","2":"As a servant earnestly desireth the shadow, and as an hireling looketh for *the reward of* his work:","3":"So am I made to possess months of vanity, and wearisome nights are appointed","4":"When I lie down, I say, When shall I arise, and the night be gone? and I am full of tossings to and fro unto the dawning of the day.","5":"My flesh is clothed with worms and clods of dust; my skin is broken, and become loathsome.","6":"My days are swifter than a weaver's shuttle, and are spent without hope.","7":"O remember that my life *is* wind: mine eye shall no more see good.","8":"The eye of him that hath seen me shall see me no *more*: thine eyes","9":"*As* the cloud is consumed and vanisheth away: so he that goeth down to the grave shall come up","10":"He shall return no more to his house, neither shall his place know","11":"Therefore I will not refrain my mouth; I will speak in the anguish of my spirit; I will complain in the bitterness of my soul.","12":"*Am* I a sea, or a whale, that thou settest a watch","13":"When I say, My bed shall comfort me, my couch shall ease my complaint;","14":"Then thou scarest me with dreams, and terrifiest me through visions:","15":"So that my soul chooseth strangling, *and* death rather than my life.","16":"I loathe *it*; I would not live alway: let me alone; for my days *are* vanity.","17":"What *is* man, that thou shouldest magnify him? and that thou shouldest set thine heart","18":"And *that* thou shouldest visit him every morning, *and* try him every moment?","19":"How long wilt thou not depart from me, nor let me alone till I swallow down my spittle?","20":"I have sinned; what ss=\"wl wl-kjv\" data-code=\"H1104\">down</span> my spittle?","20":"I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned;</span> what shall I <span class=\"wl wl-kjv\" data-code=\"H6466\">do</span> unto thee, O thou <span class=\"wl wl-kjv\" data-code=\"H5341\">preserver</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men?</span> why hast thou <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> me as a <span class=\"wl wl-kjv\" data-code=\"H4645\">mark</span> against thee, so that I am a burden","21":"And why dost thou not <span class=\"wl wl-kjv\" data-code=\"H5375\">pardon</span> my <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression,</span> and take <span class=\"wl wl-kjv\" data-code=\"H5674\">away</span> mine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity?</span> for now shall I <span class=\"wl wl-kjv\" data-code=\"H7901\">sleep</span> in the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust;</span> and thou shalt seek me in the morning,"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"strijd","tekst":"Het Hebreeuwse woord, hier overgezet, wordt zeer dikwijls gebruikt voor een strijd, of kamp, of heir, die òf werelds is, Num 1:3 , enz., òf kerkelijk, gelijk Num 4:3 , enz., òf geestelijk, 2Co 10:4 ; 1Ti 1:18 . Anders, gezetten tijd."},{"catchword":"zijn zijn dagen","tekst":"Versta, den tijd zijns levens, welke hier bij de dagen eens dagloners vergeleken wordt, omdat hij zeker en gesteld is, kort, vol arbeid en moeite, nochtans achtervolgd van enige rust; want een dagloner, des daags gewrocht hebbende, rust des nachts. Hieruit wil Job besluiten , naardien de gesteldheid van des mensen leven zodanig is, dat hij niet zo gruwelijk behoorde geplaagd te wezen, maar wel enige rust te hebben, voornamelijk als hij den Heere zijn God recht gevreesd en gediend had."}],"2":[{"catchword":"de dienstknecht","tekst":"Te weten, die vermoeid is door den arbeid des dags."},{"catchword":"hijgt","tekst":"Of, haakt; dat is, ernstiglijk begeert en verlangt. Alzo onder, Job 36:20 ."},{"catchword":"schaduw,","tekst":"Versta, den ondergang der zon en de rust des nachts. Vergelijk Psa 102:12 , en Psa 109:23 ."},{"catchword":"werkloon;","tekst":"Hebreeuws, zijn werk; dat is het loon zijns werks; vergelijk Lev 19:13 ; Jer 22:13 ."}],"3":[{"catchword":"maanden","tekst":"Hebreeuws, Ik ben gemaakt te erven voor mij maanden der ijdelheid. Hieruit blijkt dat Job enige maanden in dit verdriet geweest is. Vergelijk onder, Job 29:2 ."},{"catchword":"ijdelheid","tekst":"Dat is, die zeer ijdel, moeilijk en verdrietig zijn geweest. Vergelijk onder, vs.16, en Job 15:31 ."},{"catchword":"geworden,","tekst":"Hij wil zeggen dat zijn arbeid en lijden zwaarder is dan van den knecht en den dagloner, want deze met het einde des werks en met den nacht rust krijgen, daar hem de kwalen zelfs ook in de nachten bijbleven."},{"catchword":"zijn mij voorbereid","tekst":"Hebreeuws, hebben mij voorbereid. Zie boven, Job 4:19 ."}],"4":[{"catchword":"Hij den avond","tekst":"Te weten, God. Of aldus: Wanneer zal de avond afgemeten zijn? dat is wanneer zal hij geëindigd worden? Door den avond is hier te verstaan de nacht, die alzo wordt genoemd omdat hij van den avond begint; Gen 1:5 ."},{"catchword":"word zat","tekst":"Zat van enige kwaad te zijn, is daarvan overlast te zijn, dat men des niet meer vermag. Zie onder, Job 10:15 , en Job 14:1 ; Psa 88:4 , en Psa 123:3-4 ; Pro 1:31 , en Pro 28:19 ; Lam 3:15 ; Hab 2:16 ."},{"catchword":"van woelingen","tekst":"Dat is, van mij om en om te keren in het bed."},{"catchword":"schemertijd","tekst":"Te weten, van den morgenstond; dat is, als het des morgens vroeg tussen donker en licht is. Alzo kan het Hebreeuwse woord ook genomen worden 1Sa 30:17 , en Psa 119:147 . Van de avondschemering, zie 2Ki 7:5 , en de aantekening."}],"5":[{"catchword":"gewormte","tekst":"Te weten, door de zweren, die aan mijn lichaam zijn, uit wier etter en bloed wormen voortkomen."},{"catchword":"gruis","tekst":"Versta, de roven, die van zijn zweren afgeschrapt werden. Anderen verstaan aardkluiten, die aan zijn lijf hingen, omdat hij op de aarde zat of lag."},{"catchword":"des stofs bekleed;","tekst":"Dat is [gelijk enigen verstaan], des lichaams; zo wordt het genoemd Ecc 12:7 , omdat het oorspronkelijk uit het stof der aarde genomen is; Gen 2:7 ."},{"catchword":"gekloofd","tekst":"Te weten, door de zweren, die de huid des lichaams schenden en openen."},{"catchword":"verachtelijk","tekst":"Anders, gesmolten; dat is, vloeiende van etter en vuile vochtigheid."}],"6":[{"catchword":"Mijn dagen","tekst":"Te weten, mijns levens."},{"catchword":"lichter","tekst":"Dat is, sneller; alzo wordt licht voor snel genomen, onder, Job 9:25 ; Isa 5:26 , en Isa 18:2 ; Jer 2:23 ."},{"catchword":"zonder","tekst":"Hebreeuws, met niet hoop, of met het einde der hoop; dat is, dat de hoop, van die wederom te krijgen, ophoudt en een einde neemt."}],"7":[{"catchword":"Gedenk,","tekst":"Job keert zijn aanspraakt tot God, van wien hij begeert, dewijl ons leven in zichzelf zeer kort en ellendig is, dat Hij hem tenminste voor den tijd, die hem hier nog overig was, zijn tijdelijken zegen wilde vergunnen, gelijk welke hier maar genoten kon worden."},{"catchword":"wind is;","tekst":"Dat is, zeer nietig, ongestadig en haast vergaande. Zie boven, Job 6:26 ."},{"catchword":"het goede","tekst":"Te weten, van dit vergankelijke leven. Het goede te zien, is het te genieten, of te krijgen. Alzo onder, Job 9:25 ; Psa 128:5 ; Ecc 5:17 . In denzelfden zin wordt men gezegd de rust te zien, Gen 49:15 ; het licht te zien, onder, Job 33:28 ; het leven te zien, Joh 3:36 ; goede dagen te zien, 1Pe 3:10 , enz."}],"8":[{"catchword":"mij nu ziet,","tekst":"Te weten, hier op de aarde. Anders, het oog des gezichts; dat is, die een scherp gezicht heeft."},{"catchword":"niet zien;","tekst":"Te weten, als ik van hier door den dood zal gescheiden zijn."},{"catchword":"uw ogen","tekst":"Te weten, om mij wel te doen, maar evenwel zal ik hier beneden op de aarde niet zijn om uw goederen zo lichamelijk als geestelijk te genieten. Hiertoe waren de heiligen belust, eensdeels om God alhier nog te dienen en zijn naam groot te maken, anderdeels om zich door het gebruik der tijdelijke weldaden van de liefde Gods en de eeuwige goederen te verzekeren. Zie Psa 6:6 , en Psa 88:11-13 , en Psa 122:1-2 , en Psa 128:5 ."},{"catchword":"niet meer zijn","tekst":"Te weten, in dit leven. Zie boven, Job 3:16 ."}],"9":[{"catchword":"graf daalt,","tekst":"Zie de betekenis van het Hebreeuwse woord scheol, Gen 37:35 , en in de aantekening daarop."},{"catchword":"weder opkomen","tekst":"Te weten, in deze vergankelijke wereld; want dat Job de opstanding uit de doden vastelijk gelooft heeft, blijk onder, Job 19:25-27 ."}],"10":[{"catchword":"zijn plaats","tekst":"Dat is, zijn vrienden, medeburgers en bekenden, die in zijn huis, stad en land woonachtig zijn. Aldus wordt de plaats genomen voor degenen, die daarin zijn. Alzo onder, Job 8:18 , en Job 20:9 ; Psa 37:10 . Desgelijks worden de paden en wegen genomen voor degenen, die daarop wandelen en reizen; boven, Job 6:19 ."}],"11":[{"catchword":"Zo zal ik","tekst":"De zin is, naardien het leven des mensen in het algemeen vol ijdelheid en katijvigheid is, en ik mij in het bijzonder nog daarenboven in deze extra ordinaire droefheid bevind, zijnde beroofd van alle tijdelijke welvaart en vertroosting, zo moet ik tenminste mijn treurig gemoed door den mond ontledigen."},{"catchword":"in bitterheid","tekst":"Dat is, in zeer grote droefenis des harten. Zie 2Ki 4:27 ."}],"12":[{"catchword":"walvis,","tekst":"Zie van diens kracht en geweld onder Job 41 ."},{"catchword":"wachten zet?","tekst":"Te weten, door dit grote lijden, hetwelk mij van alle kanten omsingelt en mijn gemoed dag en nacht pijnigt; hij wil zeggen dat God daardoor scheen hem te willen intomen, opdat hij niemand kwaad deed, gelijk alsof hij een zee of zeemonster ware, die door de duinen, klippen en diepten binnen haar palen gehouden moet worden, opdat zij den mensen geen schade aandoen."}],"13":[{"catchword":"Wanneer ik zeg","tekst":"Te weten, bij mijzelven; dat is, als ik denk; zie Gen 20:11 ."}],"14":[{"catchword":"dromen,","tekst":"Te weten, schrikkelijke, die God den melankolieken of zwaarmoedigen laat overkomen, of door de natuur hunner ziekte, die de verbeelding des mensen verderft, of ook door middel van den Satan, die zijn gelegenheid waarnemende, door de melankolieke humeuren, welke hij in den mens vindt, vreemde gezichten in hem veroorzaakt."}],"15":[{"catchword":"verworging","tekst":"Versta, een geweldigen en haastigen dood; te weten, door deze gedurige kwelling."},{"catchword":"dan mijn beenderen","tekst":"Dat is, dan het leven des lichaams. Hij wil zeggen dat hij liever had te sterven, dan zodanig verrotte, stinkende en van etter overvloeiende beenderen lang te hebben. Hij maakt gewag voornamelijk van zijn beenderen, omdat zijn kwaal tot het binnenste zijns lichaams toe ingedrongen was; beenderen voor de kracht, het leven en het binnenste des lichaams; Pro 14:30 , en Pro 17:22 ; Isa 38:13 ."}],"16":[{"catchword":"versmaad ze,","tekst":"Te weten, mijn beenderen."},{"catchword":"van mij,","tekst":"Te weten, aldus te plagen en te beroeren."},{"catchword":"ijdelheid","tekst":"Of, als een wind, gelijk boven, vs.7. Ijdelheid wordt het leven des mensen genaamd, niet alleen omdat het kort is en haast verdwijnt, onder, Job 15:31 , maar ook omdat de mens daarin, als in hetgeen vol moeite en verdriet is, het rechte goed, dat hem ten volle gelukzalig maakt, niet vindt. Vergelijk boven, vs.3, en de aantekening."}],"17":[{"catchword":"dat Gij hem","tekst":"Dat is, dat Gij op hem, die zo broos en nietig is als ik nu ben, achtgeef, en hem waardig houdt zo met hem gemoeid te wezen. Vergelijk de manier van spreken, boven, de aantekening Job 1:8 ."}],"18":[{"catchword":"bezoekt","tekst":"Te weten, met kastijdingen en straffen. Zie Gen 21:1 ."},{"catchword":"Morgenstond;","tekst":"Dit gedenkt hij voornamelijk om te tonen:&lt;i&gt;I.&lt;/i&gt; dat God ons tehuis bezoekt met bijzondere zorg en naarstigheid; vergelijk Lam 3:23 ;&lt;i&gt;II.&lt;/i&gt; dat God ons niet spaart, zelfs als wij meest in den arbeid zijn;&lt;i&gt;III.&lt;/i&gt; dat niet alleen het midden en einde, maar ook het begin onzes levens en onzer werken aan veel lijden onderworpen is; Psa 88:16 , en Psa 90:9 ."},{"catchword":"in elken","tekst":"Dat is, dikwijls, doorgaans, onvoorziens, haastelijk."},{"catchword":"beproeft?","tekst":"Hoe God de Heere de zijnen beproeft, zie Gen 22:1 ."}],"19":[{"catchword":"keert Gij","tekst":"Te weten, dat Gij een einde maken zoudt van mij aldus te straffen."},{"catchword":"mijn speeksel","tekst":"Het is een algemene manier van spreken, betekenende een zeer korten tijd, gelijk is zijn adem te halen, alsof hij zeide: Houd tenminste een ogenblik op van mij te slaan, opdat ik ademhale. Vergelijk Job 9:18 ."}],"20":[{"catchword":"gezondigd,","tekst":"Versta, enige zekere zonde hem onbekend, om welke dit lijden hem zou overkomen zijn."},{"catchword":"U doen,","tekst":"Te weten, om met U verzoend en bevredigd te worden, teneinde ik uit dit lijden geraken mocht."},{"catchword":"Mensenhoeder?","tekst":"Dat is, die zeer nauw waarneemt wat de mensen doen, of die ook huns levens bewaarder zijt, daar Gij nu mijn leven schijnt te willen verderven."},{"catchword":"tegenloop gesteld,","tekst":"Of, tegenmerk, of doel, of wit, waartegen Gij uw pijlen uitschiet. Vergelijk onder, Job 16:12 . Het Hebreeuwse woord betekent eigenlijk hetgeen, waartegen iemand geweldiglijk aanloopt, om dat te schenden, te breken, of om te werpen."},{"catchword":"tot een last zij?","tekst":"Te weten, door al het lijden, dat Gij mij in en buiten mijn lichaam zo vreeslijk aandoet, dat het mij als een onverdragelijke last is."}],"21":[{"catchword":"En waarom","tekst":"Hij wil zeggen: Indien het voorgeven mijner vrienden waarachtig is, dat ik om mijner zonden wil aldus geplaagd ben [hoewel mijn conscientie anders getuigt], waarom vergeeft Gij mij die zonde niet, opdat ik niet langer aldus geplaagd worde? Want ik zal nu haast sterven, zodat Gij, mij alhier zoekende om mij nog wel te doen, mij niet zult vinden."},{"catchword":"weg?","tekst":"Hebreeuws, voorbijgaan, over, of doorgaan. Zie 2Sa 12:13 ."},{"catchword":"Gij zult mij","tekst":"Vergelijk boven, vs.8, en zie de aantekening."},{"catchword":"vroeg zoeken,","tekst":"Het Hebreeuwse woord betekent eigenlijk in den morgenstond zoeken; maar omdat de dingen, die in den morgenstond gedaan worden, met groteren vlijt worden uitgericht, zo wordt het voor alle naarstige onderzoeking genomen; zie onder, Job 8:5 ; Psa 63:2 ; Pro 7:15 ."},{"catchword":"zal niet zijn","tekst":"Zie boven, Job 3:16 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Hath not man a combate [the Hebrew word here used, occureth frequently, in the signification of fight, or combate, or hoste, which is either temporal, Num. 1. 3, & c. Or ecclesiastical, as Num. 4. 3, & c. Or spiritual, 2 Cor. 10. 4. 1 Tim. 1. 18. Oth. Set time] upon Earth? And are not his days as the days of the-Labourer? [Understand by his days, the time of his life, which is here is compared to the days of an hireling, or day-labourer; because the same is set and sure, short, and full of labourer having wrought hard all day, he resteth at night. Hence Job will conclude, that seeing the condition of man&acirc;&euro;&trade;s life is such he ought not to plagued so grievously, but be allowed some rest and respite, especially, if he have truly feared and served the LORD his God.]"}],"2":[{"catchword":null,"tekst":"As the Bond-servant [understand him that is wearied by the labour of the day] panteth [or, gapeth, gaspeth, i.e. earnestly desireth and longeth. Thus also bel. Ch. 36. 20.] after the shadow; [understand the going down of the Sun, and the taking of rest by night. Compare Psa 102:12. and 109.23.] and as the day-labourer expecteth his hire [Heb. His work, i.e. the hire or wages of his Work. Compare Levit.19.13. Jer. 22.13.]"}],"3":[{"catchword":null,"tekst":"So Moons of vanity are become an inheritance to me; [Heb. I am made to inherit for my self Moons of Vanity. By this it appeareth that Job continued for some months in this distress. Compare below chap.29.2. Moons of Vanity, i.e. that were very empty, vain, toilsome, and tedious to me. Comp. Bel.v.16.& ch.15.31. His meaning here is, that his toil and suffering was more grievous, then that of the bond-servant, and of the day-labourer: for these at the end of their labour, and by night, had some rest yet; whereas his pains continued upon him the nights also.] and nights of toil are prepared for me. [Heb. Have prepared, see above ch.4. on v.19.]"}],"4":[{"catchword":null,"tekst":"When I lay down to sleep, then I say, when shall I rise up, and he have measured out the evening? [he, viz. God, or thus, When shall the evening be measured out? i.e. When shall it be at end? Or ended once? By the Evening here the night is understood; which is so called, because it beginneth from or with the evening, Gen 1:5.] and I am full [(satur) to be full of any evil, is to be overcharged with it, that one is not able to bear or digest any more. See below ch.10.15. and 14.1. and Psa 88:4. & 123.3,4. Pro 1:31.& 28.19. Lam 3:15. Hab.2.16.] of tumblings [i.e. turning and tossing me about in the bed] until the glimmering-time [viz. Of the morning, or day break, i.e. when it is between dark and dawning in the Morn. Thus the Hebrew word may likewise be taken 1 Sam.30.17. and Psalm 119.v.147. of the Evenings, Glimmering, or twilight; See 2 Kings 7.5. and the annotation.]"}],"5":[{"catchword":null,"tekst":"My flesh is clothed with Worms; [viz. By reason of the putrefying sores that are upon my body, out of whose matter and blood there came forth worms.] and with the rubbish, [understand the scabs, which were scratched off from his ulcers. Others understand, clods of earth, which cleaved unto his body, because he sat or lay upon the earth] of the dust: [i.e. (as some do understand it) of the body; which is called thus Ecc 12:7. because originally taken out of the dust of the earth, Gen 2:7.] which tear, and open the skin of the body] and become contemptible, [Oth. Molten, i.e. running with gore and filthy matter.]"}],"6":[{"catchword":null,"tekst":"My days, [viz. Of my life] have been lighter [i.e. swifter; thus the word light is taken for swift, below ch.9.25. Isa 5:26. etc 18.2. Jer 2:23.] then a Weavers shuttle, and are consumed without expectation [Heb. With not hope, or with the end of hope, i.e. so, as that the hope recovering the same, doth cease, and is at an end.]"}],"7":[{"catchword":null,"tekst":"Remember [Job turneth his speech to God, of whom he desireth (because our life is of it self so short and wretched) that he would be pleased at leastwise for the time he had yet remaining to vouchsafe him his temporal blessing, the which could only here be enjoyed.] that my life is a wind [i.e. very vain, unsteady and swiftly passing away and vanishing. See above ch.6.on v 26.] mine eye shall not return to see the good [viz. Of this temporal life. To see the good, is to enjoy, or obtain, get the same, so below 9.25. Psa 128:5. Ecc 5:17. in the same sence one is said, to see the rest, Gen 49:15. to see the light, bel.33.28. to see the life, Joh.3.36. to see good days, 1 Pet.3.10, &c.]"}],"8":[{"catchword":null,"tekst":"The eye of him that seeth me (now) [viz. Here on earth. Oth. The eye of the sight, i.e. he that is sharp-sighted.] shall not see me: [viz. When I shall once be departed hence by death] thine eyes shall be upon me [viz. For to do me good, yet nevertheless I shall not be here beneath upon the earth, to enjoy thy benefits as well bodily as spiritually. This was the Saints desire, partly, for to serve God here yet, and to magnify his name; partly also, by the use and enjoyment ;of the Temporal blessings, to assure themselves the more of the love and favour of God, and the goods everlasting. See Ps.6.6. and 88.11,12,13. And 122.1,2. And 128.5.] but I shall be no (more) [viz. In this life. See ab.ch.3.on v.16.]"}],"9":[{"catchword":null,"tekst":"A cloud is consumed and passeth away: so he that goeth down into the grave [see the signification of the Hebrew word Sheol, Gen 37:35. in the annotation upon it,] shall not come (again) [viz. Into this Transitory world: for, that Job did firmly believe the resurrection from the dead, appeareth below chap.19.25,26,27.]"}],"10":[{"catchword":null,"tekst":"He shall no more return to his house; and his place shall know him no more, [his place, i.e. his friends, fellow Citizens, neighbours and acquaintance, dwelling in his own house, City and Country. Thus the word Place is taken for those that are in it, and so likewise below 8.18. & 20.9. Ps.37.10. in like manner as paths, and ways, are taken for those that walk, or travel in the same, ab.6.19.]"}],"11":[{"catchword":null,"tekst":"Neither shall I also withhold my mouth: I will speak in the distress of my spirit; I will complain [the meaning of these expressions is; seeing that the life of man in general is so full of vanity and wretchedness, and I also, besides that, do find my self particularly inthralled in this extraordinary affliction, being berest of all temporal welfare and comfort, I must at least wise ease and unburden my heavy mind by the tongue.] in bitterness of my soul [i.e. in great grief and against of heart. See 2 King 4.on v.27.]"}],"12":[{"catchword":null,"tekst":"Am I a Sea then, or (a) Whale, [of whose strength and power see below ch.41.] that thou settest a guard about me? [viz. By this great suffering which environeth me from all parts, and tormenteth my mind day and night: meaning thereby, that it seemed God sought thus to birdle him from doing harm to any; even as if he were some Sea, or Sea-monster, which by the cliffs and downs and depths, must be kept within their bounds that they may do no harm to men.]"}],"13":[{"catchword":null,"tekst":"When I say, [viz. By my self, i.e. when I think, See Gen.20.on v.11.] my bedstead shall comfort me; my couch shall take away (somewhat) of my complaint:"}],"14":[{"catchword":null,"tekst":"Then thou affrightest me with dreams: [viz. Terribles, such as God causeth to fall upon melancholy spirits, and heavy, dejected persons, either through the nature of their disease, corrupting the fancy of man; or, also through Satans means, who watching his opportunity, doth by the advantage of melancholy humours, which he findeth in man, cause strange visions to appear unto him in his sleep.] and through visions thou terrifies me."}],"15":[{"catchword":null,"tekst":"So that my soul chuseth strangling; [understand a violent and sudden death; namely by reason of this continual torment] death rather then my bones [i.e. then the sustentation of my bodily life; implying that he had rather die that longer be troubled with those rotten, stinking, and mattery running bones he had. And he maketh especially mention of his bones, to shew that his pain was entered into very inmost parts of his body. Bones being taken for the strength, the life, and inmost vigour of the body, Prov 14:30. et.17.12. Isa 38:13.]"}],"16":[{"catchword":null,"tekst":"I disdain them [my bones namely] I shall not live for ever; cease from me then, [viz. Thus to afflict and plague and trouble me] for my days are vanity [or like to a wind, as above v.7. the life of man is called vanity, not onely for being short, and fading on a sudden, below 15.on v.31. but also in regard that it being so full of trouble, turmoil and vexation, a man can not meet with that Summun Bonum, or turn good, that could make him perfectly happy. Compare above v.3. and the annotation.]"}],"17":[{"catchword":null,"tekst":"What is man that thou shouldest greatly esteem him? [i.e. that thou shouldest take notice of him, he being so wretched and vile, as I am now; and count him worthy, thus to trouble thy self about him? Compare this manner of speaking, above with the annot. On v.8.] and that thou shouldst set thy heart upon him?"}],"18":[{"catchword":null,"tekst":"And that thou doest visit him, [viz. With thy chastizings and punishments, See Gen.21.on v.1.] ever morning? [this he mentioneth, chiefly for to shew, 1. That God doth visit us, with special care and solicitousness. Comp.Lam 3:23. 2. That God doth not spare us, even when we are most, or hardest at labour. 3. That not onely the middle and end, but the very beginning also of our lives and labours, are subject to much trouble and suffering, Psa 88:16. etc 90.9.] that thou triest him [how God doth try his children, see Gen.22.on v.1.] every moment? [i.e. very frequently all a long at unawares, suddenly.]"}],"19":[{"catchword":null,"tekst":"How long doest thou not turn away from me? [viz. For to make an end at length of afflicting me in this manner?] (and) ceasest not from me, until I swallow in my spettle? [this is an usual phrase, implying a very short time, such as is the fetching ones breath: as if he said: forbear but a moment at least, to afflict one, that I may fetch breath once. Compare chap.9.18.]"}],"20":[{"catchword":null,"tekst":"If I have sinned [i.e. committed any sin as yet unknown to me, for which this suffering may have come upon me] What shall I do unto thee [viz. For to be reconciled with thee, that thou mayest be appeased again, and I enabled thereby to get out of this trouble] O thou keeper of men? [i.e. that doest so narrowly watch what men are doing; or that art the keeper of their lives also, though now thou seem ready to destroy mine.] why hast thou set me for a counter-course [or, countermark, or butt, or the white, against which thou shootest thine arrows. Comp. Below 16.12. The Hebrew word doth properly signify that, against which one runneth very violently, for to spoil, or break, or overthrow it.] that I must be a burden to my self? [viz. By all the suffering, or pains, which thou doest lay upon me in so fearful a manner, that it is an insupportable burden to me.]"}],"21":[{"catchword":null,"tekst":"And why doest thou not forgiving me my trespass, [His meaning is, if the pretence of my Friends be true, that I am plagued thus by reason of my sins (although my conscience do witness otherwise) why doest thou not forgive me that sin, that I may not be plagued longer thus? For I am now ready to die: so that seeking me here after a while, thou shalt not find me.] and doest not put away [or pass by, pass over, See 2 Sam.12.on v.13.] mine iniquity? For now I shall lye down in the dust, and thou shall seek me early; [Compare above v.8.and see the annotation there; the Hebrew word doth properly signify to seek in the morning; but because the things that are done in the morning, are commonly performed with more vigour, the phrase here is taken for all manner of accurate and diligently searching. See below 8.5, Psa 69:2. Pro 7:15.] but I shall not be. [see ab.ch.3.on v.16.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    `<select id="hfdkies">${hfdOpties}</select>` +

    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
