an het rondtrekken op de aarde, en van het doorwandelen ervan.","3":"En de HEERE zei tegen de satan: Hebt u *ook* acht geslagen op Mijn knecht Job? Want niemand is op de aarde zoals hij, een man, oprecht en vroom, godvrezend en wijkend van het kwaad; en hij houdt nog steeds vast aan zijn oprechtheid, hoewel u Mij tegen hem hebt opgehitst, om hem zonder reden te verslinden.","4":"Toen antwoordde de satan de HEERE en zei: Huid voor huid, en alles wat iemand heeft, zal hij geven voor zijn leven.","5":"Strek toch Uw hand uit, en tast zijn gebeente en zijn vlees aan; dan zal hij U beslist in Uw aangezicht vervloeken[1]!","6":"En de HEERE zei tegen de satan: Zie, hij is in uw hand, maar spaar zijn leven.","7":"Toen ging de satan weg van het aangezicht van de HEERE, en sloeg Job met kwaadaardige zweren, van zijn voetzool af tot zijn schedel toe.","8":"En hij nam zich een potscherf om zich daarmee te schrapen, en hij zat neer in het midden van de as.","9":"Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek[1] God en sterf.","10":"Maar hij zei tegen haar: U spreekt zoals een van de dwaze vrouwen spreekt; zouden wij dan het goede van God ontvangen, en het kwade niet ontvangen? In dit alles zondigde Job niet met zijn lippen.","11":"Toen de drie vrienden van Job al dit kwaad hoorden dat over hem gekomen was, kwamen zij, ieder uit zijn eigen plaats: Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet; en zij waren het samen eens geworden dat zij zouden komen om hem te beklagen en om hem te troosten.","12":"En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.","13":"Zo zaten zij met hem op de grond, zeven dagen en zeven nachten; en niemand sprak een woord tegen hem, want zij zagen dat de smart zeer groot was."},"SV":{"1":"Wederom was er een dag, als de kinderen Gods kwamen, om zich voor den HEERE te stellen, dat de satan ook in het midden van hen kwam, om zich voor den HEERE te stellen.","2":"Toen zeide de HEERE tot den satan: Van waar komt gij? En de satan antwoordde den HEERE, en zeide: Van om te trekken op de aarde, en van die te doorwandelen.","3":"En de HEERE zeide tot den satan: Hebt gij *ook* acht geslagen op Mijn knecht Job? Want niemand is op de aarde gelijk hij, een man, oprecht en vroom, godvrezende en wijkende van het kwaad; en hij houdt nog vast aan zijn oprechtigheid, hoewel gij Mij tegen hem opgehitst hebt, om hem te verslinden zonder oorzaak.","4":"Toen antwoordde de satan den HEERE, en zeide: Huid voor huid, en al wat iemand heeft, zal hij geven voor zijn leven.","5":"Doch strek nu Uw hand uit, en tast zijn gebeente en zijn vlees aan; zo hij U niet in Uw aangezicht zal zegenen!","6":"En de HEERE zeide tot den satan: Zie, hij zij in uw hand, doch verschoon zijn leven.","7":"Toen ging de satan uit van het aangezicht des HEEREN, en sloeg Job met boze zweren, van zijn voetzool af tot zijn schedel toe.","8":"En hij nam zich een potscherf, om zich daarmede te schrabben, en hij zat neder in het midden der as.","9":"Toen zeide zijn huisvrouw tot hem: Houdt gij nog vast aan uw oprechtigheid? Zegen God, en sterf.","10":"Maar hij zeide tot haar: Gij spreekt als een der zottinnen spreekt; ja, zouden wij het goede van God ontvangen, en het kwade niet ontvangen? In dit alles zondigde Job met zijn lippen niet.","11":"Als nu de drie vrienden van Job gehoord hadden al dit kwaad, dat over hem gekomen was, kwamen zij, ieder uit zijn plaats, Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet; en zij waren het eens geworden, dat zij kwamen om hem te beklagen, en om hem te vertroosten.","12":"En toen zij hun ogen van verre ophieven, kenden zij hem niet, en hieven hun stem op, en weenden; daartoe scheurden zij een ieder zijn mantel, en strooiden stof op hun hoofden naar den hemel.","13":"Alzo zaten zij met hem op de aarde, zeven dagen en zeven nachten; en niemand sprak tot hem een woord, want zij zagen, dat de smart zeer groot was."},"KJV":{"1":"Again there was a day when the sons of God came to present themselves before the LORD, and Satan came also among them to present himself before the LORD.","2":"And the LORD said unto Satan, From whence comest thou? And Satan answered the LORD, and said, From going to and fro in the earth, and from walking up and down","3":"And the LORD said unto Satan, Hast thou considered my servant Job, that *there is* none like him in the earth, a perfect and an upright man, one that feareth God, and escheweth evil? and still he holdeth fast his integrity, although thou movedst me against him, to destroy him without cause.","4":"And Satan answered the LORD, and said, Skin for skin, yea, all that a man hath will he give for his life.","5":"But put forth thine hand now, and touch his bone and his flesh, and he will curse thee to thy face.","6":"And the LORD said unto Satan, Behold, he *is* in thine hand; but save his life.","7":"So went Satan forth from the presence of the LORD, and smote Job with sore boils from the sole of his foot unto his crown.","8":"And he took him a potsherd to scrape himself withal; and he sat down among the ashes.","9":"Then said his wife unto him, Dost thou still retain thine integrity? curse God, and die.","10":"But he said unto her, Thou speakest as one of the foolish women speaketh. What? shall we receive good at the hand of God, and shall we not receive evil? In all this did not Job sin with his lips.","11":"Now when Job's three friends heard of all this evil that was come upon him, they came every one from his own place; Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite: for they had made an appointment together to come to mourn with him and to comfort","12":"And when they lifted up their eyes afar off, and knew him not, they lifted up their voice, and wept; and they rent every one his mantle, and sprinkled dust upon their heads toward heaven.","13":"So they sat down with him upon the ground seven days and seven nights, and none spake a word unto him: for they saw that *his* grief was very great."}},"tsk":{"1":[{"kopje":"weer","refs":["Job 1:6","Jes 6:1","Jes 6:2","Luk 1:19","Hebr 1:14"]}],"2":[{"kopje":"Vandaan","refs":["Gen 16:8"]},{"kopje":"Van het rondtrekken","refs":["Job 1:7","Joh 14:30","2 Kor 4:4","1 Petr 5:8"]}],"3":[{"kopje":"Hebt u","refs":["Job 1:1","Job 1:8","Job 9:20","Gen 6:9","Ps 37:37","Fil 3:12","1 Petr 5:10"]},{"kopje":"oprecht","refs":["Spr 11:8","Spr 13:6","Spr 14:2","Spr 15:8","Spr 16:17"]},{"kopje":"houdt vast","refs":["Job 1:21","Job 1:22","Job 13:15","Job 27:5","Job 27:6","Ps 26:1","Ps 41:13","Jak 1:12","1 Petr 1:7"]},{"kopje":"Mij hebt opgehitst","refs":["Job 1:11"]},{"kopje":"verslinden","refs":["2 Sam 20:20"]},{"kopje":"zonder reden","refs":["Job 9:17","Joh 9:3"]}],"4":[{"kopje":"alles wat","refs":["Est 7:3","Est 7:4","Jes 2:20","Jes 2:21","Jer 41:8","Matt 6:25","Matt 16:26","Hand 27:18","Hand 27:19","Fil 3:8-10"]}],"5":[{"kopje":"Strek uit","refs":["Job 1:11","Job 19:20","Job 19:21","1 Kron 21:17","Ps 32:3","Ps 32:4","Ps 38:3-8","Ps 39:11"]},{"kopje":"zal hij U zegenen","refs":["Job 2:9","Job 1:5","Job 1:11","Lev 24:15","Jes 8:21"]}],"6":[{"kopje":"Zie","refs":["Job 1:12"]},{"kopje":"spaar","refs":["Job 38:10","Job 38:11","Ps 65:8","Luk 8:29-33","Luk 22:31","Luk 22:32","1 Kor 10:13","Openb 2:10","Openb 20:1","Openb 20:2","Openb 20:7"]}],"7":[{"kopje":"ging weg","refs":["1 Kon 22:22"]},{"kopje":"kwaadaardige zweren","refs":["Job 30:17-19","Job 30:30","Ex 9:9-11","Deut 28:27","Deut 28:35","Openb 16:11"]},{"kopje":"van zijn voetzool","refs":["Jes 1:6","Jes 3:17"]}],"8":[{"kopje":"nam zich","refs":["Job 19:14-17","Ps 38:6","Ps 38:8","Luk 16:20","Luk 16:21"]},{"kopje":"hij zat","refs":["Job 42:6","2 Sam 13:19","Jes 61:3","Ezech 27:30","Jona 3:6","Matt 11:21"]}],"9":[{"kopje":"zijn vrouw","refs":["Gen 3:6","Gen 3:12","1 Kon 11:4"]},{"kopje":"Houdt u nog stee wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5785\">Skin</span> for <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> yea, all that a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> hath will he <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> for his life.","5":"<span class=\"wl wl-kjv\" data-code=\"H199\">But</span> put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> now, and <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> his <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> and his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H1288\">curse</span> thee to thy face.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7854\">Satan,</span> Behold, he is in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> but <span class=\"wl wl-kjv\" data-code=\"H8104\">save</span> his life.","7":"So <span class=\"wl wl-kjv\" data-code=\"H3318\">went</span> <span class=\"wl wl-kjv\" data-code=\"H7854\">Satan</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> with <span class=\"wl wl-kjv\" data-code=\"H7451\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H7822\">boils</span> from the <span class=\"wl wl-kjv\" data-code=\"H3709\">sole</span> of his <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> unto his crown.","8":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him a <span class=\"wl wl-kjv\" data-code=\"H2789\">potsherd</span> to <span class=\"wl wl-kjv\" data-code=\"H1623\">scrape</span> himself withal; and he sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the ashes.","9":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> unto him, Dost thou still <span class=\"wl wl-kjv\" data-code=\"H2388\">retain</span> thine <span class=\"wl wl-kjv\" data-code=\"H8538\">integrity?</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">curse</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and die.","10":"But he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Thou <span class=\"wl wl-kjv\" data-code=\"H1696\">speakest</span> as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the foolish <span class=\"wl wl-kjv\" data-code=\"H5036\">women</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaketh.</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">What?</span> shall we <span class=\"wl wl-kjv\" data-code=\"H6901\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> at the hand of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and shall we not <span class=\"wl wl-kjv\" data-code=\"H6901\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil?</span> In all this did not <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> with his lips.","11":"Now when <span class=\"wl wl-kjv\" data-code=\"H347\">Job's</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7453\">friends</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of all this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon him, they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> from his own <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> <span class=\"wl wl-kjv\" data-code=\"H464\">Eliphaz</span> the <span class=\"wl wl-kjv\" data-code=\"H8489\">Temanite,</span> and <span class=\"wl wl-kjv\" data-code=\"H1085\">Bildad</span> the <span class=\"wl wl-kjv\" data-code=\"H7747\">Shuhite,</span> and <span class=\"wl wl-kjv\" data-code=\"H6691\">Zophar</span> the <span class=\"wl wl-kjv\" data-code=\"H5284\">Naamathite:</span> for they had made an <span class=\"wl wl-kjv\" data-code=\"H3259\">appointment</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H5110\">mourn</span> with him and to comfort","12":"And when they lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> and <span class=\"wl wl-kjv\" data-code=\"H5234\">knew</span> him not, they lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept;</span> and they <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> his <span class=\"wl wl-kjv\" data-code=\"H4598\">mantle,</span> and <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkled</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> toward heaven.","13":"So they sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> with him upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">nights,</span> and none <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> unto him: for they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that his <span class=\"wl wl-kjv\" data-code=\"H3511\">grief</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> great."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"kinderen Gods","tekst":"Dat is, de heilige engelen Gods; zie boven, Job 1:6 ."},{"catchword":"kwamen,","tekst":"Zie boven op de voorgemelde plaats."},{"catchword":"satan","tekst":"Zie ook boven, Job 1:6 ."}],"2":[{"catchword":"om te trekken","tekst":"Zie boven, Job 1:7 ."}],"3":[{"catchword":"Hebt gij ook","tekst":"Zie boven, Job 1:8 ."},{"catchword":"oprecht en vroom,","tekst":"Zie de betekenis van al deze woorden, boven, Job 1:1 ."},{"catchword":"opgehitst hebt","tekst":"Dit is menselijker wijze gesproken van God, die de beweging der oorzaken, die buiten hem zijn, niet is onderworpen, want hem zijn al zijne werken van eeuwigheid af bekend, Act 15:18 , en Hij doet alle dingen naar den raad van zijnen wil; Eph 1:11 . Maar dit wordt zo gezegd om aan te wijzen&lt;i&gt;I.&lt;/i&gt; dat de Satan altijd genegen is om de kinderen Gods te beschadigen;&lt;i&gt;II.&lt;/i&gt; dat God hem gebruikt om hen te beproeven."},{"catchword":"hem","tekst":"Versta mede, zijn beesten en kinderen."},{"catchword":"verslinden","tekst":"Dat is, te verderven en als in te slokken, hetwelk was in dit werk het doel des Satans; gelijk het einde van Gods werk was zijn knecht te beproeven."},{"catchword":"zonder oorzaak","tekst":"Dit is, niet om zijn voorgaande zonden en boos leven. Want opdat wij dit verstaan zouden, zo geeft God van zijn vroomheid getuigenis in dit boek; Job 1:1 , Job 1:8 , en hier vs.3. Evenwel is hij niet vrij geweest van de overblijfselen der zonde, die in alle heiligen gevonden worden, ook naar zijn eigen bekentenis. Zie onder, Job 7:20-21 , en Job 9:2 , en Job 13:23 , Job 13:26 . Het Hebreeuwse woord hinnam is in denzelfden zin, alzo het hier overgezet is, genomen 1Sa 19:5 , en 1Sa 25:31 , en Psa 35:7 , enz."}],"4":[{"catchword":"Huid voor huid,","tekst":"Dat is, den mens is zijn eigen huid, of lichaam, waardiger dan de huis of het lichaam van een ander. Hierom, [wil de Satan zeggen] ofschoon Job zijn kinderen verloren heeft, zo gaat het hem evenwel niet ter harte zolang hij met zijn eigen huid of leven ontkomen mag."},{"catchword":"leven","tekst":"Hebreeuws, voor zijn ziel. Zie Gen 19:17 , of voor zichzelven; dat is voor zijn eigen persoon en welvaren. Zie Gen 12:5 ."}],"5":[{"catchword":"tast","tekst":"Dat is, beschadigd. Zie Gen 26:11 ."},{"catchword":"zegenen","tekst":"Dat is, vloeken. Zie boven, Job 1:5 ."},{"catchword":"*","tekst":"Zie boven, Job 1:11 ."}],"6":[{"catchword":"hand,","tekst":"Dat is, vermogen en geweld; zie Gen 16:6 ; te weten, om hem te kwellen en te beschadigen. Vergelijk boven, Job 1:12 ."},{"catchword":"verschoon","tekst":"Hebreeuws, bewaar, of wacht u van zijn leven."},{"catchword":"leven","tekst":"Hebreeuws, ziel; gelijk boven, vs.4. De zin is dat hij hem niet zou doden."}],"8":[{"catchword":"hij nam","tekst":"Namelijk, Job."},{"catchword":"potscherf,","tekst":"Hebreeuws, aarden vat. Dewijl zijn vingers zonder twijfel mede verzworen waren, dat hij zich daarmede niet kon schrabben, zo heeft hij zich met een potscherf moeten behelpen, om daarmede zijn zweren te wrijven en den knagenden etter uit dezelve weg te nemen. Waaruit te verstaan is, niet alleen de grootheid van Jobs gezweer; maar ook dat hij beroofd was van de hulp der mensen, die zich schroomden voor de ijselijkheid van zijn kwaad; zie onder, Job 19:13-15 , enz."},{"catchword":"zat neder","tekst":"Dit was bij de ouden een teken der droefenis, treurigheid, leedschap en vernedering des harten; onder, Job 42:6 ; Jon 3:6 ; Mat 11:21 ; Luk 10:13 ."}],"9":[{"catchword":"Zegen God, en sterf","tekst":"Zie boven, Job 1:5 . Of, zegen God, al is het dat gij sterft; dat is, dewijl gij zo genegen zijt om God in alles te zegenen, dat is te loven en te danken, gelijk gij nog onlangs tevoren gedaan hebt [ Job 1:21 ] , ga daarin voort en zie hoe Hij het u vergelden zal, namelijk, met een pijnlijken dood, dien gij niet ontgaan kunt. Zij bespot zijn vertrouwen op God."}],"10":[{"catchword":"lippen niet","tekst":"Dat is, met zijn woorden, of met zijn spreken, gelijk hij wel daarna niet geheel vrij van deze zonde is geweest. Het woord lip is aldus genomen onder, Job 11:2 , en Job 12:20 ; Pro 7:21 , en Pro 12:19 , en Pro 24:28 , enz. Vergelijk Gen 11:1 , en de aantekening."}],"11":[{"catchword":"vrienden van Job","tekst":"Men houdt dat deze drie vrienden van Job uit Arabië en Idumea geweest zijn, afkomstig van Abraham."},{"catchword":"zijne plaats,","tekst":"Dat is, uit hun landschappen."},{"catchword":"Themaniet,","tekst":"Zo genoemd, omdat hij was van de nakomelingen van Theman, den zoon van Elifaz, die de zoon was van Ezau, den zoon van Izak; Gen 36:10-11 . Deze woonde in woest Arabië."},{"catchword":"Suhiet,","tekst":"Een nakomeling van Suah, den zoon van Abraham uit Ketura; Gen 25:1-2 . Deze woonde ook in woest Arabië."},{"catchword":"Naämathiet;","tekst":"Het is onzeker of deze bijnaam zijn oorsprong heeft van enig voorvader, geslacht of woonplaats. Sommigen menen dat hij zou mogen voortgekomen zijn van Timna, den zoon van Ezau, van welken te zien is Gen 36:40 . Anderen menen dat hij geboren is in de stad Naema, van welke zie Jos 15:41 ."},{"catchword":"eens geworden,","tekst":"Vergelijk Amo 3:3 . Anders, tezamen vergaderd, of bijeengekomen."},{"catchword":"hem te beklagen,","tekst":"Anders, medelijden te hebben, of bewogen te worden over hem, of met hem bedroefd te zijn. Alzo onder, Job 42:11 ."}],"12":[{"catchword":"weenden;","tekst":"Hier en in vs.13 worden verhaald vijf tekenen van zeer grote droefheid, die deze vrienden van Job vertoonden , namelijk:&lt;i&gt;I.&lt;/i&gt; hun geween;&lt;i&gt;II.&lt;/i&gt; de verscheuring van hun kleed;&lt;i&gt;III.&lt;/i&gt; de strooiing van het stof op hun hoofden;&lt;i&gt;IV.&lt;/i&gt; het nederzitten op de aarde;&lt;i&gt;V.&lt;/i&gt; hun stilzwijgen. Zie van gelijke treurige gebaren, Gen 21:16 , en Gen 37:34 ; Jos 7:6 ; 2Sa 12:16-17 ; Est 4:1-2 ,; Isa 47:1 ; Lam 2:10 ; Eze 27:30 ."},{"catchword":"mantel,","tekst":"Zie boven, Job 1:20 ."},{"catchword":"naar den hemel","tekst":"Dat is, de aarde en het stof opwaarts werpende, hebben hun hoofden daarmede bestrooid."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Again there was a day when the children of God, [i.e. the holy Angels of God, see ab. ch. 1. v. 6.] came to present themselves before the LORD [see above in the aforesaid place] that Satan came likewise in the midst of them [see likewise above ch. 1. on v. 6.] to present himself before the LORD."}],"2":[{"catchword":null,"tekst":"Then said the LORD to Satan: from whence comest thou? and Satan answered the LORD, and said; from circuiting upon the earth, and from walking it throw [See ab. ch. 1. on v. 7.]"}],"3":[{"catchword":null,"tekst":"And the LORD said to Satan: Hast thou (also) taken heed unto my Servant Job? [ab. ch. 1. v. 8.] for none is like him upon the Earth, a man, upright and honest, fearing God and withdrawing from the evil [See the signification of these words ab. ch. 1. on v. 1.] and he holdeth fast yet to his uprightness; although thou have incensed me against him [this is spoken of God, after the manner of men, who is not subject to be moved by any causes without him, for all his works are known unto him from eternity, Act 15. 18. and he doth all things according to the counsel of his will, Ephes. 1. 11. But this expression is used; to show, 1. that Satan is always ready to hurt and annoy the children of God. 2. That God maketh use of him for to try the same.] to swallow [i.e. to ruin, and destroy, and devour all at once; which in this Affair was the end of Satan; but Gods end was onely the trial of his servant.] him [understand withal his cattle and children.] without cause [i.e. not for any former sins of his, or, wicked living: For, that we are to understand it thus, God himself giveth testimony of his integrity in this book, ch. 1. v. 1. and 8. and here v. 3. Nevertheless, he was not freed from the remainders of sin, (which are found in all Saints) even by his own confession, see bel. ch. 7. v. 20, 21. and ch. 9. 2. and 13. 23, 26. The Hebrew word hinnam, is likewise taken in the same sense, as here it is rendered, 1 Sam. 19. 5. and 25. 31. and Psalm 35. 7, and c.]"}],"4":[{"catchword":null,"tekst":"Then answered Satan to the LORD, and said : Skin for skin [i.e. men value their own skin and body, far above the skin and body of another, therefore (would Satan infer) though Job have lost his children, it doth not affect his heart yet, as long as he may keep his own skin whole, and save his life still] and whatsoever any one hath he will give for his life, [Heb. for his soul, see Gen. 19. on v. 17. or, for himself, i.e. for his own person and welfare, see Gen. 12. on v. 5.]"}],"5":[{"catchword":null,"tekst":"Yet stretch out thy hand now, and touch, [i.e. hurt, plague, see Gen. 26. on v. 11. ] his bores and his flesh; if he shall not bless thee in thy face [i.e. curse thee, see ab. ch. 1. on v. 5 as for the manner of the expression, see also ab. ch. 1. v. 11.]"}],"6":[{"catchword":null,"tekst":"And the LORD said to Satan; Behold, he be in thine hand [i.e. power and disposing, see Gen. 16. v. 6. viz. for to afflict, plague and torment him, comp. above ch. 1. v. 12.] yet spare [or, keep, preserve, or take heed, beware of] his life [Heb. soul, as ab. v. 4. the sense is, that he should not take away his life.]"}],"7":[{"catchword":null,"tekst":"Then Satan went forth from the face of the LORD, and smote Job with evil boils, from the sole of his foot unto his Crown."}],"8":[{"catchword":null,"tekst":"And he [viz. Job] took a pot sheard [Heb. an earthen Vessel. Because doubtless his fingers also were sore, that he was not able to rub and scratch himself with his nails, he was glad to make shift with a potsheard, and therewith to scrape over his sores, and to squeeze and take out the raging matter of the same; whereby we may understand not only the greatness and grievousness of Jobs disease; but likewise, that he was destitute of the help of others, who did abhor the loathsomeness of his condition, see below ch. 19. ver. 13, 14, 15, & c.] to scratch himself therewith: and he sat down in the midst of the ashes [this was a token antiently of excessive grief, sadness, sorrow and humiliation, bel. ch. 40. 6. Jon. 3. 6. Mat. 11. 21. Luke 10. 13.]"}],"9":[{"catchword":null,"tekst":"Then said his wife unto him; Holdest thou fast yet thy uprightness? bless God and die. [see ab. ch. 1. v. 5. or bless God and in all, that is, to give him praise and thanks for all; as thou didst but a little before (ch. 1. v. 21.) thou hadst best to hold on still, and see how well he will require thee; namely with such a tormenting death, as thou canst not escape. Thus she mocketh and scotteth at his trusting in God.]"}],"10":[{"catchword":null,"tekst":"But he said unto her, thou speakest, as one of the sottish (women) speaketh, yea, should we accept the good of God, and not accept the evil? in all this Job sinned not with his lips [i.e. with his words or speeches, as indeed afterwards, he was not altogether free or guiltless of this sin. The word Lip, is so taken, below ch. 11. 2. and 12. 20. Prov. 7. 21. and 12. 20. and 24. 28, and c. comp. Gen. 11. 2. and the annot.]"}],"11":[{"catchword":null,"tekst":"Now when the three friends of Job [It is thought that these three friends of Job were of Arabia and Idumea, descended from Abraham] had heard all this evil, that was come upon him, they came e // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');

    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
