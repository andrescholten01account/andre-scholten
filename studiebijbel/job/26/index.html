" data-l=\"L2\" data-code=\"H8064\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8064\">hemel</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8235\">versierd</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H8235\">Zijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3027\">hand</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3027\">heeft</span> de kronkelende <span class=\"wl\" data-l=\"L5\" data-code=\"H5175\">slang</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2342\">geschapen</span>.","14":"<span class=\"wl\" data-l=\"L1\" data-code=\"H2005\">Zie</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H428\">dit</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H428\">zijn</span> nog maar <span class=\"wl\" data-l=\"L3\" data-code=\"H7098\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7098\">uiterste</span> randen van <span class=\"wl\" data-l=\"L4\" data-code=\"H1870\">Zijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1870\">wegen</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H4100\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4100\">wat</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4100\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8102\">klein</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8102\">stukje</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8102\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1697\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1697\">zaak</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1697\">hebben</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H8085\">wij</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H8085\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H8085\">Hem</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H8085\">gehoord</span>? <span class=\"wl\" data-l=\"L9\" data-code=\"H4310\">Wie</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4310\">zou</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7482\">dan</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7482\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7482\">donder</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7482\">van</span> Zijn machtige daden kunnen begrijpen?"},"koppeling_kjv":{"1":"But <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and said,","2":"How hast thou <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> him that is without <span class=\"wl wl-kjv\" data-code=\"H3581\">power?</span> how <span class=\"wl wl-kjv\" data-code=\"H3467\">savest</span> thou the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> that hath <span class=\"wl wl-kjv\" data-code=\"H3808\">no</span> strength?","3":"How hast thou <span class=\"wl wl-kjv\" data-code=\"H3289\">counselled</span> him that hath <span class=\"wl wl-kjv\" data-code=\"H3808\">no</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom?</span> and how hast thou <span class=\"wl wl-kjv\" data-code=\"H7230\">plentifully</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">declared</span> the thing as it is?","4":"To whom hast thou <span class=\"wl wl-kjv\" data-code=\"H5046\">uttered</span> <span class=\"wl wl-kjv\" data-code=\"H4405\">words?</span> and whose <span class=\"wl wl-kjv\" data-code=\"H5397\">spirit</span> came","5":"<span class=\"wl wl-kjv\" data-code=\"H7496\">Dead</span> things are <span class=\"wl wl-kjv\" data-code=\"H2342\">formed</span> from under the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and the inhabitants","6":"<span class=\"wl wl-kjv\" data-code=\"H7585\">Hell</span> is <span class=\"wl wl-kjv\" data-code=\"H6174\">naked</span> before him, and <span class=\"wl wl-kjv\" data-code=\"H11\">destruction</span> hath no covering.","7":"He stretcheth <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> over the empty <span class=\"wl wl-kjv\" data-code=\"H8414\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H8518\">hangeth</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> upon nothing.","8":"He bindeth <span class=\"wl wl-kjv\" data-code=\"H6887\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> in his thick <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> is not rent","9":"He holdeth <span class=\"wl wl-kjv\" data-code=\"H270\">back</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> and <span class=\"wl wl-kjv\" data-code=\"H6576\">spreadeth</span> his cloud","10":"He hath <span class=\"wl wl-kjv\" data-code=\"H2328\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">waters</span> with <span class=\"wl wl-kjv\" data-code=\"H2706\">bounds,</span> until the <span class=\"wl wl-kjv\" data-code=\"H216\">day</span> and <span class=\"wl wl-kjv\" data-code=\"H2822\">night</span> come to an end.","11":"The <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H7322\">tremble</span> and are <span class=\"wl wl-kjv\" data-code=\"H8539\">astonished</span> at his reproof.","12":"He <span class=\"wl wl-kjv\" data-code=\"H7280\">divideth</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> with his <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> and by his <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> he <span class=\"wl wl-kjv\" data-code=\"H4272\">smiteth</span> through the proud.","13":"By his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> he hath <span class=\"wl wl-kjv\" data-code=\"H8235\">garnished</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens;</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> hath <span class=\"wl wl-kjv\" data-code=\"H2342\">formed</span> the <span class=\"wl wl-kjv\" data-code=\"H1281\">crooked</span> serpent.","14":"Lo, these are <span class=\"wl wl-kjv\" data-code=\"H7098\">parts</span> of his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways:</span> but how <span class=\"wl wl-kjv\" data-code=\"H8102\">little</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">portion</span> is <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of him? but the <span class=\"wl wl-kjv\" data-code=\"H7482\">thunder</span> of his <span class=\"wl wl-kjv\" data-code=\"H1369\">power</span> who can understand?"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"gij geholpen","tekst":"Namelijk, gij Bildad."},{"catchword":"dien,","tekst":"Dat is, mij. Alzo in het volgende."},{"catchword":"zonder kracht","tekst":"Te weten, niet alleen door de ongezondheid en smarten zijns lichaams, maar ook de verslagenheid zijns gemoeds."},{"catchword":"en","tekst":"Deze vragen loochenen sterkelijk. Hij wil zeggen dat Bildad hem niet geholpen noch behouden had; want inplaats van hem te vertroosten met Gods vriendelijke genade, had hij hem gezocht te verschrikken met Gods vreeslijke majesteit."}],"3":[{"catchword":"geraden,","tekst":"Te weten, opdat hij wijzer zij in het verstand, voorzichtiger in spreken, geduldiger in lijden, gestadiger in hopen."},{"catchword":"die geen wijsheid heeft,","tekst":"Hij spreekt spottenderwijze van zichzelven, omdat zijn vrienden hem voor een onverstandigen zwetser hielden; zie boven, Job 11:2-3 ."},{"catchword":"de zaak,","tekst":"Zie van de betekenis van het Hebreeuwse woord boven, Job 5:12 . Job veracht en bespot hier wat van Bildad was voortgebracht, niet ten aanzien van de leer zelve, maar van de toeëigening daarvan."},{"catchword":"ten volle","tekst":"Hebreeuws, in menigte."}],"4":[{"catchword":"die woorden","tekst":"Dat is, de voorgaande redenen gebruikt? Hij wil zeggen: Zijn mij die dingen niet zo wel bekend als u? Vergelijk boven, Job 12:3-4 , en Job 13:2 ."},{"catchword":"wiens geest","tekst":"Dat is, door wiens geest hebt gij dit gesproken? Het is niet een extra ordinaire ingeving van Gods Geest; want gij hebt niet dan algemene dingen voortgebracht, die een ieder bekend zijn. Het is dan van de drijving van uw eigen geest, die door zijn onverstand kwade toeëigeningen en besluiten maakt. Zie onder, Job 32:8 ."}],"5":[{"catchword":"De","tekst":"Nadat Job Bildads rede verworpen heeft, spreekt hij breder van de volmaakte eigenschappen en werken Gods, waarvan Bildad gehandeld had, om te tonen dat de dingen, van hem verhaald, hem wel bekend waren, en vervolgens dat zijn verhaal onnodig en ontijdig was geweest en niet wel passende op hun geschil."},{"catchword":"doden","tekst":"Versta, de gestorven mensen. Alzo is het Hebreeuwse woord refaim dikwijls in de Heilige Schrift genomen. Zie Psa 88:11 ; Pro 2:18 , en Pro 9:18 ; Isa 14:9 , en Isa 26:14 . Anderen verstaan de dode dingen, die in de aarde en wateren van God geformeerd worden, als goud, zilver, kostelijk gesteende, koper, staal, ijzer, enz. Sommigen verstaan de reuzen, gelijk het Hebreeuwse woord dezen ook betekent; Deu 2:20 , en Deu 3:13 ."},{"catchword":"geboren worden","tekst":"Dat is, wedergeboren, of weder levend worden door de opstanding, welke een wedergeboorte genaamd wordt; Mat 19:28 . Het Hebreeuwse woord is voor geboren worden genomen; Psa 51:7 ; Pro 8:24-25 ."},{"catchword":"van onder","tekst":"Dat is, uit de aarde, die het onderste element is."},{"catchword":"hunne inwoners","tekst":"Versta, der wateren; dat is, de dode lichamen, die in de zee en andere wateren liggen. Zie Rev 20:13 ; waarom sommigen het woord en hier nemen voor, dat is."}],"6":[{"catchword":"hel","tekst":"Versta, alle diepe en verborgen plaatsen, ja ook de hel, welke het gezicht der mensen niet geraken kan. Alzo is het woord scheol genomen, Psa 139:8 . Zie ook Gen 37:35 ."},{"catchword":"voor Hem,","tekst":"Dat is, voor God, die alles door zijn voorzienigheid doorziet en regeert."},{"catchword":"verderf","tekst":"Versta, de plaatsen, waarin alle dingen verdorven worden en verloren gaan, en daaronder de plaats der verdoemden. Vergelijk Pro 15:11 , en Pro 27:20 ."}],"7":[{"catchword":"Hij","tekst":"Namelijk, God."},{"catchword":"noorden uit","tekst":"Dat is, den hemel; die hier alzo van een deel genaamd wordt, omdat het land, waarin Job en zijn vrienden woonden, het noordelijke deel over zich gehad heeft, zijnde de hemel door de evenlijn in twee gelijke delen gedeeld, het noordelijke en het zuidelijke."},{"catchword":"het woeste;","tekst":"Versta, de gehele ruimte, die tussen den hemel en de aarde is."},{"catchword":"aan een niet","tekst":"Zodat de aarde geen ondersteunsel heeft dan Gods overgrote macht. Zie Psa 24:2 , en Psa 104:5 , en Psa 136:6 ."}],"8":[{"catchword":"Hij bindt","tekst":"God maakt de wolken uit de dampen der aarde opwaarts stijgende, en door zijn voorzienigheid in de lucht zo samenklonterende, dat zij schijnen in zakken gebonden te zijn. Vergelijk Gen 2:6 , en 2Sa 22:12 , en de aantekening."},{"catchword":"scheurt","tekst":"Dat is, ontsluit of berst niet, vallende geheel op de aarde, niettegenstaande dat zij bestaat uit water, hetwelk van nature nederwaarts loopt, maar druipt alleen hier en daar, als en naar het den Heere belieft."},{"catchword":"daaronder","tekst":"Dat is, in het onderste deel der wateren, die in de wolken als in een zak gesloten zijn."}],"9":[{"catchword":"het vlakke","tekst":"Dat is, het middelste deel van de lucht. Dit maakt God vast, opdat het Hem diene als een werkplaats, waaruit Hij ons zijn goederen mededeelt en die Hij tot sieraad met wolken bestrooit."},{"catchword":"troons","tekst":"Dat is, des hemels, of der lucht. Van welke drie hemelen wordt gewag gemaakt Gen 2:1 in de aantekening."}],"10":[{"catchword":"gezet perk","tekst":"Een gestelde grens in het rond, waarover de wateren der zee niet kunnen geraken om het droge te overstelpen en te bedekken. Zie de volgende Schriftuurplaatsen."},{"catchword":"tot aan","tekst":"Dat is, zolang als het licht en de duisternis op de aarde zullen wezen; of zolang als de wereld staan zal."}],"11":[{"catchword":"De pilaren","tekst":"Vergelijk 2Sa 22:8 ; Psa 18:8 . Versta door de pilaren des hemels de krachten deszelven, Luk 21:26 , welke zijn de natuur, eigenschappen en werkingen des hemels, die uit haar stel schijnen gebracht te zijn, niet alleen door ongewoonlijke bliksemen, donderslagen, winden, stormen, regens, enz., maar ook door vele tekenen in de zon, maan, sterren, kometen en vuren in den hemel, enz."},{"catchword":"ontzetten zich","tekst":"Hebreeuws, verwonderen zich."}],"12":[{"catchword":"klieft","tekst":"Als Hij onweder en stormen laat komen over de zee, die de baren en golven zo verheffen dat de zee schijnt te splijten en vol kloven te zijn; Psa 107:25-26 ."},{"catchword":"verheffing","tekst":"Dat is, haar onstuimige en hooglopende baren; Psa 104:7 , en Psa 107:29 . Hebreeuws, Rahab, hetwelk enigen in den tekst behouden, verstaande daarbij Egypte, zo genoemd om den hoogmoed en de hovaardigheid der Egyptenaren; Psa 89:11 ; Isa 51:9 ."}],"13":[{"catchword":"heeft Hij","tekst":"Anders, heeft de hemel schoonheid."},{"catchword":"de langwemelende","tekst":"Door deze kan men verstaan zekere grote slang, hetzij in de zee of op het land. Zij wordt hier en Isa 27:1 genaamd met een bijwoord, betekenende vluchtig, welvliedende, wegwemelende. Sommigen willen het verstaan van het teken des hemels, de slang genoemd."}],"14":[{"catchword":"dit zijn","tekst":"Deze dingen, die wij van Gods werken en eigenschappen verhaald hebben."},{"catchword":"uiterste einden","tekst":"Kleine uiterste deeltjes, en gelijk afsnijdselen der zeer grote en wijd uitgebreide lering, die daar is van de gewone werkingen zijner wonderlijke kracht en regering."},{"catchword":"klein stukje","tekst":"Dat is, hoe weinig is het dat wij weten en begrijpen van Gods werken, bij hetgeen dat er van is."},{"catchword":"den donder","tekst":"Dat is, zijn zeer grote en schrikkelijke macht."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered and said;"}],"2":[{"catchword":null,"tekst":"How hast thou helped, [thou, Bildad namely] him [i.e. me, and so in the sequel] that is with out power? [viz. Not only by reason of his diseases and bodily pains; but also in regard of the perplexity and trouble of his mind.] (and) saved the arm that is without strength? [These questions do strongly deny; as if he had said to Bildad; Thou hast not help me, nor saved me at all; for instead of comforting me with Gods loving kindness, thou hast endeavoured rather to affright me with his dreadful Majesty.]"}],"3":[{"catchword":null,"tekst":"How hast thou advised him that hath no wisdom, [viz. That he might be wiser in his understanding, more prudent in speaking, more patient in suffering, more settled in hoping. He speaketh contemptibly of himself, because his friends held him but for a silly advised babler. See above 11.2.3.] and made the matter known at full [Heb. In multitude] as it is? [of the signification of the Hebrew word, rendered matter, or cause here, see above 5.on v.12. Job doth contemn and explode here, what Bildad had propounded, not in regard of the doctrine it self, but because of the wrongful application thereof.]"}],"4":[{"catchword":null,"tekst":"Unto whom hast thou related those words? [viz. In the former chapter, as if he would have said, are not these things known to me as well as to thy self? Comp. Above 12.3,4. And 13.2.] and whose spirit is gone out from thee? [i.e. by whose spirit hast thou spoken this? It is no extraordinary inspiration of Gods spirit; for thou hast propounded nothing but common things, which are known to every one: and therefore it is by the instigation of thy own spirit, which through want of understanding maketh wrongful applications and conclusions. See bel.32.8]"}],"5":[{"catchword":null,"tekst":"The [after that Job had rejected Bildads interpellation; he enlargeth himself in the description of the perfection of Gods works and attributes, whereof Bildad had begun to speak to shew, that the things related by him, were sufficiently known to himself; and consequently that he might have spread his Labour, as unnecessary and unseasonable, and nothing to the matter of their debate.] dead [understand the dead men or persons. So the word rephaim is often taken in Scripture. See Psa 88:11. Prov 2:18. and 9.18. Isa 14:9. and 26.14. Others understand the dead, or inanimate things, which are formed and shaped by God within the earth and waters, as gold, silver, precious stones, copper, iron, steel, &c. Some understand the Giants, the Hebrew word signifying them also, Deut.2.20.and 3.13.] shall be born [i.e. regenerated, born again, or made alive again, through the Resurrection, which is likewise called a Regeneration, Mat 19:28. The Hebrew word is taken, for to be born, Psa 51:7. Pro.8.24,25.] from under the waters [i.e. out of the earth, which is the innermost or lowest element.] and their inhabitants, [of the waters namely, that is to say, the dead corps, or bodies, lying in the Sea, or other waters. See Revel.20.13. wherefore some take the particle and, for that is.]"}],"6":[{"catchword":null,"tekst":"Hell [Understand all manner of deep, hidden and secret places, and hell it self also, which the eye of man cannot reach unto: thus the word Sheol is taken, Psa 139:8. See likewise Genesis 37.on v.35.] is naked before him: [i.e. before God, whose providence penetrateth, discerneth and governeth all things. See Psa 139:8,11. Pro.15.11. Heb 4:13.] and there is no cover for destruction. [understand the places wherein all things are destroyed and perish, and among those the place of the demned also. Comp. Pro.15.11. and 17.20.]"}],"7":[{"catchword":null,"tekst":"He [God namely] spreadeth abroad the North, [i.e. the heaven, as a part for the whole, in regard that Job // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

    return label + refChips(nd.refs) + kids;

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
