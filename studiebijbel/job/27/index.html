d</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">God:</span> that which is with the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> will I not conceal.","12":"Behold, all ye yourselves have <span class=\"wl wl-kjv\" data-code=\"H2372\">seen</span> it; why then are ye thus <span class=\"wl wl-kjv\" data-code=\"H1892\">altogether</span> vain?","13":"This is the <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of a <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> with <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> of <span class=\"wl wl-kjv\" data-code=\"H6184\">oppressors,</span> which they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> of the Almighty.","14":"If his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> be <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied,</span> it is <span class=\"wl wl-kjv\" data-code=\"H3926\">for</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and his <span class=\"wl wl-kjv\" data-code=\"H6631\">offspring</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> with bread.","15":"Those that <span class=\"wl wl-kjv\" data-code=\"H8300\">remain</span> of him shall be <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in <span class=\"wl wl-kjv\" data-code=\"H4194\">death:</span> and his <span class=\"wl wl-kjv\" data-code=\"H490\">widows</span> shall not weep.","16":"Though he heap <span class=\"wl wl-kjv\" data-code=\"H6651\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> as the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> <span class=\"wl wl-kjv\" data-code=\"H4403\">raiment</span> as the clay;","17":"He may <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> it, but the <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> shall put it <span class=\"wl wl-kjv\" data-code=\"H3847\">on,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> shall <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the silver.","18":"He <span class=\"wl wl-kjv\" data-code=\"H1129\">buildeth</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> as a <span class=\"wl wl-kjv\" data-code=\"H6211\">moth,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H5521\">booth</span> that the <span class=\"wl wl-kjv\" data-code=\"H5341\">keeper</span> maketh.","19":"The <span class=\"wl wl-kjv\" data-code=\"H6223\">rich</span> man shall lie <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> but he shall not be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered:</span> he <span class=\"wl wl-kjv\" data-code=\"H6491\">openeth</span> his eyes,","20":"<span class=\"wl wl-kjv\" data-code=\"H1091\">Terrors</span> take <span class=\"wl wl-kjv\" data-code=\"H5381\">hold</span> on him as <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> a <span class=\"wl wl-kjv\" data-code=\"H5492\">tempest</span> stealeth him <span class=\"wl wl-kjv\" data-code=\"H1589\">away</span> in the night.","21":"The <span class=\"wl wl-kjv\" data-code=\"H6921\">east</span> wind carrieth him <span class=\"wl wl-kjv\" data-code=\"H5375\">away,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3212\">departeth:</span> and as a storm <span class=\"wl wl-kjv\" data-code=\"H8175\">hurleth</span> him out of his place.","22":"For God shall <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> upon him, and not <span class=\"wl wl-kjv\" data-code=\"H2550\">spare:</span> he would <span class=\"wl wl-kjv\" data-code=\"H1272\">fain</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">flee</span> out of his hand.","23":"Men shall <span class=\"wl wl-kjv\" data-code=\"H5606\">clap</span> their <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> at him, and shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> him out of his place."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ging voort","tekst":"Te weten, nadat hij een weinig gezwegen had, verwachtende antwoord van zijn vrienden."},{"catchword":"spreuk","tekst":"Vergelijk Num 23:7 , en 1Ki 4:32 , en de aantekening."}],"2":[{"catchword":"Die","tekst":"Dat is, die mijn goede zaak, die ik tegen mijn vrienden heb, schijnt opgeschort en uit de hand gelegd te hebben om geen kennis daarvan te nemen en die door zijn oordeel af te handelen."},{"catchword":"bitterheid","tekst":"Dat is, zeer scherpe droefheid aangebracht. Vergelijk Rth 1:20 , en 2Ki 4:27 , en de aantekening."}],"3":[{"catchword":"adem","tekst":"Versta, door den adem en het geblaas Gods in des mensen neus, het leven des mensen en de ziel, waardoor het lichaam leeft. Vergelijk Gen 2:7 , en 1Ki 17:17 met de aantekening, en Isa 2:22 ."},{"catchword":"geblaas Gods","tekst":"Zie de voorgaande aantekening."}],"4":[{"catchword":"zal uitspreken","tekst":"Voeg hierbij, dat mij God straffe, of wee mij, enz. Zie Gen 14:23 ."}],"5":[{"catchword":"Het zij verre","tekst":"Anders, het zij mij een onrein ding, indien ik ulieden rechtvaardig, totdat ik den geest geve."},{"catchword":"rechtvaardigen zou;","tekst":"Zie van de betekenis van dit woord Gen 44:16 ."},{"catchword":"totdat","tekst":"Dat is, zolang als ik leven zal; hetwelk naar de manier van spreken der Heilige Schrift zoveel is als nimmermeer; zie Gen 28:15 ."},{"catchword":"mijn oprechtigheid","tekst":"Dat is, niet nalaten tegen alle beschuldigingen te verdedigen."}],"6":[{"catchword":"gerechtigheid","tekst":"Te weten, van mijn onstrafbaar leven voor de mensen en mijn goede conscientie voor God, zoveel aangaat de zonden, waarmede ik bezwaard word."},{"catchword":"zal die","tekst":"Dat is, in geen gevaar laten komen, en over haar verdediging zorgeloos zijn. Alzo betekent het Hebreeuwse woord versmaden enige zaak door kleinachting in gevaar stellen en onbeschermd laten; Jdg 5:18 ; 2Sa 23:9 ."},{"catchword":"van mijn dagen","tekst":"Dat is, mijn leven lang. Of, vanwege mijn [vorige] dagen; dat is, uit oorzaak van mijn voorgaand leven, te weten, alsof ik een huichelaar of goddeloos mens geweest ware."}],"7":[{"catchword":"zij als","tekst":"Dat is, worde daarvoor gehouden; want het is goddeloosheid en verkeerdheid, den onschuldige te veroordelen; of: zo haat ik de goddeloosheid, dat ik mijn vijanden die toewens. Zie een gelijke manier van spreken 2Sa 18:32 . Of, zal zijn; dat is, zover vandaar is het, dat ik een booswicht ben, dat zij, die mij daarvoor ten onrechte houden, voor zulken bevonden zullen worden. Zie onder, Job 42:7 ."}],"8":[{"catchword":"huichelaars,","tekst":"Versta, gene. Het is een vraag, die sterkelijk loochent. Vergelijk Gen 18:17 . Job bewijst hiermede dat hij geen huichelaar was, omdat zijn verwachting gans goed en in God gegrondvest was. Zie boven, Job 13:15-16 , en Job 19:25-27 ."},{"catchword":"uittrekken?","tekst":"Of, ontbinden; te weten, uit zijn lichaam door den dood. Een bewijs van de onsterfelijkheid der ziel. Vergelijk Gen 35:18 , en de aantekening, 1Ki 19:4 ; Jon 4:3 ; Luk 12:20 ."}],"9":[{"catchword":"zijn geroep","tekst":"Te weten, des huichelaars en goddelozen, met welken ik geen gemeenschap heb, dewijl Hij mij verhoort, ik mij in hem vermaak en hem aanroep. Zie boven, Job 6:10 , en Job 12:4 , en Job 13:16 , en Job 19:25-26 ."}],"11":[{"catchword":"van de hand Gods;","tekst":"Dat is, wat aangaat de hand Gods. De Hebreeuwse letter beth wordt ook voor van genomen Exo 12:43-45 ; Psa 87:3 . Versta hier door de hand Gods zijn besluit en deszelfs uitvoering; alzo Act 4:28 ."}],"12":[{"catchword":"hebt het gezien;","tekst":"Dat is, door ervaring bevonden wat ik verhaald heb en nog verhalen zal van de regering, die God houdt omtrent de vromen en onvromen."},{"catchword":"ijdelheid","tekst":"Dat is, onverstandigheid, waardoor zij van het voorgemelde niet recht oordeelden noch spraken."},{"catchword":"verijdeld?","tekst":"Dat is, verdwaald en verdwaasd in uw bedenkingen en redenen."}],"13":[{"catchword":"is het deel","tekst":"Te weten, dat ik nu voordragen zal. Job stemt zijnen vrienden toe dat de bozen hier bij wijle mede gestraft worden, gelijk hij ook dat niet geloochend had, hebbende alleen geleerd dat zij meest in voorspoed leven en van algemene plagen vrij gaan."}],"14":[{"catchword":"zijn kinderen","tekst":"Te weten, van den boze."},{"catchword":"ten zwaarde;","tekst":"Dat is, om ellendiglijk door de hand der vijanden, of der overheid, of anderen een geweldigen dood te sterven."},{"catchword":"spruiten","tekst":"Dat is, kinderen en nakomelingen. Zie boven, Job 5:25 ."},{"catchword":"van brood","tekst":"Dat is, vergaan van honger. Van het tegendeel, hetwelk allermeest geschiedt, zie Psa 17:14 ."}],"15":[{"catchword":"overgeblevenen","tekst":"Die van het zwaard en den honger overig zijn."},{"catchword":"in den dood","tekst":"Dat is, zij zullen zo in het graf geraken, dat hun gedachtenis mede zal begraven worden, als onwaardig en stinkende bij de mensen. Vergelijk Psa 49:13 ."},{"catchword":"niet wenen","tekst":"Te weten, in derzelver begrafenis, en dat om de gedachtenis van hun grote boosheid; of, omdat zij niet statelijk begraven zouden worden."}],"18":[{"catchword":"Hij bouwt","tekst":"Hij vergelijkt den goddeloze bij een mot, die voor zich een zacht huisje maakt in kostelijk gewaad, waaruit zij haast verdreven wordt, om alzo zijn onzekeren en licht vergaanden voorspoed aan te wijzen. Vergelijk boven, Job 8:14 ."},{"catchword":"hoeder","tekst":"Of, als eenhut, [die] de hoeder maakt. Een andere gelijkenis, die tenzelfden einde dient, genomen van een hoeder, die gesteld is om enig gewas of beesten te wachten, die wel een hut tot zijn gemak lichtelijk opmaakt, maar daarna haastelijk verlaten moet, omdat zijn werk ophoudt of de hut vervalt."}],"19":[{"catchword":"neder,","tekst":"Te weten, om te slapen. Alzo wordt het woord nederliggen genomen Gen 19:4 ; zie de aantekening. Anders, de rijke zal nederliggen, dat is sterven, en niet vergaderd worden, te weten, tot zijne volken, dat is, niet begraven worden."},{"catchword":"weggenomen;","tekst":"Te weten, door den dood, dat is, hij sterft nog niet. Zie Psa 26:9 . Anders, als er niet weggenomen is; te weten, door de dieven of rovers."},{"catchword":"doet hij","tekst":"Dat is, wordt hij des nachts wakker, niet denkende op enige zwarigheid, zo komt hem in der haast en onvoorziens het verderf over, gelijk in het volgende verklaard wordt. Anders, als hij zijn ogen opent, zo is er niet; dat is, hij vindt zich in een nacht van al zijn goed beroofd."}],"20":[{"catchword":"als wateren","tekst":"Te weten, die met geweld ergens inbrekende, alles met zich wegrukken. Tegenheden en ellenden worden bij wateren vergeleken. Zie 2Sa 22:17 , en boven, Job 22:11 ."},{"catchword":"des nachts","tekst":"Dat is, het ongeluk zal hem onvoorziens en met geweld overvallen. De schrikkelijke oordelen Gods geschieden dikwijls des nachts; Exo 12:29 , en Exo 14:24 ; 2Ki 19:35 ; Isa 15:1 ; Dan 5:30 ; Mat 25:6 ."},{"catchword":"een wervelwind","tekst":"Zie van deze gelijkenis breder Job 9:17 , en Job 21:18 ."}],"21":[{"catchword":"oostenwind","tekst":"Hij vergelijkt bij dezen wind [die in die landen zeer fel, geweldig en schadelijk was] de gramschap Gods; zie Exo 10:13 ."},{"catchword":"uit zijn plaats","tekst":"Dat is, uit zijn aanzien, huis, rijkdom, gemak en waardigheid. Vergelijk boven, Job 8:18 ."}],"22":[{"catchword":"dit","tekst":"Te weten, de voorgemelde en derzelver gelijke straffen."},{"catchword":"hem werpen,","tekst":"Te weten, den goddeloze."},{"catchword":"snellijk vlieden","tekst":"Hebreeuws, vliedende vlieden; te weten, als hij zich zal gevoelen van God geplaagd te zijn."}],"23":[{"catchword":"Een ieder","tekst":"Te weten, die hem in zijn ongeluk zal zien en verstoten uit zijn plaats."},{"catchword":"handen klappen,","tekst":"Te weten, tot een teken dat men hem veracht en bespot. Alzo Lam 2:15 ; Eze 25:6 ; Zep 2:15 ."},{"catchword":"over hem","tekst":"Zie 1Ki 9:8 ."},{"catchword":"zijn plaats","tekst":"Te weten, desgenen die schuifelt, of des goddelozen, waarover geschuifeld wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Job proceeded [viz. After he made some stop, or had paused a little, expected what his friends would answer.] to take up his sentence [Comp. Num 23:7. and 1 Kings 4.32. and the annotation.] and said."}],"2":[{"catchword":null,"tekst":"(As true as) God liveth, that hath taken away my right; [i.e. that seemeth to put by, or laid away out of his hands the good cause which I have against mine enemies, as unwilling, or careless to take cognisance thereof, and to decide it by his Sentence.] and the Almighty, that hath enflicted bitterness on my soul: [i.e. brought a most bitter and grievous affliction upon it. Compare Ruth 1.20. and 2 Kings 4.27. and the annotation.]"}],"3":[{"catchword":null,"tekst":"As long as my breath shall be within me, and the blast of God in my nose [Understand by the breath and blast of God mans nose, the life and soul of man, whereby the body liveth. Compare Gen 2:7. and 1 Kings.17.17. with the annotation, and Isa 2:22.]"}],"4":[{"catchword":null,"tekst":"If my lips shall speak wrong, and if my tongue shall utter deceit. [understand, then God punish me, or doth thus to me, or wo unto me, &c. See Gen.14.on v.23.]"}],"5":[{"catchword":null,"tekst":"Far be it from me, that I justify you: [see of the signification of this verse, Gen.44.on v.16. Oth. Be it an unclean thing to me, if I do justify you, till I give (up) the ghost] until I shall have given (up) the Ghost [i.e. while I live, which after the manner of speaking in the Scriptures, is as much as to say, never. See Gen.28.on v.15.] will I not put away mine uprightness from me: [i.e. not give over to maintain it against all accusations and asperations.]"}],"6":[{"catchword":null,"tekst":"I shall lay fast hold on my righteousness, [viz. Of mine unblameable life before men, and my good conscience before God; in regard of those sins, wherewith I am charged.] and shall not let it go; my heart shall not disdain (the same): [i.e. not abandon it, to run any hazard; to grow careless in defence thereof. Thus the Hebrew word rendered disdain here, doth signify to expose a thing to danger, through slight regard, and to leave it unprotected. Judge 5.18. 2 Sam.13.9.] from my days [i.e. all my life, or because of my (former) days i.e. by reason of the former course of my life, viz. As if I had been an hypocrite or wicked wretch.]"}],"7":[{"catchword":null,"tekst":"Let mine enemy be as the wicked: [i.e. be esteemed and held so: for it is wickedness and perverseness to condemn the innocent. Or, I do so hate wickedness, that I wish it to mine Enemies. See the like kind of speaking, 2 Sam.18.32. Or shall be, i.e. it is so far from it, that I am such a wicked wretch, as they would make me, that those which now do count me such, shall be found such themselves. See below 42.7.] and he that riseth up against me, as the perverse."}],"8":[{"catchword":null,"tekst":"For what is the expectation of the hypocrite, when he shall have been greedy; [Understand none at all, it is a question which strongely denieth. Compare Gen.18.on v.17. Job demonstrates hereby that he was no hypocrite; for as much as his expectation was good altogether and grounded in God the chiefest good. See above 13.v.15,16. And 19.v.25,26,27.] When God shall, draw forth his soul? [or, untie, &c. Viz. From his body by death;] an argument for the immortality of the soul. Compare Gen 35:18. and the annot. 1 Kings 19.4. Joh 4:3. Luk 12:20.]"}],"9":[{"catchword":null,"tekst":"Shall God hear his cry, when distress cometh over him? [He speaketh of the hypocrite and wicked, with whom he had no communion; seeing God heard him, he comforted himself in God, and did continually call upon him. See above 6.10. and 12.4. and 13.14. and 19.25,26.]"}],"10":[{"catchword":null,"tekst":"Will he take delight in the Almighty? Will he call upon God at all times?"}],"11":[{"catchword":null,"tekst":"I will teach you of the hand of God: [i.e. concerning the hand of God, the Hebrew Letter Beth, is likewise taken for Vau, Exo 12:43,44,45. Psa. 87.3. Understand here, by the hand of God; his decree, and the execution thereof: So also, acts 4.28.] that which is with the Almighty, I will not conceal."}],"12":[{"catchword":null,"tekst":"Behold, ye all have seen it your selves: [i.e. sound it by experience, what I have, and shall relate of good and bad in this world.] And why are ye made vain thus, [i.e. erring and besotted in your conceits and arguings] through vanity? [i.e. want of understanding, whereby it came to pass, that they neither judged nor spake aright of the foresaid matters.]"}],"13":[{"catchword":null,"tekst":"This is the part of the wicked man with God; [viz. That which I am now about to hold forth: Job granteth to his friends, that the wicked are sometimes punished here, as he had not denied neither, having taught only, that they lived in prosperity for the most part, and were but seldom touched by the common plagues.] And the inheritance of the Tyrants, (which) they shall receive from the almighty."}],"14":[{"catchword":null,"tekst":"If his [viz. The wicked mans] children multiply, it is for the sword: [i.e. they shall die, by the hand of their enemies, or of the Magistrate, or some other violent death.] and his sproutings [i.e. his children and off-springs, posterity. See above chap.5.on v.25.] shall not be satisfied with bread. [i.e. they shall starve and famish. Of the contrary, which happeneth most. See Psalm v.14.]"}],"15":[{"catchword":null,"tekst":"His remained (ones) [i.e. those which are left over and not destroyed by sword or famine] shall be buried in death: [i.e. they shall be brought to the grave in such sort, that their remembrance shall be buried with them, ,"tekst":"Terrors shall seize on him like waters: [Which use to break in with great violence, and carry all away before them: Adversities and miseries are compared to waters and inundations. See 2 Sam.22.on v.17. and above 22.11.] a whirl-wind shall steal him away by night, [i.e. the mischief shall fall upon him unawares, and rush with violence in upon him. The terrible judgements of God, are often executed by night, Exo 12:29. and 14.24. 2 Kings 19.35. Isa 15:1. Dan.5.30. Mat 25:6. of the whirl-winds similitude. See Job 9.on v.17 and 21.on v.18.]"}],"21":[{"catchword":null,"tekst":"The east-wind shall carry him away, that he is gone: [unto this wind (which in those countries was exceeding fierce, violent and hurtful) Job compareth Gods wrath and fury here. See Exod.10.on v.13.] and shall storm him away out of his place, [i.e. out of his authority, house, wealth, ease and reputation. Compare above 8.on v.18.]"}],"22":[{"catchword":null,"tekst":"And (God) shall cast (this) [viz. The foresaid and such like punishments.] over him; [viz. The wicked] and not spare: he shall swiftly flee from his hand. [Heb. Fleeing flee, viz. When he shall find himself visited and plagued of God.]"}],"23":[{"catchword":null,"tekst":"(Everyone) viz: that shall see him in his adversity, and thrust out of his place.] shall clap over him with his hands; [viz. In token of contempt, mocking and derision. So Lam 2:15. Eze 25:6. Zeph.2.15.] and whistle over him [See 1 Kings 9.on v.8.] out of his place. [viz. Either his that jeereth: or, the wicked that is jeered.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
