,"4":"Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft,","5":"Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?","6":"Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;","7":"Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?","8":"Hij zal wegvluchten als een droom, zodat men hem niet vinden zal, en hij zal verjaagd worden als een visioen in de nacht.","9":"Het oog dat hem zag, zal hem niet meer zien; en zijn plaats zal hem niet meer aanschouwen.","10":"Zijn kinderen zullen proberen de armen te behagen; en zijn handen zullen zijn vermogen weer moeten teruggeven.","11":"Zijn beenderen zullen vol zijn van zijn *zonden* uit zijn jeugd; die zullen met hem in het stof neerliggen.","12":"Al is het kwaad zoet in zijn mond, al verbergt hij dat onder zijn tong,","13":"Al spaart hij het en laat het niet los, maar houdt het midden in zijn gehemelte binnen;","14":"Zijn voedsel zal in zijn ingewanden veranderd worden; gal van adders zal het in zijn binnenste zijn.","15":"Hij heeft rijkdom ingeslikt, maar zal het weer uitspugen; God zal het uit zijn buik verdrijven.","16":"Het gif van adders zal hij opzuigen; de tong van de slang zal hem doden.","17":"De stromen, rivieren, beken van honing en boter zal hij niet zien.","18":"Wat hij met moeite verworven heeft, zal hij teruggeven en niet inslikken; naar het vermogen van zijn winst, zo zal hij van vreugde niet opspringen.","19":"Omdat hij de armen onderdrukt en verlaten heeft, een huis geroofd heeft dat hij niet gebouwd had;","20":"Omdat hij geen rust in zijn buik gekend heeft, zal hij van wat hij begeerde niets behouden.","21":"Er zal niets overblijven om te eten; daarom zal hij niet uitzien naar zijn goed.","22":"Als zijn overvloed op zijn hoogtepunt is, zal het hem benauwd worden; alle hand van de ellendigen zal over hem komen.","23":"Laat er wat zijn om zijn buik te vullen; God zal over hem de hitte van Zijn toorn zenden, en het op hem laten regenen op zijn voedsel.","24":"Hij zal vluchten voor de ijzeren wapens, de stalen boog zal hem doorschieten.","25":"Men zal het zwaard uittrekken, het zal uit zijn lijf komen, en glinsterend uit zijn gal voortkomen; verschrikkingen zullen over hem zijn.","26":"Alle duisternis is verborgen in zijn schuilplaatsen; een vuur dat niet is aangewakkerd, zal hem verteren; wie in zijn tent overblijft, zal het slecht vergaan.","27":"De hemel zal zijn ongerechtigheid openbaren, en de aarde zal zich tegen hem opmaken.","28":"De inkomsten van zijn huis zullen weggevoerd worden; het zal allemaal wegvloeien op de dag van Zijn toorn.","29":"Dit is het deel van de goddeloze mens, van God, en het erfdeel dat God hem heeft toegewezen door Zijn woorden³."},"SV":{"1":"Toen antwoordde Zofar, de Naämathiet, en zeide:","2":"Daarom doen mijn gedachten mij antwoorden, en over zulks is mijn verhaasten in mij.","3":"Ik heb aangehoord een bestraffing, die mij schande aandoet; maar de geest zal uit mijn verstand voor mij antwoorden.","4":"Weet gij dit? Van altoos af, van dat *God* den mens op de wereld gezet heeft,","5":"Dat het gejuich de goddelozen van nabij geweest is, en de vreugde des huichelaars voor een ogenblik?","6":"Wanneer zijn hoogheid tot den hemel toe opklomme, en zijn hoofd tot aan de wolken raakte;","7":"Zal hij, gelijk zijn drek, in eeuwigheid vergaan; die hem gezien hadden, zullen zeggen: Waar is hij?","8":"Hij zal wegvlieden als een droom, dat men hem niet vinden zal, en hij zal verjaagd worden als een gezicht des nachts.","9":"Het oog, dat hem zag, zal het niet meer doen; en zijn plaats zal hem niet meer aanschouwen.","10":"Zijn kinderen zullen zoeken den armen te behagen; en zijn handen zullen zijn vermogen moeten weder uitkeren.","11":"Zijn beenderen zullen vol van zijn verborgene *zonden* zijn; van welke elkeen met hem op het stof nederliggen zal.","12":"Indien het kwaad in zijn mond zoet is, hij dat verbergt, onder zijn tong,","13":"Hij dat spaart, en hetzelve niet verlaat, maar dat in het midden van zijn gehemelte inhoudt;","14":"Zijn spijze zal in zijn ingewand veranderd worden; gal der adderen zal zij in het binnenste van hem zijn.","15":"Hij heeft goed ingeslokt, maar zal het uitspuwen; God zal het uit zijn buik uitdrijven.","16":"Het vergif der adderen zal hij zuigen; de tong der slang zal hem doden.","17":"De stromen, rivieren, beken van honig en boter zal hij niet zien.","18":"Den arbeid zal hij wedergeven en niet inslokken; naar het vermogen zijner verandering, zo zal hij van vreugde niet opspringen.","19":"Omdat hij onderdrukt heeft, de armen verlaten heeft, een huis geroofd heeft, dat hij niet opgebouwd had;","20":"Omdat hij geen rust in zijn buik gekend heeft, zo zal hij van zijn gewenst goed niet uitbehouden.","21":"Er zal niets overig zijn, dat hij ete; daarom zal hij niet wachten naar zijn goed.","22":"Als zijn genoegzaamheid zal vol zijn , zal hem bang zijn; alle hand des ellendigen zal over hem komen.","23":"Er zij *wat* om zijn buik te vullen; *God* zal over hem de hitte Zijns toorns zenden, en over hem regenen op zijn spijze.","24":"Hij zij gevloden van de ijzeren wapenen, de stalen boog zal hem doorschieten.","25":"Men zal *het* *zwaard* uittrekken, het zal uit het lijf uitgaan, en glinsterende uit zijn gal voortkomen; verschrikkingen zullen over hem zijn.","26":"Alle duisternis zal verborgen zijn in zijn schuilplaatsen; een vuur, dat niet opgeblazen is, zal hem verteren; den overigen in zijn tent zal het kwalijk gaan.","27":"De hemel zal zijn ongerechtigheid openbaren, en de aarde zal zich tegen hem opmaken.","28":"De inkomste van zijn huis zal weggevoerd worden; het zal al henenvloeien in den dag Zijns toorns.","29":"Dit is het deel des goddelozen mensen van God, en de erve zijner redenen van God."},"KJV":{"1":"Then answered Zophar the Naamathite, and said,","2":"Therefore do my thoughts cause me to answer, and for *this* I make haste.","3":"I have heard the check of my reproach, and the spirit of my understanding causeth me to answer.","4":"Knowest thou *not* this of old, since man was placed upon earth,","5":"That the triumphing of the wicked *is* short, and the joy of the hypocrite *but* for a moment?","6":"Though his excellency mount up to the heavens, and his head reach unto the clouds;","7":"*Yet* he shall perish for ever like his own dung: they which have seen him shall say, Where","8":"He shall fly away as a dream, and shall not be found: yea, he shall be chased away as a vision of the night.","9":"The eye also *which* saw him shall *see him* no more; neither shall his place any more behold","10":"His children shall seek to please the poor, and his hands shall restore their goods.","11":"His bones are full *of the sin* of his youth, which shall lie down with him in the dust.","12":"Though wickedness be sweet in his mouth, *though* he hide it under his tongue;","13":"*Though* he spare it, and forsake it not; but keep it still within his mouth:","14":"*Yet* his meat in his bowels is turned, *it is* the gall of asps within","15":"He hath swallowed down riches, and he shall vomit them up again: God shall cast them out of his belly.","16":"He shall suck the poison of asps: the viper's tongue shall slay","17":"He shall not see the rivers, the floods, the brooks of honey and butter.","18":"That which he laboured for shall he restore, and shall not swallow *it* down: according to *his* substance *shall* the restitution *be*, and he shall not rejoice","19":"Because he hath oppressed *and* hath forsaken the poor; *because* he hath violently taken away an house which he builded","20":"Surely he shall not feel quietness in his belly, he shall not save of that which he desired.","21":"There shall none of his meat be left; therefore shall no man look for his goods.","22":"In the fulness of his sufficiency he shall be in straits: every hand of the wicked shall come","23":"*When* he is about to fill his belly, *God* shall cast the fury of his wrath upon him, and shall rain *it* upon him while he is eating.","24":"He shall flee from the iron weapon, *and* the bow of steel shall strike him through.","25":"It is drawn, and cometh out of the body; yea, the glittering sword cometh out of his gall: terrors","26":"All darkness *shall be* hid in his secret places: a fire not blown shall consume him; it shall go ill with him that is left in his tabernacle.","27":"The heaven shall reveal his iniquity; and the earth shall rise up","28":"The increase of his house shall depart, *and his goods* shall flow away in the day of his wrath.","29":"This *is* the portion of a wicked man from God, and the heritage appointed unto him by God."}},"tsk":{"1":[{"kopje":"Zofar","refs":["Job 2:11","Job 11:1","Job 42:9"]}],"2":[{"kopje":"mijn gedachten","refs":["Job 20:3","Job 4:2","Job 13:19","Job 32:13-20","Ps 39:3","Ps 39:4","Jer 20:9","Rom 10:2"]},{"kopje":"en daarom","refs":["Ps 31:23","Ps 116:11","Spr 14:29","Spr 29:20","Pred 7:9","Mark 6:25","Jak 1:19"]}],"3":[{"kopje":"een bestraffing","refs":["Job 19:29"]},{"kopje":"de geest","refs":["Job 20:2","Job 27:11","Job 33:3","Ps 49:4","Ps 78:2-5"]}],"4":[{"kopje":"Weet u dit niet","refs":["Job 8:8","Job 8:9","Job 15:10","Job 32:7"]},{"kopje":"de mens","refs":["Gen 1:28","Gen 9:1-3","Ps 115:16"]}],"5":[{"kopje":"het gejuich","refs":["Job 5:3","Job 15:29-34","Job 18:5","Job 18:6","Job 27:13-23","Ex 15:9","Ex 15:10","Richt 16:21-30","Est 5:11","Est 5:12","Est 7:10","Ps 37:35","Ps 37:36","Ps 73:18-20","Hand 12:22","Hand 12:23"]},{"kopje":"de vreugde","refs":["Job 8:19","Job 27:8","Matt 7:21","Matt 13:20","Matt 13:21","Gal 6:4","Jak 4:16"]}],"6":[{"kopje":"zijn hoogheid","refs":["Gen 11:4","Jes 14:13","Jes 14:14","Dan 4:11","Dan 4:22","Amos 9:2","Obadja 1:3","Obadja 1:4","Matt 11:23"]}],"7":[{"kopje":"vergaan","refs":["1 Kon 14:10","2 Kon 9:37","Ps 83:11","Jer 8:2"]},{"kopje":"zullen zeggen","refs":["Job 14:10"]}],"8":[{"kopje ore</span> their goods.","11":"His <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of the sin of his <span class=\"wl wl-kjv\" data-code=\"H5934\">youth,</span> which shall lie <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> with him in the dust.","12":"Though <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> be <span class=\"wl wl-kjv\" data-code=\"H4985\">sweet</span> in his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> though he <span class=\"wl wl-kjv\" data-code=\"H3582\">hide</span> it under his tongue;","13":"Though he <span class=\"wl wl-kjv\" data-code=\"H2550\">spare</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> it not; but keep it <span class=\"wl wl-kjv\" data-code=\"H4513\">still</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> his mouth:","14":"Yet his <span class=\"wl wl-kjv\" data-code=\"H3899\">meat</span> in his <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> is <span class=\"wl wl-kjv\" data-code=\"H2015\">turned,</span> it is the <span class=\"wl wl-kjv\" data-code=\"H4846\">gall</span> of <span class=\"wl wl-kjv\" data-code=\"H6620\">asps</span> within","15":"He hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">down</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">riches,</span> and he shall vomit them up <span class=\"wl wl-kjv\" data-code=\"H6958\">again:</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> shall cast them <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> of his belly.","16":"He shall <span class=\"wl wl-kjv\" data-code=\"H3243\">suck</span> the <span class=\"wl wl-kjv\" data-code=\"H7219\">poison</span> of <span class=\"wl wl-kjv\" data-code=\"H6620\">asps:</span> the <span class=\"wl wl-kjv\" data-code=\"H660\">viper's</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> shall slay","17":"He shall not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H6390\">rivers,</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">floods,</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brooks</span> of <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> and butter.","18":"That which he <span class=\"wl wl-kjv\" data-code=\"H3022\">laboured</span> for shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">restore,</span> and shall not swallow it <span class=\"wl wl-kjv\" data-code=\"H1104\">down:</span> according to his <span class=\"wl wl-kjv\" data-code=\"H2428\">substance</span> shall the <span class=\"wl wl-kjv\" data-code=\"H8545\">restitution</span> be, and he shall not rejoice","19":"Because he hath <span class=\"wl wl-kjv\" data-code=\"H7533\">oppressed</span> and hath <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor;</span> because he hath violently taken <span class=\"wl wl-kjv\" data-code=\"H1497\">away</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which he builded","20":"Surely he shall not <span class=\"wl wl-kjv\" data-code=\"H3045\">feel</span> <span class=\"wl wl-kjv\" data-code=\"H7961\">quietness</span> in his <span class=\"wl wl-kjv\" data-code=\"H990\">belly,</span> he shall not <span class=\"wl wl-kjv\" data-code=\"H4422\">save</span> of that which he desired.","21":"There shall none of his <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> be <span class=\"wl wl-kjv\" data-code=\"H8300\">left;</span> therefore shall no man <span class=\"wl wl-kjv\" data-code=\"H2342\">look</span> for his goods.","22":"In the <span class=\"wl wl-kjv\" data-code=\"H4390\">fulness</span> of his <span class=\"wl wl-kjv\" data-code=\"H5607\">sufficiency</span> he shall be in <span class=\"wl wl-kjv\" data-code=\"H3334\">straits:</span> every <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6001\">wicked</span> shall come","23":"When he is about to <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> his <span class=\"wl wl-kjv\" data-code=\"H990\">belly,</span> God shall <span class=\"wl wl-kjv\" data-code=\"H7971\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H2740\">fury</span> of his <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> upon him, and shall <span class=\"wl wl-kjv\" data-code=\"H4305\">rain</span> it upon him while he is eating.","24":"He shall <span class=\"wl wl-kjv\" data-code=\"H1272\">flee</span> from the <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H5402\">weapon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> of <span class=\"wl wl-kjv\" data-code=\"H5154\">steel</span> shall strike him through.","25":"It is <span class=\"wl wl-kjv\" data-code=\"H8025\">drawn,</span> and cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H1465\">body;</span> yea, the glittering <span class=\"wl wl-kjv\" data-code=\"H1300\">sword</span> cometh <span class=\"wl wl-kjv\" data-code=\"H1980\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H4846\">gall:</span> terrors","26":"All <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2934\">hid</span> in his secret <span class=\"wl wl-kjv\" data-code=\"H6845\">places:</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> not <span class=\"wl wl-kjv\" data-code=\"H5301\">blown</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">consume</span> him; it shall go <span class=\"wl wl-kjv\" data-code=\"H3415\">ill</span> with him that is <span class=\"wl wl-kjv\" data-code=\"H8300\">left</span> in his tabernacle.","27":"The <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> shall <span class=\"wl wl-kjv\" data-code=\"H1540\">reveal</span> his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity;</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall rise up","28":"The <span class=\"wl wl-kjv\" data-code=\"H2981\">increase</span> of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall <span class=\"wl wl-kjv\" data-code=\"H1540\">depart,</span> and his goods shall flow <span class=\"wl wl-kjv\" data-code=\"H5064\">away</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his wrath.","29":"This is the <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of a <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> from <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> <span class=\"wl wl-kjv\" data-code=\"H561\">appointed</span> unto him by God."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Daarom","tekst":"Dat is, om hetgeen Job recht tevoren gesproken had, boven, Job 19:29 ; dreigende zijn vrienden met Gods straf, uit oorzaak van hun verkeerd oordeel en kwaadspreken."},{"catchword":"gedachten","tekst":"Zie van dit woord boven, Job 4:13 ."},{"catchword":"antwoorden,","tekst":"Anders, wederkeren; te weten om Job te antwoorden; want dit had hij tevoren nog eens gedaan, boven, Job 11 ."},{"catchword":"in mij","tekst":"Anders, om mijnentwil; te weten om mijn eer te verdedigen."}],"3":[{"catchword":"die mij","tekst":"Hebreeuws, een bestraffing, of tucht mijner schande; dat is, die met mijn schaamte en schande verenigd is, overmits Job ons daarin bestraft van onwetendheid en onbeleefdheid; alzo mijn schande of, schaamte, voor hetgeen mij schande aandoet of beschaamd maakt; 2Sa 13:13 ; boven Job 19:5 ."},{"catchword":"geest","tekst":"Versta, den Heiligen Geest, van welken de rechte wetenschap en uitspraak voortkomt; Num 11:29 ; 1Co 12:11 . Of versta de ziel des mensen, die niet alleen met redelijk verstand begaafd is door de schepping, maar ook met bovennatuurlijke wetenschap verlicht wordt door de wedergeboorte."},{"catchword":"uit mijn verstand","tekst":"Dat is, uit welgestelde en gematigde zinnen, en niet uit toornig gemoed en kwade driften. Of, boven mijn verstand."}],"4":[{"catchword":"God","tekst":"Vergelijk boven, Job 3:20 . Alzo onder, vs.23, waar het woord God ook ingevoegd is."}],"5":[{"catchword":"gejuich","tekst":"Of, het vreugdegeschrei; dat is, de blijdschap en vreugde, voortkomende uit den tijdelijken voorspoed."},{"catchword":"van nabij","tekst":"Dat is, onlangs begonnen. Alzo worden de nieuwe goden genoemd goden van nabij gekomen, Deu 32:17 ; dat is onlangs opgekomen. Vergelijk boven, Job 17:12 ."}],"6":[{"catchword":"tot den hemel","tekst":"Dat is, zeer uitstak; zie Gen 11:4 ."}],"7":[{"catchword":"zijn drek,","tekst":"Vergelijk 1Ki 14:10 ."}],"8":[{"catchword":"als een droom,","tekst":"Dat is, zeer haastelijk en schielijk; want gelijk de gedachtenis van den droom zelf zeer lichtelijk verdwijnt, alzo vindt men ook gemeenlijk niet, wanneer men wakker wordt, hetgeen men gedroomd heeft; Isa 29:7-8 ."},{"catchword":"gezicht","tekst":"Te weten, dat den mens in zijn droom vertoond wordt."}],"9":[{"catchword":"zal het niet","tekst":"Hebreeuws, zal niet toedoen; dat is, zal hem niet meer zien. Vergelijk Gen 8:10 ."},{"catchword":"zijn plaats","tekst":"Dat is, hij zal in zijn plaats niet meer gezien of gevonden worden. Zie boven, Job 7:10 ."}],"10":[{"catchword":"te behagen;","tekst":"Te weten, omdat zij nog armer zouden worden dan de gemene armen, of omdat zij vrezen zouden door de armen, die van hun ouders geweld geleden hadden, voor het gericht betrokken te worden."},{"catchword":"zijn vermogen","tekst":"Dat is, zijn goed, dat hij met geweld den armen onttrokken heeft."}],"11":[{"catchword":"zijn verborgene","tekst":"Vergelijk Psa 90:8 , en de aantekening. Sommigen verstaan het van de zonden der jeugd, verstaande de zonden in den tijd zijner jonkheid begaan, mitsgaders de plagen en de ziekten, die de zonden der jonkheid plegen na te volgen als rechtvaardige oordelen Gods."},{"catchword":"elkeen","tekst":"Te weten, der beenderen, vol van de plagen zijner zonden, welke hem alle tot den dood toe bijblijven zullen. Anders, elkeen; te weten, der heimelijke zonden zijner jonkheid. De zin komt op een uit."}],"12":[{"catchword":"kwaad","tekst":"Te weten, der zonde en boosheid. Alzo Gen 6:5 ; 1Sa 17:28 ; Psa 28:4 , enz."},{"catchword":"zijn mond","tekst":"Dat is, in zijn oordeel en beweging. Alzo is het woord mond in het tegendeel genomen, Psa 119:103 ."},{"catchword":"zoet is,","tekst":"Dat is, aangenaam en vermakelijk, als een lieflijke spijs in den mond; want gelijk deze, wat in den mond gehouden zijnde, den mens somtijds wel voor een wijle vermaakt, maar daarna zeer bitter opkomt of in het lijf wederom veroorzaakt, alzo zal de zonde voor een tijdlang den mens wel wat genoegen geven, maar de straf, die daarop volgt, is met grote smart verenigd. Vergelijk Pro 5:3-4 ."},{"catchword":"verbergt,","tekst":"Te weten, om den smaak, dat is het vermaak der zonde te langer te behouden. Vergelijk vs.13."}],"13":[{"catchword":"dat spaart,","tekst":"Te weten, dat kwaad der zonde, hetwelk hier, gelijk tevoren, bij een spijs vergeleken wordt."}],"14":[{"catchword":"spijze","tekst":"Hebreeuws, zijn brood. Hij blijft in de voorgaande gelijkenis."},{"catchword":"der adderen","tekst":"Welker vergif zeer haastelijk doodt."},{"catchword":"in het binnenste","tekst":"Dat is, in zijn hart of ziel. Alzo 1Ki 3:28 ; Psa 49:12 , en Psa 51:12 , en Psa 55:5 , en Psa 62:5 , en Psa 94:19 ; Jer 9:8 , en Jer 31:33 ."}],"15":[{"catchword":"ingeslokt,","tekst":"Dat is, met grote gretigheid, gierigheid en onverzadelijke begeerte vergaderd. Hij oordeelt dat Job zijn goed kwalijk gekregen had."},{"catchword":"zal het uitspuwen;","tekst":"Dat is, zijn zonden, ongerechtigheden en geroofde middelen zullen hem zo bekomen als een, die zijn spijs pijnlijk uitwalgt, of als het sterkste vergif, dat iemand ingedronken heeft."}],"17":[{"catchword":"De stromen,","tekst":"Versta hiermede een groten en rijken overvloed van allerlei goederen. Alzo Psa 46:5 ; Isa 41:18 ; Joh 7:38 ."},{"catchword":"van honig","tekst":"Door deze dingen en andere worden in de Heilige Schrift te kennen gegeven zeer uitnemende zegeningen, dit tijdelijk leven rakende. Zie Exo 3:8 ; 2Ki 18:32 ; onder, Job 29:6 , en de aantekening."}],"18":[{"catchword":"arbeid","tekst":"Dat is, anderer lieden goed, dat zij door hun arbeid gewonnen hadden. Alzo Deu 28:33 ; Job 39:14 ; Psa 78:46 , en Psa 109:11 ."},{"catchword":"wedergeven","tekst":"Te weten aan degenen, die hij onrecht gedaan en het hunne geroofd had, zijnde tot deze wedergeving door de overheid gedwongen."},{"catchword":"inslokken;","tekst":"Dat is, niet verdoen, noch genieten. Dit strijdt niet tegen het inslokken, waarvan gesproken is vs.15, want dat is te verstaan van het onrechtvaardig verkrijgen en het bezitten voor een tijd; maar dit van het gedurig gebruik."},{"catchword":"naar het vermogen","tekst":"Te weten, naar zijn vermogen; dat is, naardat hij rijk en machtig geweest is, zal hij arm en katijvig worden, hetwelk genaamd wordt zijn verandering. Of, naar de mate, grootheid en veelheid van het goed, dat hij gestolen of geroofd heeft, zal zijn wedergeving moeten zijn, en deze wordt zijn verandering genaamd, omdat hij daardoor arm wordt die rijk was."}],"19":[{"catchword":"dat hij niet","tekst":"Anders, en hij heeft het niet gebouwd; dat is, hij heeft de huizen wel geroofd, maar heeft den armen geen huizen gebouwd."}],"20":[{"catchword":"Omdat","tekst":"Dat is, omdat hij een onverzadelijken buik gehad heeft. Zie vs.15."},{"catchword":"in zijn buik","tekst":"Dat is, in zijn hart of binnenste. Zie boven, Job 15:2 . Of, in zijn persoon, zijnde een deel voor het geheel genomen."},{"catchword":"gewenst goed","tekst":"Hebreeuws, wens, of begeerte; dat is, gewenste of begeerlijke dingen."}],"21":[{"catchword":"hij niet wachten","tekst":"Te weten, overmits hij door zijn nood zo ten enenmale zal vallen dat hij geen uitkomst zien zal om iets beters te verwachten."}],"22":[{"catchword":"Als zijn","tekst":"Dat is, als hij goed en rijkdom genoeg zal hebben om gelukkiglijk zijn leven door te brengen."},{"catchword":"alle hand","tekst":"Dat is, alle armen, die van hem beroofd zijn en beroofd gemaakt, zullen het hunne weder zoeken te krijgen."}],"23":[{"catchword":"zij wat","tekst":"Dat is, genomen, dat er enige voorraad der spijs en drank zij om hem te verzadigen."},{"catchword":"regenen","tekst":"Te weten, zijn plagen en rechtvaardige straffen. Vergelijk Psa 11:6 ."},{"catchword":"op zijn spijze","tekst":"Te weten, dat zij hem niet bekome. Anders, als hij eer. Vergelijk Num 11:33 ."}],"24":[{"catchword":"Hij zij gevloden","tekst":"Dat is, gesteld dat hij door de vlucht een gevaar ontkomen is, een ander zal hem treffen. Ditzelfde wordt met andere manier van spreken ook uitgedrukt Isa 24:18 ; Jer 48:44 , en Amo 5:19 ."},{"catchword":"doorschieten","tekst":"Hebreeuws eigenlijk, doorgaan."}],"25":[{"catchword":"zwaard","tekst":"Het woord zwaard is begrepen in het woord schalaph, uittrekken, hetwelk meest van het zwaard gebruikt wordt. Zie Num 22:23 , Num 22:31 ; Jdg 8:20 , en Jdg 9:54 , en Jdg 20:2 , Jdg 20:25 ; 1Sa 31:4 . Anders, Hij [te weten, God] zal uittrekken, enz. Zie boven, vs.4, 23; onder, Job 21:17 ; Deu 32:41-42 ."},{"catchword":"glinsterende","tekst":"Hebreeuws, de glinster, blik, of glans, te weten, van het zwaard, dat is: de blinkende punt van het zwaard. Alzo wordt het Hebreeuwse woord genomen Deu 32:41 ; Eze 21:10 , Eze 21:15 ; Nah 3:3 ; Hab 3:11 ."},{"catchword":"zijn gal","tekst":"Versta, het binnenste zijns lichaams; waarmee betekent wordt een dodelijke plaag, dat is, des bozen ondergang."}],"26":[{"catchword":"duisternis","tekst":"Dat is, tegenspoed en rampzaligheid, die hem God vanwege zijn boosheid laat overkomen; zie Gen 15:12 . Sommigen verstaan dat zijn schuilplaatsen, waar hij zich in het donker meende te verbergen, licht zullen zijn."},{"catchword":"zijn schuilplaatsen;","tekst":"Versta, de schuilhoeken en heimelijke middelen, die de bozen pogen uit te vinden om Gods oordelen te ontgaan. De zin is, dat het zo verre is van daarin enige hulp te zullen vinden, dat daarin ook anders niets voor hen weggelegd is dan tegenspoed en ellende. Andere verstaan de opgesloten rijkdommen der bozen, van welke hij niets goeds genieten maar allerlei verdriet krijgen zou. Zie van het Hebreeuwse woord Psa 17:14 ."},{"catchword":"een vuur,","tekst":"Versta, den toorn en de wraak Gods, welke bij een vuur vergeleken wordt. Zie Deu 32:22 met de aantekening; idem Isa 26:11 ; Jer 15:14 ; Lam 2:3 ."},{"catchword":"niet opgeblazen is,","tekst":"Dat is, niet aangestoken door enig mens, maar voortkomende van Gods rechtvaardig oordeel. Het schijnt dat hij ziet op hetgeen staat boven, Job 1:16 . Men kan dit ook verstaan in het algemeen van de oordelen Gods en het helse vuur. Vergelijk Isa 30:33 ."},{"catchword":"den overigen","tekst":"Versta, zijn huisgenoten en nakomelingen, die zijn boosheid navolgen."}],"27":[{"catchword":"De hemel","tekst":"De zin is, dat alle schepselen, hemelse en aardse, geestelijke en lichamelijke, levende en levenloze, Gode ten dienst zullen staan, om zijn rechtvaardige oordelen tegen de goddelozen uit te voeren."}],"28":[{"catchword":"weggevoerd","tekst":"Dat is, wegraken, versmelten en vergaan."},{"catchword":"het zal","tekst":"Hebreeuws, wegvloeiende, of uitgestort, in het getal van velen."},{"catchword":"dag Zijns toorns","tekst":"Versta den dag des toorns Gods, dat is den gezetten tijd, in welken God zijn gramschap bewijzen zou door zijn rechtvaardige straffen uit te zenden. Vergelijk onder, Job 24:1 ; Pro 6:34 en Pro 11:4 ; Isa 13:13 ; Lam 2:21 ; Eze 22:24 ; Zep 1:15 ; Rom 2:5 ."}],"29":[{"catchword":"deel","tekst":"Dat is het loon of de straf, den bozen van God naar zijn rechtvaardig oordeel toebescheiden. Alzo onder Job 27:13 , en Job 31:2 ; Psa 50:18 ; Isa 17:14 en Isa 57:6 ."},{"catchword":"erve","tekst":"Versta hetzelfde dat recht tevoren een deel genaamd is. Alzo onder, Job 27:13 en Job 31:2 ."},{"catchword":"zijner","tekst":"Dat is, van de lasterlijke redenen, die de goddelozen tegen God uitgieten. Anders, zijner uitspraak, van God; dat is van het rechtvaardig vonnis, hetwelk God voorgenomen heeft tegen de goddelozen uit te voeren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then answered Zophar the Naamathite, and said."}],"2":[{"catchword":null,"tekst":"Therefore [i.e. by reason of that which Job had pronounced just now, above 19.19. threatening his friends with the judgement of God, because of their perverse judgement and evil speaking against him.] do my thoughts [see of this word, above chap.4.on verse 13.] answer me; [Oth. Return, viz. To answer Job: for he had done it once already, above chap.11.] and for this is my hastening in me. [Other, for my sake, in my behalf, viz. To maintain my credit and reputation.]"}],"3":[{"catchword":null,"tekst":"I have heard a reproof which putteth me to shame: [Heb. A reproof, or, correction of my shame, i.e. which is accompanied with my shame and discredit; in regard that Job doth charge us therein of ignorance and indiscretion. Shame, or reproached or ashamed. 1 Sam.13.13. and above chap.19.5.] but the spirit [understand the holy spirit, from whom true knowledge and utterance proceedeth, Num 11:29. 1 Cor.12.11. or understand the soul of man, which is not onely endued with a reasonable understanding, but likewise illuminated with supernatural knowledge by Regeneration.] shall answer for me out of mine understanding. [i.e. in a well-ordered and composed manner, without any distemper of mind, or foolish passion; or above my understanding.]"}],"4":[{"catchword":null,"tekst":"Knowest thou this? From over, from that (God) hath set man upon earth, [Comp.ab.ch.3.on v.20. and below here v.23. & 25. Where the word God is likewise inserted.]"}],"5":[{"catchword":null,"tekst":"That the shouting of the wicked [or, the joyous exclamation, i.e. their joy and jollity, chear and merriment, proceeding from their outward prosperity.] hath been from hard-by, [id est, began but very lately; So few Gods, are called, Gods come from hard-by, Deuteronomy 32. Verse 17. i.e. but newly come in, lately set up. Compare above 17.12.] and the joy of the hypocrite for a moment."}],"6":[{"catchword":null,"tekst":"If his height did climb up to the heaven; [i.e. were never so excellent. See Gen.11.on v.4.] And his head reached to the clouds."}],"7":[{"catchword":null,"tekst":"He shall perish for ever like his dung: [Compare 1 Kings 14.10.] Those that had seen him, shall say where is he."}],"8":[{"catchword":null,"tekst":"He shall flee away as a dream [i.e. very hastily and deceitfully; for even as the remembrance of a dream doth suddenly pass away, so also commonly one findeth nothing, being awake, of what one dreamt, but delusion, Isa 29:7,8.] That one shall not find him, and he shall be chased away as a vision of the night, [viz. That which doth appear to the fancy of a man is his dream.]"}],"9":[{"catchword":null,"tekst":"The eyes that saw him, shall do it no more: [Heb. Shall not add, i.e. shall see him no more. Compare Gen.8.on v.10.] And his place shall no more behold him, [i.e. he shall not be seen nor found any more in his place. See above chap.7.on v.10.]"}],"10":[{"catchword":null,"tekst":"His children shall seek to please the poor; [as who should yet be poorer then the common sort of poor, or, because they should stand in fear of the poor, which were oppressed by their fathers, least they should call them to account now, before the judgement seat.] And his hands shall be forced to turn his substance out again. [i.e. the goods and means which he extorted from the poor by violence.]"}],"11":[{"catchword":null,"tekst":"His bones shall be full of his hidden (sins): [Compare, Psal.90.8. and the annot. // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';

  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

    toast.classList.add('zichtbaar');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
